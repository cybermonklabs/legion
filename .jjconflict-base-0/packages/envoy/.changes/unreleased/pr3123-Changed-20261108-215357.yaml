kind: Changed
body: |-
  An operator may name one Kubernetes ServiceAccount in both `BROKER_SERVICES` and
  `BROKER_SERVICE_LOGINS`, and the broker starts: that pair is a pod of the service's own
  account logging the service in with its own projected token and enrolling itself
  (`agent-secrets enroll --pod`). `BROKER_SERVICE_LOGINS` refused such an account before,
  because every pod of it holds a token for it. What holds the narrowing is the enrolment rule
  rather than the setting: such a login enrols the one pod whose token made it, any other pod
  UID is `403 POD_SELF_ENROLL_ONLY`, and that enrolment states no session name, `403
  POD_SELF_ENROLL_NO_SESSION`, since the pods of one account enrol under one principal, so a
  name such a pod picked would be a sibling pod's and the enrolment would take that sibling's
  grants and pending requests off it while it runs. `agent-secrets enroll --pod` sends none.
  Ending an enrollment reads the same pair, so a pod of the
  account ends its own enrollment and no other pod's of that account, including on the schema
  this release ships, where the two pods share one credential row and the enrolling-credential
  test alone would have let the pod that took it over end the other's. A launcher that enrols
  pods of another account is unchanged: a replaced pod still ends the enrollments its
  predecessor made.

  Beside it, `POST /v1/oauth/exchange/pod-sessions` now refuses a pod token naming the account
  the caller logs in as and the very pod the caller's own token names, `403
  POD_CALLER_IS_THE_POD`. A registrar records which pod may exchange under which session name,
  and a pod of a listed account that wrote its own row would pick the name it writes under,
  which is the one choice that row takes from it. A registrar whose own token names no pod, and
  one registering any pod but the one it runs in, are unchanged.
