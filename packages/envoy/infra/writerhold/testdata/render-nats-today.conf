# nats.conf as the nats chart 2.15.1 renders it for the clustered hub today, before the callout
# cutover and t-13 (helm template of ~/.cache/helm/repository/nats-2.15.1.tgz with
# gcp.clusteredHubChartValues' values and no callout): three routes and no route authorization,
# the reading of §3a "Readings of the live hubs" (02:45Z, 2026-11-17).
{
  include auth.conf;
  "cluster": {
    "name": "envoy-nats",
    "no_advertise": true,
    "port": 6222,
    "routes": [
      "nats://envoy-nats-0.envoy-nats-headless:6222",
      "nats://envoy-nats-1.envoy-nats-headless:6222",
      "nats://envoy-nats-2.envoy-nats-headless:6222"
    ]
  },
  "http_port": 8222,
  "jetstream": {
    "max_file_store": 9Gi,
    "max_memory_store": 0,
    "store_dir": "/data"
  },
  "lame_duck_duration": "30s",
  "lame_duck_grace_period": "10s",
  "pid_file": "/var/run/nats/nats.pid",
  "port": 4222,
  "server_name": $SERVER_NAME
}
