# The render TestHoldTheConfigurationBinding runs on one test server: render-nats.conf with two
# lines a lone in-process server cannot start with taken out, and nothing else changed. The
# cluster block goes, because JetStream on a server with a cluster port and no route refuses to
# start ("JetStream cluster requires configured routes or solicited leafnode for the system
# account", nats-server v2.15.1 server/jetstream_cluster.go:1318-1319), and with it the two
# secret-backed variables; pid_file goes, because /var/run/nats does not exist here and the
# server stops at start when it cannot write its pid (server/server.go:2402-2404). It keeps what
# the digest depends on:
# the include of auth.conf, the $SERVER_NAME variable the pod's env resolves, the chart's JSON
# form and its units. testnats' rig replaces the host, the ports and the store directory after the
# parse (internal/testnats/nats.go serverOptions), which the digest does not see.
{
  include auth.conf;
  "http_port": 8222,
  "jetstream": {
    "max_file_store": 9Gi,
    "max_memory_store": 0,
    "store_dir": "/data"
  },
  "lame_duck_duration": "30s",
  "lame_duck_grace_period": "10s",
  "port": 4222,
  "server_name": $SERVER_NAME
}
