# nats.conf as the nats chart 2.15.1 renders it into ConfigMap envoy/envoy-nats-config for the
# clustered hub (helm template of ~/.cache/helm/repository/nats-2.15.1.tgz with
# gcp.clusteredHubChartValues' values, the callout's cluster ping merge included), with t-13's
# route authorization merged into config.cluster: the route URLs and password as variables the
# pods take from a secretKeyRef on Secret envoy-nats-route (plan v62, t-13 part 1).
{
  include auth.conf;
  "cluster": {
    "authorization": {
      "password": $NATS_ROUTE_PASSWORD,
      "user": "route"
    },
    "name": "envoy-nats",
    "no_advertise": true,
    "ping_interval": "30s",
    "ping_max": 2,
    "port": 6222,
    "routes": $NATS_ROUTE_URLS
  },
  "http_port": 8222,
  "jetstream": {
    "max_file_store": 9Gi,
    "max_memory_store": 0,
    "store_dir": "/data"
  },
  "lame_duck_duration": "30s",
  "lame_duck_grace_period": "10s",
  "pid_file": "/var/run/nats/nats.pid",
  "port": 4222,
  "server_name": $SERVER_NAME
}
