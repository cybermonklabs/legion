---
type: component
id: dispatch
name: Dispatch
kind: component
purpose:
  - It keeps the issues, the documents and the results of each project.
---
type: component
id: legion
name: Legion
kind: component
purpose:
  - It runs the agents that work on the issues of a project.
---
type: component
id: legion-to-dispatch
name: Legion to Dispatch
kind: interface
joins:
  - dispatch
  - legion
purpose:
  - Legion reads issues and writes results through it.
---
type: requirement
id: legion-reads-issues-only-through-dispatch
kind: structure
parent: legion-keeps-each-claim-in-dispatch
about:
  - legion-to-dispatch
text:
  - Legion reads each issue only through the interface to Dispatch.
---
type: check
id: no-issue-read-skips-the-interface
serves: legion-reads-issues-only-through-dispatch
subject: graph
procedure: query
claim: No read of an issue by Legion skips the interface to Dispatch.
procedure_text:
  - The query returns each read of an issue by Legion that does not go through the interface.
  - It must return none.
failing_example:
  - A copy of the graph with one read of an issue that goes around the interface.
---
type: term
id: work-unit
name: work unit
definition:
  - A work unit is work that makes one or more statements true.
