# The eval registry's measurement Job (dispatch://INFRA-2916, T15: k2, k8, k13, k16, and
# dispatch://INFRA-978's k14, T19.9) on the build farm. One pod of three containers that share the
# pod's network and one volume: `server` runs envoy-dispatch and nothing else, held to the size of
# the deployment this judges (SERVER_CPU and SERVER_MEMORY, request equal to limit), `postgres` runs
# a Postgres 18 of its own with pg_stat_statements preloaded and its data on the volume, and
# `driver` serves nothing: it builds the generator, the instrument and envoy-dispatch from the
# checkout, loads the fixture at INFRA's stated rate (or ten times its run rate), and measures the
# first paint (evalbench/job.sh). A supervisor in each of the other two (supervise.sh) runs its
# process on the driver's request, through files in /scratch/control, so the driver restarts the
# server for every cold run and Postgres for the information round; the supervisors end once the
# driver does, since the driver holds their lock for as long as it runs. MODE is head (this commit's
# first paint, 8 times, each after a fresh start of the server, k2, k13, k16, and the Delivery
# timeline's first paint over the history and again over it with INFRA's worst day of deploy
# failures added), base (the base's Delivery page over the same two histories, k8's and k13's
# negative controls) or k14 (this commit over the fixture with the two k14 projects added: k14's
# writes with pages open and the two projects' first paints, run.sh's k14, with the GitHub stand-in
# the driver runs on loopback for the server's App), tab (the Evals tab of dispatch://INFRA-2918,
# T27, in Chromium over the full fixture, job.sh tab: the paint's three cases, each after a restart,
# and the recompute under INFRA-2916's write drive, k4 with TEN_TIMES=0 and k19 with TEN_TIMES=1)
# or k22 (job.sh base over the one-project fixture at the base the checks name, legion/INFRA-978
# 82380570f8, which captures its timeline to /scratch/base-timeline.json, then job.sh head over
# the same fixture, which compares this commit's pages with that capture). BASE is the base: main
# at the commit COMMIT merges, `git merge-base <COMMIT> origin/main`, which base mode builds and
# loads.
#
# The log of the `driver` container is the evidence: judge it by its RESULT and FAIL lines and its
# closing SHAPE and VERDICT lines, never by the Job's phase. The SHAPE line (job.sh's header says
# what it holds) names the node, the machine's CPUs, CPU model and memory, each container's
# requests and limits as the API server gave them and the limits the kernel holds the server's
# container to, and reads gating when the pod runs on the class GATING_CLASS names, the server's
# requests are its limits and the kernel holds it to them, and the machine's CPUs beside the pod's
# request are fewer than the server's; record otherwise. The machine type is the node's label
# (node.kubernetes.io/instance-type), which the pod, with no API access, cannot read: read it beside
# the log. The VERDICT line names the scale, the rate and the shape the run had. A run with no FAIL
# line reads pass only at SCALE=1, INFRA's size, in the gating shape; at SCALE=1 in any other shape
# it reads record, and at any other scale smoke, which shows the script and its rules work and
# judges no budget. At TEN_TIMES=1 a database time over a budget stated at the stated rate, and
# k8's base control, print RECORD lines, which no verdict counts, while the first paint's server
# time and body still fail (measure's -ten-times); in mode k14 every bound fails at both rates,
# R14's, so a k14 run prints no RECORD line. A k14 verdict is k14's evidence only with its RESULT
# lines' counts: three writes measured whole at least and both projects' first paints
# (k14-writes, k14-paints), which the run fails without. The container exits 0 once
# it has printed that verdict, FAIL lines or not, so a failed check never runs the hour-long
# measurement again; only a pod that ends before its verdict (a lost machine, an eviction, a failed
# clone) is retried.
#
# The deployment that runs this Job chooses where it runs and how large it is: this public file
# names no compute class, runtime class or machine size. Render it with render-job.py, which fills
# the placeholders below from the environment, refuses when a required one is unset, and drops the
# line of an optional one that is unset:
#   COMMIT BASE MODE SCALE TEN_TIMES   the commit, its base, head, base, k14, tab or k22, INFRA's
#                          scale (1) and whether the rate is ten times (0 or 1)
#   JOB_NAME OWNER BRANCH  the Job's name prefix, its owner label and the branch it measures, which
#                          the run supplies, so this file names no issue, session or deployment
#   PAINT_RUNS             (optional) how many times each first paint is measured
#                          (EVALBENCH_PAINT_RUNS); unset, the head's 8 times, k14's 2 a project
#                          and the rest once; at least 2 in mode k14, whose two reads of each project
#                          are each the first after a restart once, so the render refuses 1
#   CATCHUP                (optional) how long the consumers' catch-up may take (EVALBENCH_CATCHUP);
#                          unset, 1h, and 150m in mode k14
#   OMP_SESSION OMP_SESSION_TITLE      the session that runs it, as the farm's policy reads it
#   LABEL_DOMAIN           the build farm's label domain, under which its policy reads a Job's
#                          session, cost, branch, head and CPU class
#   COST_USD               the cost annotation: the hours below at the machine's hourly price
#   COMPUTE_CLASS          the compute class the pod runs on
#   RUNTIME_CLASS          (optional) the pod's runtime class; leave it unset for a class that
#                          runs natively, which a runtime class would be refused on
#   GATING_CLASS           (optional) the compute class a run is judged on; a run on any other class
#                          is a record, and with it unset no run is judged
#   SERVER_CPU SERVER_MEMORY           the server container's request and limit, such as 9 and 21Gi
#   PG_CPU PG_MEMORY       Postgres's request and limit; a database's share is not a served one's,
#                          and the run prints it
#   POD_CPU                the whole pod's CPU request: the driver gets what the server and Postgres
#                          leave, and a pod that asks for the machine's CPUs keeps other pods off it
#   DRIVER_MEMORY SCRATCH  the driver's memory and the size of the volume the run writes
# One attempt takes at most two hours (the pod's deadline), four in mode k14, whose load holds two
# more projects at INFRA's size and whose catch-up is the longer for them, and three in modes tab
# and k22; the render writes the deadlines from the mode, the Job's being three attempts', and the
# CPU-hours and GiB-hours of the cost annotations from the sizes at one attempt's length. The tab's
# web build and Chromium run in the driver, whose memory and volume a tab run sizes for them.
# Example:
#   export COMMIT=<pushed sha> BASE=$(git merge-base <pushed sha> origin/main) MODE=k14 SCALE=1 TEN_TIMES=0 JOB_NAME=<prefix> OWNER=<owner> BRANCH=<branch>
#   export OMP_SESSION=<id> OMP_SESSION_TITLE=<title> LABEL_DOMAIN=<domain>
#   export COMPUTE_CLASS=<class> GATING_CLASS=<class> SERVER_CPU=<n> SERVER_MEMORY=<n>Gi PG_CPU=<n> PG_MEMORY=<n>Gi POD_CPU=<n> DRIVER_MEMORY=<n>Gi SCRATCH=<n>Gi COST_USD=<price>
#   python3 render-job.py < job.yaml > "$TMPDIR/job.yaml"
#   kubectl -n builds create --dry-run=server -f "$TMPDIR/job.yaml" && kubectl -n builds create -f "$TMPDIR/job.yaml"
apiVersion: batch/v1
kind: Job
metadata:
  generateName: ${JOB_NAME}-
  namespace: builds
  labels:
    owner: ${OWNER}
    ${LABEL_DOMAIN}/omp-session: &omp-session "${OMP_SESSION}"
  annotations:
    ${LABEL_DOMAIN}/omp-session-title: &omp-session-title "${OMP_SESSION_TITLE}"
    # The requests for one attempt's length at most (ATTEMPT_SECONDS): the pod's CPUs and the
    # three containers' memory, each times that length.
    ${LABEL_DOMAIN}/cost-usd: "${COST_USD}"
    ${LABEL_DOMAIN}/expected-cpu-hours: "${CPU_HOURS}"
    ${LABEL_DOMAIN}/expected-memory-gib-hours: "${MEMORY_GIB_HOURS}"
    ${LABEL_DOMAIN}/branch: "${BRANCH}"
    ${LABEL_DOMAIN}/head: "${COMMIT}"
spec:
  # A pod that ends before its verdict runs the measurement again from the start: it keeps nothing
  # between pods. The Job's deadline counts across every pod, the wait for a machine included, and
  # ends the Job whatever backoffLimit allows, so it is the pod's own once per attempt:
  # (backoffLimit + 1) x ATTEMPT_SECONDS.
  backoffLimit: 2
  podReplacementPolicy: Failed
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: ${JOB_DEADLINE_SECONDS}
  template:
    metadata:
      labels:
        ${LABEL_DOMAIN}/kind: legion-evalbench
        ${LABEL_DOMAIN}/omp-session: *omp-session
        # A timed run keeps its CPU request equal to its limit, in every container.
        ${LABEL_DOMAIN}/cpu-qos: "guaranteed"
      annotations:
        ${LABEL_DOMAIN}/omp-session-title: *omp-session-title
        kubectl.kubernetes.io/default-container: driver
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      runtimeClassName: ${RUNTIME_CLASS}
      activeDeadlineSeconds: ${ATTEMPT_SECONDS}
      terminationGracePeriodSeconds: 30
      nodeSelector:
        cloud.google.com/compute-class: ${COMPUTE_CLASS}
      volumes:
      # Everything the run writes: the clone (and the base worktree), the Go and Bun caches, the
      # builds, the web app and Chromium, the Postgres data with its WAL (the fixture is about 4 GB of
      # tables and indexes at the stated rate, more at ten times the run rate), the logs and the
      # supervisors' control files.
      - name: scratch
        emptyDir: {sizeLimit: ${SCRATCH}}
      # What the API server says each container's requests and limits are, in millicores and MiB,
      # for the driver's SHAPE line.
      - name: podinfo
        downwardAPI:
          items:
          - {path: server.requests.cpu, resourceFieldRef: {containerName: server, resource: requests.cpu, divisor: 1m}}
          - {path: server.limits.cpu, resourceFieldRef: {containerName: server, resource: limits.cpu, divisor: 1m}}
          - {path: server.requests.memory, resourceFieldRef: {containerName: server, resource: requests.memory, divisor: 1Mi}}
          - {path: server.limits.memory, resourceFieldRef: {containerName: server, resource: limits.memory, divisor: 1Mi}}
          - {path: postgres.requests.cpu, resourceFieldRef: {containerName: postgres, resource: requests.cpu, divisor: 1m}}
          - {path: postgres.limits.cpu, resourceFieldRef: {containerName: postgres, resource: limits.cpu, divisor: 1m}}
          - {path: postgres.requests.memory, resourceFieldRef: {containerName: postgres, resource: requests.memory, divisor: 1Mi}}
          - {path: postgres.limits.memory, resourceFieldRef: {containerName: postgres, resource: limits.memory, divisor: 1Mi}}
          - {path: driver.requests.cpu, resourceFieldRef: {containerName: driver, resource: requests.cpu, divisor: 1m}}
          - {path: driver.limits.cpu, resourceFieldRef: {containerName: driver, resource: limits.cpu, divisor: 1m}}
          - {path: driver.requests.memory, resourceFieldRef: {containerName: driver, resource: requests.memory, divisor: 1Mi}}
          - {path: driver.limits.memory, resourceFieldRef: {containerName: driver, resource: limits.memory, divisor: 1Mi}}
      initContainers:
      # The checkout, once, before any container of the run starts: the supervisors run from it.
      - name: checkout
        # The worker image of main at 12ba4e6afa71 (release 20.8.0), the multi-architecture index digest.
        image: &image ghcr.io/cybermonklabs/legion-worker@sha256:edba670bc12c2e22fc510a4f50446b670899cb967d3e25c80fd1cc18bf1c825e
        env:
        - {name: HOME, value: /scratch/home}
        - {name: COMMIT, value: "${COMMIT}"}
        - {name: MODE, value: "${MODE}"}
        - {name: BASE, value: "${BASE}"}
        - {name: ONE_PROJECT_BASE, value: &one-project-base "82380570f8dcebb7281fc54d7350c6794886dc98"}
        volumeMounts:
        - {name: scratch, mountPath: /scratch}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          mkdir -p "$HOME"
          git clone --filter=blob:none --no-checkout https://github.com/cybermonklabs/legion /scratch/src
          cd /scratch/src
          git fetch --depth 1 origin "$COMMIT"
          git checkout --detach "$COMMIT"
          case "$MODE" in
            base) git fetch --depth 1 origin "$BASE" ;;
            k22) git fetch --depth 1 origin "$ONE_PROJECT_BASE" ;;
          esac
          echo "MARK checkout $(git rev-parse HEAD)"
        resources:
          requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 2Gi}
          limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 2Gi}
      containers:
      # The server, at the size of the deployment this judges, and nothing else in it.
      - name: server
        image: *image
        command: ["/bin/bash", "/scratch/src/packages/envoy/internal/dispatch/evals/evalbench/supervise.sh"]
        args: ["serve", "/scratch/control/server"]
        env:
        - {name: HOME, value: /scratch/home}
        volumeMounts:
        - {name: scratch, mountPath: /scratch}
        resources:
          requests: {cpu: "${SERVER_CPU}", memory: ${SERVER_MEMORY}, ephemeral-storage: 8Gi}
          limits: {cpu: "${SERVER_CPU}", memory: ${SERVER_MEMORY}, ephemeral-storage: 8Gi}
      - name: postgres
        image: *image
        command: ["/bin/bash", "/scratch/src/packages/envoy/internal/dispatch/evals/evalbench/supervise.sh"]
        args: ["serve", "/scratch/control/postgres"]
        env:
        - {name: HOME, value: /scratch/home}
        volumeMounts:
        - {name: scratch, mountPath: /scratch}
        resources:
          requests: {cpu: "${PG_CPU}", memory: ${PG_MEMORY}, ephemeral-storage: 2Gi}
          limits: {cpu: "${PG_CPU}", memory: ${PG_MEMORY}, ephemeral-storage: 2Gi}
      - name: driver
        image: *image
        env:
        - {name: HOME, value: /scratch/home}
        - {name: TMPDIR, value: /scratch/tmp}
        - {name: GOCACHE, value: /scratch/gocache}
        - {name: GOMODCACHE, value: /scratch/gomod}
        - {name: BUN_INSTALL_CACHE_DIR, value: /scratch/bun-cache}
        - {name: COMMIT, value: "${COMMIT}"}
        - {name: MODE, value: "${MODE}"}
        - {name: BASE, value: "${BASE}"}
        - {name: ONE_PROJECT_BASE, value: *one-project-base}
        - {name: EVALBENCH_SCALE, value: "${SCALE}"}
        - {name: EVALBENCH_TEN_TIMES, value: "${TEN_TIMES}"}
        - {name: EVALBENCH_PAINT_RUNS, value: "${PAINT_RUNS}"}
        - {name: EVALBENCH_CATCHUP, value: "${CATCHUP}"}
        - {name: EVALBENCH_NODE, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
        - {name: EVALBENCH_COMPUTE_CLASS, value: "${COMPUTE_CLASS}"}
        - {name: EVALBENCH_GATING_CLASS, value: "${GATING_CLASS}"}
        - {name: EVALBENCH_RUNTIME_CLASS, value: "${RUNTIME_CLASS}"}
        - {name: EVALBENCH_CONTROL, value: /scratch/control}
        - {name: EVALBENCH_PODINFO, value: /podinfo}
        volumeMounts:
        - {name: scratch, mountPath: /scratch}
        - {name: podinfo, mountPath: /podinfo}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          mkdir -p "$HOME" "$TMPDIR" "$GOCACHE" "$GOMODCACHE" "$BUN_INSTALL_CACHE_DIR" "$EVALBENCH_CONTROL"
          # The supervisors' lock, held until this script exits, however it exits (supervise.sh).
          exec 9>"$EVALBENCH_CONTROL/driver.lock.new"
          flock 9
          mv "$EVALBENCH_CONTROL/driver.lock.new" "$EVALBENCH_CONTROL/driver.lock"
          # One history's end for every load of the run, k22's two among them.
          export EVALBENCH_NOW=$(date -u +%Y-%m-%dT00:00:00Z)
          echo "MARK start $(date -u +%FT%TZ) commit=$COMMIT base=$BASE mode=$MODE scale=$EVALBENCH_SCALE ten_times=$EVALBENCH_TEN_TIMES now=$EVALBENCH_NOW compute_class=$EVALBENCH_COMPUTE_CLASS"
          rc=0
          bench=/scratch/src/packages/envoy/internal/dispatch/evals/evalbench
          if [ "$MODE" = k22 ]; then
            # k22's two halves: the base's capture over the one-project fixture, then this head's
            # pages over the same fixture compared with it, each in a work directory of its own.
            {
              EVALBENCH_WORK=/scratch/work-base EVALBENCH_SOURCE=/scratch/src EVALBENCH_COMMIT="$COMMIT" EVALBENCH_BASE="$ONE_PROJECT_BASE" \
                EVALBENCH_ONE_PROJECT=1 EVALBENCH_BASE_TIMELINE=/scratch/base-timeline.json bash "$bench/job.sh" base &&
              EVALBENCH_WORK=/scratch/work-head EVALBENCH_SOURCE=/scratch/src EVALBENCH_COMMIT="$COMMIT" \
                EVALBENCH_ONE_PROJECT=1 EVALBENCH_BASE_TIMELINE=/scratch/base-timeline.json bash "$bench/job.sh" head
            } 2>&1 | tee /scratch/out.txt || rc=${PIPESTATUS[0]}
          else
            EVALBENCH_WORK=/scratch/work EVALBENCH_SOURCE=/scratch/src EVALBENCH_COMMIT="$COMMIT" EVALBENCH_BASE="$BASE" \
              bash "$bench/job.sh" "$MODE" 2>&1 | tee /scratch/out.txt || rc=${PIPESTATUS[0]}
          fi
          echo "MARK failures:"; grep '^FAIL' /scratch/out.txt || echo "MARK none"
          echo "MARK records: $(grep -c '^RECORD' /scratch/out.txt || true)"
          echo "MARK end $(date -u +%FT%TZ) rc=$rc"
          # The verdict: a pass is job.sh exiting 0 with no FAIL line, at SCALE=1, INFRA's size, the
          # size k8 and k16 judge their budgets at, in the gating shape (job.sh's last SHAPE line,
          # printed again here beside it); at SCALE=1 in another shape it is a record, and at any
          # other scale a smoke run, which judges no budget. The run is over once it is printed, so
          # the container exits 0 and the Job retries no failed check.
          failures=$(grep -c '^FAIL' /scratch/out.txt || true)
          shape_line=$(grep '^SHAPE ' /scratch/out.txt | tail -n 1 || true)
          shape=$(printf '%s\n' "$shape_line" | sed -n 's/^SHAPE \([a-z]*\).*/\1/p')
          if [ "$rc" -ne 0 ] || [ "$failures" -ne 0 ]; then verdict=fail
          elif [ "$EVALBENCH_SCALE" != 1 ]; then verdict=smoke
          elif [ "$shape" = gating ]; then verdict=pass
          else verdict=record; fi
          echo "${shape_line:-SHAPE none: job.sh printed no SHAPE line}"
          echo "VERDICT $verdict mode=$MODE rc=$rc fail_lines=$failures scale=$EVALBENCH_SCALE ten_times=$EVALBENCH_TEN_TIMES shape=${shape:-none} compute_class=$EVALBENCH_COMPUTE_CLASS node=$EVALBENCH_NODE"
          exit 0
        resources:
          requests: {cpu: "${DRIVER_CPU}", memory: ${DRIVER_MEMORY}, ephemeral-storage: ${SCRATCH}}
          limits: {cpu: "${DRIVER_CPU}", memory: ${DRIVER_MEMORY}, ephemeral-storage: ${SCRATCH}}
