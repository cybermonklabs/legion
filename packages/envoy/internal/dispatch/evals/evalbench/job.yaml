# The eval registry's measurement Job (dispatch://INFRA-2916, T15: k2, k8, k13, k16) on the build
# farm: it clones the pushed commit, and evalbench/job.sh starts a Postgres 18 of its own with
# pg_stat_statements preloaded and its data on the Job's volume, builds the generator, the
# instrument and envoy-dispatch, loads the fixture at INFRA's stated rate and measures the first
# paint. MODE is head (this commit's first paint, 8 times, each after a fresh start of the server,
# k2, k13, k16, and the Delivery timeline's first paint over the history and again over it with
# INFRA's worst day of deploy failures added) or base (the first paint of the base, k8's and k13's
# negative controls). BASE is the base: main at the commit COMMIT merges, `git merge-base <COMMIT>
# origin/main`, which base mode builds and loads. The log is the evidence:
# judge it by its RESULT and FAIL lines and its closing VERDICT line, never by the Job's phase.
# The VERDICT line names the scale and the rate the run had, and a run with no FAIL line reads
# pass only at SCALE=1, INFRA's size, which k8 and k16 are judged at; at any other scale it reads
# smoke, which shows the script and its rules work and judges no budget. The node the pod ran on is
# printed too (EVALBENCH_NODE, from the pod's spec.nodeName). The container exits 0 once it has
# printed that verdict, FAIL lines or not, so a failed check never runs the hour-long measurement
# again; only a pod that ends before its verdict (a lost machine, an eviction, a failed clone) is
# retried. Fill the eight ${…} variables (and only those,
# so the script's own $HOME, $COMMIT and $BASE are left for the shell). LABEL_DOMAIN is the build
# farm's label domain, the deployment's own, under which its policy reads a Job's session, cost,
# branch and head; this public file names no domain, so the render refuses when it is unset, as
# it refuses any of the eight unset:
#   export COMMIT=<pushed sha> BASE=$(git merge-base <pushed sha> origin/main) MODE=head SCALE=1 TEN_TIMES=0 OMP_SESSION=<id> OMP_SESSION_TITLE=<title> LABEL_DOMAIN=<domain>
#   python3 -c 'import os, re, sys; names = ("COMMIT", "BASE", "MODE", "SCALE", "TEN_TIMES", "OMP_SESSION", "OMP_SESSION_TITLE", "LABEL_DOMAIN"); missing = [n for n in names if not os.environ.get(n)]; missing and sys.exit("job.yaml: set " + ", ".join(missing)); sys.stdout.write(re.sub(r"\$\{(" + "|".join(names) + r")\}", lambda m: os.environ[m[1]], sys.stdin.read()))' \
#     < job.yaml > "$TMPDIR/job.yaml"
#   kubectl -n builds create --dry-run=server -f "$TMPDIR/job.yaml" && kubectl -n builds create -f "$TMPDIR/job.yaml"
apiVersion: batch/v1
kind: Job
metadata:
  generateName: infra2916-evalbench-
  namespace: builds
  labels:
    owner: legion-infra-2916-implementer
    ${LABEL_DOMAIN}/omp-session: &omp-session "${OMP_SESSION}"
  annotations:
    ${LABEL_DOMAIN}/omp-session-title: &omp-session-title "${OMP_SESSION_TITLE}"
    # One attempt takes at most about an hour at the stated rate: eight runs of the head mode's
    # first paint, each with its own catch-up wait, checks and information round, took 55 minutes
    # end to end on the build farm, and this Job makes each of those once. The figures are its
    # requests for that hour: 8 CPUs x 1 h = 8 CPU-hours and 24 GiB x 1 h = 24 GiB-hours. The cost
    # is that hour on up to a dozen CPUs of a Spot build machine.
    ${LABEL_DOMAIN}/cost-usd: "2.00"
    ${LABEL_DOMAIN}/expected-cpu-hours: "8"
    ${LABEL_DOMAIN}/expected-memory-gib-hours: "24"
    ${LABEL_DOMAIN}/branch: "legion/INFRA-2916"
    ${LABEL_DOMAIN}/head: "${COMMIT}"
spec:
  # A pod that ends before its verdict runs the measurement again from the start: it keeps nothing
  # between pods. The Job's deadline counts across every pod and ends the Job whatever
  # backoffLimit allows, so it is the pod's own once per attempt: (backoffLimit + 1) x 7200 s.
  backoffLimit: 2
  podReplacementPolicy: Failed
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        ${LABEL_DOMAIN}/kind: legion-evalbench
        ${LABEL_DOMAIN}/omp-session: *omp-session
      annotations:
        ${LABEL_DOMAIN}/omp-session-title: *omp-session-title
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      activeDeadlineSeconds: 7200
      terminationGracePeriodSeconds: 30
      nodeSelector:
        cloud.google.com/compute-class: build
      volumes:
      # Everything the run writes: the clone (and the base worktree), the Go caches, the builds,
      # the Postgres data with its WAL (the fixture is about 4 GB of tables and indexes at the
      # stated rate, more at ten times the run rate) and the logs.
      - name: scratch
        emptyDir: {sizeLimit: 46Gi}
      containers:
      - name: evalbench
        # The worker image of main at 12ba4e6afa71 (release 20.8.0), the multi-architecture index digest.
        image: ghcr.io/cybermonklabs/legion-worker@sha256:edba670bc12c2e22fc510a4f50446b670899cb967d3e25c80fd1cc18bf1c825e
        env:
        - {name: HOME, value: /scratch/home}
        - {name: TMPDIR, value: /scratch/tmp}
        - {name: GOCACHE, value: /scratch/gocache}
        - {name: GOMODCACHE, value: /scratch/gomod}
        - {name: COMMIT, value: "${COMMIT}"}
        - {name: MODE, value: "${MODE}"}
        - {name: BASE, value: "${BASE}"}
        - {name: EVALBENCH_SCALE, value: "${SCALE}"}
        - {name: EVALBENCH_TEN_TIMES, value: "${TEN_TIMES}"}
        - {name: EVALBENCH_NODE, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
        volumeMounts:
        - {name: scratch, mountPath: /scratch}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          mkdir -p "$HOME" "$TMPDIR" "$GOCACHE" "$GOMODCACHE"
          echo "MARK start $(date -u +%FT%TZ) commit=$COMMIT base=$BASE mode=$MODE scale=$EVALBENCH_SCALE ten_times=$EVALBENCH_TEN_TIMES"
          git clone --filter=blob:none --no-checkout https://github.com/cybermonklabs/legion /scratch/src
          cd /scratch/src
          git fetch --depth 1 origin "$COMMIT"
          git checkout --detach "$COMMIT"
          if [ "$MODE" = base ]; then git fetch --depth 1 origin "$BASE"; fi
          echo "MARK checkout $(git rev-parse HEAD)"
          rc=0
          EVALBENCH_WORK=/scratch/work EVALBENCH_SOURCE=/scratch/src EVALBENCH_COMMIT="$COMMIT" EVALBENCH_BASE="$BASE" \
            bash packages/envoy/internal/dispatch/evals/evalbench/job.sh "$MODE" 2>&1 | tee /scratch/out.txt || rc=${PIPESTATUS[0]}
          echo "MARK failures:"; grep '^FAIL' /scratch/out.txt || echo "MARK none"
          echo "MARK end $(date -u +%FT%TZ) rc=$rc"
          # The verdict: a pass is job.sh exiting 0 with no FAIL line, at SCALE=1, INFRA's size, the
          # size k8 and k16 judge their budgets at; a run at any other scale with no FAIL line is a
          # smoke run, which judges no budget. The run is over once it is printed, so the container
          # exits 0 and the Job retries no failed check.
          failures=$(grep -c '^FAIL' /scratch/out.txt || true)
          if [ "$rc" -ne 0 ] || [ "$failures" -ne 0 ]; then verdict=fail; elif [ "$EVALBENCH_SCALE" = 1 ]; then verdict=pass; else verdict=smoke; fi
          echo "VERDICT $verdict rc=$rc fail_lines=$failures scale=$EVALBENCH_SCALE ten_times=$EVALBENCH_TEN_TIMES node=$EVALBENCH_NODE"
          exit 0
        resources:
          requests: {cpu: "8", memory: 24Gi, ephemeral-storage: 48Gi}
          limits: {cpu: "12", memory: 24Gi, ephemeral-storage: 48Gi}
