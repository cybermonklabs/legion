# The evalbench measurement Job on the build farm: the eval registry's (dispatch://INFRA-2916, T15:
# k2, k8, k13, k16) and the Evals tab's (dispatch://INFRA-2918, T27: k4, k19, k22). It clones the
# pushed commit, and evalbench/job.sh starts a Postgres 18 of its own with pg_stat_statements
# preloaded and its data on the Job's volume, builds the generator, the instruments and
# envoy-dispatch, loads the fixture and measures. MODE is:
#   head  this commit's first paint, 8 times, each after a fresh start of the server, k2, k13, k16,
#         and the Delivery timeline's first paint over the history and again over it with INFRA's
#         worst day of deploy failures added; with GITHUB_STUB=1 it is k17's too (the history holds
#         the code survival results of INFRA's default repository, no paint reads them or makes a
#         request to GitHub, and each paint holds both code evals);
#   base  the first paint of the base, k8's and k13's negative controls: BASE, main at the commit
#         COMMIT merges, `git merge-base <COMMIT> origin/main`, which base mode builds and loads;
#         with BASE_FLAGS empty and BASE a commit of this branch that holds every table of the eval
#         registry the load checks but not the code evals (its project_delivery_settings with or
#         without code_groups, migration 20261126133047) it is k17's control: the evals list holds
#         neither code eval;
#   tab   the Evals tab in Chromium over the full fixture (job.sh tab): the paint's three cases,
#         each after a restart, and the recompute under INFRA-2916's write drive, k4 with
#         TEN_TIMES=0 and k19 with TEN_TIMES=1;
#   k22   job.sh base over the one-project fixture at the base the checks name (legion/INFRA-978
#         82380570f8), which captures its timeline to /scratch/base-timeline.json, then job.sh head
#         over the same fixture, which compares this commit's pages with that capture.
# The log is the evidence: judge it by its RESULT and FAIL lines and its closing VERDICT line, never
# by the Job's phase. The VERDICT line names the scale and the rate the run had, and a run with no
# FAIL line reads pass only at SCALE=1, INFRA's size, which k8 and k16 are judged at; at any other
# scale it reads smoke, which shows the script and its rules work and judges no budget. The node
# the pod ran on is printed too (EVALBENCH_NODE, from the pod's spec.nodeName). The container exits
# 0 once it has printed that verdict, FAIL lines or not, so a failed check never runs the
# measurement again; only a pod that ends before its verdict (a lost machine, an eviction, a failed
# clone) is retried. Fill every ${…} variable (and only those, so the script's own $HOME, $COMMIT
# and $BASE are left for the shell). LABEL_DOMAIN is the build
# farm's label domain, the deployment's own, under which its policy reads a Job's session, cost,
# branch and head; this public file names no domain, so the render refuses when it is unset, as it
# refuses any variable unset but the three that follow. BASE_FLAGS, GITHUB_STUB and PAINT_RUNS are
# optional: left unset they are -base, 0 and 8, which is how INFRA-2916's runs were made, so those
# runs do not move. BASE_FLAGS is the generator's flags that name the base's schema (job.sh's
# EVALBENCH_BASE_FLAGS), set empty (BASE_FLAGS=) for a base that holds the eval registry; GITHUB_STUB=1
# runs the measurement with the GitHub stand-in of check k17 (run.sh's EVALBENCH_GITHUB_STUB);
# PAINT_RUNS is how many times the head's first paint is measured. The sizes a mode takes, measured
# by INFRA-2916's runs at each rate
# (eight runs of the head mode's first paint, each with its own catch-up wait, checks and
# information round, took 55 minutes end to end on the build farm) and grown for the tab's web
# build and Chromium:
#   head, base, k22: MEMORY=24Gi SCRATCH=46Gi EPHEMERAL=48Gi COST_USD=2.00 CPU_HOURS=10 MEMORY_GIB_HOURS=24
#   tab, TEN_TIMES=0: MEMORY=32Gi SCRATCH=56Gi EPHEMERAL=60Gi COST_USD=3.00 CPU_HOURS=16 MEMORY_GIB_HOURS=64
#   tab, TEN_TIMES=1: MEMORY=56Gi SCRATCH=120Gi EPHEMERAL=128Gi COST_USD=6.00 CPU_HOURS=24 MEMORY_GIB_HOURS=168
#   export COMMIT=<pushed sha> BASE=$(git merge-base <pushed sha> origin/main) BRANCH=<its branch> MODE=tab SCALE=1 TEN_TIMES=0 \
#     MEMORY=… SCRATCH=… EPHEMERAL=… COST_USD=… CPU_HOURS=… MEMORY_GIB_HOURS=… OMP_SESSION=<id> OMP_SESSION_TITLE=<title> LABEL_DOMAIN=<domain>
#   python3 -c 'import os, re, sys; required = ("COMMIT", "BASE", "BRANCH", "MODE", "SCALE", "TEN_TIMES", "MEMORY", "SCRATCH", "EPHEMERAL", "COST_USD", "CPU_HOURS", "MEMORY_GIB_HOURS", "OMP_SESSION", "OMP_SESSION_TITLE", "LABEL_DOMAIN"); optional = {"BASE_FLAGS": "-base", "GITHUB_STUB": "0", "PAINT_RUNS": "8"}; missing = [n for n in required if not os.environ.get(n)]; missing and sys.exit("job.yaml: set " + ", ".join(missing)); sys.stdout.write(re.sub(r"\$\{(" + "|".join(required + tuple(optional)) + r")\}", lambda m: os.environ.get(m[1], optional.get(m[1])), sys.stdin.read()))' \
#     < job.yaml > "$TMPDIR/job.yaml"
#   kubectl -n builds create --dry-run=server -f "$TMPDIR/job.yaml" && kubectl -n builds create -f "$TMPDIR/job.yaml"
apiVersion: batch/v1
kind: Job
metadata:
  generateName: evalbench-${MODE}-
  namespace: builds
  labels:
    owner: legion-evalbench
    ${LABEL_DOMAIN}/omp-session: &omp-session "${OMP_SESSION}"
  annotations:
    ${LABEL_DOMAIN}/omp-session-title: &omp-session-title "${OMP_SESSION_TITLE}"
    ${LABEL_DOMAIN}/cost-usd: "${COST_USD}"
    ${LABEL_DOMAIN}/expected-cpu-hours: "${CPU_HOURS}"
    ${LABEL_DOMAIN}/expected-memory-gib-hours: "${MEMORY_GIB_HOURS}"
    ${LABEL_DOMAIN}/branch: "${BRANCH}"
    ${LABEL_DOMAIN}/head: "${COMMIT}"
spec:
  # A pod that ends before its verdict runs the measurement again from the start: it keeps nothing
  # between pods. The Job's deadline counts across every pod and ends the Job whatever
  # backoffLimit allows, so it is the pod's own once per attempt: (backoffLimit + 1) x 10800 s.
  backoffLimit: 2
  podReplacementPolicy: Failed
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 32400
  template:
    metadata:
      labels:
        ${LABEL_DOMAIN}/kind: legion-evalbench
        ${LABEL_DOMAIN}/omp-session: *omp-session
      annotations:
        ${LABEL_DOMAIN}/omp-session-title: *omp-session-title
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      activeDeadlineSeconds: 10800
      terminationGracePeriodSeconds: 30
      nodeSelector:
        cloud.google.com/compute-class: build
      volumes:
      # Everything the run writes: the clone (and the base worktree), the Go and Bun caches, the
      # builds, the web app and Chromium, the Postgres data with its WAL (the fixture is about 4 GB
      # of tables and indexes at the stated rate, more at ten times the run rate) and the logs.
      - name: scratch
        emptyDir: {sizeLimit: ${SCRATCH}}
      containers:
      - name: evalbench
        # The worker image of main at 12ba4e6afa71 (release 20.8.0), the multi-architecture index digest.
        image: ghcr.io/cybermonklabs/legion-worker@sha256:edba670bc12c2e22fc510a4f50446b670899cb967d3e25c80fd1cc18bf1c825e
        env:
        - {name: HOME, value: /scratch/home}
        - {name: TMPDIR, value: /scratch/tmp}
        - {name: GOCACHE, value: /scratch/gocache}
        - {name: GOMODCACHE, value: /scratch/gomod}
        - {name: BUN_INSTALL_CACHE_DIR, value: /scratch/bun-cache}
        - {name: COMMIT, value: "${COMMIT}"}
        - {name: MODE, value: "${MODE}"}
        - {name: BASE, value: "${BASE}"}
        - {name: ONE_PROJECT_BASE, value: "82380570f8dcebb7281fc54d7350c6794886dc98"}
        - {name: EVALBENCH_SCALE, value: "${SCALE}"}
        - {name: EVALBENCH_TEN_TIMES, value: "${TEN_TIMES}"}
        - {name: EVALBENCH_NODE, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
        - {name: EVALBENCH_BASE_FLAGS, value: "${BASE_FLAGS}"}
        - {name: EVALBENCH_GITHUB_STUB, value: "${GITHUB_STUB}"}
        - {name: EVALBENCH_PAINT_RUNS, value: "${PAINT_RUNS}"}
        volumeMounts:
        - {name: scratch, mountPath: /scratch}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          mkdir -p "$HOME" "$TMPDIR" "$GOCACHE" "$GOMODCACHE" "$BUN_INSTALL_CACHE_DIR"
          export EVALBENCH_NOW=$(date -u +%Y-%m-%dT00:00:00Z)
          echo "MARK start $(date -u +%FT%TZ) commit=$COMMIT base=$BASE mode=$MODE scale=$EVALBENCH_SCALE ten_times=$EVALBENCH_TEN_TIMES now=$EVALBENCH_NOW node=$EVALBENCH_NODE"
          git clone --filter=blob:none --no-checkout https://github.com/cybermonklabs/legion /scratch/src
          cd /scratch/src
          git fetch --depth 1 origin "$COMMIT"
          git checkout --detach "$COMMIT"
          case "$MODE" in
            base) git fetch --depth 1 origin "$BASE" ;;
            k22) git fetch --depth 1 origin "$ONE_PROJECT_BASE" ;;
          esac
          echo "MARK checkout $(git rev-parse HEAD)"
          bench=packages/envoy/internal/dispatch/evals/evalbench
          rc=0
          if [ "$MODE" = k22 ]; then
            {
              EVALBENCH_WORK=/scratch/work-base EVALBENCH_SOURCE=/scratch/src EVALBENCH_COMMIT="$COMMIT" EVALBENCH_BASE="$ONE_PROJECT_BASE" \
                EVALBENCH_ONE_PROJECT=1 EVALBENCH_BASE_TIMELINE=/scratch/base-timeline.json bash "$bench/job.sh" base &&
              EVALBENCH_WORK=/scratch/work-head EVALBENCH_SOURCE=/scratch/src EVALBENCH_COMMIT="$COMMIT" \
                EVALBENCH_ONE_PROJECT=1 EVALBENCH_BASE_TIMELINE=/scratch/base-timeline.json bash "$bench/job.sh" head
            } 2>&1 | tee /scratch/out.txt || rc=${PIPESTATUS[0]}
          else
            EVALBENCH_WORK=/scratch/work EVALBENCH_SOURCE=/scratch/src EVALBENCH_COMMIT="$COMMIT" EVALBENCH_BASE="$BASE" \
              bash "$bench/job.sh" "$MODE" 2>&1 | tee /scratch/out.txt || rc=${PIPESTATUS[0]}
          fi
          echo "MARK failures:"; grep '^FAIL' /scratch/out.txt || echo "MARK none"
          echo "MARK end $(date -u +%FT%TZ) rc=$rc"
          # The verdict: a pass is job.sh exiting 0 with no FAIL line, at SCALE=1, INFRA's size, the
          # size k8 and k16 judge their budgets at; a run at any other scale with no FAIL line is a
          # smoke run, which judges no budget. The run is over once it is printed, so the container
          # exits 0 and the Job retries no failed check.
          failures=$(grep -c '^FAIL' /scratch/out.txt || true)
          if [ "$rc" -ne 0 ] || [ "$failures" -ne 0 ]; then verdict=fail; elif [ "$EVALBENCH_SCALE" = 1 ]; then verdict=pass; else verdict=smoke; fi
          echo "VERDICT $verdict mode=$MODE rc=$rc fail_lines=$failures scale=$EVALBENCH_SCALE ten_times=$EVALBENCH_TEN_TIMES node=$EVALBENCH_NODE"
          exit 0
        resources:
          requests: {cpu: "8", memory: ${MEMORY}, ephemeral-storage: ${EPHEMERAL}}
          limits: {cpu: "12", memory: ${MEMORY}, ephemeral-storage: ${EPHEMERAL}}
