# R7's Job (dispatch://INFRA-5577, check k27) on the build farm: legionbench/r7.sh, whole, in one
# pod, at HEAD, the commit it checks out: the stated load, one and a half times it, and the sleep
# control, whose drain sleeps 150 ms under the change log's lock and must miss R7's hold bound,
# each beside a first whole read of INFRA's facts (r7.sh says what each arm runs and how the
# control is judged). The code arrives as a git bundle in the build farm's input bucket, so the Job
# needs no GitHub token and no pushed branch: the pod clones the public repository, fetches every
# head the bundle lists into it and checks out HEAD. The bundle holds the commits the public
# repository lacks, under whatever heads it lists (one of a jj workspace's HEAD lists no branch):
#   git bundle create legion.bundle HEAD --not origin/main
#   gcloud storage cp legion.bundle gs://<input bucket>/in/builds/infra-5577/<RUN>/legion.bundle
# The log is the evidence: judge it by its RESULT and FAIL lines and its closing VERDICT line, never
# by the Job's phase. The container exits 0 once it has printed that verdict, FAIL lines or not, so
# a failed check never runs the measurement again; only a pod that ends before its verdict is
# retried. Each run's output goes to gs://<bucket>/out/builds/infra-5577/<RUN>/. Fill the ${…}
# variables (and only those); LABEL_DOMAIN and BUCKET are the deployment's own, which this public
# file names neither of, so the render refuses when one is unset, as it refuses any variable unset:
#   export RUN=<run> HEAD=<commit> SCALE=1 AFTER=5m READ_TIMEOUT=30m ARMS="stated recorded sleep" \
#     OMP_SESSION=<id> OMP_SESSION_TITLE=<title> LABEL_DOMAIN=<domain> BUCKET=<bucket>
#   python3 -c 'import os, re, sys; names = ("RUN", "HEAD", "SCALE", "AFTER", "READ_TIMEOUT", "ARMS", "OMP_SESSION", "OMP_SESSION_TITLE", "LABEL_DOMAIN", "BUCKET"); missing = [n for n in names if not os.environ.get(n)]; missing and sys.exit("r7.yaml: set " + ", ".join(missing)); sys.stdout.write(re.sub(r"\$\{(" + "|".join(names) + r")\}", lambda m: os.environ[m[1]], sys.stdin.read()))' \
#     < r7.yaml > "$TMPDIR/r7.yaml"
#   kubectl -n builds create --dry-run=server -f "$TMPDIR/r7.yaml" && kubectl -n builds create -f "$TMPDIR/r7.yaml"
apiVersion: batch/v1
kind: Job
metadata:
  generateName: infra5577-r7-
  namespace: builds
  labels:
    owner: infra-5577-bench
    ${LABEL_DOMAIN}/omp-session: &omp-session "${OMP_SESSION}"
  annotations:
    ${LABEL_DOMAIN}/omp-session-title: &omp-session-title "${OMP_SESSION_TITLE}"
    # About 2 hours on 8 CPUs and 32 GiB of a Spot build machine: three builds, one load at ten
    # times the run volume, and three arms of a whole read and 5 minutes after it.
    ${LABEL_DOMAIN}/cost-usd: "1.20"
    ${LABEL_DOMAIN}/expected-cpu-hours: "16"
    ${LABEL_DOMAIN}/expected-memory-gib-hours: "64"
    ${LABEL_DOMAIN}/branch: "legion/INFRA-5577"
    ${LABEL_DOMAIN}/head: "${HEAD}"
spec:
  # A pod that ends before its verdict runs the measurement again from the start: it keeps nothing
  # between pods. (backoffLimit + 1) x 14400 s.
  backoffLimit: 1
  podReplacementPolicy: Failed
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 28800
  template:
    metadata:
      labels:
        ${LABEL_DOMAIN}/kind: legion-r7-bench
        ${LABEL_DOMAIN}/omp-session: *omp-session
        # A timed run: the holds and waits are milliseconds of this pod's CPU, which must not be
        # shared, so build-cpu-burst leaves the request at the limit.
        ${LABEL_DOMAIN}/cpu-qos: "guaranteed"
      annotations:
        ${LABEL_DOMAIN}/omp-session-title: *omp-session-title
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      activeDeadlineSeconds: 14400
      terminationGracePeriodSeconds: 30
      nodeSelector:
        cloud.google.com/compute-class: build
      volumes:
      # The clone and its sleep control's worktree, the Go caches, the builds, the Postgres data with
      # its WAL (one database at ten times the run volume) and the logs.
      - name: scratch
        emptyDir: {sizeLimit: 46Gi}
      containers:
      - name: r7
        # The worker image of release 23.16.4, the multi-architecture index digest: Go 1.27.3,
        # PostgreSQL 18, psql, git and gcloud.
        image: ghcr.io/cybermonklabs/legion-worker@sha256:c040f32384bcac221423e42e6848ab6bacd50a9657313fc0bcb401fa6ca0cf21
        env:
        - {name: HOME, value: /scratch/home}
        - {name: TMPDIR, value: /scratch/tmp}
        - {name: GOCACHE, value: /scratch/gocache}
        - {name: GOMODCACHE, value: /scratch/gomod}
        - {name: RUN, value: "${RUN}"}
        - {name: HEAD, value: "${HEAD}"}
        - {name: SCALE, value: "${SCALE}"}
        - {name: AFTER, value: "${AFTER}"}
        - {name: READ_TIMEOUT, value: "${READ_TIMEOUT}"}
        - {name: ARMS, value: "${ARMS}"}
        - {name: BUCKET, value: "${BUCKET}"}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        volumeMounts:
        - {name: scratch, mountPath: /scratch}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          mkdir -p "$HOME" "$TMPDIR" "$GOCACHE" "$GOMODCACHE"
          echo "MARK start $(date -u +%FT%TZ) run=$RUN head=$HEAD scale=$SCALE after=$AFTER read_timeout=$READ_TIMEOUT arms=[$ARMS] node=$NODE_NAME"
          gcloud storage cp "gs://$BUCKET/in/builds/infra-5577/$RUN/legion.bundle" /scratch/legion.bundle
          git clone --filter=blob:none --no-checkout https://github.com/cybermonklabs/legion /scratch/src
          cd /scratch/src
          git bundle verify /scratch/legion.bundle
          git fetch /scratch/legion.bundle $(git bundle list-heads /scratch/legion.bundle | awk '{print "+" $2 ":refs/bundle/" NR}')
          git checkout --detach "$HEAD"
          echo "MARK checkout $(git rev-parse HEAD)"
          rc=0
          R7_WORK=/scratch/work R7_SOURCE=/scratch/src R7_SCALE="$SCALE" R7_AFTER="$AFTER" R7_READ_TIMEOUT="$READ_TIMEOUT" \
            R7_ARMS="$ARMS" bash packages/envoy/internal/dispatch/legion/legionbench/r7.sh 2>&1 | tee /scratch/out.txt || rc=${PIPESTATUS[0]}
          echo "MARK failures:"; grep '^FAIL' /scratch/out.txt || echo "MARK none"
          echo "MARK end $(date -u +%FT%TZ) rc=$rc"
          # The record: the log and the servers' logs.
          tar -C /scratch -czf /scratch/record.tgz out.txt $(cd /scratch && ls work/*.log work/run/*.log 2>/dev/null) || true
          gcloud storage cp /scratch/record.tgz "gs://$BUCKET/out/builds/infra-5577/$RUN/r7-record.tgz" || echo "MARK the record did not reach the bucket"
          # The verdict: a pass is r7.sh exiting 0 with no FAIL line. The run is over once it is
          # printed, so the container exits 0 and the Job retries no failed check.
          failures=$(grep -c '^FAIL' /scratch/out.txt || true)
          if [ "$rc" -eq 0 ] && [ "$failures" -eq 0 ]; then verdict=pass; else verdict=fail; fi
          echo "VERDICT $verdict rc=$rc fail_lines=$failures"
          exit 0
        resources:
          requests: {cpu: "8", memory: 32Gi, ephemeral-storage: 48Gi}
          limits: {cpu: "8", memory: 32Gi, ephemeral-storage: 48Gi}
