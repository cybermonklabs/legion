# Role routes need Dispatch's identity at the Envoy listener, so the Dispatch container refuses to
# start without one, naming both settings: on Google Cloud set ENVOY_ACCOUNT_GOOGLE_AUDIENCE (the
# listener's ENVOY_OIDC_GOOGLE_AUDIENCE); elsewhere set ENVOY_ACCOUNT_TOKEN_FILE to the host path of a
# service-account token for the listener's audience, which is mounted into the container. The
# listener's side is in listener.compose.yml (../README.md, "Dispatch's identity at the Envoy
# listener").
services:
  dispatch:
    image: ghcr.io/cybermonklabs/legion/envoy:${ENVOY_IMAGE_TAG:?set ENVOY_IMAGE_TAG (see deploy/README.md)}
    build:
      context: ../../../..
      dockerfile: packages/envoy/docker/Dockerfile
    network_mode: host
    # Starts Dispatch only once it has an identity at the listener, and otherwise exits naming both
    # settings: a Dispatch with none would refuse every message and mention for a role: route. It is
    # a check of the container's own environment rather than a compose interpolation, so every
    # Docker Compose version reads the file alike and only the container's start is refused, not
    # `pull`, `ps`, `logs` or `down`.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$${ENVOY_ACCOUNT_GOOGLE_AUDIENCE}$${ENVOY_ACCOUNT_TOKEN_FILE}" ]; then
          echo "dispatch: role routes need Dispatch's identity at the Envoy listener; set ENVOY_ACCOUNT_GOOGLE_AUDIENCE (on Google Cloud) or ENVOY_ACCOUNT_TOKEN_FILE (a token file's host path) in compose/.env, see deploy/README.md, \"Dispatch's identity at the Envoy listener\"" >&2
          exit 78
        fi
        exec /usr/local/bin/envoy-dispatch "$$@"
      - envoy-dispatch
    restart: unless-stopped
    # A SIGTERM runs Dispatch's ordered shutdown: the requests in flight drain first, the document
    # service settles what is owed within 14 s of its own (starting 11 s after the signal at the
    # latest), and the database pool then closes once every request has answered. While the
    # database still answers, nothing but this stop_grace_period bounds the pool's close, so a
    # write still waiting on a lock commits and is answered whenever it finishes, up to that
    # bound; only once stop_grace_period itself runs out is the process killed with it still open.
    # Three 2 s health probes in a row finding the database silent close the pool early instead of
    # waiting for stop_grace_period, and Dispatch exits without the connections still using it.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://${DISPATCH_LISTEN_HOST:-127.0.0.1}:${DISPATCH_PORT:-8766}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      HOME: /home/envoy
      # The Dispatch database is external, and the production deployment backs it up with its own
      # scheduled task; this compose runs no Postgres and no backup worker of its own.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (the external Dispatch Postgres URL)}
      DISPATCH_LISTEN_HOST: ${DISPATCH_LISTEN_HOST:-127.0.0.1}
      DISPATCH_PORT: ${DISPATCH_PORT:-8766}
      DISPATCH_APP_CLIENT_ID: ${DISPATCH_APP_CLIENT_ID:-}
      DISPATCH_AGENT_TOKEN: ${DISPATCH_AGENT_TOKEN:?set DISPATCH_AGENT_TOKEN}
      DISPATCH_SERVER_URL: ${DISPATCH_SERVER_URL:?set DISPATCH_SERVER_URL (the browser origin)}
      NATS_URLS: ${NATS_URLS:?set NATS_URLS}
      # This server owns ENVOY_NOTIFICATIONS on the NATS above, which is the shared server rather
      # than this host's. Every connect refuses a NATS that is not the machine's own without this
      # (packages/envoy/internal/bus/reach.go).
      ENVOY_ALLOW_REMOTE_NATS: "1"
      DISPATCH_SIGNIN_ISSUER: ${DISPATCH_SIGNIN_ISSUER:-}
      DISPATCH_SIGNIN_CLIENT_ID: ${DISPATCH_SIGNIN_CLIENT_ID:-}
      DISPATCH_SIGNIN_CLIENT_SECRET: ${DISPATCH_SIGNIN_CLIENT_SECRET:-}
      DISPATCH_SIGNIN_GROUP: ${DISPATCH_SIGNIN_GROUP:-}
      DISPATCH_SIGNIN_DOMAIN: ${DISPATCH_SIGNIN_DOMAIN:-}
      # Production uses cookie identity. header:<name> is only for test/local harnesses and
      # requires DISPATCH_IDENTITY_HEADER_TRUSTED=1; it never shares a deployment with sign-in.
      DISPATCH_IDENTITY: ${DISPATCH_IDENTITY:-cookie}
      DISPATCH_IDENTITY_HEADER_TRUSTED: ${DISPATCH_IDENTITY_HEADER_TRUSTED:-}
      DISPATCH_NATS_DISABLED: ${DISPATCH_NATS_DISABLED:-}
      ENVOY_URL: ${ENVOY_URL:-http://127.0.0.1:9020}
      ENVOY_TOKEN: ${ENVOY_TOKEN:-}
      # Dispatch's own identity at the listener (the entrypoint above requires one): the Google
      # audience, or the token file mounted below at /run/envoy-listener/token.
      ENVOY_ACCOUNT_GOOGLE_AUDIENCE: ${ENVOY_ACCOUNT_GOOGLE_AUDIENCE:-}
      ENVOY_ACCOUNT_TOKEN_FILE: ${ENVOY_ACCOUNT_TOKEN_FILE:+/run/envoy-listener/token}
      # Optional boot seed for mappings absent from the dashboard. Stored
      # repository mappings are authoritative; DISPATCH_DEFAULT_PROJECT catches
      # external repositories with no stored mapping.
      DISPATCH_REPO_PROJECTS: ${DISPATCH_REPO_PROJECTS:-}
      DISPATCH_DEFAULT_PROJECT: ${DISPATCH_DEFAULT_PROJECT:-}
      # Session cookies are Secure by default; set this when serving the
      # OAuth dashboard over plain HTTP (local/tailnet use).
      DISPATCH_INSECURE_COOKIE: ${DISPATCH_INSECURE_COOKIE:-}
    volumes:
      # Signing key and optional app.json credentials.
      - dispatch-data:/home/envoy/.local/share/dispatch
      # The token file ENVOY_ACCOUNT_TOKEN_FILE names on the host, when set; /dev/null otherwise,
      # which Dispatch does not read. A path that does not exist refuses `up` rather than becoming
      # an empty directory. A bind of one file keeps the file it found at start, so the token must
      # be rewritten in place; a writer that replaces it by rename needs the container restarted.
      - type: bind
        source: ${ENVOY_ACCOUNT_TOKEN_FILE:-/dev/null}
        target: /run/envoy-listener/token
        read_only: true
        bind:
          create_host_path: false


volumes:
  dispatch-data:
