# Envoy on one machine: a NATS server with JetStream of its own, the one-shot that makes the
# key-value buckets the listener copies, and the Envoy listener, all on loopback. The Envoy page of
# the docs site ("Running Envoy on one machine", from docs/site/src/content/docs/dispatch/envoy.md)
# covers what it serves and how to run it.
name: envoy-single-node

services:
  nats:
    # nats:2.15.1-alpine by digest: the image the hub runs, which CI's registry copy of the same
    # digest, packages/envoy/internal/testnats/nats.go's HubImage, also runs
    # (.github/ci-images.yaml). The version decides what the ENVOY_NOTIFICATIONS stream's
    # consumer cap does. From nats-server 2.15 a stream that sets no cap is capped by the server
    # at its own default of 1000, which is the limit the listener's 24000 replaces; on every
    # older server such a stream has no limit at all, so the listener leaves it as it is and the
    # cap is set only on a stream the listener creates. What an older server does refuse is a
    # raise of a cap the stream already holds: every server before v2.12.5 refuses an update that
    # changes MaxConsumers on a stream that already exists (`nats: stream configuration update
    # can not change MaxConsumers`), so a start against a stream an earlier listener created with
    # a cap below 24000 fails there. An operator whose server is older and whose nats-data volume
    # already holds such a stream upgrades the server first, keeping the volume, and then starts
    # the listener, which sets the cap: a store written by nats-server 2.10.29 opens on 2.15.1
    # with its stream, its messages and its consumers intact. That upgrade is also what turns a
    # stream carrying no cap from unlimited into one the server caps at 1000, and the listener's
    # next start raises it to 24000.
    image: mirror.gcr.io/library/nats:2.15.1-alpine@sha256:2ae57dfba3063d5e25fecb75256118c0882a1a2d2cf7d0fba17a7c701df956f6
    network_mode: host
    # No configuration file: the image's default one opens a cluster port this server has no use
    # for. The monitoring port follows --addr onto loopback.
    command:
      - --name=envoy-nats
      - --addr=127.0.0.1
      - --port=${NATS_PORT:-4222}
      - --http_port=${NATS_MONITOR_PORT:-8222}
      - --jetstream
      - --store_dir=/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${NATS_MONITOR_PORT:-8222}/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      # The ENVOY_NOTIFICATIONS stream and Envoy's key-value buckets: a restart keeps the last 72
      # hours of events, and the subscriptions and role claims of every session still running.
      - nats-data:/data

  # The key-value buckets the listener keeps a copy of, made before it starts, as production makes
  # them: with `envoy-infra buckets create` and its writer proof. No listener creates one, since a
  # bucket deleted and created again under a running listener loses every write the deleted one
  # acknowledged; a listener that finds one missing at its start waits, every route answering 503,
  # until this command makes it (packages/envoy/infra/README.md, "envoy-infra buckets").
  #
  # The four buckets are the ones a listener that mounts no GitHub webhook route copies
  # (listenerCopiedBuckets(false) in packages/envoy/cmd/listener/missing_buckets.go), and this
  # listener mounts none. Leaving out envoy_ci_state, which only that route opens, also keeps
  # envoy-dispatch's names out of the proof's process list, since only that bucket has it as a
  # writer.
  #
  # The proof is --this-machine: the command reads every process of this machine and refuses while
  # one runs under a listener's name (envoy-listener, listener). pid: host is what lets it read the
  # machine's processes rather than this container's alone. --connz adds the server's own census of
  # open listener connections. Every `up` runs it again, so an upgrade (`up -d --wait`) runs it
  # while the listener still serves: with every bucket there it changes nothing, takes no proof and
  # exits 0. With one missing it refuses while the listener runs, naming its process, and `up`
  # fails; stop the listener (`docker compose -f single-node.compose.yml stop listener`) and run
  # `up -d --wait` again, which makes the bucket and starts the listener.
  #
  # envoy-infra is not in the published envoy image, so this image is built from the checkout
  # (buckets.Dockerfile), and pull_policy: build rebuilds it from the checkout on every `up`; the
  # build's layers and Go caches make that quick once the first `up` has built it.
  buckets:
    build:
      context: ../../../..
      dockerfile: packages/envoy/deploy/compose/buckets.Dockerfile
    pull_policy: build
    network_mode: host
    pid: host
    restart: "no"
    depends_on:
      nats:
        condition: service_healthy
    command:
      - buckets
      - create
      - --nats=nats://127.0.0.1:${NATS_PORT:-4222}
      - --this-machine
      - --connz=http://127.0.0.1:${NATS_MONITOR_PORT:-8222}
      - --bucket=envoy_interests
      - --bucket=envoy_roles
      - --bucket=envoy_sessions
      - --bucket=envoy_known_sessions

  listener:
    image: ghcr.io/cybermonklabs/legion/envoy:${ENVOY_IMAGE_TAG:?set ENVOY_IMAGE_TAG (see single-node.env.example)}
    network_mode: host
    depends_on:
      nats:
        condition: service_healthy
      buckets:
        condition: service_completed_successfully
    restart: unless-stopped
    # A SIGTERM runs the listener's ordered shutdown: up to 10 s for HTTP, up to 5 s to drain the
    # role lane, then up to 13 s to drain NATS, about 28 s in all. Docker's 10 s default would
    # SIGKILL it before the drain starts.
    stop_grace_period: 30s
    # curl -f fails on any status from 400: while a start waits for a missing copied bucket,
    # /healthz answers 503 "waiting", so the container reads unhealthy and `up -d --wait` fails
    # rather than pass a listener that serves nothing. A running listener whose bucket goes missing
    # answers 200 "degraded" with the bucket under "missing_buckets", and stays healthy, since it
    # still serves every route that needs no missing bucket.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:${ENVOY_LISTENER_PORT:-9020}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      PORT: ${ENVOY_LISTENER_PORT:-9020}
      ENVOY_LISTEN_HOST: 127.0.0.1
      ENVOY_MACHINE_ID: ${ENVOY_MACHINE_ID:?set ENVOY_MACHINE_ID (this machine's name)}
      # This machine's own NATS, above, so the listener needs no ENVOY_ALLOW_REMOTE_NATS.
      NATS_URLS: nats://127.0.0.1:${NATS_PORT:-4222}
      # Optional on loopback: when set, every /v1 caller must send it as a bearer token.
      ENVOY_API_TOKEN: ${ENVOY_API_TOKEN:-}
      # Dispatch's identity, for a Dispatch that sends role routes through this listener: one
      # verifier pair and the principal (deploy/README.md, "Dispatch's identity at the Envoy
      # listener"). Sessions that only reach each other leave them empty. Setting a pair closes /v1
      # to every caller with no bearer, this host's sessions included: set ENVOY_API_TOKEN with it
      # and give those sessions that token (ENVOY_TOKEN, or envoy.token in their envoy.json).
      ENVOY_OIDC_ISSUER: ${ENVOY_OIDC_ISSUER:-}
      ENVOY_OIDC_AUDIENCE: ${ENVOY_OIDC_AUDIENCE:-}
      ENVOY_OIDC_ACCOUNTS: ${ENVOY_OIDC_ACCOUNTS:-}
      ENVOY_OIDC_GOOGLE_AUDIENCE: ${ENVOY_OIDC_GOOGLE_AUDIENCE:-}
      ENVOY_OIDC_GOOGLE_ACCOUNTS: ${ENVOY_OIDC_GOOGLE_ACCOUNTS:-}
      ENVOY_DISPATCH_PRINCIPAL: ${ENVOY_DISPATCH_PRINCIPAL:-}

volumes:
  nats-data:
