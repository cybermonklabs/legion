services:
  # The key-value buckets this listener copies (envoy_interests, envoy_roles, envoy_sessions,
  # envoy_known_sessions, and envoy_ci_state with the GitHub route) come from the deployment's
  # operator, `envoy-infra buckets create` (packages/envoy/infra/README.md#envoy-infra-buckets),
  # never from the listener. A start that finds one missing waits, /healthz answering 503
  # "waiting" and the health check below failing, until the bucket exists.
  listener:
    image: ghcr.io/cybermonklabs/legion/envoy:${ENVOY_IMAGE_TAG:?set ENVOY_IMAGE_TAG (see deploy/README.md)}
    build:
      context: ../../../..
      dockerfile: packages/envoy/docker/Dockerfile
    network_mode: host
    command: ["/usr/local/bin/envoy-listener"]
    restart: unless-stopped
    # A SIGTERM runs the listener's ordered shutdown: up to 10 s for HTTP, up to 5 s to drain the
    # role lane, then up to 13 s to drain NATS, about 28 s in all. Docker's 10 s default would
    # SIGKILL it before the drain starts.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9020/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      PORT: ${ENVOY_LISTENER_PORT:-9020}
      ENVOY_LISTEN_HOST: ${ENVOY_LISTEN_HOST:-127.0.0.1}
      ENVOY_API_TOKEN: ${ENVOY_API_TOKEN:-}
      # Dispatch's identity, which this listener takes a send's role mark from alone
      # (ENVOY_DISPATCH_PRINCIPAL): the verifier of a service-account token (the OIDC pair) or of a
      # Google identity token (the Google pair), and the principal. A listener Dispatch sends role
      # routes through sets one pair and the principal (deploy/README.md, "Dispatch's identity at
      # the Envoy listener"); one no Dispatch calls leaves them empty. Setting a pair closes /v1 to
      # every caller with no bearer, the host's own sessions included: set ENVOY_API_TOKEN with it
      # and give those sessions that token (ENVOY_TOKEN, or envoy.token in their envoy.json).
      ENVOY_OIDC_ISSUER: ${ENVOY_OIDC_ISSUER:-}
      ENVOY_OIDC_AUDIENCE: ${ENVOY_OIDC_AUDIENCE:-}
      ENVOY_OIDC_ACCOUNTS: ${ENVOY_OIDC_ACCOUNTS:-}
      ENVOY_OIDC_GOOGLE_AUDIENCE: ${ENVOY_OIDC_GOOGLE_AUDIENCE:-}
      ENVOY_OIDC_GOOGLE_ACCOUNTS: ${ENVOY_OIDC_GOOGLE_ACCOUNTS:-}
      ENVOY_DISPATCH_PRINCIPAL: ${ENVOY_DISPATCH_PRINCIPAL:-}
      ENVOY_MACHINE_ID: ${ENVOY_MACHINE_ID}
      NATS_URLS: ${NATS_URLS}
      # This listener owns ENVOY_NOTIFICATIONS on the NATS above, which is the fleet's shared
      # server rather than this host's. Every connect refuses a NATS that is not the machine's
      # own without this (packages/envoy/internal/bus/reach.go).
      ENVOY_ALLOW_REMOTE_NATS: "1"
      ENVOY_WEBHOOKS: ${ENVOY_WEBHOOKS:-}
      ENVOY_GITHUB_WEBHOOK_SECRET: ${ENVOY_GITHUB_WEBHOOK_SECRET:-}
      ENVOY_GITHUB_MENTION_TRIGGER: ${ENVOY_GITHUB_MENTION_TRIGGER:-@legion}
      ENVOY_GITHUB_REPOSITORY_RENAMES: ${ENVOY_GITHUB_REPOSITORY_RENAMES:-}
      ENVOY_REVIEWER_APP_ID: ${ENVOY_REVIEWER_APP_ID:-}
      ENVOY_SLACK_SIGNING_SECRET: ${ENVOY_SLACK_SIGNING_SECRET:-}
      ENVOY_GHOSTWISPR_SIGNING_SECRET: ${ENVOY_GHOSTWISPR_SIGNING_SECRET:-}
