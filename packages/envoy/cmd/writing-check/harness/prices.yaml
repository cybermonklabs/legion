  claude-opus-5: {family: claude, input: 5, output: 25, cache_write: 6.25, cache_read: 0.5}
  claude-opus-4-7: {family: claude, input: 5, output: 25, cache_write: 6.25, cache_read: 0.5}
  claude-opus-4-6: {family: claude, input: 5, output: 25, cache_write: 6.25, cache_read: 0.5}
  claude-sonnet-4-5: {family: claude, input: 3, output: 15, cache_write: 3.75, cache_read: 0.3}
  claude-opus-5-5: {family: claude, input: 4, output: 20, cache_write: 5, cache_read: 0.2}
  claude-sonnet-4-6: {family: claude, input: 3, output: 15, cache_write: 3.75, cache_read: 0.3}
