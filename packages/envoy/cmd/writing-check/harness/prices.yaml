# What each model of candidates.yaml charges, in USD per million tokens: prompt tokens (input),
# reply tokens (output), a cache write and a cache read. The harness prices every call's tokens
# with this table, and refuses to start when a model of candidates.yaml has no row here. A model
# that --grader or --reader names needs a row too.
sources:
  claude:
    source: >-
      The operator's model gateway, GET /model/info: each model's input_cost_per_token,
      output_cost_per_token, cache_creation_input_token_cost and cache_read_input_token_cost,
      times one million. cache_creation_input_token_cost is the price of a five-minute cache
      write; the gateway prices a write of a mark that names no life, which lives one hour, at
      cache_creation_input_token_cost_above_1hr. The harness's own calls carry no cache mark.
      claude-fable-5-2, a candidate that `--reader` may name as the fresh reader, was read from
      the same source on 2026-11-16.
    read: 2026-11-15
  foundry:
    source: >-
      The Azure retail prices API (https://prices.azure.com/api/retail/prices), region westus2,
      the Global meters of each model (the deployments are GlobalStandard): "Azure Grok Models"
      meters "4.7 Inp glbl 1M Tokens", "4.7 Outp glbl 1M Tokens" and "4.7 Cached glbl 1M Tokens"
      (effective 2026-10-01); "Azure Kimi" meters "Kimi 3.1 Pro Inp Glbl 1M Tokens", "Kimi 3.1 Pro
      Outp Glbl 1M Tokens" and "Kimi 3.1 Cached Inp Glbl 1M Tokens" (effective 2026-11-01). A
      Foundry chat deployment has no cache write price. The four deployments INFRA-3483 declares,
      read 2026-11-17: "Azure Mistral Models" meters "Large 3 Inp glbl Tokens" and "Large 3 Outp
      glbl Tokens" (effective 2025-12-01); "Azure Llama Models" meters "Llama 4 Maverick 17B Inp
      glbl Tokens" and "Llama 4 Maverick 17B Outp glbl Tokens" (effective 2025-06-01); "Azure
      OpenAI OSS Models" meters "gpt-oss-120B Inp glbl Tokens" and "gpt-oss-120B Outp glbl
      Tokens" (effective 2026-03-01). These three list no cached-input meter, so a cached read
      is priced as input. DeepSeek-V4-Pro has no Global meter, and INFRA-3483 declares a
      GlobalStandard deployment, so its row is an estimate from another meter: "Azure Fireworks
      Models" "FW DeepSeek-V4-Pro Inp DZ Tokens", "FW DeepSeek-V4-Pro Outp DZ Tokens" and "FW
      DeepSeek-V4-Pro Ch Inp DZ Tokens" (data zone, effective 2026-06-01). The four rows are
      corrected from each deployment's first billed calls before the held-out run's named commit.
    read: 2026-11-15

