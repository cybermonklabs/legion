kind: Changed
body: |-
  The NATS auth service's grant for the measurement job (`measure` in `BROKER_NATS_SERVICES`)
  now subscribes `_INBOX_envoy._measure.>` beside `_INBOX_envoy_measure.>`, so the job can make
  its inboxes under `natsgrant.ReplyRoot`, `_INBOX_envoy`. Plan C's private render, which puts
  JetStream in an account of its own, exports `_INBOX_envoy.>` beside `_INBOX.>` to its clients
  by its design, and the job's present prefix is under neither. That prefix is still admitted; a
  later release drops it once no measurement job sets it. Neither prefix reaches `_INBOX.>` or
  another client's prefix under the root. The edge listener's own prefix,
  `_INBOX_envoy_edge_<machine id>`, is under neither export too, so that render exports
  `_INBOX_envoy_edge_<machine id>.>` once per edge machine until the edge listener moves under the
  root.
time: 2026-11-21T16:50:36Z
