kind: Fixed
body: |-
  `agent-secrets-helper install` no longer says it did not restart the helper when, after a
  restart systemd answered success, a read of the unit's main process before or after that
  restart fails or does not answer within 5 s: it cannot tell whether the restart replaced the
  helper. It attempts `undrain` only when it can read that systemd holds no job for the unit, and
  leaves the helper draining while a job is queued or when that read fails too; an `undrain` that
  fails is reported as attempted, not as sent. Then it exits 2 with an error that says it could
  not tell whether the restart replaced the helper, naming the read that failed and its error. A
  read that does not answer within its bound is named as one, not as `signal: killed`.
time: 2026-11-25T09:53:02Z
