kind: Added
body: |-
  The NATS auth service admits the deployment's one operator identity: a `BROKER_NATS_SERVICES`
  entry of the new kind `operator` (`operator/-/*=<account>`, listed once, with no machine id and
  the whole grant), which connects as user `service` with its ServiceAccount token and the inbox
  prefix `_INBOX_envoy_operator`, and is placed in `$G` like every other client. Its grant follows
  the NATS writer hold's phase (`natsgrant.Operator`): outside a hold, reads alone (the stream and
  consumer infos, and a stored-message walk of the session consumers' records, which
  `kvrecords.Write` keeps as a records-only copy); while a hold is prepared, also the consumer
  threshold raise; while a hold is set, the whole list the hold's commands need, the copied buckets'
  snapshots and the create of `ENVOY_MEASURE` included, since a snapshot's delivery subject and a
  stream's republish are the caller's choice. Its user
  expires at most ten minutes after the decision. A second new kind, `probe`
  (`probe/-/*=<account>`), is the hold's probe, granted publish and subscribe of
  `_ENVOY_HOLD_PROBE.none` alone. The hold's row, its records and each family's cutover row live in
  the broker's Postgres (migration `0041_nats_hold`), each signed by the operator's Ed25519 key,
  whose public halves are `BROKER_NATS_HOLD_SIGNING_KEYS`, and written only through the operator's
  `/v1/nats-hold` routes. With `BROKER_NATS_HOLD_READ=true` (default `false`) the auth service reads
  the row at each decision on a pool of its own (`BROKER_NATS_HOLD_POOL_SIZE`, default 2) and, while
  no verified row can be read, refuses every client but the operator with `hold_unknown`; the broker
  then needs an `operator` entry and signing keys to start, and starts with no row.
