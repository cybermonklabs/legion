kind: Fixed
body: |-
  The broker's airlock proxy reads the port a command asks for once, as the number it names, before it checks, dials or logs it. A port written with leading zeros, such as `:0443`, is dialled and logged as `443`, and a URL that names no port is read with its scheme's, `443` for an `https` URL sent to the proxy as it is. A port that is no number from 1 to 65535 is refused before any lookup or dial: `0` or a number past 16 bits with `400 CONNECT_TARGET_INVALID` on a `CONNECT` and `400 PROXY_TARGET_INVALID` on a plain-HTTP request, and a service name such as `https` or a sign, which reaches the proxy only in the Host header a `CONNECT` with a path for its target is read by, with `400 CONNECT_TARGET_INVALID`. Before, the dialer read such a port by rules of its own, so a bound host's port 443 written in that Host header as `https` or `+443` opened a plain tunnel to it rather than the decrypted connection the airlock reads.
  A plain-HTTP request the proxy forwards, an absolute `https` URL sent to the proxy as it is among them, is dialled with the host lowercased and without a zone, as it was checked, and on a socket of its own: the proxy keeps no connection to the service and speaks HTTP/1.1 to it, even when the service offers HTTP/2, so no socket opened for one caller carries another caller's request.
  Every line the broker writes through slog or Go's `log` package - every line of the airlock's proxy port, its `broker: answer refused` refusal line and httputil's own lines among them, the standard logger's, the AWS SDK's, which the broker now writes as `broker: aws sdk` at WARNING, grpc's, now `broker: grpc`, and OpenTelemetry's internal errors, each rather than on stderr by a logger of the library's own - has each placeholder written whole, in any case, in each form a handler writes it - `agent-secrets-placeholder-` and the letters and digits after it - replaced by `[placeholder]`; a value is read in each form slog's JSON and text handlers write it, as each handler computes it (its JSON or an error's text, and its `AppendText`, `MarshalText`, a byte slice's bytes or fmt's `%+v`); a nil value, or one whose methods fail or panic, is written as slog writes it (`<nil>`, `!ERROR:…`, `!PANIC: …`), with a placeholder in that text masked too, and the mask never ends the call. grpc's `GRPC_GO_LOG_SEVERITY_LEVEL` and `GRPC_GO_LOG_VERBOSITY_LEVEL` no longer change what the broker writes. Before, a command that wrote its placeholder into the `X-Correlation-Id`, the path or the method of a request the proxy refused, or into the path of a call it carried, had it written on that call's line as it was minted; a service whose certificate named it had it quoted in the upstream line's error as it was minted; a service that sent it as a trailer line had it quoted, as it was minted and uncut, in the line httputil writes to the standard logger, which now goes through the proxy's own log as `airlock proxy: net/http`; a bound service that sent bytes after a whole answer had them quoted as minted on the standard logger by net/http's transport, which has no error log of its own and logs with `log.Printf`, and which the broker now writes through the same mask, its first line cut to 256 bytes; and a host the command made of it was written lowercased. A placeholder encoded on purpose - percent-escaped, in fullwidth letters, with a separator after the prefix or an invisible character inside it, or its 32 characters alone - is out of the mask's scope, as are a library that writes to stderr or stdout itself (the Anthropic SDK's warnings, go-retryablehttp's default client, the pg_query WebAssembly module's stdout and stderr, and the Google client libraries' own logger when `GOOGLE_SDK_GO_LOGGING_LEVEL` is set and a client was given no logger; the broker's Secret Manager client is given one that drops every line) and the Go runtime's report of a crash.
  The lines net/http, net/textproto and httputil write, the error of `airlock proxy: upstream` and the `502` the proxy answers with it, and the reason of a failed Azure exchange, in its line and its answer, hold no run of bytes those libraries quote from a peer. They quote with `%q` what a service, a token endpoint or a client sent - an answer's bytes on an idle connection, a header, trailer or status line they could not read, an ALPN list - and each such run is now written as `"[service bytes not shown]"`. Before, a bound service that echoed the Authorization header it was sent, which holds the real value the swap put in, after its answer had that value written on the standard logger, one that sent it as its status line had it in the `502` the command was given, and a token endpoint that sent the federated token back as its status line had it in the exchange's refusal. Text a library writes without quotes, such as the names in a service's certificate, is written as it came.
  A dial whose first address timed out on its own, and whose command then left while a later address was dialled, keeps the class `unreachable` rather than `cancelled`: only a cancel of the request, which is what a command's leaving is, makes a failure `cancelled`.
