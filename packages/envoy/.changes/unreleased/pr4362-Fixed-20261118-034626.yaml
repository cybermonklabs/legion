kind: Fixed
body: |-
  The broker's airlock proxy reads the port a command asks for once, as the number it names, before it checks, dials or logs it. A port written with leading zeros, such as `:0443`, is dialled and logged as `443`, and a URL that names no port is read with its scheme's, `443` for an `https` URL sent to the proxy as it is. A port that is no number from 1 to 65535 is refused before any lookup or dial: `0` or a number past 16 bits with `400 CONNECT_TARGET_INVALID` on a `CONNECT` and `400 PROXY_TARGET_INVALID` on a plain-HTTP request, and a service name such as `https` or a sign, which reaches the proxy only in the Host header a `CONNECT` with a path for its target is read by, with `400 CONNECT_TARGET_INVALID`. Before, the dialer read such a port by rules of its own, so a bound host's port 443 written in that Host header as `https` or `+443` opened a plain tunnel to it rather than the decrypted connection the airlock reads.
  A plain-HTTP request the proxy forwards, an absolute `https` URL sent to the proxy as it is among them, is dialled with the host lowercased and without a zone, as it was checked, and on a socket of its own: the proxy keeps no connection to the service and speaks HTTP/1.1 to it, even when the service offers HTTP/2, so no socket opened for one caller carries another caller's request.
  Every line the airlock's proxy port writes, its `broker: answer refused` refusal line among them, has each placeholder written whole in its text - `agent-secrets-placeholder-` and the letters and digits after it, in any case - replaced by `[placeholder]`. Before, a command that wrote its placeholder into the `X-Correlation-Id`, the path or the method of a request the proxy refused, or into the path of a call it carried, had it written on that call's line as it was minted; a service whose certificate named it had it quoted in the upstream line's error as it was minted; and a host the command made of it was written lowercased. A placeholder encoded on purpose, percent-escaped or in fullwidth letters, is out of the mask's scope.
