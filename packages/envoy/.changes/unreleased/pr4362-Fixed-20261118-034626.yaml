kind: Fixed
body: |-
  The broker's airlock proxy reads the port a command asks for once, as the number it names, before it checks, dials or logs it. A port written with leading zeros, such as `:0443`, is dialled and logged as `443`, and a URL that names no port is read with its scheme's, `443` for an `https` URL sent to the proxy as it is. A port that is no number from 1 to 65535 - `0`, a number past 16 bits, a service name such as `https`, a sign - is refused before any lookup or dial: `400 CONNECT_TARGET_INVALID` on a `CONNECT`, its Host header's authority among them, and `400 PROXY_TARGET_INVALID` on a plain-HTTP request. Before, the dialer read such a port by rules of its own, so a bound host's port 443 written as `https` or `+443` opened a plain tunnel to it rather than the decrypted connection the airlock reads.
  A plain-HTTP request the proxy forwards is dialled with the host lowercased and without a zone, as it was checked, and on a socket of its own: the proxy keeps no connection to a plain-HTTP service, so no socket opened for one caller carries another caller's request.
