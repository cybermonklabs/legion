kind: Fixed
body: 'The compose auto-deployer (`deploy/scripts/autodeploy.sh`) refuses a deploy, before its backup, when Docker Compose resolves neither `ENVOY_ACCOUNT_GOOGLE_AUDIENCE` nor `ENVOY_ACCOUNT_TOKEN_FILE` for the Dispatch service, logging one line that names both settings, and the Dispatch that serves keeps serving. The Dispatch container refuses its start without one of them and restart-loops under `restart: unless-stopped`, and a rollback under the same compose file would meet the same refusal. `deploy/scripts/up-dispatch.sh` refuses to run in the same case. The deployer now reads `compose/.env` only through Compose''s own resolution (`docker compose config`): the identity settings, `DISPATCH_SERVER_URL`, `DATABASE_URL` and `DISPATCH_PORT` as the Dispatch service gets them (a `$`, which Compose prints doubled there, halved back), and `ENVOY_IMAGE_TAG` and its schema record as Compose interpolates them. So `${...}` interpolation, quoting and an `export` prefix count as they do for the container: `NAME=""` and `NAME="${UNSET:-}"` are empty, and `export NAME=v` is `v`. Before, `DISPATCH_PORT="8766"` made the health check dial `"8766"` and roll a good deploy back. `compose/.env` owns the deployed tag: an `ENVOY_IMAGE_TAG` in the deployer''s own environment is ignored, where it would have won over the file and had every poll deploy the same image again. The deployer writes the tag and its schema record through one writer, which removes every `NAME=` line and appends one, staging the new file in an owner-only directory under `BACKUPS`, outside the checkout, and renaming it over the old one, so `BACKUPS` must be on `compose/.env`''s filesystem (on another, it writes nothing and does not deploy). A configuration Compose refuses is refused with no text of Compose''s, which can begin with a warning and can quote a setting''s value: the log names a required variable missing a value, or gives Compose''s exit status and the `docker compose config` command that shows its message. A Compose that does not answer within 60 seconds, a missing `python3`, and a `python3` that cannot read the answer are each named; both scripts refuse by name when `docker compose` cannot run. The deployer needs Docker with Compose and `python3` on its host.'
