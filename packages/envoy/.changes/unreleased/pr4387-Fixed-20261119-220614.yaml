kind: Fixed
body: 'The compose auto-deployer (`deploy/scripts/autodeploy.sh`) refuses a deploy, before its backup, when Docker Compose resolves neither `ENVOY_ACCOUNT_GOOGLE_AUDIENCE` nor `ENVOY_ACCOUNT_TOKEN_FILE` for the Dispatch service, logging one line that names both settings, and the Dispatch that serves keeps serving. The Dispatch container refuses its start without one of them and restart-loops under `restart: unless-stopped`, and a rollback under the same compose file would meet the same refusal. `deploy/scripts/up-dispatch.sh` refuses to run in the same case. Both scripts, and the deployer''s `DISPATCH_SERVER_URL` and `DATABASE_URL` checks, read these settings from Compose''s own resolution (`docker compose config`) rather than from `compose/.env`''s text, so `${...}` interpolation, quoting, an `export` prefix and the shell''s value over the file''s count exactly as they do for the container: `NAME=""` and `NAME="${UNSET:-}"` are empty, and `export NAME=v` is `v`. Before, the deployer took `NAME=""` as set and `export NAME=v` as missing. A configuration Compose refuses (a required variable missing a value) is refused with Compose''s own first line, any password in it cut; and both scripts refuse by name when `docker compose` cannot run.'
