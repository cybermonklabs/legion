kind: Added
body: 'The secrets broker takes `BROKER_SIGNIN=off`, for a deployment that has not settled how its people sign in: it starts with no `BROKER_SIGNIN_*` setting, serves no approval page (every route under `/approve` and `/signin/` is a 404), denies at once every requested secret a person would have to approve, naming the setting, and denies at its next sweep any request for its own public URL that a run with sign-in on left pending, while what the policy grants at once is granted as before. `off` refuses to start beside any `BROKER_SIGNIN_*` setting or the model judge, any other value refuses, and with the setting unset an empty or partial sign-in refuses exactly as before. `BROKER_PUBLIC_URL` is now refused at start unless it is an `http` or `https` URL, which the approval page alone used to check.'
