kind: Added
body: 'The secrets broker takes `BROKER_SIGNIN=off`, for a deployment that has not settled how its people sign in: it starts with no `BROKER_SIGNIN_*` setting, serves no approval page (every route under `/approve` and `/signin/` is a 404), denies at once every requested secret a person would have to approve, naming the setting, and denies at its next sweep any request for its own public URL that a broker with sign-in on left pending and that has not expired, while what the policy grants at once is granted as before. A roll between the two settings denies each request of its overlap that no person approved first, so a cutover that should deny none has no overlap. `off` refuses to start beside any `BROKER_SIGNIN_*` setting or the model judge, any other value refuses, and with the setting unset an empty or partial sign-in refuses exactly as before. A `BROKER_PUBLIC_URL` whose scheme is neither `http` nor `https` is now refused by the broker''s last configuration check, `BROKER_PUBLIC_URL must be an http or https URL, got the scheme "ftp"`, where the approval page used to refuse it.'
