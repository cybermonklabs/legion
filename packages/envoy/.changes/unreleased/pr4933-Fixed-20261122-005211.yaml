kind: Fixed
body: |-
    Dispatch's CI reconcile records every check run GitHub answers for a head, queued and running ones too, where it recorded only finished runs. After the listener missed a head's webhooks, the reconcile wrote the runs that had finished and left out the ones still queued, and the listener announced `checks settled` for a head whose CI GitHub was still running. A queued or running run never replaces the same run finished, nor a newer run of its name. So a pass re-arms a settled head only for a re-run or a new job that GitHub has not finished, and the head settles again, superseding the earlier settlement, once that run ends. Check suites are still recorded only once they complete.

    The reconcile writes all check runs of one head in one compare-and-swap (`cistore.Writer.RecordRuns`, which replaces `cistore.Writer.Record`). Before, it wrote each run alone, and a failed write could leave a passed run in the record without the failed run beside it, which the listener announced as a green head. A failed write now lands none of the head's runs, and the next pass reads the head in full again. A write that would take the record past its bound is refused whole: the record is written as it was, marked overflowed, so the head never settles, and nothing of the batch is written. The WARN line of a failed write is now `ci reconcile did not record the check runs of a head`, with `runs`, in place of one `ci reconcile did not record a check run` line per run.

    A head whose run write failed is written nothing more in that pass: before, the pass went on to write the head's completed suites, and a suite written after a failed run write re-armed the settled record, which then settled again on the runs it held while GitHub still ran the ones it lacked.

    A new listener setting, `ENVOY_CI_VERIFY=on`, publishes a head's `checks settled` only after Dispatch's CI reconcile has read the head from GitHub after the listener asked. The listener claims a ready head and writes a verify request (`verify.<record key>`, a key of the CI bucket), keeping that write's KV revision. Every 5 seconds Dispatch lists the requests with no lease; when it finds some, it answers them under the lease `ci-verify`, which has its own lease-pool connection (`store.LeasePoolSize` 25, so a Dispatch process opens up to 116 Postgres connections). It reads each head's check runs, check suites and commit statuses from GitHub whole, writes them by the reconcile's rules, and then writes the request's revision it read before the GitHub read, with the bucket's stream identity, as the record's `verified_rev` and `verified_stream`; a failed or incomplete read writes none. The listener publishes once `verified_rev` reaches its request in the bucket's current stream, the record is still ready, and the record still carries its claim. A request unanswered for 2 minutes is written again, logged at WARN; after 10 minutes the listener gives the episode up with one ERROR and asks again after a backoff of 5 minutes, doubled at each further give-up up to 30, so a head given up in an outage is published once Dispatch answers. Dispatch reads a head it failed to read again after 1 minute, doubling up to 8, and gives an episode up at once only for a failure no later read mends. The setting is off by default, and off the listener settles from its webhooks alone, as before.
