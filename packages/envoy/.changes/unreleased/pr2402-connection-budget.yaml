kind: Changed
body: |-
  Dispatch's database connections are one budget of 115 a process, partitioned so that neither
  requests nor background work can starve the other: the request pool holds 48, from 64, and the
  background loops (6), the Legion sampler's statements among them, the live event stream relay
  and delivery hub (4), document settlements (4) and the document rooms' browser appends (8) each
  draw from a pool of their own. The lease pool holds a connection for each of the 24 callers that
  reserve one at boot (the 18 leased names, the CI reconcile pass's, the embedding project-key
  fill's and the Legion sampler's among them, the four callers of the delivery intakes' holds
  and the two of the keyword fill's hold) and 2 spare, 26 where it held 24 with none spare; and
  `duty.Exclusive` skips a pass that finds no lease connection free within 2 seconds until its
  next tick. Every
  connection names its pool in `application_name` (`dispatch-requests`, `dispatch-background`,
  `dispatch-live`, `dispatch-settlements`, `dispatch-rooms`, `dispatch-room-appends`,
  `dispatch-health`, `dispatch-listen`, `dispatch-leases`, `dispatch-outbox`,
  `dispatch-compaction`, `dispatch-text-trees`, `dispatch-horizon`, `dispatch-registry`), after
  the connection string's own name and a slash where it names one (`<name>/dispatch-requests`,
  the name cut so both fit the 63 bytes Postgres shows), and a wait for a connection is bounded on every pool but
  three: 3 seconds for a request's, a document load's, a live reader's or the event horizon's, 30
  for background work, settlements, compaction, the display tree fill and the rooms' appends, 2
  for a lease and 10 for a LISTEN dial. The outbox, the
  registry and the health probe have no bound, since no caller of theirs waits behind another
  (the outbox's pool has one connection for its scan and one for its hold renewal); the health probe bounds its own wait, dial and query together at 2 seconds instead.
  A database's connection limit must allow 115 a process.
