kind: Added
body: 'GET /api/v1/issues/{key}/events and GET /api/v1/artifacts/{id}/events take an optional exclude_types query parameter: at most 50 comma-separated event types the page leaves out before limit counts it, with order, after, before and ids unchanged. An unknown type or an empty value is 400 INVALID_QUERY, and the issue feed''s ETag covers the set.'
