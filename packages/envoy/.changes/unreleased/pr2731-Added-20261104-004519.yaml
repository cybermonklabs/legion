kind: Added
body: Dispatch records where Legion's time goes. A per-project setting names the Legion daemon whose state Dispatch reads (`GET /api/v1/settings/legion`, and `PUT` and `DELETE /api/v1/settings/legion/{project}`, each a deployment-scoped write), and one replica reads every configured daemon's `GET /legion/v1/state` each minute under a lease and records what changed. `PUT /api/v1/legion/{project}/settings` relays an operator's `legion.yaml` change to that project's daemon, as Dispatch's own projected ServiceAccount token (`DISPATCH_LEGION_DAEMON_TOKEN_FILE`), and answers the daemon's per-key result unchanged. The Delivery page's Legion section draws, for each project with a Legion setting, the work time to merge, each worker's phase hours, the review rounds and what Legion filed against what it finished, from the project's Legion evals (`GET /api/v1/evals?kind=legion`), and `GET /api/v1/projects/{key}/legion/board` serves the Legion view on the Issues page.
