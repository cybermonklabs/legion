kind: Added
body: |-
  A person's pod, a pod whose account `BROKER_POD_OPERATORS` maps to a person, names its Dispatch
  projects as that person's session does, so the pod sees no more than the person's own session.
  `agent-secrets enroll --pod` sends the list `AGENT_SECRETS_PROJECTS` holds, or `--projects` over
  it, and the broker takes it only when Dispatch says the person may see every project on it. A
  restricted member's pod enrolls nothing, naming projects or not, as that member's machine login
  does (`403 RESTRICTED_MEMBER_ENROLLS_NOTHING`); a full member's pod naming a project the person
  may not see is refused `403 PROJECT_NOT_VISIBLE`; while Dispatch cannot be reached, a person's
  pod enrolls nothing (`503 MEMBER_KIND_UNCHECKABLE`). The pod's list, not its account's
  `BROKER_EXCHANGE_ACCOUNTS` project, is what it names for a private project's secret, and each
  release asks Dispatch again whether the person still sees the project; once the setting no
  longer maps the account, the pod names no list of its own. So while both settings map a pod's
  account, its grant of a secret of the private project `BROKER_EXCHANGE_ACCOUNTS` maps it to ends
  at the grant's next release unless the pod's list names that project. The pod cannot add the
  project to a live enrollment: `enroll --pod` naming another list is refused
  `409 ALREADY_ENROLLED` while the old lease lives, from a new key directory too, so a new pod, or
  the same pod once its old lease has lapsed, enrolls with the new list. Any other pod naming
  projects is refused `400 PROJECTS_NEED_A_PERSON`, and `enroll --pod` then names the setting the
  list came from, `--projects` or `AGENT_SECRETS_PROJECTS`, which a service's pod leaves unset.
