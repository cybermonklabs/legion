kind: Changed
body: |-
  Every `agent-secrets secret` form prints one line on standard error before its first call to
  the store, `agent-secrets secret <form>: using <source>: <principal>`, naming where the
  credential came from (`the gcloud configuration NAME (CLOUDSDK_ACTIVE_CONFIG_NAME)`, `the AWS
  profile NAME (AWS_PROFILE)`, `the metadata server`, and the rest) and whom it acts as: the
  account, with `impersonating SA` where gcloud impersonates one, the AWS ARN, or `principal
  unknown` for a lent token, an `authorized_user` file and a gcloud token from a file. The
  metadata server's account is read best effort, within a short deadline, and a slow or failed
  read never keeps the command from signing in: the line then names it `this machine's or this
  pod's identity`. A store refusal names the same credential and how to choose another: on Google
  Cloud `a gcloud configuration in CLOUDSDK_ACTIVE_CONFIG_NAME, an account in CLOUDSDK_CORE_ACCOUNT,
  or a credentials file in GOOGLE_APPLICATION_CREDENTIALS`; on AWS `AWS_PROFILE`. No userinfo or
  tokeninfo call is made to name a principal.
