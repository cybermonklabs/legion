kind: Fixed
body: |-
  A role message no longer reaches a session that does not hold the role when the listener's
  wire rules or the envelope's own refuse it. When the role's claim names another session, or
  none, the session relay now copies such a message to the role's kept lane, so the holder
  receives it, as it copies every other. The relay, a takeover pass and the kept lane's walk now
  read a role message by JSON alone, so a takeover also copies such a message to the next
  holder. A role message that JSON does not read as an envelope reaches no session: the relay
  acknowledges it, logs `listener session relay ended a role message that cannot be decoded`
  once with the session, the role, the holder, the stream sequence and the decode error, and
  counts it in `envoy_role_kept_undecodable_total{path="relay"}`. A session that holds the role
  still receives its role messages as before.
