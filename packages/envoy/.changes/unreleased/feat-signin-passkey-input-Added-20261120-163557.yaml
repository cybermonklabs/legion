kind: Added
body: |-
  `envoy-infra:gcp:Dispatch` takes an optional input `signInPasskey`. `signInPasskey: true`
  renders `DISPATCH_SIGNIN_PASSKEY=1` on the app's container right after
  `DISPATCH_OUTSIDE_ORIGIN`, which turns on Dispatch's passkey sign-in at `outsideOrigin` for
  people from outside the company. It needs `outsideOrigin` and does not need the sign-in inputs.
  It is refused without `outsideOrigin`, beside `iapAudience` (IAP signs a person in), in the
  sandbox and under `clusterOnly`, each time naming `signInPasskey`. With it unset the component
  renders exactly what it rendered before. An `envoy-dispatch` that predates the setting ignores
  it.
time: 2026-11-20T16:35:57Z
custom:
    Issue: feat-signin-passkey-input
