kind: Fixed
custom:
  Issue: pr4238
body: |-
  A listener's KV caches (sessions, role claims, interests, known sessions, CI state) no longer
  drop or miss a record another listener writes while a cache is being read: a completed read
  holds every key the bucket held at the barrier it writes (a delete marker on `_kvwatch-barrier`),
  and removes a row only once the stream's leader says the bucket holds no record of it.
  Each read costs one barrier write, usually one STREAM.INFO when the barrier's acknowledgement
  arrives before the read's consumer has reached it, one key listing (one STREAM.INFO per page of
  100,000 keys, normally one page, and one more for each step back past a key removed between two
  pages; 64 KB for 1,055 sessions) and one leader read per key the read did not deliver, usually
  none. A list of any size is taken while the bucket is written to. A read the stream cannot
  answer keeps every row, fails and is read again, and `/healthz` reports reads that fail, or keep
  waiting, to settle past their barrier for longer than the stale bound, the known-session store's
  among them.
