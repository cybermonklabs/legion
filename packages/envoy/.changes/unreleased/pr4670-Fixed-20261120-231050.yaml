kind: Fixed
body: |-
  Meaning search keeps each project's vectors in an index of their own and reads only the projects its caller sees, so content of a project the caller cannot see no longer takes the caller's own matches out of the answer.
  `embeddings` is now partitioned by project. A migration builds the new table beside the old one; the boot's embeddings fill copies the stored rows in the background (71 to 82 minutes for a million rows on a production-size bench) and swaps the tables when it is done, holding them for about a third of a second (247 to 341 ms on the bench), and search reads the old table, at the width it read before, until then. The copy needs free disk for a second copy of `embeddings` and its indexes.
  The swap waits while the fleet holds a build of another commit than the process making it - a registered process of one within the registry's prune age (10 minutes), or a dashboard publish by one within the hour, recorded under the publishing build's own commit (`dashboard_publishes`, so a release that ships the same web files as the one before is not taken for it; an image build publishes before it registers, and a server run with no web files is seen only once it registers) - reads the fleet again under its own locks, and logs one line per try naming the commits it waits on, because no release before this one can run its coverage pass over the partitioned table. Do not roll back past this release once the swap is made, and count a rollback begun as the swap commits as one after it: the earlier release's coverage pass then fails on every tick (`SQLSTATE 42P10`) and stops at that insert, so it adds no missing row, repairs no stale one, and after an embedder change neither drops nor re-admits another identity's vectors.
  Before it takes any lock the swap counts both tables; a copy whose row count differs from `embeddings` is emptied and copied again rather than refused, so no reader queues behind a swap that cannot succeed. A write that bypassed the mirror and left the counts equal is not caught, so make no write as a replica while the copy runs. After the swap the fill analyzes `embeddings` itself (`ANALYZE ONLY`, or `ANALYZE embeddings` on a database before PostgreSQL 18); a project created meanwhile waits for it.
  The census now refuses a marked concurrent index build on a partitioned table, which Postgres cannot build (SQLSTATE 0A000), and `internal/dispatch/store/README.md` says how an index is added to the partitioned `embeddings`. The test template migrates in the order a deployment that swapped takes, so a later migration runs in CI on the partitioned table.
  A project gets its partition in the transaction that creates it, also when it is written as a replica, beside its first issue in one statement, or as the swap commits, and a row of a project that does not exist is refused.
  After the swap a full member's search reads one index per project, each walk gathering 20 vectors before it answers (`hnsw.ef_search`, 400 on the one index before): on the bench a full member's meaning search answered at p50 1,491 and 1,482 ms against 1,471 and 1,458 ms before, and its recall@20 against an exact scan rose from 0.960 and 0.949 to 0.988 and 0.993. The related-item check's search of the other projects reads only the partitions of the projects its writer sees, as search does.
  The pre-deploy census now measures a partitioned table by its partitions, and `envoy-dispatch erase` lists each `embeddings` row it leaves once, under `embeddings`, by that table's key `(kind, id, project_key)`, and not again under the partition that stores it nor under the copy the fill builds before the swap.
