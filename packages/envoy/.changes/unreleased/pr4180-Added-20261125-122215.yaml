kind: Added
body: |-
  A comment can anchor on a node (a lens, a finding, a risk, a constraint or a result) with the
  anchor input `node`, quoting the node's plain text; `?node_anchor=true` on the two comment reads
  answers the anchor with the node's state. Every write of a comment's anchor also places the
  comment under the node it quotes. A comment's `artifact` may name the issue's tree artifact, so a
  comment anchors on a criterion or a block of the issue's own fragment, and the tree read answers
  a document anchor's zero-based `occurrence` within its block, none once the anchor is orphaned.
