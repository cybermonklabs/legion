kind: Added
body: |-
  A `plan_task` block of a Dispatch document names the block it stands under in its new `parent`
  attribute, which holds at most one reference. This release reads `parent` and creates it from
  the next release. So a write that puts `parent` into a document that holds none is refused. The
  block schema moves to version 7, and store migration 20261127114415 adds the attribute's node.
  At version 7 a build also creates `check`'s `subject` and `program`, which version 6 reads. A
  test process started with `DISPATCH_TEST_CREATE_STAGED=1`, beside `DISPATCH_TEST_HOOKS=1`,
  creates each element its manifest stages for the next version.
time: 2026-11-27T11:44:15Z
custom:
    Issue: plan-task-parent
