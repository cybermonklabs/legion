kind: Added
body: |-
  The secrets broker answers an edge listener which repositories the issues of one of its
  projects resolve to: `GET /v1/project-repositories?project=<KEY>` relays Dispatch's
  `GET /api/v1/access/projects/{key}/repositories` as `{"project", "repositories": [...]}`, read
  from Dispatch on every call and never kept, at `BROKER_PROJECT_ACCESS_URL` with the account token
  the project access check presents. An edge listener is a `BROKER_NATS_SERVICES` entry of the new
  kind `edge-listener`, `edge-listener/<machine id>/<KEY>[,<KEY>…]=<account>`, which lists the
  projects it serves, at most 16; it calls with the identity token a `BROKER_API_ACCOUNTS` caller
  presents. Any other account is `403 NOT_AN_EDGE_LISTENER`, and a project its entry does not list
  `403 PROJECT_NOT_LISTED`, before Dispatch is asked. Dispatch's 503 or any other refusal, no
  answer within 2 seconds, a body the broker cannot read and an unset `BROKER_PROJECT_ACCESS_URL`
  are each `503 REPOSITORIES_UNKNOWN`, never a list; a 17th call of one edge listener waiting on
  Dispatch at once on one broker process is `503 REPOSITORIES_BUSY`, a guard on Dispatch's load
  counted in each process (16 × N on N replicas), not a security bound. No Dispatch release serves
  that route yet, so until one does every such call is `503 REPOSITORIES_UNKNOWN`. The broker reads
  the edge-listener entries whether or not it runs the NATS auth service: `BROKER_NATS_SERVICES`
  set alone, with only edge-listener entries, starts no auth service and needs no NATS audience,
  and the boot's `NATS auth service state=off` line counts them. Any other entry still needs
  `BROKER_NATS_URLS` and the three seed files. The NATS auth service refuses an edge listener's
  own connection: this release holds no edge listener's NATS grant.
