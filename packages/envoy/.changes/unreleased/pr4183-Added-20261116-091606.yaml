kind: Added
body: 'spec-check compares a directory of spec files with an approved spec and prints the approved text. `spec-check compare --dir <dir> --approved <approved.json>` names each statement, check, component, interface or term whose text the approved spec never held, with its file and line. When the approved spec held every text, it names each approved node of each kind that the files do not hold at its current text, and each node that the files hold and the approved spec removed. It makes no comparison, with exit 2, when the files hold a document that the reader cannot read into its node, a value that its node drops, or a document that is not as print writes it; a problem of form that keeps each node, such as a value that the schema refuses and the node keeps, does not stop it. With `--allow-empty`, it reads a directory that does not exist or holds no spec file as the empty tree, so after a revert of the last spec file each approved node reads as not in the files. `approved.json` has one definition, which its writer and the commands that read it share: `at` is an RFC 3339 time as `time.RFC3339Nano` writes it, with an upper-case `T` and `Z`, and a field written in other letters, a field given two times, a byte that is not UTF-8 or a file with no `nodes` list is refused. A value of another type than the form needs is refused with the form and the place of the value, in words that name no Go type. A refusal prints a place or a node id of more than 100 bytes as its first and its last 50 bytes with `…` between them. `spec-check print --approved <approved.json> --id <id>` writes the current approved document of a node, and of each check of a statement, for a change to copy into the files. R2 of The Spec gives the comparison at each push to Dispatch. This release adds the comparison logic and the command, and two parts that keep the comparison out of CI jobs. `compare` refuses to run when `GITHUB_ACTIONS` is `true`, which covers a step that passes the runner''s environment on to it and not one that drops that environment, such as `sudo` or a container. `CI=true` alone, as an agent''s shell sets it, does not stop it. `spec-check guard --root <dir>` reads each workflow, action and script under `.github/workflows`, `.github/actions`, `.github/scripts` and `scripts` as text, and fails when it reads no workflow. The guard names each place of a CI file where the command''s name and then the word `compare` follow each other with only white space, commas, `(` or `[` between them, and with quote characters (also a `$` before one), backslashes, and line breaks with the indentation after them ignored, a `sudo` line and a list of arguments in a script included. So it also names a comment or a quoted text that no shell runs, and the author rewords that line, as the guard''s line for each place says. The name is `spec-check` as a word of its own, so a job, a key or a tool whose name only holds it is not named, and `compare` is a word of its own too. Each bound reads the file''s own bytes. Right before the name, a letter, a digit, `_` or `-` makes the name part of another word. Right after `compare`, a letter, a digit, `_`, `-`, `.` or `/` makes `compare` part of another word or a path, such as `compare-all`, `compare.sh` or `compare/`. Each other byte ends the word: white space, a quote, `;`, `|`, `&`, `(`, `)`, `<`, `>`, a comma, a bracket, and the start or the end of the file. A backslash right after `compare` is an escape, and the byte after it takes its place. A quote there ends the word only when no letter, digit or `_` follows the quote, so `"compare"d` and `compare\"d` are other words. After a backslash, `n`, `t` and `r` stand for white space, so `\n`, `\t` and `\r` end the word on each side, as a backslash before a space or a line break does after `compare`. So a name right after `\7` or `\-` is not named, nor `compare` before `\x20` or `\x64`, and `run: "set -e\nspec-check compare …"` and `"spec-check compare".split()` are named. The rule reads the file''s bytes and runs no shell expansion, so it does not find a command that an expansion, an escape or an alias builds, one with another word between the two, such as a redirection, a here-document or an image (`docker run --entrypoint spec-check <image> compare`), or a `run: |` block whose two line continuations need the indentation after one kept and after the other removed. Before the name, only `\n`, `\t` and `\r` of the escapes stand for white space; each other escape or expansion of one language that builds the boundary is outside the claim (`\x20`, `\x0a`, `\012`, `\u000a`, PowerShell''s `` `n ``, a batch file''s `%~dp0`, `$1`), and so are `\0` right before the name or right after `compare`, a NUL byte that Bash skips or stops at, `\t` between the two words, and a letter, a digit or `_` right after the quote that ends `compare`, which Bash reads as more of the word and another language can read as its next token, such as Python''s `f` or `r` prefix (`"compare"f" --dir"`). It is no defence against an author who hides the command: `compare` itself refuses to run in a CI job. CI runs the guard on each pull request that changes those files. Each subcommand of spec-check exits 2, with one line on standard error, when a file or a device on its standard output does not take all of its text, such as a full disk. A pipe whose reader has gone ends the command by SIGPIPE instead, with no line. A standard output that is closed at the start reads as `/dev/null`, since the Go runtime opens `/dev/null` on it before the program starts, so the text is lost as with `>/dev/null`.'
