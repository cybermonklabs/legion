kind: Added
body: |-
    `roles.ForwardStoredTooLate(resolvedAt, storedAt, ackWindow)` and `roles.ErrForwardStoredTooLate`
    tell a forward to a role's holder that the stream stored later than the fence
    (`roles.ForwardFenceAge`) and the forwarding path's own acknowledgement window after the
    resolution that chose that holder. A path checks `roles.ResolutionTooOld` before it publishes,
    which bounds when the publish starts and not when the stream stores it: a process held between
    the two can have its copy stored after the role moved, where no takeover pass reads it. A zero
    resolution is never too late, as it is never too old. No caller asks either yet, so nothing
    changes behaviour.
