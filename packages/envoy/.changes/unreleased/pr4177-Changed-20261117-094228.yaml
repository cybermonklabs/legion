kind: Changed
body: |-
    `GET /api/v1/whoami`'s `project` is deprecated in favour of `projects`: it is the one project the credential's writes are held to, where they are held to one, and null for any other credential, so a broker-issued token scoped to one project still reads that project there.

    `PUT /api/v1/issues/{key}/steps/{id}`, `PUT /api/v1/issues/{key}/steps/{id}/rating` and `PUT /api/v1/issues/{key}/plans/{id}` read their issue, as the caller sees it, before they judge the writer: a key no issue holds, or an issue of a project the caller cannot see, is 404 ISSUE_NOT_FOUND whatever session the body names, where a writer other than the project's daemon was 403 STEP_WRITER first, and the rating route refuses a body with no rating after both. `GET /api/v1/issues/{key}/steps` answers such an issue 404 NOT_FOUND before it reads any run, and `GET /api/v1/projects/{key}/plans` answers a project the caller cannot see as a key no project holds.

    The live agent view relays a session's transcript only to a caller who may read all of it. A restricted member watches only a session tied to them alone, with a listener list that names only projects they see, or with none from a credential that sees every project they see (their browser, or a token that lists each; migration `20261121192718_session_content_restricted_credential`); while a project is private, everyone else watches a session whose listener lists only projects they see, or, where the listener lists none, one whose tied people see no private project they do not see. Every request of a caller who does not see every object refreshes Dispatch's stored copy of the listener's sessions before it reads or writes, since a list counts only while that copy is fresh. Dispatch ties a session to its person each time it verifies a broker-issued token for it, on a read as on a write (migration `20261121130000_session_owners`; `envoy-dispatch backfill-session-projects` records it for the events before), and answers a verified request whose tie cannot be written 503 DATABASE_UNAVAILABLE. No viewer but the session watches it once it reached a project the viewer does not see: an access change that takes a project from a person, and a listener record that lists a private project, record the pair in their own transaction, and a switch of a project from public to private, by the server or by an SQL statement alone, records it at its commit against every session whose listener list names it (migrations `20261121150000_session_reached_projects`, `20261121150500_route_roster_reached_projects`, `20261121173500_project_private_reached` and `20261121200500_project_private_listed`); nothing removes it. A switch to private hides what is written in the project from the switch on; it does not withdraw what sessions read while the project was public. The view asks its rule again before the session's replay and before each batch of frames. A short id a stored text writes resolves among what its author's person sees, a session's or a token's author included, at the write and at every rebuild. A result's line, on the record and its dry run, drops every word shaped like an issue key for a reader that does not see every object, whichever projects exist. While a project is private, every GitHub REST request that names a repository is held to it, a redirect elsewhere answered as a repository the App is not installed on, and the architecture import skips a stored source whose repository the repository rule hides from its project's readers. A repository mapping write of a project its writer does not see is answered before it takes any lock. A comment mention's Retry writes an attempt for a session its writer may not see failed in its claim transaction and resumes no pending attempt pinned to such a session, and the delivery sweep resolves a mention attempt as the comment's author.
