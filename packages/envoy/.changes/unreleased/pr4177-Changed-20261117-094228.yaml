kind: Changed
body: |-
    `GET /api/v1/whoami`'s `project` is deprecated in favour of `projects`: it is the one key of a one-key list, and null for any other list or none, so a broker-issued token scoped to one project still reads that project there.

    `PUT /api/v1/issues/{key}/steps/{id}` reads its issue, as the caller sees it, before it judges the writer: a key no issue holds, or an issue of a project the caller cannot see, is 404 ISSUE_NOT_FOUND whatever session the body names, where a writer other than the project's daemon was 403 STEP_WRITER first. `GET /api/v1/issues/{key}/steps` answers such an issue 404 NOT_FOUND before it reads any run.
time: 2026-11-17T09:42:28.109902541Z
