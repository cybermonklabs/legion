kind: Changed
body: |-
    `GET /api/v1/whoami`'s `project` is deprecated in favour of `projects`: it is the one project the credential's writes are held to, where they are held to one, and null for any other credential, so a broker-issued token scoped to one project still reads that project there.

    `PUT /api/v1/issues/{key}/steps/{id}`, `PUT /api/v1/issues/{key}/steps/{id}/rating` and `PUT /api/v1/issues/{key}/plans/{id}` read their issue, as the caller sees it, before they judge the writer: a key no issue holds, or an issue of a project the caller cannot see, is 404 ISSUE_NOT_FOUND whatever session the body names, where a writer other than the project's daemon was 403 STEP_WRITER first, and the rating route refuses a body with no rating after both. `GET /api/v1/issues/{key}/steps` answers such an issue 404 NOT_FOUND before it reads any run, and `GET /api/v1/projects/{key}/plans` answers a project the caller cannot see as a key no project holds.

    Every request of a caller who does not see every object refreshes Dispatch's stored copy of the listener's sessions before it reads or writes, since a list counts only while that copy is fresh. Dispatch ties a session to its person each time it verifies a broker-issued token for it, on a read as on a write (`envoy-dispatch backfill-session-projects` records it for the events before), and, while a project is private, answers a verified request whose tie cannot be written 503 DATABASE_UNAVAILABLE. A short id a stored text writes resolves among what its author's person sees, a session's or a token's author included, at the write and at every rebuild. A result's line, on the record and its dry run, drops every word shaped like an issue key for a reader that does not see every object, whichever projects exist. While a project is private, every GitHub REST request that names a repository is held to it, a redirect elsewhere answered as a repository the App is not installed on, and the architecture import skips a stored source whose repository the repository rule hides from its project's readers.
