kind: Added
custom:
  Issue: pr4392
body: |-
  The Go broker client and its public re-export, `packages/envoy/cipherclient`, gain three parts
  that the Legion daemon's own Dispatch credential uses. `MachineKey` answers the key a machine
  trade proves. In a pod, where `AGENT_SECRETS_MACHINE_IDENTITY` is `kubernetes` and
  `AGENT_SECRETS_KEY_DIR` names the role's directory, that key is the `key.pem` that
  `agent-secrets keygen` wrote there, and a file there that cannot be read, or holds no P-256
  key, is an error that names the directory by `AGENT_SECRETS_KEY_DIR` and never its path.
  Everywhere else the key is a fresh one, as before. `NewTokenTransport` presents a
  client's live token as `Authorization: DPoP <token>`, with a proof, on each request, and sends
  nothing when the trade fails. `Client.Drop` forgets a token that a server answered
  `401 BROKER_TOKEN_NOT_ACTIVE` for, so the next request trades again. The re-export also names
  `KeyDirVar` and `RoleKeyFile`, the variable and the file `MachineKey` reads the role's key from.
