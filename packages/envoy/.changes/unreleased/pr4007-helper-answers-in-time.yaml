kind: Fixed
body: |-
  `agent-secrets enroll --helper` and `unenroll --helper` no longer wait behind a call that
  `agent-secrets-helper` makes for itself. When the helper is trading the sign-in of the person
  signed in on the box, the command answers at the helper's 20-second bound with `ENROLL_FAILED`
  or `UNENROLL_FAILED` and `timed out waiting for <person>'s sign-in on this machine, which
  another call holds while it trades`: the helper sent the broker nothing, so the command made no
  enrollment and ended none. When the broker refuses the machine login's credential
  (`LAUNCHER_INVALID`) while the helper is refreshing that login, the command answers that
  refusal at the bound, and the refresh settles the credential. Without this, each of these
  waited the helper's own call out and was answered `ENROLL_OUTCOME_UNKNOWN` or
  `UNENROLL_OUTCOME_UNKNOWN` at 21 seconds.
