kind: Fixed
body: |-
  The dev and check scripts under `packages/envoy/scripts`, the Dispatch e2e harness's psql, `replace-blocks.sh`, `run-broker.sh` and `ci-check.sh`, the docs' broker rig and `scripts/search-measure/pg.py` no longer put a database password in a process's arguments, where every user of the machine reads it.
  psql and pg_restore get the URL without its password and the password in `PGPASSWORD` for that one command, through `scripts/lib/pg-url.sh` (and its TypeScript and Python twins, held to one shared corpus); a key=value connection string that holds a password is refused, naming its variable.
  Every broker the scripts start, among them `judge-check.sh`'s and `airlock-check.sh`'s extra brokers, and the listener and Dispatch of `dev-stack.sh`, get their settings in their environment, not on a command line, through `scripts/lib/exec-env.sh`, which keeps a readonly variable of the starting shell from reaching them.
  `pg-url.sh` traces no password under `set -x`, and refuses a raw `@` in a URL's hosts, which libpq would print in its error.
  `project-secrets-check.sh` and `callout-check.sh` hand `dev-stack.sh` a `--database-url` in `LEGION_TEST_PG_DSN`.
  No banner prints a password an operator supplied: `dev-broker.sh`, `dev-airlock.sh` and `dev-stack.sh` leave it out, and so does the `DATABASE_URL` line `restore-dispatch-dump.sh` prints for a `DISPATCH_ADMIN_URL`.
  `airlock-check.sh` k8a expects what the rules check has done since #4142: a judged entry that binds no host is valid.
