kind: Fixed
body: |-
  The dev and check scripts under `packages/envoy/scripts` no longer put a database password in a process's arguments, where every user of the machine reads it.
  psql and pg_restore get the URL without its password and the password in `PGPASSWORD` for that one command, through `scripts/lib/pg-url.sh`.
  The broker and Dispatch that `dev-stack.sh` starts, and k8a's broker in `airlock-check.sh`, get their settings in their environment, not on a command line.
  `project-secrets-check.sh` and `callout-check.sh` hand `dev-stack.sh` a `--database-url` in `LEGION_TEST_PG_DSN`.
  No banner prints a password an operator supplied: `dev-broker.sh`, `dev-airlock.sh` and `dev-stack.sh` leave it out, and so does the `DATABASE_URL` line `restore-dispatch-dump.sh` prints for a `DISPATCH_ADMIN_URL`.
  `airlock-check.sh` k8a expects what the rules check has done since #4142: a judged entry that binds no host is valid.
