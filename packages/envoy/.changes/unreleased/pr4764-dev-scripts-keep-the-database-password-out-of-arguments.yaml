kind: Fixed
body: |-
  The dev and check scripts under `packages/envoy/scripts`, the Dispatch e2e harness's psql, `replace-blocks.sh`, `run-broker.sh`, `run-server.sh` and `ci-check.sh`, the docs' broker rig and `scripts/search-measure` no longer put a database password in a process's arguments, where every user of the machine reads it.
  psql and pg_restore get the URL without its password and the password in `PGPASSWORD` for that one command, through `scripts/lib/pg-url.sh` (and its TypeScript and Python twins, held to one shared corpus); a key=value connection string that holds a password is refused, naming its variable.
  Every broker the scripts start, among them `judge-check.sh`'s and `airlock-check.sh`'s extra brokers, and the listener and Dispatch of `dev-stack.sh`, get their settings in their environment, not on a command line, through `scripts/lib/exec-env.sh`, which keeps a readonly variable of the starting shell from reaching them and copies no `SHELLOPTS` or `BASHOPTS` into a broker.
  `run-server.sh` hands its server `DATABASE_URL`, its throwaway App key and the sign-in keys in its environment, not in the arguments of `held-port.py` and `env`.
  `scripts/search-measure/run_search.py` reads the fixture's database URL from `FIXTURE_DATABASE_URL`; its `--fixture-dsn` option is gone.
  `pg-url.sh` and `exec-env.sh` trace no password or setting under `set -x`, and the three URL splits refuse a raw `@` in a URL's hosts, or between its first `/` and its `?` (a password's raw `/`), either of which libpq would print in its error.
  `project-secrets-check.sh` and `callout-check.sh` hand `dev-stack.sh` a `--database-url` in `LEGION_TEST_PG_DSN`.
  No banner prints a password an operator supplied: `dev-broker.sh`, `dev-airlock.sh` and `dev-stack.sh` leave it out, and so does the `DATABASE_URL` line `restore-dispatch-dump.sh` prints for a `DISPATCH_ADMIN_URL`; `bun run dispatch:local`'s hand-over prints a `DATABASE_URL` a person gave without its password, and asks for it in `PGPASSWORD`, where its command's psql reads it.
  `airlock-check.sh` k8a expects what the rules check has done since #4142: a judged entry that binds no host is valid.
