kind: Changed
body: |-
  `scripts/dev-stack.sh` reads each process's readiness again after 0.05, 0.1 and 0.2 s before it
  settles to every 0.25 s, so a stack is ready sooner. Its 60 s bound stays, and so does its look
  at each process it waits on: a read that comes back empty while that process is gone still
  fails the start.
