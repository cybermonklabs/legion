kind: Fixed
body: |-
    A listener or Dispatch server whose start raises a KV bucket's copies (`ENVOY_NATS_REPLICAS` above the bucket's) no longer fails after a fixed 10 s while the raised stream elects its leader. nats-server answers the raise of a one-copy stream at once, and the stream then has no leader until its new copies elect one, which took up to 11.9 s under load; the start now reads the stream until it has a leader and every copy is current. A request a start sends that the server leaves unanswered is sent again until it is answered, where it was sent at most three times, and two reads (of a found bucket's stream, and of the session bucket's maximum age) only once: the create of a bucket of more than one copy is answered only at its stream's first election. An update of a stream that draws no answer (a bucket's raise or maximum age, the `ENVOY_NOTIFICATIONS` reconcile, a keeper pass) is sent again, made from a fresh read of the stream, while the stream does not hold it, where it failed at its own 10 s wait and named the setting it asked for, `ENVOY_NATS_REPLICAS=3: context deadline exceeded`, though the server had refused nothing.

    A start that creates a bucket or the `ENVOY_NOTIFICATIONS` stream with more than one copy, raises the stream, or finds one that another program raised or created a moment before (whatever the start's own `ENVOY_NATS_REPLICAS`), answers only once the stream has a leader. Before, the first write after such a start could draw no answer (`nats: no response from stream`, or a publish's `context deadline exceeded`). The stream's ensure that runs at each NATS reconnect waits only for a create or a raise it makes itself, and not for a stream it finds with no leader, so the cache rewatches after it still run; a stream with no leader that must be reconciled still fails the run, as it did before, since that update fails at once while the cluster has no quorum. A create or a raise the reconnect hook makes itself is still waited out to the stream's leader, up to the hang guard, and that wait protects no write: no publish waits for the hook. Dispatch's server, which connects in the background, makes its first ensure through that hook, so its writes are not held for the stream's leader.

    Each of these waits ends on its fact, on the server's own error, on the caller's context, or at the start's hang guard: 36 s for one bucket's open and for one ensure of the stream, three times the slowest wait measured. A start the guard ends fails naming what it waited for, for example `raise KV_<bucket>: 3 copies were not current when the wait ended: the stream has no leader yet: the start's hang guard passed after 36s: context deadline exceeded`.

    A request of a start or a repair that the NATS user's grant refuses now fails as soon as the server reports the refusal, naming it (`bus: NATS denied the publish to "<subject>": nats: permissions violation: ...`), where it waited out its whole request wait first and often reported only `context deadline exceeded`: a bucket's lookup, create and raise, a watch, the `ENVOY_NOTIFICATIONS` read and create, which waited three sends of 10 s each, and a durable consumer's create and delete (the listener's durable, Dispatch's take-over of a held durable). A refusal no retry can get past is not retried either: a listener whose grant refuses its durable's read or create exits at once with `subscribe refused, shutting down` and the refusal, where it polled the bind for 135 s and ended with `subscribe failed after max attempts, shutting down`; the self-health rebuild's wait for its durable ends at a refused read, where it read for its 3 s; Dispatch's take-over gives a refused delete or create up at its first try and releases the consumer lease, where it tried for 10 s with the lease held; a Legion wake report the grant refuses is given up at its first attempt, where it was published again for up to 5 min; and a kept role's handover whose forward, cursor write or lane read the grant refuses ends with the walk that met the refusal, where it walked the lane again for up to 10 min with the role's guard held (a refused forward or read is named at once, a refused cursor write once its 5 s publish wait ends). A refused read or write of a key names the refusal too, after its own wait, where it reported only `nats: timeout`; a read or write the server answers costs what it did before. A read of a stream's state the server leaves unanswered is read again after 630 ms, three times the slowest answer measured, and twice as long after each further one, where a start waited the full 10 s for it after the fact it was waiting for already held.

    `bus.EnsureKeyValue`, `store.Open`, `session.OpenSessionRegistry`, `session.OpenKnownSessions`, `cistore.Open`, `legionagents.Open` and `redeliver.OpenState` take a context as their first argument, `bus.SetKeyValueMaxAge` takes a context and the connection, and `redeliver.Sweeper.Open` takes the sweep's context. The WARN after a bucket's raise names the `stream` and no longer carries `bucket`, `replicas` or `deadline`, and `envoy nats kv bucket not applied yet, waiting` no longer carries `deadline`; a start that waits for a stream's leader logs `envoy nats stream has no leader yet, waiting`.
