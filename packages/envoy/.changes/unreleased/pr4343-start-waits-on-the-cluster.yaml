kind: Fixed
body: |-
    A listener or Dispatch server whose start raises a KV bucket's copies (`ENVOY_NATS_REPLICAS` above the bucket's) no longer fails after a fixed 10 s while the raised stream elects its leader. nats-server answers the raise of a one-copy stream at once, and the stream then has no leader until its new copies elect one, which took up to 11.9 s under load; the start now reads the stream until it has a leader and every copy is current. A request a start sends that the server leaves unanswered is sent again until it is answered, where it was sent at most three times, and two reads (of a found bucket's stream, and of the session bucket's maximum age) only once: the create of a bucket of more than one copy is answered only at its stream's first election.

    A start that creates a bucket or the `ENVOY_NOTIFICATIONS` stream with more than one copy, raises the stream, or finds one that another program raised or created a moment before (whatever the start's own `ENVOY_NATS_REPLICAS`), answers only once the stream has a leader. Before, the first write after such a start could draw no answer (`nats: no response from stream`, or a publish's `context deadline exceeded`).

    Each of these waits ends on its fact, on the server's own error, on the caller's context, or at the start's hang guard: 36 s for one bucket's open and for one ensure of the stream, three times the slowest wait measured. A start the guard ends fails naming what it waited for, for example `raise KV_<bucket>: 3 copies were not current when the wait ended: the stream has no leader yet: the start's hang guard passed after 36s: context deadline exceeded`.

    `bus.EnsureKeyValue`, `bus.SetKeyValueMaxAge`, `store.Open`, `session.OpenSessionRegistry`, `session.OpenKnownSessions`, `cistore.Open`, `legionagents.Open` and `redeliver.OpenState` take a context as their first argument, and `redeliver.Sweeper.Open` takes the sweep's context. The WARN after a bucket's raise names the `stream` and no longer carries `bucket`, `replicas` or `deadline`, and `envoy nats kv bucket not applied yet, waiting` no longer carries `deadline`; a start that waits for a stream's leader logs `envoy nats stream has no leader yet, waiting`.
