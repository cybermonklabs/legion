kind: Changed
body: |-
    `agent-secrets` sets no trust variable and writes no trust bundle for a command whose grant holds a name behind the broker's proxy when the machine's system trust bundle already trusts every root the proxy's release carries and the command's environment shows that each client family reads that store: `SSL_CERT_FILE`, `CURL_CA_BUNDLE`, `REQUESTS_CA_BUNDLE`, `NODE_EXTRA_CA_CERTS`, `GIT_SSL_CAINFO`, `CLOUDSDK_CORE_CUSTOM_CA_CERTS_FILE`, `AWS_CA_BUNDLE` and `GRPC_DEFAULT_SSL_ROOTS_FILE_PATH` each name, by an absolute path, a file that holds every root, and `UV_SYSTEM_CERTS` is on. Those are the nine settings a pod image or a launcher session sets for Node, Python `requests` and httpx, uv, git, the AWS CLI, gcloud and gRPC's C core, which read their own roots otherwise. `NODE_USE_SYSTEM_CA` does not count: Node reads it only from v24.6.0 and v22.19.0, while every Node from v7.3 reads `NODE_EXTRA_CA_CERTS`. An empty `GIT_SSL_CAINFO` does not count either: git reads it as an empty CA file and fails every HTTPS request. Because git reads `GIT_SSL_CAINFO` after every level of its configuration, a gitconfig's `http.sslCAInfo` is no part of the answer. The command then keeps its trust variables and `WGETRC` as it has them, and nothing is written under the runtime directory. The system trust bundle is the first of the usual files that exists (`/etc/ssl/certs/ca-certificates.crt` on Debian), read with no variable: git and wget built on GnuTLS, as Debian's are, read that file and neither `SSL_CERT_FILE` nor `SSL_CERT_DIR`. The environment `agent-secrets` reads for this is the one the command will run with, the released values in it, so a released trust setting counts as the command's own.
    Every other command gets the bundle as before: one that lacks one of the nine settings (a shell started before they were set, a runtime that passes on only some variables, a `systemd-run` unit), one whose store lacks any root of the release (while the proxy's root changes, a release carries two roots, and a store that holds one of them still gets the bundle), one whose release carries no root that parses, one with a trust variable naming a file that lacks a root or cannot be read, and one with a trust setting given as a relative path, which the command may resolve from another directory than the one it starts in. So does any command with an `SSL_CERT_DIR`, even an empty one, whatever its directories hold: Node's system store, uv and httpx read it in place of the system's directory, and read it differently (Node v24 takes the whole value as one path and an empty value as set; httpx finds a root only under its hash link). So does one whose wget startup files leave wget without a root: wget reads the system wgetrc (the file `SYSTEM_WGETRC` names, else `/etc/wgetrc`) and then the file `WGETRC` names, or `$HOME/.wgetrc` when `WGETRC` is unset or empty; the last `ca_directory` across them, which wget reads in place of the system store, must hold every root and not be empty, and a `ca_certificate` there only adds to wget's trust. Each file the decision reads is opened only when it is a regular file, without waiting, and read up to 1 MiB; a `ca_directory` of more than 4096 entries or 8 MiB in all gets the bundle, so a named pipe, a device or a large directory cannot stall `agent-secrets`. So does any command whose `WGETRC` or trust variable names a named pipe or a device, which the decision does not open (what then reads it, `SSL_CERT_FILE` with an https broker included, is below).
    When `agent-secrets` writes the bundle, it reads a named pipe or a device that `WGETRC` or a trust variable other than `SSL_CERT_FILE` names as before, except that it no longer waits on a named pipe that has no writer: such a pipe reads as empty at once, where before `agent-secrets` waited on it with no end. A pipe whose writer sends trust keeps it in the bundle (`CURL_CA_BUNDLE=<(cat corp.pem)` keeps `corp.pem`, and `WGETRC=<(...)` keeps its lines), a device reads as it gives, and a pipe or device that sends more than 1 MiB is read no further and adds nothing. A regular file is read whole, as before. A trust setting given as a relative path is read from the directory the command starts in, as before, and `agent-secrets` now names each such variable in one line on stderr. When the broker's URL is https, `SSL_CERT_FILE` is read first, as before this change, by `agent-secrets`' own connection to the broker, whose Go TLS client loads its roots from it before any bundle is written: a pipe there is drained by that read, so the bundle gets neither its roots nor the system roots; a named pipe with no writer stalls that connection until its timeout, and no bundle is written; a device that never ends, such as `/dev/zero`, is read there with no bound; and `SSL_CERT_FILE=/dev/null` adds nothing to the bundle, not the system roots. With a broker reached over plain http, such as the local stack's loopback one, that connection makes no TLS handshake and nothing reads `SSL_CERT_FILE` first, so the bundle writer reads a pipe or a device it names as it reads the other variables' (a pipe keeps its writer's roots).
