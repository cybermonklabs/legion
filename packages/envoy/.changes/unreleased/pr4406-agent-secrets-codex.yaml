kind: Added
custom:
  Issue: pr4406
body: |-
  `agent-secrets` sends a Codex CLI session's id (`CODEX_THREAD_ID`) with its requests. A shell
  that carries it beside Claude Code's or Oh My Pi's session id sends the id of whichever of the
  three is its nearest parent process. It names a process by its binary's name, reading Claude
  Code's npm binary `claude.exe` as `claude`; a host run through an interpreter, such as `node`,
  is not recognised.
