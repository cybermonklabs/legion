kind: Added
body: |-
  `POST /auth/passkey/register/begin` answers, beside the options `navigator.credentials.create`
  takes, `invitation`: `{project, made_by}`, the key of the project the link is for and the login
  of the owner who made it, which the enrollment page names before the person makes a passkey.
  At `DISPATCH_OUTSIDE_ORIGIN` every dashboard answer carries `Content-Security-Policy:
  frame-ancestors 'none'; object-src 'none'; base-uri 'none'` and `X-Frame-Options: DENY`, so no
  page of another site frames the enrollment page or the passkey sign-in. `GET /auth/whoami`'s
  `401 NO_IDENTITY` at `DISPATCH_OUTSIDE_ORIGIN` carries `"sign_in":"passkey"` with passkey
  sign-in off too, so the outside origin's sign-in page never offers a Google sign-in. The owner's
  link (`POST /api/v1/projects/{key}/access/people/{email}/invitations`) answers `made_at` beside
  `url` and `expires_at`, and the owner's access answer lists `open_invitations`, `[{email,
  made_at, expires_at}]` for each link of the project that can still enroll someone, with no
  token, so the Access tab drops a link it shows once something ended it, from this tab or
  another.
