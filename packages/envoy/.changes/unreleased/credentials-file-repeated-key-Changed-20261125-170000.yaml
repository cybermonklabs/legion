kind: Changed
body: |-
  `agent-secrets`' machine source refuses a credentials file that `GOOGLE_APPLICATION_CREDENTIALS`
  names when the file repeats a key: two keys of one object that Go's JSON decoder reads as one, the
  same name or the same name in another case, at any depth. Before, it read such a file, and its
  own check and Google's library could read different keys of it. The refusal names the variable,
  never the path, and stops the command as a file that is not JSON does. A file `gcloud` or Google's
  console writes repeats no key.
time: 2026-11-25T17:00:00Z
custom:
    Issue: external-account-x509
