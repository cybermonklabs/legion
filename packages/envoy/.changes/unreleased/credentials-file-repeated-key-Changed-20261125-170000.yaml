kind: Changed
body: |-
  `agent-secrets`' machine source refuses an `external_account` credentials file that
  `GOOGLE_APPLICATION_CREDENTIALS` names when the file repeats a key: two keys that Google's library
  decodes into one field, the same name or the same name in another case, at any depth. Before, it
  read such a file, and its own check and Google's library could read different keys of it. Keys
  the library decodes into a map, such as the header names under `credential_source.headers`,
  repeat only when they are equal, so a file `gcloud iam workload-identity-pools create-cred-config
  --credential-source-headers` writes with two header names that differ in case still loads. The
  refusal names the variable, never the path, and stops the command as a file that is not JSON
  does. A credentials file of another type is skipped as before.
time: 2026-11-25T17:00:00Z
custom:
    Issue: external-account-x509
