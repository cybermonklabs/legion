kind: Changed
body: |-
    Session registrations, interests and role claims are written by compare-and-set at the revision
    the listener read, merged again over the bucket's value on a conflict, then `503` with
    `Retry-After: 1` once a write's attempts are spent: 5 for a session registration
    (`writeAttempts`), 3 for an interest (`interestWriteAttempts`), 3 for a role claim's release or
    hand-back (`roleClaimReleaseAttempts`) and 1 for its renewal (`renewRoleClaim`); every
    read-modify-write keeps the JSON fields a build does not know.
    `/v1/messages/send` and `/v1/roles/set` read the session bucket before answering that a session
    their pod's cache has not seen is unknown.
