kind: Fixed
body: |-
  A rules host is now read by one grammar, the one spelling every request for it is compared in, which the broker reads at start, `airlock-check` reads, and `BROKER_AIRLOCK_TEST_AZURE_AUTHORITY` is read by: letters, digits and hyphens in labels of 1 to 63 characters with no hyphen at either end and no `--` as their third and fourth characters other than the `xn--` of an internationalized name, at most 253 characters, no leading, trailing or doubled dot, at most one leading `*.` as the wildcard, an internationalized name only as its punycode, and a last label that is not a number (`foo.123`, `foo.0x` and `0x` are refused; `123.foo` is read). It serves a host only where the airlock's own validation of a host accepts it, so every host that validation refuses is refused here first, with a reason, and none it would refuse is served. Case does not matter, since the airlock folds it: `API.GitHub.com` is served. The broker refuses to start with a host in any other spelling, and `airlock-check` refuses it, naming the entry, the host's position and why. A refusal repeats no text of the host but one exception, the form to write where there is one: `api.github.com` for `api.github.com.`, `xn--bcher-kva.example` for `bücher.example`, and an IP address's canonical form. What such a host would do if served depends on its spelling. A name with one trailing dot, and an IP address in its canonical form (`93.184.216.34`) or an IPv6 address in upper case, are decrypted and every request on them refused `sni mismatch`, because a client sends no TLS server name (SNI) for an address and drops the dot from the one it sends for a name, so the entry would carry nothing; a name the grammar refuses for another reason with a dot after it (`a_b.example.com.`, `foo.123.`) is refused naming both. An IP address in any other spelling (`2001:db8:7:0::1`, `[2001:db8:7::1]`, with a zone or a port) binds nothing, because the proxy reads the address a CONNECT names in its canonical form, so a CONNECT to it is tunnelled unread; one with a trailing dot is a name of numbers alone, which the resolver refuses. A name with an underscore, a reserved `--` label or an `xn--` label the IDNA lookup profile refuses binds when DNS answers for it, but is outside the LDH grammar public host names are written in. A port is named a port only when it is digits; `user:pw@slack.com` and `https:/slack.com` are refused as no DNS name.
  Every line the broker writes through slog or Go's `log` package - every line of the airlock's proxy port, its `broker: answer refused` refusal line and httputil's own lines among them, the standard logger's, the AWS SDK's, which the broker now writes as `broker: aws sdk` at WARNING, grpc's, now `broker: grpc`, and OpenTelemetry's internal errors, each rather than on stderr by a logger of the library's own - has each placeholder - `agent-secrets-placeholder-`, in any case, and at most the 32 letters and digits after it, up to where another placeholder starts - replaced by `[placeholder]`: the broker reads each JSON line its handler writes and writes again each string, keys and group names included, whose decoded text holds one, leaving every other byte as it was written, so a value is masked in the form the line holds it and a name a caller chose changes no other field of its line; a line that is no JSON object is written as a fixed line in its place. A value whose methods fail or panic is written as slog writes it (`!ERROR:…`, `!PANIC: …`), with a placeholder in that text masked too. grpc's `GRPC_GO_LOG_SEVERITY_LEVEL` and `GRPC_GO_LOG_VERBOSITY_LEVEL` no longer change what the broker writes, and grpc's lines no longer end in a newline. Before, two placeholders written together, or the prefix written before a placeholder, had the second placeholder's 32 characters written in clear after `[placeholder]`; a service that sent a placeholder as a trailer line had it quoted, as it was minted and uncut, in the line httputil writes to the standard logger, which now goes through the proxy's own log as `airlock proxy: net/http`; and a bound service that sent bytes after a whole answer had them quoted as minted on the standard logger by net/http's transport, which has no error log of its own and logs with `log.Printf`, and which the broker now writes through the same handler, its first line cut to 256 bytes. A placeholder in a `[]byte`, which the JSON handler writes in base64, and one encoded on purpose - percent-escaped, in fullwidth letters, with a separator after the prefix or an invisible character inside it, or its 32 characters alone - is out of the mask's scope, as are a library that writes to stderr or stdout itself (the Anthropic SDK's warnings, go-retryablehttp's default client, the pg_query WebAssembly module's stdout and stderr, and the Google client libraries' own logger when `GOOGLE_SDK_GO_LOGGING_LEVEL` is set and a client was given no logger; the broker's Secret Manager client is given one that drops every line) and the Go runtime's report of a crash.
  The lines net/http, net/textproto and httputil write, the error of `airlock proxy: upstream` and the `502` the proxy answers with it, and the reason of a failed Azure exchange, in its line and its answer, hold no run of bytes those libraries quote from a peer. They quote with `%q` what a service, a token endpoint or a client sent - an answer's bytes on an idle connection, a header, trailer or status line they could not read, an ALPN list - so each line of that text from its first quotation mark to its end is now written as `"[service bytes not shown]"`, whatever quotation marks it holds. A certificate that names other hosts than the one asked for is refused with an error that lists every name it holds and no quotation mark, so `airlock proxy: upstream`, its `502` and a failed Azure exchange's reason, line and answer now write `tls: the service's certificate is not valid for this host; the names it holds are not shown` in its place. Before, a bound service that echoed the Authorization header it was sent, which holds the real value the swap put in, after its answer had that value written on the standard logger, one that sent it as its status line or in its certificate's names had it in the `502` the command was given and in the upstream line, and a token endpoint that sent the federated token back as its status line, or named its certificate with it, had it in the exchange's refusal.
  A dial whose first address timed out on its own, and whose command then left while a later address was dialled, keeps the class `unreachable` rather than `cancelled`: only a cancel of the request, which is what a command's leaving is, makes a failure `cancelled`.
