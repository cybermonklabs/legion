kind: Changed
body: |-
    The `unresponsive` session state's rule in `docs/architecture.md` says that nothing starts a
    replacement for an unresponsive session while its last registration is 20 minutes old or less,
    and that past that Legion's controller relaunches a claim the session holds on that same
    session, which starts the claim's process again and replaces no session. The listener's
    behaviour does not change: it reads the states as before.
