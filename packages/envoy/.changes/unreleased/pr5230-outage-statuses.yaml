kind: Fixed
body: 'Envoy''s HTTP clients read a 408 as they read a 5xx or a 429, as a server that could not answer now (RFC 9110). Dispatch''s delivery to a session asks the listener again inside the take-over window on any of them but the listener''s own 500; Dispatch''s GitHub client counts a 408 from GitHub as a failed read, as it counts a 5xx, while the delivery reconcile still asks GitHub again within the call only for its own 502 and 504 and leaves a 408, 500 or 503 to its next pass; the embedding queue still bisects a batch an Azure 408 or 5xx other than 503 (or a Bedrock ModelTimeoutException or InternalServerException) answered and confirms the row with its canary, so one text Azure fails on every time holds up no other text, and when the canary fails too the background pace backs off; an Azure or Bedrock call that runs out of time is now such an outage too, so it no longer speeds the background pace up as an answered call does, and a canary that runs out of time backs it off; that pace now recovers by adding to its rate, from its slowest (one call each 5 minutes) back to its fastest in 32 untroubled calls, where it took about 6,000; the embedding queue keeps its claim on a batch''s rows through the pace''s wait before a call, which at the slowest pace outlasted the 2-minute claim, and through the call itself, which it now ends at 60 s on Bedrock as on Azure, renewing the claim first when the call could otherwise outlive it, so another Dispatch process no longer claims those rows mid-wait or mid-call and embeds them again; a Bedrock background call now carries at most 320,000 bytes of text, as an Azure one does: ten full-length single-byte texts, where the token budget alone let one call carry 25 (the size is Azure''s measured rate applied to Bedrock, whose own rate is not measured); the embedding queue logs a WARN, with no text, once it has scheduled the retry of a throttled group, which it retries whole; an agent loop model call answered 408 is retried once; the secrets broker reads a 408 or a 429 from Dispatch as Dispatch not answering, so a grant''s named approver may still revoke it, and the grant.revoked audit row of a revoke that went ahead with the approver''s member kind unread now carries member_kind_unchecked: true; and the load test retries a 408.'
