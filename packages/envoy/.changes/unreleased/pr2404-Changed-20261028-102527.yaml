kind: Changed
body: |-
    Every JSON line the listener writes carries `instance`, the process's name among its machine's
    listeners (`ENVOY_INSTANCE_ID`, else the host name, a pod's name in Kubernetes), and its main
    NATS client is named `envoy-listener <instance>`. Go's text log lines carry no prefix, so the
    deployed text metric filters still match.
