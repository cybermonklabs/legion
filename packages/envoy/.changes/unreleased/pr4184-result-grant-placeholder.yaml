kind: Changed
body: |-
  A CI run of a result entry (`BROKER_EXCHANGE_RESULT_WORKFLOWS`) now trades its GitHub token at the secrets broker's token endpoint for an airlock placeholder, `requested_token_type=urn:envoy:params:oauth:token-type:airlock-placeholder`, and never for an access token: the broker refuses such a run an access token with `invalid_request`, and grants no other identity a placeholder. The answer holds the placeholder (`agent-secrets-placeholder-result-` and 32 characters), its grant id `result:<id>` and the airlock release a command runs with. The broker keeps the grant in its database (`result_grants`), so every broker pod reads it, for fifteen minutes or `BROKER_ACCESS_TOKEN_SECONDS` when that is shorter, and its sweep deletes an ended grant. The trade needs no route to the broker's own public URL.

  Every broker with a profiles file (`BROKER_PROFILES_FILE`), with result entries or not, refuses to start unless the proxy block of its profile `DISPATCH_RESULTS_TOKEN`, where it has one, is of kind `dpop`, and holds it to the start check of every `dpop` block: one exact host and no `*.` name, which a host `BROKER_PROXY_PRIVATE_UPSTREAM` names, a non-empty allow list none of whose entries names every path, `Authorization` alone, and no block of another kind on that host; a broker with result entries refuses to start without the profile. Each refusal names what is wrong. `envoy-broker profiles check` runs the same check of the file. `BROKER_RESULT_GRANT_TEST_SECONDS` (1 to 900) sets a local stack's grant lifetime, and a production start refuses it. The broker's log masks a result placeholder whole.
