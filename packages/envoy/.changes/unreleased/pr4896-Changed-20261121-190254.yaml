kind: Changed
body: |-
  An issue's parent may be an issue of another project, on `POST /api/v1/issues` and on
  `PATCH /api/v1/issues/{key}`; Dispatch answered `400 PARENT_INPUT` "parent must be in the same
  project". The not-found, self, cycle and 32-link depth refusals still hold, counted across
  projects. A credential scoped to one project is refused a parent outside it with
  `403 PROJECT_SCOPE`, naming the parent and its project, as it is refused such a `blocked_by`
  target. A create meets either refusal right after its own project's scope check: before the
  external reference is resolved to an issue already imported, before the `400` refusals of its
  title, labels, priority, assignee, components and repository, and before the near-copy check,
  so it gets no `409 POSSIBLE_DUPLICATE` in its place and records no near-copy check. A PATCH
  that also closes the issue meets it before the close settles the issue's documents. The same
  credential is refused, with `403 PROJECT_SCOPE`, a result on a check of another project's issue
  (`POST /api/v1/issues/{key}/results` and its dry run) and the retraction of a result on such a
  check (`POST /api/v1/results/{id}/retract`): the results routes find a check among the issues
  above the recording one, which a parent of another project puts there. A parent of another
  project passes on no repository, components, architecture owner, `legion` label or assignee:
  the walks that resolve `resolved_repo`, an inherited component attachment, the architecture
  tree's owner, `legion_managed_status` and the delivery views' ancestors read only ancestors of
  the issue's own project, so such an issue takes its own project's default repository and is a
  root for each, and a create under it that names no assignee and acts for no person lands on
  its own project's default assignee rather than the parent's. The children list, progress,
  coverage and `advances` still read the tree across projects.
