kind: Fixed
body: |-
  A configured NATS server (`envoy.natsUrls`, `NATS_URLS`) is now named in the bus's lines and
  errors by its scheme and host alone. The connected and reconnected lines (`url=`), the
  authorization-refused and failed-reconnect lines (`servers=`) and the refusal of a server that is
  not this machine's dropped only a URL's user information and kept the rest, so a token in its
  query printed: `url=nats://nats.example:4222/?token=...`. They now print
  `url=nats://nats.example:4222`. An entry written as a bare host:port is named as
  `nats://host:port`, and one that does not parse, names no host, or holds an `@` past its authority
  as `(not printed: the value carries a credential or is not a plain http(s) URL)`.

  A NATS server URL that does not parse failed the connect with url.Parse's error, which quotes the
  URL whole, user and password included, and which the listener's start logs. The connect now fails
  with `bus: a NATS server URL: not a valid URL`, beside `ENVOY_NATS_SOCKS5_PROXY` and its proxy
  when one is set.
time: 2026-11-26T04:06:44Z
custom:
