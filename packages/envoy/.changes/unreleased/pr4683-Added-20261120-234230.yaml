kind: Added
body: 'A project can be private before its full switch: `DISPATCH_PRIVATE_BEFORE_FULL_SWITCH` names, comma-separated and read as `DISPATCH_PRIVATE_PROJECTS` is, the projects a deployment makes private before their full switch, and `envoy-infra:gcp:Dispatch`''s `privateBeforeFullSwitch` input renders it. Such a project''s switch to private needs no provisioning and no bus record (never `409 PRIVATE_PROJECT_NOT_PROVISIONED` or `409 PRIVATE_PROJECTS_UNAVAILABLE`), is still `409 PRIVATE_PROJECTS_INCOMPLETE` while the store cannot hold it, and Dispatch then hides it in its own reads as any private project. Until its full switch, the project''s notifications on the hub reach any agent session that subscribes to them. Its access carries `private_before_full_switch: true`, and the Access tab says beside its visibility that it is private before its full switch; the boot logs one INFO line naming it, and `/healthz` answers the fixed reason `private_before_full_switch` in `degraded`, naming no project. A key both settings name takes its full switch, and an entry that is not a project key is ignored with one ERROR line at boot and a warning at preview.'
