kind: Fixed
body: |-
    What one browser and a burst of open documents can cost a Dispatch server is now bounded, where
    a browser's edits over the document websocket were applied before any check. Every read-write
    browser's update now applies under an allowance ygo counts the apply against as it decodes it,
    under the roots that apply may name and the kinds of content it may not carry. Where any of them
    is broken, ygo rolls the whole apply back, so the room is left exactly as it was, and only that
    one browser is closed:

    - `4413 DOC_UPDATE_REFUSED` for bytes the decoder refuses, for content the Proof editor never
      sends (an embed, raw binary content, a subdocument, a root other than the document's own
      fragment and its margin, or a write of the list of clients a rebuild retired), and for an
      update that leaves a document this build cannot render where it rendered before. The
      dashboard drops only the refused edit.
    - `4413 DOC_TOO_LARGE` when the update would carry the document past the 1 MiB byte bound every
      server write obeys, or decode more than the 1,200,000 values one apply may decode. Past the
      bound an update may still carry 8 KiB of new content, for the editor's own derived writes and
      for typing, until the document has crept 64 KiB over it. After that only an update carrying
      nothing new is taken. The room also renders what each update leaves before it commits, and
      refuses an update whose rendering would end past the bound and its creep and larger than
      before: a few bytes that set a list's start number or delete a code mark's format items can
      grow the rendering by hundreds of kilobytes.
    - `4413 DOC_NEEDS_REBUILD` when the update would carry the room's encoded state past the
      16,777,216 bytes one room may hold, or the document past the 1,048,576 structs ygo decodes in
      one update, or when the room's edit-scan total is used up. The state cap charges each struct
      48 bytes besides its content, so structs that carry no content stop at it too. The decode cap
      counts the items a delete inside a run splits, so a delete of one character can no longer
      leave a stored document that will not load. A room whose scan total is used up still takes an
      apply that scans 64 items or fewer, so typing in place goes on. This close comes only from a
      room the rebuild route takes as it stands. Elsewhere the close is `DOC_TOO_LARGE`, or
      `DOC_TOO_TANGLED` for the scan total, since there a smaller edit lands.
    - `4413 DOC_TOO_TANGLED` when the apply's conflict scans would pass what the room allows that
      apply: 400,000 items, or what is left of the room's 1,000,000-item scan total.
    - `4413 DOC_REBUILT` when the browser still holds the edit history a rebuild replaced, which
      applied would put the old document beside the rebuilt one, or sends a delete of that history,
      which the rebuilt room could never land.

    One frame a browser sends may carry at most 64 MiB, four times the room's state cap, so four
    whole-state handoffs of a room at that cap fit in it.

    Content a browser's frame parks, because it waits behind an edit the room does not hold yet, is
    no part of the document until that edit arrives. The room relays and stores only what each
    apply integrated, and no read or first sync is served what parked. It answers a frame that
    parked as not applied, so the editor keeps the edit and sends it again, and it resyncs that
    browser once a later stored commit lands what the frame parked. The browser whose frame fills
    the gap is sent what its fill landed, as every other browser is. Such content that a server
    write lands - a catch-up of another process's rows, a published write - is held to the document
    bound as a browser's edit is, and the room stores that commit and credits it to the browsers
    connected as it does a browser's commit, so that browser is told only once a row holds it.
    Where the room cannot take a drain of parked content, it discards the drain and keeps the update
    that released it. Each browser that parked what was discarded is closed `4413 DOC_TOO_LARGE`
    where the drain would leave the rendering past the bound, `4413 DOC_UPDATE_REFUSED` where it
    would leave a document this build cannot render, and `4413 DOC_TOO_TANGLED` where its merge
    would scan or split more than the apply allows. Past the bound it is closed `4503 DOC_BUSY`
    instead where a server write released the drain, or where the update that released it changed
    nothing itself and what the drain started from is not known yet; the edit its editor then sends
    again is weighed as that browser's own.
    A parked delete range spends none of the decode cap's headroom, and the room budget charges each
    1,000 bytes on the room's live copy while it waits. A room parks at most 4,096 delete ranges and
    4,096 structs, so structs one writer parks under her own client id no longer lock a small
    document out of everyone else's edits, and an update that would park past either is answered
    not applied with its socket left open, since it waits on edits the room has not received yet.
    A stored history that would park past either, which only rows an earlier build stored can be,
    loads in no room: every read of it answers `409 DOCUMENT_UNLOADABLE`, its socket is refused
    `503`, the server logs the cap and what the history parks at each such read and room load, and
    the rebuild takes it from its own text, dropping only what it parked. The message of
    `409 DOCUMENT_UNLOADABLE` says that a rebuild keeps the document's text where Dispatch can still
    read it, and goes back to the latest saved version only where it cannot, and so does the
    dashboard's offer for that code, whose button reads `Rebuild this document's history` where it
    read `Rebuild from the latest version`.
    What the queue holds of content, the map keys of its structs included, is weighed as it holds
    it now, so content a later edit or a server write landed is no longer charged after it.
    A browser's edit is now answered saved only once the commit that holds it is stored. A frame
    that commits nothing, such as a reconnect's sync step 2 carrying only what the room holds, is
    answered saved only once every commit the room had made by then is stored, and a room that could
    not store a commit answers nothing saved again until it is loaded afresh. Where the store
    refuses an edit or the room fails, the editor keeps the edit and sends it again. The dashboard
    keeps another tab's saved edit until the server answers that edit itself as saved, rather than
    dropping it because its page already shows it. The other browsers still see the edit at once.

    Each page is now given a client id of its own for each document, from 2^32 up, in the socket's
    first frame, and the id is stored with the person it was given to. An update carrying edits
    under an id given to another person is refused `4413 DOC_CLIENT_ID_REFUSED`, and nothing of it
    is stored or relayed. So is one under an id from 2^32 up that no row names, unless the id is
    below 2^35, the document holds no edit under it and the page sending it presented an id of its
    own: that id is then stored as the sender's. So is a delete past what the room holds under any
    id the socket does not hold, which would otherwise wait in the room and delete that person's
    next edits as they landed, each answered saved. A socket holds the
    id it was given and each id its edits showed is its person's, and keeps every one while it is
    open, up to 128 besides its own; an edit that would make it hold more is refused the same way. A
    sync step 2 is judged the same way, so a reconnect that hands back another person's edit the
    room relayed and then lost is refused too, rather than answered saved without it. The dashboard
    then drops every saved edit under the refused id, reloads the document, takes a fresh id and
    sends its own saved edits again; after a refused sync step 2 it drops none, since the step 2
    names no edit of its own, and an edit of its own that waits on the lost one is held by the room,
    answered not applied, and lands once the other person's browser sends the lost edit again. A
    socket given an id carries presence only under that id, and a read-only socket's presence, which
    ygo discards, is not read at all; its sync step 2 over 2 MiB is answered not applied without
    being decoded, and one under it stops decoding past 3,328 values, so a step 2 of a million
    structs in 2 MB is answered not applied rather than decoded whole. A page admitted
    read-only stores no id: it is sent one that no row names, is given that one back at each
    read-only reconnect, so a reader's page is not reloaded at each, and keeps it once it is
    admitted writable, when it is stored. A person holds at most 64 ids in a document that no edit
    has landed under; past that a new page's admission gives back the one presented longest ago,
    never one an open page holds, and where every one is held it is refused `4503 DOC_BUSY` for the
    editor to retry. A page whose id was given back, or swept after 30 days unused, is given the
    same id at its next admission while no other person holds it, and another page of the same
    browser that replays what the first saved under that id lands it, the id then stored as that
    person's, counted against the same 64. Of two people whose edits reach such an id together, the
    first is given it and the second is refused. An id's row records an edit landed under it from
    whichever of its person's pages sent it, so an id under which a page replayed a closed tab's
    saved edits is no longer given back or swept. An edit counts as landed only once it is in the
    document, not while it waits behind an edit the room has not received; one that waited is
    recorded once the room has stored the commit that landed it, while its page is still
    connected. A socket that presents no id, such as a page of an earlier build, still writes: it
    claims an id below 2^32 that no stored history names. Every claim, on every kind of socket,
    counts against 64 claims a socket and 64 a person a document a UTC day, past either of which the
    update is refused the same way. An id the stored history names may be claimed only by a person
    who edited the document after the history first named it, and only for 30 days after the
    database first served
    this build. An edit under an id another person claimed, at clocks the room holds with different
    content, is refused rather than dropped in silence, where one update carries such edits under at
    most 4 claimed ids.

    The open documents are charged a memory budget under the Go soft memory limit the server now
    sets at boot, 90 per cent of its container's limit, so the collector works harder as the heap
    nears the limit instead of letting garbage pile up until the container is killed. One boot line
    names the limit read and the limit set. `GOMEMLIMIT` in the environment is used as it is, and
    `AUTOMEMLIMIT=off` turns the setting off. The budget is derived at boot from the limit the
    runtime holds, as the same share of it as 2 GiB is of the 3.6 GiB limit of a 4 GiB pod: 16 GiB
    under a 32Gi container. The load pool below takes three quarters of what the budget and the
    256 MiB read cache leave of the limit. The read cache and each socket's 70 MiB write queue stay
    as they are, and a second boot line names each bound.
    Dispatch reads and sets no `GOGC`, so the collector keeps the runtime's own ratio of garbage to
    live heap. With the budget full, the heap goal is the limit itself, and what the limit bounds is
    the memory a pod's kernel charges: what the runtime holds less what it has released. Measured
    that way, the heaviest work the server allows charged a 4 GiB pod at most 3,840 MiB.

    Each room is charged for both the copies it holds, at the greater of two measured prices: its
    encoded state at 17 bytes a byte, or the structs it holds at 630 bytes each. So a room whose
    structs outrun its state, as one delete of every other character of a long run makes, is
    charged for them. A browser's socket is admitted against that budget before the document loads,
    reserving what its room will weigh until the load charges it, and is refused `4503 DOC_BUSY`
    only once the admission has waited for the sweep it started to close the rooms nothing holds. A
    room the server itself opens over the budget is closed once nothing holds it, and the server
    opens one such room at a time. While the budget is full and nothing can be closed, a room takes
    only an update that integrates no struct, adds no byte of content and cuts at most 8 of its
    items, and over the whole of that pressure a room grows by at most 256 structs. So a full
    document can still be cut back, and every other update is refused `4503`.

    What is transient rather than resident is held by one pool of bytes, the pod's load
    concurrency: slots of 600,000,000 bytes, one in a 4 GiB pod and 16 under a 32Gi container. A
    whole-document decode, a live write's fork and one apply of a browser's update over 2 MiB, or
    of more than 3,328 structs however few its bytes, each take what their own copy costs, at the
    same two prices, the apply before any of the update is decoded. The answer to one browser's
    first sync takes the greater of 8 bytes a byte of the room's state, and 340 bytes a client the
    room holds with 4,096 bytes and 101 a struct for the frame
    being packed, up to the 16,000 structs a frame can hold, and 40 bytes more for each client the
    browser's own sync step 1 names. No taker takes more than one slot, so the heaviest waits for
    its turn rather than being refused: a stored document always loads and no honest handoff is
    turned away. The decodes that must not wait take their bytes only where the pool has them free
    at once, and otherwise run beside its holders: the second copy a room builds from a stored
    state, and what a room's persistence worker decodes as it stores a browser's update, its check
    of a history replaced under the room included, and as it compacts the room on its close.

    What the server holds for one browser's socket is bounded as well, at 70 MiB of frames queued
    for it and not yet written. ygo bounded that queue in frames alone, 512 of them whatever their
    size, so a socket that completed a room's handshake and then asked for the whole document over
    and over without reading an answer made the server hold 512 whole states: 1.5 GB of a document
    of a mebibyte of prose for the 21 KB it sent. A frame reaching such a socket once its queued
    bytes stand at the budget is refused and the socket closed, with its room logged. The budget
    clears every frame a room can send one socket, the whole state a browser hands back included,
    since a frame arriving while the budget or more waits closes a reading browser as readily as a
    silent one. So a browser on a slow link that falls behind a burst of someone else's typing
    keeps its socket and ends with the whole document, and a socket the budget does close
    reconnects and syncs afresh, as it does after any abrupt close.

    What a caller's write may spend is bounded too. A write waits at most 15 seconds at the pod's
    memory bounds and runs at most 45 seconds in all before it is answered 503, each taken from when
    its request arrived, so a write the pod has no room for is refused with three quarters and a
    quarter of a `dispatch` call's minute left to retry with, rather than left unanswered until its
    caller gives up and sends it again. At most 48 of the shared pool's 64 connections carry the
    API's open transactions at once. A request takes its place at its entry as soon as its caller
    resolves, before the artifact read, the lock and the copy a write would otherwise pay for and
    then be refused. A request whose caller does not resolve takes nothing, and a body that stops
    arriving ends at a read deadline of its own, so stalled anonymous requests cannot hold the limit
    against a signed-in person's write.

    A document no write can change is recovered by `POST /api/v1/artifacts/{id}/rebuild`, which now
    also accepts a history that loads but stands so near the decode cap, the state cap or the room's
    scan total that a write it must still take is refused. Its decode-cap test counts a write of the
    document's whole text, so a document an agent's uploads carried to within one upload of the cap
    is taken while a small write still lands. The route rebuilds such a history from its own text
    with the edits no version holds yet, closes this server's room for it first and retires the
    replaced history's clients, so no browser hands the old document back. A room this server holds
    decides on its own whether the document is near, so the rebuild never closes it and then
    refuses. Every rebuild keeps the document's block ids, its open comments', suggestions' and
    asks' anchors and its margin records, as far as a history that decodes or, for one that does
    not, the rows still record them. The dashboard offers that rebuild to the person whose edit was
    refused `DOC_NEEDS_REBUILD`, wherever the page's read of the document says it is near the decode
    cap (`near_decode_cap`, answered only where the route takes it), and after a write the decode
    cap refused on such a document, whose refusal now names the rebuild and its route. The three
    server writes that add no caller text (the block-id stamp, the sweep of unrecorded marks and
    settlement's repair of a returning answer) each ask whether the document their write would
    leave still decodes, and leave one they would carry past the cap as it was.

    These bounds are built on the ygo fork Dispatch pins,
    `github.com/theorem-labs/ygo v1.55.1-theorem.13`. It applies a browser's update whole or not at
    all under the allowance, roots and content kinds the room gives it, and reports what a refused
    apply's counters reached. It runs the room's render check after the apply and before its commit,
    keeps what parks out of the document until it lands, lets a delete range park only under a
    client id the room allows, and answers a frame only once its commit is stored. At this pin a
    keystroke into a document of 40,000 clients no longer walks every client for that check, the
    check is told which of its runs judges a drain, the room keeps no record of a server write
    as the sender of what that write parked, and an unsubscribed callback keeps nothing it captured
    reachable.
