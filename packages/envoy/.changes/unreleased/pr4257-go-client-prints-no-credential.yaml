kind: Fixed
body: |-
  `agent-secrets`, `agent-secrets-helper` and the token client print no part of these settings
  and files that can carry a credential. A URL setting (the sign-in issuer
  `AGENT_SECRETS_SIGNIN_ISSUER`, the approval page `AGENT_SECRETS_APPROVE_URL`, and
  `AGENT_SECRETS_MACHINE_AUDIENCE` where the metadata identity's description names it) prints only
  as the broker's address does, whole when it is a plain http(s) URL and as a fixed phrase beside
  its variable's name otherwise. A file that
  holds a credential (the token file `AGENT_SECRETS_MACHINE_TOKEN_FILE` names, the sign-in
  client's secret file, the sign-in store, `enroll`'s `key.pem` and key directory, `--pod-token-file`,
  the helper's operator, machine, identity-key and session-record files) prints as its variable or
  flag, never its path, which for a person who pasted the credential itself into the variable is
  the credential: a file call's error prints its operation and the system's reason alone, and a
  file that does not parse prints as fixed text. The one exception is the renewal command
  `enroll --pod` prints on success, which names the token file and directory the run just used. A
  request to the sign-in issuer prints its failure as its class and, for a refusal, its status and
  its error code where the OAuth specifications register that code, and never its body. A refused
  value (an identity kind, a project list, an `AGENT_SECRETS_PERSON` nobody signed in as, an
  argument `enroll`, `unenroll` or a `machine` form does not take, a flag or unit value
  `agent-secrets-helper install` cannot use) is named by its variable or position, not echoed. A
  revoke that fails names its route without the enrollment id it was given, and no line made from
  a failed call's error prints the URL that call named again. The broker's 4xx refusal of a
  machine login that may not print whole (beside an address that carries a credential, or an
  answer with an `error_uri` or with no error code) prints its status alone, and no longer its
  code or its description, which an echo of the address's credential can fill. The new
  `internal/redact` helpers `Class`, `Answered`, `File`, `Masked`, `Named` and `BrokerAnswer` hold
  these rules. Until the agent-secrets stack change that rewrites their code lands,
  these still print as they did: the metadata server's URL, whose `?audience=` query holds
  `AGENT_SECRETS_MACHINE_AUDIENCE` whole, and `GCE_METADATA_HOST`; Google's token services; the
  pool identity's description, which holds `AGENT_SECRETS_MACHINE_AUDIENCE`,
  `AGENT_SECRETS_POOL_AUDIENCE` and `AGENT_SECRETS_POOL_ACCOUNT` whole in every trade's log line
  and error; `GOOGLE_APPLICATION_CREDENTIALS`; `AWS_WEB_IDENTITY_TOKEN_FILE`; keygen's and the
  signer's `key.pem`, and `keygen -h`, which prints the value of `AGENT_SECRETS_KEY_DIR` as the
  default of `--out`; the key directory's path in the signer chain's and the machine cache's
  messages; the sign-in store's directory in the signer chain's refusal; the request URL of a
  failed broker call that ends in an id a person typed, which can carry whatever that person
  typed; flag values, refused ids, form names and settings-file keys; the cloud tools' account and
  profile selectors; gcloud's own error output; `AGENT_SECRETS_ENROLL_WAIT`; and `agent-secrets`'
  own answer decoders other than `enroll --pod`'s.
