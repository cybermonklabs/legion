kind: Added
body: |-
  `bus.ErrWindowEndedBeforePublish` marks a publish whose window ended before it was made, so that
  nothing was sent; the error's text is unchanged, and `errors.Is` tells it from a flush or an
  acknowledgement that ran out of the window after the publish. The listener's
  `listener role forward failed` line carries `"window_ended_before_publish":true` for that error
  alone.
time: 2026-11-22T17:06:14Z
