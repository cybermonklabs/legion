kind: Changed
body: |-
  The Dispatch server's stop and its boot repairs arm their timers on Envoy's one module clock
  (the real clock in production): the stop's wait for the requests in flight, its timeout around
  the document service's shutdown and its wait for the events outbox, and the bound of each boot
  repair, the retirement of the refresh tokens stored in plain text among them. No timer's length
  changes.
