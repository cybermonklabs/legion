kind: Removed
body: |-
  `loadgen` takes no credential on its command line, where every user of the machine reads it from `/proc/<pid>/cmdline` for as long as the tool runs. `-token`, `-listener-token` and `loadgen stub-embed`'s `-key` are removed: given at all, with a value or without one, the command exits 1 right after it parses its flags, before it checks, reads or opens anything else, naming `-token-file`, `-listener-token-file` or `-key-file`, and the message holds nothing of the value. `-pg` still takes a URL with no password in it, as the local stack's own URL is; every `-pg` given in which pgx's own parser finds a password or an `sslpassword`, and every one pgx cannot parse, is refused the same way, naming `-pg-file`.
  `cluster/cluster.sh` gives every `loadgen` job of the cluster load test its Dispatch agent token, listener token and Postgres URL as files: the runner's shell writes them from the standard input of the `kubectl exec` that starts the job into `/work/secrets/<job>.<random>` (mode 700, each file mode 600), a directory that start alone claims, and removes it once the job has ended, or on a `HUP`, `INT` or `TERM` of that shell.
