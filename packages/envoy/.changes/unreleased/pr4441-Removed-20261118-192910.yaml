kind: Removed
body: |-
  `loadgen` takes no credential on its command line, where every user of the machine reads it from `/proc/<pid>/cmdline` for as long as the tool runs. `-token`, `-listener-token` and `loadgen stub-embed`'s `-key` are removed: given a value, empty or not, the command exits 1 right after it parses its flags, before it checks, reads or opens anything else, naming `-token-file`, `-listener-token-file` or `-key-file`, and the message holds nothing of the value. So is one given after a positional argument or `--`. `-pg` still takes a URL with no password in it, as the local stack's own URL is; every `-pg` given that sets a password or an `sslpassword` where pgx reads one is refused the same way, naming `-pg-file`. The value is judged as text, so the refusal never waits on a file it names.
  `loadgen seed-finish` now takes only a `postgres://` or `postgresql://` URL in `-pg` or `-pg-file`, as every other command of `loadgen` that takes `-pg` does: a keyword/value connection string (`host=… user=… dbname=…`), which it used to hand to pgx, is refused as "not a Postgres URL", since pgx's own refusal of a string it cannot parse can quote it, password included. `loadgen replay-check-seed`, `replay-checksum` and `replay-logical-dump` refuse a positional argument, as every other command does.
  `cluster/cluster.sh` gives every `loadgen` job of the cluster load test its Dispatch agent token, listener token and Postgres URL as files: the runner's shell writes them from the standard input of the `kubectl exec` that starts the job into `/work/secrets/<job>.<random>` (mode 700, each file mode 600), a directory that start alone claims, and removes it once the job has ended, or on a `HUP` or `TERM` of that shell. `cluster.sh up` gives the copy's four generated secrets to the `jq` that writes `state.json` as files it reads, not as arguments.
