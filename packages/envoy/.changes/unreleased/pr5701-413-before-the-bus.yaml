kind: Fixed
custom:
  Issue: pr5701
body: |-
  A send or publish whose message is larger than the NATS server's max payload is answered `413`
  naming the envelope's size and the bound, with no `Retry-After`, however long the listener took to
  read it. Before, the size was checked only inside the publish, after the publish had read the
  route's 3.5 s deadline, so a large message whose decoding spent that budget on a busy listener was
  answered `503 {"error":"envoy: the message bus did not answer: context deadline exceeded"}` with
  `Retry-After: 1`, and the client sent it again and again. The listener now checks the size against
  the max payload its connection's server reports, as soon as it has built the envelope, so such a
  message is refused before the sender limit (a `413` at any count, not a `429`), and before the send
  route reads the target session, probes it, or reports a wake for it (a `413` for an unknown session,
  not a `404`).
