kind: Changed
body: |-
  When two issues tie for a pull request, Dispatch now credits the issue whose key sorts first
  in byte order (`collate "C"`). Two issues for the pull request's repository tie when both
  link its URL or the same source names both at the same position. Previously, the database's
  link read order decided the tie.

  After deployment, the reconcile judges each stored merged pull request once more under rule 8.
  It takes up to `delivery.RejudgedHeadsPerPass` (50) per pass and reads each pull request once
  from GitHub. This makes the head row and the Delivery row name the same issue.
  The reconcile's attribution pass rewrites the Delivery row's stored issue when the winning key
  differs. The Delivery timeline can then show the other issue. When a reassigned pull request
  later ships, its `issue.deployed` event goes to the new issue.
