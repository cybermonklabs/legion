kind: Fixed
body: |-
  When another Google account takes an address, the secrets broker now also ends the replaced
  account's sessions on its own approval page, so a page that account has open approves and
  denies nothing, and refuses that account's sign-in to the page with a 403 saying another
  account holds the address. The new holder's page sessions are untouched. A decision whose
  session ended while its form was on the way decides nothing.
