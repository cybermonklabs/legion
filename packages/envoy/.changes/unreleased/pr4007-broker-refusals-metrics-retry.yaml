kind: Added
body: |-
  The secrets broker records every refusal its code writes. Each 4xx answer the broker's code
  writes, on the API port and on the airlock's proxy port, logs one `broker: answer refused` line
  at WARNING, naming the code, the secret names the request named, the caller's class and
  identity, and an answer id. Every answer the broker's code writes carries that id in
  `X-Broker-Answer-Id`, a JSON refusal body carries it as `answer_id`, and `agent-secrets` ends a
  refusal with `(answer <id>)`, so a refused caller has something to quote. The `400`, `431` and
  `417` answers Go's HTTP server writes itself, before the broker's code runs, carry no id and
  write no line. A 429 and the device grant's `slow_down` and `authorization_pending` are counted
  and write no line.
  A refusal's line lists the first secret names up to 32 KiB of them as it writes them
  (JSON-escaped, each with its quotes), counts every name in `secrets_count`, says how many it
  left out in `secrets_omitted`, and, as the airlock's call line does, keeps at most 256 bytes of
  each field the caller wrote, since Cloud Logging refuses an entry over 256 KiB. A line net/http
  writes on the airlock's servers is now `airlock proxy: net/http`, with net/http's first line cut
  the same way in its `error` field and, for a handler's recovered panic, the stack whole in its
  `stack` field.
  The broker serves Prometheus metrics on a port of its own, `BROKER_METRICS_LISTEN_ADDR`
  (`127.0.0.1:13382` by default), and on no other port: `broker_answers_total`,
  `broker_mint_attempts_total`, `broker_unservable_secrets` and `broker_policy_store_reads_total`.
  `agent-secrets secret create`, `secret set` and `secret retag` refuse a `github-app`,
  `google-login`, `google-service-account` or `azure-login` value that the type's minter would
  refuse, through the one decoder the minters use. The broker reads each type secret's value once
  for each new version and type, and refuses a value the decoder refuses as `value-malformed`,
  before any mint.
  A mint call that fails with a 5xx, a transport failure or a rate limit is made again: at most 3
  attempts of 5 s each, at most 10 s of added wait for each mint, and, for the whole process, a
  budget of 60 retries that gains one back each second. The `broker: mint failed` line names the
  attempts made.
