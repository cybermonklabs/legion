kind: Changed
body: |-
  Every refusal of `envoy-infra:gcp:Dispatch`'s plain inputs is now a `core.InputError` naming the
  input to correct, as the schema names it (a list by its own name, never by an entry's index), so
  a Go caller finds that input with `errors.As`. So is the refusal of an Input that holds an nkey
  seed once it resolves, such as `natsSeedSecret`, `iapAudience` or `tailnetAuthKey`, which
  `envoy-infra:gcp:ClusteredNatsHub` shares for `kubeconfig` and `tailnetAuthKey`. A refusal of the
  app pod's summed CPU, memory or ephemeral storage names the proxy's input where only the proxy's
  value was set, and the app's otherwise. Every message is unchanged.
time: 2026-11-20T21:23:42Z
custom:
