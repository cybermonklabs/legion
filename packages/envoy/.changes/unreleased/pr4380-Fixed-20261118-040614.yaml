kind: Fixed
body: |-
    A CI reconcile pass that its deadline ends before it reaches a pull request head no longer makes the passes after it read at the slowest pace. That pass learned none of the pages its heads take, so the arithmetic set the passes after it at 500 ms between REST requests, and with a short deadline no pass reached a head again and the cursor stayed at the first one. The passes after such a pass now read at the floor (100 ms, or a configured pace below it) until one reaches a head; a pass that a rate limit ends leaves that floor as it was.
