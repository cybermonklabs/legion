kind: Fixed
body: |-
  An `envoy-dispatch` intake no longer lets a hand-back of a message reach the durable a standby recreated, in two cases that could have the standby's consumer deliver a message a second time. A subscription callback that was handing a message back as the intake's stop unsubscribed is now either counted before the stop decides to release its hold, which then waits for that hand-back, or it hands nothing back: once the stop has ended, no hand-back of that subscription begins. A hand-back still waiting for NATS when the intake's hold is lost, as when its renewals fail because the database is out of reach, no longer goes out when the link recovers: the intake severs its NATS connection before the hold lapses, resetting the socket so neither the waiting publish nor what the kernel had not sent reaches the server, and the bus client dials a new connection. The message stays with the durable, and the standby's take-over is handed it once.
  An intake's stop under a deadline that has already passed now takes the messages waiting behind a running handler before it gives the handlers up, so such a message no longer starts its handler under the cancelled context, where the stop withheld its hand-back: the stop holds it and hands it back once its drain has answered.
  The sever on a lost hold does not wait for the bus client's own lock, which a read of the connection holds while it waits out a held write, and each intake delivery watches its hold on a goroutine of its own, so neither a waiting flush nor a check of the durable delays the sever. A bus socket whose write failed is reset when nats.go closes it, so the kernel drops what it had not sent.
  A socket of an intake's connection that carries a hand-back no flush on that connection has confirmed is now reset rather than closed, at shutdown and when the bus gives the connection up as stale and reconnects, so the hand-back's bytes still in the kernel's send queue are dropped rather than sent after the hold is released; a flush on the new connection no longer counts as confirming them. Every other socket closes as before. An intake's stop no longer releases its hold while an earlier delivery under the same hold still has a hand-back no flush has confirmed: it waits for every hand-back the connection carries, not only its latest delivery's. An intake that takes its durable again under one hold, as after a create the grant refuses, no longer leaves a goroutine waiting for that hold's end per attempt: a delivery's loss watcher ends once its stop has sealed it with nothing handed back, or once a flush has confirmed its hand-backs.
