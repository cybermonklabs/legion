kind: Changed
body: |-
  `BROKER_EXCHANGE_RESULT_WORKFLOWS` entries are now `<repository>=<workflow path>=<workflow ref>=<ref pattern>=<project>=<person>`. The new third field is the ref the entry takes its workflow file at: a branch's ref spelled out whole with no wildcard, which must be the repository's default branch, such as `refs/heads/main`. A run is a result entry's run only where its job is written in that copy of the file, its `job_workflow_ref` exactly `<repository>/<workflow path>@<workflow ref>`, and the ref pattern is matched against the run's `ref` as before. Before, the broker took a run whose `job_workflow_ref` and `workflow_ref` were both the entry's path at the run's own branch, so whoever could push the branch could edit that copy of the workflow and decide what the job recorded. Now a job written in the copy at any other ref, the branch's own among them, is refused `invalid_request`, and the refusal names the job's workflow and the ref the entry takes it at. A workflow on the branch calls the entry's workflow as a reusable workflow, `uses: <owner>/<name>/<workflow path>@<default branch>`, so for a result entry `workflow_ref`, the workflow the run entered through, no longer has to equal `job_workflow_ref`. An entry of `BROKER_EXCHANGE_WORKFLOWS` or `BROKER_EXCHANGE_JOB_WORKFLOWS` still refuses a job written in any workflow but the one the run entered through.

  Rewrite each entry in the new form before you deploy this release: the broker refuses to start on an entry of the old five-field form, naming the setting, the entry and the new form. It also refuses an entry whose workflow ref is not such a branch's ref, or whose branch's name holds `@refs/heads/`, and one workflow taken at two refs. A run of one repository whose job is another repository's result entry's workflow is refused. The session and the principal of a result entry's run stay `ci-results:<repository>/<workflow path>` and `workflow-results:<repository>/<workflow path>`.

  The run a result grant carries (`ci`) names the workflow file its job ran: its `workflow_ref` is the run's `job_workflow_ref`, the entry's workflow at the default branch, and its new `job_workflow_sha` is the commit of that file the job ran, which the broker requires of every result entry's run. For `POST /api/v1/projects/{key}/results`, Dispatch reads the run's jobs from the file at `job_workflow_sha`, so a check run named in the caller's form `<caller's job> / <called job>` writes a spec check there only where that file has a job of that very name, else `409 CHECK_NOT_THIS_JOBS`, and a result's in-toto statement names the file that ran as `predicate.run.workflow_ref`.
