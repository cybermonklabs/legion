kind: Added
body: |-
    Dispatch and the secrets broker refuse to start, before they apply any migration, when their
    database records a migration's version under another file's name, or a text of it the
    release's own file of that version does not name, as a database that ran another branch's
    edit does: such a database was booted before without that migration applied, and said nothing.
    Dispatch judges again before each migration it applies, and stops there, keeping the ones it
    applied, when another server recorded such a version meanwhile. The refusal names the version,
    what the database records and what the release's file is, and both ways out: reset a database
    that ran another branch's or commit's migration (drop it, create it empty and let the server
    migrate it), or, for an edit or rename made on purpose, add the
    `-- replaces: <name> sha256:<hex>` line it names to the file, after the replaces lines it has,
    after which a start accepts the recorded row as it is, so the release before still boots over
    the database. An image cannot accept a text it has never seen, so it refuses a database whose
    migration a later image applied from an edited text: one an image with the edit created from
    empty, and a database rolled back by hand to an image it never ran. Before the merge,
    `envoy-go-build` fails a change that edits a migration its base holds without such lines.
    `envoy-dispatch versions` and `envoy-broker versions` read without writing what the image's
    next start would do with each recorded migration.
