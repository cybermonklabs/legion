kind: Fixed
body: 'A session that takes an Envoy role from a different session now receives the role messages the previous holder did not read, at least once. Before, a message published to a role while its holder had crashed inside its five-minute live window was stored only on that holder''s own subject, and a different session that took the role next never received it. The claim route records each takeover on a lane of the listener''s own (`notifications.envoy.takeover.<role>.<previous holder>.<attempt>`) before it writes the claim, and a claim whose record does not store writes nothing and answers `503` with `Retry-After: 1`; the Legion claim boot claims again after a growing wait instead of stopping the session. The listener copies the previous holder''s role messages, from the acknowledgement floor of its session consumer on, to the role''s kept lane, whose walk hands them to the role''s holder; each copy keeps the message''s event id and carries a dedupe key of its own, so a host that already showed the message drops it, and a role taken back reaches its previous holder. The kept lane''s sweep goes on with each record for 71 hours, writing it when it changes or every 15 minutes, so a crash at any step delays a message and loses none. A session whose role another session holds is no longer delivered that role''s messages: its relay copies each to the role''s kept lane and acknowledges it. An outright claim now writes with the revision it read and reads again on a conflict, and one that meets a conflict at every try within its request answers `503` with `Retry-After: 1` and writes nothing. Dispatch marks each message it sends to a role''s holder for a route to that role with the new optional envelope field `role`, which the listener takes only from the principal `ENVOY_DISPATCH_PRINCIPAL` names. Dispatch makes such a send on its own identity alone: the token `ENVOY_ACCOUNT_TOKEN_FILE` names, read at each call and once more after a `401`, or on Google Cloud the machine''s identity token for `ENVOY_ACCOUNT_GOOGLE_AUDIENCE`; a Dispatch with neither refuses the send, and the attempt records an error naming both settings (deploy/README.md, "Dispatch''s identity at the Envoy listener"). In the Dispatch deployment the app presents a projected service-account token and the listener runs as a service account of its own (`<hostname>-listener`). A marked send whose role moved and that asked `connected_only` is refused `409` with nothing kept. A reply to an attempt sent for a role route is accepted from the role''s live holder too, and a reply whose route could not be read is answered `500`, not refused. A send or publish whose publish went out and was never acknowledged is answered `503` with the code `maybe_stored` (`listenerwire.CodeMaybeStored`): Dispatch records that attempt with a cause of its own, `STORE_UNCONFIRMED_CAUSE`, retries it under its key as it retries a receipt timeout, and the dashboard warns that re-sending it in another mode may deliver it twice. A role publish whose keep for the role''s next holder failed is still answered `404`. An identity token whose issuer could not be read is answered `503` with `Retry-After: 1`, not `401`. The five-minute live window is unchanged, and no role route probes a relay. The stream gains the subject `notifications.envoy.takeover.>` (stream generation 5). `listenerwire` carries the send route''s `role` request field (`SendRequest.Role`) and its `202` answer for a marked send whose role''s claim names another session, or none (`KeptSendResponse`: `kept`, `kept_until`, `holder`, `recipient`). `scripts/dev-stack.sh`''s listener now takes a bearer, the shared token it exports as `ENVOY_TOKEN`, beside Dispatch''s identity token.'
