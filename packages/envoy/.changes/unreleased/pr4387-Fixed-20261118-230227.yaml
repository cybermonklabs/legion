kind: Fixed
body: 'A session that takes an Envoy role from a different session now receives the role messages the previous holder did not read, at least once. Before, a message published to a role while its holder had crashed inside its five-minute live window was stored only on that holder''s own subject, and a different session that took the role next never received it. The claim route records each takeover on a lane of the listener''s own (`notifications.envoy.takeover.<role>.<previous holder>.<attempt>`) before it writes the claim, and copies the previous holder''s role messages, from the acknowledgement floor of its session consumer on, to the role''s kept lane, whose walk hands them to the role''s holder; the kept lane''s sweep goes on with each record for 71 hours, so a crash at any step delays a message and loses none. A session whose role another session holds is no longer delivered that role''s messages: its relay copies each to the role''s kept lane and acknowledges it. An outright claim now writes with the revision it read and reads again on a conflict, and one that meets a conflict at every try within its request answers `503` with `Retry-After: 1` and writes nothing. A takeover record the stream refuses because it is full lets the claim land with no record, logged at Error and counted on `envoy_role_takeover_unrecorded_total` once the claim lands. Dispatch marks each message it sends to a role''s holder for a route to that role with the new optional envelope field `role`, which the listener takes only from the principal `ENVOY_DISPATCH_PRINCIPAL` names, as its identity-token check proved it. In the Dispatch deployment the app presents a projected service-account token from `ENVOY_ACCOUNT_TOKEN_FILE`, read at each call, and the listener runs as a service account of its own (`<hostname>-listener`); a deployment where Dispatch has no such token sends no mark, so its messages are not copied at a takeover. A reply to an attempt sent for a role route is accepted from the role''s live holder too. The five-minute live window is unchanged, and no role route probes a relay. The stream gains the subject `notifications.envoy.takeover.>` (stream generation 5).'
