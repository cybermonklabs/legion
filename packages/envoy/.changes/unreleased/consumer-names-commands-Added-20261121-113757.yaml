kind: Added
body: |-
  `envoy-infra consumer-names` runs the operator's side of the fresh JetStream consumer names, as
  the deployment's operator identity and only in the writer hold's phase each step needs. `status`
  lists every family's selection records, their retired names and what blocks a cutover. `backup`,
  with the row released, writes the selection bucket's records into a new directory and prints the
  sha256 that a recovery from it records. `prepare` records the cutover boundary and raises the
  fixed names' inactive thresholds through the window. Inside a hold, `create-bucket` makes the
  selection bucket and its sentinel; `convert` replaces every fixed name by a fresh one at its safe
  start and marks each family converted; `replay` gives one logical name its start; `create-bucket
  --after-loss` recovers a lost bucket from a held snapshot or a released walk of its records;
  `restore` rolls every family back to its fixed names; `enroll` marks a Legion daemon's store made
  after the cutover converted, in the writer hold's new `enroll` workflow; and `repair-sentinel`
  rewrites a damaged selection bucket sentinel from the broker's records, in the new
  `sentinel-repair` workflow. In the new `consumer-cleanup` workflow, and only there, `cleanup`
  deletes recorded retired names, `cleanup --gone` removes the consumers of a Legion daemon whose
  store is gone, and `replace` gives one listener's durable a fresh name at one past its ack floor;
  each runs again as needed, and a run with `--final` completes the hold. Each command run inside a
  hold writes its intent and its done or stop entry in the hold's journal, and a stop records what
  its runs left. `envoy-infra streams census` reads the session consumers and the fresh names the
  records hold, and brings each daemon store's stream identity to the stream's, through this
  command's readers. A daemon's store is read only at the address one source names, its Deployment
  or, for a project retired after the cutover, its entry of the ConfigMap
  envoy-operator/envoy-operator-retired-stores: an address two sources name is refused, and only
  SQLSTATE 3D000 there makes a store gone.
