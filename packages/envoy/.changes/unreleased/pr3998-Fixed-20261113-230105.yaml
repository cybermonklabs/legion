kind: Fixed
body: |-
    The listener no longer decides any act from its in-memory copy of the role claims.
    A role message on the role lane, the kept-role sweep, the drain hold and the handover retry read the role's claim record.
    A role message whose claim read fails is kept on the role's kept lane (`claim_unread`) and forwarded to the holder its claim record names once a read answers.
    A registration renews the roles of the interest row it stored and the roles the copy names, a deregistration releases the roles of the interest record read from the store and the roles the copy names, and the controller notice lane follows the controller's claim record.
    The listener reads the whole role claim store every minute and repairs its copy in both directions.
    `/healthz` reports `role_claim_repair` and answers `degraded` when the last whole read is older than 2 minutes, and `/metrics` has `envoy_role_claim_repair_completed_timestamp_seconds`, `envoy_role_claim_repair_put_back` and `envoy_role_claim_repair_took_out`.
    A role held under the claimant's own session id is not granted to a second process while this listener's renewal of it failed inside the live window or its copy is past that bound.
