kind: Added
body: "Every issue, document, ask, message, comment and document block now names the project it belongs to, or, for something no project owns, the people and sessions it is between; `envoy-dispatch backfill-graph-store` fills this in for older rows, and `envoy-dispatch census --store` reports any row still missing it, and on a line of its own per kind, `census: project past_bound kind=<kind> addresses=<n>`, the rows whose address is too long for the store to hold. An issue, document, ask or message the older release writes while it serves beside this one during a roll, or while this one is stopped, gets its node from the next block-index tick, so a roll needs no second backfill. The older release can also remove a document whose node this one wrote, which leaves the node behind with no document; the census reports it as `orphaned` until the next block-index tick of this release states it gone, as this release's own removal does."
