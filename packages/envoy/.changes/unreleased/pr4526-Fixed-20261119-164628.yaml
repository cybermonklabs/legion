kind: Fixed
body: |-
  Three locks in `envoy-dispatch` are no longer held while nats.go waits out a NATS reconnect attempt, which holds nats.go's connection lock for up to the 5 s connect timeout. An outbox window's pin: a send checks its pinned connection against nats.go's own report that the connection dropped, which nats.go makes the moment it starts reconnecting, so the check reads no state of nats.go's and waits for nothing, and a window pinned before a drop sends nothing on the reconnected connection unless the goroutine that takes nats.go's report is kept from running through a whole reconnect attempt. The role and session buckets' lock: a lookup opens its bucket with that lock released. An intake's stop: its drain and its unsubscribe, the acknowledgements and hand-backs of the handlers it waits for, whether begun before the stop or after, and the job intake's acknowledgement, each wait for NATS at most 100 ms, so neither the stop nor a second stop waits out the attempt. Not changed here: the bus client's own `Connected` holds the client's lock while it reads the connection's status, so an outbox batch's `Connected` check, and a window send that takes the client's lock for its request or its publish denials, can still wait on it during a reconnect, holding no window lock. What this costs: a lookup's bucket open that outlives its read runs on to its own end; an acknowledgement NATS has not taken within 100 ms goes on without its handler; a pull request envelope whose head row was not stored, and a message whose acknowledgement NATS refused, come back after the 5-minute ack wait rather than at once or after 10 s when NATS does not answer within 100 ms that the connection is connected, or answers that it is not; an intake stopped while NATS does not answer within 100 ms, or with the link down, leaves the messages it held with the durable, for the next holder's take-over or the ack wait, rather than handing them back at once; and an intake whose stop ends with a hand-back NATS has not yet taken, or whose hand-backs a flush of up to 1 s does not confirm, leaves its hold to lapse rather than releasing it, so the standby takes over at the lapse, up to the hold's 15-second TTL after its last renewal, rather than at once.
