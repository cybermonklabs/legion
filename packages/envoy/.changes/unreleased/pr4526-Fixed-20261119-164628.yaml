kind: Fixed
body: |-
  Three locks in `envoy-dispatch` are no longer held while nats.go waits out a NATS reconnect attempt, which holds nats.go's connection lock for up to the 5 s connect timeout. An outbox window's pin: a send checks its pinned connection against nats.go's own report that the connection dropped, which nats.go makes the moment it starts reconnecting, so the check reads no state of nats.go's and waits for nothing, and a window pinned before a drop sends nothing on the reconnected connection unless the goroutine that takes nats.go's report is kept from running through a whole reconnect attempt. The role and session buckets' lock: a lookup opens its bucket with that lock released. An intake's stop: its drain and its unsubscribe, the acknowledgements and hand-backs of the handlers it waits for, whether begun before the stop or after, and the job intake's acknowledgement, each wait for NATS at most 100 ms, so neither the stop nor a second stop waits out the attempt. Not changed here: the bus client's own `Connected` holds the client's lock while it reads the connection's status, so an outbox batch's `Connected` check, and a window send that takes the client's lock for its request or its publish denials, can still wait on it during a reconnect, holding no window lock. What this costs: a lookup's bucket open that outlives its read runs on to its own end; an acknowledgement NATS has not taken within 100 ms goes on without its handler; a hand-back or acknowledgement refused on a reconnecting link between attempts now logs INFO where main logged ERROR; an intake stopped while NATS does not answer within 100 ms, or with the link down, leaves the messages it held with the durable, for the next holder's take-over or the ack wait, rather than handing them back at once; an intake's drain wait ends at the first read of whether NATS is connected that does not answer within 100 ms, or answers that it is not, and unsubscribes, so what nats.go had buffered for the subscription waits for the take-over rather than being handed back; an intake's `Run` can still wait, after its stop returns, for a hand-back NATS has not yet taken, until the stop's deadline, and then for a flush of up to 1 s; and an intake whose hand-back is still pending at the stop's deadline, or whose hand-backs that flush does not confirm, keeps its hold renewing until the hand-back reaches the server and a flush confirms it, or until its connection closes, so the standby takes over only then, or at the lapse, up to the hold's 15-second TTL after its last renewal, when the process exits first.
  A pending intake hand-back keeps its hold renewing until it settles, and Dispatch shutdown closes the intake client then waits for that finalizer to release the hold before it closes the database pool.
