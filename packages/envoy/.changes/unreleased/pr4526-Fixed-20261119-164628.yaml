kind: Fixed
body: |-
  Three locks in `envoy-dispatch` are no longer held while nats.go waits out a NATS reconnect attempt, which holds nats.go's connection lock for up to the 5 s connect timeout. An outbox window's pin: a send checks its pinned connection without reading nats.go's state until the client has had a connection event, and then reads it within 100 ms, taking the client's lock for that read inside the same bound. The role and session buckets' lock: a lookup opens its bucket with that lock released. An intake's stop: no call it makes to NATS, its drain, its unsubscribe, a handler's acknowledgement or a hand-back, keeps it or a second stop waiting more than 100 ms. Not changed here: the bus client's own `Connected` holds the client's lock while it reads the connection's status, so an outbox batch's `Connected` check, and a window send that takes the client's lock for its request or its publish denials, can still wait on it during a reconnect, holding no window lock. What this costs: a slow write in the moment after a connection event, on a connection that is current again, can cost one send a resend; a lookup's bucket open that outlives its read runs on to its own end; and an intake stopped while NATS does not answer within 100 ms, or with the link down, leaves the messages it held with the durable, for the next holder's take-over or the ack wait, rather than handing them back at once. A stop whose drain NATS took, and that a reconnect then catches, still waits for a hand-back it has begun.
