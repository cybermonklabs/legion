kind: Fixed
body: |-
  During a NATS reconnect of `envoy-dispatch`, an outbox batch, a role or session lookup of the outbox, and an intake's stop no longer wait out the reconnect attempt, which lasts up to the 5 s connect timeout while nats.go holds its connection lock: each answers the lost connection at once or at its own bound (at most a second for the stop's drain), and none keeps the others waiting behind it. What this costs: an outbox window takes its connection as lost on the client's own connection events, so a send in the moment between nats.go marking the connection down and the client hearing of it is refused by nats.go rather than by the window; a lookup's bucket open that outlives its read runs on to its own end; and an intake stopped while NATS does not take its drain within a second leaves the messages it held with the durable, for the next holder's take-over or the ack wait, rather than handing them back at once. A stop that drained on a connected link and is then caught by a reconnect still waits for the hand-backs it makes then, as before.
