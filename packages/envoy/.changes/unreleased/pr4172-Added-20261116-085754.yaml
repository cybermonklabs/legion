kind: Added
body: 'The spec-check command judges a directory of spec files, the requirement, check, component and term nodes of a repository''s .dispatch/spec: `spec-check tree --dir <dir>` names each fault with its file, its line, its node and its rule, `spec-check changes --base <dir> --dir <dir>` lists each statement whose text, parent, relations or checks changed between two versions (a statement that only moved to another file is no change), and `spec-check checks` prints the program checks of one CI job as JSON; `changes` and `checks` read a directory that does not exist as the empty tree. The composite action .github/actions/spec-check builds the command and runs `spec-check tree` in a workflow job, and CI runs it on each pull request.'
