kind: Fixed
body: |-
    A NATS server URL the NATS client would read other than as written is refused before any dial,
    named by its position alone and with a reason of fixed words, never any of its text or the URL
    parser's, which quotes the part it could not read: `bus: NATS server URL 1 of 2 cannot be read:
    it does not parse as a URL; write a credential in it percent-encoded (a "/" as %2F, a comma as
    %2C)`. That covers a password or a token holding an unescaped `/`, `?`, `#` or space; a URL with
    an `@` after its host, which is how a token holding a `/` written as the URL's user parses (its
    head becomes the host); a URL after the first that carries a user name or password and names
    none of the schemes `nats`, `tls`, `ws` and `wss`, which is what a comma in a credential leaves
    after it once the list is split; and a websocket URL, or a later URL with no scheme in a
    websocket list (its first entry that is not empty naming ws or wss), whose path or host stops
    parsing once the client's handshake decodes it, whose error quoted the URL with its query. A
    run that may reach remote NATS (`ENVOY_ALLOW_REMOTE_NATS=1`, as the deployments set it) used to
    hand such a URL to the NATS client, which refused it after the connect's ten attempts with an
    error that quoted the whole URL, or dialled the credential's head as a host name and logged it.

    A list whose later URL carries a user name or password and names none of those schemes used to
    connect in a nats or tls list: the NATS client dials one with no scheme as `nats://` and one of
    any other scheme as plain NATS. It is now refused, because a user name or password in a URL is
    a credential there, and where a comma split one, its head was dialled and printed as a host.
    Name that URL's scheme. Write a comma in a credential as `%2C`, and a `%` in a websocket URL's
    path as `%2525`. The bus and natsprobe read the list as the NATS client does, each URL trimmed
    and an empty one dropped, and hand the NATS client that list. Dispatch's refusal of `NATS_URLS`
    names an empty entry by its position, and its refusal of `DISPATCH_SERVER_URL` names the
    variable alone, where both quoted the value whole.

    The bus names a NATS server by its position in every refusal and log line, never by any part
    of its URL, and a connection's failure by its class, never by the error's text. A token or
    password holding a comma and then `nats://`, `tls://`, `ws://` or `wss://` leaves, once the
    list is split, a URL whose host is the credential's head, which the rules above let through,
    and the bus printed that head: in the refusal of a server that is not this machine's, now
    `bus: refusing a NATS server that is not this machine's: NATS server URL 1 of 2 names another
    machine (set ENVOY_ALLOW_REMOTE_NATS=1 to reach it)`; in the `servers` of `envoy nats
    reconnect attempt failed` and `envoy nats authorization refused`, now how many servers there
    are (`servers=2`); in the `url` of `envoy nats connected` and `envoy nats reconnected`, now
    `server="1 of 2"`; and in the error of a failed dial, which named the host or port it failed at
    and now reads as its class (`name resolution failed`, `connection refused`, `timed out`, `TLS
    failed`, a TLS alert's words, `the SOCKS5 proxy answered host unreachable`, the NATS client's
    own fixed words, such as `nats: no servers available for connection` or a server's refusal as
    it wrote it (`nats: Authorization Violation`, `nats: Authentication Timeout`), `a root
    certificate the client could not parse` for its refusal of a root certificate file, which named
    the file, or `a protocol error from the server` for an error the client formats from what the
    server sent, its parser's among them), in those lines, in the cause `envoy nats disconnected`
    logs, in `envoy nats async error`, which printed any error the NATS client reported
    asynchronously whole, in the error a failed connect returns, and in the error of a core
    publish the bus could not confirm, which printed the connection's last error whole. natsprobe's
    failed connect reads the same way, with how many servers it tried
    (`natsprobe: connect: <class> (tried the 2 servers --servers names)`), where it printed the
    NATS client's error whole, a password's digits among it once a comma split it; and so do the
    load generator's.

    `NATS_NKEY_SEED_FILE`, `NATS_SERVICE_TOKEN_FILE` and natsprobe's `--service-token-file` name a
    file that could not be read by the setting and the system's reason alone
    (`NATS_NKEY_SEED_FILE names a file that could not be read: open: no such file or directory`),
    never by its path or the error's own text, which named the path again: a seed or a token
    pasted where its file's path goes printed whole, more than once. A file that was read is still
    named by its path.
