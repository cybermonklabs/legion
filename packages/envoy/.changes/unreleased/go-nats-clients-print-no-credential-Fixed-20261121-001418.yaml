kind: Fixed
body: |-
    A NATS server URL the NATS client would read other than as written is refused before any dial,
    named by its position alone and with a reason of fixed words, never any of its text or the URL
    parser's, which quotes the part it could not read: `bus: NATS server URL 1 of 2 cannot be read:
    it does not parse as a URL; write a credential in it percent-encoded (a "/" as %2F, a comma as
    %2C)`. That covers a password or a token holding an unescaped `/`, `?`, `#` or space; a URL with
    an `@` after its host, which is how a token holding a `/` written as the URL's user parses (its
    head becomes the host); a URL after the first that carries a user name or password and names
    none of the schemes `nats`, `tls`, `ws` and `wss`, which is what a comma in a credential leaves
    after it once the list is split; and a websocket URL, or a later URL with no scheme in a
    websocket list (its first entry that is not empty naming ws or wss), whose path or host stops
    parsing once the client's handshake decodes it, whose error quoted the URL with its query. A
    run that may reach remote NATS (`ENVOY_ALLOW_REMOTE_NATS=1`, as the deployments set it) used to
    hand such a URL to the NATS client, which refused it after the connect's ten attempts with an
    error that quoted the whole URL, or dialled the credential's head as a host name and logged it.

    A list whose later URL carries a user name or password and names none of those schemes used to
    connect in a nats or tls list: the NATS client dials one with no scheme as `nats://` and one of
    any other scheme as plain NATS. It is now refused, because a user name or password in a URL is
    a credential there, and where a comma split one, its head was dialled and printed as a host.
    Name that URL's scheme. Write a comma in a credential as `%2C`, and a `%` in a websocket URL's
    path as `%2525`. The bus and natsprobe read the list as the NATS client does, each URL trimmed
    and an empty one dropped, and hand the NATS client that list, and every NATS server URL the bus
    logs is named without its query and fragment. Dispatch's refusal of `NATS_URLS` names an empty
    entry by its position, and its refusal of `DISPATCH_SERVER_URL` names the variable alone, where
    both quoted the value whole.
