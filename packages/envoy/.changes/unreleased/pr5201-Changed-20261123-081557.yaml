kind: Changed
body: |-
  `envoy-infra buckets create` makes a bucket that is absent with no writer proof, and can run again. A bucket that is absent holds no write to lose, so `create` needs no listener stopped, prints no best-effort warning, and refuses the proof flags (`--kube-context`, `--host`, `--this-machine`, `--ssh`, `--connz`, `--first-deployment`) with exit 2; `recreate` and `check` keep the proof. It reads each named bucket and judges it against the stream its create makes at the copies asked for (`bus.CopiedBucketStreamConfig`, the stream nats.go makes of `bus.CopiedBucketConfig`): a bucket there with that stream is left as it is and logged `<bucket> present at <n> copies with its own configuration: left as it is`, exit 0; one there at other copies, or with another history, max age, storage, size limit, compression, discard policy, direct get or subjects, or with a mirror, a source or a republish, fails the run with exit 1 naming each difference (`differs: KV_<bucket>: replicas 1, want 3`), and nothing is created. The session bucket's max age, which the listeners set from `ENVOY_SESSION_MAX_AGE`, is not compared. The create sends no stream update on any server version: a create the server answers "stream name already in use" is followed by no read or update of that stream, where nats.go's own create updates a stream that differs only in its discard policy and direct get; a create that loses a race to another client reads the bucket again and applies the same rule. The new `--inbox-prefix` names the prefix of the run's reply inboxes, by default `_INBOX_envoy_buckets`; a listener's user, which subscribes only `_INBOX.>`, passes `--inbox-prefix _INBOX.`. A read or a create the server refuses under the run's grant is sent again every 5 seconds for up to 180 seconds, since a grant just applied reaches a hub at its next reload, and then fails the run naming the refusal; the run says so once, and its connection logs no ERROR line for each refused send. An interrupt or SIGTERM stops `create` at once, its wait included: it exits 1 naming the signal (`envoy-infra buckets create: stopped: <the signal>; nothing more is created`) and sends no create after it. `create --break-glass` is the same create as a listener's user on `_INBOX.`.
