kind: Added
body: 'A person can now hand an open question to another person: the question waits on them from now on, wherever its issue goes, and their Inbox lists it instead of the assignee''s. Until somebody hands it on, a question waits on the assignee of its issue, as before. The Inbox''s assignee filter, the open-ask list and the Replies list all follow the person each question waits on, and assignee=unassigned now means nobody waits on it.'
