kind: Fixed
body: |-
    A person's sign-in on a machine keeps its enrollment while the machine needs it, so a grant a person approved lasts to its own end and a request waiting for a person stays pending until they decide it, it is cancelled or it expires. Before, nothing renewed a sign-in's enrollment: the broker's sweep ended it one `BROKER_LEASE_SECONDS` after it was made, revoking every grant it held and cancelling every pending request ("the requesting enrollment ended: its lease lapsed"), so the person approved the same request again, and a request could not wait for a person who was away.
    Each command that signs as a sign-in records its use, and a request it leaves waiting for a person, in the sign-in's renewal directory beside its record, and starts the sign-in's one renewer, `agent-secrets renew --sign-in`, where none holds that directory's lock; a use command that waits for a person looks each second and starts the renewer again where none runs. The renewer runs in a session of its own, writes to `renewer.log` there, and renews the enrollment at a third of its lease while a command used the sign-in less than one lease ago, a recorded request is still pending, or a grant of the enrollment that has an end is still live. It stops once none holds, once the sign-in's record names no enrollment or is gone, once the broker refuses the enrollment for good (exit 76, recording the refused enrollment so no later renewer sends it), or once for 30 minutes, or two leases where that is longer, no renewal got through or no broker answer said whether anything needs the enrollment (exit 1), and the lease then lapses within one lease. It never registers an enrollment. It keeps of its caller's environment only what it reads, `GOOGLE_APPLICATION_CREDENTIALS` and `GCE_METADATA_HOST` among them, with every path the caller named relative to its working directory made absolute, since the renewer runs in `/`. A command that cannot keep the sign-in renewed says so on stderr, for each enrollment it keeps, and goes on.
