kind: Fixed
body: |-
    A person's sign-in on a machine keeps its enrollment while the machine needs it, so a grant a person approved lasts to its own end and a request waiting for a person stays pending until they decide it, it is cancelled or it expires. Before, nothing renewed a sign-in's enrollment: the broker's sweep ended it one `BROKER_LEASE_SECONDS` after it was made, revoking every grant it held and cancelling every pending request ("the requesting enrollment ended: its lease lapsed"), so the person approved the same request again, and a request could not wait for a person who was away.
    Each command that signs as a sign-in records its use, and a request it leaves waiting for a person, in the sign-in's renewal directory beside its record, and starts the sign-in's one renewer, `agent-secrets renew --sign-in`, where none holds that directory's lock; a use command that waits for a person looks each second and starts the renewer again where none runs. The renewer runs in a session of its own, writes to `renewer.log` there, and renews the enrollment at a third of its lease while a command used the sign-in less than one lease ago, a recorded request is still pending, or a grant of the enrollment that has an end is still live. It stops once none holds, once the sign-in's record names no enrollment or is gone, once the broker refuses the enrollment for good (exit 76, recording the refused enrollment so no later renewer sends it), or once for 30 minutes, or two leases where that is longer, no renewal got through or no broker answer said whether anything needs the enrollment (exit 1), and the lease then lapses within one lease. It never registers an enrollment. A command that cannot keep the sign-in renewed says so on stderr, for each enrollment it keeps, and goes on.
    The broker now renews a person's sign-in session only while the launcher credential its sign-in holds on that machine is live (`ENROLLMENT_NOT_LIVE`, "the sign-in that enrolled this session has lapsed", otherwise), and that credential expires with the person's last traded Google identity token, about an hour after each trade. The renewer keeps it live by trading the person's identity again after its first renewal and each time a third of the credential's remaining life has passed, trying a failed trade again once the smaller of a third of the lease and a third of the credential's remaining life has passed, and not more often than every ten seconds. `agent-secrets-helper` keeps the same credential live for the sessions it holds under a sign-in, asking for the sign-in every five minutes. So a machine whose person can no longer be traded, as for a suspended or deleted Google account, loses that person's access within the credential's life and one lease (longer by any broker outage in that time), with nobody revoking anything; before, a kept sign-in renewed for as long as the machine used it. A machine told of no sign-in client cannot trade, and its sign-in enrollment ends an hour after the trade that registered it. The renewer keeps `GOOGLE_APPLICATION_CREDENTIALS` and `GCE_METADATA_HOST` of its caller's environment for the trade. Deploy the broker after this release reaches the machines whose helper holds sessions under a sign-in: an older helper trades its sign-in only at an enrolment, so its sessions would be refused their renewal an hour after its last one.
