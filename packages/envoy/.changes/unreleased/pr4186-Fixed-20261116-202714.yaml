kind: Fixed
body: |-
  The broker's Postgres pool holds at most 10 connections on every machine unless its database
  URL names `pool_max_conns`. pgxpool's default, one connection per CPU the process sees, follows
  the node's CPU count rather than the pod's CPU limit, so a broker whose URL set no size could
  open more connections than its Postgres allows. 10 is the number every deployed broker already
  gets from the `pool_max_conns=10` its `BROKER_DATABASE_URL` carries, which keeps it.
