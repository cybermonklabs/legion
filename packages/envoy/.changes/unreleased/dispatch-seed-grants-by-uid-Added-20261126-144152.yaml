kind: Added
body: '`envoy-infra:gcp:Dispatch` grants the NATS seed to the app''s and the listener''s ServiceAccounts a second time, by uid: `<hostname>-nats-seed-uid-accessor` and `<hostname>-listener-nats-seed-uid-accessor` give `roles/secretmanager.secretAccessor` to `principal://iam.googleapis.com/projects/<project number>/locations/global/workloadIdentityPools/<pool>/kubernetes.serviceaccount.uid/<uid>`, the account''s own `metadata.uid`. A member by name is held by a ServiceAccount of that namespace and name in any cluster of the project''s pool; a member by uid only by the one account. Each Deployment that mounts the seed waits for both of its account''s grants. An update in which an account has no uid fails, naming it; a preview that cannot dry-run the account''s create shows the member as unknown. The grants by name stay in this release, and a later release drops them. The new output `serviceAccountUid` is the app''s ServiceAccount''s uid. Like every output it resolves only after the app Deployment''s readiness wait, so a consumer grants by it only roles the app does not need to become ready; `roles/cloudsql.client` stays on the principal''s known form. In a preview that creates the account it is the dry run''s uid or unknown, and with `clusterOnly` it is `""`.'
