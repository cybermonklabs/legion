body: |-
  Dispatch reads an envoy.json whose `envoy` section names `natsAuth`, the credential a session's
  NATS connection presents (`broker` or `none`, which the session's own client decides), holding
  it to a string as it holds `token` and `natsSeed`. It refused the key as unrecognized.
