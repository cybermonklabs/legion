kind: Fixed
body: |-
  The Envoy image's web build copies the dashboard pages table that contracts/src/dispatch-href.ts
  imports. Before this copy, the image build could not resolve
  ../../envoy/internal/dispatch/text/dashboard-pages.json and stopped before the listener smoke
  test began.
