kind: Changed
body: |-
  `PUT /api/v1/issues/{key}/role-holders` takes a holder of a role the Legion deployment defines,
  as it takes Legion's six: a role is any name of `^[a-z][a-z0-9-]{0,31}$` but `controller`
  (`legionclaim.IsRole`), and any other name is `400 INVALID_ROLE_HOLDER`. Before, the route took
  the six alone and refused the whole set of an issue with a live claim of such a role, so the
  daemon dropped it. `GET` answers the six in workflow order, then the other roles by name, and the
  role of each holder of `issue.role_holders_changed` is of the same grammar. Migration
  `20261121192021_issue_role_holders_any_role` widens the `issue_role_holders.role` check to the
  same names, added `not valid` so no stored row is read: it narrows nothing, so it rolls, and its
  census answers 0. A rollback past it is an image rollback alone while no row names a role outside
  the six; once one does, delete that row or widen the check again by hand first.
