kind: Added
body: |-
  envoy-infra renders a NATS auth callout: `core.Authorization` takes `callout` and `privateProjects`, and `gcp:NatsHub`, `gcp:ClusteredNatsHub` and `aws:NatsService` take them as `authCallout` (or `callout`) and `privateProjects`, sharing the type `nats:AuthCallout`, whose `issuer`, `xkey` and `serviceUser` are each required.
  With a callout the hub's configuration gains an `auth_callout` block listing every static user's key and sets no authorization timeout, so nats-server's default of 2 s stands and the auth service must answer within 1.5 s; without a callout it renders exactly as before.
  A callout without `xkey` is refused, since without it nats-server sends each connecting client's token to the auth service unsealed.
  `privateProjects` is refused without a callout, beside a session user, beside any user but the auth service's, and when the auth service's user may do more than subscribe to `$SYS.REQ.USER.AUTH` and publish its replies under `$SYS._INBOX.`. With `privateProjects` the hubs also refuse an `authCallout.serviceUser` that names a host, listener, Dispatch or daemon user, whose seed its client stores, in place of a `permissions` user of its own, and `gcp:ClusteredNatsHub` refuses `monitorNamespaces`, since NATS's monitoring port answers `/connz`, `/subsz` and `/jsz` with no authentication. For the same reason `aws:NatsService`'s start script binds monitoring to `127.0.0.1` beside `privateProjects`, and the container's health check reads it there, not on `localhost`, which busybox `wget` resolves to `::1`.
  A hub's own listener is refused beside the callout until it can connect with a service identity, and the clustered hub rolls its pods when the callout's lines change, which adding or removing a user does while the callout is set.
