kind: Added
body: 'With `DISPATCH_LEGION_STATUS_SCOPE=on`, Dispatch refuses three writes of a Legion issue (one that carries the `legion` label in any letter case, or is under an issue that carries it) from a credential that holds neither the `person` scope nor the new `legion-status` scope: a write of its status, the removal of its `legion` label, and a move that leaves it under no labelled issue. The answer is `403 LEGION_STATUS_SCOPE_REQUIRED` with the challenge `Bearer error="insufficient_scope", scope="legion-status"`, and a refused `PATCH` writes no field and no event of the issue (a refused close can still settle the issue''s documents, which the `PATCH` does first). A `status-change` call is refused before its first write, unless a step''s issue became a Legion issue after that check, which stops the call at that step after the steps before it. The secrets broker grants `legion-status` only to the token of a `BROKER_EXCHANGE_ACCOUNTS` entry whose fixed session is `legion-daemon:<its own project>`, and no personal token can hold it. Unset or `off`, Dispatch refuses none of these writes, and any other value stops the boot. The setting''s row in `envoy-dispatch settings` names the four conditions under which an operator turns it on, and `envoy-infra:gcp:Dispatch` renders it from its new input `legionStatusScope`, `false` by default.'
