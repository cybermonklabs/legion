kind: Changed
body: |-
  Dispatch's agent answers read (`GET /api/v1/agents/{session_id}/answers`) now finds the
  session's events in its window through a new partial GIN index of their destinations and time,
  `events_person_words_destinations` (migration `20261125131000`), and no longer reads every
  event a person wrote in the window to keep the few delivered to the session. The priorities read
  (`GET /api/v1/priorities`) takes the newest time under each priority from each member issue's
  event of `last_seq`, read by the unique `(issue_key, seq)`, in place of a join to every event of
  every member. That time can be earlier than before only when two writes of one issue overlap,
  and then by less than the time from the start of the earlier write to the commit of the other.
  Its list of work in backlog or icebox, and the issue listing's `?moved=true`, read each such
  issue's move there through a new partial index, `events_backlog_moves` (migration
  `20261125131100`), and stop at the newest move. Both indexes are built concurrently before the
  server serves, so their build is time the server is down at the deploy that carries them. The
  first needs the `btree_gin` extension of the earlier migration `20261125125703`, and while that
  migration is still pending the pre-deploy census refuses both builds where `events` is above its
  size limit: apply the release that holds that migration first. The `dispatch-seed` command now
  delivers a person's words to agent sessions, so the answers read can be measured on a seeded
  database.
time: 2026-11-24T01:46:24Z
