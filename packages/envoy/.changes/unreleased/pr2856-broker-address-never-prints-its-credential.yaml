kind: Fixed
body: |-
  No output of the token client, `agent-secrets`, `agent-secrets-helper`, `agent-secrets-devrelay`
  or `legion controller start` can carry a credential the configured broker address holds. The
  address is held in one opaque type whose every printed form is the redacted one, every call to
  the broker that carries a token or a proof refuses redirects, so a 3xx answered for the broker
  hands none of them to another host, and the redactor prints an OAuth answer's own words only
  when it has an error code and no `error_uri`, printing the failure's class alone otherwise.
  Beside an address that carries a credential, `agent-secrets` and `agent-secrets-devrelay` print
  a refusal in the broker's own error envelope as its status and its code alone, and
  `agent-secrets-helper` prints a refusal of an enrolment, a renew, a revoke or a retire with the
  broker's status and code and without its words, since whoever answers at that address can
  repeat the credential in its words or its answer id.
