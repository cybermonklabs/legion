kind: Fixed
body: |-
  No printed form of the configured broker address, and no refusal or error the token client,
  `agent-secrets`, `agent-secrets-helper`, `agent-secrets-devrelay` or `legion controller start`
  prints or logs, can carry a credential that address holds. The address is held in one opaque
  type whose every printed form is the redacted one, every call to the broker that carries a
  token or a proof refuses redirects, so a 3xx answered for the broker hands none of them to
  another host, and the redactor prints an OAuth answer's own words only when it has an error
  code and no `error_uri`, printing the failure's class alone otherwise. Beside an address that
  is not clean, each of these programs prints a refusal as its HTTP status alone: none of the
  broker's words, its code or its answer id prints, and where a line would carry them it says
  `(not printed: the broker's address is not clean)`, since whoever answers at that address can
  repeat the credential in any of them. A code still prints only where the program matched it
  against its own list: `agent-secrets renew`'s exit on a terminal refusal, and the helper's log
  of a refusal it acts on. The token client prints a value it quotes from the broker's answer,
  and the decoder's error for an answer it cannot read, the same way. What these programs print
  or log of an answer they accept is as it came, whatever the address; among those outputs,
  `agent-secrets --json` writes a 2xx body verbatim, `agent-secrets machine login` prints the
  `user_code` and `verification_uri` the broker answered, `login-status` prints that
  `user_code`, a pending secret request's line names the `approve_url` its answer carries, and
  the helper's log lines name the `credential_id` of the machine login the broker issued.
