kind: Added
body: |-
  `envoy-infra:gcp:Dispatch` takes `natsAudience`: with it, the app and the listener each connect
  to NATS by a projected token of their own ServiceAccount, `<hostname>` and
  `<hostname>-listener`, for that audience, read from `/var/run/secrets/envoy/nats-token`, which
  `NATS_SERVICE_TOKEN_FILE` names, instead of the seed `natsSeedSecret` holds. Nothing of the seed
  is registered: no SecretProviderClass `<hostname>-nats-seed`, no grant of the seed by name or by
  uid, and no Deployment waits on one; the `serviceAccountUid` output is still set. Both pods
  connect as Dispatch of machine id `<hostname>`, so the broker's `BROKER_NATS_SERVICES` lists
  `dispatch/<hostname>/*=system:serviceaccount:<namespace>:<hostname>` and
  `dispatch/<hostname>/*=system:serviceaccount:<namespace>:<hostname>-listener`, `natsAudience`
  equals the broker's `BROKER_NATS_K8S_AUDIENCE`, and `envoyImage` is `legion-envoy-v32.9.0` or
  later. An older image ignores `NATS_SERVICE_TOKEN_FILE` and connects with no credential, which a
  hub with a session user admits as that user. Add both entries, and let the broker roll out with
  them, before the update that sets `natsAudience` and unsets `natsSeedSecret`. `natsAudience` is
  refused beside `natsSeedSecret`, with `clusterOnly`, holding whitespace or a control character,
  and equal to another audience the component renders: `agentSecretsAudience`, the listener's own
  audience, `oidcAudience`, or the keyless Azure form's. With neither of the two set, the refusal
  names `natsSeedSecret`: `natsSeedSecret is required unless natsAudience is set`. With
  `natsAudience` and `existingCluster`, the lookup refuses a cluster with no Workload Identity pool
  for the pods' principal alone, and refuses one with the Secret Manager add-on off only where the
  app's pod still mounts `azureEmbedKeySecret` or `chatTokenSecret` through it, naming each. A
  Dispatch with `natsSeedSecret` renders, and refuses an existing cluster, as before.
time: 2026-11-28T13:31:12Z
