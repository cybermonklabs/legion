kind: Changed
body: |-
    `agent-secrets secret` now opens the store that the broker's settings name from the same store registry the broker uses, so it writes every store the build holds. That includes the memory store of a local stack (`dev-broker.sh`), whose file the settings name as `memory_secrets_file`. Before, the forms knew AWS and GCP alone. The memory store takes no sign-in, so `--owner me` is refused there, naming the store, and the owner is named outright.
    A line that names the broker's store names the memory store as before, `memory`, and a secret form names its file beside it (`memory file <path>`). An AWS or a Google Cloud deployment sees no change: the same sign-in, the same `--profile` refusal and usage rows, and the same store words.
    A broker whose settings name a store that this build does not hold is refused, naming the store, before any store is called. A build tag, `cipher_no_<store>`, leaves one store out with its SDK (`-tags cipher_no_aws` links no AWS module).
time: 2026-11-26T04:28:11Z
