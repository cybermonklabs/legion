kind: Added
body: |-
  `redact.DecodeError`, which `oauth2call.DecodeError` forwards, names encoding/json's error on
  bytes no `Answer.Decode` reads - a stream's message, an answer's data - in the fixed text
  `Answer.Decode` names its own in: the destination's type, the member and the JSON kind, never a
  value, and it unwraps to nothing. `redact.UnmarshalData`, which `oauth2call.UnmarshalData`
  forwards, is that decode and that wrap in one call, `json.Unmarshal` of the bytes into the
  destination; `redact.Unmarshal`, which `oauth2call.Unmarshal` forwards, reads an answer's data
  through it.
time: 2026-11-23T05:54:11Z
