kind: Added
body: |-
  A hub rendered with `privateProjects` keeps JetStream in an account of its own, `JETSTREAM`, which holds no client, and every user in `ENVOY`, which reaches JetStream only through imports: `$JS.API.>` (its responses streamed), `$JS.ACK.>`, `$JS.FC.>`, `$KV.>`, every subject the notification stream carries, `envoy-measure.>`, and the `_INBOX.>` and `_INBOX_envoy.>` streams. A JetStream answer is then answered in `ENVOY`, where no stream is, so no client can have one stored on a subject a stream captures, a private project's issue subject or a KV key included. The callout runs in `ENVOY`, and the auth service places each client there once its broker's `BROKER_NATS_ACCOUNT` names it. Without `privateProjects` the configuration renders exactly as before.
  `core.Authorization`, `aws:Authorization` and `gcp:ClusteredNatsHub` take `jetStreamOperator`, the user placed in `JETSTREAM`. `jetstream-account-move` (in the envoy image) moves a hub's streams and buckets out of `$G` and back: a fence that seals each, snapshots that keep every sequence and durable consumer, a restore verified against the fence record, the switch, and a rollback from the move's own snapshot. `scripts/jetstream-account-probe.sh` reads, from a Job under the listener's identity, whether a JetStream answer can still be stored on a captured subject.
