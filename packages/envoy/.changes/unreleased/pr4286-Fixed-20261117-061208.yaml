kind: Fixed
body: |-
    A session whose NATS credential is its own, the one the NATS auth service gives it, can no longer acknowledge another session's relay frame. A frame's reply subject was the listener's reply inbox and a counter every session behind that listener shared, so a session that answered `done` on the next number acknowledged another session's message, which was then never delivered. The reply subject is now `<inbox>.<session id>.<token>`, the token 128 random bits, and the relay moves a frame only on a reply that names the session the frame was sent to; a reply naming another session changes nothing. The first such reply is logged at WARN, then at most one a minute, each line counting the replies held back before it.
    For a session on a per-session credential the token closes the hole: it is new for each frame, and only the frame's session reads the relay subject it travels on. Once `natsgrant.Session` publishes `bus.SessionReplies` (`_INBOX.*.<session id>.>`), replies under the session's own id alone, in place of every `_INBOX.` subject, such a session cannot publish a reply under another session's id at all. Any holder of the shared session user (`core.SessionPermissions`) can still read a session's relay subject and publish `done` to the reply subject its frame carries, since the relay reads the session the subject names and not who published it. That stays open until hubs admit sessions only through the auth service and render no session user.
    The listener's connection probe and Dispatch's agent stream replay also ask on a reply subject that names the session, so a session whose grant publishes `bus.SessionReplies` alone answers all three. Deploy listeners and Dispatch with this change before any session holds such a grant: a session on it cannot answer a frame, a probe or a replay request from a release before this one.
    The listener also drops a message on a session consumer's pull inbox whose reply is not that consumer's own acknowledgement subject, and logs it at WARN, the first and then at most one a minute for each pull: the consumer did not deliver it, another connection published it there. Such a message used to end the pull with an error, which restarts the session's relay, and one whose reply named another consumer's acknowledgement subject would have acknowledged that consumer's message, though nats-server refuses a client's publish with such a reply.
