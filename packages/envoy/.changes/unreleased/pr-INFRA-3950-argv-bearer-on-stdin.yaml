kind: Changed
body: 'Every `curl` example of the Dispatch server guide (`GET /api/v1/related-checks`) and of the broker guides (approve a request, revoke a session, run the broker locally) sends the bearer token on standard input, `printf ''Authorization: Bearer %s'' … | curl -H @- …`, so the token is in no command line another process can read; the Envoy guide reads the listener''s token from `envoy.json` the same way.'
