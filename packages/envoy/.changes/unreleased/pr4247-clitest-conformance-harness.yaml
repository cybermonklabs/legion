kind: Added
body: |-
  `packages/envoy/clitest` checks a command line's built binary against the rules a command line
  on cobra keeps: `-h`, `--help` and `help <command>` on every command, a mistyped command and an
  unknown flag that exit 2 and make no request to its recorder, a flag read after a positional,
  a completion script for bash, zsh, fish and powershell that each shell reads, and `__complete`
  listing every visible command and no hidden one. Its package documentation states each check.
  No program imports it yet, so no release changes what it ships.
