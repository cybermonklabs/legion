kind: Fixed
body: |-
    `agent-secrets-helper`'s machine login polls its device code with a loop of its own, one token
    request per poll, with the same interval and `Retry-After` rules as `dispatch login --device`.
    It polls 5 s further apart, from then on, after each `slow_down` at whatever status, and after
    each poll the broker did not answer or answered 408, 429 or 5xx, as RFC 8628 has it, or
    answered with a 2xx that holds no token and names no error. It waits out the `Retry-After` of a
    408, 429 or 5xx, in seconds or as a date, where it asks longer, though never past the code's
    lifetime. It starts at the broker's interval, 1 s at least and 5 s where the broker names none,
    and polls a code for an hour at most, one that names no lifetime included; the code's end is
    kept on the monotonic clock, so a step of the system clock does not move it. A login whose code
    lapses no later than its first poll, the broker's interval on, or had already lapsed, is
    refused before any code is shown, naming the broker's interval and its codes' lifetime, or the
    hour where that ends the code first, and what must change at the broker, or, where the
    answer's round trip alone left the code no poll, that a faster answer would do; the helper
    used to wait the code out and record it `expired`. A login whose code lapses after polls the
    broker did not answer or answered with an outage is still `expired`, and `login-status` now
    carries `login_reason`, which says so and how many; `agent-secrets machine login` and
    `machine login-status` print it. Before, the helper polled again at the same interval after an
    outage, ignored `Retry-After`, and lost a `slow_down`'s 5 s after any other answer, and it
    polled a code that names no lifetime until someone decided it.
    `agent-secrets login` holds the sign-in issuer's interval and its code's lifetime to the same
    bounds. Under the command's own 15-minute limit this shows only for an issuer that breaks RFC
    8628: a negative interval is now polled every second, where a build with x/oauth2 v0.38.0 (the
    release archives and the worker image) polled it every 5 s, and one with v0.37.0 (the Envoy
    image, which builds `packages/envoy` alone) panicked and now completes; and an interval past
    about 9.2e9 s, which v0.38.0 read as 5 s, is now held to an hour, so the sign-in times out
    before any poll, at the code's end or the command's limit. It does not refuse such a code at
    once, as the machine login does: x/oauth2's poll ends it, timed out.
    `agent-secrets <NAME> --wait` now keeps waiting through a status poll the broker, or a front
    door before it, answers 408, 500, 501 or 505 and above, as it did through a 429, 502, 503 or
    504. Before, such an answer ended the wait with exit 1 as a refusal the same poll would get
    again.
