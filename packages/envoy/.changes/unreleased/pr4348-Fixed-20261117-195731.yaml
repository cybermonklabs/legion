kind: Fixed
body: 'A copy of a comment mention no longer reaches its session before an earlier event of the same issue that the session takes first. The API''s send of a mention and the outbox''s fallback copy of it each wait until no earlier event of the issue still owes a send that session may take: one to the issue''s topic family, one to the session''s own subject, one to a role that session holds when the copy is sent, or one an event whose recipient read failed may owe any session. Both read that rule in one statement, so a route moved to the session between two reads can no longer let the copy pass. The outbox records what each event still owes in two new columns (migration `20261117190118`): `events.owed_keys`, the sends, and `events.owed_seq`, the issue''s last event sequence the batch read with them. It writes both again at each batch that reads the event before it is due. An event the outbox cannot read, a row that does not scan among them, owes nothing and holds no copy. An event whose record is older than the issue''s last event also holds the copy, so a route, claim or follower written after that record holds it until the outbox records the event again, whether the write came before the comment or after it, and whatever process or release published the write''s own event. A held send waits, with its issue''s later sends to the same recipient, on a lane of its own with no goroutine on it, and tries again after 50 ms, doubling to 2 s; the recipient''s mentions on other issues go on meanwhile. A send whose read of the rule fails waits the same way, keeping its claim and its place, so the issue''s next mention no longer reaches the session first. A held send keeps its claim while it waits: a claim refresh that lands during one of its tries, or whose answer is lost after it committed, no longer leaves the sender holding a stale claim, which let the claim lapse, dropped the held send unsent and sent the issue''s next mention first. The sender counts a claim on the row as its own while it is at or past the claim it recorded and less than a lease after it, and writes a claim again only while the claim it names is live, so a lost answer no longer revives a lapsed claim; a claim lapses after a lease with no committed refresh, as a stopped process''s claims do, and the delivery sweep may then send the attempt. A held send whose try a delivery sweep hand-off overtook is tried again under the hand-off''s claim rather than dropped, and a hand-off that lands just after a send ends is queued anew rather than taken along by the send that ends. A send held only because its claim could not be read is no held copy: it no longer logs a WARN naming event 0 as it goes. A held fallback copy is read again after 2 s. The wait has no bound, so `/metrics` counts the held copies, with the oldest one''s age and no label (`envoy_dispatch_mention_sends_held`, `envoy_dispatch_outbox_fallback_copies_held` and their `_oldest_seconds`), and a copy held a minute logs one WARN naming its issue, the earlier event and its last publish error. With `DISPATCH_NATS_DISABLED=1` nothing waits. The two-lease bound on a role forward that waits for an unnamed mention is unchanged.'
