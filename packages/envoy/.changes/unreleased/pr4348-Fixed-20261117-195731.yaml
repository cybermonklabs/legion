kind: Fixed
body: 'A copy of a comment mention no longer reaches its session before an earlier event of the same issue that the session takes first. The API''s send of a mention and the outbox''s fallback copy of it each wait until no earlier event of the issue still owes a send that session may take: one to the issue''s topic family, one to the session''s own subject, or one an event whose recipient read failed may owe any session. The outbox records what each event still owes in a new column, `events.owed_keys` (migration `20261117190118`). A held send parks its recipient''s lane with no goroutine on it and tries again after 50 ms, doubling to 2 s; a held fallback copy is read again after 2 s. The wait has no bound, so `/metrics` counts the held copies by owner with the oldest one''s age (`envoy_dispatch_mention_sends_held`, `envoy_dispatch_outbox_fallback_copies_held` and their `_oldest_seconds`), and a copy held a minute logs one WARN naming the earlier event and its last publish error. With `DISPATCH_NATS_DISABLED=1` nothing waits. The two-lease bound on a role forward that waits for an unnamed mention is unchanged.'
