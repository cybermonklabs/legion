kind: Fixed
body: 'A copy of a comment mention no longer reaches its session before an earlier event of the same issue that the session takes first. The API''s send of a mention and the outbox''s fallback copy of it now each wait until no earlier event of the issue still owes a send that session may take: one to the issue''s topic family, one to the session''s own subject, one to a role that session holds when the copy is sent, or one an event whose recipient read failed may owe any session. The outbox records what each event still owes in two new nullable columns (migration `20261117190118`): `events.owed_keys`, the sends, and `events.owed_seq`, the issue''s last event sequence the batch read with them, and an event whose record is older than the issue''s last event holds the copy until the outbox records it again. A held send waits, with its issue''s later sends to the same recipient, on a lane of its own with no goroutine on it, and tries again after 50 ms, doubling to 2 s, while the recipient''s mentions on other issues go on; it keeps its delivery claim while it waits. A held fallback copy is read again after 2 s. The wait has no bound, so `/metrics` counts the held copies, with the oldest one''s age and no label (`envoy_dispatch_mention_sends_held`, `envoy_dispatch_outbox_fallback_copies_held` and their `_oldest_seconds`), and a copy held a minute logs one WARN naming its issue, the earlier event and its last publish error. With `DISPATCH_NATS_DISABLED=1` nothing waits.'
