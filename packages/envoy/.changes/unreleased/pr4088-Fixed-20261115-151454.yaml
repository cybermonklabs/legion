kind: Fixed
body: The listener gives up a message on the agent subject of a session that has no registry record after its retry window, and reports the agent wake, also when the interest row of the session still names this listener. Before, it failed the message as `delivery_failed` on every redelivery and reported no wake until the interest row was reaped, minutes later.
