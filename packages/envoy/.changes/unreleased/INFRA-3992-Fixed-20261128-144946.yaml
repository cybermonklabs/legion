kind: Fixed
body: |-
  A pull request that closed without merging now stays closed in Dispatch when GitHub sends a
  later `pull_request` event for it, such as a label, an edit, a lock, or the `auto_merge_disabled`
  and `dequeued` events that a close sets off. Before, Dispatch decided the stored state from the
  event's action, so every such event stored the closed pull request as open again. It was then a
  subject of its issue's `before_merge` checks, which needed a pass at its head, until the
  reconcile's next read of the pull request closed it again. The listener's `pull_request`
  envelope now carries `state`, GitHub's `open` or `closed` for the pull request when the event
  happened, and Dispatch stores the state from it. A reopened pull request is open again.

  GitHub's event time counts whole seconds, so two events of one second can arrive in either
  order. An event whose copy of the pull request is no newer than the stored one, and says open
  where Dispatch holds closed or closed where it holds open, now leaves the pull request open
  and has the reconcile read it from GitHub at its next pass. So a stale copy can no longer close
  an open pull request, which the reconcile would never read again. The cost: a close that
  shares its second with the event before it, such as `auto_merge_disabled` and then `closed`,
  is stored open until that read, and stays open for as long as the reconcile's passes fail
  (a rate limit, GitHub down); before, such a close was stored closed at once. A deployment with
  no GitHub App key has no reconcile, and it stores no event either, since its intakes are idle.
  An event's copy from before a merge now changes nothing of a merged pull request: not its
  state, its final head, or the attribution rule that judged it.

  An envelope from a listener before this release has no `state`. Dispatch then reads closed
  from a close and open from an open or a reopen. For any other action it stores open, as before,
  but no longer counts that write as a read of the pull request, so the reconcile still reads it
  when it is due.
