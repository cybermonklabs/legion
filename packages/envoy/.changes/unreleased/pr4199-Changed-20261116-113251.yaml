kind: Changed
body: |-
  Every route Dispatch serves needs a credential but `GET /auth/start`, `GET /auth/callback`,
  `/healthz`, `/livez` and the dashboard's own files, and none answers a caller differently for
  its network address or a forwarded-address or tailnet header. `GET /api/v1` and
  `GET /api/v1/schema/blocks` now answer `401` to a caller with no credential. `GET /metrics` is a
  route of the API's table: any caller that sees every public project reads it, the
  deployment's shared agent token and a full member's credential that lists projects included,
  a restricted member's credential, or one acting for one, is `403 DEPLOYMENT_READ_REFUSED`, and
  a caller with no credential is `401`. A scraper
  of `/metrics` sends the shared token; a readiness probe asks `/healthz`, as before. A path under
  `/api`, `/v1`, `/auth`, `/ws`, `/healthz`, `/livez` or `/metrics` that no route serves, in any
  case (`/metrics/`, `/API/V1`), is a JSON `404 NOT_FOUND`, never the dashboard's page.
