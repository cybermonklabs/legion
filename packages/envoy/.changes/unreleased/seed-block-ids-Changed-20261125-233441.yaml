kind: Changed
body: |-
  `dispatch-seed` takes the block ids of the documents it writes from a counter each render of a
  document's latest version holds and hands to its parse, rather than installing a counter in the
  document parser for the whole process. The ids a run writes are unchanged, so a data set seeded
  by this build is the one an earlier build seeded; two runs in one process no longer render each
  other's documents under the other's counter. The parser gains `pmdoc.ParseWithBlockIDs` for it,
  a parse stamped from a generator its caller holds.
time: 2026-11-25T23:34:41Z
