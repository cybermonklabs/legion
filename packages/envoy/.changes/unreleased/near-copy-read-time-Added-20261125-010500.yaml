kind: Added
body: |-
  Each `near_copy_checks` row records how long the near-copy gate's read took (`read_ms`) and the
  step it was in when it answered or ended (`read_stage`: `connect`, taking a pool connection and
  opening the read transaction; `terms`, picking the new text's rarest words; `keys`, reading the
  lexemes the project's issue keys give; or `score`, scoring the project's open issues, which every
  answered read ends in), and `GET /api/v1/near-copy-checks` and `GET /api/v1/near-copy-checks/{id}`
  return both. Before it a row said only that a read ran out of its 2 s bound (reason `bound`) or
  failed, so the creates that went in unchecked (13 of INFRA's on 2026-11-24) could not be placed
  at a pool connection, a statement or a lock, and the bound stayed an estimate. Rows written
  before this release hold both null.
time: 2026-11-25T01:05:00Z
custom:
    Issue: near-copy-read-time
