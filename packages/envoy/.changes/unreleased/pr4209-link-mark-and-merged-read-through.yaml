kind: Fixed
body: |-
    A write of an issue's links (`PATCH /api/v1/issues/{key}` with `external_links`) is followed
    at the next read of the issue's results and of the delivery timeline, a merged pull request's
    included, with no read of GitHub and no reconcile pass. One statement gives a pull request's
    issue at each read from the facts Dispatch stores, and no write of a head row reads a link, so
    a head write in flight while the link is written cannot hide it. A merged row was read by no
    pass once a rule had judged it, so a link written after the merge was never followed. A pull
    request whose facts Dispatch has not stored, such as a row an earlier release wrote, keeps the
    issue its row stores until a reconcile pass reads its facts.

    A tie made after a merge (a link to a GitHub issue the pull request's body cites, a new parent,
    a changed repository mapping, a link moved to the issue) is followed at the next read of the
    results, from the texts Dispatch stored for the merged pull request, with no read of GitHub.

    The intake's settle of a read owed before its read, its head write and its read's place in the
    order of reads (a value of the owed reads' revision sequence) wait on a lock at most 5 s, as the
    owe of a read does, so a lock of `pull_request_reads_owed` or of that sequence, which a
    migration that alters the sequence or sets the table unlogged holds, holds a delivery for
    seconds and not for its minute. The warning of an owed read under a stored rename target that
    is no `owner/name` shows the target to 140 characters.
