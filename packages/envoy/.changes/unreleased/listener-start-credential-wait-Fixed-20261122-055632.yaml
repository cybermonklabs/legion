kind: Fixed
body: |-
  A listener whose NATS credential the server refuses as it starts waits for the server to admit it,
  for up to 180 seconds, rather than exiting: on 2026-11-22 a session listener started before the
  hub's servers had reloaded its new nkey and exited three times in the 64 s the reload took. A
  refusal of the connect (`nats: authorization violation`, an expired or revoked authorization) is
  tried again after 1 s, each wait doubling up to 10 s, the last cut to end at 180 s from the first
  try, and each refusal is logged at WARN with the wait that follows it. The role lane's, the
  session consumers' and an edge listener's relay sockets' connects, which follow the main
  client's, wait out a refusal the same way under the same 180 s, since behind a hub that reloads
  one server at a time one of them can meet a server that has not reloaded after the main client
  got in through one that has. A try in progress at 180 s may still succeed, and no try begins
  after it on a refusal. Meanwhile `/healthz` answers `503` `unhealthy`, its error
  `nats credential refused: ...` naming the last refusal, and `/livez` answers `204`; from the
  moment the connect that met it gets in, `/healthz` answers as before. When the last try begun by
  180 s is refused, or a connect begun after the 180 s is refused at its last dial, the listener
  exits 1, its last line naming its credential (`nkey user <public key>`) and the last refusal. A
  connect's last try decides: one that got past a refusal and then failed for another reason, an
  account at its connection limit among them, is tried again, and one whose last error only a
  setting of the listener lifts, a server that takes no nkey among them, ends the start with that
  error, naming the earlier refusal beside it. Every other failure of the start keeps the pod
  up and is tried again, as `cmd/listener/README.md` ("Start") says: a dial that fails for any
  other reason, the server's own connection limit as it answers the connect's handshake
  (`nats: maximum connections exceeded`, on which the start had ended) and the account's, a server
  that ends the handshake at its `auth_timeout` (`nats: Authentication Timeout`), a connection the
  stream's reconcile finds closed as it reads the server's version, a grant that refuses the
  stream's reconcile, a reconcile the NATS cluster's state answers or the start's hang guard ends,
  an account at one of its JetStream limits at the stream's create or a bucket's open (codes
  10002, 10026, 10027, 10028 and 10047, and 10113 at a bucket, whose byte limit no setting
  chooses), and any other answer of status 500 or more but an invalid configuration (10052), each
  of those last logged at ERROR at each try with its code, the role lane's subscribe and the
  session consumers' check of the server's version; `/healthz` answers `503` `starting` meanwhile.
  The start still ends, exit 1, on what only a setting of the listener or an operator lifts: a
  configuration it cannot parse, a server that takes no nkey (`nats: nkeys not supported by the
  server`), a stream byte limit or copy count the account has no room or tier for
  (`ENVOY_STREAM_MAX_BYTES` over the account's limit, 10122, or unset where it requires one,
  10113; no tiered limit for `ENVOY_NATS_REPLICAS`, 10120), and a durable whose idle heartbeat or
  ack policy NATS cannot change in place. An edge listener (`ENVOY_EDGE_PROJECTS`) only reads the
  stream and opens no role lane: its start waits out a refusal of the connect, and a refusal of
  that read, the same way, and a credential still refused at 180 s ends it; a grant that still
  refuses the read after the 180 s, a stream the server does not hold and a read that does not
  answer keep the pod up and not ready and are tried again, the missing stream logged at ERROR at
  each try until a shared listener or Dispatch creates it. Every other program keeps its start as
  it was (`bus.WithCredentialWait` and `bus.WithStartCheck` are the listener's alone).
