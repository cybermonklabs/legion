kind: Added
body: |-
  `envoy-listener` serves `GET /readyz`, which takes no credential and answers
  `503 {"status":"starting"}` until `/v1` serves and `200 {"status":"serving"}` once it does. It is
  the path a load balancer's health check reads, the edge listener's among them: `/healthz`
  answers `200 {"status":"starting"}` from the listener's first answer, while `/v1` still answers
  `503`, and stays as it is for the probes that read it.
time: 2026-11-21T07:40:40Z
custom:
    Issue: edge-listener-behind-load-balancer
