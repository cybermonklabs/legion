kind: Fixed
body: |-
  When the listener's session-consumer connection reconnects, each relay ends its pull
  instead of waiting up to 30 s for it to stall. If the listener still owns the session,
  the relay restarts at the consumer's ack floor after 1 s, or earlier if a registration
  or edge role claim wakes it. Reconnects do not increase the retry delay for failures.
  The stall remains a fallback when a pull is lost without a reconnect. Replayed messages
  keep their original IDs.
