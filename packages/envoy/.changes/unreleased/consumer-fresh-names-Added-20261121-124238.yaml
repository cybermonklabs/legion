kind: Added
body: |-
  `ENVOY_CONSUMER_NAMES` chooses how the listener names its session consumers and its own durable. `fixed`, the default, keeps today's names. `fresh` gives each creation a name of its own, `<prefix>~<random>`, its suffix 22 characters drawn from `crypto/rand`, so no consumer name is created twice, a deleted consumer's late state write cannot reach its successor, and no name says anything of the next. A selection record in the `envoy_session_consumers` bucket names each logical name's current consumer. The new package `github.com/sjawhar/envoy/consumernames` runs that protocol over the KV bucket and over a Postgres table for Dispatch and the Legion daemon. In the fresh mode every consumer call is refused until the bucket, its sentinel and the cutover's marker exist. `/healthz` reports the mode as `consumer_names` and names what is missing. `envoy_session_consumer_names_total{op,outcome}` counts each selection step.
  Each record carries its own key, and a store reads a value strictly. A value that is not that key's record is refused for that key alone: a server answer stored under the key through a request's reply subject, another key's record copied there, or a field that is not well formed. A registration over such a key is answered `503 consumer_error` naming the key. Such a value under the sentinel's key is a malformed sentinel (`consumernames.ErrMalformedSentinel`), never a missing one (`ErrNoSentinel`, an absent sentinel alone), so a creator that reads a missing sentinel as no marker reads a malformed one as a failed read. A listener in the fixed mode never takes a missing or unreadable sentinel in a bucket that exists for "no marker": it reads again rather than run today's names over a marker it cannot read. Only a bucket that does not exist means no marker. After each reconnect a listener in the fixed mode makes no session-consumer call and no create or bind of its durable until it has read the marker again on the new connection: registrations meanwhile are answered `503 consumer_error` naming the marker, a marker it cannot read keeps them so, and a converted bucket stops it.
  A marker read that keeps failing after a reconnect stalls the listener's reconnect hooks; past the minute `/healthz` reports that stall as the `cutover marker read`, with `bucket` and `key` beside its error, rather than as the `KV watch rebuild`, and the `<N>-reconnect-hooks-stalled` alarm's description says the stall may be that read.
  In the fresh mode a change of a session consumer's filter that passes messages over, an update or a restart, names them (`from` `narrowing`) as the fixed mode does; a restart counts them from the floor's next sequence before its replacement, and logs them once the replacement of a new name is published. A restart whose delete the cutover marker's gate keeps unsent, the gate shut by a reconnect after the restart read the consumer, returns that refusal and logs no loss, since nothing was deleted.
  `consumernames.DecodeKVValue(key, data)` is the session bucket's decode, the one the KV store's reads call: a reader of the bucket's raw messages decodes each value with it as the store does, a value that is not its key's own record or the bucket's own sentinel refused naming the key.
  The families' naming is one table in `consumernames` (`Naming`, `FamilyNaming`: `SessionNaming`, `DurableNaming`, `LogicalNaming`), from which every creator builds its prefix, fixed name, consumer metadata and key rule. `FamilyNaming(family, logical)` takes only the family's own keys: Dispatch's store only its two durables, a daemon's store only `legion-go-<project>-<kind>` of its own project, and the session store a session id or the `DurableKey` of a listener's durable (`listener-<machine id>`, `consumernames.ListenerDurablePrefix`); any other key is `ErrInvalidKey`, naming it. `consumernames.CheckFamily(family, logical, record)` is the family fence by that table, the one each creator applies to every record it reads, for a reader that has no creator's configuration: it refuses a key of another family and a record that names a consumer outside its key's family (`ErrMalformedRecord`, naming the field), so an operator's reader judges a record as the creator does. `consumernames.OwnsFamily(family, logical, info)` is the owner check by the same table, the one each creator applies before it acts on a consumer a record names, for such a reader to ask before it deletes one. `consumernames.Record.DropRetired(name, deleted, now)` is the rule `Names.Cleanup` drops a retired name by, for a reader that deletes retired names itself: the name leaves `retired` and `abandoned` together, and an abandoned name read absent before its `until` and 2 s after it, the clock skew allowed between the host that wrote it and the reader, is kept. Every `consumernames.Config` sets `CreateBound`, the bound the family's creates run under, measured from each reservation; `consumernames.New` panics without it.
  A store's sentinel names its store's family, `session`, `dispatch` or `daemon/<project>` (`consumernames.StoreState.Family`). The KV store is the session family's, and a Postgres store is made for one family (`pgstore.New(family, …)` of the package `github.com/sjawhar/envoy/consumernames/pgstore`, the one that links a Postgres driver, so the listener links none); each reads a sentinel naming another family, or none, as a malformed sentinel, and each store's `WriteSentinel` writes its own family itself and refuses another's. `pgstore.New`, `consumernames.CheckStoreFamily(family)` and `consumernames.DaemonFamily(project)` refuse any other family, and a project that is empty or holds a `/`, white space or a control character (`consumernames.ErrInvalidFamily`, naming the family). Several families can share one Postgres database, as several projects' daemons do: each family's sentinel is the row `envoy.sentinel/<family>` and each record the row `<family>/<logical>`, carrying that key, so a store reads, writes and lists only its own family's sentinel and records. Every store encodes and decodes with `consumernames.EncodeRecord`, `DecodeRecord`, `EncodeSentinel` and `DecodeSentinel`.
  `ENVOY_LISTENER_ROLE=host` marks a host's listener, which connects as the NATS user its sessions share. It runs fixed names for good, reads no cutover marker, and refuses `ENVOY_CONSUMER_NAMES=fresh`.
