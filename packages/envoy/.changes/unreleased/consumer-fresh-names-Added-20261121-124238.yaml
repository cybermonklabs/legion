kind: Added
body: |-
  `ENVOY_CONSUMER_NAMES` chooses how the listener names its session consumers and its own durable. `fixed`, the default, keeps today's names. `fresh` gives each creation a name of its own, `<prefix>~<nuid>`, so no consumer name is created twice and a deleted consumer's late state write cannot reach its successor. A selection record in the `envoy_session_consumers` bucket names each logical name's current consumer. The new package `github.com/sjawhar/envoy/consumernames` runs that protocol over the KV bucket and over a Postgres table for Dispatch and the Legion daemon. In the fresh mode every consumer call is refused until the bucket, its sentinel and the cutover's marker exist. `/healthz` reports the mode as `consumer_names` and names what is missing. `envoy_session_consumer_names_total{op,outcome}` counts each selection step.
  Each record carries its own key, and a store reads a value strictly. A value that is not that key's record is refused for that key alone: a server answer stored under the key through a request's reply subject, another key's record copied there, or a field that is not well formed. A registration over such a key is answered `503 consumer_error` naming the key, and such a value under the sentinel's key reads as a missing sentinel. A listener in the fixed mode never takes a missing or unreadable sentinel in a bucket that exists for "no marker": it reads again rather than run today's names over a marker it cannot read. Only a bucket that does not exist means no marker.
  A store's sentinel names its store's family, `session`, `dispatch` or `daemon/<project>` (`consumernames.StoreState.Family`), and a sentinel naming none is a missing sentinel.
  `ENVOY_LISTENER_ROLE=host` marks a host's listener, which connects as the NATS user its sessions share. It runs fixed names for good, reads no cutover marker, and refuses `ENVOY_CONSUMER_NAMES=fresh`.
