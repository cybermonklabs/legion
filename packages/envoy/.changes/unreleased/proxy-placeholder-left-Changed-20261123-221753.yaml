kind: Changed
body: 'A request on a connection the broker''s proxy reads that still carries a whole placeholder after the swap is now refused `403 PLACEHOLDER_NOT_SWAPPED`, and nothing of it is sent to the service; main forwarded each of these unswapped. That covers an ended grant''s placeholder, including the old placeholder of a renewed grant of the same name as the connection''s own, another session''s, a second grant''s beside the one the request is handled for, a minted capability''s on a request its own host''s path does not swap, and the connection''s own grant''s outside the headers its entry names: in another header (inside a Basic credential too, its base64 padded or not), in a trailer, the path or the query (as written, and unescaped with an escape that is no escape kept as written, so every pair of it is read). A whole placeholder is the prefix `agent-secrets-placeholder-` and 32 letters and digits, or the prefix, a minted kind''s word and a hyphen, and the 32; the prefix with fewer after it is not refused. The refusal line names the grant the placeholder was minted for, in `placeholder_grant`: a release''s while the broker still holds its row, and a minted capability''s while its grant lives. A trailer is read where the request''s body has already been read to its end - an AWS call the proxy signs with the body''s hash, a `Limited` name''s post it reads to find the channel - which is every trailer that could be refused before the request leaves; on a request whose body is streamed to the service the trailers follow the body, after this point. The body is not read, so a placeholder there is carried as the command wrote it.'
