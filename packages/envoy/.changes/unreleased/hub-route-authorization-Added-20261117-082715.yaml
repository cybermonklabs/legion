kind: Added
body: |-
  `gcp:ClusteredNatsHub` takes `routeAuthorization`: the hub's routes present the user `route` and a password from an existing Kubernetes Secret the component names by `secretName` and `secretKey` and never reads, rolled out in three stages, each one apply. `env` gives the nats container `NATS_ROUTE_PASSWORD` from a `secretKeyRef` and `NATS_ROUTE_URLS`, the three pods' route URLs carrying it, and rolls the pods with `nats.conf` unchanged; `routes` names `$NATS_ROUTE_URLS` as the cluster's routes; `authorization` names the user and `$NATS_ROUTE_PASSWORD` as the cluster's authorization, so a server that presents no credential, or a wrong one, is refused a route. The ConfigMap names only the variables. The password holds letters and digits only, a letter first: nats-server reads a variable's value as it reads a literal of `nats.conf`, so a password of digits alone is refused. Unset, the routes carry no credential, as before.
  `envoy-infra routes record` and `envoy-infra routes check` check a hub's routes after `authorization`, through kubectl: `record`, once `env` has rolled every pod, saves each pod's uid and its nats container's restart count and start; `check` exits 0 only when every pod's route port requires authorization, every route joins two of the hub's servers by pod IP and server id, never by name, no pod restarted since the record, each log begins at the server's start, holds no failed reload, and since authorization loaded names no route connection with any address but a pod IP. It exits 1 when the route password may have been read, and 2 when it could not read all it needs or authorization or the mesh is not whole.
  `gcp:NatsHub` takes `monitorThroughIap`: a firewall rule admits IAP TCP forwarding's range, `35.235.240.0/20`, to tcp/8222 alone on the instances that run as the hub's own service account, and the VM's host firewall admits the same range to 8222, so a principal IAM grants a tunnel can read the monitoring port with no SSH. The component grants no tunnel. It is taken beside `privateProjects`: a monitoring path checked by identity is allowed beside that flag, and one that depends only on network position, such as `gcp:ClusteredNatsHub`'s `monitorNamespaces`, is refused. Unset, the VM's user data is as before; a change of it rewrites the user data, so the group replaces the VM.
