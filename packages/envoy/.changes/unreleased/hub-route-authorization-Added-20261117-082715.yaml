kind: Added
body: |-
  `gcp:ClusteredNatsHub` takes `routeAuthorization`: the hub's routes present the user `route` and a password from an existing Kubernetes Secret the component names by `secretName` and `secretKey` and never reads, rolled out in three stages, each one apply. `env` gives the nats container `NATS_ROUTE_PASSWORD` from a `secretKeyRef` and `NATS_ROUTE_URLS`, the three pods' route URLs carrying it, and rolls the pods with `nats.conf` unchanged; `routes` names `$NATS_ROUTE_URLS` as the cluster's routes; `authorization` names the user and `$NATS_ROUTE_PASSWORD` as the cluster's authorization, so a server that presents no credential, or a wrong one, is refused a route. The ConfigMap names only the variables. The password holds letters and digits only, a letter first, and at least 32 characters: nats-server reads a variable's value as it reads a literal of `nats.conf`, so a password of digits alone is refused, and one such as `true` is a boolean. Unset, the routes carry no credential, as before.
  `envoy-infra routes record` and `envoy-infra routes check` check a hub's routes after `authorization`, through kubectl: `record`, once `env` has rolled every pod and before any route port requires authorization, saves each pod's uid and its nats container's restart count and start; `check` exits 0 when authorization is in force with a password and every route since it loaded joined two of the hub's servers: every pod's route port requires authorization and refuses a route login with no user and one with the user `route` and no password, every route joins two of the hub's servers by pod IP and server id, never by name, no pod restarted since the record or during the check, and each log, read with the container runtime's times and only as lines nats-server's logger wrote with the start line's process id, read by the runtime no earlier than 1 s before their logger time and no later than 30 s after it, begins at the server's start as the runtime read it within 30 s of the container's start, holds no failed reload and no server line with a URL that carries a password, and, from the hangup that began the reload that loaded authorization, names no route connection with any address but a pod IP or the pod's loopback. It exits 1 when another process held a route or may have been handed the password, or a log line may hold it, and 2 when it could not read all it needs, when authorization is not in force, left no line of the reload that loaded it, or loaded less than 30 s after a pod's start, when the mesh is not whole or the servers do not hold one password, when a route connection from another address named no server or was still open when the log was read, when the log holds no hangup that began the reload that loaded authorization, when the log holds a line in the server's form the server did not write, or when a pod changed during the check.
