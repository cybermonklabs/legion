kind: Changed
body: |-
    The airlock decides from kinds. The profiles file (`BROKER_PROFILES_FILE`) declares them in a `kinds` list, each a lowercase word with its `hosts`, `headers`, optional `allow` rows of a method and a `pathPrefix`, its `ways` (`swap`, `mint`, `sign`, `exchange`, `dpop`), an optional `placeholder_prefix` and an optional `max_grant`. A kind may also list client `variables`; the broker checks and prints them, and no release applies them yet, so a command still reads a placeholder in the variable named as its secret. A stored secret is behind the airlock when its `proxy` tag names a kind; its `type` picks the way it takes, which the kind's `ways` must hold. A profile is behind its source's kind, and may narrow it with an `allow` of its own, which never widens the kind: a request goes through only when both allow it. A profile's own `allow` needs its source tagged `proxy-narrowed=true`, and a secret so tagged is served through exactly one profile, which has an `allow`. A path prefix now matches only at a `/` boundary. A path with a `.` or `..` segment is refused on every bound host. Where the kind or the profile has an `allow`, the proxy also refuses a path with an empty segment (`path has an empty segment`), a `%2F` (`path has an encoded slash`), a `\` or `%5C` (`path has a backslash`), a `.` or `..` segment with a `;` parameter, such as `/v1/..;/admin` (`path has a parameter on a dot segment`), or a `%252F`, `%252E` or `%255C` (`path has a double-encoded character`); and a request with a method override header (`request carries a method override header`) or a query parameter that reads as `_method` once its name is decoded, with `+` as a space, its leading spaces taken off, `.`, a space and `[` read as `_` and its case folded, so `_meth%6Fd`, `.method` and `+_method` count, as does a name that does not decode (`request carries a method override parameter`). A `_method` field of a form body is not refused, because the decision reads no body. A kind with no `allow` refuses none of these, so a client of such a kind that sends `%2F` or `//`, as `gcloud storage` and some S3 keys do, is not affected.
    A name's fingerprint holds its kind and that kind's `allow`, its `proxy-narrowed` tag and, for a profile, its whole entry and its source's `judge` seconds. So a retag of `proxy` or `proxy-narrowed` ends the grants of that secret's names, and an edit of a kind's `allow` ends the live grants of every name behind that kind; a kind that loses a host or a header ends them too, and one that only gains a host or a header ends none.
    A `proxy` object in a profile is refused, naming `kinds`, except a `proxy` object of kind `dpop` alone, which stays until a `dispatch` kind with the `dpop` way serves those tokens. While secrets move to kinds, a profile may name a kind as the string value of its `proxy` key, `"proxy": "<kind>"`, until its source carries the tag; a string that names its source's own kind writes one WARN line at each full load (`profile's proxy string names its source's proxy kind; drop the string`). Each policy load refuses, naming the secret: a `proxy` tag that names no kind (`proxy-kind-unknown`), a way the kind does not hold (`proxy-way-not-in-kind`), a secret of a kind with a `max_grant` that sets no `max-grant` or a longer one (`proxy-max-grant-above-kind`), a `proxy` string that names another kind than the source's tag (`proxy-kind-conflict`), a malformed or unmet `proxy-narrowed` tag (`proxy-narrowed-malformed`, `proxy-narrowed-profiles`), a profile `allow` with no narrowing tag, outside its kind's `allow` or naming a host its kind does not bind (`profile-allow-not-narrowed`, `profile-allow-outside-kind`, `profile-allow-host`), and a profile of a stored-token, `google-login`, `azure-login` or `anthropic-federation` source with no `proxy` tag (`profile-source-not-proxied`, which replaces `profile-needs-proxy`: a dashboard or alert that reads the old `reason` value or `broker_unservable_secrets` label must read the new one). Before rolling this release out, give each secret behind the airlock its `proxy` tag (`agent-secrets secret retag NAME --proxy <kind>`) and a `max-grant` tag within its kind's `max_grant`.
    `agent-secrets secret create` and `retag` write `rollback-guard:kinds` into a secret's `requesters` tag beside its `proxy` or `proxy-narrowed` tag, and take it out once the secret carries neither, so that a broker from before the kinds refuses the secret rather than release its value. `secret show` prints a `kinds_rollback_guard` line, and `secret list --json` and `secret show --json` a `kinds_rollback_guard` field, beside the project tags' `rollback_guard`; `requesters` there is the list without either guard. A broker older than legion-envoy-v29.23.0 reads no `requesters` tag, so it is no rollback target while any secret carries either tag; the operate guide's "Rolling back past the kinds" gives the read that finds such a tag written without the guard.
    The proxy logs `way` (`swap`, `mint`, `sign`, `exchange` or `dpop`) on each call line, and each credential the broker mints for a grant writes `broker: a token was minted for a call` with the grant, the secret, the way, what it was minted from and the token's SHA-256, never the token.
    `envoy-broker profiles check` reads a file in either form for `--against`, lists each kind's and profile's added and removed hosts, headers, variables, ways, `max_grant` and `allow` rows, and lists under `widens` each served name whose `allow` the change widens. With `--secrets-json` it reads the store's `proxy` and `proxy-narrowed` tags, refuses what the policy load would refuse in the load's words, and exits 1 when a name leaves the proxy. Without it, a profile whose kind is its source's tag cannot be held to its kind, and `widens` compares each kind both files declare instead (`widens kind "<kind>": <row>`, `hosts kind "<kind>": <host> added`), since a secret behind a kind by its own tag is no name it can see; a run that refuses nothing it read but left something unread exits 3, never 0, so a pull-request job with no access to the store can accept 3 by its number and still fail on 1. A job that runs it without `--secrets-json` on a kinds-form file and fails on any exit but 0 fails on this release: give it the store's tags, or accept 3.
    The `anthropic` kind serves `anthropic-federation` secrets: `api.anthropic.com`, the header `Authorization`, the way `mint`, a `max_grant` of `1h`, and `GET`, `POST` and `DELETE` under `/v1/organizations/`. The local stack (`scripts/dev-airlock.sh`) declares it and two test secrets of it, and mints their tokens at stand-ins of IAM's `generateIdToken` and Anthropic's token exchange, which two settings of the local stack alone name, `BROKER_AIRLOCK_TEST_IAM_CREDENTIALS_URL` and `BROKER_AIRLOCK_TEST_ANTHROPIC_TOKEN_URL`; a production start refuses either. `scripts/airlock-check.sh k47` runs the kind's check on that stack, `k8` replaces `k8a` with the ten copies of the profiles file the kinds form calls for, and `k15` runs exactly its ten named mutants. A check that holds a property this head does not build ends `not every property judged` and exits 3.
