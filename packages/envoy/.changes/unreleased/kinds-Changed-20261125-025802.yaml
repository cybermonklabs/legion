kind: Changed
body: |-
    The airlock decides from kinds. The profiles file (`BROKER_PROFILES_FILE`) declares them in a `kinds` list, each a lowercase word with its `hosts`, `headers`, optional `allow` rows of a method and a `pathPrefix`, its `ways` (`swap`, `mint`, `sign`, `exchange`, `app-token`, `dpop`), its client `variables`, an optional `placeholder_prefix` and an optional `max_grant`. A stored secret is behind the airlock when its `proxy` tag names a kind; its `type` picks the way it takes, which the kind's `ways` must hold. A profile is behind its source's kind, and may narrow it with an `allow` of its own, which never widens the kind: a request goes through only when both allow it. A profile's own `allow` needs its source tagged `proxy-narrowed=true`, and a secret so tagged is served through exactly one profile, which has an `allow`. A path prefix now matches only at a `/` boundary, and a path with an empty segment or a percent-encoded `/` is refused before any allow row is read.
    A `proxy` object in a profile is refused, naming `kinds`, except a `proxy` object of kind `dpop` alone. While secrets move to kinds, a profile may name a kind as the string value of its `proxy` key, `"proxy": "<kind>"`. Each policy load refuses, naming the secret: a `proxy` tag that names no kind (`proxy-kind-unknown`), a way the kind does not hold (`proxy-way-not-in-kind`), a secret of a kind with a `max_grant` that sets no `max-grant` or a longer one (`proxy-max-grant-above-kind`), a `proxy` string that names another kind than the source's tag (`proxy-kind-conflict`), a malformed or unmet `proxy-narrowed` tag (`proxy-narrowed-malformed`, `proxy-narrowed-profiles`), a profile `allow` with no narrowing tag, outside its kind's `allow` or naming a host its kind does not bind (`profile-allow-not-narrowed`, `profile-allow-outside-kind`, `profile-allow-host`), and a profile of a stored-token, `google-login`, `azure-login` or `anthropic-federation` source with no `proxy` tag (`profile-source-not-proxied`, which replaces `profile-needs-proxy`). Before rolling this release out, give each secret behind the airlock its `proxy` tag (`agent-secrets secret retag NAME --proxy <kind>`), and a `max-grant` tag within its kind's `max_grant`.
    The `anthropic` kind serves `anthropic-federation` secrets: `api.anthropic.com`, the header `Authorization`, the way `mint`, the variable `ANTHROPIC_ADMIN_TOKEN`, a `max_grant` of `1h`, and `GET`, `POST` and `DELETE` under `/v1/organizations/`. The local stack (`scripts/dev-airlock.sh`) declares it and two test secrets of it, and mints their tokens at stand-ins of IAM's `generateIdToken` and Anthropic's token exchange, which two settings of the local stack alone name, `BROKER_AIRLOCK_TEST_IAM_CREDENTIALS_URL` and `BROKER_AIRLOCK_TEST_ANTHROPIC_TOKEN_URL`; a production start refuses either. `scripts/airlock-check.sh k47` runs the kind's check on that stack, `k8` replaces `k8a` with the ten copies of the profiles file the kinds form calls for, and `k15` runs exactly its ten named mutants. A check that holds a property this head does not build ends `not every property judged` and exits 3.
