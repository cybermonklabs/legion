kind: Fixed
body: |-
  A pod enrolled under another daemon's session name no longer takes that session's grants. A
  pod's grants now follow the pair of its account and the account of the token login that
  enrolled it (`account:<pod account> launched-by account:<login account>`), since every public
  Legion project's pods run as one account and each project's daemon logs in as its own; a pod
  enrolled under a login that proved no account carries nothing. Its session name is still held
  under its account alone, so a pod's enrollment and its own trade never refuse each other.
  Migration 0033 rewrites each pod row's carry principal once, so running sessions keep their
  grants, and a row an older broker replica writes during the roll is still taken by its own
  daemon's next enrollment. A rollback to a broker before 0033 strands every rewritten row: their
  grants are swept at their end and the sessions ask again.
