kind: Fixed
body: |-
    A whole-document upload no longer splits a question a person answered into two. A typed block of an uploaded body that names no block id now takes the id of the live block it leaves unchanged, as an untyped block already did, so the ask row keeps its answer and no second row opens on the same question. A block whose text changed, one the upload moved, and one whose markdown names an id are each unaffected.
