kind: Added
body: |-
  `envoy-broker profiles check <file>` runs the broker's start check of the results profile `DISPATCH_RESULTS_TOKEN` on the file, and exits 1, naming the profile and the fault, on each rule of that check that the file alone decides. The new argument `--private-upstream <host>=<url>` takes the value `BROKER_AIRLOCK_PRIVATE_UPSTREAM` gives the broker, reads it with the broker's own parser, and holds the file to the start's whole check with that destination: the results profile, where the file holds it, binds the destination's host, and a destination needs that profile. A value the parser refuses exits 2, quoting no part of the URL a credential can sit in. Without the argument, a file that holds the results profile prints one more line, naming the host the profile binds and saying that its tie to `BROKER_AIRLOCK_PRIVATE_UPSTREAM` was not checked.
