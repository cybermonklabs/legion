kind: Added
body: |-
  `envoy-broker profiles check <file>` runs the broker's start check of the results profile `DISPATCH_RESULTS_TOKEN` on the file (`config.ResultsEntryRules`: where the file holds the profile, its proxy block is of kind `dpop`), beside the start's check of every `dpop` block, and exits 1, naming the profile and the fault, on each rule that the file alone decides. `--private-upstream '<host>=<url> ...'`, the value `BROKER_PROXY_PRIVATE_UPSTREAM` gives the broker, now also holds each destination's address to the start's rule: `localhost`, and an address no broker takes as a destination (loopback, link-local, a metadata server's, unspecified, multicast, broadcast, `0.0.0.0/8`, an IPv6 form that carries an IPv4 address), exit 2 naming `BROKER_PROXY_PRIVATE_UPSTREAM`, as a value the setting does not take. The new argument `--cluster-ranges <CIDR prefixes>` takes the value `BROKER_AIRLOCK_CLUSTER_RANGES` gives the broker, reads it with the broker's own parser, and makes the address check the start's whole rule: an address outside the private ranges and outside every range given exits 2 naming both settings, and one inside a range given is valid. Without `--cluster-ranges`, such an address is valid with one line, for each such destination, saying it was not judged against the cluster ranges; with it but without a `--private-upstream` that names a destination, the run is a usage error. A `--cluster-ranges` value its parser refuses exits 2, quoting no element of the ranges.
