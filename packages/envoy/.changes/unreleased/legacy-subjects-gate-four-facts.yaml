kind: Changed
body: |-
  `scripts/legacy-subjects-gate.sh` no longer waits out the stream's 72-hour retention between its
  two readings: the second may come 180 s after the first, once each listener's counter line is
  newer than the one the first read. In place of the wait, the second reading reads four facts and
  opens only when each is true, printing `UNKNOWN` for one it cannot read and for a census that
  enumerated nothing: (a1) every pinned build is at or after `--new-form-commit`, from
  `daemon-release-gate.sh --deployment <owner/repo> --clients`; (a2) every connection of every hub
  server (`--hub-statefulset`, `--hub-server`), read by `$SYS.REQ.SERVER.PING.CONNZ` from a Job of
  its own as the `legacy-cutover` user, names its build at or after that commit; (b) every consumer
  of the stream has acknowledged the last old-form message it takes; (c) the stream holds no
  old-form message. New `scripts/legacy-subjects-purge.sh --context <ctx> --reading <record>`
  makes (c) true once (a1), (a2) and (b) read true: it refuses any other reading, purges each
  old-form subject by itself, up to the newest old-form message the reading found, as the
  `legacy-cutover` user, and reads back that none is left. Every Envoy NATS connection now names its
  build after its name (`legion@<commit>` for an image build; the envoy image stamps its binaries
  with its commit), before a trailing ` privacy-required`, which stays last; (a2) reads it there.
