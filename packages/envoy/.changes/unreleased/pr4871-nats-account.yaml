kind: Added
body: |-
  The secrets broker's NATS auth service places every client it admits in the hub account
  `BROKER_NATS_ACCOUNT` names, the audience of each user it answers: `$G` when unset, as before. A
  hub that keeps JetStream in an account of its own keeps its clients in another account, and must
  declare that account before the broker names it, since the hub refuses every client placed in an
  account it does not have. The broker refuses to start on any value but `$G` or one subject token
  of letters, digits, `_` and `-`, naming the setting, and its `NATS auth service state=on` boot
  record names the account.
