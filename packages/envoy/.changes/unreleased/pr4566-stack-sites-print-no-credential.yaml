kind: Fixed
body: |-
    `agent-secrets`, `agent-secrets-helper` and the token client now print no part of the settings
    and files that #4257's fix left printing as they did. The metadata server prints by
    `GCE_METADATA_HOST` and its host only where that is a plain host and port, and a request to it
    that fails prints its class, never the URL whose `?audience=` query holds
    `AGENT_SECRETS_MACHINE_AUDIENCE`. Google's token services print a refusal's status and
    registered error code, never its body, and a request that fails its class. The workload
    identity pool and external_account identities name `AGENT_SECRETS_MACHINE_AUDIENCE` and the
    broker's Google exchange audience only where it is a plain http(s) URL,
    `AGENT_SECRETS_POOL_AUDIENCE` only where it is a pool provider's resource name, and the service
    account (`AGENT_SECRETS_POOL_ACCOUNT`, or the one the credentials file names) only where it is
    a service account's email or unique id, and by their variables otherwise.
    `GOOGLE_APPLICATION_CREDENTIALS`, the well-known credentials file and `AWS_WEB_IDENTITY_TOKEN_FILE`
    print by their settings in every line, the using line and a store's refusal included, never
    their paths; only a command printed for a person to paste and run again names the file the same
    run signed in with. A credentials file's token refresh the token endpoint refuses prints its
    class, not that endpoint's body, inside a Secret Manager error. keygen's and the signer's
    `key.pem` and `keygen -h`'s default of `--out` print as the flag or `AGENT_SECRETS_KEY_DIR`, and
    the key directory, the machine cache, its kept Google exchange audience and its locks, and the
    sign-in store print by name. The request URL of a failed call that ends in an id a person typed
    leaves the id out. A flag value that does not parse, a tag flag's value a secret form refuses
    (`--owner`, `--tier`, `--type`, `--github-owners`, `--requesters`, `--scopes`, `--admin`,
    `--default-grant`), a secret NAME, an argument a form does not take, an unknown form, an id
    that cannot be in a call's path, a settings-file key the file does not take and
    `AGENT_SECRETS_ENROLL_WAIT` are refused without their value. A refused
    `CLOUDSDK_CORE_ACCOUNT`, `CLOUDSDK_ACTIVE_CONFIG_NAME`, `AWS_PROFILE` or
    `AWS_DEFAULT_PROFILE` is refused naming the variable alone, gcloud's own error output is never
    printed, and Google's userinfo answer prints its status and registered code. Every answer
    decoder of `agent-secrets` prints the decoder's words, which can quote a time field of the
    answer whole, only as the broker's address lets the broker's words print. So does every value
    of a broker answer the request, status, self and exec forms, the grant and machine tables,
    login and `enroll --pod` print, and every field of the broker's settings: beside an
    `AGENT_SECRETS_URL` that is not a plain http(s) URL none of them prints, but a request, grant,
    enrollment or machine login id that is a UUID, the shape of every id the broker makes, and
    that the URL does not hold, which the exec form's hint `agent-secrets status <id>` needs, and
    `--json` alone still prints the body as it came. A refusal of AWS Secrets
    Manager or GCP Secret Manager prints the call, the store's code and the permission its message
    says is missing, never the rest of the store's message; an AWS code prints only where it is one
    `agent-secrets` names. The AWS SDK's sign-in failure prints no file path, address setting,
    setting value or STS message, says an expired IAM Identity Center session and a web identity
    sign-in with no role as what they are, and names the AWS settings to check. The well-known
    credentials file prints by the setting that names its directory, a credentials file's account
    and the metadata server's and userinfo's emails only where they are a service account's, a
    refused `--github-owner` or `--github-repo` without its value, login's sign-in page and machine
    login's broker page only where they are plain URLs, and the helper's refusal of a sign-launcher
    call without the method or the URL the caller sent.
