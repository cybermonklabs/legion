kind: Changed
body: |-
    A pod of this release and a pod of an earlier one exclude each other's writes to one issue,
    document or project during a rolling release, in both directions. Migration
    `20261115100924_server_processes_owner_lock_protocol` adds
    `server_processes.owner_lock_protocol`, and `20261115200014_owner_lock_legacy_gate` adds
    `dashboard_builds.owner_lock_protocol`, each an integer with the constant default 0, so no row
    is rewritten; a pod of this release writes 1 in both, and a pod of an earlier release, which
    serialises writers on the owner's row, leaves 0. An earlier release counts as present while a
    pod of it has reported within the last 10 minutes, or for an hour after one last started: its
    boot's dashboard publish, its registration and the return of a lapsed registration each stamp
    that start, through a trigger. While one is present, a write of this release takes the
    owner's row too (`for no key update`, the Inbox's `for share`, a background pass's
    `skip locked`) right after its advisory lock and before it reads what it decides on, which
    holds a transaction id through that write's reads and costs a guarded read one more round trip.
    With none present it takes the advisory lock alone, behind a shared lock of a gate that the
    trigger takes exclusively, so a pod of an earlier release that starts, as a rollback starts
    one, waits at its dashboard publish until every such write has committed, and every write after
    it takes the row. The check and the gate ride in the lock's own statement. While an earlier
    pod's first publish uploads its dashboard's files, writes of this release that start then wait
    for it. Each pod logs once when it starts or stops taking the row.
