kind: Changed
body: |-
    A pod of this release and a pod of an earlier one exclude each other's writes to one issue,
    document or project during a rolling release, in both directions. Migration
    `20261115100924_server_processes_owner_lock_protocol` adds
    `server_processes.owner_lock_protocol`, an integer with the constant default 0, so no row is
    rewritten; each pod of this release registers 1, and a pod of an earlier release, which
    serialises writers on the owner's row, reads 0. While any live pod reads 0, a write of this
    release takes the owner's row too (`for no key update`, the Inbox's `for share`, a background
    pass's `skip locked`) right after its advisory lock and before it reads what it decides on,
    which holds a transaction id through that write's reads and costs a guarded read one more
    round trip; with no such pod live it takes the advisory lock alone, as before, and the check
    rides in the lock's own statement. Each pod logs once when it starts or stops taking the row. A
    pod of an earlier release that starts while a write of this release is between its lock and its
    write, as a rollback starts one, is not seen by that write.
