kind: Fixed
body: |-
  A document edit's `replace` that names no `with`, or carries a member `replace` does not take
  (`markdown`, `after`, `text`, `replacement` or any other, whatever it holds), is refused with
  `400 REPLACE_FIELDS` naming the operation and each such member, and nothing in the batch is
  written. Such a replace was read as an empty `with` and deleted the text its `find` matched, as
  one that sent its new text as `markdown` did, or was applied beside a member it never read. A
  JSON `null` `with` is no `with`; `with: ""` still deletes the match on purpose.
time: 2026-11-20T09:21:35.000000000Z
custom:
  Issue: doc-edit-replace-fields
