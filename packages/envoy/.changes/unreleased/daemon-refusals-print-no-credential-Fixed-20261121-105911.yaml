kind: Fixed
body: |-
    The NATS auth service refuses a `BROKER_NATS_URLS` entry that carries a query or a fragment,
    or an `@` after its host, which is how a token holding a `/` written as the user parses (its
    head becomes the host), by the entry's position alone, as it refuses one with a user name or
    password: the broker writes the hub URLs into its start line and the service's connect error,
    so a token there printed. Name the hub by its address alone. The service's connect error now
    names the hub URLs by their count (`1 BROKER_NATS_URLS entry`, `2 … entries`) and holds none
    of their text, where it quoted the list whole.

    A file setting's refusal names the setting and why it could not read the file (it does not
    exist, permission is denied, it is a directory, it is empty, it holds no seed), never the path,
    which can be a credential pasted where the path goes: the broker's secret files and NATS seed
    files, `dispatch`'s `_FILE` settings (`DISPATCH_AZURE_EMBED_KEY_FILE` among them), and the
    ServiceAccount token file the broker client reads for Dispatch, the broker and the listener,
    whose error now names the setting that holds it (`read the ServiceAccount token
    DISPATCH_AGENT_SECRETS_ACCOUNT_TOKEN_FILE names: its file cannot be read: it does not exist`;
    `BROKER_ENVOY_ACCOUNT_TOKEN_FILE`, `BROKER_PROJECT_ACCESS_TOKEN_FILE`,
    `BROKER_JUDGE_DISPATCH_TOKEN_FILE`, `ENVOY_AGENT_SECRETS_ACCOUNT_TOKEN_FILE`), where it named
    the path. So does the Envoy listener client's read of Dispatch's own token
    (`the listener account token cannot be presented: ENVOY_ACCOUNT_TOKEN_FILE names a file that
    cannot be read: it does not exist`), where a token pasted in place of the path printed in four
    places: Dispatch's log line of the call, the 503 `ENVOY_UNAVAILABLE` answer, the 502
    `ENVOY_UNSUBSCRIBE_FAILED` answer, and the failure stored on a delivery, which the dashboard
    prints. A delivery stored before this change keeps the text it was stored with. And the
    broker client's read of a pod role's key (`read this role's agent-secrets key in the directory
    AGENT_SECRETS_KEY_DIR names: open: no such file or directory`, in the daemon's boot refusal).
    The words come from the module's `fileerr` package, which the daemon reads its secret files by
    too, and the role key's from `redact.File`, as the sign-in client secret's do.

    An `ENVOY_ALLOWED_HOSTS` entry that is no host is refused by its position in the list, and
    `BROKER_SIGNIN_ISSUER` that is no https URL by its name alone. The broker's start lines name
    the Google and sign-in issuers, `BROKER_MACHINE_LOGIN_URL`, `BROKER_JUDGE_DISPATCH_URL`,
    `BROKER_EDGE_URL` and `BROKER_EDGE_MACHINE_LOGIN_URL`, the listener's boot line
    `ENVOY_AGENT_SECRETS_URL` and its OIDC issuer, as `(not printed: …)` when
    the URL carries a credential, where each printed the value whole; the listener's boot line
    names its projected token by `ENVOY_AGENT_SECRETS_ACCOUNT_TOKEN_FILE`, never the file's path.
    The broker's wake notice to Envoy logs a `BROKER_ENVOY_URL` it cannot reach by the failure's
    class when the URL carries a credential, and the sign-in client check's line names a
    `BROKER_SIGNIN_ISSUER` that carries one, and the failure to reach it, the same way: the error
    quoted the issuer's URL with a token written as its user name.

    Every issuer setting refuses a value with a user name or a password, an `@` after its host, or
    a query or a fragment (an empty one included; no issuer identifier has either), naming the
    setting alone: `BROKER_SIGNIN_ISSUER`, `BROKER_GOOGLE_OIDC_ISSUER`, `BROKER_K8S_OIDC_ISSUER`,
    `BROKER_EXCHANGE_GITHUB_ISSUER`, `DISPATCH_SIGNIN_ISSUER`, `DISPATCH_OIDC_ISSUER`,
    `ENVOY_OIDC_ISSUER` and `AGENT_SECRETS_SIGNIN_ISSUER`. A token in `BROKER_SIGNIN_ISSUER`'s
    query loaded before, and the broker's sign-in page showed it to whoever started a sign-in. An
    issuer's discovery and client-check errors, the discovery's log lines, the broker's
    sign-in-unavailable page and its log line, and Dispatch's sign-in and service-token boot lines
    and its domain refusal name the issuer as `(not printed: …)` when it is no plain http(s) URL,
    and a discovery failure by its class then, where it quoted the discovery URL, the issuer's
    with a path appended.

    `BROKER_DATABASE_URL` and Dispatch's `DATABASE_URL` (the server, `census`, `versions` and the
    other subcommands that read it, and `dispatch-seed`'s `--database-url`) are refused, naming the
    setting alone and before anything connects, when the `postgres://` URL holds an unencoded `@`
    after its user part: in its hosts, its database, a query key or a query value. A password
    holding an `@` or a `/` leaves part of itself there, and the broker's and Dispatch's failure to
    open the database printed it (`lookup <the tail>@db…: no such host`, or pgx's quote of the
    whole URL). Write each `@` in a password, a user name or a query value as `%40`, and a `/` in a
    password as `%2F`; a URL with a query value such as `user=sa@project.iam` that loaded before is
    refused too and loads written as `%40`, and a database name holding an `@` is refused however it
    is written (`my@db`, `my%40db`). A failure to open or reach either database
    names the address and the driver's detail without the password, and a DSN pgx cannot parse is
    named by its setting alone, with none of pgx's text, which quoted it; `dispatch-seed` names
    both by its `--database-url`, one its pool cannot parse (`pool_min_conns=-x`) included, refuses
    a URL given as an argument without quoting it, and names a flag Go's flag package refuses by
    the flag alone (`--scale --database-url=<dsn>`, `---database-url=<dsn>` printed the URL). The
    same settings refuse, by the setting alone, a value that names the postgres scheme but is no
    lower-case `postgres://` or `postgresql://` URL with nothing before it (`POSTGRES://…`,
    ` postgres://…`, `postgres:u:<password>@…`), and any other value with a key holding a character
    no keyword or parameter name has (`postgress://…`, `postgres;//…`, `pgsql://…`,
    `postgresql+psycopg2://…`, `jdbc:postgresql://…`, a BOM before the scheme): pgx read each as a
    keyword setting whose name a server that admits the client printed whole. A custom setting's
    name may hold `$` after its first character, as Postgres allows. They refuse, in a keyword DSN
    and in a URL alike (its user info, host list, path and query, decoded as pgx reads them), a
    value other than a password that pgx's connect error or the server prints, the user, the
    database, the host or the hostaddr, holding `://` anywhere (`dbname=' pg://u:<password>@…'`,
    `dbname=jdbc:postgresql://…`, `?dbname=pg://u:<password>%40h`), a user holding a `:`
    (`user=app:<password>`, `?user=app:<password>`), a database holding an `@`
    (`dbname=app:<password>@db/app`), and a host or hostaddr holding an `@`, an `=`, or a `:` in an
    entry that is neither an IP address nor a socket directory (`host=u:<password>@db`,
    `host=127.0.0.1password=<password>`, and `host=db:5432`, which pgx never dialled: the port goes
    in `port=`). A URL's query key is read as pgx reads it, the spaces at its ends dropped, and one
    no keyword's shape has is refused, as the server prints it as a parameter's name. Any other
    value but a password is refused only when it holds `://` and then an `@` anywhere after it, a
    URL with a user name or a password (a password can hold a `/`, `?`, `#` or space, so a URL value
    with an `@` in its path is refused too) (`options='-c datestyle=https://u:<password>@h'`), which
    the server prints as a
    value it refuses, so `application_name=https://…`, `options='-c app.url=https://…'` and an
    `sslpassword` such as `Postgres:Admin1` load. A Cloud SQL socket for a project whose ID ends in
    `postgres`, an IPv6 host or hostaddr, a host list and a password such as `Postgres:Admin1`
    connect. A connect error masks every password the DSN carries as pgx read it, an escaped space
    included, and the value after every `password=`, in any case, read by libpq's rules: a quoted
    one whole (two single quotes in a row, or a backslash, taking the next character), an unquoted
    one to its next space, quote or backtick, and the rest of the text when more of the value
    follows a quote, so a user missing the space before it (`user=apppassword=<password>`,
    `…='<password>'`, `…=zq''<password>`, `…=zq\ <password>`) prints none of it. The
    rule and the words come from the module's `pgdsn` package, which the daemon reads its DSNs by
    too. Under `DISPATCH_DEV_SIGNIN=1` the fence that holds the database to a loopback host reads
    `DATABASE_URL` after that refusal and names a DSN pgx cannot parse by the setting alone, where
    it printed a password's tail as the host it refused, or pgx's quote of the DSN.

    Dispatch refuses a `DISPATCH_AGENT_SECRETS_URL` with a user name or a password, an `@` after
    its host, or a query or a fragment, naming the setting alone, as the daemon refuses them in
    `agent_secrets.url`: such a URL booted, and every introspection Dispatch could not complete
    logged it with only a password masked. The introspection's errors name the broker's URL through
    the module's URL rule. `ENVOY_URL`, `DISPATCH_AZURE_EMBED_ENDPOINT`, `DISPATCH_CHAT_ENDPOINT`,
    `DISPATCH_AZURE_CHAT_ENDPOINT` and `DISPATCH_GITHUB_API_BASE` (read by the server and by
    `redeliver-webhooks`, which also refuse a base that is no absolute http(s) URL with a host:
    one with an unencoded `%` or a space in its password, or with its scheme dropped, booted, and
    the GitHub App client printed it whole) refuse the same shapes by the setting alone: each booted
    with a token written as its user name, and Dispatch printed it in every failed call's error: the Envoy
    listener client's, which reaches the API's 503 `ENVOY_UNAVAILABLE` and 502
    `ENVOY_UNSUBSCRIBE_FAILED` answers, the embedding and chat clients', and the GitHub App
    client's, which names the request's URL, password and all, in the 502 of the App installation
    route, a CI check's detail and the GitHub read record `/healthz` serves. The listener client
    prints a failed call's error through the module's URL rule, without net/http's quote of the
    request URL; the embedding and chat clients print the failure itself for a clean endpoint (a
    refused dial's address, a TLS failure's certificate fault) and its class alone otherwise. A call
    that its caller's context ended prints that end's fixed text in all three, `context canceled`
    or `context deadline exceeded`, which names no part of a URL. A context ended with a cause of
    its own (`context.WithCancelCause`, `context.WithTimeoutCause`, which Dispatch's related-issue
    suggestions use) ends the call with that cause: one that wraps `context.Canceled` or
    `context.DeadlineExceeded` prints that one's text, and one that is none of them and wraps none
    of them prints the class, `the request failed`. The chat and embedding clients bound each
    request with a context deadline of their own (`going`'s `HTTPClient.Chat`, `embed`'s
    `AzureClient.Embed`), which prints `context deadline exceeded` too; the listener client's own
    window prints `context deadline exceeded (envoy listener call window ended: 5s)`
    (`envoy.ErrCallWindow`), its cause redacted under it.
    Dispatch's other refusals of those settings, and its dev sign-in's refusal of
    `DISPATCH_GITHUB_API_BASE`, name the value as `(not printed: …)` unless it is a plain http(s)
    URL, where they quoted it whole, a password or an API key in its query included.
