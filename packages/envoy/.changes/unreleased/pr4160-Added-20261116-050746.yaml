kind: Added
body: The listener counts every request it admits to `/v1` in `envoy_listener_requests_total`, by the credential that admitted it (`shared_token`, `none` for a listener with no bearer, `oidc`, `google` or `broker`) and by the route that served it, and warns at most once a minute for each request admitted on the shared token or with no credential, naming the route and the caller's address. `ENVOY_OIDC_ACCOUNTS` lists, separated by spaces, the service accounts whose projected tokens the listener admits; unset or empty, it admits every one, as before, and a value that names no account, or an entry holding a comma, refuses the start. `ENVOY_OIDC_GOOGLE_AUDIENCE` with `ENVOY_OIDC_GOOGLE_ACCOUNTS` admits a Google identity token of a listed account whose address Google verified, for a caller such as a Cloud Run service that holds no Kubernetes token.
