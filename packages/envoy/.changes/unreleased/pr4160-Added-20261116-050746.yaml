kind: Added
body: The listener counts every request it admits to `/v1` in `envoy_listener_requests_total`, by the credential that admitted it (`shared_token`, `none` for a listener with no bearer, `oidc`, `google` or `broker`) and by the route that served it. It warns at most once a minute for each of the two credentials that are going away, the shared token and no credential at all, naming the route and the caller's address. `ENVOY_OIDC_ACCOUNTS` lists, separated by commas or spaces, the service accounts whose projected tokens the listener admits; unset or empty, it admits every one, as before, and a value that names no account, or a stray comma that leaves an entry empty, refuses the start. `ENVOY_OIDC_GOOGLE_AUDIENCE` with `ENVOY_OIDC_GOOGLE_ACCOUNTS`, its addresses written the same way, admits a Google identity token of a listed account whose address Google verified, for a caller such as a Cloud Run service that holds no Kubernetes token. Every claim the listener, Dispatch and the secrets broker admit a caller on is read from the payload the token's signature covers, and a token in the JWS JSON form is refused as malformed. Logins and account addresses are lowered in ASCII alone, so no letter outside ASCII, such as U+212A KELVIN SIGN, compares equal to another person's `k`; every login Google issues compares as before.
