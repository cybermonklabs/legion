kind: Changed
body: |-
    The spec files of .dispatch/spec are YAML files, one document for each node, that a JSON Schema in the repository checks. The printer double-quotes each text that a YAML 1.1 or YAML 1.2 reader would read as another type, such as `=`, `<<` or a date with a time, so each standard library reads the same strings. A document that holds a null at any place, such as a key with no value, is refused with its place and gives no node, since a YAML library reads a null as the empty value of its place. A document of the approved spec whose id, or the id of a node that it relates to such as its parent, is not in the shape of an id is refused, since the derivation reads a relation only by an id.
    spec-check print takes --dir and writes each node's document into the files at its place. It writes nothing when spec-check tree would refuse the result, when the result would lose or change a node that the run does not name, or when a file of the directory is one whose documents the reader cannot say for certain. It changes all of its files or none, also when it is killed: it builds a new directory beside the spec directory and puts it in the place of the old one with one call, and the next run removes what a killed run of print made there. An entry that another program made or changed there, print keeps beside the directory and names, and it then exits 1. Where the system refuses a second name of a spec file that the run keeps, such as another user's file, print copies that file with its mode. A file system that cannot exchange two directories makes print refuse with nothing written, and the refusal says what to do: for a directory of a container image's layers, put a copy of the directory in its place or mount the checkout; for a directory that is a mount point, mount the directory above it. A second run on the same directory waits for the first. A refusal of a file where a node that the run does not name is not in its printed form names each node of that file, which a run must name to print the file whole.
    A not-printed refusal of spec-check tree shows the line of the file and the line that print writes, and names what differs, such as a carriage return or a space at the end of a line. spec-check compare makes no comparison of a file that is not in its printed form, the one form that each YAML library reads alike, and names spec-check print as the way out. A warning for a file that is not a spec file says that a spec file is a *.yaml file, which spec-check print writes.
    A line of spec-check cuts a value of the input that is longer than 100 bytes, such as a node id, a line of a file or a key that the node does not take, to its first and its last 50 bytes, so a line stays short whatever the files hold, except a value that the line tells the reader to type or to open: a path, an argument, and each id of the way out of a print refusal. The JSON of spec-check checks and of spec-check state --json holds each value whole.
