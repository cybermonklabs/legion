kind: Added
body: |-
  The NATS auth service admits the JetStream reader: a `BROKER_NATS_SERVICES` entry of the new
  kind `jsread` (`jsread/-/*=<account>`, with no machine id and the whole grant), one for each
  account the deployment's Legion pods run under, connects with a platform token for the broker's
  NATS audience and is answered as `jsread/<account>` with `natsgrant.JSRead`, a copy, entry for
  entry, of the deployment's static `legion-jsread` user: publish `$JS.API.INFO`,
  `$JS.API.STREAM.NAMES`, `$JS.API.STREAM.LIST`, `$JS.API.STREAM.INFO.*`,
  `$JS.API.CONSUMER.NAMES.*`, `$JS.API.CONSUMER.LIST.*` and `$JS.API.CONSUMER.INFO.*.*`, and
  subscribe its own inbox prefix alone, `_INBOX_legion_jsread.>` (`natsgrant.JSReadInbox`), which
  the reader connects with. The grant reads stream and consumer names and infos and no message,
  and changes nothing. The broker refuses to start on a `jsread` entry with a machine id or with
  `-`, since a stream's info lists every project's subjects and cannot be held to projects; two
  entries with distinct accounts are taken. A broker older than this release refuses to start on
  any `jsread` entry, as an entry of an unknown kind, so upgrade the broker before adding one. No
  project may be private while `BROKER_NATS_SERVICES` lists a `jsread` entry: this auth service
  holds no privacy rule for any kind, so the deployment keeps that rule. The legacy-subjects
  gate's list of callout kinds (`scripts/lib/legacy-subjects-gate-callout-publishers.json`)
  classifies `jsread` as publishing no notification subject.
