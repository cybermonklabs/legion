kind: Changed
body: |-
  Document settlements run at most four at once, however they start, each on the settlements
  pool, which a settlement opens before it warms a cold room, so none of its reads takes a
  connection the requests are counted for; each has 60 seconds, however it starts; one that runs
  out of time or finds no connection free rolls back, keeps its document owed and is resumed
  later without counting as a failure. A settlement that has already written into its room - a
  block-id stamp, an ask repair - finishes storing it apart from that deadline, so the room stays
  resident with its editors connected rather than failing over work all but committed. Its writes
  run apart from that deadline too, under a bound that grows with the document - 2 seconds and
  0.9 ms a block, never less than the deadline leaves them - so a version of 150,000 blocks, whose
  writes take some 45 seconds once its blocks are graph nodes and tuples, is written rather than
  cut at the minute and resumed for ever. A settlement renders the document before it locks the
  document's owner row, so it no longer holds that row, and every writer of the issue queued
  behind it, across a render. A document whose ask blocks need repairs gets them in one commit and
  its version in the next.
