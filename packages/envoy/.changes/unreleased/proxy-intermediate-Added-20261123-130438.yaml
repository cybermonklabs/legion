kind: Added
body: |-
    The broker's proxy signs each bound host's leaf with an intermediate of its own pod. With `BROKER_PROXY_CA_POOL` naming a pool of Google Certificate Authority Service, each pod makes an ECDSA P-256 key in memory, sends the pool a certificate request for a 7-day authority of path length 0 for servers alone (`serverAuth` its one extended key usage), constrained to the names of the profiles file's hosts, with its own Google credential, asks for the next with 2 days left whatever its life, but no sooner than 5 minutes after it took that one, so a pool that answers one of 2 days or less is asked at most twelve times an hour, and retries with a backoff of 1 second doubling to 5 minutes. After a renewal it goes on signing with its previous intermediate until a minute after the new one's start, so a client whose clock runs up to a minute behind never meets one that is not yet valid; a pod's first intermediate, and the one after an ended one, rely on the pool's `backdateDuration: 300s`. It logs `proxy intermediate` (serial, names, start and end) for each one it takes and `proxy intermediate request failed` for each failure, an answer it refuses included: one for another key, one that reaches no root or another root than its first, and one that would sign no trusted leaf for a bound host. A pod that holds no certificate it may sign with answers `GET /healthz` with `503 NO_INTERMEDIATE`; that takes it out of every Service, the edge's included, so a pool outage past an intermediate's end, a lost IAM grant or a policy every answer of which the pods refuse takes down the whole broker. The pool holds one certificate authority, and its issuance policy sets `critical: true` on the name constraints, `serverAuth` as the one extended key usage and `backdateDuration: 300s`.
    `BROKER_AIRLOCK_CA_CERT_FILE` may now hold an intermediate and then each authority up to its root, as well as a self-signed root alone, and is not read with the pool set. The broker refuses at start a chain that reaches no root, one that would sign no trusted leaf for a bound host, and one whose life is over. Every intermediate, the pool's answer and a mounted one alike, must be an authority of path length 0 whose key usage signs certificates and whose one extended key usage is `serverAuth`, last 7 days and 5 minutes at most, and have name constraints, marked critical, that permit exactly the DNS names of the bound hosts, permit no IP range and exclude every IPv4 and IPv6 address (`0.0.0.0/0` and `::/0`); the pod's request asks for exactly that, and the pod refuses an intermediate past any of these, whatever the pool's issuance policy answered. A name constraint covers only names of its own kind, so without the exclusion the intermediate's key would sign a trusted leaf for any IP address; URI and email names are left unconstrained, since no TLS client takes either as a server's identity. A pool's issuance policy therefore carries the exclusion too. Go never takes a common name as the server's name and GnuTLS refused every leaf that names a host only there; clients built on OpenSSL (curl, Python, Node) accept a name outside the allowed ones when the common name of a leaf with no DNS alternative name is one label, such as `localhost`, or a wildcard over two or more labels, such as `*.evil.example`, and refuse a plain two-label name and a wildcard over one label, such as `*.example`; Bun accepts any name through the common name when the leaf also carries a URI, email or registered-ID alternative name; so against those clients a leaked pod key is bounded by the intermediate's life and not by its names. A leaf lasts 25 hours from its start to its end, and never past the certificate that signed it; the TLS answer carries the leaf and every authority up to the root. Every release carries the root of the chain and each root of the new `BROKER_PROXY_RELEASE_ROOTS_FILE`, so a rollout hands out two roots at once.
    For the local stack alone, and refused in a cluster and on a production start: `BROKER_PROXY_TEST_CA_URL`, `BROKER_PROXY_TEST_CLOCK_OFFSET_FILE` and `BROKER_PROXY_TEST_RENEWAL_MARGIN`. `dev-airlock.sh` takes each broker's intermediate from the new `ca` stand of `cmd/dev-proxy-stands`, exports `AIRLOCK_CA_CERT_FILE` as a file of both of the stack's roots and `PROXY_ROOT_FILE` as the proxy's alone, and no longer exports `AIRLOCK_CA_KEY_FILE`; `scripts/proxy-chain-check.sh` runs the chain's checks on that stack.
