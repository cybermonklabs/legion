kind: Fixed
body: |-
    The GitHub intake writes a pull request's head row in a Dispatch that holds no delivery
    settings, from GitHub's own answer about the pull request each `pull_request` event names. It
    bound its NATS durable only once `delivery_settings` held a row and dropped every envelope while
    it held none, so such a Dispatch learned a pull request only from a result's read-through, and a
    `before_merge` pass at the open pull request's head read as older with
    `no_pull_request_or_branch`. The head and the state are read from GitHub and never from the
    envelope: a `labeled` or `edited` event of a closed pull request no longer stores it as open
    again, and an envelope GitHub never sent moves no head. A merge of the delivery population and
    a workflow run still wait for the settings. The first start of a Dispatch whose `delivery-events`
    durable never existed replays the 72 hours the stream keeps, at one read of each pull request it
    names, at most four at a time; a rate limit is waited out.

    No event's head is lost when GitHub does not answer: an envelope the intake gives up on after
    its 30 deliveries (a GitHub outage of about five minutes), and GitHub's 404 for a pull request
    its own event names, record the pull request in the new table `pull_request_reads_owed`, and the
    reconcile reads each one from GitHub until GitHub answers, creating its head row. Each row says
    why its read is owed, a failure (GitHub did not answer) or a refusal (GitHub cannot give the
    pull request), and every pass reads each failure before any refusal, with 50 reads a pass for
    refusals, so envelopes that name pull requests GitHub never had take no read from a pull
    request an outage left owed. A stored head row's time stops a read of GitHub, or wins against
    GitHub's answer, only where a read of GitHub wrote it (the new column
    `pull_request_heads.github_read_at`): a row an earlier release stored from an envelope, whose
    time a caller sets, no longer keeps its head and state against GitHub, and a trigger takes the
    mark away from a row that release changes while it serves beside this one. Where a read of
    GitHub replaces such a row that is newer than its own answer, or a row of the same GitHub second
    with other facts, a second trigger owes the pull request a read, so the next pass writes
    GitHub's current answer. No clock decides which owed read a read answers: each owe gives the
    record a new revision, and a read deletes the record only at the revision it read before it
    read GitHub, so an owe made during the read stays. A stored answer spares the read of an event
    only where its `updated_at` is a later second than the event's. `delivery.AttributionRuleVersion`
    is 3, so the reconcile reads every stored merged row from GitHub once more.

    Every hand-back of an envelope to NATS has a limit, so no envelope holds one of the intake's
    four in-flight slots for ever. An envelope that names no pull request a row can hold (a number
    outside 1 to 2147483647, a repository name that is not `owner/name`), and one whose write
    Postgres refuses for its values, are acknowledged at their first delivery with one log line.
    At the cap of 30 deliveries, an envelope whose owed read cannot be recorded either is
    acknowledged with one ERROR line naming the repository and the number.
