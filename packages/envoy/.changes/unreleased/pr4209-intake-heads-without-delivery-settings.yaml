kind: Fixed
body: |-
    The GitHub intake writes a pull request's head row in a Dispatch that holds no delivery
    settings, from GitHub's own answer about the pull request each `pull_request` event names. It
    bound its NATS durable only once `delivery_settings` held a row and dropped every envelope while
    it held none, so such a Dispatch learned a pull request only from a result's read-through, and a
    `before_merge` pass at the open pull request's head read as older with
    `no_pull_request_or_branch`. The head and the state are read from GitHub and never from the
    envelope: a `labeled` or `edited` event of a closed pull request no longer stores it as open
    again, and an envelope GitHub never sent moves no head. A merge of the delivery population and
    a workflow run still wait for the settings. The first start of a Dispatch whose `delivery-events`
    durable never existed replays the 72 hours the stream keeps, at one read of each pull request it
    names, and one more where an event of the second of GitHub's answer comes after that read, at
    most four at a time.

    No event's head is lost when GitHub does not answer: a delivery whose read of GitHub fails, a
    rate limit included, and GitHub's 404 for a pull request its own event names, record the pull
    request in the new table `pull_request_reads_owed`, and the intake acknowledges the envelope
    once that record is written, so a fault of one repository or a limit of one installation holds
    none of the intake's four in-flight slots. The reconcile reads the failures from GitHub, 200 a
    pass and the fewest reads first, until GitHub answers, creating each one's head row: after a
    failed read the head comes at the first pass that reaches it, the next one while fewer than 200
    failures are owed before it, which starts at most 5 minutes and a tenth more after the last pass
    ended, or sooner at the pull request's next event, and a result recorded at that head while
    GitHub answers still gets it at once, through the read for the result's own commit. A 404 ends
    the read only on one answer of GitHub's GraphQL API, asked with the token of the refused read,
    that shows the repository and its pull requests readable (a count of its pull requests) and the
    pull request absent; every
    other answer leaves the read owed, and no memory of a pass ends one. A pass asks at most 250
    such questions about the reads GitHub answers 404 or 410, one for each owed read it can make,
    and the completion of a partial delivery row asks within what the owed reads left: a partial
    row the pass asks nothing about stays partial, and the next pass reads it again. Each row says
    why its read is owed, a failure (GitHub did not answer) or a refusal (GitHub cannot give the
    pull request), and every pass reads each failure before any refusal, with 50 reads a pass for
    refusals, so
    envelopes that name pull requests GitHub never had take no read from a pull request an outage
    left owed; a pass looks the installation of each repository up once, so a repository the App
    is not installed on costs it one lookup. A rate
    limit on one installation ends no read of the pass for another. A stored head row's time stops
    a read of GitHub, or wins against GitHub's answer, only where a read of GitHub wrote it (the new
    column `pull_request_heads.github_read_at`): a row an earlier release stored from an envelope,
    whose time a caller sets, no longer keeps its head and state against GitHub. A row that release
    changes while it serves beside this one loses its mark and is owed a read in the same
    statement, and where a read of GitHub replaces a row that is newer than its own answer, or a row
    of the same GitHub second with other facts, the pull request is owed a read too, so the pass
    that reaches that owed read writes GitHub's current answer. No clock decides which owed read a
    read answers: each owe gives the record a new revision, and a read deletes the record only at
    the revision it read before it read GitHub, so an owe made during the read stays. A stored
    answer spares the read of
    an event only where its `updated_at` is a later second than the event's.
    A stored pull request that has no texts of a read of GitHub is read again by the reconcile,
    which then gives its issue from its facts.

    An envelope that names no pull request GitHub can have (a number outside 1 to 2147483647, or a
    repository that is not `owner/name` with GitHub's own characters and lengths: an owner of at
    most 39, a name of at most 100), and one whose repository's canonical name breaks the same
    bounds, are acknowledged at their first delivery with one log line: each row's values are
    checked where the row is built, before any statement. A GitHub answer that holds a value no
    head row holds (text with a NUL byte, for one) is a head not stored: the intake owes the pull
    request a read, and the reconcile keeps it owed until GitHub answers values a row holds. Every
    failure of the owed record's statement, whatever its SQLSTATE, hands the envelope back every 10
    seconds until the database takes the record, for as long as the bus keeps the event, 72 hours.
    Every line such a delivery writes, its own WARN line and each line of the reads under it, is
    written at its own level at the first delivery and then once every 30 deliveries, and at DEBUG
    at every other. A pull request GitHub answers 404 for logs one INFO line, once its read is
    owed.
