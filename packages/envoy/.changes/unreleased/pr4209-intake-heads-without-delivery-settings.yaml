kind: Fixed
body: |-
    The GitHub intake writes a pull request's head row in a Dispatch that holds no delivery
    settings, from GitHub's own answer about the pull request each `pull_request` event names. It
    bound its NATS durable only once `delivery_settings` held a row and dropped every envelope while
    it held none, so such a Dispatch learned a pull request only from a result's read-through, and a
    `before_merge` pass at the open pull request's head read as older with
    `no_pull_request_or_branch`. The head and the state are read from GitHub and never from the
    envelope: a `labeled` or `edited` event of a closed pull request no longer stores it as open
    again, and an envelope GitHub never sent moves no head. A merge of the delivery population and
    a workflow run still wait for the settings. The first start of a Dispatch whose `delivery-events`
    durable never existed replays the 72 hours the stream keeps, at one read of each pull request it
    names, and one more where an event of the second of GitHub's answer comes after that read, at
    most four at a time.

    No event's head is lost when GitHub does not answer: a delivery whose read of GitHub fails, a
    rate limit included, and GitHub's 404 for a pull request its own event names, record the pull
    request in the new table `pull_request_reads_owed`, and the intake acknowledges the envelope
    once that record is written, so a fault of one repository or a limit of one installation holds
    none of the intake's four in-flight slots. The reconcile reads each failure from GitHub every
    pass until GitHub answers, creating its head row: after a failed read the head comes at the
    reconcile's next pass, or sooner at the pull request's next event. A 404 ends the read where the
    App can read the repository, and a read of a repository the App cannot read stays owed. Each
    row says why its read is owed, a failure (GitHub did not answer) or a refusal (GitHub cannot
    give the pull request), and every pass reads each failure before any refusal, with 50 reads a
    pass for refusals, so envelopes that name pull requests GitHub never had take no read from a
    pull request an outage left owed. A rate limit on one installation ends no read of the pass for
    another. A stored head row's time stops a read of GitHub, or wins against GitHub's answer, only
    where a read of GitHub wrote it (the new column `pull_request_heads.github_read_at`): a row an
    earlier release stored from an envelope, whose time a caller sets, no longer keeps its head and
    state against GitHub. A row that release changes while it serves beside this one loses its mark
    and is owed a read in the same statement, and where a read of GitHub replaces a row that is newer
    than its own answer, or a row of the same GitHub second with other facts, the pull request is
    owed a read too, so the next pass writes GitHub's current answer. No clock decides which owed
    read a read answers: each owe gives the record a new revision, and a read deletes the record
    only at the revision it read before it read GitHub, so an owe made during the read stays. A
    stored answer spares the read of an event only where its `updated_at` is a later second than
    the event's. `delivery.AttributionRuleVersion` is 3, so the reconcile reads every stored merged
    row from GitHub once more.

    An envelope that names no pull request a row can hold (a number outside 1 to 2147483647, a
    repository name that is not `owner/name`), and one whose write Postgres refuses for its values,
    are acknowledged at their first delivery with one log line. An envelope whose owed read cannot
    be recorded is handed back every 10 seconds until the database takes it.
