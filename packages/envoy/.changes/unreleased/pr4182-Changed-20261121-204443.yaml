kind: Changed
body: A comment, an issue message, a direct reply, an ask and an answer store whom they reach as `delivered_to`, `participates_in` and `mentions` relations of the node store, written by the write itself in its transaction, and a read mark or a dismissal as a relation from the person. The read-state tables are projections of those relations, the census proves each row against them, and the backfill and the block-index tick state the rows an older build wrote, its moves of who an ask waits on and the people its texts name among them. A person's page (`GET /api/v1/people/{login}/nodes`) lists what was delivered to them beside what they wrote. `GET /api/v1/inbox`, `GET /api/v1/me/replies` and `GET /api/v1/agents/{session_id}/messages` answer as before for one release; no client in this repository calls them but the two fallbacks of a roll. This release both reads and sends the scopeless `GET /api/v1/asks/open`, which a pod of the release before refuses with `400 AUTHOR_SESSION_OR_PROJECT_REQUIRED`, so the page falls back on that refusal to the reads the scopeless form replaces, and `dispatch inbox` falls back to `GET /api/v1/inbox` and `GET /api/v1/me/replies` where the server answers `404` for `GET /api/v1/me/inbox`.
