kind: Fixed
body: |-
  No issue read or agents list waits on the Envoy listener any more: each Dispatch process refreshes its 5-second copy of the listener's session list 2 seconds before it expires, with or without reads, so a listener that took 2 seconds to answer no longer stalled every issue read 2 seconds holding its admission unit (1,120 reads refused `429 OVERLOADED` at ten times the load); a read that finds the copy past its 5 seconds reads every route `unknown`, and `GET /api/v1/agents` answers `503 ENVOY_UNAVAILABLE`, at once, save a process's first agents list before it has any copy, which waits up to 2 seconds for the listener's first answer holding no admission unit, and a listener read that takes over a second is logged with its duration and outcome.
