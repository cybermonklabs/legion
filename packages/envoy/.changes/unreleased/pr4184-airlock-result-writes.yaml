kind: Changed
body: |-
  The secrets broker's airlock proxy carries a CI run's result write with the run's results token, which each broker pod now mints itself for the run's result grant (`result_grants`), bound to a DPoP key the pod makes at start and holds in memory alone, and logs once by its thumbprint (`broker: the airlock's DPoP key`). A grant made at one pod serves writes through every other pod of the same results entry, and outlives the pod that made it; the token ends with the grant. A write after the grant's end is refused `407 GRANT_NOT_LIVE`, on a new connection and on one already open. A result grant's placeholder, as the proxy password, opens no tunnel and no plain-HTTP forward to a host its grant does not bind, or to the bound host on another port: each is refused `403 RESULT_GRANT_HOST_ONLY` before anything is resolved or dialled. Every other grant keeps its tunnels to hosts no proxy block binds.

  To a host a proxy block of kind `dpop` binds, the proxy refuses before it dials a request whose one `Authorization` header is not `DPoP <placeholder>` (`403 NO_PLACEHOLDER`) and a request with an `Upgrade` header (`403 PROTOCOL_SWITCH_REFUSED`). It puts the run's token in place of the placeholder, sets a DPoP proof of the pod's key for `https://` and the bound host and the request's path, whatever address it sends the request to, in place of any `DPoP` header the command sent, and sends the request without the command's `Forwarded`, `X-Forwarded-For`, `X-Forwarded-Host`, `X-Forwarded-Proto`, `X-Real-IP` and `Via` headers. Its line for such a call names the grant and the job's `ci_check_run_id`, and a result grant's caller is the grant alone. A stored secret under a proxy block of kind `dpop` is never released, to the session or to the proxy (`ErrAirlockMintedOnly`).

  Every answer the proxy gives itself now carries its code in `Airlock-Code`, and `Airlock-Forwarded: false` when no byte of the request had left the proxy, or `Airlock-Forwarded: unknown` when the request may have reached its service first: a connection that broke after the request was sent, a grant that ended while the service held the call. An answer it carried from a service carries `Airlock-Forwarded: true` and no `Airlock-Code`, whatever the service sent, and an informational (`1xx`) answer it carried carries neither header. `BROKER_AIRLOCK_TEST_RESOLVE` takes a port beside an entry's address (`<host>=<address>:<port>`), which the proxy dials in place of the CONNECT's port, so a local stand-in needs no port 443; a production start still refuses the setting.
