kind: Changed
body: |-
  The secrets broker's airlock proxy carries a CI run's result write with the run's results token, which each broker pod now mints itself for the run's result grant (`result_grants`), bound to a DPoP key the pod makes at start and holds in memory alone, and logs once by its thumbprint (`broker: the airlock's DPoP key`). A grant made at one pod serves writes through every other pod, and outlives the pod that made it; the token ends with the grant. A write after the grant's end is refused `407 GRANT_NOT_LIVE`, on a new connection and on one already open.

  To a host whose rules entry is of kind `dpop`, the proxy refuses before it dials a request whose one `Authorization` header is not `DPoP <placeholder>` (`403 NO_PLACEHOLDER`, which was `REQUEST_NOT_ALLOWED`) and a request with an `Upgrade` header (`403 PROTOCOL_SWITCH_REFUSED`). It puts the run's token in place of the placeholder, sets a DPoP proof of the pod's key for `https://` and the bound host and the request's path, whatever address it sends the request to, in place of any `DPoP` header the command sent, and sends the request without the command's `Forwarded`, `X-Forwarded-For`, `X-Forwarded-Host`, `X-Forwarded-Proto`, `X-Real-IP` and `Via` headers. Its line for such a call names the grant and the job's `ci_check_run_id`, and a result grant's caller is the grant alone. A stored secret under a `dpop` entry is never released (`ErrAirlockMintedOnly`).

  Every answer the proxy gives itself now carries `Airlock-Forwarded: false` and its code in `Airlock-Code`; an answer it carried from a service carries `Airlock-Forwarded: true` and no `Airlock-Code`, whatever the service sent. `BROKER_AIRLOCK_TEST_RESOLVE` takes a port beside an entry's address (`<host>=<address>:<port>`), which the proxy dials in place of the CONNECT's port, so a local stand-in needs no port 443; a production start still refuses the setting.

  The proxy's dpop transport that signed with a key and token a pod kept in memory per grant is removed.
