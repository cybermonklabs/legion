kind: Changed
body: |-
  The secrets broker's airlock proxy carries a CI run's result write with the run's results token, which each broker pod now mints itself for the run's result grant (`result_grants`, the grants of the results capability, one kind of minted capability), bound to the pod's own DPoP key (`broker: the proxy's DPoP key`). A grant made at one pod serves writes through every other pod of the same results entry, and outlives the pod that made it; the token ends with the grant. A write after the grant's end is refused `407 GRANT_NOT_LIVE`, on a new connection and on one already open. A result grant's placeholder, as every minted grant's, opens no tunnel and no plain-HTTP forward to a host its grant does not bind, or to the bound host on another port: each is refused `403 MINTED_GRANT_HOST_ONLY` before anything is resolved or dialled.

  The proxy's line for a call of a result grant, and its line for such a call it refused, name the grant and the job's `ci_check_run_id`, so each line ties to the run Dispatch stores the result for. A stored secret of the results profile's name is never released, to the session or to the proxy (`403 MINTED_ONLY`), as no stored secret under a proxy block of kind `dpop` is.
