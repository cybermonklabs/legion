kind: Added
body: |-
  The secrets broker takes a Google group as a secret's owner and in its requesters, written
  `group:` and the group's lowercase email (`agent-secrets secret create|retag --owner
  group:<email> --requesters "group:<email>"`). Each member of an owner group decides the secret's
  requests on the approval page, finds them in Dispatch's Inbox, gets its agent-tier secret at
  once, and lists and revokes the grants a member approved, as one owner does; a group in
  `requesters` admits its members' sessions. The broker reads each group a served secret names
  with the Directory API's
  `members.list`, nested members included, when the five-minute policy load first names it and
  once an hour after that, as the reader account `BROKER_DIRECTORY_ACCOUNT` names (a service
  account holding Workspace's Groups Reader role, whose token the broker mints with the one scope
  `admin.directory.group.member.readonly`); `BROKER_DIRECTORY_URL` names the Directory API's base
  URL. Each read logs `group members read`. A group not read for 2 hours admits nobody, and every
  grant of a group's secret is checked again at each release and reuse: a grant whose deciding
  member the group no longer admits releases nothing and logs `group approval lapsed`. The new
  secret type `anthropic-federation` releases an Anthropic access token (`sk-ant-oat01-…`): the
  broker mints the Google identity token of the account `BROKER_SERVICE_ACCOUNT_SECRETS` binds
  the secret to, for the audience `https://api.anthropic.com`, and trades it at Anthropic's
  `POST /v1/oauth/token` with the organization, federation rule, service account and optional
  workspace ids the stored value holds. Such a secret is human tier alone (`type-human-tier`),
  takes a `max-grant` of an hour or less, names its one owner, a person or a group, in its
  `requesters`, and takes no `scopes`.
