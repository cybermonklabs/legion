kind: Added
body: |-
  The load harness records, for every second of a step, the arrivals its schedule held and the
  arrivals it sent (`arrivals.json`), and sets aside a step whose requests or event writes run
  more than a tenth over schedule in any second of its window: a generator that stalls fires
  every overdue arrival at once when it runs again, so such a step did not deliver the load it
  names. An arrival counts in its scheduled second unless it was sent more than 100 ms late, so
  the few milliseconds an on-time generator runs behind no longer carry a rate drop's arrivals
  into the slower second after it, while a stalled generator's burst still lands where it was
  sent; the largest lateness of each kind is recorded in `arrivals.json`, `summary.json` and the
  tables. A step that was to send a kind and recorded nothing scheduled of it is set aside too,
  since the rule has nothing to judge it by. A set-aside step is neither a pass nor a fail, and
  `summary.json`, `TABLES.md`, `run-step.sh`'s closing lines, `loadgen curves` and
  `loadgen step-check` say so first. Each step also records the server's accept backlog once a
  second (`accept-backlog.json`: the Dispatch listener's `rx_queue` against
  `net.core.somaxconn`, with TCP active and passive opens; unmeasured, with the reason, under
  gVisor, which reports no backlog), and `LOADTEST_SERVER_CPUS` and `LOADTEST_GENERATOR_CPUS` pin
  the server side and the generator to CPU lists of their own, refusing overlapping lists and a
  runtime that ignores the pin. Under a server list, Dispatch's `GOMAXPROCS` defaults to the
  list's CPU count rather than the unpinned box's, a `LOADTEST_GOMAXPROCS` or `--gomaxprocs`
  that differs from that count is refused before anything starts, and each step's `meta.json`
  records the `GOMAXPROCS` Dispatch runs with, read back from its process, beside the list and
  its count, refusing the step before its window when the two differ.
