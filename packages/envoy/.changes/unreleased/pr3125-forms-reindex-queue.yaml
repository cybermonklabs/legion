kind: Fixed
body: |-
    During a rolling deploy, a server of the previous release deleted the reference rows of the forms this release adds (an issue's tab addresses, such as `dispatch://KEY/plan`, and an issue document's dashboard URL) whenever it rewrote a text that held them, because it cannot read those forms. The text was never touched. Each such text is now owed a re-index in `refs_forms_owed`, a queue the previous release does not know. Triggers fill it on every write, an ask's answer and options included, and on every delete from `refs` and from each table of block references (`block_refs`, `comment_block_refs`, `message_block_refs` and `ask_block_refs`) that this release does not settle itself, and its seed fills it from the texts already stored. Only this release drains it, in a duty with a lease of its own (`refs-forms`) that passes over a row it leaves owed so the rows after it still drain, and a row is settled only when this release has indexed that whole text itself, its blocks included. So a backlink of the new forms can be missing while an older process writes the text, and it comes back at the next pass of the duty, within about 30 s. A re-index of a document at a version already indexed, which the duty makes of every stored document after the deploy, keeps the backlink excerpts that version stored. The queue takes one more lease connection: a server opens up to 118 connections to Postgres rather than 117 (`store.LeasePoolSize` 27 rather than 26, `store.ConnectionsPerProcess`), envoy-infra's `dispatchConnectionsPerPod` is 118 to match, and the worker image's test Postgres allows 495 rather than 491.
    Both reference readers (`text.CodeRanges` and the dashboard's `codeRanges`) now stop nesting containers where the renderer stops, at 100 blocks. A line of thousands of list markers no longer costs time quadratic in the nesting: on a line of 15,999 markers the Go reader takes 1 ms, where it took 209 ms.
