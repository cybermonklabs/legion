kind: Fixed
body: 'A send to a session, or any other publish of a topic this build stores, is no longer answered success while the stream holds no copy of it. When a newer build''s stream had dropped such a topic''s subject, the listener published the message over core NATS and answered 200 with `state: stopped`, and no session''s consumer ever held it; the publish now waits for the acknowledgement of the notifications stream, and another stream that captures the subject in its place no longer counts. Where the server answers that no stream took the message, or that another stream refused it, and the listener''s last read of the stream leaves the subject out, the send and a role send''s forward and keep answer at once with a 503 and `Retry-After: 1` that names the subject and the stream''s generation, and a webhook delivery with a 503 that names them too, rather than saying that the bus did not answer, and a role send no longer retries such a forward for four seconds before a 504. The sender keeps the message and sends it again. A keep or a role send''s forward after an earlier send of the same message went out unanswered (a send of the keep, or a forward of the role send) is answered instead with the 503 that says the message may be stored (`code: maybe_stored`), since that send may have stored it; an earlier forward that the server answered, such as one no stream took, stored nothing and keeps the 503 that names the subject. A role claim that takes a role from another session, whose takeover record such a stream does not take, is refused with a 503 whose words name the subject and the generation, and writes no claim. A send whose subject a core subscriber holds still waits out its budget and is answered that the bus did not answer. Every stored copy now carries a `Nats-Expected-Stream` header, so the largest message a send stores is 43 bytes smaller (55 for a message that carried no header), and the 413 for a message past the server''s max payload names the header bytes beside the envelope. Role lanes, relay subjects and ad-hoc topics keep core NATS.'
