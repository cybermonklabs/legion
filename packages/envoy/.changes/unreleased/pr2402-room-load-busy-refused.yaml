kind: Fixed
body: |-
  A document socket the server cannot serve now is refused `503` with `Retry-After: 1` and a WARN line naming the room and the class of the error, such as `pool_busy`, but not the error's text, which can quote the person's login, where a busy database pool used to earn it a wrong answer. Its room's load finding a pool busy, or the server ending its request while the room loads, used to be ygo's `500 room unavailable`. The read of the live server processes, or the room that a busy pool failed, used to be `401 unauthorized`, which told a signed-in browser it was not signed in. The read of its document's issue used to be `404 document not found` for any failure; only a document that is not there is answered `404` now. A socket whose request the server ends while it waits for its failed room to recover now gets the same `503`, which used to come with no `Retry-After` and no log line. A cold socket's room load now reads the database once instead of twice, so a busy pool refuses it after one 3-second wait for a connection instead of two. A room's load also no longer ends when the request that began it ends, so one browser leaving does not fail the other browsers waiting for the same room. The read of the live server processes is made once a second for every socket, not once for each, since the registry it reads is up to 15 s stale already.
