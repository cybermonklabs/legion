kind: Changed
body: 'Every `curl` example of the Dispatch server guide (`GET /api/v1/related-checks`) and of the broker guides (approve a request, revoke a session, run the broker locally) sends its credentials in no command line another process can read: the bearer token on standard input, `printf ''Authorization: Bearer %s'' … | curl -H @- …`, and, where the body carries a token too (the pod registration''s `pod_token`, the `token` of an introspection or a revocation), the body on standard input with `--data @-` and the header from `-H @<(printf …)`. The Envoy guide reads the listener''s token from `envoy.json` the same way, and `scripts/dev-broker.sh` and `scripts/dev-stack.sh` register their pod that way.'
