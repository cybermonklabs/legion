kind: Added
body: |-
  Dispatch reads the change request of an issue and judges its end.
  `GET /api/v1/issues/{key}/change-request` answers what a version of the spec proposes against
  the approved spec of the repository and which approved checks its Verification document changes.
  Each node says whether the approved spec already holds it as the block writes it (`approved`: a
  person's approval of the request wrote it), and `proposes_unapproved` and
  `changes_checks_unapproved` say whether a proposal or a changed check still waits for a person.
  It also gives the conclusion block, with the comments anchored to it, and the judgment of that
  block (none, incomplete, uncovered or complete) against the reviewer's final list. A version that
  Dispatch cannot read is 409 CHANGE_REQUEST_UNREADABLE. `approved_spec_mark` names the approved
  spec the read compared against: it rises with each write of that repository's approved spec, so
  of two reads of the same versions the one of the higher mark is the newer. Each approval and each
  import that writes the approved spec appends `spec.approved_written` on its own issue {issue,
  repo, act, nodes}, since every other issue of the repository reads its change request against
  what it wrote.

  A check block is a check of The Spec only when its `statement` names a statement that the change
  request proposes or that the approved spec holds. Any other check block is the issue's own
  acceptance check. It is not part of the change request: an approval neither writes it nor is
  refused for it (no SPEC_CHECKS_NOT_INCLUDED, no SPEC_NODE_INVALID), and the change-request read
  does not count it as a changed check.

  `POST` and `GET /api/v1/issues/{key}/outcomes` record and read the three lists of outcomes of a
  pull request head: the author's list, the reviewer's own list and the reviewer's final list. Each
  record is a row of the new table `spec_outcome_records` (migration
  `20261122110014_spec_outcome_records`), and each record appends `spec.outcomes_recorded` on the
  issue. Who recorded which list is read from every record of the pull request, on every issue
  that records it. Dispatch refuses an author's reviewer or final list with 403
  OUTCOME_LIST_BY_AUTHOR and a reviewer's author list with 403 OUTCOME_LIST_BY_REVIEWER. It refuses
  a final list before the author's list at that head with 409 OUTCOME_AUTHOR_LIST_FIRST, and before
  the reviewer's own list at that head with 409 OUTCOME_REVIEWER_LIST_FIRST.
  `GET /api/v1/issues/{key}/change-request/ending?head=` answers ready, or waiting with each
  reason: no_final_list_for_head, final_list_of_another_head, no_conclusion, incomplete,
  uncovered_without_approval, proposes_without_approval or changes_checks_without_approval. The
  last two hold a proposal or a changed check of the latest spec and Verification versions until a
  person's approval writes it into the approved spec; an approval of the Verification document alone
  writes nothing there.
