kind: Added
body: '`spec-check citations` names each program check of The Spec that CI must refuse at a commit (R48): its test is not in the code, its selector picks two tests, its job is not in the workflow or not awaited, or a file that its test reads changed and its job did not run the test. A test that only a test file under a build constraint declares, such as `//go:build e2e`, is not in the code that go test builds, and its refusal names that file. A result that go test replayed from its cache is no run, and neither is a run in a report that ends before its package''s own end event; the reader of go test reports reads a line that go test writes in two or more output events, as the summary line of a long import path, whole. A file that the change deleted, or moved out of the tie, counts by the tie at the base commit, and a tie that is not known at the commit or at the base counts as a change, also when no path changed. A changed path counts also for a tie that holds a path under it, so a submodule that moved, which git names by its gitlink alone, ends the carry of a check whose tie reaches below it, whatever `.gitmodules` or the git configuration say; the derivation of a check''s state judges a carry by the same rule. Stated limits: a report is the account of the process under test, so a test that prints the testing package''s marked run and pass lines of another test makes that test read as run; a report of `go test -json -v`, or of `go test -json` with `-test.v=true` after `-args`, lets a test print the run and end lines of any test of its package, its own or another''s, with no marker, and make that test read as run or passed, and a test that prints with no line feed reads as not run, so a step that makes a report for CI runs `go test -json` with no `-v` and no `-test.v`; and a test that prints its own package''s cached summary line makes each run of its package read as not run. `spec-check changed` lists the files that changed between two commits, both paths of a move, after a first line `base <commit>`: the commit where each carried result stands, which for a change''s branch is its merge base with the default branch. `changed` and `citations` name each commit, and `citations` checks out the base commit, as git stores them, whatever the settings of git, of `.gitattributes` or of the process. `changed` and `citations` refuse a `--repo` that is not the top of its git clone before they read an input, with one line that names the top to pass. `citations` derives the tie of a check at the commit, and at the base commit, with that commit''s own `.github/scripts/go-test-reads.sh`, which gives go each package after `--`. `spec-check tree` reads a runner, a selector or a job with no letter and no digit as missing, and refuses a procedure that names its own go test.'
