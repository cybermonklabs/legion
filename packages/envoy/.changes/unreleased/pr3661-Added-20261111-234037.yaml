kind: Added
body: |-
    A migration admits the role `other_project` in `write_suggestions.role`, and each cross-project
    offer of an ask create is recorded as one row of that role, beside the check's `related` rows. The
    outcome sweep resolves such a row like any other. `GET /api/v1/related-checks` answers
    `other_project_offers`, how many ask creates of the window made such an offer, under the same
    project, source-kind and time filters as its other counts.
