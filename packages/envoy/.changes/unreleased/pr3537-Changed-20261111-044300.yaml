kind: Changed
body: |-
  `gcp:ClusteredNatsHub` runs Envoy's session listener as a workload of its own, one pod, with a Service, a NetworkPolicy that admits the tailnet entry's pods alone, a ServiceAccount that mounts no token and a budget that allows that pod's eviction. The tailnet entry's pods now run the tailscale container and the advertiser alone and forward the Tailscale Service's port 9020 to the listener's Service, and each host advertises the Service on its own readiness, so a listener fault no longer takes NATS's port 4222 off the tailnet. The listener binds every address of its own pod and carries `ENVOY_API_ALLOW_UNAUTHENTICATED=1`, which is now a supported mode for a listener a network policy fences rather than a temporary flag; its readiness reads the HTTP status of `/healthz` alone, while its startup and liveness probes read `/livez`, which costs no bus traffic. `name` must now be a DNS-1035 label of at most 43 bytes, a letter first, because the chart renders the Service `<name>-headless` and the component the Service `<name>-listener`, which Kubernetes holds to that shape: a name with a leading digit was accepted before and failed at apply. A tailnet host no longer takes a health URL: nothing set one after the split, so the advertiser's health gate is gone with the constants and the test rig that drove it.
