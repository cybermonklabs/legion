kind: Changed
body: |-
    Dispatch's priorities, the runs of an issue's workflow steps and the plans they ran from move into the graph store: `envoy-dispatch` writes and reads them as `priority`, `step` and `plan` nodes of `graph_nodes` with their tuples in `graph_tuples`, through the store's one writer. The first boot of this release moves every row of the two old stores there, after its migrations and before it listens, in batches of 200 tuples, and then swaps the old tables, under their locks and a second count of both sides, for views of the same names, which the release before reads and writes through during a roll and after a rollback; a later release's boot drops the views once no build a rollback reaches needs them. The pre-deploy `envoy-dispatch census` rehearses the copy and that count first, in a transaction it rolls back, and refuses the deploy on any difference. The move is downtime under one replica: Dispatch answers nothing, `/livez` and `/healthz` included, from the old pod's stop until the move ends, estimated at about 8 seconds at the volume of 2026-11-23, plus up to about 5 minutes where a session outside Dispatch holds one of the tables the swap locks. A whole-set write of an issue's `advances` that carries a revision read before the move is refused `409 ADVANCES_REVISION`.
