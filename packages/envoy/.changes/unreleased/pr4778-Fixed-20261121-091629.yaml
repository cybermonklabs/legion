kind: Fixed
body: |-
  The pre-merge check of edited migrations (`envoy-go-checks`) now fails an edit of a migration
  whose `-- replaces:` lines do not begin with the lines the base's file has, in the base's order.
  Before, it held only the first line and the base's own text, so a third edit of one file could
  drop the line naming an earlier edit and pass, and a database that release created from empty,
  which the release before boots on, would then stop the next start. The refusal names the
  migration and the dropped or moved line, and gives the lines the file must begin with.
