kind: Fixed
body: |-
  Readers of the event horizon that ask while one observation runs now share one next
  observation, however late each of them looks for it. A reader that finds a newer observation
  already ended takes that one's answer, since it started after the reader's call, unless another
  reader's cancellation abandoned it. This holds for a reader that waited out an observation from
  before its call, for one that looks only after the next observation has ended, and for readers
  whose shared observation another reader's cancellation abandoned. Before, each such reader that
  looked late ran another, so on a loaded machine each late reader cost the horizon one more round
  trip and one more transaction id.
