kind: Fixed
custom:
  Issue: pr4374
body: |-
  An expired credential request stays in its approver's list until someone dismisses it. The
  broker's `GET /v1/pending` gives each row its `state`, `pending` or `expired`, and its
  `expires_at`; with `?state=pending&state=expired` it lists the expired requests nobody dismissed,
  before the expiry sweep and after it, after the pending ones. The new
  `POST /v1/credential-requests/{record}/dismiss` takes an expired request out of every list once,
  and migration 0033 stores each dismissal. The requests that expired before this change are
  recorded as dismissed by `broker`. Dispatch asks for both states and relays the dismissal from
  `POST /api/v1/credential-requests/{id}/dismiss`. The machine-login lookup reads an overdue login
  as `expired`, and a new request no longer joins an overdue pending request.
