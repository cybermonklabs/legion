kind: Added
body: |-
  `GET /api/v1/issues/{key}` answers `blocks`, the keys of the issues whose `blocked_by` names the
  issue, sorted, `[]` when none, so a reader of one issue can say what waits on it. It also answers
  `comment_count`, how many comments `GET /api/v1/issues/{key}/comments` lists, and leaves it out
  where there are none. The listing, `GET /api/v1/issues`, carries neither. Both fields are
  optional, so a client that does not read them is unchanged.
