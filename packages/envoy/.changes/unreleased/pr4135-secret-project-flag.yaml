kind: Added
body: |-
  `agent-secrets secret create --project KEY` writes a secret's `dispatch-project` tag, and
  `agent-secrets secret retag --project KEY|none` changes it or removes it, on AWS Secrets Manager
  and Google Secret Manager alike. `secret show` prints it as a `project:` line, `secret list` as a
  `PROJECT` column, and `--json` carries it as `project`, `null` for a secret of no project. A key
  that is not one Dispatch project key as written, and `none` on create, is refused before
  anything is read or written, naming `project-malformed`. A broker that cannot ask Dispatch
  whether a project is private refuses the tagged secret `project-unchecked`, which the write's
  reread prints, exiting 1. A policy that limits `aws:TagKeys` must now allow `dispatch-project`.
