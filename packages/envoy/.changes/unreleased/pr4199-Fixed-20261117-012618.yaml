kind: Fixed
body: |-
  A member who signs in to an address an account outside the Workspace took before them keeps the
  machine logins and machine sign-ins they made at the secrets broker, and their broker tokens
  keep working. Dispatch asks the broker to revoke a replaced account whatever its member kind,
  since a restricted member's account makes credentials there too (the machine logins it
  approves), and the broker ends only that account's credentials and those that record no
  account. So an account that takes its address back from a restricted member is no longer
  refused at the broker for good.
