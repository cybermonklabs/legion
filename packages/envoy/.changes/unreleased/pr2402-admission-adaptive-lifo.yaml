kind: Changed
body: |-
  Dispatch's admission class queues - the reads' and the writes' - serve first come, first served only while they absorb a burst, and newest first once one has stood non-empty for a whole wait of its own (a second for a read, two for a write), until it empties. Under a standing overload a first-come queue made every request it served wait out the queue first: at ten times the load the served requests answered at a median of 1.07-1.09 s, against 0.25-0.28 s before. Now a standing queue serves the requests that have waited least, and the oldest are the ones refused, each at its own wait and never before it; a request taking back units it must not be refused, after a send it cannot undo or writes it committed, is served ahead of every other waiter, the oldest first. The moment a queue stands hands the room round as a release does, and so does every waiter that leaves a queue, so a newer request that fits where the one ahead of it does not is admitted then rather than left beside the free room until its own refusal. A new series counts the requests granted newest first, `dispatch_http_newest_first_total` by class. Each heavy read lane's queue and the queue for the places outside admission serve first in, first out at all times: their places are one each and turn over many times within a wait, and newest first there left the oldest to be refused at their wait while the places turned over beside them - on the cluster copy at ten times the load every refusal of a run, 26 searches, was the search lane's, with 4 or 5 queued and the read class's room unused.
