kind: Changed
body: |-
  Dispatch's admission queues - each class's, each heavy read lane's and the queue for the places outside admission - serve first come, first served only while they absorb a burst, and newest first once one has stood non-empty for a whole wait of its own (a second for a read, a lane and the places outside admission, two for a write), until it empties. Under a standing overload a first-come queue made every request it served wait out the queue first: at ten times the load the served requests answered at a median of 1.07-1.09 s, against 0.25-0.28 s before. Now a standing queue serves the requests that have waited least, and the oldest are the ones refused, each at its own wait and never before it; a request taking back units it must not be refused, after a send it cannot undo or writes it committed, is served ahead of every other waiter, the oldest first. Three new series count the requests granted newest first: `dispatch_http_newest_first_total` by class, `dispatch_http_lane_newest_first_total` by lane and `dispatch_http_outside_admission_newest_first_total`.
