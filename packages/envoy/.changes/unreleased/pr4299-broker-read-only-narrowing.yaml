kind: Changed
body: |-
    The secrets broker's read-only narrowing (`agent-secrets --github-read-only`, `read_only` in
    the API) asks GitHub for read access to contents, metadata, pull requests, issues, Actions,
    checks, commit statuses and attestations, the same set as the Legion daemon's read lease. The
    broker reads the permissions of the installation from its listing and asks only for the part of
    the set that the installation holds. It writes one warning for each permission that it leaves
    out of a released token. An installation that does not hold contents, metadata or pull
    requests is refused with 422 `NARROWING_REFUSED` before any token request. The second token
    request without Actions is gone.
