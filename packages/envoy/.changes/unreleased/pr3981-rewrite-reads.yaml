kind: Added
body: |-
  Every read of an ask, a comment, a message and an issue now carries
  `rewrite {state, by, at, original, reason?}` where a rewrite touched the text. `by` is `person`
  for a person's Rewrite and `reviewer` for the reviewer's, and `original` is the wording before
  the rewrite. A broadcast's read carries it on each recipient's message and reply too. No event
  payload carries it.
  The web app marks such a text with one **Rewritten** badge, on the ask card, a comment, a message
  and an issue's title alike: a targeted message, a reply in an ask's thread, a session's reply on
  the Agents page and a recipient's answer on a broadcast's page included. Pressing the badge, or
  `w` while the text holds the focus, shows the original wording in place.
