kind: Fixed
body: 'A cut never splits a reference. An Inbox row''s subject and its reply''s first line, an id prefix candidate''s first line, the 240-rune head beside an edge and the 480-rune excerpt of a block now end before a mention, an address, a dashboard URL of the deployment, a bare issue key or a `#id` that would cross the bound, with the inline link around it whole (a title, an address in angle brackets, brackets in its words and words over a line break included), instead of keeping half of it: `CORE-1234` cut after `CORE-12` was a working link to another issue, and a mention cut inside drew `[@name](dispatch://agent/` raw. A code span the cut would open and not close is left out whole the same way, since its backtick alone would read as text and an address inside it as a live link. The cut also never leaves a head that reads a reference the text does not write, such as `CORE-12` of `CORE-12x4`, or an address the ellipsis joins: a head that would end right after an address keeps the space after it, so a line of short addresses is cut after its last whole address rather than inside the next. A URL of anywhere else is cut as before, a reference longer than about a thousand characters is cut as before, and a cut never leaves the ellipsis alone where the text has words. A cut reads a bounded head of the text, so it costs the same on a text of any length. The excerpts a document''s Referenced by lists (`GET /api/v1/artifacts/{id}/references`) are cut around the deployment''s dashboard URLs as the graph read''s are. A block excerpt stored before this change keeps its old cut until the block''s text changes.'
