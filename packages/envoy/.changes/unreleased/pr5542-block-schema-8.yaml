kind: Added
body: |-
    The block schema is version 8 (above #5839's version 7), and `GET /api/v1/schema/blocks` serves it. Store migration `20261127193632_graph_supertags_decision_reading` adds the new type and attribute nodes and moves every block type to version 8. It declares the `decision` type, which holds any blocks, with `uncertainty` (`low`, `medium` or `high`), `uncertainty_reason`, `shaped`, `from_ask` and `replaced`, and the `reading` type, which holds paragraphs and stands only at the end of a `decision` or an `ask`, after that block's own content. The `ask` type gains `shaped`, a list of the spec blocks the ask shaped. This release reads them from version 8 and creates them only from version 9: a write that adds a `decision` block, a `reading` block or an ask's `shaped` to a document that holds none is refused and stores nothing, with `this Dispatch build reads typed block "decision" but cannot write it yet` (the same words name `typed block "reading"` and `attribute "shaped" of typed block "ask"`). A document that already holds one stays editable, and a stored version that holds one is read and drawn.
    So this release adds no element of version 8 to a document that holds none, and a rollback from it stays safe. At version 8 this build creates `plan_task`'s `parent` (which #5839 declared read from version 7 and created from version 8) and continues to create `check`'s `subject` and `program` (read from version 6 and created from version 7). The `invalid` attribute of `ask` is never written into markdown.
