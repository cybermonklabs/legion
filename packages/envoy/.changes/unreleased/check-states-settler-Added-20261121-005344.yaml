kind: Added
body: |-
    Dispatch publishes one `check.state_changed` event each time the state of a `before_merge`
    check at an open pull request head changes, by the system actor `dispatch-check-states`. A
    row trigger on each table a state is computed from (`check_results`, `ci_check_results`,
    `check_result_retractions`, `ci_check_result_retractions`, `document_blocks` and
    `pull_request_heads`) marks the issue owed in the writer's own transaction and notifies
    `dispatch_check_states_owed` (migrations `20261125005338` to `20261125005344`), so a write of
    the release before this one is marked too; `20261125005346` marks every issue with an open
    attributed head owed once. In every process the settler (`api.Background.RunCheckStates`) is
    woken at the commit, settles each issue under its own lease (`check-states:<issue>`), computes
    its states as `GET /api/v1/issues/{key}/results` does, and appends an event for each state that
    differs from the one it published last, with a serial that counts the issue's events, and the
    set form where only a head's set of checks moved. A pass at most a minute after the one before
    it settles a mark whose notification no process received, and a state that reads
    `read_failed` is read again 30 s later, doubling to 10 minutes. A `test` handoff waits up to
    30 s until the states its issue's due marks owe are published, stores and answers the serial
    then as `check_states_serial` (`20261125005345`), and answers `503 CHECK_STATES_UNSETTLED`
    past that. The settler takes one connection of the lease pool: `store.LeasePoolSize` is 27, a
    server opens up to 118 connections to Postgres (`store.ConnectionsPerProcess`), and the app
    pod's count in `infra/gcp` (`dispatchConnectionsPerPod`) is 118.
