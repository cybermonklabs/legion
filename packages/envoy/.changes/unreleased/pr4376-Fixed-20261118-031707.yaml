kind: Fixed
body: 'A Dispatch refusal or route description that gave a length in characters while it counted UTF-16 code units or bytes now names the unit it counts: a text past its cap is refused with the number to trim in UTF-16 code units, as `title: trim 2 UTF-16 code units (1002/1000)`, and a body block or a document ask block''s wording in the same words, where each called the UTF-16 count characters; a NUL or a byte that is not UTF-8 is named `at position N`; a refused label names the field it came in (`labels`, `labels_add` or the list query''s `label`); and the route descriptions name UTF-16 code units. The search query''s minimum of 2 is now counted in UTF-16 code units, as its maximum and every client count it, so one emoji, which `dispatch search` sends, is no longer refused, and a shorter query is refused as `q: 1 of at least 2`. `restore-dispatch-dump.sh` reads its database name under C.UTF-8 whatever the caller''s locale, so a name of accented letters past the 63 bytes of a PostgreSQL identifier is refused under en_US.UTF-8 too.'
