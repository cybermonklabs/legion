kind: Added
body: |-
  A profile's proxy block in `BROKER_PROFILES_FILE` may name the kind `dpop`: a capability the broker mints for a CI run and holds, whose requests the proxy sends with a DPoP proof of its pod's key. `Validate` and the Lean model's `validate` take it, and a kind written in another case, such as `DPoP`, is still refused, with a refusal that names the four kinds. A profile of kind `dpop` is a name and a proxy block alone: the profiles file is refused, naming the profile and the field, when such a profile sets `source`, `tier`, `requesters`, `maxGrant`, `github` or `google`, and when the profile `DISPATCH_RESULTS_TOKEN` has no proxy block. A broker from before this release refuses a profiles file that names the kind at start, so the deployment moves to this release before its profiles file names it.

  The results profile is served by the result grant, never by the policy: with no stored secret of its name, each broker pod logs one ERROR `agent secret policy refused` line for `profile:DISPATCH_RESULTS_TOKEN` (`profile-source-missing`) at its first policy load, counts it as `refused=1` in its `broker: profiles applied` line, and exports one `broker_unservable_secrets` series for it. These lines are expected, and a result write needs none of them.
