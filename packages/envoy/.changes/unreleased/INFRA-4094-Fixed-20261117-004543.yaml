kind: Fixed
body: |-
  A write the listener was told had landed is no longer lost to a key-value bucket deleted and created again while the listener runs: no listener creates a bucket it copies (`envoy_interests`, `envoy_roles`, `envoy_sessions`, `envoy_known_sessions`, `envoy_ci_state`). A start that finds one missing waits for it behind its starting gates, every route answering 503; a running listener answers 503 to each write that needs it and keeps serving its last copy for reads; `/healthz` answers 200 `degraded` with `missing_buckets`; the self-health monitor neither rebuilds nor restarts over it; and the ERROR `listener KV bucket is missing`, logged every 30 seconds while it stays missing, pages the AWS listener's new `bucket-missing` alarm (`envoy_kv_buckets_missing` counts them). The new `envoy-infra buckets create|recreate|check` is the one command that creates them, and refuses while any listener (or envoy-dispatch, for `envoy_ci_state`) runs, proven ended by a Kubernetes runtime check of every node and an ssh query of every machine. **Deploy order:** a deployment's buckets exist already and nothing changes at the upgrade; a new deployment runs `envoy-infra buckets create --first-deployment` before its first listener starts. A NATS server a test or dev rig starts for one run sets `ENVOY_THROWAWAY_NATS=1` on its listener, which then creates what it finds missing at its start; no deployment may set it.
time: 2026-11-17T00:45:43Z
