kind: Added
body: |-
    Dispatch names browser requests' people from Identity-Aware Proxy under `DISPATCH_IDENTITY=iap`: each request's person is the `email` of the assertion IAP signs in `X-Goog-IAP-JWT-Assertion`, verified as Google documents (ES256 against IAP's published key set, issuer `https://cloud.google.com/iap`, audience `DISPATCH_IAP_AUDIENCE`, `exp` and `iat` with 30 seconds of skew), and never IAP's unsigned `X-Goog-Authenticated-User-Email`.
    It admits an account whose verified `hd` is `DISPATCH_SIGNIN_DOMAIN`, which it requires, records the person, and refuses the other `DISPATCH_SIGNIN_*` settings, dev sign-in, and `DISPATCH_IAP_AUDIENCE` under any other identity. A refused request is `401 NO_IDENTITY`, and an unreadable key set `503 SIGNIN_UNAVAILABLE`.
    A write from another origin that carries an assertion is refused 403, as one with a session cookie is.
