kind: Fixed
body: |-
  An edge listener logs each run of failures once, when it starts, rather than at every pass for
  as long as the outage lasts: a project's failed repository reads, a session's failed removal of
  the interests of a repository that left its projects, the refresh's failed list of the interest
  records, and the give-backs of withheld GitHub events whose session entry cannot record its gap
  mark. The reads, the lists and the give-backs also log one INFO line when the run ends, with the
  count of failures between (`failed_reads`, `failed_passes`, `given_back`). The failed read's
  WARN no longer says GitHub events wait for the next answer: the last answer decides them until
  it is 60 seconds old, and the line's `withheld_from` says when they start to be withheld.
