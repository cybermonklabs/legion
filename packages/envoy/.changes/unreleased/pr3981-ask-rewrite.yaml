kind: Added
body: |-
  A person can ask Dispatch to rewrite an open question for them: **Rewrite** in the ask card's
  menu, or `r`. The card reads **Rewriting…**, then **Rewritten** once the new wording is in place.
  Pressing the badge, or `w`, shows the original wording in place. A rewrite that fails reads
  **Rewrite failed**: its reason is in the badge's tooltip, and `r` tries again.
  The route is `POST /api/v1/asks/{id}/rewrites`. It answers `202` at once and rewrites in the
  background, and one rewrite of an ask runs at a time. When the session that asked is running or
  unresponsive and its host takes side questions, Dispatch first asks it one side question and
  waits up to 60 seconds for the answer.
  Dispatch does not apply a rewrite that loses what the question must keep: most of its words, its
  options' labels, number and order, its choice, a `Ref:` line, a picture, or a link of the
  question or of an option's description. Nor does it
  apply one that pastes more than 100 words in a row of the record, words that neither the
  question nor the agent's answer holds. Nor does it apply one when the agent changed, answered or
  closed the question meanwhile.
  A model reply that is not the rewrite the call asks for is asked again, two more times at most,
  inside the call's same time bound.
  An applied rewrite is a quiet `ask.edited` from Dispatch that holds the original wording. Two
  new quiet events, `ask.rewriting` and `ask.rewrite_failed`, follow the run. An approval request
  is not rewritten (`409 ASK_KIND_FIXED`).
  Rewrite needs the model group `DISPATCH_REWRITE_DEFINE_MODEL_*`: without it the route answers
  `503 REWRITE_NO_MODEL`.
