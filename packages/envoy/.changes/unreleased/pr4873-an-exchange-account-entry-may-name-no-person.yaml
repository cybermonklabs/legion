kind: Added
body: |-
  A `BROKER_EXCHANGE_ACCOUNTS` entry may name neither a person nor a project: `<service account>==`,
  or `<service account>===<session>` to fix its session. Its pods' tokens act as the account itself:
  the project scope `named`, no person and no project, and the account
  (`system:serviceaccount:<namespace>:<name>`) as the token's `service`. Dispatch, the Envoy listener
  and the NATS auth service take such a token as a session's credential. Dispatch lets it write
  wherever a credential that names no project may write, records each write as the token's session
  acting for that account and for no person, and refuses it a route that needs `person` or
  `approve` (`403 OAUTH_SCOPE_REQUIRED`). A token that names a service and no person under the
  project scope `person`, a machine nobody has signed in on, is still refused every write
  `403 SIGN_IN_REQUIRED`. An entry that names a project and no person refuses the broker's start,
  naming that rule, so no project's write is personless; a broker of an older build refuses to start
  on an entry naming no person, so deploy the broker and Dispatch before you write one. A
  `BROKER_POD_OPERATORS` mapping of an account that the exchange lists with no person refuses the
  start too.
