kind: Fixed
body: |-
  `envoy-dispatch census --store` now refuses a `DATABASE_URL` pgx cannot read as the setting's
  name and fixed words, never in pgx's own words. pgx's error quotes the URL with its password
  masked but its user name and every other query pair kept, and the error it wraps can quote a
  query key alone, where a credential written as `?<token>` with no `=` sits. The store census
  printed it, for example ``census: parse Postgres URL: cannot parse
  `postgres://user:xxxxx@127.0.0.1:5432/dispatch?access_token=...&sslmode=verify`: failed to
  configure TLS (sslmode is invalid)``. It now prints `census: DATABASE_URL: parse Postgres URL: pgx
  cannot read its connection settings`. A failure to reach or to read the database prints as
  before.
time: 2026-11-26T04:06:47Z
custom:
    Issue: dispatch-database-url-pgx-words
