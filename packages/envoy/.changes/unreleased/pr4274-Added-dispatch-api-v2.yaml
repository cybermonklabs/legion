kind: Added
custom:
  Issue: pr4274
body: |-
  Dispatch serves `/api/v2` beside `/api/v1`, every route in one shape. Each list answers
  `{items, total, limit, offset}` within the route's `limit` bounds, the global event log and a
  person's dismissed threads with `total: null`; each refusal is `{code, error}`, its code one of
  one declared list; a query key the route does not declare is refused `400 QUERY_KEY_UNKNOWN`,
  naming the key and every key the route declares; every `POST`, `PATCH`, `PUT` and `DELETE` takes
  an `Idempotency-Key`, and a `PUT` whose body equals the object's present state answers `200` and
  writes nothing; a path that names a missing object answers `404` with that object's code; and an
  unknown path answers `404 NO_ROUTE`. The delivery routes are the exception:
  `GET /api/v2/delivery/measures`, `GET /api/v2/delivery/pipeline`,
  `GET /api/v2/delivery/timeline` and `GET` and `PUT /api/v2/settings/delivery` keep the shape and
  the rules of their `/api/v1` routes, so they refuse no undeclared query key, and a `PUT` of the
  delivery settings is not keyed by an `Idempotency-Key`. `GET /api/v2` lists every route with
  what a client reads to call it, and `envoy-dispatch routes --version 2` prints the same list.
  `envoy-dispatch openapi` writes the committed `/api/v2` OpenAPI document beside the `/api/v1`
  one, and `--check` checks both. `--version 1` or `--version 2` takes one document alone, and
  `--out <path>` needs it: it writes that document to the path, or with `--check` names the file
  compared. The test hooks, which keep their `/api/v1` rules, answer at `/api/v2/_test/…` too.
