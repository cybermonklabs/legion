kind: Changed
body: |-
  Block schema version 7: `requirement` and `check` get the attributes of The Spec. `requirement`
  gets kind, under, supports, about, base and removes; `check` gets statement, subject, procedure,
  runner, selector, job, time_limit, base and removes. A new block type `component` holds
  components and interfaces, and a new block type `conclusion` holds a statement, a difference,
  `no_statement` and its evidence. The spec query reads component blocks.
