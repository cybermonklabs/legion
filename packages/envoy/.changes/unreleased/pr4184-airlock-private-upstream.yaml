kind: Added
body: |-
  A private destination's address rule (`BROKER_PROXY_PRIVATE_UPSTREAM`) is positive and is read in one place (`netaddr.DestinationRefusal`) by the proxy's dial of each destination, the broker's start and `profiles check`: the proxy dials a destination's host only when every address it resolves to is in a range a destination may be in - private, `100.64.0.0/10` or inside `BROKER_AIRLOCK_CLUSTER_RANGES` - and none is loopback, link-local, unspecified, multicast, the IPv4 broadcast address, in `0.0.0.0/8`, a cloud metadata server's IPv6 address (`fd20:ce::254`, `fd00:ec2::254`), or an IPv6 address that carries an IPv4 address (a NAT64, 6to4, Teredo, IPv4-compatible, IPv4-translated or ISATAP form, whatever it carries, or `64:ff9b:1::/48`), however the cluster ranges are set; otherwise the CONNECT to the host is refused `403 ADDRESS_REFUSED` and nothing is dialled. The cluster ranges widen the private ranges and nothing else, so an address is a destination's because a range holds it, never because the proxy refuses it to every other request.

  The broker refuses to start, naming the setting and the fault and quoting no part of the URL a credential can sit in, on an entry whose text before the first `=` holds a `/` or an `@` (a URL written with no `<host>=` before it), and on a URL whose host every dial refuses: an address the rule above refuses, the IPv4 broadcast address and a public address outside `BROKER_AIRLOCK_CLUSTER_RANGES` among them, or `localhost` or a name under `.localhost`, with or without a trailing dot, unless `BROKER_AIRLOCK_TEST_DIAL_ALLOW` names that host and port.
