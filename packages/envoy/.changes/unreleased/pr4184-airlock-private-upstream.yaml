kind: Added
body: |-
  The secrets broker's airlock proxy can send the allowed requests of one bound host to an address inside the broker's own cluster: `BROKER_AIRLOCK_PRIVATE_UPSTREAM`, one `<host>=<url>` entry such as `dispatch.example-tailnet.ts.net=http://dispatch.dispatch.svc.cluster.local:8766`. Each such request goes to the URL's scheme and host on a transport of its own, keeps the host as its `Host` header, and, under a proxy block of kind `dpop`, carries a proof for `https://` and the host.

  The proxy dials the URL's host only when every address it resolves to is one the proxy refuses to every other request - private, `100.64.0.0/10` or inside `BROKER_AIRLOCK_CLUSTER_RANGES` - and none is loopback, link-local, unspecified, multicast, the IPv4 broadcast address or a cloud metadata server's IPv6 address (`fd20:ce::254`, `fd00:ec2::254`); otherwise the CONNECT to the host is refused `403 ADDRESS_REFUSED` and nothing is dialled. That refusal, and the `502 UPSTREAM_UNREACHABLE` of a destination that does not answer, tell the command the rule and not the destination's in-cluster name or address, which the broker's log keeps. A tunnel or a plain-HTTP request to those addresses, and a CONNECT to the host under a grant whose names do not bind it, are refused as before.

  The broker refuses to start, naming the setting and the fault and quoting no part of the URL a credential can sit in, on more than one entry, on the setting without `BROKER_PROFILES_FILE`, on text before the first `=` that holds a `/` or an `@` (a URL written with no `<host>=` before it), on a host that is not one lower-case host name, on a URL that is not `http` or `https`, names no host or a port outside 1 to 65535, or carries a user, a path other than `/`, a query or a fragment, on a URL whose host every dial refuses (an address the dial above refuses, the IPv4 broadcast address and a public address outside `BROKER_AIRLOCK_CLUSTER_RANGES` among them, or `localhost` or a name under `.localhost`, with or without a trailing dot) unless `BROKER_AIRLOCK_TEST_DIAL_ALLOW` names that host and port, and unless the proxy block of the profile `DISPATCH_RESULTS_TOKEN` binds the host, exactly and alone, of kind `dpop`, with a non-empty allow list, carried in `Authorization` alone.
