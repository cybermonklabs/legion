kind: Fixed
body: |-
    A session that replaces another now receives the replaced session's unread messages, whether or
    not the replaced session's claim of the role still stood. Before, a direct message to a session
    that a Legion claim replaced (`legion claims forget-session`, a fresh session) stayed on the old
    session's subject, which no session reads, and the takeover copy moved role messages only, and
    only when the new claim read the old session as the holder; the role claim reaper frees a dead
    holder's claim first, so a fresh session after a released pod got nothing. `POST /v1/roles/set`
    now reads `previous_session_id` on an outright claim as well as a soft one, as the session the
    claim replaces. Once such a claim lands, the claim route writes one handover record for the
    claimant and that session (`bus.HandoverSubject`, on the takeover lane), and answers `503` with
    `Retry-After: 1` when it did not store, the claim standing. The record's passes copy nothing
    while the replaced session is `live`; otherwise, from its acknowledgement floor, they copy each
    message to the session itself to the claimant's own agent subject and each role message of any
    role to that role's kept lane, for the role's next live holder. Delivery is at least once: the
    stream keeps one copy of each message for the claimant, and a copy keeps the message's event id.
    A claim hands over only between sessions of one principal: the record is written only when the
    claim's credential, the claimant's last registration and the replaced session's last
    registration name one principal (a broker token's person, else its service, else an identity
    token's principal, else none), each read from the known-session bucket's leader, and any other
    such claim stands and is answered `200` with a warning that no message of that session is
    handed over, so an agent session that names a person's session receives none of its messages.
    A rule the listener could not read (the known-session bucket not open or not answering, or the
    claimant's own registration not yet recorded with its principal) is answered `503` with
    `Retry-After: 1`, the claim standing, rather than refused for good. Each pass, and the successor
    read below, hold the two sessions to the rule again, so a session that registers as another
    principal after the claim is handed nothing more. A known-session record now says whether a
    registration of this build recorded its principal (`principal_recorded`): a record an earlier
    build wrote back reads as one whose principal nobody knows, and is refused, and an interest
    change or a clean stop keeps the principal the bucket's leader holds, by a compare-and-swap,
    rather than the one a listener's own copy holds, and writes nothing where the leader does not
    answer. A registration whose record a listener's copy holds unchanged is skipped only where the
    leader holds its principal too, and one whose write failed while the record names another
    principal is answered `503` with `Retry-After: 1`, so the session registers again until the
    record names its principal. A direct message that names no event id is given one on its first
    copy, so two sessions that each replaced the other copy it once each.
    The new session may answer the delivery of a person's message handed over to it: Dispatch's
    reply routes ask the listener's new `GET /v1/sessions/{session_id}/successors` for the session
    the delivery names and accept the reply of a session it names, where they refused it `403
    REPLY_FORBIDDEN`; that read names each session that replaced it and each that replaced one of
    those in turn, while each last registered as its principal.
