kind: Fixed
body: |-
    A session that replaces another now receives the replaced session's unread messages, whether or
    not the replaced session's claim of the role still stood. Before, a direct message to a session
    that a Legion claim replaced (`legion claims forget-session`, a fresh session) stayed on the old
    session's subject, which no session reads, and the takeover copy moved role messages only, and
    only when the new claim read the old session as the holder; the role claim reaper frees a dead
    holder's claim first, so a fresh session after a released pod got nothing. `POST /v1/roles/set`
    now reads `previous_session_id` on an outright claim as well as a soft one, as the session the
    claim replaces, and answers `400` before anything is written where no session consumer can be
    named for that id. Once such a claim lands, the claim route writes one handover record for the
    claimant and that session (`bus.HandoverSubject`, on the takeover lane), and answers `503` with
    `Retry-After: 1` and the code `handover_unrecorded` when it did not store, the claim standing.
    The record's passes copy nothing while the replaced session is `live`, and run for the stream's
    retention, 72 hours, from the claim or from the last pass that found the replaced session live,
    not for the one-hour keep window: a message sent to the replaced session after the claim's hour
    is handed over too, and a session that stays live past that time and then stops is handed over
    then; otherwise, from its acknowledgement floor, or with no floor known from the first message
    the stream holds on its subject, they copy each message to the session itself to the claimant's
    own agent subject and each role message of any role, of the last hour, to that role's kept lane,
    for the role's next live holder. Delivery is at least once: the stream keeps one copy of each
    message for the claimant, and a copy keeps the message's event id.
    A claim hands over only between sessions of one principal: the record is written only when the
    claim's credential, the claimant's last registration and the replaced session's last
    registration name one principal, each read from the known-session bucket's leader, and any
    other such claim stands and is answered `200` with a warning that no message of that session
    is handed over. A principal names the credential's kind and scope beside the person or service:
    a person's own broker token, one an operator's entry gave a person for a project (a worker
    pod's), one naming no person, an identity token, or none; so an agent session that names a
    person's session receives none of its messages, a worker acting for that person on a project
    entry included. An agent that runs on its person's own sign-in token is that person, since the
    broker's answer does not tell the two apart. A rule the listener could not read (the
    known-session bucket's leader not answering, or the claimant's own registration not yet
    recorded with its principal) is answered `503` with `Retry-After: 1`, the claim standing,
    rather than refused for good. Each pass, before it starts and before each copy, holds the two
    sessions to the rule again, and the successor read below follows a record only to a session of
    the replaced session's principal, so a session that registers as another principal after the
    claim, or while a pass runs, is handed nothing more. A known-session record now says whether a
    registration of this build recorded its principal (`principal_recorded`): a record an earlier
    build wrote back reads as one whose principal nobody knows, and is refused, and every write that
    is no registration's (an interest change, a clean stop) keeps the principal the bucket's leader
    holds, whatever principal it carries, by a compare-and-swap, rather than the one a listener's own
    copy holds, and writes nothing where the leader does not answer. A registration as another
    principal than the session's record names is admitted only
    once that record names no principal: read at the bucket's leader, it is written again over
    the revision read with no principal recorded and its topics, title, capabilities and
    last_seen kept, before anything of the registration changes, so a stopped session whose
    registration is refused after its admission is still found by a send. A leader that does not
    answer, and a refused clear, answer it `503` with `Retry-After: 1` with nothing admitted. A
    listener whose known-session bucket is not open (its NATS grant does not carry the bucket)
    admits each registration, heartbeats included, with no principal recorded and a warning that
    says so, logged at most once a minute, and refuses every claim's handover, answered `200` with
    a warning naming why, until the bucket opens. The registration's own write is a
    compare-and-swap at exactly the
    revision its admission read or wrote: a record written since, by another registration of the
    session or any other write, is left as it is, and the registration writes nothing and is
    answered the same `503`, so a delayed registration can no longer put back a principal another
    registration's admission cleared. A registration whose record a listener's copy holds
    unchanged is skipped only where its admission found the leader's record naming its principal
    and the leader still holds that revision; otherwise it is the same compare-and-swap write.
    One whose write failed is answered the same `503` unless the leader confirms the record names
    its principal, none recorded, or nothing; so the session registers again until the record
    names its principal. A pass also reads, before each copy, whether the replaced
    session is `live` again, from the session bucket's leader where its own copy does not say so,
    so a registration through another listener ends the pass too. A direct
    message that names no event id is given one on its first
    copy, so two sessions that each replaced the other copy it once each.
    The new session may answer the delivery of a person's message handed over to it: Dispatch's
    reply routes ask the listener's new `GET /v1/sessions/{session_id}/successors` for the session
    the delivery names and accept the reply of a session it names, where they refused it `403
    REPLY_FORBIDDEN`; that read names each session that replaced it and each that replaced one of
    those in turn, however long the chain, while each last registered as its principal, names that
    principal to Dispatch's own verified identity (`ENVOY_DISPATCH_PRINCIPAL`) and to no other
    caller, names no successor where the listener's known-session bucket is not open, and answers
    `503` rather than part of the chain when it cannot read the whole of it in time. A reply on a
    broker token is accepted only where the token acts for that principal.
