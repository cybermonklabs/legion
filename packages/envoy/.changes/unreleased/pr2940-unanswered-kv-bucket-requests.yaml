kind: Fixed
body: |-
  Opening a KV bucket now sends its stream lookup and its create again when the NATS server leaves
  either unanswered, up to three sends, instead of ending the caller with `open <bucket> KV bucket:
  context deadline exceeded`. nats.go sends each JetStream request once, and a server whose
  metadata leader is changing answers neither of these two.

  The error of a bucket that could not be opened now names the request that drew it,
  `KV_<bucket> STREAM.INFO` or `KV_<bucket> STREAM.CREATE`, so a log that held only the bucket's
  name says which request went unanswered.
