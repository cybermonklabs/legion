kind: Changed
body: |-
  The broker logs, at info, each secret a pod reread because a peer fanned out a change to it
  (`broker: reread a secret a peer fanned out`, with the secret, the sender and
  `cause=fan-out`), so a reader of the pods' logs can tell those reads from the pod's own policy
  reload.
