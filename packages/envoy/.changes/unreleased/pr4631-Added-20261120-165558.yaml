kind: Added
body: With `DISPATCH_PARENT_STATUS_RULE` set to `on`, Dispatch keeps each parent's status in line with its children's. A status change, a change of parent or a create that would leave a parent `done` while a child is open, or a child in work under a parent that is not in work, is refused with 409 `PARENT_STATUS_CONFLICT`, and its `issues` names each issue that holds the rule. The new route `POST /api/v1/issues/{key}/status-change` takes `include_children`, `unlink_children`, `include_parent` and `dry_run`, whatever the setting. Each issue an option changes gets a comment that names the call, and the issue the call names gets one more that lists those changes. It checks the `PATCH`'s `expected_sequence` in every step, and a repeat under the same request key finishes what its first run left. A credential scoped to one project is refused a status change one of whose writes is of an issue of another project, an ancestor or an issue under the issue, with 403 `PROJECT_SCOPE` before any write. With the setting on, one process runs a one-time fix at boot, before the server listens, under the lease `parent-status-fix`. The fix unlinks each open issue from its `done` parent, moves each not-started ancestor of an issue in work to `in_progress`, closes nothing, and records in the new table `parent_status_fix` that it ran. The lease pool holds one more connection, 26, so one process opens at most 117. The component `envoy-infra:gcp:Dispatch` takes the input `parentStatusRule`, which renders the setting.
