kind: Added
body: |-
  `envoy-infra:gcp:Dispatch` takes an optional input for sign-in by people from outside the
  company. `outsideOrigin` is a second origin Dispatch is reached at, whatever way those people
  come in by: an `https` origin written as a browser writes it (a lowercase scheme, no `:443`, a
  port of 1 to 65535 with no leading zero, and no path, user, query or fragment), whose host is
  not the front door's, ends in a number only as a canonical IPv4 address, and has `--` as a
  label's third and fourth characters only in an `xn--` label the IDNA lookup profile takes (RFC
  5890 section 2.3.1 reserves that form: certificate authorities refuse its labels that do not
  begin with `xn--`, and an `xn--` label that profile refuses is a Fake A-label). Another spelling
  of the same origin is refused rather than rewritten, since Dispatch
  compares a browser's `Origin` with it as a string. It renders `DISPATCH_OUTSIDE_ORIGIN` on the
  app's container right after `DISPATCH_SERVER_URL`, and needs the tailnet inputs. With it unset
  the component renders exactly what it rendered before. With `outsideOrigin` and sign-in on, its
  host is the relying party of the passkeys people from outside enroll there, a registrable domain
  name, so the component then also refuses a raw IP address and a host whose top-level domain is
  not on the public suffix list; the Google client lists no callback of the outside origin. The
  component does not build what serves the second origin, and an `envoy-dispatch` that predates the
  setting ignores it.
