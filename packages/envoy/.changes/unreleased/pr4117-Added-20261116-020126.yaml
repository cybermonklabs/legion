kind: Added
body: |-
  `envoy-infra:gcp:Dispatch` takes two optional inputs for sign-in by people from outside the
  company. `outsideOrigin` is a second origin Dispatch is reached at, whatever way those people
  come in by: an absolute `https` URL with no path, user, query or fragment, whose host is not the
  front door's and has no label with `--` as its third and fourth characters, a reserved form no
  public certificate authority issues for. It renders `DISPATCH_OUTSIDE_ORIGIN` on the app's
  container right after `DISPATCH_SERVER_URL`, and needs the tailnet inputs. `signInOutside: true`
  renders `DISPATCH_SIGNIN_OUTSIDE=1` right after `DISPATCH_SIGNIN_DOMAIN`; it needs the sign-in
  inputs and is not one of their group, so a deployment that sets them without it is accepted as
  before. With both unset the component renders exactly what it rendered before. With
  `outsideOrigin` and sign-in on, the Google client needs `<outsideOrigin>/auth/callback` as a
  redirect URI; with `signInOutside`, its consent screen's audience must be External. The
  component does not build what serves the second origin, and an `envoy-dispatch` that predates
  the two settings ignores both.
