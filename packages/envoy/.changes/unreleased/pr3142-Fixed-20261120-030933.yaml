kind: Fixed
body: A doc-edit is refused, as an upload of the same text is, when the text Dispatch would store for it reads back otherwise; only a block that already read back otherwise the same way before the edit is excused, and each such block is logged by its id. One edit renders the document once and reads each block it changes back once, where 14 replaces in one large paragraph used to read it back 28 times.
