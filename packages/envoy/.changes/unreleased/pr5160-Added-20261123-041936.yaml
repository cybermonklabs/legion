kind: Added
body: |-
  Dispatch's block schema version 6 reads the typed block `plan_role`, a role an owner's plan
  defines: its id is the role's name, its `type` and `model` attributes are the role's type and
  model, and its body is the role's prompt, which can hold headings, lists and code. The issue page
  shows the role's name, type and model. This release creates no such block: a write that puts one
  into a document that holds none is refused until a release at schema version 8. A build at schema
  version 5 answers a document that holds one with `409 DOC_NEWER_CONTENT`.
