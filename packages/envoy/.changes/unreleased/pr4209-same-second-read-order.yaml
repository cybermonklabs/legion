kind: Fixed
body: |-
    Of two answers of GitHub for one pull request with the same `updated_at` second, the stored
    head is the one whose read of GitHub began later: `pull_request_heads.github_read_at` is now
    when that read began, and migration `20261117114124_pull_request_heads_read_start` makes an
    update whose read began before the stored row's write nothing. The answer that arrived last
    won, so a slow read of an older head replaced the newer one, and a pass at the older head stood
    until the next reconcile pass. Two answers of one second that differ still owe a read.
time: 2026-11-17T12:16:12.000000000Z
