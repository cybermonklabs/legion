kind: Fixed
body: |-
  A message the NATS server stores under a role's key on its own, such as a RePublish of another
  stream or a direct get's copy of another role's claim, no longer reaches the session its body
  names, and that session's reply is no longer taken for the role holder's. Every reader that
  decides which session a role's message reaches now reads the role's claim from the role bucket
  stream's leader, with one decoding: the publish route, the role lane, the controller notice
  lane's read behind `recipients`, a stored row's filter and the interest writes, Dispatch's
  outbox, and Dispatch's check of whose reply to a role-routed message or mention is the holder's.
  Such a message is an unreadable claim at each of them: the publish route answers `500` naming
  `a message the server wrote` and forwards nothing, the role lane keeps the message under
  `claim_unread`, the lane goes to nobody, the outbox holds the event pending, and Dispatch
  answers that session's reply `403 REPLY_FORBIDDEN`. Before, the lane read, the publish route,
  the role lane and the outbox read it as that session's claim and forwarded to it, while the
  relay's check refused every such frame, and Dispatch accepted that session's reply. While the
  role bucket has no leader, the publish route answers `503`, the role lane and the outbox hold
  the message until a leader answers, and Dispatch answers a reply that needs the holder read
  `503 ENVOY_UNAVAILABLE`; before, a follower's direct get answered those reads. Dispatch now reads
  a reply's role holder from the role and session buckets itself, so with NATS disabled it accepts
  no reply from a session the attempt does not name. `GET /v1/roles/<role>` and the soft claim
  still read the claim by a direct get. A reply to a message or a mention whose read of the
  attempt it answers fails (a statement timeout, a reset connection) is now answered `500`, so its
  host replies again; it was `404 MESSAGE_NOT_FOUND` or `404 COMMENT_NOT_FOUND`, which told the
  holder the delivery was gone. An attempt with no row is still `404`.
