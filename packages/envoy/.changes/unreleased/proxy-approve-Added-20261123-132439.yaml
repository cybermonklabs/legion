kind: Added
body: |-
  A person's approvals go through Cipher's proxy. A profiles file whose dpop block is named `DISPATCH_APPROVE_TOKEN` turns the approve capability on, and the broker logs it at start (`broker: the approve capability`, with its host and the digest of the block and its private destination). A session on a box where a person signed in trades that sign-in, with `requested_token_type=urn:envoy:params:oauth:token-type:proxy-placeholder`, for a placeholder of a 15-minute approve grant of that person and session: no access token, the token type `N_A`, and in `proxy` the proxy's URL, its authority and the block's one host. Nobody approves the grant; the sign-in is its authority, and revoking the sign-in ends it. The grant is a row of `approve_grants` (migration 0046), which holds the placeholder's SHA-256 and no token. Every other trade asking for the placeholder, a machine's whose fleet names a person included, and a trade that asks for the scope `read`, which is narrowed to reading and approves nothing, is refused `invalid_request`.

  The proxy mints a Dispatch token for a grant on each broker pod, of the scope `approve` and the project scope person, bound to the pod's own key, at the grant's first allowed request on that pod and again on that pod after the broker's policy version moves, and puts the token it holds into every later allowed request while the grant lives; a request the approve block refuses mints nothing, and the proxy never releases the token. The broker logs each minted token's SHA-256 and the thumbprint of the key it is bound to, one line per token it mints, never the token. Dispatch accepts such an approve-only token on its approve routes alone - a document's reviews, the keep of a block, the decisions on a credential request, the revocations, the revoke of a personal token and the answer of an approval request - and answers every other route, and the answer of any other ask, `403 APPROVE_ONLY_TOKEN`; the mint and the change of a personal token stay closed to it. The block's allow list narrows by method and path prefix, so a request under an approve route's prefix that is no approve route reaches Dispatch, which refuses it. Every other broker token still holds no approve.

  `scripts/dev-stack.sh --approve` runs the stack with the broker's proxy and the approve block, sent to the run's Dispatch on loopback, which serves under `https://dispatch.approve.test`; `scripts/approve-check.sh` drives a signed-in person's session through it with each step's control.
