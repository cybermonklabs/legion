kind: Changed
body: |-
  The command bar's agent now holds its answer to fewer than 120 words as the bar draws them. Before
  a reply in prose ends the turn, the agent asks the server how many words the person would see
  (a new `words` call of agent/v1): the first link to each issue counted as its chip, with the
  issue's key, status and title, and a later link to the same issue, or a link to another item in
  words of its own, counted as its words, as the bar draws them; the system prompt says a second
  link to the same item adds its words and draws no chip.
  Text next to a link counts separately, even when the answer has no space there.
  `packages/contracts/fixtures/drawn-words.json` holds answers with the words the bar draws of
  each, and a test of the server and one of the web each hold their side to it. A reply of 120
  words or more gets one more model turn, which tells the model that count and asks for the same
  facts in at most 90 words as the person sees them, without repeating the key, status and title
  that each link already shows, or for the same answer again where the person's words ask for more
  than a short answer. There is at most one such turn in a turn of
  the run, and a reply still long after it is shown whole, as is a reply whose count the server
  does not give within 10 seconds. The `reply` frame says the count
  (`drawn_words`) and marks a reply held back for length (`held_long`). A tool result whose body is
  a list now names the list's total before the body, such as "[Total: 42 issues in the list
  below.]", so a count in the answer is the server's even where the body is cut; the system prompt
  says a count in the prose is a total a tool result or a drawn block gives. The server also takes
  out of a stored answer each code block that holds a block the run drew, or whose info string is
  `draw`, since the bar already draws that block beside the answer.
