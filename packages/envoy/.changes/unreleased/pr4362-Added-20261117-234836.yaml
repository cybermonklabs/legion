kind: Added
body: |-
  The broker's airlock proxy writes down where it went. A tunnel carries bytes no request of which the proxy reads, so nothing in the broker's log said that a session had reached an address at all, and a dial the rules refused or a service that could not be reached left no line either.
  Each tunnel the proxy opens writes one `airlock proxy: a tunnel` line at INFO, and each dial it refuses or cannot make writes one `airlock proxy: a dial that did not happen` line at WARNING, on a `CONNECT`, a bound host's request and a plain-HTTP request alike. Each names the caller - the grant, its enrollment, and the session and runtime behind it - the `issue` the grant's reason named, the host and port asked for, and the address the broker opened the socket to, which is the address its own check read. A failed dial's line adds `failure`, one of `refused`, `unresolved` and `unreachable`, and the broker's own `reason`.
  Neither line holds a secret's value or a placeholder: no field of either is read from what a command sent, and each is cut to its first 256 bytes as a call line's are, so a line stays within one Cloud Logging entry whatever a caller asks for.
