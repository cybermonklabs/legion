kind: Added
body: |-
  The broker's airlock proxy writes down where it went. A tunnel carries bytes no request of which the proxy reads, and a plain-HTTP request is forwarded with nothing decided, so nothing in the broker's log said that a session had reached an address at all, and a dial the rules refused or a service that could not be reached left no line either.
  Each socket the proxy opens for a `CONNECT` tunnel or a plain-HTTP request, an upgrade among them, writes one `airlock proxy: a tunnel` line at INFO as soon as it is open, before the command is answered, and each dial it refuses or cannot make writes one `airlock proxy: a dial that did not happen` line at WARNING, on a `CONNECT`, a bound host's request and a plain-HTTP request alike. Each names the caller - the grant, its enrollment, and the session and runtime behind it, read for each request on a bound host's connection - the `issue` the grant's reason named, the host and port asked for, and the address the broker opened the socket to as `ip:port`, which is the address its own check read. A failed dial's line adds `resolved`, how many addresses the host had; `failure`, one of `refused`, `unresolved`, `unreachable` and `cancelled`, the last for a lookup or a dial every attempt of which was given up because the command closed its connection; and the broker's own `reason`. Its `address` is the refused address, nothing for a host that resolved to nothing, or the addresses dialled, as many whole ones as fit in 256 bytes.
  Neither line holds a secret's value: no field of either is read from a request's body, or from any of its headers but the Host header a `CONNECT` with a path for its target is read by. The host and the port are the command's own text: the host is the one asked for, lowercased, without a zone, and cut to 256 bytes, and the port is the number it names. Lowercasing and the cut are no redaction; what keeps a placeholder the command wrote into its host off either line is the mask every line of the proxy port is written through, which writes each placeholder, in any case, as `[placeholder]`.
