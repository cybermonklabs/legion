kind: Changed
body: |-
  Every call into golang.org/x/oauth2, its google package and github.com/coreos/go-oidc goes
  through `redact.OAuth2`, which turns an OAuth error answer into a `redact.OAuthAnswer` and every
  other error those libraries answer into a `redact.LibraryError`, each printing only the rule's
  reading of the other party's words while `errors.Is` and `errors.As` find what they found
  before, so an issuer's or the broker's words no longer print raw where an error is wrapped with
  `%w`: `oidc.CheckClient`'s error for an answer that is neither ready nor rejected, a refused
  sign-in refresh's (`brokerclient.DeviceFlow.Refresh`), a discovery error's, which quoted the
  issuer's body, and the external-account exchange's, which quoted the security token service's.
  A token source handed to another library crosses the same boundary (`redact.TokenSource`), and
  a refusal's body and reason phrase are read with every credential its own request carried
  redacted first, so a gateway's page in a token endpoint's place that echoes the request no
  longer prints the refresh token, client secret or minted access token it shows
  (`redact.Tokens`; `redact.RefusalClient` for the external-account exchange, whose library
  prints a refusal as text alone). `agent-secrets`' userinfo refusal and gcloud's standard error
  print as the rule reads them. The
  broker's token client reads its answer only through the box, with four changes a caller can
  see: a `token_type` of
  `dpop` in any case is `Token.TokenType` `DPoP` rather than the spelling the broker wrote; an
  `expires_in` that is a JSON string holding no number is refused without quoting the string; a
  lapsed role refusal whose holder the rule would print changed (a URL carrying a credential, a
  control character) is the listener's refusal rather than a read of that holder's session; and
  the load test's reports name each refusal's code as the rule reads it.
