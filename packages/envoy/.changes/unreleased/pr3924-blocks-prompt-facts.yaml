kind: Fixed
body: |-
  The command bar's `draw_block` no longer refuses what a chart request needs. A filter's value
  may be a number, such as `priority` `in` `[0, 1]`: it picks rows and is never drawn, and a number
  anywhere a block shows one is still refused. A chart that names no `x` or `y` takes its chain's
  group and its one count, sum, mean, min or max, and a table that names no `columns` takes the
  chain's columns; a chain that leaves one open is refused naming the columns it makes. A group by
  a field no row holds, such as `priority_shown`, is refused naming `priority`, and a chart of one
  point is told to draw a metric or a table. `rows` named on a result that
  is the list itself is refused, saying to leave `rows` out. A column to draw that a chain which
  groups or counts does not write, such as `x` `closed_at` over a group of `closed_at` per week, is
  refused naming the columns the chain writes and the group's column, `week`; before, it was told
  the read's rows held no such field. A chain may group by two fields: a group after a group
  makes one row for each pair of values, with a column for each, where before a second group was
  refused and the column check read only its column. A chart of two groups is refused, saying to
  draw a table. The system prompt gives `draw_block`'s whole argument list,
  so the model no longer looks it up with `find_tools`. It also names the arguments of a message
  to a session (`body`) and of an answer to an ask (its id as its read gives it), says a
  suggestion's quote matches one place and a list written into an item nests
  under it, and says what an answer gives: a count's items, the page's item by its link, a
  session's title, the author of quoted words, every child and every holder asked about. It says
  a group's column is the one it writes, such as `week` for `closed_at` per week; that open asks
  by project are `dispatch_projects`' `open_asks`; to read a chart's issues with `dispatch_issues`
  in one reply, with no `find_tools`, and draw in the next, so a refused block can be drawn again;
  and to list only the items, ids and counts a result gives, saying where a block stayed refused.
  It gives the chains of "P0 and P1 open issues per project" and of each status across two
  projects, each with one group, and of each status per project, with two.
  It says the bar draws the first link to each issue as the issue's chip in place of the link's
  words, and a later link to that issue, and a link to another item with words of its own, as
  those words, so an answer writes the author, an ask's issue key, a holder and every other fact
  outside the link, and gives the priority and assignee of an issue whose thread it sums up.
  The eval's facts name each person by login, as Dispatch shows them.
