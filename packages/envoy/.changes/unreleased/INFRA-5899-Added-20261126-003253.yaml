kind: Added
body: |-
  `GET /api/v1/asks/open?project=<P>` answers `default_assignee`, the login of project P's stored
  default assignee, read in the statement that reads P's open asks and given even where P has
  none, JSON `null` where no project has the key, and left out of an `?author_session=` read, so
  a credential without the `person` scope, such as a Legion daemon's, reads that person while the
  routes that list every project's default and move one stay a person's.
time: 2026-11-26T00:32:53Z
