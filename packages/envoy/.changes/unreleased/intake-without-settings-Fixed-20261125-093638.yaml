kind: Fixed
body: |-
  A Dispatch with no delivery settings saved records the head of every pull request a
  `pull_request` webhook reports. Before this, the GitHub intake bound its NATS durable only once
  `delivery_settings` held a row, so such a deployment consumed no `pull_request` event: a pull
  request whose head no recorded result had read through stayed out of `pull_request_heads`, and a
  check CI proves read `no_head` ("Dispatch holds no open or merged pull request head") at an open
  pull request whose branch and body named the issue. The intake now binds its durable whatever the
  settings say, writes each envelope's head row, and leaves the delivery timeline's work (a merged
  pull request's row, a workflow run, the event freshness) to the settings. The durable's config
  takes consumer generation 2 and asks for new messages only: a take-over that creates it with no
  start recorded creates it at the stream's next sequence, as an explicit start, so the first bind
  hands the intake none of the stream's 72-hour retained history, and a take-over never starts a
  durable before its own start sequence. Both follow the rule recorded for nats-server v2.10.29,
  which reports a fresh consumer's ack floor as 0, as the session consumers already do.
