kind: Added
body: |-
  The secrets broker's airlock proxy can send the allowed requests of a bound host to an address inside the broker's own cluster: `BROKER_PROXY_PRIVATE_UPSTREAM`, whitespace-separated `<host>=<url>` entries, one per bound host, such as `dispatch.example-tailnet.ts.net=http://dispatch.dispatch.svc.cluster.local:8766`. Each such request goes to its own entry's URL scheme and host on a transport of that entry's own, so one host's requests never reach another host's destination, keeps the host as its `Host` header, and carries a proof for `https://` and the host.

  The proxy dials the URL's host only when every address it resolves to is one the proxy refuses to every other request - private, `100.64.0.0/10` or inside `BROKER_AIRLOCK_CLUSTER_RANGES` - and none is loopback, link-local, unspecified, multicast, a cloud metadata server's IPv6 address (`fd20:ce::254`, `fd00:ec2::254`), a local-use translation address (`64:ff9b:1::/48`), or an IPv6 address carrying one of those in its NAT64, 6to4, Teredo or IPv4-compatible form, checked again at every dial so a name rebound after its CONNECT is refused; otherwise the CONNECT to the host is refused `403 ADDRESS_REFUSED` and nothing is dialled. That refusal, and the `502 UPSTREAM_UNREACHABLE` of a destination that does not answer, tell the command the rule and not the destination's in-cluster name or address, which the broker's log keeps.

  The broker refuses to start, naming the setting and the fault and quoting no part of the URL a credential can sit in, on a host named twice, on the setting without `BROKER_PROFILES_FILE`, on a host that is not one lower-case host name, on a URL that is not `http` or `https`, names no host or a port outside 1 to 65535, or carries a user, a path other than `/`, a query or a fragment, and on a URL whose host every dial refuses unless `BROKER_AIRLOCK_TEST_DIAL_ALLOW` names that host and port. Every broker with a profiles file also refuses to start unless every dpop block binds one exact host, a destination's, with a non-empty allow list none of whose entries names the path prefix `""` or `/`, carried in `Authorization` alone, no block of another kind binds that host, and every destination is bound by a dpop block. `BROKER_AIRLOCK_TEST_RESOLVE` entries may name a port, `<host>=<address>:<port>`, for a local stand-in.
