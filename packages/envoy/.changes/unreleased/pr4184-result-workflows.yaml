kind: Added
body: |-
  The secrets broker grants one CI run the writing of one project's results, and nothing else. `BROKER_EXCHANGE_RESULT_WORKFLOWS` lists result entries, `<repository>=<workflow path>=<ref pattern>=<project>=<person>`, where `*` in the pattern is one segment of a ref. A run of that workflow on a matching ref exchanges its GitHub token for an airlock placeholder and a result grant, never for a token: the grant holds the OAuth scope `results` alone and the project scope `results`, names the person, the project and the session `ci-results:<repository>/<workflow path>`, and carries the run as its `ci` claim: repository, workflow, ref, commit, event, run, attempt, runner and the check run of its job. A results token the broker mints from the grant carries the same claims, and only the broker's airlock proxy holds it. The broker refuses a run token that lacks a claim of the run, a ref that two patterns match, and a bad pattern at start-up.

  The broker reads a workflow run's path as its `workflow_ref` without the repository and without `@` and the run's `ref` claim, so a branch whose name holds an `@` is a run of its workflow, and it refuses a `workflow_ref` of any other form, naming it and the ref.

  The shared broker-token verifier accepts a results token only where its service asks for it (`ciphertoken.Options.ServesResults`), and marks its caller results-only with the run. A verifier of an older build refuses the token, and the Envoy listener answers it `401`.
