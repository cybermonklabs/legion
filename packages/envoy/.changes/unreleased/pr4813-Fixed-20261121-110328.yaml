kind: Fixed
body: 'A release of a role claim no longer deletes a claim granted after the release read the claim. A release that loses its conditional delete to the holder''s renewal reads the claim again and deletes it again; that retry also deleted a new grant of the role to the process the release states, or, under the administrator''s force through `DELETE /v1/interests/<session_id>`, to any process of the session, after the claimant was told it holds the role. The release now deletes again only while the claim carries the `grant_id` the release read, as the hand-back mark does, so it follows the claim through renewals and the adoption of a claim that names no process and leaves a new grant standing, also one stamped in the same millisecond.'
