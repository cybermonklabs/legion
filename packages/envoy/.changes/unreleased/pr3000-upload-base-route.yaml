kind: Added
body: |-
    A whole-document upload names the token of the version it replaces. `POST /api/v1/issues/{key}/artifacts` and the project route read a `precondition` of the shape `dispatch doc-edit` takes, `{"document":"sha256:…"}`, from the JSON body and from the multipart form alike, and check it inside the write's own lock: a token behind the live document is refused `409 PRECONDITION_FAILED` carrying the live token, the version the document stands at and where to read a fresh one, and nothing is written. A replacement that names no token at all is refused `400 PRECONDITION_REQUIRED`, so no replacement lands unguarded. A `blocks` precondition is refused `400 INVALID_PRECONDITION`, since an upload rewrites the whole tree, and so is a token on an upload that replaces nothing: a first upload under a name the owner holds nothing under, and a file, which holds no document tree and so no token. The repair of a document whose tree is outside the Proof schema names none either, since it renders no markdown and an upload is the only way to repair it.
