kind: Changed
body: |-
  `agent-secrets result-grant -- COMMAND` now trades the GitHub job's identity at the secrets broker's token endpoint for the proxy placeholder of a result grant (`cipherclient.Client.AirlockPlaceholder`), with a DPoP proof of a key it makes in memory. It runs nothing when `DISPATCH_URL` names a host the grant does not bind, or is not `https` on port 443 (an `http` URL would send the placeholder in the clear, around the proxy), prints `::add-mask::<placeholder>` first in a GitHub job (`GITHUB_ACTIONS=true`), and gives the command no `AGENT_SECRETS_MACHINE_IDENTITY`.

  An airlock child's `NO_PROXY` now leaves out every fixed entry that covers a host the release binds, as it leaves out an inherited one: with Dispatch's tailnet name bound, `.ts.net` is no longer in the list, so Dispatch's writes reach the proxy. The broker's own host, which the list gains so a nested `agent-secrets` call reaches the broker directly, is left out the same way when it is a bound host, a parent domain of one or a name under one. An entry is compared without one trailing dot, so `dispatch.example.test.` is left out as `dispatch.example.test` is.
