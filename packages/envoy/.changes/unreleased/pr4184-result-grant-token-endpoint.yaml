kind: Changed
body: |-
  `agent-secrets result-grant -- COMMAND` now trades the GitHub job's identity at the secrets broker's token endpoint for the airlock placeholder of a result grant (`cipherclient.Client.AirlockPlaceholder`), with a DPoP proof of a key it makes in memory, and no longer posts the run's token to a route of its own. It runs nothing when `DISPATCH_URL` names a host the grant does not bind, prints `::add-mask::<placeholder>` first in a GitHub job (`GITHUB_ACTIONS=true`), and gives the command no `AGENT_SECRETS_MACHINE_IDENTITY`.

  An airlock child's `NO_PROXY` now leaves out every fixed entry that covers a host the release binds, as it leaves out an inherited one: with Dispatch's tailnet name bound, `.ts.net` is no longer in the list, so Dispatch's writes reach the proxy.
