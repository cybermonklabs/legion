kind: Fixed
body: |-
    `agent-secrets --help` says how to read one account's token out of a GitHub profile's JSON
    object of installations, `GH_TOKEN=$(printf %s "$NAME" | jq -r ".installations[\"ACCOUNT\"].token")`,
    keyed by the login as GitHub writes it, and says never to echo the variable. It said only that
    the variable holds the object, and a command that sent `$NAME` as the token got 401 from GitHub.
