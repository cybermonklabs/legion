kind: Fixed
body: |-
  A restricted member's machine login no longer enrolls a session and is no longer released the
  shared agent-tier secrets. A restricted member is a person an access list admitted from outside
  the deployment's sign-in domain. Before this change the broker enrolled a session under such a
  person's approved machine login and released every shared agent-tier secret to it at once. Where
  `BROKER_PROJECT_ACCESS_URL` is set, the broker now asks Dispatch what kind of member a person is
  before it enrolls under that person's machine login or pod login, and a restricted member's
  enrollment is refused `403 RESTRICTED_MEMBER_ENROLLS_NOTHING`. That refusal is final:
  `agent-secrets-helper` makes one enroll call for such a session and asks no more, the session's
  state reads `refused`, an `agent-secrets register` made after the refusal, or one given
  `--wait`, exits 1 naming it, and `register --exec` launches its command with no secrets access,
  saying so. A person's sign-in on a machine is not held to this check at enrollment: its session
  is held to the list rule alone. Each secret request, each approval and each release asks again
  of the session's person, and so does each call the airlock proxy carries, so a session a
  restricted member already had is denied every secret, `restricted-member`, an approval of a
  request it left pending is the policy's denial, and each grant it holds ends at its next use,
  the airlock proxy's next call included (`407 GRANT_NOT_LIVE`). That person is the one the
  session was made for: a person's pod whose account `BROKER_POD_OPERATORS` no longer maps to that
  person, or maps to another, is still asked about as that person. A full member's login is
  enrolled and released what it was. A check that
  cannot decide refuses: while the broker cannot learn from Dispatch whether a person is a
  restricted member, each enrollment under that person's login, each secret request of their
  sessions, each release of their grants and each new call the airlock proxy would carry for them
  is refused `503 MEMBER_KIND_UNCHECKABLE` naming the person and why, with nothing written and
  nothing released, and the caller asks again. So with the setting on, a Dispatch outage stops
  every person's secret requests and releases until Dispatch answers; a service's pods and a
  machine's own sessions ask nothing and are unchanged. During such an outage one person's reads
  in flight together share one call, which waits at most 10 seconds, and a failed read is the
  answer to that person's reads for the 2 seconds after it. With `BROKER_PROJECT_ACCESS_URL`
  unset the broker asks nothing and behaves as before, so set it only against a Dispatch that
  serves `GET /api/v1/access/person`.
