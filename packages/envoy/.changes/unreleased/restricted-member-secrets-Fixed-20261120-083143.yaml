kind: Fixed
body: |-
  A restricted member's machine login no longer enrolls a session and is no longer released the
  shared agent-tier secrets. A restricted member is a person an access list admitted from outside
  the deployment's sign-in domain. Before this change the broker enrolled a session under such a
  person's approved machine login and released every shared agent-tier secret to it at once. Where
  `BROKER_PROJECT_ACCESS_URL` is set, the broker now asks Dispatch what kind of member a person is
  before it enrolls under that person's machine login or pod login, and a restricted member's
  enrollment is refused `403 RESTRICTED_MEMBER_ENROLLS_NOTHING`. A person's sign-in on a machine
  asks nothing at enrollment. Each secret request and each release asks again of the session's
  person, so a session a restricted member already had is denied every secret,
  `restricted-member`, and each grant it holds ends at its next use. A full member's login is
  enrolled and released what it was. A check that cannot decide refuses: while the broker cannot
  learn from Dispatch whether a person is a restricted member, each enrollment under that person's
  login, each secret request of their sessions and each release of their grants, the airlock
  proxy's included, is refused `503 MEMBER_KIND_UNCHECKABLE` naming the person and why, with
  nothing written and nothing released, and the caller asks again. So with the setting on, a
  Dispatch outage stops every person's secret requests and releases until Dispatch answers; a
  service's pods and a machine's own sessions ask nothing and are unchanged. With
  `BROKER_PROJECT_ACCESS_URL` unset the broker asks nothing and behaves as before, so set it only
  against a Dispatch that serves `GET /api/v1/access/person`.
