kind: Fixed
body: |-
  More clients that carry a credential follow no redirect, so a 3xx from whatever answers in the
  server's place takes no credential to the host its `Location` names, and each caller reads the 3xx
  as a refusal by its status and prints no `Location`. Dispatch's Envoy listener client, which sends
  Dispatch's identity token or the shared bearer: a 3xx is the listener's `ErrUnavailable`, never
  `ErrUnreachable`. `agent-secrets`' sign-in clients: the device flow's discovery, device code poll
  and renewal, an external account's own exchange, and a pool identity's exchange at the security
  token service and its `generateIdToken` call; a redirected discovery prints its status, where it
  followed the redirect and printed where it ended. The broker's minters (the GitHub App's calls,
  Google's token endpoint and IAM's `generateAccessToken`), on a client a caller gives as well as on
  their own: a 3xx is `<who> answered HTTP 302` under `ErrMintUpstream`, and is not retried.
  `agent-secrets`' `--owner me`, whose read of Google's userinfo endpoint carries the sign-in's
  token. The load test's backlog run's check of the NATS monitor.

  The MCP bridge's message POST follows a redirect only on its endpoint's own origin, as its SSE
  connect does, and a 3xx it gets back is an error naming the status. Before, a 307 sent the message
  again to any host, and a 3xx passed as success, so the message was lost until the call timed out.
