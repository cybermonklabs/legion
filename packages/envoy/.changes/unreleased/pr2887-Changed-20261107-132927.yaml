kind: Changed
body: |-
  The two lines a maintenance loop's tick writes, `dispatch duty: leased pass ran` and the
  `dispatch duty: leased pass skipped` a tick writes when it finds its period already served,
  now name that tick's own due time beside the aligned period it fell in. Neither line is
  written at the moment its tick was due - the skip once the lease and the period have been
  read, the other once the whole pass has run - so until now a reader had only the moment the
  line was written: a tick held in a slow call is logged in a period later than the one it was
  judged in, and two processes' lines can read as one period while their ticks were due in two.
  A pass with no period is also a pass with no due time, and names neither.
