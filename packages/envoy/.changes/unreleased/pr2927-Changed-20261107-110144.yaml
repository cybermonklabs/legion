kind: Changed
body: The events outbox renews its publisher hold every second rather than every two, so the four-second window a renewal has holds three attempts instead of one and a holder survives a longer stall of its database or its machine. The line that ends a holder's turn is written before the release rather than after it, and carries `stopped` and `stopped_by`, the moment the process stopped publishing bounded from below and from above; the line that begins it carries `started`, read before the process began publishing.
