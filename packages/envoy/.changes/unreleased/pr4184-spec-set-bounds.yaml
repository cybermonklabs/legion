kind: Added
body: |-
  A note set and a commit's spec files are bounded as a set, beside the 1 MiB bound of each file: at most 1,000 files (`notes.MaxFiles`), since Dispatch reads a directory's listing as one GitHub answer of at most 1 MiB, and at most 16 MiB in sum (`notes.MaxSetSize`), since the cache of a commit's judged checks keeps no entry over that size. `notes.CheckSet` refuses a set over either with one problem, `set too large: <dir> holds <n> files (limit 1000)` or `set too large: <dir> holds <n> bytes in its files (limit 16777216)`, from the listing and before any file is read, in `notes.ReadSet` (`spec-check`, `architecture-check`), `githubapp`'s `DirFiles` (the architecture import) and the results route. The route answers such a set `409 SPEC_FILES_REFUSED`, and so a listing GitHub truncates or one over that 1 MiB, which no read of the commit answers otherwise, where it answered `503 FILES_UNREADABLE` before.

  The `dispatch_result` tool's description says that a CI job's write that reached Dispatch with no answer that says whether it stored the result prints `{"write_outcome_unknown":"<code>"}` and exits 1, and that a call the broker's rate limit, a broker that cannot answer the trade or Dispatch's check of the job's token (429 BROKER_TOKEN_RATE_LIMITED, 503 BROKER_UNAVAILABLE) turns away before anything is stored is asked again after the answer's Retry-After, or a second, within the call's one bound of 60 s from its start, and ends with the last answer, its code named.
