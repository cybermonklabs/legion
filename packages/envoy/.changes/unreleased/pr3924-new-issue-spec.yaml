kind: Changed
body: |-
  The command bar files a new issue only with a spec on its line File as a new issue, whatever the
  person's mode, and in a plan in Ask: a new issue its agent proposes there with no spec, or with
  a spec of spaces alone, is refused, and the agent is told to write a short spec from the
  person's words and propose the plan again. The system message of a run in Ask says so, so its
  agent writes the spec the first time. In Auto-review a new issue with a title alone still runs,
  as before.
