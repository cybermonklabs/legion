kind: Added
body: The web app shows the refusal of Dispatch when a document breaks the form of The Spec. On the document header, the refusal of an approval shows under Approve and Request changes. Dispatch refuses the same document until its text changes, so the list of pending changes does not show that refusal again. Request changes then opens with the reason that Dispatch wrote for the author, and its field shows all of that reason. On an approval card, the refusal selects Request changes, and the answer field holds that reason. The last line of the refusal on the card then tells the person to choose Answer. After a refusal, the control that the person pressed keeps the focus. The author gets the findings with one more press. A refusal that lists its findings shows one finding on each line.
