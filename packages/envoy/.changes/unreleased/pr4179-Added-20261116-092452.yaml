kind: Added
body: The web app shows the refusal of Dispatch when a document breaks the form of The Spec. On the document header, the refusal of an approval shows under Approve and Request changes. Dispatch refuses the same document until its text changes, so the list of pending changes does not show that refusal again. Request changes then opens with the reason that Dispatch wrote for the author. On an approval card, the refusal selects Request changes. The answer field then holds that reason, an empty line and the note that the person typed. The last line of the refusal on the card then tells the person to choose Answer. After a refusal, the control that the person pressed keeps the focus. A natively disabled Approve takes the focus back only once its write has ended and the button is enabled again. The header and each card of one request show the same refusal, and the focus stays where the person pressed. The author gets the findings with one more press. A refusal that lists its findings shows one finding on each line. Inside NoTooltips, the reason field of the dialog and of the card grows with its text up to half the window. Past that, the field scrolls. Outside NoTooltips, the reason field keeps its ordinary fixed sizing. The refusal stays when the page draws its card or its header again, as the card in Needs you on the issue page does.
