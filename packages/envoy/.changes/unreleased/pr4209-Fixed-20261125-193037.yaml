kind: Fixed
body: |-
    A pull request whose commit messages name more than one issue is credited to none of them by
    its commit messages; the higher sources still decide, in their order (an issue's link to the
    pull request, a GitHub issue its body cites, its branch name, then a key in its title or body,
    title first), and messages that name one issue credit it as before. A key counts where it names
    an issue Dispatch holds, in any repository, so a token such as SHA-256 is no key. A branch can
    carry commits of other work, and the issue an older commit's `Dispatch:` trailer named had been
    credited with a later pull request, though that issue was closed, and its checks read the later
    pull request's head instead of its own merged head, which had passed.

    A database that ran an earlier head of this pull request's branch is refused at boot, since
    two of its migrations changed in place, and must be reset. A database of the release before
    holds no texts of its pull requests, so each is credited by the rule above at its first read of
    GitHub.
