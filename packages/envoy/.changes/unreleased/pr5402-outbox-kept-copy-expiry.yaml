kind: Fixed
body: |-
  A role-routed Dispatch event that the outbox kept for a role no session held is no longer lost
  in silence when its copy's hour ends. The listener that drops such a copy stores an expiry
  notice on `notifications.envoy.kept.expired.<role>` and counts it on
  `envoy_role_kept_expiry_notices_total`. Dispatch's outbox reads the notices and keeps the event
  again, up to three keeps in all, or forwards it to a session that holds the role by then. After
  the third keep ends, the outbox appends a `role.undelivered` event on the event's issue,
  document or project. A keep or a forward of such a copy that NATS refuses for good, a copy the
  stream's retention has removed, or a copy whose sequence holds another message in a stream
  created again since ends the event the same way after fewer than three keeps, with reason
  `expired` or `copy_gone`, unless another copy of the event still carries its delivery to the
  role. Once an hour for each role, the outbox also posts one message on the
  issue, or on the document's issue, that names every event the role did not take. Some expiry
  notices are passed over with one Error line, and only the outbox's notice cursor moves past
  them: one whose role is not a valid role name, one stored on another role's subject, and one
  whose event was never routed to that role. So is one whose sequence does not hold that event's
  copy: another copy is there, a message no read can decode, a message of another subject, or
  nothing at or past the first message the stream still holds. Such a notice keeps nothing again
  and records nothing undelivered. The cursor names the stream it counts in, so a
  stream created again is read from its first notice, with one Error line. A send of the expiry
  pass that finds NATS unavailable counts on `envoy_dispatch_outbox_publish_failures_total`. A
  role forward that the stream stored after its resolution's fence and acknowledgement window no
  longer counts as delivered: the event stays pending and goes to the role's holder at the next
  read. Migration `20261124134448` adds three tables and changes nothing that exists.
