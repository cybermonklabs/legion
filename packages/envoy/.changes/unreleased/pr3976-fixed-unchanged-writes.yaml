kind: Fixed
body: |-
  A `PATCH /api/v1/delivery/session-groups/{id}` that changes neither the group's name nor its
  sessions (its own name again, a session it holds, one it does not) now writes nothing and
  answers the group as it stands, whoever sends it. It used to move the group's `updated_at`,
  which the read answers, without logging a change, so an open Delivery page kept the old one.
  Likewise a computed eval's day row that a new build rebuilds to the same values keeps its
  `updated_at`, and with it the `freshness.rows_updated_at` the evals list answers, so a live
  evals view and the read agree; the row still records the build that rebuilt it (`built_by`).
