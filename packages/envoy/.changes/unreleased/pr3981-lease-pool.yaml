kind: Changed
body: |-
  The lease pool (`store.LeasePoolSize`) grows from 25 to 27 connections. The records job (lease
  `word-records`) and the reviewer's sweep of held texts (lease `reviewer-sweep`) each reserve one
  at boot, whether or not this configuration runs them. So one server process opens at most 118
  connections to Postgres, up from 116 (`store.ConnectionsPerProcess`), and two processes at
  their ceiling hold 236. `infra/gcp`'s `dispatchConnectionsPerPod` is 118 to match.
