kind: Changed
custom:
  Issue: pr4274
body: |-
  `/api/v1` is deprecated and keeps its answers: each `/api/v1` answer carries a `Deprecation`
  header (RFC 9745) and a `Link` header with `rel="successor-version"` naming the `/api/v2` route
  that answers for it. `DISPATCH_API_V1_END`, an RFC 3339 instant, ends it, and `envoy-infra`'s
  `gcp:Dispatch` sets it from its new `apiV1End` input: while the instant is ahead each `/api/v1`
  answer carries a `Sunset` header (RFC 8594), and once it has passed every path under `/api/v1`
  answers `410 API_V1_ENDED`, pointing to `GET /api/v2`. Unset, `/api/v1` has no end, and a value
  that is not an RFC 3339 time refuses startup. Arm it only once no client still calls `/api/v1`:
  at this release the `dispatch` command, the plugins, the Legion daemon and the secrets broker
  still do. The cookie-origin guard's refusal carries a `code` now, as every other refusal does.

  The secrets broker's judge and project-access check name the broker in their Dispatch requests'
  `User-Agent`, `envoy-broker-judge/<commit>` and `envoy-broker-project-access/<commit>`, so
  Dispatch's access log tells their calls apart.
