kind: Fixed
body: Dispatch's pre-deploy census admitted an added column on a table above its 1 GiB limit only when the column's type was text or text[], so it refused a migration that adds a bigint, integer or timestamptz column, or a column with a constant default, although PostgreSQL writes only the catalog for such a column. The census now reads the catalog of the database it judges and admits an added column of any type that is no domain and no relation's row type, nor an array of one, with a constant, a cast constant, a SQL value function or a stable or immutable pg_catalog function with no argument as its default. The same type rules hold for the type a default casts to. An unqualified call such as now() is admitted only while pg_catalog is the first schema of the census's search_path and no function of another schema has that name. It also admits DROP COLUMN, SET DEFAULT, DROP DEFAULT, DROP NOT NULL, DROP EXPRESSION, a NOT VALID foreign key, RENAME COLUMN, CREATE TABLE, CREATE INDEX on a table the same migration creates, CREATE VIEW, DROP TABLE and LOCK TABLE. It still refuses on size each form that reads or rewrites rows, a one-part serial type name among them whatever type of that name exists. It reads no catalog after a pending migration that does not parse, or that holds a statement it does not know to leave type and function names as they are, such as a table rename, a DO block or a CREATE TYPE (the census's section of packages/envoy/cmd/dispatch/README.md lists the statements that keep the catalog reads on). It now sizes the table of an index created without a name, and it counts the rows of a table that a migration names with a schema other than public, where it stopped with an error before.
