kind: Fixed
body: Dispatch's pre-deploy census admitted an added column on a table above its 1 GiB limit only when the column's type was text or text[], so it refused a migration that adds a bigint, integer or timestamptz column, or a column with a constant default, although PostgreSQL writes only the catalog for such a column. The census now reads the catalog of the database it judges and admits an added column of any type that is no domain and no relation's row type, nor an array of one, with a constant, a cast constant, a SQL value function or a stable or immutable pg_catalog function with no argument as its default. The same type rules hold for the type a default casts to. An unqualified call such as now() is admitted only while pg_catalog is the first schema of the census's search_path and no function of another schema has that name. It also admits DROP COLUMN, SET DEFAULT, DROP DEFAULT, DROP NOT NULL, DROP EXPRESSION, a NOT VALID foreign key, RENAME COLUMN, CREATE TABLE, CREATE INDEX on a table the same migration creates, CREATE VIEW, DROP TABLE and LOCK TABLE. It still refuses on size each form that reads or rewrites rows, a one-part serial type name among them whatever type of that name exists. It reads no catalog after a pending migration that does not parse, or that holds a statement it does not know to leave type and function names as they are, such as a table rename, a DO block or a CREATE TYPE (the census's section of packages/envoy/cmd/dispatch/README.md lists the statements that keep the catalog reads on). A SET or RESET of any setting but lock_timeout and statement_timeout stops the catalog reads too, a SET LOCAL for its own migration alone and any other for its own migration and every later one. So does a statement that names a pg_catalog relation or a view over one, that creates a function or a table whose name pg_catalog holds as the name of a function or a type, or that calls set_config, itself or through a view or a rule of a relation it names. A pending statement that can create or enable an event trigger that the census does not see also takes the exemption from every later pending migration. Such a statement is a CREATE or ALTER EVENT TRIGGER, a statement that names a pg_catalog relation, such as an UPDATE of pg_event_trigger, or any statement off the list of statements that keep the catalog reads on, such as a DO block, a CALL or a CREATE or ALTER EXTENSION. A pending migration that does not parse takes the exemption from every later pending migration too. It now sizes the table of an index created without a name, and it counts the rows of a table that a migration names with a schema other than public, where it stopped with an error before. The migration runner now applies each migration with standard_conforming_strings on, backslash_quote at safe_encoding and client_encoding at UTF8, the settings under which the census reads it, so a session setting that an earlier migration left on a connection, a connection option or a database default no longer makes PostgreSQL read a migration otherwise than the census does. The runner also starts each migration with session_authorization, role and search_path at the values that RESET gives them, and the census reads with the same values, so stored code that an earlier migration ran, such as a column default that calls set_config, no longer changes what a later migration's names resolve to.
