kind: Fixed
body: Dispatch's pre-deploy census admitted an added column on a table above its 1 GiB limit only when the column's type was text or text[], so it refused a migration that adds a bigint, integer or timestamptz column, or a column with a constant default, although PostgreSQL writes only the catalog for such a column. The census now reads the catalog of the database it judges and admits an added column of any type that is no domain and no relation's row type, with a constant, a cast constant, a SQL value function or a stable or immutable pg_catalog function with no argument as its default. It also admits DROP COLUMN, SET DEFAULT, DROP DEFAULT, DROP NOT NULL, DROP EXPRESSION, a NOT VALID foreign key, RENAME COLUMN, CREATE TABLE, CREATE INDEX on a table the same migration creates, CREATE VIEW, DROP TABLE and LOCK TABLE. It still refuses on size each form that reads or rewrites rows, and it reads no catalog after a pending migration that changes a type, a domain, a cast, a schema or an extension, sets search_path, role or session_authorization for the session, or does not parse. It now sizes the table of an index created without a name.
