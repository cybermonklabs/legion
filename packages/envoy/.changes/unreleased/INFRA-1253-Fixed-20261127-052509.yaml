kind: Fixed
body: |-
  A read that reaches an ask whose stored author, or whose last editor, is no actor now leaves
  that ask out and logs it, as a node the reader may not see is left out. Before, the read failed
  with 500: the Decisions read (`GET /api/v1/issues/{key}/decisions`) and the tree read, with or
  without a view, each walk the issue's conversation, so one such ask row failed every read of the
  issue's decisions and its tree. The open questions, the entries and the tree now answer every
  other ask.
time: 2026-11-27T05:25:09Z
