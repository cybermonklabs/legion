kind: Changed
body: |-
  Dispatch takes each Legion daemon's state events from the held durable `legion-state-events` on
  `notifications.legion.*.state` and writes its Legion observations from them, so a change is
  recorded when its message is applied, not at the next read. Dispatch no longer reads a daemon's
  state every minute. It reads a daemon's `GET /legion/v1/state` whole only for a project with no
  starting point, a boot that does not follow or whose schema version moved, a gap the stream no
  longer holds, a message of another store than the starting point's, a message the database
  refuses for good, and a read owed since one failed. The whole reads of one project start at
  least a minute apart, whatever their reason. A message that calls for a read sooner makes none:
  Dispatch records the read as owed, sends the first such message back to the stream with a delay
  of the time left in the minute, and makes the read at its redelivery; every later message that
  calls for the owed read is acknowledged. A read that fails sends that message back for another
  minute, at most 10 times in all, and its next delivery is then acknowledged, so one message holds
  the consumer's ack floor for about 11 minutes at the most. A failed read that no message holds,
  a failed starting read or one whose message went back 10 times, waits for the project's next
  message, boot, settings change or take-over. So where a message holds the read, a project that
  goes quiet is a minute behind at the most; a burst of such messages makes one read a minute and
  holds one message of the consumer's window, and the messages of other projects are not stopped.
  A message that goes back to the stream is logged once, as held, and with no other line. A good
  whole read takes the daemon's `daemon.stateRun` as the run of its starting point, so a boot
  message of that run that arrives after the read, at or below the read's sequence, makes no second
  read. It logs each whole read with the daemon run that served it, its first reason as `reason`,
  and each reason it was owed for as `reasons`. It applies no message of another store, and no message
  while no good whole read has given the project a store. It does not decode a message whose
  events do not go from `firstSeq` to `seq` with one event for each sequence. It applies a
  transaction that the daemon split over several messages only when the last message arrives,
  and a whole read that fails does not delete the parts that Dispatch holds. It does not apply a
  message that the database refuses for good (SQLSTATE class 22 or 23), and does not try it again
  in place. It takes no starting point while a Dispatch process of an earlier build is in the fleet.
  When Dispatch has NATS, a `PUT` of a project's Legion setting, of the same URL too, makes one
  whole read.
  A whole read asks for `GET /legion/v1/state?view=observed`, which carries only the fields
  Dispatch reads. A daemon of an earlier build ignores the query and serves its whole state, which
  Dispatch reads the same way. A whole read reads at most 64 MiB of the answer, not 8 MiB. A larger
  answer is a failed read whose `legion_reads` row names the answer's size and the cap, and whose
  `bytes` is that size, not the point where the read stopped.
  `legion_reads` records each transaction the intake applies as a row of kind `events` at the
  daemon's commit time. `legion_event_cursors` records how far the observations of each project
  follow its daemon and the whole read it owes, with the reasons for that read and the stream
  sequence of the message that holds it,
  `legion_event_parts` holds the parts of a split transaction, and
  `server_processes.legion_state_intake` tells a process of this build from one of an earlier
  build (migration `20261118212431_legion_events`). A call to a daemon waits up to 60 s, not 20 s.
  Dispatch's NATS grant names the new durable, and on a VM hub the changed grant replaces the
  hub's instance. The lease pool holds 24 connections, not 22, and a server process opens at most
  115 connections to Postgres, not 113.
