kind: Changed
body: |-
  Dispatch takes each Legion daemon's state events from the held durable `legion-state-events` on
  `notifications.legion.*.state` and writes its Legion observations from them, so a change is
  recorded when its message is applied, not at the next read. Dispatch no longer reads a daemon's
  state every minute, and no recurring timer reads it. It reads a daemon's
  `GET /legion/v1/state?view=observed` whole only where the events cannot carry the state, for the
  reasons legion's `ReadReason` constants name, and the whole reads of one project start at least
  a minute apart. The Dispatch README describes the rule (`cmd/dispatch/README.md`, "The Legion
  state intake"): when a read is owed, which message holds it and for how long, how many messages
  of the consumer's window one project can hold, what a `PUT` or a `DELETE` of a project's Legion
  setting does to the project's cursor, and the intake's log lines; legion's `cursor.readFor`,
  `resetCursor` and `cursor.reset` hold it in full. A daemon of an earlier build
  ignores the `view` query and serves its whole state, which Dispatch reads the same way. A whole
  read reads at most 64 MiB of the answer, not 32 MiB, and an answer over that is a failed read.
  When Dispatch has NATS, a `PUT` of a project's Legion setting, of the same URL too, calls for a
  whole read of the daemon the setting names; the README says when the `PUT`'s wake makes that read
  and when a read already owed or in flight stands for it. Dispatch takes no starting point while a
  Dispatch process of an earlier build is in the fleet.
  `legion_reads` records each transaction the intake applies as a row of kind `events` at the
  daemon's commit time. `legion_event_cursors` records how far the observations of each project
  follow its daemon and the whole read it owes, with the reasons for that read, the stream
  sequence of the message that holds it and how many times that message went back to the stream,
  when the project's newest whole read began (`last_read_started_at`, which each whole read writes
  before it calls the daemon, and which a `PUT` and a `DELETE` keep), the highest sequence of each
  store that Dispatch acknowledged past the cap of 16 waiting messages, the store and the URL of
  the daemon that the setting named before, the stores that are no daemon of the project, and
  each message whose hold a `PUT` or a `DELETE` ended (`released_holders`, kept by the rule of
  legion's `cursor.reset`). `legion_event_parts` holds the parts of a transaction the daemon split
  over several messages, and `server_processes.legion_state_intake` tells a process of this build
  from one of an earlier build (migration `20261118212431_legion_events`).
  Dispatch's NATS grant names the new durable, and on a VM hub the changed grant replaces the
  hub's instance. The lease pool holds 29 connections, not 27, and a server process opens at most
  120 connections to Postgres, not 118.
