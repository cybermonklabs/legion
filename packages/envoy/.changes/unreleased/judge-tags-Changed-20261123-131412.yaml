kind: Changed
body: |-
    A key's model judge is a setting of the key itself: its `judge` tag, whole seconds from 1 to 900, makes it a key the judge decides for at most that long, and its `guidance` tag is the instruction the judge decides it on. A profile is decided by its source's tags. A `judge` tag that is not digits naming 1 to 900 seconds refuses the key at each policy load (`judge-out-of-range`, naming the key), and a `guidance` tag longer than 2000 characters refuses it too (`guidance-too-long`). The `judge` tag is in the policy version, so adding, lowering or removing it checks each live judged grant of the key again at its next release: a grant the tag no longer admits (taken off, or lowered below its lifetime) is ended for good there, and putting the tag back does not revive it, while a grant of a key the broker stops serving for another reason pauses as a person's does; `guidance` ends no grant.
    The judge decides each judge key of a request in a model call of its own, all at once, each shown that one key's guidance and nothing of any other key, and grants the request only when every call grants; one deny refuses it. A request for N judge keys makes N calls and waits as long as the slowest. Each `request.judged` row's `verdict` is now what became of the request (`granted`, `refused`, `handed to the person`, `not pending` or `unknown`), and its `calls` say what each key's call did (`granted`, `denied`, or `failed` with its error, and the raw answer of a call whose answer did not parse), where a model call that failed used to be recorded as `deny` beside a request handed to its person; the `broker judge: wrote a verdict` line says the same.
    `agent-secrets secret create` and `retag` take `--judge SECONDS` and `--guidance TEXT`, and `retag` takes `none` for each; a value the broker would refuse is refused before anything is written. On AWS Secrets Manager every tag value the two commands write is also held to the store's own rule before the write: at most 256 characters, of Unicode letters, digits, spaces and `_ . : / = + - @`, so a guidance with a comma or an apostrophe is refused there, naming the character; Secret Manager's annotations take any value. `secret show` prints the key's `judge` and `guidance` tags and who decides a request for it (a person, whatever its judge tag, for an administrator's key or an Anthropic federation key), and for a source served only through its profiles names the judged profiles made from it; `GET /v1/settings` marks each such profile in `judge_keys` with its `source`.
    A profiles file whose `proxy` block sets `judge` or `guidance` is refused at boot and by `envoy-broker profiles check`, naming the tag to write instead; `profiles check --against` still reads an old file that sets them. A profile is served with its source's judge seconds in its fingerprint, where its proxy block held them, so tagging the source with the seconds the block held and taking the fields out ends no grant, and a later change of the tag ends that profile's grants, as an edit of its block did, refused as its entry or its source's judge tag having changed. Tag the keys with the seconds their blocks hold, then take the two fields out of the profiles file, before rolling this release out; a broker rolled back past it reads the judge from the profiles file again and ignores the tags.
