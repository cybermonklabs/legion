kind: Fixed
body: |-
  A listener whose start opens the jetstream handle of a KV bucket now sends that read again when
  the NATS server leaves it unanswered, up to three sends, instead of failing with `open the
  jetstream handle of KV bucket <name>: context deadline exceeded`. It holds for every start, the
  one that creates the bucket and the one that finds it already there, which is every restart of
  a deployment. Dispatch's webhook redelivery sweep opens its bucket the same way and sends that
  read again too. A bucket a member has not applied yet was already waited out; a request that
  drew no answer at all was not.

  A role or session read that reopens a bucket, and any other caller that waits on a budget of
  its own, sends that read once, as before.
