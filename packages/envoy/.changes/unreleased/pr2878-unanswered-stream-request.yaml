kind: Fixed
body: |-
  A listener or dispatch server whose start sends a stream read or a stream create that the NATS
  server leaves unanswered now sends it again, up to three sends, instead of ending the process.
  Two programs starting at once each reconcile `ENVOY_NOTIFICATIONS`, and the one that lost its
  answer used to die ten seconds after it bound its port, serving nothing.

  The three start-up steps of the listener between its listening line and `webhooks open` now
  name themselves in their fatal lines, so a log that held only `context deadline exceeded` says
  which of them timed out.
