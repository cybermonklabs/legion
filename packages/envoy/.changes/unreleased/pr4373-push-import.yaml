kind: Added
body: |-
    A push to the branch of a component source starts that source's architecture import at once: the delivery intake hands each push of a branch to the importer, which imports every enabled source on that repository (matched whatever its case) and branch (matched exactly).
    The delivery intake routes a push whether or not Dispatch has delivery settings saved.
    Pushes that arrive while an import runs, after that import's head lookup, start one more import after it, not one for each push; a push that arrives before the import's head lookup is covered by that import and starts none.
    The five-minute import stays as the repair where a push event never arrives.
    Each import a push starts logs `dispatch architecture: imported after a push` with the project, the repository, the branch, the commit and how many pushes it covered.
    A push the delivery intake hands over once the importer has begun to close, as it does while a shutdown waits for the intakes, imports nothing in that process and logs one WARN line with the repository and the branch, before any source is read, so a push to a repository no source is on logs it too: `dispatch architecture: a push reached the importer after it began to close; this process imports nothing for it, and a source on that repository and branch, if any, is imported again at its next five-minute pass`.
    Where the close begins after the sources were read, the push logs one WARN line for each source whose import it can no longer start, with the project, the repository and the branch: `dispatch architecture: a push reached the importer after it began to close; this process does not import the source for it, and the source is imported again at its next five-minute pass`.
    An import a push starts that fails while the process runs logs one WARN line with the error: `dispatch architecture: import after a push failed`.
    A source's pushes that no import covered before the process stopped are named in one WARN line with how many: `dispatch architecture: the process stopped before an import covered these pushes; the next process's five-minute import repairs them`.
