kind: Changed
body: |-
  Dispatch gives no access token the secrets broker issued the OAuth scope `approve`, whatever its project scope, with one exception: the approve-only token, which the broker mints for a person's approve grant, keeps on its own pod and spends only through Cipher's proxy, holds `person` and `approve` on Dispatch's approve routes and nowhere else (see the approve capability's entry of this release). Every other token that acts for its person, which a person's `agent-secrets login` sign-in and a person's machine login trade for, holds `person` alone, and every other broker token holds none. Each such token is made from a file on the machine that holds it, so a token traded from a copy of that file cannot approve in Dispatch. The sign-in itself is the approve grant's authority: a process that holds a person's sign-in on its machine can trade it for a 15-minute approve grant and approve through Cipher's proxy as that person, until the sign-in is revoked or expires. A copy of a machine login's file still reaches the broker's own operator routes, which can revoke the person's grants and end their machine logins.

  Every Dispatch route that needs `approve` refuses every broker token but the approve-only one before its handler runs: a document review, a decision's Keep, a credential approve, deny or machine lookup, the revoke of a credential grant, a machine login or a sign-in, and a personal token's mint, change or revoke (the approve-only token too is refused the mint and change of a personal token). A token that acts for its person gets `403 OAUTH_SCOPE_REQUIRED` naming `approve`, and it is refused the same way when it answers an approval request. It still answers an ordinary question and writes as its person. Make those calls from a browser signed in to Dispatch, with a personal token (`DISPATCH_TOKEN`) that holds `approve`, or, for a review from a session on a box where the person signed in, through Cipher's proxy.

  A decision's Keep (`POST /api/v1/artifacts/{id}/blocks/{block_id}/keep`) now needs `approve` as well as `person`: it records that the person agreed with the decision and takes it out of what waits on their review. The web app's Keep is unchanged; a personal token that holds `person` alone, and every broker token but the approve-only one, is refused it.
