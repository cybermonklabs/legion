kind: Changed
body: |-
  Dispatch gives no access token the secrets broker issued the OAuth scope `approve`, whatever its project scope. A token that acts for its person, which a person's `agent-secrets login` sign-in and a person's machine login trade for, holds `person` alone, and every other broker token holds none. Each such token is made from a file on the machine that holds it, so a copy of that file no longer settles in Dispatch what only the person settles. A copy of a machine login's file still reaches the broker's own operator routes, which can revoke the person's grants and end their machine logins.

  Every Dispatch route that needs `approve` refuses every broker token before its handler runs: a document review, a decision's Keep, a credential approve, deny or machine lookup, the revoke of a credential grant, a machine login or a sign-in, and a personal token's mint, change or revoke. A token that acts for its person gets `403 OAUTH_SCOPE_REQUIRED` naming `approve`, and it is refused the same way when it answers an approval request. It still answers an ordinary question and writes as its person. Make those calls from a browser signed in to Dispatch, or with a personal token (`DISPATCH_TOKEN`) that holds `approve`; `dispatch review` from a session works only with such a personal token.

  A decision's Keep (`POST /api/v1/artifacts/{id}/blocks/{block_id}/keep`) now needs `approve` as well as `person`: it records that the person agreed with the decision and takes it out of what waits on their review. The web app's Keep is unchanged; a personal token that holds `person` alone, and every broker token, is refused it.
