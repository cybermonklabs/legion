kind: Fixed
body: |-
  A write the listener was told had landed is no longer lost to a key-value bucket deleted and created again while the listener runs: no program of a deployment creates a bucket a listener copies (`envoy_interests`, `envoy_roles`, `envoy_sessions`, `envoy_known_sessions`, `envoy_ci_state`), and nothing configures one to. A start that finds one missing waits for it behind its starting gates, every route answering 503 and `/healthz` answering 503 `waiting` with `missing_buckets`, so a readiness probe, a container health check, the docker provider's wait and `docker compose up --wait` all read a listener that serves nothing as not ready (a read of any bucket that fails holds that turn and is made again on the next, so a read the hub did not answer in time never lets the start go with a bucket missing). A running listener answers 503 to each write that needs a missing bucket, and serves reads from its last copy for at most two minutes; `/healthz` answers 200 `degraded` with `missing_buckets`, naming only the buckets a read finds missing, even the moment a watcher ends because its bucket was deleted, while every other check passes, and 503 when one fails; the interest and role claim watchers are checked and rebuilt each on its own, so one missing bucket stops only the watcher that reads it; the self-health monitor neither rebuilds nor restarts over it; and the ERROR `listener KV bucket is missing`, logged every 30 seconds until a read confirms the bucket is back, pages the AWS listener's new `bucket-missing` alarm (`envoy_kv_buckets_missing` counts them). The one exception is `envoy_known_sessions`, which no delivery depends on: missing at the start or later, it holds no start and fails no request; `/healthz` answers 200 `degraded` naming it, the listener logs it once at WARN and never the ERROR, and the known-session store answers no 30-day record and writes none, so a registration is answered with its record not written; once a read finds the bucket there again, the self-health monitor has the store open it at once rather than at its retry's next attempt. `/healthz`, that line and the alarm name the repair: `envoy-infra buckets create`, with `--break-glass` until the auth service's cutover, by the runbook (`packages/envoy/infra/README.md#envoy-infra-buckets`). The new `envoy-infra buckets create|recreate|check` is the one command that creates them, with `--replicas` or `ENVOY_NATS_REPLICAS` copies, each 1 to 5 and refused with exit 2 outside it; it names a stray argument by its position and a flag value it cannot parse by its flag, never the text of either. `create` makes only a bucket that is absent, which holds no write to lose, so it takes no check of the writers and needs no listener stopped, and it changes no bucket that is there, so it can run again. The check of the writers that `recreate` and `check` take is best effort, and each of their runs says so: before either, stop every listener (and envoy-dispatch, for `envoy_ci_state`) and confirm it has ended on each host. Their `--this-machine` proves no writer runs on the machine the command runs on (in a container, one in the host's PID namespace). The single-node compose file creates the buckets before its listener starts, with a one-shot `buckets` service built from the checkout that runs `envoy-infra buckets create`, so a fresh volume serves. It reaches a hub on another machine and takes its replies under `_INBOX_envoy_buckets`; its NATS user is granted exactly the subjects it sends (`$JS.API.INFO`, `$JS.API.STREAM.INFO.ENVOY_NOTIFICATIONS`, and `$JS.API.STREAM.{INFO,CREATE,UPDATE,DELETE,RESTORE}.KV_<bucket>` and `$JS.SNAPSHOT.RESTORE.KV_<bucket>.*` for each copied bucket, the restore after `check` included) and subscribes `_INBOX_envoy_buckets.>` alone, a static user that the auth service's callout replaces at the cutover. Until that cutover no hub has that user's key, so `envoy-infra buckets create --break-glass --operator <name> --bucket <bucket>` runs the same create as a listener's NATS user (the in-cluster `gke` listener's seed, `envoy-nats-seed-gke`, read for that run and never written to disk), on the default `_INBOX.` prefix and with no listener stopped: it creates only buckets the server does not hold, leaves one that is there as `create` does, updates and deletes nothing, logs one line before each create naming the operator, the hub (without the URL's user or token) and the bucket, and is refused with `recreate` or `check`; the pull request that removes the listener users' create grant at the cutover deletes it. **Upgrade order, per hub:** older listeners created `envoy_known_sessions` the first time they opened it once their NATS user held that bucket's grant, which `envoy-infra` 10.33.0 is the first release to render, and a listener of this release never creates it and serves without it. So, first, every listener of the hub runs this release, read from the running images, so that no listener can create the bucket; then the users' render that carries the bucket's grant (`envoy-infra` 10.33.0 or later) is applied; then the bucket is created once, at the hub's copies (three on a clustered hub), and `nats stream info KV_envoy_known_sessions` reads every copy. Each listener's known-session store then opens it with no restart, within about six minutes: its retry backs off to five minutes, and the listener's check, every 30 seconds, wakes it once a read finds the bucket there. A hub whose buckets all exist sees no change at the upgrade, and a new deployment runs `envoy-infra buckets create` before or after its first listener starts. A test or dev rig provisions its own NATS server with `internal/bus/bustest` or the `fixturebuckets` command before it starts a listener.
