kind: Fixed
body: |-
  A write the listener was told had landed is no longer lost to a key-value bucket deleted and created again while the listener runs: no program of a deployment creates a bucket a listener copies (`envoy_interests`, `envoy_roles`, `envoy_sessions`, `envoy_known_sessions`, `envoy_ci_state`), and nothing configures one to. A start that finds one missing waits for it behind its starting gates, every route answering 503 (`envoy_known_sessions` included; a read of any bucket that fails holds that turn and is made again on the next, so a read the hub did not answer in time never lets the start go with a bucket missing; the one exception is a read the server refused, as it refuses a listener's user on a hub whose users predate `envoy_known_sessions`' grant, after which the start reads that bucket no more); a running listener answers 503 to each write that needs it, a registration whose 30-day record cannot be written included, and serves reads from its last copy for at most two minutes; `/healthz` answers 200 `degraded` with `missing_buckets`, naming only the buckets a read finds missing, while every other check passes, and 503 when one fails; the self-health monitor neither rebuilds nor restarts over it; and the ERROR `listener KV bucket is missing`, logged every 30 seconds until a read confirms the bucket is back, pages the AWS listener's new `bucket-missing` alarm (`envoy_kv_buckets_missing` counts them). `/healthz`, that line and the alarm name the repair: `envoy-infra buckets create`, with `--break-glass` until the auth service's cutover, by the runbook (`packages/envoy/infra/README.md#envoy-infra-buckets`). The new `envoy-infra buckets create|recreate|check` is the one command that creates them, with `--replicas` or `ENVOY_NATS_REPLICAS` copies, each 1 to 5 and refused with exit 2 outside it. Its check of the writers is best effort, and every normal run says so: before a normal `create`, `recreate` or `check`, stop every listener (and envoy-dispatch, for `envoy_ci_state`) and confirm it has ended on each host. It reaches a hub on another machine and takes its replies under `_INBOX_envoy_buckets`; its NATS user is granted exactly the subjects it sends (`$JS.API.INFO`, `$JS.API.STREAM.INFO.ENVOY_NOTIFICATIONS`, and `$JS.API.STREAM.{INFO,CREATE,UPDATE,DELETE,RESTORE}.KV_<bucket>` and `$JS.SNAPSHOT.RESTORE.KV_<bucket>.*` for each copied bucket, the restore after `check` included) and subscribes `_INBOX_envoy_buckets.>` alone, a static user that the auth service's callout replaces at the cutover. Until that cutover no hub has that user's key, so `envoy-infra buckets create --break-glass --operator <name> --bucket <bucket>` creates a missing bucket as a listener's NATS user (the in-cluster `gke` listener's seed, `envoy-nats-seed-gke`, read for that run and never written to disk), on the default `_INBOX.` prefix and with no writer proof and no listener stopped: it creates only buckets the server reports missing, creates none when any named bucket exists, updates and deletes nothing, logs one line naming the operator, the hub (without the URL's user or token) and the bucket, and is refused with `recreate` or `check`; the pull request that removes the listener users' create grant at the cutover deletes it. **Upgrade order, per hub:** older listeners created `envoy_known_sessions` when they first opened it, so a hub whose listener users were rendered before that bucket's grant may never have had it. A listener of this release waits at its starting gates, every route answering 503, only where its users now hold that grant and the bucket is missing; where they do not hold it yet, the listener starts, and its known-session store opens the bucket once both the grant and the bucket are there. So, first, release `envoy-infra` with `--break-glass`. Where the hub's listener users do not yet hold the known-session bucket's grant, give it to them first (render and apply the hub's users with that `envoy-infra`): the break-glass create runs as a listener's user, and without the grant the server refuses its read of the bucket, so it exits 1 having created nothing. Then read the hub's `KV_envoy_known_sessions` stream (`nats stream info KV_envoy_known_sessions`), and where the server does not hold it, create it with `envoy-infra buckets create --break-glass --operator <name> --bucket envoy_known_sessions --nats <hub>`, `ENVOY_NATS_REPLICAS` set to the hub's count; only then roll the listeners out. A hub whose buckets all exist sees no change at the upgrade, and a new deployment runs `envoy-infra buckets create` before its first listener starts. A test or dev rig provisions its own NATS server with `internal/bus/bustest` or the `fixturebuckets` command before it starts a listener.
