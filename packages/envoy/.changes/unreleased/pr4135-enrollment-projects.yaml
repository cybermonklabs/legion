kind: Added
body: |-
  A session's enrollment names its Dispatch projects: `POST /v1/enrollments` takes `projects`, at
  most 16 project keys, and `GET /v1/enrollments/self` answers them (an empty list for none). The
  broker takes a list only from a session or a person's pod acting for a person, and only when
  Dispatch says that person may see every project on it, checked before the enrollment's
  transaction begins. It refuses a list that is no list `400 PROJECTS_INVALID`, a service's pod
  or a machine's own session naming projects `400 PROJECTS_NEED_A_PERSON`, a project its person cannot see or one Dispatch does not
  hold `403 PROJECT_NOT_VISIBLE` (one answer for both), a restricted member's session naming none
  `403 PROJECTS_REQUIRED`, and a list it could not check with Dispatch, because it has no
  `BROKER_PROJECT_ACCESS_URL` or Dispatch did not answer, `503 PROJECTS_UNCHECKED`. A session
  naming no project enrolls as before while Dispatch cannot be reached, with a line saying it
  enrolled unchecked; while Dispatch refuses the broker's own account, no session enrolls through
  it, `503 PROJECTS_UNCHECKED` saying so. The list is fixed for the
  enrollment's life and is never carried to a successor that adopts its grants. Migration 0040
  (`0040_enrollment_projects`) adds `enrollments.projects`, empty on every existing row.
