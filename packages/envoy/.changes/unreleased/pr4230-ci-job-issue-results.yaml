kind: Added
body: |-
  `POST /api/v1/issues/{key}/results` takes a CI job's result of the check whose `ci_check` names the job's check run, under the job's results token: the body is `{check, commit, verdict, observed}` alone, and the commit must be the run's, the run a push of a branch, the check run GitHub's at that commit, the run's repository the issue's, and the branch it pushed one of the issue's (`403 BRANCH_NOT_THE_ISSUES` otherwise): the head branch of one of its pull requests, or a branch whose name gives it to the issue as Dispatch attributes a pull request by its branch. The result is stored with role `ci`, the run's session as its actor and no person, `branch`, `observed` kept as the project's results route keeps it (2,000 characters), and `attestation`, the in-toto statement of its run, built by the builder of the project's results route. A role's result for such a check stays `409 CHECK_PROVED_BY_CI`.
  A CI job's result is a row of the new table `ci_check_results` (migration `20261116213930`), and `check_results` holds what a role recorded, as before: a release before this one reads no row of the new table, so a job's result changes no check block under it, during a rolling deploy or after a rollback. A CI job's result is retracted as any result is: `POST /api/v1/results/{id}/retract` takes its id from the session that recorded it, the session holding the Dispatch claim of the issue it was recorded on, or a person, with a reason, and the retraction is a row of `ci_check_result_retractions`, which the same migration creates, and which the results read carries as `retracted` on the job's result, so no pass of it stands.
  Whether CI proves a check is read from its block at each read, and a role's result of a check CI proves carries `not_counted` and counts for nothing. A document write is held to the fourth `ci_check` rule as before, that no result a role recorded stands against the check, and so is settlement's repair of a browser's write: the release before holds a write to the same rule, so both builds keep or delete one block's `ci_check` alike while they serve one database. A writer who wants CI to prove a check that holds a role's result writes a new check block under a new id; a retraction does not lift the rule.
  A `before_merge` check's pass must stand at each of its subjects: the head of each open pull request of its issue, or where none is open, the newest merged pull request's final head and the head of each branch of the issue that a CI job's result names, so the job's pass stands at that head with no pull request, and a fail at one head is never hidden by a pass at another. A merged pull request's head stays in `compared_with` beside an open one, and is no subject. `pass_stands` gains `subjects`, the state of each, and `reason`. Each subject names `roles`, each role whose pass counts at that head, and `results`, the ids of the results that decide its state, and the check's own `roles` name a role only where each subject names it: two roles that passed at two heads are no role that passed at each. A pass and a fail that count at one commit of a `before_merge` check make that commit's state unknown (`pass_and_fail`), from any role and in either order, with `results` naming the newest pass and the newest fail, and so does a read of that commit with `?at=`: before, a role's fail recorded after its pass left the pass standing. A later pass at that commit does not end the state; a retraction of the wrong result ends it, and so does a change of the check's words. On a check CI proves, the results its CI job recorded and the result derived from its check run count alike. The check's own `reason` is `pass_and_fail` where its answer is unknown and any subject holds a pass and a fail, whatever the order Dispatch learned the heads in, and a no carries no reason.
  An `after_merge` or `default_branch` check takes its newest result that counts at one of its branches, or that Dispatch could not place on one, and `pass_stands.results` names that result: a pass stands only where it is a pass, with the roles of each pass newer than the newest fail; a fail reads no; and a result Dispatch could not place reads unknown. Before, any pass that counted at a branch stood however many fails came after it. A deploy after the newest result changes no state.
  A check CI proves is read at the head of each open pull request of its issue, or where none is open at the newest merged one's final head, and each head in the repository of that pull request's own row: before, only the open pull request of the highest number was read, in the issue's repository. Two repositories that hold one commit are two heads, each read in its own repository and each deriving a result of its own there, so a fail of one counts beside a pass of the other. At most 8 heads are read at one time, under one deadline for them all. Each subject of such a check carries `ci`, the read at its head in its own repository, and reads unknown with the new reason `read_failed` where that read did not end; the check's own `ci` stays the read of the open pull request of the highest number. Each `ci` names the head it is of in `commit` and `repo`, and in `result` the id of the result it derived where the run passed or failed; it carries no `result` where it derived none, and no `commit` or `repo` where Dispatch holds no head (`no_head`).
  Each new fact is in a field of its own, so a `dispatch` released before it reads every field it knows as it means it: the branch heads are in `branch_heads`, a result at one names it in `at_branch_head`, and a check CI proves holds its derived results alone in `results` and every recorded result in `recorded_results`. A pull request basis of a merged pull request carries `merged`, so a reader counts the merged heads apart from the open ones.
  The Verification tab shows `It counts for nothing: <reason>` in a result that carries `not_counted`. Under a `before_merge` check's answer it shows one row for each head a pass must stand at, with the pull request, its whole head, its state and its roles in the words `dispatch results` prints for that head, and one line that counts the merged pull requests, which decide nothing while one is open; the pill keeps the answer of the whole check.
  Both results routes read every fact of a check, its attributes, words, version and digest, from the block as the block index holds it, so a browser's edit that has not settled changes nothing for a write or a read until it settles, the 2 s settle delay after the last keystroke in the document, and a check the index does not hold yet is no check of either: the write refuses it `400 UNKNOWN_CHECK`, as before, and the read no longer lists it. So a `ci_check` that a person adds or removes in the browser takes effect when the edit settles: until then a role's result of a check given `ci_check` is recorded, and the settlement then takes that `ci_check` off, and one of a check whose `ci_check` was removed is refused `409 CHECK_PROVED_BY_CI`. A CI job's result counts only for the job the check's `ci_check` names: one another job's run recorded carries `not_counted`.
  A pull request that an issue links by its URL is that issue's pull request in any repository, unless its head is in a fork. Before, the link held only where the issue resolved to the pull request's own repository, as each other source of an attribution still must. `delivery.AttributionRuleVersion` rises for it (to 4, below), so the reconcile judges each merged row of an older rule once more. `POST /api/v1/issues/{key}/results` takes a result at a commit of the repository of an open or merged pull request of the check's issue: a commit at the head of such a pull request with no read of GitHub, and any other commit that one of those repositories holds, asked after the issue's own repository. It refuses `400 RESULT_COMMIT_UNKNOWN` only when each of them answers that it holds no such commit, and the refusal names each. A pull request basis of another repository than the issue's carries `repo`, and the Verification tab names that repository beside the number, `<owner>/<repo>#<number>`. An `after_merge` check is compared with the branch that a merged pull request of the issue's own repository merged into (`delivery.BaseBranchMergedFor` now takes that repository): the branch a merged pull request of another repository merged into is a branch of that repository, compared only with a result whose commit that repository holds, and the issue's own repository is never asked about a branch of that name. A pull request the issue's links name in another repository is a head of the issue only as the attribution gives it, so one whose head is in a fork is no head, linked or not.
  A change of an issue's links (`PATCH /api/v1/issues/{key}` with `external_links`) judges again, in its own transaction and with no read of GitHub, each pull request whose own URL it added or removed and each whose body cites a GitHub issue it added or removed, in the issue's own repository and in any other, from the inputs each writer now stores on the pull request's row (migration `20261120144431`: `pull_request_heads.attribution_title_keys`, `attribution_cited_issues`, `attribution_branch_keys`, `attribution_commit_keys`, `head_in_repo`). A link added makes the issue every such pull request's where nothing ranked above holds it, and a link removed takes from the issue only the pull requests no remaining link, citation, branch, title or commit message holds to it; a head in a fork is no issue's, linked or not. Each move is on the timelines of the issue the pull request left and of the issue it reached (`issue.pull_request_attribution_changed`) when the PATCH commits. A row stored before the inputs, or whose commit messages no read reached and which nothing else holds now, gets `attribution_rule` `0`, so the reconcile reads it again. `delivery.AttributionRuleVersion` is 4, so the reconcile reads each merged row once more to store its inputs. Before, the issue a link gave stayed with the pull request after the link was removed, until a read of the pull request (within five minutes for an open one, and for a merged one not until the attribution rule changed), and a GitHub issue newly linked gave the issue no merged pull request whose body cites it until the rule changed.
  The new test-only setting `DISPATCH_TEST_HIDE_STATE_FILE`, an absolute path refused without `DISPATCH_TEST_HOOKS=1`, makes the results read leave out each check's `pass_stands` and `ci` and each result's `currency` while a file is at that path, and keeps every other field, so an end-to-end run can show an agent the results alone. `packages/dispatch/e2e/run-server.sh` passes it through when it is set.
