kind: Fixed
body: |-
  The GitHub App client's errors no longer print a credential that `DISPATCH_GITHUB_API_BASE`
  carries in its user information or its query. Every status error, every error of a request that
  got no answer, whose answer could not be read or ran past its limit, the failure a leased pass
  notes (and GET /healthz serves), the deliveries listing's and a redelivery's errors, and the
  repository reads' errors named the request by the URL it asked, which is that base joined with
  the call's route: `GET http://user:password@host/api/repos/acme/web/commits/main?access_token=...`.
  They now name it by the API origin as the URL rule names a URL a request asked (its scheme, host
  and path) with the route Dispatch built after it, its own query included:
  `GET http://host/api/repos/acme/web/commits/main`. A next page of the deliveries listing is
  named by GitHub's link without its query, and a next page link to another origin is refused
  naming the origin the same way. For a base with no user information, query or escaped path the
  texts are unchanged.
time: 2026-11-25T22:20:02Z
custom:
    Issue: githubapp-call-names-no-base-credential
