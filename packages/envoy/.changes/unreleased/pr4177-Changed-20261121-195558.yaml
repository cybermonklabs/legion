kind: Changed
body: |-
    `POST /api/v1/comments/{id}/deliveries` reads a comment's mentions as the caller reads them in the comment: a mention of a session, or of a role of a private project, the caller does not see, or one that reached a session the caller does not see, is a target the comment does not mention, and only the mentions the caller reads count for the one-mention default and the "target is required" refusal. `POST /api/v1/messages/{id}/deliveries` answers a message whose target the caller does not see as a message with no target, 404 MESSAGE_NOT_FOUND, and leaves a pending attempt pinned to a session the caller does not see as it stands, opening an attempt of its own. `POST /api/v1/comments/{id}/reply` answers a mention whose target the caller does not see (a session, or a role of a private project) as a target the comment does not mention, 400 MENTION_INPUT, judging a mention by its target and not by the session it resolved to when the comment was written, so a role's holder now answers the attempt a Retry sent it; `POST /api/v1/messages/{id}/reply` answers a message whose target the caller does not see as a message with no target, 404 MESSAGE_NOT_FOUND "message delivery not found". Both reply routes answer an attempt pinned to a session the caller does not see as an attempt no row holds, 404 ("comment delivery not found", "message delivery not found"), naming nothing of that session, whoever replies. The delivery sweep sends a message's stranded attempt while no later attempt stands in its place, as it sends a mention's: a later attempt that failed no longer takes the send over, unless it failed in another mode with a cause that says it may have landed. With no private project an open viewer is answered as before.
