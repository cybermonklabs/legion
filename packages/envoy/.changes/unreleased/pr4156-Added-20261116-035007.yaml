kind: Added
body: 'Each Dispatch project now has one owner, an access list of people and groups, and a public or private setting, and each person is a full member or a restricted member (`internal/dispatch/access`, migration `20261116015736_project_access`). A person sees a project they own, that lists them, that lists a group they are a full member of, or that is public while they are a full member; a restricted member is admitted only by being named directly, never through a group, and cannot create a project (403 RESTRICTED_MEMBER). An owner is always a full member who has signed in: a credential that acts for no person, or for a person nobody has signed in as, makes the project its `default_assignee`''s, so naming a restricted member there is 400 OWNER_NOT_ALLOWED. Any person reads a project''s access at `GET /api/v1/projects/{key}/access`; the owner alone changes it, at `PATCH` there and `PUT`/`DELETE /api/v1/projects/{key}/access/people/{email}` and `.../groups/{name}`, names the Slack channel ids the project''s credentials may post to (`slack_channels`, at most 16, migration `20261116035709_projects_slack_channels`), and gives the project to another full member at any time; anyone else''s write is 403 PROJECT_OWNER_REQUIRED. An email holding a capital letter beyond A-Z names nobody who could sign in, so an access list or a group refuses it as 400 PROJECT_ACCESS_INPUT. Groups live at `GET /api/v1/access-groups` and `PUT`/`DELETE /api/v1/access-groups/{name}`: the person who makes one owns it, only that owner writes or deletes it, a restricted member makes none (403 RESTRICTED_MEMBER) and is refused as a member (400 GROUP_MEMBER_RESTRICTED), and deleting a group takes it off every access list that named it. The five access-list writes and the two group writes need the `approve` scope beside `person`, so a credential that holds `person` alone, a broker token among them, reads the lists and groups and changes none of them (403 OAUTH_SCOPE_REQUIRED). A list and a group answer `not_signed_in`, the people they name whom nobody has signed in as yet, and the dashboard shows each as not signed in yet. Every project the migration can give an owner gets its default assignee; a project whose default never signed in is named at boot, and `DISPATCH_PROJECT_OWNER_FALLBACK` or `envoy-dispatch project-owner <KEY> <email>` repairs it. Nothing can make a project private yet (409 PRIVATE_PROJECTS_OFF) and no read is limited yet, so every caller reads what it read before: each new field is absent at its default, and a full member''s `/api/v1/whoami` and `/auth/whoami` are unchanged; a member kind that cannot be read answers 503 IDENTITY_UNAVAILABLE.'
