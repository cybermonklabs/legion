kind: Changed
body: |-
  A secret's classifier is `type`: `secret create --type`, `secret retag --type`, the store tag,
  show/list output, the reread response and mint metrics use the same name. The old classifier
  flag is an unknown flag whose error points to `--type`, not an alias. For one release the
  policy reader accepts the old store tag only when `type` is absent, and logs once per secret
  per broker process when it does. An empty `type` also takes precedence. Removing a type
  removes both classifier tags, so the compatibility reader cannot bring it back.
custom:
  Issue: pr4144
