kind: Changed
body: |-
  A secret's classifier is `type`: `secret create --type`, `secret retag --type`, the store tag,
  show/list output, the reread response and mint metrics use the same name. The old classifier
  flag is an unknown flag whose error points to `--type`, not an alias. For one release the
  policy reader accepts the old store tag only when `type` is absent, and logs
  `agent secret uses legacy classifier tag; retag it with --type` at WARN once per secret per
  broker process when it does. An empty `type` also takes precedence. Removing a type removes both
  classifier tags, so the compatibility reader cannot bring it back.

  Two refusal reasons are renamed: `kind-unknown` is `type-unknown`, and `scopes-kind` is
  `scopes-type`, in the `agent secret policy refused` line, the `broker_unservable_secrets`
  `reason` label and the reread's `reason`; an alert or a dashboard that matches the old reason
  must match the new one. The rollback guard `agent-secrets` writes beside a type is now
  `mint-service-account: type-secret`, where it was `kind-secret`; the broker reads neither, and
  an AWS policy that conditions `aws:RequestTag/mint-service-account` on the old value must allow
  the new one.

  The broker's `GET /v1/settings` answers `secret_type_tag: true`. `agent-secrets` writes a type
  only through a broker that answers it: against an earlier broker, which reads no `type` tag,
  `secret create --type`, `secret set` on a type secret and a `secret retag` that leaves a type
  exit 1 before they write anything, naming this release. `secret create` and `secret set` now
  exit 1, as `secret retag` does, when the broker's reread names another type than the secret
  holds.

  The CLI and the broker ship together: move the broker's pin first, then use this release's
  `agent-secrets`. An earlier `agent-secrets` reads the reread's old `kind` field, which this
  broker does not answer, so its every `secret retag` that leaves a kind exits 1 saying the broker
  still sees the old tags, and its `--kind none` removes only `kind`, leaving a `type` tag in
  force. An AWS policy that limits `aws:TagKeys` must list `type`, or every `--type` create and
  retag is refused, and keep `kind`, which `--type none` untags.

  Once any secret carries `type`, this release is a rollback floor. Every broker from
  legion-envoy-v16.0.0 to the release before this one reads only `kind`, ignores the
  `mint-service-account` guard, and serves such a secret's App key or refresh token to every grant
  as its value. Only the brokers from legion-envoy-v13.19.0 to the release before v16.0.0 read
  that guard, and refuse such a secret as `mint-target-malformed`.
