kind: Added
body: |-
  The listener hands a message for a stopped Legion agent to the agent's daemon instead of
  refusing it (INFRA-204). A send to a session with no live registration, a role publish with no
  live holder whose role is finished, and an agent-subject message on the bus that no session
  takes are published to
  `notifications.legion.<legion_project>.agents.<session>` as
  `{original_topic, target_session, role_token, project, envelope}` when the Legion agent
  registry names the session (for a role, the role token's newest session), the project's
  answering record last said it answers, the session registry reports that session gone, the
  source is not `envoy`, and the body does not carry `"handoff": false`. The caller gets the 200
  a delivered message gets, with `recipient` set to the session; the hand-off's JetStream MsgId
  comes from the envelope's dedupe key, so the copies two listeners hand off for one bus message
  are stored once, and a bus message is acknowledged only once its hand-off is stored. Otherwise
  every path answers exactly as before. The answering record is the project's last stated flag
  and never expires: a project whose daemon stated `answering: true` has its agents' messages
  handed off whether that daemon runs now or not, and the daemon answers them when it returns; a
  project that stated `answering: false`, or stated nothing, keeps today's 404 or failed
  delivery. The daemon writes the record through the new
  `PUT /v1/legion/projects/{legion_project}` `{answering, updated_at}`, stored as
  `project.<legion_project>` in the `legion_agents` bucket.

  A role is handed off only while the registry's newest entry for its token says `finished`:
  its issue has left the workflow - closed or done, parked, or its tree retired or lingering
  after a close - so no next holder of that role is coming. A role whose issue still runs keeps
  the 202 it had before (`kept: true`, `kept_reason: unclaimed`, INFRA-514): the gap between two
  phase workers of one issue and a pod being replaced both leave a role unclaimed for a while,
  and the message is the next worker's. The new entry field `finished` is a boolean the registry
  stores and the entry routes take, absent and false for every writer that does not state it;
  the Legion daemon sets it from the issue's state it records and writes the entry again
  whenever that state changes, in either direction. A send addressed to a session id is
  unchanged: that session has stopped, and the message is for it, not for a role.
