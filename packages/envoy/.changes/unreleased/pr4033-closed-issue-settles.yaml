kind: Fixed
body: |-
  A Dispatch document of a closed issue now gets its owed settlement, so its saved version, its
  search rows and its block index catch up with the live text. On a closed issue the settlement
  changes no ask and wakes nobody. When an ask block has no ask row, the settlement saves the
  block with `state="resolved"` and records the block's author. It records no edit notice and
  carries no approval. The reopen marks owed each document whose ask blocks wait for it. At the
  reopen, an open approval request moves to the latest version a closed issue's settlement wrote,
  and a standing approval is carried to that version by the rules that carry it to any new
  version. The settlement resumption arms at most 50 documents a pass, those no pass has tried
  first, and migration `20261114100038` adds `doc_settlements_pending.tried_at` for that order. An
  approval request that waits on the person keeps its turn, quietly, when a settlement writes a new
  version of its document that stores byte for byte the text the request names. A version that a
  route writes, such as a named version or an upload, still moves the request to its agent. The
  settlement after a reopen names the editor whose edit the closed issue's settlement saved on the
  ask events of that edit, as the settlement after a reopen did before, and migration
  `20261115091510` adds `doc_closed_edit_sources` to keep that editor past the closed issue's
  settlement. That editor is credited with their own text only: a later version that adds none of
  it, such as one of the reopen's ask-state write, an ask repair's sweep or a rebuild, is in the
  name of the settlement, while a move of an approval request over the closed issue's versions is
  still in theirs. An approval given after a reopen, before its settlement, is carried to the
  version that settlement writes when that version differs from the approved one only in the
  questions the close withdrew and the reopen opened again. A settlement whose room a close retired
  before the settlement held it, or before it caught the room up, is now logged rather than ending
  without a word, and is armed again when no close since its arming moved the room's generation.
