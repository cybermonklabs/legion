kind: Added
body: |-
  A result grant records the results entry it was granted under (`result_grants.entry_digest`): the SHA-256 of the fingerprint of the profile `DISPATCH_RESULTS_TOKEN` and of the scheme and host of `BROKER_AIRLOCK_PRIVATE_UPSTREAM`, which each broker computes once at start. A broker pod serves a result grant only when the grant's entry is its own: it answers a grant made under another results profile or another private destination `407 GRANT_NOT_LIVE`, with `Airlock-Forwarded: false`, before it mints any token, and leaves the grant in place, so the pods whose entry is the grant's still serve it. During a roll that changes the profile or the destination, pods of the old entry and of the new refuse each other's grants until those grants end, fifteen minutes at most, and a run's next attempt is granted under the entry of the pod it asks. A broker with no results profile serves no result grant.
