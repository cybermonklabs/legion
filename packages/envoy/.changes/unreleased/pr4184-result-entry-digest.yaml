kind: Added
body: |-
  A result grant records the results entry it was granted under (`result_grants.entry_digest`, `config.MintedEntryDigest`): the SHA-256 of the fingerprint of the profile `DISPATCH_RESULTS_TOKEN` and of the scheme, host name and port of the private destination `BROKER_PROXY_PRIVATE_UPSTREAM` names for that profile's host, which each broker computes once at start. The entry binds the destination's text, not the address its name resolves to: each pod resolves that name itself. A broker pod serves a result grant only when the grant's entry is its own: it answers a grant made under another results profile or another private destination `407 GRANT_NOT_LIVE`, with `Cipher-Proxy-Forwarded: false`, before it mints any token, in words that say this broker refuses the grant and that it stays live for a broker of its own, not that it expired, and leaves the grant in place, so the pods whose entry is the grant's still serve it. During a roll that changes the profile or the destination, pods of the old entry and of the new refuse each other's grants until those grants end, fifteen minutes at most, and a run's next attempt is granted under the entry of the pod it asks. A broker with no results profile serves no result grant.
