kind: Added
body: 'A switch of a Dispatch project to private (`PATCH /api/v1/projects/{key}/access`) now ends, last before its commit, with a private-hub admission proof that writes nothing: every hub `DISPATCH_PRIVATE_HUBS` names must admit Dispatch through its auth callout, presenting the token `DISPATCH_HUB_ADMISSION_TOKEN_FILE` holds, or the switch is 409 PRIVATE_PROJECTS_UNAVAILABLE with nothing changed. This release runs no proof yet, so every switch to private that passes the other checks is still that 409, and Dispatch logs a WARN naming the hubs when `DISPATCH_PRIVATE_HUBS` is set. A non-empty `DISPATCH_PRIVATE_HUBS` without `DISPATCH_HUB_ADMISSION_TOKEN_FILE` refuses the start, and `envoy-infra:gcp:Dispatch` gains `privateHubs`, which renders `DISPATCH_PRIVATE_HUBS` in the order given and is an input error at `pulumi preview` while the render sets no `DISPATCH_HUB_ADMISSION_TOKEN_FILE`. A switch to private is also 409 SLACK_CHANNEL_SHARED while another private project lists one of its Slack channels, and starts the channels'' time (`slack_channels_changed_at`) when it names any. Each switch to private that commits records the project''s full switch (`projects.full_switch_at`, migration `20261120235508_projects_full_switch_at`): a project private before its full switch runs the whole path at its owner''s next switch to private, a switch to private of a project the full switch made private changes nothing, and a switch to public clears the record. Every PATCH of a project''s access that sets the visibility or the Slack channels waits for each of its locks at most 60 s, the owner lock first and then the Slack channel lock, and answers 409 LOCK_TIMEOUT naming `owner-row` or `slack-channel` when one is not taken in time; before, such a wait had no bound of its own.'
