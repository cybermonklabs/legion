kind: Changed
body: |-
  The Delivery timeline reads each deploy run's production jobs by name and its failed jobs
  through the new partial index `delivery_run_jobs_failed`, rather than every job of every run. The
  lease pool holds two more connections, one for the per-issue Legion facts and one for the day-row
  refresher, whose first pass in a process also seeds every project's evals
  (`store.LeasePoolSize` 29, with the keyword fill's two, the CI verify loop's one, the boot's
  parent status fix's one and the reference forms drain's one), so a process opens 120
  connections at most, and `infra/gcp`'s `dispatchConnectionsPerPod` is 120.
