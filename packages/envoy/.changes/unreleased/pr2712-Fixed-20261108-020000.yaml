kind: Fixed
body: |-
  The display read draws a block of HTML as the browser's read-only engine draws it: one paragraph holding the block's characters as the Proof schema's inline `html` node, with the up-to-three spaces the block may open with dropped (`pmdoc`'s `displayHTML`). It drew the block as literal text with a hard break per line, so a comment of `<div>` was shown with a text node where the browser shows a tag, and a reader of the stored tree and a reader of the markdown were shown two different bodies.
