kind: Fixed
body: '`agent-secrets` gives each command of a reused grant the trust its own settings name. Before, a later command of a grant found the first command''s directory and got that command''s bundle, so a private authority that its own `CURL_CA_BUNDLE` or other trust file named, and the first command''s did not, was left out with no message, and a direct call to that authority''s host failed verification. The grant''s directory under the airlock root is now named for the grant and a keyed hash of the bundle and wgetrc it holds (`<grant id>.<16 hex digits>`): commands with the same trust share one directory, and a command with other trust gets its own. The key is 32 random bytes in `dir-name.key` in the same root, which only its user can read, so a directory name that a log or an error shows lets nobody test a guess of a password the inherited wgetrc holds. A grant keeps one directory per trust its commands named until it ends. A `dir-name.key` that is not a 32-byte regular file that only its user owns and can read is refused with its path, and so is a root on a file system that takes no hard link, which the key is put in place with; the refusal names that reason and says to point `XDG_RUNTIME_DIR` or `TMPDIR` at another file system.'
