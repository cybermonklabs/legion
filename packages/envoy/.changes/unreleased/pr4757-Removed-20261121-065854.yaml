kind: Removed
body: 'No listener takes a shared token, and `/v1` serves a request that presents no credential only on loopback. A non-empty `ENVOY_API_TOKEN`, `ENVOY_API_ALLOW_UNAUTHENTICATED` or `ENVOY_V1_OPEN_WITH_TOKEN_CHECKS` refuses the listener''s start, naming what replaces it. A listener bound off loopback starts only with a credential it verifies (the `ENVOY_OIDC_ISSUER`/`ENVOY_OIDC_AUDIENCE` pair, the Google pair or the broker settings) and answers a request that presents none `401`; its broker settings count as that credential. The route label of `envoy_listener_requests_total` holds only a registered route pattern. Dispatch refuses a non-empty `ENVOY_TOKEN` at start, naming `ENVOY_ACCOUNT_TOKEN_FILE` and `ENVOY_ACCOUNT_GOOGLE_AUDIENCE`, and no listener call falls back to a shared bearer. `gcp:ClusteredNatsHub` renders its session listener''s broker settings in both modes, refuses listener args without `agentSecretsUrl`, and renders no `ENVOY_API_ALLOW_UNAUTHENTICATED`, `ENVOY_V1_OPEN_WITH_TOKEN_CHECKS` or `ENVOY_ALLOWED_HOSTS`; `allowedHosts` is refused by name. `gcp:Dispatch` renders no shared token. `gcp:NatsHub` refuses its own listener, since a forwarded loopback bind needs a bearer kind it does not take. `aws:WebhookListener` refuses every configuration, and `apiTokenSecretArn` and `apiTokenSecretVersionId` are gone. The load test presents its callers'' own platform tokens (`-listener-token-file` replaces `-listener-token`). The compose listeners take broker settings and no shared token.'
