kind: Added
body: |-
    The broker's airlock proxy carries HTTP/2 on a bound host, so a gRPC client works under an airlock grant: `agent-secrets secret …` under a lent `GCLOUD_SAMI` token and Pulumi's `gcpkms` secrets manager each failed before with `tls: no application protocol`.
    The proxy offers `http/1.1` and then `h2`, so a client that offers both stays on HTTP/1.1; each HTTP/2 stream is decided and swapped on its own, its `:authority` checked against the CONNECT target, and one connection carries at most 100 streams at once.
    A `CONNECT` or an `Upgrade: h2c` inside a decrypted connection is refused 403 `PROTOCOL_SWITCH_REFUSED`.
    Every call the proxy carries - a gRPC stream, a server-sent event stream, a long poll - is ended within 15 s once its grant stops carrying it, as a WebSocket was, and logs `airlock proxy: a carried call its grant no longer carries`; a call whose service has not answered yet is refused as every later call of that grant is, rather than answered 502.
    `agent-secrets` sets `GRPC_DEFAULT_SSL_ROOTS_FILE_PATH` to its trust bundle, for gRPC clients built on gRPC's C core.
