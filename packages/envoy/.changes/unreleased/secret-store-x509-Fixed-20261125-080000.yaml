kind: Fixed
body: |-
  The secret forms (`agent-secrets secret …`) on the `gcp-secret-manager` store sign in with an
  `external_account` credentials file of an X.509 certificate, which `GOOGLE_APPLICATION_CREDENTIALS`
  or the well-known credentials file names. Such a file is now loaded with Google's Go library
  `cloud.google.com/go/auth`, which reads every `credential_source`; `golang.org/x/oauth2`, which
  loaded it before, has no X.509 source, so the first call failed at the token. The file's exchange
  and its impersonation URL mint the account's access token as before, and the `using` line names
  that account. A trust chain, certificate configuration, certificate or private key that cannot
  be read or does not parse, or a configuration that names no workload certificate and key as
  Google's library reads it (an enterprise certificate proxy's), is refused in the machine source's
  words before the library would start a signer. So is a credentials file of any type that repeats a
  key (two keys Go's JSON decoder reads as one, at any depth), which `gcloud` writes none of. The
  library logs nothing, whatever `GOOGLE_SDK_GO_LOGGING_LEVEL` says. Other credential types load as
  before.
time: 2026-11-25T08:00:00Z
custom:
    Issue: secret-store-x509
