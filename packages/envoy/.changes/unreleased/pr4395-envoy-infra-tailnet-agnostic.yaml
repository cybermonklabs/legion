kind: Added
body: |-
  `gcp:Dispatch` takes `publicOrigin`, the https origin it is served at with the tailnet inputs unset, behind an entrance the deployment builds itself, and `iapAudience`, the IAP door, which renders `DISPATCH_IDENTITY=iap`, `DISPATCH_IAP_AUDIENCE` and `DISPATCH_SIGNIN_DOMAIN` and needs `publicOrigin` and `signInDomain`. Beside `publicOrigin` it takes `loadBalancerSourceRanges`, CIDRs it admits on port 8766 as `ipBlock` peers in the app's own NetworkPolicy, and `networkEndpointGroupName`, which annotates the app's Service with `cloud.google.com/neg` so GKE makes a standalone network endpoint group of that name for port 8766; each is refused without `publicOrigin`.
  `gcp:ClusteredNatsHub` takes its session listener as an input of its own, `listener`, beside the tailnet entry or without one, and the listener takes `clientNamespaces`, whose pods reach it at its cluster Service. A listener declared as `listener`, or given `clientNamespaces`, requires every caller's projected ServiceAccount token: it takes `oidcIssuer`, `oidcAudience` and `oidcAccounts`, renders `ENVOY_OIDC_ISSUER`, `ENVOY_OIDC_AUDIENCE` and `ENVOY_OIDC_ACCOUNTS` and never `ENVOY_API_ALLOW_UNAUTHENTICATED`, and is refused without them; a `tailnet.listener` with no `clientNamespaces` serves the tailnet hosts with no credential, as before. With none of the new inputs set, both components render what they rendered before.
