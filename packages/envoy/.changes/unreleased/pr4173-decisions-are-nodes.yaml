kind: Changed
body: |-
    A decision is a node of the issue's own spec. An agent records a decision as a `decision` block in the spec's `## Decisions` part, with `shaped`, `from_ask`, `uncertainty` and `replaced`; its reading of a person's answered ask is a `reading` block inside that ask. The block schema is version 6, and a document written at it is unreadable to the release before, so a rollback is safe only until the first such write.
    A person's answer is held once, on the ask's node, and no document holds its words or selection. A person's answer, resolve, decline, close or reopen of an ask writes one version. When the answer, resolve, decline, close or reopen is that version's whole change, the version changes only the server-owned attributes of the ask's block: `state`, and `answered_by` and `answered_at` where the ask is answered; an open ask's block holds no `state`. An approval carries across the version an answer, a resolve or a decline writes, and the approval request stays with whoever held its turn; a close's version carries no approval, and the reopen's carries it. The version carries an approval only when the person's answer, resolve or decline is its whole change. If text that a person was editing in the browser is settled into the same version, the approval does not carry, and the request goes back to its agent. While a process of the release before still serves, settlement keeps the answer in step in the block for that release's pages, within what one upload may hold.
    `GET /api/v1/issues/{key}/decisions` answers `entries`, one per question ask and per decision node, read from the store, each with the display trees of its text and its answer under `Dispatch-Trees: 1`, and each decision's `decided_by`, whose session carries the newest title it stamped; its `decisions` and `document` members answer from the store for one release. Its `open_questions` lists an open ask only while the spec still holds its block: an ask whose row names the spec and a block the spec no longer holds is left out, where the release before listed it.
    Keep acts on an agent's `decision` block of any document of the issue, as two appends on its node.
    `GET /api/v1/artifacts/{id}/text` and the other text routes serve markdown that holds none of the eight server-owned ask attributes, so a read uploads back unchanged, and answer each ask of the document in `asks`, read from its node; a stored version keeps, for one release and for the readers of the release before, the `state` of an ask that is not open, its answerer and time, and a copy's `copied_from` and `copied_from_document`. The edit route's `insert` op takes a third anchor, `into: "block:<id>"`, and writes its markdown inside that block, after its last child; a server of the release before refuses it.
    An approval carries across a version whose only change is readings, the removal of the server-owned ask attributes, or the decisions step's own restore and conversion.
    An agent's write that drops or retypes a person's answered ask block is refused 409 `ANSWERED_ASK_KEPT`. A new `decisions.md` (upload, create or rename) is refused 409 `DECISIONS_ARE_NODES`. A write to a retired document is refused 409 `DOCUMENT_RETIRED`, and any write into a retired `decisions.md` (an upload, an edit, a comment's mark, an ask block or a suggestion's accept or reject) 409 `DECISIONS_ARE_NODES`. A close, a reopen and an answer leave a retired document as it stands and are taken.
    The decisions step restores every answered ask whose block left its spec, except one a person removed, converts every `decisions.md` section into a node, a reading or a dropped section, and retires the document; `envoy-dispatch restore-answered-asks` and `convert-decisions` run it by hand, refuse (exit 2) a `--project` the database holds no project of, and print `issues=0` where nothing was owed, and `/healthz` answers `decisions_step_owed`. A booting process waits for the step only while its first phase owes a row. The step holds its lock on a connection of the server's shared pool. A moved block's old address resolves through `moved_to`.
    Each retirement of a document appends one `document.retired` event, on the document's issue, or on the document itself where no issue holds it. Its payload names the document (`artifact_id`, `ref_key`, `name`), the `role` the retirement cleared (absent where the document had none) and the `reason`. Its `superseded_approval` is the approval the retirement ended (the review, the version it approved, who gave it and its kind), or null where no approval stood.
    A comment thread anchored in a retired document still resolves, reopens, and takes an edit of a comment and a reply, none of which writes into the document, and its author's delete of a comment that holds a pending suggestion deletes the comment and drops the suggestion, which the retired text keeps and can never take; a reword of a block ask whose block is in one, a named version of one and a rebuild of one are refused 409 `DOCUMENT_RETIRED`, or `DECISIONS_ARE_NODES` for a retired `decisions.md`, and write nothing.
    The gated-steps write takes `decisions` and stores the list without it.
    `envoy-dispatch backfill-block-ids` prints `documents=0` where it read no document, rather than nothing.
    `envoy-dispatch census --store` reads a database this build has not migrated yet as an absent store and names the reason, and with `--sizing` still runs its growth pass.
    A Keep on a decision node reads the node again under its locks, and answers 409 `DECISION_CHANGED` when the decision changed while it waited, and 404 when the decision was replaced or removed, with nothing written.
    A reference `dispatch://KEY/decisions`, and a link to an issue's Decisions page (`/issues/KEY/decisions`) whatever its fragment, reads as the issue, whose decision nodes that page reads, rather than as no reference and as the issue's `decisions.md`.
