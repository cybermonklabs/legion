kind: Changed
body: |-
    A decision is a node of the issue's own spec. An agent records a decision as a `decision` block in the spec's `## Decisions` part, with `shaped`, `from_ask`, `uncertainty` and `replaced`; its reading of a person's answered ask is a `reading` block inside that ask. The block schema is version 5, and a document written at it is unreadable to the release before, so a rollback is safe only until the first such write.
    A person's answer is held once, on the ask's node, and no document holds its words or selection. A person's answer, resolve, decline, close or reopen of an ask writes one version, which changes only the server-owned attributes of the ask's block: `state`, and `answered_by` and `answered_at` where the ask is answered; an open ask's block holds no `state`. An approval carries across the version an answer, a resolve or a decline writes, and the approval request stays with whoever held its turn; a close's version carries no approval, and the reopen's carries it. While a process of the release before still serves, settlement keeps the answer in step in the block for that release's pages, within what one upload may hold.
    `GET /api/v1/issues/{key}/decisions` answers `entries`, one per question ask and per decision node, read from the store, each with the display trees of its text and its answer under `Dispatch-Trees: 1`, and each decision's `decided_by`, whose session carries the newest title it stamped; its `decisions` and `document` members answer from the store for one release.
    Keep acts on an agent's `decision` block of any document of the issue, as two appends on its node.
    `GET /api/v1/artifacts/{id}/text` and the other text routes serve markdown that holds none of the eight server-owned ask attributes, so a read uploads back unchanged, and answer each ask of the document in `asks`, read from its node; a stored version keeps, for one release and for the readers of the release before, the `state` of an ask that is not open, its answerer and time, and a copy's `copied_from` and `copied_from_document`. The edit route's `insert` op takes a third anchor, `into: "block:<id>"`, and writes its markdown inside that block, after its last child; a server of the release before refuses it.
    An approval carries across a version whose only change is readings, the removal of the server-owned ask attributes, or the decisions step's own restore and conversion.
    An agent's write that drops or retypes a person's answered ask block is refused 409 `ANSWERED_ASK_KEPT`. A new `decisions.md` (upload, create or rename) is refused 409 `DECISIONS_ARE_NODES`. A write to a retired document is refused 409 `DOCUMENT_RETIRED`, and an upload to or an edit of a retired `decisions.md` 409 `DECISIONS_ARE_NODES`.
    The decisions step restores every answered ask whose block left its spec, converts every `decisions.md` section into a node, a reading or a dropped section, and retires the document; `envoy-dispatch restore-answered-asks` and `convert-decisions` run it by hand, refuse (exit 2) a `--project` the database holds no project of, and print `issues=0` where nothing was owed, and `/healthz` answers `decisions_step_owed`. A booting process waits for the step only while its first phase owes a row. The step holds its lock on a connection of the server's shared pool. A moved block's old address resolves through `moved_to`.
    The gated-steps write takes `decisions` and stores the list without it.
    `envoy-dispatch backfill-block-ids` prints `documents=0` where it read no document, rather than nothing.
