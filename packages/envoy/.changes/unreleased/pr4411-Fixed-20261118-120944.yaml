kind: Fixed
body: |-
  A keyed Dispatch write (a `POST` or `PATCH` with an `Idempotency-Key`) is refused as it was before
  #4350 when the keyed layer cannot resolve its caller, or when its body declared no length and ran
  past the route's limit: the route's own answer again, such as `403 REPLY_FORBIDDEN` on the message
  and comment replies and `403 ACCEPT_FORBIDDEN` on a delivery's accept for a request with no
  `Authorization`, or a missing object's `404`, where #4350 answered `401`, `503`, `500` or `413`
  in the keyed layer. Nothing the handler makes in those cases lands without the key: it meets a
  caller the layer could not resolve as the layer's refusal, and any transaction it opens that wrote
  is refused at its commit. So a caller whose lookup fails once and then succeeds still writes once
  when it resends under the key.
