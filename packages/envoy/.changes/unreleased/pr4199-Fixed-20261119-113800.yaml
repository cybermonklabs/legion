kind: Fixed
body: |-
  A Dispatch database restored alone no longer leaves a replaced Google account holding
  credentials at the secrets broker, or the address's real holder refused there: the runbook's
  recovery is now a reset. It ends every browser session, by raising every address's session
  generation to a number that grows with time, revokes every personal token, ends every person's
  sign-in, machine login and approval-page session at the broker, and lifts a refusal at the
  broker only for the account the Workspace directory names as the address's holder. Every person
  signs in again and every agent gets a new token. A new session row starts at the deployment's
  floor the reset writes as well as at its address's (migrations
  `20261119060414_session_generation_floors` and `20261119183355_session_generation_deployment_floor`),
  so an address the restored database never saw cannot start below it. The reset records its own
  start and end (migration `20261120144819_deployment_resets`), ends every person's broker
  credentials at once and again an hour later, and is closed only once the broker holds none. A
  broker database restored alone is told again what Dispatch settled since its backup, with an
  hour's margin for the two clocks, and since the last reset's start; one made again is told what
  Dispatch settled since that start, or everything where no reset ran; and either runs the reset's
  broker blocks again when it may predate the last reset's end. The recovery's broker reads take
  a libpq URL made from the broker's own, which can carry a pgx-only parameter psql refuses, and the
  directory read passes its token from a file rather than on the command line.
  `envoy-dispatch clear-broker-revocation <address>` prints each owed revocation's session
  generation, or `none`. Every guard on the binding's tables, in Dispatch (`20261119065002`) and in
  the broker (`0042_guards_search_path`), runs under its own `search_path`, so a session's temporary
  table or operator cannot take its write. A database an early unreleased head migrated is refused
  at migrate with a message to reset it (`20261119064905`), in a schema whose name needs quotes too.
  The first recording of an address's account also revokes its personal tokens that record no
  account. An address whose domain ends in a character IDNA maps to a full stop is judged by its
  domain without it, and one whose domain holds an empty label is refused as the Workspace's.
