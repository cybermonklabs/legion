kind: Removed
body: |-
    `BROKER_FAKE_SECRETS_FILE` is gone, and a broker started with it is refused naming what replaces it: `BROKER_SECRETS_STORE=memory` with `BROKER_MEMORY_SECRETS_FILE` pointing at the same file, whose secrets drop their `kms_key_id` field. The file stood in for the store in Secrets Manager's shape whatever store was named; the memory store is a store of its own in the registry, so `GET /v1/settings` now answers `store: "memory"` and its own `memory_secrets_file` field rather than the cloud store's fields.
    Each store is now one Go package behind one registry, and `BROKER_SECRETS_STORE` takes any store that registry holds. A variable only one store reads is refused with another store, naming both stores, and `GET /v1/settings` answers the store's own fields after the ones every store answers. An AWS or a Google Cloud deployment upgrades with no change: the same variables, the same settings fields and the same grant sources.
