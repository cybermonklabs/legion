kind: Added
body: |-
    A private Dispatch project is seen by its owner, the people its access list names and the full members of the groups it names, and every other caller reads it, and everything in it, as a project that does not exist, on every read, both sockets, both legs of search, every write that names an object, and the GitHub proxy. This release makes no project private: it has no writer of the hub's private-projects record yet, so every switch to private is refused (below). A personal `dsp_` token and an access token the secrets broker issued for one project carry a list of projects. A credential's list decides only which private projects it sees: a full member's credential sees every public project its person sees and the private projects of its list its person sees, and a credential that names no person, the shared `DISPATCH_AGENT_TOKEN` among them, every public project and the private projects of its list; a restricted member's credential that lists projects sees only those of them its person sees, and one that lists none the public projects its person sees. Settings and `POST`/`PATCH /api/v1/me/agent-tokens` set a token's `projects` (at most 16, each one the caller sees, else 400 TOKEN_PROJECTS_INPUT), and `GET /api/v1/whoami` answers them as `projects`, absent for a credential that lists none, and for a full member's broker-issued token while no project is private, and as `private_projects` those of them the caller must treat as private (a private project, one the credential no longer sees, one that names no project), absent when there is none. A restricted member, and a credential acting for one, reads only the people and sessions of the projects it sees and its own direct conversations, and is refused every read of the whole deployment with 403 DEPLOYMENT_READ_REFUSED and every write of it with 403 RESTRICTED_MEMBER, but for a restricted member's revoke of their own credential grant or sign-in; a credential that lists a project is refused every write of the whole deployment with 403 PROJECT_SCOPE_DEPLOYMENT, a full member's broker token acting as its person only while a project is private; a restricted member's dashboard rail shows Inbox, Agents, Delivery, their projects and Settings, their Delivery page shows the pull requests whose issue they see and only the deploy runs that shipped one of them, with no run's jobs, setup form or session-groups editor, and the other pages over the whole deployment answer Page not found. A private project's Legion daemon needs a `dsp_` token that lists the project. The live socket sends an event only to a caller who may read it and ends a subscription whose caller's projects changed, so its page refreshes, and a document socket closes with 4412 once its person no longer sees the document's project.

    A project is made private only where the deployment has provisioned it: `DISPATCH_PRIVATE_PROJECTS` names, comma-separated, the keys of the projects whose private namespace, stores and grants exist, and `envoy-infra:gcp:Dispatch`'s `privateProjects`, now a list of keys, renders it sorted with each key once. An entry that is not a project key, the old value `1` included, is ignored: `pulumi preview` prints a warning naming it, and Dispatch logs one ERROR line at boot naming it, so the project it meant is never provisioned: its switch to private stays 409 PRIVATE_PROJECT_NOT_PROVISIONED while another entry is a key, and is 409 PRIVATE_PROJECTS_OFF where none is. The owner's switch to private (`PATCH /api/v1/projects/{key}/access`, the Access tab) is 409 PRIVATE_PROJECTS_OFF with an empty list; after the owner check, 409 PRIVATE_PROJECT_NOT_PROVISIONED for a key the list does not name, 409 PRIVATE_PROJECTS_INCOMPLETE until every row of the project has a node naming its project and `envoy-dispatch backfill-session-projects` and `envoy-dispatch scrub-access-events` have run, naming each such row with the cure the project census prints for it, or the command not run, and 409 PRIVATE_PROJECTS_UNAVAILABLE, with nothing changed, while the hub does not take the project's key in its `envoy_private_projects` bucket, which in this release is every time: Dispatch has no writer of that bucket yet, so a switch that passes every other check is that 409. A switch to public meets only the owner check. A private project the list no longer names stays private and refuses every change of its visibility but its owner's switch to public, and nothing stops the boot: an ERROR line at boot and at every maintenance pass names it and both repairs, and `/healthz` answers the fixed reason `degraded: ["private_project_unprovisioned"]`, naming no project and counting none, without changing `ok`. `envoy-dispatch project-visibility <KEY> public` makes such a project public with the database credential alone, so take a key off the list only after its project is public. Every response carries `Dispatch-Private-Projects: 1` while the list names a project or the database holds a private one, and `0` otherwise.

    `project.access_changed` now names only its project and its change, `{project, change}`, and `envoy-dispatch scrub-access-events` rewrites the payloads stored with the whole access. A session counts as one of a project's agents only where the credential behind its write proved that session, as a broker-issued token's write does: migration `20261116081157_session_projects_proven` empties `session_projects` and `session_projects_filled`, so run `envoy-dispatch backfill-session-projects` after the deploy (`--reset` empties both first, for a deployment that rolls). An owner holds at most 100 groups (400 CAP_EXCEEDED), and `GET /api/v1/access-groups` answers a page `{groups, next}` of at most `?limit=` groups after `?after=`. With no private project, no restricted member and no personal token that lists projects, every caller reads and writes what it did before, a broker-issued token included: a full member's broker token reads what its person reads, whatever the deployment holds, but for a private project its list does not name, and a one-project token's writes are refused in the words they always were, in every state. A restricted member's broker token reads and writes only the projects of its list its person sees, with a private project or none.

    The heads a caller reads are the newest it can see: `GET /auth/whoami`'s `event_head` and an events subscription's `events_start` since are the newest event the caller can see, and a delivery view's `seq` and `changed_at` the newest change of a repository it sees, so no write of a project it cannot see moves them. Where no project is private, a full member reads the heads it read before.

    `/healthz`, which answers a caller with no credential, names no private project and no repository: in every deployment, with a private project or none, each failed GitHub read's `cause` in its `github` member is now its class alone, `status <n>` for the status GitHub answered or `no status`, and the failure's text, which names the repository the read read, is read in `github_read_attempts`.

    A claim, the actor who parked an issue, a route's holder and a `legion-<project>-…` role name no session, person or project their reader may not see, in the issue read, the listing, the children, the priority faults, the ask reads and a claim's 409; a delivery to a role of a private project its sender does not see answers as a role no session holds.

    `PUT /api/v1/me/issues/{key}/state` for a key no issue holds, or an issue its caller may not see, answers 404 NOT_FOUND; it answered 500 for a key no issue holds, which was a defect.

    A follow (`PUT /api/v1/asks/{id}/followers/{session_id}`) and a session group create or edit naming a session its writer may not see answer 404 SESSION_NOT_FOUND, as a session nobody holds does, the rule a session's own rows already keep; while a project is private a session nobody holds is hidden too, so both answer alike. With no private project, a full member's follow and group writes answer as before.

    The dashboard reads its project list again when a project's visibility changes, and after every gap in its live feed, so a list never stays behind a change of which projects its reader sees.

    A restricted member, or a credential acting for one, cannot set, change or clear an issue's own repository: `POST /api/v1/issues` and `PATCH /api/v1/issues/{key}` that name `repo`, a string or null, are 403 RESTRICTED_MEMBER before anything is written. Their issues take the repository they resolve to, their nearest parent's or their project's default, so naming a repository can no longer make it theirs to read through the GitHub proxy. A full member's `repo` is taken as before.

    A document socket whose person loses its room by an access change made in SQL alone, which appends no event and announces nothing, closes with 4412 (DOC_ADMISSION_REVOKED) within one socket heartbeat (15 s), as an access change made through the API closes it; the live socket and the Delivery views re-check on that heartbeat too.

    On the Access tab, a refused switch to private says what the owner can do and offers no Retry, and a switch to public asks the owner to confirm it first.

    A repository is owned only through the issues that resolve to it, by its name: an issue's own repository, else its nearest parent's, else its project's default, whether the issue is open or done. A repository mapping and a recorded rename give no project a repository, and an issue whose parent chain loops or runs deeper than 32 links resolves to none. A reader reads a repository an issue of a project it sees resolves to, whatever private project shares it, and an open viewer also one that no private project it does not see owns. The GitHub proxy answers any other repository as one the App is not installed on before it asks GitHub anything, and while a project is private it follows no GitHub redirect to another repository, so an old name it shows cannot read a renamed private repository. The Delivery pages hold a pull request that names no issue, a deploy run that shipped none and a PR-checks run with no stored pull request to the same rule, a hidden run answering 404 as a run nobody holds does, with the statements a missing run costs. `GET /api/v1/github/app-installation/{owner}/{repo}` holds a repository to the same rule: one its caller may not read answers exactly as one the App is not installed on, and GitHub is not asked, so a Legion daemon whose credential does not see a private project reads that project's repositories as not installed.

    An issue's own repository, and a project's default repository, can only be set to a repository its writer can read through Dispatch's GitHub proxy: `POST /api/v1/issues` and `PATCH /api/v1/issues/{key}` naming another, and `PUT /api/v1/projects/{key}/default-repository` naming another, are 403 REPOSITORY_NOT_AVAILABLE before anything is written, naming no project. That route also answers a project its writer does not see as 404 PROJECT_NOT_FOUND, a key nobody holds, before any lock or write, and refuses a restricted member 403 RESTRICTED_MEMBER. A repository an issue the writer sees already uses stays open. Clearing repo is never refused, and with no private project every such write is taken as before.
