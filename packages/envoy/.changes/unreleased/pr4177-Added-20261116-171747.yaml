kind: Added
body: |-
    A private Dispatch project is seen by its owner, the people its access list names and the full members of the groups it names, and every other caller reads it, and everything in it, as a project that does not exist, on every read, both sockets, both legs of search, every write that names an object, and the GitHub proxy. This release makes no project private: it has no writer of the hub's private-projects record yet, so every switch to private is refused (below). A personal `dsp_` token and an access token the secrets broker issued for one project carry a list of projects. A credential that lists projects sees those of them its person sees and nothing else; one that lists none sees the public projects its person sees; one that names no person, the shared `DISPATCH_AGENT_TOKEN` among them, sees the public projects. Settings and `POST`/`PATCH /api/v1/me/agent-tokens` set a token's `projects` (at most 16, each one the caller sees, else 400 TOKEN_PROJECTS_INPUT), and `GET /api/v1/whoami` answers them as `projects`, absent for a credential that lists none, and as `private_projects` those of them the caller must treat as private (a private project, one the credential no longer sees, one that names no project), absent when there is none. A restricted member, and a credential that lists projects, reads only the people and sessions of the projects it sees and its own direct conversations, and is refused every read of the whole deployment with 403 DEPLOYMENT_READ_REFUSED and every write of it with 403 RESTRICTED_MEMBER or 403 PROJECT_SCOPE_DEPLOYMENT, but for a restricted member's revoke of their own credential grant or sign-in; a restricted member's dashboard rail shows Inbox, Agents, Delivery, their projects and Settings, their Delivery page shows the pull requests whose issue they see and only the deploy runs that shipped one of them, with no run's jobs, setup form or session-groups editor, and the other pages over the whole deployment answer Page not found. A private project's Legion daemon needs a `dsp_` token that lists the project. The live socket sends an event only to a caller who may read it and ends a subscription whose caller's projects changed, so its page refreshes, and a document socket closes with 4412 once its person no longer sees the document's project.

    A project is made private only where the deployment has provisioned it: `DISPATCH_PRIVATE_PROJECTS` names, comma-separated, the keys of the projects whose private namespace, stores and grants exist, and `envoy-infra:gcp:Dispatch`'s `privateProjects`, now a list of keys, renders it sorted with each key once. A key that is not a project key is an input error at `pulumi preview`, and Dispatch refuses to start on such an entry, the old value `1` included. The owner's switch to private (`PATCH /api/v1/projects/{key}/access`, the Access tab) is 409 PRIVATE_PROJECTS_OFF with an empty list; after the owner check, 409 PRIVATE_PROJECT_NOT_PROVISIONED for a key the list does not name, 409 PRIVATE_PROJECTS_INCOMPLETE until every row of the project has a node naming its project and `envoy-dispatch backfill-session-projects` and `envoy-dispatch scrub-access-events` have run, naming each such row with the cure the project census prints for it, or the command not run, and 409 PRIVATE_PROJECTS_UNAVAILABLE, with nothing changed, while the hub does not take the project's key in its `envoy_private_projects` bucket, which in this release is every time: Dispatch has no writer of that bucket yet, so a switch that passes every other check is that 409. A switch to public meets only the owner check. A private project the list no longer names stays private and refuses every change of its visibility but its owner's switch to public, and nothing stops the boot: an ERROR line at boot and at every maintenance pass names it and both repairs, and `/healthz` answers the fixed reason `degraded: ["private_project_unprovisioned"]`, naming no project and counting none, without changing `ok`. `envoy-dispatch project-visibility <KEY> public` makes such a project public with the database credential alone, so take a key off the list only after its project is public. Every response carries `Dispatch-Private-Projects: 1` while the list names a project or the database holds a private one, and `0` otherwise.

    `project.access_changed` now names only its project and its change, `{project, change}`, and `envoy-dispatch scrub-access-events` rewrites the payloads stored with the whole access. A session counts as one of a project's agents only where the credential behind its write proved that session, as a broker-issued token's write does: migration `20261116081157_session_projects_proven` empties `session_projects` and `session_projects_filled`, so run `envoy-dispatch backfill-session-projects` after the deploy (`--reset` empties both first, for a deployment that rolls). An owner holds at most 100 groups (400 CAP_EXCEEDED), and `GET /api/v1/access-groups` answers a page `{groups, next}` of at most `?limit=` groups after `?after=`. With no private project, no restricted member and no personal token that lists projects, every caller reads and writes what it did before, a broker-issued token included: while every project is public, a full member's broker token reads what its person reads, and a one-project token's writes are refused in the words they always were. A restricted member's broker token reads and writes only the projects of its list its person sees, with a private project or none.

    The heads a caller reads are the newest it can see: `GET /auth/whoami`'s `event_head` and an events subscription's `events_start` since are the newest event the caller can see, and a delivery view's `seq` and `changed_at` the newest change of a repository it sees, so no write of a project it cannot see moves them. Where no project is private, a full member reads the heads it read before.

    `/healthz`, which answers a caller with no credential, names no private project and no repository: in every deployment, with a private project or none, each failed GitHub read's `cause` in its `github` member is now its class alone, `status <n>` for the status GitHub answered or `no status`, and the failure's text, which names the repository the read read, is read in `github_read_attempts`.

    A claim, the actor who parked an issue, a route's holder and a `legion-<project>-…` role name no session, person or project their reader may not see, in the issue read, the listing, the children, the priority faults, the ask reads and a claim's 409; a delivery to a role of a private project its sender does not see answers as a role no session holds.

    `PUT /api/v1/me/issues/{key}/state` for a key no issue holds, or an issue its caller may not see, answers 404 NOT_FOUND; it answered 500 for a key no issue holds, which was a defect.

    A follow (`PUT /api/v1/asks/{id}/followers/{session_id}`) and a session group create or edit naming a session its writer may not see answer 404 SESSION_NOT_FOUND, as a session nobody holds does, the rule a session's own rows already keep; while a project is private a session nobody holds is hidden too, so both answer alike. With no private project, a full member's follow and group writes answer as before.

    The dashboard reads its project list again when a project's visibility changes, and after every gap in its live feed, so a list never stays behind a change of which projects its reader sees.

    A restricted member, or a credential acting for one, cannot set, change or clear an issue's own repository: `POST /api/v1/issues` and `PATCH /api/v1/issues/{key}` that name `repo`, a string or null, are 403 RESTRICTED_MEMBER before anything is written. Their issues take the repository they resolve to, their nearest parent's or their project's default, so naming a repository can no longer make it theirs to read through the GitHub proxy. A full member's `repo` is taken as before.

    A document socket whose person loses its room by an access change made in SQL alone, which appends no event and announces nothing, closes with 4412 (DOC_ADMISSION_REVOKED) within one socket heartbeat (15 s), as an access change made through the API closes it; the live socket and the Delivery views re-check on that heartbeat too.

    On the Access tab, a refused switch to private says what the owner can do and offers no Retry, and a switch to public asks the owner to confirm it first.

    A repository is hidden from a reader when a private project the reader does not see owns it, through an issue of that project that resolves to it or a mapping, under any recorded rename, and a reader that is not an open viewer reads only a repository a project it sees owns. The GitHub proxy answers a hidden repository as one the App is not installed on before it asks GitHub anything; `GET /api/v1/github/app-installation/{owner}/{repo}` answers it `installed: false`; and the Delivery pages hold a pull request that names no issue, a deploy run that shipped none and a PR-checks run with no stored pull request to the same rule, a hidden run answering 404 as a run nobody holds does, with the statements a missing run costs.
