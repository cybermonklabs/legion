kind: Added
body: |-
    A Dispatch project can now be private: its owner, the people its access list names and the full members of the groups it names see it, and every other caller reads it, and everything in it, as a project that does not exist, on every read, both sockets, both legs of search, every write that names an object, and the GitHub proxy. A personal `dsp_` token and an access token the secrets broker issued for one project carry a list of projects. A credential that lists projects sees those of them its person sees and nothing else; one that lists none sees the public projects its person sees; one that names no person, the shared `DISPATCH_AGENT_TOKEN` among them, sees the public projects. Settings and `POST`/`PATCH /api/v1/me/agent-tokens` set a token's `projects` (at most 16, each one the caller sees, else 400 TOKEN_PROJECTS_INPUT), and `GET /api/v1/whoami` answers them as `projects`, absent for a credential that lists none; its `project` is deprecated, the one key of a one-key list and null otherwise. A restricted member, and a credential that lists projects, reads only the people and sessions of the projects it sees and its own direct conversations, and is refused every read of the whole deployment with 403 DEPLOYMENT_READ_REFUSED and every write of it with 403 RESTRICTED_MEMBER or 403 PROJECT_SCOPE_DEPLOYMENT; a restricted member's dashboard rail shows Inbox, Agents, their projects and Settings, and the pages over the whole deployment answer Page not found. A private project's Legion daemon needs a `dsp_` token that lists the project. The live socket sends an event only to a caller who may read it and ends a subscription whose caller's projects changed, so its page refreshes, and a document socket closes with 4412 once its person no longer sees the document's project.

    A project is made private only where the deployment has provisioned it: `DISPATCH_PRIVATE_PROJECTS` names, comma-separated, the keys of the projects whose private namespace, stores and grants exist, and `envoy-infra:gcp:Dispatch`'s `privateProjects`, now a list of keys, renders it sorted with each key once. A key that is not a project key is an input error at `pulumi preview`, and Dispatch refuses to start on such an entry, the old value `1` included. The owner's switch to private (`PATCH /api/v1/projects/{key}/access`, the Access tab) is 409 PRIVATE_PROJECTS_OFF with an empty list; after the owner check, 409 PRIVATE_PROJECT_NOT_PROVISIONED for a key the list does not name, 409 PRIVATE_PROJECTS_INCOMPLETE, naming the command, until every row of the project has a node naming its project and `envoy-dispatch backfill-session-projects` and `envoy-dispatch scrub-access-events` have run, 409 REPOSITORY_LANE_SHARED while a repository of the project shares a GitHub subject lane with another project's, and 409 PRIVATE_PROJECTS_UNAVAILABLE, with nothing changed, while the hub does not take the project's key in its `envoy_private_projects` bucket. A switch to public meets only the owner check. A repository mapping whose lane another project's mapping holds, where either project is private, is 409 REPOSITORY_LANE_SHARED too, and a mapping of a project the caller does not see is neither moved nor named. A private project the list no longer names stays private and refuses every change of its visibility but its owner's switch to public, and nothing stops the boot: an ERROR line at boot and at every maintenance pass names it and both repairs, and `/healthz` names it in `private_projects_unprovisioned` without changing `ok`. `envoy-dispatch project-visibility <KEY> public` makes such a project public with the database credential alone, so take a key off the list only after its project is public. Every response carries `Dispatch-Private-Projects: 1` while the list names a project or the database holds a private one, and `0` otherwise.

    `project.access_changed` now names only its project and its change, `{project, change}`, and `envoy-dispatch scrub-access-events` rewrites the payloads stored with the whole access. A session counts as one of a project's agents only where the credential behind its write proved that session, as a broker-issued token's write does: migration `20261116081157_session_projects_proven` empties `session_projects` and `session_projects_filled`, so run `envoy-dispatch backfill-session-projects` after the deploy (`--reset` empties both first, for a deployment that rolls). A recorded actor carries no `project`. An owner holds at most 100 groups (400 CAP_EXCEEDED), and `GET /api/v1/access-groups` answers a page `{groups, next}` of at most `?limit=` groups after `?after=`. With no private project, no restricted member and no credential that lists projects, every caller reads and writes what it did before.
