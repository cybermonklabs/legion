kind: Added
body: |-
    A private Dispatch project is seen by its owner, the people its access list names and the full members of the groups it names, and every other caller reads it, and everything in it, as a project that does not exist, on its reads (the agents list, broadcasts, the Delivery views, the objects an event names and the live socket's feeds excepted), the document socket, both legs of search, every write that names an object, and the GitHub proxy. This release makes no project private: no route of it switches a project to private. An access token the secrets broker issued for one project carries a list of projects. A credential's list decides only which private projects it sees: a full member's credential sees every public project its person sees and the private projects of its list its person sees, and a credential that names no person, the shared `DISPATCH_AGENT_TOKEN` among them, every public project and the private projects of its list; a restricted member's credential that lists projects sees only those of them its person sees, and one that lists none the public projects its person sees. `GET /api/v1/whoami` answers a credential's list as `projects`, absent for a credential that lists none, and for a full member's broker-issued token while no project is private, and as `private_projects` those of them the caller must treat as private (a private project, one the credential no longer sees, one that names no project), absent when there is none. A restricted member, and a credential acting for one, reads only the people of the projects it sees and its own direct conversations, and is refused every read of the whole deployment with 403 DEPLOYMENT_READ_REFUSED and every write of it with 403 RESTRICTED_MEMBER, but for a restricted member's revoke of their own credential grant or sign-in; a credential that lists a project is refused every write of the whole deployment with 403 PROJECT_SCOPE_DEPLOYMENT, a full member's broker token acting as its person only while a project is private; a restricted member's dashboard rail shows Inbox, Agents, Delivery, their projects and Settings, and their Delivery page shows no run's jobs, setup form or session-groups editor. A document socket closes with 4412 once its person no longer sees the document's project.

    A session counts as one of a project's agents only where the credential behind its write proved that session, as a broker-issued token's write does: run `envoy-dispatch backfill-session-projects` after the deploy, which records the pairs of the events written before it (`--reset` empties `session_projects` and `session_projects_filled` first, for a deployment that rolls). With no private project, no restricted member and no personal token that lists projects, every caller reads and writes what it did before, a broker-issued token included: a full member's broker token reads what its person reads, whatever the deployment holds, but for a private project its list does not name, and a one-project token's writes are refused in the words they always were, in every state. A restricted member's broker token reads and writes only the projects of its list its person sees, with a private project or none.

    `/healthz`, which answers a caller with no credential, names no private project and no repository: in every deployment, with a private project or none, each failed GitHub read's `cause` in its `github` member is now its class alone, `status <n>` for the status GitHub answered or `no status`, and the failure's text, which names the repository the read read, is read in `github_read_attempts`.

    A claim, the actor who parked an issue, a route's holder and a `legion-<project>-…` role name no session, person or project their reader may not see, in the issue read, the listing, the children, the priority faults, the ask reads and a claim's 409.

    `PUT /api/v1/me/issues/{key}/state` for a key no issue holds, or an issue its caller may not see, answers 404 NOT_FOUND; it answered 500 for a key no issue holds, which was a defect.

    A follow (`PUT /api/v1/asks/{id}/followers/{session_id}`) and a session group create or edit naming a session its writer may not see answer 404 SESSION_NOT_FOUND, as a session nobody holds does, the rule a session's own rows already keep; while a project is private a session nobody holds is hidden too, so both answer alike. With no private project, a full member's follow and group writes answer as before.

    The dashboard reads its project list again after every gap in its live feed.

    A restricted member, or a credential acting for one, cannot set, change or clear an issue's own repository: `POST /api/v1/issues` and `PATCH /api/v1/issues/{key}` that name `repo`, a string or null, are 403 RESTRICTED_MEMBER before anything is written. Their issues take the repository they resolve to, their nearest parent's or their project's default, so naming a repository can no longer make it theirs to read through the GitHub proxy. A full member's `repo` is taken as before.

    A document socket whose person loses its room by an access change made in SQL alone, which appends no event and announces nothing, closes with 4412 (DOC_ADMISSION_REVOKED) within one socket heartbeat (15 s).

    A repository is owned only through the issues that resolve to it, by its name: an issue's own repository, else its nearest parent's, else its project's default, whether the issue is open or done. A repository mapping and a recorded rename give no project a repository, and an issue whose parent chain loops or runs deeper than 32 links resolves to none. A reader reads a repository an issue of a project it sees resolves to, whatever private project shares it, and an open viewer also one that no private project it does not see owns. The GitHub proxy answers any other repository as one the App is not installed on before it asks GitHub anything, and while a project is private it follows no GitHub redirect to another repository, so an old name it shows cannot read a renamed private repository. `GET /api/v1/github/app-installation/{owner}/{repo}` holds a repository to the same rule: one its caller may not read answers exactly as one the App is not installed on, and GitHub is not asked, so a Legion daemon whose credential does not see a private project reads that project's repositories as not installed.

    An issue's own repository, and a project's default repository, can only be set to a repository its writer can read through Dispatch's GitHub proxy: `POST /api/v1/issues` and `PATCH /api/v1/issues/{key}` naming another, and `PUT /api/v1/projects/{key}/default-repository` naming another, are 403 REPOSITORY_NOT_AVAILABLE before anything is written, naming no project. That route also answers a project its writer does not see as 404 PROJECT_NOT_FOUND, a key nobody holds, before any lock or write, and refuses a restricted member 403 RESTRICTED_MEMBER. A repository an issue the writer sees already uses stays open. Clearing repo is never refused, and with no private project every such write is taken as before.
