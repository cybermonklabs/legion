kind: Fixed
custom:
  Issue: pr4378
body: |-
  `GET /api/v1/search/coverage` took 10 to 30 s in production and is now several times faster on a
  synthetic corpus of production's size, in every state of the visibility map. It reads the window
  kinds through two partial indexes (`embeddings_window_embedded`, `embeddings_window_unembedded`)
  by one bitmap scan of both, never by a sequential scan that tests every window's text, whatever
  the visibility map holds, and it builds and hashes an issue's text only where the issue's inputs
  changed since the coverage pass recorded them in the new table `embedding_issue_sources` (at
  boot and every 10 minutes). The statement runs under a 10 s `statement_timeout`, past which the
  route answers `503 SEARCH_COVERAGE_TIMEOUT` while its caller still waits, and a boot pass whose
  closing report fails logs it at WARN instead of failing. The two index builds run before the
  server serves, so a single-replica deployment is down for them at the deploy, about 15 s at
  1,000,000 window rows.
