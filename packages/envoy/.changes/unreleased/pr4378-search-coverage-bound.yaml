kind: Fixed
custom:
  Issue: pr4378
body: |-
  `GET /api/v1/search/coverage` took 10 to 30 s in production; its statement now takes 1.1 to 1.6 s
  on a synthetic corpus of production's size where the old one took 11.1 to 17.3 s, in every state
  two builds Jobs measured that corpus in. It reads the window kinds through two partial indexes
  (`embeddings_window_embedded`, `embeddings_window_unembedded`) by one bitmap scan of both and by
  no other index or plan, never by a sequential scan that tests every window's text, whatever the
  visibility map holds, whatever the statistics read and whatever share of the windows is
  embedded, as after an embedder change drops every vector; and it builds and hashes an issue's
  text only where the issue's inputs changed since the coverage pass recorded them in the new
  table `embedding_issue_sources` (at boot and every 10 minutes). The statement runs under a 10 s
  `statement_timeout`, past which the route answers `503 SEARCH_COVERAGE_TIMEOUT` while its caller
  still waits, and a boot pass whose closing report fails logs it at WARN instead of failing. The
  two index builds run one after the other before the server serves, so a single-replica
  deployment is down for them at the deploy. On a synthetic corpus of production's size (about
  1,000,000 window rows), two builds Jobs of 8 CPUs measured 3.9 to 5.8 s for the first build and
  7.5 to 10.6 s for the second, 11.4 to 16.3 s for the two together: the time depends on the
  machine.
