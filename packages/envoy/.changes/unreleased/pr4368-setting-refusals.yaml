kind: Fixed
body: |-
  A refused URL setting is named, never printed as written: the broker's refusal of
  `BROKER_PUBLIC_URL`, `BROKER_EDGE_URL` and `BROKER_SIGNIN_ISSUER`, Dispatch's of
  `DISPATCH_CHAT_ENDPOINT`, `DISPATCH_AZURE_CHAT_ENDPOINT`, `DISPATCH_AZURE_EMBED_ENDPOINT`,
  `DISPATCH_AGENT_SECRETS_URL`, `ENVOY_URL`, `DISPATCH_SERVER_URL` and `NATS_URLS`, and the
  broker's refusal of a subject token issuer configured in part, which now says which of its
  parts are set. Each quoted the value, where a key, a password or a token can be written. The
  broker's approval page, refusing a `BROKER_PUBLIC_URL` that is no absolute http or https URL,
  names it as the URL rule reads it (`redact.URL`) rather than as written.
  What callers see change: the broker refuses a `BROKER_PUBLIC_URL` or a `BROKER_EDGE_URL` with
  user information, a query or a fragment (the authorization server metadata published the
  public URL as its issuer, which RFC 8414 section 2 holds to no query or fragment), and Dispatch
  refuses a `DISPATCH_AGENT_SECRETS_URL` with any of them, as the broker's public URL it names
  can no longer hold one.
