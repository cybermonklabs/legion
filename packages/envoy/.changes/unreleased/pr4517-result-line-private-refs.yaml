kind: Fixed
body: |-
  The pull-request body line Dispatch answers for a recorded result, and the line it writes for a
  check proved by CI, leave out every word of their text that holds a link (`://`) or an issue key
  of a project this Dispatch holds, in any case, before the 80-rune cut. A reading that named an
  issue key or a Dispatch link no longer puts it into a public pull request. Hyphenated words whose
  first part names no project (`UTF-8`, `SHA-256`) stay, and so does a project's name followed by a
  version. `POST /api/v1/issues/{key}/results/dry-run` takes a result's body, refuses it as the
  record does before it writes, and answers `{line}`, recording nothing.
