kind: Fixed
body: |-
  The pull-request body line Dispatch answers for a recorded result, and the line it writes for a
  check proved by CI, keep only plain words: every rune a visible letter, a digit or one of
  `. , ; : ! ? ' " - ( ) /`. Any other rune drops its word whole, since markup, Unicode dashes and
  invisible characters can split, join, hide or forge a key once the pull request renders it. Of
  the plain words the line also leaves out every one that holds a link (`://`), a host below or
  ending in `.internal`, a Tailscale MagicDNS host, this Dispatch's own host, or an issue key of a
  project this Dispatch holds, in any case, and the 80-rune cut is judged again. The CI line's run
  name goes through the same rule. `UTF-8`, `SHA-256` and a project's name followed by a version
  stay; `Vec<u8>`, `$PATH`, `ENVOY_TOKEN` and `a->b` leave the line, and the record keeps the whole
  reading. `POST /api/v1/issues/{key}/results/dry-run` takes a result's body, refuses it as the
  record does before it writes, and answers `{line}`, recording nothing.
