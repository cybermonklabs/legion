kind: Changed
body: |-
  Dispatch lets a restricted member decide one credential: at their browser, a machine login of
  their own, which is how an outside person approves the device login of their own agents. The
  machine-login page is theirs now, listing their own machine logins alone, and
  `POST /api/v1/credential-requests/machine-lookup`, `.../{id}/approve` and `.../{id}/deny` relay
  their lookup or decision only for a login whose approver is them and which names no service.
  `GET /api/v1/machine-logins` and `POST /api/v1/machine-logins/{id}/revoke` serve them too, at
  their browser: the list answers their own machine logins and no service's, and the revoke ends
  only one of those.
  Every other record, a shared one included, stays `403 RESTRICTED_MEMBER`, and every decision
  through a token of theirs is refused: `403 OAUTH_SCOPE_REQUIRED` from a token that lacks the
  route's scopes, their agent's `named` token among them, and `403 RESTRICTED_MEMBER` from any
  other; the broker is asked to decide nothing. A broker
  token of project scope `named` that records the credential a person made, the account it was
  approved by or when it was made, is held to that account as a `person` token is; an operator
  entry's, which records neither, is held to none, as before. A broker token of project scope
  `person` naming a restricted member holds no scope at Dispatch, as their `named` token holds
  none. Taking a restricted member off a project's access list that names them now records that
  Dispatch owes the broker the revocation of every machine login they approved, whatever other
  list still names them, and Dispatch pays it after the removal commits, again until the broker
  confirms (table `machine_login_revocations`, migration 20261120150130). Until it is paid, about
  a minute after the removal at the soonest (an approve the broker took before the removal may
  still commit until then), their approve of a machine login is
  `409 MACHINE_LOGIN_REVOCATION_OWED`, and an approval Dispatch is relaying makes the removal wait
  for it, without the project's lock, so every login the payment finds was approved before the
  removal. A second approve of theirs while one is at the broker is
  `409 MACHINE_LOGIN_APPROVAL_IN_FLIGHT`. The removal never waits on the broker, and a removal
  from a list that does not name the person owes nothing and holds up no approve of theirs; a
  removal that finds the member on the list only once it holds the project's lock, their addition
  having committed meanwhile, is `409 MACHINE_LOGIN_APPROVAL_IN_FLIGHT` while an approve of theirs
  is at the broker, and changes nothing.
  `/metrics` carries `envoy_dispatch_machine_login_revocations_owed` and
  `envoy_dispatch_machine_login_revocation_oldest_owed_seconds`, so a revocation the broker never
  confirms shows, and the Dispatch README gives an operator's clear of one; the runbook's recovery
  of a broker database restored alone owes again each such revocation settled since the backup,
  waiting for an approve in flight as a removal does.
