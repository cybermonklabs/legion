kind: Fixed
body: |-
  The blocks handed to the block indexer now carry the attributes their render found.
  `offsetBlocks` built those blocks from the same offsets the response path uses and dropped
  their `Attributes` on the way, so the indexer was handed a `check` with no `serves` or
  `surface`, a `plan_task` with no `needs`, a `callout` with no `kind` or `title`. Nothing
  stored changes: `document_blocks` has no column for a block's attributes and this adds none,
  so no row gains a value and no read answers differently today. What changes is that the
  attributes reach the indexer at all, which is the prerequisite for any column or filter over
  them: added later on top of the old constructor, the column would have been written from a
  value that was always empty, and the defect would have looked like a fault in whatever read
  it.
