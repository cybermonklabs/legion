kind: Fixed
body: |-
  `redact.Unanswered`, `redact.AskedURL` and their `oauth2call` forms no longer print any part of a
  credential that `url.Parse` read as a URL's host or port. A password holding an unencoded `@`
  leaves its tail where the host goes (`https://user:p@ssword`), and a credential holding a `/`,
  `?` or `#` leaves its head there and its next digits where the port goes
  (`http://user:4821/<tail>@host`); the resolver's and the dialer's errors name both. A URL that
  holds user information or an `@` past its host is now named with its authority as
  `[a URL with credentials]` (`https://[a URL with credentials]/widgets/healthz`, or
  `https://[a URL with credentials]` alone where the `@` is past the host), and the transport's
  words print its host and its port as that mark (`dial tcp [a URL with credentials]:[a URL with
  credentials]: connect: connection refused`). Where the host is not ASCII, or the dialer refused
  the address as no valid host and port, the failure prints as fixed words alone, the words the
  daemon prints for the same failures. The GitHub App client names a call to an API base with user
  information by that mark too.
