kind: Added
body: |-
  A CI job writes the result of a check of the spec files with its own results token: `POST /api/v1/projects/{key}/results` takes `{commit, check, verdict, observed}` from that token alone, and refuses every other member of the body by name. Dispatch reads the rest itself: the commit must be the token's, the run's repository must be the project's default repository (the one repository Dispatch gives a project, set with `PUT /api/v1/projects/{key}/default-repository`), GitHub must name the token's check run at that commit, the graph logic must take `.dispatch/spec` at that commit as `spec-check` takes it (`409 SPEC_FILES_REFUSED` names the first problem), and the files must hold the check, with its job the check run's job. A check run is a job's when its name is exactly the job's name, with no leg, so a job named `foo (bar)` writes the checks of `foo (bar)`. A name that is the job's name and a leg in parentheses is a leg of that job only where the run's workflow file at the commit makes the job a matrix job, and else `409 CHECK_NOT_THIS_JOBS` says why. GitHub's 403 or 404 for the check run or the workflow file is a final refusal (`403 CHECK_RUN_NOT_SHOWN`, `409 WORKFLOW_NOT_SHOWN`), and any other failure of GitHub's a `503` that asks for the write again (`CHECK_RUN_UNREADABLE`, `FILES_UNREADABLE`, `WORKFLOW_UNREADABLE`). Each result is a new row with Dispatch's record number and an in-toto statement of the run, and no row is changed. `GET /api/v1/projects/{key}/results?commit=` answers them newest first.

  A result names its run as the recorder, its session and its principal, and no person: the person of the broker's result entry ran no test, so no result, no answer and no access-log line names that person, and an `Idempotency-Key` of the run belongs to the run (`ci-run:<repository>#<check run>`). Dispatch reads the principal by the broker's own rule, so a workflow file or a branch whose name holds an `@` is recorded as the broker authenticated it. The project's default repository is compared with the run's repository without regard to case, as GitHub spells a repository as its owner does, and under the name the repository has now, so a default stored under a name its repository was renamed away from still takes the run's results. Each spec file over the size bound is one problem of the refusal. A result keeps 2000 characters of `observed`: a longer text is its first 500 characters, a line that says the middle was cut, and its last characters, since a test's output says why it failed at its end.

  Dispatch serves a results token on that one route, and answers it `403 RESULTS_ONLY_TOKEN` on every other route and on `GET /ws/live`. The shared verifier now also refuses a results token whose run holds a commit that is not 40 lowercase hex digits, a run, an attempt or a check run that is not a positive number, or a `workflow_ref` that is not its repository, a path and its ref.
