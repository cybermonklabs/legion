kind: Fixed
body: |-
  Two envoy-dispatch processes no longer both bind one delivery durable, which routed every
  GitHub webhook envelope twice. Which process delivers from a durable is now settled by that
  durable's hold, taken and renewed on Postgres: the holder takes the durable over under it,
  recreating the durable at its ack floor on a deliver subject of its own, and every other
  process stands by and polls for the hold rather than binding anything. A holder that stops
  renewing -- stopped, killed, or cut off from Postgres -- loses the hold within its lapse, and
  the standby that takes it over is handed everything that holder had not acknowledged.
