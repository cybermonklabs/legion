kind: Added
body: |-
  The secrets broker takes an optional setting, `BROKER_SECRETS_SECOND_PREFIX`, for a deployment
  on Google Cloud Secret Manager that moves its agent secrets to another prefix. With it set, a
  grant whose request froze a secret's source under the second prefix counts as a grant of the
  source the broker serves the same name from under `BROKER_SECRETS_PREFIX`, with the same secret
  id after the prefix and the same type: its releases, its reuse by a session that asks for the
  same names again and its airlock connections go on, and it does not end. A release reads the
  value from the secret under `BROKER_SECRETS_PREFIX` alone, never from the frozen source. Nothing
  else in the broker reads, lists, serves, freezes or writes under the second prefix. Every other
  moved source still ends its grant, as before. Empty, the default, the broker does what it did.
  The broker refuses to start on a value under `aws-secrets-manager`, on one that is no Secret
  Manager prefix under `gcp-secret-manager`, on `BROKER_SECRETS_PREFIX` itself, and on a prefix
  that nests with it. The operate page's "Moving the store to another prefix" gives the steps of a
  move.

  The memory store (`BROKER_SECRETS_STORE=memory`), the development store, reads the setting too,
  so a local run or a test can rehearse a move.
