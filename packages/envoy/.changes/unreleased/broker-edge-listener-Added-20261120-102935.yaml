kind: Added
body: |-
    The secrets broker can serve a machine login to a person outside the deployment's private network, on an edge of its own: `BROKER_EDGE_LISTEN_ADDR`, `BROKER_EDGE_URL` and `BROKER_EDGE_MACHINE_LOGIN_URL`, set together or not at all, bind a fourth port of the process behind a public load balancer. It serves `POST /v1/oauth/device_authorization`, `POST /v1/oauth/token` and `GET /healthz`, answers every other path 404, and answers any method but `POST` on the two login paths 405. A broker with none of the three settings binds nothing for it and serves as before.
    On the two login routes a caller's address is the second-to-last entry of the one `X-Forwarded-For` line, the one the load balancer appends for the client, and a request carrying the header as more than one line, or whose line has fewer than two entries, is `400 REQUEST_INVALID`; the edge's rate-limit buckets are its own, so a flood there spends nothing a caller of `BROKER_PUBLIC_URL` is held to. A machine login naming an address on `BROKER_SIGNIN_DOMAIN` or on a domain the new `BROKER_SIGNIN_WORKSPACE_DOMAINS` lists, or on a subdomain of one, is `400 EDGE_WORKSPACE_LOGIN` before it spends a bucket or writes a row. The token route takes the device code, a refresh token and the trade of one of the broker's own access tokens with no actor token, and answers every other grant `400 unsupported_grant_type` (`EDGE_GRANT_REFUSED`). It serves no machine login of a person of the Workspace, wherever it was opened: its refresh and device code are `400 invalid_grant` and the trade of its token `400 invalid_request`, each `EDGE_WORKSPACE_LOGIN`, and it trades no token but a device login's (`400 EDGE_GRANT_REFUSED`). Both routes take an `application/x-www-form-urlencoded` body and no other. Request objects and DPoP proofs at the edge name `BROKER_EDGE_URL`, and its `verification_uri` is `BROKER_EDGE_MACHINE_LOGIN_URL`. A login the edge opened is listed, looked up and decided on the broker's own address, as any other, and the launcher credential its approval mints works as any other.
    Every reader of a stored record now compares a request object's `aud` with the broker's address as a DPoP proof's `htu` is compared (scheme and host in any case, the default port the same as none, an empty path the same as `/`), and takes `BROKER_EDGE_URL` for a machine login alone. `config.Load` refuses an edge address whose port number is the port of `BROKER_LISTEN_ADDR`, `BROKER_METRICS_LISTEN_ADDR` or `BROKER_AIRLOCK_LISTEN_ADDR` (so `013382` is `13382`), naming both settings, an edge port that is no decimal number, an edge URL whose origin is `BROKER_PUBLIC_URL`'s, and an edge without `BROKER_MACHINE_LOGIN_URL` or with `BROKER_SIGNIN=off`. A `BROKER_PUBLIC_URL` whose port is zero written as `00` or with more zeros is now port 0, as `:0` is: refused outside a local run, and taken from the bound address in one.
    The edge's answers count in `broker_answers_total` with the label `port="edge"`, which the API port's and the airlock's proxy port's samples do not carry, and its `broker: answer refused` lines name `port=edge`; the `404` and `405` its router answers are counted and write no line. The metric's HELP text on `GET /metrics` now names all three ports and the edge's `port` label. At the edge a person's per-login bucket is keyed on the person and the caller's address and spent only once the login is opened, an IPv6 caller is keyed on its `/64`, every login the edge opens also spends exactly one token of a bucket all callers share, and a request its device login would refuse spends nothing of it (a burst of 30 and one every two seconds per pod, a constant: callers sending valid authorizations from about 15 addresses can hold new edge device logins at 429 on every pod while they go on, and refresh, polls, trades and the broker's own address are unaffected), and `GET /healthz` pings Postgres at most once a second and logs a failing ping once, naming `port=edge`, never once per caller. A `BROKER_EDGE_URL` that is not `https` refuses the start unless `BROKER_FAKE_SECRETS_FILE` is set. On both listeners a device login's per-person bucket is now spent only after the broker has verified the request and opened the login, so a request it refuses costs the named person nothing.
    A new request object whose `login_hint`, `jti` or any authorization detail's type, identifier, service or action carries a control or format character, U+0000 among them, is now `400 REQUEST_INVALID` before anything is written, on every listener, as such a character in its `reason` already was; a record already stored is read back as before. So is a device authorization whose form holds a control character in any key or value, and a token request whose DPoP proof's `jti` holds one: the store does not keep them. A NUL in any of these used to fail the store's write and answer `500 server_error`. Under `BROKER_TRUSTED_PROXY_HEADER` the caller's address is now the last entry of the header's last line, not of its first, so a line a caller sends before the proxy's picks it no bucket.
