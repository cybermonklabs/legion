kind: Added
body: |-
    The secrets broker can serve a machine login to a person outside the deployment's private network, on an edge of its own: `BROKER_EDGE_LISTEN_ADDR`, `BROKER_EDGE_URL` and `BROKER_EDGE_MACHINE_LOGIN_URL`, set together or not at all, bind a fourth port of the process behind a public load balancer. It serves `POST /v1/oauth/device_authorization`, `POST /v1/oauth/token` and `GET /healthz`, and answers every other path 404. A broker with none of the three settings binds nothing for it and serves as before.
    At the edge a caller's address is the second-to-last `X-Forwarded-For` entry, the one the load balancer appends for the client, and a request with fewer than two entries is `400 REQUEST_INVALID`; its rate-limit buckets are its own, so a flood there spends nothing a caller of `BROKER_PUBLIC_URL` is held to. A machine login naming an address on `BROKER_SIGNIN_DOMAIN` or on a domain the new `BROKER_SIGNIN_WORKSPACE_DOMAINS` lists is `400 EDGE_WORKSPACE_LOGIN` before it spends a bucket or writes a row. The token route takes the device code, a refresh token and the trade of one of the broker's own access tokens with no actor token, and answers every other grant `400 unsupported_grant_type` (`EDGE_GRANT_REFUSED`). Both routes take an `application/x-www-form-urlencoded` body and no other. Request objects and DPoP proofs at the edge name `BROKER_EDGE_URL`, and its `verification_uri` is `BROKER_EDGE_MACHINE_LOGIN_URL`. A login the edge opened is listed, looked up and decided on the broker's own address, as any other, and the launcher credential its approval mints works as any other.
    `config.Load` refuses an edge address whose port is the port of `BROKER_LISTEN_ADDR`, `BROKER_METRICS_LISTEN_ADDR` or `BROKER_AIRLOCK_LISTEN_ADDR`, naming both settings, an edge URL equal to `BROKER_PUBLIC_URL`, and an edge without `BROKER_MACHINE_LOGIN_URL` or with `BROKER_SIGNIN=off`.
