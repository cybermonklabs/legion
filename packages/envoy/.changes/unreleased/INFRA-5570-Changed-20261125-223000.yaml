kind: Changed
body: |-
    `GET /api/v1/artifacts/{id}/text` and its issue and project slug forms serve each reader the
    form it reads. A reader that sends `Dispatch-Asks: 1`, which says it reads the `asks` member,
    is served markdown with none of an ask block's eight server-owned attributes, as every request
    was before. A request without the header, which is every reader of the release before, is
    served the form kept for one release: `selected`, `answer` and `invalid` are taken off every
    ask block, and `state`, `answered_by`, `answered_at`, `copied_from` and `copied_from_document`
    stay as the document holds them, so the `dispatch doc-read` of that release still reads which
    asks are answered or resolved, and by whom. Both forms answer the same `token` and the same
    `asks`, and the answer says `Vary: Dispatch-Asks`.
time: 2026-11-25T22:30:00Z
