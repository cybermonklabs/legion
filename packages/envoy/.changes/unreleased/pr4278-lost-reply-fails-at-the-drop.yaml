kind: Fixed
body: |-
  A NATS request whose reply a dropped connection lost no longer waits for its whole timeout: it
  fails within the moment nats.go reports the loss, with `bus.ErrConnectionLost`, where it waited
  5 s to 10 s. Every request of the listener and its relays but the few AGENTS.md names goes
  through one helper bound to the connection's life (`bus.Request`): the stream read the session
  consumers share, every session consumer call and pull, the connection probe, forwards, KV reads
  and writes, and the JetStream calls of every context the listener opens. A registration, a relay
  restart, a consumer delete, a filter write and a consumer repair that lose a request release the
  session's lock while they wait for the connection, take it again within their own budget, and
  make the request again once it is back. So a session registration sent after a reconnect is
  answered 200 rather than 503: the shared stream read and the relay restart that held the
  session's lock no longer wait out a reply the drop took. A stored write that a second send would
  find refused or answered as a duplicate of itself, a kept-lane cursor write or a publish whose
  caller reads the duplicate verdict, is sent once and answers the loss, so the kept lane reads its
  cursor back instead of taking its own landed write for another listener's. A request that
  nats.go's close of a running client's connection cut off answers `bus.ErrConnectionLost` too,
  and is made again on the connection the client dials to replace it. A request on a client that
  was stopped answers `nats.ErrConnectionClosed`, as before.
