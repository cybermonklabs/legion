kind: Fixed
body: |-
  `POST /v1/interests/subscribe` answers `200` only once the session's known-session record is
  written. The record is what a send to the session is stored on once its entry is gone, as a
  released Legion pod's session's is. On a loaded listener the registration's earlier store work
  could spend its whole 3.5 s budget, and the record's write, the registration's last, was then
  never sent: the registration was answered `200`, and a send to that session once it stopped was
  refused `404 no live session` rather than stored. The write now has a bound of its own, one
  second, and a write that does not land within it is answered as the bus-unavailable `503` with
  `Retry-After: 1`, which both plugins retry. A listener whose NATS user may not open the
  `envoy_known_sessions` bucket writes no record and answers the registration `200`, as before.

  The pi-envoy and claude-envoy releases that carry this change hold that `503`: they tell the
  session nothing for two minutes from the first one, and a registration accepted in that time
  ends the hold. After the two minutes they tell the session once that its registration is not
  recorded for certain, and that Envoy messages may still reach it. Plugins of a release before
  this one, pi-envoy from 17.8.0 and every claude-envoy, tell that `503` at once as a session
  with no durable consumer that receives nothing. That is false: the registration may have made
  its consumer, and messages may still reach the session. So the pod images take those plugin
  releases before the listener moves to this release.

  A registration answered a `503` names no topic that its session's consumer filter leaves out.
  One that fails after its plan, on its session entry's write or on its known-session record's,
  logs the listener's WARN line for each such topic all the same, so a topic that only an earlier
  build's row held does not leave the row without a word.
