kind: Changed
body: 'The broker checks a GitHub App narrowing before it opens an approval request: a narrowing it cannot serve is refused to the caller, naming the repository the installation does not reach or the read access the App does not hold, and no person is asked. `agent-secrets` sends the narrowing with its request, and asks again without it when the broker does not know the field. A `github_app` object with a field a narrowing does not take, or a field of the wrong type, is `400 INVALID_NARROWING` naming `github_app.<field>`, on the request as on the release.'
