kind: Fixed
body: |-
  A repeat the stream recognises is now answered with the copy the stream holds: its `event_id`, `issued_at` and body are the first copy's, with `duplicate: true`, where the listener answered the new envelope it built for the repeat, whose `event_id` no stored message carries. That is a send or a topic publish repeated under a key that names its event (the UUID `idempotency_key` Envoy's clients mint, or a Dispatch send's key), and a role send repeated to the same holder under any key. `POST /v1/messages/publish` now carries `duplicate` on a topic publish and on a role send's `200`, whose stored forward is answered with the forward mark taken off its `dedupe_key`. A verdict that names the request's own first send, which the bus's resend after a closed connection can get, is answered as a new copy, with no `duplicate`, and a send to an unresponsive session answered so is counted in `envoy_sends_unresponsive_total`.
  The listener reads the copy back at the sequence the stream's duplicate verdict named, and answers it whole to the request's own copy and to its own sender, the same `source` and `source_session` and, where the copy names a session and the request presents a secrets-broker token, the session the token proves; anyone else repeating the key learns only that it is taken, the copy's `event_id`, times, `topic`, `dedupe_key` and `expects_reply` with `duplicate: true`, and none of what the other sender wrote, and the request's record line names the copy's `event_id` and the request's own sender. The role send's `202` kept answer, which already answered the kept copy, follows the same rule and says `duplicate: true` for another request's copy, and so does the send route's `202` for a send marked with a role whose claim names another session (`listenerwire.KeptSendResponse` gains `duplicate`). A role send repeated by a session that has since taken the role, which forwards nothing, is answered with the forward this listener's record names for the earlier holder for the same request (the same sender, role and key), rather than with the repeat's own new envelope. The record is the listener's own and lasts 10 minutes; a repeat after that or on another listener answers its own new envelope, as at main. A copy it cannot read, a verdict with sequence 0, a sequence that no longer holds the copy, and a send or topic publish refused while an earlier one under the same message id is in process are answered `503` with `Retry-After: 1` and the body `envoy: the stream already knows this message's id, and no stored copy of it was read: <reason>`, recorded with the outcome `stored_copy_unreadable`, with the code `maybe_stored` where an earlier send of the same publish went unanswered (a resend refused in process, or a resend's duplicate whose copy could not be read), and the same request again gets the copy once it can be read. A role forward refused as in process is tried again, as before. Every answer's `expects_reply` is the answered envelope's, in the request's spelling where the two agree, both `202` kept answers and another sender's shorter answer included.
