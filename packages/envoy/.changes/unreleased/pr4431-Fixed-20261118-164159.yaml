kind: Fixed
body: |-
  A repeat the stream recognises is now answered with the copy the stream holds: its `event_id`, `issued_at` and body are the first copy's, with `duplicate: true`, where the listener answered the new envelope it built for the repeat, whose `event_id` no stored message carries. That is a send or a topic publish repeated under a key that names its event (the UUID `idempotency_key` Envoy's clients mint, or a Dispatch send's key), and a role send repeated to the same holder under any key. `POST /v1/messages/publish` now carries `duplicate` on a topic publish and on a role send's `200`, whose stored forward is answered with the forward mark taken off its `dedupe_key`. A verdict that names the request's own first send, which the bus's resend after a closed connection can get, is answered as a new copy, with no `duplicate`, and a send to an unresponsive session answered so is counted in `envoy_sends_unresponsive_total`.
  The listener reads the copy back at the sequence the stream's duplicate verdict named, and answers it whole to the request's own copy and to its own sender: the same `source` and the `source_session` the copy names and, where the request presents a secrets-broker token, the session the token proves. A copy that names no session is whole only to its own request (the same `event_id`), since no caller can prove it owns it, so the Legion daemon's role messages and Dispatch's sends are read whole by no other caller that names no session. Anyone else repeating the key gets none of what the other sender wrote: a request that sends the new header `Envoy-Reads: key-taken` (`listenerwire.ReadsHeader`) learns only that the key is taken, the copy's `event_id`, times, `topic`, `dedupe_key` and `expects_reply` with `duplicate: true`, and any other request gets the envelope the listener built for it with `duplicate: true`, which every client release parses. Dispatch's client sends the header. The request's record line names the copy's `event_id` and the request's own sender. The role send's `202` kept answer, which already answered the kept copy whole to anyone, follows the same rule and says `duplicate: true` for another request's copy, and so does the send route's `202` for a send marked with a role whose claim names another session (`listenerwire.KeptSendResponse` gains `duplicate`). A role send repeated by a session that has since taken the role, which forwards nothing, is answered with the forward this listener's record names for the earlier holder for the same request (the same sender, role and key), rather than with the repeat's own new envelope. The record names each holder this listener answered a send of that request for: a forward it made, or a repeat it answered from its own record of the key, such as another sender's under the same key or the same sender's to another role the same holder holds. The record is the listener's own and lasts 10 minutes; a repeat after that or on another listener answers its own new envelope, as at main. A copy it cannot read, a verdict with sequence 0, and a sequence that no longer holds the copy are answered `503` with `Retry-After: 1` and the body `envoy: the stream already knows this message's id, and no stored copy of it was read: <reason>`, recorded with the outcome `stored_copy_unreadable`, with the code `maybe_stored` where an earlier send of the same publish went unanswered (a resend's duplicate whose copy could not be read, or a role send's later forward whose copy could not be read after an earlier forward of it went unanswered), and the same request again gets the copy once it can be read. A send, a topic publish or a role forward the stream refuses while an earlier one under the same message id is in process is made again until the stream names that one's copy, which is then answered as a repeat is. Every answer's `expects_reply` is the answered envelope's, in the request's spelling where the two agree, both `202` kept answers and the key-taken answer included.
