kind: Fixed
body: |-
  Dispatch stores more of what a writer sent. A `<` that opens no HTML tag and no autolink, such
  as `<at most 2x>`, and a backtick that no other backtick closes are stored with no backslash
  before them, so a find that quotes the text as sent matches it; a `<` that opens a tag or an
  autolink, and backticks that would pair into a code span, are still escaped. A `<` in a typed
  block's attribute, such as a check's `run="a < b"`, reads back as `<`, not `&lt;`; a `>` there is
  still written `&gt;`. The renderer version rises to 2, so every stored rendering is rendered
  again on its next read. An `insert` whose anchor quotes a block inside a typed block, and a
  `move` whose anchor names or quotes one, put the blocks inside that typed block beside the
  anchor; markdown the block's content rule cannot hold there is refused `400 INSERT_DOES_NOT_FIT`
  for an insert and `400 INVALID_OP` for a move, naming the rule, with the document unchanged. A
  move's answer names the block it moved, also where it moved the block into or out of a typed
  block, and a move into a typed block from just before it no longer answers that it changed
  nothing. A whole-document upload of a document that holds empty paragraphs keeps the block id,
  and so the kept decision, of every block it leaves unchanged after them.
