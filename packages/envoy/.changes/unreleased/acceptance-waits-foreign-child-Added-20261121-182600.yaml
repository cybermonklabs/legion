kind: Added
body: '`PATCH /api/v1/issues/{key}` takes `refuse_open_foreign_children: true` beside a status of `retro` or `done`, and then refuses the write with 409 `FOREIGN_CHILD_OPEN`, naming each child in an `issues` list of `{key, project, status}`, while the issue has a child of another project in any status but `done` and `icebox`. The check and the write run under the deployment dependency lock that every create with a parent and every reparent takes, so no child is filed between them. The field goes only with `retro` or `done` (else 400 `INVALID_ISSUE`). A status write without it, which is every person''s, is taken as before, and a child of the issue''s own project is not read. The Legion daemon''s `sign_off` and `close_root` will send it; a Dispatch of an earlier release ignores the field and writes the status with no check, so this release runs before a daemon that sends it.'
time: 2026-11-21T18:26:00.000000000Z
