kind: Fixed
body: |-
    During a rolling deploy, a server of the release before this one read `dispatch://KEY/decisions` as no reference and an issue's Decisions page link (`/issues/KEY/decisions`) as the issue's retired `decisions.md`. When it re-indexed a text holding either it deleted the issue's reference edge and settled the text's row of `refs_forms_owed`, so nothing re-indexed the text with this release's reading, and the edge stayed lost. Each such text is now owed a re-index in `refs_decisions_forms_owed`, a queue the release before does not know. A trigger relays every row a delete from `refs_forms_owed` removes into it, and a trigger on each table of block references owes the owner of a block edge to the retired document, which that release can add without deleting anything. This release clears the queue's row in the transaction that indexes a source's whole text, in a statement after the delete that relays it, so only a settle by the release before leaves a source owed. The migrations create the queues, the relay and four insert triggers, each in its own migration, and then seed a bootstrap queue of its own, `refs_decisions_forms_seed_owed`, with every stored comment, ask, issue message and document. The seed writes no table a writer of either build inserts into, so it waits for no write and no write waits for it. The server drains the queues in the duty that drains `refs_forms_owed`, a pass of each in one tick, which now takes the lease `refs-forms-decisions`, so a pass of the release before under `refs-forms` no longer skips it, and which stops reading the bootstrap queue once a pass finds it empty.
