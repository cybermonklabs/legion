kind: Added
body: |-
    The broker can read its agent secrets from one 1Password vault: `BROKER_SECRETS_STORE=onepassword`, with `BROKER_ONEPASSWORD_VAULT` (the vault's id), `BROKER_ONEPASSWORD_TOKEN_FILE` (a file holding the token of a service account with `read_items` on that vault) and `BROKER_ONEPASSWORD_DAILY_REQUESTS`. Each secret is an API Credential item titled `BROKER_SECRETS_PREFIX` and its slug, its value the credential field and its tags the fields of the item's section titled `cipher`. Two active items of one title are refused `name-duplicated`, naming both.
    A 1Password account limits its service accounts' requests in a day, so `BROKER_ONEPASSWORD_DAILY_REQUESTS` is the deployment's own budget, every replica together, counted by the hour in the broker's Postgres (a new table, `onepassword_requests`). Lists and rereads hold at four fifths of it and answer their last result; value reads are never held. A reload reads in full only the items that changed, and a value read answers the item a replica keeps for up to six minutes after its last list.
    `agent-secrets secret` writes the vault under `OP_SERVICE_ACCOUNT_TOKEN`, through the 1Password SDK, or else as the person's own `op` is signed in, and the vault's permissions decide each write. `secret delete` archives the item, and `secret restore` refuses, since 1Password has no call that restores an archived item: restore it from the 1Password app's Archive. agent-secrets and the broker link the 1Password SDK, which runs its core as WebAssembly, on darwin, linux and windows; elsewhere agent-secrets runs `op`. `-tags cipher_no_onepassword` builds them without it.
    `dev-broker.sh` runs on a vault with `DEV_BROKER_ONEPASSWORD_VAULT` and `DEV_BROKER_ONEPASSWORD_TOKEN_FILE`, and `store-forms-check.sh --store onepassword` drives every secret form there.
