kind: Changed
custom:
  Issue: pr4682
body: |-
  A broker token that names one project writes the objects of other projects that a credential
  naming no project may write, among them an issue's claim, a project's rows (its default assignee,
  its gated steps and its architecture sources), a comment, an issue's fields, a `blocked_by` link
  to another project's issue, a parent in another project, an issue made in another project, a
  question asked of another project or of every project, the steps of a status change's cascade
  in another project (`POST /api/v1/issues/{key}/status-change` and its dry run: an ancestor that
  `include_parent` moves, a descendant that `include_children` moves, or a child that
  `unlink_children` unlinks), and a result on a check of another
  project's issue with its retraction (`POST /api/v1/issues/{key}/results`, its dry run, and
  `POST /api/v1/results/{id}/retract`), which a parent of another project puts within reach. The one
  exception is a private project that the token does not name, which `access.CredentialCovers` tests
  and which no project is yet. A target that resolves to no project or to nothing is still refused
  `403 PROJECT_SCOPE`, a write of the deployment's is still refused `403 PROJECT_SCOPE_DEPLOYMENT`,
  and the session and person checks stay. The Legion daemon of another project, whose broker token
  proves its session `legion-daemon:<P>`, now writes the step records, step ratings, plans and role
  holders of an issue.
