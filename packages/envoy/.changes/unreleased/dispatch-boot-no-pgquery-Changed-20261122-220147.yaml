kind: Changed
body: |-
  A Dispatch server whose database owes no migration starts in about a third of the time and
  without its 220 MiB start-up heap: a start no longer parses every migration it embeds with
  libpg_query, whose WebAssembly it compiled to do so. A test holds the embedded set to every check
  the start made, and a migration not yet applied is still parsed, and refused, before it runs.
time: 2026-11-22T22:01:47Z
custom:
    Issue: dispatch-boot-no-pgquery
