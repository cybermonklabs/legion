kind: Added
body: |-
  A profile's proxy block may be of kind `dpop`: a capability the secrets broker mints for a grant of its own and holds, so the command holds only a placeholder. On such a block's host the airlock proxy takes a request only when its one `Authorization` header is `DPoP <placeholder>`, refuses an upgrade, swaps in a token the broker minted for the grant, bound to the pod's own P-256 key, signs a DPoP proof of that key for `https://` and the host, and sends the request without the command's forwarding headers. Each broker pod makes its key at start and logs it by its RFC 7638 thumbprint alone (`broker: the proxy's DPoP key`). A minted grant's placeholder opens no tunnel and no plain forward anywhere but its one host (`403 MINTED_GRANT_HOST_ONLY`), and the proxy's own answers say whether the request left (`Cipher-Proxy-Forwarded: false`, `true` or `unknown`, with `Cipher-Proxy-Code`).

  `Validate`, the Lean model's `validate` and `policy.ParseProfiles` take the kind; a kind written in another case, such as `DPoP`, is refused. A dpop profile is a name and its proxy block alone: `source`, `tier`, `requesters`, `maxGrant`, `github` and `google` are each refused on it. A stored secret under a dpop block is never released, to the session or to the proxy: the release is refused `403 MINTED_ONLY`. A broker from before this release refuses a profiles file that names the kind, so the deployment moves to this release before its profiles file names it.

  Each kind of minted capability keeps its grants in a table of its own and answers them through one interface (`requests.MintedKind`). Each grant records the digest of the dpop block and the private destination it was made under, and a broker whose own digest differs refuses the grant (`407 GRANT_NOT_LIVE`) before it mints any token, so a broker of another block or destination on the same database serves none of it. The policy never serves a dpop profile as a secret, whatever the store holds, and a stored secret of its name is not served through it, so nothing of it can be requested or approved; it is no refusal either, so it writes no refused line and counts in no `broker_unservable_secrets` series. A grant of the capability is made by the broker itself, for a kind it names in code, and this release names none yet.
