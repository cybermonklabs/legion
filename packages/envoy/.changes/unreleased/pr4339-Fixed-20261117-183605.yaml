kind: Fixed
body: 'A role claim that names no process (one whose claimant stated no `client_instance_id`: a client of an older build, or a session pod''s claim of its launch role) is no longer freed by any release of its session, nor taken by any registration of its session that states a process. An absent process matches nothing in a release, so only the administrator''s force frees such a claim, and a hand-back that states no process marks it handed back for the role claim reaper, as it marks a claim that names a process. A registration that states a process adopts a claim that names none only while no registration that states none has renewed it, which that renewal records in the claim''s new optional `renewed_without_process` field. An older client''s clean stop therefore frees its role after about ten minutes rather than at once. A soft `POST /v1/roles/set` over a marked claim that names no process is now refused `409` until the claim''s renewal is older than the live window or the reaper frees it, where the hand-back used to free the claim; an outright claim (no `soft`) takes it back at once.'
