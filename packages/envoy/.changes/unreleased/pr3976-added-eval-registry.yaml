kind: Added
body: |-
  Dispatch keeps an eval registry: every number it measures of a project's delivery, pipeline and
  Legion work is a row of `eval_versions` (its question, the decision it changes, its failure modes,
  unit, direction, target, owner and the exported fold that computes it), with its series in
  `eval_series`, logged readings in `eval_readings`, and a section of the project's `evals-md`
  document holding its method. Every project is seeded with the catalogue when it is created and
  by the day-row refresher's first pass in each process. `GET /api/v1/projects/{key}/evals` folds
  each eval's stored per-day rows (`eval_days`) for a window and an optional compare range, with
  the verdict against its target and the first day it has data; `GET .../evals/{slug}` answers
  its versions and its method text;
  `GET .../evals/{slug}/items` answers the rows behind a number in one shape for every row kind;
  `POST .../evals/{slug}/readings` takes a batch of readings under an `Idempotency-Key`, whole or
  not at all, and registers a slug no row holds; `POST /api/v1/projects/{key}/evals` registers or
  changes a definition; `PUT` and `DELETE` of a reading answer `405 READING_APPEND_ONLY`; and
  `GET /api/v1/evals` reads every project, or the ones named. A refresher keeps the day rows true
  to their inputs from the delivery change feed, issue events and a daily tick, and the live hub
  has an `evals` view that wakes when a reading, a version or a day row of its project lands.
  A readings write writes, in its own transaction, the zero rows of the days its readings leave
  owed, so a first reading, or one before a series' first day, reaches an open evals view as one
  delta. A walk writes one day of every owner key in one transaction, and a window that holds a
  day the walks have not built reads "no data". The count of open P0 issues with no owner is
  stored for each repository that holds one, so a read of one repository answers that
  repository's count. A read that names a repository finds its rows under every spelling the
  stored rows hold that differs from it only in case.
  The eval writes, the refresher's and the Legion facts' record their changes in an outbox,
  `delivery_changes_pending`, and never take the delivery change log's lock: a drain moves them
  into `delivery_changes` 250 at a time, each batch a short statement of its own, run by each
  eval write for one batch right after its commit, by each Legion facts pass right after its
  commit, by the live hub before each read,
  by the refresher at each pass and by the server's boot before it serves, so a correction of
  1,400 readings holds no lock the delivery intake waits on, and no burst holds it longer than one
  batch.
  A change whose writer died before its drain is moved by the next drain of any process, or else
  by the next server's boot before it serves. A run's jobs write is one statement that takes the
  jobs in their names' order, so two listings of one run in opposite orders no longer deadlock;
  the `issue.deployed` write marks its pull request in its last statement; and a session group's
  write runs its reads, the title rule's read of every pull request among them, before it takes
  the change log's lock, and sends its writes after the lock in one round trip. So each table has
  one position for that lock: every path takes it before the table's row locks or in the
  statement that ends its transaction.
  A write that registers an eval writes its section of `evals-md` in the same transaction as its
  versions, readings and day rows, so no eval exists without its section: it renders the section
  before it stores anything and the section's writes go to Postgres in one batch after the eval's
  rows, so it holds a transaction id only for its database statements, never while it renders the
  document. Concurrent registrations of one project queue on the document's owner lock, a lock
  that assigns no transaction id, so a queued one holds back no live event reader.
  The per-issue Legion facts also store parked, queued and slot-wait hours, the role bars with
  their segments, idle hours by role, the hours after the first review, the children and the
  started and merged times, and the filings a Legion session made are stored in `issue_filings`.
  An issue's merged time, its facts' and its Legion items' `merged_at`, is the merge time Dispatch
  stores for its pull request and nothing else: where none is stored it is null, and no read
  fetches it from GitHub.
