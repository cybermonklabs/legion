kind: Added
body: |-
  `spec-check state --scenario <dir>` prints, at each subject of a scenario of The Spec, the state
  of each statement (not built, met, not met or unknown) and of each check (true, false or unknown,
  with its reason), whether each wait on a statement ends at the head of main, and the cycle of
  waits; `--json` prints the states as JSON. A run of a check of the code counts only at the
  commit that it read, and a failing example at the commit that it counts from, its `planted_on`
  for a program check of the code; a failing example that the check's test caught, and a run of the
  test of a program check of production or of the graph, also count at another commit where no file
  of the check's tie changed, and one that the test missed never does. The command reads each
  file of the scenario strictly and refuses, with exit
  2 and a line that names the file, a member it does not know, a value of the wrong form, or spec
  files that `spec-check tree` refuses.
