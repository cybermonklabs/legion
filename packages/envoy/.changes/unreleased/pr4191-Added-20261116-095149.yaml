kind: Added
body: 'spec-check state derives the state of each check and each statement of a scenario of The Spec at each of its subjects, says whether each wait on a statement ends at the head of main, and names the cycle of waits; --json prints the states as JSON. It refuses spec files that spec-check tree refuses, and state, compare and print read each JSON file strictly: a byte that is not UTF-8, a member written in other letters or given two times, or a null at any place, is exit 2, and a value of another type is exit 2 with the form of the file and the place of the value. A statement follows the states of the statements under it and of the statements that support it at each level. The derivation (specgraph.Derive) reads a check unknown when its failing example has no letter and no digit, and a statement that other statements support and that has no check of its own unknown, as a leaf with no check, and each check and statement that the rules of spec-check tree refuse never reads true or met; state refuses such spec files first, as tree does. A check reads unknown (fault_by_test_author) when the record of the failing example of a program check names no author of the test or of the fault. A failing example of a program check of the code counts from the commit that the step planted its fault on (planted_on), and never at a subject at its own commit, the one that CI tested, whatever planted_on names, and only when it names one path of the fault or more (fault_paths), each a source file (.go, .ts or .tsx) and no file of a test (a name that ends in _test.go, .test.ts, .test.tsx or .e2e.ts, or a directory that starts with test, ends with test or tests, or is __tests__ or e2e), and each covered by the check''s tie at planted_on where that tie is known; a refusal by CI at planted_on takes it out. A record with no planted_on, with no fault path or only fault paths of only white space, which are no paths, with such a path beside a real one, or with its own commit as planted_on counts nowhere, and no refusal by CI takes it out; when it is the newest failing example of its check the check reads unknown (no_planted_on, no_fault_paths, blank_fault_path or planted_on_tested_commit). A record whose planted_on names no commit of the history counts nowhere too, and as the newest failing example it reads unknown (planted_on_outside_history), with that commit in the detail and in the state line. A scenario''s ties.json holds the tie of each check by commit, {"<commit>":{"<check id>":[…]}}, and a result at one commit counts at another only when the check''s tie is known at both commits and no path that changed between them is covered by the tie at either commit. A run of a program check of production or of the graph counts only where a result at the commit of the test that ran (test_commit) counts at the subject''s commit by that rule; such a check keeps the newest result of each leg of its job, so a leg that failed or left no result keeps it from reading true; and a pass and a failure at one transaction of the graph read unknown. A result counts only at the subject that it read: a check of production or of the graph is judged only at a subject that names a deploy, and there a check of the graph counts only the results at the subject''s graph_tx, so it reads unknown when the subject names no graph_tx or one that no result read, and a run of a check of the graph names its transaction, a run that could not run the one that it tried to read, so it counts there alone. Each member of each input type has a mark that says how it reads when its writer does not set it: a member marked nonzero, present or one of that an input does not set is refused, by the reader and by the library alike, and a member marked zero reads as the value that its mark states, unless a rule of its type refuses it where the derivation reads it. A member marked present has a type whose zero means "not set": Leg of a result and of a job run is a *string, Ended of a job run and Removed and PartlyChecked of an approved node are *bool, and a nil list of commits or of a unit is not set. Of the 19 members marked zero, the twelve that a file can leave out (graph_tx of a subject, parent of a commit, and commit, deploy, graph_tx, job, attempt, fault_author, test_authors, test_commit, planted_on and fault_paths of a result) move no state toward true when a file leaves one out, as a failing example of a program check with no fault_author reads unknown (fault_by_test_author), and one of a program check of the code with no planted_on or no fault_paths, newer than one that counts, reads unknown (no_planted_on or no_fault_paths). The other seven are the library''s: an Input with no Files, Approved or Results and an Approved with no Nodes read as none, a Tie with no Why gives no reason, a Tie with no Known is not known, and a known Tie with no Paths is refused, as is a Tie that is not known and holds a path. The Ties and the History of an Input are marked nonzero, since with no tie or no history no result carries, so a caller that has none gives CommitTies{} or FixtureHistory{Commits: []FixtureCommit{}}, and FixtureHistory{} is refused; a Tie that is not Known carries no result, as R8 reads a check whose tie is unknown, so only the results at the subject''s commit count, and a check can then read true where a result that would carry makes it read otherwise. So these are exit 2, and specgraph.Derive and specgraph.CheckStates give an error and no state for the same input: a result with no at or no seq from 1, a run with no subject of its check''s kind and a failing example of a check of the code with no commit, a run of a program check with no job when the check''s text names its job, a result of a program check of production or of the graph with no test_commit, two results of one check at one at and one seq, a subject with no commit or no now or that sets both branch and deploy or neither, graph_tx on the head of a branch, a result that names two subjects, a result of a check of production or of the graph that names a commit, a name of no letter and no digit (a commit, check, job, leg, deploy, graph_tx, branch or unit, as a value or as a key of ties.json or uncited.json, and planted_on), a fault path that is no repository path, a history.json that does not set commits, a commit with no files, with a tree of no path, with a path that is no repository path (an empty part, . or .., or a leading, trailing or doubled /) or with a content label of no letter and no digit ("" or " "), a rule "" in uncited.json, a result or a job run that leaves out leg ("" for no matrix), runs or run results of one job at one commit in the leg "" and in a named leg, the commit of a run result being its commit, else the test_commit of a program check of production or of the graph, and none for a run result of a query or an agent of production or of the graph, whatever test_commit it names, a job run with no job or commit or that leaves out ended, a run of a check of the graph with no graph_tx, and a unit with no id or that does not set serves, needs or waits_on; the library also refuses an approved node under another key than its id, a nil value of any type that implements History, a GitHistory with no Dir, no History, no Ties or a commit of Ties with no map, a Tie that is not Known and holds a path, and no JobRuns or Uncited (empty for none), and a GitHistory whose directory is no clone or that cannot read a tree gives an error that names the directory and git''s own reason; and specgraph.WaitCycle gives an error for the same units. Of two faults of one file, the refusal names the least place, whatever the order of a map. A time of the files is RFC 3339 with an upper-case T, and Z or an offset, and the zero instant of year 1 is no time. state, compare and print, and the library''s Derive and CheckStates for an approved spec that their caller builds, refuse a node of approved.json that sets no removed or no partly_checked, or whose block has an id that is no id, or a parent or a node that it serves, is about or joins that names no node of the approved spec, kept or removed, of the kind that the files ask for, or that is a check whose block leaves out serves, since a check serves one statement, and an approved spec with a loop of parent and support relations among its current statements; a statement or a component that leaves out its parent is at the top of the tree. Derive also gives an error, and no state, that names each current statement that it gives no state of once, as a loop past its entry would make. A refusal of a scenario''s file prints a long value of the writer, such as a commit, a check or a unit, by its first and its last 50 bytes. A scenario holds uncited.json, {} when CI refused no check. A job run sets ended, false for a run that has not ended. A run of the job of a check counts at each commit whose results of the check count at the subject, its own commit among them, whether or not that commit holds a result of the check: for a check of the code or a program check, a leg that has a result that counts reads that result, whether or not its run has ended, and of the legs with no result that counts, one whose run ended makes the check read unknown (ci_fault), else one whose run has not ended unknown (no_result), never a pass; with no run of the check that counts, a run of its job that ended makes it read unknown (ci_fault), and else it reads unknown (subject_moved) or unknown (no_result). R48 says that at a refused commit such a check reads unknown and no earlier result of it counts, so a refusal by CI at the subject''s commit makes the check read unknown (uncited) with the refusal''s rule, whatever else holds there: its own results before or after the refusal, a result carried from another commit, or newer evidence of another commit. The refused commit''s own results count nowhere, at it or where R8 would carry them, so a check whose only results that count are those reads unknown (uncited), with the least rule by its name; the own results of every other commit are R7''s and R8''s, whatever CI refused elsewhere, so a pass and a failure of one commit still read unknown (disagree), and whether a result carries across the refused commit is the question of the ties and the history. GitHistory gives the same changed paths whatever the settings of the clone or of the machine, such as ignore = all for a moved submodule, a replace ref, diff.relative or a GIT_DIR of the process.'
