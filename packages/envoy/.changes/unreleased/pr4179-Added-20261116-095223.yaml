kind: Added
body: "Dispatch refuses an approval request or a person's approval when a covered text breaks the form of The Spec. A text is covered when its document is under a root of The Spec, and the setting DISPATCH_SPEC_ROOTS names the roots. The refusal is 409 SPEC_FORM, and it names each text and its rule. Its first line counts the texts that break the form, and findings_total counts the findings. A carry of an approval to a new version passes the same gate, and it judges the same documents as the person's own Approve. So no approval carries to a version whose text breaks the form, and no carry answers a request that names such a document. A document service with no gate, such as a backfill command's, carries no approval. The texts of The Spec are a statement, the claim and the procedure of a check, the purpose of a component and the definition of a term, and Dispatch judges no other prose. Dispatch reads the blocks of a document as each other reader does, also in a block quote, a list item or a callout. Each text is the text that a person reads, so a character reference is its character and a hard break is a space. A link is its words and an image is its alternative text. The rules of links, of the names of records and of people read the words exactly as the page shows them, so code font hides no name or link. They also read each address and title of a link or an image. A footnote that a text refers to is part of that text, and a definition can stand wholly in its footnote. A heading opens or closes a part of Terms only inside its own container. A statement breaks the form when it has no sentence or more than two sentences. A text such as 42 has no word with a letter, so it has no sentence. A full stop, an exclamation mark or a question mark ends a sentence when white space or the end of the text follows it. Closing quotes or brackets after the stop belong to its sentence. An initialism of single letters such as U.S. is one word, and none of its stops ends a sentence, also the last one before a space. A stop that an upper-case letter follows with no space, as in Web.Config, breaks the form with the rule stop-no-space. Its finding tells the writer to put a space after the stop or to put the name in code font. A word that starts with a scheme and //, or with www., is an address that the words show, such as https://example.com/Web.Config: it is one word, and no stop in it breaks that rule. Each hard finding of ste-lint breaks the form too, with the name that ste-lint gives the rule, such as ste100-long-sentence. A pull request or an incident is named only by a form that only a name has, such as #12, number 12 or INC-12. The address of a pull request has the host github.com or www.github.com in any case. Each form of a name is a whole word: a character of a word right before it or right after it makes it part of a longer word, which names nothing. A character of a word is a letter, a mark, a decimal digit or an underscore, of any script, so the colour #12abcd names no pull request. Some forms also continue with other characters: an @ before a handle and a / or an @ after it, so the package @types/node names no person, a ., - or / before owner/repo#n, a . or - before the host of a pull request's address, and a : that no white space follows after an email address, so the SSH address git@github.com:owner/repo.git names no person. An email address and a handle take the letters of any script into their own parts, so an accented name in one is still a person. A colour made only of digits, such as #000000, has the form of a number of a pull request. A bare key of a project of Dispatch, or a bare id, names a record of Dispatch, and its finding says that it names the record by its key or its id. A bare number after the words is a count, and the finding lists the forms that the rule reads. A person's name is the name of one person who signed in, the parts of that person's email in order, each with a capital letter. A name has two parts or more, and each part has three letters or more. Each part is a whole word, so Ada Lovelace2 names no person. A word of an approved component name or term is a whole word too, so the approved name Dispatch_Admin does not hide the name Dispatch Admin. A letter with a combining mark and the same letter as one character are not compared, so a name in one form names no person whose email holds the other. The rules also read the name of a term. A line under a heading Terms that is no term line breaks the form, and a decision block's question line is such a line. Its finding names both ways out: a line that defines no term, such as an example or a note, moves out from under the heading, and a decision block goes above it. A browser edit can store a version that the parser refuses, and such a version breaks the form of a judgment that names it, with the rule unreadable. Another approved document whose approved version the parser refuses refuses nothing, and each answer names it in unread. GET /api/v1/artifacts/{id}/spec-form shows the same findings before a request. A reopen or the repair pass leaves such a request resolved, with the findings as its reason."
