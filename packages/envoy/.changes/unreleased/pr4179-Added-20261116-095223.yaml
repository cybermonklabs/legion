kind: Added
body: "Dispatch refuses an approval request or a person's approval when a covered text breaks the form of The Spec. A text is covered when its document is under a root of The Spec, and the setting DISPATCH_SPEC_ROOTS names the roots. The refusal is 409 SPEC_FORM, and it names each text and its rule. Its first line counts the texts that break the form, and findings_total counts the findings. A carry of an approval to a new version passes the same gate, and it judges the same documents as the person's own Approve. So no approval carries to a version whose text breaks the form, and no carry answers a request that names such a document. A document service with no gate, such as a backfill command's, carries no approval. The texts of The Spec are a statement, the claim and the procedure of a check, the purpose of a component and the definition of a term, and Dispatch judges no other prose. Dispatch reads the blocks of a document as each other reader does, also in a block quote, a list item or a callout. Each text is the text that a person reads, so a character reference is its character and a hard break is a space. A link is its words and an image is its alternative text. The rules of links, of the names of records and of people read the words exactly as the page shows them, so code font hides no name or link. They also read each address and title of a link or an image. A footnote that a text refers to is part of that text, and a definition can stand wholly in its footnote. A heading opens or closes a part of Terms only inside its own container. A statement breaks the form when it has no sentence or more than two sentences. A text such as 42 has no word with a letter, so it has no sentence. A full stop, an exclamation mark or a question mark ends a sentence when white space or the end of the text follows it. Closing quotes or brackets after the stop belong to its sentence. An initialism of single letters such as U.S. is one word, and none of its stops ends a sentence, also the last one before a space. A stop that an upper-case letter follows with no space, as in Web.Config, breaks the form with the rule stop-no-space. Its finding tells the writer to put a space after the stop or to put the name in code font. An address that the words show, such as https://example.com/Web.Config, is one word, and no stop in it breaks that rule. Each hard finding of ste-lint breaks the form too, with the name that ste-lint gives the rule, such as ste100-long-sentence. A pull request or an incident is named only by a form that only a name has, such as #12, number 12 or INC-12. The address of a pull request has the host github.com or www.github.com in any case. A bare number after the words is a count, and the finding lists the forms that the rule reads. A person's name is the name of one person who signed in, the parts of that person's email in order, each with a capital letter. A name has two parts or more, and each part has three letters or more. The rules also read the name of a term. A line under a heading Terms that is no term line breaks the form, and a decision block's question line is such a line. Its finding says that a decision block goes above the heading. A browser edit can store a version that the parser refuses, and such a version breaks the form of a judgment that names it, with the rule unreadable. Another approved document whose approved version the parser refuses refuses nothing, and each answer names it in unread. GET /api/v1/artifacts/{id}/spec-form shows the same findings before a request. A reopen or the repair pass leaves such a request resolved, with the findings as its reason."
