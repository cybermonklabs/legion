kind: Changed
body: An `after_merge` check result is current while its commit is on the branch the check's issue's pull request merged into or on the repository's default branch, and on the default branch alone where Dispatch holds no merge of that issue; a base branch GitHub no longer holds answers that the commit is not on it rather than unknown, and a merge records its own merge commit as on its base branch, so a squash-merged issue's merge commit stays current after that branch is deleted. A `default_branch` result is current only on the repository's default branch, whatever branch the pull request merged into. The answer is cached per repository, branch and commit in the new `branch_commits` table, so one branch's answer is never read for another.
