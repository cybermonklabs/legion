kind: Added
body: |-
  `natsgrant.WithinProjects` holds a Legion daemon's NATS grant to the projects its token lists:
  its own reply prefix (`natsgrant.InboxPrefix`) in place of `_INBOX.>`, the scope's issue,
  role-exception and Legion lanes, and its own consumers under each project, each create naming
  its one filter. It keeps every repository's GitHub events (`notifications.github.>`) whole, and
  each project has one GitHub consumer, `legion-go-<project>-github`, on that family: a GitHub
  event is a message of no project, and the grant names no repository. It drops the stream's info
  and stored-message get, and refuses, naming the entry, any other stored-message read, a
  filterless consumer create, a KV bucket's call, `notifications.>`, any entry it does not know,
  and a grant that would end with an empty publish or subscribe list. The auth service answers a
  daemon entry held to its exchange projects (`-`) with it; no deployment lists one until the
  daemon and every listener run the change that moves their consumers and wake reports, and each
  `legion-go-<project>-*` durable filters on its own kind's lane only, since its info, pull and
  acknowledgements name a consumer, not its filter, so the grant reads a wider durable whole.
