kind: Fixed
body: |-
  The listener's self-health check now covers the role lane. When the NATS server refused or
  revoked the role lane's subscription, the server reported it once, `/healthz` answered `503
  role lane subscription inactive` for as long as it lasted, and the check logged nothing, so an
  alert on `self-health probe failed` did not fire or did not stay open. Now the check logs that
  line every 30 seconds while the lane forwards nothing, and logs `self-health recovered` once it
  is back. An alert should match the line's `msg`: its `error` is `role lane subscription
  inactive` alone only while nothing else fails, since a cache or durable failure is reported
  first, and a failed send adds its own cause. A role lane fault never restarts the listener: a
  probe after a rebuild that finds the lane alone failing counts as the rebuild's recovery.

  The lane also comes back after a configuration reload gives its grant back. Such a reload keeps
  the connection, and nothing sent the refused subscription again: only a reconnect or a restart
  of the listener did. Now, while the server refuses the lane's subscription on a connection that
  stays up, each check sends it again (`bus.Client.ResendRefusedCore`), in the shared queue group
  and then in the machine's, as the lane's start does. So a reload that takes away only the shared
  group's grant leaves the lane in the machine's group, as a restart would. The lane reads
  inactive until the server has accepted a send, and a send never answers the refusal of the
  session before a reconnect. While the grant stays missing, each check costs one subscription,
  one refusal from the server and one `envoy nats async error` line in each of the two groups,
  every 30 seconds.
