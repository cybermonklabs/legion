kind: Fixed
body: |-
  The broker's check of its sign-in client now reads the issuer's OAuth error only from an answer
  of 400 or 401, as a refresh does: an answer of 429 or 5xx is now `issuer_unreachable`, whatever
  error its body names. Before, such an answer naming `invalid_grant` read as `ready` and one
  naming `invalid_client` as `client_rejected`, so the broker published a verdict on its client
  from an issuer that could not answer. The broker's sign-in status follows the same rule: a code
  exchange answered 429 or 5xx no longer writes the error its body names as
  `last_failed_sign_in_reason`. The agent-secrets helper reads the broker's own answers the same
  way: a refresh of the machine login answered 5xx naming `invalid_grant` now keeps the login and
  is retried, where it deleted the machine file, and a login poll answered 429 or 5xx naming
  `access_denied` or `expired_token` now polls again, where it recorded the login denied or
  expired.
