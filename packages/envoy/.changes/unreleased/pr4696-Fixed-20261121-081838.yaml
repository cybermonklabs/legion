kind: Fixed
body: |-
  The broker's check of its sign-in client now reads the issuer's OAuth error only from a 4xx
  answer other than 408 and 429: an answer of 408, 429 or 5xx is now `issuer_unreachable`,
  whatever error its body names. Before, such an answer naming `invalid_grant` read as `ready`
  and one naming `invalid_client` as `client_rejected`, so the broker published a verdict on its
  client from an issuer that could not answer. A sign-in's code exchange follows the same rule:
  one the token endpoint answers 408, 429 or 5xx, whatever error its body names, or does not
  answer, is now the issuer being unavailable. Dispatch's callback answers it
  `503 SIGNIN_UNAVAILABLE` where it answered 502, and the broker's approval page answers it 503
  "Sign-in unavailable" where it said the provider's answer did not verify, and writes
  `issuer_unreachable` as `last_failed_sign_in_reason` where it wrote the error the body named, or
  nothing. An exchange the token endpoint refuses, any other 4xx naming an OAuth error, is
  answered as before. The agent-secrets helper reads the broker's own answers the same way: a
  login poll answered 408, 429 or 5xx naming `access_denied` or `expired_token` now polls again,
  where it recorded the login denied or expired, and a refresh of the machine login ends the login
  only on a 400 or 401 naming `invalid_grant`, as Dispatch's refresh ends a sign-in: one answered
  5xx naming `invalid_grant` now keeps the login and is retried, where it deleted the machine file.
  The broker's mint of a google-login secret reads Google's `invalid_grant` the same way: a 5xx
  naming it is now Google's failure (`upstream`), not a login that needs a new sign-in (`refused`).
