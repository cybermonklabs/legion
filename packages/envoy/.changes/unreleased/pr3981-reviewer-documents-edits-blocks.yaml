kind: Added
body: |-
  The reviewer also reads documents, edits and decision blocks.
  `DISPATCH_REVIEWER_DOCUMENTS` (`off` or `after`, default `off`) reviews an agent's document
  version after it saves. No document is held.
  An agent's edit of an ask, a comment or an issue's title is reviewed after it saves when that
  kind's setting is `after` or `hold`. The findings go to the writer as advice.
  `DISPATCH_REVIEWER_DECISION_BLOCKS` (`off`, `after` or `hold`, default `off`) covers a decision
  block an agent writes in a document. With `hold`, the block shows in its document but stays out
  of every Inbox, the open-ask lists and counts (`GET /api/v1/asks/open` and `dispatch open-asks`
  among them, its writer's own included), the notices, the issue's "Waiting on you" and its
  Decisions view's open questions until it posts, however often its writer's edit or a review
  taken again starts its review again. Its ask lists and its ask read carry
  `held_for_review: true` meanwhile: the issue page's tree draws it without marking it as waiting
  on the reader, and its next-question key passes over it; the page's Decisions view neither lists
  nor counts it, and the margin's open asks and the document's open-decisions count leave it out.
  Then the block shows everywhere, with a new quiet event `ask.reviewed`. A rewrite the review
  applies goes into a new version of the document first.
