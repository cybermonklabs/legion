kind: Added
body: 'Dispatch''s plan write (`PUT /api/v1/issues/{key}/plans/{id}`) takes `needs` on each task, the ids of the tasks of the plan it needs, and refuses a need that names no task of the plan with `400 PLAN_INPUT`. A task written with no `needs`, as a daemon of the release before writes it, reads `null`, which is not `[]`. The steps read (`GET /api/v1/issues/{key}/steps`) lists the tasks of the issue''s newest plan first, in the plan''s order, each with `needs` and `planned`: each step the plan gives the task, at `not started`, `running` or its newest run''s result in the plan''s own run. A planned task none of whose steps ran answers `steps: []`. The issue page''s Steps tab draws each task''s needs, `Needs not recorded` where its plan node records none, and its planned steps before its runs. The form of a task the step write and the plan write hold their task to is now the one generated from `packages/contracts` (`contracts.StepTaskPattern`), which `github.com/sjawhar/envoy/steprecord` serves to the Legion daemon as well, and the refusal of a task outside it says "at most 64 bytes" where it said "at most 64".'
