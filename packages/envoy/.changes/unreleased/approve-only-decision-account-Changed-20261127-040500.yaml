kind: Changed
body: |-
  An approve-only token approves and denies a machine login as its person. `POST /api/v1/credential-requests/{id}/approve` and `/deny` accept the approve-only token, the token Cipher's proxy spends for a person's approve grant; they refuse every other broker-issued token `403 OAUTH_SCOPE_REQUIRED` as before, and no broker-issued token mints a personal token. Where the account binding holds, once the request's body has arrived, the decision compares the token's account (its `sub` and its issuer) with the one Dispatch records for the person's address, under the address's lock: a token that records no account Dispatch can name is `401 BROKER_TOKEN_RECORDS_NO_ACCOUNT`, and one whose account no longer holds the address (replaced after the token was admitted, while the request's body was held back, included) is `401 BROKER_TOKEN_NOT_ACTIVE` where a broker revocation names its account and `401 BROKER_ACCOUNT_NOT_SIGNED_IN` where none does. Where the binding does not hold (a deployment whose sign-in records no accounts, or a fleet holding a build without the binding), the token's decision is relayed as a browser's is there, with the address's session generation and no account. Either way, under the two Google sign-in rules, a person Dispatch records a hold of is `401 MEMBERSHIP_HELD`. As for every caller, the approve names the account and the session generation only to a broker whose settings say it takes the approver fields (`approver_fields`), and the approver and the code alone to one whose settings answer without them; settings that cannot be read are `503 AGENT_SECRETS_SETTINGS_UNREAD`. The deny names no account and reads no settings, as every deny. A restricted member's approve-only token still decides nothing, and every other caller's approve and deny are unchanged.
