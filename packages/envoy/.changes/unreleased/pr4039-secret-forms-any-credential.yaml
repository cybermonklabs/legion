kind: Changed
body: |-
  `agent-secrets secret` (list, show, create, set, retag, delete, restore) uses the cloud
  credential its environment gives it, for reads and writes alike, and refuses none for the kind
  of identity it is: the store's IAM decides what it may change. On Google Cloud that is
  `CLOUDSDK_AUTH_ACCESS_TOKEN` when it is set, else the Application Default Credentials of any
  type, else the gcloud login gcloud itself would use, whatever kind of account it is; on AWS,
  any sign-in in the broker's account, which the forms still check against the KMS key ARN.
  A write no longer has to run under a person's own sign-in, and a lent Google access token now
  writes any secret IAM lets it, not only a new one its owner owns. A refusal of the store's own
  names the identity it refused. `--owner` takes a person's email beside `me` and `shared`, on
  create and on retag; `--owner me` is refused (exit 2), naming `--owner <email>`, where the
  credential names no person, such as a machine's role, a service account or a token minted
  without an email scope.
