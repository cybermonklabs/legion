kind: Changed
body: |-
    The check states settler keeps computing and publishing the state of each `before_merge`
    check at each former head of an open pull request, a head the pull request left while it is
    open: a result recorded or retracted there, a change of a check's words or a settled CI run
    there publishes the new state there, with the event naming that head and that pull request, as
    at an open head. Before, a head the pull request left had its rows deleted with no event, so a
    tester's results at the head it tested, recorded after a push moved the pull request on,
    published nothing, and Legion moved the issue on the states from before the push. New table
    `pull_request_former_heads` keeps each head an open pull request left. Each write of
    `pull_request_heads` that can move a pull request's history appends a record of it, by a
    trigger, in the transaction of the write, whichever build wrote it
    (`pull_request_former_heads_moves`, migration `20261126005348`, one transaction with the tables
    and the seed), and the settler applies a pull request's records, under that pull request's lock,
    before it reads its former heads (`pull_request_former_heads_fold`), and each pass applies the
    records no settle reached, so a head is kept whether or not a settle ran while the pull request
    was there. No trigger of the change makes a writer wait for a lock: each only reads, appends
    one row to a table with no key and marks an issue owed, and the settler alone rewrites the
    record, under the issue's lease and the pull request's lock, which no writer takes, so no trigger
    closes a cycle with the owner locks and the rows the writers take in their own orders, as one
    that locked would with a result written while a head write waits for the result's owner lock.
    The install seeds, as
    unverified candidates, the commits of the results the settle of each open pull request's issue
    reads, recorded on any issue against a check of that issue's Verification document, other than
    its head, and marks those issues owed; the settler asks GitHub once which candidates are each
    such pull request's own commits and keeps those: a commit GitHub's comparison of the head and
    the base revision Dispatch stores for the pull request lists (`compare/{base}...{head}`, five
    pages of 100), and, past those pages, a commit the head holds and the base revision does not,
    by two comparisons at those two commits, so every answer is about the two revisions Dispatch
    stores whatever GitHub's pull request stands at while it is read, and no read by the pull
    request's number or a branch's name decides a commit; a read of the pull request first only
    tells whether GitHub has moved it on from those revisions, and then decides nothing (only an
    answer about a commit drops it; any failed read keeps the commits it would have decided, and
    the settle keeps every obligation it read that asked for the read, each mark with
    `check_states_owed.reads_from`, due after the backoff, which the `test` handoff's fence waits
    for, so the backoff never releases the fence while a commit that may be a former head is
    undecided, and a mark that commits after a handoff began, with a lower id than those it waits
    for, never stands in for them; a claim another settle holds and an answer whose claim,
    lifecycle or snapshot moved since the read keep them the same way, due a second on, a pull
    request GitHub moved to a head or a base revision no write has stored yet and a row that stores
    no base revision after the backoff, and any settle of the issue that resolves the read deletes
    them), one read for a pull request whichever issue it moves to, since a settle claims the read
    by the pull request's identity
    (`pull_request_former_heads_claim`, `pull_request_former_heads_reads`) and a settle of another
    issue leaves it to that claim; the answer, positive or negative, is applied by one statement
    and no other path (`pull_request_former_heads_answer`), which under the pull request's lock
    gives the claim back by its token and applies only where the claim is still live, the pull
    request's generation and its snapshot of heads, base branches and base revisions are as the
    claim read them, so the row the read went by still stores the two commits compared, and each
    candidate keeps the incarnation read
    (`pull_request_former_heads.incarnation`, drawn anew at each change of the row), so an answer
    about a claim that ran out or was taken over, an ended lifecycle, a moved head, a base revision
    stored anew or a replaced candidate applies nothing and the candidates are read again, with the
    obligation that asked for the read kept; the base revision is the commit the base branch
    was at when the pull request was last read, which every writer of `pull_request_heads` now
    stores beside the branch's name (`pull_request_heads.base_sha`, migration `20261126005346`,
    from GitHub's `base.sha` in a read of the pull request and from the listener's new `base_sha`
    field of the `pull_request` envelope), since a base branch moves with no change of its name;
    a row with none, written before this release or by an envelope without the field, is not read
    until a write stores one, which the reconcile's read of each open pull request does: of n rows
    due in its first selection, the open rows due and the merged rows no read has reached (the
    merged rows of an older attribution rule take only the room those leave, at most 50 a pass),
    it tries each within ceil(n/200) passes that try their whole batch, each stamp acknowledged,
    whatever their reads answer, a row never tried first, and a pass a rate limit stops leaves the
    rows it did not try in their places, so the next pass takes them first
    (`pull_request_heads.attempted_at`, migration `20261126005347`, which the reconcile stamps
    just before each row's read, and orders its batch by with `checked_at`, so a row whose reads
    fail no longer holds the front of every batch; a stamp whose call times out or loses its
    connection may still commit with no read, at a moment the reconcile never learns, so the bound
    counts no pass with such a stamp and holds again only once the stamp has settled, with no bound
    while such stamps recur, and the stamp stores no base revision); only
    a candidate a `before_merge` check needs is read,
    a commit a result of such a check of the issue's Verification document was recorded at, so a
    candidate whose results are
    all of a check of another `when` holds no obligation and no `test` handoff, and an issue with
    no `before_merge` check is not held by its candidates; it is read once a check with a result
    there becomes `before_merge`, whose change owes the issue a settle; a verification's log line
    counts its HTTP requests apart from
    its pages (`requests`), and each settle's line its verifications and their requests; so
    a head left before the release where a result was recorded publishes its states,
    and one with no result is not known and needs none. A result recorded later at a commit that is
    no head of such a pull request and no head it is known to have left is a candidate too: an
    insert trigger on `check_results` and `ci_check_results` appends its commit as owed to the issue
    whose settle reads it, and a row of a pull request that starts at the issue after such a result
    (its first write, as the read-through makes it after the result's transaction while the webhook
    intake is off, a reopen, a re-key or a move to the issue) is appended the same way by an insert
    and an update trigger on `pull_request_heads` (`pull_request_former_heads_pending`); the settle
    of the issue drains both first (`pull_request_former_heads_drain`) and leaves the result's
    commit, and the issue's results' commits for a row that started, as candidates, through the
    functions the install's seed calls, so a result and a row written at once are not both missed,
    since one settle starts after both committed; the install takes
    `SHARE ROW EXCLUSIVE` on those two and `pull_request_heads` before its seed and triggers, so a
    result or a head write either committed before the seed read it or fires the triggers after the
    commit (it asks for them in tries of half a second each, shorter than `deadlock_timeout`,
    giving back what a try took when it runs out, for as long as the runner lets any migration
    wait for a lock, so a cycle with an issue's delete fails neither side and a busy writer is
    waited out as any migration waits one out);
    one pull request has one identity under every name its repository goes by
    (`pull_request_former_heads_pulls`, `pull_request_former_heads_aliases`): its history, its
    records, its lifecycle, its lock and the claim of its read go by it, and a name chooses only the
    GitHub route and the repository an event names; a writer appends its record under the name it
    wrote, and the settler finds the record's identity when it applies it, so a record written
    before Dispatch learned of a rename reaches the same history as every record after, and two
    histories applied apart before the rename was known are joined into one
    (`pull_request_former_heads_resolve`); there is no partition by name and no copying of history
    on a rename; the database names a repository by the rename rule every reader of Dispatch holds
    (`pull_request_canonical_repo`, migration `20261126005345`, as `store.ReadRepoRenames` and
    `refs.Renames.Canonical` read the pairs: both names of a `repo_projects` row in lower case, a
    row that renames nothing dropped, the greatest new name of one old name, and no pair once
    `repo_projects` is gone), so a name finds the row a writer keyed under the canonical name. The
    boot's rename pass writes no column of `check_states`, of `check_state_sets` or of these
    tables: its write of a pull request's row records that row's move to the new name and owes
    its issue a settle, which publishes each state under the new name, with an event, and
    deletes the state under the old one, so a reader that keys a state by its repository learns
    it under the new name; and the settler keeps each name it met a pull request under. A
    close or a merge under any name ends the lifecycle and starts the next
    generation, while a rename and a move to another issue keep it: applying the records drops
    each head the pull request reached before the last close (`pull_request_former_heads_pulls.ended`,
    `generation`, `pull_request_former_heads_rows`), so no history of a closed lifecycle reaches a
    later one through a row's next move or its re-key, in whatever order the records commit; a
    close no update of an open row shows ends it too: a row written closed or merged, by its insert
    or its re-key, such as the canonical-name writer's first write of a pull request it finds
    closed, which then deletes the open row of its old name, is recorded as a close where the pull
    request is open under another name or no close of it is known, and the install records where
    the last closed period of each pull request before it began, whether the pull request is closed
    when the install runs or was reopened since, among the results recorded before it by one clock,
    the database's: Dispatch's record of each write that opens or closes a row
    (`pull_request_heads_lifecycle`, a new table two triggers append to on each insert, each update
    that closes an open row or opens a closed one, and each re-key of an open row, which no reopen,
    re-key or delete of the row removes, which migration `20261126005345` seeds, undated, with
    each pull request closed when it runs, by its canonical name's row, so an open pull request
    whose old name's row reads closed from before keeps its results, and which the install alone
    reads, so migration `20261126005349` drops it, its triggers and its function after the install)
    shows the period begin at the first close after the last write that opened a row of any name of
    it, or at a later close in it of a row that was open, the latest such, so a second closed row of
    the closed pull request, as the canonical-name writer writes, and a write that leaves a closed
    row closed or merged move it
    nowhere, and a close, a reopen and a second close begin it at the second; each result goes at
    the time it was recorded, a result first at an equal time; so a close and a reopen that a writer
    of the release before makes between the two migrations end the lifecycle as a close after them
    does; no time GitHub gave (`pull_request_heads.event_at`) orders anything, so a result from
    before the close never crosses a reopen as a candidate, and a result recorded while the pull request was
    closed counts after it reopens where it was recorded after the install or after a close
    Dispatch recorded, while where the period began undated every result recorded before the
    install stays out, and its head waits for a new result; and
    ended provenance stays ended: the drain keeps the place of each result
    (`pull_request_former_heads_results`), the install gives each result recorded before it its
    place in that order, and a result's commit becomes a candidate only where a
    result there was recorded after the last close, or, with no place yet, where no close
    is known, so a reopen never makes a result of the lifecycle its close ended a candidate, nor
    brings back a head of it, however healthy the read of the commits; the rule covers candidate
    commits alone, so a head the reopened pull request stands at, never a candidate, keeps every
    result recorded there, and a pull request reopened with no push keeps the results of the head
    it closed at, a pass from before the close among them; a result recorded since the close, and a head the
    reopened pull request visits, count in the new lifecycle, in whatever order the close, the
    result and a move commit and are applied: a close applied after a result at a commit the
    history already held, or a move on from a head reached before the close, leaves that commit
    again where a result there was recorded after the close (`pull_request_former_heads_leave_again`),
    as applying the close first does; the delete of an
    open row stored under a repository's old name, the re-key, keeps that row's head in the one
    history, and its trigger marks the canonical row's issue owed in the delete's own transaction,
    whichever build deletes it, so that head's states are published; and every application that
    changes a pull request's history, the drain's, a pass's, a join's of two names applied apart
    or a verification's, marks owed in its
    own transaction each issue that holds an open row of the pull request when it applies, so a
    head applied after the pull request moved to an issue that had already settled is published
    there too, with no lock of an event owner taken and the writers' triggers still only
    appending. A former head's rows in `check_states` and `check_state_sets` go once no open pull
    request is or was at it. A check CI proves is read at the former heads after the open heads, in
    a batch of their own under its own 10 s bound, at most eight reads at a time, the head whose
    read started longest ago first (`check_state_sets.ci_read_at`, migration `20261126005343`); a
    former head whose read had not started when that bound ended keeps its published state, with no
    `read_failed`, and the next settle, a second on, reads it first, so each of N former heads is
    read within ceil(N/8) settles however slow GitHub is for the others. A mark whose change came
    after the last read of such a head stays until each former head has been read since that
    change (`check_states_owed.reads_from`, migration `20261126005344`), and a `test` handoff
    waits for it as for a due mark, so the handoff records no serial over a state at a former head
    that may be from before the change, a pass of a run that has since failed among them; the
    failure backoff of a `read_failed` state follows once every head has been read, and a mark
    after the backoff stays while any state of the issue reads `read_failed`, whichever settle
    published it, until that head is read or leaves the issue's heads.
    The result a former head's run derives counts at that former head alone, never among the
    check's results, so the state published at an open head is computed from the results
    `GET /api/v1/issues/{key}/results` computes it from, and a former head's run never changes it.
    A run's conclusion is its whole job's at a former head as at an open head, so where the check's
    CI job recorded a result of its own for the check at a former head, the run derives that check
    no result there (`job_recorded`), and the job's own result decides it.
    An event at a head names each open pull request at it and each open pull request that was at
    it, whichever is at it now.
    `GET /api/v1/issues/{key}/results` answers as before.
    `TestAFormerHeadOfAnOpenPullRequestKeepsItsStates` writes the events of its two cases to
    `packages/contracts/fixtures/dispatch-events/check-states-after-a-move.json`
    (`UPDATE_GOLDEN=1`), which the Legion daemon's testing move replays.
