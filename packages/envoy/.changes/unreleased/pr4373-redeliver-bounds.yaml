kind: Fixed
body: |-
    The webhook redelivery sweep shows each delivery's GUID, event and action, and each bucket key or bucket error that holds a GUID, in its log lines and errors to a bound: whole up to 512 characters, and past that its first 512 characters and its size.
    A listed delivery whose GUID the bucket cannot key (outside the key alphabet, or so long that its index entry's key passes the write bound) is left out of the sweep with one WARN line, `webhook redelivery left out a delivery whose GUID the bucket cannot key`; before, such a GUID failed every sweep or left every sweep incomplete.
