kind: Fixed
body: |-
  The outbox's expiry pass reads the listeners' expiry notices of the copies the outbox kept for
  roles, and keeps those copies again. A Dispatch process whose NATS connection is cut while its
  outbox's expiry pass runs now gives the publisher hold up about 3 s after the cut, not about
  13 s. Before, the process waited out the pass's NATS call, up to 10 s, before it started to count
  the 3 s, so the other process took over past the 10 s bound. The pass now ends at the cut, and
  runs again once the client is connected. When the connection goes silent, open while nothing
  answers, while one of the pass's NATS calls waits for an answer, the other process now publishes
  within about 6 s of the silence (about 4 s in the package's tests), not about 17 s. The outbox
  probes its connection every 2 s while the pass runs, and once more as the pass ends when the
  pass reports a failure or ran 2 s or longer. It gives the hold up when a probe gets no answer. A
  silence that starts while the pass does database work is found as one between passes is. When a
  batch keeps a copy for a role and hands it to the role's new holder, each read of that handover
  now gives up after 2 s, where it could wait up to 10 s. When a read or the forward of the
  handover fails, the outbox probes the connection. When the probe gets no answer, the batch sends
  nothing more and the process gives the hold up. So a cut or a silence at those reads lets the
  other process take over within the 10 s bound, also when a second keep of the role waits behind
  the handover.
