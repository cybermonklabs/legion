kind: Fixed
body: 'Delivery attribution credits a GitHub issue URL in a pull-request body to the issue it names only where the URL''s own authority ends in github.com and the path it carries is that issue''s whole path. So a citation is credited however the body spells the scheme and the host, with a port or with userinfo, and wherever it stands in running text: a port and an upper-case host are credited where they were not before. A URL whose authority is another host is credited to nobody — a name that merely ends in github.com, a subdomain, a name beginning with it, a punycode or percent-encoded lookalike, a name with a trailing dot, github.com standing as another host''s userinfo, and github.com standing in another URL''s path, query or fragment. So is a github.com URL whose path is not an issue''s, such as a blob, tree, compare or wiki path that ends in /issues/<n>, which was credited before; and a path carrying two issue segments credits one issue rather than two.'
