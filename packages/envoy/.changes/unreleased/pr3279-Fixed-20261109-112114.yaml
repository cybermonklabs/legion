kind: Fixed
body: 'Delivery attribution no longer credits a GitHub issue to a host that merely looks like github.com. A pull-request body credits an issue where the authority its issue path hangs off is github.com, which net/url reads: a name that only ends in github.com, a subdomain of it, a name beginning with it, a punycode or percent-encoded lookalike, a name with a trailing dot, and github.com standing as another host''s userinfo are each credited to nobody, where they were credited before. A github.com URL whose path is not an issue''s is credited to nobody as well, such as a blob, tree, compare or wiki path ending in /issues/<n>. Three shapes are credited that were not: a host spelled in any case, a host carrying a port, and userinfo before the host. Everything else attribution credited it credits still, whatever stands to the left of that authority.'
