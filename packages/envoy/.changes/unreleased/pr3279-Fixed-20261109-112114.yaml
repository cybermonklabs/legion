kind: Fixed
body: 'Delivery attribution credits a GitHub issue URL in a pull-request body by parsing that URL: it credits the URL whose host is github.com and whose path is the issue''s own, however the body spells the scheme and the host and however the prose wraps it, so a citation in brackets or backticks, after a key and a colon, or with a port is credited where it was not before. A URL whose host is something else is credited to nobody — a name that merely ends in github.com, a subdomain, a name beginning with it, a punycode or percent-encoded lookalike, and github.com standing in another URL''s path, query, fragment or userinfo — and so is a github.com URL whose path is not an issue''s, such as a blob, tree or wiki path that ends in /issues/<n>.'
