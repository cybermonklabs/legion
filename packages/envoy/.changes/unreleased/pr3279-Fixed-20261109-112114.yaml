kind: Fixed
body: 'Delivery attribution credits a GitHub issue URL in a pull-request body by parsing that URL and reading its host: a citation is credited however it spells the scheme and the host, both of which are case-insensitive, and a URL whose host is not github.com is credited to nobody, whether its name merely ends in github.com (evilgithub.com), is a subdomain of it (www.github.com), begins with it (github.com.evil.test), or carries those bytes in its path, query or fragment.'
