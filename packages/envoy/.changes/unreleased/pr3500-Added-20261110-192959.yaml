kind: Added
body: 'Two routes list comment threads without a meaning search: `GET /api/v1/comment-threads/by-target`, the threads anchored on one target, and `GET /api/v1/comment-threads/by-thread-state`, the threads that are open or resolved. Each takes `?project=` or `?issue=` (exactly one), an optional `?artifact=` narrowing, and pages by key with `limit` and `?after=`, the previous page''s `next_after`; each answers `{threads, limit, next_after}`, a thread being its root comment with its reply count and the time of its newest reply. `dispatch threads-by-target` and `dispatch threads-by-thread-state` call them, and the generated client has both. They serve the Verified Linux spec loop''s requirement queries by target and by the state of the line''s thread, which had no route and fell back to `GET /api/v1/search`, where that one statement took 84.2% of the database''s time at the loop''s 1x load. The second route answers a thread''s own state, not the requirement status of the loop''s lines, whose record stays in git.'
