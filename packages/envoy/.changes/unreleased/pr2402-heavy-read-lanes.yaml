kind: Changed
body: |-
  Four read routes now have a concurrency limit of their own beside the read class: at most one
  request of each a processor runs at once in a process, and never more than seven. They are
  `GET /api/v1/search`, an issue's references (`GET /api/v1/issues/{key}/references`),
  `GET /api/v1/issues/{key}/artifacts` and `GET /api/v1/issues`. A request takes its lane before it
  takes its class's admission units, so one waiting for a busy lane holds nothing from the other
  routes; a lane's queue holds up to 22 times its limit, the bound on its memory, and the lane and
  the class behind it cost the request one wait between them - the lane waits out what is left of
  the read's one second, counts the time it took, and leaves the rest to the class queue, which the
  request joins at the place it arrived rather than behind everything that arrived while the lane
  held it. A request refused by
  either is answered the same `429 OVERLOADED` with `Retry-After`, its message naming the lane.
  Four new series report each lane: `dispatch_http_lane_in_flight`,
  `dispatch_http_lane_queued`, `dispatch_http_lane_limit` and `dispatch_http_lane_refused_total`.
  The limit is measured: in the seconds after a burst of writes where every request answered
  slowly, Postgres had three to five of those routes' statements running at once, the eight-hop
  reference closure an issue's references then read among them, and was waiting on no lock, and
  over the two minutes after such a burst they accounted for 101 of the 124 seconds of statement
  time the server spent, on a box of three processors - the search union alone 327 ms a call.
  An issue's references keep their lane though that read now reads one hop in each direction: on
  a production-sized database it still runs to its statement timeout, so each such read holds its
  read unit for seconds, and the lane is what keeps a burst of them from holding the whole read
  class.
  The width is one a processor because three was best on that three-processor box, and a lane held
  at three on a 16-processor Dispatch refused, at half the load, requests that server could serve.
