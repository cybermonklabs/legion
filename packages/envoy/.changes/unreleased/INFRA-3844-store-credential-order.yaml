kind: Changed
body: |-
  `agent-secrets secret` on Google Cloud takes its credential from the first of these that is
  present: `--profile NAME` (a gcloud configuration), `CLOUDSDK_AUTH_ACCESS_TOKEN`,
  `GOOGLE_APPLICATION_CREDENTIALS`, `CLOUDSDK_ACTIVE_CONFIG_NAME` or `CLOUDSDK_CORE_ACCOUNT`, the
  well-known credentials file in gcloud's own configuration directory (`CLOUDSDK_CONFIG`, else
  `~/.config/gcloud`), the active gcloud account, and last the metadata server. Before, the
  machine's metadata server came before any gcloud login, so on a Google VM a person's own login,
  even one chosen with `CLOUDSDK_ACTIVE_CONFIG_NAME` or `CLOUDSDK_CORE_ACCOUNT`, lost to the
  machine. A source that is absent is skipped; one that is present but fails (a file that does not
  parse, a refresh gcloud cannot make, an account gcloud holds no login for, a chosen configuration
  that names no account) stops the command with its error, and no later source is tried. With
  none present, the command names each source and why it had nothing. gcloud now runs with its
  own settings for the chosen configuration and account, impersonation included, and never with
  `CLOUDSDK_AUTH_ACCESS_TOKEN`. On AWS the order is `--profile`, `AWS_PROFILE`, then the SDK's
  default chain, as before.
