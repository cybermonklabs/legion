kind: Fixed
body: |-
  A request that finds a class's admission queue busy is no longer refused `429 OVERLOADED` while its wait still has room: it waits for what is left of its wait, a second for a read and two for a write, and is refused only when that wait runs out, or at once where the queue already holds the cap that bounds its memory, 22 times the read limit and 4 times the write limit (616 reads, and 96 writes of up to 1 MiB of body each); a heavy read's lane and the work outside admission hold up to 22 times their own limit the same way (154 at a lane of 7, 176 for the 8 places outside admission), where they refused past twice it at once. On the cluster copy at ten times the load, a step refused 150 reads that the server, with no limiter, served late: 121 at once from a read queue that had stood a whole wait and so was held to twice its limit, and 29 at once from the lanes' queues of twice theirs, while those queues drained within their wait; before that, held to twice the limit at all times, the read queue had refused bursts of 85 and 129 reads during a 0.4-0.7 second stall.
