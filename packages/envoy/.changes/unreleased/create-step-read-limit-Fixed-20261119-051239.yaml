kind: Fixed
body: |-
    A start whose create of a KV bucket meets a bucket another start created a moment before no longer waits out the whole JetStream wait, ten seconds (two for the known-session bucket), when the read of the stream that the create makes after "stream name already in use" draws no answer. In the moment after another start's create lands no member answers that read, and a read no member answered is never answered later. Each send of a bucket's create step, and of the `ENVOY_NOTIFICATIONS` create, is now waited for up to the start's read limit (630 ms first) and sent again, as a read of a stream is. A create cut while its stream's first election runs is sent again as an equal create, which the server answers at once, and the start then waits for the stream's leader as before. The WARN line `envoy nats stream request unanswered; sending it again` is now written as the send it announces starts, so a start whose context or hang guard ends the wait, in the pause before a send or before that send starts, logs none for a send it does not make, and its error counts the sends that reached their read limit and names what ended the wait.

    An update of a stream that a start or a keeper pass sends (a bucket's raise or maximum age, the `ENVOY_NOTIFICATIONS` reconcile) is now waited for up to a write limit, where it waited the whole JetStream wait: no member answers an update sent while the stream elects its leader. The write limit starts at the read limit's 630 ms, doubles at each send it cuts, and is learnt from the server's answers to writes alone, never set back by a read's answer, so a server that answers writes later than it answers reads has each update sent again only after a limit twice the last one, not after every read. The stream is then read back, and the update is sent again only when that read shows it did not land, made from that read, so it keeps each change that read shows. An update the limit cut can still land after the one sent again, and it then writes back the read it was made from over a change another program made since. A stream update replaces the whole configuration and compares no revision, so an update the server applies late does that whether or not a limit cut it. The keeper of the program whose change was lost puts back only the settings it owns, the stream's and the copies of its buckets, at its next pass that succeeds, 30 seconds later. Three kinds of change no keeper puts back: a subject a start put in place of an overlapping one stays written back until the next start or reconnect of the program whose start replaced it; a bucket's maximum age that a late raise writes back is set again only on the session bucket, by the listener's next start and each pass of its session reaper where `ENVOY_SESSION_MAX_AGE` is set; and a consumer's configuration that a late move of its filter writes back gets back only the fields of the listener's consumer policy, at that listener's next start.

    A start that moves the role lanes off a stream that still carries them reads the list of the stream's consumers again when its answer is lost or the list names fewer consumers than the stream counts: nats.go's list reports no error, so a lost list moved nothing and said nothing. A list the connection's grant refuses ends the start at once, naming the refusal. A move of a consumer's filter and a purge of a role lane whose answer is lost are read back, and sent again only when that read shows they did not land, each send under the same write limit, until the start's hang guard passes, where one lost answer failed the start.

    A write made from a read (an update, a consumer's move, a purge) whose answer has not come within its first 630 ms now reads the leader that answers it every 630 ms: the JetStream metadata leader for an update or a move, through the account's read `$JS.API.INFO`, which nats-server answers only where it would take the update, and the stream's leader for a purge, through a read of the stream. A read of that leader answered after one that went unanswered sends the write again at once, so a write the members dropped while its leader was gone lands within about one read period of the leader's return, where it waited out its doubled limit, up to 9.58 s after a 10 s absence. A read that waits past its first limit is copied every 630 ms, and the first answer of any copy is its answer, so a read the members dropped meanwhile lands within one copy of the leader's return. Every limit, of reads and of writes, now stops growing at 9 s, nats-server's longest election timeout, where it grew to 10 s. What it costs and leaves: one account read every 630 ms while a write waits past its first limit, and one copy of a read every 630 ms while a read does; a leader read that a busy server answers later than 630 ms counts as a leader gone, so the next one it answers sends the write again early, and that early send's late landing is the window above; a write on a connection whose grant refuses `$JS.API.INFO`, or one whose leader came back between its send and its first leader read, still waits its whole limit, at most 9 s.
