kind: Fixed
body: |-
    A failed read of this VM's Google identity token for a NATS service connection names the setting
    the audience came from, `NATS_SERVICE_GOOGLE_AUDIENCE` for the bus and
    `--service-google-audience` for `natsprobe`, where it named agent-secrets' own
    `AGENT_SECRETS_MACHINE_AUDIENCE`. The audience still prints only where it is a plain http(s)
    URL, and by its setting alone otherwise.
time: 2026-11-21T00:15:17Z
custom:
    Issue: go-nats-clients-print-no-credential
