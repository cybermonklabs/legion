kind: Added
body: PUT /api/v1/issues/{key}/role-holders records the session that holds each Legion role of an issue, and GET answers that set in workflow order. Only the Legion daemon of the project writes it, as session legion-daemon:<project>, and each write replaces the whole set of the issue.
