kind: Changed
body: |-
  The Dispatch server's health probe pool names its Postgres connections `dispatch-health`, as the
  rooms, room-appends and compaction pools already name theirs, so `pg_stat_activity` tells the
  probe's connections from the shared pool's. Like those pools, it sets this name over an
  `application_name` that `DATABASE_URL` gives, on the health pool's connections only.
  Five new test-only settings require `DISPATCH_TEST_HOOKS=1`. Four accept short durations
  and reject values above their bounds: `DISPATCH_TEST_RATE_READING_BEFORE_RESET` (the GitHub
  rate reading's lead before a reset, at most `60s`), `DISPATCH_TEST_SEARCH_FILL_STANDBY_RETRY`
  (the keyword fill's standby retry, at most `10s`), `DISPATCH_TEST_OIDC_DISCOVERY_RETRY`
  (OIDC discovery's first retry and least spacing, at most `1s`) and
  `DISPATCH_TEST_COVERAGE_FILL_BACKOFF` (the coverage counts' first retry bound, at most `10s`).
  Set `DISPATCH_TEST_CI_RECONCILE_AT_START` to `1` to run the CI reconcile's first pass at start.
  A deployment that sets none of them runs as before.
  The pre-deploy migration census (`envoy-dispatch census`) reads each relation name's catalog
  answer once per census, where it read it again for each statement that names the relation; its
  report and its verdict are unchanged.
