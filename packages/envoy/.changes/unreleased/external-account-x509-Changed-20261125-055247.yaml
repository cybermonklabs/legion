kind: Changed
body: |-
  The machine source's `external_account` identity spends the federated access token of the
  credential file's own exchange on `generateIdToken`, as the `pool` identity does, and no longer
  calls the file's `service_account_impersonation_url` (in any case of its key), which now only names
  the account. The federation's principal needs `iam.serviceAccounts.getOpenIdToken` on the account,
  which `roles/iam.workloadIdentityUser` and `roles/iam.serviceAccountTokenCreator` both carry, and
  the account no longer needs `roles/iam.serviceAccountOpenIdTokenCreator` on itself. A principal
  that holds `iam.serviceAccounts.getAccessToken` on the account through a custom role without
  `getOpenIdToken` is now refused by IAM Credentials. An executable `credential_source` is no longer
  given `GOOGLE_EXTERNAL_ACCOUNT_IMPERSONATED_EMAIL`, which Google's library sets only for a call of
  the impersonation URL. The error of a failed exchange now reads `mint a federated access token
  with the external_account credential GOOGLE_APPLICATION_CREDENTIALS names, to act as <account>:
  …`.
