kind: Added
body: |-
  The broker's NATS auth service holds a service whose `BROKER_NATS_SERVICES` entry takes its
  exchange projects (`-`) to the projects the broker's exchange entry for its account lists
  (`natsgrant.WithinProjects`), where before it refused every such entry; the person that
  exchange entry acts for must see each project, as the token exchange requires of that account's
  token. The grant keeps every repository's GitHub events, since a GitHub event is a message of no
  project. No connection waits on Dispatch: the broker reads it in passes, at its start and every
  20 seconds after, each asking about every such project, and builds a held grant from the newest
  complete pass alone, however old, never from two passes mixed; a pass any question of which
  fails adds nothing, but every refusal its answered questions yield applies at once: a project
  not found, or no longer seen by the entry's person. It refuses, naming the reason and counting
  it under a label of its own, an account no exchange entry lists (`no_exchange_entry`), an entry
  naming no project (`no_exchange_projects`), no complete pass held yet (`no_complete_pass`, which
  the client retries), Dispatch refusing the broker's own account token (a 401 or 403) in that
  pass (`project_access_refused`, logged at error once a pass, as the token exchange refuses every
  trade then), a project Dispatch does not hold (`project_not_found`), one the entry's person
  cannot see (`project_not_visible`), and a grant that cannot be held to projects
  (`grant_not_holdable`). A dispatch or listener entry with `-` is now refused at startup, as a
  measurement entry's is. Dispatch's grant there may also write the private-projects bucket, a
  listener's may read it, and a daemon entry with `*` is also granted its account's own reply
  prefix. List a Legion daemon with `*` until the daemon release gate opens for a daemon that
  opens its consumers per project: `-` names consumers today's daemon does not open.
