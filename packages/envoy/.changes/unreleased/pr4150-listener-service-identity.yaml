kind: Added
body: |-
  A hub's own listener connects through the NATS auth service by its service identity: `gcp:NatsHub`'s `listener` and `gcp:ClusteredNatsHub`'s session listener take `natsAudience`, required with `authCallout` and refused without it, and present the VM's Google identity token or a projected token of the listener's own ServiceAccount for it.
  A hub's listener is no longer refused beside `authCallout`; behind it the hub renders no user for the listener, fetches or mounts no seed for it, and refuses the listener's `nkey` and seed inputs.
  `core.ListenerConfig` takes `ServiceTokenFile` and `ServiceGoogleAudience`, `BrokerTokenFile` (the broker check's token-file form, which `core.CheckBroker` takes beside the audience form), the privacy settings `PrivacySourceURL`, `PrivacyRequired` and `AllProjectsAccounts`, which `core.CheckPrivacySource` holds to the hub's privacy mode, `IntrospectionsPerSecond` and `IntrospectionBurst`, and `V1OpenWithTokenChecks`.
  The listener takes `ENVOY_V1_OPEN_WITH_TOKEN_CHECKS=true`: beside a token check (the `ENVOY_OIDC_*` pair or the Google pair, without which it refuses to start) it keeps `/v1` open to a request that presents no credential, at the hosts `ENVOY_ALLOWED_HOSTS` names, while a token that is presented is verified and refused when it does not verify, and a verified one is admitted as itself. It also takes `ENVOY_AGENT_SECRETS_INTROSPECTIONS_PER_SECOND` (1 to 1000) and `ENVOY_AGENT_SECRETS_INTROSPECTION_BURST` (1 to 100000), the bucket each source address's broker-token introspections are bounded by, only with `ENVOY_AGENT_SECRETS_URL`; unset keeps five a second and a burst of 20.
  With `privateProjects`, `gcp:ClusteredNatsHub`'s session listener has a token check (`oidcIssuer`, `oidcAudience`, `oidcAccounts`) and takes `agentSecretsUrl`, `publicUrl`, `brokerAudience`, `privacySourceUrl` and `allProjectsAccounts`: it renders the broker check in its token-file form with the broker-audience token at `/var/run/secrets/envoy-broker/token`, `ENVOY_PROJECT_PRIVACY_URL`, `ENVOY_PROJECT_PRIVACY_REQUIRED=true` and `ENVOY_ALL_PROJECTS_ACCOUNTS`, and the hub renders the headless Service `<name>-listener-instances` and admits the all-projects callers' namespaces at the listener's port. A `tailnet.listener` with no `clientNamespaces` keeps its open `/v1` beside the check (`ENVOY_V1_OPEN_WITH_TOKEN_CHECKS=true`, the tailnet name in `ENVOY_ALLOWED_HOSTS`), so the private mode narrows no tailnet caller; with `tailnet` the listener's introspection limit is fifty a second and a burst of 200 per source address, the secrets broker's own per-address bound, since every tailnet session shares a tailnet host's address. Without `privateProjects` the listener renders exactly as before, whatever those inputs hold.
  A private session listener's image must name a listener release at or after `privateModeListenerFloor`, the first release that enforces the listener's required mode; the floor is empty until that release ships and sets it, so today every private session listener is refused (`privateProjects needs a session listener release that enforces the required mode; none is named yet`): the broker settings turn broker tokens on in the listener, and an earlier release holds none of their callers to the projects they may see.
  With `tailnet`, a private session listener's origin (`ENVOY_PUBLIC_URL`) is the Tailscale Service's, `http://<serviceName>.<tailnetDnsName>:9020`, where the tailnet's sessions sign their proofs; any other `publicUrl` is refused. `privacySourceUrl` is the secrets broker's base URL: `https`, the origin of `agentSecretsUrl`, and no path, since the listener appends `/v1/project-privacy` itself.
  `gcp:NatsHub` refuses `privateProjects` beside its own listener, since the VM hub is never private.
