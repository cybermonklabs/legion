kind: Fixed
body: |-
    A person's sign-in that this machine cannot renew no longer stops every `agent-secrets` command once its enrollment ends. Where the machine is told of no sign-in client (`AGENT_SECRETS_SIGNIN_CLIENT_ID` and `AGENT_SECRETS_SIGNIN_CLIENT_SECRET_FILE`), or of another client than the person signed in with, and the sign-in holds no live enrollment (none in its record, or one that `GET /v1/enrollments/self`, signed with the sign-in's key, answers not live), the chain passes over the sign-in and takes the helper, for a caller in one of its sessions, else the machine. The command says so on stderr, in one line ending `; using the helper source` or `; using the machine source`, or `; tried the helper source next` (or `machine`) before that source's own refusal, and `agent-secrets identity --source` prints the source it takes and the same line. Before, the command exited 1 with `proof invalid: not live (PROOF_INVALID); registering this session again: this machine is told of no sign-in client`, though the helper would have served it.
    The enrollment read is made only for a sign-in this machine cannot renew, and a refusal of it other than not live stops the command, naming the read. A sign-in that is live, or that this machine can renew, is used as before; so is one whose sign-in client the machine cannot read (one of the two settings alone, a secret file it cannot open), whose renewal reports that setting when it runs. `agent-secrets renew` never passes a sign-in over: it reports the ended enrollment and exits 76, as before.
time: 2026-11-22T17:13:51Z
custom:
