kind: Changed
body: |-
  `agent-secrets` now says on stderr when it waits for a box's launcher that is still enrolling it
  (a fresh `enrollment.pending` in the key directory), before it waits:
  `agent-secrets: the launcher is still enrolling this process (AGENT_SECRETS_KEY_DIR holds enrollment.pending); waiting up to 20s for its key.pem and enrollment`,
  naming the key directory by its setting, never its path.
  Once `key.pem` is there and `enrollment` is not, it says
  `agent-secrets: still waiting for the launcher's enrollment`. A call that gives up has always said
  first what it waited for, however late a loaded machine ran it; with `AGENT_SECRETS_ENROLL_WAIT=0`
  it does not wait and says nothing. Before, such a call was silent for up to
  `AGENT_SECRETS_ENROLL_WAIT` (20 s by default), so an MCP server held at a box's start gave no
  reason. The forms that act as a session say it, `grant revoke` among them, and so does
  `identity --source`; a `secret` form's reread uses only an identity the process already holds,
  so it waits on nothing and says nothing.
  The refusal at the end of the wait now says how long the call waited, counted from when it set
  its deadline, and its bound: `(waited 20.004s, its bound 20s, while AGENT_SECRETS_KEY_DIR held
  enrollment.pending)`, where it said `(waited 20s while …)`, the bound alone.
