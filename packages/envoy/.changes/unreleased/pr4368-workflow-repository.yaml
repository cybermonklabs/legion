kind: Fixed
body: |-
  The broker refuses a `BROKER_EXCHANGE_WORKFLOWS` entry whose repository is `<owner>/.` or
  `<owner>/..`, which names no repository. The entry's repository is held to the rule every other
  reader of an `<owner>/<name>` entry uses (`githubname.ValidEntry`), and every refusal the entry
  gave before stands.
