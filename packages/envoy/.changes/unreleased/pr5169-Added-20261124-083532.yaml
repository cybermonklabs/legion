kind: Added
body: |-
    Dispatch's `plan_task` block takes `owner`, the role of the task's sub-owner, a string read and
    created from block schema version 12. Its migration moves the stored schema from 11 to 12 with
    the attribute, and a second one writes version 12 again above the migration that adds a check's
    `subject` and `program`, which sorts after it and writes version 6, so the stored schema ends at
    12 and the server and editor agree. The issue page labels it "task owner".

    That second migration, `20261127042910`, writes the version again rather than editing
    `20261125125701`, the migration main released, so every release keeps its way back. It costs
    one extra deploy step, and only on a deployment where `20261125125703_btree_gin` is still
    pending and `graph_nodes` or `graph_tuples` is above 1 GiB: there the pre-deploy census refuses
    it and names the extension, as it refuses every pending migration above a pending
    `create extension`. Deploy an image that holds `20261125125703` and no later migration needing
    the exemption first, as that migration's own note says, and then this release. Below that size
    one deploy carries both.
