kind: Fixed
body: |-
    A token mint whose upstream, GitHub or Google, ended the TLS exchange with an alert, or met one
    from the broker, now says the upstream `answered, but the TLS exchange failed`, where it said
    `could not be reached`. What the mint retries, and what it counts as possibly sent, is
    unchanged.
