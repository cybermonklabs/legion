kind: Fixed
body: |-
    The broker's mint of a token now says its upstream `answered, but the TLS exchange failed` for a
    TLS alert over TCP, the upstream's or the broker's own, where it said `could not be reached`: Go
    returns such an alert as a network error, not as a `tls.AlertError`. What the mint retries and
    counts as possibly sent is unchanged.
