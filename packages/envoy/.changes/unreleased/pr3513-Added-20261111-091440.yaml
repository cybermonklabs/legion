kind: Added
body: '`GET /api/v1/landing` answers a cold dashboard page in one read: who the caller is, what every page of the dashboard draws whatever its route, and what the page named by `?page=` (`issue`, `board`, `inbox` or `document`) draws before it can paint. Each part calls the same function the per-resource route calls, so the landing answers nothing that route would not. A part that names an issue or a document that is not there, a read that failed, and a part whose service (the Envoy listener for the agents and the subscribers, the secrets broker for the credential requests) has not answered within one second are each answered `null` instead of refusing or holding the whole landing, and the caller reads that one part from its own route. A server that does not serve this route answers 404, which leaves a caller free to read every part as it read them before.'
