kind: Added
body: |-
  `envoy-infra:gcp:ClusteredNatsHub`'s session listener can connect to NATS by a projected token
  of its own ServiceAccount instead of a stored seed: `listener.natsAudience` or
  `tailnet.listener.natsAudience` names the token's audience, and with it `nkey`, `seedSecretName`
  and `seedSecretKey` are not set. The listener pod then mounts no Secret: a projected volume holds
  the token of `<name>-listener` for that audience (`expirationSeconds: 3600`) at
  `/var/run/secrets/envoy/nats-token`, which `NATS_SERVICE_TOKEN_FILE` names. The hub renders no
  NATS user for the listener, so `auth.conf` holds no `listener "<machine id>"` user and
  `auth_users` no key of it; its durable stays reserved. The auth service admits the listener as
  `listener/<machine id>` only where the broker's `BROKER_NATS_SERVICES` lists
  `listener/<machine id>/*=system:serviceaccount:<namespace>:<name>-listener` (with `*`: the
  listener's grant is not held to projects), `natsAudience` equals the broker's
  `BROKER_NATS_K8S_AUDIENCE`, and the listener image is `legion-envoy-v32.9.0` or later. An older
  listener ignores `NATS_SERVICE_TOKEN_FILE` and connects with no credential, which a hub with a
  session user admits as that user. Add the broker entry, and let the broker roll out with it,
  before the update that sets `natsAudience` and unsets the seed's three inputs; that update also
  restarts the hub pods, since the listener's key leaves `auth_users` and so changes the callout
  annotation. `natsAudience` is refused, naming `<path>.natsAudience`, without `authCallout`,
  beside `nkey`, `seedSecretName` or `seedSecretKey`, holding whitespace or a control character,
  and equal to the listener's own `oidcAudience`. In this mode a dotted `machineId` is taken, since
  it names no NATS user, and one holding a space, `*` or `>` is refused, naming `<path>.machineId`.
  With `privateProjects` a listener with `natsAudience` is taken only where it requires a
  credential on `/v1`, the hub's own `listener` or a `tailnet.listener` with `clientNamespaces`; a
  `tailnet.listener` with no `clientNamespaces` is refused, naming `tailnet.listener`. A listener
  without `natsAudience` renders as before.
time: 2026-11-28T13:31:12Z
