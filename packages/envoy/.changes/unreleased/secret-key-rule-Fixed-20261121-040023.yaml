kind: Fixed
body: |-
  `gcp:ClusteredNatsHub`'s `listener.seedSecretKey`, `tailnet.listener.seedSecretKey` and `routeAuthorization.secretKey`, and `gcp:Dispatch`'s `appPrivateKeySecretKey`, refuse a key no Secret can hold: `.`, `..`, one that begins with `..`, and one longer than 253 characters, beside one with a character other than letters, digits, `-`, `_` and `.`, as Kubernetes holds a Secret's keys. Each took `.`, `..` and `..route`, which a `secretKeyRef` names but no Secret holds, so the pods rolled onto it never started.
