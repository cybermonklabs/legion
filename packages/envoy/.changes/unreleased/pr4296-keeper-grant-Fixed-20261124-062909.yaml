kind: Fixed
body: |-
  The NATS keeper, which raises each key-value bucket a listener or Dispatch keeps back to `ENVOY_NATS_REPLICAS` every 30 seconds, no longer asks the server about a bucket every 30 seconds once the server refused it for want of a grant. A listener whose NATS user lacked a bucket's grant, `envoy_known_sessions` on a hub whose users' render predates that grant, logged `ERROR envoy nats async error` for the refused `$JS.API.STREAM.INFO.KV_envoy_known_sessions` and `WARN envoy nats keeper could not raise a bucket` twice a minute, and the hub a permissions violation each time. Now a refusal of either request of a raise, the read of the bucket's stream or the update that raises it, holds that bucket's next ask for ten minutes, while every other bucket keeps its 30-second pass. The keeper logs the refusal once at WARN, `envoy nats keeper may not raise a bucket under its grant; it asks again after the backoff`, with the refused request in `error` and `probe_again_in="10m0s"`, and again only for a refusal of the other request; when the server answers the refused request itself, with an error too, it logs `envoy nats keeper's grant now covers a bucket the server refused it`. A read that finds the bucket at its copies sends no update and claims no grant for one, so a bucket an operator raised by hand under a grant without its update gives no such line. An ask that fails for another reason logs `envoy nats keeper could not raise a bucket` as before.
