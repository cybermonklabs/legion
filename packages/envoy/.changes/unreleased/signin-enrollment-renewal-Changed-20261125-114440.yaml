kind: Changed
body: |-
    The broker renews a session enrolled under a person's sign-in on a machine only while the launcher credential that sign-in holds there is live: not revoked, not past the expiry the person's last traded Google identity token gave it, about an hour after each trade, and the machine's account still listed for its service in `BROKER_VM_SERVICES`, as a machine's own session is held to its machine login. Otherwise it answers the renewal `401 ENROLLMENT_NOT_LIVE` ("the sign-in that enrolled this session has ended") and logs `broker: sign-in session renewal refused: its sign-in credential has ended` at WARN. So a machine whose person can no longer be traded, as for a suspended or deleted Google account, loses that person's access through the sign-in within the credential's life and one lease (longer by any broker outage in that time), with nobody revoking anything. Before, a session `agent-secrets-helper` held under a sign-in renewed for as long as the helper renewed it, whatever became of the person; a command-line sign-in's enrollment was renewed by nothing, which this release's Fixed entry on the sign-in's renewal changes.
    The clients of this release keep the credential live. `agent-secrets renew --sign-in` trades the person's identity again after its first renewal and each time a third of the credential's remaining life has passed, tries a failed trade again once the smaller of a third of the lease and a third of the credential's remaining life has passed and not more often than every ten seconds, and trades no more, saying so once in `renewer.log`, after an answer that names no credential expiry or one already past. `agent-secrets-helper` trades the sign-in while a session it holds, or a box it enrolled with `enroll-session-key`, may stand under it, and nothing otherwise, so the sign-in's **Last used** on Dispatch says whether the box is in use, but for the two cases below. It keeps each box, with the sign-in it stands under, in a record beside its session records (their file name with `.signin-boxes` after it), so a restart keeps trading for them; a box counts only while its sign-in is the one on the machine. A box that ends without being unenrolled keeps its record, and with it the sign-in's trades and its **Last used**, until `agent-secrets unenroll --helper --enrollment <id>` removes it, which it also does where the broker answers that the enrollment is gone. A helper that finds no record it can read, as at its first start after an older helper, which kept none, keeps the sign-in on the machine traded until that sign-in leaves the machine (a sign-out, or a new `agent-secrets login`), and logs a WARN naming the person, so a box the older helper enrolled under it renews on; until then that sign-in's **Last used** moves with the helper's trades, not with a box's use. A helper on a new machine, whose identity key it made at this start, holds nothing, and one that cannot tell which sign-in is on the machine saves no record until it can. Every client that holds a launcher credential now trades again 15 minutes before the credential's expiry where that comes before 5 minutes before its access token's, whatever `BROKER_ACCESS_TOKEN_SECONDS` is, and logs at WARN a trade that fails while the credential is due. A machine told of no sign-in client cannot trade, and its sign-in enrollment ends an hour after the trade that registered it.
    Deploy order: release the clients first and make every machine run this `agent-secrets-helper` (a release does not restart a running helper), then deploy the broker. An older helper trades its sign-in only when it enrols, so under this broker each session it holds under a sign-in is refused an hour after its last enrolment, and it enrols the session again; a box it enrolled under the sign-in still on the machine is kept by the new helper from its first start. A box enrolled under a sign-in that has since left the machine cannot be traded for by anything on it, and must be enrolled again through the new helper (`agent-secrets enroll --helper`). Before the deploy, the broker's operate page, "Holding a sign-in's sessions to its credential", has two checks. The first lists every machine where a sign-in was traded in the last seven days, and on each the helper's start line must name this release: only this proves the build, since an older helper that enrols at least once an hour keeps its credential fresh and no query of the broker's database can tell it apart. The second lists, twice an hour apart, every live sign-in session whose credential is revoked, lapsed or within five minutes of its expiry; deploy once each row is a session the rule is meant to end. To roll back, move the broker's pin back to the release before; the change has no migration, and the clients of this release work against that broker unchanged.
