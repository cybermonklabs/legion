kind: Changed
body: |-
    The broker renews a session enrolled under a person's sign-in on a machine only while the launcher credential that sign-in holds there is live: not revoked, not past the expiry the person's last traded Google identity token gave it, about an hour after each trade, and the machine's account still listed for its service in `BROKER_VM_SERVICES`, as a machine's own session is held to its machine login. Otherwise it answers the renewal `401 ENROLLMENT_NOT_LIVE` ("the sign-in that enrolled this session has ended") and logs `broker: sign-in session renewal refused: its sign-in credential has ended` at WARN. So a machine whose person can no longer be traded, as for a suspended or deleted Google account, loses that person's access through the sign-in within the credential's life and one lease (longer by any broker outage in that time), with nobody revoking anything. Before, a session `agent-secrets-helper` held under a sign-in renewed for as long as the helper renewed it, whatever became of the person; a command-line sign-in's enrollment was renewed by nothing, which this release's Fixed entry on the sign-in's renewal changes.
    The clients of this release keep the credential live. `agent-secrets renew --sign-in` trades the person's identity again after its first renewal and each time a third of the credential's remaining life has passed, tries a failed trade again once the smaller of a third of the lease and a third of the credential's remaining life has passed and not more often than every ten seconds, and trades no more, saying so once in `renewer.log`, after an answer that names no credential expiry or one already past. `agent-secrets-helper` trades the sign-in while a session it holds, or a box it enrolled with `enroll-session-key`, may stand under it, and nothing otherwise, so the sign-in's **Last used** on Dispatch says whether the box is in use; it keeps the boxes in `signin-boxes.json` beside its session records, so a restart keeps trading for them. Every client that holds a launcher credential now trades again 15 minutes before the credential's expiry where that comes before 5 minutes before its access token's, whatever `BROKER_ACCESS_TOKEN_SECONDS` is, and logs at WARN a trade that fails while the credential is due. A machine told of no sign-in client cannot trade, and its sign-in enrollment ends an hour after the trade that registered it.
    Deploy order: release the clients first and make every machine run this `agent-secrets-helper` (a release does not restart a running helper), then deploy the broker. An older helper trades its sign-in only when it enrols, so under this broker each session it holds under a sign-in is refused an hour after its last enrolment, and it enrols the session again; a box it enrolled under a sign-in must be enrolled again by hand. Before the deploy, run the query in the broker's operate page, "Holding a sign-in's sessions to its credential", twice an hour apart: it lists every live sign-in session nothing trades for. To roll back, move the broker's pin back to the release before; the change has no migration, and the clients of this release work against that broker unchanged.
