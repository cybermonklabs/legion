kind: Fixed
body: |-
  The coverage read (`GET /api/v1/issues/{key}/coverage`), the results read
  (`GET /api/v1/issues/{key}/results`), the reference-targets read
  (`GET /api/v1/reference-targets`), the decisions read (`GET /api/v1/issues/{key}/decisions`)
  and the references read (`GET /api/v1/references`) now read a block's `text_tree` with the
  footnotes its document defines outside the block. Before, each read parsed the block's stored
  text alone, so a call such as `[^1]` whose definition stands elsewhere in the document was read
  as text. Now such a call is a `footnote_reference`, as the editor holds it, and a call that the
  document does not define, or that is escaped, stays text. A typed block is found by its id; for
  any other block, a decision among them, each label that the document defines and that the
  block's text calls is used. The references read takes a pinned block's definitions from the
  version it pins, and an edge's excerpt that its cut leaves inside a code block keeps the tree of
  its text alone. The reference-targets read's ETag hashes each tree, so a definition added or
  removed elsewhere in the document changes the tag. Each markdown's footnote labels are kept in a
  process cache, so a repeat read parses the document once. Today's issue page draws the trees of
  the decisions, reference-targets and references reads in its decision cards, its Dashboard tab,
  the title and card of a block reference, the Referenced by lists and the reference picker, so
  there a defined call no longer shows as the text `[^1]`: a plain line leaves it out, and a drawn
  body shows it as a raised label, as the document does. One reference-targets or references
  request reads the notes of at most 16 documents, in the order the request names them, and a
  block of any further document keeps the tree of its stored text alone.
