kind: Changed
body: |-
  Every keyword and meaning statement of a search (`GET /api/v1/search` and
  `GET /api/v1/search/results`) runs in a read transaction of its own with a `statement_timeout`
  of 15 s and a `client_connection_check_interval` of 1 s. The keyword statement had no bound
  before. A statement that reaches the bound answers `503 SEARCH_TIMEOUT`, with a message that
  names the bound, in place of `500 INTERNAL`. Neither the web app nor the `dispatch` command
  retries such a search automatically; the web app sends the search again only when something
  asks for its answer again, for example a reader's Retry, its tab regaining focus, or a refresh
  from the live feed. A search whose first statement found nothing
  runs its broadened statement under the same bound again.
