kind: Changed
body: |-
  The evals list reads a range the Evals tab offers from stored figures rather than folding every
  day row of the range again: `GET /api/v1/projects/{key}/evals`, `GET /api/v1/evals` and the
  live `evals` view answer a window and a compare range of 7, 14, 28 or 84 days (or one day
  longer, as the live view reads a preset), of a project's own rows or of one repository's, by
  key from `eval_range_figures` and `eval_day_figures` (migration `20261120072042_eval_figures`),
  with the same bytes the fold of the day rows answers. A repository's stored figures fold what a
  read of that one repository folds: its rows the project reads, and, of the repository the
  project publishes as its default, its Legion rows of issues that name no repository
  (`:default`). Any other length, two or more repositories, an eval whose stored figures were
  folded under another definition, and a project whose figures are not built yet fold the day
  rows. Most writes of day rows fold the figures of the days they moved in their own transaction.
  A readings write above 5,000 day-and-series pairs marks the cuts it reaches stale, folds the
  first paints it can, and leaves the rest to the refresher's refold. The day-row refresher's pass builds each
  build's whole set of figures once, and then each new day's ranges, and marks a project built
  once the first whole walk of its figures is done (`eval_figures_built`). A move of a project's
  default repository marks stale, in the commit that publishes it, the figures of each cut it
  moves rows of: the old and the new default's, and, of the owner keys a project gains or loses,
  those of their repositories and of the project's own rows (`eval_figure_cuts_stale`), naming
  the evals whose rows it moved there: of the two defaults' figures, the evals that hold Legion
  rows under `:default`. The same commit folds those evals' figures a first paint of each such cut
  reads (each offered window ending today, tomorrow or the day after, with a compare range one
  window back, and, of an 84- or 85-day read, the compare range one window back of that compare
  range, and their days), and no other day, and the refresher folds every other day of them,
  newest first, in transactions of about 250 ms each. A first paint of every cut a move touches, the
  project's own rows among them, reads the stored figures from the move's commit on; a read of an
  older range reads them once the refold has come down past it, and folds their day rows until
  then. Every other eval is read from the stored figures throughout. A cut marked otherwise (the
  boot's rename pass marks the renamed repository's cuts) has its first paint folded first, in a
  short batch of its own; a process folds the first paint of every such mark before it serves, or
  waits for the process whose refresher holds the lease to fold it, for up to 30 s, and the next
  day's first paint is folded before the rest of a refold, so the first read after a restart, a
  deploy or a midnight reads the stored figures too. A register write that moves what an eval
  folds by marks stale, in its own transaction, each cut holding a day row of the eval, so a series
  it lists is read at once from the day rows; the refresher's next pass, which reads the change log
  from a cursor of its own, marks stale too each cut whose stored figures hold the old fold key:
  those are folded again as a move's are, first paint first and then in batches of about 250 ms,
  and a read of one folds its day rows until the refold has passed it. Both reads
  fold each eval's rows in one order, by day and within a day by the key each row is stored under,
  its repository and its series, so a sum of
  floats answers the same bits whatever order the rows come back in. The bench waits for every
  project's figures to be built before it measures a first paint.
  A change of the delivery settings reaches an open evals page in one pass of the refresher, as
  one delta. In one transaction, the pass rewrites the day rows and members the change moves,
  marks the affected cuts for those evals, and folds their first paints where the marks name
  only computed evals. Until an older range is refolded, a read of a marked eval folds its day
  rows and answers the same values. The pass refolds the rest in batches after the commit
  without sending another delta. It compares the settings with those the rows stand built
  under (`eval_days_settings`), so a change no day row
  reads (a workflow path, the population rule, the roll-up job) rewrites nothing; and the same
  settings saved again by another person log no change at all (migration
  `20261120111107_delivery_settings_bookkeeping`). Settings that move no day row are recorded with
  one change the open delivery views are recomputed for, so the Delivery and Pipeline pages
  answer under the settings the rows stand built under, as their reads do.
  A move of the deploy repository rewrites nothing: the delivery and CI evals that read it (the
  lead times to production, deploy-frequency, deploy-run-success, pr-ci and the deploy cards) are
  kept, with their stored figures and their items, once for every repository that holds a
  delivery run, each as if it were the deploy repository (`eval_days.deploy_repo`), and the evals
  list, the items route and the live `evals` view read those of the repository recorded with the
  stored rows, which the refresher moves to the one the settings name in the commit that brings
  the rows to them.
  A move back finds the old repository's numbers as they stand, and a move to a repository that
  holds no run reads "no data" for those evals. Each repository's series begin on its own first
  day, never before its first stored run, and its lead times on the merge day of the first pull
  request it ships. The other settings rewrite each repository that holds a run they read.
