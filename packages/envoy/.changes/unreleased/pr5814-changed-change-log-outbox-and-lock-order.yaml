kind: Changed
body: |-
  The Legion facts' and filings' writes record their changes in an outbox,
  `delivery_changes_pending`, and never take the delivery change log's lock: a drain moves them
  into `delivery_changes` 250 at a time, each batch a short statement of its own, run by each
  Legion facts pass right after its commit, by the live hub before each read and by the server's
  boot before it serves, so a whole read of a project's facts holds no lock the delivery intake
  waits on, and no burst holds it longer than one batch. A change whose writer died before its
  drain is moved by the next drain of any process, or else by the next server's boot before it
  serves.
  A run's jobs write is one statement that locks the run's row `for no key update`, then takes the
  jobs in their names' order and takes the change log's lock last, so neither two listings of one
  run nor a jobs write of the previous release deadlocks with it; the repository rename pass locks
  each delivery line's rows (runs before jobs, in name order) before its first statement that
  fires a change trigger; the `issue.deployed` write marks its pull request in its last statement;
  and a session group's write runs its reads, the title rule's read of every pull request among
  them, before it takes the change log's lock, and sends its writes after the lock in one round
  trip. So each table has one position for that lock.
