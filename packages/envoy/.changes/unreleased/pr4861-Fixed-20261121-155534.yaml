kind: Fixed
body: |-
  A resend that reaches a clustered stream while its earlier attempt is still being stored is now
  answered with that attempt's copy. Before, `POST /v1/messages/publish` to a team or captured
  topic and `POST /v1/messages/send` answered such a resend `503` with `bus_unavailable`, "the
  message bus did not answer: a publish under the same message id is still in process", so a
  sender that retried during a hub failover was told its message was not taken while its first
  attempt was being stored. Every publish the listener makes under a message id now publishes
  again every 50 ms until the stream answers with the earlier attempt's copy: the two routes, a
  role send's forward to its holder, a role-lane forward, a kept-lane walk's forward, a keep and a
  takeover's copy. A role send whose forward the stream answers with a copy an earlier request
  stored costs its sender nothing under `ENVOY_SENDER_MESSAGES_PER_MINUTE`, as a duplicate send or
  publish already did. A request whose budget ends while the earlier attempt is still in process is
  answered `503` with `Retry-After: 1`, the body `envoy: an earlier attempt of this message is still
  being stored: …` and the code `maybe_stored`, recorded with the outcome
  `earlier_attempt_in_process`, and costs its sender nothing: the stream may still store the
  earlier attempt, and Dispatch retries a `maybe_stored` send under the same key.
