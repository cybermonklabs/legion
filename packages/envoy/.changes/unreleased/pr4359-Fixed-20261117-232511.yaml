kind: Fixed
body: |-
  The broker's airlock proxy refuses a dial to the broker cluster's own addresses. A Kubernetes Service range can be public address space - GKE's default is `34.118.224.0/20` - so the proxy's rules for loopback, private, link-local and `100.64.0.0/10` addresses let a command with an airlock grant tunnel to a ClusterIP of the cluster the broker runs in, the broker's own Service among them.
  `BROKER_AIRLOCK_CLUSTER_RANGES` names that cluster's Service range and each pod or node range RFC 1918 does not already make private, as comma-separated CIDR prefixes, IPv4 or IPv6. A CONNECT tunnel, a bound host's request and a plain-HTTP request whose host resolves to an address inside one of them are refused `403 ADDRESS_REFUSED` naming the setting, before anything is dialled. A name that resolves outside the ranges at that check and inside one when the proxy's transport dials a bound host's or a plain-HTTP request (DNS rebinding) gets a `502` whose body holds the same refusal's text, and that address is not dialled either. Every address is checked as the proxy dials it: an IPv4-mapped IPv6 address as the IPv4 address it holds, and a zoned IPv6 literal such as `[2001:db8::1%25eth0]` without its zone, so a zone does not take an address out of a range. That also closes a way to the broker's own pod: the unspecified address with a zone, `[::%25x]`, passed the fixed rules, and a socket to it connects on the pod's loopback; it is now refused as the unspecified address. `BROKER_AIRLOCK_TEST_DIAL_ALLOW` still opens an address it names.
  Every broker parses the setting, and refuses to start when an element is empty, is no CIDR prefix, or is an IPv4-mapped IPv6 prefix. With the airlock on (`BROKER_AIRLOCK_RULES_FILE`) in a cluster (`KUBERNETES_SERVICE_HOST` set to a non-empty value; empty or unset is outside a cluster), the broker also refuses to start when the setting is missing, when `KUBERNETES_SERVICE_HOST` is not an IP address, or when no range holds that address, read without a zone, so a deployment that missed its Service range cannot pass silently. Outside a cluster the setting is optional, and `dev-airlock.sh` starts its brokers outside any cluster.
  A rules host is now read by one grammar, the one spelling every request for it is compared in, which the broker reads at start, `airlock-check` reads, and `BROKER_AIRLOCK_TEST_AZURE_AUTHORITY` is read by: letters, digits and hyphens in labels of 1 to 63 characters with no hyphen at either end and no `--` as their third and fourth characters other than the `xn--` of an internationalized name, at most 253 characters, no leading, trailing or doubled dot, at most one leading `*.` as the wildcard, an internationalized name only as its punycode, and a last label that is not a number (`foo.123`, `foo.0x` and `0x` are refused; `123.foo` is read). Its first test is the airlock's own validation of a host, so every host that validation refuses is refused here first, with a reason, and none it would refuse is served. Case does not matter, since the airlock folds it: `API.GitHub.com` is served. The broker refuses to start with a host in any other spelling, and `airlock-check` refuses it, naming the entry, the host's position and why. A refusal repeats no text of the host but one exception, the form to write where there is one: `api.github.com` for `api.github.com.`, `xn--bcher-kva.example` for `bücher.example`, and an IP address's canonical form. What such a host would do if served depends on its spelling. A name with one trailing dot, and an IP address in its canonical form (`93.184.216.34`) or an IPv6 address in upper case, are decrypted and every request on them refused `sni mismatch`, because a client sends no TLS server name (SNI) for an address and drops the dot from the one it sends for a name, so the entry would carry nothing; a name the grammar refuses for another reason with a dot after it (`a_b.example.com.`, `foo.123.`) is refused naming both. An IP address in any other spelling (`2001:db8:7:0::1`, `[2001:db8:7::1]`, with a zone or a port) binds nothing, because the proxy reads the address a CONNECT names in its canonical form, so a CONNECT to it is tunnelled unread; one with a trailing dot is a name of numbers alone, which the resolver refuses. A name with an underscore, a reserved `--` label or an `xn--` label the IDNA lookup profile refuses binds when DNS answers for it, but is outside the LDH grammar public host names are written in. A port is named a port only when it is digits; `user:pw@slack.com` and `https:/slack.com` are refused as no DNS name.
