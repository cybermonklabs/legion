kind: Fixed
body: |-
  The broker's airlock proxy refuses a dial to the broker cluster's own addresses. A Kubernetes Service range can be public address space - GKE's default is `34.118.224.0/20` - so the proxy's rules for loopback, private, link-local and `100.64.0.0/10` addresses let a command with an airlock grant tunnel to a ClusterIP of the cluster the broker runs in, the broker's own Service among them.
  `BROKER_AIRLOCK_CLUSTER_RANGES` names that cluster's Service range and each pod or node range RFC 1918 does not already make private, as comma-separated CIDR prefixes, IPv4 or IPv6. A CONNECT tunnel, a bound host's request and a plain-HTTP request whose host resolves to an address inside one of them are refused `403 ADDRESS_REFUSED` naming the setting, before anything is dialled. A name that resolves outside the ranges at that check and inside one when the proxy's transport dials a bound host's or a plain-HTTP request (DNS rebinding) gets a `502` whose body holds the same refusal's text, and that address is not dialled either. Every address is checked as the proxy dials it: an IPv4-mapped IPv6 address as the IPv4 address it holds, and a zoned IPv6 literal such as `[2001:db8::1%25eth0]` without its zone, so a zone does not take an address out of a range. That also closes a way to the broker's own pod: the unspecified address with a zone, `[::%25x]`, passed the fixed rules, and a socket to it connects on the pod's loopback; it is now refused as the unspecified address. `BROKER_AIRLOCK_TEST_DIAL_ALLOW` still opens an address it names.
  Every broker parses the setting, and refuses to start when an element is empty, is no CIDR prefix, or is an IPv4-mapped IPv6 prefix. With the airlock on (`BROKER_AIRLOCK_RULES_FILE`) in a cluster (`KUBERNETES_SERVICE_HOST` set to a non-empty value; empty or unset is outside a cluster), the broker also refuses to start when the setting is missing, when `KUBERNETES_SERVICE_HOST` is not an IP address, or when no range holds that address, read without a zone, so a deployment that missed its Service range cannot pass silently. Outside a cluster the setting is optional, and `dev-airlock.sh` starts its brokers outside any cluster.
  An IP address binds no secret as a rules host in any spelling: a client sends no TLS server name for an address, so the proxy refuses every request to its canonical form `sni mismatch`, and because the proxy takes a CONNECT host's port and brackets off and compares a request's address in its canonical form, it matches no request to any other spelling at all (`2001:db8:7:0::1`, `2001:0db8:7::1`, `::ffff:192.0.2.10`, an embedded IPv4 part, a zone, brackets, a trailing dot or a port). The broker refuses to start with such a file, and `airlock-check` refuses it, naming the entry, the host's position and that the service's host name is what to write, and repeating nothing of the host as written. A host name with a trailing dot (`api.github.com.`) matches only a request that writes the dot, which clients do not, so it is refused too, naming the name without the dot. A host that holds no address is refused naming no form: a scheme, an empty host, a host name with a port, a bracket or `%` around no address, a colon in no address, and a last label that is a number, such as an IPv4 address with a leading zero (`093.184.216.34`), fewer than four parts or a hex part, or a wildcard over one; and any other host the airlock's own validation refuses is refused first, as no DNS name, so its refusal no longer quotes the host. A host name written in upper or mixed case is still accepted.
