kind: Fixed
body: |-
  The broker's airlock proxy refuses a dial to the broker cluster's own addresses. A Kubernetes Service range can be public address space - GKE's default is `34.118.224.0/20` - so the proxy's rules for loopback, private, link-local and `100.64.0.0/10` addresses let a command with an airlock grant tunnel to a ClusterIP of the cluster the broker runs in, the broker's own Service among them.
  `BROKER_AIRLOCK_CLUSTER_RANGES` names that cluster's Service range and each pod or node range RFC 1918 does not already make private, as comma-separated CIDR prefixes, IPv4 or IPv6. A CONNECT tunnel, a bound host's request and a plain-HTTP request whose host resolves to an address inside one of them are refused `403 ADDRESS_REFUSED` naming the setting, before anything is dialled. A name that resolves outside the ranges at that check and inside one when the proxy's transport dials a bound host's or a plain-HTTP request (DNS rebinding) gets a `502` whose body holds the same refusal's text, and that address is not dialled either. Every address is checked as the proxy dials it: an IPv4-mapped IPv6 address as the IPv4 address it holds, and a zoned IPv6 literal such as `[2001:db8::1%25eth0]` without its zone, so a zone does not take an address out of a range. `BROKER_AIRLOCK_TEST_DIAL_ALLOW` still opens an address it names.
  Every broker parses the setting, and refuses to start when an element is empty, is no CIDR prefix, or is an IPv4-mapped IPv6 prefix. With the airlock on (`BROKER_AIRLOCK_RULES_FILE`) in a cluster (`KUBERNETES_SERVICE_HOST` set to a non-empty value; empty or unset is outside a cluster), the broker also refuses to start when the setting is missing, when `KUBERNETES_SERVICE_HOST` is not an IP address, or when no range holds that address, read without a zone, so a deployment that missed its Service range cannot pass silently. Outside a cluster the setting is optional, and `dev-airlock.sh` starts its brokers outside any cluster.
  Because the proxy compares a request's address in its canonical form, a host that a rules entry writes as an IP address in another form, such as `2001:db8:7:0::1`, `::ffff:93.184.216.34` or an address with a zone, would bind nothing. The broker refuses to start with such a file, and `airlock-check` refuses it, naming the entry, the host's position and the form to write it in, such as `2001:db8:7::1` or `93.184.216.34`. A host written in upper case is still accepted.
