kind: Changed
body: |-
  An issue's parent may be an issue of another project, on `POST /api/v1/issues` and on
  `PATCH /api/v1/issues/{key}`; Dispatch answered `400 PARENT_INPUT` "parent must be in the same
  project". The not-found, self, cycle and 32-link depth refusals still hold, counted across
  projects. A credential scoped to one project is refused a parent outside it with
  `403 PROJECT_SCOPE`, naming the parent and its project, as it is refused such a `blocked_by`
  target. A parent of another project passes on no repository, components, architecture owner
  or `legion` label: the walks that resolve `resolved_repo`, an inherited component attachment,
  the architecture tree's owner, `legion_managed_status` and the delivery views' ancestors read
  only ancestors of the issue's own project, so such an issue takes its own project's default
  repository and is a root for each. The children list, progress, coverage and `advances` still
  read the tree across projects.
time: 2026-11-21T19:02:54Z
