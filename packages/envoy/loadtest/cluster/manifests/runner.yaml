# runner.yaml: the pod loadgen runs in: 8 CPU / 16Gi, request = limit, with an emptyDir /work into
# which cluster.sh copies a static loadgen, seed.json and each step's copy-meta file, and from
# which it copies each step directory back, then removes it. loadgen runs detached inside it
# through kubectl exec. A bare pod, so a crash is not hidden by a restart; activeDeadlineSeconds
# ends it 12 hours after it starts. cluster.sh fills every placeholder from validated values.
#
# loadgen's credential at the listener is this pod's own: it runs as the ServiceAccount
# loadgen-runner, which the deployment declares in the load-test namespace (the load-test Role writes
# no ServiceAccount) and the listener lists (manifests/listener.yaml), and the kubelet keeps that
# account's token for the listener's audience at /var/run/secrets/envoy-listener/token, rewriting
# it before it expires. Every runner job reads it there at each request (-listener-token-file,
# cluster.sh endpoints). That account's token marks no role: the listener takes a role mark from
# Dispatch's account alone.
apiVersion: v1
kind: Pod
metadata:
  name: runner
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/part-of: dispatch-loadtest
    dispatch-loadtest/run: __RUN_ID__
    dispatch-loadtest/role: runner
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
spec:
  serviceAccountName: loadgen-runner
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  activeDeadlineSeconds: 43200
  terminationGracePeriodSeconds: 5
  containers:
    - name: runner
      image: __RUNNER_IMAGE__
      command: [sleep, infinity]
      workingDir: /work
      env:
        # loadgen's default root; under -allow-foreign it reads no stack.json from it.
        - name: LOADTEST_ROOT
          value: /work
      resources:
        requests:
          cpu: "8"
          memory: 16Gi
          ephemeral-storage: 5Gi
        limits:
          cpu: "8"
          memory: 16Gi
          ephemeral-storage: 5Gi
      volumeMounts:
        - name: work
          mountPath: /work
        - name: envoy-listener-token
          mountPath: /var/run/secrets/envoy-listener
          readOnly: true
  volumes:
    - name: work
      emptyDir:
        sizeLimit: 4Gi
    - name: envoy-listener-token
      projected:
        sources:
          - serviceAccountToken:
              audience: envoy-listener-loadtest
              expirationSeconds: 3600
              path: token
