# Random order for every `bun test` started from packages/dispatch: `bun run test`,
# `bun run test:web`, `bun run test:harness`, `bun run test:repeat`, CI's "Test dispatch dashboard"
# step, the weekly repeated job, and a developer's own `bun test <file>` from this directory.
# Bun reads bunfig.toml from the working directory only, not from a parent directory.
# `bun run <script>` runs in this package's directory, so this file reaches every script from any
# directory. It does not reach a `bun test` started from the repository root or from a
# subdirectory of this package.
#
# Each lane prints its own ` --seed=<n>` in its summary. To reproduce a failure, run its file
# alone with that seed:
#   bun run test:web web/src/<file> --seed=<n>
#   bun run test:harness e2e/__tests__/<file> --seed=<n>
# Add `--rerun-each=2` for a row that fails only on a rerun. This works because the order of the
# tests in a file depends only on the seed and on that file, not on the other files of the run.
# A `--seed` on the command line takes the place of the random seed this file gives.
# Nothing turns random order off once this file sets it: `--randomize=false` is refused, and
# `--no-randomize` still shuffles.
#
# This file holds no preload. Commit b7a20b11c4 (pull request #2884) deleted an earlier
# packages/dispatch/bunfig.toml so that the e2e lane loads no preload.
[test]
randomize = true
