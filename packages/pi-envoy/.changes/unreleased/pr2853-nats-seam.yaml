kind: Fixed
body: |-
  `dialNats` takes its dial through `setNatsConnectForTests`, so a test no longer replaces the `nats` module for its whole process and `bun run test` is one process again. The rows that prove nothing dials nats.js's default `127.0.0.1:4222` count each dial where nats.js makes it and bind no port, so they run on every machine, with that port free or taken. The suite restores every environment name and the working directory it changes.
