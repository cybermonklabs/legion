kind: Changed
body: |-
  The `agent-secrets` skill says the store credential comes from the environment, never a
  `--profile` flag: on Google Cloud the order is `CLOUDSDK_AUTH_ACCESS_TOKEN`,
  `GOOGLE_APPLICATION_CREDENTIALS`, `CLOUDSDK_ACTIVE_CONFIG_NAME` or `CLOUDSDK_CORE_ACCOUNT`, the
  well-known credentials file, the active gcloud account, and last the metadata server; on AWS it
  is the AWS SDK's own: access keys in the environment, then `AWS_WEB_IDENTITY_TOKEN_FILE`, then
  `AWS_PROFILE`, then `AWS_DEFAULT_PROFILE`, then the rest of the SDK's default chain. A source
  present but broken stops the command, every form names the credential it uses, and a store
  refusal says how to choose another. On a shared dev box, an agent writes as the machine by naming
  the machine's own gcloud login in `CLOUDSDK_CORE_ACCOUNT` or `CLOUDSDK_ACTIVE_CONFIG_NAME`, and
  never chooses a gcloud configuration that holds a person's login, since the call then runs as
  that person: the person runs such a command in their own shell.
