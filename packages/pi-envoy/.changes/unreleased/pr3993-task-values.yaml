kind: Changed
body: |-
  The Envoy plugin hands each task value its listener relays to the Legion plugin, and holds an idle
  card without a turn while a Legion task's turn is pending, so the task's turn starts first. The
  plugin interface between the two is version 7: install both plugins from the same release. A
  session on the listener's relay socket (`ENVOY_INBOUND=listener`) takes its task values on the
  socket as one on NATS does, and each reopen of the socket has the Legion plugin read its task
  again.
