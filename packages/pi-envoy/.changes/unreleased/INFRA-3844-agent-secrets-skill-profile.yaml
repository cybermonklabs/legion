kind: Changed
body: |-
  The `agent-secrets` skill says the store credential comes from the environment, never a
  `--profile` flag: on Google Cloud the order is `CLOUDSDK_AUTH_ACCESS_TOKEN`,
  `GOOGLE_APPLICATION_CREDENTIALS`, `CLOUDSDK_ACTIVE_CONFIG_NAME` or `CLOUDSDK_CORE_ACCOUNT`, the
  well-known credentials file, the active gcloud account, and last the metadata server; on AWS,
  `AWS_PROFILE`, else `AWS_DEFAULT_PROFILE`, else the SDK's default chain. A source present but
  broken stops the command, every form names the credential it uses, and a store refusal says how
  to choose another.
