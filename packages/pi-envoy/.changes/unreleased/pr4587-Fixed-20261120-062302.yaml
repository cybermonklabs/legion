kind: Fixed
body: 'The role takeover smoke (`scripts/smoke-role-takeover.sh`) no longer fails at random on a loaded machine. In the rows where a claimant must be refused, the holder answers for its claim after the claimant''s process is up and right before each claim, or, for a Claude Code channel server, which claims as it boots, from right before its process starts until it has claimed or, where it must go on being refused, until its start has ended. Before each refusal it reads, each such row checks that every claim it needs refused was weighed inside the live window of the holder''s last answer, and fails naming that window where one was not; in a Claude Code `/clear` handoff those are the claims made before the holder''s first claim under its new id, which the channel server sends only after it has read the role record, since nothing renews the holder''s claim during the handoff. A row that starts from where an earlier row left the role first reads which session and which process hold it, so an earlier row''s failure is named in it and never read as a claim that was not made. A Claude Code channel server counts as started once it answers a tool, not once the listener has its registration, and one that answers that tool late no longer ends the run. A new first row checks that the clients'' command channel refuses an answer that is not ok.'
