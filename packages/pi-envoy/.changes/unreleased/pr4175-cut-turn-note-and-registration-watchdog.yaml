kind: Added
body: |-
    A session Legion drives whose previous process ended in a turn is told so at its start, before
    the first turn it runs. The note asks the agent to read what that turn did before it acts
    again, names each delivery card the host wrote into that turn, and starts no turn itself. Each
    session is told once. Every run of such a session leaves an `envoy-turn-mark` entry in its
    transcript, at its start and at an end the host settles, so a process killed in a provider
    retry's backoff reads as a cut turn too. A transcript written before the marks is read from its
    newest assistant message. Until the note is written, every start of a turn waits for it, for 10
    seconds at most, and logs a `warn` when it goes without it. Plugin interface version 6, whose
    `cutTurnNote` `@sjawhar/pi-legion`'s phase reminder reads: install it with the
    `@sjawhar/pi-legion` released beside it.
    A session whose heartbeat timer stopped registers with Envoy again. After 5 minutes with no
    accepted registration and no heartbeat tick, a watchdog on the process's own timer arms the
    heartbeat again and registers at once under the same session, and its retries back off to at
    most a minute. While registrations are accepted or the heartbeat still ticks, it does nothing,
    and a clean shutdown stops it.
