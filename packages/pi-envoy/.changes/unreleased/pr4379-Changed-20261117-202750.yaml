kind: Changed
body: |-
    A person's Send whose accept answer was lost is asked again under its key whatever Dispatch's
    `/healthz` answers, so it becomes the person's turn on the replay rather than a card: every
    Dispatch that carries `b1c42d1d7d` runs the keyed layer, and the Dispatch client no longer reads
    `/healthz` before it resends a keyed write. Before, a `/healthz` that was refused, timed out or
    answered no JSON left the accept a single attempt.
