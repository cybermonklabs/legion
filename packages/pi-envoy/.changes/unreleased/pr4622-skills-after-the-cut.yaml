kind: Changed
custom:
  Issue: pr4622
body: |-
  The Dispatch skills add rules for what agents write to a person: plain-words
  is a required read before such a text, a claim carries its source or `[INFERENCE]`, the writer
  reads the code that already does the nearest thing, the answer comes in the shape asked for,
  each `doc-edit` is guarded by the newest document token, and an upload is linked from a
  comment or ask. The three skills stay under their word budget. `envoy`, `agent-secrets`,
  `approval-review`, `asd-ste100`, `outside-message`, `plain-words` and the thermonuclear review
  skills take back the rules the skill cut of #4447 lost, in their old words.
