kind: Changed
body: |-
  The `agent-secrets` skill says that a command not on `PATH` is refused before the broker is asked
  anything, that `secret create` on Google Cloud makes the secret before it asks for the value,
  deletes it again when it stores none, and keeps one the store's answer leaves open may hold the
  value, naming the command that checks it, and that `PENDING_VALUE`, a secret whose owner is
  storing its first value, is not final: ask again in a few minutes.
