kind: Changed
body: |-
  An Oh My Pi session in a pod whose trade reaches the secrets broker before the pod's
  registration does is no longer refused for good. Its broker credential trades again in the
  background, 15 s later, doubling to 5 minutes, until a trade lands, and the pod's log says so
  once, naming the session, and again every 30 minutes. A Dispatch or Envoy call still waiting at
  its own deadline fails naming the session and saying the trade is being retried, and the next
  call goes through once the registration lands. Every other refusal fails the call as before.
