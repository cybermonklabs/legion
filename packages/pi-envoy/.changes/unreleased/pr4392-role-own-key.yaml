kind: Changed
custom:
  Issue: pr4392
body: |-
  In a pod, an Oh My Pi session trades at the secrets broker with its role's own agent-secrets key:
  the `key.pem` in the directory `AGENT_SECRETS_KEY_DIR` names, which the role's pod-session
  registration names. When that file cannot be read, the call fails naming the directory by
  `AGENT_SECRETS_KEY_DIR` and the read's error code, never its path. The bundled
  `dispatch` command gains `dispatch api --path <route>`, one GET of a route under `/api/v1` that
  no other command reads, with the session's own credential.
