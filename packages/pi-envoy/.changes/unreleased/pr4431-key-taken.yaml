kind: Fixed
body: |-
  `envoy_send` and `envoy_publish` answer a repeat of an idempotency key another sender's message already holds as not delivered, naming that message's event id (`delivered: false`, `key_taken: true`) and saying how to send it again (`envoy_send` without an idempotency_key; `envoy_publish` again), where they reported it as delivered. A send or a publish that names its session tells the listener it reads that answer.
