kind: Added
body: |-
  A resumed Legion controller of either launch form (the plugin interface's new
  `watchedWorkflowsRoleOwned`, which pi-legion sets) unregisters every default-branch workflow
  topic its stored interest row holds
  (`notifications.github.<owner>.<repo>.default_branch.workflow.<file>.<action>.<event>`) and
  restores none of them, in the same removal as the Slack topics a daemon-launched controller
  already drops: those topics belong to the controller role, and a restored one would have an
  edge listener that cannot read the project's repositories refuse the role claim and every other
  topic. A Legion plugin's subscription that lasts while the session holds a role, asked while it
  does not hold that role, is refused with `RoleNotHeldError`, which the Legion plugin reads by its
  name. A Legion plugin's subscription whose registration fails unfollows its topic only when
  that subscription followed it: a renewed subscription of a topic the session already follows,
  as each claim of a Legion controller makes for its watched and Slack topics, leaves that topic
  followed and its role mark in place. Subscriptions of one topic run one after another, so a
  later one follows the topic again after an earlier one failed. The log line of a failed removal
  now names the resumed controller's retired role-owned topics. Plugin interface version 7, which
  pi-envoy reads; install it with the `@sjawhar/pi-legion` released beside it.
