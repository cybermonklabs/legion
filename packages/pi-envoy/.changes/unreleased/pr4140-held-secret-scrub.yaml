kind: Fixed
body: |-
  Five surfaces the extension prints through pass the scrub of the secrets the process holds
  (`@legion/contracts/held-secrets`): its log lines (the host's logger, every message and field),
  its own console prints (a delivery that failed, with its error), the notices and status it sets
  on a context the host hands an event handler or a tool (`ui.notify`, `ui.setStatus`), the text
  each of its tools answers, and the error each throws. A server at the wrong URL that echoes a
  token the session sent it, whole or in a run of 10 or more characters, prints `<withheld>`
  there. Messages the extension delivers into the session (a peer's Envoy message, a person's
  Dispatch reply) are their senders' words and are not scrubbed. A line that holds no held secret
  reaches the host as it was.
