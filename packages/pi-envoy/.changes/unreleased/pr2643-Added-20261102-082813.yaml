kind: Added
body: |-
  `envoy_send` says whether its target was running or the message was queued for a stopped
  session, with `state` and, when the listener names one, `last_seen` in the result's details, and
  `envoy_publish` says how many other sessions get the message and how many of those are running
  now (`recipients`, `recipients_connected`). The session's relay subscription answers the
  listener's connection probe, so a send to this session reads `connected` while the extension
  holds its NATS connection, and `stopped` once that connection closes or a session switch moves
  the relay to another id.
