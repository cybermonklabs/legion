kind: Changed
body: 'The Dispatch skill''s "Choosing what to work on" no longer sends a waiting issue, or every issue past the third, to `backlog`. It states one rule instead: move an issue to `backlog`, `icebox` or `triage` only when a person asked for that move, or when the work is done, folded into another issue or no longer needed, and cite that reason in a comment on the issue. It also states what a session does when it stops work: release the claim, say why in a comment, record the wait as a `blocked_by` link or a `dispatch ask`, and leave the status, the priority and the board rank as it found them.'
