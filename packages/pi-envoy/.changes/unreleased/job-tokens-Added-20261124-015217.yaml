kind: Added
body: |-
  The bundled broker client takes `AGENT_SECRETS_MACHINE_IDENTITY=github-actions`, a GitHub Actions
  run's identity. It reads `ACTIONS_ID_TOKEN_REQUEST_URL` and `ACTIONS_ID_TOKEN_REQUEST_TOKEN`,
  which GitHub sets in a job that holds `id-token: write`, and `AGENT_SECRETS_MACHINE_AUDIENCE`,
  which must equal the broker's `BROKER_EXCHANGE_GITHUB_AUDIENCE`. It asks GitHub for a new token
  at every trade. A GitHub Actions job runs the bundled `dispatch api` with no host, as the
  package's `bin/dispatch`, with bun on its `PATH`, and writes to Dispatch with its `--method` and
  a body.
time: 2026-11-24T01:52:17Z
