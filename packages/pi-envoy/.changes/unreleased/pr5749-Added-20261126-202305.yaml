kind: Added
body: |-
  `ENVOY_ROLE_TOPICS`, a JSON object from Envoy role name to a list of topics, names topics the
  session holding a role follows for as long as it holds it. Each time a hold of a named role lands
  in the process, however it was taken (the launch's role, `envoy_role_set`, the Legion plugin's
  claim, a hold restored after a hand-back), the session follows that role's topics and registers
  them at once; when the role ends they are closed and taken out of the listener's registry. The
  role's are only the subjects that hold's own follow added, so a topic the session followed
  itself stays its own. So a relaunched session follows them again when it takes the role, and a
  session holding any other role follows none, though every pod carries the same variable. A
  session that resumes a session id whose row still holds the role's topics, which a process that
  ended never closed, follows none of them: the role's claim does, and the pass takes the rest out
  of the row. A topic an edge listener refuses leaves the role's until the role ends. A value that
  is not such an object, two keys the listener reads as one role, or a topic the stream does not
  store or whose wildcard is misplaced refuses the whole variable, which the plugin logs and each
  session start says.
