kind: Changed
custom:
  Issue: pr3995
body: |-
  `dispatch-writing-specs` no longer asks that a sentence citing a passing gate say what the pass
  does not show. A claim you cannot measure stays out of an ask until it is measured, where before
  it could stay in, marked unverified. The skill no longer asks you to count the files that hold
  each term you coined. Its two fresh-subagent steps, before each spec write and before each
  approval request, are now one step of guidance: give a large or changed spec to a fresh subagent
  where you cannot check it alone.

  `thermonuclear-deep-review` ends its report with a `Security:` line only when the diff touches a
  row of its Security Guidelines, and no longer writes `Security: no sensitive surface in this
  diff.`

  In `plain-words`, the row that replaces "name the problem, name the owner, name a date" now
  reads "say the problem; who owns it is X; Y is left, and Z decides when it ends". Before, it
  ended with a date projected from the measured rate.
