kind: Fixed
body: |-
  AskGate writes down every verdict it reaches on a Dispatch write, so the `dispatch` CLI can
  tell a rejected write from one no review ever saw. It mints no marker when it rejects, and the
  CLI read that missing marker as "nobody looked": a write the model had refused posted when the
  agent sent it again through any form the gate does not read.
  Every source that decides now records and clears. A review that rejects writes the verdict into
  the session's own state directory, under the identity of the write the model judged rather than
  the words of the command; a review that allows removes the verdict it replaces; and a rebuttal
  or a breaker trip clears too, since each is the agent's own sanctioned override and a no that
  survives its override is a trap. Device calls record and clear on the same terms as bash calls.
  Nothing bounds how often an agent may rebut, which is the design: every rebuttal is recorded
  and published, so a standing verdict is one deliberate, attributable override from gone.
  A verdict the gate could not write down marks the session: for the rest of its life the CLI
  reads a write it has nothing recorded against as unknown rather than as unreviewed. The mark
  never clears, since the lost verdict stays lost.
  A gated write the gate never read posts with the CLI's warning in every mode, and pi-envoy
  records it as `unmarked` with `decision: allow` and `verdictMode: warn`, carrying `sessionMode`
  where the session had chosen `block`. The operator report's two unmarked-write lines are
  renamed to what they count: "unmarked writes refused, a review standing behind each" and
  "unmarked writes posted, no review having seen them".
  The in-process gate's decisions are unchanged: a review that runs and returns a revise still
  blocks the call in block mode, a rules match still refuses in either mode, and a call given up
  without a verdict is still held back. dispatch://INFRA-2079, row 3.5.
