kind: Changed
body: |-
  `envoy_send` and `envoy_publish` report the Envoy listener's `503` that says the message was not
  sent, given while the deployed stream does not capture the topic, as during a hub move, as that
  answer: nothing was stored, so the message may be sent again later. Before, `envoy_send` said the
  send was not confirmed delivered and might have arrived. Both tool descriptions say so too.
