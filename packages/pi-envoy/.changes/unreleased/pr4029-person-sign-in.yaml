kind: Added
body: |-
  An Oh My Pi session with no bearer configured trades a person's sign-in at the secrets broker
  where a person ran `agent-secrets login` on the machine, so its Dispatch and Envoy tokens name
  that person. With no sign-in, it trades the machine as before. A refused sign-in fails the
  session's broker calls with words that name `agent-secrets login`, and the session never trades
  the machine in its place. `AGENT_SECRETS_MACHINE_IDENTITY=pool` trades as well. The bundled
  `dispatch` command gains `dispatch review`. After `agent-secrets login`, start a new session
  rather than resume one that traded at the broker as the machine.
