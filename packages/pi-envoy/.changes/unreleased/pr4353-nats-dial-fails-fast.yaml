kind: Fixed
body: |-
  A session whose start blocks its event loop past the NATS hub's 2 s authentication timeout now
  registers in its session_start pass: the dial the hub closes fails at once and is dialed again,
  within the pass's deadline less the time the rest of the pass may need (the first subscription's
  confirmation and one listener call, 20.25 s at the defaults), at most 25 s. Each redial is logged
  with its reason and its wait. The refused registration of a session with no relay subject, and
  the "receives nothing" notice, name the NATS failure; and a session told it receives nothing is
  told, in the log, the UI and the transcript ("Envoy inbound restored"), once a registration is
  accepted again, where before the outage notice was the last word it had. A relay subject, or
  the live view's control subject, that a session loses after its start (its NATS connection
  closed for good, or the subscription ended) is opened again by the next heartbeat's pass. Before,
  only the relay's own redial opened it, waiting 15 s after each failed dial, and the live view's
  own redial gave up after one failure. A registration sent while the relay is missing names why
  it is missing.
