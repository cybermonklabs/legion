kind: Fixed
body: 'A link or a fifo that a role leaves at the leak-check install''s tag file, in place of the install''s or a workspace''s parent directory, or in its own private directory no longer holds the pod''s launcher or the outbox, and no longer has them delete what the link names: the install reads its recorded tag with a bounded read that follows no link and refuses anything but a regular file, and these removals of a tree a role writes follow no link, under gVisor as under Linux: the install''s staging and moved-aside directories, a workspace''s aside, the shared clone''s git worktree entries, an incomplete shared clone and its temporary sibling, the provisioning credential directory, the feed''s foreign git directory, staging clone and failed transfers, and what the launcher and role-init clear from a role''s private directory and homes.'
