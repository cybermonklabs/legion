kind: Fixed
body: 'A link or a fifo that a role leaves at the leak-check install''s tag file, at its Claude Code transcript, in place of the install''s or a workspace''s parent directory, in its own private directory or in its gh directory no longer holds the pod''s launcher, the outbox or the tmux daemon, and no longer has them delete what the link names: the install reads its recorded tag with a bounded read that follows no link and refuses anything but a regular file; the launcher opens a Claude Code transcript, its phase-reminder record and the marker it writes beside the transcript the same way, and a resume reads no further than one byte past the row it restores; and these removals of a tree a role writes follow no link, under gVisor as under Linux: the install''s staging and moved-aside directories, a workspace''s aside, the shared clone''s git worktree entries, an incomplete shared clone and its temporary sibling, the provisioning credential directory, the feed''s foreign git directory, staging clone and failed transfers, what the launcher and role-init clear from a role''s private directory and homes, and what the gh bundle''s refresh, the tmux daemon''s prune of a claim''s files and `legion controller start` clear from a gh directory.'
