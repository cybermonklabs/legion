kind: Fixed
body: 'A link or a fifo that a role leaves at the leak-check install''s tag file, in place of the install''s or a workspace''s parent directory, or in its own private directory no longer holds the pod''s launcher or the outbox, and no longer has them delete what the link names: the install reads its recorded tag with a bounded read that follows no link and refuses anything but a regular file, and every removal of a tree a role writes, the launcher''s and role-init''s included, follows no link under gVisor as under Linux.'
