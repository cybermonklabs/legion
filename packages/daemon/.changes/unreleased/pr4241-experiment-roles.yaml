kind: Added
body: |-
    `projects.<KEY>.experiments.<NAME>.roles` names the issue roles whose launches load an
    experiment's arms. A launch of a role the list leaves out runs on the deployment's own
    settings, and its unit keeps the arm it drew, so an experiment can leave the roles that judge
    the work (the reviewer, the tester, the architect who accepts it) out of what it changes.
    With no `roles`, every issue role loads the arms, as before. The loader refuses a role that is
    not an issue role, a role named twice and an empty list, and the settings carry the list.
