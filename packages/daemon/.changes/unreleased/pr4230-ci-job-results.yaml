kind: Changed
body: |-
  The reviewer's and the tester's role prompts say that a check carrying `ci_check` takes its results from CI: the one `dispatch results` derives from its CI run, and each one its CI job recorded, which stand for both roles. Each of the two prompts reads the line of its own head under each check in `dispatch results`. A pass and a fail at one head, from any role, leave that head not known: the reviewer requests changes naming the check, the tester records a test failure, and neither waits for a later result. The reviewer's request comes at once: its wait for a `ci_check` run still going, or for GitHub where it could not be read, leaves that state out.
  The reviewer's role prompt says that a pass stands for its approval only from the implementer and from the tester both: a line of its head that names one of the two roles alone is no pass. Its *Final review gate* says so too, with the pass from CI of a check carrying `ci_check` and the refusal of a pass and a fail at one head, and the gate's first mention in its review mechanics points there. The architect's role prompts say that a pass and a fail at one head leave a check not known: the architect sends the issue back naming the check, does not accept it and does not wait for a later result.
