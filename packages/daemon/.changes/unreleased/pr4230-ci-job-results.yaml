kind: Changed
body: |-
  The reviewer's and the tester's role prompts say that a check carrying `ci_check` takes its results from CI: the one `dispatch results` derives from its CI run, and each one its CI job recorded. Each of the two prompts reads the line of its own head under each check in `dispatch results`. A pass and a fail at one head, from any role, leave that head not known: the reviewer requests changes naming the check, the tester records a test failure, and neither waits for a later result. The reviewer's request comes at once: its wait for a `ci_check` run still going, or for GitHub where it could not be read, leaves that state out. The tester's role prompt no longer counts a `before_merge` check as a test failure because its line for the head does not read yes from the implementer: the tester runs and records every `before_merge` check itself, a whole test suite excepted. The implementer's role prompt no longer says that the tester records such a test failure.
  The reviewer's role prompt says that a check passes for its approval when its line at the head reads yes, whoever recorded the pass: it no longer asks a pass from the implementer and from the tester. Its *Final review gate* says so too, with the state from CI of a check carrying `ci_check` and the refusal of a pass and a fail at one head, and the gate's first mention in its review mechanics points there; the merge-gate order it cites starts with the testing step passed, each check reading yes at the head it tested, where it read tester green. The architect's role prompts say that a pass and a fail at one head leave a check not known: the architect sends the issue back naming the check, does not accept it and does not wait for a later result.
  The reviewer's role prompt says that a pass the session that made the head under review recorded at that head counts for nothing in its decision, though Dispatch's state reads no recorder: the reviewer names that session from the `implement` handoff whose `head` is that head, runs the check's command itself and records the result before it approves, or sends the issue back to testing with `request_backward_move`.
