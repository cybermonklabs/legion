kind: Changed
body: |-
  The check states tests are split by concern, with no change of behaviour. In `internal/workflow`,
  `check_states_test.go` keeps the rig, and the judgement tables, the tester's move and the
  fact's own transaction move to `check_states_judge_test.go`, `check_states_move_test.go` and
  `check_states_store_test.go`. The live proof's driver (`e2e`) keeps its run, rig and stand-ins
  in `check_states_live_test.go`, and its cases, what a case drives, what it reads of the daemon,
  Dispatch's own records and the broker's stop move to `check_states_live_cases_test.go`,
  `check_states_live_drive_test.go`, `check_states_live_reads_test.go`,
  `check_states_live_records_test.go` and `check_states_live_broker_test.go`, each under the same
  `e2e` tag. Every test keeps its name.
time: 2026-11-22T00:03:04Z
