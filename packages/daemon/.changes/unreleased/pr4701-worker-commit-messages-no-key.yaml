kind: Changed
body: |-
  The worker and implementer role prompts no longer start a commit message with the issue key: the empty commit that carries a pull request onto the pushed commit, and the empty commit of a root whose code lands through its children, now have messages without that prefix.
  The branch `legion/<KEY>` already ties the pull request to its issue.
