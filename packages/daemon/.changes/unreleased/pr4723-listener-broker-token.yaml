kind: Added
custom:
  Issue: pr4723
body: |-
  Under `runtime: kubernetes`, `envoy_token_file` may be left out where
  `runtime.kubernetes.agent_secrets.exchange_audience` is set. No pod is then handed the Envoy
  bearer, and each pod's sessions trade their own broker tokens. The daemon trades its own pod
  identity at the secrets broker (`AGENT_SECRETS_URL`, `AGENT_SECRETS_MACHINE_IDENTITY=kubernetes`,
  `AGENT_SECRETS_MACHINE_TOKEN_FILE`) for a token of the session `legion-daemon:<PROJECT>`. Every
  call it makes of the listener carries `Authorization: DPoP <token>` and a proof of the call's URL:
  the outbox's publishes, the role lookups, the clean stops and the controller probe. `envoy_url`
  must therefore be the listener's `ENVOY_PUBLIC_URL`. The trade, its refusals and its renewal are
  those of `dispatch_token_broker`; a daemon that sets both makes one trade.

  After the trade, the boot reads the project's controller role at the listener with that token. It
  waits out a listener that does not answer or answers 429, 502, 503 or 504. It goes on only on an
  answer the listener gives behind its credential check (a holder, none, or a 500), and refuses to
  boot on any other (a 401 or 403, a redirect, or a body that is not the listener's), naming
  `envoy_url` and `ENVOY_PUBLIC_URL`. The boot then logs
  `legion daemon's Envoy listener credential` with `credential=broker` and the session. A launch
  into a pod built before `exchange_audience` was set, which carries no exchange identity, waits for
  that pod's update round rather than start with no credential for the listener. A daemon that names
  `envoy_token_file` sends its bearer byte for byte as before. The renewal's Error line is now
  `legion daemon's broker credential renewal stopped`.
