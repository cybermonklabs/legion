kind: Fixed
body: |-
  The pod of an issue that waits in the admission line no longer stands idle for the whole wait. Such an issue gave its slot back to wait on a blocker, or had its work come back, and it owes its worker a start marked to wait for its admission slot; the outbox holds that start back until the issue holds a slot again. The idle rule counted the start as a delivery waiting for a role of the pod, so it held the pod as `delivery_waiting` for as long as the issue waited: on 2026-11-26 at 08:36Z, 20 INFRA pods of issues with no slot, 40 CPU in all, 13 of them held since the daemon's first pass after its boot 11.7 hours before.
  The idle release, its boundary and its teardown, and the release of a pod no claim owns, now leave such a start out while no slot of its issue stands, as they leave out a start queued for news alone (`idleWaitingRow`): the pod is released after the idle period, and the start wakes the claim the release suspended when the slot comes, as any start does. Once the slot stands, the start holds the pod and cancels a release as before, and the teardown now also reads a start below the release's own rows: one whose slot came after the boundary's read cancels the teardown as the pod being used again.
  A backstop of such an issue now fires and wakes no one. Its wake would tell the worker to take up its phase while the admission cap says the issue may not run, and the released pod would come back, go idle and be released again at every backstop of the wait. The slot's start brings the worker back. Only a start of the issue's current phase and generation silences a backstop: an older one, which admission finishes without acting, brings no worker back.
time: 2026-11-26T08:53:20Z
