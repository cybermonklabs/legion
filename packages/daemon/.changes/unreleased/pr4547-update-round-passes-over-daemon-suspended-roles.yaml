kind: Fixed
body: |-
    A pod update round no longer holds a pod until its bound for a role that the daemon itself
    suspended (by its own rule, by a root's exit, by an idle release or by an unknown source). The
    round asks and waits for the same roles (one predicate), and it does not ask, wake or resume
    such a role: an ask queued before the suspension now ends without a publish. An operator's
    suspension still holds the round past its bound, and a role that the project pause stopped
    stays the pause's while the pause keeps its pod. Before the round replaces a pod without
    waiting for such a role, it reads the issue workspace once through a role whose process runs in
    the pod (the new shim frame `workspace-work`), and writes one message on the issue where the
    read finds work that no branch or tag at origin holds, or fails. A round whose pod has no role
    process in it is replaced by issue where nothing holds the pod, and a launch into such a pod
    reads the round's bound when it runs and replaces the pod first, so the role starts once. The
    sweep decides the end of a round once while the end reaches the roles' machines, and a pod the
    runtime cannot read is told to the controller once past the round's bound.
