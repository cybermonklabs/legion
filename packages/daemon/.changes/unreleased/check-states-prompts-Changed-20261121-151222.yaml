kind: Changed
body: |-
  The role prompts follow the check states. The tester records each check's result with
  `dispatch result`, then completes with a `summary` and no `verdict`; its prompt says the daemon
  moves the issue by Dispatch's state of each `before_merge` check at the head its test record
  names, once each check has a state it ends at (a check with no state yet, or with no result while
  its CI run goes on, holds the move): to the reviewer when each reads yes, and otherwise back to
  the implementer with a task naming each check that does not read yes, a check Dispatch could not
  read among them. It records a check it runs and finds failing with `--verdict fail`, and that fail
  result, not its handoff, sends the issue back, since the daemon reads no handoff; it is
  told Dispatch's own rule of a yes: a pass of any role with no fail at that commit. The reviewer is
  told no phase completion carries a verdict
  (`VERDICT_NOT_TAKEN`) and that the evidence of each check is the line of its head in
  `dispatch results`; the prompt no longer names `VERDICT_ROLE_FORBIDDEN` or `Tester's verdict:`.
  The architect is told a tester's `phase-finished` notice says, in its `reason`, each check that
  does not pass at the tested head when the move sent the issue back, and what the move waits for
  when it waits, naming the checks only where the daemon knows which, in place of a verdict. Its
  role prompt no longer says a tester completion that rejects the implementer's results goes back
  by the daemon's table: the tester's completion carries no verdict, and the move follows the state
  of each check at the head the tester's record names.
