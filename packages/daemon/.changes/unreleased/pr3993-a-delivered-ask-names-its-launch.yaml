kind: Fixed
body: |-
  A merge-forward ask, a merge-queue removal and a merge-holds change wait for the role's claim to
  have a launch that registered its session, whatever the Envoy listener would answer, and an ask
  whose publish the listener answers with no holder named is credited to that launch. Before, a
  listener that took every publish let such a row be delivered before the role's first launch, or
  be credited to no launch, so the row's end or the ready of that launch sent the ask again, and
  the asked role was told it twice: main's nightly live proofs `conflict-merger` and
  `conflict-no-takeover` failed on it (run 46014564776). A later launch of the role is still told
  the ask, at the row's end or at its ready.
