kind: Fixed
body: |-
  A merge-forward ask whose publish the Envoy listener answers with no holder named is credited to
  the launch the daemon published it to, the launch whose registered session it waited for. Before,
  such a delivery named no launch told, so the end of the row and the ready of that launch each
  sent the ask to the same launch again, and the asked role was told it twice: main's nightly live
  proofs `conflict-merger` and `conflict-no-takeover` failed on it (run 46014564776). A later
  launch of the role is still told the ask, at the row's end or at its ready.
time: 2026-11-27T16:06:02Z
