kind: Added
body: |-
  The leak guard's rule pass reads a push's diff as git writes it and scans its records in batches
  of at most 64 MiB of record text (a longer line alone), so its memory is about one batch, one
  line and the engine's cost of one record, whatever the size of the push. It held the whole diff
  and every record of the push before.

  `legion leak-check record <rev>...` writes a blob record: a git note under
  `refs/notes/legion-leak-guard` on each file version of those revisions' trees that no content
  pattern of the rules matches a line of, with the line `pass <key>`. The key is the sha256 of a
  tag naming the record, the sha256 of the embedded rule file, the gitleaks module's version and
  the Go version of the binary. A push then reads no line of a version its record covers under
  the key of the binary that pushes, and says how many versions the record covered and how many
  the rules read; it reads every ref name, commit identity, message and path, and every other
  line, as before. A clone reads the record only once it has fetched the ref. With no such ref a
  push reads everything and says nothing; with one it cannot read it reads everything and says
  so. Whoever can write the ref in the pushing clone, or in the repository it is fetched from,
  can make a push skip a version's content.

  A path holding a space is now reported without the tab git ends its `+++` line with.
