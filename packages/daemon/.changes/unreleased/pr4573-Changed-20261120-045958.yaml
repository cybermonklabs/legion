kind: Changed
body: 'The daemon takes the owning architect''s `done`, `backlog`, `icebox` or `triage` on a child as it takes a person''s move: it drops the status writes it queued for the child, and the child leaves the workflow. Every other status that a session of the tree writes is still set back, and so is any status on the tree root. A set-back now carries the Dispatch sequence of the write it undoes and finishes without a write when a later status change by another writer follows that write. `POST /legion/v1/children/park` is removed: it answers an older plugin with 410 `ROUTE_REMOVED` and a reason that says which status to write in Dispatch. The daemon API contract is 205. Before a rollback to an earlier release, run the way back of migration `20261120012547_set_back_observed_seq` (`docs/kubernetes.md`).'
