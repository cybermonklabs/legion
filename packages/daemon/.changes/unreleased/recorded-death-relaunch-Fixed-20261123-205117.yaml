kind: Fixed
body: 'A daemon restart no longer puts the relaunch of a process the previous daemon found dead behind the whole of the restart''s wave. The boot raises that relaunch again at once, beside the unfinished launches it relaunches, from the death the claim''s record already charges (`DeathCharged`). Before, the only path that raised it again was the runtime''s next report of the death, and in an issue pod whose roles container restarted that report waits for the pod''s launcher to reconnect, a probe interval after boot: by then the boot''s wave held the wake pacing, and every role of the pod waited behind all of it. The relaunch is the one the death raised, so the later report decides nothing and charges no second death.'
