kind: Fixed
body: 'A daemon restart no longer puts the relaunch of a process the previous daemon found dead behind the whole of the restart''s wave. The boot raises that relaunch again at once, from the death the claim''s record already charges (`DeathCharged`), and reserves its turn in one order with the unfinished launches it relaunches, the order their claims'' work was owed. Before, the only path that raised it again was the runtime''s next report of the death, and in an issue pod whose roles container restarted that report waits for the pod''s launcher to reconnect, a probe interval after boot: by then the boot''s wave held the wake pacing, and every role of the pod waited behind all of it. The relaunch is the one the death raised, so the later report decides nothing and charges no second death. Two faults of the same window are fixed with it. A death is charged its one launch failure however often its relaunch is raised: before, a claim whose waiting relaunch a task''s write had stored was charged again after every restart, walking it toward the launch budget for one failed process. And a project pause''s stop of such a claim at boot owes it that relaunch for the pause''s end, where it owed none.'
