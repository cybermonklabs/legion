kind: Fixed
body: The merger's role prompt takes a pull request out of the merge queue with `dequeuePullRequest(input:{id:$pr})`, the input GitHub accepts; it sent `input:{pullRequestId:$pr}` before, which GitHub refuses, so the dequeue failed and the queue merged the pull request anyway.
