kind: Changed
body: |-
    The worker image carries Oh My Pi `18.18.6-sami.20261117-203324` of cybermonklabs/oh-my-pi in
    place of `18.18.6-sami.20261117-013345`. It adds `omp --session-id <uuid>`, which starts a new
    session under an id the caller gives and refuses one a stored session or a live process holds,
    and a `secrets.maskSessionStore` setting, off by default, that masks secrets before a session
    is stored. Its session store issues the same SQL statements as before.
