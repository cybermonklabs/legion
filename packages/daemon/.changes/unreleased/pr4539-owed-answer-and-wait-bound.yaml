kind: Fixed
body: |-
  `POST /legion/v1/claims/owed` answers that a claim owes a completion only where the completion
  route would take it: the claim serves the issue's current run, is not behind its phase entry,
  has no recorded completion of that entry, and no merge forward the daemon asked for holds its
  role. A merge forward of the head an open pull request stands at that has not landed holds the
  worker of the phase the issue stands in, the planner, the tester, the reviewer or the merger,
  when it was asked of the implementer in any phase after `implementing`, in that phase or carried
  into it, and was not withdrawn; an ask that a daemon before this one wrote with no asked role
  counts as the implementer's. It never holds the role asked to make the merge, the implementer
  before `merging` and the merger in `merging`, which owes that merge. A claim behind its entry,
  or serving no run of the issue's
  generation, is answered that it owes nothing, and the daemon sends that entry's task itself. A
  fresh claim whose first task is not yet delivered serves that task's run and entry, so it owes
  its phase. The idle release holds a pod for a phase reminder that is due only while the claim
  owes its phase by the rule the owed answer reads, read of the run and the entry the claim serves
  as the owed answer reads them, so a past-due reminder wake of a claim whose completion is
  recorded, that a merge forward holds, that is behind its entry, or of a merger in `merging`
  whose pull request is merged holds no pod, and one of a fresh claim whose first task is not yet
  delivered holds it.
  By the same rule a released claim that owes its phase nothing gets no idle backstop: the release
  of its pod, a project's pause that stops it, and the cancel of its release while the project is
  paused arm none, since any work such a claim gets later comes as a task or a message of the
  daemon's, which wakes the pod once it is sent. A task of news alone whose send failed before any
  turn is the exception, since nothing sends it again. Each of the three reads the run the claim
  serves by that rule and no run filter of its own, so a fresh claim whose first task is not yet
  delivered gets the backstop because it owes its phase. Two kinds of such claim still get the
  backstop. The first is a claim that holds a task of the issue's run and phase that no turn has
  confirmed, of its entry, of an earlier one or of no entry, such as a task whose send failed
  before any turn, the task of an earlier entry a relaunch kept or a resume task of no entry,
  while it is behind its entry or still serves an earlier run of the issue, unless its completion
  is recorded, a merge forward holds its role or its merged pull request is finishing its merge.
  A claim that still serves an earlier run is a live claim kept across a new generation of its
  issue whose first task of the new run is not yet delivered. Admission's owed-entry repair passes
  over such a claim, and nothing else brings its pod back. The daemon sends a resume task with no
  entry to a ready worker that holds its issue's phase with no work pending, to a silent phase
  worker and to a suspended owner that the boot resumes, each only when its claim is level with
  its phase entry. A claim behind its entry gets that entry's task instead. A task of news alone is
  also a task of the issue's run and phase with no entry, but no task of the phase, so the first
  kind does not count it; the second kind does. The second kind is a claim that holds a task of
  news alone of the issue's run and phase that no turn has confirmed, whatever it owes and whatever
  entry it serves, such as a reviewer whose approval stands while GitHub holds the merge. A
  confirmed news task, or one of another run or another phase, gets none. While the daemon records
  that a started issue gave its admission slot back to wait on another issue, the silence sweep
  writes no start row for its phase workers, tells the architect of a quiet worker once after 24
  hours, and the idle backstop wakes its released pod no earlier than 24 hours after the release;
  the normal bounds apply again once the issue holds a slot. A migration adds
  `pod_wake_backstops.armed_at`.
  The role prompt says when a reminder comes and what to do when a completion is refused.
  The `RETURN_REFUSED` messages say the refused call moved nothing, where they said nothing was
  recorded, since the daemon keeps those refusals under the call's key. The documentation of
  `HANDOFF_HEAD_MERGED_FORWARD`, a refusal the daemon keeps the same way, says so too; its
  messages, which already said the completion changed nothing, are unchanged.
