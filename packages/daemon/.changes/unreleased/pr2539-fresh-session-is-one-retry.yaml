kind: Changed
body: |-
  `legion claims retry --fresh-session` is one decision rather than two. The flag now rides the
  phase restart the route applies, so the start that restart wakes spawns the agent rather than
  resuming whatever session the claim still records. The claim drops its recorded session before
  that fact, never after it, since the lane the fact wakes would otherwise resume the very
  session the call is leaving behind. The route applies that one restart whether or not the issue
  is held, since the workflow restores a held issue from its hold itself.

  A claim that forgets a session records which one it abandoned and why, and the agent that
  replaces it is told in the first task it is given: the session that was left behind, the cause in
  the provider's own words, the issue's branch and the handoff records its phases wrote on the Dispatch issue. A failed claim's
  cause now reads `the provider refused <n> turns in a row: <message>`.

  The boot-token form of `POST /legion/v1/claims/turn-outcome` is held to the launch it was minted
  for, as the shim's hello is: a token of a launch the claim has moved past is refused, and so is a
  report for any other generation, so a pane left from a replaced launch cannot add refusals to the
  claim its replacement is working.
