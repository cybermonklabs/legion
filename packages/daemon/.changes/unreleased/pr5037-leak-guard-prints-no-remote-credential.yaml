kind: Fixed
body: |-
  What a `legion` command prints on stderr itself no longer holds a credential a URL carries. For
  a push to a URL rather than to a named remote, git hands its pre-push hook that URL as the
  remote's name too, and the leak guard named the push after it: `legion leak-check pre-push`
  printed "the push to https://<token>@github.com/..." on a refusal, a setup error and GitHub's
  404, so the token reached the agent's log and transcript. `legion gh` named a remote by its URL
  as `git remote -v` lists it when it refused a checkout whose remotes name two owners, and a gh
  call's --body-file that names a URL was quoted the same way. Each answer of the guard now prints
  every part a caller or a far side wrote, the push's name, the reason, the failure underneath and
  each line, through the URL rule, which removes a URL's userinfo and its whole query, and every
  command's own stderr passes the same rule.

  The URL rule, which the daemon's logs, its stored error texts and these lines share, now keeps
  the query of a `file:` URL, in any case: no network request carries one, and its query is a
  module loader's own, so a line that names a module it loaded, as `legion controller start`'s
  refusal and `legion probe-image`'s log do, keeps `file:///…/envoy.js?mtime=1`. Every other URL
  loses its whole query as before. Standard output is unchanged, and so is what a command hands a
  child as its own stream: gh's and git's, Oh My Pi's and agent-secrets' under the worker shim,
  Claude Code's, the launcher's role shims', and the controller's Oh My Pi probe and session. A
  remote's name that is no URL, such as `origin`, prints as before.
