kind: Fixed
body: |-
  The leak guard no longer prints a credential that a push's remote URL carries. For a push to a
  URL rather than to a named remote, git hands its pre-push hook that URL as the remote's name too,
  and the guard named the push after it: `legion leak-check pre-push` printed "the push to
  https://x-access-token:<token>@github.com/..." on a refusal, a setup error and GitHub's 404, so
  the token reached the agent's log and transcript. Every answer of the guard now prints its parts
  through the URL rule the daemon's logs use, which drops a URL's userinfo and its query, for the
  `legion leak-check` command and every caller in the binary alike. A remote's name that is no URL,
  such as `origin`, prints as before.
