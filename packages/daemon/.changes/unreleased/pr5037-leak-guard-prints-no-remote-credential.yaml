kind: Fixed
body: |-
  What a `legion` command prints on stderr itself no longer holds a credential a URL carries. For
  a push to a URL rather than to a named remote, git hands its pre-push hook that URL as the
  remote's name too, and the leak guard named the push after it: `legion leak-check pre-push`
  printed "the push to https://<token>@github.com/..." on a refusal, a setup error and GitHub's
  404, so the token reached the agent's log and transcript. `legion gh` named a remote by its URL
  as `git remote -v` lists it when it refused a checkout whose remotes name two owners, and a gh
  call's --body-file that names a URL was quoted the same way. Each answer of the guard now prints
  every part a caller or a far side wrote, the push's name, the reason, the failure underneath and
  each line, through the URL rule, and every command's own stderr passes the same rule.

  The URL rule, which the daemon's logs, its stored error texts and these lines share, is
  narrower: it removes a URL's userinfo and the value of each query parameter whose name is a
  credential's (`token`, `access_token`, `key`, `password`, `sig`, `X-Amz-Signature`, `code` and
  the like, or a name ending in `_token`, `-key` and the like), and keeps every other parameter
  and the punctuation after a URL, where it used to drop a URL's whole query. A `file:` URL is left
  whole. Standard output is unchanged, and so is what a command hands a child as its own stream:
  gh's and git's, Oh My Pi's and agent-secrets' under the worker shim, Claude Code's, the
  launcher's role shims', and the controller's Oh My Pi probe and session. A remote's name that is
  no URL, such as `origin`, prints as before.
