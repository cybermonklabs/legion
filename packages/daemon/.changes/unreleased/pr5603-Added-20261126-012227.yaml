kind: Added
body: |-
  The daemon keeps each memory kill of its project's issue pods for the kills signal of admission
  by signals: the memory guard's kill and the microVM kernel's kill, of a role's process and of a
  process of no role, once by the report's guard and sequence, at the moment the launcher's watch
  named the kill, so a report a reconnected launcher sends late counts at that moment. A kill in
  the controller's pod is not kept. The first boot of this release records the moment it began
  keeping the kills, and the kills signal counts an hour from it. A migration adds the tables
  `memory_kills` and `signal_inputs`; its header carries the way back.

  An issue pod's launcher now reports the kill of a process of no role too, such as the test
  database's server, which it logged before and did not report: once, marked `noRole`, on the
  connection of the first role whose daemon's answer carried `noRoleKills`, which the daemon sets
  on every issue pod's answer and never on the controller pod's. Where connections are up and none
  carried it, the launcher drops the report with a line. The daemon tells no role of such a kill.
  The daemon API entry `20261126011643` (`admission-signals`) adds both members of the launcher
  wire: an earlier daemon sends no `noRoleKills`, so it is sent no report of no role, and an
  earlier launcher sends none, and the daemon counts what it sends.

  The daemon also keeps each merge-queue entry and exit (a merge or a removal) of its project's
  pull requests for the queue signal of admission by signals. The `enqueued`, `dequeued` and
  merged pull request notifications of an issue branch of the project queue a `queue_timeline_read`
  outbox row, which pages GitHub's timeline outside the fact lock, reads again when GitHub's
  timeline lags behind the notified move, and applies the events under GitHub's own event id,
  canonical repository and `created_at`. At boot the daemon pages GitHub's `mergeQueue` snapshot
  for each repository and target branch that serves the project's pull requests, to find the pull
  requests whose timeline it reads, and a failed boot read records `read_error` on `signal_inputs`,
  so the queue reads absent with its reason rather than as an empty queue. A migration adds
  `queue_events`, `signal_inputs.read_error` and the `queue_timeline_read` outbox kind; its header
  carries the way back.

  The daemon also keeps what the approvals signal of admission by signals needs: each ask of the
  project's issues with the person it was handed to (`asked_of`) and whose turn it is, each issue's
  assignee, and the project's default assignee. The Dispatch consumer's durable now also takes this
  project's `settings.project_default_assignee.updated` subject and no other setting, updated in
  place with its position kept. Each event is kept at its sequence in Dispatch's log, so one
  delivered twice or after a newer one changes nothing. The boot lists the project's issues, reads
  its open asks with its default assignee (`GET /api/v1/asks/open?project=`, which a Dispatch before
  this change answers without the default) and the open asks of each issue with one open, and
  closes the asks it held open that Dispatch no longer lists. A failed read records its reason on
  the `approvals` row of `signal_inputs`, and against a Dispatch that gives no default assignee,
  with none kept from an event, the signal reads as not recorded with its reason, never as a number.
  A migration adds `approval_asks`, `approval_assignees` and `approval_default_assignees`; its
  header carries the way back.
