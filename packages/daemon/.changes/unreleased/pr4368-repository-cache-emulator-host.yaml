kind: Fixed
body: |-
  The repository cache no longer prints a `STORAGE_EMULATOR_HOST` it refuses. The refusal of a
  value that is not a loopback host:port quoted the value, so a URL with user information
  (`http://user:password@host:port`) printed whole. It now names the variable alone, in the same
  words for every value: `STORAGE_EMULATOR_HOST is not a loopback host:port (...)`.
