kind: Fixed
body: |-
    Admission no longer releases a root it holds for the Dispatch consumer to catch up while a
    Dispatch event for it waits on the notification stream uncounted. nats-server answers a publish
    once it has stored the message and counts the message as pending on a consumer only afterwards,
    so a boot whose listing came just after such an event could read the consumer idle and decide
    the root before that event arrived. The daemon now confirms the consumer idle with the first
    message stored after its delivered sequence on its filter (`STREAM.MSG.GET`). When that get does
    not answer within its bound (a loaded NATS server, or a daemon user without the grant), a
    reconcile reads the consumer as not idle and holds the roots its listing shows behind their
    log, the hold poller releases them on the consumer's own count, and a WARN line names both
    causes.
time: 2026-11-23T05:46:13Z
