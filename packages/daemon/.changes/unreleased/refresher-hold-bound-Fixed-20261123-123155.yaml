kind: Fixed
body: |-
    A recovery held for the Dispatch consumer now tells its release waits at its hold bound even
    when another job of the repository refresher, such as a read of the live records, was running
    as the bound fell. The refresher's loop came back to a bound already passed, found no time
    left, and so cut nothing, and the waits were told at the refresher's next backoff instead, up
    to ten minutes past the bound. The bound is now checked as soon as the loop comes back; a run
    past the bound that fails to tell the waits still waits the backoff.
