kind: Changed
body: |-
    The worker image's `legion-testpg` starts the pod's test Postgres with `max_connections=983` rather than 495, because the Dispatch test suite now runs up to eight Dispatch processes at once rather than four (`testlimits.MaxProcessesAtOnce`): eight processes at 120 connections plus the suite's own 20 clients (`testlimits.ServerConnections`), and the three slots Postgres reserves for superusers.
time: 2026-11-26T17:00:00Z
custom:
    Issue: dispatch-process-slots-8
