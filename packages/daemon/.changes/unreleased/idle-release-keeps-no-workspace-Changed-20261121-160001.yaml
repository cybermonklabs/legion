kind: Changed
body: |-
  An idle release does not take a pod whose workspace holds a commit on a working copy or a local
  bookmark that no branch or tag on origin holds, or a working-copy change: its first act reads the
  workspace through a live role's shim (`workspace-work`) and declines when it finds such work or
  cannot read the workspace. The pod stays, the role whose shim made the read (the open phase's
  worker where it is live) gets one message that the release waits for its push, and the daemon
  pushes nothing. A commit that no working copy and no bookmark reaches, such as a side head left
  with `jj new`, is not counted, and a release can take it. The decline holds the pod under the new
  hold `unpushed_work` (or `workspace_unread`) with no new release mark, no outbox row and no shim
  call until a role of the issue starts a turn or a process again, or the runtime holds another pod
  for the issue; a failed read is asked again after an hour. A read after such a turn that finds the
  same work keeps the decline and sends no second message, so the message's own turn does not start
  the read and the message again every idle period; a role that takes over is told once, a read
  that fails keeps the work the read before it found, and a clean read deletes the decline. The
  release of a pod no claim owns, and the close of a parked child's pod with no live claim, keep a
  pod whose decline names unpushed work in that same pod (`unowned_unpushed_work`), and the close of
  the pod of a parked child with a live role reads the workspace first and declines the same way. The read counts work
  against every remote branch and tag, so the heads of branches the remote deleted after their
  merge and `main`'s newer commits no longer read as unpushed, and the daemon takes a read's answer
  only where its commit ids are 40 hexadecimal digits. A turn after a release's mark now cancels the
  release at its workspace check, a role stop or the teardown, a turn after the pass that queued a
  left pod's check holds that pod's close, a turn after that check holds the close's stop of its
  role and finishes its Sandbox suspension without acting, and a decline is stamped with the moment its read began. Before, every idle pass marked the release again, asked the
  shim and cancelled on the same refusal (`bundle_save_failed`, "the workspace's unpushed work is N
  bytes"). The release records write `bundleBytes` 0, and the wake task of a release says what the
  release keeps and that a side head is not kept, in the same words as the plugin's
  recreated-workspace notice.
