kind: Changed
body: 'The daemon reads the shared public leak check from the repository its operator names, `LEGION_LEAK_CHECK_REPOSITORY` and `LEGION_LEAK_CHECK_MANIFEST_SHA256` in its environment or a `leak_check` block (`repository`, `manifest_sha256`) in `legion.yaml`, where it read one compiled-in repository before. The manifest digest is one sha256 over every file the check runs from: `(cd leak-check && sha256sum public-leak-check.sh public_leak_check.py README.md must-pass-lines.txt) | sha256sum`. One of the two without the other stops the daemon at load, naming the half that is missing. Set, every role is told the digest as `LEGION_LEAK_CHECKER_MANIFEST_SHA256` (in a pod kept across a change of it, the one that pod was built under, until its update round replaces it), a role pod starts no agent unless its install has that digest, and a write under a check with another digest is refused, a launcher script edited beside an unchanged program among them. Unset, the deployment runs no shared leak check: the daemon logs so once at boot and pushes no check, role pods start without one, and a write where nothing names or holds a check runs this repository''s own private-name rules alone, where it was refused before. A check that is named and missing, or present and unable to run, is still refused, a push included.'
