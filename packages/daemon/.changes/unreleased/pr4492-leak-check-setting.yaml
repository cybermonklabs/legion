kind: Changed
body: 'The daemon reads the shared public leak check from the repository its operator names, `LEGION_LEAK_CHECK_REPOSITORY` and `LEGION_LEAK_CHECK_SHA256` in its environment or a `leak_check` block (`repository`, `checker_sha256`) in `legion.yaml`, where it read one compiled-in repository before. One of the two without the other stops the daemon at load, naming the half that is missing. Set, every role is told the sha256 as `LEGION_LEAK_CHECKER_SHA256`, a role pod starts no agent unless its installed `public_leak_check.py` hashes to it, and a write under a check whose program hashes otherwise is refused. Unset, the deployment runs no shared leak check: the daemon logs so once at boot and pushes no check, role pods start without one, and a write where no check is named runs this repository''s own private-name rules alone, where it was refused before.'
