kind: Fixed
body: 'A command the daemon or the launcher runs that a signal ended (another process''s kill, the kernel''s out-of-memory kill) is now reported as that signal, not read as a command that exited -1: a leak-check install whose run of the check was killed is refused with `the served check could not be run: signal: terminated` rather than `its --help names no check-public-text shape: it printed nothing`; a killed git, jj, gh, curl or Oh My Pi run is an error naming the signal, with what it printed before it (a fetch''s token scrubbed from it), rather than an answer such as "the branch is absent" or "Oh My Pi refuses this overlay"; a killed token_command, private_key_command, `secrets get`, boot-gate probe or CodeGraph warm-up says `failed (signal: killed)` or `was ended by signal: killed` where it said `exit -1`, and a CodeGraph build its own 30-minute bound stopped says it timed out; and a tmux client a signal ended is still read as a failed run, but its message says `was ended by signal: killed` where it said `failed (exit -1)`, and one its own timeout killed says `timed out after 10s` where it said `failed (exit -1): timed out after 10s`. A tmux launch whose bootstrap window cleanup fails, by its exit or by a signal, now kills the agent window new-window had just opened, which it left running. A shared clone''s read of its default branch, or of its credential settings, and a repository feed''s read of its HEAD, that its budget ended is refused as a timeout, rather than read as the branch absent (left untracked), the settings stale (rewritten) or a HEAD that names nothing (rewritten). The boot gate still retries an Oh My Pi that a signal ended after it answered, as it retries one that exited.'
