kind: Fixed
body: 'A command the daemon or the launcher runs that a signal ended (another process''s kill, the kernel''s out-of-memory kill) is now reported as that signal, not read as a command that exited -1: a leak-check install whose run of the check was killed is refused with `the served check could not be run: signal: terminated` rather than `its --help names no check-public-text shape: it printed nothing`; and a killed git, jj, tmux, gh or Oh My Pi run is an error naming the signal, rather than an answer such as "the branch is absent" or "Oh My Pi refuses this overlay". The boot gate still retries an Oh My Pi that a signal ended after it answered, as it retries one that exited.'
