kind: Changed
body: |-
    Legion's pods share the cluster's general nodes. A pod the daemon builds, an issue pod, the
    controller's pod, a repository cache pod or the image probe pod, carries only the operator's
    `runtime.kubernetes.scheduling.node_selector` and `scheduling.tolerations`, and a microVM pod
    also its ComputeClass's selector and toleration. No pod selects `legion.dev/pool: legion` or
    tolerates the taint `legion.dev/pool=legion:NoSchedule`. The loader still refuses a
    `node_selector` that sets `legion.dev/pool`, because that label would set Legion's pods apart
    on nodes of their own.

    Before this release runs, the deployment removes any admission rule that requires the
    `legion.dev/pool` label on Legion's pods. It also removes the taint
    `legion.dev/pool=legion:NoSchedule` from the nodes Legion's pods use, or names its toleration
    in `scheduling.tolerations`, which the loader accepts: no pod tolerates that taint any more,
    so where every node carries it, every pod stays Unschedulable, the image probe's included.

    A pod that runs when the daemon restarts keeps its placement until the daemon replaces it. The
    daemon replaces a repository cache pod whose Sandbox's pod template places it otherwise than
    the daemon would now, the pool's selector and toleration included, at the first boot, sweep
    or launch of its repository that finds the pod serving no stream, and keeps the cache's
    Sandbox and volume; the cache of a repository no live issue record names keeps its placement
    until its retention deletes it.
