kind: Fixed
body: |-
  A claim can no longer register, or be relaunched into, another claim's session, which took that
  session's secret grants and its transcript. The daemon holds every name of a session to the
  first claim of its project that recorded it, whatever that claim's state since (live, suspended,
  failed or retired), in a new `claim_sessions` table: its id, its file's base name (which holds
  the path too), the id an Oh My Pi file name gives, and the id a Claude Code transcript is named
  for. A registration under a name another claim holds is refused with `409 session <name> is
  recorded for another claim of this daemon; …` before anything is recorded or enrolled, a
  relaunch whose record names one is refused before anything starts, and a pod's session
  registration (`exchange_audience`) is made for no such name; a claim's own earlier session
  and a session no claim has recorded register as before. A session id or a session file's name
  longer than 255 bytes, and a session file that is not a clean path, are refused with `400`; a
  claim an earlier daemon recorded under such a name takes nothing under it and is suspended at
  boot. A registration that would take one claim past
  2,048 held names is refused with `409`: a claim that records a session still resumes it, and one
  that needs a new session starts none until an operator runs `legion claims release-names`, which
  the refusal's log line names: it frees the names of the claim's other sessions once the secrets
  broker answers that no enrollment of this daemon's login still carries anything for them, and
  frees nothing while one does. At every boot the daemon holds, in one
  statement, each name a claim records that no row holds, as after a rollback to a release before
  this one, and logs at Error each claim whose current session records a name held for another
  claim, for none or by no row, suspending each it can; a suspension that fails is logged at Error
  and the boot goes on. Such a claim is contained but not stopped: the enrollment its process
  holds at the secrets broker is revoked once the broker confirms the revocation, the claim
  keeping it recorded and asking again at each observation until then (where the broker refuses
  the revocation for good, the claim records it no longer, logs that at Error, and the process
  renews it until it stops), and the daemon publishes nothing to its Envoy role, whatever the
  claim's state, or, for the daemon's own controller, the controller topic, and sends it no task
  and no compaction. The process runs on under the session, and the Envoy listener does not yet
  withhold the role its session claimed, so a message another session sends to that role reaches
  the session until it ends. With no process registering the session id, the listener frees the
  role at the role reaper's first pass after the session is gone, an hour past its last
  registration, or five minutes after the role claim's last renewal once the daemon's probe has
  stopped the registration of a gone process; where another claim's live process runs under the
  same session id, as after a rollback, the role stays with that session while it lives, and the
  role's messages reach that process. Until the listener withholds the role, an operator leaves
  such a claim suspended until the other session has ended, or stops the rightful holder's process
  too. Each boot tries the suspension again; an operator suspends the claim (`legion claims suspend
  --claim <token>`) once its runtime answers, or stops its pod or pane by hand; it takes no
  `legion claims forget-session` while it is live. Dispatch's role holders name a live claim's
  session only while the claim holds every name of it. For each claim the boot names that is not
  the rightful holder,
  an operator runs `legion claims forget-session` as its state allows, then resumes a suspended
  one, retries a failed one and leaves a retired one as it is, and for a name held for none records
  the rightful holder (`update claim_sessions set claim = '<token>' where project = '<project>' and
  kind = '<kind>' and name = '<name>' and claim = '' and '<token>' in (<the line's claims>)`, which
  moves no name a claim already holds and to no claim the line does not name);
  docs/kubernetes.md gives the steps whole. A name only an
  abandoned session records is logged at Warn and suspends nothing. A hold the store does not
  answer at a relaunch is tried again at the probe interval, charging nothing. A refusal asked
  again at every sweep is logged at Warn once.
