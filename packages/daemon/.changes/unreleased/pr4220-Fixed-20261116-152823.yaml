kind: Fixed
body: |-
  A claim can no longer register, or be relaunched into, another claim's session, which took that
  session's secret grants and its transcript. The daemon holds every name of a session to the
  first claim of its project that recorded it, whatever that claim's state since (live, suspended,
  failed or retired), in a new `claim_sessions` table: its id, its file's base name (which holds
  the path too), the id an Oh My Pi file name gives, and the id a Claude Code transcript is named
  for. A registration under a name another claim holds is refused with `409 session <name> is
  recorded for another claim of this daemon; …` before anything is recorded or enrolled, a
  relaunch whose record names one is refused before anything starts, and a pod's session
  registration (`exchange_audience`) is made for no such name; a claim's own earlier session
  and a session no claim has recorded register as before. A session id or a session file's name
  longer than 255 bytes is refused with `400`, and a registration that would take one claim past
  2,048 held names is refused with `409`: a claim that records a session still resumes it, and one
  that needs a new session starts none until an operator runs `legion claims release-names`, which
  the refusal's log line names: it frees the names of the claim's other sessions once the secrets
  broker answers that no enrollment of this daemon's login still carries anything for them, and
  frees nothing while one does. At every boot the daemon holds, in one
  statement, each name a claim records that no row holds, as after a rollback to a release before
  this one, and logs at Error each claim whose current session records a name held for another
  claim or for none, suspending each it can. For each such claim that is not the rightful holder,
  an operator runs `legion claims forget-session` as its state allows, then resumes a suspended
  one, retries a failed one and leaves a retired one as it is, and for a name held for none records
  the rightful holder (`update claim_sessions set claim = '<token>' where project = '<project>' and
  kind = '<kind>' and name = '<name>'`); docs/kubernetes.md gives the steps whole. A name only an
  abandoned session records is logged at Warn and suspends nothing. A hold the store does not
  answer at a relaunch is tried again at the probe interval, charging nothing.
