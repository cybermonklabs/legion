kind: Fixed
body: |-
  A run of turns the provider refused no longer fails the claim, however long it is. The daemon
  failed a claim once its plugin had reported `launch_failure_limit` refused turns in a row (3 by
  default), with `the provider refused <n> turns in a row: <message>`, before the controller's
  notice at six such turns. That ended the provider-error ladder, which sends the task to the same
  session again with no attempt limit. The prompt's own result now decides alone: an error that
  can clear sends the task again on the ladder, and the controller is told once at six turns in a
  row; an error that cannot clear, a 4xx other than 401, 403, 408 and 429, still fails the claim at
  once and holds the issue for its architect. The run of refused turns now decides only whether a
  retry of the claim starts a new session, at `launch_failure_limit` as before. The answer of
  `POST /legion/v1/claims/turn-outcome` keeps its `failed` field for the plugins already deployed,
  and it is now always false.
