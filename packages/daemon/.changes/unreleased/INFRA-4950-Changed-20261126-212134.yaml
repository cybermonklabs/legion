kind: Changed
body: |-
    Each code-reading role prompt says when to ask the `codegraph` tool, with a `write` to
    `xd://codegraph`: the architects before the spec names what a change touches, the planner before
    a task names its files and tests, the implementer before it changes a symbol, the tester before
    it judges the implementer's tests, the reviewer for each changed exported symbol and the merger
    where the base changed code the change uses (`impact`, `callers`, `affected` and `explore`).
    `affected` always carries `"depth":1`, because its default depth returned 3,101 test files for
    one Go file. A role asks `status` before its first query and reads the source with grep when the
    tool is missing, an answer is empty, or an answer may be stale or partial: `status` counts a file
    edited since the build as a pending change, and says the index is truncated while a build runs.
    A role runs `init` only when two answers apart say the workspace is not initialized, and runs no
    `index`, `sync` or `unlock`, whatever `status` or the tool's own guidance advises, because a
    second build corrupts the index. A role on Claude Code is told the `codegraph` command for each
    action. The reviewer's earlier `codegraph({ action: … })` call is removed.
