kind: Changed
body: |-
  The worker image's `legion-testpg` starts the pod's test Postgres with `max_connections=499`
  rather than 495. The check states settler takes one more connection of Dispatch's lease pool, so
  one Dispatch process may open 119 connections, and a Dispatch test suite needs
  `testlimits.ServerConnections` = 496 (four processes at 119 and 20 for the suite's own
  clients) beyond the three slots Postgres reserves for superusers. At 495 the server allowed four
  fewer, so a suite running four Dispatch processes at their ceiling could be refused a connection.
time: 2026-11-22T01:46:31Z
custom:
