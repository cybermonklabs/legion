kind: Added
body: |-
  `runtime.kubernetes.pod.controller_service_account` names the ServiceAccount of the pod of the
  controller the daemon launches; every other pod keeps `runtime.kubernetes.pod.service_account`
  (a repository cache's pod excepted while `runtime.kubernetes.repository_cache.bucket` is set),
  and leaving the key out changes nothing, while an empty value is refused at load. The key is
  refused unless `controller: daemon`,
  `legion config check` names both accounts when it is set, and the relaunch and boot drift checks
  hold each pod to its own kind's account.
