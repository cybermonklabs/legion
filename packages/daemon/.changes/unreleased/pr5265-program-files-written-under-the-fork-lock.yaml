kind: Fixed
body: |-
  A program the daemon writes and then runs, or hands to a program that runs it, can no longer be refused with "text file busy". Linux refuses to run a file some process holds open for writing, and a child a Go process starts from another goroutine holds every file the process has open until it runs its own program. Two places were exposed in a deployment: the tmux daemon's one-shot git credential helper, which it writes while other goroutines start git, tmux and token commands, and the leak check an issue pod's launcher installs and at once runs, while it starts its roles' processes; under gVisor, the default pod sandbox, the kernel does not refuse such a run, so the second is exposed only where a pod runs a Linux kernel. On a Linux kernel, a test that writes and runs the helper 400 times, and one that installs and runs the check 300 times, each beside eight goroutines that start processes, saw some of their runs refused. Two other places start no process while they write today, so a deployment could not meet it there: the `legion`, `gh` and `git` scripts of a pane's PATH (written at daemon boot and `legion controller start`) and a role's copy of the pod's config home. A role's private copy of the leak check is written by `legion gh` and `legion leak-check`, which do start processes beside it, and was safe because it already held back every fork os/exec makes while it wrote. All of these are now written the same way.
  Each such file is now written while every fork os/exec makes waits for the write to close it, and its mode no longer depends on the umask: an installed leak check's files take the served archive's mode less group and other write, the modes they had under the usual umask 022, and a role's copy of the config home takes its source file's mode exactly.
