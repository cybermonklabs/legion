kind: Added
body: |-
  `runtime.kubernetes.repository_cache` takes two optional keys, set together or not at all: `bucket`, the Cloud Storage bucket each repository cache keeps its packs in, and `service_account`, the Kubernetes ServiceAccount the cache pods alone run as, which holds the bucket's grant.
  Both absent is off, and every cache pod runs as `runtime.kubernetes.pod.service_account`, as before.
  With both set, every cache pod runs as `service_account`, and its `cache` container alone is told the bucket as `LEGION_REPOSITORY_CACHE_BUCKET`; its argv, its Secret and its mounts do not change, and no issue pod or controller pod runs as that account or is told the bucket.
  The loader and the Sandbox runtime refuse one key without the other, and a `service_account` that is the account every other pod runs as (`pod.service_account`, or `default` while it is unset); the loader also refuses a blank value, a `${…}` placeholder and a `bucket` that is not a Cloud Storage bucket's name.
  The daemon makes a cache's pod again, keeping its Sandbox and volume and waiting until it serves no `/tar` stream, when the pair is turned on or off, when either key changes, and when the cache's pod runs as another account than the one a cache pod runs as now.
  Neither value is carried on `GET /legion/v1/state`.
  Create the bucket and the ServiceAccount before setting the keys, and remove both before rolling back to a daemon that does not know them (docs/kubernetes.md, The repository cache, "The bucket").
