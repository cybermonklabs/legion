kind: Added
body: |-
  At each event of the project's merge holds document, `merge-holds-md`, the daemon sends a
  `merge-holds-changed` notice to the architect of each issue in `accepting`, and the same text to
  the merger of each issue in `merging` through a new outbox kind, `merge_holds_changed`. Both wake
  a role whose pod the idle release took, so a held role subscribes to nothing. The Dispatch
  consumer adds the document's subject to its filters, and a store migration adds the kind to
  `outbox_kind_check`. Before you roll back to an earlier release, stop the daemon and run the
  steps of `docs/kubernetes.md`, "Rolling back the release whose controller and architects hold
  claims and whose daemon tells a held role of a merge hold".
