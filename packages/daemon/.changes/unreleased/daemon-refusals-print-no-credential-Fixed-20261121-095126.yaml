kind: Fixed
body: |-
    Configuration refusals, `legion` command output and the controller liveness log quoted what a
    person can write a credential into. Each now names the key, the entry's position or the
    setting, never the value: `runtime.kubernetes.session_dsn_secret is not a Secret data key`,
    where a postgres URL pasted in place of the key's name printed whole, its password included;
    every `runtime.tmux.pane_env` and `runtime.kubernetes.pod.env` refusal (`entry 2: its key …`,
    `entry 2: its value must be a string`, `entry 2 names a variable an earlier entry names`,
    `entry 2 sets a credential-shaped variable …`), where a credential pasted as a variable
    printed, one made only of letters, digits and underscores included; `nats_urls entry 2 must be
    a valid URL` and the other `nats_urls` refusals, which quoted the entry, its query or user name
    among it; and every `runtime.kubernetes.plugins` refusal, the version refusal included, which
    quotes no source now. `advertise_host`, a pod volume's `nfs.server`, `bind` and
    `runtime.kubernetes.agent_secrets.token_file` name the key alone, a value holding a character
    outside ASCII included; `runtime.kubernetes.session_database.instance`,
    `impersonate_service_account`, `writer_audience` and `user` name the key alone, a key=value
    DSN or a key pasted there included; and the operator pod's `DISPATCH_PUBLIC_URL` is quoted only
    when it holds none of `@`, `?` or `#`, and is refused when it holds an `@` past its host (a
    query or a fragment still loads; the agents' links then fall back to `dispatch://`
    references). A URL key's host that is not ASCII is named by its key alone when the URL holds a
    user name or a password. An unknown key is named as written only when it
    is of the configuration's grammar (lower-case letters, digits and `_`, from a letter, 40 at
    most), holds no run of 8 hex digits and no run of 10 letters and digits that holds a digit, so
    a typo keeps its help; any other name (a token such as `sk-ant-…`, `ghp_…`, a hex key or a
    base36 token, a URL, a camelCase name, a typo holding `-` or an upper-case letter) is named by
    its line, never its text, at the root, in every mapping and keyed list, and as a `projects`
    key. `github_apps.<app>.private_key_secret` refusals name
    the setting, never the secretsd key, which can be the App key itself pasted where its name
    goes; `private_key_command`'s stderr, on the daemon's stderr and in its refusal, shows each
    word of the command of 10 characters or more, its first included, as `[a word of the command]`
    and withholds a line, or the whole stderr, that still holds part of one or a PEM block. A
    `provider_keys` value `file:<relative path>`, and one naming a file under runtime kubernetes,
    name the variable alone. A secret file `legion` cannot read (a seed, token or provider key
    file, the ServiceAccount token file, the session database's URL file) is refused by why
    (`it does not exist`, `permission is denied`, …), never its path.

    `envoy_url`, `dispatch_url`, `daemon_url` and each `nats_urls` entry now refuse an `@` after the
    host, naming the key or the entry's position alone, which is how a token or password holding an
    unescaped `/`, `?` or `#` written in the userinfo parses: such a URL loaded with the
    credential's head as its host, and lines that name the host printed it. A
    `runtime.kubernetes.plugins` URL source refuses an `@` in its query, its fragment or any path
    segment other than the plugins' scope `@sjawhar`, naming the key alone: a credential ending in
    `/` left a segment that opens with `@`. The refusal says what to change: the credential's `?`
    or `#` percent-encoded (`%3F`, `%23`), or its `/` (`%2F`); a `%40` in the path or the fragment
    counts as an `@`, and one in the query, read as written, loads.
    A plugin's registry tarball URL (`/@sjawhar/pi-legion/-/pi-legion-1.2.3.tgz`, and
    Artifactory's and GitHub Packages' forms) still loads.

    A URL whose authority holds an `@` (userinfo, or a password holding an unencoded `@`) is shown
    as its scheme and `[a URL with credentials]` in place of the authority, and nothing after its
    last `@`, which is where such a password's tail would read as a host; one with an `@` past its
    host (a credential holding a `/`, `?` or `#` written as the user) is that mark from its `://`
    on, path and all. This holds in every log line and refusal the URL rule cleans, in the state's
    settings (`envoy_url`, `nats_urls`, `dispatch_url`, `daemon_url`, a plugin URL source, where
    `xxxxx@<host>` was; a plugin's scoped registry tarball URL keeps its path), in the names of a
    Kubernetes pod's addresses, and in the controller liveness probe's lines. A path's own `@` (a
    scoped npm package's) prints as the mark too in log lines, except in a `file://` URL of this
    machine (its host empty or `localhost`), which keeps an `@` in its path; an `@` in such a URL's
    query or fragment, or in a file URL that names a host, marks it. A token in a URL's path, with
    no `@`, still prints through the rule on text. `legion config check`'s plugins line and the
    daemon's boot line on the plugins a relaunch installs print a URL source as the state's
    settings show it. `legion stop` and the operator's commands (`legion state`, `legion status`,
    `legion claims`, `claims retry --failed` and `claims suspend` among them) print the loader's
    refusal through the URL rule `legion start` uses, and name the daemon `LEGION_DAEMON_URL` names
    through it in every line and refusal, a password holding a `'` included, and a daemon address
    that does not parse in fixed words. Each of these requests of a configured URL that gets no
    answer names the host and the port a dial's or a resolver's error names, when the URL holds a
    user name or a password, as the mark, or prints no error when that host is not ASCII and the
    error names its `xn--` form, or when the dialer refused the address as no valid host and port
    (`address <digits>: invalid port`): the operator's commands, the controller liveness probe, the
    daemon's Dispatch client (its log lines, the `last_error` the outbox stores for a write and the
    state's `pendingStatusWrites[].lastError`), its Envoy publisher's publishes, role lookups,
    registration reads and session deletes, the Claude bridge's turn report, and `legion
    model-token` against an `--endpoint`. A password holding an unencoded `@` left its tail there
    (`lookup <the tail>: no such host`), and digits in it read as the port printed too, as written
    and as the dialer prints them without their leading zeros. `legion
    controller start` names the daemon `daemon_url` names the same way, and the command its load
    probe tells you to check the plugin with names `<your omp_launch_prefix>` where the prefix goes,
    so it can be pasted.

    A `postgres_dsn`, `LEGION_POSTGRES_DSN` or session database URL file written as a
    `postgres://` URL is refused, naming the setting alone, when it holds an unencoded `@` after
    its user part: in its hosts, its database, a query key or a query value. A password holding an
    `@` or a `/` leaves part of itself there (pgx reads its tail as the host, or its head as the
    host and port and its tail as the database or a query), and every connection error printed it.
    Write each `@` in a password, a user name or a query value as `%40`, and a `/` in a password as
    `%2F`; pgx decodes both. A DSN that loaded before is refused too when it holds such
    an `@` for another reason: a query value (`user=sa@project.iam`, a Cloud SQL IAM user), which
    loads written as `%40`, or a database name, which is refused however it is written (`my@db`,
    `my%40db`). A connection error of a refused DSN names "the configured
    Postgres" and no driver detail, and a DSN pgx cannot parse is named by its setting alone, with
    none of pgx's text, which quoted a keyword DSN's password whole when it was written `password =
    <secret>`, with spaces around the `=`. The same settings refuse, by the setting alone, a value
    that names the postgres scheme but is no lower-case `postgres://` or `postgresql://` URL with
    nothing before it (`POSTGRES://…`, ` postgres://…`, `postgres:u:<password>@…`), and any other
    value with a key holding a character no keyword or parameter name has (`postgress://…`,
    `postgres;//…`, `pgsql://…`, `postgresql+psycopg2://…`, a BOM before the scheme): pgx read each
    as a keyword setting whose name a server that admits the client printed whole. A custom
    setting's name may hold `$` after its first character, as Postgres allows. They refuse, in a
    keyword DSN and in a URL alike (its user info, its host list, its path and its query, read
    decoded as pgx reads them), a value other than a password that pgx's connection error or the
    server prints, the user, the database, the host or the hostaddr, holding `://` anywhere
    (`dbname=' pg://u:<password>@…'`, `dbname=jdbc:postgresql://…`, `?dbname=pg://u:<password>%40h`),
    a user holding a `:` (`user=app:<password>`, `?user=app:<password>`), a database holding an `@`
    (`dbname=app:<password>@db/app`), and a host or hostaddr holding an `@`, an `=`, or a `:` in an
    entry that is neither an IP address nor a socket directory (`host=u:<password>@db`,
    `host=127.0.0.1password=<password>`, `host=app:<password>`, and `host=db:5432`, which pgx never
    dialled: the port goes in `port=`). A URL's query key is read as pgx reads it, the spaces at its
    ends dropped, and one no keyword's shape has is refused, as the server prints it as a
    parameter's name. Any other value but a password is refused only when it holds `://` and then
    an `@` anywhere after it, a URL with a user name or a password (a password can hold a `/`, `?`,
    `#` or space, so a URL value with an `@` in its path is refused too)
    (`options='-c datestyle=https://u:<password>@h'`), which
    the server prints as a value it refuses; `application_name=https://…`, `options='-c
    app.url=https://…'` and an `sslpassword` such as `Postgres:Admin1`, which no driver prints, load.
    A Cloud SQL socket (`host=/cloudsql/acme-postgres:…`), an IPv6 host or hostaddr, a host list
    and a password such as `Postgres:Admin1` load. A connection error masks every password the DSN
    carries as pgx read it, an escaped space included, and the value after every `password=`, in
    any case, read by libpq's rules: a quoted one whole (two single quotes in a row, or a
    backslash, taking the next character), an unquoted one to its next space, quote or backtick,
    and the rest of the text when more of the value follows a quote, so a user missing the space
    before it (`user=apppassword=<password>`, `…='<password>'`, `…=zq''<password>`, `…=zq\
    <password>`) prints none of it.

    `legion gh` names a value a person gave it (an argument, an option's value, a selector, an
    environment value, a search query) in a refusal by its place (`a -R value`, `the GH_REPO
    value`, `a git flag after --`, `a word of the search query`, `the endpoint's query string`,
    `an option the command's help does not list`, `GH_HOST names another host than github.com`),
    and quotes a subcommand only where gh's own help lists it. A git flag after `--`
    (`--config=http.extraheader=AUTHORIZATION: <token>`, which a CI checkout writes), an owner
    with user info, a `-R` URL whose password holds a quote, an option glued to its value in one
    argument, a search word holding a space, a `-repo:` qualifier, a gh api endpoint holding a
    token in its query, a GH_HOST value and a GIT_CONFIG_COUNT that is no count printed whole
    before. A selector URL holding a password, or a user name other than an ssh:// or git+ssh://
    URL's SSH login, is refused now, on github.com too, and so is a repository name holding a
    character no GitHub repository's name does (its `.git` trimmed first, as gh trims it), in a
    selector or in a remote's URL, where a token written into the path stands
    (`https://github.com/acme/x-access-token:<token>@github.com`). The refusal of two owners
    lists each slot with the owner and name read from it (`acme (a -R value naming
    acme/widgets)`). A help gh answers with an error is named without gh's error output, which
    can quote the command's words. Every refusal goes through the URL rule as well, as the other
    commands' do. It names a git remote it reads as a github.com OWNER/REPO by the URL as gh reads
    it, its user name and password as the mark, its query and fragment left out, its path kept
    (`remote "origin" (https://[a URL with credentials]/owner/repo)`): a token a checkout writes
    into the remote's URL (`https://x-access-token:<token>@github.com/…`) printed whole. A remote
    it refuses is named by its git name alone (`remote "origin" (a URL that is not printed)`),
    since its path is no checked OWNER/REPO, and a gh-resolved marker's value prints only as
    `base` or the OWNER/REPO gh writes there. An ssh remote's user name alone prints as the mark
    too, its host with it (`ssh://[a URL with credentials]/owner/repo.git` for
    `git@github.com:owner/repo.git`): the rule cannot tell an SSH login from a token written as the
    user, and no token may print. A `-R` value of an ssh:// or git+ssh:// URL with a login alone
    still places. A `git remote -v` line it cannot read, a URL holding whitespace, is named by its
    remote alone, where it was quoted with only the URL rule's cut, which ends a URL at a space.

    `omp_launch_prefix` is shown as its program and how many arguments follow (`env (1 argument,
    not shown)`): in the state's settings, in every boot gate refusal and the controller probe's
    line. The program is shown by its base name only when that has a command's shape (no run of 8
    hex digits, no run of 10 letters and digits holding a digit, not three or more `-`-separated
    segments that each hold a digit), and as `(a first word that is not shown)` otherwise, since a
    token pasted where the program goes would print. A word of the prefix
    can carry a credential (`env NAME=<token>`, a proxy URL with a password). When a launch's output
    is quoted (the boot gate's probes, the model-fallback read, the role overlays' check), each
    argument of the prefix of 8 characters or more, and the value of a NAME=value word (one whose
    name is a variable's), is replaced wherever it stands by `<prefix word N>`, and a line that
    still holds part of one is not printed; the program is replaced as an exact copy and by its base
    name, and a line that only shares a directory with it (`/usr/local/lib/…` beside
    `/usr/local/bin/<wrapper>`) is kept. A program whose base name has no command's shape (a token
    pasted there) is held to as an argument is, so a cut or upper-case copy of it is not printed.

    A gh `hosts.yml` that YAML cannot decode is refused as a `legion.yaml` is (`parse hosts.yml:
    the YAML does not parse at line <n>`), and one holding a value of another kind where a mapping
    goes as `the YAML holds a value of another kind than the file takes at line <n>`, where the
    YAML library's error was printed and quoted the token by its first characters.

    The controller liveness probe requests and logs the Envoy role lookup without the URL's user
    name and password, and sends them as Basic auth when no bearer token is set, as the HTTP client
    sent a URL's own; it follows no redirect, which it reads as an unknown answer and logs as a
    redirect not followed, so neither credential reaches another path. Under `runtime: kubernetes`,
    a pending pod's FailedMount event on the providers volume names the setting whose key the
    Secret does not hold (`provider_keys.OPENAI_API_KEY`), or `one no setting names`, in place of
    the key, which can be a provider's key pasted where a `provider_keys` value goes; every other
    event prints as written.
