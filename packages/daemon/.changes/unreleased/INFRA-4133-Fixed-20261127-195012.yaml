kind: Fixed
body: |-
  A workspace checkout (`jj sparse reset`) that was cut short mid-write, or any provision that
  stopped between `jj workspace add` and the checkout's end, is now redone from nothing on the next
  provision, for a workspace this release registers. `Provision` writes a link-safe marker
  (`.jj/legion-checkout`) right after `jj workspace add` registers a fresh workspace, before any
  later step of the provision, and removes it once a checkout finishes (and removes any leftover
  marker when a later provision finds the workspace already checked out). No role starts in a
  workspace before its provision succeeds, so a retry that finds no sparse patterns and that
  marker removes the workspace under the store lock (`workspace-init` logs this as step
  `workspace-reset`, between `checkout-check` and `workspace-registration`): it deletes the issue's
  bookmark `legion/<KEY>` where the stopped provision set it on the workspace's working-copy
  commit, renames the workspace directory aside, forgets the workspace in the shared clone,
  removes its git worktree entry and deletes the directory without following a link. It then adds
  the workspace again as a first provision does, at origin's `legion/<KEY>` as GitHub has it then,
  or at the default branch with `legion/<KEY>` set on its working-copy commit, with a new creation
  record, so a creation record that is missing, empty, unreadable or no regular file, a bookmark
  the stopped provision never set and a half-written checkout all go with the old workspace. A
  workspace whose sparse patterns an agent cleared carries no marker, so its untracked files stay
  untouched. A workspace an earlier release registered, such as one on a tmux host or on a microVM
  pod's kept volume, carries no marker either, so its next provision checks out over whatever a
  cut-short checkout of it left, as before.
