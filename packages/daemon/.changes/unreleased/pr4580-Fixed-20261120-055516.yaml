kind: Fixed
body: 'A role''s `jj git push` gives each commit it sends the author of the role that the commit''s first `Legion-Role` trailer names. An issue''s roles share one jj working copy, so a commit could reach GitHub with another role''s App as its author. Before the push, `legion jj` reads what the push sends from a dry run of it, and runs `jj metaedit --update-author` for each role whose commits carry another author, under that role''s identity from `LEGION_ROLE_IDENTITIES`, in as many batches as keep each command under 2,097,152 bytes, every command with `--ignore-working-copy`. It prints one `legion jj: <role>: <old commit id> -> <new commit id>` line for each commit it rewrote, then runs the push with the role''s own arguments, but for a revision argument whose meaning the rewrite changed: jj resolves each argument to its whole set before the rewrite, and once any metaedit of the step has run, the fill of an empty author included, an argument jj no longer resolves to that set, as rewritten, whether or not its own commits moved, gets the set as ids while that word stays under 100,000 bytes, else the primary form `(<argument>) ~ (<old ids>) ~ (<ids it now names and must not>) | <new ids> | <ids it must send>` (each empty part left out) where jj resolves it once more to the set, else the ids in as many words of the same `--change` or `--revisions` option as keep each under 100,000 bytes, each ids form with one printed line, so a change offset, `latest(...)`, `mine()` or `author(...)` sends what it named before the rewrite, even through another argument''s rewrite. No word the step writes passes 100,000 bytes, but for a role''s own argument that is that long already. Only where the push would then pass 2,097,152 bytes of arguments and environment, each revision argument counted at the larger of its own word and its ids, does the step decide, before any rewrite other than the fill of an empty author, to set no other author, with one printed line, and the push runs as written, but where that fill ran, after which each revision argument is held to its set. It adds no refusal: where it cannot read the dry run, as for a commit that a `git commit` made and no jj command has imported yet, it prints one line and runs the push as written, but where a metaedit of the step ran first, such as the fill of an empty author, after which each revision argument is held to its set. It matches each commit id that jj prints short against the commits of the repository''s bookmarks and tags and of the push''s revisions (for a commit with no author, against the mutable commits no remote holds), never against every commit, so a hidden commit whose id starts the same stops no push. Where jj refuses a rewrite because the commit it would make exists already, as in a retry in the same second, the step takes that commit where it stands for the hidden commit the push names, and otherwise prints one line and runs the push as written. A pod''s jj wrapper hands each push to `legion jj --real`, and a tmux pane gets a `<state_dir>/bin/jj` that runs `legion jj --after`. The daemon tells every workflow role `LEGION_ROLE_IDENTITIES` (daemon API contract 209), which an operator''s `pane_env` or pod env may not set. A tmux daemon rolled back to an earlier release leaves `<state_dir>/bin/jj`, which the operator deletes.'
