kind: Fixed
body: 'A role''s `jj git push` gives each mutable commit it sends that no remote bookmark holds the author of the role that the commit''s first `Legion-Role` trailer names, where `LEGION_ROLE_IDENTITIES` holds that role, but where the step prints that it could not (below). An issue''s roles share one jj working copy, so a commit could reach GitHub with another role''s App as its author. Before the push, `legion jj` reads what the push sends from a dry run of it, and runs `jj metaedit --update-author` for each role whose commits carry another author, under that role''s identity from `LEGION_ROLE_IDENTITIES`, in as many batches as keep each command under 2,097,152 bytes. It decides from reads with `--ignore-working-copy`. Where the push takes a snapshot of its own, it first compares git''s `HEAD` and local branches, and no other ref of git''s, with the first parent of `@` and jj''s `@git` bookmarks, with reads that import nothing (`jj log -r ''first_parent(@)''` and `jj bookmark list --all-remotes` against `git rev-parse HEAD` and `git for-each-ref refs/heads`, the first `git` on `PATH`, in the workspace''s root); a workspace with no `.git` in its root, such as an issue workspace under jj 0.38, compares nothing. Where git moved neither and its first run finds nothing of the push to change, no commit and no word, or where the push itself carries `--ignore-working-copy` (which then goes to the real push alone), every command of the step carries that flag and it takes no snapshot. Otherwise it takes the one snapshot the push would take, before its first read where git moved `HEAD` or a local branch, so that a commit under them that a `git commit`, a `git commit --amend` or a `git rebase` made and no jj command has imported yet gets its trailer''s author too (a commit that only a tag or another ref of git''s names is not seen, and keeps the author jj alone leaves it), and otherwise before it changes anything, with the push''s own `-R` and `--quiet` arguments and those of its `--config` and `--config-file` arguments that jj keeps for the push, passes on what that snapshot prints but the warnings jj prints on every command, which the push prints itself, and reads again, so a descendant of a working-copy commit with an unsnapshotted write goes with its write; every later command carries `--ignore-working-copy`, the real push included, which then takes no second snapshot, so a snapshot''s warning prints once and a write another process makes after the step''s snapshot stays for the next jj command. It prints one `legion jj: <role>: <old commit id> -> <new commit id>` line for each commit it rewrote, then runs the push with the role''s own arguments, with `--ignore-working-copy` in front of them where the step took its snapshot, but for a revision argument whose meaning the rewrite changed: jj resolves each argument to its whole set before the rewrite, and once any metaedit of the step has run, the fill of an empty author included, an argument jj no longer resolves to that set, as rewritten, whether or not its own commits moved, gets the set as ids while that word stays under 100,000 bytes, else the primary form `(<argument>) ~ (<old ids>) ~ (<ids it now names and must not>) | <new ids> | <ids it must send>` (each empty part left out) where jj resolves it once more to the set, else the ids in as many words of the same `--change` or `--revisions` option as keep each under 100,000 bytes, each ids form with one printed line (an argument that named no commit gets `none()`), so a change offset, `latest(...)`, `mine()` or `author(...)` sends what it named before the rewrite, even through another argument''s rewrite. No word the step writes passes 100,000 bytes, but for a role''s own argument that is that long already. Only where the push would then pass 2,097,152 bytes of arguments and environment, each revision argument counted at the larger of its own word and its ids, does the step decide, before any rewrite other than the fill of an empty author and, where no such fill ran, before its snapshot, to set no other author, with one printed line, and the push runs as written, but where that fill ran, after which each revision argument is held to its set and the push carries `--ignore-working-copy`. A jj command of the step that fails stops the push with jj''s error and exit status, but for the dry run, a read of a revision argument that jj refuses (one that jj refuses before any rewrite goes to the push as written, one that jj refuses to read again later goes as its ids) and a rewrite refusal the step resolves (below), and it adds no other refusal: where it cannot read the dry run, it prints one line and runs the push as written, but where a metaedit of the step ran first, such as the fill of an empty author, after which each revision argument is held to its set, and with `--ignore-working-copy` where the step took its snapshot. It matches each commit id that jj prints short against the commits of the repository''s bookmarks and tags and of the push''s revisions (for a commit with no author, against the mutable commits no remote holds), never against every commit, so a hidden commit whose id starts the same stops no push. Where jj refuses a rewrite because the commit it would make exists already, as in a retry in the same second, the step takes that commit where it stands for the hidden commit the push names, and otherwise stops the push with jj''s error before the real push runs. A pod''s jj wrapper hands each push to `legion jj --real`, and a tmux pane gets a `<state_dir>/bin/jj` that runs `legion jj --after`. A push written through a jj alias, an alias of an alias or `ui.default-command` gets the step under tmux as in a pod: the pane''s `legion jj` expands a command whose command word is no built-in jj command as jj 0.45 does, after one `jj config list`, runs every command that is no push with the role''s own words, and prints one `legion jj: could not expand …; the command runs as written` line where it cannot expand one. Under tmux, the step''s first command is one more `jj config list`, of the configuration of the repository the push loads, with the push''s own `-R`, `--config` and `--config-file` arguments, which takes no snapshot; a push that the read of the aliases expanded and that names no `-R` makes none, and a read that fails stops the push with jj''s error and exit status. Those reads, and each read of a pod''s jj wrapper, print what jj prints on standard error but the warnings jj prints on every command and the note of a key no configuration sets, which only such a read prints, so a warning jj prints once, such as `Your repo appears to have been copied`, reaches the role. A push whose words hold a short-flag cluster that starts with `-h` or `-V`, which jj reads as help or version, runs no step. The daemon tells every workflow role `LEGION_ROLE_IDENTITIES` (daemon API contract 279), which an operator''s `pane_env`, pod env or provider key may not set. Under tmux, `legion config check` now refuses a provider key named for a variable that places the session a resume reads, one the runtime tells a Claude Code pane or a resumed Oh My Pi pane after the operator''s variables, or a launch secret''s pointer, three kinds of name that before it only the tmux runtime''s boot refused; it also refuses one named `LEGION_ROLE_IDENTITIES`, which nothing refused before. A tmux daemon rolled back to an earlier release leaves `<state_dir>/bin/jj`, which the operator deletes. A `git commit` whose caller asks git for an isolated configuration, as hermetic tests do, with `GIT_CONFIG_NOSYSTEM` set to a value git reads as true or with `GIT_CONFIG_GLOBAL=/dev/null`, gets no trailer from `legion git`, so its message and commit id are what git alone makes.'
