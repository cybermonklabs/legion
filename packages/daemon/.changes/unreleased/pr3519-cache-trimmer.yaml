kind: Added
custom:
  Issue: pr3519
body: |-
  Every issue pod's launcher runs a cache trimmer, on by default for every Kubernetes deployment.
  When the issue volume reaches `runtime.kubernetes.volume_trim.high_percent` (85 by default), it
  deletes the oldest entries not modified for `min_age_minutes` from four cache roots — Go's own
  build directories under `/legion/scratch/tmp`, the Go build cache, the tool caches under
  `/legion/scratch/cache` and the Bun install cache — until the volume is back at `low_percent`
  (70). It deletes nothing from workspaces, repositories, the Go module cache or the uv caches,
  and nothing else of the temporary directory. `enabled: false` switches it off, and the settled
  block is in the state body under `settings.runtime.kubernetes.volume_trim`.

  A sweep that leaves the volume above its low mark, and a trimmer that switches itself off after
  three panics in a row, reach the issue's architect as a new `volume-near-full` notice, bounded
  to three per trimmer and episode and one an hour per pod (the switched-off notice is always
  sent). A rollback below this release has the operator delete the queued notices first, as
  docs/kubernetes.md says.

  A `worker-died` notice of the tree architect, and of a held phase, now names the pod's own end
  — `Evicted: The node was low on resource: ephemeral-storage. ...` above all — when the claim's
  process died of one, and, where the notice carries no failure record, the sentence the daemon
  wrote when it gave up on the claim. The pod end is kept on the claim, in a new `claims.pod_end`
  column, so a failure the daemon replays after a restart names it too.
