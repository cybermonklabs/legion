kind: Added
custom:
  Issue: pr3519
body: |-
  Every issue pod's launcher runs a cache trimmer, on by default for every Kubernetes deployment.
  When the issue volume reaches `runtime.kubernetes.volume_trim.high_percent` (85 by default), it
  deletes the oldest entries not modified for `min_age_minutes` (an hour more in the Go build
  cache) that no process of the pod holds from four cache roots — Go's own build directories
  under `/legion/scratch/tmp`, the Go build cache, the tool caches under `/legion/scratch/cache`
  but the Playwright registry and the Claude Code cache, and the Bun install cache — toward
  `low_percent` (70), stopping there or sooner. It deletes nothing from workspaces, repositories,
  the Go module cache or the uv caches, and nothing else of the temporary directory.
  `enabled: false` switches it off, and the settled block is in the state body under
  `settings.runtime.kubernetes.volume_trim`.

  A sweep that leaves the volume above its low mark, unless the settings stopped it, and a
  trimmer that switches itself off after three panics in a row, reach the issue's architect as a
  new `volume-near-full` notice, bounded to three per trimmer and episode and one an hour per pod,
  which a sweep whose episode a rise raised skips (the switched-off notice is sent whatever the
  bounds stand at). A rollback below this release has the operator delete the queued notices
  first, as docs/kubernetes.md says.

  A `worker-died` notice of the tree architect, and of a held phase, now names the pod's own end
  — `Evicted: The node was low on resource: ephemeral-storage. ...` above all — when the claim's
  process died of one, and, where the notice carries no failure record, the sentence the daemon
  wrote when it gave up on the claim, quoted and cut at 400 characters; the one that ends a
  closed issue's production-check look, which carried that sentence whole, now quotes and cuts it
  the same way. The pod end is kept on the claim, in a new `claims.pod_end` column, so a failure
  the daemon replays after a restart names it too.
