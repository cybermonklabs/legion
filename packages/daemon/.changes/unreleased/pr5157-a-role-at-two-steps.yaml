kind: Added
custom:
  Issue: pr5157
body: |-
  A plan's task can name one role at two steps, such as `implementer:a reviewer implementer:a`,
  and so can a project's `default_steps`. Each step keeps its own record of its run: its report,
  its completion and its phase entry. The task of a later step names the report of each step
  before it, by place. A completion is held to the step whose run it reports, and its key names
  that step where the role stands at two steps. A late report of the earlier step, or of the later
  one after a return before it, goes to the record of its own step. A return to an earlier step
  refuses a handoff record the same agent wrote at its later step (`HANDOFF_NOT_NEW`).

  A turn of one of an agent's steps that completes after the task moved on to the agent's other
  step of that role is refused `HANDOFF_STALE_ENTRY`, even at the head the record holds, because
  the two steps ask for different work. Where two agents of one role run its steps, as in
  `implementer:a tester:b implementer:b`, a turn of one agent's step that completes while the task
  stands at the other agent's step of that role is refused `HANDOFF_NOT_CURRENT_PHASE` with the
  words `the <role> step of <KEY> that the task stands at, in phase <phase>, is the work of
  another agent's claim, <claim>, on entry <n>; this completion is of entry <m>, a step this claim
  ran that the task has left, so no task of that step comes to this claim: do not wait for one and
  do not complete again; this completion changed nothing`.

  A review step's task names as ` Last reviewed commit: <sha>.` the commit its agent's newest
  deciding review on the task read, at whichever of that agent's steps of the role it was made,
  and a wake or a resume names that agent's own. A step's row holds that commit only while it
  names the agent, and only a run of the step writes another agent on it: where another agent's
  run has taken every step of the role that an agent worked on the task, the agent's next step of
  the role names none and reads the whole change. A later version of the plan that gives the step
  to another agent who never runs it changes nothing. Where the agent has none, the reviewer's task
  in reviewing, a wake's and a resume's included, and the task of a review step of a role the
  deployment defines carry ` Commit another agent's review read: <sha>.`, the commit read by the
  review of the nearest earlier step of the role that another agent worked, whose review read one.
  A review step of a role the deployment defines records the commit its completion names only
  where that commit is spelled as a head is, 40 lowercase hexadecimal characters, as the head of a
  reviewer's footer must be; a completion that names any other commit leaves the step's commit
  where it stood, and the daemon logs why.

  One migration makes the key of the `phases` table the issue, the role and the step. A daemon of
  the release before cannot write that table, so every project's daemon on the database moves to
  this release together, and back together. Roll back only after each task whose plan names a role
  at two steps is done or stopped. Before you pin the earlier image, remove from every project's
  `default_steps` each role it names at two steps, which the earlier release refuses when it loads
  `legion.yaml`. The migration's header and the Kubernetes guide hold the way back.
