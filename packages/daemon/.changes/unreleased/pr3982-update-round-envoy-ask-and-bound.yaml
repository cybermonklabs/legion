kind: Changed
custom:
  Issue: pr3982
body: |-
  An update round of an issue pod no longer waits without end for its roles. The daemon publishes
  the round's ask once to each role's own Envoy topic, the architect's included, so a role reads it
  inside a running turn. A role is asked once its agent is ready: a queued, launching or suspended
  claim is asked at the first sweep after its agent is ready. The ask names the prefix of the
  rescue branches the push check pushes to. The round ends `pod_update_grace_minutes` after it
  opened (30 by default), or earlier when every asked role has answered `ready_for_update` and no
  turn runs. An operator's suspension still holds the round past that bound. The push check still
  runs before every replacement, and a pod whose shim is older than the check is replaced
  unchecked, which the issue is told. The end of a turn is no longer an answer, and an answer
  stands through later turns. This release never sends the update task that an earlier release
  queued on a claim: it drops that task, and a role that read it before the deploy gets the Envoy
  ask as well. Only a `ready_for_update` call answers the round. The controller gets one
  `update-stalled` notice per round only when the bound has passed and something still holds the
  round. The daemon
  logs `outbox update ask published to the role topic` for each ask and `supervise pod update
  replaced at the bound` when the bound ended a round. `pod_update_retask_hours` and
  `pod_update_notice_hours` are gone: a `legion.yaml` that still sets one boots with a warning.
  Migration `20261113110610` drops the claim
  columns `update_answered_by_turn_end` and `update_reasked_for_push_check`; docs/kubernetes.md
  gives the five statements a rollback to an earlier release needs: two bring the columns back,
  one deletes the migration's `schema_version` row, so a later roll forward runs it again, one
  deletes the queued asks, which a roll forward asks again, and one clears the ask mark of each
  claim that has not answered, so the earlier release asks that role at once. Every daemon that
  shares one database deploys and rolls back in the same change. The
  same migration starts every pod round open at the deploy again: each claim of the round records
  the deploy as the round's opening and loses its ask mark and its notice mark. So each role of
  such a round that has not answered is asked once, and the round ends `pod_update_grace_minutes`
  after the deploy at the latest, rather than at the first sweep with no ask.
