kind: Changed
custom:
  Issue: pr3982
body: |-
  An update round of an issue pod no longer waits without end for its roles. The daemon publishes
  the round's ask once to each role's own Envoy topic, the architect's included, so a role reads it
  inside a running turn. The round ends `pod_update_grace_minutes` after it opened (30 by default),
  or earlier when every asked role has answered `ready_for_update` and no turn runs. An operator's
  suspension still holds the round past that bound. The push check still runs before every
  replacement, and a pod whose shim is older than the check is replaced unchecked, which the issue
  is told. The end of a turn is no longer an answer, and an answer stands through later turns. The
  controller gets one `update-stalled` notice per round only when the bound has passed and something
  still holds the round. The daemon logs `outbox update ask published to the role topic` for each
  ask and `supervise pod update replaced at the bound` when the bound ended a round.
  `pod_update_retask_hours` and `pod_update_notice_hours` are gone: a `legion.yaml` that still sets
  one boots with a warning. Migration `20261113110610` drops the claim columns
  `update_answered_by_turn_end` and `update_reasked_for_push_check`; docs/kubernetes.md gives the
  two statements a rollback to an earlier release needs.
