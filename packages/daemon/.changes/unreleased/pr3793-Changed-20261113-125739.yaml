kind: Changed
body: 'The completion route takes a phase completion of an earlier entry of the same phase when the phase ends with a handoff record the completing role writes and the completion names the head the record holds for the issue''s pull request, and refuses it `409 HANDOFF_STALE_ENTRY` whatever head it names when the entry the phase stands on was raised by a move back; each such refusal names what decided it. Store migration `20261113090512_phase_entry_moved_back.up.sql` adds `phases.entry_moved_back`, false on every row the upgrade finds, so an entry a move back raised shortly before the upgrade reads as a forward move''s until the next start raises that role''s entry, and in that window a behind completion at the recorded head is taken; an operator who will not have that window runs `update phases set entry_moved_back = true;` with the new daemon migrated and not yet serving. Daemon API contract 106. The reviewer''s handoff field `headReviewed` is renamed `head`, the field every file-backed handoff body now carries.'
