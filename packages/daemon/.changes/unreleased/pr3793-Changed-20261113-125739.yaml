kind: Changed
body: 'The completion route takes a phase completion of an earlier entry of the same phase when the phase ends with a handoff record the completing role writes and the completion names the head the record holds for the issue''s pull request, and refuses it `409 HANDOFF_STALE_ENTRY` whatever head it names when the entry the phase stands on was raised by a move back; each such refusal names what decided it. A completion of another entry than its role''s phases row names, from a role that no longer works the phase the issue stands in, is answered `409 HANDOFF_NOT_CURRENT_PHASE` in the words the workflow answers that code with, and records nothing, where it was refused `HANDOFF_STALE_ENTRY` with words saying the task of the phase''s entry was owed to the claim, a task the daemon drops unsent once the issue has left that phase; among them are a taken behind completion sent again and one naming a newer record, since the taken completion moved the issue on. Store migration `20261113090512_phase_entry_moved_back.up.sql` adds `phases.entry_moved_back`, true on every row the upgrade finds, so each refuses a behind completion as the daemon before it did until that role''s next entry writes what its own move was. A completion from a role whose phase the issue has left that names a handoff record has it read back against that phase before the workflow records it, so a late completion naming another issue''s, phase''s or session''s record is refused `HANDOFF_RECORD_MISMATCH` or `HANDOFF_SESSION_MISMATCH`, and a reviewer''s completion naming its own review record after its approval moved the issue to accepting is taken; one that names no record reaches the workflow as before; and a further completion of a role whose completion of that phase was already taken is refused `HANDOFF_NOT_CURRENT_PHASE` whether or not it named a commit or a record. Daemon API contract 120. The reviewer''s handoff field `headReviewed` is renamed `head`, the field every file-backed handoff body now carries.'
