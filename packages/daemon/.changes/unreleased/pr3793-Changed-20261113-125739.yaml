kind: Changed
body: 'The completion route takes a phase completion of an earlier entry of the same phase when the phase ends with a handoff record the completing role writes and the completion names the head the record holds for the issue''s pull request, and refuses it `409 HANDOFF_STALE_ENTRY` whatever head it names when the entry the phase stands on was raised by a move back; each such refusal names what decided it. A completion of another entry than its role''s phases row names, from a role that no longer works the phase the issue stands in, is answered `409 HANDOFF_NOT_CURRENT_PHASE` in the words the workflow answers that code with, and records nothing, where it was refused `HANDOFF_STALE_ENTRY` with words saying the task of the phase''s entry was owed to the claim, a task the daemon drops unsent once the issue has left that phase; among them are a taken behind completion sent again and one naming a newer record, since the taken completion moved the issue on. Store migration `20261113090512_phase_entry_moved_back.up.sql` adds `phases.entry_moved_back`, false on every row the upgrade finds, so an entry a move back raised shortly before the upgrade reads as a forward move''s until the next start raises that role''s entry, and in that window a behind completion at the recorded head is taken; an operator who will not have that window runs `update phases set entry_moved_back = true;` with the new daemon migrated and not yet serving. Daemon API contract 109. The reviewer''s handoff field `headReviewed` is renamed `head`, the field every file-backed handoff body now carries.'
