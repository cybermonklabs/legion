kind: Added
body: |-
    Work in flight survives the end of a worker's process, of its connection and of the daemon.
    Daemon API contract 159.
    A claim that is ready, idle or working and whose session has not registered with Envoy for
    more than 20 minutes is marked unreachable. The daemon reads Envoy's session list once a
    minute, unresponsive sessions included. The mark is `unreachable`, `{since, lastSeen?}`, on
    every claim view of `GET /legion/v1/state`, on the controller's locator and on the operator's
    claim routes, and the claim keeps its state. The controller gets an `unreachable-claims`
    notice, and each tree's architect is told of the claims of its tree other than its own. Six
    more notices go to the controller: `relaunch-ready`, `relaunch-guard-held`, `relaunch-not-back`,
    `unreachable-exit`, `worker-locked-out` and `envoy-no-live-session`.
    `POST /legion/v1/claims/relaunch`, the controller's `relaunch`, stops an unreachable claim's
    process through its launcher and starts it again on the same session, and charges the claim
    nothing. A guard refuses it (`RELAUNCH_GUARD`) while the claim's worker stream has shown a step
    in the last 20 minutes, while its session has sent an activity report in its open turn in the
    last 20 minutes, while its open call is not a `wait`, and while its last activity report since
    its launch is missing or shows background work. The daemon also refuses a second relaunch of
    a claim within 6 hours, a role whose launcher is not connected, a launch that would replace the
    pod, and a claim whose pod holds two or more claims that are all unreachable, and it does
    nothing more after a stop that the claim's process outlived. Under `controller: daemon` the
    daemon relaunches its own controller on its same session, at most once in 6 hours, and replaces
    the controller's pod where the launch needs that or the launcher is not connected.
    The worker stream tells an older generation's connection to stop when the claim's newer
    process says hello, and tells a hello of an older generation to stop, after a daemon restart
    too: the database keeps the hash of every boot token a launch replaced. The daemon closes an
    older connection that sends nothing for 2 minutes after its stop frame, and reports a newer
    process that is still refused after 5 minutes (`worker-locked-out`). Every accepted TCP
    connection of the worker stream carries keepalive (15 s idle, 9 probes 15 s apart) and a
    2-minute `TCP_USER_TIMEOUT`, so a connection whose sent data stays unacknowledged for 2 minutes
    ends.
    For a case no agent can hear, the daemon writes an error line that starts `LEGION FLEET ALERT`,
    with a `case` field: `controller_unreachable`, `controller_relaunch_refused`,
    `envoy_no_live_session`, `envoy_session_list_unreadable` or `newer_process_refused`. It writes
    one line for each case and claim until that case ends, for a log-match alert policy to page on.
    A worker's claim boot and each call of it that the daemon applies at most once now wait up to an
    hour for a daemon that is not serving, and an Oh My Pi worker's own stall watch does not count
    that wait. So the stall backstop's floor gains that hour: from 1 hour 9 minutes to 2 hours 9
    minutes for the planner, tester, architect, merger and controller, and from 4 hours 9 minutes
    to 5 hours 9 minutes for the implementer and reviewer. A `worker_stall_backstop_hours` value
    below the floor is refused at load, and the message names the four terms. Where the file leaves
    a role out, the planner, tester, architect, merger and controller run on 2 hours 9 minutes,
    where they ran on 2 hours, and the implementer and reviewer on 8 hours, as before.
    An Oh My Pi session whose previous process ended in a turn is told so when it is resumed, and
    a session whose Envoy heartbeat stopped registers again (`@sjawhar/pi-envoy`).
    Four migrations add the claims' reach record, and a rollback needs no SQL statement
    (`docs/kubernetes.md`, "Rolling back the release that reports claims out of reach").
