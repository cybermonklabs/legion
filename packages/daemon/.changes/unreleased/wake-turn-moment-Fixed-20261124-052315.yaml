kind: Fixed
body: |-
    A paced wake now runs at the moment `legion state` names for it (`wakesWaiting`'s `dueAt`), and
    a held suspension stops its agent at its deadline. Each timer was armed for the wait from the
    daemon's earlier read of the clock, so it came due as much later as the decision took between
    that read and the arm.
