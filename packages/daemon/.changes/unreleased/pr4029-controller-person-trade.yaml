kind: Changed
body: |-
  `legion controller start` now sets `PERSON_SIGNIN_TRADE=off` for the controller, under
  `dispatch_token_broker` and `dispatch_token_file` alike. `off` is that variable's one value:
  unset or blank leaves the person trade on, and any other value written there fails every broker
  call of the process that sets it. So every credential
  the controller trades at the secrets broker is this machine's and never the operator's
  `agent-secrets login` sign-in: its Dispatch credential under `dispatch_token_broker`, and its
  Envoy credential where no Envoy bearer names one. A bearer the operator's own environment or
  `envoy.json` gives the controller is presented as it is today. Its `agent-secrets` secret reads
  are unchanged.
