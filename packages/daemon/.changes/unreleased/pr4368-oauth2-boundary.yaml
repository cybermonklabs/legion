kind: Fixed
body: |-
  The launcher's line for a failed token exchange no longer prints a credential the security
  token service's answer quotes. The exchange's error quoted the service's answer body as it
  came, and the line logged it whole; the launcher now calls golang.org/x/oauth2 through
  `oauth2call.Call`, whose error prints only the rule for remote text's reading of those words,
  with each URL's user information and each query value removed. The token sources the launcher
  and the session proxy hand to x/oauth2 and to the Cloud SQL connector go through
  `oauth2call.TokenSource`, so a refusal those libraries print holds the same reading. The
  launcher's exchange and the session proxy's IAM impersonation send through
  `oauth2call.RefusalClient`, so a refusal that echoes the subject token or the pod's bearer prints
  neither. The daemon's clients name an answer's status by its code and the standard phrase
  (`oauth2call.StatusLine`), never the reason phrase the answering party wrote: the turn reports,
  Dispatch's client, the Envoy listener calls and the repository cache's reads. The repository a
  cache's answer names, the reason, holder state and holder the controller probe logs of a role
  lookup, and GitHub's rate-limit headers in the daemon's limit lines each print as the rule
  reads them (`oauth2call.Header`, `oauth2call.RoleLookup`), a rate-limit header that is a number
  as that number. What a refusal is - GitHub's rate limit, its plan refusal, a ref it already
  has, a code or sentence of Dispatch's, the secrets broker's, the Envoy listener's or the
  daemon's own - is decided on the answer as it came and never on the rule's reading of it, which
  prints a whole body whose one URL sits beside a JSON quote, as GitHub's documentation URL does,
  as not readable: the rate-limit classifier, `ghbranch`, the cipher and Dispatch clients, the
  listener calls and `legion controller start` each read the answer through `Answer.Decode` or
  `oauth2call.Holds`, Dispatch's `Error` holds its code and its sentence as they came (`Code`,
  `Said`) and the broker's refusal its code, so a write that quotes a code - a message naming
  `ISSUE_NOT_FOUND`, a pod token holding a run of `POD_TOKEN_EXPIRED` - leaves the refusal the one
  its sender made.
