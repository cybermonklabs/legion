kind: Changed
custom:
  Issue: pr4392
body: |-
  The prompts of every phase worker, every architect and the daemon-launched controller add
  `DISPATCH_TOKEN_BROKER`, `AGENT_SECRETS_URL`, `AGENT_SECRETS_MACHINE_IDENTITY`,
  `AGENT_SECRETS_MACHINE_TOKEN_FILE` and `AGENT_SECRETS_KEY_DIR` to the variables a role never
  changes or unsets, because a role in a pod that trades reads its Dispatch credential through
  them. The root architect's prompt reads the root's claim with
  `dispatch api --path /api/v1/issues/<root>` in place of a `curl` that read
  `DISPATCH_TOKEN_FILE`, and the daemon-launched controller's prompt says to read Dispatch's API
  with `dispatch api --path <route>`, never with a `curl` over `DISPATCH_TOKEN_FILE`.
