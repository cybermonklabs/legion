kind: Fixed
body: |-
  A TLS alert from NATS or Dispatch, such as a server that demands a client certificate or speaks
  no TLS version the daemon does, now stops the daemon's start at once and names the alert, as one
  from its store does. Before, the start waited out NATS and Dispatch for ever, because Go returns
  the alert as a network error. The boot's catch-up of the roots that run or wait on a person now
  stops the start too on a TLS alert, a certificate the daemon cannot verify or an https URL on a
  plain-HTTP port, where it used to skip that root and go on.
