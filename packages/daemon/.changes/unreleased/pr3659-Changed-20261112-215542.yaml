kind: Changed
body: |-
  The daemon answers every caller in the shape that caller's own plugin reads. A request states
  the contract its plugin speaks in the `Legion-Plugin-Contract` header. Every answer carries the
  daemon's own contract in `Legion-Daemon-Contract`. On the state, the per-issue record, a fresh
  session's answer, the release records and a refusal that names the project's pause, a caller
  that states no contract is placed by the claims of the pod it asks from. A key a later contract
  added is left out of that body, and a
  key a later contract removed is written back where the caller's own plugin requires it. The
  same rule holds for a value a later contract added to a field that was already there. A reader
  refuses the whole body for a value its contract does not name, so such a stranded claim state,
  wait answer or waiting line kind is held back from a caller whose contract, or whose pod's
  lowest contract, does not name it. A value that arrived together with its field is left out
  with that field's key.
  A plugin below contract 86 sends `ready` on every `handoff_complete`, and 86 took that
  field out of the request. The daemon reads it again: `false` is ignored, and `true` is refused
  `READY_RETIRED`, because no daemon from 86 on acts on READY. So a pod below 86 can end its phase
  on this daemon, and a plugin roll that replaces one pod at a time leaves `legion` working in
  every pod it has not replaced yet whose plugin speaks contract 46 or later. A caller below 46 is
  served the shape of 46.
  A fresh session that stopped the claim and could not start it again answers a caller below
  contract 104 as the daemon did before 104: the failure of the refused step, and no 200 with
  `phaseNotRestarted`. A plugin below 104 reads that 200 as a claim that runs again.
  `GET /legion/v1/issues/{key}/record` answers one issue on its own, and `GET /healthz` answers
  the project the daemon serves beside its status. A reader served this daemon's own shape,
  `legion state --json` among them, now gets `contract.caller`, equal to `contract.daemon`;
  before, the daemon left that key out for such a reader. A reader below the daemon's own
  contract gets there the contract its body is shaped to, as before, and a reader below 75 gets no `contract`
  mark at all.
  Two `dropped` texts of the line the daemon already logs as
  "api: narrowed the state to the caller's plugin contract" changed, so an operator's log query on
  an old text moves: the one for the retired stranded entries from "the retired entries of
  strandedClaims" to "the entries of strandedClaims in a state this caller does not admit", and
  the one for the waiting line's kind from "the waiting line's kind of every member waiting on
  another issue" to "the waiting line's kind of every member of a kind this caller does not
  admit". A value line now names the contract the caller states, else its pod's lowest, under
  `pluginContract` and carries a `follows` field.
