kind: Added
body: The daemon publishes the session of each live role of an issue to Dispatch at the boot ready of a claim, at each boot, and at each claim write that lands and changes the session that holds a role (a registration, an end, a relaunch), through the new outbox kind role_holders_publish. An end whose own write the store did not take is published when the daemon makes that write at the claim's next decision. A ready whose publication the daemon could not queue is refused with 503, and the plugin tries it again. A publication that Dispatch refuses with 400 ends, with one ERROR line that names the issue and Dispatch's code.
