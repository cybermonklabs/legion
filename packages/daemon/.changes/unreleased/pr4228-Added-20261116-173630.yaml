kind: Added
body: The daemon publishes the session of each live role of an issue to Dispatch at the boot ready of a claim, at each boot, and at each claim write that changes the session that holds a role (a registration, an end, a relaunch), through the new outbox kind role_holders_publish. The claim write queues that publication in its own transaction, so the change and its publication commit together or not at all. An end whose claim write failed with an error that the daemon owes is published when the daemon makes that write again at the claim's next decision. An end whose claim write failed and is not owed is written again only when a later decision of that claim retires a pending task it still holds, such as the task of a turn that is over; otherwise its session stays listed until another write of that claim lands (dispatch://INFRA-4099). A ready whose publication the daemon could not queue is refused with 503, and the plugin tries it again. A publication that Dispatch refuses with 400 ends, with one ERROR line that names the issue and Dispatch's code.
