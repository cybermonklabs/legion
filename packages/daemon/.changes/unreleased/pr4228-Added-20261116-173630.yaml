kind: Added
body: The daemon publishes the session of each live role of an issue to Dispatch at the boot ready of a claim, at each end of a claim and at each boot, through the new outbox kind role_holders_publish. A ready whose publication the daemon could not queue is refused with 503, and the plugin tries it again.
