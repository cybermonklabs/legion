kind: Added
body: The daemon publishes the session of each live role of an issue to Dispatch at the boot ready of a claim, at each boot, and at each claim write that changes the session that holds a role (a registration, an end, a relaunch), through the new outbox kind role_holders_publish. The claim write queues that publication in its own transaction, so the change and its publication commit together or not at all; a claim write that can queue none, such as each write of a daemon with no dispatch_url and each write of the controller's claim, runs as it ran before, so a write of the claim alone opens no transaction. An end whose claim write failed with an error that the daemon owes is published when the daemon makes that write again at the claim's next decision. An end whose claim write failed and is not owed is written again only when a later decision of that claim retires a pending task it still holds, such as the task of a turn that is over; otherwise its session stays listed until another write of that claim lands. A ready whose publication the daemon could not queue is refused with 503, and the plugin tries it again. Against a Dispatch without the route, which answers its router's 404 "no route for …", a publication waits and logs as a wait, with no ERROR line, and lands once Dispatch serves the route. A publication that Dispatch refuses with 400 ends, with one ERROR line that names the issue and Dispatch's code.
