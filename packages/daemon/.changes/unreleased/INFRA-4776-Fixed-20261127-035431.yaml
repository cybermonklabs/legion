kind: Fixed
body: |-
    Inside `agent-secrets NAME -- git push`, whose `NAME` the secrets broker's airlock holds back,
    the leak guard's visibility read of the push's target no longer fails on the airlock's
    certificate when it carries a gh directory's token, Legion's installation token in a pod. The gh
    `legion gh` runs, the guard's curl read and `legion git-credential`'s fork read then keep no
    `HTTPS_PROXY` or `https_proxy` that names the airlock's proxy, and no `ALL_PROXY`, and connect to
    GitHub directly. Where `agent-secrets` wrote a trust bundle, because the machine's store does not
    hold the airlock's roots, every such read through the airlock failed certificate verification,
    since the reads are given no trust store of the caller's, and the push was refused. A pod whose
    only route to GitHub is a proxy has none for these reads there: `agent-secrets` replaced a proxy
    named in `HTTPS_PROXY`, and the guard leaves out one named in `ALL_PROXY`. A read that carries
    the caller's own `GH_TOKEN` or `GITHUB_TOKEN` keeps the airlock's proxy, as before, since only the
    airlock swaps a placeholder for the real token.
