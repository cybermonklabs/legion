kind: Fixed
body: A suspension that stops a role's agent process, an idle release included, now deletes the Envoy session registration of that role, as the daemon already did for a process that died. A message sent to a role whose issue pod was just released then raises the wake that brings the pod back, instead of being stored for up to five minutes with no wake. An informational role message the daemon sends to a released role (the copy of a head's settled checks to a role that settlement did not wake, a design gate's move, an approved round stuck on its merge state) is not published, so it wakes nothing; the settlement still wakes the phase worker, and the daemon's notices, phase-ended messages, hook prompts and merge-queue removal messages still wake the role they are for. A phase-ended message and a hook prompt are now published with Envoy's keep flag set, so Envoy keeps each for one hour and hands it to the woken role's session, instead of the message being dropped because that session had not claimed its role yet when the daemon published it. Each is published only once the woken role's resume has launched, so a resume the wake pacing holds for its turn no longer uses up that hour before the pod starts. A stop that the runtime refused deletes nothing.
