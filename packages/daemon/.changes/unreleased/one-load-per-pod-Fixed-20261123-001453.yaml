kind: Fixed
body: |-
    The daemon starts the roles of one issue pod one at a time. A role's process starts only when no
    other role of that pod is loading its session, which ends 30 seconds after its agent registers,
    since the process's memory goes on rising past the registration, and no role ahead of it waits;
    a load whose agent has not registered two minutes after its process started lets the next role
    start all the same. Two roles that resumed long sessions together could pass the pod's memory
    limit and have the whole pod stopped, every role's turn with it. A waiting start is parked on
    its claim, so a suspension, a release, a close or a pause's stop of a waiting role acts at once
    and its process never starts. The roles that wait together start in this order: the earliest
    whose start a task, a message or an operator raised, then the others as they asked; with no
    such start, the first to reach the idle pod, then the role working the issue's current phase,
    then architect, planner, implementer, tester, reviewer, merger. Each start into an issue pod and
    each load's end write a line to the daemon's log, and a start that waited names the role it
    waited for, how long, and what ended the wait.
