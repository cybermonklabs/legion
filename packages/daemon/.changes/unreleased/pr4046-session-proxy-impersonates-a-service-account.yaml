kind: Added
body: |-
  A pod's session proxy can sign in to Cloud SQL as a Google service account that the deployment
  names. `runtime.kubernetes.session_database` takes an optional fourth member,
  `impersonate_service_account`, and `user` must then be that account's IAM login, its email
  without `.gserviceaccount.com`. `legion start --check-config` refuses any other value of either.
  When the member is set, each pod's `legion launcher` gets
  `--session-impersonate-service-account <email>`, and its proxy impersonates the account with the
  pod's own credentials for both of the Cloud SQL connector's token sources. This is what lets a
  GKE pod, whose own identity has no email address and so no Cloud SQL login, use the
  `cloudsql-iam` store. The deployment grants the pods' Kubernetes ServiceAccount a role that holds
  `iam.serviceAccounts.getAccessToken` on the account (`roles/iam.workloadIdentityUser`), grants
  the account `roles/cloudsql.instanceUser` and `roles/cloudsql.client`, gives it an IAM database
  login, and turns the IAM Service Account Credentials API on (docs/kubernetes.md, "Selecting the
  store"). A pod whose account differs from the configuration has drifted. The daemon declares API
  contract 137 for the new launcher flag, so the daemon and the worker image move together.
