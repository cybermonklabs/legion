kind: Fixed
body: 'A role could be told the same news of an approved design twice when its turn ended before the daemon had read the acknowledgement of the prompt that started it: the daemon took the turn''s end as the end of the task, dropped the prompt''s result that came after it, and sent the news again in a second task. A provider error in such a turn was lost the same way. The daemon now ends such a task only at the prompt''s result, whichever of the result and the acknowledgement it reads first. A project pause that is held over such a turn, or that arrives just after it, waits for the prompt''s answer before it stops the role: the result, or the refusal or loss of the send. After a lost send the role keeps its task and is sent it again at the resume, because the daemon cannot tell whether the agent received it. Where the answer says the prompt ran no turn, the pause now stops the role at that answer; it used to leave the role running until the pause asked again, up to ten minutes later. A suspension held over a turn and ended by a paced relaunch now keeps the task that turn had not finished, and the role is sent it again at the resume, where the task used to be recorded as done.'
