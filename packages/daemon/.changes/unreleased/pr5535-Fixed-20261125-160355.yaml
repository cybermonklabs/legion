kind: Fixed
body: 'A role could be told the same news of an approved design twice when its turn ended before the daemon had read the acknowledgement of the prompt that started it: the daemon took the turn''s end as the end of the task, dropped the prompt''s result that came after it, and sent the news again in a second task. A provider error in such a turn was lost the same way. Unless a suspension other than a project pause''s, such as an operator''s or the daemon''s, is held for that turn, the daemon now ends such a task only at the prompt''s result, whichever of the result and the acknowledgement it reads first; under such a suspension the turn''s end still stops the role and ends the task, as before. A task whose resend and earlier prompt both answered that they ran no turn, before the daemon had read the resend''s acknowledgement, is now kept for the role, where it could be recorded as done. A turn that starts after the prompt has answered that it ran no turn is no longer taken as the role taking the task: a task whose prompt was answered busy before its acknowledgement is now kept at the end of the turn that answer named, where it was recorded as done, and a death in such a turn no longer leaves the role''s entry marked as taken or the relaunched role untold of what the earlier launch ended. A project pause held over a turn behaves as before: it stops the role at a result that says the turn''s prompt ran, with or without a provider error, and otherwise at the latest when the pause asks again, up to ten minutes later. That now also holds where the turn ended before the daemon read the prompt''s acknowledgement.'
