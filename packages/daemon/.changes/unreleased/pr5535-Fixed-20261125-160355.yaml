kind: Fixed
body: 'A role could be told the same news of an approved design twice when its turn ended before the daemon had read the acknowledgement of the prompt that started it: the daemon took the turn''s end as the end of the task, dropped the prompt''s result that came after it, and sent the news again in a second task. A provider error in such a turn was lost the same way. The daemon now ends such a task only at the prompt''s result, whichever of the result and the acknowledgement it reads first. A project pause waits for the answer of the prompt of the task a role''s turn took before it stops the role, wherever the turn has ended with that answer still to come, whether the pause was held over the turn or reaches the role after it: the answer is the result, or the refusal or loss of the send. A repeated ready, the deadline of the pause''s own stop and a prompt failure that reaches the failure limit no longer stop the role before that answer; if no answer comes, the pause asks again ten minutes later and stops the role then. After a lost send the role keeps its task and is sent it again at the resume, because the daemon cannot tell whether the agent received it. Where the answer says the prompt ran no turn, the pause stops the role at that answer, as it now also does when the daemon cannot record that answer; it used to leave the role running until the pause asked again, up to ten minutes later. A task whose first prompt and whose resend both said they ran no turn is now kept for the role, where it could be recorded as done when the resend''s answer came before the daemon read its acknowledgement. A suspension held over a turn and ended by a paced relaunch now takes back the task that turn had not finished, where the task used to be recorded as done: a project pause or an operator''s suspension keeps it and sends it again at the resume, and a suspension the daemon makes because the role''s phase is over retires it with that phase, as it retires any unfinished task of the phase.'
