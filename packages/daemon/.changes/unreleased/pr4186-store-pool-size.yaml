kind: Fixed
body: |-
    The daemon's Postgres pool holds at most 32 connections on every machine unless its DSN names
    `pool_max_conns`. pgxpool's default, one connection per CPU the process sees, follows the
    node's CPU count rather than the pod's CPU limit, so a daemon whose DSN set no size could open
    more connections than its Postgres allows: 288 on a 288-CPU machine against a server of 100.
    32 is the number every deployed daemon already gets from the `pool_max_conns=32` its DSN
    carries, which keeps it.
