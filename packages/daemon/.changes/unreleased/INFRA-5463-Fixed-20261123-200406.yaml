kind: Fixed
body: |-
    A claim's `lastStartFailure` no longer outlives the agent that came up after it. The claim
    drops it when its agent says it is ready, as it resets the launch failures that sentence
    names, so a claim launching again later shows a start failure only when a start failed since
    then. Before, a claim waiting to launch could show a refusal from days before, such as the
    leak-check install's `waitid: no child processes` that #4289 fixed, as if it were the reason
    the claim was not running. A start failure stored before this release stays until the
    claim's agent is next ready.
time: 2026-11-23T20:04:06Z
