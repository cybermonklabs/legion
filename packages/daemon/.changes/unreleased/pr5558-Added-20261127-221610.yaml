kind: Added
body: |-
  An issue's branch row now ends when GitHub, or the deployment's private-name rules, refuse it in a way a retry meets again. Before, the row retried for ever and told nobody. So a deployment whose App cannot use GitHub's GraphQL API never moved a next change's branch.
  These REST answers end the row: a 403 that is no rate limit, a 404, a 409, and a create's 422. These GraphQL answers end it: the endpoint's 403 that is no rate limit, its 404, and an `updateRefs` error of type FORBIDDEN, INSUFFICIENT_SCOPES or NOT_FOUND. An answer that lacks what the write needs ends it too: no node id, no commit, or a compare status the daemon does not read. So does a move with neither its base nor the default branch, and a branch name the rules match. A rate limit, a 5xx, a 401, a failed token mint and no answer still retry on the backoff and tell nobody.
  The owning architect gets one `branch-refused` notice for each generation of the issue. A second refused row and a restart tell nobody. The issue's roles start without the write. A later row whose write GitHub takes clears the refusal.
  `GET /legion/v1/state` and the issue record name the refusal as `branchRefused`, under the branch-refused contract entry. Its keys are `row`, `write`, `kind`, `reason` and `at`. `legion state` prints it in a `refused issue branches` block. Store migration `20261128022327_branch_refusals` adds the table `branch_refusals`. Its header carries the way back, which a rollback runs first with every daemon of the database stopped. docs/kubernetes.md gives it under "Rolling back the release that ends a branch row GitHub refuses for good".
