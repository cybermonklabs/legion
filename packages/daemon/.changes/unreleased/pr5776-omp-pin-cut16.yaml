kind: Changed
body: |-
    The worker image carries Oh My Pi `18.18.6-sami.20261127-010836` of cybermonklabs/oh-my-pi,
    which `.omp-pin` names, in place of `18.18.6-sami.20261126-222037`. Its bash tool's shell ends
    a cancelled command's whole process tree, since a cancelled terminate still sends its hard wave,
    so a process that ignores TERM does not outlive the cancelled call. The built-in
    `rsync --timeout` no longer skips a keepalive while it waits on a quiet peer on a busy machine.
    A forked command's redirection words expand in the forked child, and a forked command runs its
    own EXIT trap only where bash does, so a trap set in a piped or backgrounded loop body no longer
    fires when that child ends. The build writes shell frames version 61: a frame stored by
    `18.18.6-sami.20261126-222037` (version 60) is refused, not restored. Its SQL session store
    makes and checks the same tables, indexes and grants as `18.18.6-sami.20261126-222037`, so a
    deployment already on that pin needs no owner run before this one.
