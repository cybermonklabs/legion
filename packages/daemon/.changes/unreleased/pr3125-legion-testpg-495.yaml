kind: Changed
body: |-
    The worker image's `legion-testpg` starts the pod's test Postgres with `max_connections=495` rather than 491, because a Dispatch process may now open 118 connections rather than 117: four processes at 118 plus the suite's own 20 clients (`testlimits.ServerConnections`), and the three slots Postgres reserves for superusers.
