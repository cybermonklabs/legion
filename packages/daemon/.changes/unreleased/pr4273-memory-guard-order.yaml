kind: Changed
body: |-
    The memory guard in an issue pod's launcher now ends first the process that grew the most over
    the last 300 ms, by 1 MiB or more; then, of those that did not, the largest process started
    since the reading before; then the one that grew the most since the previous kill of the rise,
    by 1 MiB or more; and the largest only where none of these applies. Where the reading before
    read no size, every process counts as started since it, which leaves the order by size. The
    controller's pod's guard, new in this release, follows the same rules. Under gVisor a forked
    child reports the pages it shares with its parent as its own, so the largest could be a
    sleeping fork whose end freed nothing while another process filled the pod. A process started
    since the reading before has no earlier read to grow from: six growers that started together
    while a parent and its sleeping forks of a shared block held a 4 GiB gVisor pod at 84% had the
    first kill end a process that shares the block, a sleeping fork or the parent, in 7 of 7 runs,
    and the closest run's highest reading was 2.4 MiB below the kernel's kill point. A pod short of
    CPU takes its readings 170 to more than 300 ms apart, so the 300 ms window can hold one read and
    show no growth, which is why growth since the kill comes before size. To know what grew, the
    guard reads the sizes of what it may end at each reading in the band of 10% of the limit below
    the mark and after a kill, and none below the band. At the first reading at or above the mark
    it chooses the process by the sizes it read in the band and sends the kill before it reads every
    size, which it reads only after the kill. Where the window at the mark holds two band reads of
    no process while the band's own last 300 ms hold two of one, it measures growth over those last
    300 ms, since band readings throttled about 200 ms apart leave one read at the mark. Where none
    of the processes the band found grew, it first reads again the `smaps` of those that grew
    between two of their band reads, the most grown first, then of those that the band read once,
    the smallest first, with no listing of the processes and no descriptor read; it always reads
    the first, stops after the read in hand once half an interval has passed since the reading at
    the mark, and keeps the rest at the band's sizes. Where those show no growth either, it lists
    the processes once, reads the `stat`, `exe`, `ns/pid` and arguments of each process started
    since the band's last reading, protects them by the same rules as any process (a new helper of
    Oh My Pi stays protected), reads the `smaps` of those it may end, the newest first, within the
    same half interval and at least one, and ends the largest of them before any process the band
    found; with none, it ends the largest the band found. It reads again because the step that
    takes the reading over the mark comes after the band's last reading: deciding on the band's
    sizes alone ended a sleeping fork first in a gVisor run at 4 GiB and at 8 GiB. It reads only
    those, for half an interval, because reading every process again put two first kills 201 ms and
    101.75 ms after the mark, and reading all six growers of a run that each had one band read put
    one 100.68 ms after it. With six processes growing at once the host throttled the whole pod's
    CPU, and a reading at the mark that read every size again put the kill 194 ms after it, where
    choosing by the band's sizes put it 1.3 to 71.8 ms after it in 9 of 9 runs. Where the band holds
    no size, where the process it would end first has exited, its pid names another process or its
    kill fails, or where the band's sizes or the sizes read again are under the floor, the guard
    reads every size at that reading and acts on them, as before. After a kill the guard waits only
    until the killed process has exited, and at most `wait_seconds`. Then, where the reading has
    fallen and is still at or above the mark, it ends the next process; where it has not fallen, it
    ends the next at once while a process it may end has grown by 1 MiB or more since the kill and
    the processes it may end hold the floor between them, and it stops for that rise with
    `reason=not fallen` only once the wait has passed with nothing grown. A killed process that has
    not exited is never ended or reported again. The hourly line's high and low, its counter read
    and its scan for the largest process now come only after the guard has decided on the reading.
    The `stopped for this rise` line now ends with `unread_processes=`, which names each process the
    guard could not read, in pid order: `<pid>:<bytes>` where its `stat` reads a state other than
    `Z` and its `smaps` reads, a bare `<pid>` otherwise, and `none` where there is none; every
    other field is unchanged. The guard never ends such a process, and a process whose `exe` or
    `ns/pid` answers `ENOENT` now counts unread unless it has ended, where the scan used to leave
    it out with no line. Under gVisor three kinds stay unread, a stated limit: a process whose main
    thread exited while another thread holds its memory, a process that is not dumpable outside the
    role namespaces (such as what a `kubectl exec` shell runs), and a process being killed. The
    settings, their defaults and the guard's other lines are unchanged.
