kind: Fixed
body: |-
  A refusal no longer prints a value that can carry a credential as written. `legion workspace-init
  fetch` names a refused `--cache-url` by the flag alone, and the intake names a review's
  `review_id` or `submitted_at` it cannot read by the member, never GitHub's value. Before, each
  printed the value, where a user name and password, a token or an echo of the installation token
  can be written.
