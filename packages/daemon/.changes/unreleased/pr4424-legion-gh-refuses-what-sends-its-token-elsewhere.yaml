kind: Fixed
body: |-
    `legion gh` closes more ways a call could send the installation's token, or text the leak guard
    never read, somewhere it should not. gh now runs with an environment built from an allowlist of
    the caller's (the paths, the terminal, the locale, the proxy variables, how gh prints, git's
    identity and Legion's wrapper variables), never the caller's whole: a trust store the caller
    names (`SSL_CERT_FILE`, `SSL_CERT_DIR`) no longer reaches gh, so a proxy sees only the TLS tunnel
    gh opens through it and cannot read the token. A deployment whose proxy inspects TLS with a CA of
    its own must install that CA in the system's trust store. gh's editor is a program that fails,
    whatever the caller names, and its telemetry is off. The git gh runs reads no global or system
    configuration file, takes of the caller's `GIT_CONFIG_*` pairs only the runtime's own, and gets
    `http.sslVerify=true` and submodule recursion off (`submodule.recurse`,
    `fetch.recurseSubmodules` and `push.recurseSubmodules`): git's default fetch recursed on demand
    into a submodule whose own configuration no check read. A working directory whose repository
    configuration sets an `http` ssl or proxy key (but an `sslVerify` that is true), another
    credential helper, or an `includeIf.onbranch:` or `includeIf.hasconfig:` include is refused,
    since a URL-scoped `sslVerify=false` there beats the command line and such an include takes
    effect only after gh's git checks out a branch or adds a remote. `--recurse-submodules`, and any
    git flag `gh repo clone`, `gh repo fork` or `gh gist clone` would hand git clone that is not on a
    short list of exact spellings (`--depth`, `--branch`, `--quiet` and the like), are refused: a
    clone's `-c` flags are its own configuration, and git takes them abbreviated. `--editor` (`-e`)
    and `gh gist edit` are refused: gh runs the editor after the guard has read the call and posts
    what it wrote. `gh agent-task`, which sends the token to the Copilot API host GitHub names, `gh
    auth login`, `logout`, `refresh` and `switch`, which write the gh directory the daemon alone
    writes, and `gh auth setup-git`, which writes git's global configuration that gh's git never
    reads, are refused. A gh directory whose `config.yml` holds a `hosts` block or an alias named
    `help`, whose files name `api_host` or `http_unix_socket` where gh reads a key (a list's items
    among them), or whose files are no regular file or larger than any the daemon writes, is
    refused; it and the daemon's refresh read those files without following a link or waiting on a
    named pipe. The guard's curl read, after gh fails on its connection, runs `/usr/bin/curl` and
    never the first curl on the caller's PATH, and keeps the caller's proxy but no trust store or
    `SSLKEYLOGFILE` of the caller's. With the global and system git configuration out, a clone of a
    Git LFS repository through `legion gh` leaves pointer files.
