kind: Added
body: |-
    `legion git-credential get`, and `legion gh auth git-credential get`, now answer a push to a
    fork whose owner the role's gh bundle holds no directory for. The helper reads the repository
    from GitHub once (`GET /repos/<owner>/<name>` through `/usr/bin/curl`, within 10 s) with the
    token of the directory `GH_CONFIG_DIR` names, where that is a directory of the bundle. For a
    fork, it answers the token it would answer for the fork's parent where the bundle holds that
    owner's directory, else for its source. A pod can then push a fix to the branch of an outside
    contributor's pull request from a fork in a personal account, and the push still passes the
    leak guard. Every other repository of such an owner gets nothing, exit 1, with one line on
    stderr that names the repository and the reason. A request for an owner the bundle holds a
    directory for is answered as before, with no read.
