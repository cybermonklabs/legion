kind: Removed
body: 'The `legion` binary no longer carries private-name rules. A deployment names its own gitleaks rule file with `private_name_rules_file` in `legion.yaml` or `LEGION_PRIVATE_NAME_RULES_FILE` in the daemon''s environment (the key wins), or names none. The daemon reads and compiles the file at boot, refuses to boot on a file it cannot use, and hands the file to every launch as the launch secret `LEGION_PRIVATE_NAME_RULES`. With no file named, the guard runs the shared public leak check alone where one is named, and prints nothing of it on any command; the daemon logs one boot line either way, which with no file named says that no role runs a private-name rule. A deployment that names neither a shared check nor a rule file runs no leak guard: every write is cleared with nothing read. So a deployment that names no shared check, which until this release ran the embedded private-name rules alone, now runs none of them unless it names a rule file. Move each project''s daemon to this release before its pods'' image, or with it, and roll back in the reverse order: a pod of this image under an older daemon runs no private-name rule. A deployment that may roll back across this release sets the variable, because an older daemon refuses the key.'
