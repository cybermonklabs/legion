kind: Added
body: |-
  The answer loop asks once again for a reply its form's own rules refuse. The schema's field
  descriptions state the two rules (a `not_answered` or `needs_work` reply names what it needs,
  and every kind but `none` carries text), which the strict schema subset the providers enforce
  cannot state, since it takes no `minLength`, `pattern` or `anyOf`. A reply that breaks one is
  answered with the daemon's reason as a message after it and asked for again, within the same
  `model_calls`, `answer_seconds` and `output_tokens`. A second such reply, or one made on the
  last allowed call, is `malformed`. The exchange appended to the agent's Oh My Pi session or
  Claude Code transcript holds the refused reply, that message as a user message and the reply
  after it, in that order, so the agent resumes holding the run as it happened. On Anthropic's
  Messages API only the answer's last model call, which offers no tool, carries the reply form's
  schema, since with it on every call Claude answers that needed no tool still made tool calls to
  the `model_calls` bound and the requests of proof run 45683361567, replayed, replied 19 times in
  162 with it against 100 without it; the daemon still checks every reply against the form, and a
  reply out of form on a call that offers a tool is dropped, never written into the conversation,
  and followed at once by the answer's last call, whose reply, refused or out of form, is
  `malformed`.
