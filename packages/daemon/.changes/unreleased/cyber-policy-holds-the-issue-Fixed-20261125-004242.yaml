kind: Fixed
body: |-
    A turn that ends in OpenAI's cyber-policy refusal of the session's content (Oh My Pi's
    `prompt_result` code `cyber_policy`) holds the issue for its architect, whatever HTTP status
    came with it, and the claim fails under the cause word `cyber_policy`. Before, the worker stream
    dropped the code, a refusal a gateway relayed as a 503 climbed the provider-error ladder with no
    attempt limit, and each send was input from outside the session, which ended Oh My Pi's own
    hold and sent the refused content to OpenAI again. A turn that ends at the session's cost cap
    (code `cost_cap`) still goes on the ladder, and the re-sent prompt and the controller's notice
    now name the cost cap instead of "a provider error".
time: 2026-11-25T00:42:42Z
custom:
    Issue: cyber-policy-holds-the-issue
