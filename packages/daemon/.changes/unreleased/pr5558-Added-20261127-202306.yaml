kind: Added
body: |-
  A request for new work on a closed issue whose work merged starts one next change of that issue, never a new run of its tree: a person's, an operator's or the controller's `todo`, an architect's `rerun_child` or `release_children`, a person's approval of a parked root's spec, and a `todo` on an issue in `verifying`. The change is a reason of kind `request`, with who asked, which a merged change carries; the owner withdraws a request of the controller or of an architect with evidence, and a request of a person ends with no pull request only on that person's `done` (`DEFECT_REQUEST_OF_A_PERSON`). Where the record shows no merge, the daemon reads on GitHub the pull requests the record, the issue's links and Dispatch's results name (`merge_read`), and with no merge among them it starts nothing and tells the controller (`merge-unread`). A link counts only in the issue's own repository or the one Dispatch resolves it to. A person then links the merged pull request, or confirms that the work never merged with `backlog`, then `todo`, in Dispatch, which alone runs a closed issue's tree again whole; the operator's `legion issue status` confirms nothing, since under `controller: operator` the controller's agent holds the operator token too. An issue parked before it closed runs again as before. A next change moves `legion/<KEY>` to the head of its base with GitHub's GraphQL `updateRefs`. `legion merge-history-report` counts a project's issues by what the record shows of each merge. `legion reopened-report --config <controller.yaml> --issue <KEY>` reads, for each issue the controller reopened, whether checks were written or the request withdrawn before its change ended. Migration `20261127135256_merged_new_work`, whose way back `docs/kubernetes.md` gives, runs before the done-by-checks way back.
