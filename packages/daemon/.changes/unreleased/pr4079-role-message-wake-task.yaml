kind: Changed
body: |-
  The task a role woken by a role message is given no longer says that nothing kept the message. It
  says that Envoy keeps a role message for one hour, that a message kept for the role reaches the
  woken session as an Envoy card that shows `kept_at`, possibly before the task, unless its hour
  ended first, that Envoy tells the sender when it drops one, and that a message sent with
  `keep: false` is not kept. The role prompts say the same in their sentence about a message to a
  released role.
