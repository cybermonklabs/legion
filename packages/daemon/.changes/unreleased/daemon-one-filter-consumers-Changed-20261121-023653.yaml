kind: Changed
body: 'Each of the daemon''s intake consumers has one filter, so the subject of its create names it, and a grant that holds the daemon to its projects can name each consumer. `legion-go-<P>-dispatch` hears `notifications.dispatch.issue.<P>.>` alone, `legion-go-<P>-github` every repository''s GitHub events (`notifications.github.>`), and `legion-go-<P>-wake` the project''s own wake subject, `notifications.legion.<token>.wake`, the token being the project as its claim tokens spell it. The new `legion-go-<P>-ready` hears the shared `notifications.legion.wake`, where the listener reports only `listener_ready`, and starts at its own creation. A boot updates each existing consumer in place: its name and position are kept. Adding a repository changes only the set of repositories the decoder keeps and makes no JetStream call, so the refresher no longer resends filters, and it runs five jobs. No intake call reads the stream itself. The boot''s catch-up ends when the Dispatch consumer is idle, and `legion state`''s lag reads each consumer''s own info, so the age of the oldest waiting message is now the time since the consumer''s ack floor last moved. The daemon subscribes only to its own project''s role-lane exceptions (`notifications.envoy.exceptions.notifications.role.<P>.*`).'
