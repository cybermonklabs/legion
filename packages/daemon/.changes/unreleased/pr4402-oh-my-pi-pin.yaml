kind: Changed
body: |-
    The worker image carries Oh My Pi `18.18.6-sami.20261118-091112` of cybermonklabs/oh-my-pi,
    which `.omp-pin` names. That build knows `secrets.maskSessionStore`, refuses to open its SQL
    session store under a login whose default is read-only, and pauses automatic Hindsight recall
    for a minute after a recall fails. Every bash call of a role's or the controller's Oh My Pi now
    starts with `set +e +u +o pipefail;`, so a `set -e`, `set -u` or `set -o pipefail` in one call
    no longer cuts a later call. The worker stream keeps the `code` that Oh My Pi gives a refused or
    failed prompt (`session_busy`, `cost_cap`), which no daemon decision reads. The daemon reads
    `OMP_CONFIG_ROOT` where it finds Oh My Pi's directories, and `runtime.tmux.pane_env` and
    `runtime.kubernetes.pod.env` refuse it, as they refuse the other variables that place the
    session a resume reads.
