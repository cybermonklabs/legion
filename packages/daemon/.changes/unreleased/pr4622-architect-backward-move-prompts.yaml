kind: Fixed
custom:
  Issue: pr4622
body: |-
  The architect's prompt no longer says that its move back from `accepting` counts a review
  round: `review_round_cap` counts only a review that requests changes. Where the issue stands in
  `reviewing` (a red required check, a `behind` or `blocked` head, a path filter that skips the
  change), the prompt has the architect tell the reviewer to make the `request_backward_move`, since
  the daemon refuses the architect's own move outside `accepting`. Under an ancestor in
  `retro` or `merging`, it no longer tells the architect to move the ancestor back, which the
  daemon refuses it. The reviewer's prompt no longer says that nothing holds the head that merges to
  the head it approved: a forward merge past its review is the exception.
