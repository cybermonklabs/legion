kind: Fixed
body: |-
    Every controller notice (an escalated hold, a tree architect's own failed claim, `tick`,
    `slot-free`, `tree-stalled` and the rest) now goes to the controller's role topic,
    `notifications.role.legion-<project>-controller`, once the registered controller session holds
    that role live. Until then the notice waits in the outbox, with no time bound, also while another
    session holds the role. Before, the daemon published it to
    `notifications.legion.<project>.controller`, and a controller session that was
    away long enough for its role claim to be freed never got the notices published while it was
    away.
time: 2026-11-24T13:23:18Z
