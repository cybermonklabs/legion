kind: Added
body: |-
    The worker image carries the Google Cloud SDK 594.0.0 (`gcloud` and `bq` at `/usr/local/bin`,
    the SDK at `/opt/google-cloud-sdk`) and azure-cli 2.93.0 (`az` at `/usr/local/bin`, a
    self-contained tree at `/opt/azure-cli`), both held to Debian's root bundle by defaults a role
    can override. It also carries trixie's `busybox` and `tmux`, the pinned `mise` at
    `/usr/local/bin/mise`, `USER=legion`, and the 56 Debian packages Playwright 1.64.1 names for
    WebKit on Debian 13. A build stage of its own launches the locked Playwright's WebKit, so a
    Playwright bump whose WebKit needs a library the image lacks fails the image build, and nothing
    that download writes reaches the image. `legion probe-image` holds
    `gcloud`, `bq`, `az`, `mise` and `socat` to the compromised emSign and AAA chains where each is
    on `PATH`, and reports it `absent` where it is not. It also holds GNU `wget`, `git`, `go`,
    `kubectl` and `redis-cli` to the chains on every image. Of the pod's variables, every probed
    client keeps only those the image declares, `PATH` among them, and the pod's trust and
    verification settings, such as `SSL_CERT_FILE` and `NODE_TLS_REJECT_UNAUTHORIZED`, so a pod env
    that sets one to make the roles accept a compromised chain fails the probe; it runs with a home
    of its own in the probe's state directory, and no trust setting holds a credential, so no
    credential variable or file of the pod's reaches a test site. Because the image sets `USER`,
    `runtime.kubernetes.pod.env` may no longer set it: `legion start`, `--check-config` and the
    daemon's boot refuse a configuration that does, whatever digest it pins. The daemon's image
    probe pod now reserves 500m CPU (was 250m), because the image's longer TLS probe needs it.
