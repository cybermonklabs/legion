kind: Added
body: |-
  A tmux daemon can keep its Oh My Pi panes' conversations in Postgres
  (`runtime.tmux.session_store: postgres`, with `runtime.tmux.session_dsn_file`), as a Kubernetes
  deployment can. The boot gate runs the session-storage probe and reads the session table, and a
  resume of a recorded session file refuses one the table lacks rather than start a fresh agent. A
  claim that records only the session's id resumes the table's newest row of it, and forgets the
  session once where the table holds none. The daemon reads that database in transactions that
  set `restrict_nonsystem_relation_kind`, as it reads a pod's session database, so its server
  must be PostgreSQL 16.4, 15.8, 14.13, 13.16 or 12.20 or later in its major, or any 17 or later;
  on an older server the boot gate refuses to start.
