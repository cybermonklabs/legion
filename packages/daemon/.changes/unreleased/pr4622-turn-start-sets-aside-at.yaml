kind: Changed
custom:
  Issue: pr4622
body: |-
  The role prompts' turn-start step now runs `jj new @-`, never `jj new`, and takes back
  only the role's own edits from the change it sets aside, telling the architect the rest; a change
  left holding another role's path gets an `aside/<change id>` bookmark, so the pod update round's
  read of unpushed work counts it.
  A planner whose issue moved back from implementing reads the change ids of `@` and `@-`, starts
  on the remote tip with `jj new legion/<KEY>@origin` and tells the architect both ids, instead.
