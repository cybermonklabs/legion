kind: Fixed
body: |-
  A hook prompt whose role no live session holds waits for one: the Envoy listener now refuses to
  keep a publish that names no source session, as the daemon's prompts name none, and the prompt's
  outbox row retries on its backoff until a session holds the role, for up to one hour after the
  hook fired. A released role's woken session, which claims its role a few attempts after the
  daemon's wake, gets the prompt once. The row ends at once when the role's claim failed or was
  retired. A prompt that ends undelivered is named in a Dispatch message on the issue: the hook,
  the move back it was written for, why it ended, its words, and that no session received them.
  The message is held for one hour from the first such end, and every prompt to the same role on
  the same issue that ends in that hour is added to it, so a role that is not coming gets one
  message an hour; the held message is the outbox row, so a restart inside the hour adds to it.
  Ship this daemon to every deployment that publishes to a listener before that listener runs the
  release that refuses such a keep: an earlier daemon ends the row at the listener's 404 and the
  prompt is lost (`scripts/e2e/hook-prompt-two-builds.sh`).
