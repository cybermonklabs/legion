kind: Fixed
body: |-
  The sandbox runtime's stop of a role whose pod is still in, or failed in, its init container
  (`workspace-init`), with no launcher of it connected, answers at once: no launcher of such a pod
  has run, so no role process runs there to stop. Before, the stop waited the boot timeout and the
  termination grace for a launcher that could not connect, about ten minutes, and then failed "did
  not connect", while the claim and the issue's suspension, which deletes the Sandbox, waited behind
  it. A stop of a launcher that is connected still waits for its answer, as does one of a pod past
  its init container whose launcher is reconnecting.
