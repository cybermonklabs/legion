kind: Changed
body: |-
    A CI settlement of a pull request's head whose only change since the one standing for that head
    is runs of checks concluded skipped, each new to the head or a newer run of its name, beside
    newer runs of checks that keep their word, now tells no role and wakes no released pod. Every
    review, each reply to a review thread among them, starts a Large PR lanes run whose jobs skip,
    and every title or body edit runs pr-title again beside the skipped run of the Large PR label
    job, so each sent the architect, the phase holder and the implementer one more "CI settled"
    message, or woke the released phase worker with it; the settlement is still recorded, and the
    next one told names those checks with the rest. A settlement whose only change is newer runs
    that keep their word, with no skipped run among them, wakes as before.
