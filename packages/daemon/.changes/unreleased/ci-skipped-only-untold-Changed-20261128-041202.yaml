kind: Changed
body: |-
    A CI settlement of a pull request's head whose only change since the one last told for that head
    is check runs new to the head and concluded skipped now tells no role and wakes no released pod.
    Every review starts a Large PR lanes run whose jobs skip, so each review sent the architect, the
    phase holder and the implementer one more "CI settled" message, or woke the released phase
    worker with it; the settlement is still recorded, and the next one told names those checks with
    the rest.
