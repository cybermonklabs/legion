kind: Added
body: |-
  The daemon records each phase of an issue as a step on its Dispatch issue: each start and each
  end of a run writes one step record, with its task, step, role, type, agent, model, attempt,
  start, end and result (`passed`, `failed` or `stopped`), through the outbox on a lane of its own
  (kind `step_record`). A GitHub merge now closes an issue that is held from merging, as it closes
  one in merging. Three store migrations add the kind and the table `step_starts`; the way back is
  "Rolling back the release that records each step" in `docs/kubernetes.md`.
