kind: Changed
body: |-
  A started issue that waits on another issue before its review gives its admission slot back: a Dispatch `blocked_by` link to an issue that is not `done`, of this project or of another, or an open child that holds the issue's own first phase. The issue stands in the waiting line as `waiting_on_issue` among the issues whose work came back, and it takes the next free slot by itself when the wait ends. Nothing of its work stops: no claim is suspended, no session ends, no phase moves and no Dispatch status is written, but the start of its next phase up to the review waits for the slot. Three roots keep their slot through such a wait: a root in `awaiting_person`, a root at `admitted` whose design gate has never opened, and a root that arrived from another tree carrying its row. The daemon sees a blocker in another project close at its periodic turn, which reads such blockers again. Such an issue never makes its own tree read as stopped, so no `tree-stalled` notice names that tree for it, even where the project's line cannot move; where the issue it waits on is in this project and has stopped, the notice names that issue's tree. A queued root past its review, which takes no slot, keeps the line moving under a full cap, so its project is not told a stall on the pass that opens its tree.
