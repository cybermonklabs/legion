kind: Fixed
body: 'A write whose commit''s reply is lost, when the daemon stops, a request is cut or a connection breaks as it commits, keeps the work its commit runs: log lines, admission''s held roots, the wakes of outbox rows, the idle and unowned releases'' lines and wakes, a project pause''s and resume''s steps, and the revocation of a replaced controller''s grants. Every transaction of the daemon commits through one boundary, which asks the store whether a transaction whose reply was lost committed and runs that work only if it did; every standalone read that takes no lock runs in a read-only transaction. While the store cannot answer, the write fails as one whose outcome is unknown, a warning names the transaction, and the work runs once the store says the transaction committed. A pod''s launcher marks its workspace in use before its first role starts and refuses that start when it cannot write the mark, so a workspace bundle is never restored over a workspace where a role has started.'
