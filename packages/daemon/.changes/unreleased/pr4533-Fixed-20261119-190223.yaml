kind: Fixed
body: 'A write whose commit''s reply is lost, when the daemon stops, a request is cut or a connection breaks as it commits, keeps the work its commit runs: log lines, admission''s held roots, the wakes of outbox rows, the idle and unowned releases'' lines and wakes, a project pause''s and resume''s steps, and the revocation of a replaced controller''s grants. Every transaction of the daemon commits through one boundary, which asks the store whether a transaction whose reply was lost committed and runs that work only if it did; every standalone read that takes no lock runs in a read-only transaction. While the store cannot answer, the write fails as one whose outcome is unknown, a warning names the transaction, and the work runs once the store says the transaction committed. The daemon now needs PostgreSQL 13 or later, for pg_current_xact_id_if_assigned, pg_xact_status and xid8. Each write that ran in a transaction takes one round trip more, a single statement that ran on the pool three more, and a standalone read two more. Measured on PostgreSQL 18 with a 1 ms round trip, the median latency of a claim write went from 1.4 ms to 5.4 to 5.5 ms (+4.1 ms) and of a hot read from 1.4 ms to 4.1 to 4.2 ms (+2.7 to +2.8 ms); on loopback, a write went from 0.12 ms to 0.49 to 0.51 ms and a read from 0.12 ms to 0.32 to 0.37 ms.'
