kind: Fixed
body: |-
  Three more of the daemon's clients follow no redirect, so a 3xx from whatever answers in the
  server's place takes no credential to the host its `Location` names; each reads the 3xx as a
  refusal by its status and prints no `Location`. `legion claude-bridge`'s turn report, whose body
  carries the launch's boot token, which a 307 or 308 sent again. The launcher's pod-local metadata
  endpoint's exchange at the security token service, where a 302 or 307 to another host got the
  pod's projected token: the endpoint answers its caller `500 token exchange failed`. The session
  proxy's calls to Google: the Cloud SQL Admin API and IAM Credentials clients, whose bearer
  x/oauth2 sets on every request, and the pod's credential-file token read and the writer token's
  exchange, whose form a 307 sent again.
