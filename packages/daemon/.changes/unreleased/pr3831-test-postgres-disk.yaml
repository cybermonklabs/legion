kind: Added
custom:
  Issue: pr3831
body: |-
  A new setting, `runtime.kubernetes.test_postgres_disk`, takes a size and is off when absent; the
  loader refuses it without `test_postgres: true`. It also refuses a size under 4Gi, naming the
  size: a smaller disk would never show the 2 GiB free under which the launcher resets the test
  database, so the launcher would reset it at every check. With it, every issue pod that runs the
  test database keeps the cluster on a disk of its own of that size, a generic ephemeral volume
  on the issue disk's storage class, in place of the `testpg` `emptyDir`. The pod's
  ephemeral-storage limit does not count that disk, so a test database that fills it no longer
  gets the pod evicted, and the note after a disk-limit eviction of such a pod names no test
  database. A running pod keeps its `emptyDir` until it is replaced; setting the key opens no
  update round.

  On that disk the launcher reads the free bytes every 15 seconds and, under 2 GiB free, resets
  the cluster, whether the server answers or not. Under the lock every start takes, the reset
  reads the 20 largest databases the cluster held, each with its owner and size, and the count
  and total size of any more, where the server answers and within 60 seconds, past which the list
  fails and the reset goes on; it then stops the server, moves the cluster aside in one rename,
  starts a new empty cluster on the same DSN and deletes the old one. A reset cut after the rename is finished by the next check. Every database in the cluster
  is lost and every session on it ends, but no role's turn ends. The reset writes one line,
  `legion-testpg: reset of the cluster in …`, with the disk's use and those databases, ending
  `, and <n> more, <total size>` where the cluster held more, to the `roles` container's log and
  to the server's log; the bound keeps it one line under the launcher's 64 KiB line.

  The key lands only with a `daemonImage` and a worker image that both carry this release: an
  earlier daemon refuses the key at boot, and an earlier image's launcher refuses the new
  `--test-postgres-disk` flag and has no reset. A change that moves either pin back below this
  release takes the key out first. This change adds daemon API contract entry `20261125163621`
  (`test-postgres-disk`) for the new flag, so the daemon and the worker image move together. A pod
  whose key is off runs as before.
