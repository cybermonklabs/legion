kind: Changed
body: |-
    One GitHub App serves every role, and the daemon writes one check, `legion-verdict`, from each
    head's verdicts, so that check (not an approving review) decides a merge.

    - `github_apps.implement` is the one App. `github_apps.review` still loads, with a warning that
      it changes nothing; remove it from `legion.yaml`. Each role's token holds that role's own
      write set, which follows the type of the role's step; a claim whose role has no set does not
      start, and its start fails naming the role. Only the daemon's writer of `legion-verdict`
      mints a token that writes checks and statuses, so the App needs Checks and Commit statuses at
      write.
    - `verdict_repositories` (`repository`, `ci_reviewer`, `side_reviews`) names the repositories
      whose `legion-verdict` this daemon writes. On a head of an issue of its own project
      (`legion/<KEY>`, or a task branch `legion/<KEY>.<slug>`) the verdict follows the checks, the
      steps of the task's plan and the change's commits: `success` when each check reads yes at that
      head whatever steps the plan names, each testing step passed and each review step approved
      that head, and each commit of the change has a reader, an agent of such a step whose claim
      made none of it, read from GitHub's compare of the base and the head; `failure` on a check
      that fails, a review step's `changes`, or, once every check and step has passed, a commit with
      no reader, which the run's title names and its summary lists, or a change GitHub answers it
      cannot serve (`404`, `422`). Where GitHub gives no answer to that compare (a 5xx, a timeout, a
      rate limit), nothing is decided yet and the daemon's run stands; after 3 sweeps in a row with
      no answer the head and its merge group get `failure`, with a summary that says GitHub gave no
      answer, until GitHub's next answer decides the head again, and the daemon logs one WARN naming
      the head. On another head it is the named CI reviewer's or a side
      reviewer's review, or a person's approval. A person's request for changes refuses either. The
      daemon writes over another writer's run or status of
      that name, sweeps the repositories at boot and every 10 minutes, and writes on each merge
      group's commit. In token mode it writes nothing and logs why once.
    - Each review step gives its own verdict, and the daemon takes it only from that step's agent.
      The reviewer completes with `approve` or `changes` and the `commit` it reviewed, and a
      reviewer's completion with no verdict is refused. The owner's acceptance is a review step
      too: `sign_off` is its `approve` and a move back out of `accepting` its `changes`, and each
      names the `commit` it accepts or sends back, which must be the pull request's current head.
      After a push past review, `POST /legion/v1/review-verdict` takes the new verdict of the agent
      of each review step that has passed, and of no step that runs now: the reviewer's, and the
      owner's once its acceptance has passed, which names its `issue`. A testing
      step's completion carries no verdict, and any other role's verdict is refused. A review by
      the App, and a person's approval, decide no round.
    - A reviewer's approval ends the review round on a head GitHub reports `blocked` once every
      check run GitHub reported on that head has concluded. The round still waits while the state
      is unread or `unknown` or a check runs; `behind`, `draft` and an unconfirmed conflict stay
      stuck.
    - `POST /legion/v1/pull-request-reviewer` and `/pull-request-verdict` let the controller name a
      side reviewer for a pull request no Legion tree opened, and take only that reviewer's verdict.
    - The reviewer works in a git clone of its own, and its git runs no program a repository's
      configuration names. A reviewer starts only in a pod on the configured image; an older pod is
      replaced first. The daemon API contract changes with it.
    - One migration adds tables and indexes only; a build from before this change still boots on
      the database and reads every row.
