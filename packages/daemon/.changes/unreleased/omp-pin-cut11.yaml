kind: Changed
body: |-
    The worker image carries Oh My Pi `18.18.6-sami.20261125-001804` of cybermonklabs/oh-my-pi,
    which `.omp-pin` names, in place of `18.18.6-sami.20261123-024918`. It carries the fork's
    prompt-cache fix (fork pull request #27): a session whose model does not change keeps the
    previous request's cached prefix, and a cut of the context breaks that prefix only where the
    cut saves more than the cache write it causes. Do not set `task.disabledAgents` in the pods'
    Oh My Pi settings overlay on this build: the cache fix does not yet cover a disabled agent,
    and a subagent revived from an idle session keeps the prompt of a setting that was set back.
    The build writes shell frames version 37: a frame stored by `18.18.6-sami.20261123-024918`
    (version 31) is refused, not restored. Its SQL session store makes and checks the same
    tables, indexes and grants as `18.18.6-sami.20261123-024918`, so a deployment already on that
    pin needs no owner run before this one.
time: 2026-11-25T02:18:50Z
custom:
    Issue: omp-pin-cut11
