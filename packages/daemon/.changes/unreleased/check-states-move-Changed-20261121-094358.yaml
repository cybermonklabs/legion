kind: Changed
body: |-
    Daemon API contract 206: Dispatch's check states at the tested head decide the testing phase, and
    a phase completion carries no verdict. The daemon holds each `check.state_changed` event of an
    issue it records (the head's set of checks, the check's state and the event's serial) in the
    event's own transaction. A tester completes naming its `test` record and no verdict; the move
    waits until the daemon holds every state event of the issue through the record's
    `check_states_serial`. At the head the record names, it then waits while a check of the head's
    set has no state, or no result while its CI run goes on, whatever the other checks read; once
    every check holds a state it ends at, the move sends the issue to `reviewing` when every check
    reads yes there, whatever roles its results came from, and otherwise back to `implementing`
    with a task naming each check that does not pass with its state and reason, a state Dispatch
    could not read (`read_failed`) among them. A wait at the completion tells the architect once,
    in a `phase-finished` notice whose `reason` names what the move waits for; a move back names
    those checks in its notice's `reason`.
    A phase completion naming a verdict from a plugin at contract 206 or later is refused `400
    VERDICT_NOT_TAKEN`; a tester's plugin below 206 still sends one, which the daemon ignores.
    The refusals `TESTER_VERDICT_REQUIRED` and `VERDICT_ROLE_FORBIDDEN` are gone, the reviewer's
    task no longer names `Tester's verdict:`, and a `phase-finished` notice no longer carries
    `verdict`. Migration `20261121074614_phase_verdict_gone` keeps `phases.verdict`, which a daemon
    of the release before reads and writes during the roll or after a rollback, and gives it the
    default `''`, since this release writes nothing to it (a later release drops it); it adds
    the nullable `phases.states_serial` at 0 and strips `verdict` from each queued notice; its header holds the
    way back. Deploy envoy-dispatch before the daemon. The merge that closes an issue deletes its
    check states.
