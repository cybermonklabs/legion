kind: Fixed
body: |-
    A `nats_urls` entry the loader refuses is named by its position alone (`nats_urls entry 2 must
    be a valid URL`), never by any of its text. A user name or password holding an unescaped `/`,
    `?`, `#` or space ends the URL's host part early, so the refusal quoted the credential whole
    and nothing that strips a URL's user name and password found it; a refused entry's query,
    where a person can put a token, printed too. An entry that is empty or no string is refused by
    its position as well (`nats_urls entry 2 must be a non-empty string`), where the refusal named
    no entry. Seven entries and lists that used to load are now refused:

    - one holding a comma, which the NATS client reads as the end of a server URL. Such an entry
      was a list of servers in one entry, which loaded and connected to each, or a credential
      holding a comma, whose pieces the client read as servers. List each server as its own
      `nats_urls` entry, and write a comma in a credential as `%2C`.
    - one with an `@` after its host, which is how a token holding a `/` written as the URL's user
      parses: it loaded with the token's head as the host. Write such a credential percent-encoded.
    - a websocket entry whose path or host stops parsing once the NATS client's handshake decodes
      it, which the daemon's connect then refused. Write a `%` in its path as `%2525`.
    - an unquoted item of a `[...]` flow list, plain or tagged `!!str`, that carries a user name
      or password: YAML splits such an item at every comma, so a credential holding a comma
      (`,nats://` among them) loaded as two entries, and the daemon dialled the credential's head
      as a host and printed it. Refused as `nats_urls entry <n> carries a user name or password in
      an unquoted [...] list item; quote it, or write the list as a block list`. Quote the item,
      or write a block list.
    - an entry after the first that carries a user name or password and names none of the schemes
      `nats`, `tls`, `ws` and `wss`, as a person may write one. A comma in a credential no longer
      reaches this rule: the rule above refuses every list such a comma splits, and a comma in a
      quoted or block item is an entry that holds it, refused as the first rule says. Refused as
      `nats_urls entry <n> cannot be read: it carries a user name or password and names none of
      the schemes nats, tls, ws and wss, …`. Name the entry's scheme.
    - a list that mixes websocket (`ws`, `wss`) and other (`nats`, `tls`) schemes, which the NATS
      client refused at boot after the loader had accepted it. Refused as `nats_urls entry <n>
      cannot be read: the list mixes websocket (ws, wss) and other (nats, tls) schemes, …`. List
      servers of one kind.
    - an entry whose host and port are not written as an address the NATS client dials: a port
      past 65535 or of 0, an authority of three colons, or an IPv6 address written with a port and
      no brackets. Each of these loaded and failed at boot with the dial's error, but for one form:
      an IPv6 address with a zone (`fe80::1%25eth0`) written with a port and no brackets, which the
      NATS client brackets and dials. It is refused all the same, so the operator writes it in
      brackets. Refused, without a lookup or a dial, as `nats_urls entry <n> cannot be read: its
      host and port are no address the NATS client can dial; …`. Write an IPv6 host in brackets
      (`nats://[::1]:4222`), and a port from 1 to 65535 or none.

    The daemon's NATS connection refuses no list the loader loads. It names a server by its
    position and a failure by its class, never by any part of the server's URL or the error's
    text, which named the host and port the dial failed at: a failed connect
    (`name resolution failed`, `connection refused`, `timed out`, `TLS failed`, a TLS alert's
    words, the NATS client's own fixed words, a server's refusal among them, or `a protocol error
    from the server` for an error the client formats from what the server sent, which quoted the
    server's bytes), and the `NATS connection lost`, `NATS connection closed`, `NATS has not
    reconnected`, `NATS reported an asynchronous error` and `NATS refused the daemon a permission`
    lines and the boot error that names the connection's last error print the class (the
    permission's subject still prints, from the server's refusal); `NATS connection restored` names
    the server as `server="1 of 2"`, where it printed the URL's scheme, host, port and path. The
    refusal of a loopback or unspecified host under `runtime: kubernetes` names the URL by its
    scheme and host alone.

    A `legion.yaml`, a controller configuration or a pod file whose YAML does not parse is refused
    naming the line the YAML parser names (`parse <file>: the YAML does not parse at line 3`),
    never the parser's message, which can quote the file's text: in an unquoted `[...]` item, a
    credential holding a comma and then a `*` read as an alias, and the refusal printed the rest of
    it as the name of an unknown anchor.

    A secret file `legion` cannot read (`nats_nkey_seed_file`, `nats_daemon_nkey_seed_file`, their
    `NATS_NKEY_SEED_FILE` and `NATS_DAEMON_NKEY_SEED_FILE` variables, `operator_token_file`,
    `--operator-token-file`, `envoy_token_file`, `dispatch_token_file`, a `provider_keys` file and
    the provisioning and repository cache token files) is named by its setting and why alone
    (`nats_nkey_seed_file names a file that could not be read: it does not exist`), never by its
    path or the error's own text, which named the path again. A seed or
    a token pasted where its file's path goes printed whole, twice. A file that was opened is still
    named by its path.

    A `provider_keys` variable must now be upper case (upper-case letters, digits and underscores),
    as every provider's variable is: one with a lowercase letter used to load, and is refused naming
    its entry by position (`provider_keys entry 2: its key …`), as a variable that is no variable
    name is; a value that is no secretsd key's name is refused naming the variable it is for, never
    the value. Every boot error and log line about an entry's secretsd key names the entry by its
    variable alone (`provider_keys.GEMINI_API_KEY: secrets get [the key name] --value failed …`),
    with `[the key name]` where the command quoted it, and the command's stderr is dropped, its
    length printed instead, when it still holds ten characters in a row of the name in any case.
    Under `runtime: kubernetes` the image probe's refusal of a providers Secret it cannot mount
    names its settings (`provider_keys.ANTHROPIC_API_KEY`, `runtime.kubernetes.session_dsn_secret`)
    and the missing key by the setting that names it, never a key of the Secret or the kubelet's
    message. A provider's key pasted where its name goes printed whole in each.
