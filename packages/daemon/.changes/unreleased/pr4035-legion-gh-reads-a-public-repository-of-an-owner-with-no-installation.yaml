kind: Changed
body: |-
  `legion gh` runs a read of a repository whose owner has no installation of the role's App, for
  example a fork's upstream, with the token of `GH_CONFIG_DIR`, the directory a command that names
  no owner runs with. Before, it refused the read. This applies when `legion gh` reads the call as
  a read (one of its read commands typed by its full name with each option's value as its own
  word, or a `gh api` GET with no field), every owner it names has no gh directory, no repository
  it names is one a configured rename moves, and it reads no github.com remote of the working
  directory. `gh api graphql` counts as a read only when its query is given with `-f query=…`,
  holds the words `mutation` and `subscription` nowhere, in any case, and the call uses only `-f`, `-F` (with no value
  read from a file), `-H`, `-q`, `-t`, `--paginate` and `--slurp`. A write, a GraphQL call in any
  other form, a command that also names an owner the bundle serves, and a command whose working
  directory's remotes name any github.com repository for it are refused as before, with the same
  text. The token reads only public data and its own installation's repositories.
