kind: Fixed
body: |-
    After a kill, the launcher's memory guard measures each process's growth since that kill from
    its size as of the kill: the lowest of its reads of the program it runs, from its last read
    before the kill's reading to the read the kill was decided on; for a process it first read after
    the kill, that first read; and 0 for a process every read of which before the kill was a fork's
    read where it is no fork now. A fork's read is one where the process runs its parent's
    executable with its parent's arguments, and at the kill's reading each of its reads is a fork's
    read where any of them is one, its parent read there before or after it; the process stays a
    fork, its parent gone or not, until its executable or arguments change. An argument rewrite
    (setproctitle, process.title) is not a new program: a process that was no fork keeps its size as
    of the kill whatever its arguments become. In the order's tier of growth since the stay's first
    kill, a process first read after that kill counts from 0 unless that first read is a fork's. A
    grower that steps between a reading and the guard's reads at it, whose read at the kill failed,
    that runs its own program only after the kill's reading, or that the guard first read after the
    stay's first kill, now counts as grown, so the guard ends it rather than waiting or ending a
    larger process that never grew.
