kind: Changed
body: |-
  Every role topic the daemon writes names its project, `notifications.role.<PROJECT>.<role
  token>`: an architect's notice, a role message (a head's settled checks, the memory guard's
  note), a hook's prompt, an update round's ask, a merge-queue removal's and a merge forward's
  message, the reviewer's topic a review-stuck notice names, and the role topics the addressing
  line of a launch tells each agent. The project is the one the role token names (its project
  token in upper case, or `_` when that is no project key), the project the listener keys the
  role's claim by, whatever the deployment's Dispatch project is. A listener delivers either form
  to the same holder only from the release that reads both forms of a name on, so every listener
  this daemon publishes through must run that release first. The daemon reads a report of a
  failed forward on either form, the new one under the project its role token names.
