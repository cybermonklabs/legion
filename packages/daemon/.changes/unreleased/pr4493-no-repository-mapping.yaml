kind: Changed
custom:
  Issue: pr4493
body: |-
  The daemon reads no repository mapping from Dispatch. Deploy this release, or a later one, before you deploy a Dispatch that has no mapping route (`/api/v1/settings/repo-projects`).
  - The daemon takes the repository of each issue from Dispatch's resolution of that issue: the issue's own repository, else its nearest ancestor's, else the project's default repository. Set a project's default repository in Dispatch.
  - The boot proves the key of each role App with the App's installations, and stops with a refusal that names the App when GitHub refuses that read. An App that is installed on no account boots, and one warning names it. The key proof under the App's JWT mints no token for an owner. Every other step of the boot that reads GitHub or writes a cache's credential mints the token that step needs, as before, and a project with no repository boots and serves its state. A boot of a project that has no live record logs one line that says the daemon serves no repository until an issue names one.
  - After the API serves, the daemon's background loop prepares each repository that its records name, beside the boot. It reads a repository again, from 30 s to 10 min, while GitHub's last answer for it is bad, and `legion state` shows each answer.
  - An operator's claim on an issue that Legion does not record works the repository that Dispatch resolves for that issue. An issue that resolves to no repository refuses that launch alone, and the daemon stays up.
  - The `repositories` block of `legion state` is `{live, caches, withoutWebhookApp}` at daemon API contract 182: one `live` entry for each repository that a live record names. `withoutWebhookApp` keeps its old shape, `{repo, reason}` for each live repository that Dispatch's webhook App is not known to be installed on, and it is the only place the block reports the webhook App. So the webhook App lines of a `legion state` from an older release stay true against this daemon. A pod whose plugin is below 182 gets the older block, written from the same entries. A caller that the daemon cannot place in a pod, such as the operator's `legion state`, `legion controller start` or a tmux pane, gets the new block.
  - A one-time pass writes the `to` of each `repository_renames` pair over its `from` in the stored records, at boot and when an issue's pod ends. It writes a pair only once GitHub shows the transfer (both role Apps installed on the `to` and neither on the `from`), and it writes the `to` as GitHub spells it; until then it leaves the pair and logs why. It reads GitHub for a pair only while a stored row still names the pair's `from`: then it reads both role Apps' installations on each of the pair's names that the daemon holds no answer for (at boot, both) and, where the daemon holds no spelling of the `to`, GitHub's spelling of it. Once no row names a pair's `from`, the pass reads nothing of GitHub for that pair. It does not change an issue that has a live pod until that pod ends, and it logs each table with the rows it wrote, the rows that failed and the rows still on each old name.
  - A repository cache that no live record names is marked `legion.dev/cache-unused-at`. A cache that has the old mark `legion.dev/cache-unmapped-at` keeps the time of its first mark, the earlier of its marks that is a time. When that time is less than one retention ago, the first sweep after the upgrade writes it under the new mark and removes the old mark, so the cache retires one retention after its first mark. When it is one retention ago or more, that sweep retires the cache. When none of its marks is a time, that sweep marks the cache with the sweep's time, removes the old mark and logs a warning that names the cache and each value, so the cache is kept one retention. A cache that a live record names loses the old mark at that sweep. The sweep logs each cache whose old mark it removes, with its repository, the old value and what the sweep did.
  - No boot warning names `commit_issue_trailer_repos` or a rename.
  - The controller's GitHub credential, when the review App is installed on no account, now says so: `the review App is installed on no account, so the controller has no GitHub owner`. Its code stays `GITHUB_OWNER_UNCONFIGURED`. A role whose GitHub App is installed on no owner, such as that project's controller, is told in its addressing that it has no GitHub owner: `your role's GitHub App is installed on no owner, so you have no GitHub owner and its token reaches no repository.`
