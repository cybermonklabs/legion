kind: Changed
custom:
  Issue: pr4493
body: |-
  The daemon reads no repository mapping from Dispatch. Deploy this release, or a later one, before you deploy a Dispatch that has no mapping route (`/api/v1/settings/repo-projects`).
  - The daemon takes the repository of each issue from Dispatch's resolution of that issue: the issue's own repository, else its nearest ancestor's, else the project's default repository. Set a project's default repository in Dispatch.
  - The boot proves the key of each role App with the App's installations, and stops with a refusal that names the App when GitHub refuses that read. An App that is installed on no account boots, and one warning names it. The boot mints no owner token and reads GitHub for no repository, except to fill a record that has no repository columns, so a project with no repository boots and serves its state. A boot of a project that has no live record logs one line that says the daemon serves no repository until an issue names one.
  - After the API serves, the daemon prepares each repository that its records name. It reads a repository again, from 30 s to 10 min, while GitHub's last answer for it is bad, and `legion state` shows each answer.
  - An operator's claim on an issue that Legion does not record works the repository that Dispatch resolves for that issue. An issue that resolves to no repository refuses that launch alone, and the daemon stays up.
  - The `repositories` block of `legion state` is `{live, caches}` at daemon API contract 169: one `live` entry for each repository that a live record names. A pod whose plugin is below 169 gets the older block, written from the same entries. A caller that the daemon cannot place in a pod, such as the operator's `legion state`, `legion controller start` or a tmux pane, gets the new block.
  - A one-time pass writes the `to` of each `repository_renames` pair over its `from` in the stored records, at boot and when an issue's pod ends. It does not change an issue that has a live pod until that pod ends, and it logs each table with the rows it wrote, the rows that failed and the rows still on each old name.
  - A repository cache that no live record names is marked `legion.dev/cache-unused-at`. A cache that has the old mark `legion.dev/cache-unmapped-at` gets the new mark, and retires one retention later.
  - No boot warning names `commit_issue_trailer_repos` or a rename.
  - The controller's GitHub credential, when the review App is installed on no account, now says so: `the review App is installed on no account, so the controller has no GitHub owner`. Its code stays `GITHUB_OWNER_UNCONFIGURED`.
