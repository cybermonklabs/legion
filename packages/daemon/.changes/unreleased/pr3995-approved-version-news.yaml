kind: Added
custom:
  Issue: pr3995
body: |-
  When a person approves a new version of a gated document, each worker that holds an affected
  issue's phase gets a task. The task names the version its phase last took, the new version, the
  `##` sections, the text outside them by where it stands, and the requirements or checks that
  changed, and the `dispatch doc-read` command that prints the new version. A `spec` or `decisions`
  version affects every issue of the tree, and a `criteria` version the root alone. A version that
  changes only decision blocks, or holds the same text as the version before, sends no task,
  except at an opening, where the task says that nothing changed. The tree's root architect gets
  one task that names every issue of the tree and what it is told, an issue whose holder holds a
  task it has not taken yet named as waiting for that task, and an issue in `accepting` is told
  through the architect that owns it. The daemon
  moves no issue and stops no turn: a running worker gets the task between its turns, and news that
  a worker did not confirm goes with its next start or with the entry sweep. The daemon's own
  message of what a relaunch ended is not a task the worker has not taken: a task with news takes
  its place and starts with its sentence.

  A task with news alone never takes the place of a worker's phase task. While the worker is in a
  turn on its phase task, or owes that task again after a provider error, the news task waits, and
  a provider error in that turn still sends the phase task again. A task with news alone is not the
  phase's task either: a worker that holds only a news task is still given its phase task when it
  comes back ready, when its held phase is retried, and by the repair of a silent worker. A start
  queued for news alone is not counted as the phase's start, and it does not keep an idle pod from
  its release. A news task tells a member only while the claim it is held for holds that member's
  phase: an architect's task does not tell a member that the architect signed off while the task
  waited, and the member's next holder is told instead. If the gate closes and opens again while a
  holder's news task waits, that task carries the opening, so the holder gets the opening once.
  After a restart, a news task that the daemon never sent is sent, and a turn the agent started by
  itself does not count as that task's turn.

  The daemon reads the change set from Dispatch (`GET /api/v1/artifacts/{id}/changes`). Against a
  Dispatch without that route, the task names the two versions and says why it lists no change.
  Where the record does not know the version a worker last took, the daemon reads it from the
  document's review history. If Dispatch cannot answer that read, the task says that the version
  could not be read and why, never that no version was approved before, and the next reconcile
  reads the history again. While that reconcile is queued, no new task tells the old failure. A
  task that already tells it keeps it until the worker takes the task, and tells the version the
  history gives once that read is recorded. A merger's start waits until those reads are recorded,
  and so does the wake of a released merger for the message that its pull request left the merge
  queue. At the gate's opening, a holder owed news gets the opening as the first sentence of that
  task's news, and every other holder gets the opened message, which now says, where the record
  shows it, that nothing its issue holds changed. Migration `20261114082752_design_news` adds the
  tables `design_news_told`, `design_changes` and `design_history_unread`, and the column
  `pending_task_deliveries.design_news`.

  A rollback to the release before this one needs no schema restore, but it needs three statements
  first, because that release refuses an outbox payload member it does not know. Stop this
  release's daemon, run the three statements in the comment of `20261114082752_design_news.up.sql`,
  and then start the release before it. The first deletes each queued start that carries news
  alone. The second takes `holds` out of each queued design-gates publish. The third takes the news
  off each task delivery that is still pending. The news stays owed in `design_news_told`, so this
  release sends it again after the roll forward. `docs/kubernetes.md` gives the statements and why
  each is needed, in "Rolling back the release that tells a holder of an approved new version".
