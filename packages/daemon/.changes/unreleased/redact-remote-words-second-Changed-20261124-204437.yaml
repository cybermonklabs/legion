kind: Changed
body: |-
  The controller's start holds the secrets broker's address in the neutral address type that
  names its own setting (`configaddr.Address`, which replaces `cipheraddr.Address`), so its
  refusal and its lines on standard error name `BROKER_ENVOY_URL` and print no user name,
  password, query value or fragment the address carries. Nothing the daemon reads or does
  changes.
