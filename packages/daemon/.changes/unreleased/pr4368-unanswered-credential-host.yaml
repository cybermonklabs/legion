kind: Fixed
body: |-
  A request the daemon or the `legion` CLI sent to a URL that holds user information or an `@`
  past its host, which got no answer, no longer prints any part of a credential `url.Parse` read
  as the host or the port: the tail of a password holding an unencoded `@`, in its own form or the
  `xn--` form a tail that is not ASCII is dialled by, or a password's digits read as the port.
  This is the turn report's log line, the Dispatch client's error and the outbox's stored
  `last_error`, the publisher's errors, the controller's liveness lines, `legion state` and the
  operator commands. Such a URL is named with its authority as `[a URL with credentials]`, the
  resolver's and the dialer's words print its host and its port as that mark, and a host that is
  not ASCII or an address the dialer refused prints as
  `(the request failed; its error is not printed: ...)`.
