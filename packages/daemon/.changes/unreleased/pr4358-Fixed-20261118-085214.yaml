kind: Fixed
body: The merger's prompt dequeues a pull request with `dequeuePullRequest(input:{id:…})`. It named the input field `pullRequestId`, which GitHub's `DequeuePullRequestInput` does not accept, so the dequeue on a closed design gate was refused.
