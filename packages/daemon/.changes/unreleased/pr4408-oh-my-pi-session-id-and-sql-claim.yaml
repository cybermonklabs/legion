kind: Changed
body: |-
    The worker image carries Oh My Pi `18.18.6-sami.20261118-101239` of cybermonklabs/oh-my-pi in
    place of `18.18.6-sami.20261117-013345`. It adds `omp --session-id <uuid>`, which starts a new
    session under that id and refuses an id a stored session already holds, and SQL session
    storage now claims a session for one live process, so a second `omp` that opens the same
    SQL-stored session moves to a new one (or, under `OMP_SESSION_EXCLUSIVE=1`, exits naming why)
    instead of writing into it too. The image build now fails when the pinned `omp --help` does not
    list `--session-id`.
