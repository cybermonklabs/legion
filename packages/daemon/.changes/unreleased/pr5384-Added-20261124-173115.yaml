kind: Added
body: |-
    Daemon API contract 268: the project's admission cap moves while the daemon runs, with no pull
    request and no restart, from 1 up to `admission_ceiling` in `legion.yaml` (else
    `LEGION_ADMISSION_CEILING`, else `admission_cap`). `admission_cap` (else `LEGION_ADMISSION_CAP`)
    stays the cap the daemon starts under, and a clear returns to it. The controller sets the cap
    with `POST /legion/v1/project/admission-cap` and clears it with `.../clear`; the operator does
    the same with `legion project set-admission-cap --cap <n> --reason <text>` and
    `legion project clear-admission-cap --reason <text>`. A change is in force at its own admission
    pass, holds across a restart, and a lower cap stops nothing that runs. A cap below 1, a cap
    above the ceiling (naming the ceiling) and a change with no reason are each refused with a
    code of their own, and change nothing. Each change appends one row to
    `project_admission_cap_changes` (migration `20261124040825`) and one Info line to the log; a
    change that changes nothing appends no row. `GET /legion/v1/state` and `legion state` name the
    cap in force, `admission.ceiling`, the cap that stands (`admission.override`) and the newest 50
    changes (`admission.capChanges`, `[]` before the first). A caller below contract 268 is served
    the state without the three new keys. To raise the ceiling, edit `admission_ceiling` and restart
    the daemon; a cap set while the daemon runs keeps holding across the restart until a clear.
