kind: Changed
body: |-
  A P0 issue starts at once, outside the admission cap. An issue is P0 for admission when Dispatch
  resolves it to P0: its own priority, or the priority it takes from the nearest issue above it on
  its Dispatch parent chain that has one (`resolved_priority`). The daemon keeps that resolved
  priority beside the issue's own, from each issue event, the boot listing, each detail read and
  the issue an accepted status write answers. Where Dispatch sends no resolved priority, only an
  issue's own P0 makes it P0, and no Legion tree root ever does. The waiting line's bands read the
  resolved priority too, and a member's reason names the issue the priority comes from. The cap
  counts only the issues holding a slot that are not P0, so a P0 issue that would start but for the
  cap takes a slot at that admission pass. Every other hold stays: a root's `legion` label and
  `todo`, each `blocked_by` link, the design gate, an ancestor's hold, the tree's lifetime and a
  paused project. No pass takes a slot back from a holder: a holder that becomes P0 leaves the cap's
  count, and one that stops being P0 keeps its slot and counts against the cap from then on. Each
  P0 start is logged with the issue, the P0 holders, the other holders and the cap. An update that
  changes only the resolved priority, which Dispatch sends when an ancestor's priority or parent
  changes, does not count as work of the issue.

  What the first admission pass after the upgrade does. With an older Dispatch release, the first
  admission pass after the daemon upgrade treats only explicit P0 this way. With the
  resolved-priority Dispatch release, it treats both explicit and inherited P0 the same way. In each
  case it starts eligible P0 issues outside the regular cap and no longer counts those P0 holders
  against it. On the resolved-priority release, the boot listing gives each recorded issue its
  resolved priority with no edit of the issue.

  The P0 bound limits how many P0 issues may hold a slot at once. It has no value unless
  `legion.yaml` gives one in the new key `admission_p0_bound`. A person sets it to a number or to
  none, or clears the live value back to `legion.yaml`'s, while the daemon runs: with `legion
  project set-p0-bound --bound <n>` or `--none` and `clear-p0-bound`, or through the controller's
  `legion` tool (`set_p0_bound` and `clear_p0_bound`) on the person's cited word. The next
  admission pass uses it, with no restart. At the bound a P0 issue waits first in the line, and the
  pass logs the refusal with the bound. One migration adds the table of these changes and the
  issue's resolved priority. The daemon API gains the contract entry 20261125181047_p-0-bound:
  four routes, `POST /legion/v1/project/p0-bound` and `/clear` for the controller and the same under
  `/legion/v1/operator/project/` for the operator; the state gains `admission.p0Holders` and
  `admission.p0Bound` (the bound in force, `legion.yaml`'s and the live value with who set it and
  when) and each issue's `resolvedPriority` and `priorityFrom`, which a caller below the entry is
  not served; and `legion state` prints a `P0:` line.
