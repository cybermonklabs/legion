kind: Changed
body: |-
  A P0 issue starts at once, outside the admission cap. An issue is P0 when its own Dispatch
  priority is P0; a tree root's P0 makes none of its children P0. The cap counts only the issues
  holding a slot that are not P0, so a P0 issue that would start but for the cap takes a slot at
  that admission pass. Every other hold stays: a root's `legion` label and `todo`, each
  `blocked_by` link, the design gate, an ancestor's hold, the tree's lifetime and a paused
  project. No pass takes a slot back from a holder: a holder raised to P0 leaves the cap's count,
  and one lowered below P0 keeps its slot and counts against the cap from then on. Each P0 start
  is logged with the issue, the P0 holders, the other holders and the cap.

  The first admission pass after the deploy starts every P0 issue that waits only for a slot, and
  gives back to the line below P0 each cap slot that a P0 holder held.

  The P0 bound limits how many P0 issues may hold a slot at once. It has no value unless
  `legion.yaml` gives one in the new key `admission_p0_bound`. The operator (`legion project
  set-p0-bound --bound <n>` or `--none`, and `clear-p0-bound`) and the controller (the `legion`
  tool's `set_p0_bound` and `clear_p0_bound`) set it to a number or to none, or clear the live
  value back to `legion.yaml`'s, while the daemon runs; the next admission pass uses it, with no
  restart. At the bound a P0 issue waits first in the line, and the pass logs the refusal with the
  bound. One migration adds the table of these changes. Daemon API contract 282: four routes,
  `POST /legion/v1/project/p0-bound` and `/clear` for the controller and the same under
  `/legion/v1/operator/project/` for the operator; the state gains `admission.p0Holders` and
  `admission.p0Bound` (the bound in force, `legion.yaml`'s and the live value with who set it and
  when), which a caller below 282 is not served; and `legion state` prints a `P0:` line.
