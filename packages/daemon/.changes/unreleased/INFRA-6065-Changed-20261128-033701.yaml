kind: Changed
body: |-
  The design gate follows Dispatch's own verdict on whether a person's approval of a gated document stands, where Dispatch sends one (`digest_owed` on a version and on `GET /api/v1/artifacts/{id}`, and the `artifact.digest` event).
  An edit that keeps the approved requirements and checks then keeps the gate open, and a change to them closes it, so a gate can stand open with its approved version below its current version.
  While a new version owes Dispatch's digest, the daemon holds the work the gate holds, each member's first phase and each merger start, and tells nobody of a change; when the digest comes, the tree is told only where the standing differs from the one last told.
  A root waiting on a person at its gate is answered when that digest comes, not at the version, and an opening that the digest gives with no new approval is told as `design-approved` (or `carried-gate-opened` on a carried copy) with no actor.
  A re-admitted root's architect is told to request approval of the latest version only where the approval its gate held does not stand.
  Just before each first-phase start, each merger start and each held message that would wake a merger, the daemon reads the gated documents from Dispatch again: a start whose approval Dispatch does not show standing waits on its backoff and queues one gate seed of that step, and a read that fails holds the start on its backoff too.
  Each boot queues a gate seed for every registered gated step that reads closed in a tree in the workflow, so a verdict an earlier release dropped is read again.
  The daemon API contract entry 20261128003114 (hash-gate-verdict) states that a step reads `approved` with `approvedVersion` below `currentVersion` where Dispatch reports that approval current, and that a basis's `version` is the ancestor's latest version whose approval stands.
  Migration `20261127204213_design_gate_verdict` adds the verdict columns, `told_open`, `basis_root_version` and `carried` to `design_gates`, with every existing row in version mode, so each gate open before it stays open; its way back, in the migration's header and in docs/kubernetes.md ("Rolling back the release whose design gate follows Dispatch's approval verdict"), drops them with every daemon of the database stopped.
  Against a Dispatch that sends no digest field, the gate and its messages behave as before; the read of Dispatch before each start the gate holds, and the boot's gate seed of each closed step, then apply the rule that only an approval of the latest version stands.
