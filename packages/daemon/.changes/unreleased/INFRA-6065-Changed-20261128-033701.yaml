kind: Changed
body: |-
  The design gate follows Dispatch's own verdict on whether a person's approval of a gated document stands, where Dispatch sends one (`digest_owed` on a version and on `GET /api/v1/artifacts/{id}`, and the `artifact.digest` event).
  An edit that keeps the approved requirements and checks then keeps the gate open, and a change to them closes it, so a gate can stand open with its approved version below its current version.
  While a new version owes Dispatch's digest, the daemon holds the work the gate holds, each member's first phase and each merger start, and tells nobody of a change; when the digest comes, the tree is told only where the standing differs from the one last told.
  A root waiting on a person at its gate is answered when that digest comes, not at the version, and an opening that the digest gives with no new approval is told as `design-approved` (or `carried-gate-opened` on a carried copy) with no actor.
  A re-admitted root's architect is told to request approval of the latest version only where the approval its gate held does not stand.
  Just before each first-phase start, each merger start and each held message that would wake a merger, the daemon reads the gated documents from Dispatch again: a start whose approval Dispatch does not show standing waits on its backoff and queues one gate seed of that step, and a read that fails holds the start on its backoff too.
  Each boot queues a gate seed for every registered gated step that reads closed in a tree in the workflow, so a verdict the intake lost is read again.
  The daemon API contract entry 20261128003114 (hash-gate-verdict) states that a step reads `approved` with `approvedVersion` below `currentVersion` where Dispatch reports that approval current, and that a basis's `version` is the ancestor's latest version whose approval stands.
  Migration `20261127204213_design_gate_verdict` adds the verdict columns, `told_open`, `basis_root_version` and `carried` to `design_gates`, with every existing row in version mode, so each gate open before it stays open, and the table `design_gate_verdict_boots`, where each boot of this release with the workflow records itself with its `daemon_boot` row.
  A rollback to an earlier release runs the migration's way back first, for the project that rolls back, with that project's daemon stopped (docs/kubernetes.md, "Rolling back the release whose design gate follows Dispatch's approval verdict"): for that project's rows alone, on each row that owes its digest it ends each basis whose root version is below the latest version, as the version rule would have ended it, then puts the rows in version mode and clears the columns this release adds.
  The way back drops nothing, so the daemons of this release that serve other projects from the same database go on.
  The way back tells nobody, so after it the operator reads each gated tree's steps (`legion state`) and tells the merger of a tree whose step it closed.
  A boot of this release after an earlier release's boot, or after a boot of this release without the workflow, in the transaction that records the boot and before it applies any fact, returns its project's rows to version mode, ending no basis and telling nothing, and then queues the gate seed of every registered step of each tree in the workflow, so each row reads its verdict from Dispatch again and that verdict tells each change.
  A daemon with the workflow records its boot in that transaction, before its port, its image probe and its readiness checks, so `daemon.boots` in `legion state` now also counts a boot of it that one of those refused or that a stop ended before it served, and that boot's end is recorded as it returns.
  Against a Dispatch that sends no digest field, the gate and its messages behave as before; the read of Dispatch before each start the gate holds, and the boot's gate seed of each closed step, then apply the rule that only an approval of the latest version stands.
