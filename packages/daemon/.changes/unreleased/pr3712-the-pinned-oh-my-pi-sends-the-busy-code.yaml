kind: Changed
body: |-
  The worker image runs Oh My Pi v18.18.6-sami.20261127-055727 (`.omp-pin`), whose refusal of a
  prompt sent while the agent is busy carries `code: "session_busy"` on the refusal and on the
  prompt's result, as every fork release from v18.18.6-sami.20261118-035823 on does. The daemon
  sends a worker no prompt (the worker takes its task when its session is idle and reports each
  turn's outcome), so it reads neither that refusal nor that result, and no busy refusal is
  charged to a claim.
