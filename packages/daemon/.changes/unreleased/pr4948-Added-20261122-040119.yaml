kind: Added
body: '`register_plan` reads each need of a `plan_task` block, a reference to another task''s block or a task id, as the id of the task it names, once, and the daemon writes those ids into the plan node it sends to Dispatch: `needs` on each task of a `plan_record` row, `[]` for a task that needs none. `register_plan` refuses a need that names no task of the plan, each set of tasks that need each other, named once by one cycle of it, the shortest from its first task in id order (`task a needs itself: a needs b, b needs a.`), and two or more tasks that no task needs. The check of cycles takes time linear in the plan, and it stops when its request ends: `register_plan` then answers `503` and records nothing. A plan of more than one task, or with a need, is still refused, since this release runs one task for each issue. Deploy Dispatch first: a Dispatch of the release before drops `needs`, and that run''s plan then reads its needs as not recorded. A rollback to the release before runs the statement of docs/kubernetes.md, "Rolling back the release that records each task''s needs", with the project''s daemon stopped, which takes `needs` off that project''s queued `plan_record` rows.'
