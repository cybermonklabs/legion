kind: Added
body: '`register_plan` reads each need of a `plan_task` block, a reference to another task''s block or a task id, as the id of the task it names, once, and the daemon writes those ids into the plan node it sends to Dispatch: `needs` on each task of a `plan_record` row, `[]` for a task that needs none. `register_plan` refuses a need that names no task of the plan, each set of tasks that need each other, named once by one cycle of it, the shortest from its first task in id order (`task a needs itself: a needs b, b needs a.`), two or more tasks that no task needs, and a task id outside Dispatch''s form of a task id (lowercase letters, digits and hyphens, starting with a letter or a digit, at most 64 bytes), since Dispatch records no step of such a task. That form, its words and its 64 bytes stand once, in `packages/contracts` (`STEP_TASK_PATTERN`, `STEP_TASK_RULE_WORDS`, `STEP_TASK_MAX`), generated into Go: Dispatch''s step write and plan write read them, and the daemon reads them through `github.com/sjawhar/envoy/steprecord`, so neither side can drift from the other. A refused plan''s answer (`409 PLAN_REFUSED`) has a bound in bytes, whatever the plan holds: of each kind of cause it names the first `plan.MostReasons` (20) and counts the rest in one more reason, in its `error` and in its `reasons`; each reason quotes a word of the plan (a need, a role, a key, a step) to at most `plan.MostQuotedBytes` (128) bytes, marked as cut, and lists at most `plan.MostReasons` task ids, and a cycle''s chain its first needs, a count and the need that closes it. Each word a reason quotes is read whole through the rule that removes the credentials of a URL before it is cut, so no part of a user name, a password or a token written in a URL of the plan reaches the answer, in its `error` or in its `reasons`. Measured on three plans whose one 1 MiB attribute holds short words, each a cause, the answers took 2,890, 4,430 and 12,089 bytes, where a reason for each cause took 34, 44 and 66 MB. The read of the needs and the check of cycles each take time linear in the plan. Measured three times in one test pod, the read and both checks took 40 to 80 ms of CPU on a ring of 40,000 tasks, on 600 tasks each needing all the others (359,400 needs) and on 40,000 tasks each needing itself, and 110 to 140 ms on one task whose 350,000 words name no task. A plan of more than one task, or with a need, is still refused, since this release runs one task for each issue. Deploy Dispatch first: a Dispatch of the release before drops `needs`, and that run''s plan then reads its needs as not recorded. A rollback to the release before runs the statement of docs/kubernetes.md, "Rolling back the release that records each task''s needs", with the project''s daemon stopped, which takes `needs` off that project''s queued `plan_record` rows.'
