kind: Added
body: |-
  A repository cache's `GET /healthz` reports its volume's size and the bytes available to it
  (`volumeBytes`, `availableBytes`, or `volumeError` when the statfs fails), read at each request,
  and the time of its fetch's and its repack's last failure for lack of space since that step's
  last success (`fetchOutOfSpaceAt`, `repackOutOfSpaceAt`). A failure counts when git's output says
  `No space left on device` or `Out of diskspace`, or when the volume has less than 1 GiB available.
  The repack's failure is kept in `.legion-repack-out-of-space` on the volume, so a cache pod that
  replaces it reports it until the next repack succeeds. The capability report gains the deployment
  row `repository-cache-room` with the source `caches`: open while a cache reports such a failure,
  its detail naming the cache, its volume, its claim and where room comes from, and carried by the
  tick's `openCapabilities` to the project's controller. The daemon API contract moves to 203, and a
  plugin below it is served that row without its `source`, by the contract the plugin states, else
  its pod's lowest. `scripts/e2e/pack-memory-job.sh` measures git and jj memory in a large
  workspace under gVisor as one Kubernetes Job. Every git in an issue pod or a repository cache maps
  packs in small windows, `core.packedGitWindowSize` 32m, `core.packedGitLimit` 256m,
  `pack.windowMemory` 64m and `core.deltaBaseCacheLimit` 64m, from the role environment's pairs
  (`GIT_CONFIG_COUNT` 9), the worker image's `/etc/gitconfig`, the shared clone's own configuration
  and `-c` on the feed's fetch and the cache's git, whose repack keeps its own. Every shared clone
  takes them in its own configuration, a host clone of the tmux runtime too, where they only bound
  git's pack windows.
