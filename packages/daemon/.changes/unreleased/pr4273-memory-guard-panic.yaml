kind: Fixed
body: |-
    A panic in the launcher's memory guard, on its loop or in its hourly measure of the largest
    process, or in a microVM pod's guest memory watch, no longer ends the launcher, which is PID 1
    of the pod, and with it every role's turn. The guard or the watch writes one
    `off reason=panic: …` line that names the panic and where it was raised, and turns off for good,
    as where it cannot read the pod; the launcher runs on.
