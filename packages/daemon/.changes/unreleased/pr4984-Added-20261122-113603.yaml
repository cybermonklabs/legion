kind: Added
body: |-
  The design gate of a root whose repository is a spec source opens with no person when its change
  request proposes nothing. At the registration of the `spec` step, the daemon reads the issue's
  change request from Dispatch. The first registration of a generation fixes the gate's rule:
  `change_request` for a spec source, `approval` otherwise, and a later registration keeps it. Under
  `change_request`, a version that proposes no statement, component or interface and changes no
  approved check opens the gate, recorded as its exempt version and never as an approval. The
  architect is told in a `design-approved` notice that names nobody. Each later version of that spec
  is read the same way before it is applied, by the live event, the gate seed, the boot catch-up and
  the reset above Dispatch. A version that proposes nothing keeps the gate open; one that proposes
  something closes it as before. A Dispatch older than the route keeps today's gate.

  The change request reads its checks from the issue's Verification document, so the daemon reads
  the change request again at every version and approval of the issue's documents. A version of
  the Verification document that changes a check of the approved spec, which no person approved,
  closes the gate, whether a person's approval or the change request opened it: it takes an
  exemption back, and it holds a person's approval, which stays recorded, until the approved spec
  holds the change. The tree is told the gate closed, in words that name the Verification document.
  A person's approval that writes the change into the approved spec opens the gate again. An edit
  of an acceptance check that names no statement closes nothing, and a gate under the rule of a
  person's approval reads no Verification document.

  The change request is read against the approved spec of the issue's repository, which another
  issue's approval or an import can change while neither of the issue's documents moves. The gate
  keeps the approved spec its read compared against (Dispatch's `approved_spec_mark`), so a read of
  the same versions against an older approved spec changes nothing. On Dispatch's
  `spec.approved_written`, the daemon reads again the change request of each open or held spec gate
  of that repository (outbox kind `spec_gate_read`). A read that finds a proposal or a changed check
  the approved spec no longer holds as written closes the gate, whether a person's approval or the
  change request opened it, and the tree, its architect and its running merger are told, in words
  that name the approved spec. A read of a new version against an older approved spec than the
  gate's reads the request again.

  A tree whose gate opened with no person lands nothing until Dispatch's ending condition holds at
  the head that would land. The merger's start waits while it waits. A head move in merging, a
  recorded outcome list (`spec.outcomes_recorded`), and a version or an approval of the root's spec
  each read it again. The running merger is told when the gate closes or opens for its head, while
  every other gated step stands open, and its start task says to run `dispatch spec-ending` before
  each merge and each enqueue. A person's opening of another gated step tells the merger that the
  merge still waits for the ending condition. The root's architect gets one `spec-ending-waits`
  notice per reason per head. A released merger is not woken while the recorded reading waits. A
  refused approval of a stale change request
  (`spec.request_stale`) now reaches the root's architect in one `spec-request-stale` notice, or
  the controller, which names an owner, when no architect holds the tree.

  The role prompts change with it. The implementer records the author's outcome list at each head
  it hands to review. The reviewer records its own outcome list, then reads the author's list, then
  records its final list at the head it reviewed. The merger runs `dispatch spec-ending` for the
  head before each merge and each enqueue, and merges or enqueues only on `ready`. The root
  architect reads the change request before it registers the `spec` step and requests no approval
  of a version that proposes nothing. Such a root keeps its own acceptance checks, ends its spec in
  a `conclusion` block, and is told what the two new notices ask.

  Daemon API contract 232: `GET /legion/v1/state` gains `designGate.exemptVersion`,
  `designGate.rule`, `designGate.verificationVersion`, `designGate.approvedSpecMark`,
  `designGate.checksUnapproved` and `designGate.proposesUnapproved`, each gated step's
  `exemptVersion`, `verificationVersion`, `approvedSpecMark`, `checksUnapproved` and
  `proposesUnapproved`, and the gated-step status `exempt`, all left off for a caller below 232.
  Migration `20261122104755_spec_gate_exemption` adds the six gate columns, the table
  `spec_endings` and the outbox kinds `spec_ending_read` and `spec_gate_read`. Its header carries
  the way back, which deletes the queued rows no earlier release decodes.
