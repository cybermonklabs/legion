kind: Added
body: |-
  `runtime.kubernetes.agent_secrets.exchange_audience` gives every enrolled pod an identity the
  secrets broker's exchange trades for a broker token of a session's own: a projected token of the
  pod's ServiceAccount for that audience, an hour long, at
  `/var/run/legion/agent-secrets-exchange/token`, with each role told
  `AGENT_SECRETS_MACHINE_IDENTITY=kubernetes` and `AGENT_SECRETS_MACHINE_TOKEN_FILE`. The key may
  not equal `audience`. Turning it on, or moving it, drifts every enrolled pod for its update round;
  a role in a pod that lacks the token is told no identity. Set, the two variables, the volume name
  `agent-secrets-exchange` and its mount path are Legion's, and an operator's pod or a launch spec
  that takes one is refused by name. Unset, every pod is as before, and an operator's pod and a
  launch spec may use those names as before.
