kind: Fixed
body: |-
    A stale working copy no longer stops a phase task. Before and after the adoption's change,
    the shim reads with no snapshot whether the working copy is stale, as jj's own check decides
    it, and runs `jj workspace update-stale` on a stale one only. That update leaves the edits
    that no jj command had recorded in a divergent commit that is not checked out and no longer
    on disk. The shim's answer names each such commit in the new optional field `editsCommits` of
    `adopt-working-copy-result` (a daemon or a shim of an earlier release reads the frame as
    before), and the shim's log names it. The daemon records the commit on the role's claim, in
    the new nullable column `claims.left_edits`, and every prompt it sends that role names the
    commit in one sentence that says the edits are there, until a turn takes one of those
    prompts: a task dropped or replaced before any prompt of it reaches the agent leaves the
    sentence to the next task, across a daemon restart too (dispatch://INFRA-3916, R1).
