kind: Added
body: |-
  A later review round's task names the commit that the newest of the reviewer's own deciding
  reviews read, so the reviewer reads the difference from that commit to the head instead of the
  whole change. Each task of the reviewer in reviewing, a resume and a wake included, ends with the
  daemon's two sentences: ` Last reviewed commit: <sha>.`, or ` Last reviewed commit: none.` in a
  round no review of the reviewer's own recorded one for, and then ` Review entry: <n>.`, the
  round it is for. The reviewer writes that number into its review's Legion footer
  (`"entry":"<n>"`), and only an approval or a request for changes of the reviewer's own session
  whose footer names the entry that stands moves the stored commit; any other review decides its
  round as before and leaves the commit, so the next round reads more. A new generation of an
  issue clears the commit, and no entry into a phase does. A compaction the daemon asks for keeps
  the entry's sentence word for word. The migration `20261116234034_phase_reviewed_head` adds
  `phases.reviewed_head` with an empty default, so the first round after the upgrade names the
  commit `none`, and it appends ` Last reviewed commit: none. Review entry: <n>.` to each task a
  reviewer's phases row stores, so a stored task sent after the upgrade ends with the two
  sentences. A task the release before queued or handed a claim before the upgrade is sent as
  it was, with neither sentence, and the reviewer then reads the whole change. A rollback runs
  the way back in `docs/kubernetes.md`, "Rolling back the release that keeps the commit a
  reviewer last read".
