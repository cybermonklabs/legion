kind: Fixed
body: |-
    A production check's look report names its check with checkOpenedAt; without that field,
    a call completes a step. The daemon reads no state to choose between the two. A served
    look survives phase work until the next look. A late step completion needs its run's
    started task and a fresh handoff. The daemon API contract entry 20261125181543
    (look-names-its-check) pairs the daemon with both plugins. The Kubernetes guide gives
    the kept-look reset for rollback.
