kind: Added
body: |-
    The daemon reads the `statuses` field of a CI settlement and keeps the commit statuses of the
    checked head in a new column of `pull_requests` (migration `20261117112334`). It merges the
    statuses of each settlement it applies into the ones it keeps, one context at a time: the
    status with the later `created_at` is kept, and a context that the settlement leaves out stays
    as it was. A settlement that names a new context, or a later `created_at` for a context, is
    newer whatever its generation says, so a status that changes on a CI record recreated after
    the bucket's TTL still reaches the daemon. Where its check runs are older than the ones the
    daemon keeps, such a settlement changes those statuses alone, and the kept check runs,
    generation and failed and cancelled names stay. Its CI message and the notice of a
    head that GitHub will not merge name each status with its state, after the check runs, and
    the task of a role that a settlement wakes names each failed status. A failed status moves no
    issue. A settlement whose `statuses` field the daemon cannot read, such as one with an entry
    that has no `created_at`, keeps the statuses it already holds for that head, and the rest of
    the settlement applies as before.
