kind: Changed
body: |-
  The message every phase holder of a tree gets when its design gate moves is of the standing of
  every step the deployment gates, not of the one document the event named, and it names that step
  and its own document rather than "spec version". It reads the same predicate the merger's start
  hold reads, so the two can no longer disagree over a gated step nothing has registered, and
  every write of a gate row that can move that standing tells it — a registration that closes the
  gate at a version with its reviewer, or opens it with the approval its read carried, no longer
  leaves a running merger merging under a document nobody approved or waiting for an opening it
  was never told of.
