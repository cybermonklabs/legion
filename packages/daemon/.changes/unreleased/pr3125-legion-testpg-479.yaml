kind: Changed
body: |-
    The worker image's `legion-testpg` starts the pod's test Postgres with `max_connections=479` rather than 475, because a Dispatch process may now open 114 connections rather than 113: four processes at 114 plus the suite's own 20 clients (`testlimits.ServerConnections`), and the three slots Postgres reserves for superusers.
