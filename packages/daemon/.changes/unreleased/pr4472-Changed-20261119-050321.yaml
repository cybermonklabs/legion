kind: Changed
body: 'A private-name refusal shows, on one line for each distinct finding, the record, the rule''s description, the matched text and its line, within fixed bounds: 200 bytes of the record''s label, written on one line, 200 bytes of the match, 120 bytes of the line on each side of it, and 40 lines a refusal. A gh call is read one argument, one JSON string and one GraphQL string at a time, so a rule that needs two words matches only inside one field that GitHub stores; but a body sent to a whole URL on another host than api.github.com, such as a release asset uploaded to uploads.github.com, is read whole, because GitHub stores it as sent, and also as its decoded JSON strings, because whoever parses the stored document decodes them; and such a call that gives fields, no --input and a method other than GET is refused. A gh api call''s endpoint is also read with its path and each key and value of its query decoded, a ; inside a value kept, because GitHub decodes the percent-escapes of an endpoint''s path and query, a release asset''s name and label among them, and keeps a ; inside a query value. A call that only prints, such as gh''s help of a command, sends nothing, and the guard opens no file its options name. Before the command''s name, legion gh admits -R/--repo and --help, and a -h only as the whole argv (gh -h), since gh can take the word after a -h as its value and run another command.'
