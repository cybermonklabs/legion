kind: Changed
body: 'The MCP server registers for consumer delivery and keeps no core receive path: every Envoy message reaches it on its session''s relay subject, it publishes no lane receipt, and a registration the listener refuses leaves the session running with one notice naming the reason, asked again at each heartbeat. The one other subscription the process holds is the Agents page live view''s control subject (agentstream.<session_id>.control), which carries a viewer''s replay request and watch pings and no Envoy traffic. A topic no stream subject captures is followed and left out of every registration (registrationTopics), wherever it came from — the stored interest row, the remembered topics a restore reads — since the listener stores none: it leaves such a topic out of the row and warns about it. follow, the envoy_subscribe tool''s own call, refuses such a topic by name, in the listener''s own words, when a caller names it. channel-forwarder.ts is channel-topics.ts, holding the followed set and the one connection. Listeners deploy first: this plugin needs a listener carrying #2446 and the session-consumer grant, since one that answers no delivery leaves the session deaf. The replay sweep is deleted with POST /v1/replay.'
