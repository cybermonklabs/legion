kind: Changed
body: |-
  A Claude Code session in a pod whose trade reaches the secrets broker before the pod's
  registration does is no longer refused for good. Its broker credential trades again in the
  background, 2 s later, doubling to 30 s, until a trade lands, and logs the wait once, naming the
  session, again every 30 minutes while it lasts and once when it ends. An Envoy call made through envoy-client's transport that is still waiting at its own
  deadline fails naming the session and saying the trade is being retried; a call after the
  registration lands goes through once the next trade has taken the token. Every other refusal
  fails the call as before.
