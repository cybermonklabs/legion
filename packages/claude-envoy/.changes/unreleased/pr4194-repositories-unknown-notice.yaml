kind: Fixed
body: |-
  A registration an edge listener refuses 503 `repositories_unknown` no longer tells the session
  "Envoy inbound unavailable" or writes `envoy-channel: this session receives nothing` to
  stderr. The edge could not read the repositories of the session's projects, so it withholds
  the messages of the session's GitHub topics. If it already held the session's registration, it
  kept that registration and the session's consumer, so the session receives its other messages;
  if it held none, the session receives nothing until a registration is accepted. The notice is
  now "Envoy GitHub topics withheld", and it says both cases. Stderr says that the listener
  follows none of the session's GitHub topics now, with the same two cases. The accepted
  registration after it tells the session "Envoy GitHub topics followed again", and stderr says
  that the listener follows the session's GitHub topics again, where both said that the session
  receives again. A refusal or a lost relay subject after a told `repositories_unknown` is told
  once more, as a session that receives nothing.
