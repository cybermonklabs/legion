kind: Fixed
body: |-
  The channel server's NATS dial is dialed again after a failure, for the server's life and until
  it stops, as its wait for a broker token is, while a redial can cure the failure: a hub that
  closed a dial whose CONNECT came late ended the start, and Claude Code does not start a channel
  server again. Each redial is warned of with the servers named by their setting, and each dial is
  bounded at 10 s. An Envoy tool called while the server dials is told the dial's last failure. A
  session told it receives nothing is told once it receives again. When the channel server's NATS
  connection closes for good while its session runs (nats.js gives up on a repeated authorization
  refusal under an nkey seed or no credential), the server dials a new one, and dials again at each
  heartbeat after a dial that fails for good; on the new connection it opens the session's relay
  and the live view's control subject again, at a new epoch. The session is told once that it
  receives nothing, naming why, and once that it receives again. Before, nothing opened a new
  connection, and the session received nothing until Claude Code started the server again. A role
  whose reassertion another live session refuses no longer leaves its record behind (the record's
  write and its removal are ordered in the registry chain), and a session that is shutting down no
  longer tells itself that it receives nothing.
