kind: Changed
body: |-
    The plugin declares daemon API contract 159 in `package.json`'s `legion.daemonApiVersion`:
    install it with a `legion` built from the same commit.
    A Claude Code worker's claim boot (`claims/register` and `claims/ready`) now waits up to an
    hour for a daemon that is not serving, and is made once the daemon serves again. A daemon is
    not serving for a refused, reset, closed or timed-out connection, a host that does not resolve
    or cannot be reached, an uncoded 502, 503 or 504, and an attempt that has no answer after 5
    minutes. A 5xx the daemon itself answered to the registration still fails the boot at once and
    leaves the pane to the daemon's registration deadline. The `legion` tool's `handoff_complete`
    waits up to an hour where it waited 10 minutes. Its read of the handoff report (`jj` and a
    Dispatch request) runs outside the 5-minute limit of an attempt and outside that hour, so a
    slow read is not taken for a daemon that does not answer. Only Claude Code's cancel of the tool
    call stops that read.
    The `envoy_publish` tool's description says to start no replacement for a session whose
    `last_seen` is 20 minutes old or less, and that a Legion claim whose session Envoy has not heard
    from for more than 20 minutes is the case for the `legion` tool's `relaunch`, which starts that
    claim's process again on the same session.
