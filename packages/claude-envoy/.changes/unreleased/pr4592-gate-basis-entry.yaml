kind: Changed
custom:
  Issue: pr4592
body: |-
  The plugin speaks the daemon API contract entry 20261125161152 (gate-basis). A root's design-gate step can stand open on an
  ancestor's approval or wait on an ancestor's approval request (`open_on_basis`,
  `pending_on_basis` and `basis` on `gatedSteps`). `GET /legion/v1/state` gives each root's
  `treeRuns`, and the gate registration takes `basisArtifactId`, `basisVersion` and `reason`.
  The phase `awaiting_children` and the held word of the same name are new, and
  `request_backward_move`, `sign_off` and `stop_task` can refuse `WAITING_ON_CHILDREN`.
