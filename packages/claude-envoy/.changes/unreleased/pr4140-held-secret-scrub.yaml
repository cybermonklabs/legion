kind: Fixed
body: |-
  Four processes pass everything they write to stdout and stderr through the scrub of the secrets
  they hold (`@legion/contracts/held-secrets`): the channel server (its MCP stream included), the
  session hook (the context Claude Code hands the model included), the session-title hook and
  `envoy-send`. A server at the wrong URL that echoes a token the session sent it, whole or in a run
  of 10 or more characters, prints `<withheld>` there. The `dispatch` command's errors pass the
  scrub through envoy-client's `messageFor`. A write that holds no held secret goes out byte for
  byte.
time: 2026-11-17T03:11:20Z
