body: |-
    The `agent-secrets` skill says a GitHub `404` under the session's own token is that token's reach,
    not a denial, and has the reader ask the broker for the GitHub App secret their instructions name,
    narrowed to that repository, and make the call again before saying the service is out of reach.
    The legion-worker skill sends a worker to the `agent-secrets` skill before it reads a GitHub `404`
    under its own token as no access, as it already did before a worker reported a resource unreachable.
