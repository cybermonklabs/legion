kind: Fixed
custom:
  Issue: pr5192
body: |-
  A Dispatch message whose payload the session cannot read as a Dispatch event now shows none of
  that payload, only that it was unrecognised. Before, the session saw the payload whole, which
  could hold another project's event.
  A Dispatch event too large to lay out as a card is shown as the card's own Dispatch block in
  text, with a body read in full, and no longer as the raw payload.
