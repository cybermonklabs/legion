kind: Changed
body: 'The TypeScript broker client treats the broker''s `membership_held` refusal as one to retry: a person whom Dispatch holds, until they sign in to Dispatch again or a refresh confirms them, loses no credential because of the hold, and the client''s retry loop trades again at its next slot, 15 s doubling to 5 minutes, so the hold''s release is taken there.'
