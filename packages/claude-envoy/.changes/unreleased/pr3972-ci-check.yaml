kind: Changed
body: |-
  The Legion plugin's skills say that a `before_merge` check carrying `ci_check` is CI's: no role runs
  it or records its result, and `dispatch results` derives its result from the named CI run and
  prints its `A pass stands:` line. A check with no pass standing follows three cases: a derived fail, or a run that concluded
  `skipped`, `neutral` or `cancelled`, goes back to the implementer; a run still going, or GitHub
  unread, is waited for; a name no run answers is the architect's to correct.
