kind: Changed
body: |-
  The `agent-secrets` skill describes a GitHub App credential as a profile, narrowed with
  `--target ACCOUNT` or `--target ACCOUNT/REPOSITORY`, in place of the four removed GitHub flags. It
  says a repeated command reuses a grant only with the same names, `--ttl` and `--target`; that a
  waiting request of the same name answers `REQUEST_PENDING` whatever its target; what the
  client's left-out line means; that a pod calls GitHub with `curl`; and that exit 2 also covers a
  refused `--target`, a removed GitHub flag, and a broker too old to confirm `--target`.
