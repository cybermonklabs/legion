kind: Added
body: |-
  The bundled `dispatch` command's `read`, `doc-read`, `search`, `answers`, `open-asks`, `inbox`
  and `results` take `--as-of <text>`, an RFC 3339 time, and read Dispatch as it stood at that
  time. The first line of the output names each part and each field that the command left out at
  that time. A token that carries a cut reads at its cut. They need a Dispatch of this release: an
  older Dispatch answers the present, and the command then uses nothing of that answer and exits 1.

  Under a token that carries a cut, the session hook's and the Codex hook's open-asks summary
  names a person that the answer left out as left out at the cut, as `dispatch open-asks` does,
  where it said `asked of nobody`. The answers list on each prompt prints an ask's question that
  the answer left out as left out at the cut, where the hook lost the whole list.
time: 2026-11-20T19:00:05Z
