kind: Changed
body: |-
  The channel server of a session that presents its broker token (`natsAuth: broker`) redials a hub
  that dropped or refuses it on a jittered backoff rather than every 2 s: at once, then after waits
  drawn between half and all of 4 s, 8 s, 16 s and then 20 s for good (`@legion/envoy-client`'s
  `brokerRedialDelays`). A hub that refuses every session at once, as the NATS auth service's
  cutover and a maintenance window do, is asked again about 73 times a second by 1,100 sessions
  rather than 550, and each session is back within 20 s of the hub admitting again. A seed or no
  credential keeps the flat 2 s.
