kind: Fixed
body: |-
    handoff_complete sends check_opened_at to report a production check's look, without
    reading the issue's state or finding a handoff first. Its shared successful-call helper
    leaves phase input open after a report, closes it after a step completion or backward
    move, and marks an update answered without closing the phase. The plugin speaks the
    daemon API contract entry 20261125181543 (look-names-its-check).
