kind: Changed
body: |-
  The Legion plugin's legion-worker skill tells a reviewer to read a later round from the commit
  its task names (`Last reviewed commit: <sha>`), and the whole change when the task names none,
  when the commit is not an ancestor of the head, or when a forward merge changed the
  unchanged-diff fingerprint; the reviewer writes into its review's Legion footer, as
  `"entry":"<n>"`, the number of the newest `Review entry: <n>.` sentence that is the last sentence
  of a task or a wake of its session. The plugin's thermonuclear-deep-review
  skill audits the range its brief names, or the checked-out branch against its base when the brief
  names none. The plugin's two thermonuclear skills and the Legion plugin's two thermonuclear agents
  gain one rule: a range limits what must be read, never what is reported, so a defect or a smell in
  code the pull request changed before that range is a finding.
