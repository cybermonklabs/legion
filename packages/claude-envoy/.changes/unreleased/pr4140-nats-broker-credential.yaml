kind: Added
body: |-
  With `NATS_AUTH=broker` (or `"natsAuth": "broker"` in envoy.json), the channel server's NATS
  connection presents the session's own broker token, which a hub running the NATS auth service
  admits to that session's subjects alone. The token is taken before the connection is dialled and
  renewed before it lapses, and a `/clear` closes the old id's relay, moves the connection to the
  new id's token and waits for it to come back before the new id's relay subject is subscribed.
  Unset, the connection presents a seed or no credential, as before.
