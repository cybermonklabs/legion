kind: Fixed
body: |-
  A failure notice is compared with the session this process serves when its turn in the channel's
  write queue comes, not when the delivery ledger asks for it. A `/clear` that moved the session
  while the notice waited behind an earlier write no longer cards the old session's notice in the
  new conversation: the notice is refused, and the frame goes back to the stream for the session it
  names.
