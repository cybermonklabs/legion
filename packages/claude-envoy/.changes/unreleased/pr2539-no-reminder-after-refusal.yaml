kind: Changed
body: |-
  A Claude Code phase worker whose turn ended on an API error is no longer reminded for it at once.
  Claude Code runs `StopFailure` instead of `Stop` for such a turn, and its
  `${last_assistant_message}` is the error text rather than anything the worker said, so that hook
  is the provider refusing the turn and the phase-stall machine takes it as one: reminding the
  session there and then would only buy another refusal. The reminder comes once five minutes
  later, so a single transient refusal does not leave the worker idle. The daemon fails the claim
  on a refused turn whose HTTP status cannot clear, which the turn outcome the bridge reports names,
  and the reminder's record check drops every reminder once the daemon has failed this role's
  claim; a run of refusals that can clear fails nothing, and the daemon's provider-error ladder
  sends the task again. The bridge reports a turn refused only for the step subtype the provider
  refused (`error_during_execution`): Claude Code's own `error_max_turns`, and a failed step a
  later one ran past, count toward nothing. `legion.daemonApiVersion` is 86, the contract that adds
  `POST /legion/v1/claims/turn-outcome`.
