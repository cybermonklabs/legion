kind: Fixed
body: |-
    The Codex `dispatch` tool's description no longer reads exit 1 as a refusal by Dispatch alone:
    the command exits 1 when Dispatch or AskGate refused the call, when the command could not reach
    Dispatch, or when Dispatch kept no answer for a call that writes nothing, and 2 on a usage error
    or on a session or a configuration that it cannot use.
time: 2026-11-24T16:47:25Z
custom:
