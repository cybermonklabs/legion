kind: Changed
body: |-
  The Legion plugin's skills say that a run of a check's CI job on a push of the change's branch records its own result of a check carrying `ci_check`, and that a pass from CI is the derived result or one the job recorded. Their merge gate asks a pass from the implementer and from the tester both at the head being reviewed, or from CI for a check carrying `ci_check`, and retro's read says that a pass at another commit does not count and a pass and a fail at one head leave it not known. Such a head is refused or sent back at once: no skill waits for a `ci_check` run or for GitHub while it holds a pass and a fail. The Codex plugin's manifest names `ACTIONS_ID_TOKEN_REQUEST_URL` and `ACTIONS_ID_TOKEN_REQUEST_TOKEN` in `env_vars`, the two variables a GitHub Actions runner sets for the broker path's `github-actions` identity, so Codex hands them to the server as it hands every other variable that path reads.
