kind: Changed
body: |-
    The subscribe tool's guide to the checks topic, which this plugin ships, says that a settlement
    names the commit statuses of the commit in its `statuses` field, each with its state and
    GitHub's `created_at`, and leaves the field out when none is recorded. A consumer keeps, for
    each context, the entry with the later `created_at`, and keeps a context that a settlement
    leaves out as it was. A settlement is sent again when a commit status is new or changes state.
