kind: Changed
body: |-
    The subscribe tool's guide to the checks topic and the envoy skill's check-settlement
    reference, which this plugin ships, name a settlement's `statuses`: each commit status of the
    commit, with its state and GitHub's `created_at`. They say how a consumer keeps them. For each
    context it keeps the entry with the later `created_at`, and a context that a settlement leaves
    out stays as it was. A settlement that names a new context, or a later `created_at` for a
    context, is newer whatever its check runs and its generation say.
