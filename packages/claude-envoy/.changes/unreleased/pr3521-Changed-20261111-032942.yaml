body: 'Declares daemon API contract 64: every Legion launch carries the issue it serves as `legion.issue` and the role it runs as `legion.role` in `OTEL_RESOURCE_ATTRIBUTES`, after the attributes the operator sets in the pod or pane environment. The project controller serves no issue and carries the role alone. To group spend by issue, the spend collector must keep these keys.'
