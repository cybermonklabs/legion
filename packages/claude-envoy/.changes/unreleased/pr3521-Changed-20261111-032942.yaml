body: 'Declares daemon API contract 63: every Legion launch now carries the issue it serves as `legion.issue` and the role it runs as `legion.role` in `OTEL_RESOURCE_ATTRIBUTES`, after the attributes the deployment''s own pod or pane environment sets, so a pod''s spend splits by the issue it was spent on; the project controller''s launch, which serves no issue, carries the role alone.'
