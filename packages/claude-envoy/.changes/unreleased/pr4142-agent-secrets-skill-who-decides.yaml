kind: Changed
body: |-
  The agent-secrets skill says each key says who decides a request for it, nobody, the model judge
  or a person; to read `agent-secrets secret show`'s decides and guidance lines before asking and
  to write the reason to meet the guidance; and that a denial, the judge's included, is final, so
  the agent tells whoever gave it the work rather than sending the same request again.
