kind: Added
body: |-
  The `legion` tool gains `report_defect` (`issue`, `defect`, `head`, and `check` where the defect is about a check), which records a defect in the merged change of an issue; it moves no phase, so a report leaves this session's phase open. The plugin reads the daemon's `verifying` phase and each issue's `closeWait` with it.
