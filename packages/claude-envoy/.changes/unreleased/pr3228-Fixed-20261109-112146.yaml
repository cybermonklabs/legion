kind: Fixed
body: A Legion phase worker on Claude Code now takes its Envoy role at the session's first prompt rather than during its boot, so a message the listener kept for that role arrives inside a turn that is already running instead of ahead of the daemon's task. A pane that is given no prompt claims the name at a bound instead, 30 seconds by default (`LEGION_CLAIM_FIRST_TURN_BOUND_MS`), so it stays addressable.
