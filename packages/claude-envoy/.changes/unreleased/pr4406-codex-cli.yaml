kind: Added
custom:
  Issue: pr4406
body: |-
  A Codex CLI plugin, `@sjawhar/codex-envoy`, built from this package's source and released with
  it at the same version: `codex plugin marketplace add cybermonklabs/legion`, then
  `codex plugin add codex-envoy@legion-plugins`. A Codex session registers with Envoy under its own
  session id at its first prompt, shows on the Agents page with its live view, takes Send, Aside
  and BTW and Envoy messages (through `codex queue` while idle and a `PostToolUse` hook during a
  turn), and reaches Dispatch through a pre-approved `dispatch` tool, since Codex's sandbox keeps
  shell commands off the network. Under Codex's shared app server, which runs several sessions in
  one process (`codex agents`, and every terminal session on Codex 0.170.0), it registers no
  session with Envoy; the `dispatch` tool and the Dispatch hooks still work. It is a package of its own because Codex's plugin validator
  refuses a layout Claude Code's plugin needs; the release publishes it once an owner of the
  `@sjawhar` scope has published the name by hand.
