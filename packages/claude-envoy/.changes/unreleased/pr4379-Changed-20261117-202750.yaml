kind: Changed
body: |-
    The bundled `dispatch` command and a person's keyed accept send a write whose answer was lost
    again under its key whatever Dispatch's `/healthz` answers, and ask nothing first: every
    Dispatch that carries `b1c42d1d7d` runs the keyed layer, and the Dispatch client no longer reads
    `/healthz` before it resends a keyed write.
