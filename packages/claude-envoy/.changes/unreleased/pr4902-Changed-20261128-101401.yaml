kind: Changed
body: |-
  The `legion` tool runs a call that names a field its operation does not take, instead of
  refusing it. The operation runs with the fields it takes and sends the daemon no other, and its
  answer starts with one line that names each field it did not use and then the fields it takes,
  as in `read_record did not use field "since", which it does not take; it takes issue`. A model
  that fills every field of the tool's schema, as GPT-family models do, had each of its calls
  refused. A refusal of an unknown operation and of the operation's own fields is unchanged, and
  carries no such line.
time: 2026-11-28T10:14:01Z
