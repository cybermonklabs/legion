body: 'The Dispatch and Legion skills this plugin ships state one rule for taking an issue off the queue: move it to `backlog`, `icebox` or `triage` only when a person asked for that move, or when the work is done, folded into another issue or no longer needed, and cite that reason in a comment on the issue. Each limit the texts state now carries the action that replaces the move, which writes no status, changes no priority and moves nothing on the board.'
