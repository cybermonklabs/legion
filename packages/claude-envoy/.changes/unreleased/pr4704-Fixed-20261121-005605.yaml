kind: Fixed
custom:
  Issue: pr4704
body: |-
  Codex: one plugin server of a `codex` process no longer takes the Envoy session from another
  that already owns it. A server held between its read of the servers' directory and the link of
  its entry could take a number that a stopped owner had freed, below the server that took over,
  and both then ran the session's Envoy side. No owner is now decided above a free number while a
  server that still runs is between those two steps, and a server whose listing of the directory
  fails places no entry.
