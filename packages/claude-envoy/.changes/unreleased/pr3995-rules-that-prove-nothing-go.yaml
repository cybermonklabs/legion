kind: Changed
custom:
  Issue: pr3995
body: |-
  The generated Legion plugin's skills size each round to what changed. On a new head, the
  reviewer and the tester read what changed since the head they last approved or tested
  (`git diff`, or `git show --remerge-diff` for a merge of the base) and test or review again only
  what that change can affect; the reviewer's thermonuclear pair audits the whole diff on its first
  review and that change after it. A check the change cannot affect is recorded again at the new
  head as carried from its earlier pass, and is not run again. The unchanged-diff fingerprint is
  gone. A parent's last round merges the base only on a trigger every pull request has, and runs
  no forced full test round. An approval request's `--summary` says what the human is approving,
  and nothing else.

  Rules that made a role do work that proves nothing are deleted, or cut to one sentence of
  guidance: the `Not proven / risk` line, the docs-only simplify pass and `Thermo` line, the class
  search of every earlier review finding, the fresh spec reviews before every approval request,
  and the `design-outsider` before every design. A prose fault is a finding for the implementer
  that need not hold the reviewer's approval. `legion-worker`, `legion-architect` and
  `legion-controller` each carry three rules: ask a person only for what needs that person; state
  no estimated date or duration; and fix a fault's cause where the cause is, adding no new gate,
  check or job for it.
