kind: Changed
custom:
  Issue: pr3995
body: |-
  The generated Legion plugin's skills size each round to what changed. On a new head, the tester
  reads what changed since the head it last tested, and the reviewer what changed since the
  `Last reviewed commit` its task names, the head of its newest deciding review (an approval or a
  request for changes); each tests or reviews again only what that change can affect. For a merge
  of the base, `git show --remerge-diff <merge>` shows its resolution, and
  `git diff --stat <merge>^1 <merge>` lists the files the base brought in; a check those files or
  the resolution can reach runs again, and a check the merge was made for has no pass to carry.
  The reviewer reviews the resolution and this change's own commits since that commit, and reads
  the base's files only for where they meet this change, and it names that diff in each task of
  its thermonuclear pair. A check the change cannot affect is recorded again at the new head as
  carried from its earlier pass, and is not run again. The unchanged-diff fingerprint is gone. A
  parent's last round merges the base only on a trigger every pull request has, and runs no forced
  full test round. An approval request's `--summary` says what the human is approving, and nothing
  else.

  Rules that made a role do work that proves nothing are deleted, or cut to one sentence of
  guidance: the `Not proven / risk` line, the docs-only simplify pass and `Thermo` line, the class
  search of every earlier review finding, the fresh spec reviews before every approval request,
  the `design-outsider` before every design, and the child-spec chain. A parent still reviews each
  version of a child's spec against its own spec and posts its `Spec review of` comment, and uses
  a reader (`plan-reviewer`, `plan-gap-analyst`) where the reading needs one; the fresh reader for
  every version, the oracle red team before each child is filed with its `Red-team verdict for`
  comment, the `plan-gap-analyst` for each child's spec, and the weekly audit's count of those
  verdicts are gone. A parent whose pull request merged before its last round runs, or has run,
  each check with no `ci_check` on the default branch, with no fresh `task` subagent. A prose defect
  (a false statement, a contradiction, or an instruction a role would follow wrongly) is a finding
  like any other and requests changes; a wording preference is not a finding and is not raised.
  `legion-worker`, `legion-architect` and `legion-controller` each carry three rules: ask a person
  only for what needs that person; give a person no estimated date or duration, and say what work
  is left and what decides when it ends; and fix a fault's cause where the cause is, adding no new
  gate, check or job for it.

  The skills the plugin links from `skills/` change with them. `dispatch-writing-specs` no longer
  asks a sentence citing a pass to say what the pass does not show, keeps a claim that is not
  measured out of an ask until it is measured, no longer counts coined terms, and has a fresh
  subagent read a spec where the spec is large or changed in a way the writer cannot check alone.
  `thermonuclear-deep-review` writes a `Security:` line only where the diff touches a row.
  `plain-words` gives no projected date: it says what is left and what decides when it ends.
