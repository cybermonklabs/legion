kind: Changed
custom:
  Issue: pr3995
body: |-
  The generated Legion plugin's skills size each round to what changed. On a new head, the
  reviewer and the tester read what changed since the head they last approved or tested
  (`git diff`) and test or review again only what that change can affect. For a merge of the
  base, `git show --remerge-diff <merge>` shows its resolution, and
  `git diff --stat <merge>^1 <merge>` lists the files the base brought in; a check those files or
  the resolution can reach runs again, and a check the merge was made for has no pass to carry.
  The reviewer reviews the resolution and this change's own commits since its earlier head, and
  reads the base's files only for where they meet this change. The reviewer's thermonuclear pair
  audits the whole diff on its first review and what the reviewer reviews after it. A check the
  change cannot affect is recorded again at the new head as carried from its earlier pass, and is
  not run again. The unchanged-diff fingerprint is gone. A parent's last round merges the base
  only on a trigger every pull request has, and runs no forced full test round. An approval
  request's `--summary` says what the human is approving, and nothing else.

  Rules that made a role do work that proves nothing are deleted, or cut to one sentence of
  guidance: the `Not proven / risk` line, the docs-only simplify pass and `Thermo` line, the class
  search of every earlier review finding, the fresh spec reviews before every approval request,
  and the `design-outsider` before every design. A prose fault is a finding for the implementer
  that need not hold the reviewer's approval. `legion-worker`, `legion-architect` and
  `legion-controller` each carry three rules: ask a person only for what needs that person; state
  no estimated date or duration; and fix a fault's cause where the cause is, adding no new gate,
  check or job for it.

  The skills the plugin links from `skills/` change with them. `dispatch-writing-specs` no longer
  asks a sentence citing a pass to say what the pass does not show, keeps a claim that is not
  measured out of an ask until it is measured, no longer counts coined terms, and has a fresh
  subagent read a spec where the spec is large or changed in a way the writer cannot check alone.
  `thermonuclear-deep-review` audits the diff its caller names, and writes a `Security:` line only
  where the diff touches a row. `plain-words` gives no projected date: it says what is left and
  what decides when it ends.
