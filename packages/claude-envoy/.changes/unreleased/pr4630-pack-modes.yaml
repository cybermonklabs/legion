kind: Fixed
body: |-
  The published tarball's file modes no longer depend on the umask of whoever packs it: a pack
  from a checkout made under umask 0002 shipped the manifest and every staged skill file writable
  by group. The prepack now takes group and other write from every path the pack ships, after it
  has read and checked them all, so a refusal leaves the skills links as it found them.
