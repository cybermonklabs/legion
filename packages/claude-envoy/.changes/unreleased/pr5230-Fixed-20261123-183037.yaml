kind: Fixed
body: |-
    The Legion claim reads a 408 and a 429 from the Legion daemon as it reads a 5xx: `claims/ready`
    is sent again, at boot and after a role regain, and a `claims/register` answered either is
    logged and rejects without stopping the pane, which the daemon's registration deadline then
    covers. The daemon writes neither, so only a proxy between the session and the daemon sends
    one. Between its three attempts the ready waits what the answer's `Retry-After` asks for, at
    least 1 s and at most 30 s, where it waited 1 s whatever the answer asked.
    `envoy-send` and every Envoy listener call send a 408 once more, as a 5xx, and a send an
    attempt of which was answered 408 may or may not have arrived (`envoy-send` exits 75 and prints
    the resend under its key), as after a 5xx: a hop can answer 408 after it forwarded the send. A
    Dispatch write a gateway answered 408 may have landed too, and ends saying so with its key. A
    `handoff_complete` that waits out a daemon restart now waits out every outage, a 408, a 429 or
    any 5xx, whose body is not the daemon's refusal shape, such as a proxy's page; it waited out
    only a 502 or a 503 that carried no code. A refusal in the daemon's own shape is its answer at
    any status, with a code or without one, and is handed back at once, a 502 or a 503 among them.
