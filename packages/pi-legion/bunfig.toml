[test]
# Each test starts with no secret held (`@legion/contracts/held-secrets`) and takes the row-deadline
# marks. test-timeout-preload.ts declares the 300000 ms guard, but only inside a --parallel worker
# (every file of the `test` script's first command, `bun test --parallel=4`), because a
# non-parallel `bun test` would raise it for the first file alone; a plain `bun test` keeps Bun's
# 5000 ms, as on main, except a row that needs more takes its own guard (`useRowGuard` + `test`'s
# third argument). These apply through bunfig, so the first command needs no --timeout or --preload
# flag, and the second command (score.test.ts alone, non-parallel) passes only its --timeout.
preload = [
  "../contracts/src/held-secrets-test-preload.ts",
  "@legion/test-fixtures/row-deadline",
  "./test-timeout-preload.ts",
]
