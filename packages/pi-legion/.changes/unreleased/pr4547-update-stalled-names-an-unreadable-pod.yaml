kind: Changed
body: |-
    The controller's escalation reference says which roles a pod update round asks and waits for:
    not a role that failed, and not a role the daemon itself suspended, except a role the project's
    pause stopped while the pause still owes that role a launch. It lists a pod the runtime cannot
    read among the holds an `update-stalled` notice's `reason` can name, and names "no process in
    the pod" as a hold only where the daemon cannot replace that pod by issue. It says that work a
    role did not push stays on a kept volume that the issue's next pod mounts.
