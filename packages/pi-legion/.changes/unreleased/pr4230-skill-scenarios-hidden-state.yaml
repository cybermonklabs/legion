kind: Changed
body: |-
  A skill-scenario label whose name ends in `-hidden` hides Dispatch's computed state from its agent: from the rig's own reads of a run's results until its agent ends, the run's Dispatch leaves each check's `pass_stands` and `ci` and each result's `currency` out of the results answer, and `results-before.txt` waits in the map, which no agent sees. `label-checkouts.sh --hidden <label>` gives `<label>-hidden` a checkout of its own with `<label>`'s content, so the scorer's rule against reading another label's checkout holds. `rig.sh hidden-proof` proves the hiding of each such run: the route's answer after the switch is the answer before less those three fields, the text after holds no state line, and no transcript of the run, its subagents' included, holds one. `SKILL_SCENARIOS_OWNER` labels a batch's containers, whose ids `<work>/services/containers` records.
  A skill scenario, `ci-pass-and-fail`, drives the reviewer, the tester and the architect through a check CI proves whose job recorded a pass and then a fail at the head while its run there is still in progress, so the head's line reads not known beside "CI run go-checks has no result (not_completed)". The rig writes the job's two results into the run's database as the route stores them, since only a job's results token records them. Each role's scored answer is the one that state calls for at once: the reviewer requests changes naming the check, the tester lists it in its record's `failures`, and the architect sends the issue back naming it, each with no `WAITING` line before.
  `rig.sh judge-omp` bounds each call it makes to the Docker daemon: the judge image's inspect and each pull at `SKILL_SCENARIOS_DOCKER_TIMEOUT` seconds (300 unset), and the judge's run at that plus omp's own `SKILL_SCENARIOS_TIMEOUT`. A call past its bound ends the judge at once with a refusal that names the call and its bound: a pull its bound ended is not asked again, as a pull that failed is, and an inspect the daemon does not answer is no longer taken for a missing image.
