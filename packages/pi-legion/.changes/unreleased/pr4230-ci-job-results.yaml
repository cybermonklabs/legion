kind: Changed
body: |-
  The worker, architect and retro skills say that a run of a check's CI job on a push of the change's branch records its own result of a check carrying `ci_check`, and that a pass from CI is the derived result or one the job recorded. `ci-checks.md` shows how `dispatch results` prints each result the job recorded, with `A pass stands: no` or `not known` followed by `, as <k> of <n> heads read yes` where heads follow, that an issue with no pull request prints no `Pull request line:`, and that such a check is a failure where no pass stands at the head: a result from CI there is a fail, CI holds a pass and a fail at that commit, or its run proved nothing. The worker and retro skills read the line of the head under each check in `dispatch results`, which prints the head lines (the pull request body's `Checks` block holds none), and the architect skill reads the answer of the whole check, whose `A pass stands:` line a pass and a fail at one head leave not known or no, never yes. A pass and a fail at one head, whoever recorded them, leave it not known, which is a refusal at once, with no wait for a later result, for the check's CI run or for GitHub: the reviewer requests changes naming the check, the architect sends the issue back with `request_backward_move`, retro sends the check back, and the tester records a test failure, and each wait of the skills for a `ci_check` run still going or for an unread GitHub leaves that state out. `merge-gate.md` states the reviewer's gate with a pass from the implementer and from the tester both at the head being reviewed, or from CI for a check carrying `ci_check`, and retro's read says that a pass at another commit does not count and a pass and a fail at one head leave it not known. The architect skill's and its references' other mentions of the gate point to `merge-gate.md`, and `pr-body.md` and `merge-gate.md` say that a child's result proves nothing for a root without restating the gate.
  The skill scenarios gain three: `reviewer-own-head` (four cases: a sibling pull request's fail, a pass from CI alone, no pass of the implementer, no pass of the tester), `reviewer-pass-and-fail` and `architect-pass-and-fail`. Each run has a NATS and a GitHub stand-in of its own beside its Dispatch, which learns its two pull requests from their `opened` events through the real intake, and the run starts no agent until `dispatch results` prints the line of #702 (`SKILL_SCENARIOS_FIXTURE_ONLY=1` stops there). `rule-search.ts` lists every sentence of an ablate label's rule in the texts the role reads, to the closure of their links, each cut or kept with a reason, so a label's cuts come from one classified search. `rule-search.ts <checkout> cut <label> <head checkout>` shows that a label's own checkout holds no sentence that the head's search cuts and states the rule nowhere else, and `label-checkouts.sh <repository> <commit> <label>.patch...` builds a fresh checkout of each label from a commit and its patch and runs that check over each. `gate-search.ts` lists each sentence that states the merge condition in the texts a reviewer or an architect reads, the generated Legion plugin of Claude Code included, with the facts it states, and fails on one that lacks the reviewed head's own line, a pass of each of the two roles or of CI, or a pass and a fail at one head left not known with its refusal or move back and no wait.
  No skill-scenario agent can read its scenario, its case or its label any more: a run's directory and a label's profile directory have random names, and the names live in `<work>/maps` (a link per run and per label), which `rig.sh score` reads and no agent sees. Every label's Oh My Pi profile is `skills`, a run's Legion project, Dispatch database and tmux session take the run directory's name, and no `case.txt` or `built-from` is in a run's directory. Each agent runs under bubblewrap in a PID namespace of its own, in a view that holds only what it runs: the system's `/usr` and `/etc`, its run with the run's own `tmp` at `/tmp`, empty `/var/tmp` and `/dev/shm`, its label's plugins and model key, the batch's services, and the installs of the tools it runs (its pinned Oh My Pi, mise, bun, and the git, jj, jq and python3 its pane's `PATH` finds). No other run, label, label checkout or work directory, and nothing else of the operator's home or the disks, is in it. `visible-world.ts <run dir> [--live]` lists each place in a run's world that still names one, and walks every path name of the agent's view (the run's view file inside bubblewrap, or the running agent's own root with `--live`): a walk that does not finish is UNKNOWN (exit 3), never clean. The gh stand-in answers a `gh api --input` body that is not JSON as GitHub does, `Problems parsing JSON (HTTP 400)`.
