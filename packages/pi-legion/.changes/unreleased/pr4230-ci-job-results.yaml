kind: Changed
body: |-
  The skill scenarios gain three: `reviewer-own-head` (four cases: a sibling pull request's fail, a pass from CI alone, no pass of the implementer, no pass of the tester; #702's line reads yes in each, so the reviewer approves it, and the label `restore-two-roles` puts back the words that ask a pass from the implementer and from the tester), `reviewer-pass-and-fail` and `architect-pass-and-fail`. Each run has a NATS and a GitHub stand-in of its own beside its Dispatch, which learns its two pull requests from their `opened` events through the real intake, and the run starts no agent until `dispatch results` prints the line of #702 (`SKILL_SCENARIOS_FIXTURE_ONLY=1` stops there). `label-checkouts.sh <repository> <commit> <label>.patch...` builds a fresh checkout of each label from a commit and its patch, each label named by its patch, and refuses a patch that does not apply; a label's runs, scored below the head's, show that its patch cuts the rule.
  No skill-scenario agent can read its scenario, its case or its label any more: a run's directory and a label's profile directory have random names, and the names live in `<work>/maps` (a link per run and per label), which `rig.sh score` reads and no agent sees. Every label's Oh My Pi profile is `skills`, a run's Legion project, Dispatch database and tmux session take the run directory's name, and no `case.txt` or `built-from` is in a run's directory. Each agent runs under bubblewrap in a PID namespace of its own, in a view that holds only what it runs: the system's `/usr` and `/etc`, its run with the run's own `tmp` at `/tmp`, empty `/var/tmp` and `/dev/shm`, its label's plugins and model key, the batch's services, and the installs of the tools it runs (its pinned Oh My Pi, mise, bun, and the git, jj, jq and python3 its pane's `PATH` finds). No other run, label, label checkout or work directory, and nothing else of the operator's home or the disks, is in it. `visible-world.ts <run dir> [--live]` lists each place in a run's world that still names one, and walks every path name of the agent's view (the run's view file inside bubblewrap, or the running agent's own root with `--live`): a walk that does not finish is UNKNOWN (exit 3), never clean. The gh stand-in answers a `gh api --input` body that is not JSON as GitHub does, `Problems parsing JSON (HTTP 400)`.
