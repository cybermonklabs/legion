kind: Fixed
body: |-
  fetch-spec-sources.ts leaves a post its author deleted out of messages.md and agent-texts.json,
  and its stdout counts the deleted posts it left out; an edited post's words carry the edited mark
  every read of the dispatch command prints after them. label-comments.ts leaves a comment its
  author deleted out of what the judge labels, and its summary counts the comments it left out and
  says why. Neither script writes any part of a deleted post.
