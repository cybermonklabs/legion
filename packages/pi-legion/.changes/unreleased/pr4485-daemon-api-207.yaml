kind: Changed
body: |-
    The controller pod's launcher takes `--microvm` and the metadata flags, and its
    `launcher_hello_ack` carries `kernelKills`. The controller's skill reads the
    `memory-guard-kill on <PROJECT>` wake of a microVM controller pod too, where the pod's own
    kernel stopped a command or one of the processes that run the controller's session.
