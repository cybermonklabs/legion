kind: Fixed
body: |-
  The Legion daemon client, `label-comments.ts`'s model call, the production Dispatch reader of
  the skill-scenario scripts and each request of `seed.ts` follow no redirect. For `seed.ts` that
  is its own calls with the agent bearer and the ones it makes through Dispatch's e2e client, the
  implement handoff's write among them, so `implement-handoff` no longer prints `seeded` after a
  3xx. A 3xx is a refusal, read from its status before any of its body, that names the status,
  says where it points (another origin by its scheme and host, another path of the same address,
  or no target) and says what to correct, and it is not tried again. On the `--key-file` route,
  whose address no setting changes, the refusal says to check for a proxy in front of Anthropic.
  `label-comments.ts` names a refused `--gateway` with no user and no password, and one that is no
  http or https URL with a host, or that still holds a raw `@` once its user part is taken out, by
  its length alone and how to write a user part. Such a `LEGION_DAEMON_URL` fails each daemon call
  the same way, and nothing is sent; a controller whose `LEGION_PROJECT` is not the daemon's names
  the daemon with no user and no password. A daemon refusal after an attempt that lost its
  connection is a new error that says the lost attempt may have been applied, with the refusal
  unchanged as its cause.
