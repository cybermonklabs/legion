body: |-
  No Legion skill holds the follow-the-code sentence any more; the two review agents carry it.
  `legion-worker` drops `default-branch-check.md` and `foreign-path.md` and the steps that used
  them, its reference list again names the acts that send a merger to `merge-gate.md` and a tester
  to `pr-body.md`, and `legion-worker`, `legion-architect` and `legion-controller` correct the
  sentences that were false against the code.
