kind: Changed
body: |-
    The plugin declares daemon API contract 169, which adds `--microvm` and the metadata flags to
    the controller pod's launcher and `kernelKills` to that launcher's `launcher_hello_ack`. The
    controller's skill reads the `memory-guard-kill on <PROJECT>` wake of a microVM controller pod
    too, where the pod's own kernel stopped a command or one of the processes that run the
    controller's session.
