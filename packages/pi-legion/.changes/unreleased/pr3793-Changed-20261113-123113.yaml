kind: Changed
body: The `legion` tool reports the head its handoff record names as the completion's commit for every file-backed phase, read from Dispatch and not from the shared workspace. A completion sent once the issue has moved on, as a reviewer's is after its review, reports the role's newest record of the phase it left and reads nothing of the workspace every role of the issue shares, the implementer's included; a phase left with no record reports the commit the workspace stands on, for the daemon to answer. While the issue is in implementing, the implementer is refused when its record names no head, when the commit its workspace stands on is not on the issue branch at origin, or when its record's head is not that pushed commit. Daemon API contract 121.
