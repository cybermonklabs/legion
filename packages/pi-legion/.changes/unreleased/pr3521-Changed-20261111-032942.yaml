kind: Changed
body: 'Declares daemon API contract 63: every Legion launch now carries the issue it serves as `legion.issue` and the role it runs as `legion.role` in `OTEL_RESOURCE_ATTRIBUTES`, written after the attributes the deployment''s own `runtime.kubernetes.pod.env` or `runtime.tmux.pane_env` sets, so a pod''s spend splits by the issue it was spent on. The project controller''s launch serves no issue and carries the role alone. The deployment may still set the variable and a launch spec may not, and a configured value the agent''s OpenTelemetry detector would throw on is refused at load rather than costing a launch every attribute it carries.'
