kind: Changed
body: 'Declares daemon API contract 64: every Legion launch carries the issue it serves as `legion.issue` and the role it runs as `legion.role` in `OTEL_RESOURCE_ATTRIBUTES`, after the attributes the operator sets in `runtime.kubernetes.pod.env` or `runtime.tmux.pane_env`. To group spend by issue, the spend collector must keep these keys. The project controller serves no issue and carries the role alone. The deployment may set the variable, but a launch spec may not. A configured value that the OpenTelemetry detector cannot parse is refused at load, before it can cost a launch every attribute it carries.'
