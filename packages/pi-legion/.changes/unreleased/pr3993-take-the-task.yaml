kind: Changed
body: |-
  A Legion worker on Oh My Pi takes its task from the daemon when its session is idle, rather than
  being sent it as a prompt, and claims its Envoy role right after `claims/ready` and a read of its
  task, so a task the ready itself wrote starts ahead of the messages kept for the role. Until that
  read has answered, no Envoy message starts a turn, one sent to the session itself included. A
  task accepted while a run is going waits for that run's end and starts a turn of its own, and
  that run's report names the task as `held`. Each turn's end is reported to the daemon until the
  daemon answers. The take, the seen report and the turn's report are each sent again after an
  outage whose body is not the daemon's refusal shape, as #5230's outage rule says. The turn's report is
  the one call that a refusal in the daemon's own shape does not end: the route's own 500, which
  says the daemon could not record the report, is sent again, since the report is what finishes the
  task. A refused end the host goes on from, with a retry or the next model of its
  fallback chain, ends no turn: the task's take keeps its number and nothing is reported, so the
  daemon does not take the task back while the host still runs its turn, and the end of the attempt
  that settles the turn is the one report. The daemon-launched controller reports ready and reads
  its start task before it claims its role and follows its topics and Slack channels, so its start
  task is its first turn, and its reports name that task's number.
  The `LEGION_CLAIM_FIRST_TURN_BOUND_MS` setting is gone.
