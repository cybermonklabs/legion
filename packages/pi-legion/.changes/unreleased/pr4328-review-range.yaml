kind: Changed
body: |-
  The legion-worker skill tells a reviewer to read a later round from the commit its task names
  (`Last reviewed commit: <sha>`): the difference from it to the head and each thread, with the
  thermonuclear pair over that same range, run only when the range touches runtime code. It reads
  the whole change when the task names no commit, when the commit is not an ancestor of the head,
  or when a forward merge changed the unchanged-diff fingerprint. The reviewer writes into its
  review's Legion footer, as `"entry":"<n>"`, the number of the newest `Review entry: <n>.`
  sentence that is the last sentence of a task or a wake of its session, and the PR-body guide's
  pair half names the range the pair read. The two thermonuclear agents gain one rule: a range
  limits what they must read, not what they report, so a defect in code the pull request changed
  before the range is a finding.
