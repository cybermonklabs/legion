kind: Fixed
body: |-
  `rig.sh check-stored` counts a run only when a pod's log stores it: a `got` line of a name no
  given log stores, and a second `stored` line of another sha256 for a run whose row was stored,
  are rig errors. It takes the Job's count (`check-stored <dir> <count> <job log>...`) and reads
  every entry of the download's `runs/`. It exits 1 on any rig error, on any entry that is no
  run's object, and on any cell short of the Job's count. The pack of a scored run leaves out
  every directory named `home`, nested ones too.
