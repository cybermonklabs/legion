kind: Changed
body: |-
  The `skill-cuts` behaviour score bounds a stage an arm leaves short of its judged runs after its
  extra runs, where each of that arm's runs with no verdict is undecided (`mixed-undecided` or
  `reads-past-last-round`) and every other arm has its judged runs. Each such arm's passes run from
  its passes among its first N runs to those plus its undecided runs among them. Where the
  registered rule gives the stage one outcome at every count of those ranges, the stage takes it:
  it is counted, starts no run and drops no case, and its line prints each bounded arm as its range
  and ends `(bounded over <k> undecided runs)`. Where the outcome differs, or an arm short of its
  runs has another run with no verdict (a gateway refusal, a 429, a timeout, a budget stop, a
  further-round wait), it stays unscreened. No pass rule changes. The control case is the one that
  comes first under every way the undecided screen runs end, else the skill gets no verdict naming
  the cases that leave it open; three pooled confirms with a bounded one pool over the summed
  ranges; the false-loss estimate takes a bounded case's largest chance; and `report` reads a saved
  `reads-past-last-round` drop of a stage the bound now counts as no drop.
