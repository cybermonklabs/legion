kind: Changed
body: |-
  `legion-retro` no longer forbids a rebase, and `legion-worker` no longer forbids `jj rebase` when
  an agent merges the base forward, nor a rewrite of a pushed commit. `legion-worker` no longer
  gives the commands of a merge of the base: it states the jj behaviours an agent may not expect.
  `legion-controller` says why an `admission.held` issue stands in neither list, and that the
  parked-root walk does not find a `carried-gate-opened` decision.
  `legion-architect` names the backward move that undoes a `CHILD_UNDER_ACCEPTED_PARENT` refusal
  under an accepted root, and that an issue held at `admitted` does not hold a merged issue's close.
  `legion-architect` and `legion-worker` name, beside `full-ci`, the `lane:` label that
  `.github/workflows/ci.yaml` names for a held-back CI job.
  `legion-worker` no longer describes what an idle release of the pod keeps: the role prompt says
  it, and the skill's line that the next pod restores unpushed work was false.
time: 2026-11-24T03:01:49Z
