kind: Fixed
body: |-
  A Legion role's session whose model fallback wait is already over when a run starts - a worker the
  daemon relaunched after its cooldown, or a task sent to a pane that sat idle through it - now sends
  that run's first request to the role's own model. The plugin made the return only in Oh My Pi's
  `context` hook, which the host runs after it has read the request's model, so such a run sent its
  first request to the fallback model and only the second to the role's own. The return is now also
  made in `before_agent_start`, ahead of the run's first request.
