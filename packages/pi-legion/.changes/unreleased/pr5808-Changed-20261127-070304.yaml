kind: Changed
body: |-
    The worker and architect skills no longer offer `full-ci` beside a slow suite's own
    `lane:<output>` label. The merge queue runs every held-back slow suite before the change merges,
    so a pull request adds a suite's lane label only for a need its body names, and takes it off when
    no check of the issue names that suite's job.
