kind: Added
body: |-
  The `legion` tool gains `report_defect` (`issue`, `defect`, `head`, and `check` where the defect is about a check), which records a defect in the merged change of an issue and moves no phase: every phase worker and the architect have it. The architect also gains `withdraw_defect` (`issue`, `defect`, `reason`), which takes a defect report back by its id. The plugin reads the daemon's `verifying` phase and each issue's `closeWait` with it.
