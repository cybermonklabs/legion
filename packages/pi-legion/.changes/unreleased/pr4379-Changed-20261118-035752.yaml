body: |-
    The bundled Dispatch client sends a keyed write whose answer was lost again under its key whatever
    Dispatch's `/healthz` answers, and asks nothing first: every Dispatch that carries `b1c42d1d7d`
    runs the keyed layer, and the client no longer reads `/healthz` before it resends a keyed write.
