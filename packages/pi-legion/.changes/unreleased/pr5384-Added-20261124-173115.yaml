kind: Added
body: |-
    The daemon API contract entry admission-cap (20261125170933): the controller's `legion` tool gains `set_admission_cap` (`cap`,
    `reason`) and `clear_admission_cap` (`reason`), which move the project's admission cap while
    the daemon runs, up to the deployment's `admission_ceiling`, with no restart. `read_state`'s
    summary names the cap in force, the ceiling and the cap that stands, with who set it, when and
    why, the reason quoted. The controller's skill changes the cap only where a person's words,
    cited in `reason`, ask for it.
