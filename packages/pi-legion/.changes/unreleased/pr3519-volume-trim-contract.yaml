kind: Changed
custom:
  Issue: pr3519
body: |-
  The daemon API contract this plugin declares is 160. The launcher wire gains the cache
  trimmer's settings on the daemon's answer to a launcher's hello, and the trimmer's own report
  frame, sent for a sweep that leaves an issue pod's volume above its low mark, unless the
  settings stopped it, and once when the trimmer switches itself off. The state body's
  `settings.runtime.kubernetes` gains `volume_trim`, the settled block the trimmer runs by.
