kind: Added
body: |-
    The packed plugin declares the daemon API contract that includes entry `20261125162112`
    (`slots-reading`). The `legion` tool's `read_state` summary prints the
    daemon's `slots:` line right after its admission cap line. The line gives the slots in use,
    which can stand above the cap, and after them how many of those holders are P0, as `(<n> P0)`.
    It says what each slot in use
    is spent on (`working`, `stopped`, `person`, `issue` or `idle`, each with its oldest time), how
    much started work waits without a slot, and how many holders rank below the first issue that
    waits for one, in the line's own order, which puts priority first. A daemon that serves a
    caller below that entry sends no such line, and the summary leaves it out.
time: 2026-11-22T10:02:00.000000000Z
