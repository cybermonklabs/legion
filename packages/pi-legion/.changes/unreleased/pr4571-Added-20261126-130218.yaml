kind: Added
body: |-
  `skill-cuts behaviour control` takes `--control-informative`. It runs the control of the skill's
  control case even where the skill has fewer than 6 informative cases, so that a loss in one case
  has its control. A skill with no case to be the control case still gets no control run. The
  control stage records `controlInformative`, and `report` then prints `case result only; no skill
  verdict stands (--control-informative)` as its verdict line, naming `--confirm-flagged` too where
  a confirm was made with it. The other `behaviour` commands refuse the option.
