kind: Added
body: |-
  The `skill-cuts` runner has `behaviour continue-mixed`, which continues the saved runs that
  `behaviour audit-mixed` sorts as continued, from a saved `--from` into a new `--out`, and never
  writes `--from`. Each continuation is the live replay's own code resumed from the run's saved
  reply: the first body `replayOnce` sends, with the run's own session id, then the saved reply
  whole (its thinking signatures or encrypted reasoning) less the calls it left out, sent with the
  run's own routing id. Every request must be answered by the deployment that answered the saved
  reply, taken from the run's record or, for a run saved before runs recorded one, from the saved
  request log. A run whose record lacks a part its next request needs, whose continuation another
  deployment answers or the gateway refuses, or that the rule leaves undecided, gets no verdict and
  is run again fresh under the extra-run rule. The continued replies are judged blind. Each new
  case result names every continued run's saved run, its request ids and both runners, and `report`
  counts continued, waiting, run-again, fresh and unchanged runs apart, with the continuations' and
  the fresh runs' spend apart. `--allow-runners` admits saved runs of an older runner, `--only`
  selects the case stages to continue, and `--further-rounds <n>` lets a continuation send at most
  n requests; one whose reply after them would be continued again stops with no verdict and no
  fresh run in its place (`further-round-limit`). `--probe` sends
  one run's next request alone, with no judge call, and writes `probe.json`. `behaviour
  audit-mixed` now takes an arm's installed copies from the case's saved profile where its capture
  is not saved, says where each arm's copies came from, and skips a case whose profile copy the
  cache cannot give, with its reason, while the other cases are audited.
