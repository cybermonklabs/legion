kind: Changed
body: 'The Legion controller''s and architect''s skills, and the `legion` tool''s own description, state one rule for taking an issue off the queue: move it to `backlog`, `icebox` or `triage` only when a person asked for that move, or when the work is done, folded into another issue or no longer needed, and cite that reason in a comment on the issue. A tree that waits on an outside event, one whose architect died with its cause unfixed, and one held on an escalation whose cause stands now stay admitted: the controller asks the person with a `dispatch ask`, moves the tree to backlog only on the answer, and acts on that answer when it comes. The walk of roots in backlog or icebox, at every start and on each tick, now checks the cause or the event of each move to backlog the controller marked, and sets the root back to `todo` once that cause is gone or that event has happened. The daily report names each ask whether to move a tree to backlog or to defer it that a person resolved without an answer, until its wait ends. For a weekly-plan row that defers a root with no person''s request behind it, the controller now asks the person whether to defer that root. A free or full admission slot moves nothing to backlog. A person''s request that the controller start an issue now starts it, even when another person or session moved it to backlog or icebox. An architect no longer moves a child to backlog so its tree can finish; a released child stays under its parent, and a child not yet released that should not run now moves under another started issue of the same tree.'
