kind: Changed
body: 'The Legion controller''s and architect''s skills, and the `legion` tool''s own description, state one rule for taking an issue off the queue: move it to `backlog`, `icebox` or `triage` only when a person asked for that move, or when the work is done, folded into another issue or no longer needed, and cite that reason in a comment on the issue. A tree that waits on an outside event, one whose architect died with its cause unfixed, and one held on an escalation whose cause stands now stay admitted: the controller asks the person with a `dispatch ask`, parks only on the answer, and acts on that answer when it comes. The parked-root walk, at every start and on each tick, now checks the cause or the event of each park the controller marked, and sets the root back to `todo` once that cause is gone or that event has happened. The daily report names each park or deferral ask that a person resolved without an answer, until its wait ends. For a weekly-plan row that defers a root with no person''s request behind it, the controller now asks the person whether to defer that root. A free or full admission slot parks nothing. An architect no longer parks a child so its tree can finish; a released child stays under its parent, and a child not yet released that should not run now moves under another started issue of the same tree.'
