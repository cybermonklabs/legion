kind: Changed
body: |-
  `legion-architect` and the architect role prompts now make best practice the floor and world-class the target, as `skill://following-best-practices` says. Before the spec is published, the design gate runs the gap review, claim review, best-practice review and world-class review on a local draft in that order, records their results in the spec's `### Best practice and world-class` entry, runs `plan-reviewer` to check that record, and runs the skill's process cross-review last; its first `plan-reviewer` run, the claim review, is told the two design reviews have not run yet and skips that record. Only then is the spec published and its decision blocks settled, and an answer that changes the design is reviewed again before approval is requested. The approval summary names all four results and what they do not prove.
