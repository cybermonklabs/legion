kind: Added
body: |-
  The `questions-for-controller` daemon API entry (`20261125161252`) adds `questionsForController`
  to `GET /legion/v1/state`, which `legion state --json` prints. It lists up to 100 questions,
  newest first, that the answer loop passed to the controller in the last seven days (`id`,
  `issue`, `role`, `session`, `asker`, `ref`, `reason`, `passedAt`, and `writes`, the `gh` writes
  the loop ran for the question). The daemon's `agent-question` notice on the
  controller topic is a live wake only, so a controller that starts later reads what it missed
  here. The daemon omits the key for callers below the entry's contract. It reads the caller's
  contract from `Legion-Plugin-Contract` or, if absent, from the pod's highest recorded contract
  below 193. Strict readers before #2788 refuse the key and newer readers below the entry discard
  it. Install this release with a `legion` built from the same commit.
time: 2026-11-06T22:00:00.000000000Z
