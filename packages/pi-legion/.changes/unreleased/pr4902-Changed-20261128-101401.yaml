kind: Changed
body: |-
  The `legion` tool runs a call that names a field its operation does not take, instead of
  refusing it. The operation runs with the fields it takes and sends the daemon no other, and its
  answer starts with one line that names each field it did not use and then the fields it takes,
  as in `read_record did not use field "since", which it does not take; it takes issue`. A
  `reason` sent to `rerun_child` still says to write the why as a dispatch comment on the child.
  GPT-family models fill every field of the tool's schema, and the tool refused each of their
  calls. A refusal of an unknown operation, of an operation the session's role does not have and
  of the operation's own fields is unchanged, and carries no such line.
