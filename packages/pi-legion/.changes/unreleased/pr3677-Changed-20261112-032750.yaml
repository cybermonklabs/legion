body: 'The legion tool names the code of a completion refused for its phase entry HANDOFF_STALE_ENTRY, the code that replaces the one named for the minted assignment, and says what it means: the completion is of an entry behind the one the role''s phases row names, nothing was recorded, and the daemon sends the current entry''s task by itself. The instruction the tool gives for that code is word for word the one the daemon''s refusal ends with. The plugin declares daemon API contract 93.'
