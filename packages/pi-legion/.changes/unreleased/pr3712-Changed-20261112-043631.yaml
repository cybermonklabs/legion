kind: Changed
body: |-
    The daemon API contract is 101. An issue of `GET /legion/v1/state` carries `repoBefore` and
    `repoCorrectedAt`, the repository the issue left and the moment the daemon applied the
    correction, and `repoChangePending` and `repoChangeReason`, a repository Dispatch has named that
    the daemon has not applied and why. The end-of-turn reminder no longer keeps a phase of its own:
    at the end of each turn it asks the daemon what the claim owes (`POST /legion/v1/claims/owed`),
    waits at most 3 seconds for the answer, and reminds the worker exactly when the claim owes work,
    naming that work in the daemon's words. A handoff_complete or a backward move no longer changes
    the reminder's state. When the answer cannot be read, the reminder still nudges the worker, in
    words that name no phase and no operation.
