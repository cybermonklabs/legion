kind: Fixed
body: |-
    handoff_complete takes look_id, the look id that a production check look's task gives, and
    sends it with check_opened_at. The daemon takes the look from that id, not from the turn the
    session is in. A report with no look_id still goes to the daemon, which answers that the
    report needs it. The tool refuses look_id on a step's completion before it sends anything.
    Its refusals no longer tell the agent to read check.openedAt from read_record. The plugin
    speaks the daemon API contract entry 20261127185859 (report-gives-its-look-id). The
    end-of-turn reminder tells a role whose check report is refused CHECK_LOOK_NOT_OPEN to report
    again with check_opened_at and look_id from its newest task of that check, and to do nothing
    more only when it holds no newer task.
time: 2026-11-27T23:51:12Z
