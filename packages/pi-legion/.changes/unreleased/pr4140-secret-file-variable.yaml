kind: Fixed
body: |-
  A pane secret's file pointer that cannot be read (`LEGION_BOOT_TOKEN_FILE`,
  `LEGION_CONTROLLER_SECRET_FILE`) is refused naming the variable and the read error's code
  (`LEGION_BOOT_TOKEN_FILE names a file that could not be read (ENOENT)`), no longer its path,
  which a token pasted in place of the path would be. The boot token and the controller secret
  are held, whether read from their file or from the plain variable
  (`@legion/contracts/held-secrets`), and the daemon's detail in a failed controller registration
  is logged through the scrub, so a daemon that echoes the secret it was sent prints
  `<withheld>` in its place.
time: 2026-11-17T05:24:25Z
