body: |-
  The `legion` tool's description of `fresh_session` says that an empty answer means the start is
  under way and that `read_state` shows how it ended, and that `phaseNotRestarted` also names a
  start that waits for an admission slot and a start refused after the session was forgotten.
  The plugin speaks daemon API contract 266.
