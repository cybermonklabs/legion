body: 'Declares daemon API contract 75, and `retry_or_escalate` now takes an optional `reason`, which the daemon writes into the task the restarted role is given and into its own log line for the release. The record `read_record` answers names the phase a held issue was held from and, on a failed claim, why it failed: the one cause word, the sentence beside it, the moment and the four attempt counts.'
