kind: Added
body: |-
  The controller follows the project's watched workflows that the daemon names in its
  registration (`watchedWorkflows`, daemon API contract entry 20261127193422), under both launch
  forms: one Envoy topic for each event of each entry,
  `notifications.github.<owner>.<repo>.default_branch.workflow.<file>.completed.<event>`, for as
  long as the session holds the controller role. It subscribes them once the rest of its claim is
  done (the daemon's controller after `claims/ready`, the operator's controller after its notice
  topic), one after another, in a task the claim does not wait for: no answer Envoy gives about a
  watched topic fails the claim, exits the process or costs the role, the notice topic or a Slack
  topic. A topic Envoy answers 503 (an edge listener that cannot read the project's repositories
  answers `repositories_unknown`) is subscribed again after a wait of 1 s that doubles to 30 s,
  with one log line per wait. A session is told that the topic waits, naming the entry, the
  topic and Envoy's answer, at the first 503 it meets, and again at the next 503 after a refusal
  other than a 503 or after the controller comes back to it from another session that was told;
  the controller says once when Envoy takes the topic, also when a later claim's subscription of
  that topic is the one that lands. A session change stops the old session's watched
  subscriptions at once, so the new session is told nothing of them. A topic Envoy refuses for
  another reason is logged, told to the session, which may not hear its runs until the
  controller claims its role again, and given up, and the other topics go on. The
  session is told as Envoy tells it its own notices, with no turn of its own, and a notice the
  session refuses is logged and fails nothing. A controller process keeps the list of its first
  registration for as long as it lives, as it keeps its Slack channels: each later claim, after a
  `/new`, `/resume`, `/fork` or `/branch` too, subscribes that same list again for its own
  session, and a later registration that names another list is one log line saying that the
  changed list takes effect at the controller's next launch. Every controller process sets the plugin
  interface's `watchedWorkflowsRoleOwned`, so a resumed controller drops the watched topics its
  stored interest row holds before it claims. Plugin interface version 7: install this release
  with the `@sjawhar/pi-envoy` released beside it.
