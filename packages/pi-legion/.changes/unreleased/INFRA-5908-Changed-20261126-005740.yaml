kind: Changed
body: |-
  A Legion role fixes a defect that stops its work, as well as a clear defect in code its tree
  touches or depends on, in any repository its credentials reach: in its tree's pull request, or in
  a child its architect files in that repository. An open issue that tracks the defect is no reason
  to wait, unless it is claimed, `in_progress`, and its holder said on Envoy that it works on it
  now; the role then tells the holder what it needs by when, and fixes the defect itself after that
  time. The controller no longer gives a clear defect to a tree said to own the code: it puts it on
  the issue that tracks it, hands it to a running tree whose pull request can carry it, or files it
  for Legion, and it sends a defect that stops its sender's work back to the sender. No skill sends
  an ask to the controller's report issue: a role no longer opens one there, or on its own issue,
  for a clear defect no controller took, and the controller no longer keeps that issue open for
  asks. An answered ask whose option starts `Hand it` is still handed over.
