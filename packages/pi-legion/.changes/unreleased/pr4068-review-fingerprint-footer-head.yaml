kind: Fixed
body: |-
  After a forward merge, the reviewer takes the unchanged-diff fingerprint at the head its last
  submitted review read, which that review's Legion footer names, and no longer at the review's
  `commit_id`, which GitHub can move onto a later head: on cybermonklabs/legion#3516 an approval
  of `e9a820cf` came to read `commit_id` `6019bdc9`, the forward merge above it, so the two
  fingerprints were of one head and always equal. The merge-gate reference gives the `gh api` read
  that prints the reviews of the reviewer's own session, each with its footer's head. Where the
  footer names no head, the head of that review's own `review` handoff stands for it (the newest
  version the session wrote at or before the review was submitted, which a second command finds),
  or else the one SHA the review's body says it reviewed or approved; a body naming more than one
  without saying which, or none, and a session with no review on the pull request, give a new
  round. The unchanged-diff check and the architect's acceptance read say the same.
