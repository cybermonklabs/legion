kind: Changed
body: |-
  The legion-architect skill's references (`operations.md`, `wake-routing.md`) and the
  legion-controller skill's references (`wakes.md`, `daily-report.md`) name the new
  `claim-write-refused` notice, which tells that the store refused a write of a claim and that the
  daemon put the claim back to its stored row. The architect acts only when the role stays stuck
  for more than one probe interval, and then sends the claim and the notice to the controller. The
  controller files the refusal as a clear defect of the daemon, with the claim, the SQLSTATE and
  the constraint, and names it in its daily report.
