kind: Added
body: |-
  The controller runs a prioritization pass, at most once a turn: on every turn that a `tick`,
  `slot-free` or `todo` wake starts, and on every other turn that has nothing else waiting, once
  `dispatch issues --updated-since` lists an issue changed since its last pass. The pass reads the
  admission line, the weekly plan and the open P0 and P1 issues. It changes a rank, an admission or
  the plan where they no longer match the project's priorities. It ends with one line in the
  controller's summary, `Prioritization pass at <RFC3339>: <what it changed, or none>`, and a
  session with no such line runs the pass. The daily weekly-plan reconciliation is the pass's
  first-turn-of-the-day form. The controller's role prompt names the pass.
