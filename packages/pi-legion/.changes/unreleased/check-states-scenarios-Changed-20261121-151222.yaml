kind: Changed
body: |-
  The skill-scenario rig follows the check states. The reviewer's task names no verdict of the
  tester, as the daemon's no longer does, and the tester's record in each heads world carries no
  verdict; tester-proof's record passes only with no verdict. reviewer-own-head gains the cases
  no-verdict-pass
  (a pass of each role at #702's head) and no-verdict-fail (the implementer's pass, the test record,
  then the tester's fail there), and architect-pass-and-fail the same two cases beside its own
  world, whose runs keep their names. The ablate label `ablate-states-read` cuts, in the texts of
  the reviewer and of the architect, each sentence that sends either role to the state of its head
  in `dispatch results`, and writes `Tester's verdict: pass.` back into both roles' tasks from the
  `task-words.txt` its patch adds to the label's checkout; a run whose task words file cannot be
  read, or holds no words, fails before its role starts.
