kind: Fixed
body: |-
  The plugin interface's `startupTurn` mark is cleared on every fact that says the controller's
  start is not coming. A start message whose send Oh My Pi fails clears the mark it set, since no
  run starts to clear it, so `@sjawhar/pi-envoy` holds no startup card for that start in the 30 s
  a sent mark holds them. A `/legion-claim-controller` claim (or a re-claim after a session change)
  refused before the send clears the unsent mark, as a refused `/legion-controller-start` claim
  already did, so pi-envoy, which reads an unsent mark again every second for up to 30 s, wakes for
  the session's startup cards at its next read rather than at that cap.
