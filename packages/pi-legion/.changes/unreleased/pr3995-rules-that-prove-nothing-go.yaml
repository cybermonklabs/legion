kind: Changed
custom:
  Issue: pr3995
body: |-
  Rules that made a role do work that proves nothing are deleted, or cut to one sentence of
  guidance. In `legion-worker`, the pull request body's `Not proven / risk` line holds one sentence
  on a risk that stands, and is left out where none stands; the reviewer no longer refills it each
  round. A docs-only pull request needs no simplify pass and no `Thermo` line, and
  `simplify-settled-diff` no longer says that a scope with no code still runs. The class search of
  every earlier review finding at every head is gone. A prose defect (a false statement, a
  contradiction, or an instruction a role would follow wrongly) is a finding like any other and
  requests changes, and the implementer's fix for it carries every pass it cannot affect; a wording
  preference is not a finding and is not raised. In `legion-architect`, the gap review and the
  claim review of a spec are guidance for a large or changed spec, not a step before every approval
  request, and the `design-outsider` is for a design you doubt, not a step before every design.

  `legion-architect`'s parent still reviews each version of a child's spec and Verification
  document against its own spec, records its verdict as the `Spec review of` comment and tells the
  child's architect. It reads each child spec against its own spec and uses a reader
  (`plan-reviewer`, `plan-gap-analyst`) where the reading needs one. Gone are the fresh reader for
  every version, the oracle red team before each child is filed with its `Red-team verdict for`
  comment, the `plan-gap-analyst` for each child's spec, and the check before `release_children`
  that a verdict comment names each child. `legion-controller`'s weekly audit no longer nudges a
  tree for a child that no red-team verdict names. A parent whose pull request merged before its
  last round runs, or has run, each check with no `ci_check` on the default branch, where before a
  fresh `task` subagent had to run them.

  `legion-worker`, `legion-architect` and `legion-controller` each carry three rules: ask a person
  only for what needs that person (their authority, their taste or risk appetite, or something only
  they can give); give a person no estimated date or duration, and say what work is left and what
  decides when it ends; and fix a fault's cause where the cause is, adding no new gate, check or
  job for it.
