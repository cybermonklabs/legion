body: |-
    The `legion` tool's description of `ready_for_update` no longer tells the reviewer that it
    creates no commit and pushes nothing: a reviewer now pushes its own commit of text fixes, and
    an update round must not lose it. The skill-scenario rig scores the reviewer's text commit and
    the implementer's last chance against the new role prompts.
