kind: Fixed
body: |-
    A Legion session whose role claim the Envoy listener answers `503` no longer stops. The listener
    writes no claim when it answers `503` (every try met a conflict, or the takeover record a claim
    writes first did not store), so the claim boot claims the role again after a wait that starts at
    one second and doubles up to thirty, with one log line per wait naming the attempt and the
    listener's answer, until the claim lands or is refused. Any other refusal still stops the
    session so the daemon launches it again. Every controller claim that waits shows that the
    controller holds no Envoy role yet in its claim widget, a session change's re-claim included,
    and takes that line down once the role is held. The daemon-launched controller's own claims (at
    start, and after a session change) claim again the same way; that controller runs as
    `omp --mode rpc`, where its widget is shown nowhere, so each wait shows in the Oh My Pi log of
    the controller's session, and the daemon retires and relaunches a controller that never reports
    ready after its registration deadline (120 seconds times 3 by default), logging the claim, the
    reason and the launch it counts. A command a person types (`/legion-controller-start`,
    `/legion-claim-controller`), wherever it runs, and any claim of a controller the daemon did not
    launch, also shows each wait as a notice and fails on screen with the listener's answer after
    five tries. In the daemon-launched controller, the process stays up only when such a command's
    role claim gave up; any other failure of it, such as a `503` to the controller topic's
    subscription after the role landed, exits so the daemon launches it again.
