kind: Fixed
body: |-
    A Legion session whose role claim the Envoy listener answers `503` no longer stops. The listener
    writes no claim when it answers `503` (every try met a conflict, or the takeover record a claim
    writes first did not store), so the claim boot claims the role again after a wait that starts at
    one second and doubles up to thirty, with one log line per wait naming the attempt and the
    listener's answer, until the claim lands or is refused. Any other refusal still stops the
    session so the daemon launches it again. Every controller claim that waits shows that the
    controller holds no Envoy role yet in its claim widget, and takes that line down once the role
    is held. The daemon-launched controller's own claim at start claims again the same way, bounded
    by the daemon's registration deadline (120 seconds times 3 by default), after which the daemon
    retires and relaunches it, logging the claim, the reason and the launch it counts; that
    controller runs as `omp --mode rpc`, where its widget is shown nowhere, so each wait shows in the
    Oh My Pi log of the controller's session. A session change in the daemon-launched controller is
    refused when it registers the new session (`409`), so the controller exits and is relaunched on
    its recorded session. A command a person types (`/legion-controller-start`,
    `/legion-claim-controller`), wherever it runs, and any claim of a controller the daemon did not
    launch, also shows each wait as a notice and fails on screen with the listener's answer after
    five tries. In the daemon-launched controller, the process stays up, with the role and topics
    its first claim took, only when such a command's role claim gave up; any other failure of it,
    such as a `503` to the controller topic's subscription after the role landed, exits so the
    daemon launches it again.
