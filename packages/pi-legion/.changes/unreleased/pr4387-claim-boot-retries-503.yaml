kind: Fixed
body: |-
    A Legion session whose role claim the Envoy listener answers `503` no longer stops. The listener
    writes no claim when it answers `503` (every try met a conflict, or the takeover record a claim
    writes first did not store), so the claim boot claims the role again after a wait that starts at
    one second and doubles up to thirty, with one log line per wait naming the attempt and the
    listener's answer, until the claim lands or is refused. Any other refusal still stops the
    session so the daemon launches it again. Every controller claim shows that the controller holds
    no Envoy role yet on its pane while it waits, a session change's re-claim included. The daemon-
    launched controller's own claims (at start, and after a session change) claim again the same way
    until they land. A command a person types (`/legion-controller-start`,
    `/legion-claim-controller`), wherever it runs, and any claim of a controller the daemon did not
    launch, also shows each wait as a notice and fails on screen with the listener's answer after
    five tries; the daemon-launched controller's process stays up.
