kind: Added
body: |-
  The plugin reports each model request of its sessions to the daemon for admission by signals
  (`POST /legion/v1/claims/model-requests`, daemon API entry `20261126011643`, `admission-signals`):
  the role's own session, each `task` subagent it starts, under the role's claim and never a
  credential of the subagent's, and the controller's session, under its registration. Each request
  goes with a stable id, its session, its model, when it ended and its fresh input plus its cache
  writes (never its cache reads); a message that carries neither the provider's response id nor a
  token is no request, and is not reported. Oh My Pi's `message_end` carries no request made
  outside the agent loop, such as a title, a classifier, a compaction's summary or a memory
  extraction, so the plugin reports none of those, and the provider's headroom does not count their
  tokens. A request is reported within 15 seconds of its end while the turn goes on, and what is
  left at the run's end at once; a request the daemon does not say it holds is sent again under the
  same id. Nothing of a turn waits on a report, and the turn-outcome report is unchanged.

  The controller's `legion` tool gains `signals_on`, `signals_off`, `set_signal_limit` (`signal`,
  `part` for the provider, `limit`) and `clear_signal_limit` (`signal`, `part`), which change
  admission by signals through `POST /legion/v1/project/signals`. Each requires the person's cited
  word in `reason`, and each answers whether the change moved the setting and the settings as they
  stand.
