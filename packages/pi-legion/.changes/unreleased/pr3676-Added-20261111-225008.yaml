kind: Added
body: An architect whose tree builds or changes a surface a person opens shows that person the surface, and gets their answer, before it asks them to approve the root spec. Whether a change needs that round is the architect's judgement; `skill://legion-architect` gives the readings that inform it, the shape of the round and where the agreed pictures go, in `references/design-gate.md`.
