kind: Added
body: |-
  The controller's `legion` tool takes three operations that decide how the daemon submits a
  merge. `set_merge_jump` (issue, reason) marks one issue, so that the daemon asks GitHub to put
  the next merge it submits for that issue at the head of GitHub's merge queue, ahead of the pull
  requests already in it; the mark is spent at that mutation, and the reason stays in the record
  of the jump. The record carries what became of the jump's own request in `outcome` — `asked`,
  which is Legion having asked and never learned, `accepted`, which is GitHub taking the
  request, `refused`, which is an answer that decided it, and `unknown`, which is an answer that
  decided nothing or a request nothing came back for, with `answer` carrying the words for the
  last two — and never where the merge stands, `accepted` included.
  Only a merge that goes into a merge queue spends the mark, which is a merge whose base branch
  requires one: where the base requires none there is no queue to jump, the merge goes out as it
  always did, and the mark stands until it is cleared or the issue leaves the workflow.
  `clear_merge_jump` (issue) takes a mark off before its merge is submitted. `set_merge_holds`
  (holds) replaces the project's whole merge hold list: while a hold stands, the daemon submits
  no merge whose pull request changes a file one of that hold's paths matches, and the issue
  waits in `awaiting_merge` with its architect told once (`merge-held`). The daemon refuses an
  issue it does not record (`ISSUE_NOT_RECORDED`), an issue of another project
  (`ISSUE_OUTSIDE_PROJECT`), a jump mark on an issue that has left the workflow (`ISSUE_LEFT_WORKFLOW`,
  which also answers an issue whose departure commits while the request is in flight, leaving no
  mark written),
  a jump with no reason, a hold with no path
  (`HOLD_WITHOUT_PATH`), a path that is no regular expression (`INVALID_HOLD_PATH`), a hold with
  no reason (`HOLD_WITHOUT_REASON`), an `endsAt` no later than now (`HOLD_ALREADY_ENDED`) and a
  repository the project does not serve (`REPOSITORY_NOT_SERVED`), and every call without a
  controller grant (`CONTROLLER_REQUIRED`).
  The plugin declares daemon API contract 84, whose state carries `mergeJumps`, `mergeHolds`,
  `mergeHeld` and `mergeJumpRecords`.

  Rolling back to the release before this one is not free. The older daemon refuses the three
  new `ready_merge` payload fields on every retry of every such row this daemon wrote, which
  stops those merges, and its reader knows neither of the two new notice kinds, which holds
  every waiting notice of the project behind them. Two statements clear both, with `<KEY>` the
  Dispatch project key:
  `update outbox set payload = payload - 'held' - 'heldSince' - 'heldTold' where kind = 'ready_merge' and (payload ? 'held' or payload ? 'heldSince' or payload ? 'heldTold') and split_part(issue, '-', 1) = '<KEY>';`
  and
  `delete from outbox where kind in ('notice', 'controller_notice') and payload->>'kind' in ('merge-held', 'merge-jump-refused') and split_part(issue, '-', 1) = '<KEY>';`.
  The notices are deleted rather than rewritten, because an older kind would tell an architect
  something that is not true. The three tables the migration adds (`merge_jumps`, `merge_holds`,
  `merge_jump_records`) are left in place: an older daemon reads none of them.
