kind: Removed
body: |-
    The `legion-architect` and `legion-controller` skills give no `agent-secrets` command line. They
    name the secret and the GitHub or Slack call each operation needs, and point at
    `agent-secrets --help` for the run. Three of the commands they gave named `--github-owner`,
    `--github-repo` and `--github-token`, which `agent-secrets` refuses with exit 2, so the
    architect's GitHub write, the controller's CI re-run and its reply to a GitHub mention each ran
    nothing.
