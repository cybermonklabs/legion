kind: Added
body: The Dispatch API types carry the 409 SPEC_FORM refusal, spec_form on the answer of an approval request, and the read route GET /api/v1/artifacts/{id}/spec-form. The refusal carries error whole and in two parts, refusal and next_step, so that a client with a next step of its own shows refusal beside it. Each finding (SpecFormFinding) carries detail, the rule's words at the place of the finding, and ways, the words of the ways out that it gives, or an empty string. spec_form and the read route carry unread, each approved document under the root whose approved version Dispatch cannot read (SpecFormUnread).
