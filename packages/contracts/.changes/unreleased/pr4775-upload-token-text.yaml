kind: Changed
body: |-
    The `dispatch_artifact` tool's description and the upload request's `precondition` field say what Dispatch does now: it checks a token an upload names under the write's own lock, and takes an upload that names none without a check for now, since older `dispatch` commands cannot name one. Name the token wherever the command can: a later release refuses an upload naming none with `400 PRECONDITION_REQUIRED`.
