kind: Changed
body: |-
  `dispatch_doc_edit`'s `with` says the text a `replace` writes keeps every bold, italic,
  strikethrough, link or code span the match lies wholly inside, that a `find` which spells a
  span's own markup (`**Sami bold**`) lets `with` decide that span's formatting, and that a `find`
  which matched the text as written spells none (`2*3*4` in `*a 2\*3\*4 b*`). It names the new
  refusal too: a `find` that crosses a span's edge, covering text inside it and text outside it, is
  `400 FIND_CROSSES_SPAN`, which names the find that keeps the text it names: the span's markup
  spelled over the part of it the find covers, a link's with the URL and title it has. A bold or
  italic span the `find` cuts so that the part it keeps would end or start on a space is refused,
  and no `find` keeps that text (`bold now` and `**bold** now` over `**Sami said bold** now`): the
  space is to be moved out of the span. A link the edit removes whole must be spelled as it is
  wherever the `find` spells it, since the edit would remove a link another writer may have
  changed: a `find`, a `replace`'s or a `delete`'s, that spells it with another URL or title is
  refused the same way, over the link's whole text (`[this](https://wrong.example/9)`) or over part
  of it where the edit removes the rest, as a `delete` whose list marker selects the item holding
  the link does, and a `with` of blocks, which drops the whitespace beside the `find`. An edit that
  removes only part of a link changes only the text the `find` names, and the rest of the link
  keeps the document's URL and title. It names the two limits of the rule: no `find` spells
  strikethrough's markup, so the text outside a struck span is replaced in an operation of its
  own; and a span is kept only by a `with` of one paragraph, since a `with` that parses to blocks
  keeps none of the spans the match lies inside.
  `packages/envoy/internal/contracts/dispatch_tools_generated.go` carries the same text.
