kind: Added
body: |-
  `LegionStateResponse` names the four keys daemon API contract 72 adds to
  `GET /legion/v1/state`: `mergeJumps`, every live jump mark of the project; `mergeHolds`, the
  project's merge hold list; `mergeHeld`, every issue whose merge a hold is keeping back; and
  `mergeJumpRecords`, the newest jump of each repository with the queue it went ahead of. All
  four are optional, because the route serves a caller whose pod records an older contract a body
  that carries none of them.
  `LegionMergeJumpRequest`, `LegionMergeJumpClearRequest` and `LegionMergeHoldsRequest` are the
  three controller routes the marks are set through.
