kind: Added
body: The shared reference table holds the three party addresses — `dispatch://agent/<session id>`, `dispatch://role/<token>` and `dispatch://person/<login>` — and the component form the Go reader already took, so both readers of a text agree on all thirteen kinds Dispatch holds. `DISPATCH_WRITING_BOXES` and `DISPATCH_READING_SURFACES` say which boxes a person writes in and which surfaces show a stored record, each row carrying how a test reaches it and, where it is excluded, why. `dispatch_search` takes a `kind`.
