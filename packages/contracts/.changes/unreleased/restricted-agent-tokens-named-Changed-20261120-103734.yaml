kind: Changed
body: |-
  The Dispatch HTTP API document says what a restricted member may do on
  `POST /api/v1/credential-requests/machine-lookup`, `.../{id}/approve` and `.../{id}/deny`: decide
  a machine login of their own, at their browser alone; on `GET /api/v1/machine-logins` and
  `POST /api/v1/machine-logins/{id}/revoke`: list and revoke their own machine logins, at their
  browser alone; and which refusal each of their tokens gets there. It also says that taking a
  restricted member off a project's access list, when no other project's list names them, records
  that Dispatch owes the secrets broker the revocation of their machine logins.
