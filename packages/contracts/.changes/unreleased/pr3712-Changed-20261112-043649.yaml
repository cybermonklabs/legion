kind: Changed
body: |-
    The daemon API contract is 107. A Legion issue carries four more keys: `repoBefore` and
    `repoCorrectedAt`, the repository the issue left and the moment the daemon applied the
    correction, and `repoChangePending` and `repoChangeReason`, a repository Dispatch has named that
    the daemon has not applied and why. Each is optional, and an issue no correction has reached
    carries none. The daemon strips the four from the state it serves a plugin below 107.
    `LegionOwedRequest` and `LegionOwedResponse` are the two bodies of the claim route
    `POST /legion/v1/claims/owed`: the claim token, session and secret, answered with `owes` and
    `work`, whether the claim owes work now and what that work is called. `work` is empty exactly
    when `owes` is false.
