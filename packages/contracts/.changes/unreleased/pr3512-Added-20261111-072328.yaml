kind: Added
body: 'Four tools for the author of a post: dispatch_edit_comment, dispatch_delete_comment, dispatch_edit_message and dispatch_delete_message. dispatch_read takes history, which lists each body an edit or a delete replaced. Three event kinds join the union: comment.deleted, message.edited and message.deleted.'
