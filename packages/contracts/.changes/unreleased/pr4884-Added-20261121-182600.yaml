kind: Added
body: '`schemas/dispatch-openapi.json` and `src/dispatch-api.generated.ts` carry `refuse_open_foreign_children` on `UpdateIssueInput` and the 409 `ForeignChildOpenError` body of `PATCH /api/v1/issues/{key}`, which names each open child of another project that holds an acceptance write. Every status a route answers with a richer refusal body now also admits the plain `ErrorBody`, as an `anyOf`, since the same handler writes plain refusals at that status: the 409 of `POST /api/v1/issues` reads `IssueDuplicateError | ErrorBody`, and so do the claim routes'' 409, the edit routes'' 409 and `PUT /api/v1/me/issues/{key}/state`''s 409. Code that read such a status as the rich body alone now narrows on `code` first.'
time: 2026-11-21T18:26:00.000000000Z
