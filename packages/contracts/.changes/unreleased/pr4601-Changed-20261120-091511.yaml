kind: Changed
body: The descriptions of `dispatch_issue_update` and `dispatch_claim`, and the doc of whoami's `scopes`, say that Dispatch refuses a Legion issue's status write from a credential without the `person` or `legion-status` scope where `DISPATCH_LEGION_STATUS_SCOPE` is on, and that a Legion daemon's own broker token answers `["legion-status"]`.
