kind: Added
body: |-
  `legion-api.ts`: each issue of the state may carry `branchRefused` (`legionBranchRefused`), the refusal for good of its branch row. Its members are `row`, `write`, `kind`, `reason` and `at`, under the branch-refused entry. Every member is optional, and each word is a string and not an enum. So a kind a later daemon adds is read rather than refused.
