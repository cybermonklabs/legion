kind: Added
body: |-
  Daemon API contract 212: `LegionWaitRequest`, `LegionWaitResponse`, `LegionWaitNewsRequest` and
  `LegionWaitNewsResponse` for `POST /legion/v1/claims/wait` and `claims/wait-news`; each claim
