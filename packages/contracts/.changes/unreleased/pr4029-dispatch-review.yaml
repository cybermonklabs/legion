kind: Added
body: |-
  The `dispatch_review` spec: `issue`, `artifact` (the issue's spec by default), `version` (an
  integer from 1), `verdict` (`approved` or `changes_requested`) and `reason`, which
  `changes_requested` requires. The OpenAPI document and `dispatch-api.generated.ts` gain
  `POST /api/v1/artifacts/{id}/versions/{number}/reviews`, which takes the review route's body
  and can answer `409 REVIEW_VERSION_MOVED`.
custom:
    Issue: pr4029
