kind: Fixed
body: '`Version` carries `token`, a file''s or an image''s version token, in `schemas/dispatch-openapi.json`, `src/dispatch-api.generated.ts` and `versionFields`. The `dispatch_doc_read` and `dispatch_artifact` descriptions, and the upload precondition''s, say that a read of a file prints its version''s token and that an upload replacing a file names it, as one replacing a document does.'
