kind: Added
body: '`readerStep` and `countReaderSteps` (`reader-steps.ts`) count the turns of the reference readers'' loops (`referenceSpans`, `trimReference`), so a test holds a reader to one pass over its text by a count and not by a clock; outside a count a step does nothing. `referencePattern` is exported for the same tests.'
