kind: Added
body: |-
    `dispatch_artifact` takes a `precondition` naming the token of the version the upload replaces, which `dispatch doc-read` prints, and `CreateArtifactInput` carries it to the upload route. It is the document token alone: an upload rewrites the whole tree, so the block tokens `dispatch_doc_edit` takes mean nothing there and the server refuses them. An upload over a document the owner already holds under that name must name it, and one naming a token behind the live document is refused `409 PRECONDITION_FAILED`, whose `current.version` (new on `EditPreconditionCurrent`) names the version the document stands at. A first upload under a name the owner holds nothing under names none.
time: 2026-11-08T00:00:00.000000000Z
