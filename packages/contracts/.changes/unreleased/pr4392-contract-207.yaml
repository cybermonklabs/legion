kind: Changed
custom:
  Issue: pr4392
body: |-
  Daemon API contract 207. `LegionStateResponse` takes an optional `dispatchCredential`, which a
  daemon under `dispatch_token_broker` writes. It holds `session`, the session of the daemon's own
  Dispatch calls, `transitionLaunches`, the launches since the daemon's boot that carried the
  transition token, `lastTransitionLaunchAt`, when the latest of them was sent (`null` before the
  first), and `liveLaunchesWithDispatchToken`, the live launches whose start carried a Dispatch
  token. The state fixture (`state.json`) carries it, and `version.json` carries 207.
