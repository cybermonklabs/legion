kind: Added
body: |-
    `askOpenerLines(markdown)` returns each line of a document that opens an ask block (`:::ask{`), without its indentation and the containers it is in, read as pmdoc's parser reads the document's blocks: a quote's `>`, a list item's marker (`-`, `*`, `+`, or a number and `.` or `)`, followed by a space or a tab) or content columns, and a footnote definition's label `[^label]:` or four columns. A label is not blank and holds no unescaped bracket, and a backslash before a `]` makes it part of the label. An opener counts only within three columns of its containers: a line four columns or more past them, such as a later line of an inline code span, opens no block. It skips every line of fenced code (a fence of backticks or tildes, opened within three columns of its containers), of indented code, and of the front matter a document opens with, so an opener quoted in any of them is not read as one. `askOpeners(openers, blockId)` keeps the lines of those that open the ask block `blockId`, and `askOpenerBlockId(line)` reads the id an opener names, written as `typedBlockIdAttribute` writes it. The web's reader of the answer a Dispatch of the release before writes on an ask block's opening line, `dispatch doc-read`'s answer lines and `dispatch request-approval`'s check for open ask blocks read the opening lines through them.
    `readAskBlocks(lines, reading)` (`dispatch-block-reader.ts`) is the one reader of a Dispatch document's blocks in TypeScript, read as goldmark and pmdoc read them, and `askOpenerLines` reads through it. It returns each ask block as its opening line, from the first colon on, the frame that `reading.typedOpener` gave for that line, and, where `reading.bodies` is set, the lines the block holds. It reads front matter where `reading.frontMatter` is set, and a typed block's opening line with `reading.typedOpener`. `runOf` and `directiveNameChar` are exported beside it, and envoy-client reads them from here. The ask gate in packages/envoy-client reads its ask blocks through it too, in place of its own copy.
