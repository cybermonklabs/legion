kind: Changed
body: 'Daemon API contract 63: every Legion launch now carries the issue it serves as `legion.issue` and the role it runs as `legion.role` in `OTEL_RESOURCE_ATTRIBUTES`, after the attributes the deployment''s own `runtime.kubernetes.pod.env` or `runtime.tmux.pane_env` sets, so a pod''s spend splits by the issue it was spent on. The project controller''s launch serves no issue and carries the role alone. The `daemonApiVersion` fixture this package pins the plugin and the daemon to declares 63.'
