kind: Added
body: 'The contracts carry a credential''s list of projects: `AgentToken.projects`, absent when the token lists none, and `projects_hidden`, true at the person''s own browser on a token that lists a project they no longer see; `projects` on `CreateAgentTokenInput` and `UpdateAgentTokenScopesInput`; `projects` on `WhoamiAgent`, absent when the credential lists none, while the browser''s `WhoamiUser` carries no list; and `WhoamiAgent.private_projects`, those of its `projects` the caller must treat as private (a private project, one the credential no longer sees, one that names no project), absent when there is none. `MAX_TOKEN_PROJECTS` is the most projects one personal agent token lists, generated into Go as `contracts.MaxTokenProjects`. `ProjectAccessChangedEventPayload` holds only `project` and `change`. `GET /api/v1/access-groups` answers `AccessGroupPage`, `{groups, next}`. `Actor.project` stays optional so a reader takes an event an older server stored or answers; this server writes and answers none.'
