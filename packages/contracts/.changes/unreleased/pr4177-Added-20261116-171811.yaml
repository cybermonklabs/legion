kind: Added
body: 'The contracts carry a credential''s list of projects: `projects` on `WhoamiAgent`, absent when the credential lists none, while the browser''s `WhoamiUser` carries no list; and `WhoamiAgent.private_projects`, those of its `projects` the caller must treat as private (a private project, one the credential no longer sees, one that names no project), absent when there is none.'
