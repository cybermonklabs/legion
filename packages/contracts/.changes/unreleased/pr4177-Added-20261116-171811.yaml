kind: Added
body: 'The contracts carry a credential''s list of projects: `AgentToken.projects`, absent when the token lists none, and `projects_hidden`, true at the person''s own browser on a token that lists a project they no longer see; `projects` on `CreateAgentTokenInput` and `UpdateAgentTokenScopesInput`; and `projects` on `WhoamiUser` and `WhoamiAgent`, absent when the credential lists none, where `WhoamiAgent.project` is deprecated and is the one key of a one-key list, null otherwise. `ProjectAccessChangedEventPayload` holds only `project` and `change`. `GET /api/v1/access-groups` answers `AccessGroupPage`, `{groups, next}`. `Actor.project` stays optional so a reader takes an event an older server stored or answers; this server writes and answers none.'
time: 2026-11-16T17:18:11.405791008Z
