kind: Changed
body: |-
  Daemon API entry `20261125162422` adds `LegionProjectReleaseRequest` and
  `LegionProjectReleaseResponse` in `legion-api.ts` for `POST` and `GET /legion/v1/operator/project/release`.
  The state can include `projectRelease`, the project's newest release. The daemon omits it for
  callers below the entry's contract, including pods whose claims place them below contract 193.
  No plugin code reads the release, so every field of it is optional to the reader. Its
  `outcome`, `endedBy` and a stopped claim's `ended` are enums of the words the daemon writes,
  `LEGION_RELEASE_OUTCOMES`, `LEGION_PROJECT_RELEASE_ENDERS` and `LEGION_RELEASED_CLAIM_ENDS`, each
  held to the daemon's own list in `fixtures/daemon-api/project-release-words.json`, and its six
  enumerated fields are rows of `fixtures/daemon-api/contracts/20261125162422_project-release.json`. A
  stopped claim's `ended` takes each suspension source, the controller's `controller` among them. A
  claim's `suspendedBy` on the operator routes gains `project_release`, a claim the project release
  stopped, which the daemon's next boot starts again. The agent actions' `suspendedBy` and
  `suspensionHeldBy` do not take it, since no agent action's answer names it: the controller's
  `stop` and `suspend` of such a claim answer it `retired` or suspended by `controller`, its
  `retry` and `resume_agent` are refused `PROJECT_RELEASED` while the release holds, and after the
  daemon's boot, until the boot's start of the claim runs, `resume_agent` resumes it and answers
  `launching`. One race is left: a `retry` or `resume_agent` the daemon let through just before a
  release began can read its answer after the release's suspension landed, and that answer names
  `project_release`, which the plugin's parse refuses. The release's refusal while the project is
  paused or a pod a pause stopped is still held is `PROJECT_PAUSED` with `heldPods` (fixture
  `project-release-paused.json`), and a pause while a project release runs is refused
  `PROJECT_RELEASING` (fixture `project-pause-releasing.json`).
