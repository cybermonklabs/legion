kind: Changed
body: |-
  The daemon API schemas say what the daemon API entry 20261125211005 (`wake-due-earliest-moment`)
  changes: the `dueAt` of each wake of the state's `wakesWaiting`, and of a claim view's `wake`, is
  the earliest moment the daemon's wake pacing lets that wake out, as its queues stand at the read.
  A waiting wake holds a place in a queue and no moment of its own, so the wake runs at `dueAt` or
  later, and two reads can name two moments. No field is added, removed or retyped.
