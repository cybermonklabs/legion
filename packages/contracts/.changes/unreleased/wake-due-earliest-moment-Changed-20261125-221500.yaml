kind: Changed
body: |-
  The daemon API schemas say what the daemon API entry 20261125211005 (`wake-due-earliest-moment`)
  changes: the `dueAt` of each wake of the state's `wakesWaiting`, and of a claim view's `wake`, is
  the daemon's wake pacing's estimate, at the read, of the moment it lets that wake out, as its
  queues stand. A waiting wake holds a place in a queue and no moment of its own. A change to the
  queues or to the pace can move that moment earlier or later, so two reads can name two moments:
  for example, a wake ahead of it in its own queue that leaves moves it earlier, and a wake that
  joins and is let out ahead of it moves it later. No field is added, removed or retyped.
