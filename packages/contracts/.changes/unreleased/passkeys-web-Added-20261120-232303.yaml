kind: Added
body: |-
  The passkey ceremonies at Dispatch's outside origin have shapes of their own:
  `PasskeyEnrollmentOptions` (the enrollment's `PasskeyCreationOptions` and the link's
  `PasskeyInvitation`, the project it is for and the owner who made it), `PasskeyRequestOptions`,
  `PasskeyRegistration`, `PasskeyAssertion`, `PasskeyEnrollmentStart` and `PasskeySignedIn`, with
  `PASSKEY_REFUSALS` (`PasskeyRefusal`), the codes a ceremony is refused with, and
  `AUTH_SIGN_IN_PASSKEY`, the `sign_in` of the outside origin's `401 NO_IDENTITY`. The generated
  `ProjectAccess` gains `open_invitations` (`OpenInvitation`: `{email, made_at, expires_at}`), the
  owner's list of the project's links that can still enroll someone, and `InvitationAnswer`, the
  owner's Invite answer, carries `made_at`.
