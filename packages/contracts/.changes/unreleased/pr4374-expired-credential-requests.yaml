kind: Added
custom:
  Issue: pr4374
body: |-
  A credential-request row (`CredentialPendingRow`) carries optional `state`, `pending` or
  `expired`, and `expires_at`. A row with no `state` comes from an older broker and is pending.
  `POST /api/v1/credential-requests/{id}/dismiss` dismisses an expired request and answers
  `DismissResponse`.
