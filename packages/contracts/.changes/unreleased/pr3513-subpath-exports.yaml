kind: Changed
body: |-
  Every module a consumer reads a value from is published as a subpath of this package, beside
  the index: `actor-label`, `agent-stream`, `claim-holds`, `dispatch-api`,
  `dispatch-api-constants`, `dispatch-block-ref`, `dispatch-href`, `dispatch-text-references`,
  `dispatch-text-rules`, `dispatch-tools-constants`, `legion-roles` and `related-forms`, each one
  built into `dist/` for a consumer that resolves the package's `default` condition. A consumer
  that reads one value through the index pulls every module of the package into its bundle,
  because a bundler may drop none whose top level builds anything, and the Dispatch dashboard was
  carrying a reference table and a schema library it reads nothing from.
  The constants, limits, header names, codes and small functions of the two Dispatch contracts
  live in `dispatch-api-constants` and `dispatch-tools-constants` now, so a reader that needs one
  of them takes no zod schema with it. `dispatch-api` and `dispatch-tools` re-export those two
  modules whole, so an import of either, or of the index, answers exactly what it answered
  before: nothing is renamed and nothing leaves the index.
