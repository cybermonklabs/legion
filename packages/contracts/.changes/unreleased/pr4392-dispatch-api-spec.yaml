kind: Added
custom:
  Issue: pr4392
body: |-
  `dispatchToolSpecs` gains `dispatch_api`, the thirty-sixth spec, whose one argument `path` is a
  route under `/api/v1` with its query. Its rule refuses a path that does not begin `/api/v1`, a
  path that holds a space, a backslash, a `#` or a character outside printable ASCII, and a path
  with a `.` or `..` segment, plain or percent-encoded. Each refusal names the path.
