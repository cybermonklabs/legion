kind: Changed
body: |-
  `LegionClaimRequest` says which claims each of the daemon's two claim recoveries reaches, and
  which refusal each gives, at daemon API contract 103. `fresh_session` reaches a claim stored
  working that no process stands behind, which the daemon tells from a claim in a turn by reading
  that claim's process at the request. `CLAIM_IN_A_TURN` is for a claim whose process that read
  finds running, and one whose session is being compacted. A claim whose process the runtime
  would not answer for, and one that records no process to read, take `CLAIM_UNSETTLED`, each
  with nothing changed, and so does a claim that moved under the request: at `fresh_session`, one
  a later view finds no longer working or a second read finds gone once more, and at the
  compaction, one the machine refused as working that a later view finds no longer working.
  The compaction's `CLAIM_NOT_RUNNING` covers the claim no process stands behind as well as a
  suspended, failed or retired one. `LegionFreshSessionResponse`'s `phaseNotRestarted` now
  carries either the workflow's refused phase restart or, where the request stopped the claim, the
  machine's refusal of the forget of its session or of its start, with the state that refusal
  left the claim in: a suspended claim is one a fresh session asked again starts, and a claim in
  any other state is read in `read_state` first. No field of the three shapes changed.
