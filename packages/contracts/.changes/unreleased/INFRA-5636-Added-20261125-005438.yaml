kind: Added
body: |-
  The daemon API schemas describe the contract entry 20261125181047_p-0-bound: the state's
  `admission` carries `p0Holders`, how many slot holders are P0 and hold their slot outside the cap,
  and `p0Bound`, the P0 bound in force (`bound`, null for none), `legion.yaml`'s (`configured`) and
  the value set while the daemon runs (`live`, with who set it, when and why); each issue carries
  `resolvedPriority`, the priority Dispatch resolves it to (a number, or null for none), and
  `priorityFrom`, the issue that priority comes from. New schemas: the controller's and the
  operator's set and clear of the P0 bound (`LegionProjectP0BoundRequest`,
  `LegionProjectP0BoundClearRequest` and the operator's two) and their answer,
  `LegionP0BoundResponse`.

  `schemas/dispatch-openapi.json`, and so the `LegionBoardHeader` type rendered from it, carries
  `p0_holders` on the header of Dispatch's Legion board (`GET /api/v1/projects/{key}/legion/board`):
  the daemon's number of P0 holders, an integer, or `null` where the daemon's newest recorded state
  gives none. The key is always present.
