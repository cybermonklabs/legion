kind: Fixed
body: The Dispatch tool descriptions name the unit their caps count, UTF-16 code units, and a schema refusal of a string reads `trim 2 UTF-16 code units (1002/1000)`, the number to trim in that unit, where it called those counts characters; a string under its minimum reads `1 of at least 2`. The contracts guide says once that the caps count UTF-16 code units, so a character outside the Basic Multilingual Plane counts two. No cap changes.
