kind: Changed
body: |-
  `LegionFreshSessionResponse`'s text says that an empty answer means the start is under way and
  `read_state` shows how it ended, and that `phaseNotRestarted` also names a start that waits for
  an admission slot and a start refused after the session was left behind.
  `LegionAgentActionResponse` gains `phaseNotRestarted`, which the controller's `retry` writes
  where a phase worker's start waits for its issue's admission slot. The daemon API fixtures hold
  the claim-start contract entry.
