kind: Changed
body: |-
  Every field of a daemon answer that no plugin code reads is optional, so a daemon that stops
  serving one is read rather than refused. `LEGION_ANSWER_READS` declares the set of fields
  plugin code takes the value of, over the schemas the client parses, and a census in
  `@legion/pi-shared` holds the two to each other: a field the set does not name is optional, a
  name of the set is read by the consumer sources, and a field those sources read is in the set.
  Two answer schemas arrive with daemon API contract 89: `LegionIssueRecordResponse`, the body of
  the per-issue record route, and `LegionHealthResponse`, which names the project the daemon
  serves. Four fixtures arrive with them: `answers.json`, the daemon's table of the answers a
  plugin parses; `enumerated-fields.json`, its table of the fields a plugin parses with a strict
  enumeration, each value with the contract it arrived at; `contract-shapes.json`, the key
  paths each answer carries at each supported contract and, for each of those enumerated fields,
  the values that contract admits; and `request-shapes.json`, the field paths of every request a
  plugin sends, one record per route and contract from contract 89 on. A value refuses a reader
  as a key does, so the daemon serves a value down to a caller whose contract does not admit it:
  a caller below contract 68 reads an `awaiting_person` root's `waitingOn` without `answeredAt`
  and `answeredBy` where a person declined to answer the wait.
