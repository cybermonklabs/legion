kind: Added
body: |-
    Eleven exports for the document websocket, generated into Go beside
    `DOCUMENT_SCHEMA_CLOSE_CODE` so the server and the dashboard cannot drift apart. Nine are the
    closes it refuses a browser with:

    - `DOCUMENT_TOO_LARGE_CLOSE_CODE` (4413) with `DOCUMENT_TOO_LARGE_CLOSE_REASON`
      (`DOC_TOO_LARGE`) is permanent: the update would take the document past a bound of its own.
      Past the 1 MiB of markdown every server write obeys, an update may still carry 8 KiB of new
      content until the document has crept 64 KiB over it, and no update may leave a rendering past
      that creep and larger than before. One apply of a browser's update may also decode only so
      many values. The dashboard drops the refused edit and re-reads the document rather than
      reconnecting into the same refusal.
    - `DOCUMENT_TOO_TANGLED_CLOSE_REASON` (`DOC_TOO_TANGLED`), under the same code: merging the
      update would scan more of the document's items than the room allows one apply to scan, so it
      is refused whole, with nothing of it stored or relayed. The dashboard says "Your last edit was
      not saved: Dispatch could not merge it into this document quickly enough. Your other edits are
      kept."
    - `DOCUMENT_NEEDS_REBUILD_CLOSE_REASON` (`DOC_NEEDS_REBUILD`): the document cannot take the
      update until it is rebuilt, because the update would carry the room's encoded state past the
      most one room may hold, or the document past the structs ygo decodes in one update (counting
      the items a delete inside a run splits), or because its edit history has used up what the
      room lets its applies scan. The dashboard offers that rebuild beside the notice.
    - `DOCUMENT_REBUILT_CLOSE_REASON` (`DOC_REBUILT`): the browser still holds the edit history a
      rebuild of the document replaced, so its update is refused whole and the edits it typed
      against that history cannot be kept. The dashboard says "Someone else rebuilt this document,
      so the edits you had not sent could not be kept. Dispatch has reloaded the rebuilt document."
      and offers no rebuild, since the route answers a rebuild of a document just rebuilt with
      `409`.
    - `DOCUMENT_UPDATE_REFUSED_CLOSE_REASON` (`DOC_UPDATE_REFUSED`): the update holds content the
      document does not take (bytes the decoder refuses, an embed or raw binary content, or a root
      the Proof editor never writes), or it leaves a document the server cannot render where it
      rendered before. Nothing of it is stored or relayed, and the dashboard drops the refused edit
      and says "Your last edit was not saved: it holds content this document does not take."
    - `DOCUMENT_CLIENT_ID_REFUSED_CLOSE_REASON` (`DOC_CLIENT_ID_REFUSED`): the update carries an
      edit under a client id that is not the sender's, or an edit at clocks another person claimed
      first that differs from what the document holds there. Nothing of it is stored or relayed.
      The dashboard drops every saved edit under that id, says how many were not saved, re-reads
      the document and takes a fresh client id with it. A sync step 2 is refused the same way when
      it hands back another person's edit the document does not hold; it names no saved edit, so
      the dashboard drops none, says it has reloaded the document, and sends the person's saved
      edits again.
    - `DOCUMENT_BUSY_CLOSE_CODE` (4503) with `DOCUMENT_BUSY_CLOSE_REASON` (`DOC_BUSY`) is
      transient: most often the memory budget over the documents Dispatch holds open is full and no
      room can be closed. The dashboard keeps the edit it could not send and retries on its own
      backoff.

    The other two give each page its client id. `DOCUMENT_CLIENT_ID_PARAMETER` (`client_id`) is
    the query parameter a page presents the client id it holds for the document under, empty when
    it holds none yet. `DOCUMENT_CLIENT_ID_MESSAGE_PREFIX` (`dispatch.client_id:`) starts the
    stateless message the socket is sent first, followed by the decimal client id Dispatch gives
    the page.

    The OpenAPI schema adds `near_decode_cap` and `near_decode_cap_reason` to a document's text
    read (`ArtifactText`), describes the rebuild route's wider reach, and carries the shapes of
    eight document test hooks a server mounts only with its test hooks on.
