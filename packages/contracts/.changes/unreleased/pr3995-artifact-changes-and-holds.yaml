kind: Added
custom:
  Issue: pr3995
body: |-
  The generated Dispatch API types (`dispatch-api.generated.ts`) carry
  `GET /api/v1/artifacts/{id}/changes`, whose answer is `ArtifactChanges` with its
  `ArtifactSectionChange` and `ArtifactBlockChange` entries, and `holds: null | boolean` on
  `IssueDesignGate`, the entry `PUT /api/v1/issues/{key}/design-gates` takes and the issue read
  returns.
