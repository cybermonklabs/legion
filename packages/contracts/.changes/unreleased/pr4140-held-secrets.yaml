kind: Added
body: |-
    `@legion/contracts/held-secrets` is the backstop under the rules of `log-text`: the secrets a
    process holds (`holdSecret(value, lapsesAt?)`; a value given the time it lapses is held an
    hour past it, `HELD_PAST_LAPSE_MS`, then forgotten, so a process that trades for tokens all
    its life holds those of its last hours, not every one), and `scrub(text)`, which takes each
    held value of 10 or more characters, and each run of 10 or more of its characters, out as
    `<withheld>`; a text that
    holds none comes back as itself. It looks each of a line's 10-character windows up in one set
    of every held value's windows, so its cost grows with the line, not with the secrets.
    `scrubError` scrubs an error's message, stack and causes in place, and every string field of its
    own with the plain objects, arrays and errors it holds (an `EnvoyApiError`'s
    `details.responseBody`), since Bun's console prints those beside the message.
    `scrubProcessStreams` passes a process's stdout and stderr writes through the scrub.
    `holdUrlUserinfo(url)` holds a configured URL's user and password, as written and decoded, and
    the `Authorization: Basic` value Bun's fetch builds of them; a pair whose base64 is under 10
    characters (a `user:password` under 7) is not held. What holds a value and what scrubs a line
    is named by each client's own changelog; broker-client, which keeps none, holds the subject,
    actor and access tokens of every trade until an hour past each one's lapse (a JWT's `exp`, the
    grant's `expires_in`, or the trade for a token whose lapse cannot be read), a sign-in's
    refresh token and client secret, and the user info of the broker's, the issuer's and Google's
    URLs, and scrubs the text of a broker
    refusal (`BrokerRefusedError`) where the error is made. It prints the exchange policy's refusal
    of a subject token only where it is one of the policy's own sentences, each slot the shape of
    what fills it, as the Go refusal corpus writes them; any other wording is withheld. It shows a
    broker's or an issuer's OAuth error code only where it is one of the 12 the clients handle
    (`KNOWN_OAUTH_ERROR_CODES`: RFC 6749's, RFC 8693's `invalid_target` and RFC 9449's two, as the
    broker's library writes them), and any other as `unrecognised error code (<N> chars)`, since a
    code is a peer's choice of characters.
