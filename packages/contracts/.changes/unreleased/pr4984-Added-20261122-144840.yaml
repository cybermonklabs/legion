kind: Added
body: |-
  `DispatchServiceErrorShape` gives `statements` (`SpecRequestStaleNode`: the stale nodes of a
  `409 SPEC_REQUEST_STALE`) and `problems` (`SpecChangeProblem`: each node and the rule it breaks
  in another refusal of the approved spec). The generated `ChangeRequestRead` gives `digest` and
  `verification_digest`, and the generated `ChangeRequestNode` gives `text` and `approved_text`.
