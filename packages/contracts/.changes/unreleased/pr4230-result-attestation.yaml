kind: Changed
body: |-
  The statement types of a CI job's result are named for both results routes: `ResultAttestation`, `ResultPredicate`, `ResultTest`, `ResultRun` and `ResultRecorder` (before, `SpecCheckAttestation`, `SpecCheckPredicate`, `SpecCheckTest`, `SpecCheckRun` and `SpecCheckRecorder`). `CheckResult` gains `branch`, `attestation`, `not_counted` and `at_branch_head`, and `CheckBlock` gains `branch_heads` and `recorded_results`; `CheckBasis` gains the kind `branch_head`, and `CheckPassStands` gains `reason` and `subjects` (`PassStandsSubject`), the state of each head a `before_merge` check's pass must stand at, with the `roles` whose pass counts there and the `results` that decide it, and `results`, the newest result that decides a check compared with a branch. The reason `pass_and_fail` is a pass and a fail that count at one commit of a `before_merge` check, from any role. `checkWithNewerFields` puts `branch_heads`, `recorded_results` and `at_branch_head` back into `compared_with`, `results` and `commit_stands` for a reader of this build. The `dispatch_result` and `dispatch_results` tools say that a CI job records the result of a check its `ci_check` names, and the issue form of `dispatch_results` takes `json`.
  `PassStandsSubject` gains `ci`, the read of a check CI proves at that head, and the reason `read_failed`, a head whose check runs could not be read. `CheckBasis` gains `merged`, set on the final head of a merged pull request. The `dispatch_results` tool gives the line of each head, the count of the merged pull requests, the newest result of a check compared with a branch, and the read of a check CI proves at each open head.
  `CheckBasis` gains `repo`, the `owner/repo` of a pull request of another repository than the one the check's issue resolves to. The `dispatch_result` tool says that Dispatch asks the repository of each open or merged pull request of the issue, after the issue's own, whether it holds the commit, and that `400 RESULT_COMMIT_UNKNOWN` names each repository.
  `CheckPassStands.reason` gains `read_failed`, a read that decides the check did not answer: the check runs of a check CI proves with no subject, or the merge time of a merged pull request, where the issue has none open and Dispatch cannot tell which merged one merged last.
  The `json` and `as_of` arguments of the `dispatch_results` tool say that at a past time with `json`, standard output is still the JSON alone, and the `Left out at <time>:` line goes to standard error.
  The package exports `CI_RESULT_ID_PREFIX`, what the id of a result Dispatch derives from a check's CI run begins with, and `derivedResult`, which picks from a check's results the one that the read in its `ci` derived, by `ci.result`.
