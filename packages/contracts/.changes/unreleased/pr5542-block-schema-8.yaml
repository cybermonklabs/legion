kind: Added
body: |-
    The block schema's types follow version 8 of the schema (above #5839's version 7): `BlockTypeSchema.parents` names the typed blocks a block of the type stands in and nowhere else, `BlockAttributeSchema.markdown` is false for an attribute that markdown never carries, and `BlockAttributeKind` gains `ask`, an attribute that names one ask of the block's own issue as `dispatch://<ISSUE>/ask/<id>`. `schemas/block-schema.schema.json` says the same.
