kind: Added
body: |-
    A handoff completion may name checkOpenedAt to report a production check's look, with no
    commit or handoff record. The request accepts the full RFC3339 opening time. The check's
    role and last-look flag are optional in the plugin reader because no plugin reads them to
    decide which call to send.
