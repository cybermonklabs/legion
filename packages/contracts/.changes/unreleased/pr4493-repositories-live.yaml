kind: Changed
custom:
  Issue: pr4493
body: |-
  `legion-api.ts`: the `repositories` block of the state is `{live, caches, withoutWebhookApp}` at daemon API contract 191, one `live` entry for each repository that a live record names. Each entry has `repo`, and `servedAs`, `apps`, `readError` and `cache`, each one only when it holds something. `withoutWebhookApp` is required and keeps its contract 152 shape: `{repo, reason}` for each live repository that Dispatch's webhook App is not known to be installed on. It is the only place the block reports the webhook App, so a `live` entry has no `webhookApp`.
