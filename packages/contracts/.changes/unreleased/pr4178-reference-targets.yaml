kind: Added
body: |-
  `ReferenceTarget` and `ReferenceTargets` are generated from `GET /api/v1/reference-targets`,
  the batched reference read, as every shape of the route table now is: one member per
  reference, each with its kind, the words a reader is shown for its target and whether the
  target is gone. `ReferenceTarget` carries the optional `ambiguous`, true on a member whose
  short id two or more items carry: that member is gone, and every other member is answered.
  `IssueChild` gains the optional `needs`, the keys of the issues it waits on as
  `Issue.blocked_by` lists them, and the optional `claim`, in `Issue`'s own shape.
  `RequirementCoverage`, `CheckBlock` and `ReferenceTarget` carry the optional `text_tree`: a
  block's whole text, links and references kept, which a server answers to a caller that sent
  `Dispatch-Trees: 1`. `REFERENCE_TARGETS_MAX` (256) is the most references one
  `GET /api/v1/reference-targets` may name, generated into Go as `contracts.ReferenceTargetsMax`.
