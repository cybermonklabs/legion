kind: Changed
body: |-
  `IssueRoleHolderRecord.role`, and so the role of each holder of `issue.role_holders_changed`, is
  a role of the issue: one of Legion's six or a role the deployment defines, any name of
  `^[a-z][a-z0-9-]{0,31}$` but `controller` (`legionStepRole`), and its type is `string`. Dispatch
  stores a holder of a deployment's role, and a reader that took only the six refused its payload.
