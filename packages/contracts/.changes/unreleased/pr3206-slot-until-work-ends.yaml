kind: Changed
body: '`admission.active` of the daemon state now names every issue the daemon has started and has not finished: an issue holds one of the cap''s slots from the moment the daemon starts it until its work is past its review, so a root waiting on a person and an issue in `held` whose hold the record names no phase past that review for are both in that list. An issue in `awaiting_merge` is in neither `admission.active` nor `admission.waiting`. No field is added, removed or renamed, and the daemon API contract stays 58.'
