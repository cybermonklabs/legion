kind: Added
body: |-
    `LauncherCredentialResp`, the row of `GET /api/v1/machine-logins`, has a `person` field: the
    person a person's pod login acts for (a pod whose Kubernetes account the broker's
    `BROKER_POD_OPERATORS` maps to that person), and null on every other login.
