kind: Changed
body: |-
  The membership answer's query takes `account=none` and `credential_created_at` (Unix seconds)
  beside `account_issuer` and `account_subject`. A question that says which account the
  credential records carries `holder`; one that says nothing of it answers as before, with no
  `holder`, and `credential_created_at` with no account and no `account=none` is 400. A credential
  of another issuer, or one recording no account made before Dispatch recorded the person's
  account, within five minutes after, or at a time not given, is not the holder.
time: 2026-11-17T18:58:02.611128146Z
