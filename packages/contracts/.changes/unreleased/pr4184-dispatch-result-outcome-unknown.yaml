kind: Added
body: |-
  The `dispatch_result` tool's description says that a CI job's write that reached Dispatch with no answer that says whether it stored the result prints `{"write_outcome_unknown":"<code>"}` and exits 1: the result may be stored, and a second run is safe, because Dispatch keeps each result. It also says that a call the broker's rate limit (429), a broker that cannot answer the trade (a 5xx, or no answer in 30 s) or Dispatch's check of the job's token (429 BROKER_TOKEN_RATE_LIMITED, 503 BROKER_UNAVAILABLE) turns away before anything is stored is asked again after the answer's Retry-After, or a second, within the call's one bound: 60 s from its start, which the runner's token request, the broker's trade and the write all run under, with no round started in its last 7 s. A call turned away until then ends with the last answer, its code named, and exits 1; a bound that ends in the trade says which part of the trade and that nothing was written.
