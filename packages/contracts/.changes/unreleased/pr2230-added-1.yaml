kind: Added
body: |-
  `LegionAgentHandoffSchema` and `legionAgentHandoffSubject(project, session)`: the message the
  Envoy listener hands a stopped Legion agent's daemon in place of refusing or dropping it, while
  that agent's project states that it answers, `{original_topic, target_session, role_token,
  project, envelope}` with the envelope as it would have been delivered, on
  `notifications.legion.<project>.agents.<session>`.
