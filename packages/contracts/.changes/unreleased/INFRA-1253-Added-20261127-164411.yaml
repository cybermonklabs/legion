kind: Added
body: |-
  `IssueTreeDecision`, the `decision` member of a tree read's node, carries the optional, nullable
  member `waiting_change` (`IssueTreeWaitingChange`: `comment_id`, `created_at`), the Change the
  decision waits on. A Dispatch that does not know it sends none.
