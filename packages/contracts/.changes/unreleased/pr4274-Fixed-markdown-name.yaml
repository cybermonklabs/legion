kind: Fixed
custom:
  Issue: pr4274
body: |-
  The `dispatch artifact` rule texts (`PATH_KEEPS_BYTES`, `ARTIFACT_CONTENT_NAME_RULE`) say that a
  name ending in `.md` or `.markdown` makes a `--path` upload Markdown whatever the path, that a
  name with any other extension stores the file as its bytes whatever the path, and that under a
  name with no extension a path that does not end in `.md` or `.markdown` is stored as its bytes.
  `uploadTypeFrom` says which of the three a name is. It skips a name's trailing extensions of
  digits alone (`rows.jsonl.1` is a `.jsonl` name, `Plan v1.2` has none), and the inline-content
  rule reads a name the same way.
  `uploadExtensionOf` gives the extension that decides, from the name trimmed as Go's
  `strings.TrimSpace` trims it (`goTrimSpace` in `@legion/contracts/go-blank`): an extension holds
  letters, marks, digits, `_`, `-` and `+`, up to 32 characters, so `notes.md/` has none.
  `canonicalRepo` trims an owner and a repository as Go's `strings.TrimSpace` does, as Dispatch
  trims them, and the tool specs refuse a `done` status's reason, a `changes_requested` review's
  reason and a result's `retract` reason that Dispatch would read as blank (U+0085 alone), while
  they let through one Dispatch reads as content (U+FEFF alone).
