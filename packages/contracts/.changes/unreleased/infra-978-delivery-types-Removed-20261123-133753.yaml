kind: Removed
body: |-
  The exported types `ChangeFailureRate`, `DeliveryDeployFlagCounts`, `DeliveryFlagCounts` and
  `TimeToRestore` are removed, with the pending flag state and the change fail rate's upper bound
  they described. A consumer that imports one of them no longer compiles: read the delivery
  measures' `change_failure_rate`, `failed_deployment_recovery` and `deployment_rework_rate` from
  the generated `DeliveryMeasuresResponse` instead.
