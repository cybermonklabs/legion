kind: Added
body: |-
  `dispatch review` from a session whose Dispatch credential is a person's `agent-secrets login` sign-in (no `DISPATCH_TOKEN_FILE`, `DISPATCH_TOKEN` or envoy.json `dispatch.token`, which are read first unless `DISPATCH_TOKEN_BROKER=1`) goes through Cipher's proxy: the session trades the sign-in for a placeholder of the approve capability and sends the review to the Dispatch URL's host through the proxy that release names, with the placeholder as `Authorization: DPoP` and no proof of its own, and the broker swaps in an approve token it holds. A Dispatch URL of another host, scheme or port than the capability's is refused and nothing is sent. On a broker that serves no approve capability the review is refused with the broker's own reason, which says so. A session that trades the machine's own identity, and one with a personal token, send the review directly, as before.
