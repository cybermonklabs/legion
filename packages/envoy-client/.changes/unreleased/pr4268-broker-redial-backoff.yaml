kind: Changed
body: |-
  A session that presents its broker token (`NATS_AUTH=broker`) redials a server it lost, or one
  that refuses it, on a jittered backoff rather than every 2 s: at once, then after waits drawn
  anew between half and all of 4 s, 8 s, 16 s and then 20 s for good (`brokerRedialDelays`,
  `brokerRedialWaitBounds`, `nats-connection`). 1,100 sessions a hub refuses together then ask its
  auth service about 73 times a second once at the cap, rather than 550, under the 1,200 refusals
  a second one replica of the service decided at its 0.5 CPU; and each is back within 20 s of the
  hub admitting again. A seed or no credential keeps the flat 2 s.
