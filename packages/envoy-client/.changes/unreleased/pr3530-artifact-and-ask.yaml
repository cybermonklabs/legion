kind: Changed
body: |-
    `dispatch artifact` refuses an upload under a name the owner already holds, naming that
    artifact, its kind, its newest version, the actor that wrote it and the `--force` that writes
    the next version; and it refuses `--content` or `--content-file` text that storing would
    change, naming the `--path` that stores a file's bytes unchanged. `dispatch comment
    --reply-to-ask` takes an id prefix of at least 8 characters, says whether a prefix matched no
    ask or more than one, lists the issue's open asks, and prints no list of allowed flags for an
    id it could not resolve.
