kind: Added
body: |-
  `dispatch result --project <KEY> --check <id> --verdict pass|fail|could_not_run --commit <sha> [--observed <text>]` records a CI job's result of a check of the spec files with the job's own identity. The job has no session and runs the command under `agent-secrets result-grant`, which gives it the secrets broker's airlock placeholder of its run as `DISPATCH_RESULTS_TOKEN`: the command reads `DISPATCH_URL` and that placeholder, presents it as its one `Authorization` header, `DPoP <placeholder>`, with no proof of its own, and the airlock proxy puts the run's results token in its place. It reads no envoy.json, no bearer and no broker variable, trades nothing, and holds no Dispatch credential; with no placeholder it sends nothing and names `agent-secrets result-grant`. It sends `{commit, check, verdict, observed}` alone to `POST /api/v1/projects/{key}/results`, and nothing else to Dispatch's host, prints the stored result as JSON and exits 0, or prints Dispatch's refusal as `<CODE>: <message>` and exits 1. The stored result names the run and no person, so the job's log holds no person's address. An argument of an issue's record beside `--project`, or `--issue` with it, is refused before any request.

  The command sends at most the 2000 characters of `observed` that a result keeps: a longer text goes as its first 500 characters, a line that says the middle was cut, and its last characters, so a test log of any size still writes its result and keeps the name of the test and why it failed. A NUL goes as U+FFFD, and so does each byte of an `--observed-file` that is not UTF-8. A write that landed with its answer lost prints `{"landed_without_answer":"<code>"}` and exits 0.

  A tunnel the airlock proxy refuses at the CONNECT, which Bun reports as `ERR_PROXY_TUNNEL` with its status line, is an `AirlockTunnelRefusedError` and prints `AIRLOCK_TUNNEL_REFUSED: the airlock proxy refused the connection (<status> <reason>); nothing was sent to Dispatch`: a 407 ends the write at once, and a 5xx, such as a 503, is asked again within the write's bound, as a connection that never opened is. An answer the proxy gives itself inside an open connection before any byte of the write left it (`Cipher-Proxy-Forwarded: false`) is an `AirlockRefusedError` and prints `<Cipher-Proxy-Code>: <the proxy's words>; nothing was stored`, the words quoted through the client's bounded excerpt, as every answer the proxy gives itself is: one line, cut at the excerpt's length, each piece of the placeholder redacted; its 4xx ends the write at once, and its 5xx (`503 GRANT_UNREADABLE`, `502 UPSTREAM_UNREACHABLE`) is asked again within the bound first, since nothing reached Dispatch. Neither is a `write_outcome_unknown`, but where an earlier attempt of the write may have reached Dispatch. An answer the proxy gives itself after the write may have reached Dispatch (`Cipher-Proxy-Forwarded: unknown`: its connection to Dispatch broke after the write was sent, or the grant ended while Dispatch held the call) is asked again under the write's key, and ends `{"write_outcome_unknown":"<Cipher-Proxy-Code>"}` when no answer settles it.

  `dispatch results --project <KEY> --commit <sha> [--check <id>] [--json]` lists the results CI jobs stored at that commit, one line each, newest first: the record number, the check, the verdict, the job, the leg, the run, its attempt and the commit.

  The Go producer's `AGENT_SECRETS_MACHINE_IDENTITY=github-actions` source asks the runner's endpoint (`ACTIONS_ID_TOKEN_REQUEST_URL` with `ACTIONS_ID_TOKEN_REQUEST_TOKEN`) for an OIDC token of `AGENT_SECRETS_MACHINE_AUDIENCE`, or reads it from `AGENT_SECRETS_MACHINE_TOKEN_FILE` where the job has no endpoint. Only the broker trades that identity for this capability. A refused or expired grant runs no child, and a lost grant does not change the identity behind a keyed write.
