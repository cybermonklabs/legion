kind: Changed
body: |-
    `dispatch request-approval` judges an ask block a version of this release writes by the server's read of its ask, and a copy by its source; its refusal says an answer is held on the ask, not in the text, and that Dispatch records the answer's state, and who answered and when, on the block's opening line, which settles into a version on its own about two seconds later and changes no word of the text. It reads a block's state only off the block's own opening lines, so an opener quoted in fenced code or in front matter neither opens a block nor hides one. `dispatch://KEY/decisions` and a pasted Decisions URL read as the issue. Printed labels say ask block for a question to a person. `dispatch doc-read` prints the text as the server answers it, which uploads back unchanged, and one trailer line beside `Document token:` for each answer the server's `asks` names; against a server of the release before, which sends no `asks`, it reads each answer from the attributes of the ask block's own opening line, past its quote, list and footnote markers and within three columns of them, outside fenced and indented code and front matter, and names it under the block's whole id as `askOpeners` reads it. `dispatch doc-edit`'s insert takes `into: "block:<id>"` and writes inside that block.
    A link to an issue's Decisions page (`/issues/KEY/decisions`), whatever its fragment, reads as `dispatch://KEY/decisions`, the issue's, rather than as its `decisions.md`.
