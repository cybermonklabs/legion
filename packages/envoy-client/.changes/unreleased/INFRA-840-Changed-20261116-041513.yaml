kind: Changed
body: |-
  A session in a pod whose trade reaches the secrets broker before the pod's registration does
  waits for that registration rather than failing for good. The broker refuses such a trade with
  a description beginning `pod_session_not_registered:`, and the broker credential trades again
  15 s later, doubling to 5 minutes, until a trade lands, logging the wait once through
  `console.warn`, naming the session, and again every 30 minutes. A call made while the session
  holds a live token goes on with that token. Every other refusal fails the call as before.
time: 2026-11-16T04:15:13Z
