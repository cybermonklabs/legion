kind: Changed
body: '`dispatch inbox` reads `GET /api/v1/me/inbox` for its asks and its threads, and prints them as before, in the same order. Against a server of the release before, which has no such route, it reads `GET /api/v1/inbox?assignee=me` and `GET /api/v1/me/replies?kind=reply,agent` as before and prints the same, at once: it asks the new route once and waits for no roll.'
