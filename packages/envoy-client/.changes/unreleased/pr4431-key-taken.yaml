kind: Added
body: |-
  `send` and `publish` read the listener's answer to a repeat of an idempotency key another sender's message already holds, which carries that message's `event_id`, times, topic and dedupe key with `duplicate: true` and none of its text, as a `KeyTakenResult`: `{ keyTaken: { eventId, topic, issuedAt }, delivered: false }`, rather than throwing on an envelope it cannot parse. A send or a publish that names its source session sends the header `Envoy-Reads: key-taken`, without which the listener answers such a repeat with the envelope it built for it, as an earlier client parses; one that names no session sends none, since the listener cannot tell its own retry from another sessionless sender's. `keyTakenText` and `keyTakenDetails` give the line and the fields both hosts show for it; `keyTakenText` takes the tool, `envoy_send` or `envoy_publish`, and says how that tool sends the message again. A delivered `SendResult` or `PublishResult` never carries `keyTaken`.
