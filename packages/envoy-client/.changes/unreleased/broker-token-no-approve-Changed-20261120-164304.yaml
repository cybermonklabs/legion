kind: Changed
body: |-
  Dispatch no longer gives a token traded at the secrets broker, a person's `agent-secrets login` sign-in included, the `approve` scope, so such a token sent directly is refused `403 OAUTH_SCOPE_REQUIRED` naming `approve`, as is its answer to an approval request. A session whose Dispatch credential is a person's sign-in (no `DISPATCH_TOKEN_FILE`, `DISPATCH_TOKEN` or envoy.json `dispatch.token`, which are read first unless `DISPATCH_TOKEN_BROKER=1`) sends a `dispatch review` through Cipher's proxy instead, with the approve placeholder its sign-in trades for, and the secrets broker spends an approve-only token that never reaches the box (see the `dispatch review` entry of this release); its answer to an approval request is still refused. Otherwise, `dispatch review` works only with a personal token (`DISPATCH_TOKEN`) that holds `approve`.
