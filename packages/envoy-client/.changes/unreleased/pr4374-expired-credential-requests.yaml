kind: Fixed
custom:
  Issue: pr4374
body: |-
  `dispatch inbox` marks a credential request whose deadline passed before anybody decided it:
  its line adds `expired` and the deadline after the request time, or `expired` alone when the
  broker names no deadline, and names no page to decide it on, since the broker refuses every
  decision of it. `Needs you` counts only the requests that still wait on a decision, as the
  Inbox page does, and `Credential requests` still lists and counts every request, the expired
  ones until somebody dismisses them.
