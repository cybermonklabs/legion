kind: Added
body: 'New commands: dispatch edit-comment, dispatch delete-comment, dispatch edit-message and dispatch delete-message. dispatch read --history prints each body an edit or a delete replaced, newest first, with the actor and the time. Every read prints the time of an edit above the body, and prints a deleted post as deleted with no body. All five need a Dispatch of this release: an older server has no route by which an agent edits or deletes a post or reads the bodies one replaced, and each of them then says that this Dispatch predates post corrections and that a correction is one more post until it is deployed, rather than passing on that server''s 404, the scope its comment edit asks for, or its refusal of the actor field that edit sends.'
