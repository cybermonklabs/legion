kind: Added
body: |-
  `dispatch steps` ends each line with four words: `set <model>` and `answered <counts>`. The
  counts read `<model>=<calls>(<share>%)`, joined by commas, or `none`, `unknown` or `running`. A
  missing set model prints `-`. In each finished issue's line, `dispatch plans` prints
  `on set model <n> off <n> unknown <n>` after `failed steps <n>`. Where the issue has a variant,
  `variant <experiment>/<variant>` follows them. Against an older Dispatch, each count prints `-`.
time: 2026-11-25T17:45:59Z
