kind: Changed
body: |-
  `dispatch results --project` refuses `--as-of`, with exit 2 and before any request: Dispatch
  keeps no history of the results that CI jobs store for checks of the spec files
  (`GET /api/v1/projects/{key}/results`), so it cannot answer them as they stood at a past time.
  `dispatch results --issue` takes `--as-of` as before.
