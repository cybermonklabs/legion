kind: Changed
body: |-
  `dispatch spec-form` ends an answer about a covered document, a change request under a root of The
  Spec, with "Before you request approval, have a fresh reviewer read it with
  skill://spec-statement-review." With no `--artifact`, the line comes once. An answer about the
  root's own `terms.md`, `--terms` and `--root` print no such line.
