kind: Changed
body: |-
    `dispatch doc-read` prints a `Resolved "<block id>"` line beside the token for each resolved or declined ask block, so an agent does not take a declined question for an open one, and quotes the block id of each `Answered` and `Resolved` line as JSON, with U+0085, U+2028 and U+2029 escaped too, as it quotes an answer's words and each option chosen, so none of them ends its trailer line early, for a reader that splits lines on a line feed or one that splits them the Unicode way. Against a Dispatch of the release before, it takes no answerer or time from an ask block's opening line where that value holds a control character, U+2028 or U+2029: with no answerer the ask prints no `Answered` line, and with no time it prints its line at an unrecorded time.
    The refusal of a document edit that would remove an open ask block says an answered ask block stays in its document, that only a resolved one may be removed, and that an agent's removal or retype of an answered one is `409 ANSWERED_ASK_KEPT`, in place of saying an ask block leaves the document once its ask is answered. The CLI reads the attributes of an opening line that a Dispatch of the release before writes through `askOpenerAttributes` in `@legion/contracts`.
