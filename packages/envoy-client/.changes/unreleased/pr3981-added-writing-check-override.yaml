kind: Added
body: |-
  The `dispatch` CLI sends `override_writing_check: "agent"` when `--override-writing-check` is
  given, and keeps a writing-check refusal's findings on `DispatchServiceError`.
  `dispatch send-to-agent` now runs without an issue. `postDeliveryReply` returns a
  writing-check refusal to its caller instead of throwing it, and a reply marked `generated` is
  posted with no override first and sent again with `override_writing_check: "generated"` only
  when the check refuses it (`writeGenerated`), so it still reaches a Dispatch that has no
  writing check.
