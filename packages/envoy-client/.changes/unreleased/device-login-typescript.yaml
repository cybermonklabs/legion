kind: Added
body: |-
  A machine with no identity of its own, such as a laptop, can now hold a broker credential with
  no Go binary. `dispatch login --device [--person <address>]` logs the machine in at the secrets
  broker's device grant once: it prints the page and the code, waits while that person approves
  it in Dispatch, and keeps the login in the file `AGENT_SECRETS_DEVICE_LOGIN_FILE` names (default
  `~/.config/legion/device-login.json`, mode 0600). Every session that sets
  `AGENT_SECRETS_MACHINE_IDENTITY=device-login` then trades the login's access token for its broker
  token, with no actor, every proof signed with the login's key, naming the projects
  `AGENT_SECRETS_PROJECTS` lists. Each trade runs under the login's lock, so two sessions of one
  machine never spend one refresh token, and none refreshes while another presents the access
  token that refresh would end.
  A stale lock is taken by one caller alone. A second `dispatch login --device` names the earlier
  login's credential, which stays live until it lapses or is revoked, and says where to revoke it.
