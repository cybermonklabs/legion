kind: Added
body: |-
    `dispatch artifact --precondition-json '{"document":"sha256:…"}'` names the token of the version an upload replaces. It travels in the JSON body of an inline upload and in the multipart form field `precondition` of a `--path` upload, and the command's help says that a replacement needs it and that `dispatch doc-read` prints the token. Dispatch's refusal of a token behind the live document reaches the reader with its own words, which name `dispatch doc-read` and say to upload again.
time: 2026-11-08T00:00:01.000000000Z
