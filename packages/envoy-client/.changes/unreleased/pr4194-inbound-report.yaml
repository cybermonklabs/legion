kind: Fixed
body: |-
  The inbound outage report, `inboundUnavailable`, tells a session that it receives nothing only
  when that is so, and tells it when it receives again. `registerWithRelay` now reports a
  registration with no relay subject apart from a refusal (`InboundUnavailable.noRelay`). Until
  the session's first accepted registration, such an outage is held: it is told once only when
  `INBOUND_FIRST_OPEN_BOUND_MS` (two minutes) has passed since the first one, so a relay that
  opens on a later try at the pod's start tells nothing. The first registration of that hold goes
  at once to the new `held` option, with why the relay subject could not be opened
  (`NoRelaySubjectError.relayMissing`, also new), so a host can log it while the notice waits. A
  refusal is told at once, as before, and so is a lost relay subject after the first accepted
  registration. The first registration
  accepted after a told outage calls the `restored` option once, which is now a field of the
  options object and takes the `why` that was told; `inboundRestoredNoticeText(why)` words it, so
  after a bus-outage 503 the notice says that the listener recorded the registration. Once the new
  `stopping` option answers true, the report tells the session nothing and calls no `held`,
  since a stopping session closes its own relay and its record is deleted next.
  `inboundUnavailable` takes `{ now, firstOpenBoundMs, restored, held, stopping }` as its second
  argument.
