kind: Added
body: |-
  `dispatch review --issue <KEY> --version <N> --verdict <approved|changes_requested>` records a
  person's review of one version of an issue's document: the spec, unless `--artifact` names
  another. `changes_requested` needs `--reason`. The command works only with a token that names a
  person who holds `approve`: a personal token (`DISPATCH_TOKEN`) the person gave `approve`, since
  Dispatch gives no token traded at the secrets broker `approve`, a person's sign-in included.
  Dispatch refuses any other token with `403 OAUTH_SCOPE_REQUIRED` or `403 SIGN_IN_REQUIRED`.
  `--version` is the version the caller read, sent in the path of
  `POST /api/v1/artifacts/{id}/versions/{number}/reviews`, and Dispatch refuses it with
  `409 REVIEW_VERSION_MOVED` when the review would record another version. A Dispatch build
  without that route records nothing, and the command fails `NOT_FOUND` and says so. The output
  names the state, the version and the actor that Dispatch recorded.
