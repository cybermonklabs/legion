kind: Changed
body: |-
  `dispatch issue-update` sends `advances_revision` only when `--advances-revision <n>` names it.
  Before, a call with `--advance` or `--clear-advances` and no revision sent the revision of the
  command's own read of the issue, so its whole set could retract a priority that another writer
  added after the caller read the issue. A change of two or more priorities with no
  `--advances-revision` is now refused with 409 ADVANCES_REVISION, as is an update whose revision
  the issue does not hold. On that refusal the command's error says to read the issue with
  `dispatch read --issue <KEY>` and to send the whole set with `--advances-revision <n>`, n being
  the revision the refusal names. `dispatch read --issue` prints the issue's advances revision on
  its `Advances:` line, for example
  `Advances: ship-the-daemon (own), legion-first (inherited); revision 7`. A refusal with any other
  code reads as before.
