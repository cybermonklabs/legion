kind: Fixed
body: '`dispatch doc-read` of an uploaded file or picture prints, in its header before the file''s text, the latest version''s `Document token: sha256:…` line, which the next version''s upload names in `--precondition-json`, or a named version''s `Content: sha256:…` line; the text after the header is the stored file byte for byte. A version Dispatch states no token for prints no line. `dispatch artifact` under a name its owner holds is refused with only what Dispatch takes, and prints no token: for a file or a picture, `--force` with the token your own `dispatch doc-read` printed, or `--force` alone where the standing version states none; for an upload of another kind than the name holds, another name. Until now it named `--force` and a token for every kind, which Dispatch refused for a file and for another kind.'
