kind: Fixed
body: '`dispatch doc-read` of an uploaded file or picture, at its latest version or a named one, ends with that version''s token in the `Document token:` line a document read prints, so the next version''s upload can name it in `--precondition-json`. A Dispatch that states no token for a file prints no line, since it would refuse the token.'
