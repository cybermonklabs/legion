kind: Fixed
body: '`dispatch doc-read` of an uploaded file or picture prints, in its header before the file''s text, the latest version''s `Document token: sha256:…` line, which the next version''s upload names in `--precondition-json`, or a named version''s `Content: sha256:…` line; the text after the header is the stored file unchanged, a leading byte order mark included (it was dropped before), except that the `dispatch` command adds a line feed after a file that ends without one and, under Claude Code or Codex, cuts an output past 25,000 characters and writes the whole of it to a file it names. A version Dispatch states no token for prints no line. `dispatch artifact` under a name its owner holds is refused with only what Dispatch takes, and prints no token: for a file or a picture, `--force` with the token your own `dispatch doc-read` printed, or `--force` alone where the standing version states none; for an upload of another kind than the name holds, another name. A picture is judged by its first 14 bytes, as Dispatch judges it, so a WebP is a picture (`RIFF`, its size, `WEBPVP`), and a `RIFF…WEBP` with no `VP` chunk after it is not. Until now it named `--force` and a token for every kind, which Dispatch refused for a file and for another kind.'
