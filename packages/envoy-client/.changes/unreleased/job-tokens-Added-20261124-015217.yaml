kind: Added
body: |-
  `dispatch api <METHOD> <path> [--body-file <file>|-]` sends one request of Dispatch's HTTP API
  with the credential every `dispatch` command presents, a token traded at the secrets broker
  included, and prints the answer's body. It takes `/api/v1` and the paths under `/api/v1/` of the
  configured Dispatch, and refuses any other path and any URL before it sends anything. It sends
  the request once, with no retry, no redirect followed and no `Idempotency-Key`. It exits 0 on a
  2xx answer, 1 on any other answer, naming the status and Dispatch's code, and 2 on a usage error.
  With no host plugin, as in a GitHub Actions job, it reads Dispatch from the environment alone
  (`DISPATCH_URL` and a credential, the token files `DISPATCH_BROKER_TOKEN_FILE` and
  `DISPATCH_BROKER_DPOP_KEY_FILE` among them, as every `dispatch` command takes them) and reads no
  envoy.json. In a session whose AskGate reviews
  Dispatch writes, it sends only `GET` and names the `dispatch` command that makes the write; the
  session's ledger records that refusal with AskGate's mark, so AskGate's report counts it.

  `AGENT_SECRETS_MACHINE_IDENTITY=github-actions` trades a GitHub Actions run's OIDC token at the
  broker. The client asks GitHub for a new token at every trade, at `ACTIONS_ID_TOKEN_REQUEST_URL`
  with `ACTIONS_ID_TOKEN_REQUEST_TOKEN`, which GitHub sets in a job that holds `id-token: write`,
  for the audience `AGENT_SECRETS_MACHINE_AUDIENCE` names. A missing variable is an error that
  names it.

  `dispatch whoami` says that a broker token that names a service and no person, and that Dispatch
  answers `sign_in_required` false for, a job's under the project scope `named` or `public` among
  them, runs as its service and no person and writes as that service: in its one project where it
  names one, and otherwise wherever a token that names no project may write. A machine's token,
  which Dispatch answers `sign_in_required` true for, and a broker token that names a service and
  proves a session, from a Dispatch that answers no `sign_in_required`, keep the sentence that
  names `agent-secrets login`. Its details carry `project_scope`.
