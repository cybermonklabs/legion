kind: Added
body: |-
  `dispatch steps --issue <KEY>` prints `Experiment <experiment>: variant <variant>.` after its
  first line where the records of the issue's newest run name an experiment, and
  `dispatch plans --project <KEY>` ends each such issue's line with
  `variant <experiment>/<variant>`. A Dispatch older than the two fields answers records without
  them, and both commands then print no variant.
