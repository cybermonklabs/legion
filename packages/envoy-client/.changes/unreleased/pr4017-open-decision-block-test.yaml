kind: Added
body: |-
  `dispatch-execute` exports `refuseOpenDecisionBlocks`, the test `dispatch request-approval`
  makes over a document's open decision blocks, which takes the refused call's own words
  (`OpenDecisionBlockRefusal`); `resolveIssueDocument`, an issue's document resolved with the
  issue as Dispatch shows it; and `parseDispatchRef`. The `legion` tool's `register_gate` uses them
  for a registration on an ancestor's basis.
custom:
    Issue: pr4017
