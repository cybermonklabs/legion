kind: Added
body: |-
  `dispatch spec-form --terms` prints the list of terms of the document's root in place of the
  findings. Each line is a term, its definition, and the document, the version and the issue that
  define it. With no `--artifact`, the command reads the list from the spec, or from the
  Verification document while the spec has no version. For a key that names no issue, it prints
  what `dispatch read` prints and exits 1.
custom:
    Issue: pr4207
