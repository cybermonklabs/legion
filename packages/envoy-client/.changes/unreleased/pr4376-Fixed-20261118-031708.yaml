kind: Fixed
body: 'The `dispatch` command no longer calls a UTF-16 count characters: a tool input past its cap is refused as `--title: 1002 of at most 1000`, the words of the server refusal for the same cap; a cut result reads `(the full result, 213 long: <file>)`; a cut document line reads `(cut at 200 of its 512)`; the answers list says it left items out to stay under 8,000 UTF-16 code units; and `dispatch limits` prints the bound of a body block, of an ask''s question and options and of an event''s body as `32,000 UTF-16 code units`, where it printed `32,000 characters (UTF-16 units)`. Under Claude Code, a warning line printed before the result now counts against the output''s 25,000 UTF-16 code units, so the whole output stays under that bound.'
