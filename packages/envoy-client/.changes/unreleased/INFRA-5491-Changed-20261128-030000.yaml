kind: Changed
body: |-
  The `dispatch` command reads a dashboard link at any served or former address of the server it
  calls as the same reference as a link at the canonical address, whatever address its own
  configuration names. When a `ref` is an absolute http or https URL that no configured address
  matches, the command reads `GET /api/v1/whoami`'s `origins` and matches the link against each
  origin listed there. No client setting holds a copy of the list. When the call fails, or the
  server names no `origins`, the command reads a link at its configured address alone, as before.
  A dry run that asks Dispatch nothing reads no origins, so it refuses a link at another address
  of the server that the real call reads.
time: 2026-11-28T03:00:00Z
