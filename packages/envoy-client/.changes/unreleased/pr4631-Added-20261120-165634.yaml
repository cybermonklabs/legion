kind: Added
body: '`dispatch issue-update` takes `--include-children`, `--unlink-children` and `--include-parent`. Each goes with `--status` alone and sends the status change to `POST /api/v1/issues/{key}/status-change`, and `--include-children` with `--status done` is refused before anything is sent, since only a person signed in at a browser can close the open issues under an issue with it. The command prints one line for each issue the call changed, and a line for the issue it names also when the call left that status as it was. `dispatch issues --json` prints the listing as one JSON object. A `PARENT_STATUS_CONFLICT` refusal prints each issue that holds the rule, then what to do next, which follows what the call changed: a status change is told the flags of `dispatch issue-update` that move those issues; a reparent refused for the parent it names is told to move that parent first, then to send the reparent again; a reparent refused for a child, against the status it also wrote, is told to run the status change first, in a call of its own, and the reparent after it, without `--status`; and a refused `dispatch issue` is told how to reopen its done parent first, with `dispatch issue-update --issue <PARENT> --status in_progress --include-parent`, which also moves the issues above that parent into work, or to file the issue under another parent or none. Where an issue the refusal names, which a flag of the next step writes, is in another project than the issue the call names, the next step also says that a credential scoped to one project is refused that step (403 `PROJECT_SCOPE`), and that a person, or a credential that names no project, must make it.'
