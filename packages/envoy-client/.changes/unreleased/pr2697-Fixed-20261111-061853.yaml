kind: Fixed
body: A URL's trailing slashes are trimmed by one read of the string (`withoutTrailingSlashes`, a module that imports nothing) rather than by an unanchored `/\/+$/` replace, whose cost is quadratic in a run of slashes (CodeQL js/polynomial-redos).
