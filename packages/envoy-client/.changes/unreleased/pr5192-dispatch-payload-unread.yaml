kind: Fixed
custom:
  Issue: pr5192
body: |-
  `renderInbound` shows none of a Dispatch payload it reads no event of, and the card says the
  payload was unrecognised (`unrecognised: payload`). Before, it showed that payload whole, so
  a frame whose event an edge listener judged by one field could put another project's event,
  nested beside it, in front of the session. The edge listener now passes a Dispatch frame only
  when its payload has the shape this reads an event by.
  A Dispatch event whose card is too large to lay out is shown as the card's `dispatch` block
  written as JSON text - the owner, type, actor, relation and payload or compact record it lays
  out from the event `renderInbound` read, with a body read whole in place of the part the frame
  carried - and no longer as the frame's payload, so a key the reader drops
  beside the event reaches no card; an event too deep to write as text shows its owner, its type,
  its actor's `kind` and `id` and the `act` of the agent or token that acted for its person
  (`act: "not shown"` for an act `ActorActSchema` does not read; no other key of the actor),
  within the same bound, so an agent's act is never shown as its person's own.
