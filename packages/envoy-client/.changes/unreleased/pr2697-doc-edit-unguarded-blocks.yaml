kind: Added
body: |-
  `dispatch doc-edit` under a block guard prints, under its first line, each typed block a
  `replace`'s `with` of blocks rewrote in place that the guard did not name, with the token it
  carried before the edit, from the server's `unguarded_blocks`: `Block guard: this edit rewrote
  in place a typed block the guard did not name: <id> (token <token>); compare its token with the
  one you read.` The result's details carry the same blocks as `unguarded_blocks`. A `409
  PRECONDITION_FAILED` that names the blocks the edit would remove that the guard leaves out, each
  at the token it carries now, adds a line under Dispatch's words: `Block guard: this edit would
  remove a block the guard did not name: <id> (token <token>). A guard names a block as {id,
  token} in precondition.blocks (--precondition-json), at the token your own read listed.`
  Dispatch's words say how to answer the refusal, and the error gives that advice once, the line
  adding only which token a guard names: compare that token with the one your own read listed for
  the block; if they match, name it in the guard at the token you read and send the edit again;
  if they differ, or your read listed no token for it, another writer changed or added it since
  your read, so read the document again before you remove it. The error carries those blocks as
  `unguardedBlocks`. An edit under no block guard, or a server that sends no such field, prints
  as before.
