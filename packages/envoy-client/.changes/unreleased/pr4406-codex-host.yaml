kind: Added
custom:
  Issue: pr4406
body: |-
  The `dispatch` command takes a third host, `codex`, acting as the session `CODEX_THREAD_ID`
  names. A shell that carries Codex's variable beside Claude Code's or Oh My Pi's acts as whichever
  of the three is its nearest parent process. It names a process by its binary's name, reading Claude
  Code's npm binary `claude.exe` as `claude`; a host run through an interpreter, such as `node`,
  is not recognised.
