kind: Added
body: |-
  `dispatch result --issue` under `AGENT_SECRETS_MACHINE_IDENTITY=github-actions` records a CI job's result of the check its `ci_check` names with the job's own identity: it trades the run's OIDC token at the secrets broker, as `--project` does, sends `--check`, `--verdict`, `--commit` and `--observed` alone, and cuts `observed` by the shared rule. It refuses `--role`, `--surface`, `--run`, `--negative-control`, `--failed`, `--skipped`, `--excluded`, `--screenshot` and `--retract`, and an empty `--issue`, `--check` or `--commit`, before any request, naming the flag. It prints each line by the runner log's one-line rule, asks again while the broker's trade or Dispatch's check of the token turns it away as `--project` does, and reads the answer as `--project` does: an answer that names the request's key back is Dispatch's answer to the write, so such a 2xx prints the stored result, or `{"landed_without_answer":"ANSWER_LOST"}` where it never gives one, such a `409 KEY_COMMITTED` prints `{"landed_without_answer":"KEY_COMMITTED"}`, and each exits 0; an answer that names another request's key back, whatever it holds, one that names no key back from a Dispatch the job's process knows runs the keyed layer, or no answer that says whether the write landed, prints `{"write_outcome_unknown": <code>}` and exits 1. `dispatch results --issue` names a branch head, prints each result the CI job recorded after the derived one with `on branch <branch>`, prints no `Pull request line:` for an issue with no pull request, prints `It counts for nothing: <reason>` under a result whose `not_counted` says why it counts for nothing, and takes `--json`, which prints the route's answer whole. It prints every string of Dispatch's answer by the runner log's one-line rule: a result's reading is one line, its line breaks written as `\n`, so no line of a job's log reads as a line of the command's own, such as another check's head line or an `A pass stands:` line. `--json` of `dispatch results` keeps each line break inside its JSON string by the same rule, and `dispatch result` prints a retraction's reason and the pull request line by it too.
  A session's `dispatch result` prints the id of the result it recorded as `Result <id>`, the form `dispatch results` prints, which `dispatch result --retract` takes.
  `dispatch results --issue` prints one line for each head a `before_merge` check's pass must stand at, under the check's head line: `  - #<number> at <commit>: yes, from <roles>. Pass <id> decides it.`, `no, as fail <id> counts there.`, `no, as it holds no result.`, `not known, as pass <id> and fail <id> count at this commit.`, followed by what ends that state, or `not known, as Dispatch could not read CI run <run> there.`; a merged pull request's head prints as `#<number> (merged)` and a branch head as `branch <name>`. Where an open pull request's head is one, the head line reads `Compared with the heads of <n> open pull requests.`, its `A pass stands:` names how many of the heads read yes where the answer is not yes, and one line counts the merged pull requests, which decide nothing while one is open. A check CI proves prints each head's `Pull request line:` under that head's line. An `after_merge` or `default_branch` check names the newest result that decides it: `A pass stands: no, as the newest result is fail <id> at <commit>`, or `not known, as Dispatch could not place … on a branch`.
  `dispatch results --issue` names the repository of a pull request of another repository than the issue's beside its number on the line of its head, `<owner>/<repo>#<number>`, where the basis carries `repo`.
  `dispatch results --issue` prints no state line for a check whose answer names no `pass_stands`, such as a run's Dispatch server answers while its state is hidden (`DISPATCH_TEST_HIDE_STATE_FILE`): the head line ends at `Compared with the heads of <n> open pull requests.`, counted among the check's bases, and the check's words and every result follow it. It no longer prints `Whether a pass stands is not known: this Dispatch server does not say`, and a check CI proves whose `ci` is absent with it prints as any other check.
  `dispatch results --issue` counts heads in `as <k> of <n> heads read yes`, not pull requests: the state belongs to the commit, so open pull requests whose heads are one commit are one head there, and one commit in two repositories is two. The head line still counts the open pull requests.
  `dispatch results --issue` names the result a check CI proves derived from its own `ci` read by the id Dispatch gives that read (`ci.result`, beside the head it names, `ci.commit` and `ci.repo`), never by comparing pull-request lines, so two heads whose lines are alike, such as one commit in two repositories, cannot lend each other a result. A server that names no head of `ci` read the newest head alone, and its one derived result is still taken.
