kind: Changed
body: "`ReplayEngine.recordDeliveredFor` answers whether it recorded the frame: false says the host's `writeSessionID()` no longer names that session, so nothing was recorded and the caller can report what that session's record lost. It records and writes exactly as before, and a caller that ignores the answer is unchanged."
