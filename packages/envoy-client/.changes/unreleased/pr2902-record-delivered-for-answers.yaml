kind: Changed
body: "`ReplayEngine.recordDeliveredFor` answers whether the write that keeps the record reached the host: false says the host's `writeSessionID()` no longer named that session by the time the queued write ran, or that write failed, so the caller can report what that session's record lost. It records and writes exactly as before, and a caller that ignores the answer is unchanged."
