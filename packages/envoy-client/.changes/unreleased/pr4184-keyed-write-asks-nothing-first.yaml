kind: Removed
body: |-
  A write that gets no definitive answer (a transport failure, a silence cut, a 5xx, a 408, a 429 or `409 KEY_IN_FLIGHT`) is asked again under its `Idempotency-Key` on its schedule, and asks `GET /healthz` nothing first. Every Dispatch since `legion-envoy-v21.0.0` runs the keyed layer on every `POST` and `PATCH` route, the writes the client asks again, and says `idempotency_keys: true` on `/healthz` as a fact of its binary, so the question only ever held back a resend that is safe. The question, its shared 5 s probe and the five-minute memory of the answer are gone: `KEYED_LAYER_MEMORY_MS`, `keyedLayerMemory`, `rememberKeyedLayer` and `forgetKeyedLayerMemory` are no longer exported, and the `dispatch` command's session state keeps no `keyedLayer` member. A rollback of Dispatch to a release older than `legion-envoy-v21.0.0` runs such a resend as a second write.
