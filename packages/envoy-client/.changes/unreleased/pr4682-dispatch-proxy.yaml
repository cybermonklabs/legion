kind: Added
custom:
  Issue: pr4682
body: |-
  `dispatch proxy --socket <path> -- <command>` runs a command and gives it a unix socket at
  `<path>` (mode 0600, named in `DISPATCH_PROXY_SOCKET`) that sends its Dispatch requests on with
  the session's own broker token and a new proof for each request. It runs only under
  `DISPATCH_TOKEN_BROKER=1`. It sends each GET under `/api/` and each comment POST to
  `/api/v1/issues/<key>/comments` that carries an `Idempotency-Key`, and refuses every other
  request with its own code: `405 PROXY_METHOD_REFUSED`, `400 PROXY_TARGET_REFUSED`,
  `502 PROXY_TRADE_REFUSED` or `502 PROXY_DISPATCH_UNREACHABLE`. The error of a `405` names the
  `dispatch` command to use, where one exists. For a write that no `dispatch` command sends, the
  error says so. It gives back Dispatch's status,
  headers and body as Dispatch sent them (an answer that carries `Transfer-Encoding` as well as
  `Content-Length` comes back without that `Content-Length`, per RFC 9112, section 6.3, with its
  body chunked), follows no redirect,
  and trades again only when its token has less than 300 seconds to live or after a
  `BROKER_TOKEN_NOT_ACTIVE` answer. It exits
  with its command's status and prints
  `dispatch proxy: <n> requests, <m> trades, <r> after BROKER_TOKEN_NOT_ACTIVE` on standard error.
