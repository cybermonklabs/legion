kind: Added
body: |-
  `dispatch result --project` writes into a GitHub Actions runner's log, which reads workflow commands from it, so each text it did not write (an argument, a variable, a file's name, an answer of the airlock proxy or of Dispatch) prints by the rule of Go's `runnerlog.Printable`: each control character, format character, line or paragraph separator as its escape, such as `\n`, and the `[` of each `##[` as `\x5b`, or as `\u005b` inside JSON. No such text starts a line of its own or names a workflow command, and a refusal that starts with `::` has that first `:` written as `\x3a`. The rule is `runner-log.ts`.

  A write that reached Dispatch with no answer that says whether it stored the result prints `{"write_outcome_unknown":"<code>"}`, the code of its last failure such as `ECONNRESET`, and exits 1: the result may be stored, and a second run is safe, because Dispatch keeps each result. `writeOutcomeUnknown(error)` in `dispatch-http.ts` tells such a failure. A connection that was never opened (refused, a name that did not resolve, no route, a tunnel a proxy refused to open), a request Dispatch's check of its broker token turned away before any handler ran (`tokenNotChecked`: `429 BROKER_TOKEN_RATE_LIMITED`, `503 BROKER_UNAVAILABLE`), and an attempt the client's deadline ended before it was sent no longer count as an attempt that may have reached Dispatch. `DispatchServiceError` carries its answer's `Retry-After` as `retryAfterMs`.

  A write's 2xx is read by the key it names back. Dispatch's keyed layer names the request's `Idempotency-Key` back on the answers it gives a keyed write, and answers a write's 2xx only after the write committed, so a 2xx that names the key back and whose body gives no row is a landing whose answer was lost: a `DispatchWriteLandedError` with the client's own code `ANSWER_LOST` (`DISPATCH_ANSWER_LOST`; its `code` is a `DispatchLandedCode`). Every `POST` and `PATCH` of `DispatchClient` reads its 2xx into the row its callers read (`dispatch-write-rows.ts`: those members, in the forms the route answers them in the OpenAPI document, each keeping, at every depth, the members it does not name), so a body cut or stalled past the deadline, one that is no JSON whatever its type says, an empty one and JSON that is not that row are each this landing, and no command reads a member of an answer that was not checked. A 2xx that names no key back, or another request's key, is never the call's answer, whatever it holds, and nothing of it is compared with what the call sent: it leaves the write's outcome unknown (`DispatchWriteUnsettledError`), as a `409 KEY_COMMITTED` that does not name the key back does. Such an answer may be a proxy's page, a server that is not Dispatch, a proxy or a cache that answers one write with another's, a proxy that drops the header, or Dispatch in the two paths where its keyed layer runs the handler with no key: a lookup of a personal agent token that failed once, and a body past the route's limit. An empty `Idempotency-Key` that a caller gives names no request, so an answer that names no key is no landing of it. The requests of this client follow no redirect: each read and each write of `DispatchClient`, each call of `EnvoyClient`, and the pool identity's posts to the security token service, since fetch sends a DPoP proof, the key and a 307's or 308's body on to the origin a redirect names. A 3xx is a refusal of whatever answered in Dispatch's or the listener's place, and it names the origin it points at (`redirectOrigin`: the scheme and the host, never the path or the query). The line holds nothing of the answer's body, in `DispatchClient`, in `EnvoyApiError`, and in the pool identity, whose line is `HTTP <status>`. The round trip and the related-item check store nothing, so a 2xx of either that is not its answer, a replay whose first answer Dispatch did not keep among them, is a `DispatchAnswerMissingError`, and so is a `409 KEY_COMMITTED` of either, which says nothing was made. `dispatch result --project` prints `{"landed_without_answer":"ANSWER_LOST"}` and exits 0 for a landing, `{"write_outcome_unknown":"HTTP_<status>"}` and exits 1 for an answer that is not Dispatch's, and no longer prints a plain failure, or `Cannot destructure property 'predicate' …`, for a result that was stored; each other write command prints its landing line where it read missing members before. An empty `--issue`, `--project`, `--artifact`, `--check`, `--commit`, `--at`, `--retract`, `--comment`, `--session` of `dispatch send-to-agent`, or `--parent` of `dispatch issues` and `dispatch issue`, as an empty variable gives it, or an empty item of such a flag's list (`dispatch priorities --project`), is refused before any request with exit 2, naming the flag, and so is a value of only Go's white space, the set Dispatch trims a value by (U+0085 among it); a value of only dots and slashes, such as `.`, `..` or `./`, is refused for `--issue`, `--project`, `--artifact`, `--retract`, `--comment` and `--session`, whose value goes into a URL path in some command, in each command that takes the flag and with one reason, since it names nothing wherever the command sends it. Sent, a path that held such a value reached no route, the router's redirect or another route (`dispatch read --issue ..` asked `GET /api/v1/`), and a read that it narrowed came back wider: `dispatch search --project ""` answered every project's rows. To search every project, leave `--project` out. No URL path of `DispatchClient` holds a value that names nothing (empty, only Go's white space, or only dots and slashes): it refuses one before any request (`DispatchEmptyPathError`), which a model's tool call can reach and no argument of the command does, since the command refuses each such value of those flags first. A run of every command in each of its forms (of an issue, of a project, and of a project's document), with 14 such values in each string flag, reached it 0 times.

  A call that Dispatch's check of the job's token turns away before anything is stored is asked again after the answer's `Retry-After`, or a second. The whole call has one bound, 60 s from its start: one timeout, made where the call starts, is the signal each write and each wait run under (`ResultBound`), and no round and no ask again under the key starts in its last 7 s, a reserve greater than the 5 s Dispatch's check of a token waits on the broker. A call turned away until then prints, on one line, which turned it away with the last answer, its code named, and exits 1. A job's step of many checks meets that limit of one address with no fault of its own, so its results are no longer lost to it.

  What a write's attempts showed is a fact of the whole call: a write carries one `Idempotency-Key` across its no-route retries and its re-send after a dead token, and once an attempt may have reached a handler, a later answer that proves nothing of it (no route, Dispatch's check of the token, a dead token, an echoed 401 or `422 KEY_REUSED`) ends the call as a `DispatchWriteUnsettledError`, so `dispatch result --project` prints `write_outcome_unknown` and not a refusal that says nothing was stored. Only the keyed layer's verdict on the key settles the call: a definitive answer that names it back and that the layer keeps as the key's outcome, which an echoed 401 and `422 KEY_REUSED` are not. An echoed 401 counts as an attempt that may have reached a handler. A multipart upload is encoded once for all its attempts.

  `dispatch results --project` prints each line and its `--json` by the same rule of a runner's log.
