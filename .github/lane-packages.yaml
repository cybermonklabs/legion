# The packages each slow suite tests: the jobs a pull request holds back for the merge queue unless
# it carries their label. A merge group runs every one its paths select, and must run each whose own
# package it changes. `.github/scripts/lane_packages.py` reads this file twice, in two ways that do
# not share their matching:
#
# - the changes job writes from it one paths filter per job (`lane_packages.py filters`), and on a
#   merge group (or a dispatched branch) dorny/paths-filter's verdict on it turns the job's
#   `changes` output on, even where the computed filter, which reads build tags, leaves a file of
#   the package out;
# - the ci-ok job reads a merge group's files out of git and maps each to the jobs that own it
#   (`lane_packages.py gate`), and fails the group when such a job did not run and succeed. It does
#   not read what `changes` selected, so a `changes` that drops a job fails ci-ok rather than
#   agreeing with itself.
#
# .github/ci-notes/ci.md#ci-ok-fails-a-merge-group-that-skipped-a-slow-suite-whose-own-package-it-touches
# says why.
#
# Each entry is a job id of ci.yaml (CI_OK_SELECTED_BY maps it to `output`) and what it owns:
#   go:         .github/go-legs.yaml's job keys of a module: every package that file places under
#               them (a leg of the job, or `elsewhere: <package>: <key>`), and, when one of them is
#               the module's `unlisted`, every .go file of the module no place there names,
#               outside the modules `nested` lists;
#   packages:   Go package directories, each its files but its *.md and its testdata/ tree;
#   paths:      globs read as dorny/paths-filter reads them under `some-with-excludes`: a file is
#               owned when a pattern without `!` matches it and no `!` pattern of the entry does;
#   harnesses:  the script harnesses a workflow's job runs, each `<dir>/<stem>.test.sh`,
#               `<stem>_test.sh` or `<stem>.test.ts` its steps' `run:` names (against the step's
#               working-directory), with the files beside it whose name is the stem, `-` and `_`
#               read alike, and the directory of that name.
# A package a job's go test names outside go-legs.yaml (an alone, skip-count, natslive or tagged
# step) is listed under `packages`; lane-packages.test.sh fails a lane workflow's go test package
# that this file does not give its job.

# The module directories inside a go-legs.yaml module, whose packages are no package of it.
nested:
  - packages/envoy/infra

jobs:
  daemon-go:
    output: daemon_go_tests
    go: {packages/daemon: [daemon-go, daemon-go-race]}
  dispatch-browser:
    output: dispatch_browser
    paths: [packages/dispatch/e2e/**, packages/dispatch/web/**]
  dispatch-memory:
    output: dispatch_memory
    packages: [packages/envoy/cmd/dispatch]
  dispatch-multiprocess:
    output: dispatch_multiprocess
    packages: [packages/envoy/cmd/dispatch]
  dispatch-two-builds:
    output: dispatch_two_builds
    packages: [packages/envoy/cmd/dispatch, packages/envoy/internal/dispatch/store/cmd/connections]
    paths: [packages/dispatch/e2e/**/cross-build.*]
  envoy-go:
    output: envoy_go
    go: {packages/envoy: [envoy-go, envoy-go-natslive]}
    # The packages envoy-go's alone, skip-count, race-impossible and natslive steps name.
    packages:
      - packages/envoy/agentloop
      - packages/envoy/cmd/cipher
      - packages/envoy/cmd/dispatch
      - packages/envoy/cmd/listener
      - packages/envoy/internal/bus
      - packages/envoy/internal/cipher/api
      - packages/envoy/internal/cipher/natscallout
      - packages/envoy/internal/cistore
      - packages/envoy/internal/dispatch/api
      - packages/envoy/internal/dispatch/architecture
      - packages/envoy/internal/dispatch/delivery
      - packages/envoy/internal/dispatch/docs
      - packages/envoy/internal/dispatch/duty
      - packages/envoy/internal/dispatch/embedqueue
      - packages/envoy/internal/dispatch/outbox
      - packages/envoy/internal/dispatch/store/storetest
      - packages/envoy/internal/dispatch/textversions
      - packages/envoy/internal/integration
      - packages/envoy/internal/legionagents
      - packages/envoy/internal/pglisten
      - packages/envoy/internal/testnats
      - packages/envoy/loadtest
      - packages/envoy/natsgrant
  envoy-go-checks:
    output: envoy_go_checks
    harnesses: {workflow: .github/workflows/ci-job-envoy-go-checks.yaml, job: envoy-go-checks}
  envoy-go-claim-model:
    output: envoy_go_claim_model
    packages: [packages/envoy/internal/dispatch/api]
  envoy-go-race:
    output: envoy_go_race
    go: {packages/envoy: [envoy-go-race]}
    packages: [packages/envoy/internal/testnats/hooktest]
  envoy-go-race-api:
    output: envoy_go_race_api
    go: {packages/envoy: [envoy-go-race-api]}
  envoy-go-race-docs:
    output: envoy_go_race_docs
    go: {packages/envoy: [envoy-go-race-docs]}
  envoy-infra-go:
    output: envoy_infra_go
    packages: [packages/envoy/infra/core, packages/envoy/infra/gcp, packages/envoy/infra/seed]
  envoy-smoke:
    output: envoy_smoke
    packages:
      - packages/envoy/infra/cmd/pulumi-resource-envoy-infra
      - packages/envoy/infra/host
      - packages/envoy/internal/smoke
    paths: [packages/envoy/docker/**]
  pi-legion:
    output: pi_legion
    paths: [packages/pi-legion/**, '!packages/pi-legion/.changes/**']
  test:
    output: test
    harnesses: {workflow: .github/workflows/ci-job-test.yaml, job: test}
