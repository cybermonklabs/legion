  # Playwright's own published browser image, with two readers. It is the base of
  # .github/docker/browser.Dockerfile, which the row below builds, and it is the container the
  # Dispatch browser suite's visual job compares its snapshots in
  # (.github/workflows/dispatch-browser.yaml's visual job, packages/dispatch/e2e/visual-run.sh).
  # A baseline is a rendering, so the fonts, the freetype and the browser build that made it
  # decide every pixel of it: the container is what makes one taken by a person and one taken by
  # CI the same image. Its upstream tag carries the Playwright release bun.lock resolves, and
  # .github/scripts/check-playwright-version.sh refuses a head where the two disagree. It is the
  # one row whose upstream is not Docker Hub: Microsoft publishes this image on its own registry
  # alone, and the copy below is what every build and every CI job reads.
  - upstream: mcr.microsoft.com/playwright:v1.64.1-noble
    tag: playwright-v1.64.1-noble-2f05f8a7
    digest: sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f

