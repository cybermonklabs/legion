# The container images this repository's CI jobs fetch, each in one package this repository
# publishes: ghcr.io/cybermonklabs/legion/ci. Every job fetches by digest, so no CI job depends
# on a third-party registry (sjawhar/legion#2512).
#
# One row per image, and a row is one of two kinds: a copy of a third-party image, which
# carries `upstream:`, or an image this repository builds itself, which carries `built:`. A row
# holds exactly one of those two keys, because each of them says where the row's bytes came
# from, and it holds `tag:` and `digest:` besides:
#
#   upstream  where the image comes from: the image's own reference at its own registry. Every
#             row that carries one but the playwright row below names Docker Hub, which is why
#             the rest of this file says Docker Hub where it means the upstream registry.
#             .github/scripts/mirror-ci-images.sh copies the repository of this reference at the
#             row's digest, and never the tag it names, so the bytes it lands are this row's
#             bytes whatever upstream did since. That script copies only a row the package does
#             not hold, so this repository reads an upstream registry a few times a year.
#   built     the Dockerfile this repository builds the image from, where a copied row names an
#             upstream: .github/docker/browser.Dockerfile is one.
#             .github/workflows/browser-image.yaml builds that file and pushes the image into
#             the package, so mirror-ci-images.sh copies nothing for such a row. Whether the
#             package holds it is read by the gate's package mode, as it is for every row.
#   tag       the image's tag in the package. A tag keeps the manifest from being a package
#             version nothing names, which a retention policy may remove. For a copied row the
#             rule is the upstream repository's last path element, then the upstream tag when
#             the row names one, then the first eight hex characters of the digest. The row for
#             docker.io/library/debian:trixie-slim carries debian-trixie-slim-f6b08b09, and the
#             pgvector row, whose upstream names a digest alone, carries pgvector-2358fcba. For
#             a built row the rule is the Dockerfile's name without the .Dockerfile suffix,
#             then those same eight characters, so a row built from
#             .github/docker/browser.Dockerfile carries browser- and the eight. The digest in
#             the tag gives each digest a tag of its own: a row that moves to a new digest takes
#             a new tag with it, and the digest it leaves keeps the tag it had.
#             .github/scripts/check-ci-images.sh refuses a tag that is not that whole string.
#   digest    the manifest digest. `crane copy` keeps it, so a copied row's digest and its
#             upstream's are one string, and a built row's digest is the one its build pushed.
#             Every consumer names this digest.
#
# To add an image: add its row and push. ci.yaml's ci-images job copies the rows the package
# does not hold yet, and then reads the package, which is the half of the gate that answers for
# it. That job is the one copy path, and it runs on every event ci.yaml runs on: a pull request,
# a merge group and a dispatch. The gate refuses a consumer that names anything but a digest this
# file holds.
#
# To add an image this repository builds rather than copies, push the Dockerfile first: that
# push is what builds the image and lands it in the package, and the row carrying the digest
# that build pushed lands in a later push, for the reason the two commits below are two.
#
# To move an image to a new version, push two commits. The first adds the new version's row and
# leaves every consumer on the row it has, so the ci-images job of that run copies the new
# digest while nothing pulls it yet. The second moves the pin (.bun-version, or
# worker.Dockerfile's ARG GO_VERSION) and every FROM onto that row, and deletes the row they
# left; a consumer job of that run pulls a digest the package already holds. One commit holding
# both would race its own copy: a consumer job waits on the `changes` job alone, so it can pull
# the new digest while the ci-images job of the same run is still copying it.
# .github/scripts/check-ci-images.sh admits the extra row for that reason. It asks for one row
# at each pin, and refuses no row beside it.
#
# .github/scripts/check-ci-images.sh is the gate. It reads this file and every file a CI job
# runs, and its header says what each of its two modes refuses.

# The package every copy lives in. One package, not one per image: GitHub makes each new
# container package of an account private, and exposes no API that makes one public, so each
# package is one irreversible act by a person: Sami made this one public by hand, so a job pulls
# it with no login (sjawhar/legion#2512).
registry: ghcr.io/cybermonklabs/legion/ci

