# decision, and the child of INFRA-3411 that makes it true). .github/scripts/check-test-reach.sh
# reads this list:
#
#   - a finding an entry names passes, so the search can run in a job ci-ok needs while the other
#     children of INFRA-3411 place these tests;
#   - an entry that names no finding fails it, as `listed`: a job ci-ok needs runs that test now,
#     or the test is gone, so the pull request that placed it takes its entry off;
#   - every other finding fails it.
#
# An entry names one finding as the search prints it less its line and its reason,
# `<kind>: <path>: <subject>` (the subject is the tag, the test, the variable, the script, the
# package script or the step), and the row that gives the test its home, with that row's decision
# and the child that takes it. A finding no row of either document names is not entered here: it
# goes to INFRA-3411's architect, who gives it a row or a home. The last pull request of INFRA-3411
# deletes this file.
