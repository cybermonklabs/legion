# The tool assets a CI job of this repository installs, one row per asset.
# Each row names the one pinned digest both of that tool's sources are checked against, where its
# second source is, and how that source is filled.
# An hour of 504s on GitHub's release assets holds every merge of this repository, because each of
# these installs reads one source and has nowhere else to go (dispatch://INFRA-1873).
# A second source ends that hour; the pinned digest keeps it from widening what a job will run.
# No unverified byte enters by either path: both are checked against the one `digest` of the row,
# the same literal, and a refusal names the source that served the bytes.
#
# Each row's `version` agrees with the pin that decides which version a job installs:
# for crane, changie, elan and the Pulumi CLI the row is the pin itself, since install-crane,
# install-changie, install-elan and install-pulumi hold no version of their own and install the
# version this row names,
# `ARG MISE_VERSION` of packages/daemon/docker/worker.Dockerfile for mise,
# `ARG JJ_TOOL` of that same file for jj,
# `ARG UV_VERSION` of that same file for uv, whose `primary_digest` is that file's
# `ARG UV_SHA256`, because the image's own toolchain stage builds uv from those two,
# `const DockerPluginVersion` of packages/envoy/infra/internal/pulumitest/pulumitest.go for the
# docker provider plugin the envoy-infra live tests install,
# and .bun-version for the three bun rows.
# .github/scripts/check-ci-tools.sh is the gate that holds a row to its pin and to this file's
# shape, and .github/scripts/mirror-ci-tools.sh fills the copy of each ghcr-mirror row from
# ci.yaml's `ci-images` job, the one copy path this repository has.
#
# Raising a tool is one commit: the row and the pin it answers to move together.
# A row that disagrees with its pin installs one version and verifies another, and that is the
# hole .github/scripts/check-ci-tools.sh exists to close, so the tree never holds that state.
#
# Raising Bun is the one raise that takes two commits, and the three bun rows below move in the
# second one, with .bun-version. That raise takes two because it moves a container image as
# well as these rows: .github/ci-images.yaml's new `oven/bun` row goes first and alone, since a
# consumer there names a digest and the new row is inert until a `FROM` moves onto it, and
# .bun-version, `ARG BUN_VERSION`, every `FROM` and these three rows follow in the second
# commit. What a tool row cannot do is go ahead of its pin the way an image row can, because a
# call site names a row rather than a version: a second row of the same tool has no name a call
# site could use, and this file's gate refuses two rows of one name for that reason.
#
# One commit races nothing: ci.yaml's `tool-fallback` job declares `needs: [changes, ci-images]`,
# so the copy of the new row is filled before `tool-fallback` reads it, and no other job waits on
# that copy, because an install reaches the copy only where its primary did not serve the bytes.
# The one window it leaves, said out loud: a raise merged while that tool's release asset is
# down and its copy is not yet filled. In that window the tool has exactly the single source it
# has today, which is what every install of it had before this file existed.
#
# WHY A ROW'S SECOND SOURCE IS WHAT IT IS.
# crane, changie, mise and jj publish the exact bytes nowhere but GitHub release assets, so their
# second source is a copy in the package this repository already publishes and already reads with
# no login, ghcr.io/cybermonklabs/legion/ci, which every CI job of this repository reaches for its
# container images already.
# Bun publishes the same binary to npm, one package per platform, so a bun row's second source is
# the npm registry: a different service, one every job already reaches for `bun install`, and one
# that needs no copy, so it serves the bytes on the day a copy would still be cold.
# uv takes PyPI, which is deliberately another provider and not another GitHub host: on
# 2026-11-09 one 504 on uv's single-source install ejected this repository from the merge queue
# twice, and a ghcr copy is served by a GitHub host, so a copy would answer that outage with the
# service that caused it. PyPI's wheel and the GitHub tarball package the same binary in two
# different archives, so the binary is the only literal both sources can be held to: that is
# what this row's `digest` is of, and the archive the primary serves carries a digest of its own
# beside it in `primary_digest`.
# The docker provider plugin and the Pulumi CLI take get.pulumi.com and the GitHub release in
# opposite orders. Pulumi serves each tarball byte for byte at both addresses, measured on
# 2026-11-09: the plugin's 24184600 bytes and the CLI's 119816773 bytes each read one sha256
# from both. Each row writes as its primary the address its install reads today — the live
# tests' plugin step fetches the GitHub release, install-pulumi fetches the vendor — and the
# other address, which serves those same bytes, is its second source. Neither tool needs a copy,
# and both of these sources are warm the day the row lands, which a copy is not.
# elan takes a copy, as crane and the rest do. The search for a second publisher of these bytes
# was made on 2026-11-09 and found none: no npm package, no PyPI wheel, no Debian or Homebrew
# package and no vendor host serving this archive. That is what that search found and not a fact
# about the world, which is why the claim a copy makes is the narrower one: that the package
# holds these exact bytes, which .github/scripts/mirror-ci-tools.sh's read-back after the push
# and the `tool-fallback` job's blob check (.github/workflows/ci-job-tool-fallback.yaml) are what
# decide.
#
# WHY THE BUN AND jj ROWS PIN THE INSTALLED BINARY AND NOT AN ARCHIVE.
# `oven-sh/setup-bun` at the commit .github/actions/setup-bun pins verifies no checksum at all,
# and .github/actions/install-jj verifies the mise archive and nothing of the jj binary mise then
# builds or downloads.
# A GitHub zip and an npm tarball are different archives of the same program, so the only literal
# both can be held to is the digest of the binary that ends up installed.
# That is what those rows pin, and the check runs on the primary path too: an install that got its
# bytes from the third party verifies the same digest as one that got them from the second source.

# WHY A DECLINE IS AN ENTRY UNDER `no_second_source:` AND NOT A ROW.
# Some bytes CI installs are published in one place and nowhere else, and the manifest must be
# able to state that rather than force a fiction (dispatch://INFRA-1974).
# A `tools:` row cannot carry it, and the reason is what a row says rather than any field of it:
# a row is the statement that two sources serve these bytes, which is the one thing a decline
# denies. The gate reads that statement as a shape — ci.yaml's `tool-fallback` job fails for a
# row no install reads, and .github/scripts/check-ci-tools.sh refuses a `second_source` that is
# none of the five words .github/scripts/ci-tools.sh reads a source with, before the row is read
# at all — so a row of one source is refused whichever way it is written.
# So a decline is an entry of its own key, invisible to .github/scripts/ci-tools.sh,
# .github/scripts/mirror-ci-tools.sh, .github/scripts/ci-tools-proof.sh and `tool-fallback`, and
# read by the gate alone.
# The gate holds an entry to rules of its own: its `url` is written by some file under .github/,
# its `digest` occurs in the file its `pinned_in` names, that file is neither this manifest nor a
# test's fixture, no row already covers its repository, and its `why` is a sentence.
# WHETHER THAT REASON IS TRUE IS THE REVIEWER'S JUDGEMENT, not the gate's; the rules before it
# are the whole of what a program can check.
# THE LIST HOLDS ONE ENTRY TODAY, the release lane's gitleaks. It held elan, uv and the docker
# provider plugin as well, and dispatch://INFRA-1986 gave each of those three a row with a second
# source, which is what made each of those entries false and deleted it. The one that is left
# waits on something else: not a copy of those bytes, but a way for a job holding the release
# credentials to read one, which its own `why` sets out. The next entry is for the next install
# whose bytes one publisher serves and no other: it is written when that install lands, and it is
# deleted the day a second address for those bytes is found and can be reached, as the three were.

# The package every ghcr-mirror copy lives in: the one .github/ci-images.yaml publishes, which is
# public and which a job pulls with no login (sjawhar/legion#2512).
registry: ghcr.io/cybermonklabs/legion/ci

tools:
  # crane, the registry client .github/scripts/mirror-ci-images.sh copies images with.
  # .github/actions/install-crane installs it.
  - # The row's key: what a call site names, and what every log line and refusal says.
    name: crane
    # The version string, without the leading `v` its release tag carries.
    version: 0.22.1
    # The one 64-hex sha256 both paths check, written bare: no `sha256:` prefix, because this one
    # literal goes into a `sha256sum` line and into a ghcr blob URL alike.
    digest: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
    # The bytes that digest is of.
    digest_of: the release tarball go-containerregistry_Linux_x86_64.tar.gz, whole
    # The word the row's primary is read with, which every log line and every refusal of it
    # says: `github-release` for a release asset, `pypi` for a wheel, `pulumi-releases` for a
    # tarball get.pulumi.com serves. A copy this repository fills is no origin of the bytes, so
    # `ghcr-mirror` and `npm` are second sources and no row's primary.
    primary_source: github-release
    # The URL the primary path fetches, empty where a third party fetches the bytes for us.
    primary: https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
    # The sha256 of the bytes the primary URL serves, for a row whose own `digest` is of
    # something inside them, and "" where the primary serves exactly the bytes this row pins,
    # which is every row but uv.
    primary_digest: ""
    # The prose saying what `primary_digest` is of, which a refusal of a mismatch on it names.
    # "" where unused.
    primary_digest_of: ""
    # The member to take out of the primary's archive before the row's own `digest` is checked,
    # and "" where the primary serves the pinned bytes themselves.
    primary_member: ""
    # Where the bytes come from when the primary does not serve them: `ghcr-mirror` for a copy in
    # the package `registry:` names, `npm` for the npm registry, and `github-release`, `pypi` or
    # `pulumi-releases` for a service that serves this row's bytes at an address of its own.
    # It is the one word every log line and every refusal of that source says, so a row that
    # moves to another source moves every sentence about it with one edit.
    second_source: ghcr-mirror
    # The per-attempt bound in seconds the helper gives curl. One attempt that hangs past a minute
    # is the outage the second source answers, so every row carries 60.
    max_time: 60
    # ghcr-mirror rows only. The URL .github/scripts/mirror-ci-tools.sh fetches the bytes from to
    # fill the copy. It is the row's `primary` wherever the primary is the asset itself.
    mirror_from: https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
    # ghcr-mirror rows only. The tar member to take out of `mirror_from`'s archive before the
    # digest is checked and the bytes are pushed, or "" to push the archive whole.
    mirror_member: ""

