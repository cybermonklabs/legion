# The URLs CI fetches that have no second source anywhere today, one entry per URL. Each is
# allowed by its entry and by nothing else; the gate refuses any other unnamed release asset.
no_second_source:
  # gitleaks, the engine .github/scripts/release-push.sh runs this repository's own private-name
  # rules with before each of its six writes to a public GitHub repository. The version is the one
  # packages/daemon/go.mod holds for github.com/zricethezav/gitleaks/v8, so the binary that lane
  # runs and the library the daemon links are one release.
  - # The URL exactly as the file that fetches it writes it.
    url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
    # The 64-hex sha256 that file checks the bytes against, written bare.
    digest: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    # The file that pins them. The gate refuses an entry whose digest that file does not hold.
    pinned_in: .github/scripts/release-push.sh
    # Which second source was looked for, why there is none today, and what building one takes.
    why: >-
      Nothing copies these bytes anywhere else today, and a copy alone would not be reachable
      from the job that fetches them: that job is a publish job holding the release credentials,
      and .github/scripts/check-release-credentials.sh lets such a job run no scripts/ program
      but release-push.sh itself and no `uses:` outside its five-action allow-list, so it can
      read neither .github/scripts/ci-tools.sh nor an install action, which is how every second
      source in this manifest is read. release-push.sh fetches and checks these bytes itself,
      with curl, sha256sum and tar, which are not dependency commands. A second source here is
      therefore a ghcr copy and a way for a credentialed job to read it without the helper.
