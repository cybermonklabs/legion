# The variables a test of this repository gates on, one row each, with the class that says why
# the gate does not keep the test out of the jobs ci-ok needs. .github/scripts/check-test-reach.sh
# finds every gate (a Go function, or a Bun or Playwright `skip`/`skipIf`/`if` condition, that
# reads an environment variable and on its value skips the test or guards an assertion), fails on
# a gate whose variable no row here names, and checks the row's class against each gate:
#
#   set           `jobs` names the jobs of ci.yaml that give the test the variable. Each named job
#                 must set it (a workflow, job or step `env:`, an inline `NAME=value command`, an
#                 `export`, or an action that writes it into $GITHUB_ENV, as install-omp writes
#                 LEGION_TEST_OMP), and for each gate some named job must run the gate's test in a
#                 step whose environment holds it. `set_by_script` may name the script a named job
#                 runs that sets it instead (packages/dispatch/e2e/visual-run.sh hands its
#                 container DISPATCH_E2E_VISUAL_SEED): the search then checks that the script
#                 assigns the variable and that a step of a named job runs the script.
#   selector      the same check as `set`, for a variable that chooses which tests run (a flag a
#                 job sets so that its own suites run) rather than one that hands a test an input.
#   prerequisite  each gate calls testprereq.Require (Go) or requireOrSkip or skipWithout
#                 (@legion/test-fixtures/host-tools), or reads GITHUB_ACTIONS and fails there:
#                 off GitHub Actions the test skips naming what it lacks, and on GitHub Actions it
#                 fails.
#   tool          each gate is in a `Benchmark…` function or in a file whose first 15 lines carry
#                 the tool line, `legion: tool - …`: a tool reads what the person running it hands
#                 it, and no job runs it.
#   opt-out       the gate skips only where the variable is set, a person's opt-out on a machine
#                 that lacks what the test needs: some job ci-ok needs runs the test, and none of
#                 them sets the variable in the step that runs it.
#
# A gate in a tool holds under any row, since the tool reads what its runner hands it; the row
# says what the variable is to the tests that also read it. A row whose variable no gate reads is
# a finding too, so a row leaves with the last gate on its variable.
#
# Each row also says why, in a sentence a reviewer can check against the gate.
variables:
  AIRLOCK_MODEL:
    class: set
    jobs: [go-envoy]
    why: The Lean model's binary, which go-envoy's airlock-lean leg builds and hands the corpus comparison and the fuzz.
  APPROVED_VERSION_NEWS_MODEL:
    class: tool
    why: The model part two of approved-version-news runs its sessions on, which scripts/e2e/approved-version-news.sh hands BenchmarkRealSessionsTellAndAnswerANewVersion.
  BROKER_TEST_DATABASE_URL:
    class: set
    jobs: [go-envoy-held, go-envoy, go-daemon]
    why: The Postgres server the broker's store tests make their databases on, a service of each job that runs them.
  CORPUS_SHARD:
    class: set
    jobs: [go-envoy-held]
    why: The shard of the markdown corpus, <leg>/<legs>, each corpus step of go-envoy-held's envoy-go and envoy-go-docs-finalizers legs hands its corpus tests, so the legs between them read each document once.
  DISPATCH_BENCH_DATABASE_URL:
    class: tool
    why: The seeded database BenchmarkSearchLatencyOnCorpus times its searches on.
  DISPATCH_COVERAGE_SCALE_URL:
    class: tool
    why: The Postgres server BenchmarkCoverageStatementScale seeds at production's size.
  DISPATCH_E2E_VISUAL_SEED:
    class: set
    jobs: [dispatch-browser]
    set_by_script: packages/dispatch/e2e/visual-run.sh
    why: The seed file visual-run.sh writes and hands its container, which the visual job runs.
  DISPATCH_XID_REQUIRE_GAP_JUDGMENT:
    class: set
    jobs: [go-envoy-held]
    why: Makes the xid window tests fail, naming why, on a runner whose kernel hides a thread's scheduler clocks, where they would pass on the window's shape alone (storetest.XidRequireGapsEnv); envoy-go's race-impossible step and the finalizers legs set it.
  DISPATCH_EDIT_PROFILE_OUT:
    class: tool
    why: Where BenchmarkProfileTheColdEditOfTheHeaviestDocuments writes its profile.
  DISPATCH_INTAKE_BURST:
    class: tool
    why: The burst BenchmarkIntakeBurstOfMergedPullRequests replays.
  DISPATCH_NEARCOPY_CORPUS:
    class: tool
    why: The corpus BenchmarkNearCopyRefusalReplay replays.
  DISPATCH_OUTBOX_LOAD_STEPS:
    class: selector
    jobs: [go-envoy-held]
    why: Selects TestTheOutboxLoadSteps, which go-envoy-held's dispatch-multiprocess leg runs in a step of its own with it set.
  DISPATCH_FIRST_ROLLOUT_BUILD:
    class: set
    jobs: [go-envoy-held]
    why: The first-rollout build, the newest release before the fleet's schema numbers, that the twobuild suite's transition row runs beside this tree's, which go-envoy-held's two-build legs build.
  DISPATCH_PREVIOUS_BUILD:
    class: set
    jobs: [go-envoy-held]
    why: The older build the twobuild suite runs beside this tree's, which go-envoy-held's two-build legs build.
  DISPATCH_RECALL_CORPUS:
    class: tool
    why: The duplicate corpus the related-recall benchmarks read.
  DISPATCH_RECALL_LATENCY_ISSUE:
    class: tool
    why: The issue BenchmarkRelatedCheckLatencyOnRecallCorpus times its related check against.
  DISPATCH_RECALL_REQUIRE_NO_LOSS:
    class: tool
    why: Makes BenchmarkRelatedRecallOnDuplicates fail on any recall loss.
  DISPATCH_RENDER_CORPUS:
    class: set
    jobs: [go-envoy-held]
    why: Every tracked markdown file, which the corpus step of go-envoy-held's envoy-go legs hands the incremental and the validating render tests.
  DISPATCH_TEST_DATABASE_URL:
    class: set
    jobs: [go-envoy-held, go-envoy]
    why: The Postgres server the Dispatch store tests make their databases on, a service of each job that runs them.
  DISPATCH_TEST_NO_CONTAINERS:
    class: opt-out
    why: A box that runs no test containers sets it to skip the S3-compatible server test; no job sets it.
  DISPATCH_TOKEN_CORPUS:
    class: set
    jobs: [go-envoy-held]
    why: Every tracked markdown file, which the corpus step of go-envoy-held's envoy-go-docs-finalizers legs hands TestWriteCorpusReadsOnce; the corpus benchmarks read it as tools.
  GITHUB_ACTIONS:
    class: prerequisite
    why: testprereq.Require skips off GitHub Actions and fails on it.
  HOME:
    class: prerequisite
    why: The launcher's role-layout tests need a directory outside /tmp and say so through testprereq.Require.
  LEGION_E2E:
    class: selector
    jobs: [ts, pi]
    why: Selects the tests against a real NATS container, which ts's envoy-client leg and pi's pi-envoy and claude-envoy legs run (main's #4287).
  LEGION_E2E_DISPATCH_STACK:
    class: selector
    jobs: [go-envoy, envoy-held]
    why: Selects the envoy-client tests that start a Dispatch stack, which go-envoy's envoy-session-stall leg and envoy-held's envoy-session-proofs leg run.
  LEGION_E2E_ENVOY_STACK:
    class: selector
    jobs: [go-envoy, envoy-held]
    why: Selects the envoy-client tests that build and start natsd and the listener, which go-envoy's envoy-session-stall leg and envoy-held's envoy-session-proofs leg run.
  LEGION_MEMORY_GUARD_LIVE:
    class: tool
    why: The switch of the memory guard's live runs on a pod's own memory, BenchmarkMemoryGuardLiveSandbox and the launcher's TestControllerPodMemoryGuardLiveSandbox, which INFRA-3531's measurement Jobs set in gVisor pods.
  LEGION_SCALE_TEST:
    class: tool
    why: Sizes BenchmarkDismissedScaleHoldsTheInboxsReads.
  LEGION_STATE_CAPTURE:
    class: tool
    why: The capture of one daemon's GET /legion/v1/state that BenchmarkTheLegionReadMatchesACapturedDaemonState holds Dispatch's Legion read to.
  LEGION_TEST_CLAUDE:
    class: set
    jobs: [pi, agent-harness, envoy-held]
    why: The Claude Code binary install-claude-code puts in the job's environment.
  LEGION_TEST_CODEX:
    class: set
    jobs: [pi]
    why: The native Codex binary install-codex puts in the environment of pi's claude-envoy leg.
  LEGION_TEST_DAEMON_LOG_DIR:
    class: set
    jobs: [daemon-live]
    why: The directory the whole-daemon live tests write each test's daemon and Dispatch logs under, which daemon-live uploads when they fail.
  LEGION_TEST_DRAIN_MEASURE:
    class: set
    jobs: [go-daemon]
    why: Turns on the drain test's time bound, which go-daemon measures.
  LEGION_TEST_KIND_IMAGE:
    class: prerequisite
    why: A worker image by digest that a person hands the kind rig in place of an archive; no job sets it, since the kind job loads the archive kind-image builds, and the rig's testprereq.Require fails on GitHub Actions when neither this nor LEGION_TEST_KIND_IMAGE_ARCHIVE is set.
  LEGION_TEST_KIND_IMAGE_ARCHIVE:
    class: set
    jobs: [kind]
    why: The zstd-compressed archive of the worker image the kind-image job builds, which the kind rig decompresses as docker loads it, and then loads into its node.
  LEGION_TEST_KIND_NPM_TARBALLS:
    class: set
    jobs: [kind]
    why: The pinned Claude Code tarballs the kind job's setup fetches, which the rig's npm stand-in serves to its pods.
  LEGION_TEST_NATS_URL:
    class: set
    jobs: [pi, pi-held]
    why: The NATS service of pi's pi-envoy leg and of pi-held, which run the Oh My Pi extension tests.
  LEGION_TEST_OMP:
    class: set
    jobs: [go-daemon, plugin-pack, agent-harness, pi, pi-held, envoy-held]
    why: The Oh My Pi binary install-omp puts in the job's environment.
  LEGION_TEST_PG_DSN:
    class: set
    jobs: [go-daemon, daemon-live, agent-harness, scripts, go-envoy-held, dispatch-browser]
    why: The Postgres server the daemon's tests and the Dispatch harness's make their databases on, a service of each job that runs them.
  LEGION_TEST_UV:
    class: set
    jobs: [go-daemon]
    why: The uv binary install-uv puts in go-daemon's environment.
  LOADTEST_REPLAY_BUNDLE:
    class: tool
    why: The production bundle the loadtest replay benchmarks read.
  PLAYWRIGHT_BASE_URL:
    class: opt-out
    why: A run against a deployed https Dispatch sets it, and the plain-HTTP rows skip there; no job sets it.
  PMDOC_ANCHOR_CORPUS:
    class: set
    jobs: [go-envoy-held]
    why: Every tracked markdown file, which the corpus step of go-envoy-held's envoy-go legs hands the pmdoc mark tests.
  PMDOC_DIFF_BASE:
    class: set
    jobs: [go-envoy-held]
    why: The base dump differential.sh hands TestDifferentialCompare, in the envoy-go leg's pmdoc differential step.
  PMDOC_DIFF_OUT:
    class: set
    jobs: [go-envoy-held]
    why: Where differential.sh has TestDifferentialDump write each side's dump, in the envoy-go leg's pmdoc differential step.
  PMDOC_WALK_CORPUS:
    class: set
    jobs: [go-envoy-held]
    why: Every tracked markdown file, which the corpus step of go-envoy-held's envoy-go legs hands the pmdoc walk test.
