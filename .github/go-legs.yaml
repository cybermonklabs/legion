  # daemon-go-race (job daemon-go-race-legs): under the race detector, the five packages
  # .github/scripts/ci_job_reads.py's DAEMON_RACE_PACKAGES says why. internal/daemon runs in three
  # legs, a group of its tests each (.github/go-legs/packages/daemon/internal/daemon.yaml), since
  # one leg of it alone was the job's time; the four others are leg 4, whose time is
  # internal/launcher's.
  daemon-go-race:
    1:
      - internal/daemon: 1                      # 537 s whole; 293, 260 and 218 s a group in run 45678673783
    2:
      - internal/daemon: 2
    3:
      - internal/daemon: 3
    4:
      - internal/launcher                       # 306 s
      - internal/intake                         # 235 s
      - internal/sessionproxy                   # 8 s
      - internal/shimwire                       # 2 s
  # Packages of the module no leg runs, each with the job that does.
  elsewhere:
    internal/textcheck: text-checks
packages/envoy:
  # envoy-go-race-api (.github/workflows/ci-job-envoy-go-race-api.yaml, job
  # envoy-go-race-api-legs): one package, internal/dispatch/api, in three legs, a group of its
  # tests each (.github/go-legs/packages/envoy/internal/dispatch/api.yaml). It took 1,476 s of a
  # 1,579 s step alone, and one of its tests, which runs alone, is 595 s of that, so group 1 is
  # that test and the groups below it model 438 s each.
  # why: .github/ci-notes/ci-job-envoy-go-race-api.md#why-the-apis-tests-run-in-three-legs
  envoy-go-race-api:
    1:
      - internal/dispatch/api: 1                # one test, 609.9 s (run 45717135535)
    2:
      - internal/dispatch/api: 2                # 1,472 tests, 513.4 s (run 45735800190)
    3:
      - internal/dispatch/api: 3                # 1,392 tests, 417.1 s before the 27 moved here
  # envoy-go-race-docs (job envoy-go-race-docs-legs): one package, internal/dispatch/docs, in
  # three legs, a group of its tests each; 1,430 s alone, and its longest test 491.6 s.
  # why: .github/ci-notes/ci-job-envoy-go-race-docs.md#why-the-document-services-tests-run-in-three-legs
  envoy-go-race-docs:
    1:
      - internal/dispatch/docs: 1               # 444 s modelled
    2:
      - internal/dispatch/docs: 2               # 444 s modelled
    3:
      - internal/dispatch/docs: 3               # 444 s modelled
  # No `elsewhere`: this entry names only the package each of these two jobs runs in legs, and
  # claims nothing about the module's other packages, which run in jobs that do not read this
  # file. So a package added to or taken out of packages/envoy is no problem of these legs, whose
  # gates select only the API's and the document service's closures
  # (.github/scripts/go_legs.py's problems() says why the daemon's entry, which has one, differs).
