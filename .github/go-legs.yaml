# The packages each leg of a Go job runs. A job that runs in legs runs one copy of itself per leg,
# at the same time, each over the packages its leg lists here, with the same flags (-race, -skip,
# -timeout) in every leg; a job of the job's old name then passes only when every leg passed, so
# its check-run name and ci-ok's reading of it stay as they were.
#
# Each package of a module is in exactly one place here: one leg of one job, or `elsewhere`, a
# job that runs it outside these legs. A package too long for one leg is in several legs of one
# job, each `- <package>: <group>`, a group of its top-level tests from
# .github/go-legs/<module>/<package>.yaml, and those places are its one place. A package two jobs
# each run in a mode of their own (a plain leg and a race leg) is named under the module's `twice`,
# with why, and is then in the legs of exactly those two jobs, once in each. Every module names
# under `unlisted` its plain job, whose last leg runs each package `go list ./...` prints and no
# place here names, with a warning in every leg, so a pull request that adds a package and no line
# here neither fails the merge group nor runs the package nowhere; list every package all the same,
# in the same change that adds it (docs/testing.md), and a package under a tree of envoy's race lane
# must be listed in its race leg, which ci_job_reads.py's hold_envoy_legs holds.
# .github/scripts/go_legs.py, which each leg's go test step runs, holds all of that before the
# leg's tests run; which readings are errors that stop a leg and which are warnings it works
# through is written in .github/ci-notes/ci-job-daemon-go.md#why-the-daemons-tests-run-in-legs
# (a package in no place or two, the legs and the matrix, `unlisted`) and
# #why-internaldaemons-tests-run-in-three-legs (the groups of a split package's tests). A leg sees
# only its own job, so .github/scripts/ci_job_reads.py's hold_daemon_legs and hold_envoy_legs,
# which the changes job imports, hold each module's job keys to the jobs whose legs run
# (daemon-go and daemon-go-race; envoy-go and envoy-go-race) beside `elsewhere`, `unlisted` and
# envoy's `twice`, and `unlisted` to the plain job; with both, none runs in no job.
#
# The legs are balanced from measured times: a leg takes as long as its longest package, or as
# its packages' sum over the runner's four cores when that is longer, and go test starts its
# packages in the order they are given, so each leg lists its longest first. The daemon's times
# beside its packages are the medians of the four green merge groups after the Postgres service ran
# with crash
# safety off (#5515, 2026-11-25 14:32Z-16:27Z: runs 45634905903, 45640650357, 45646796488 and
# 45651378097, daemon-go jobs 139278625735, 139299288707, 139321421329, 139337574002 and
# daemon-go-race jobs 139278625746, 139299288812, 139321421627, 139337574008); a package with none
# ran under a second or has no test.
# Rebalance from the times the legs' own runs print, `ok <package> <seconds>s`.
# why: .github/ci-notes/ci-job-daemon-go.md#why-the-daemons-tests-run-in-legs
