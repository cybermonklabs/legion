      - internal/admit                          # 134 s
      - internal/api                            # 90 s
      - internal/leakguard                      # 51 s
      - internal/classify                       # 39 s
      - internal/runtime/tmux                   # 38 s
      - internal/record                         # 29 s
      - internal/testnats                       # 28 s
      - internal/repocache                      # 28 s
