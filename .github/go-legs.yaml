# The packages each leg of a Go job runs. A job that runs in legs runs one copy of itself per leg,
# at the same time, each over the packages its leg lists here, with the same flags (-race, -skip,
# -timeout) in every leg; a job of the job's old name then passes only when every leg passed, so
# its check-run name and ci-ok's reading of it stay as they were.
#
# A module's entry with an `elsewhere` key claims the whole module: each of its packages is in
# exactly one place, one leg of one job or `elsewhere`, a job that runs it outside these legs
# (packages/daemon, whose plain legs run the module by elimination). An entry with no `elsewhere`
# names only the packages its legs run, each in one place, and claims nothing about the module's
# others (packages/envoy). A package too long for one leg is in several legs of one job, each
# `- <package>: <group>`, a group of its top-level tests from
# .github/go-legs/<module>/<package>.yaml, and those places are its one place.
# .github/scripts/go_legs.py, which each leg's go test step runs, holds all of that before the
# leg's tests run; which readings are errors that stop a leg and which are warnings it works
# through is written once, in
# .github/ci-notes/ci-job-daemon-go.md#why-internaldaemons-tests-run-in-three-legs. A leg sees
# only its own job, so .github/scripts/ci_job_reads.py's
# hold_daemon_legs, which the changes job imports, holds this module's job keys to the jobs whose
# legs run (daemon-go, daemon-go-race) and `elsewhere`; with both, none runs in no job.
#
# The legs are balanced from measured times: a leg takes as long as its longest package, or as
# its packages' sum over the runner's four cores when that is longer, and go test starts its
# packages in the order they are given, so each leg lists its longest first. The times beside the
# packages are the medians of the four green merge groups after the Postgres service ran with crash
# safety off (#5515, 2026-11-25 14:32Z-16:27Z: runs 45634905903, 45640650357, 45646796488 and
# 45651378097, daemon-go jobs 139278625735, 139299288707, 139321421329, 139337574002 and
# daemon-go-race jobs 139278625746, 139299288812, 139321421627, 139337574008); a package with none
# ran under a second or has no test.
# Rebalance from the times the legs' own runs print, `ok <package> <seconds>s`.
# why: .github/ci-notes/ci-job-daemon-go.md#why-the-daemons-tests-run-in-legs
packages/daemon:
  # daemon-go (.github/workflows/ci-job-daemon-go.yaml, job daemon-go-legs): plain, every package
  # but the race step's and the text checks. Leg 1 is internal/store's, whose 501 s sets its time,
  # beside the next three, each on a core of its own; leg 2 is the rest, about 794 s of package
  # time over four cores, and the steps that run no leg's packages (the race-impossible tests, the
  # stamped shape gate, the forced-order tests and the Stage 1 proof).
  daemon-go:
    1:
      - internal/store                          # 501 s
