      - internal/podsafety                      # 20 s
      - internal/supervise                      # 16 s
      - internal/capabilities                   # 13 s
      - internal/modeltoken                     # 12 s
      - internal/stream                         # 12 s
      - internal/memoryguard                    # 11 s
      - internal/cipher                         # 11 s
      - internal/appauth                        # 10 s
      - internal/procgroup                      # 9 s
      - internal/pause                          # 9 s
      - internal/claudebridge                   # 9 s
      - internal/natsauth                       # 8 s
      - internal/ompsessions                    # 5 s
      - internal/fixtureenv                     # 4 s
      - internal/blockers                       # 3 s
      - internal/rolefile                       # 2 s
      - internal/testpg/testdb                  # 1 s
      - internal/projection                     # 1 s
      - internal/testpg                         # 1 s
      - internal/config                         # 1 s
      - internal/ghconfig
