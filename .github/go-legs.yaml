# The packages each leg of a Go job runs. A job that runs in legs runs one copy of itself per leg,
# at the same time, each over the packages its leg lists here, with the same flags (-race, -skip,
# -timeout) in every leg; a job of the job's old name then passes only when every leg passed, so
# its check-run name and ci-ok's reading of it stay as they were.
#
# Each package of a module is in exactly one place here: one leg of one job, or `elsewhere`, a
# job that runs it outside these legs. .github/scripts/go_legs.py, which each leg's go test step
# runs for its packages, fails the step first when `go list ./...` prints a package no place names,
# or names one twice, when a place names a directory that is no package, when a leg lists none, or
# when the job's legs here are not the legs its matrix runs: so a new package fails every leg until
# it is added here. A leg sees only its own job, so .github/scripts/ci_job_reads.py's
# hold_daemon_legs, which the changes job imports, holds this module's job keys to the jobs whose
# legs run (daemon-go, daemon-go-race) and `elsewhere`; with both, none runs in no job.
#
# The legs are balanced from measured times: a leg takes as long as its longest package, or as
# its packages' sum over the runner's four cores when that is longer, and go test starts its
# packages in the order they are given, so each leg lists its longest first. The times beside the
# packages are those of merge group 45553934471 (2026-11-25), job 139002010987 for daemon-go's and
# job 139002011254 for daemon-go-race's; a package with none ran under a second or has no test.
# Rebalance from the times the legs' own runs print, `ok <package> <seconds>s`.
# why: .github/ci-notes/ci-job-daemon-go.md#why-the-daemons-tests-run-in-legs
packages/daemon:
  # daemon-go (.github/workflows/ci-job-daemon-go.yaml, job daemon-go-legs): plain, every package
  # but the race step's and the text checks. Leg 1 is internal/store's, whose 542 s sets its time,
  # beside the next three, each on a core of its own; leg 2 is the rest, about 880 s of package
  # time over four cores, and the steps that run no leg's packages (the race-impossible tests, the
  # forced-order tests and the Stage 1 proof).
  daemon-go:
    1:
