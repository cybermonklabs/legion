name: CI (dequeued pull request)

# Ends the merge-queue CI run of a pull request the queue took out. Main's queue builds each group
# on top of the group below it, and a pull request that leaves the queue takes its group with it —
# while that group's ci.yaml merge-group run, which nothing cancels, keeps its runners to the end
# and decides nothing. That runner time is what this workflow takes back, for the one case
# ci.yaml's own cancel act cannot see: that act cancels the older groups of the pull request a
# new group of it replaced (.github/ci-notes/ci.md#the-merge-queues-cancel-act-mains-queue-builds-each-group-on-top
# says what it does), and
# a pull request that left the queue builds no new group.
#
# Why pull_request_target. `dequeued` is an activity type of that event alone, and GitHub runs the
# base branch's copy of the workflow with the base branch's token, so a fork's pull request and one
# the queue took out over a conflict are both safe here. Nothing of the head is read, built or
# run: the one checkout step below takes the base branch's commit (github.sha), never the pull
# request's, so no tree of the head is here at all, and its one job holds `actions: write` and
# nothing else.
#
# What the act does — how it reads the removal off the pull request's timeline, which run it
# names, what it deliberately leaves alone, and why a read it could not make is no failure of
# this run — is in .github/scripts/cancel-dequeued-act.sh's header.
#
# It has no concurrency group: two removals cancel two different runs, and a removal that waited
# behind another would cancel nothing while its run went on burning runners.
on:
  pull_request_target:
    types: [dequeued]

jobs:
  cancel-dequeued:
    runs-on: ubuntu-24.04-arm
    # A GraphQL read, one run list and one cancel: the limit is short so that a wedged API call
    # cannot hold a runner, and it is above the minute the timeline read can wait.
    timeout-minutes: 5
    env:
      JOB_TIMEOUT_MINUTES: 5 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    # `gh run list` and the force-cancel need `actions: write`, and nothing here needs another
    # scope: the checkout and the GraphQL read are of a public repository, which GitHub serves to
    # any valid token — the same ground on which `.github/workflows/ci.yaml#cancel-started` holds `actions: write`
    # alone and still checks out.
    permissions:
      actions: write
    steps:
      # For .github/scripts/cancel-dequeued-act.sh and the gh-read.sh it sources. A
      # pull_request_target run checks out the base branch's commit (github.sha), never the pull
      # request's, so no code of the pull request runs here with this token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Cancel the removed group's ci.yaml run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/cancel-dequeued-act.sh
