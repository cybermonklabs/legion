name: CI (dequeued pull request)

# Ends the merge-queue CI run of a pull request the queue took out. Main's queue builds each group
# on top of the group below it, and a pull request that leaves the queue takes its group with it —
# while that group's ci.yaml merge-group run, which nothing cancels, keeps its runners to the end
# and decides nothing. That runner time is what this workflow takes back, for the one case
# ci.yaml's own cancel act cannot see: that act cancels the older groups of the pull request a
# new group of it replaced (the comment above ci.yaml's `cancel-started` says what it does), and
# a pull request that left the queue builds no new group.
#
# Why pull_request_target. `dequeued` is an activity type of that event alone, and GitHub runs the
# base branch's copy of the workflow with the base branch's token, so a fork's pull request and one
# the queue took out over a conflict are both safe here. Nothing of the head is read, built or run:
# this workflow has no checkout step at all, so there is no tree here for a head to reach, and its
# one job holds `actions: write` and nothing else.
#
# Where the commit comes from. The `dequeued` payload carries no beforeCommit, so the job reads the
# pull request's timeline with GraphQL and takes the newest RemovedFromMergeQueueEvent after the
# newest AddedToMergeQueueEvent, which is the selection
# packages/daemon/internal/ghautomerge/removal.go makes over the same two item types; that item's
# `beforeCommit.oid` is the head of the group the queue had built, and its `reason` is read from
# the same item. GitHub can show the event before the timeline holds it, so the read is made up to
# seven times, ten seconds apart: a fixed list of attempts, which bounds the wait at one minute and
# cannot spin. A read GitHub refuses counts as one of those attempts and leaves a warning of its
# own, and no line about what the timeline holds, since a refused read read nothing: the attempts
# are there for an answer that has not come yet, and a 502 or a rate limit is as good a reason to
# ask again as a timeline that has not caught up, where a step that died on the first refusal
# would cancel nothing and leave the run it was to end holding its runners. A run whose seven
# reads were all refused ends red and names what it could not read: it saw no timeline at all, so
# a green run there would say this workflow had looked and found nothing, while the removed group
# kept its runners — a token-scope regression is exactly that shape. A run left alive by the
# bound, with the timeline read and holding no removal, is still stopped by the queue: when the
# pull request is added again, the new group's `cancel-started` cancels the older groups of the
# same pull request.
#
# What it deliberately does not do:
#   * a removal whose reason is `merged` cancels nothing: that group's run tested the tree that
#     landed, and the ci-ok it posted is what let the merge happen;
#   * it names one run, the ci.yaml merge-group run whose headSha is that beforeCommit, so a group
#     the queue builds after the removal — a different head — is never touched;
#   * it adds nothing back to the queue and comments nowhere: a pull request that was taken out
#     over a failure or a conflict is its author's to fix, and the groups that stayed are rebuilt
#     by the queue itself;
#   * it has no concurrency group: two removals cancel two different runs, and a removal that
#     waited behind another would cancel nothing while its run went on burning runners.
#
# The cancel is `force-cancel`, the call ci.yaml's cancel act makes: it leaves a running job's
# `if: always()` steps skipped, so the cancelled run posts no ci-ok, and a failing ci-ok on a
# commit the queue still holds could take an innocent pull request out of the queue. A cancel that
# fails leaves a warning rather than a red job: the run may have completed between the list and the
# call, and an act that reclaims nothing is no failure.
on:
  pull_request_target:
    types: [dequeued]

jobs:
  cancel-dequeued:
    runs-on: ubuntu-24.04
    # A GraphQL poll, one run list and one cancel. 300 s, the 5 minutes that gives, plus this
    # job's slowest retried step alone, as ci.yaml's Budgets note derives one: that step holds
    # the timeline read, which sits inside a seven-pass poll and so costs
    # 7 x (5 x 30 + 150) + 6 x 10 = 2160 s, the run list's 300 s and the force-cancel's 300 s,
    # 2760 s together, a whole number of minutes, so that step's own budget takes one more and
    # this job takes it too. 300 + 2820 = 3120 s -> 52 min. That ceiling is reached only
    # against a host that accepts the connection and then sends nothing through every attempt
    # of every pass; what this job costs when nothing stalls is one read and one cancel.
    timeout-minutes: 52
    # `gh run list` and the force-cancel need `actions: write`, and nothing here needs another
    # scope: the checkout below reads a public repository's git data, which GitHub serves to any
    # valid token, and so is the GraphQL read of its pull request — the same ground on which
    # ci.yaml's `cancel-started` holds `actions: write` alone and still checks out.
    permissions:
      actions: write
    steps:
      # The job reads nothing of the tree but .github/scripts/ci-retry.sh, the one retry every
      # download of this repository's CI goes through, so the .github cone is the whole checkout
      # it needs, as ci.yaml's `cancel-started` takes it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Cancel the removed group's ci.yaml run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Its own retry arithmetic, so an exhausted read fails this step by name rather than
        # being cut part way by the job. The timeline read is written inside the seven-pass
        # poll below, so the step waits for seven of its ladders and the six 10 s sleeps
        # between the passes: 7 x (5 x 30 + 150) + 6 x 10 = 2160 s, where every read stalls
        # for the whole of every attempt, and 7 x 150 + 6 x 10 = 1110 s where GitHub refuses
        # each one at once. Then the run list's 5 x 30 + 150 = 300 s and the force-cancel's
        # 300 s, which counts once because the queue starts one ci.yaml run for a group and
        # the loop below is over the runs to cancel
        # (.github/scripts/check-download-retry.sh's DECLARED_LOOPS carries that 300 s).
        # 2160 + 300 + 300 = 2760 s, a whole number of minutes, so the budget is the next one
        # strictly above it -> 47 min.
        timeout-minutes: 47
        run: |
          . .github/scripts/ci-retry.sh
          query='query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                timelineItems(last: 20, itemTypes: [ADDED_TO_MERGE_QUEUE_EVENT, REMOVED_FROM_MERGE_QUEUE_EVENT]) {
                  nodes {
                    __typename
                    ... on RemovedFromMergeQueueEvent { createdAt reason beforeCommit { oid } }
                  }
                }
              }
            }
          }'
          # The nodes come oldest first, so the selection is the last removal after the index of
          # the last entry: a removal before that index belongs to an earlier turn in the queue.
          select='.data.repository.pullRequest.timelineItems.nodes as $nodes
            | ([$nodes | to_entries[]
                | select(.value.__typename == "AddedToMergeQueueEvent") | .key] | last) as $added
            | [$nodes[(($added // -1) + 1):][]
               | select(.__typename == "RemovedFromMergeQueueEvent")] | last // empty'
          # `refused` counts the reads GitHub answered with an error. A refused read says
          # nothing about the timeline, so it prints its own line and not the line about a
          # timeline that holds no removal; a run whose every read was refused read no timeline
          # at all and ends red, because a token-scope regression or an API that is down for a
          # minute would otherwise leave this workflow green and silent while the removed
          # group kept its runners — the one thing it exists to prevent.
          #
          # The loop below is a poll and not a retry: it waits for a removal to reach the
          # timeline, which is why it goes round again on a read that succeeded and held
          # nothing. The attempts against a refusing or stalling API are the helper's, at the
          # 30 s an attempt this repository's CI gives one page of an API route (ci.yaml's
          # Retries note), so one rule still holds them (dispatch://INFRA-1545, R2) and a read
          # that counts as refused here is one five bounded attempts could not make.
          refused=0
          for attempt in 1 2 3 4 5 6 7; do
            if removal=$(retry_fetch "pull request #$PR_NUMBER's timeline" 30 -- \
              gh api graphql -F owner="${GITHUB_REPOSITORY%%/*}" -F name="${GITHUB_REPOSITORY#*/}" \
              -F number="$PR_NUMBER" -f query="$query" --jq "$select"); then
              [ -z "$removal" ] || break
              echo "read $attempt of 7 of pull request #$PR_NUMBER's timeline holds no removal after its newest queue entry"
            else
              removal=
              refused=$((refused + 1))
              echo "::warning::GitHub refused read $attempt of 7 of pull request #$PR_NUMBER's timeline, so that read says nothing about a removal"
            fi
            [ "$attempt" = 7 ] || sleep 10
          done
          if [ "$refused" = 7 ]; then
            echo "::error::GitHub refused all 7 reads of pull request #$PR_NUMBER's timeline, so this run read no timeline at all: it cannot name the group the queue removed, and that group's ci.yaml run keeps its runners until the queue's next group ends it"
            exit 1
          fi
          if [ -z "$removal" ]; then
            echo "::notice::no removal of pull request #$PR_NUMBER reached its timeline in the minute this run waited, so no run is named and none is cancelled; the group the queue builds next ends this one"
            exit 0
          fi
          reason=$(jq -r '.reason // "no reason"' <<<"$removal")
          before=$(jq -r '.beforeCommit.oid // ""' <<<"$removal")
          echo "pull request #$PR_NUMBER left the queue at $(jq -r '.createdAt' <<<"$removal") for reason '$reason', out of the group whose head is ${before:-no commit}"
          if [ "$reason" = merged ]; then
            echo "that removal is the merge itself, so the group's run tested the tree that landed: nothing is cancelled"
            exit 0
          fi
          if [ -z "$before" ]; then
            echo "::warning::the removal names no beforeCommit, so there is no group head to look for and nothing is cancelled"
            exit 0
          fi
          # The same 30 s an attempt as the reads above: a refused list would leave the removed
          # group's run holding its runners with nothing to say about it.
          runs=$(retry_fetch "the merge-group runs of $before" 30 -- \
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yaml --event merge_group \
            --commit "$before" --limit 20 --json databaseId,headSha,status,conclusion)
          doomed=$(jq -r --arg sha "$before" \
            '.[] | select(.headSha == $sha and .status != "completed") | .databaseId' <<<"$runs")
          if [ -z "$doomed" ]; then
            echo "no ci.yaml merge-group run with head $before is still going, so nothing is cancelled. What that commit's runs are: $(jq -c --arg sha "$before" '[.[] | select(.headSha == $sha) | {databaseId, status, conclusion}]' <<<"$runs")"
            exit 0
          fi
          # The loop is over the runs to cancel, not over the attempts: those are the helper's,
          # at the same 30 s an attempt as the read above.
          while read -r id; do
            echo "run $id is the ci.yaml merge-group run of the group whose head is $before, and it has not completed: force-cancel it"
            retry_fetch "the force-cancel of run $id" 30 -- \
              gh api --silent --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/force-cancel" ||
              echo "::warning::force-cancel of run $id failed; it may have completed already"
          done <<<"$doomed"
