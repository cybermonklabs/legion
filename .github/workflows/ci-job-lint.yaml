name: CI job lint

# The steps of ci.yaml's `lint` job, in a file of its own, and the private-name check of the
# repository in a job beside it (private-names, below).
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# Each job's last step reports ci-ok for the caller: on a merge-group run its own result decides,
# it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of ci.yaml ends.
# `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true
      changes-result:
        description: >-
          ci.yaml's `needs.changes.result`: the two notices steps below run when `changes` did
          not succeed, as they do in ci.yaml, and the go-fetch-lint restore when they do not.
        type: string
        required: true
      go_notices:
        description: >-
          ci.yaml's `needs.changes.outputs.go_notices`: the two notices steps below run when
          that filter matched, and the go-fetch-lint restore when they do not.
        type: string
        required: true
    secrets:
      PRIVATE_NAME_TERMS:
        description: >-
          The deployment's own private names, one a line, which the private-names job below
          checks for (.github/scripts/check-private-names.sh's fifth rule, whose header says what
          an unset list does on each event).
        required: false

# Every go command of this workflow runs with the module proxy off (GOPROXY=off) and go.mod read
# only (GOFLAGS=-mod=readonly), so a module the cache its job restored lacks fails the step at once
# and names the module, where it would otherwise be downloaded while a test runs and fail the test
# whenever the module proxy or the checksum database fails, on a change that touched nothing it
# tests. A job's fetch step (.github/scripts/go-fetch.sh file, after its restore and before its
# first go step) is the one step that goes online, through GO_FETCH_PROXY, tried again on failure;
# a step that must go online and is no fetch step sets its own GOPROXY to GO_FETCH_PROXY, with a
# `go-offline:` line saying why. .github/scripts/go_offline_jobs.py holds every job to this.
# GO_FETCH_PROXY: a `|` between proxy entries makes a go command fall through to the next source
# after ANY error, where a `,` falls through only after a 404 or a 410 (Go's module reference,
# "GOPROXY protocol"). proxy.golang.org reset a download mid-stream and turned a Go lane red on a
# module whose hash go.sum already holds (sjawhar/legion#2512); with `|direct` the fetch takes the
# same bytes straight from the source and checks them against go.sum, so this is a second path,
# not a weaker check.
env:
  GO_FETCH_PROXY: https://proxy.golang.org|direct
  GOPROXY: "off"
  GOFLAGS: -mod=readonly

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This job runs on every change, so the pin check runs on every change rather than only on
      # one that touches a package.
      - name: Check every Bun install reads .bun-version
        run: .github/scripts/check-bun-version.sh

      # This job runs on every change too, and the gate reads only the tree: bun.lock, the
      # browser image's Dockerfile and that image's row.
      - name: Check the browser image's Playwright is the one bun.lock resolves
        run: .github/scripts/check-playwright-version.sh

      - name: Check frozen Bun installs copy every workspace manifest
        run: .github/scripts/check-bun-workspace-manifests.sh

      - name: Check every manifest names the one exact zod
        run: .github/scripts/check-zod-version.sh

      - name: Check the saved gh help is the worker image's gh
        run: .github/scripts/check-gh-version.sh

      - name: Check the gitleaks the release lane fetches is the one the daemon links
        run: .github/scripts/check-gitleaks-version.sh

      - name: Check image triggers cover every image input
        run: .github/scripts/check-image-trigger-paths.sh

      - name: Check every image a CI job fetches is a row of .github/ci-images.yaml
        run: .github/scripts/check-ci-images.sh tree

      - name: Check every tool asset of .github/ci-tools.yaml agrees with its pin
        run: .github/scripts/check-ci-tools.sh

      - name: Check every remote action is pinned to a commit SHA
        run: .github/scripts/check-action-pins.sh

      - name: Check no current file names the pre-split Oh My Pi plugin
        run: .github/scripts/check-plugin-names.sh

      # Biome's own rule refuses the `fireEvent` import under packages/dispatch/web/src, and a file
      # that needs it keeps one `biome-ignore` naming that file's reasons. The rule reads imports,
      # so it says nothing about a call added to a file whose exemption is already in place, which
      # is what a forward merge of main brings: no conflict, no lint error, no type error. This
      # check asks each call for its own reason instead.
      - name: Check every fireEvent call of the Dispatch suite carries its own reason
        run: .github/scripts/check-fireevent-reasons.sh

      # A go command a test starts reads the module cache alone (GOPROXY=off), and a job fetches
      # what its tests build in a step before them. This holds every place a Go, TypeScript, Python
      # or shell file starts a go command to that rule, or to a go-offline reason beside it, and
      # every job that runs a test built through testbuild to a fetch step before it.
      - name: Check that no test of a required job fetches a Go module while it runs
        run: .github/scripts/check-go-offline.sh

      # Under a fresh HOME the pinned Oh My Pi fetches model catalogs over HTTPS. This holds every
      # place a Go or TypeScript test starts it to its language's offline helper (testbin.OMPOffline,
      # ompOffline), or to an omp-offline reason beside it.
      - name: Check every test that starts Oh My Pi runs it offline
        run: .github/scripts/check-omp-offline.sh

      # Only on a pull request and a merge group, the two events that have a base to compare
      # with: this job also runs on the bypass check's dispatched run at main's tip, where the
      # change has already merged. The condition tests `github.event_name` and no output of the
      # `changes` job, which rules 2 and 3 of .github/scripts/check-ci-filters.sh require of a
      # step in this job.
      - name: "Check the daemon API contract: the files that hold its number agree, and a change to it declares a number above the base's"
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-daemon-api-contract.sh

      - name: Check the release workflows keep credentials out of jobs that run dependency code
        run: .github/scripts/check-release-credentials.sh

      # Every package whose fragments a release renders is a line of .github/changelog-packages,
      # which this check reads: a fragment of any other package is rendered nowhere and nothing
      # would report it, so it is refused here, on every pull request.
      - name: Check every changelog fragment belongs to a listed package
        run: |
          # shellcheck disable=SC2046 # the file is the package list, split on purpose
          .github/scripts/release-push.sh fold-orphans $(<.github/changelog-packages)

      # No setup-go cache: gofmt needs none, and the two module caches below, go-notices and
      # go-fetch-lint, are restored in steps of their own, keyed on the Go version this step
      # installs.
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      # The skill-scenario rig's daemon-pane.go belongs to no module (it runs with `go run -overlay`
      # inside packages/daemon), so it is formatted here with the daemon.
      - name: Check the Go daemon's formatting
        run: |
          unformatted=$(gofmt -l packages/daemon packages/pi-legion/scripts/skill-scenarios/daemon-pane.go)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not gofmt-formatted; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The frozen install above does not refuse a workspace `version` the lockfile does not hold.
      # --lockfile-only writes the lockfile the manifests imply and installs nothing, so a
      # difference here is what a reader's own `bun install` would write.
      - name: Check bun.lock agrees with the workspace manifests
        run: |
          bun install --lockfile-only
          if ! git diff --exit-code bun.lock; then
            echo "::error file=bun.lock::bun.lock disagrees with the workspace manifests; run bun install and commit bun.lock, and after a forward merge of main take one side's bun.lock whole before installing"
            exit 1
          fi

      # A package's `bun run lint` checks only the paths its recipe names. This is the command the
      # root README.md's "Development" section documents, over the whole tree, so a fixture,
      # config or test file that Biome would rewrite fails here instead of on the next person who
      # runs it.
      - name: Check the whole tree with Biome
        run: bunx biome check .

      # One module cache is restored before the fetch below, and never two: a restore extracts its
      # tar over ~/go/pkg/mod, whose module directories Go makes read-only, so a second entry
      # restored over a first fails on every file the two share (GNU tar 1.35, the runner's:
      # "Cannot open: File exists", exit 2). When the notices step at the end of this job runs,
      # the one is go-notices, which that step needs and which holds every module its builds load,
      # natsfloor's among them; when it does not, it is go-fetch-lint, which holds what the fetch
      # below fetches and nothing else. The two conditions are each other's negation.
      #
      # go-notices: the notices step builds go-licenses and loads every release binary's modules.
      # It keeps them in a cache family of its own, restored only when the notices step runs and
      # filled by ci-caches.yaml. Its key hashes the module files of both workspaces the step
      # builds in, the notices scripts and the target lists that decide what it builds, the fetch
      # file below and go-fetch.sh, so a change to any of them fills a fresh entry on the push to
      # main that lands it, and ci-caches.yaml's superseded job deletes the entry it replaced, about
      # 2.2 GB, rather than leaving it to hold its space for seven days; a go.sum change in a pull
      # request restores the newest entry by prefix, and the step builds only what moved, Go's
      # build cache being content-addressed.
      #
      # The runner's architecture comes before the OS in this family's key, where the other Go
      # families put it after: the entry holds go-licenses, a program of the runner that built it,
      # which the notices step runs. A run of a workflow file older than the architecture in the
      # key (a pull request into a branch cut before it, a dispatch on such a branch, or a re-run of
      # a run made before it) restores on ubuntu-24.04 by the prefix go-notices-Linux-, and an entry
      # keyed go-notices-Linux-ARM64-go<version> starts with that prefix: such a run restored main's
      # arm64 go-licenses on x86_64 and failed on it with "Exec format error" (run 44437023306). No
      # key of this shape starts with go-notices-Linux-, so no older prefix matches an entry of this
      # shape, and a run of this shape names its own runner's architecture first, so it matches only
      # an entry of that architecture. An entry saved under the old shape still matches the older
      # prefixes, and no one deletes it by hand: GitHub removes an entry after 7 days with no read,
      # or earlier, oldest read first, once the repository's caches reach their size limit, and
      # each such run's restore is a read. So an x86_64 run of an older workflow file on the entry's
      # Go and go-licenses versions restores it and fails, and only a run of a commit that carries
      # this key stops reading it.
      - if: inputs.changes-result != 'success' || inputs.go_notices == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.arch }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', 'packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', '.github/scripts/go-release-notices.sh', 'scripts/go-third-party-notices.sh', '.github/go-release-targets.json', '.github/agent-secrets-client-targets.json', '.github/envoy-infra-targets.json', '.github/go-fetch/lint.txt', '.github/scripts/go-fetch.sh') }}
          restore-keys: ${{ format('go-notices-{0}-{1}-', runner.arch, runner.os) }}
      # go-fetch-lint: the modules of the fetch below, about 50 MB, under the key
      # .github/workflows/ci-caches.yaml's fetch-lint job fills: the runner's architecture, the Go
      # version and the hash of the module files that fetch reads in the root workspace, of its
      # fetch file and of go-fetch.sh. A pull request that changes those files restores the newest
      # entry by prefix, and the fetch then downloads only what moved. Only a push to main fills
      # the family, so a change before its first fill, or after GitHub evicted its entries, finds
      # none; the second restore key then takes main's newest go-envoy entry of this runner's
      # architecture, which holds every module archive this fetch reads, so the fetch downloads
      # nothing. The path names the build cache as that entry was saved with: a restore matches
      # only an entry saved with the same paths, and the family's own fill saves both too.
      - if: inputs.changes-result == 'success' && inputs.go_notices != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-fetch-lint-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/lint.txt', '.github/scripts/go-fetch.sh') }}
          restore-keys: |
            ${{ format('go-fetch-lint-{0}-{1}-', runner.os, runner.arch) }}
            ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
      # The test below builds natsfloor while it runs, with GOPROXY=off
      # (@legion/test-fixtures/go-command): a fetch inside a test fails it whenever the module
      # proxy does, on a change that touched nothing it tests. This step fetches that build's
      # modules first, from the module cache restored above, tried again on failure.
      - name: Fetch the modules this job's go steps load
        run: .github/scripts/go-fetch.sh file .github/go-fetch/lint.txt

      # The listener and the Legion daemon refuse a nats-server below packages/envoy/natsversion's
      # floor, so a live proof that starts one, and a script or page that installs one, must name
      # one the floor takes. The test scans every tracked shell script and every tracked text file
      # for those, so it runs here, on every change: the test job runs it too, but only when its
      # filter selects scripts/e2e, and a new driver or page can be anywhere.
      - name: Check every NATS server a script starts or installs is one the floor takes
        run: bun test scripts/e2e/lib/nats-image.test.ts

      # After the install, which is what gives it node_modules: it lists each Bun gate's tsc
      # program with `bunx tsc --listFilesOnly`, and the modules each entry a gate's job runs
      # loads with `bun build --metafile`, and holds every such file to that gate's filter,
      # so the TypeScript half of what those filters must select is derived rather than
      # hand-kept. In this job because the ci-filters job has neither Bun nor node_modules, and
      # because this one is gated by no `changes` output, so a change anywhere can start it.
      - name: Check every Bun gate's filter selects the files its typecheck compiles
        run: .github/scripts/check-ts-filters.sh

      # Every Go archive a release ships carries THIRD_PARTY_NOTICES, written at build time with
      # the build's own GOOS, GOARCH and CGO_ENABLED (release.yaml's legion_build job and
      # release-envoy-listener.yaml, whose targets .github/go-release-targets.json lists for all of
      # them, and release-envoy-infra.yaml, whose targets .github/envoy-infra-targets.json lists).
      # Writing them here for each of those builds fails the pull request that brings in a module
      # whose license cannot be determined, before a release does. Writing notices loads packages
      # without type-checking them, so the darwin agent-secrets client and every command of the
      # envoy-infra module, which no other pull-request job builds for each of its targets, are also
      # compiled here, with their release builds' CGO_ENABLED and -buildvcs: a compile error on one
      # platform only fails the pull request rather than the release after the merge. It runs when
      # the go_notices filter matches (a Go package it loads, a module file, a target list or the
      # notices script changed), and whenever `changes` did not succeed.
      #
      # The loops are in .github/scripts/go-release-notices.sh, which
      # .github/workflows/ci-caches.yaml's notices job runs too, to fill the go-notices entry this
      # job restores before the natsfloor fetch above: one script, so the fill cannot warm anything
      # but what this step builds.
      #
      # The one step of this job that goes online while it runs: it is a release's build, run as
      # the release runs it, and no test. Its go-licenses install and the cross builds of every
      # release target read the go-notices entry restored above first, and fetch what that lacks.
      # go-offline: the release archives' notices step builds go-licenses and every release target as the releases do, online, and runs no test.
      - name: Check every Go release archive's third-party notices can be written and the cross-built commands compile
        if: inputs.changes-result != 'success' || inputs.go_notices == 'true'
        env:
          GOPROXY: ${{ env.GO_FETCH_PROXY }}
        run: .github/scripts/go-release-notices.sh "$RUNNER_TEMP/notices"

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: lint
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  # The repository's private-name check, in a job of its own: it reads the deployment's term list
  # (PRIVATE_NAME_TERMS), and no job that runs dependency code holds that list, as the lint job
  # above does (bun install, Biome, go). This one checks the repository out and runs that shell
  # script alone.
  private-names:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # By the checkout's own path, the form every job that holds the list runs the check by.
      - name: Check no file names the private deployment repository, company, internal host, tailnet host, or a term of the deployment's own list
        env:
          PRIVATE_NAME_TERMS: ${{ secrets.PRIVATE_NAME_TERMS }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/check-private-names.sh"

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: lint
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
