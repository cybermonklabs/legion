name: CI job dispatch-memory

# The steps of `.github/workflows/ci.yaml#dispatch-memory` and `.github/workflows/ci.yaml#dispatch-memory-group`
# jobs, in a file of their own. ci.yaml's job of each id calls this file and passes its own id as
# `job`, and the job of this file named for it runs while the other is skipped. Each caller keeps
# `needs: changes` and the whole `if:` that decides whether its job runs, so the `if:` here only
# picks which of the two that is. The two share a file because ci.yaml already calls as many
# reusable workflows as .github/scripts/check-workflow-files.sh allows it
# (.github/ci-notes/ci.md#two-jobs-that-call-one-file).
#
# The split is for the filters. Each job's filter names this file beside ci.yaml, so a change to
# these steps selects these two jobs alone, where a change to ci.yaml selects every job.
#
# Each job runs every one of its steps wherever it runs. dispatch-memory runs the memory tests of
# the Dispatch server, a slow suite: its `dispatch_memory` output is held back on a pull request
# without the label full-ci or lane:dispatch_memory, so it runs in the merge queue
# (.github/ci-notes/ci.md#which-lane-a-job-runs-in-the-pull-request-or-the-merge-queue).
# dispatch-memory-group runs the one memory-group test, which takes minutes, so a pull request
# runs it wherever its paths select it (.github/ci-notes/ci.md#the-memory-group-test).
#
# Each job's last step reports ci-ok for its caller: on a merge-group run the job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      job:
        description: >-
          The id of ci.yaml's job that calls this file, `dispatch-memory` or
          `dispatch-memory-group`: the job of this file of that id runs, and the other is skipped.
        type: string
        required: true
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  dispatch-memory:
    if: inputs.job == 'dispatch-memory'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOB_TIMEOUT_MINUTES: 75 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # No commit, checkpoint or database copy here waits for the runner's disk: why every
      # Postgres service runs so is .github/scripts/pg-crash-safety-off.sh's header.
      - name: Turn crash safety off on the service
        timeout-minutes: 2
        run: .github/scripts/pg-crash-safety-off.sh "${{ job.services.postgres.id }}"
      - name: Memory tests of the Dispatch server
        run: |
          pattern=$(../../.github/scripts/go-tagged-tests.sh memory ./cmd/dispatch)
          go test -tags memory -count=1 -timeout 60m -v -run "$pattern" ./cmd/dispatch
        working-directory: packages/envoy

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: dispatch-memory
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  dispatch-memory-group:
    if: inputs.job == 'dispatch-memory-group'
    # amd64, as production is: the test's 50 ms margin is a measurement of this architecture.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
      # The test skips with its reason unless this is set, so envoy-go's untagged run leaves it be.
      DISPATCH_TEST_MEMORY_GROUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # No commit, checkpoint or database copy here waits for the runner's disk: why every
      # Postgres service runs so is .github/scripts/pg-crash-safety-off.sh's header.
      - name: Turn crash safety off on the service
        timeout-minutes: 2
        run: .github/scripts/pg-crash-safety-off.sh "${{ job.services.postgres.id }}"
      # The image the test runs the server in, read from the Go constant that declares it, and
      # pulled first for the reason the action gives.
      - name: Pull the container image the test runs the server in
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/cmd/dispatch/agent_memory_group_test.go memoryGroupImage
      - name: The server ends its agent before the kernel
        run: go test -count=1 -timeout 15m -v -run '^TestTheServerEndsTheAgentBeforeTheKernel$' ./cmd/dispatch
        working-directory: packages/envoy

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: dispatch-memory-group
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
