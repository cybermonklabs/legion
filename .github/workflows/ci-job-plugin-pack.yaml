name: CI job plugin-pack

# The steps of ci.yaml's `plugin-pack` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# What runs here is one test: internal/daemon's TestTheRealPluginsOnTheRealOhMyPi, which packs
# packages/pi-envoy and packages/pi-legion with `bun pm pack` — each pack running that package's
# prepack, which reads bun.lock and builds the bundle from the installed workspace — installs the
# two tarballs on the real Oh My Pi and reads back what the daemon's boot gate reads. It was a
# test of .github/workflows/ci-job-daemon-go.yaml's race step, which skips it by name now: its
# reads are the whole reason that job's filter named the lockfile, and a lockfile change then ran
# the daemon's entire Go suite, 1,083 s of tests that could not see it (dispatch://INFRA-1413).
# With the test here, a bun.lock-only change runs this test and no other daemon Go test.
#
# The test's name is written in .github/scripts/ci_job_reads.py (PACK_TESTS), which builds this
# step's `-run` and the race step's `-skip` from the one list and holds each step's whole script
# to the text it builds, so the two cannot come to name different tests.
#
# Everything here is what that one test needs:
#   * Bun and a frozen install — `bun pm pack` is the test's first act, and each prepack builds
#     its bundle from the installed workspace and fails rather than skips without it;
#   * Oh My Pi at the pin .omp-pin names, which the test installs the two packed plugins on
#     (internal/testbin's OMP refuses on GitHub Actions without LEGION_TEST_OMP), installed
#     through the mise install-jj leaves at ~/.local/bin/mise;
#   * setup-go and the go-daemon cache restore: the step compiles internal/daemon's test binary,
#     the same build the daemon-go race step makes, so it restores the same entry.
# No database, no tmux, no uv and no container image: the test starts none of them.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  plugin-pack:
    runs-on: ubuntu-24.04
    # The step's own -timeout is 15 minutes, as the daemon's plain step carries, so a hung pack
    # prints the goroutine dump that names it before the runner cancels the job. Around it are
    # the Bun install, the two tool installs and the Go build of internal/daemon's test binary,
    # which the cache restore above makes incremental; 30 minutes leaves that setup room on a
    # slow runner and still fails inside the hour.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pack: `bun pm pack` runs each plugin's prepack, which builds its bundle from the
      # installed workspace and t.Fatal rather than skips when the pack fails.
      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      # go-daemon, shared with typecheck, daemon-go and pi-legion: this step compiles the same
      # package's test binary the daemon-go race step does.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-daemon-{0}-', runner.os) }}

      # Only for the mise it leaves at ~/.local/bin/mise, which install-omp installs the pin
      # through: no test of this job runs jj.
      - uses: ./.github/actions/install-jj

      # The test runs the Oh My Pi the worker image ships and refuses on GitHub Actions without
      # one (internal/testbin's OMP). The pin is read from .omp-pin, the repository's one copy of
      # it, installed through the mise above (.github/actions/install-omp).
      - uses: ./.github/actions/install-omp

      # The one test, by name. .github/scripts/ci_job_reads.py builds this text and the daemon-go
      # race step's `-skip` from PACK_TESTS and holds both steps to what it builds.
      - name: Pack the plugin releases and load them on the real Oh My Pi
        run: go test -count=1 -timeout 15m -run '^(TestTheRealPluginsOnTheRealOhMyPi)$' ./internal/daemon/
        working-directory: packages/daemon

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: plugin-pack
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
