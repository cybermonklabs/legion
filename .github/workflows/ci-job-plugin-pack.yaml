name: CI job plugin-pack

# The steps of two jobs, `.github/workflows/ci.yaml#plugin-pack` and
# `.github/workflows/ci.yaml#step-models-chain`, in one file.
# ci.yaml's job of each id calls this file and passes its own id as `job`. Each caller keeps
# `needs: changes` and the whole `if:` that decides whether its steps run. So the `if:` each job
# here carries only picks the job named for the caller
# (.github/ci-notes/ci.md#two-jobs-that-call-one-file). The two share a file because ci.yaml may
# call no more reusable workflows (.github/scripts/check-workflow-files.sh, rule 5). They are also
# the nearest pair: both run named tests of packages/daemon's internal/daemon on the real Oh My
# Pi, off the same go-daemon cache family.
#
# The split is for the filters. Each job's filter names this file beside ci.yaml. So a change to
# these steps selects these two jobs alone, where a change to ci.yaml selects every job.
#
# What the plugin-pack job runs is the three tests of internal/daemon that
# .github/scripts/ci_job_reads.py's PLUGIN_PACK_TESTS names. A fourth test of that package
# loading a plugin on the real Oh My Pi stays in daemon-go
# (TestThePromptReferenceProbeOnTheRealOhMyPi). TestTheRealPluginsOnTheRealOhMyPi packs
# packages/pi-envoy and packages/pi-legion with `bun pm pack`. Each pack runs that package's
# prepack, which reads bun.lock and builds the bundle from the installed workspace. That test
# installs the two tarballs on the real Oh My Pi and reads back what the daemon's boot gate reads.
# TestTheAgentModelCheckOnTheRealOhMyPi probes the prompts this checkout ships, laid out as the
# release lays them out. That layout is packages/pi-legion/agents copied and each plugin's
# partition of skills/ staged with scripts/pi-plugin-prepack.sh itself.
# TestTheImageProbeResolvesTheAgentsTheDaemonsPromptsName probes a plugin it writes
# itself. They were tests of .github/workflows/ci-job-daemon-go.yaml's race step, which skips them
# by name now: their reads are the whole reason that job's filter named the lockfile and skills/,
# and a change to either then ran the daemon's entire Go suite, 1,083 s of tests that could not
# see it (dispatch://INFRA-1413). With the tests here, a change to bun.lock or to one skill runs
# them and no other daemon Go test.
#
# The tests' names are written in .github/scripts/ci_job_reads.py (PLUGIN_PACK_TESTS), which
# builds this step's `-run` and the race step's `-skip` from the one list and holds each step's
# whole script to the text it builds, so the two cannot come to name different tests.
#
# Everything the plugin-pack job holds is what those tests need:
#   * Bun and a frozen install. `bun pm pack` is the pack test's first act. Each prepack builds
#     its bundle from the installed workspace, and fails rather than skips without it.
#   * Oh My Pi at the pin .omp-pin names, which the tests install their plugins on
#     (internal/testbin's OMP refuses on GitHub Actions without LEGION_TEST_OMP). It is installed
#     by .github/actions/install-omp from the release archive, checked against its pinned sha256.
#   * setup-go and the go-daemon cache restore. The step compiles internal/daemon's test binary,
#     the same build the daemon-go race step makes, so it restores the same entry.
# That job starts no database, no tmux, no uv and no container image.
#
# What the step-models-chain job runs is the two e2e-tagged tests of the same package, which
# STEP_MODELS_CHAIN_TESTS names. What it holds is below its own `if:`.
#
# Each job's last step reports ci-ok for its caller. On a merge-group run that job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      job:
        description: >-
          The id of ci.yaml's job that calls this file, `plugin-pack` or `step-models-chain`. This
          file's job of that id runs, and the other is skipped.
        type: string
        required: true
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  plugin-pack:
    if: inputs.job == 'plugin-pack'
    runs-on: ubuntu-24.04
    # The step's own -timeout is 15 minutes, as the daemon's plain step carries, so a hung pack
    # prints the goroutine dump that names it before the runner cancels the job. Around it are
    # the Bun install, the Oh My Pi install and the Go build of internal/daemon's test binary,
    # which the cache restore above makes incremental; 30 minutes leaves that setup room on a
    # slow runner and still fails inside the hour.
    timeout-minutes: 30
    env:
      JOB_TIMEOUT_MINUTES: 30 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pack: `bun pm pack` runs each plugin's prepack, which builds its bundle from the
      # installed workspace and t.Fatal rather than skips when the pack fails.
      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # go-daemon, shared with typecheck, daemon-go and pi-legion: this step compiles the same
      # package's test binary the daemon-go race step does.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-daemon-{0}-{1}-', runner.os, runner.arch) }}

      # The tests run the Oh My Pi the worker image ships and refuse on GitHub Actions without
      # one (internal/testbin's OMP). The pin is read from .omp-pin, the repository's one copy of
      # it (.github/actions/install-omp).
      - uses: ./.github/actions/install-omp

      # The three tests, by name. .github/scripts/ci_job_reads.py builds this text and the
      # daemon-go race step's `-skip` from PLUGIN_PACK_TESTS and holds both steps to what it
      # builds.
      - name: Pack the plugin releases and run the prompt probes on the real Oh My Pi
        run: go test -count=1 -timeout 15m -run '^(TestTheAgentModelCheckOnTheRealOhMyPi|TestTheImageProbeResolvesTheAgentsTheDaemonsPromptsName|TestTheRealPluginsOnTheRealOhMyPi)$' ./internal/daemon/
        working-directory: packages/daemon

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: plugin-pack
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  # The chain that drives both real harnesses behind the real shim and the real daemon.
  # TestStepModelsLive runs the pinned Oh My Pi and Claude Code over two issues whose steps the
  # agents end and whose steps an architect stops. It judges each step record's set model and its
  # answering counts against the agents' own transcripts (scripts/e2e/step-models-check.sh).
  # TestTheStandInGivesEachResponseItsOwnID holds the model stand-ins those counts rest on to one
  # id per response. Everything below the model endpoint is the real thing, and CI holds no model
  # credential. So each harness talks to a stand-in endpoint of the test's own, as every live
  # proof of this repository does.
  #
  # What this job holds that the pack job does not:
  #   * Claude Code at the pin .claude-code-pin names, which the tester panes run.
  #   * jj, which the workspace seed runs.
  #   * The NATS test container image of the package's own broker.
  #   * A Postgres service, the daemon's store. It is sized for the Dispatch processes the test
  #     starts, as every lane that starts one sizes its own.
  #
  # The step runs the daemon's e2e tag, which no other job of ci.yaml runs, and selects with
  # -run. So internal/daemon's untagged tests run in daemon-go-race's "Test the concurrent
  # packages under the race detector" (ci_job_reads.py's TAG_RUNS)
  # (.github/ci-notes/ci.md#why-the-step-models-chain-is-a-job-of-its-own).
  step-models-chain:
    if: inputs.job == 'step-models-chain'
    # ubuntu-24.04, not arm64: the pinned Oh My Pi this job installs is built for linux-x64 alone
    # (.github/ci-notes/ci.md#choose-the-runner-ubuntu-2404-arm-unless-the-job-needs-an-x86_64-machine).
    runs-on: ubuntu-24.04
    # The step's own -timeout is 40 minutes. So a hung chain prints the goroutine dump that names
    # the pane it waited for before the runner cancels the job. Around it are the Bun install, the
    # two harness installs, the image pull and the Go build of internal/daemon's test binary. The
    # cache restore makes that build incremental. 60 minutes leaves that setup room on a slow
    # runner and still fails inside the hour.
    timeout-minutes: 60
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOB_TIMEOUT_MINUTES: 60 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
      # The daemon's store, and the store of the Dispatch the test starts beside it.
      LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up. Its image (testcontainers/ryuk, on Docker Hub) would be one more registry pull a
      # test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # * The `dispatch` CLI the test reads each issue's records with.
      # * The packs of the two Oh My Pi plugins each implementer pane loads.
      # * The claude-envoy build each tester pane loads.
      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # go-daemon, shared with typecheck, daemon-go, plugin-pack and pi-legion: this step compiles
      # the same package's test binary the daemon-go race step does.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-daemon-{0}-{1}-', runner.os, runner.arch) }}

      # The test seeds each issue's workspace with the real jj.
      - uses: ./.github/actions/install-jj

      # The implementer panes run the pinned Oh My Pi (testbin.OMP), which refuses on GitHub
      # Actions without one. The action exports LEGION_TEST_OMP.
      - uses: ./.github/actions/install-omp

      # The tester panes run the pinned Claude Code (testbin.Claude), which refuses on GitHub
      # Actions without one. The action exports LEGION_TEST_CLAUDE.
      - uses: ./.github/actions/install-claude-code

      # The broker the test's daemon consumes is the package's own (testnats.Image), pulled first
      # for the reason the action gives.
      - name: Pull the NATS test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/daemon/internal/testnats/nats.go Image

      # The test starts a Dispatch process, and one such process opens up to
      # store.ConnectionsPerProcess connections, more than PostgreSQL's default max_connections
      # allows. So the service is raised to what a Dispatch test lane needs, as every lane that
      # starts a Dispatch process raises its own. The go run of the script builds envoy's
      # internal/dispatch/store/cmd/connections, after the cache restore so that it reads the
      # restored module cache.
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"

      # No commit, checkpoint or database copy here waits for the runner's disk: why every
      # Postgres service runs so is .github/scripts/pg-crash-safety-off.sh's header.
      - name: Turn crash safety off on the service
        timeout-minutes: 2
        run: .github/scripts/pg-crash-safety-off.sh "${{ job.services.postgres.id }}"

      # The two tests, by name. .github/scripts/ci_job_reads.py builds this text from
      # STEP_MODELS_CHAIN_TESTS and holds the step to what it builds.
      - name: Run the step-models chain on the real harnesses
        run: go test -tags e2e -count=1 -timeout 40m -v -run '^(TestStepModelsLive|TestTheStandInGivesEachResponseItsOwnID)$' ./internal/daemon/
        working-directory: packages/daemon
        env:
          LEGION_E2E_DAEMON_LOG: ${{ runner.temp }}/step-models-evidence/daemon.log
          LEGION_E2E_STEP_MODELS_EVIDENCE: ${{ runner.temp }}/step-models-evidence

      # The chain writes passed.txt as its last act, and only where it has neither failed nor
      # skipped. So a run whose test skipped, or whose -run matched nothing, fails here rather
      # than reporting a green job that proved nothing.
      - name: Fail where the step-models chain did not pass
        run: test -s "$RUNNER_TEMP/step-models-evidence/passed.txt"

      # Whatever the result: both issues' records, the daemon's JSON log, the four claims'
      # transcripts, the stand-ins' served lists, the comparator's whole output and the captures.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: step-models-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/step-models-evidence
          if-no-files-found: warn

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: step-models-chain
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
