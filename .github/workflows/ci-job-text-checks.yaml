name: CI job text-checks

# The steps of ci.yaml's `text-checks` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# What runs here is the tests whose subject is text: a guide's wording against the code it
# pins, a file copied from one tree to another, the imports a package may have, the Dispatch
# API's nine static source checks - its eight source guards and one_expression_guard_test.go -
# which read the module's own source, and the two pure pins of the daemon's supervise table,
# which read that package's own source and, with it, the source of every package it imports,
# since their type-check resolves imports from source (table_test.go:99). None of them starts a
# server, a container or a database, so none of them belongs in a Postgres-backed product
# suite, where it waited behind that suite's fixtures and ran again on every change to the
# module. Each module keeps its own package of them, internal/textcheck, and this job runs those
# three packages, those checks' seventeen tests and those two pins; the three product lanes leave
# exactly those out of their own runs (.github/scripts/ci_job_reads.py's TEXT_CHECK_PACKAGE,
# TEXT_CHECK_TESTS and SUPERVISE_TABLE_TESTS build both sides), so each of these tests runs
# once per run of the router.
#
# packages/envoy/infra is a module of its own, with a go.work of its own binding it and
# packages/envoy, so its text checks run from inside that directory rather than through the
# root workspace.
#
# -count=1 on every call: these tests read files outside their own modules - a guide under
# docs/, a skill under skills/, the committed extract beside the code it pins - and Go's test
# cache keys on neither, so a cached pass would say nothing about the text as it now stands.
#
# The job restores no family's build cache of its own. Each of the six Go cache families
# .github/ci-notes/ci.md#the-router-every-check-a-pull-request-or-the-merge-queue-runs lists that
# holds one is filled for a job that builds a whole module's binaries or test binaries, and this
# job builds five packages: measured here, the four calls this job ran before the supervise pins
# joined it take 4 minutes 4 seconds with an empty build cache and 34 seconds with a warm one, and
# the one build cache it reads is go-envoy-test's, where its own entry is missing (below). The
# fifth call is the slowest of them: on the pod where those four take 6 minutes 23 seconds
# cold the five take 8 minutes 3 seconds, a quarter more, and 86 s of that is the run itself, where
# TestTheTableHasARowOrANamedIgnoreForEveryEventInEveryState type-checks internal/supervise from
# source and, with it, its whole import closure - the module's internal/claim, phase, runtime,
# wait, treelifecycle and backoff, what those import, the module cache's pgx/v5 (supervise's own
# owed.go imports pgconn, and treelifecycle imports the driver), pgpassfile and pgservicefile,
# which pgconn imports for the password and service files it reads, golang.org/x/text, which
# pgconn imports for its secure/precis, gopkg.in/yaml.v3, which internal/ghconfig imports, and
# the standard library - because its checker's importer reads source rather than export data
# (table_test.go:99). The timeout below still leaves the job about three times its cold run.
# setup-go caches nothing either (`cache: false`), as in every job of ci.yaml. What the job does
# restore is go-fetch-text-checks: what the fetch step below fetches
# (.github/go-fetch/text-checks.txt), which ci-caches.yaml's fetch-text-checks job fills from the
# same file, so that step finds every module there and downloads none. Where that family has no
# entry, the restore takes main's go-envoy-test entry instead (the restore step says why).
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# Every go command of this workflow runs with the module proxy off (GOPROXY=off) and go.mod read
# only (GOFLAGS=-mod=readonly), so a module the cache its job restored lacks fails the step at once
# and names the module, where it would otherwise be downloaded while a test runs and fail the test
# whenever the module proxy or the checksum database fails, on a change that touched nothing it
# tests. A job's fetch step (.github/scripts/go-fetch.sh file, after its restore and before its
# first go step) is the one step that goes online, through GO_FETCH_PROXY, tried again on failure;
# a step that must go online and is no fetch step sets its own GOPROXY to GO_FETCH_PROXY, with a
# `go-offline:` line saying why. .github/scripts/go_offline_jobs.py holds every job to this.
# GO_FETCH_PROXY: a `|` between proxy entries makes a go command fall through to the next source
# after ANY error, where a `,` falls through only after a 404 or a 410 (Go's module reference,
# "GOPROXY protocol"). proxy.golang.org reset a download mid-stream and turned a Go lane red on a
# module whose hash go.sum already holds (sjawhar/legion#2512); with `|direct` the fetch takes the
# same bytes straight from the source and checks them against go.sum, so this is a second path,
# not a weaker check.
env:
  GO_FETCH_PROXY: https://proxy.golang.org|direct
  GOPROXY: "off"
  GOFLAGS: -mod=readonly

jobs:
  text-checks:
    runs-on: ubuntu-24.04-arm
    # About three times the cold measurement in the header, which is what a runner that restores
    # no build cache does on every run - the supervise pins' call, a quarter more cold time on
    # the pod that measured the five against the four, left that nearly as it was.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # All three modules pin the same Go in their go.mod, so one install serves the three
      # directories below; packages/envoy's is the one this reads.
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # go-fetch-text-checks: the modules of the fetch step below, under the key
      # .github/workflows/ci-caches.yaml's fetch-text-checks job fills: the runner's architecture,
      # the Go version and the hash of the module files of both workspaces that fetch reads, of
      # its fetch file and of go-fetch.sh. A pull request that changes those files restores the
      # newest entry by prefix, and the fetch then downloads only what moved. Only a push to main
      # fills the family, so a change before its first fill, or after GitHub evicted its entries,
      # finds none; the second restore key then takes main's newest go-envoy-test entry of this
      # runner's architecture, which a push to main fills for envoy-go. It holds 142 of the 427
      # module archives the fetch reads and the objects of every test binary of packages/envoy,
      # which the envoy text checks and the Dispatch API's source guards then compile from, so
      # the fetch downloads only what it lacks. The path names the build cache as that entry was
      # saved with: a restore matches only an entry saved with the same paths, and the family's
      # own fill saves both too.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-fetch-text-checks-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'go.work', 'go.work.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/text-checks.txt', '.github/scripts/go-fetch.sh') }}
          restore-keys: |
            ${{ format('go-fetch-text-checks-{0}-{1}-', runner.os, runner.arch) }}
            ${{ format('go-envoy-test-{0}-{1}-', runner.os, runner.arch) }}
      # Every go step below reads the module cache alone (GOPROXY=off, this file's env): the test
      # binaries' own builds, and the infra text checks' two import checks (internal/textcheck's
      # moduleDeps), which list the whole import graph of ./core and ./gcp, and the copy-lock
      # guard, which lists the Dispatch server with -export, neither of which the test binaries'
      # builds load, and the tidy check's `go mod tidy -diff` of each module, which reads more
      # than any build of them (the fetch file's tidy lines). A fetch while a test runs fails it
      # whenever the module proxy or the checksum database does, on a change that touched nothing
      # it checks, so this step fetches all of it first, from the cache restored above, tried
      # again on failure.
      - name: Fetch the modules this job's go steps load
        run: .github/scripts/go-fetch.sh file .github/go-fetch/text-checks.txt
      - name: Check the text packages/envoy pins
        run: go test -count=1 ./internal/textcheck/
        working-directory: packages/envoy
      - name: Check the text packages/envoy/infra pins
        run: go test -count=1 ./internal/textcheck/
        working-directory: packages/envoy/infra
      - name: Check the text packages/daemon pins
        run: go test -count=1 ./internal/textcheck/
        working-directory: packages/daemon
      # The seventeen tests of the API's nine static source checks read the module's source and
      # open no database, so they run here rather than in the job that carries Postgres for that
      # package. They sit in the package they guard, beside its Postgres-backed tests, so this
      # step selects them by name: the list is generated in .github/scripts/ci_job_reads.py from
      # TEXT_CHECK_TESTS, the same declaration that leaves exactly these seventeen out of envoy-go's
      # plain step. A guard test added to or renamed in its file must be named there
      # (ci_job_reads.py refuses the file otherwise), and check-ci-filters.sh refuses this step
      # when its run: is not the text built from the list, naming this step and each test the one
      # names and the other lacks, and when an env, shell or container could change which tests
      # it runs (a GOFLAGS -skip would skip a test the -run names): a test dropped from this
      # -run, named here and not in the list, or skipped from outside it, fails the ci-filters
      # job rather than running in no job or in both.
      # The package's other tests skip without DISPATCH_TEST_DATABASE_URL, and -run keeps this
      # step from even building their fixtures' work.
      - name: Test the Dispatch API's source guards (no database)
        run: go test -count=1 -run '^(TestCopyLockComesBeforeEveryPendingRowAndEvent|TestCopyLockOrderGuardFollowsTheLockTakers|TestEveryKeyedWriteCommitsInsideATransactionTheMarkHooks|TestEveryReviewReadOrdersByReviewOrder|TestEveryRouteThatTakesABodyRefusesADecisionBlock|TestNoForUpdateOnOwnerTables|TestOneExpressionDecidesWhoWaitsInOneSpelling|TestOnlyQueueReviewWritesReviews|TestOnlyTheBrokerInsertsEvents|TestOnlyTheIssuePatchWritesTheRoute|TestTheDecisionBlockGuardSeesWhatItGuards|TestTheGuardReadsABodyStringOffARequestType|TestTheKeyedWriteGuardSeesWhatItGuards|TestTheReviewOrderGuardReadsBothOrders|TestTheReviewWriterPatternsReadEveryNameOfTheTable|TestTheReviewWriterScanFindsAnIdentifierNamingTheTable|TestTheRouteWriterGuardSeesAPlantedWriter)$' ./internal/dispatch/api
        working-directory: packages/envoy
      # The two pure pins of packages/daemon's supervise table: they hold the table to the
      # package's own source — a row or a named ignore for every event in every state, and one
      # event type per kind — which sealed() reads by parsing every non-test .go file of the
      # package (internal/supervise/table_test.go:27-58). They open no database and start no
      # process, so they belong here rather than in the daemon's Postgres-backed Go suite; they
      # sit in a package of machine-driving tests, so this step selects them by name, and the
      # daemon-go plain step skips exactly these two by name. The list is generated in
      # .github/scripts/ci_job_reads.py from SUPERVISE_TABLE_TESTS, which builds both steps'
      # texts, so a pin added or renamed reaches both or fails the ci-filters job naming this
      # step. The file's three other tests drive a machine and stay in that plain step.
      - name: Test the supervise table's two pure pins (no database)
        run: go test -count=1 -run '^(TestNoTwoEventTypesShareAKind|TestTheTableHasARowOrANamedIgnoreForEveryEventInEveryState)$' ./internal/supervise/
        working-directory: packages/daemon

      # `go mod tidy -diff` of every module a required job builds: the modules of the workspaces
      # the deps and tidy lines of every fetch file under .github/go-fetch/ build in. A module
      # whose go.mod lacks a requirement, or whose go.sum lacks a line, builds in CI only while
      # another module covers the gap, and a build that reads it alone fails or fetches; this
      # names the module and the diff. It reads the module cache alone, with the proxy off, like
      # every go step of this job, and builds no package:
      # go-offline: its go list -m names a directory's modules and loads no package; its go mod tidy -diff reads what the fetch step's tidy lines downloaded.
      - name: Check that every Go module a required job builds is tidy
        run: .github/scripts/check-go-tidy.sh

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: text-checks
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
