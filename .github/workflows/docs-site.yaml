name: Docs site

# The documentation site's build, in one place. ci.yaml's docs job calls it for a pull request and
# a merge group. docs-pages.yaml's build job calls it for a push to main, and then publishes what
# it built to GitHub Pages. Both callers ran these same steps side by side before, and nothing
# held the two copies equal: a step changed in one copy alone made main build what no pull request
# built.
#
# Three inputs carry the only difference between the callers. Two booleans each add one trailing
# step that only docs-pages.yaml needs, and ci.yaml's `ci-ok-changes` adds the ci-ok report its own
# jobs end with. Every other step is the same for both.
#
# A reusable workflow, not a composite action, for two reasons. A composite action's step keys do
# not include timeout-minutes, which the screenshots step sets. `services:` is a job-level key,
# which a composite action also cannot carry.
#
# No outputs. docs-pages.yaml's deploy job reads the Pages artifact, not an output: actions/
# deploy-pages looks the artifact up by its name, `github-pages`, in the workflow run. A called
# workflow's jobs run in the caller's run, so the artifact the build job uploads here is the one
# the deploy job finds.
#
# No permissions: block either, and that is not what decides this job's scopes. A called workflow
# runs under the calling job's `permissions:`, and a caller that declares none hands it the default
# GITHUB_TOKEN permissions rather than its own workflow's block (GitHub's reusable-workflow
# reference, "Supported keywords for jobs that call a reusable workflow"). So what this job gets is
# the calling job's to declare: ci.yaml's docs job declares `contents: read` for the checkout and
# the `actions: read` and `checks: write` its ci-ok report needs. docs-pages.yaml's build job
# declares `contents: read` alone; that call passes no `ci-ok-changes`, so the report step skips
# and the checkout is the whole of what it asks the token for.
#
# .github/scripts/ci_job_reads.py's docs gate cites the steps below by name, and
# .github/scripts/check-ci-filters.sh fails when a cited step is gone. The docs filter of ci.yaml
# names this file, and so does docs-pages.yaml's on.push.paths, so a change here selects the job.
on:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload docs/site/dist as the run's github-pages artifact, for a deploy job to publish.
        type: boolean
        default: false
      save-cache:
        description: Save the go-docs cache entry, on a push to main whose restore missed the exact key.
        type: boolean
        default: false
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends, for its docs job. Empty for
          docs-pages.yaml, which reports nothing.
        type: string
        default: ""
    secrets:
      PRIVATE_NAME_TERMS:
        description: >-
          The deployment's own private names, one a line, which the private-names job below
          checks the built site for (.github/scripts/check-private-names.sh's fifth rule). Both
          callers pass it.
        required: false

# Every go command of this workflow runs with the module proxy off (GOPROXY=off) and go.mod read
# only (GOFLAGS=-mod=readonly), so a module the cache its job restored lacks fails the step at once
# and names the module, where it would otherwise be downloaded while a test runs and fail the test
# whenever the module proxy or the checksum database fails, on a change that touched nothing it
# tests. A job's fetch step (.github/scripts/go-fetch.sh file, after its restore and before its
# first go step) is the one step that goes online, through GO_FETCH_PROXY, tried again on failure;
# a step that must go online and is no fetch step sets its own GOPROXY to GO_FETCH_PROXY, with a
# `go-offline:` line saying why. .github/scripts/go_offline_jobs.py holds every job to this.
# GO_FETCH_PROXY: a `|` between proxy entries makes a go command fall through to the next source
# after ANY error, where a `,` falls through only after a 404 or a 410 (Go's module reference,
# "GOPROXY protocol"). proxy.golang.org reset a download mid-stream and turned a Go lane red on a
# module whose hash go.sum already holds (sjawhar/legion#2512); with `|direct` the fetch takes the
# same bytes straight from the source and checks them against go.sum, so this is a second path,
# not a weaker check.
env:
  GO_FETCH_PROXY: https://proxy.golang.org|direct
  GOPROXY: "off"
  GOFLAGS: -mod=readonly

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The screenshots step boots Dispatch on the e2e harness, which needs a database it may
    # truncate. The step before it turns the service's crash safety off.
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # Astro runs on Node.js (22.12 or newer).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # docs/site/scripts/build-binaries.sh builds the Go binaries the reference generators run, and
      # the screenshots step builds the Dispatch server; both modules name the same Go.
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false
      # go-docs is a cache family of its own. This build compiles the daemon's legion command and
      # envoy's dispatch, broker and agent-secrets commands. envoy-e2e-local's go-envoy entry
      # holds the listener and natsd alone, so one key for both let whichever job saved first own
      # it. .github/ci-notes/ci.md#the-router-every-check-a-pull-request-or-the-merge-queue-runs says
      # how every family is kept. Its key hashes the root workspace's module files, the fetch file
      # below and go-fetch.sh, so a change to any of them saves a fresh entry on the push to main
      # that lands it. This step restores go-docs in the form
      # docs/solutions/github/join-a-job-to-the-ci-router.md gives: off main by the prefix too, on
      # main by the exact key alone. The save-cache input names the one caller that writes the
      # entry, and that caller is docs-pages.yaml.
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-docs-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/docs.txt', '.github/scripts/go-fetch.sh') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('go-docs-{0}-{1}-', runner.os, runner.arch) || '' }}
      - run: bun install --frozen-lockfile
      - name: Typecheck the docs site
        run: bun run typecheck
        working-directory: docs/site
      # The pages' screenshots are made, not committed (docs/site/media/README.md): Dispatch on
      # the e2e harness, seeded with example data, captured in Chromium.
      - name: Build the Dispatch dashboard the screenshots show
        run: bun run build:web
        working-directory: packages/dispatch
      - name: Install Playwright Chromium
        # No apt in this step at all. Playwright's `chromium` entry in its ubuntu24.04-x64 table
        # adds no package this GitHub ubuntu-24.04 image lacks, so `--with-deps` installed only
        # Playwright's `tools` list: the CJK, Thai and Cyrillic font packages and xvfb. Measured
        # for that same install in job 127214381394, which the `multiprocess` job's section of
        # .github/ci-notes/dispatch-browser.md records against its step of this name, that
        # was `0 upgraded, 9 newly installed`, `Need to get 21.1 MB of archives`, plus 12.8 MB of
        # package indexes in `apt-get update`. The shots want none of it: they are taken in a
        # headless Chromium (docs/site/media/shots.ts:51 and walkthrough.ts:266 call
        # `chromium.launch()` with no options) and compared against no committed baseline
        # (docs/site/media/README.md), and fonts-liberation and fonts-noto-color-emoji are on
        # the image already. With the apt call goes this step's removal of the runner image's
        # chrome-stable apt source, which it carried only because that source's index
        # intermittently failed `apt-get update` and took `--with-deps` down with it.
        #
        # The 4-minute bound is the one dispatch-browser.yaml's multiprocess job gives its step of
        # this name, for the same three archives (Chrome for Testing, its headless shell and
        # ffmpeg) and Playwright's up to five attempts across its download hosts inside it; this
        # step took 10 s in job 135592911448 of run 44533492400. Without a bound a hung download
        # would hold the job to its 25 minutes, which .github/scripts/package_installs.py refuses
        # in a required workflow.
        timeout-minutes: 4
        run: bunx playwright install chromium
        working-directory: docs/site
      # Every go command of this job reads the module cache alone (GOPROXY=off, this file's env):
      # the screenshots' harness builds the Dispatch server (packages/dispatch/e2e/run-server.sh)
      # and the real broker's three commands (e2e/run-broker.sh), and the docs build's
      # docs/site/scripts/build-binaries.sh the generators' commands. A fetch inside the run fails
      # it whenever the module proxy does, on a change that touched nothing it shows. This step
      # fetches those builds' modules first, from the cache restored above and tried again on
      # failure.
      - name: Fetch the modules this job's go steps load
        run: .github/scripts/go-fetch.sh file .github/go-fetch/docs.txt

      # The service with crash safety off (fsync, full_page_writes, synchronous_commit), as the
      # e2e harness's own Postgres runs (packages/dispatch/e2e/harness-postgres.ts), so no commit
      # waits for the runner's disk. With them on, a write a closed page left in flight can hold a
      # table past the reset each shot set starts with (docs/site/media/shot-runner.ts), which
      # waits at most 5 s for it: dispatch-browser.yaml's multiprocess job failed so, a read mark
      # holding user_document_reads while the disk was slow. A service container takes no server
      # arguments, so `alter system` writes the three, as .github/scripts/pg-connection-ceiling.sh
      # writes max_connections on a service, and a reload applies them: max_connections needs that
      # script's restart, and these three need only the reload, synchronous_commit reaching every
      # session that starts after it. The step reads them back from a new session and fails unless
      # each is off.
      - name: Turn crash safety off on the screenshots' Postgres
        timeout-minutes: 2
        run: |
          container="${{ job.services.postgres.id }}"
          docker exec "$container" psql -U postgres -v ON_ERROR_STOP=1 -q \
            -c 'alter system set fsync = off' \
            -c 'alter system set full_page_writes = off' \
            -c 'alter system set synchronous_commit = off' \
            -c 'select pg_reload_conf()'
          for _ in $(seq 1 20); do
            settings=$(docker exec "$container" psql -U postgres -Atc \
              "select current_setting('fsync') || ' ' || current_setting('full_page_writes') || ' ' || current_setting('synchronous_commit')")
            [ "$settings" = "off off off" ] && break
            sleep 0.5
          done
          echo "fsync, full_page_writes, synchronous_commit: $settings"
          [ "$settings" = "off off off" ] || { echo "::error::the service's fsync, full_page_writes and synchronous_commit read '$settings' after the reload, not 'off off off'"; exit 1; }
      - name: Take the screenshots
        run: bun run docs:media
        # A step of the run that hangs fails it within two minutes (STEP_TIMEOUT_MS in
        # docs/site/media/harness.ts); this bounds the rest, the build and the boot.
        timeout-minutes: 15
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # Every shot this run took, on every run and not on a failure alone, with the time
      # elements of each beside it. The pages' images are made rather than committed, so nothing
      # else in this repository can say whether two builds render them the same; and the
      # dashboard draws its times as relative labels from the clock over rows seeded at run
      # time, so two runs of one commit differ wherever a label crossed a rounding boundary
      # between them. A difference that is the clock and one that is a changed glyph are told
      # apart by the file each shot writes beside its PNG (docs/site/media/shot-runner.ts): a
      # region that moved is the clock only where it lies inside one of that file's boxes and
      # that element's text differs between the two runs. Each file carries its set's seed
      # instant and its own capture instant too, which is the elapsed time every relative label
      # is a function of. Download this artifact from two runs and compare
      # (dispatch://INFRA-1443, which took Playwright's `tools` fonts off this runner).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-screenshots-${{ github.run_attempt }}
          path: |
            docs/site/public/media
            docs/site/media/.work/time-elements
          if-no-files-found: error
      # What each failed shot's page showed, and the harness's process logs: a hang leaves the
      # Dispatch server's goroutines at the end of dispatch.log.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-failed-shots-${{ github.run_attempt }}
          path: |
            docs/site/media/.work/failed-shots
            docs/site/media/.work/harness
          if-no-files-found: ignore
      # Generates the reference pages, then builds the site; starlight-links-validator fails it on a
      # broken internal link. The build writes dist/THIRD_PARTY_NOTICES.txt (docs/site/astro.config.mjs),
      # failing on a package whose license cannot be determined; the listing shows the site ships it.
      - name: Build the docs site
        run: |
          bun run docs:build
          ls -l docs/site/dist/THIRD_PARTY_NOTICES.txt
      # The built site goes to the private-names job below, which checks it for private names:
      # that check reads the deployment's term list, and this job, which runs dependency code
      # (Bun, Astro, the Go builds), holds none. Hidden files too, so the check reads every file
      # the site ships; `overwrite` lets a re-run of this job replace its first attempt's copy.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site-dist
          path: docs/site/dist
          include-hidden-files: true
          overwrite: true
          retention-days: 1
          if-no-files-found: error
      # The caller's deploy job publishes this artifact. Only docs-pages.yaml asks for it.
      - if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist
      - if: inputs.save-cache && github.event_name == 'push' && success() && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      # ci.yaml's call only: on a merge-group run whose group this job's own result decides it
      # posts the failing ci-ok at once, and on every other run it posts nothing, the verdict
      # being ci.yaml's `ci-ok` job's own check run (.github/actions/ci-ok-report says how).
      # ci.yaml's docs job runs on a pull request and on a merge group alike, so the step is live
      # here; docs-pages.yaml's call passes no `ci-ok-changes`, and the step skips.
      - name: Report ci-ok when this job decides a merge-group run
        if: always() && inputs.ci-ok-changes != ''
        uses: ./.github/actions/ci-ok-report
        with:
          job: docs
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  # The built site, generated reference pages and copied media captions include no private
  # deployment repository, company, internal host, Tailscale MagicDNS host or term of the
  # deployment's own list. ci-job-lint.yaml's private-names job checks the sources, on a pull
  # request and on a merge group alike. A job of its own, because it reads that list
  # (PRIVATE_NAME_TERMS) and no job that runs dependency code holds it: this one checks out the
  # .github cone for the script, downloads the site the build job uploaded, and runs that shell
  # script alone. The callers' later jobs need the calling job, which is this one's too, so
  # docs-pages.yaml's deploy publishes nothing this job refused.
  private-names:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site-dist
          path: docs/site/dist
      # By the checkout's own path, the form every job that holds the list runs the check by.
      - name: Check the built site has no private name, internal host, tailnet host, or term of the deployment's own list
        env:
          PRIVATE_NAME_TERMS: ${{ secrets.PRIVATE_NAME_TERMS }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/check-private-names.sh" docs/site/dist
      # ci.yaml's call only, as the build job's report above.
      - name: Report ci-ok when this job decides a merge-group run
        if: always() && inputs.ci-ok-changes != ''
        uses: ./.github/actions/ci-ok-report
        with:
          job: docs
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
