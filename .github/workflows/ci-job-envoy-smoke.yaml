name: CI job envoy-smoke

# The steps of ci.yaml's `envoy-smoke` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# Every go command of this workflow runs with the module proxy off (GOPROXY=off) and go.mod read
# only (GOFLAGS=-mod=readonly), so a module the cache its job restored lacks fails the step at once
# and names the module, where it would otherwise be downloaded while a test runs and fail the test
# whenever the module proxy or the checksum database fails, on a change that touched nothing it
# tests. A job's fetch step (.github/scripts/go-fetch.sh file, after its restore and before its
# first go step) is the one step that goes online, through GO_FETCH_PROXY, tried again on failure;
# a step that must go online and is no fetch step sets its own GOPROXY to GO_FETCH_PROXY, with a
# `go-offline:` line saying why. .github/scripts/go_offline_jobs.py holds every job to this.
# GO_FETCH_PROXY: a `|` between proxy entries makes a go command fall through to the next source
# after ANY error, where a `,` falls through only after a 404 or a 410 (Go's module reference,
# "GOPROXY protocol"). proxy.golang.org reset a download mid-stream and turned a Go lane red on a
# module whose hash go.sum already holds (sjawhar/legion#2512); with `|direct` the fetch takes the
# same bytes straight from the source and checks them against go.sum, so this is a second path,
# not a weaker check.
env:
  GO_FETCH_PROXY: https://proxy.golang.org|direct
  GOPROXY: "off"
  GOFLAGS: -mod=readonly

jobs:
  envoy-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image would be one more registry pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # The listener image the smoke test runs, built by its own step below.
      ENVOY_SMOKE_IMAGE: legion-envoy-smoke:${{ github.sha }}
      # The image envoy-infra's live tests run, built on top of ENVOY_SMOKE_IMAGE by its own step
      # below.
      ENVOY_SMOKE_HELD_PORT_IMAGE: legion-envoy-smoke-heldport:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # go-envoy-infra, restored only, under the key .github/workflows/ci-caches.yaml's envoy-infra
      # job fills on this runner (its x64 leg, which release-envoy-infra.yaml's build reads too):
      # the runner's architecture, the Go version and the hash of both workspaces' module files,
      # gcp's live tools, the notices tool's pin (the image builds' go-licenses), every fetch file
      # the family's readers run and go-fetch.sh. Its fill runs
      # this job's fetch file, so the fetch step below finds the modules there and downloads only
      # what moved since; the SDK consumer's `go mod tidy` reads modules beyond them, which the
      # later fetch step resolves. The Go version is packages/envoy/go.mod's, which this job
      # builds with and which names the same version as packages/envoy/infra/go.mod; a version the
      # two do not share misses the key and restores the newest entry by prefix.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'go.work', 'go.work.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/envoy-infra-go.txt', '.github/go-fetch/envoy-smoke.txt', 'packages/envoy/infra/gcp/testdata/live-tools.txt', 'scripts/go-third-party-notices-tools.txt', '.github/scripts/go-fetch.sh') }}
          restore-keys: ${{ format('go-envoy-infra-{0}-{1}-', runner.os, runner.arch) }}
      # Every go step below reads the module cache alone (GOPROXY=off, this file's env): the smoke
      # test and the cgo-less systemroots probe it builds, the plugin's builds (the live tests'
      # pulumitest.Plugin, the consumer's plugin below and the schema step's), the live tests of
      # host, and the go commands of the two image builds, which read this cache's download
      # directory as their `gomodcache` context. This step fetches what they load first, tried
      # again on failure.
      - name: Fetch the modules this job's go steps load
        run: .github/scripts/go-fetch.sh file .github/go-fetch/envoy-smoke.txt
      # The module cache's download directory (its .info, .mod and .zip files), which each image
      # build below takes as its `gomodcache` named context: each go RUN of the two Dockerfiles
      # mounts it and runs with the module proxy off, so a module the fetch above left out fails
      # the build at once, naming it, and the build downloads nothing
      # (.github/scripts/go_offline_images.py holds both Dockerfiles to this). The directory alone,
      # not the whole cache: the build extracts the few modules it compiles, and the context the
      # build is sent is a quarter of the cache's bytes and a twentieth of its files.
      - name: Name the module cache the image builds read
        id: gomodcache
        run: echo "dir=$(go env GOMODCACHE)/cache/download" >> "$GITHUB_OUTPUT"
      # Every image the build or the test starts (testnats.HubImage and the smoke image's base
      # images) is pulled first, for the reason .github/actions/pull-test-images gives. A FROM
      # line's image is its first word after FROM that is no `--flag` (`--platform=...`), with
      # each ARG it names substituted, so a FROM written as an ARG is not pulled as the literal
      # `${NAME}`. A FROM that names no image a pull can fetch is passed over: `scratch`,
      # BuildKit's empty base (the gomodcache stage), which `docker pull` refuses as a reserved
      # name, and a stage an earlier FROM of the file named with `AS`, which the build makes and
      # no registry holds. Instructions and stage names are read in any case, as Docker reads them.
      - name: Read the smoke image's base images
        id: base-images
        run: |
          {
            echo "images<<IMAGES"
            awk '
              toupper($1) == "ARG" { eq = index($2, "="); if (eq > 0) args[substr($2, 1, eq - 1)] = substr($2, eq + 1) }
              toupper($1) == "FROM" {
                i = 2
                while (i <= NF && substr($i, 1, 2) == "--") i++
                image = $i
                for (name in args) gsub("[$][{]" name "[}]", args[name], image)
                if (image != "" && tolower(image) != "scratch" && !(tolower(image) in stages)) print image
                if (toupper($(i + 1)) == "AS" && $(i + 2) != "") stages[tolower($(i + 2))] = 1
              }
            ' docker/Dockerfile
            echo "IMAGES"
          } >> "$GITHUB_OUTPUT"
        working-directory: packages/envoy
      - name: Pull test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: packages/envoy/internal/testnats/nats.go HubImage
          images: ${{ steps.base-images.outputs.images }}
      # The image build is a step of its own: what TestSmoke asserts is the container's
      # behaviour, so a slow build must fail nothing. Inside the test it spent 256.60–289.47 s
      # of `go test -timeout 5m` across ten Release Envoy Listener runs while the five
      # assertions measured 0.00 s each (LEGION-361;
      # docs/solutions/testing/a-container-build-inside-go-test-spends-the-tests-deadline.md).
      # The test refuses to run without ENVOY_SMOKE_IMAGE rather than building one, so dropping
      # or renaming this step turns the lane red instead of restoring that budget silently.
      # `load: true` is Docker's documented test-before-push shape, and the only build form
      # .github/scripts/check-image-trigger-paths.sh can read. No LEGION_COMMIT: this job
      # publishes no image to match. The pull step above put the base images in the daemon's
      # store, which the default `docker` driver reads.
      - name: Build the listener image the smoke test runs against
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # This build never pushes, and its Metadata log is confirmed empty of both an
          # attestation and this job's pull_request payload today (no docker/setup-buildx-action
          # here means no docker-container builder, so buildx never captures the CI event into the
          # provenance predicate in the first place). Hardened anyway, so a future change that adds
          # one (for cache, say) can't reopen either leak; worker-image.yaml's identical block is
          # the confirmed-necessary case.
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: packages/envoy/docker/Dockerfile
          build-contexts: gomodcache=${{ steps.gomodcache.outputs.dir }}
          load: true
          provenance: false
          tags: ${{ env.ENVOY_SMOKE_IMAGE }}
      # The image envoy-infra's live tests run (pulumitest.HeldPortImage): the smoke image above with
      # packages/envoy/infra/host/heldportwrapper as its envoy-listener, which takes the listening
      # socket the test holds for the container's port over an abstract unix socket and executes the
      # real listener on it, so the port stays held from the test's bind until the listener serves.
      # Its Dockerfile builds the wrapper from the tree, on the Go image the smoke image's build
      # pulled, so this build reads only files the envoy_smoke filter names. The smoke test keeps
      # running the smoke image itself.
      - name: Build the held-port listener image the envoy-infra live tests run
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # As the smoke image's build above.
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: packages/envoy/infra/host/heldportwrapper/Dockerfile
          build-args: BASE=${{ env.ENVOY_SMOKE_IMAGE }}
          build-contexts: gomodcache=${{ steps.gomodcache.outputs.dir }}
          load: true
          provenance: false
          tags: ${{ env.ENVOY_SMOKE_HELD_PORT_IMAGE }}
      # The image's notices (packages/envoy/docker/Dockerfile): the build fails when a license cannot
      # be determined, and the listing shows the image ships both files.
      - name: List the image's third-party notices
        run: >-
          docker run --rm --entrypoint ls "$ENVOY_SMOKE_IMAGE" -l
          /usr/share/doc/legion/THIRD_PARTY_NOTICES /srv/dispatch-web/THIRD_PARTY_NOTICES.txt
      # 5m bounds only what the test does: pull NATS, start both containers behind the test's
      # own 60 s health wait, and assert. This job has measured 1.82 s, 3.16 s and 1.88 s (the
      # last in run 36508580490), and 2.2–20.7 s across four runs on a devbox at load average
      # 80, so the bound is deliberate headroom, not a build budget.
      - name: Container smoke test (testcontainers)
        run: go test -tags smoke -v -timeout 5m ./internal/smoke/
        working-directory: packages/envoy
      # The envoy-infra plugin's live tests (packages/envoy/infra/host/live_test.go) apply Pulumi
      # YAML programs with the pinned Pulumi CLI (.github/actions/install-pulumi) against this
      # runner's Docker, on the held-port image built above and on the docker provider the plugin's
      # first consumer pins. Each download is checked against its SHA-256 before it is unpacked or
      # installed.
      - name: Install the Pulumi CLI
        uses: ./.github/actions/install-pulumi
      # The `pulumi-docker` row of .github/ci-tools.yaml pins the version and the sha256 of that
      # tarball, and .github/scripts/check-ci-tools.sh holds the row's version to
      # `const DockerPluginVersion` of internal/pulumitest/pulumitest.go, the constant the live
      # programs pin the plugin at. The step hands the tarball's path to the live tests as its
      # `tarball` output, set in their step's env as ENVOY_INFRA_DOCKER_PLUGIN (not written to
      # $GITHUB_ENV, which every later step would inherit and check-ci-filters.sh treats as
      # reaching the job's go commands). The live tests install the verified tarball into a
      # PULUMI_HOME of their own, so the CLI downloads none.
      - name: Download the docker provider plugin the live tests install
        id: docker-plugin
        uses: ./.github/actions/install-docker-plugin
      # The live tests fetch no module while they run: a fetch inside a test fails it whenever the
      # module proxy or the checksum database does, on a change that touched nothing it tests.
      # The plugin's build (pulumitest.Plugin) reads the module cache with GOPROXY=off, which the
      # fetch step above filled, and TestLiveGoConsumersCanUseTheSDK makes its
      # `pulumi package add` and build of host/testdata/sdk-consumer against a file proxy over
      # that cache. So this step makes the same resolution the test makes first, tried again on
      # failure, on the same consumer and a plugin built as pulumitest.Plugin builds it: its
      # `go mod tidy` reads modules no package of this repository loads, and go-fetch.sh runs it
      # through GO_FETCH_PROXY.
      - name: Fetch the modules the SDK consumer's resolution reads
        run: |
          plugin="$RUNNER_TEMP/sdk-consumer-plugin/pulumi-resource-envoy-infra"
          go -C packages/envoy/infra build -ldflags "-X main.version=0.0.1" -o "$plugin" ./cmd/pulumi-resource-envoy-infra
          .github/scripts/go-fetch.sh pulumi-consumer packages/envoy/infra/host/testdata/sdk-consumer "$plugin"
      # The live tests build container images on this runner's disk, and a job that runs out of
      # space says only that it did. The pair around the step measures it, and measures the two
      # readings beside it: `start` prints what each file system the job writes to has free and
      # leaves a sampler watching the one that holds /tmp, the memory the kernel reports
      # available and the one-minute load, one line per second; `report` stops the sampler and
      # prints the worst each of them reached, with the free space the step began with, the
      # least it ever had and the difference, and `margin short` when the step used more than
      # half of what it started with (dispatch://INFRA-1085, dispatch://INFRA-2605). The report
      # prints and never fails the job: this is the measurement, not a new gate. The two steps
      # share their state through a file under $RUNNER_TEMP rather than $GITHUB_ENV, which every
      # later step of the job would inherit and check-ci-filters.sh treats as reaching the job's
      # go commands.
      - name: Start the machine watch over the live tests
        run: .github/scripts/disk_watch.py start --path /tmp --state "$RUNNER_TEMP/disk-watch.json"
      - name: Live tests of envoy-infra's host:Listener
        run: go test -tags pulumilive -v -timeout 15m ./host/
        working-directory: packages/envoy/infra
        env:
          ENVOY_INFRA_DOCKER_PLUGIN: ${{ steps.docker-plugin.outputs.tarball }}
      - name: Report what the live tests ran on
        if: always()
        run: .github/scripts/disk_watch.py report --state "$RUNNER_TEMP/disk-watch.json"
      # The schema carries both of the things the release build stamps into the plugin: the
      # version, and the download URL .github/scripts/repo-paths.sh derives from the repository
      # the run is in (release-envoy-infra.yaml's "Derive the plugin's download URL" and its
      # build step). That workflow runs on main alone, so this build is what proves the stamp
      # before a merge, and it proves it under the name the transfer gives the repository rather
      # than today's: a provider.go that pinned the address instead of taking the -X would still
      # serve cybermonklabs/legion here and fail. ${VERSION} is Pulumi's own placeholder, filled in at
      # install, so the URL is compared literally. The step runs in the module, so the script is
      # reached by its path from the repository root, and the binary goes under $RUNNER_TEMP as
      # the docker provider's tarball above does. The CLI runs on a file backend, as every pulumi
      # command of this job does: one with no backend set that needs one logs in to a new
      # ephemeral Pulumi Cloud account. It runs with no update check, which asks api.pulumi.com
      # for the CLI's latest version while the command runs.
      - name: The envoy-infra plugin's schema carries the version and the download URL it was built with
        run: |
          url=$(GITHUB_REPOSITORY=cybermonklabs/legion ../../../.github/scripts/repo-paths.sh plugin_download_url)
          go build -ldflags "-X main.version=1.2.3 -X 'github.com/sjawhar/envoy/infra/provider.downloadURL=$url'" -o "$RUNNER_TEMP/pr" ./cmd/pulumi-resource-envoy-infra
          # shellcheck disable=SC2016 # ${VERSION} is Pulumi's placeholder, not a shell expansion
          PULUMI_BACKEND_URL="file://$RUNNER_TEMP" PULUMI_SKIP_UPDATE_CHECK=true pulumi package get-schema "$RUNNER_TEMP/pr" | jq -e '.version == "1.2.3" and .pluginDownloadURL == "https://github.com/cybermonklabs/legion/releases/download/envoy-infra-v${VERSION}"'
        working-directory: packages/envoy/infra

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-smoke
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
