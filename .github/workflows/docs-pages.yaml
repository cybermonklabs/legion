name: Docs (main)

# Builds the documentation site (docs/site) on a push to main whose change could change it, and
# publishes it to GitHub Pages, at the address .github/scripts/repo-paths.sh derives from the
# repository this runs in (https://cybermonklabs.github.io/legion/ today). The build is docs-site.yaml's,
# which holds those steps once. Pull requests and merge groups call the same workflow from
# ci.yaml's docs job; this workflow is main's half.
#
# A `workflow_dispatch` run starts this workflow on any branch. The build job runs as it does on
# main, with the `upload-pages-artifact` step that no other caller of docs-site.yaml asks for, so
# a dispatch of a branch proves that step before the merge. The deploy job runs on main alone (the
# `ref` job's exact test of the ref), so a dispatch of a branch deploys nothing to the live site.
#
# A workflow of its own, so a push to main builds and deploys the site at all: ci.yaml has no
# `push:` trigger, and its docs job runs on pull requests and merge groups alone. Of the pushes
# waiting in the group below only the newest builds, and the site loses nothing by that: each
# build covers the whole tree, so the site still ends at the newest docs-selecting commit.
#
# The paths below are the `docs` filter ci.yaml's changes job computes from what the docs build
# reads (`.github/scripts/check-ci-filters.sh generate`), so main builds the site on exactly the
# changes a pull request's docs job builds it on. A push trigger is read before any job runs, so
# this list is the one copy of a filter the repository keeps: `.github/scripts/check-ci-filters.sh
# write` writes it, and the check fails when the two differ, naming each missing and extra pattern
# (ci_job_reads.py's PUSH_WORKFLOWS pairs them). No hand edits it.
on:
  push:
    branches: [main]
    paths:
      - '.github/actions/setup-bun/**'
      - 'deploy/kubernetes/**'
      - 'docs/site/**'
      - 'packages/contracts/src/**'
      - 'packages/daemon/internal/daemon/**'
      - 'packages/dispatch/**'
      - 'packages/envoy-client/src/**'
      - 'packages/envoy/internal/dispatch/delivery/**'
