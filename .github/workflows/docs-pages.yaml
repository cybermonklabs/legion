  workflow_dispatch:

# One run at a time per ref, and only the newest waiting push builds: the default queue (no
# `queue:` key) keeps one run waiting in the group and replaces it with the next arrival
# (docs.github.com, "Control the concurrency of workflows and jobs"), and cancel-in-progress: false
# never cancels the running one. A replaced run is cancelled having started no job at all, so it
# costs no runner minute (measured on this repository: probe run 41869015055 and its three
# successors on branch probe/infra1066-queue, where each cancelled run listed no job and the
# newest waiting run started its job 4 s after the running one's job ended), and the tree it would
# have built is in the newer run's build. The group is keyed on the ref, so a `workflow_dispatch`
# of a branch is a group of its own and never replaces a waiting main build. GitHub's other bound
# stands: the `paths:` filter skips a push whose diff holds more than 3,000 files when none of the
# first 3,000 matches (workflow syntax, "Git diff comparisons"). Such a push leaves the site at
# the last build published; the next docs-selecting push heals it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# Read-only: the token clones and downloads pinned tools. The deploy job declares what publishing
# to GitHub Pages needs in a block of its own.
permissions:
  contents: read

jobs:
  # The shared build, plus the two steps only main needs: the Pages artifact the deploy job
  # below publishes, and the save of the go-docs cache entry.
  #
  # No timeout-minutes: GitHub's keywords for a job that calls a reusable workflow leave it out.
  # docs-site.yaml's own job carries the limit.
  build:
    # A calling job that declares no `permissions:` hands the called workflow the default
    # GITHUB_TOKEN permissions, not this file's block (GitHub's reusable-workflow reference,
    # "Supported keywords for jobs that call a reusable workflow"), so the scopes docs-site.yaml
    # needs are declared here. `contents: read` is its `actions/checkout` step's, and that step
    # is the whole of what this call asks the token for: every other step reads the checkout,
    # the Actions cache or the artifact service, and the ci-ok report step skips because this
    # call passes no `ci-ok-changes`.
    permissions:
      contents: read
    uses: ./.github/workflows/docs-site.yaml
    with:
      upload-pages-artifact: true
      save-cache: true

  # No concurrency of its own: the workflow's group already holds the next run until this one's
  # deploy ends. The if: holds the deployment to main: a workflow_dispatch of a branch builds the
  # site and uploads the artifact, and publishes nothing to the live site.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Publishes the built site to GitHub Pages: pages: write performs the deployment, id-token:
    # write is the OIDC token actions/deploy-pages exchanges for it.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
