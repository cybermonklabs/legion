name: CI job conflicts-script

# The steps of ci.yaml's `conflicts-script` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

jobs:
  conflicts-script:
    runs-on: ubuntu-24.04-arm
    # At least the job's sum over its 20 newest green merge-group runs up to 2026-11-15: its other
    # steps at their longest, 87 s, 4 s of its clock over them, and its test step's longest, 5 s,
    # plus its guard of 5 s: 101 s in all.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Lint the conflict measurement script
        run: bunx biome check --error-on-warnings scripts/conflicts
      # scripts/conflicts is no workspace; the root package pins its TypeScript and Bun types.
      - name: Typecheck the conflict measurement script
        run: bunx tsc --noEmit -p scripts/conflicts
      # Its one guard, --timeout 5000, is at least twice the slowest row or hook of the command
      # under 8 busy loops on 2 CPUs in a builds Job at 61b66deb (two runs): 1,986.02 ms, "fix
      # states > classifyFixes refuses a merge whose parent cannot be fetched".
      - name: Test the conflict measurement script
        run: bun test --preload @legion/test-fixtures/row-deadline --timeout 5000 scripts/conflicts

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: conflicts-script
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
