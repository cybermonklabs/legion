name: CI job envoy-go-docs-finalizers

# The steps of ci.yaml's `envoy-go-docs-finalizers` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# Every go command of this workflow runs with the module proxy off (GOPROXY=off) and go.mod read
# only (GOFLAGS=-mod=readonly), so a module the cache its job restored lacks fails the step at once
# and names the module, where it would otherwise be downloaded while a test runs and fail the test
# whenever the module proxy or the checksum database fails, on a change that touched nothing it
# tests. A job's fetch step (.github/scripts/go-fetch.sh file, after its restore and before its
# first go step) is the one step that goes online, through GO_FETCH_PROXY, tried again on failure;
# a step that must go online and is no fetch step sets its own GOPROXY to GO_FETCH_PROXY, with a
# `go-offline:` line saying why. .github/scripts/go_offline_jobs.py holds every job to this.
# GO_FETCH_PROXY: a `|` between proxy entries makes a go command fall through to the next source
# after ANY error, where a `,` falls through only after a 404 or a 410 (Go's module reference,
# "GOPROXY protocol"). proxy.golang.org reset a download mid-stream and turned a Go lane red on a
# module whose hash go.sum already holds (sjawhar/legion#2512); with `|direct` the fetch takes the
# same bytes straight from the source and checks them against go.sum, so this is a second path,
# not a weaker check.
env:
  GO_FETCH_PROXY: https://proxy.golang.org|direct
  GOPROXY: "off"
  GOFLAGS: -mod=readonly

jobs:
  envoy-go-docs-finalizers:
    runs-on: ubuntu-24.04-arm
    # The step's -timeout 34m must fire before the runner cancels the job, so a hung test prints
    # the dump that names it. Both numbers come from this job's own green runs, the slowest of
    # them 128761197501: 1136.829 s in the package, against 1016.966 s in 128809181011,
    # 1012.796 s in 128790317116 and 864.037 s in 128751128912, and about 71 s of checkout,
    # setup and compile before any of them. The package has grown three times under this pull
    # request, first when main took in #2414's tests (953 services built to 1068), again on the
    # merge of #2870, which moved work into this lane, and now with #2960's wedged-commit row,
    # measured at 56 s in series in an issue pod (the row's own 47.69 s, and 8.29 s more in the
    # residency case, which gives each of its trials a connection of its own). The step's
    # deadline is the smallest whole minute at which the slowest package time, that growth
    # included, is at most 60 % of it, and this limit is six minutes above that. Measure again
    # before changing either, and from the slowest run rather than the newest: a package that
    # has grown past 60 % of its deadline is a deadline to raise, not a flake to re-run.
    timeout-minutes: 40
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Load-bearing, not boilerplate: this package's TestMain is storetest.Main
    # (internal/dispatch/docs/persistence_test.go:19), and storetest.Open skips every test that
    # opens the store when DISPATCH_TEST_DATABASE_URL is unset
    # (internal/dispatch/store/storetest/storetest.go:67-71). A skip is a pass, so without the
    # service this job would be green having run almost nothing.
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # go-envoy, restored only: its modules are the envoy module's, but this job builds the
      # document service's test binary, not the listener and natsd of
      # .github/workflows/ci-caches.yaml's envoy job, which is what fills this family, so it
      # saves none. Its key hashes the root workspace's module files, every fetch file its readers
      # run and go-fetch.sh, so an entry holds what the fetch step below fetches.
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/airlock-lean.txt', '.github/go-fetch/broker-multiprocess.txt', '.github/go-fetch/dispatch-browser-embedder.txt', '.github/go-fetch/dispatch-memory.txt', '.github/go-fetch/dispatch-multiprocess.txt', '.github/go-fetch/envoy-e2e-local.txt', '.github/go-fetch/envoy-go-checks.txt', '.github/go-fetch/envoy-go-docs-finalizers.txt', '.github/go-fetch/envoy-go-race-api.txt', '.github/go-fetch/envoy-go-race-docs.txt', '.github/go-fetch/envoy-go-race.txt', '.github/go-fetch/envoy-session-stall.txt', '.github/go-fetch/listener-server-change.txt', 'packages/envoy/loadtest/cluster/tools.txt', '.github/scripts/go-fetch.sh') }}
          restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
      # Every go step below reads the module cache alone (GOPROXY=off, this file's env), the sizing
      # step's `go run` among them: this step fetches what they load first, tried again on failure.
      - name: Fetch the modules this job's go steps load
        run: .github/scripts/go-fetch.sh file .github/go-fetch/envoy-go-docs-finalizers.txt
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # -v, because the package's leak check prints its line from TestMain after the tests have
      # run: go test in package-list mode buffers the test binary's own output and drops it when
      # the package passes, so without -v a green run would carry the `ok` line and nothing else,
      # and the count of services the tests left alive is the half of this job that no detector
      # of Go's reports.
      - name: Test the document service under the cleanup detector
        run: GODEBUG=checkfinalizers=1 go test -v -count=1 -timeout 34m ./internal/dispatch/docs/
        working-directory: packages/envoy

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go-docs-finalizers
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
