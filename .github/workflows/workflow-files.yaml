name: Workflow files

# why: .github/ci-notes/workflow-files.md#why-the-check-has-a-workflow-of-its-own-and-when-it-runs
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/log-guard-allow.tsv'
      - '.github/log-guard-unread.tsv'
      - '.github/scripts/check-log-guard.sh'
      - '.github/scripts/shell_commands.py'
      - '**/*.sh'

# why: .github/ci-notes/workflow-files.md#what-a-newer-push-cancels
concurrency:
  group: workflow-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The job declares what it needs; nothing runs under this default.
permissions: {}

jobs:
  workflow-files:
    runs-on: ubuntu-24.04
    # A sparse checkout and one pass over .github/workflows; this bounds a hung runner, not the
    # check.
    timeout-minutes: 10
    # why: .github/ci-notes/workflow-files.md#why-the-job-holds-no-scope
    permissions: {}
    steps:
      # why: .github/ci-notes/workflow-files.md#what-the-sparse-checkout-holds
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /.github/
            *.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # why: .github/ci-notes/workflow-files.md#what-the-check-step-measures-and-with-which-copy-of-the-check
      - name: Check every workflow file GitHub can read and its size
        run: .github/scripts/check-workflow-files.sh

      # Every network client a step runs goes through .github/scripts/ci-log-guard.sh or is on
      # .github/log-guard-allow.tsv with its reason, so a server's reply in the log stays text.
      - name: Check every network command a step runs is guarded or allowed with its reason
        if: ${{ !cancelled() }}
        run: .github/scripts/check-log-guard.sh

      # actionlint 1.7.12, the copy .github/ci-images.yaml's actionlint row names, with
      # .github/actionlint.yaml; its shellcheck reads each inline run: body at warning severity.
      - name: Check every workflow file with actionlint
        if: ${{ !cancelled() }}
        # The image is pulled first, inside .github/scripts/ci-log-guard.sh's block, so a registry's
        # error stays text; the run that follows starts it from the local copy, and its output is
        # actionlint's own ::error lines, which must stay commands.
        run: |
          . .github/scripts/ci-log-guard.sh
          ci_log_guard docker pull ghcr.io/cybermonklabs/legion/ci@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          docker run --rm -e SHELLCHECK_OPTS=--severity=warning -v "$PWD:/repo" -w /repo \
            ghcr.io/cybermonklabs/legion/ci@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -verbose -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Filepath}}:{{$err.Line}}:{{$err.Column}}: {{$err.Message}} [{{$err.Kind}}]\n{{end}}'
