name: CI caches

# Fills, on every push to main, the Actions caches ci.yaml's jobs restore, so a pull request or a
# merge group finds them warm: six Go families, the architecture-check and spec-check actions'
# families, elan, bun and the two builds dispatch-two-builds compares against, which a release's
# dispatch fills again (`only: dispatch-builds`, below). go-docs is docs-pages.yaml's.
# why: .github/ci-notes/ci-caches.md#what-this-workflow-fills-and-why-it-runs-on-a-push-to-main
# Each fill keeps in the build cache only what its own build used
# (.github/scripts/go-cache-working-set.sh).
# why: .github/ci-notes/ci-caches.md#why-each-fill-keeps-only-what-its-own-build-used

# A push to main, and a dispatch: by hand, or from release-envoy-listener.yaml's release_publish
# with `only: dispatch-builds` once a release is tagged, which runs the dispatch-builds jobs alone.
# why: .github/ci-notes/ci-caches.md#when-it-runs-and-one-fill-at-a-time
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: >-
          dispatch-builds runs the two Dispatch build jobs alone, as release_publish asks after a
          release; all runs every job.
        type: choice
        options: [all, dispatch-builds]
        default: all

# One fill at a time per ref and per `only`, never cancelled.
# why: .github/ci-notes/ci-caches.md#when-it-runs-and-one-fill-at-a-time
concurrency:
  group: ci-caches-${{ github.ref }}-${{ inputs.only || 'all' }}
  cancel-in-progress: false

# Reading the tree and the caches is all this workflow does but in three jobs: the cache scope
# needs no token scope of its own, and nothing here reports a check or writes an artifact. The
# refill-superseded, envoy-infra-superseded and dispatch-builds-superseded jobs alone take
# `actions: write`, to delete the entries a fill replaced or this repository keeps no more, and
# build nothing.
permissions:
  contents: read

# The proxy fall-through each ci-job-*.yaml file's env block explains: with `|`, a go command
# that hits ANY error from proxy.golang.org - a reset mid-stream among them - fetches the same
# bytes from the source and checks them against go.sum.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # go-daemon. It keys on packages/daemon/go.mod's Go: ci.yaml's typecheck, daemon-go, plugin-pack
  # and pi-legion set Go up from it. One leg per runner, because typecheck runs on
  # ubuntu-24.04-arm and the other three on ubuntu-24.04, and the key carries the runner's
  # architecture. Each leg builds what its runner's readers build: typecheck's vet on both, and
  # the test and race builds on the x86_64 leg alone, since no job that reads the arm64 entry
  # runs them. Each push fills it again from its newest entry (ci-caches.md says why).
  daemon:
    if: inputs.only != 'dispatch-builds'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Budget (the Budgets note of .github/ci-budgets.md): 5400 s, the 90 minutes this job
    # carried while it filled go-notices too, whose build is the long one; no leg of the daemon
    # build alone has been measured near it. Plus its slowest retried step alone, which is now its
    # one: the daemon download, 5 x 180 + 150 = 1050 s. The notices download's two calls,
    # 2 x (5 x 180 + 150) = 2100 s, went to the notices job below with the build they feed
    # (main's #4308), and each leg of the matrix runs the same one download, so no leg adds a term.
    # 5400 + 1050 = 6450 s -> 108 min, which stands above that step's own 18 minutes.
    timeout-minutes: 108
    outputs:
      # The key each leg saved, under a name of that leg's architecture, for the
      # refill-superseded job: a matrix job's outputs are combined from its legs, and an output
      # both legs set holds the value of whichever leg ended last.
      go-daemon-x64: ${{ steps.saved.outputs.go-daemon-x64 }}
      go-daemon-arm64: ${{ steps.saved.outputs.go-daemon-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # The newest entry of the family, which the builds below compile on: the readers' key,
      # which no entry carries any more, and that key and a `-`. The key's own prefix match can
      # still reach an entry of a Go whose version starts with this one's (go1.27.30 for go1.27.3);
      # Go keys each object on the toolchain that built it, so that entry costs only its download.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-daemon
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # The modules the builds below compile, downloaded once and retried before them.
      # why: .github/ci-notes/ci-caches.md#the-go-module-downloads-before-each-fills-builds
      - name: Download the Go modules this job builds
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/daemon's Go modules" 180 -- go -C packages/daemon mod download

      # Every entry of the restored build cache is marked unused here, the builds below mark what
      # they use, and the step after them deletes the rest, so the entry saved holds this commit's
      # build and not every build since the family was last filled from nothing
      # (.github/scripts/go-cache-working-set.sh says how, and what that growth cost).
      - name: Mark the restored build cache's entries unused until the builds use them
        run: .github/scripts/go-cache-working-set.sh begin "$RUNNER_TEMP/go-daemon-working-set"

      # What typecheck builds: the vet behind the e2e tag. It is the one build of this family an
      # arm64 job makes (.github/workflows/ci-job-typecheck.yaml), so both legs run it.
      # typecheck's darwin vet is the one build left out: its darwin objects, about 1.65 GB of build
      # cache on a devbox, would ride in an entry every job that restores go-daemon downloads, and
      # the step builds them in about two minutes (run 43990864191).
      - name: Build what typecheck builds of the daemon module
        run: go vet -tags e2e ./...
        working-directory: packages/daemon

      # What daemon-go builds: the test binary of every package, and the race build of the five
      # packages daemon-go runs under the detector, whose
      # objects are cache entries of their own. Those five are the list
      # .github/scripts/ci_job_reads.py's DAEMON_RACE_PACKAGES holds, which check-ci-filters.sh
      # holds daemon-go's race legs (.github/go-legs.yaml) to, so a package that joins or leaves the
      # detector there is the side this command follows. The test binaries are compiled and never run (`go test -c -o
      # /dev/null` links each one and writes nothing): running them would want tmux, jj, Oh My Pi,
      # uv, container images and a Postgres service, and the build cache this entry holds is what
      # a compile leaves. The x86_64 leg alone: daemon-go, plugin-pack and pi-legion, which read
      # these objects, run on ubuntu-24.04.
      - name: Build what daemon-go builds of the daemon module
        if: runner.arch == 'X64'
        run: |
          go test -c -o /dev/null ./...
          go test -c -o /dev/null -race ./internal/daemon/ ./internal/sessionproxy/ ./internal/launcher/ ./internal/intake/ ./internal/shimwire/
        working-directory: packages/daemon

      - name: Delete the build cache's entries the builds did not use
        run: .github/scripts/go-cache-working-set.sh end "$RUNNER_TEMP/go-daemon-working-set"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      # The key the save above wrote, as the job's outputs name it: RUNNER_ARCH is X64 or ARM64,
      # lowercased here.
      - name: Name the key this leg saved by its architecture
        id: saved
        env:
          KEY: ${{ steps.go-daemon.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-daemon-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

  # go-notices, in a job of its own on ubuntu-24.04-arm, the runner of lint, whose notices step the
  # family belongs to. It keys on packages/daemon/go.mod's Go, which lint installs, though that
  # step also builds the envoy and infra modules' commands, and on the runner's architecture
  # before the OS, as lint's restore does: the entry holds the go-licenses that step runs, and an
  # <os>-<arch> key would start with the go-notices-<os>- prefix of a run of a workflow file older
  # than the architecture in the key, which then restores this arm64 program on x86_64.
  notices:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04-arm
    # Budget (the Budgets note of .github/ci-budgets.md): 5400 s, the 90 minutes the daemon job
    # carried for this build while it filled this family, and this job carries since main's
    # #4308 gave the family a job of its own — the notices build is the long one: it writes the
    # notices of, and cross-compiles, every release target of three modules on a cold module
    # cache — plus its slowest retried step alone: the notices download's two calls,
    # 2 x (5 x 180 + 150) = 2100 s. That arithmetic is a whole number of minutes, so the step's own
    # budget takes one more and this job takes it too: 5400 + 2160 = 7560 s -> 127 min, the
    # whole minute above a sum that is itself a whole number of minutes.
    timeout-minutes: 127
    outputs:
      # The key this job saved, named by its architecture as the other fills' outputs are.
      go-notices-arm64: ${{ steps.saved.outputs.go-notices-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # The newest entry of the family, which the script below builds on, found as the daemon
      # job's restore finds its own.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-notices
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.arch }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-notices-${{ runner.arch }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-

      # The modules the notices script builds, downloaded once and retried before it.
      # why: .github/ci-notes/ci-caches.md#the-go-module-downloads-before-each-fills-builds
      - name: Download the Go modules the notices script builds
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: two calls, 2 x (5 x 180 + 150) = 2100 s. That is a whole
        # number of minutes, so the budget is the next one strictly above it -> 36 min.
        timeout-minutes: 36
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/daemon's Go modules" 180 -- go -C packages/daemon mod download
          retry_fetch "packages/envoy/infra's Go modules" 180 -- go -C packages/envoy/infra mod download

      # As the daemon job's step of this name: the script's builds mark what they use.
      - name: Mark the restored build cache's entries unused until the builds use them
        run: .github/scripts/go-cache-working-set.sh begin "$RUNNER_TEMP/go-notices-working-set"

      # The very script lint's notices step runs, .github/scripts/go-release-notices.sh: the
      # same loops over .github/go-release-targets.json, .github/agent-secrets-client-targets.json
      # and .github/envoy-infra-targets.json, with the same GOOS, GOARCH and CGO_ENABLED per
      # target, so the modules it downloads, the go-licenses it builds under ~/.cache/legion and
      # the objects it leaves are the ones lint restores. go-licenses sits there in a directory that
      # names this runner's OS and CPU (scripts/go-third-party-notices.sh), so a lint on another CPU
      # that restores this entry finds no go-licenses at its own path and builds one rather than run
      # this one. One script and not a copy of those loops, because a copy stops warming a target
      # the day lint gains one, and nothing fails: lint just builds those objects cold on every run.
      - name: Write every Go release archive's third-party notices and cross-build the commands
        # why: .github/ci-notes/ci-caches.md#the-notices-step-whose-script-the-gate-does-not-read
        # 674 + 1050 = 1724 s -> 29 min.
        timeout-minutes: 29
        run: .github/scripts/go-release-notices.sh "$RUNNER_TEMP/notices"

      - name: Delete the build cache's entries the builds did not use
        run: .github/scripts/go-cache-working-set.sh end "$RUNNER_TEMP/go-notices-working-set"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.arch }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      - name: Name the key this job saved by its architecture
        id: saved
        env:
          KEY: ${{ steps.go-notices.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-notices-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

  # go-envoy. It keys on packages/envoy/go.mod's Go, the module every job that restores it sets Go
  # up from. Each push fills it again from its newest entry (the header says why). One leg per
  # runner: the envoy lanes that restore it run on ubuntu-24.04-arm, and envoy-go-build,
  # envoy-go-checks, the browser lane's embedder, the nightly browser re-record and this
  # workflow's darwin vet restore it on ubuntu-24.04.
  envoy:
    if: inputs.only != 'dispatch-builds'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # why: .github/ci-notes/ci-caches.md#the-envoy-and-envoy-test-jobs-budgets
    # 600 + 1050 = 1650 s -> 28 min.
    timeout-minutes: 28
    outputs:
      # The key each leg saved, named by family and architecture as the daemon job's are.
      go-envoy-x64: ${{ steps.go-envoy-saved.outputs.go-envoy-x64 }}
      go-envoy-arm64: ${{ steps.go-envoy-saved.outputs.go-envoy-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # The newest entry of the family, found as the daemon job's restore finds its own.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-envoy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # The module the build below compiles, downloaded once and retried before it.
      # why: .github/ci-notes/ci-caches.md#the-go-module-downloads-before-each-fills-builds
      - name: Download the Go modules this job builds
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download

      # As the daemon job's first step of the script, for go-envoy's build.
      - name: Mark the restored build cache's entries unused until the go-envoy build uses them
        run: .github/scripts/go-cache-working-set.sh begin "$RUNNER_TEMP/go-envoy-working-set"

      # The two binaries envoy-e2e-local's scripts/e2e-local.sh and envoy-session-stall's
      # test/envoy-stack.ts build, and whose packages listener-server-change compiles too: the
      # listener and the in-process NATS server's natsd. An -o ending in a separator names a
      # directory, as envoy-stack.ts's build does, so both main packages build in one command.
      # envoy-go-build's darwin vet is left out: its darwin objects, about 1.7 GB of build cache on
      # a devbox, would ride in an entry every job that restores go-envoy downloads. They have a
      # family of their own, go-envoy-darwin-vet, which the envoy-darwin-vet job fills.
      - name: Build the listener and natsd of the envoy module
        run: go build -o "$RUNNER_TEMP/envoy-bin/" ./cmd/listener ./internal/testnats/cmd/natsd
        working-directory: packages/envoy

      # This fill runs no go vet, on purpose (PR #5289): with one, full or -stdmethods alike, the
      # saved x64 entry was 475 MB against 202 MB without, so a go-envoy reader that vets reruns cgo
      # for net, os/user and runtime/cgo, and that is the chosen cost.
      - name: Delete the build cache's entries the go-envoy build did not use
        run: .github/scripts/go-cache-working-set.sh end "$RUNNER_TEMP/go-envoy-working-set"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      - name: Name the go-envoy key this leg saved by its architecture
        id: go-envoy-saved
        env:
          KEY: ${{ steps.go-envoy.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-envoy-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

  # go-envoy-test, on go-envoy's Go and runners. A job of its own, so its restore comes before
  # every build that writes what it restores: it restores its newest entry, then builds the
  # listener and natsd as the envoy job does and starts the test binary of every package, and
  # saves. Its entry holds go-envoy's objects too, built here on its own entry: envoy-go's tests
  # build the listener and natsd, and the browser lane's jobs that restore this family build
  # commands of the same module. In one job with the envoy fill, this restore unpacked over that
  # fill's build and needed the module cache made writable first.
  envoy-test:
    if: inputs.only != 'dispatch-builds'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # why: .github/ci-notes/ci-caches.md#the-envoy-and-envoy-test-jobs-budgets
    # 1800 + 1050 = 2850 s -> 48 min.
    timeout-minutes: 48
    outputs:
      # The key each leg saved, named by family and architecture as the daemon job's are.
      go-envoy-test-x64: ${{ steps.go-envoy-test-saved.outputs.go-envoy-test-x64 }}
      go-envoy-test-arm64: ${{ steps.go-envoy-test-saved.outputs.go-envoy-test-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # The newest entry of the family, found as the daemon job's restore finds its own.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-envoy-test
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # The module both builds below compile, downloaded once and retried before the first, after
      # the restore, which would otherwise unpack over what the download wrote.
      # why: .github/ci-notes/ci-caches.md#the-go-module-downloads-before-each-fills-builds
      - name: Download the Go modules this job builds
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download

      # As the daemon job's first step of the script, for both builds below: the entry saved holds
      # go-envoy's objects too, built here, so the listener and natsd build marks what it uses as
      # the test build does.
      - name: Mark the restored build cache's entries unused until the go-envoy-test builds use them
        run: .github/scripts/go-cache-working-set.sh begin "$RUNNER_TEMP/go-envoy-test-working-set"

      # The envoy job's build of the same name, so this entry holds those objects too.
      - name: Build the listener and natsd of the envoy module
        run: go build -o "$RUNNER_TEMP/envoy-bin/" ./cmd/listener ./internal/testnats/cmd/natsd
        working-directory: packages/envoy

      # envoy-go's set, the natslive build of its natslive step's five packages among it. Each
      # binary is built and started as envoy-go's go test does, and `-run '^$'` runs no test, so
      # no Postgres or image is needed. `go test -c` compiled each test main another way.
      # why: .github/ci-notes/ci-caches.md#why-the-go-envoy-test-fill-starts-each-test-binary
      - name: Build and start the test binary of every package of the envoy module, running no test
        run: |
          go test -count=1 -run '^$' ./...
          go test -count=1 -run '^$' -tags natslive ./internal/testnats/ ./internal/bus/ ./internal/cipher/natscallout/ ./natsgrant/ ./cmd/listener/
        working-directory: packages/envoy

      - name: Delete the build cache's entries neither envoy build used
        run: .github/scripts/go-cache-working-set.sh end "$RUNNER_TEMP/go-envoy-test-working-set"

      # No reader extracts a module again, so none reads a zip. A `!` path line would not exclude
      # them: the save archives each directory it lists whole.
      # why: .github/ci-notes/ci-caches.md#why-the-go-envoy-test-fill-deletes-the-module-zips
      - name: Delete the module zips, which no job that restores this entry reads
        run: |
          find "$(go env GOMODCACHE)/cache/download" -type f -name '*.zip' -printf '%s\n' -delete |
          awk '{ n++; b += $1 } END { printf "deleted %d module zips, %d bytes\n", n, b }'

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      - name: Name the go-envoy-test key this leg saved by its architecture
        id: go-envoy-test-saved
        env:
          KEY: ${{ steps.go-envoy-test.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-envoy-test-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

  # go-envoy-darwin-vet: what envoy-go-build's "Vet envoy for darwin, its tagged tests included"
  # compiles, the standard library and every package the envoy module builds for darwin/arm64, in
  # a build cache directory of its own, the GOCACHE that step's env names, so neither this entry
  # nor go-envoy's carries the other's objects. Restored from nothing, that vet compiled all of it
  # on every run: 137.9 s of envoy-go-checks job 137308591036 (the vet was envoy-go-checks' step
  # then), 172 s at the median of 550 pull request runs; on a devbox, 803 s cold against 82 s on a
  # warm cache of 1.7 GB. Each push fills it again from its newest entry, as ci-caches.md says. It
  # restores go-envoy first, as envoy-go-build does, for the module cache the vet reads. It runs on
  # ubuntu-24.04 alone, the runner envoy-go-build runs on, and its key carries that runner's
  # architecture as every family's does. A job of its own, so neither this fill nor the envoy
  # jobs' can stop the other.
  envoy-darwin-vet:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04
    # Budget (the Budgets note of .github/ci-budgets.md): 1800 s, the 30 minutes main's #5148
    # wrote for it — the vet from nothing is the long case, 803 s on a devbox and 172 s at the
    # median in envoy-go-checks, which held the vet then — plus its one retried step, the Go
    # module download below, 5 x 180 + 150 = 1050 s. 1800 + 1050 = 2850 s -> 48 min.
    timeout-minutes: 48
    outputs:
      # The key this job saved, named by family and architecture as the other fills' are.
      go-envoy-darwin-vet-x64: ${{ steps.saved.outputs.go-envoy-darwin-vet-x64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # The module cache the vet reads, from go-envoy's newest entry, as envoy-go-build has it.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # The newest entry of the family, found as the daemon job's restore finds its own.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-envoy-darwin-vet
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-build-darwin
          key: go-envoy-darwin-vet-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-envoy-darwin-vet-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # The modules the vet reads, downloaded once and retried before it.
      # why: .github/ci-notes/ci-caches.md#the-go-module-downloads-before-each-fills-builds
      - name: Download the Go modules this job builds
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download

      # As the daemon job's first step of the script, over the vet's own build cache.
      - name: Mark the restored darwin build cache's entries unused until the vet uses them
        env:
          GOCACHE: ${{ runner.temp }}/go-build-darwin
        run: .github/scripts/go-cache-working-set.sh begin "$RUNNER_TEMP/go-envoy-darwin-vet-working-set"

      # envoy-go-build's vet, its env and its script as that step has them (ci_job_reads.py's
      # darwin_vet_script is the text check-ci-filters.sh holds that step to), so the entry holds
      # each tag set it vets.
      - name: Vet the envoy module for darwin, as envoy-go-build does
        env:
          GOCACHE: ${{ runner.temp }}/go-build-darwin
        run: |
          flags=$(python3 ../../.github/scripts/go_build_tags.py . darwin arm64)
          while IFS= read -r flag; do
            echo "Vetting for darwin with $flag"
            GOOS=darwin GOARCH=arm64 go vet "$flag" ./...
          done <<< "$flags"
        working-directory: packages/envoy

      - name: Delete the darwin build cache's entries the vet did not use
        env:
          GOCACHE: ${{ runner.temp }}/go-build-darwin
        run: .github/scripts/go-cache-working-set.sh end "$RUNNER_TEMP/go-envoy-darwin-vet-working-set"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-build-darwin
          key: go-envoy-darwin-vet-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      - name: Name the key this job saved by its architecture
        id: saved
        env:
          KEY: ${{ steps.go-envoy-darwin-vet.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-envoy-darwin-vet-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

  # The entries of go-daemon, go-notices, go-envoy, go-envoy-test and go-envoy-darwin-vet that the
  # fills above replaced, deleted once each fill has saved its new one, three a leg at most, each
  # read and each delete through the one retry at 30 s an attempt.
  # why: .github/ci-notes/ci-caches.md#the-refill-superseded-job
  # Budget (the Budgets note of .github/ci-budgets.md): 300 s, the 5 minutes this job carried,
  # plus its one retried step, 300 + 3 x 300 = 1200 s. 300 + 1200 = 1500 s -> 26 min, the whole
  # minute above a sum that is itself a whole number of minutes.
  refill-superseded:
    needs: [daemon, notices, envoy, envoy-test, envoy-darwin-vet]
    if: ${{ !cancelled() && inputs.only != 'dispatch-builds' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: daemon, family: go-daemon, arch: x64 }
          - { job: daemon, family: go-daemon, arch: arm64 }
          - { job: notices, family: go-notices, arch: arm64 }
          - { job: envoy, family: go-envoy, arch: x64 }
          - { job: envoy, family: go-envoy, arch: arm64 }
          - { job: envoy-test, family: go-envoy-test, arch: x64 }
          - { job: envoy-test, family: go-envoy-test, arch: arm64 }
          - { job: envoy-darwin-vet, family: go-envoy-darwin-vet, arch: x64 }
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 26
    env:
      JOB_TIMEOUT_MINUTES: 26 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    permissions:
      actions: write
    steps:
      # For the helpers of .github/scripts the step sources, alone: this repository is public, so
      # the checkout needs no scope beyond the one the deletes need.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs[matrix.job].outputs[format('{0}-{1}', matrix.family, matrix.arch)] != ''
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Delete this ref's entries of the family that the new one supersedes
        if: needs[matrix.job].outputs[format('{0}-{1}', matrix.family, matrix.arch)] != ''
        # Its own retry arithmetic: the list and the three deletes a run makes at most,
        # 300 + 3 x 300 = 1200 s -> 21 min, the whole minute above a sum that is itself a whole
        # number of minutes.
        timeout-minutes: 21
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAMILY: ${{ matrix.family }}
          KEEP: ${{ needs[matrix.job].outputs[format('{0}-{1}', matrix.family, matrix.arch)] }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          STEP_TIMEOUT_MINUTES: 21 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        run: |
          set -euo pipefail
          # Each call is a ladder run through gh_wait_reset, which waits out a spent API budget
          # only when the wait and one more ladder fit within this step's limit and the job's,
          # and fails by name otherwise.
          . .github/scripts/ci-retry.sh
          source .github/scripts/gh-read.sh
          # The readers' key: the saved one without the commit the fill put at its end.
          base=${KEEP%"-$SHA"}
          if [ "$base-$SHA" != "$KEEP" ]; then
            echo "::error::the $FAMILY key this leg saved does not end in this run's commit, so nothing is deleted" >&2
            exit 1
          fi
          # Newest first, by GitHub's own creation order, so the new entry is among the entries
          # read however many older ones a failed run left behind.
          entries=$(gh_wait_reset retry_fetch "this ref's $FAMILY entries" 30 -- \
            gh cache list --ref "$REF" --key "$base" --sort created_at --order desc --limit 100 --json id,key,ref)
          if ! jq -e --arg keep "$KEEP" --arg ref "$REF" 'any(.[]; .key == $keep and .ref == $ref)' <<<"$entries" >/dev/null; then
            echo "::warning::the new $FAMILY entry is not among this ref's entries, so none is deleted" >&2
            exit 0
          fi
          superseded=$(jq -r --arg keep "$KEEP" --arg base "$base" --arg ref "$REF" \
            '.[] | select(.ref == $ref and .key != $keep and (.key == $base or (.key | startswith($base + "-")))) | .id' <<<"$entries")
          ids=()
          [ -z "$superseded" ] || mapfile -t ids <<<"$superseded"
          # Three at most, newest first: the job's comment says why three.
          for slot in 1 2 3; do
            [ "$slot" -le "${#ids[@]}" ] || break
            id=${ids[$((slot - 1))]}
            if ! [[ $id =~ ^[0-9]+$ ]]; then
              echo "::error::the cache list gave an id that is not a number, so nothing more is deleted" >&2
              exit 1
            fi
            echo "Deleting $FAMILY entry $id, which the new entry supersedes"
            gh_wait_reset retry_fetch "the deletion of $FAMILY entry $id" 30 -- \
              gh cache delete "$id"
          done
          if [ "${#ids[@]}" -gt 3 ]; then
            echo "::warning::$((${#ids[@]} - 3)) more of this ref's $FAMILY entries the new one supersedes stay for the next fill to delete: a run deletes three at most" >&2
          fi

  # architecture-check-<os>-<arch>-go<version>-<hash>, the family of the composite action
  # .github/actions/architecture-check, run as ci.yaml's envoy-go-build runs it: the action
  # restores and saves its entry itself, and checks main's notes.
  # why: .github/ci-notes/ci-caches.md#the-architecture-check-job
  architecture-check:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04
    # The action takes seconds: 13 s with its own Go download and a cache miss, in ci.yaml's
    # envoy-go-checks of run 43553309875, the job envoy-go-build was then a part of, and this job
    # 27 s and 26 s whole (runs 43586962074 and 43592826052). Each was measured before the
    # action's fetch was split out of its build; the split fetch is `go list -deps` of the
    # command, which fetches only the two modules that build fetched itself, so each figure holds
    # the same work. Budget (ci-budgets.md's Budgets note): those 27 s measured, plus the action's
    # one retried call, its Go modules at the module bound, 5 x 180 + 150 = 1050 s, so
    # 27 + 1050 = 1077 s; the step's own budget below is 18 min, and this key strictly exceeds it
    # -> 19 min.
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Its own retry arithmetic, which is the action's: the Go modules at the module bound,
      # 5 x 180 + 150 = 1050 s, beside the 13 s the action measured on a cache miss (the job's
      # comment above says what that figure holds), 13 + 1050 = 1063 s -> 18 min.
      - name: Fill the architecture-check action's cache and check main's notes
        uses: ./.github/actions/architecture-check
        timeout-minutes: 18

  # spec-check-<os>-<arch>-go<version>-<hash>, the family of the composite action
  # .github/actions/spec-check, run as ci.yaml's envoy-go-build runs it, with allow-empty while
  # main holds no spec file. It fills the entry as the architecture-check job above fills its own.
  # It is a job of its own, so a refused note set on main cannot stop this fill and a refused spec
  # tree on main cannot stop the note check.
  spec-check:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 900 s, the 15 minutes this job was written with
    # (main's #4172; no run has measured it yet), plus the action's one retried call, its Go
    # modules at the module bound, 5 x 180 + 150 = 1050 s. 900 + 1050 = 1950 s -> 33 min.
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Its own retry arithmetic, which is the action's: the Go modules at the module bound,
      # 5 x 180 + 150 = 1050 s, beside the 47 s the fetch and the build took on empty caches in a
      # 2-CPU pod (.github/scripts/build-envoy-command.sh's header), 47 + 1050 = 1097 s -> 19 min.
      - name: Fill the spec-check action's cache and check main's spec files
        uses: ./.github/actions/spec-check
        timeout-minutes: 19
        with:
          allow-empty: 'true'

  # go-envoy-infra, keyed on packages/envoy/infra/go.mod's Go and on the hash of the files that
  # choose its module versions, built as ci.yaml's envoy-infra-build and envoy-infra-go build it.
  # One leg per runner; the superseded job below deletes the entry each leg's fill replaced.
  # why: .github/ci-notes/ci-caches.md#the-envoy-infra-job
  envoy-infra:
    if: inputs.only != 'dispatch-builds'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Budget (the Budgets note of .github/ci-budgets.md): 2700 s, the 45 minutes
    # this job carried, plus its slowest retried step alone — packages/envoy/infra's
    # `go mod download`, 5 x 180 + 150 = 1050 s. 2700 + 1050 = 3750 s -> 63 min.
    timeout-minutes: 63
    outputs:
      # The key each leg looked up, and whether it filled it, under names of that leg's
      # architecture: a matrix job's outputs are combined from its legs, and an output both legs
      # set holds the value of whichever leg ended last. The superseded job keeps each filled key,
      # deletes the entries it supersedes (this ref's go-envoy-infra entries of the same runner and
      # Go with an older module-file hash), and runs only after a fill.
      key-x64: ${{ steps.leg.outputs.key-x64 }}
      filled-x64: ${{ steps.leg.outputs.filled-x64 }}
      key-arm64: ${{ steps.leg.outputs.key-arm64 }}
      filled-arm64: ${{ steps.leg.outputs.filled-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/infra/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      - id: go-envoy-infra
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum') }}
          lookup-only: true

      # The lookup's key and whether this leg fills it, as the job's outputs name them: RUNNER_ARCH
      # is X64 or ARM64, lowercased here.
      - name: Name this leg's key by its architecture
        id: leg
        env:
          KEY: ${{ steps.go-envoy-infra.outputs.cache-primary-key }}
          FILLED: ${{ steps.go-envoy-infra.outputs.cache-hit != 'true' }}
        run: |
          arch=${RUNNER_ARCH,,}
          echo "key-$arch=$KEY" >>"$GITHUB_OUTPUT"
          echo "filled-$arch=$FILLED" >>"$GITHUB_OUTPUT"

      # The infra module's workspace, downloaded once and retried before the vet and the builds.
      # why: .github/ci-notes/ci-caches.md#the-go-module-downloads-before-each-fills-builds
      - name: Download the Go modules this job builds
        if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy/infra's Go modules" 180 -- go -C packages/envoy/infra mod download

      # What envoy-infra-build, envoy-infra-go and the release build build: the vet with both
      # live-test tags, for linux and for darwin, the natslive binaries of the three packages
      # envoy-infra-go's live step runs, and the test binaries of each leg's reader. On
      # ubuntu-24.04-arm, envoy-infra-build's unit step's race build, through the script that step
      # runs (scripts/race-unit.sh, here in its compile mode), so the entry holds what that step
      # links; check-ci-filters.sh holds this leg to that call and to no race build of its own. On
      # ubuntu-24.04, release-envoy-infra.yaml's plain `go test ./...`. Compiled, not run: the live
      # tests need nats-server, Postgres and container images, and the unit tests nothing a build
      # cache keeps. The darwin vet is in the fill because, built cold, it is the step that brought
      # the one envoy-infra-go job those halves were near its time limit.
      - name: Build what envoy-infra-build and envoy-infra-go build
        if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        run: |
          flags=$(python3 ../../../.github/scripts/go_build_tags.py . darwin arm64)
          go vet -tags pulumilive,natslive ./...
          while IFS= read -r flag; do
            GOOS=darwin GOARCH=arm64 go vet "$flag" ./...
          done <<< "$flags"
          if [ "$RUNNER_ARCH" = ARM64 ]; then
            scripts/race-unit.sh compile
          else
            go test -c -o /dev/null ./...
          fi
          go test -c -o /dev/null -tags natslive ./core/ ./seed/ ./gcp/
        working-directory: packages/envoy/infra

      # Under the key the lookup computed, not a hashFiles() taken again: the build above can add
      # checksums to the module files that key hashes (ci-caches.md says what that cost).
      - if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-envoy-infra.outputs.cache-primary-key }}

  # The go-envoy-infra entries the fill above superseded, deleted once it has saved the new one,
  # each read and each delete through the one retry at 30 s an attempt.
  # why: .github/ci-notes/ci-caches.md#the-envoy-infra-superseded-job
  # Budget (the Budgets note of .github/ci-budgets.md): 300 s, the 5 minutes this job carried,
  # plus its one retried step, 600 s. 300 + 600 = 900 s -> 16 min, the whole minute above a sum
  # that is itself a whole number of minutes.
  envoy-infra-superseded:
    needs: envoy-infra
    if: needs.envoy-infra.outputs.filled-x64 == 'true' || needs.envoy-infra.outputs.filled-arm64 == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 16
    env:
      JOB_TIMEOUT_MINUTES: 16 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    permissions:
      actions: write
      contents: read
    steps:
      # For the helpers of .github/scripts the step sources, alone: this repository is public, so
      # the checkout needs no scope beyond the one the deletes need, and it leaves no credential
      # behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.envoy-infra.outputs[format('filled-{0}', matrix.arch)] == 'true'
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Delete this ref's go-envoy-infra entries the new one supersedes
        if: needs.envoy-infra.outputs[format('filled-{0}', matrix.arch)] == 'true'
        # Its own retry arithmetic: the list and the one delete a common run makes,
        # 300 + 300 = 600 s -> 11 min, the whole minute above a sum that is itself a whole number
        # of minutes.
        timeout-minutes: 11
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ needs.envoy-infra.outputs[format('key-{0}', matrix.arch)] }}
          REF: ${{ github.ref }}
          STEP_TIMEOUT_MINUTES: 11 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        run: |
          set -euo pipefail
          # Each call is a ladder run through gh_wait_reset, which waits out a spent API budget
          # only when the wait and one more ladder fit within this step's limit and the job's,
          # and fails by name otherwise.
          . .github/scripts/ci-retry.sh
          source .github/scripts/gh-read.sh
          entries=$(gh_wait_reset retry_fetch "this ref's go-envoy-infra entries" 30 -- \
            gh cache list --ref "$REF" --key go-envoy-infra- --limit 100 --json id,key,ref)
          if ! jq -e --arg keep "$KEEP" --arg ref "$REF" 'any(.[]; .key == $keep and .ref == $ref)' <<<"$entries" >/dev/null; then
            echo "::warning::the new go-envoy-infra entry is not among this ref's entries, so none is deleted" >&2
            exit 0
          fi
          jq -r --arg keep "$KEEP" --arg ref "$REF" \
            'def base: gsub("-[0-9a-f]{64}"; "");
             .[] | select(.ref == $ref and (.key | startswith("go-envoy-infra-")) and .key != $keep
                          and (.key | base) == ($keep | base)) | .id' <<<"$entries" |
            while read -r id; do
              if ! [[ $id =~ ^[0-9]+$ ]]; then
                echo "::error::the cache list gave an id that is not a number, so nothing more is deleted" >&2
                exit 1
              fi
              echo "Deleting go-envoy-infra entry $id, which the new entry supersedes"
              gh_wait_reset retry_fetch "the deletion of go-envoy-infra entry $id" 30 -- \
                gh cache delete "$id"
            done

  # The two builds ci.yaml's dispatch-two-builds job runs the tree against, the previous release's
  # and the pinned first-rollout release's, which that job restores and never saves: this job
  # fills both in main's scope, on each push to main and after each release (the `only` input).
  # why: .github/ci-notes/ci-caches.md#the-dispatch-builds-job
  dispatch-builds:
    # Main alone: a dispatched run on another branch would save the builds in that branch's scope,
    # which only that branch's runs read.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/ci-caches.md#the-dispatch-builds-jobs-budget
    # 900 + 3416 = 4316 s -> 72 min.
    timeout-minutes: 72
    outputs:
      # The key of each build's entry, which dispatch-builds-superseded keeps.
      previous: ${{ steps.previous-build.outputs.cache-primary-key }}
      first-rollout: ${{ steps.first-rollout-build.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # dispatch-two-builds' step of this name, so the commit in the key is the one it restores.
      - name: Resolve the previous build's commit
        id: previous
        run: |
          commit=$(packages/envoy/scripts/build-dispatch-build.sh --previous-release --resolve)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The pin, read out of dispatch-two-builds' env, where that job's resolve step also checks
      # that the release's tag names it.
      - name: Read the first-rollout build's commit from dispatch-two-builds' pin
        id: first-rollout
        run: |
          commit=$(yq -r '.jobs["dispatch-two-builds"].env.FIRST_ROLLOUT_COMMIT' .github/workflows/ci-job-dispatch-two-builds.yaml)
          if ! [[ $commit =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/workflows/ci-job-dispatch-two-builds.yaml's dispatch-two-builds job sets FIRST_ROLLOUT_COMMIT to '$commit', not a full commit sha"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - id: previous-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-previous
          key: dispatch-previous-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/scripts/build-dispatch-build.sh') }}-${{ steps.previous.outputs.commit }}
          lookup-only: true

      - id: first-rollout-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-first-rollout
          key: dispatch-first-rollout-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/scripts/build-dispatch-build.sh') }}-${{ steps.first-rollout.outputs.commit }}
          lookup-only: true

      - if: steps.previous-build.outputs.cache-hit != 'true' || steps.first-rollout-build.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      - if: steps.previous-build.outputs.cache-hit != 'true' || steps.first-rollout-build.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-bun
        # why: .github/ci-notes/ci-caches.md#the-dispatch-builds-jobs-budget
        # 2 x 1708 = 3416 s -> 57 min.
        timeout-minutes: 57

      - name: Build the previous build
        if: steps.previous-build.outputs.cache-hit != 'true'
        # why: .github/ci-notes/ci-caches.md#the-dispatch-builds-jobs-budget
        # 1050 + 1050 + 116 = 2216 s -> 37 min.
        timeout-minutes: 37
        env:
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.commit }}
          DISPATCH_PREVIOUS_BUILD: ${{ runner.temp }}/dispatch-previous
        run: packages/envoy/scripts/build-dispatch-build.sh --commit "$PREVIOUS_COMMIT" --out "$DISPATCH_PREVIOUS_BUILD"

      # Under the key the lookup computed, as every hashed key of this workflow is saved.
      - if: steps.previous-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-previous
          key: ${{ steps.previous-build.outputs.cache-primary-key }}

      - name: Build the first-rollout build
        if: steps.first-rollout-build.outputs.cache-hit != 'true'
        # why: .github/ci-notes/ci-caches.md#the-dispatch-builds-jobs-budget
        # 1050 + 1050 + 116 = 2216 s -> 37 min.
        timeout-minutes: 37
        env:
          FIRST_ROLLOUT_COMMIT: ${{ steps.first-rollout.outputs.commit }}
          DISPATCH_FIRST_ROLLOUT_BUILD: ${{ runner.temp }}/dispatch-first-rollout
        run: packages/envoy/scripts/build-dispatch-build.sh --commit "$FIRST_ROLLOUT_COMMIT" --out "$DISPATCH_FIRST_ROLLOUT_BUILD"

      # Under the key the lookup computed, as every hashed key of this workflow is saved.
      - if: steps.first-rollout-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-first-rollout
          key: ${{ steps.first-rollout-build.outputs.cache-primary-key }}

  # The entries of the two Dispatch builds this repository keeps no more, on main and on every
  # other ref, deleted once dispatch-builds has looked its keys up, three a leg at most, each read
  # and each delete through the one retry at 30 s an attempt.
  # why: .github/ci-notes/ci-caches.md#the-dispatch-builds-superseded-job
  # Budget (the Budgets note of .github/ci-budgets.md): 300 s, the 5 minutes main's #5182 gave
  # this job, plus its one retried step, 300 + 3 x 300 = 1200 s. 300 + 1200 = 1500 s -> 26 min,
  # the whole minute above a sum that is itself a whole number of minutes.
  dispatch-builds-superseded:
    needs: dispatch-builds
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        build: [previous, first-rollout]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 26
    env:
      JOB_TIMEOUT_MINUTES: 26 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    permissions:
      actions: write
    steps:
      # For the helpers of .github/scripts the step sources, alone: this repository is public, so
      # the checkout needs no scope beyond the one the deletes need.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.dispatch-builds.outputs[matrix.build] != ''
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Delete this Dispatch build's entries older than main's, and every other ref's
        if: needs.dispatch-builds.outputs[matrix.build] != ''
        # Its own retry arithmetic: the list and the three deletes a run makes at most,
        # 300 + 3 x 300 = 1200 s -> 21 min, the whole minute above a sum that is itself a whole
        # number of minutes.
        timeout-minutes: 21
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ needs.dispatch-builds.outputs[matrix.build] }}
          REF: ${{ github.ref }}
          STEP_TIMEOUT_MINUTES: 21 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        run: |
          set -euo pipefail
          # Each call is a ladder run through gh_wait_reset, which waits out a spent API budget
          # only when the wait and one more ladder fit within this step's limit and the job's,
          # and fails by name otherwise.
          . .github/scripts/ci-retry.sh
          source .github/scripts/gh-read.sh
          if ! [[ $KEEP =~ ^dispatch-(previous|first-rollout)-build-[A-Za-z0-9]+-[A-Za-z0-9]+-[0-9a-f]{64}-[0-9a-f]{40}$ ]]; then
            echo "::error::the kept key does not have the shape dispatch-builds gives it, so nothing is deleted" >&2
            exit 1
          fi
          # The build, OS and architecture: the key without its script hash and commit.
          prefix=${KEEP%-*}
          prefix=${prefix%-*}-
          # Every ref's entries, newest first by GitHub's creation order; gh pages past 100 up to
          # the limit, far above what one build holds.
          entries=$(gh_wait_reset retry_fetch "every ref's entries of $prefix" 30 -- \
            gh cache list --key "$prefix" --sort created_at --order desc --limit 1000 --json id,key,ref)
          if ! jq -e --arg keep "$KEEP" --arg ref "$REF" 'any(.[]; .key == $keep and .ref == $ref)' <<<"$entries" >/dev/null; then
            echo "::warning::main holds no entry under $KEEP, so none is deleted" >&2
            exit 0
          fi
          superseded=$(jq -r --arg keep "$KEEP" --arg ref "$REF" --arg prefix "$prefix" \
            '(map(.key == $keep and .ref == $ref) | index(true)) as $kept
             | to_entries[] | .key as $at | .value
             | select((.key | startswith($prefix)) and (.ref != $ref or $at > $kept)) | .id' <<<"$entries")
          ids=()
          [ -z "$superseded" ] || mapfile -t ids <<<"$superseded"
          # Three at most, newest first: the job's comment says why three.
          for slot in 1 2 3; do
            [ "$slot" -le "${#ids[@]}" ] || break
            id=${ids[$((slot - 1))]}
            if ! [[ $id =~ ^[0-9]+$ ]]; then
              echo "::error::the cache list gave an id that is not a number, so nothing more is deleted" >&2
              exit 1
            fi
            echo "Deleting entry $id of $prefix, which this repository keeps no more"
            gh_wait_reset retry_fetch "the deletion of entry $id of $prefix" 30 -- \
              gh cache delete "$id"
          done
          if [ "${#ids[@]}" -gt 3 ]; then
            echo "::warning::$((${#ids[@]} - 3)) more entries of $prefix this repository keeps no more stay for the next run to delete: a run deletes three at most" >&2
          fi

  # The elan home ci.yaml's airlock-lean job restores, the Lean toolchain that job's `lake build`
  # needs. No setup-go and no Go family: the key is the runner's architecture, since elan and the
  # toolchain are binaries of it, and the content of the lean-toolchain the model names, since
  # that file is what decides which toolchain elan installs, so the entry is refreshed when the
  # model moves to another Lean and at no other time. install-elan puts elan under
  # $RUNNER_TEMP/elan and the toolchain step below downloads the named toolchain into it on a
  # miss, which is the whole of what is saved. It runs on ubuntu-24.04-arm, the runner
  # airlock-lean runs on.
  elan:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04-arm
    # why: .github/ci-notes/ci-caches.md#the-elan-jobs-budget
    # 1800 + 1708 = 3508 s -> 59 min.
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: elan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/internal/cipher/proxyrules/lean/lean-toolchain') }}
          lookup-only: true

      # install-elan's own retry arithmetic: one `ci_tools_fetch` of the release tarball,
      # 1708 s (the Budgets note of .github/ci-budgets.md) -> 29 min.
      - if: steps.elan-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-elan
        timeout-minutes: 29

      # The toolchain lean-toolchain names, retried as airlock-lean's step of the same name is and
      # at its bound (.github/ci-notes/ci-job-airlock-lean.md#the-lean-toolchain-step-and-its-bound).
      - name: Install the Lean toolchain lean-toolchain names
        if: steps.elan-cache.outputs.cache-hit != 'true'
        # why: .github/ci-notes/ci-caches.md#the-elan-jobs-budget
        # 5 x 120 + 150 = 750 s -> 13 min.
        timeout-minutes: 13
        run: |
          . .github/scripts/ci-retry.sh
          toolchain=$(cat packages/envoy/internal/cipher/proxyrules/lean/lean-toolchain)
          retry_fetch "the Lean toolchain $toolchain" 120 -- elan toolchain install "$toolchain" >&2

      # What airlock-lean builds, after the toolchain step, as airlock-lean builds it: the build
      # reads the toolchain from $RUNNER_TEMP/elan and downloads nothing, so the entry holds the
      # toolchain airlock-lean's build will find there.
      - name: Build what airlock-lean builds
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: lake build
        working-directory: packages/envoy/internal/cipher/proxyrules/lean

      # Under the key the lookup computed, as every hashed key of this workflow is saved.
      - if: steps.elan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/elan
          key: ${{ steps.elan-cache.outputs.cache-primary-key }}

  # The bun family, ~/.bun/bin, which .github/actions/setup-bun restores in every job that calls
  # it, keyed on the runner's OS and architecture, the build variant and the version .bun-version
  # pins. This is the family's one saving job: the action saves only where its caller passes
  # `save: 'true'` and the run is a push to main, and no other caller passes it, as each Go family
  # above has one saving job. THE KEY NAMES THE RUNNER'S ARCHITECTURE, SO EACH ARCHITECTURE NEEDS
  # AN ENTRY AND A SAVING JOB OF ITS OWN: a Bun binary runs on one architecture, and an entry an
  # x64 leg saved is one no arm64 job restores. So one leg per runner the action's callers run on,
  # ubuntu-24.04 (x64) and ubuntu-24.04-arm (arm64). The action's own restore is the lookup: a
  # leg whose key is there restores the entry, finds the pinned Bun in it and saves nothing, so a
  # run that finds both keys costs a checkout and a restore on each leg.
  bun:
    if: inputs.only != 'dispatch-builds'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # why: .github/ci-notes/ci-caches.md#the-bun-jobs-budget
    # 600 + 3416 = 4016 s -> 67 min.
    timeout-minutes: 67
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fill the bun family for this runner's architecture
        uses: ./.github/actions/setup-bun
        # why: .github/ci-notes/ci-caches.md#the-bun-jobs-budget
        # 2 x 1708 = 3416 s -> 57 min.
        timeout-minutes: 57
        with:
          save: 'true'
