name: CI caches

# Fills the Actions caches ci.yaml's jobs restore, so a pull request or a merge group finds
# them warm. ci.yaml runs on a pull request, a merge group and a dispatch, and no longer on a push
# to main: the queue tests every change on the tree it lands as, so a run on main would only test
# that tree again (ci.yaml's header says it). No step of that workflow saves a cache entry any
# more, and the actions it calls save only in a dispatched run, so the families it restores need
# a filler of their own, and this workflow is it.
#
# Why the filler runs on a push: a run reads the cache scope of its own branch and that of the
# default branch, and only an event that writes the default branch's scope - a push to main among
# them - leaves an entry every later run can read. A save made in a merge group or on a pull
# request lands in that run's own scope, which the next pull request's run cannot read, so it
# would reach nobody.
#
# Five Go families, each one a restore step of ci.yaml's run names, keyed on the runner's
# architecture and on the Go version the family's own module installs (go-envoy and
# go-envoy-infra on the hash of their module files and of the tool pins their fills install too,
# for the reason each job gives):
# go-notices (lint's notices step), go-daemon (typecheck, daemon-go, plugin-pack and pi-legion),
# go-envoy (envoy-go-checks, envoy-go-race-docs, envoy-go-docs-finalizers, listener-server-change,
# envoy-e2e-local and envoy-session-stall, and the embedder job of
# .github/workflows/dispatch-browser.yaml), go-envoy-test (envoy-go, and the binaries,
# multiprocess and visual jobs of .github/workflows/dispatch-browser.yaml, which ci.yaml's
# dispatch-browser job calls: those three build the Dispatch server and the real broker's
# commands, whose packages the go-envoy entry's build of the listener and natsd alone does not
# hold) and go-envoy-infra (envoy-infra-go, envoy-smoke, and the build job of
# release-envoy-infra.yaml).
# The key carries `runner.arch` because Go's build cache holds the objects of the architecture
# that compiled them: an entry an x86_64 runner filled gives an arm64 job its modules and none of
# its objects. So each family is filled on every architecture one of its readers runs on, one
# matrix leg per runner: go-notices on ubuntu-24.04-arm alone, where lint runs, and go-daemon,
# go-envoy, go-envoy-test and go-envoy-infra on ubuntu-24.04-arm and on ubuntu-24.04 both, since
# each has a reader on each (typecheck and the envoy lanes on the first; daemon-go, plugin-pack,
# pi-legion, envoy-go-checks, envoy-smoke, the browser lane and the release builds on the second).
# A leg builds what that runner's readers build and no more: go-daemon's arm64 reader is
# typecheck alone, so its arm64 leg runs typecheck's vet and leaves the test and race builds to
# the x86_64 leg. One
# Go setup per leg, since the key carries the version that module's go.mod names: the daemon's
# go.mod for go-daemon and for go-notices, which lint installs the daemon's Go for; the envoy
# module's for go-envoy and go-envoy-test; the infra module's for go-envoy-infra. Each family is
# first looked up (`lookup-only`, and no `restore-keys`: the question is whether that exact key
# exists, and the answer downloads nothing), and only a miss runs the build the ci.yaml job runs
# and saves what it left in the module cache and the build cache. A family whose key is already
# there builds nothing, so a run that finds every key costs a checkout and a setup-go. Where a
# job fills two families it fills the smaller one first, so the entry that carries the other's
# objects too is the one that was large already. A leg of a matrix that fails leaves the other
# running (`fail-fast: false`): a cancelled leg saves nothing, and one architecture's fill has no
# reason to cost the other's.
#
# Beside those five, the architecture-check job fills
# architecture-check-<os>-<arch>-go<version>-<hash>, the family of the composite action
# .github/actions/architecture-check, and the spec-check job fills
# spec-check-<os>-<arch>-go<version>-<hash>, the family of .github/actions/spec-check; ci.yaml's
# envoy-go-checks runs both actions. Neither is a lookup step of this workflow: each action
# restores and saves its entry itself, keyed on the runner's architecture, on the Go version its
# own setup-go installs from packages/envoy/go.mod and on the SHA-256 of packages/envoy/go.sum,
# so both jobs run on ubuntu-24.04, the runner envoy-go-checks runs on.
# On a miss it restores the newest entry of that Go version (restore-keys, which this workflow's
# own lookups do not use). It saves only on a miss of the exact key in a push, schedule or
# workflow_dispatch run: a run of any other event (pull_request, pull_request_target,
# merge_group, issue_comment, workflow_run and the rest) may hold another person's code, so it
# restores the entry and never saves it. This workflow's push to main is where the entry lands in
# the scope every later run reads. check-ci-filters.sh's cache-family rule reads this workflow's
# own actions/cache steps and not a composite action's, so it holds nothing of these two families;
# ci.yaml's "Caches" paragraph is the record of their restores and saves.
#
# One entry here is no Go family: the elan home the airlock-lean job restores, whose key is the
# content of the Lean toolchain the model names rather than a Go version. Two others that were
# no Go family went with the jobs that read them - the Playwright browsers and the .deb files of
# the apt list the browser suite installed - because dispatch-browser.yaml's shard and alone
# jobs run in the image this repository builds, which carries the browsers and their host
# packages, so neither entry has a restore left to serve (dispatch://INFRA-1443). A save whose
# restore is gone is what check-ci-filters.sh refuses, so the two jobs that wrote them are gone
# with them.
#
# go-docs is not here: docs-pages.yaml saves it on this same push, from the build job it shares
# with ci.yaml's docs job. The Bun cache is not here either: .github/actions/setup-bun reads and
# writes it on main, and five workflows that run there call it.

# A push to main is what writes the default branch's cache scope; workflow_dispatch fills a family
# by hand, after a Go bump, a move of the Lean toolchain or an eviction. No `paths:`: a key holds
# a Go version, that toolchain file's hash, the hash of packages/envoy/go.sum or, for go-envoy and
# go-envoy-infra, the hash of their workspace's module files, not a file list, so what the push
# touched decides nothing, and a run whose keys are all there is seconds.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One fill at a time per ref, and no cancellation: a cancelled run saves nothing, so cutting the
# running fill short would leave the caches empty and make the next push pay for them again. The
# default queue holds the newer run until this one ends, and a push after it replaces the one
# waiting, since both would fill the same keys.
concurrency:
  group: ci-caches-${{ github.ref }}
  cancel-in-progress: false

# Reading the tree and the caches is all this workflow does but in one job: the cache scope needs no
# token scope of its own, and nothing here reports a check or writes an artifact. The superseded
# job alone takes `actions: write`, to delete the go-envoy and go-envoy-infra entries a fill
# replaced, and builds nothing.
permissions:
  contents: read

# The proxy fall-through ci.yaml's env block explains: with `|`, a go command that hits ANY error
# from proxy.golang.org - a reset mid-stream among them - fetches the same bytes from the source
# and checks them against go.sum.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # go-daemon. It keys on packages/daemon/go.mod's Go: ci.yaml's typecheck, daemon-go, plugin-pack
  # and pi-legion set Go up from it. One leg per runner, because typecheck runs on
  # ubuntu-24.04-arm and the other three on ubuntu-24.04, and the key carries the runner's
  # architecture. Each leg builds what its runner's readers build: typecheck's vet on both, and
  # the test and race builds on the x86_64 leg alone, since no job that reads the arm64 entry
  # runs them.
  daemon:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # The limit this job carried while it filled go-notices too, whose build is the long one; no
    # leg of the daemon build alone has been measured near it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      - id: go-daemon
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          lookup-only: true

      # What typecheck builds: the vet behind the e2e tag. It is the one build of this family an
      # arm64 job makes (.github/workflows/ci-job-typecheck.yaml), so both legs run it.
      # typecheck's darwin vet is the one build left out: its darwin objects, about 1.65 GB of build
      # cache on a devbox, would ride in an entry every job that restores go-daemon downloads, and
      # the step builds them in about two minutes (run 43990864191).
      - name: Build what typecheck builds of the daemon module
        if: steps.go-daemon.outputs.cache-hit != 'true'
        run: go vet -tags e2e ./...
        working-directory: packages/daemon

      # What daemon-go builds: the test binary of every package, and the race build of the three
      # packages daemon-go runs under the detector, whose
      # objects are cache entries of their own. Those three are the list
      # .github/scripts/ci_job_reads.py's DAEMON_RACE_PACKAGES holds, which check-ci-filters.sh
      # holds ci.yaml's two steps to, so a package that joins or leaves the detector there is the
      # side this command follows. The test binaries are compiled and never run (`go test -c -o
      # /dev/null` links each one and writes nothing): running them would want tmux, jj, Oh My Pi,
      # uv, container images and a Postgres service, and the build cache this entry holds is what
      # a compile leaves. The x86_64 leg alone: daemon-go, plugin-pack and pi-legion, which read
      # these objects, run on ubuntu-24.04. Last, the modules daemon-go's fetch step fetches for
      # the envoy commands its tests build (testbuild.EnvoyBinary), so an entry this fill saves
      # holds them and that step finds them there.
      - name: Build what daemon-go builds of the daemon module
        if: steps.go-daemon.outputs.cache-hit != 'true' && runner.arch == 'X64'
        run: |
          go test -c -o /dev/null ./...
          go test -c -o /dev/null -race ./internal/daemon/ ./internal/sessionproxy/ ./internal/launcher/
          ../../.github/scripts/go-fetch.sh deps ../envoy ./cmd/dispatch ./cmd/listener
        working-directory: packages/daemon

      - if: steps.go-daemon.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}

  # go-notices, in a job of its own on ubuntu-24.04-arm, the runner of lint, whose notices step the
  # family belongs to. It keys on packages/daemon/go.mod's Go, which lint installs, though that
  # step also builds the envoy and infra modules' commands.
  notices:
    runs-on: ubuntu-24.04-arm
    # The notices build is the long one: it writes the notices of, and cross-compiles, every
    # release target of three modules on a cold module cache.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      - id: go-notices
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          lookup-only: true

      # The very script lint's notices step runs, .github/scripts/go-release-notices.sh: the
      # same loops over .github/go-release-targets.json, .github/agent-secrets-client-targets.json
      # and .github/envoy-infra-targets.json, with the same GOOS, GOARCH and CGO_ENABLED per
      # target, so the modules it downloads, the go-licenses it builds under ~/.cache/legion and
      # the objects it leaves are the ones lint restores. One script and not a copy of those
      # loops, because a copy stops warming a target the day lint gains one, and nothing fails:
      # lint just builds those objects cold on every run.
      - name: Write every Go release archive's third-party notices and cross-build the commands
        if: steps.go-notices.outputs.cache-hit != 'true'
        run: .github/scripts/go-release-notices.sh "$RUNNER_TEMP/notices"

      - if: steps.go-notices.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}

  # go-envoy and go-envoy-test. Both key on packages/envoy/go.mod's Go, the module every job that
  # restores them sets Go up from, so one setup serves the two; their lookups and their builds are
  # independent, and each build is gated on its own lookup. One leg per runner: the envoy lanes
  # that restore them run on ubuntu-24.04-arm, and the browser lane's jobs that restore them on
  # ubuntu-24.04.
  envoy:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Compiling the test binary of every package of the envoy module on a cold module cache is
    # the long step; the listener and natsd are minutes.
    timeout-minutes: 60
    outputs:
      # The go-envoy key each leg looked up, and whether it filled it, by the leg's architecture,
      # as the envoy-infra job below names its own and for the reason it gives: the superseded job
      # deletes the go-envoy entries each fill replaced.
      key-x64: ${{ steps.leg.outputs.key-x64 }}
      filled-x64: ${{ steps.leg.outputs.filled-x64 }}
      key-arm64: ${{ steps.leg.outputs.key-arm64 }}
      filled-arm64: ${{ steps.leg.outputs.filled-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false

      # go-envoy's key carries the hash of the module files the builds of its readers read, as
      # go-envoy-infra's does: a build in packages/envoy runs in the root workspace, so those are
      # go.work, go.work.sum and the go.mod and go.sum of both modules it binds. Keyed on the Go
      # version alone, an entry went stale as those files moved, and every reader then fetched
      # what moved; with the hash, a push to main that changes them misses the lookup and fills a
      # fresh entry, and a pull request that changes them restores the newest by prefix. It
      # carries the hash of loadtest/cluster/tools.txt too, the helm pin the fill below installs,
      # as go-envoy-infra's carries gcp's live-tools.txt: a helm bump alone then fills an entry
      # that holds the new helm, where an entry keyed without the pin would be found and skip the
      # fill, and envoy-go-checks' fetch step would download the new helm's modules on every run.
      - id: go-envoy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', 'packages/envoy/loadtest/cluster/tools.txt') }}
          lookup-only: true

      # The lookup's key and whether this leg fills it, as the job's outputs name them: RUNNER_ARCH
      # is X64 or ARM64, lowercased here.
      - name: Name this leg's key by its architecture
        id: leg
        env:
          KEY: ${{ steps.go-envoy.outputs.cache-primary-key }}
          FILLED: ${{ steps.go-envoy.outputs.cache-hit != 'true' }}
        run: |
          arch=${RUNNER_ARCH,,}
          echo "key-$arch=$KEY" >>"$GITHUB_OUTPUT"
          echo "filled-$arch=$FILLED" >>"$GITHUB_OUTPUT"

      # The two binaries envoy-e2e-local's scripts/e2e-local.sh and envoy-session-stall's
      # test/envoy-stack.ts build, and whose packages listener-server-change compiles too: the
      # listener and the in-process NATS server's natsd. An -o ending in a separator names a
      # directory, as envoy-stack.ts's build does, so both main packages build in one command.
      # envoy-go-checks' darwin vet is left out: its darwin objects, about 1.6 GB of build cache on
      # a devbox, would ride in an entry every job that restores go-envoy downloads, and the step
      # builds them in under three minutes (run 43990864191). Then the modules of every other
      # command a reader's tests build, which those builds read with GOPROXY=off and the readers'
      # fetch steps fetch before the tests: the Dispatch server (envoy-session-stall's
      # test/dispatch-stack.ts, and the embedder job of dispatch-browser.yaml) and the real
      # broker's three commands (that job's harness, e2e/run-broker.sh). Then the modules of the
      # listener clients envoy-go-checks' wire test lists with GOPROXY=off (listenerwire's
      # clients_test.go: four envoy packages and ./loadtest, and two of packages/daemon), which that
      # job's fetch step fetches before the test, so a filled entry leaves it nothing to download.
      # Last, the helm loadtest/cluster/tools.txt pins, which envoy-go-checks' fetch step installs
      # before cluster.test.sh renders with it under GOPROXY=off: installed here, its modules and
      # its compiled packages are in the entry, so that step finds them there rather than
      # downloading helm's modules on every run.
      - name: Build the listener and natsd, and fetch the modules of the other commands the readers build
        if: steps.go-envoy.outputs.cache-hit != 'true'
        run: |
          go build -o "$RUNNER_TEMP/envoy-bin/" ./cmd/listener ./internal/testnats/cmd/natsd
          ../../.github/scripts/go-fetch.sh deps . ./cmd/listener ./internal/testnats/cmd/natsd ./cmd/dispatch ./cmd/broker ./cmd/dev-oidc-issuer ./internal/broker/brokertest/requestseed
          ../../.github/scripts/go-fetch.sh deps . ./internal/broker/wake ./internal/dispatch/envoy ./loadtest/listenerclient ./internal/testnats/cmd/refillrig ./loadtest
          ../../.github/scripts/go-fetch.sh deps ../daemon ./internal/notify ./internal/controller
          ../../.github/scripts/go-fetch.sh tools loadtest/cluster/tools.txt
        working-directory: packages/envoy

      - if: steps.go-envoy.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', 'packages/envoy/loadtest/cluster/tools.txt') }}

      - id: go-envoy-test
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          lookup-only: true

      # envoy-go's set: the test binary of every package of the envoy module, the integration
      # package's and the natslive build of internal/testnats among them. `go test -c` links each
      # package's test binary and `-o /dev/null` writes none of them, so every object the restored
      # build cache holds is made and no test runs: envoy-go's tests want the job's Postgres
      # service and container images, which a cache fill has no reason to start.
      - name: Build the test binary of every package of the envoy module
        if: steps.go-envoy-test.outputs.cache-hit != 'true'
        run: |
          go test -c -o /dev/null ./...
          go test -c -o /dev/null -tags natslive ./internal/testnats/
        working-directory: packages/envoy

      - if: steps.go-envoy-test.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}

  # architecture-check-<os>-<arch>-go<version>-<hash>, the family of the composite action
  # .github/actions/architecture-check, run as ci.yaml's envoy-go-checks runs it. The action sets
  # its own Go up, from packages/envoy/go.mod, and restores and saves the entry itself. It saves
  # only in a push, schedule or workflow_dispatch run, so on a push to main it fills the entry in
  # main's scope, where every pull request and merge group of this repository finds it: on a hit
  # it restores the entry and compiles only the command's own packages that changed since the entry
  # was saved; on a miss, as after a go.sum change, it builds the command from the newest entry of
  # that Go version, or cold when there is none, and saves the entry. It also checks main's notes;
  # the action saves before it checks, so a refused set does not cost the entry. A job of its own
  # is one of the two placements the action's README.md gives ("The Go toolchain"). The other, in
  # the envoy job, would run the action first, before that job's setup-go, and a refused note set
  # on main would then stop the go-envoy fills, so it is a job of its own.
  architecture-check:
    runs-on: ubuntu-24.04
    # The action takes seconds: 13 s with its own Go download and a cache miss, in ci.yaml's
    # envoy-go-checks of run 43553309875.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fill the architecture-check action's cache and check main's notes
        uses: ./.github/actions/architecture-check

  # spec-check-<os>-<arch>-go<version>-<hash>, the family of the composite action
  # .github/actions/spec-check, run as ci.yaml's envoy-go-checks runs it, with allow-empty while
  # main holds no spec file. It fills the entry as the architecture-check job above fills its own.
  # It is a job of its own, so a refused note set on main cannot stop this fill and a refused spec
  # tree on main cannot stop the note check.
  spec-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fill the spec-check action's cache and check main's spec files
        uses: ./.github/actions/spec-check
        with:
          allow-empty: 'true'

  # go-envoy-infra. The infra module is not in the root go.work - its own go.work binds it and
  # packages/envoy - so it keys on packages/envoy/infra/go.mod's Go and builds in a job of its own,
  # as ci.yaml's envoy-infra-go does. Unlike the other families, its key also carries the hash of
  # the files that choose the module versions it builds: that go.work and its go.work.sum, the
  # go.mod and go.sum of both modules it binds, and gcp's live tests' tool pins
  # (gcp/testdata/live-tools.txt), which the fill installs. An entry keyed on the Go version alone
  # was refreshed only by a Go bump and went stale as those files moved: restoring the entry of
  # 2026-11-06, eleven days old, envoy-infra-go's linux vet took 175, 229 and 177 s in runs
  # 43990864191, 43996496498 and 44008055050, 83 to 85% of what its darwin vet took in the same run
  # with nothing cached, because google.golang.org/api, gax-go, the AWS SDK and nats had moved
  # under it. With the hash, a push to main that changes those files misses the lookup and fills a
  # fresh entry; a pull request
  # that changes none of them restores one built from the same module versions, and one that
  # changes them restores the newest entry by prefix and builds what moved. One leg per runner:
  # envoy-infra-go runs on ubuntu-24.04-arm, and release-envoy-infra.yaml's build, which restores
  # the family too, on ubuntu-24.04. The superseded job below deletes the entry each leg's fill
  # replaced.
  envoy-infra:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    outputs:
      # The key each leg looked up, and whether it filled it, under names of that leg's
      # architecture: a matrix job's outputs are combined from its legs, and an output both legs
      # set holds the value of whichever leg ended last. The superseded job keeps each filled key,
      # deletes the entries it supersedes (this ref's go-envoy-infra entries of the same runner and
      # Go with an older module-file hash), and runs only after a fill.
      key-x64: ${{ steps.leg.outputs.key-x64 }}
      filled-x64: ${{ steps.leg.outputs.filled-x64 }}
      key-arm64: ${{ steps.leg.outputs.key-arm64 }}
      filled-arm64: ${{ steps.leg.outputs.filled-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/infra/go.mod
          cache: false

      - id: go-envoy-infra
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/envoy/infra/gcp/testdata/live-tools.txt') }}
          lookup-only: true

      # The lookup's key and whether this leg fills it, as the job's outputs name them: RUNNER_ARCH
      # is X64 or ARM64, lowercased here.
      - name: Name this leg's key by its architecture
        id: leg
        env:
          KEY: ${{ steps.go-envoy-infra.outputs.cache-primary-key }}
          FILLED: ${{ steps.go-envoy-infra.outputs.cache-hit != 'true' }}
        run: |
          arch=${RUNNER_ARCH,,}
          echo "key-$arch=$KEY" >>"$GITHUB_OUTPUT"
          echo "filled-$arch=$FILLED" >>"$GITHUB_OUTPUT"

      # What envoy-infra-go builds: the vet with both live-test tags, for linux and for darwin, the
      # test binary of every package, the natslive binaries of the three packages its live step
      # runs, and what its fetch step fetches before the tests: gcp's live tools, installed, and
      # the modules of the envoy commands its tests build. Compiled, not run: the live tests need
      # nats-server, Postgres and container images, and the unit tests nothing a build cache
      # keeps. The darwin vet is in the fill because, built cold, it is the step that brought
      # envoy-infra-go near its time limit.
      - name: Build what envoy-infra-go builds
        if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        run: |
          flags=$(python3 ../../../.github/scripts/go_build_tags.py . darwin arm64)
          go vet -tags pulumilive,natslive ./...
          while IFS= read -r flag; do
            GOOS=darwin GOARCH=arm64 go vet "$flag" ./...
          done <<< "$flags"
          go test -c -o /dev/null ./...
          go test -c -o /dev/null -tags natslive ./core/ ./seed/ ./gcp/
          ../../../.github/scripts/go-fetch.sh tools gcp/testdata/live-tools.txt
          ../../../.github/scripts/go-fetch.sh deps .. ./cmd/listener ./cmd/dispatch
        working-directory: packages/envoy/infra

      - if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/envoy/infra/gcp/testdata/live-tools.txt') }}

  # The go-envoy and go-envoy-infra entries the fills above superseded, deleted once each has saved
  # the new one. A module-file change gives each family a new key, and the entry under the old key,
  # about 1.4 GB for go-envoy-infra, is then read by no run of this ref: left alone it would hold
  # its space until GitHub drops it after seven days unread, and over the repository's cache limit
  # GitHub evicts the least recently used entries, which can be another family's live one. An entry
  # the new one supersedes is one of this ref whose key is the new key but for its 64-hex
  # module-file hash: the same family, runner and Go, with older module files, the hashless key of
  # the fill before this one included. An entry of another runner, another Go or another family is
  # no such entry and stays: go-envoy-test's key and go-envoy-infra's differ from go-envoy's before
  # any hash, so a deletion of go-envoy entries reaches neither, and a fill that runs once per
  # architecture deletes nothing the other leg saved. None is deleted unless the new key is among
  # this ref's entries, so a save that did not land leaves the old entry in place. A job of its
  # own, so the token that may delete caches is in no job that builds code. A cache key is text any
  # build that saves on this ref chose, so the step never splits or prints one raw: the list stays
  # JSON, jq selects the numeric ids of the superseded entries, and each id is checked to be a
  # number before `gh cache delete` gets it. A key holding a newline then cannot add a line of its
  # own, such as `--all`, to that list. One leg per family and architecture of the fills, each
  # keeping the key that leg of that fill saved, under the output names its fill job gives it; a
  # leg whose fill filled nothing skips its step. Every leg runs on ubuntu-24.04-arm: gh and jq
  # need nothing of an x64 machine.
  superseded:
    needs: [envoy, envoy-infra]
    # !cancelled(), not the default success(): a failed leg of one fill must not keep the other
    # fill's superseded entries. Each step below runs only for a leg that filled, and a leg whose
    # save did not land leaves a key that is not among this ref's entries, so it deletes nothing.
    if: >-
      !cancelled() && (needs.envoy.outputs.filled-x64 == 'true' || needs.envoy.outputs.filled-arm64 == 'true'
      || needs.envoy-infra.outputs.filled-x64 == 'true' || needs.envoy-infra.outputs.filled-arm64 == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fill: envoy, family: go-envoy, arch: x64 }
          - { fill: envoy, family: go-envoy, arch: arm64 }
          - { fill: envoy-infra, family: go-envoy-infra, arch: x64 }
          - { fill: envoy-infra, family: go-envoy-infra, arch: arm64 }
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete this ref's entries of the family the new one supersedes
        if: needs[matrix.fill].outputs[format('filled-{0}', matrix.arch)] == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAMILY: ${{ matrix.family }}
          KEEP: ${{ needs[matrix.fill].outputs[format('key-{0}', matrix.arch)] }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          entries=$(gh cache list --ref "$REF" --key "$FAMILY-" --limit 100 --json id,key,ref)
          if ! jq -e --arg keep "$KEEP" --arg ref "$REF" 'any(.[]; .key == $keep and .ref == $ref)' <<<"$entries" >/dev/null; then
            echo "::warning::the new $FAMILY entry is not among this ref's entries, so none is deleted"
            exit 0
          fi
          jq -r --arg keep "$KEEP" --arg ref "$REF" --arg family "$FAMILY" \
            'def base: gsub("-[0-9a-f]{64}"; "");
             .[] | select(.ref == $ref and (.key | startswith($family + "-")) and .key != $keep
                          and (.key | base) == ($keep | base)) | .id' <<<"$entries" |
            while read -r id; do
              if ! [[ $id =~ ^[0-9]+$ ]]; then
                echo "::error::the cache list gave an id that is not a number, so nothing more is deleted"
                exit 1
              fi
              echo "Deleting $FAMILY entry $id, which the new entry supersedes"
              gh cache delete "$id"
            done

  # The elan home ci.yaml's airlock-lean job restores, the Lean toolchain that job's `lake build`
  # needs. No setup-go and no Go family: the key is the runner's architecture, since elan and the
  # toolchain are binaries of it, and the content of the lean-toolchain the model names, since
  # that file is what decides which toolchain elan installs, so the entry is refreshed when the
  # model moves to another Lean and at no other time. install-elan puts elan under
  # $RUNNER_TEMP/elan and `lake build` downloads the named toolchain into it on a miss, which is
  # the whole of what is saved. It runs on ubuntu-24.04-arm, the runner airlock-lean runs on.
  elan:
    runs-on: ubuntu-24.04-arm
    # One toolchain download and one build of the model on a miss; a run that finds the key
    # costs the checkout alone.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: elan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/internal/broker/airlock/lean/lean-toolchain') }}
          lookup-only: true

      - if: steps.elan-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-elan

      # The build is what downloads the toolchain lean-toolchain names, so the entry holds what
      # airlock-lean will find rather than elan alone.
      - name: Build what airlock-lean builds
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: lake build
        working-directory: packages/envoy/internal/broker/airlock/lean

      - if: steps.elan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/internal/broker/airlock/lean/lean-toolchain') }}
