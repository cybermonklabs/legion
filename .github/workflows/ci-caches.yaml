name: CI caches

# Fills the Actions caches ci.yaml's jobs restore, so a pull request or a merge group finds
# them warm. ci.yaml runs on a pull request, a merge group and a dispatch, and no longer on a push
# to main: the queue tests every change on the tree it lands as, so a run on main would only test
# that tree again (.github/ci-notes/ci.md#why-the-router-runs-on-these-events-and-no-others says
# it). No step of that workflow saves a cache entry any
# more, and the actions it calls save only in a dispatched run, so the families it restores need
# a filler of their own, and this workflow is it.
#
# Why the filler runs on a push: a run reads the cache scope of its own branch and that of the
# default branch, and only an event that writes the default branch's scope - a push to main among
# them - leaves an entry every later run can read. A save made in a merge group or on a pull
# request lands in that run's own scope, which the next pull request's run cannot read, so it
# would reach nobody.
#
# Five Go families, each one a restore step of ci.yaml's run names, keyed on the runner's
# architecture and on the Go version the family's own module installs (go-envoy-infra on the hash
# of its module files too, for the reason its job gives): go-notices (lint's notices step),
# go-daemon (typecheck, daemon-go, plugin-pack and pi-legion), go-envoy (envoy-go-checks,
# envoy-go-race-docs, envoy-go-docs-finalizers, listener-server-change, envoy-e2e-local and
# envoy-session-stall, and the embedder job of .github/workflows/dispatch-browser.yaml),
# go-envoy-test (envoy-go, envoy-go-claim-model, which builds the API's test binary of that set,
# and the binaries, multiprocess and visual jobs of
# .github/workflows/dispatch-browser.yaml, which ci.yaml's dispatch-browser job calls: those three
# build the Dispatch server and the real broker's commands, whose packages the go-envoy entry's
# build of the listener and natsd alone does not hold) and go-envoy-infra (envoy-infra-go, and
# the build job of release-envoy-infra.yaml).
# The key carries `runner.arch` because Go's build cache holds the objects of the architecture
# that compiled them: an entry an x86_64 runner filled gives an arm64 job its modules and none of
# its objects. So each family is filled on every architecture one of its readers runs on, one
# matrix leg per runner: go-notices on ubuntu-24.04-arm alone, where lint runs, and go-daemon,
# go-envoy, go-envoy-test and go-envoy-infra on ubuntu-24.04-arm and on ubuntu-24.04 both, since
# each has a reader on each (typecheck and the envoy lanes but one on the first; daemon-go,
# plugin-pack, pi-legion, envoy-go-checks, envoy-go-claim-model, the browser lane and the release
# builds on the second). A leg builds
# what that runner's readers build and no more: go-daemon's arm64 reader is typecheck alone, so its
# arm64 leg runs typecheck's vet and leaves the test and race builds to the x86_64 leg.
# go-notices carries the architecture before the OS (go-notices-<arch>-<os>-go<version>) and the
# other four after it: the go-notices entry holds go-licenses, a program lint's notices step
# runs, and a run of a workflow file older than the architecture in the key restores by
# go-notices-<os>-, which an <os>-<arch> key starts with (ci-job-lint.yaml's restore step says what
# that did). One
# Go setup per leg, since the key carries the version that module's go.mod names: the daemon's
# go.mod for go-daemon and for go-notices, which lint installs the daemon's Go for; the envoy
# module's for go-envoy and go-envoy-test; the infra module's for go-envoy-infra. Each family is
# first looked up (`lookup-only`, and no `restore-keys`: the question is whether that exact key
# exists, and the answer downloads nothing), and only a miss runs the build the ci.yaml job runs
# and saves what it left in the module cache and the build cache. A family whose key is already
# there builds nothing, so a run that finds every key costs a checkout and a setup-go. Where a
# job fills two families it fills the smaller one first, so the entry that carries the other's
# objects too is the one that was large already. A leg of a matrix that fails leaves the other
# running (`fail-fast: false`): a cancelled leg saves nothing, and one architecture's fill has no
# reason to cost the other's.
#
# Beside those five, the architecture-check job fills
# architecture-check-<os>-<arch>-go<version>-<hash>, the family of the composite action
# .github/actions/architecture-check, and the spec-check job fills
# spec-check-<os>-<arch>-go<version>-<hash>, the family of .github/actions/spec-check; ci.yaml's
# envoy-go-checks runs both actions. Neither is a lookup step of this workflow: each action
# restores and saves its entry itself, keyed on the runner's architecture, on the Go version its
# own setup-go installs from packages/envoy/go.mod and on the SHA-256 of packages/envoy/go.sum,
# so both jobs run on ubuntu-24.04, the runner envoy-go-checks runs on.
# On a miss it restores the newest entry of that Go version (restore-keys, which this workflow's
# own lookups do not use). It saves only on a miss of the exact key in a push, schedule or
# workflow_dispatch run: a run of any other event (pull_request, pull_request_target,
# merge_group, issue_comment, workflow_run and the rest) may hold another person's code, so it
# restores the entry and never saves it. This workflow's push to main is where the entry lands in
# the scope every later run reads. check-ci-filters.sh's cache-family rule reads this workflow's
# own actions/cache steps and not a composite action's, so it holds nothing of these two families;
# the "Caches" paragraph of
# .github/ci-notes/ci.md#the-router-every-check-a-pull-request-or-the-merge-queue-runs is the
# record of their restores and saves.
#
# Four families here are no Go family. The elan home the airlock-lean job restores, whose key is
# the content of the Lean toolchain the model names rather than a Go version. The bun family,
# ~/.bun/bin, which .github/actions/setup-bun restores in every job that calls it and saves only
# where its caller passes `save: 'true'` on a push to main: the bun job below is the one caller
# that does, the family's one saving job as each Go family has one. The key names the runner's
# architecture, so each architecture needs an entry and a saving job of its own, and the bun job
# runs a leg on each runner the action's callers run on, ubuntu-24.04 and ubuntu-24.04-arm. And
# the two builds dispatch-two-builds runs the tree against, the previous release's and the
# first-rollout release's, which that job restores and this workflow's dispatch-builds job builds
# and saves. Two others that were no Go family went with the jobs that read them - the
# Playwright browsers and the .deb files of the apt list the browser suite installed - because
# dispatch-browser.yaml's shard and alone jobs run in the image this repository builds, which
# carries the browsers and their host packages, so neither entry has a restore left to serve
# (dispatch://INFRA-1443). A save whose restore is gone is what check-ci-filters.sh refuses, so
# the two jobs that wrote them are gone with them.
#
# go-docs is not here: docs-pages.yaml saves it on this same push, from the build job it shares
# with ci.yaml's docs job.

# A push to main is what writes the default branch's cache scope; workflow_dispatch fills a family
# by hand, after a Go bump, a move of the Lean toolchain or an eviction. No `paths:`: a key holds
# a Go version, that toolchain file's hash, the hash of packages/envoy/go.sum, the Bun version
# .bun-version pins, a release's commit beside the hash of the script that builds it or, for
# go-envoy-infra, the hash of the infra workspace's module files, not a file list, so what the
# push touched decides nothing, and a run whose keys are all there is seconds, but for the
# dispatch-builds job's checkout of the whole history, which its key needs.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One fill at a time per ref, and no cancellation: a cancelled run saves nothing, so cutting the
# running fill short would leave the caches empty and make the next push pay for them again. The
# default queue holds the newer run until this one ends, and a push after it replaces the one
# waiting, since both would fill the same keys.
concurrency:
  group: ci-caches-${{ github.ref }}
  cancel-in-progress: false

# Reading the tree and the caches is all this workflow does but in one job: the cache scope needs no
# token scope of its own, and nothing here reports a check or writes an artifact. The
# envoy-infra-superseded job alone takes `actions: write`, to delete the go-envoy-infra entries a
# fill replaced, and builds nothing.
permissions:
  contents: read

# The proxy fall-through each ci-job-*.yaml file's env block explains: with `|`, a go command
# that hits ANY error from proxy.golang.org - a reset mid-stream among them - fetches the same
# bytes from the source and checks them against go.sum.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # go-daemon. It keys on packages/daemon/go.mod's Go: ci.yaml's typecheck, daemon-go, plugin-pack
  # and pi-legion set Go up from it. One leg per runner, because typecheck runs on
  # ubuntu-24.04-arm and the other three on ubuntu-24.04, and the key carries the runner's
  # architecture. Each leg builds what its runner's readers build: typecheck's vet on both, and
  # the test and race builds on the x86_64 leg alone, since no job that reads the arm64 entry
  # runs them.
  daemon:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Budget (the Budgets note of .github/ci-budgets.md): 5400 s, the 90 minutes this job
    # carried while it filled go-notices too, whose build is the long one; no leg of the daemon
    # build alone has been measured near it. Plus its slowest retried step alone, which is now its
    # one: the daemon download, 5 x 180 + 150 = 1050 s. The notices download's two calls,
    # 2 x (5 x 180 + 150) = 2100 s, went to the notices job below with the build they feed
    # (main's #4308), and each leg of the matrix runs the same one download, so no leg adds a term.
    # 5400 + 1050 = 6450 s -> 108 min, which stands above that step's own 18 minutes. It was
    # 5400 + 2160 = 7560 s, 127 minutes, while this job held the notices download too.
    timeout-minutes: 108
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      - id: go-daemon
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          lookup-only: true

      # The modules the build below compiles, downloaded once and retried before it (the Retries
      # note of .github/ci-budgets.md; the retried unit is the download, never the
      # build and never the test). On that build's own condition, so a run that finds the key
      # downloads nothing. One call: the root go.work binds packages/daemon and packages/envoy,
      # and a download in either reads both modules' requirements.
      #
      # 180 s per attempt: the slowest cold `go mod download` measured is 113 s, for
      # packages/envoy/infra, against 81 s for packages/daemon and 77 s for packages/envoy, each
      # on an empty module cache on 2026-11-07, so the bound is 1.6 times the slowest of the
      # three. It can be that tight where a tarball fetch's could not: an attempt the bound kills
      # leaves what it fetched in the module cache for the next one to resume from. Every lookup
      # of this job is `lookup-only`, so no module cache is ever restored here and that cold
      # figure is what a miss pays.
      - name: Download the Go modules this job builds
        if: steps.go-daemon.outputs.cache-hit != 'true'
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/daemon's Go modules" 180 -- go -C packages/daemon mod download

      # What typecheck builds: the vet behind the e2e tag. It is the one build of this family an
      # arm64 job makes (.github/workflows/ci-job-typecheck.yaml), so both legs run it.
      # typecheck's darwin vet is the one build left out: its darwin objects, about 1.65 GB of build
      # cache on a devbox, would ride in an entry every job that restores go-daemon downloads, and
      # the step builds them in about two minutes (run 43990864191).
      - name: Build what typecheck builds of the daemon module
        if: steps.go-daemon.outputs.cache-hit != 'true'
        run: go vet -tags e2e ./...
        working-directory: packages/daemon

      # What daemon-go builds: the test binary of every package, and the race build of the five
      # packages daemon-go runs under the detector, whose
      # objects are cache entries of their own. Those five are the list
      # .github/scripts/ci_job_reads.py's DAEMON_RACE_PACKAGES holds, which check-ci-filters.sh
      # holds ci.yaml's two steps to, so a package that joins or leaves the detector there is the
      # side this command follows. The test binaries are compiled and never run (`go test -c -o
      # /dev/null` links each one and writes nothing): running them would want tmux, jj, Oh My Pi,
      # uv, container images and a Postgres service, and the build cache this entry holds is what
      # a compile leaves. The x86_64 leg alone: daemon-go, plugin-pack and pi-legion, which read
      # these objects, run on ubuntu-24.04.
      - name: Build what daemon-go builds of the daemon module
        if: steps.go-daemon.outputs.cache-hit != 'true' && runner.arch == 'X64'
        run: |
          go test -c -o /dev/null ./...
          go test -c -o /dev/null -race ./internal/daemon/ ./internal/sessionproxy/ ./internal/launcher/ ./internal/intake/ ./internal/shimwire/
        working-directory: packages/daemon

      - if: steps.go-daemon.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}

  # go-notices, in a job of its own on ubuntu-24.04-arm, the runner of lint, whose notices step the
  # family belongs to. It keys on packages/daemon/go.mod's Go, which lint installs, though that
  # step also builds the envoy and infra modules' commands, and on the runner's architecture
  # before the OS, as lint's restore does: the entry holds the go-licenses that step runs, and an
  # <os>-<arch> key would start with the go-notices-<os>- prefix of a run of a workflow file older
  # than the architecture in the key, which then restores this arm64 program on x86_64.
  notices:
    runs-on: ubuntu-24.04-arm
    # Budget (the Budgets note of .github/ci-budgets.md): 5400 s, the 90 minutes the daemon job
    # carried for this build while it filled this family, and this job carries since main's
    # #4308 gave the family a job of its own — the notices build is the long one: it writes the
    # notices of, and cross-compiles, every release target of three modules on a cold module
    # cache — plus its slowest retried step alone: the notices download's two calls,
    # 2 x (5 x 180 + 150) = 2100 s. That arithmetic is a whole number of minutes, so the step's own
    # budget takes one more and this job takes it too: 5400 + 2160 = 7560 s -> 127 min, the
    # whole minute above a sum that is itself a whole number of minutes.
    timeout-minutes: 127
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      - id: go-notices
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.arch }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          lookup-only: true

      # The modules the notices script loads and cross-builds for every release target,
      # downloaded once and retried before it (the Retries note of .github/ci-budgets.md;
      # the retried unit is the download, never the build). On the notices step's own
      # condition, so a run that finds that key downloads nothing. Two calls for the three module
      # directories the script builds in: in workspace mode `go mod download` with no arguments
      # downloads the pattern `all` of the whole workspace, so the first call, made in the root
      # go.work that binds packages/daemon and packages/envoy, brings down both modules'
      # requirements. packages/envoy/infra the root go.work does not bind — its own go.work binds
      # it and packages/envoy — so it takes the second call. packages/daemon is downloaded here
      # though the daemon job above downloads it too: the two jobs answer different keys on
      # runners of their own, so neither can lean on the other's module cache.
      #
      # 180 s per attempt, as above: 1.6 times the 113 s of the slowest cold run measured
      # (packages/envoy/infra; packages/daemon 81 s, packages/envoy 77 s, each on an empty module
      # cache on 2026-11-07), and an attempt the bound kills leaves what it fetched for the next
      # one.
      - name: Download the Go modules the notices script builds
        if: steps.go-notices.outputs.cache-hit != 'true'
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: two calls, 2 x (5 x 180 + 150) = 2100 s. That is a whole
        # number of minutes, so the budget is the next one strictly above it -> 36 min.
        timeout-minutes: 36
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/daemon's Go modules" 180 -- go -C packages/daemon mod download
          retry_fetch "packages/envoy/infra's Go modules" 180 -- go -C packages/envoy/infra mod download

      # The very script lint's notices step runs, .github/scripts/go-release-notices.sh: the
      # same loops over .github/go-release-targets.json, .github/agent-secrets-client-targets.json
      # and .github/envoy-infra-targets.json, with the same GOOS, GOARCH and CGO_ENABLED per
      # target, so the modules it downloads, the go-licenses it builds under ~/.cache/legion and
      # the objects it leaves are the ones lint restores. One script and not a copy of those
      # loops, because a copy stops warming a target the day lint gains one, and nothing fails:
      # lint just builds those objects cold on every run.
      - name: Write every Go release archive's third-party notices and cross-build the commands
        if: steps.go-notices.outputs.cache-hit != 'true'
        # why: .github/ci-notes/ci-caches.md#the-notices-step-whose-script-the-gate-does-not-read
        # 674 + 1050 = 1724 s -> 29 min.
        timeout-minutes: 29
        run: .github/scripts/go-release-notices.sh "$RUNNER_TEMP/notices"

      - if: steps.go-notices.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.arch }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}

  # go-envoy and go-envoy-test. Both key on packages/envoy/go.mod's Go, the module every job that
  # restores them sets Go up from, so one setup serves the two; their lookups and their builds are
  # independent, and each build is gated on its own lookup. One leg per runner: the envoy lanes
  # that restore them run on ubuntu-24.04-arm, and envoy-go-claim-model, whose deadlines were
  # measured on ubuntu-24.04, and the browser lane's jobs restore them on ubuntu-24.04.
  envoy:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Budget (the Budgets note of .github/ci-budgets.md): 3600 s, the 60 minutes
    # this job carried — compiling the test binary of every package of the envoy module on a
    # cold module cache is the long step, and the listener and natsd are minutes — plus its
    # slowest retried step alone: either Go module download below, 5 x 180 + 150 = 1050 s each.
    # 3600 + 1050 = 4650 s -> 78 min.
    timeout-minutes: 78
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false

      - id: go-envoy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          lookup-only: true

      # The module the build below compiles — both builds of this job compile it, and each has a
      # download of its own — retried before it (the Retries note of
      # .github/ci-budgets.md; the retried unit is the download, never the build).
      # On that build's own condition, so a run that finds the key downloads nothing.
      #
      # 180 s per attempt: 1.6 times the 113 s of the slowest cold `go mod download` measured
      # (packages/envoy/infra; packages/envoy 77 s, each on an empty module cache on 2026-11-07),
      # and an attempt the bound kills leaves what it fetched in the module cache for the next
      # one to resume from, which a tarball fetch cannot do. Every lookup of this job is
      # `lookup-only`, so no module cache is ever restored here and that cold figure is what a
      # miss pays.
      - name: Download the Go modules this job builds
        if: steps.go-envoy.outputs.cache-hit != 'true'
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download

      # The two binaries envoy-e2e-local's scripts/e2e-local.sh and envoy-session-stall's
      # test/envoy-stack.ts build, and whose packages listener-server-change compiles too: the
      # listener and the in-process NATS server's natsd. An -o ending in a separator names a
      # directory, as envoy-stack.ts's build does, so both main packages build in one command.
      # envoy-go-checks' darwin vet is left out: its darwin objects, about 1.6 GB of build cache on
      # a devbox, would ride in an entry every job that restores go-envoy downloads, and the step
      # builds them in under three minutes (run 43990864191).
      - name: Build the listener and natsd of the envoy module
        if: steps.go-envoy.outputs.cache-hit != 'true'
        run: go build -o "$RUNNER_TEMP/envoy-bin/" ./cmd/listener ./internal/testnats/cmd/natsd
        working-directory: packages/envoy

      - if: steps.go-envoy.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}

      - id: go-envoy-test
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          lookup-only: true

      # The same module again, and a step of its own because the two builds answer two keys: a
      # run whose go-envoy key was already there skips the download above and still compiles
      # here, so this build needs a retried download in front of it too (the Retries note of
      # .github/ci-budgets.md). Where both keys missed, the download above has
      # already filled the module cache and this call takes a second.
      #
      # 180 s per attempt, as above: 1.6 times the 113 s of the slowest cold run measured
      # (packages/envoy/infra; packages/envoy 77 s, each on an empty module cache on 2026-11-07).
      - name: Download the Go modules the test build compiles
        if: steps.go-envoy-test.outputs.cache-hit != 'true'
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download

      # envoy-go's set: the test binary of every package of the envoy module, the integration
      # package's and the natslive build of internal/testnats among them. `go test -c` links each
      # package's test binary and `-o /dev/null` writes none of them, so every object the restored
      # build cache holds is made and no test runs: envoy-go's tests want the job's Postgres
      # service and container images, which a cache fill has no reason to start.
      - name: Build the test binary of every package of the envoy module
        if: steps.go-envoy-test.outputs.cache-hit != 'true'
        run: |
          go test -c -o /dev/null ./...
          go test -c -o /dev/null -tags natslive ./internal/testnats/
        working-directory: packages/envoy

      - if: steps.go-envoy-test.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}

  # architecture-check-<os>-<arch>-go<version>-<hash>, the family of the composite action
  # .github/actions/architecture-check, run as ci.yaml's envoy-go-checks runs it. The action sets
  # its own Go up, from packages/envoy/go.mod, and restores and saves the entry itself. It saves
  # only in a push, schedule or workflow_dispatch run, so on a push to main it fills the entry in
  # main's scope, where every pull request and merge group of this repository finds it: on a hit
  # it restores the entry and compiles only the command's own packages that changed since the entry
  # was saved; on a miss, as after a go.sum change, it builds the command from the newest entry of
  # that Go version, or cold when there is none, and saves the entry. It also checks main's notes;
  # the action saves before it checks, so a refused set does not cost the entry. A job of its own
  # is one of the two placements the action's README.md gives ("The Go toolchain"). The other, in
  # the envoy job, would run the action first, before that job's setup-go, and a refused note set
  # on main would then stop the go-envoy fills, so it is a job of its own.
  architecture-check:
    runs-on: ubuntu-24.04
    # The action takes seconds: 13 s with its own Go download and a cache miss, in ci.yaml's
    # envoy-go-checks of run 43553309875, and this job 27 s and 26 s whole (runs 43586962074 and
    # 43592826052). Each was measured before the action's fetch was split out of its build; the
    # split fetch is `go list -deps` of the command, which fetches only the two modules that build
    # fetched itself, so each figure holds the same work. Budget (ci-budgets.md's Budgets note):
    # those 27 s measured, plus the action's one retried call, its Go modules at the module bound,
    # 5 x 180 + 150 = 1050 s, so
    # 27 + 1050 = 1077 s; the step's own budget below is 18 min, and this key strictly exceeds it
    # -> 19 min.
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Its own retry arithmetic, which is the action's: the Go modules at the module bound,
      # 5 x 180 + 150 = 1050 s, beside the 13 s the action measured on a cache miss (the job's
      # comment above says what that figure holds), 13 + 1050 = 1063 s -> 18 min.
      - name: Fill the architecture-check action's cache and check main's notes
        uses: ./.github/actions/architecture-check
        timeout-minutes: 18

  # spec-check-<os>-<arch>-go<version>-<hash>, the family of the composite action
  # .github/actions/spec-check, run as ci.yaml's envoy-go-checks runs it, with allow-empty while
  # main holds no spec file. It fills the entry as the architecture-check job above fills its own.
  # It is a job of its own, so a refused note set on main cannot stop this fill and a refused spec
  # tree on main cannot stop the note check.
  spec-check:
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 900 s, the 15 minutes this job was written with
    # (main's #4172; no run has measured it yet), plus the action's one retried call, its Go
    # modules at the module bound, 5 x 180 + 150 = 1050 s. 900 + 1050 = 1950 s -> 33 min.
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Its own retry arithmetic, which is the action's: the Go modules at the module bound,
      # 5 x 180 + 150 = 1050 s, beside the 47 s the fetch and the build took on empty caches in a
      # 2-CPU pod (.github/scripts/build-envoy-command.sh's header), 47 + 1050 = 1097 s -> 19 min.
      - name: Fill the spec-check action's cache and check main's spec files
        uses: ./.github/actions/spec-check
        timeout-minutes: 19
        with:
          allow-empty: 'true'

  # go-envoy-infra. The infra module is not in the root go.work - its own go.work binds it and
  # packages/envoy - so it keys on packages/envoy/infra/go.mod's Go and builds in a job of its own,
  # as ci.yaml's envoy-infra-go does. Unlike the other families, its key also carries the hash of
  # the files that choose the module versions it builds: that go.work and its go.work.sum, and the
  # go.mod and go.sum of both modules it binds. An entry keyed on the Go version alone was refreshed
  # only by a Go bump and went stale as those files moved: restoring the entry of 2026-11-06, eleven
  # days old, envoy-infra-go's linux vet took 175, 229 and 177 s in runs 43990864191, 43996496498
  # and 44008055050, 83 to 85% of what its darwin vet took in the same run with nothing cached,
  # because google.golang.org/api, gax-go, the AWS SDK and nats had moved under it. With the hash, a
  # push to main that changes those files misses the lookup and fills a fresh entry; a pull request
  # that changes none of them restores one built from the same module versions, and one that
  # changes them restores the newest entry by prefix and builds what moved. One leg per runner:
  # envoy-infra-go runs on ubuntu-24.04-arm, and release-envoy-infra.yaml's build, which restores
  # the family too, on ubuntu-24.04. The superseded job below deletes the entry each leg's fill
  # replaced.
  envoy-infra:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Budget (the Budgets note of .github/ci-budgets.md): 2700 s, the 45 minutes
    # this job carried, plus its slowest retried step alone — packages/envoy/infra's
    # `go mod download`, 5 x 180 + 150 = 1050 s. 2700 + 1050 = 3750 s -> 63 min.
    timeout-minutes: 63
    outputs:
      # The key each leg looked up, and whether it filled it, under names of that leg's
      # architecture: a matrix job's outputs are combined from its legs, and an output both legs
      # set holds the value of whichever leg ended last. The superseded job keeps each filled key,
      # deletes the entries it supersedes (this ref's go-envoy-infra entries of the same runner and
      # Go with an older module-file hash), and runs only after a fill.
      key-x64: ${{ steps.leg.outputs.key-x64 }}
      filled-x64: ${{ steps.leg.outputs.filled-x64 }}
      key-arm64: ${{ steps.leg.outputs.key-arm64 }}
      filled-arm64: ${{ steps.leg.outputs.filled-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/infra/go.mod
          cache: false

      - id: go-envoy-infra
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum') }}
          lookup-only: true

      # The lookup's key and whether this leg fills it, as the job's outputs name them: RUNNER_ARCH
      # is X64 or ARM64, lowercased here.
      - name: Name this leg's key by its architecture
        id: leg
        env:
          KEY: ${{ steps.go-envoy-infra.outputs.cache-primary-key }}
          FILLED: ${{ steps.go-envoy-infra.outputs.cache-hit != 'true' }}
        run: |
          arch=${RUNNER_ARCH,,}
          echo "key-$arch=$KEY" >>"$GITHUB_OUTPUT"
          echo "filled-$arch=$FILLED" >>"$GITHUB_OUTPUT"

      # The infra module's own workspace, downloaded once and retried before the vet and the
      # builds below (the Retries note of .github/ci-budgets.md; the retried unit is
      # the download, never the build). On that build's own condition, so a run that finds the
      # key downloads nothing. One call: packages/envoy/infra's go.work binds it and
      # packages/envoy, and a download in it reads both modules' requirements.
      #
      # 180 s per attempt: a cold `go mod download` of packages/envoy/infra measured 113 s on an
      # empty module cache on 2026-11-07, the slowest of the three modules measured there, so the
      # bound is 1.6 times it, and an attempt it kills leaves what it fetched in the module cache
      # for the next one to resume from. The lookup above is `lookup-only`, so no module cache is
      # ever restored here and that cold figure is what a miss pays.
      - name: Download the Go modules this job builds
        if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy/infra's Go modules" 180 -- go -C packages/envoy/infra mod download

      # What envoy-infra-go and the release build build: the vet with both live-test tags, for
      # linux and for darwin, the natslive binaries of the three packages envoy-infra-go's live step
      # runs, and the test binaries of each leg's reader. On ubuntu-24.04-arm, envoy-infra-go's unit
      # step's race build, through the script that step runs (scripts/race-unit.sh, here in its
      # compile mode), so the entry holds what that step links; check-ci-filters.sh holds this leg
      # to that call and to no race build of its own. On ubuntu-24.04, release-envoy-infra.yaml's
      # plain `go test ./...`. Compiled, not run: the live tests need nats-server, Postgres and
      # container images, and the unit tests nothing a build cache keeps. The darwin vet is in the
      # fill because, built cold, it is the step that brought envoy-infra-go near its time limit.
      - name: Build what envoy-infra-go builds
        if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        run: |
          flags=$(python3 ../../../.github/scripts/go_build_tags.py . darwin arm64)
          go vet -tags pulumilive,natslive ./...
          while IFS= read -r flag; do
            GOOS=darwin GOARCH=arm64 go vet "$flag" ./...
          done <<< "$flags"
          if [ "$RUNNER_ARCH" = ARM64 ]; then
            scripts/race-unit.sh compile
          else
            go test -c -o /dev/null ./...
          fi
          go test -c -o /dev/null -tags natslive ./core/ ./seed/ ./gcp/
        working-directory: packages/envoy/infra

      - if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum') }}

  # The go-envoy-infra entries the fill above superseded, deleted once it has saved the new one. A
  # module-file change gives the family a new key, and the entry under the old key, about 1.4 GB,
  # is then read by no run of this ref: left alone it would hold its space until GitHub drops it
  # after seven days unread, and over the repository's cache limit GitHub evicts the least recently
  # used entries, which can be another family's live one. An entry the new one supersedes is one of
  # this ref whose key is the new key but for its 64-hex module-file hash: the same family, runner
  # and Go, with older module files, the hashless key of the fill before this one included. An
  # entry of another runner or another Go is no such entry and stays, so a fill that runs once per
  # architecture deletes nothing the other leg saved. None is deleted unless the new key is among
  # this ref's entries, so a save that did not land leaves the old entry in place. A job of its
  # own, so the token that may delete caches is in no job that builds code. A cache key is text any
  # build that saves on this ref chose, so the step never splits or prints one raw: the list stays
  # JSON, jq selects the numeric ids of the superseded entries, and each id is checked to be a
  # number before `gh cache delete` gets it. A key holding a newline then cannot add a line of its
  # own, such as `--all`, to that list. One leg per architecture of the fill, each keeping the key
  # that architecture's leg saved, under the output names the envoy-infra job gives it; a leg whose
  # architecture filled nothing skips its step. Both legs run on ubuntu-24.04-arm: gh and jq need
  # nothing of an x64 machine.
  # Each read and each delete retries through .github/scripts/ci-retry.sh at 30 s an attempt, the
  # bound this repository gives a `gh` read of the API (dispatch://INFRA-1545, R1): the list is one
  # ladder, 5 x 30 + 150 = 300 s, and each delete one more. A fill supersedes the one entry the
  # fill before it saved, so a common run deletes one, and the step's DECLARED_LOOPS entry in
  # .github/scripts/check-download-retry.sh says so: 300 + 300 = 600 s for the step. A delete
  # whose first attempt landed and whose answer was lost is refused on its retry as an entry that
  # is gone, and fails the step by name; the next fill deletes nothing more.
  # Budget (the Budgets note of .github/ci-budgets.md): 300 s, the 5 minutes this job carried,
  # plus its one retried step, 600 s. 300 + 600 = 900 s -> 16 min, the whole minute above a sum
  # that is itself a whole number of minutes.
  envoy-infra-superseded:
    needs: envoy-infra
    if: needs.envoy-infra.outputs.filled-x64 == 'true' || needs.envoy-infra.outputs.filled-arm64 == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 16
    permissions:
      actions: write
      contents: read
    steps:
      # The helper the step sources is a file of this repository, so the job checks it out, with
      # no credential left behind, as every other job of this workflow does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Delete this ref's go-envoy-infra entries the new one supersedes
        if: needs.envoy-infra.outputs[format('filled-{0}', matrix.arch)] == 'true'
        # Its own retry arithmetic: the list and the one delete a common run makes,
        # 300 + 300 = 600 s -> 11 min, the whole minute above a sum that is itself a whole number
        # of minutes.
        timeout-minutes: 11
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ needs.envoy-infra.outputs[format('key-{0}', matrix.arch)] }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          . .github/scripts/ci-retry.sh
          entries=$(retry_fetch "this ref's go-envoy-infra entries" 30 -- \
            gh cache list --ref "$REF" --key go-envoy-infra- --limit 100 --json id,key,ref)
          if ! jq -e --arg keep "$KEEP" --arg ref "$REF" 'any(.[]; .key == $keep and .ref == $ref)' <<<"$entries" >/dev/null; then
            echo "::warning::the new go-envoy-infra entry is not among this ref's entries, so none is deleted"
            exit 0
          fi
          jq -r --arg keep "$KEEP" --arg ref "$REF" \
            'def base: gsub("-[0-9a-f]{64}"; "");
             .[] | select(.ref == $ref and (.key | startswith("go-envoy-infra-")) and .key != $keep
                          and (.key | base) == ($keep | base)) | .id' <<<"$entries" |
            while read -r id; do
              if ! [[ $id =~ ^[0-9]+$ ]]; then
                echo "::error::the cache list gave an id that is not a number, so nothing more is deleted"
                exit 1
              fi
              echo "Deleting go-envoy-infra entry $id, which the new entry supersedes"
              retry_fetch "the deletion of go-envoy-infra entry $id" 30 -- gh cache delete "$id"
            done

  # The elan home ci.yaml's airlock-lean job restores, the Lean toolchain that job's `lake build`
  # needs. No setup-go and no Go family: the key is the runner's architecture, since elan and the
  # toolchain are binaries of it, and the content of the lean-toolchain the model names, since
  # that file is what decides which toolchain elan installs, so the entry is refreshed when the
  # model moves to another Lean and at no other time. install-elan puts elan under
  # $RUNNER_TEMP/elan and the toolchain step below downloads the named toolchain into it on a
  # miss, which is the whole of what is saved. It runs on ubuntu-24.04-arm, the runner
  # airlock-lean runs on.
  elan:
    runs-on: ubuntu-24.04-arm
    # why: .github/ci-notes/ci-caches.md#the-elan-jobs-budget
    # 1800 + 1708 = 3508 s -> 59 min.
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: elan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/internal/cipher/proxyrules/lean/lean-toolchain') }}
          lookup-only: true

      # install-elan's own retry arithmetic: one `ci_tools_fetch` of the release tarball,
      # 1708 s (the Budgets note of .github/ci-budgets.md) -> 29 min.
      - if: steps.elan-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-elan
        timeout-minutes: 29

      # The toolchain lean-toolchain names, retried as airlock-lean's step of the same name is and
      # at its bound (.github/ci-notes/ci-job-airlock-lean.md#the-lean-toolchain-step-and-its-bound).
      - name: Install the Lean toolchain lean-toolchain names
        if: steps.elan-cache.outputs.cache-hit != 'true'
        # why: .github/ci-notes/ci-caches.md#the-elan-jobs-budget
        # 5 x 120 + 150 = 750 s -> 13 min.
        timeout-minutes: 13
        run: |
          . .github/scripts/ci-retry.sh
          toolchain=$(cat packages/envoy/internal/cipher/proxyrules/lean/lean-toolchain)
          retry_fetch "the Lean toolchain $toolchain" 120 -- elan toolchain install "$toolchain"

      # What airlock-lean builds, after the toolchain step, as airlock-lean builds it: the build
      # reads the toolchain from $RUNNER_TEMP/elan and downloads nothing, so the entry holds the
      # toolchain airlock-lean's build will find there.
      - name: Build what airlock-lean builds
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: lake build
        working-directory: packages/envoy/internal/cipher/proxyrules/lean

      - if: steps.elan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/internal/cipher/proxyrules/lean/lean-toolchain') }}

  # The bun family, ~/.bun/bin, which .github/actions/setup-bun restores in every job that calls
  # it, keyed on the runner's OS and architecture, the build variant and the version .bun-version
  # pins. This is the family's one saving job: the action saves only where its caller passes
  # `save: 'true'` and the run is a push to main, and no other caller passes it, as each Go family
  # above has one saving job. THE KEY NAMES THE RUNNER'S ARCHITECTURE, SO EACH ARCHITECTURE NEEDS
  # AN ENTRY AND A SAVING JOB OF ITS OWN: a Bun binary runs on one architecture, and an entry an
  # x64 leg saved is one no arm64 job restores. So one leg per runner the action's callers run on,
  # ubuntu-24.04 (x64) and ubuntu-24.04-arm (arm64). The action's own restore is the lookup: a
  # leg whose key is there restores the entry, finds the pinned Bun in it and saves nothing, so a
  # run that finds both keys costs a checkout and a restore on each leg.
  bun:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # why: .github/ci-notes/ci-caches.md#the-bun-jobs-budget
    # 600 + 3416 = 4016 s -> 67 min.
    timeout-minutes: 67
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fill the bun family for this runner's architecture
        uses: ./.github/actions/setup-bun
        # why: .github/ci-notes/ci-caches.md#the-bun-jobs-budget
        # 2 x 1708 = 3416 s -> 57 min.
        timeout-minutes: 57
        with:
          save: 'true'

  # The two builds ci.yaml's dispatch-two-builds job runs the tree against, each made by
  # packages/envoy/scripts/build-dispatch-build.sh from a commit of this repository: the previous
  # release's, keyed on that release's commit, and the pinned first-rollout release's. That job
  # restores both and saves neither, since an entry a pull request or a merge group saves lands
  # in a scope no other run reads (dispatch://INFRA-1545, R4), so this job fills them on a push
  # to main, as the families above are filled. Each key is the text of that job's restore, which
  # check-ci-filters.sh holds this job's save to. On ubuntu-24.04, the runner dispatch-two-builds
  # runs on: the key names the runner's architecture, and each build's server is a binary of it.
  # The whole history and the tags, as that job checks them out: the script resolves the previous
  # release from the tags in the history of origin/main, and refuses a commit older than its floor
  # release, which it reads by its tag.
  dispatch-builds:
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/ci-caches.md#the-dispatch-builds-jobs-budget
    # 900 + 3416 = 4316 s -> 72 min.
    timeout-minutes: 72
    env:
      # The first-rollout build's commit, the pin ci-job-dispatch-two-builds.yaml's env holds
      # under this name and firstRolloutRelease in
      # packages/envoy/cmd/dispatch/twobuild_harness_test.go holds too: the key below is that
      # job's restore key, so the two pins move together.
      FIRST_ROLLOUT_COMMIT: edb69e0d7588ec037847182e74a04a343a0664c9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve the previous build's commit
        id: previous
        run: |
          commit=$(packages/envoy/scripts/build-dispatch-build.sh --previous-release --resolve)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - id: previous-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-previous
            !${{ runner.temp }}/dispatch-previous/src
          key: dispatch-previous-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/scripts/build-dispatch-build.sh') }}-${{ steps.previous.outputs.commit }}
          lookup-only: true

      - id: first-rollout-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-first-rollout
            !${{ runner.temp }}/dispatch-first-rollout/src
          key: dispatch-first-rollout-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/scripts/build-dispatch-build.sh') }}-${{ env.FIRST_ROLLOUT_COMMIT }}
          lookup-only: true

      - if: steps.previous-build.outputs.cache-hit != 'true' || steps.first-rollout-build.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false

      - if: steps.previous-build.outputs.cache-hit != 'true' || steps.first-rollout-build.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-bun
        # why: .github/ci-notes/ci-caches.md#the-dispatch-builds-jobs-budget
        # 2 x 1708 = 3416 s -> 57 min.
        timeout-minutes: 57

      - name: Build the previous build
        if: steps.previous-build.outputs.cache-hit != 'true'
        # why: .github/ci-notes/ci-caches.md#the-dispatch-builds-jobs-budget
        # 1050 + 1050 + 116 = 2216 s -> 37 min.
        timeout-minutes: 37
        env:
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.commit }}
          DISPATCH_PREVIOUS_BUILD: ${{ runner.temp }}/dispatch-previous
        run: packages/envoy/scripts/build-dispatch-build.sh --commit "$PREVIOUS_COMMIT" --out "$DISPATCH_PREVIOUS_BUILD"

      - if: steps.previous-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-previous
            !${{ runner.temp }}/dispatch-previous/src
          key: dispatch-previous-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/scripts/build-dispatch-build.sh') }}-${{ steps.previous.outputs.commit }}

      - name: Build the first-rollout build
        if: steps.first-rollout-build.outputs.cache-hit != 'true'
        # why: .github/ci-notes/ci-caches.md#the-dispatch-builds-jobs-budget
        # 1050 + 1050 + 116 = 2216 s -> 37 min.
        timeout-minutes: 37
        env:
          DISPATCH_FIRST_ROLLOUT_BUILD: ${{ runner.temp }}/dispatch-first-rollout
        run: packages/envoy/scripts/build-dispatch-build.sh --commit "$FIRST_ROLLOUT_COMMIT" --out "$DISPATCH_FIRST_ROLLOUT_BUILD"

      - if: steps.first-rollout-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-first-rollout
            !${{ runner.temp }}/dispatch-first-rollout/src
          key: dispatch-first-rollout-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/scripts/build-dispatch-build.sh') }}-${{ env.FIRST_ROLLOUT_COMMIT }}
