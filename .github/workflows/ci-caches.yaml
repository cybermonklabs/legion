name: CI caches

# Fills the Actions caches ci.yaml's jobs restore, so a pull request or a merge group finds
# them warm. ci.yaml runs on a pull request, a merge group and a dispatch, and no longer on a push
# to main: the queue tests every change on the tree it lands as, so a run on main would only test
# that tree again (ci.yaml's header says it). No job of that workflow saves a cache entry any
# more, so the families it restores need a filler of their own, and this workflow is it.
#
# Why the filler runs on a push: a run reads the cache scope of its own branch and that of the
# default branch, and only an event that writes the default branch's scope - a push to main among
# them - leaves an entry every later run can read. A save made in a merge group or on a pull
# request lands in that run's own scope, which the next pull request's run cannot read, so it
# would reach nobody.
#
# Five Go families, each one a restore step of ci.yaml names, keyed on the Go version the
# family's own module installs: go-notices (lint's notices step), go-daemon (typecheck, test and
# pi-legion), go-envoy (dispatch, dispatch-browser-multiprocess, envoy-go-checks,
# envoy-go-race-docs, envoy-go-docs-finalizers, listener-server-change, envoy-e2e-local and
# envoy-session-stall), go-envoy-test (envoy-go) and go-envoy-infra (envoy-infra-go). One job per
# Go setup, since the key carries the version that module's go.mod names: the daemon's go.mod for
# go-daemon and for go-notices, which lint installs the daemon's Go for; the envoy module's for
# go-envoy and go-envoy-test; the infra module's for go-envoy-infra. Each family is first looked up
# (`lookup-only`, and no `restore-keys`: the question is whether that exact key exists, and the
# answer downloads nothing), and only a miss runs the build the ci.yaml job runs and saves what
# it left in the module cache and the build cache. A family whose key is already there builds
# nothing, so a run that finds every key costs a checkout and a setup-go. Where a job fills two
# families it fills the smaller one first, so the entry that carries the other's objects too is
# the one that was large already.
#
# Two entries are no Go family, both of ci.yaml's dispatch job, and both looked up, filled on a
# miss and saved as the Go families are. The Playwright browsers, which the browsers job below
# fills: its key is bun.lock's hash, since the lockfile pins the Playwright version that decides
# the browsers' revisions, so that entry is refreshed when the pin moves rather than when Go is
# bumped. The .deb archives of the apt list that job's Playwright install needs, which the
# apt-debs job below fills: its key names that same Playwright version and the runner image, so
# that entry is refreshed by a Playwright bump or an image roll, and both jobs compute it with
# one script, .github/scripts/apt-archive-cache-key.sh, so the save's key cannot drift from the
# restore's.
#
# Two more entries are no Go family and no actions/cache entry either: the BuildKit layer caches
# of packages/envoy/docker/Dockerfile's two dependency stages, under the scopes
# envoy-listener-bun-deps and envoy-listener-go-deps, which the envoy-listener-deps job below
# fills for the listener build of ci.yaml's envoy-smoke job. They carry no key of their own,
# since BuildKit looks an entry up itself, by the layer it wants rather than by a key a step
# computes, so there is nothing to look up first and no save step to write: the job builds both
# targets on every push, and BuildKit re-exports what it imported wherever nothing changed.
#
# go-docs is not here: docs-pages.yaml saves it on this same push, from the build job it shares
# with ci.yaml's docs job. The Bun cache is not here either: .github/actions/setup-bun reads and
# writes it on main, and five workflows that run there call it.

# A push to main is what writes the default branch's cache scope; workflow_dispatch fills a family
# by hand, after a Go bump, a Playwright bump, an image roll or an eviction. No `paths:`: a key
# holds a Go version, bun.lock's hash, or a Playwright version and a runner image, not a file
# list, so what the push touched decides nothing, and a run whose keys are all there is seconds.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One fill at a time per ref, and no cancellation: a cancelled run saves nothing, so cutting the
# running fill short would leave the caches empty and make the next push pay for them again. The
# default queue holds the newer run until this one ends, and a push after it replaces the one
# waiting, since both would fill the same keys.
concurrency:
  group: ci-caches-${{ github.ref }}
  cancel-in-progress: false

# Reading the tree and the caches is all this workflow does: a cache scope needs no token scope
# of its own, and nothing here reports a check or writes an artifact. That holds for the
# BuildKit layer caches below as well: the Actions cache service answers the runtime token the
# runner gives every job, which is why the five actions/cache jobs here save their entries under
# this block alone.
permissions:
  contents: read

# The proxy fall-through ci.yaml's env block explains: with `|`, a go command that hits ANY error
# from proxy.golang.org - a reset mid-stream among them - fetches the same bytes from the source
# and checks them against go.sum.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # go-daemon and go-notices. Both key on packages/daemon/go.mod's Go: ci.yaml's typecheck, test
  # and pi-legion set Go up from it, and so does lint, whose notices step the go-notices family
  # belongs to, though that step also builds the envoy and infra modules' commands.
  daemon:
    runs-on: ubuntu-24.04
    # The notices build is the long one: it writes the notices of, and cross-compiles, every
    # release target of three modules on a cold module cache.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      - id: go-daemon
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          lookup-only: true

      # What typecheck and test build: the vet behind the e2e tag, the test binary of every
      # package, and the race build of the three packages test runs under the detector, whose
      # objects are cache entries of their own. Those three are the list
      # .github/scripts/ci_job_reads.py's DAEMON_RACE_PACKAGES holds, which check-ci-filters.sh
      # holds ci.yaml's two steps to, so a package that joins or leaves the detector there is the
      # side this command follows. The test binaries are compiled and never run (`go test -c -o
      # /dev/null` links each one and writes nothing): running them would want tmux, jj, Oh My Pi,
      # uv, container images and a Postgres service, and the build cache this entry holds is what
      # a compile leaves.
      - name: Build what typecheck and test build of the daemon module
        if: steps.go-daemon.outputs.cache-hit != 'true'
        run: |
          go vet -tags e2e ./...
          go test -c -o /dev/null ./...
          go test -c -o /dev/null -race ./internal/daemon/ ./internal/sessionproxy/ ./internal/launcher/
        working-directory: packages/daemon

      - if: steps.go-daemon.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}

      # go-notices after go-daemon, and saved second: this entry is the large one (the notices
      # build loads every release target of three modules), so it is the one that can carry the
      # daemon build's objects without changing what a run pays for.
      - id: go-notices
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          lookup-only: true

      # The very script lint's notices step runs, .github/scripts/go-release-notices.sh: the
      # same loops over .github/go-release-targets.json, .github/agent-secrets-client-targets.json
      # and .github/envoy-infra-targets.json, with the same GOOS, GOARCH and CGO_ENABLED per
      # target, so the modules it downloads, the go-licenses it builds under ~/.cache/legion and
      # the objects it leaves are the ones lint restores. One script and not a copy of those
      # loops, because a copy stops warming a target the day lint gains one, and nothing fails:
      # lint just builds those objects cold on every run.
      - name: Write every Go release archive's third-party notices and cross-build the commands
        if: steps.go-notices.outputs.cache-hit != 'true'
        run: .github/scripts/go-release-notices.sh "$RUNNER_TEMP/notices"

      - if: steps.go-notices.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}

  # go-envoy and go-envoy-test. Both key on packages/envoy/go.mod's Go, the module every job that
  # restores them sets Go up from, so one setup serves the two; their lookups and their builds are
  # independent, and each build is gated on its own lookup.
  envoy:
    runs-on: ubuntu-24.04
    # Compiling the test binary of every package of the envoy module on a cold module cache is
    # the long step; the listener and natsd are minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false

      - id: go-envoy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          lookup-only: true

      # The two binaries envoy-e2e-local's scripts/e2e-local.sh and envoy-session-stall's
      # test/envoy-stack.ts build, and whose packages listener-server-change compiles too: the
      # listener and the in-process NATS server's natsd. An -o ending in a separator names a
      # directory, as envoy-stack.ts's build does, so both main packages build in one command.
      - name: Build the listener and natsd of the envoy module
        if: steps.go-envoy.outputs.cache-hit != 'true'
        run: go build -o "$RUNNER_TEMP/envoy-bin/" ./cmd/listener ./internal/testnats/cmd/natsd
        working-directory: packages/envoy

      - if: steps.go-envoy.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}

      - id: go-envoy-test
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          lookup-only: true

      # envoy-go's set: the test binary of every package of the envoy module, the integration
      # package's and the natslive build of internal/testnats among them. `go test -c` links each
      # package's test binary and `-o /dev/null` writes none of them, so every object the restored
      # build cache holds is made and no test runs: envoy-go's tests want the job's Postgres
      # service and container images, which a cache fill has no reason to start.
      - name: Build the test binary of every package of the envoy module
        if: steps.go-envoy-test.outputs.cache-hit != 'true'
        run: |
          go test -c -o /dev/null ./...
          go test -c -o /dev/null -tags natslive ./internal/testnats/
        working-directory: packages/envoy

      - if: steps.go-envoy-test.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}

  # go-envoy-infra. The infra module is not in the root go.work - its own go.work binds it and
  # packages/envoy - so it keys on packages/envoy/infra/go.mod's Go and builds in a job of its own,
  # as ci.yaml's envoy-infra-go does.
  envoy-infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/infra/go.mod
          cache: false

      - id: go-envoy-infra
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          lookup-only: true

      # What envoy-infra-go builds: the vet with both live-test tags, the test binary of every
      # package, and the natslive binaries of the three packages its live step runs. Compiled, not
      # run: the live tests need nats-server, Postgres and container images, and the unit tests
      # nothing a build cache keeps.
      - name: Build what envoy-infra-go builds
        if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        run: |
          go vet -tags pulumilive,natslive ./...
          go test -c -o /dev/null ./...
          go test -c -o /dev/null -tags natslive ./core/ ./seed/ ./gcp/
        working-directory: packages/envoy/infra

      - if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}

  # The Playwright browsers ci.yaml's dispatch job restores, the one entry here that is no Go
  # family: no setup-go, and the key is bun.lock's hash rather than a Go version, since that
  # lockfile pins the Playwright version whose browsers the install downloads.
  browsers:
    runs-on: ubuntu-24.04
    # Three browser downloads on a miss; a run that finds the key costs the checkout alone.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: playwright
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          lookup-only: true

      # The install reads the Playwright the lockfile pins out of node_modules, as the dispatch
      # job's does: `bunx playwright` without it would fetch the newest release instead, whose
      # browser revisions are other than the ones that job will look for.
      - if: steps.playwright.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-bun
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      # The three browsers the dispatch job's suite runs. No `--with-deps`: the apt packages it
      # installs land outside ~/.cache/ms-playwright, so no entry could carry them, and that job
      # installs them itself on every run.
      - name: Download the browsers the dispatch job's suite runs
        if: steps.playwright.outputs.cache-hit != 'true'
        run: bunx playwright install chromium webkit firefox
        working-directory: packages/dispatch

      - if: steps.playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

  # The .deb files of the apt list ci.yaml's dispatch job installs before its browser suite,
  # .github/playwright-apt-packages.txt: with their dependencies, 182 packages and 114 MB of
  # archives, measured in job 128209099649 of cybermonklabs/legion#2888 at 5ff42456. That job
  # seeds apt's archive directory from the entry and installs out of it, so a hit costs it no
  # download at all; the family exists because that download is the one unbounded cost of its
  # install step, the step whose whole retry budget is written for the case where the mirror is
  # slow. The fill is here and not there because the save has to write the default branch's cache
  # scope: a save on a pull request or in a merge group lands in that run's own scope, which the
  # next pull request cannot read.
  #
  # ubuntu-24.04 because the key names ImageOS and ImageVersion: the entry holds the package
  # versions that image's indexes resolve, so a fill from another image writes a key no dispatch
  # run ever reads. No setup-bun and no setup-go either - the key script reads bun.lock as text,
  # and apt needs neither - so the checkout is all this job sets up.
  apt-debs:
    runs-on: ubuntu-24.04
    # The arithmetic, from the two readings ci.yaml's install step is bounded by: at 186 kB/s,
    # the slowest package download a green dispatch job of its window met (job 127238648049),
    # the list's 114 MB need 613 s, and at 233 kB/s, the slowest `apt-get update` of that window
    # (job 127357441704), the 13.0 MB of indexes need 56 s. Copying the archives out of apt's
    # directory took 1.1 s in job 128209099649. Uploading the 114 MB entry has no reading yet
    # and is estimated at 120 s. 613 + 56 + 1.1 + 120 = 790 s, rounded up to 20 min. The apt
    # calls below carry no bound and no second origin of their own, unlike the install step's:
    # a fill that meets a slower mirror than those two ends on this budget, and the next push
    # to main fills the family again.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The very script ci.yaml's dispatch job computes the key with, so the save below writes
      # the key that job's restore reads: a key that drifted would make every restore there miss
      # and nothing would fail, the job just fetching the whole 114 MB set again on every run.
      - id: apt-debs-key
        name: Compute the apt archive cache key
        run: |
          key=$(.github/scripts/apt-archive-cache-key.sh)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - id: apt-debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-debs-key.outputs.key }}
          lookup-only: true

      # The same file the dispatch job's install reads, with the same expression: its `#` header
      # and its blank lines dropped, and $packages left unquoted on purpose, to split into words.
      # `-d` downloads and unpacks nothing, which is all this job wants: it fills the directory
      # that job seeds apt from, and installs none of it. gstreamer1.0-tools is asked for beside
      # the list, because that job's install asks for both - the list is Playwright's own, which
      # playwright-deps-current.sh holds it to, and the tool carries the gst-inspect-1.0 its
      # decoder guard runs - and an entry holding the list alone would leave that package and
      # whatever it pulls in to be fetched on every run that hit. Measured on the probe run
      # 42362119894 of this branch: the list alone is 181 .deb files, and the install step's
      # whole set is the 182 of job 128209099649.
      - name: Download the .deb files the dispatch job's install needs
        if: steps.apt-debs.outputs.cache-hit != 'true'
        run: |
          # The runner image preconfigures Google's chrome-stable apt source, whose index
          # intermittently fails `apt-get update` with a hash-sum mismatch; the dispatch job's
          # install drops it for that reason, and an update that fails here leaves the family
          # empty until the next push.
          grep -rl dl.google.com /etc/apt/sources.list.d | xargs -r sudo rm -f
          packages=$(grep -vE '^[[:space:]]*(#|$)' .github/playwright-apt-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -d $packages gstreamer1.0-tools
          # apt fetches into its own directory as root, and the cache action that saves the entry
          # runs as the runner user, which can read neither root's directory nor root's files, so
          # the .deb files are copied out and handed over below.
          shopt -s nullglob
          fetched=(/var/cache/apt/archives/*.deb)
          shopt -u nullglob
          # An entry is written once and never replaced, so an empty one would hold this key for
          # as long as the Playwright pin and the image stand, and every dispatch run under it
          # would restore nothing and fetch the whole set. A download that left no .deb file is
          # therefore this job's failure, not an entry to save.
          [ "${#fetched[@]}" -gt 0 ] || {
            echo "::error::apt fetched no .deb file for the pinned list, so there is nothing to" \
              "keep under this key; the entry is not written"
            exit 1
          }
          mkdir -p "$HOME/apt-archives"
          sudo cp "${fetched[@]}" "$HOME/apt-archives/"
          sudo chown "$(id -u):$(id -g)" "$HOME"/apt-archives/*.deb
          echo "apt archives: keeping ${#fetched[@]} .deb files"

      - if: steps.apt-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-debs-key.outputs.key }}

  # The two dependency stages of packages/envoy/docker/Dockerfile: bun-deps, which ends at the
  # filtered Bun install, and go-deps, which ends at `go mod download`. Each is built here and
  # exported as a BuildKit layer cache, bun-deps under the scope envoy-listener-bun-deps and
  # go-deps under envoy-listener-go-deps. .github/workflows/ci.yaml's envoy-smoke job reads both
  # of those scopes when it builds the listener image its smoke test runs, so the two scope
  # strings written here and the two written there are a pair that must match, character for
  # character. Nothing fails when one of them drifts from the other: a scope no run has written
  # is a miss, and every envoy-smoke run then installs and downloads again, as it did before this
  # job existed.
  #
  # ubuntu-24.04 is the runner that reading job runs on, and neither build below names
  # `platforms:`, so each builds for its runner's own platform and the entry a run reads was
  # written on the same one.
  envoy-listener-deps:
    runs-on: ubuntu-24.04
    # The arithmetic of a cold run, the run that has nothing to import: the two base-image pulls,
    # the filtered Bun install (about 58 s at the ratio measured for this change), the
    # go-licenses install (33.2 s measured) and the module download (11.8 s measured), and the
    # two cache exports. 20 min is that sum with a slow runner's margin, and it is the same bound
    # the apt-debs job above carries.
    timeout-minutes: 20
    # No permissions block of its own: the workflow's `contents: read` is what the checkout
    # needs, and the two cache exports below reach the Actions cache service with the runner's
    # own runtime token rather than with this job's, as every actions/cache job above does.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The builder both builds below run on. Its docker-container driver is what can read or
      # write a type=gha cache at all: Docker's own driver keeps no BuildKit cache a run can
      # export or import. The same two rows the envoy-smoke job's builder carries.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # provenance-add-gha (true by default on this driver) stages $GITHUB_EVENT_PATH's full
          # JSON into any provenance predicate a build on this builder computes; neither build
          # below asks for an attestation, and false here is what keeps the event payload out of
          # a predicate in the first place. image= is the driver's own default BuildKit image:
          # ghcr.io/cybermonklabs/legion/ci, the copy of moby/buildkit:buildx-stable-1
          # (.github/ci-images.yaml).
          driver-opts: |
            provenance-add-gha=false
            image=ghcr.io/cybermonklabs/legion/ci@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      # The two builds below export a layer cache and nothing else: `outputs: type=cacheonly` is
      # what says so, and a build with neither `push`, `load` nor `outputs` discards its result
      # with a warning. Each step reads its own scope as well as writing it, so a push whose
      # inputs are unchanged re-exports the blobs it imported rather than building the stage
      # again. mode=min exports the target stage's own layers rather than every intermediate's,
      # which is what .github/workflows/worker-image.yaml lines 234-250 record for this same
      # cache pool and its repository-wide limit. ignore-error=true: the cache only saves time,
      # so a failed export never fails this job. The ref test sits inside cache-to's value and in
      # no `if:` on the job or the step, for two reasons at once: an entry saved on another ref
      # lands in a scope no other branch's run can read, which is the reason this workflow's
      # header gives for running on a push at all, and
      # .github/scripts/check-image-trigger-paths.sh refuses a gate that holds `github.ref ==
      # 'refs/heads/main'`, while this exact expression is the one its own fixture green-lights.
      # BUILDX_METADATA_PROVENANCE and DOCKER_BUILD_SUMMARY keep the action's own copy of the
      # provenance predicate out of the job log and out of a build summary page, as the
      # envoy-smoke job's build of this same Dockerfile does.
      - name: Fill the layer cache of the listener image's Bun dependency stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: packages/envoy/docker/Dockerfile
          target: bun-deps
          outputs: type=cacheonly
          provenance: false
          cache-from: type=gha,scope=envoy-listener-bun-deps
          # PROBE ONLY (dispatch://INFRA-1526, k5): the probe branch's own ref in place of
          # refs/heads/main, so this branch's fill writes an entry its own runs can read.
          cache-to: ${{ github.ref == 'refs/heads/probe/infra-1526' && 'type=gha,mode=min,scope=envoy-listener-bun-deps,ignore-error=true' || '' }}

      # The second stage, under its own scope. It is built in a step of its own rather than as
      # one build's by-product: go-deps sits on a base image of its own and on no part of
      # bun-deps, so the two stages share no layer to export together.
      - name: Fill the layer cache of the listener image's Go dependency stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: packages/envoy/docker/Dockerfile
          target: go-deps
          outputs: type=cacheonly
          provenance: false
          cache-from: type=gha,scope=envoy-listener-go-deps
          # PROBE ONLY (dispatch://INFRA-1526, k5): as the step above.
          cache-to: ${{ github.ref == 'refs/heads/probe/infra-1526' && 'type=gha,mode=min,scope=envoy-listener-go-deps,ignore-error=true' || '' }}

  # PROBE ONLY (dispatch://INFRA-1526, k9): the one arm64 surface this change can reach before
  # the merge. It builds this change's Dockerfile and main's copy of it, which this branch
  # commits beside it, on the runner label release-envoy-listener.yaml's arm64 leg uses, and
  # reads the same three commands k4 reads from each image. It pushes nothing, publishes no tag
  # and attests nothing, and it never reaches the pull request. No docker/setup-buildx-action:
  # with Docker's own driver the build needs no BuildKit image of its own, and it reads no cache.
  envoy-listener-arm-probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the listener image on arm64 as this change leaves it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: packages/envoy/docker/Dockerfile
          load: true
          provenance: false
          tags: legion-envoy-arm-probe:${{ github.sha }}

      - name: Build the listener image on arm64 as main leaves it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: packages/envoy/docker/Dockerfile.baseline
          load: true
          provenance: false
          tags: legion-envoy-arm-baseline:${{ github.sha }}

      - name: Compare the two arm64 images file by file
        env:
          CHANGED: legion-envoy-arm-probe:${{ github.sha }}
          BASELINE: legion-envoy-arm-baseline:${{ github.sha }}
        run: |
          set -eu
          read_image() {
            image="$1"; out="$2"
            docker run --rm --user 0 --entrypoint find "$image" / -xdev -type f -printf '%p %s\n' | sort > "$out"
          }
          read_image "$CHANGED" /tmp/changed.txt
          read_image "$BASELINE" /tmp/baseline.txt
          normalise() {
            sed -E 's#(/srv/dispatch-web/.*)-[A-Za-z0-9_-]{8,}\.#\1-HASH.#' "$1" | sort
          }
          normalise /tmp/changed.txt > /tmp/changed.norm
          normalise /tmp/baseline.txt > /tmp/baseline.norm
          echo "=== normalised listing difference (baseline then changed; empty is the pass)"
          diff /tmp/baseline.norm /tmp/changed.norm && echo "(empty)"
          echo "=== size multiset difference (empty is the pass)"
          diff <(awk '{print $2}' /tmp/baseline.txt | sort -n) <(awk '{print $2}' /tmp/changed.txt | sort -n) && echo "(empty)"
          echo "=== file counts"
          wc -l /tmp/baseline.txt /tmp/changed.txt
          for image in "$BASELINE" "$CHANGED"; do
            echo "=== $image binaries"
            docker run --rm --user 0 --entrypoint sha256sum "$image" \
              /usr/local/bin/envoy-listener /usr/local/bin/envoy-dispatch \
              /usr/local/bin/envoy-broker /usr/local/bin/agent-secrets
            echo "=== $image notices"
            docker run --rm --user 0 --entrypoint sha256sum "$image" \
              /usr/share/doc/legion/THIRD_PARTY_NOTICES /srv/dispatch-web/THIRD_PARTY_NOTICES.txt
          done
