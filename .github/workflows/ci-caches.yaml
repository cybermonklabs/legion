name: CI caches

# Fills the Actions caches ci.yaml's jobs restore, so a pull request or a merge group finds
# them warm. ci.yaml runs on a pull request, a merge group and a dispatch, and no longer on a push
# to main: the queue tests every change on the tree it lands as, so a run on main would only test
# that tree again (.github/ci-notes/ci.md#why-the-router-runs-on-these-events-and-no-others says
# it). No step of that workflow saves a cache entry any more, and the actions it calls save only
# in a dispatched run, so the caches it restores need a filler of their own, and this workflow is
# it.
#
# Why the filler runs on a push: a run reads the cache scope of its own branch and that of the
# default branch, and only an event that writes the default branch's scope - a push to main among
# them - leaves an entry every later run can read. A save made in a merge group or on a pull
# request lands in that run's own scope, which the next pull request's run cannot read, so it
# would reach nobody.
#
# Six Go families, each one a restore step of ci.yaml's run names, keyed on the runner's
# architecture and on the Go version the family's own module installs (go-envoy-infra on the hash
# of its module files too, for the reason its job gives): go-notices (lint's notices step),
# go-daemon (typecheck, daemon-go, plugin-pack and pi-legion), go-envoy (envoy-go-build, envoy-go-checks,
# envoy-go-race-docs, envoy-go-docs-finalizers, listener-server-change, envoy-e2e-local and
# envoy-session-stall, and the embedder job of .github/workflows/dispatch-browser.yaml),
# go-envoy-test (envoy-go, envoy-go-claim-model, which builds the API's test binary of that set,
# and the binaries, multiprocess and visual jobs of
# .github/workflows/dispatch-browser.yaml, which ci.yaml's dispatch-browser and
# dispatch-browser-pr jobs call: those three build the Dispatch server and the real broker's
# commands, whose packages the go-envoy entry's build of the listener and natsd alone does not
# hold), go-envoy-darwin-vet (envoy-go-build's darwin vet, whose build cache is a directory of
# its own, the GOCACHE of that step's env) and go-envoy-infra (envoy-infra-build and
# envoy-infra-go, and the build job of release-envoy-infra.yaml).
# The key carries `runner.arch` because Go's build cache holds the objects of the architecture
# that compiled them: an entry an x86_64 runner filled gives an arm64 job its modules and none of
# its objects. So each family is filled on every architecture one of its readers runs on, one
# matrix leg per runner: go-notices on ubuntu-24.04-arm alone, where lint runs, and go-daemon,
# go-envoy, go-envoy-test and go-envoy-infra on ubuntu-24.04-arm and on ubuntu-24.04 both, since
# each has a reader on each (typecheck and the envoy lanes but one on the first; daemon-go,
# plugin-pack, pi-legion, envoy-go-build, envoy-go-checks, envoy-go-claim-model, the browser lane
# and the release builds on the second), and go-envoy-darwin-vet on ubuntu-24.04 alone, where
# envoy-go-build runs. A leg builds
# what that runner's readers build and no more: go-daemon's arm64 reader is typecheck alone, so its
# arm64 leg runs typecheck's vet and leaves the test and race builds to the x86_64 leg.
# go-notices carries the architecture before the OS (go-notices-<arch>-<os>-go<version>) and the
# other five after it: the go-notices entry holds go-licenses, a program lint's notices step
# runs, and a run of a workflow file older than the architecture in the key restores by
# go-notices-<os>-, which an <os>-<arch> key starts with (ci-job-lint.yaml's restore step says what
# that did). One
# Go setup per leg, since the key carries the version that module's go.mod names: the daemon's
# go.mod for go-daemon and for go-notices, which lint installs the daemon's Go for; the envoy
# module's for go-envoy, go-envoy-test and go-envoy-darwin-vet; the infra module's for
# go-envoy-infra.
#
# go-daemon, go-notices, go-envoy, go-envoy-test and go-envoy-darwin-vet are filled again on
# every push to main. The
# fill restores the newest entry of its family, runs on it the build the ci.yaml job runs, which
# compiles only what changed since that entry was saved, and saves the result under the key
# ci.yaml's readers restore followed by the commit (`-${{ github.sha }}`). The fill's restore
# asks for the readers' key, with that key and a `-` as its restore-keys. GitHub matches the key
# itself as a prefix too, so an entry of another Go version is restored only when that version's
# text starts with this one's (go1.27.30 for go1.27.3), and Go keys every object of its build
# cache on the toolchain that compiled it, so such an entry costs only its download. No entry
# carries the readers' key itself any more, so GitHub's matching gives a reader the newest entry
# whose key starts with it: the last fill's.
# Why: these keys used to name the Go version alone, and the fill saved only when that exact key
# was missing, so each family was filled once per Go version. The go-daemon, go-envoy and
# go-envoy-test entries every job restored on 2026-11-22 had been saved on 2026-11-18 between
# 13:03 and 13:08Z (go-notices' on 2026-11-19), and at main's e7381b7d4c9 a job that restored
# them had to compile again 312 of the daemon module's 335 packages and 573 of the envoy module's
# 618 (`go list -test -deps -f {{.Stale}}`); from an entry filled five merges earlier, 135 and
# 321. The refill-superseded job deletes every other entry of the family once the new one is
# listed, so each family keeps one entry per runner, as it did before. A job that is downloading
# a deleted entry at that moment gets a cache miss: actions/cache/restore warns and the job goes
# on, compiling what the entry would have given it, so it is slower, not failed.
# The build cache in an entry does not grow with each fill: Go deletes the objects no build has
# used for five days (trimLimit in Go's cmd/go/internal/cache), and a restore keeps each file's
# modification time, which is the time of last use Go reads. The module cache keeps every module
# version it has downloaded (Go removes none by itself), until a Go bump starts the family again:
# after a bump the fill finds no entry of the new Go (unless an older version's text starts with
# the new one's, as the prefix note above says) and builds from nothing.
#
# go-envoy-infra and elan are still looked up first (`lookup-only`, and no `restore-keys`: the
# question is whether that exact key exists, and the answer downloads nothing), and only a miss
# runs the build and saves what it left. Each of their keys carries a hash of the files that
# choose what the entry holds, and a run that finds its key builds nothing. Each save takes the
# key its lookup computed (`steps.<id>.outputs.cache-primary-key`), never a hashFiles() of its
# own: the build can change a hashed file (a go command may add the checksums it fetched to go.sum
# or go.work.sum), so a hash taken after the build need not be the lookup's. go-envoy-infra's save
# hashed its files again, and its key drifted: in run 45088325195 the lookup asked for
# ...-85ddfce1... and the save wrote ...-f2bbc22a..., so every push missed the lookup and built
# for seven to ten minutes a leg. Where a job fills two families it fills the smaller one first,
# so the entry that carries the other's objects too is the one that was large already. A leg of
# a matrix that fails leaves
# the other running (`fail-fast: false`): a cancelled leg saves nothing, and one architecture's
# fill has no reason to cost the other's.
#
# Beside those six, the architecture-check job fills
# architecture-check-<os>-<arch>-go<version>-<hash>, the family of the composite action
# .github/actions/architecture-check, and the spec-check job fills
# spec-check-<os>-<arch>-go<version>-<hash>, the family of .github/actions/spec-check; ci.yaml's
# envoy-go-build runs both actions. Neither is a lookup step of this workflow: each action
# restores and saves its entry itself, keyed on the runner's architecture, on the Go version its
# own setup-go installs from packages/envoy/go.mod and on the SHA-256 of packages/envoy/go.sum,
# so both jobs run on ubuntu-24.04, the runner envoy-go-build runs on.
# On a miss it restores the newest entry of that Go version (restore-keys). It saves only on a
# miss of the exact key in a push, schedule or
# workflow_dispatch run: a run of any other event (pull_request, pull_request_target,
# merge_group, issue_comment, workflow_run and the rest) may hold another person's code, so it
# restores the entry and never saves it. This workflow's push to main is where the entry lands in
# the scope every later run reads. check-ci-filters.sh's cache-family rule reads this workflow's
# own actions/cache steps and not a composite action's, so it holds nothing of these two families;
# the "Caches" paragraph of
# .github/ci-notes/ci.md#the-router-every-check-a-pull-request-or-the-merge-queue-runs is the
# record of their restores and saves.
#
# Three entries here are no Go family: the elan home the airlock-lean job restores, whose key is
# the content of the Lean toolchain the model names rather than a Go version, and the two earlier
# Dispatch builds dispatch-two-builds restores, each keyed on a release commit and the hash of the
# script that builds it, which the dispatch-builds job fills. Two others that were
# no Go family went with the jobs that read them - the Playwright browsers and the .deb files of
# the apt list the browser suite installed - because dispatch-browser.yaml's shard and alone
# jobs run in the image this repository builds, which carries the browsers and their host
# packages, so neither entry has a restore left to serve (dispatch://INFRA-1443). A save whose
# restore is gone is what check-ci-filters.sh refuses, so the two jobs that wrote them are gone
# with them.
#
# go-docs is not here: docs-pages.yaml saves it on this same push, from the build job it shares
# with ci.yaml's docs job. The Bun cache is not here either: .github/actions/setup-bun reads and
# writes it on main, and the workflows that run there call it, this one's dispatch-builds job too.

# A push to main is what writes the default branch's cache scope; workflow_dispatch fills a family
# by hand, after a Go bump, a move of the Lean toolchain or an eviction. No `paths:`: the five
# families filled on every push hold the build of every package of a module and of the modules it
# imports, so nearly any change to Go code is theirs, and a push that changes none of it compiles
# nothing on the restored entry; the other keys hold a Go version, that toolchain file's hash, the
# hash of packages/envoy/go.sum, a Dispatch release's commit or, for go-envoy-infra, the hash of
# the infra workspace's module files, not a file list, so what the push touched decides nothing
# for them.
#
# A release is tagged minutes after its push to main (release-envoy-listener.yaml builds first),
# so the push's own fill resolves the release before it, and the pull requests and merge groups
# after the tag ask dispatch-two-builds for the new one. So that workflow's release_publish job,
# once it has tagged a release, dispatches this one on main with `only: dispatch-builds`, which
# runs the dispatch-builds jobs alone: every other job's `if:` leaves that run out, since a
# release changes none of their keys.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: >-
          dispatch-builds runs the two Dispatch build jobs alone, as release_publish asks after a
          release; all runs every job.
        type: choice
        options: [all, dispatch-builds]
        default: all

# One fill at a time per ref, and no cancellation: a cancelled run saves nothing, so cutting the
# running fill short would leave the caches where the fill before it left them, and the next fill
# would compile both commits' changes. One at a time also keeps a superseded job's deletes from
# meeting another fill's save. The default queue holds the newer run until this one ends, and a
# push after it replaces the one waiting, since the newer commit's fill holds what the waiting
# one's would. A dispatch-builds run has a group of its own, so it never replaces a waiting push
# fill, whose Go families it would not fill; it can run beside a push fill, and
# dispatch-builds-superseded deletes no main entry newer than the one it keeps, so neither run's
# deletes take the other's new entry.
concurrency:
  group: ci-caches-${{ github.ref }}-${{ inputs.only || 'all' }}
  cancel-in-progress: false

# Reading the tree and the caches is all this workflow does but in three jobs: the cache scope
# needs no token scope of its own, and nothing here reports a check or writes an artifact. The
# refill-superseded, envoy-infra-superseded and dispatch-builds-superseded jobs alone take
# `actions: write`, to delete the entries a fill replaced or this repository keeps no more, and
# build nothing.
permissions:
  contents: read

# The proxy fall-through each ci-job-*.yaml file's env block explains: with `|`, a go command
# that hits ANY error from proxy.golang.org - a reset mid-stream among them - fetches the same
# bytes from the source and checks them against go.sum.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # go-daemon. It keys on packages/daemon/go.mod's Go: ci.yaml's typecheck, daemon-go, plugin-pack
  # and pi-legion set Go up from it. One leg per runner, because typecheck runs on
  # ubuntu-24.04-arm and the other three on ubuntu-24.04, and the key carries the runner's
  # architecture. Each leg builds what its runner's readers build: typecheck's vet on both, and
  # the test and race builds on the x86_64 leg alone, since no job that reads the arm64 entry
  # runs them. Each push fills it again from its newest entry (the header says why).
  daemon:
    if: inputs.only != 'dispatch-builds'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # The limit this job carried while it filled go-notices too, whose build is the long one; no
    # leg of the daemon build alone has been measured near it.
    timeout-minutes: 90
    outputs:
      # The key each leg saved, under a name of that leg's architecture, for the
      # refill-superseded job: a matrix job's outputs are combined from its legs, and an output
      # both legs set holds the value of whichever leg ended last.
      go-daemon-x64: ${{ steps.saved.outputs.go-daemon-x64 }}
      go-daemon-arm64: ${{ steps.saved.outputs.go-daemon-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # The newest entry of the family, which the builds below compile on: the readers' key,
      # which no entry carries any more, and that key and a `-`. The key's own prefix match can
      # still reach an entry of a Go whose version starts with this one's (go1.27.30 for go1.27.3);
      # Go keys each object on the toolchain that built it, so that entry costs only its download.
      - id: go-daemon
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # What typecheck builds: the vet behind the e2e tag. It is the one build of this family an
      # arm64 job makes (.github/workflows/ci-job-typecheck.yaml), so both legs run it.
      # typecheck's darwin vet is the one build left out: its darwin objects, about 1.65 GB of build
      # cache on a devbox, would ride in an entry every job that restores go-daemon downloads, and
      # the step builds them in about two minutes (run 43990864191).
      - name: Build what typecheck builds of the daemon module
        run: go vet -tags e2e ./...
        working-directory: packages/daemon

      # What daemon-go builds: the test binary of every package, and the race build of the five
      # packages daemon-go runs under the detector, whose
      # objects are cache entries of their own. Those five are the list
      # .github/scripts/ci_job_reads.py's DAEMON_RACE_PACKAGES holds, which check-ci-filters.sh
      # holds ci.yaml's two steps to, so a package that joins or leaves the detector there is the
      # side this command follows. The test binaries are compiled and never run (`go test -c -o
      # /dev/null` links each one and writes nothing): running them would want tmux, jj, Oh My Pi,
      # uv, container images and a Postgres service, and the build cache this entry holds is what
      # a compile leaves. The x86_64 leg alone: daemon-go, plugin-pack and pi-legion, which read
      # these objects, run on ubuntu-24.04.
      - name: Build what daemon-go builds of the daemon module
        if: runner.arch == 'X64'
        run: |
          go test -c -o /dev/null ./...
          go test -c -o /dev/null -race ./internal/daemon/ ./internal/sessionproxy/ ./internal/launcher/ ./internal/intake/ ./internal/shimwire/
        working-directory: packages/daemon

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      # The key the save above wrote, as the job's outputs name it: RUNNER_ARCH is X64 or ARM64,
      # lowercased here.
      - name: Name the key this leg saved by its architecture
        id: saved
        env:
          KEY: ${{ steps.go-daemon.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-daemon-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

  # go-notices, in a job of its own on ubuntu-24.04-arm, the runner of lint, whose notices step the
  # family belongs to. It keys on packages/daemon/go.mod's Go, which lint installs, though that
  # step also builds the envoy and infra modules' commands, and on the runner's architecture
  # before the OS, as lint's restore does: the entry holds the go-licenses that step runs, and an
  # <os>-<arch> key would start with the go-notices-<os>- prefix of a run of a workflow file older
  # than the architecture in the key, which then restores this arm64 program on x86_64.
  notices:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04-arm
    # The notices build is the long one: it writes the notices of, and cross-compiles, every
    # release target of three modules on a cold module cache.
    timeout-minutes: 90
    outputs:
      # The key this job saved, named by its architecture as the other fills' outputs are.
      go-notices-arm64: ${{ steps.saved.outputs.go-notices-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # The newest entry of the family, which the script below builds on, found as the daemon
      # job's restore finds its own.
      - id: go-notices
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.arch }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-notices-${{ runner.arch }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-

      # The very script lint's notices step runs, .github/scripts/go-release-notices.sh: the
      # same loops over .github/go-release-targets.json, .github/agent-secrets-client-targets.json
      # and .github/envoy-infra-targets.json, with the same GOOS, GOARCH and CGO_ENABLED per
      # target, so the modules it downloads, the go-licenses it builds under ~/.cache/legion and
      # the objects it leaves are the ones lint restores. go-licenses sits there in a directory that
      # names this runner's OS and CPU (scripts/go-third-party-notices.sh), so a lint on another CPU
      # that restores this entry finds no go-licenses at its own path and builds one rather than run
      # this one. One script and not a copy of those loops, because a copy stops warming a target
      # the day lint gains one, and nothing fails: lint just builds those objects cold on every run.
      - name: Write every Go release archive's third-party notices and cross-build the commands
        run: .github/scripts/go-release-notices.sh "$RUNNER_TEMP/notices"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.arch }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      - name: Name the key this job saved by its architecture
        id: saved
        env:
          KEY: ${{ steps.go-notices.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-notices-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

  # go-envoy and go-envoy-test. Both key on packages/envoy/go.mod's Go, the module every job that
  # restores them sets Go up from, so one setup serves the two. Each push fills both again: go-envoy
  # restores its newest entry, builds and saves, then go-envoy-test restores its own newest entry
  # on top and builds and saves, so go-envoy-test's entry holds go-envoy's objects too and
  # go-envoy's stays the small one. One leg per runner: the envoy lanes that restore them run on
  # ubuntu-24.04-arm, and envoy-go-claim-model, whose deadlines were measured on ubuntu-24.04, and
  # the browser lane's jobs restore them on ubuntu-24.04.
  envoy:
    if: inputs.only != 'dispatch-builds'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Compiling the test binary of every package of the envoy module on a cold module cache is
    # the long step; the listener and natsd are minutes.
    timeout-minutes: 60
    outputs:
      # The keys each leg saved, named by family and architecture as the daemon job's are.
      go-envoy-x64: ${{ steps.go-envoy-saved.outputs.go-envoy-x64 }}
      go-envoy-arm64: ${{ steps.go-envoy-saved.outputs.go-envoy-arm64 }}
      go-envoy-test-x64: ${{ steps.go-envoy-test-saved.outputs.go-envoy-test-x64 }}
      go-envoy-test-arm64: ${{ steps.go-envoy-test-saved.outputs.go-envoy-test-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # The newest entry of the family, found as the daemon job's restore finds its own.
      - id: go-envoy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # The two binaries envoy-e2e-local's scripts/e2e-local.sh and envoy-session-stall's
      # test/envoy-stack.ts build, and whose packages listener-server-change compiles too: the
      # listener and the in-process NATS server's natsd. An -o ending in a separator names a
      # directory, as envoy-stack.ts's build does, so both main packages build in one command.
      # envoy-go-build's darwin vet is left out: its darwin objects, about 1.7 GB of build cache on
      # a devbox, would ride in an entry every job that restores go-envoy downloads. They have a
      # family of their own, go-envoy-darwin-vet, which the envoy-darwin-vet job fills.
      - name: Build the listener and natsd of the envoy module
        run: go build -o "$RUNNER_TEMP/envoy-bin/" ./cmd/listener ./internal/testnats/cmd/natsd
        working-directory: packages/envoy

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      - name: Name the go-envoy key this leg saved by its architecture
        id: go-envoy-saved
        env:
          KEY: ${{ steps.go-envoy.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-envoy-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

      # Go leaves each module directory of its module cache read-only, and tar can replace no file
      # in a read-only directory: the go-envoy-test restore below unpacks into the module cache the
      # go-envoy restore filled, and fails with "Cannot open: File exists" at every module the two
      # entries share (GNU tar 1.35, a read-only directory unpacked over twice). Made writable, each
      # such file is replaced, and the restore gives the directories their read-only mode back.
      - name: Let the go-envoy-test restore replace the module files the go-envoy restore left
        run: chmod -R u+w ~/go/pkg/mod

      # The newest entry of the family, found as the daemon job's restore finds its own.
      - id: go-envoy-test
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # envoy-go's set: the test binary of every package of the envoy module, the integration
      # package's and the natslive build of internal/testnats among them. `go test -c` links each
      # package's test binary and `-o /dev/null` writes none of them, so every object the restored
      # build cache holds is made and no test runs: envoy-go's tests want the job's Postgres
      # service and container images, which a cache fill has no reason to start.
      - name: Build the test binary of every package of the envoy module
        run: |
          go test -c -o /dev/null ./...
          go test -c -o /dev/null -tags natslive ./internal/testnats/
        working-directory: packages/envoy

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      - name: Name the go-envoy-test key this leg saved by its architecture
        id: go-envoy-test-saved
        env:
          KEY: ${{ steps.go-envoy-test.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-envoy-test-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

  # go-envoy-darwin-vet: what envoy-go-build's "Vet envoy for darwin, its tagged tests included"
  # compiles, the standard library and every package the envoy module builds for darwin/arm64, in
  # a build cache directory of its own, the GOCACHE that step's env names, so neither this entry
  # nor go-envoy's carries the other's objects. Restored from nothing, that vet compiled all of it
  # on every run: 137.9 s of envoy-go-checks job 137308591036 (the vet was envoy-go-checks' step
  # then), 172 s at the median of 550 pull request runs; on a devbox, 803 s cold against 82 s on a
  # warm cache of 1.7 GB. Each push fills it again from its newest entry, as the header says. It
  # restores go-envoy first, as envoy-go-build does, for the module cache the vet reads. It runs on
  # ubuntu-24.04 alone, the runner envoy-go-build runs on, and its key carries that runner's
  # architecture as every family's does. A job of its own, so neither this fill nor the envoy
  # job's can stop the other.
  envoy-darwin-vet:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04
    # The vet from nothing is the long case: 803 s on a devbox, 172 s at the median in
    # envoy-go-checks, which held the vet then.
    timeout-minutes: 30
    outputs:
      # The key this job saved, named by family and architecture as the other fills' are.
      go-envoy-darwin-vet-x64: ${{ steps.saved.outputs.go-envoy-darwin-vet-x64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # The module cache the vet reads, from go-envoy's newest entry, as envoy-go-build has it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # The newest entry of the family, found as the daemon job's restore finds its own.
      - id: go-envoy-darwin-vet
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-build-darwin
          key: go-envoy-darwin-vet-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-envoy-darwin-vet-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # envoy-go-build's vet, its env and its script as that step has them (ci_job_reads.py's
      # darwin_vet_script is the text check-ci-filters.sh holds that step to), so the entry holds
      # each tag set it vets.
      - name: Vet the envoy module for darwin, as envoy-go-build does
        env:
          GOCACHE: ${{ runner.temp }}/go-build-darwin
        run: |
          flags=$(python3 ../../.github/scripts/go_build_tags.py . darwin arm64)
          while IFS= read -r flag; do
            echo "Vetting for darwin with $flag"
            GOOS=darwin GOARCH=arm64 go vet "$flag" ./...
          done <<< "$flags"
        working-directory: packages/envoy

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-build-darwin
          key: go-envoy-darwin-vet-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      - name: Name the key this job saved by its architecture
        id: saved
        env:
          KEY: ${{ steps.go-envoy-darwin-vet.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-envoy-darwin-vet-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

  # The entries of go-daemon, go-notices, go-envoy, go-envoy-test and go-envoy-darwin-vet that the
  # fills above replaced,
  # deleted once each fill has saved its new one. Each fill saves a new entry, over a gigabyte for
  # most families, so without this the entries would pile up: GitHub drops an entry only after
  # seven days unread, and over the repository's cache limit it evicts the least recently used
  # entries, which can be another family's live one. For each family and architecture this keeps
  # one entry of this ref, the one the fill just saved, and deletes every other one of that family,
  # runner and Go: those whose key is the readers' key followed by `-`, and the one under the
  # readers' key itself, which the fills saved before they named the commit and which would
  # otherwise win every reader's restore as an exact match. The family then holds what it held
  # before this change, one entry per runner, in a repository near its cache limit. A job that is
  # downloading a deleted entry at that moment gets a cache miss: actions/cache/restore warns and
  # the job goes on, compiling what the entry would have given it, slower but not failed. An entry
  # of another runner or another Go is no such entry and stays. None is deleted unless the new key
  # is among this ref's entries, so a save that did not land leaves the old entries in place. A
  # job of its own, so the token that may delete caches is in no job that builds code. A cache key
  # is text any build that
  # saves on this ref chose, so the step never splits or prints one raw: the list stays JSON, jq
  # selects the numeric ids to delete, and each id is checked to be a number before `gh cache
  # delete` gets it. One leg per family and architecture, each keeping the key that fill's leg
  # saved, under the output name the fill gives it; a leg whose fill saved nothing (it failed
  # before its save) skips its steps, and the job runs when any fill failed, so one failed fill
  # does not stop the others' deletes. Every leg runs on ubuntu-24.04-arm: gh and jq need nothing
  # of an x64 machine.
  refill-superseded:
    needs: [daemon, notices, envoy, envoy-darwin-vet]
    if: ${{ !cancelled() && inputs.only != 'dispatch-builds' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: daemon, family: go-daemon, arch: x64 }
          - { job: daemon, family: go-daemon, arch: arm64 }
          - { job: notices, family: go-notices, arch: arm64 }
          - { job: envoy, family: go-envoy, arch: x64 }
          - { job: envoy, family: go-envoy, arch: arm64 }
          - { job: envoy, family: go-envoy-test, arch: x64 }
          - { job: envoy, family: go-envoy-test, arch: arm64 }
          - { job: envoy-darwin-vet, family: go-envoy-darwin-vet, arch: x64 }
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      JOB_TIMEOUT_MINUTES: 5 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    permissions:
      actions: write
    steps:
      # For .github/scripts/gh-read.sh alone: this repository is public, so the checkout needs no
      # scope beyond the one the deletes need.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs[matrix.job].outputs[format('{0}-{1}', matrix.family, matrix.arch)] != ''
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Delete this ref's entries of the family that the new one supersedes
        if: needs[matrix.job].outputs[format('{0}-{1}', matrix.family, matrix.arch)] != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAMILY: ${{ matrix.family }}
          KEEP: ${{ needs[matrix.job].outputs[format('{0}-{1}', matrix.family, matrix.arch)] }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Each call waits out a spent API budget within this job's limit, and fails by name
          # past it.
          source .github/scripts/gh-read.sh
          # The readers' key: the saved one without the commit the fill put at its end.
          base=${KEEP%"-$SHA"}
          if [ "$base-$SHA" != "$KEEP" ]; then
            echo "::error::the $FAMILY key this leg saved does not end in this run's commit, so nothing is deleted"
            exit 1
          fi
          # Newest first, by GitHub's own creation order, so the new entry is among the entries
          # read however many older ones a failed run left behind.
          entries=$(gh_wait_reset gh cache list --ref "$REF" --key "$base" --sort created_at --order desc --limit 100 --json id,key,ref)
          if ! jq -e --arg keep "$KEEP" --arg ref "$REF" 'any(.[]; .key == $keep and .ref == $ref)' <<<"$entries" >/dev/null; then
            echo "::warning::the new $FAMILY entry is not among this ref's entries, so none is deleted"
            exit 0
          fi
          jq -r --arg keep "$KEEP" --arg base "$base" --arg ref "$REF" \
            '.[] | select(.ref == $ref and .key != $keep and (.key == $base or (.key | startswith($base + "-")))) | .id' <<<"$entries" |
            while read -r id; do
              if ! [[ $id =~ ^[0-9]+$ ]]; then
                echo "::error::the cache list gave an id that is not a number, so nothing more is deleted"
                exit 1
              fi
              echo "Deleting $FAMILY entry $id, which the new entry supersedes"
              gh_wait_reset gh cache delete "$id"
            done

  # architecture-check-<os>-<arch>-go<version>-<hash>, the family of the composite action
  # .github/actions/architecture-check, run as ci.yaml's envoy-go-build runs it. The action sets
  # its own Go up, from packages/envoy/go.mod, and restores and saves the entry itself. It saves
  # only in a push, schedule or workflow_dispatch run, so on a push to main it fills the entry in
  # main's scope, where every pull request and merge group of this repository finds it: on a hit
  # it restores the entry and compiles only the command's own packages that changed since the entry
  # was saved; on a miss, as after a go.sum change, it builds the command from the newest entry of
  # that Go version, or cold when there is none, and saves the entry. It also checks main's notes;
  # the action saves before it checks, so a refused set does not cost the entry. A job of its own
  # is one of the two placements the action's README.md gives ("The Go toolchain"). The other, in
  # the envoy job, would run the action first, before that job's setup-go, and a refused note set
  # on main would then stop the go-envoy fills, so it is a job of its own.
  architecture-check:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04
    # The action takes seconds: 13 s with its own Go download and a cache miss, in ci.yaml's
    # envoy-go-checks of run 43553309875, the job envoy-go-build was then a part of.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fill the architecture-check action's cache and check main's notes
        uses: ./.github/actions/architecture-check

  # spec-check-<os>-<arch>-go<version>-<hash>, the family of the composite action
  # .github/actions/spec-check, run as ci.yaml's envoy-go-build runs it, with allow-empty while
  # main holds no spec file. It fills the entry as the architecture-check job above fills its own.
  # It is a job of its own, so a refused note set on main cannot stop this fill and a refused spec
  # tree on main cannot stop the note check.
  spec-check:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fill the spec-check action's cache and check main's spec files
        uses: ./.github/actions/spec-check
        with:
          allow-empty: 'true'

  # go-envoy-infra. The infra module is not in the root go.work - its own go.work binds it and
  # packages/envoy - so it keys on packages/envoy/infra/go.mod's Go and builds in a job of its own,
  # as ci.yaml's envoy-infra-build and envoy-infra-go do. Unlike the other families, its key also
  # carries the hash of the files that choose the module versions it builds: that go.work and its
  # go.work.sum, and the go.mod and go.sum of both modules it binds. An entry keyed on the Go
  # version alone was refreshed only by a Go bump and went stale as those files moved: restoring
  # the entry of 2026-11-06, eleven days old, the linux vet (envoy-infra-build's now) took 175,
  # 229 and 177 s in runs 43990864191, 43996496498 and 44008055050, 83 to 85% of what its darwin
  # vet took in the same run with nothing cached, because google.golang.org/api, gax-go, the AWS
  # SDK and nats had moved under it. With the hash, a push to main that changes those files misses
  # the lookup and fills a fresh entry; a pull request that changes none of them restores one built
  # from the same module versions, and one that changes them restores the newest entry by prefix
  # and builds what moved. One leg per runner: envoy-infra-build and envoy-infra-go run on
  # ubuntu-24.04-arm, and release-envoy-infra.yaml's build, which restores the family too, on
  # ubuntu-24.04. The superseded job below deletes the entry each leg's fill replaced.
  envoy-infra:
    if: inputs.only != 'dispatch-builds'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    outputs:
      # The key each leg looked up, and whether it filled it, under names of that leg's
      # architecture: a matrix job's outputs are combined from its legs, and an output both legs
      # set holds the value of whichever leg ended last. The superseded job keeps each filled key,
      # deletes the entries it supersedes (this ref's go-envoy-infra entries of the same runner and
      # Go with an older module-file hash), and runs only after a fill.
      key-x64: ${{ steps.leg.outputs.key-x64 }}
      filled-x64: ${{ steps.leg.outputs.filled-x64 }}
      key-arm64: ${{ steps.leg.outputs.key-arm64 }}
      filled-arm64: ${{ steps.leg.outputs.filled-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/infra/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      - id: go-envoy-infra
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum') }}
          lookup-only: true

      # The lookup's key and whether this leg fills it, as the job's outputs name them: RUNNER_ARCH
      # is X64 or ARM64, lowercased here.
      - name: Name this leg's key by its architecture
        id: leg
        env:
          KEY: ${{ steps.go-envoy-infra.outputs.cache-primary-key }}
          FILLED: ${{ steps.go-envoy-infra.outputs.cache-hit != 'true' }}
        run: |
          arch=${RUNNER_ARCH,,}
          echo "key-$arch=$KEY" >>"$GITHUB_OUTPUT"
          echo "filled-$arch=$FILLED" >>"$GITHUB_OUTPUT"

      # What envoy-infra-build, envoy-infra-go and the release build build: the vet with both
      # live-test tags, for linux and for darwin, the natslive binaries of the three packages
      # envoy-infra-go's live step runs, and the test binaries of each leg's reader. On
      # ubuntu-24.04-arm, envoy-infra-build's unit step's race build, through the script that step
      # runs (scripts/race-unit.sh, here in its compile mode), so the entry holds what that step
      # links; check-ci-filters.sh holds this leg to that call and to no race build of its own. On
      # ubuntu-24.04, release-envoy-infra.yaml's plain `go test ./...`. Compiled, not run: the live
      # tests need nats-server, Postgres and container images, and the unit tests nothing a build
      # cache keeps. The darwin vet is in the fill because, built cold, it is the step that brought
      # the one envoy-infra-go job those halves were near its time limit.
      - name: Build what envoy-infra-build and envoy-infra-go build
        if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        run: |
          flags=$(python3 ../../../.github/scripts/go_build_tags.py . darwin arm64)
          go vet -tags pulumilive,natslive ./...
          while IFS= read -r flag; do
            GOOS=darwin GOARCH=arm64 go vet "$flag" ./...
          done <<< "$flags"
          if [ "$RUNNER_ARCH" = ARM64 ]; then
            scripts/race-unit.sh compile
          else
            go test -c -o /dev/null ./...
          fi
          go test -c -o /dev/null -tags natslive ./core/ ./seed/ ./gcp/
        working-directory: packages/envoy/infra

      # Under the key the lookup computed, not a hashFiles() taken again: the build above can add
      # checksums to the module files that key hashes (the header says what that cost).
      - if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-envoy-infra.outputs.cache-primary-key }}

  # The go-envoy-infra entries the fill above superseded, deleted once it has saved the new one. A
  # module-file change gives the family a new key, and the entry under the old key, about 1.4 GB,
  # is then read by no run of this ref: left alone it would hold its space until GitHub drops it
  # after seven days unread, and over the repository's cache limit GitHub evicts the least recently
  # used entries, which can be another family's live one. An entry the new one supersedes is one of
  # this ref whose key is the new key but for its 64-hex module-file hash: the same family, runner
  # and Go, with older module files, the hashless key of the fill before this one included. An
  # entry of another runner or another Go is no such entry and stays, so a fill that runs once per
  # architecture deletes nothing the other leg saved. None is deleted unless the new key is among
  # this ref's entries, so a save that did not land leaves the old entry in place. A job of its
  # own, so the token that may delete caches is in no job that builds code. A cache key is text any
  # build that saves on this ref chose, so the step never splits or prints one raw: the list stays
  # JSON, jq selects the numeric ids of the superseded entries, and each id is checked to be a
  # number before `gh cache delete` gets it. A key holding a newline then cannot add a line of its
  # own, such as `--all`, to that list. One leg per architecture of the fill, each keeping the key
  # that architecture's leg saved, under the output names the envoy-infra job gives it; a leg whose
  # architecture filled nothing skips its step. Both legs run on ubuntu-24.04-arm: gh and jq need
  # nothing of an x64 machine.
  envoy-infra-superseded:
    needs: envoy-infra
    if: needs.envoy-infra.outputs.filled-x64 == 'true' || needs.envoy-infra.outputs.filled-arm64 == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      JOB_TIMEOUT_MINUTES: 5 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    permissions:
      actions: write
    steps:
      # For .github/scripts/gh-read.sh alone: this repository is public, so the checkout needs no
      # scope beyond the one the deletes need.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.envoy-infra.outputs[format('filled-{0}', matrix.arch)] == 'true'
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Delete this ref's go-envoy-infra entries the new one supersedes
        if: needs.envoy-infra.outputs[format('filled-{0}', matrix.arch)] == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ needs.envoy-infra.outputs[format('key-{0}', matrix.arch)] }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Each call waits out a spent API budget within this job's limit, and fails by name
          # past it.
          source .github/scripts/gh-read.sh
          entries=$(gh_wait_reset gh cache list --ref "$REF" --key go-envoy-infra- --limit 100 --json id,key,ref)
          if ! jq -e --arg keep "$KEEP" --arg ref "$REF" 'any(.[]; .key == $keep and .ref == $ref)' <<<"$entries" >/dev/null; then
            echo "::warning::the new go-envoy-infra entry is not among this ref's entries, so none is deleted"
            exit 0
          fi
          jq -r --arg keep "$KEEP" --arg ref "$REF" \
            'def base: gsub("-[0-9a-f]{64}"; "");
             .[] | select(.ref == $ref and (.key | startswith("go-envoy-infra-")) and .key != $keep
                          and (.key | base) == ($keep | base)) | .id' <<<"$entries" |
            while read -r id; do
              if ! [[ $id =~ ^[0-9]+$ ]]; then
                echo "::error::the cache list gave an id that is not a number, so nothing more is deleted"
                exit 1
              fi
              echo "Deleting go-envoy-infra entry $id, which the new entry supersedes"
              gh_wait_reset gh cache delete "$id"
            done

  # The two earlier Dispatch builds ci.yaml's dispatch-two-builds job runs beside this tree
  # (.github/workflows/ci-job-dispatch-two-builds.yaml): the previous build, the newest
  # legion-envoy-v* release in main's history, and the first-rollout build, the release that job
  # pins by its commit (FIRST_ROLLOUT_COMMIT). That job restores each, builds it on a miss, and
  # saves neither: this job fills both in main's scope, which every pull request and merge group
  # reads. That job saved them itself before, in the scope of its run's own ref, where a merge
  # group's entry is read by no later run and a pull request's by that pull request alone: on
  # 2026-11-23 25 such entries held 12.2 GB of the repository's cache and main held none, and on
  # 2026-11-22 308 of 351 successful dispatch-two-builds jobs built the previous release again
  # (107 s at the median, 11 s to restore it). Each key is the key that job restores, from the same
  # steps: the previous build's commit from build-dispatch-build.sh, the first-rollout commit from
  # that job's own env, its one pin in CI, read here rather than copied. Each is looked up first,
  # so a run after which neither the newest release nor the script changed builds nothing. It runs
  # on each push to main and again once release-envoy-listener.yaml has tagged a release (the
  # `only` input above), so the release that pull requests and merge groups resolve after the tag
  # is filled within minutes of it. ubuntu-24.04, the runner that job runs on.
  dispatch-builds:
    # Main alone: a dispatched run on another branch would save the builds in that branch's scope,
    # which only that branch's runs read.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # One build of a release on a miss: 107 s at the median, 118 s at the 90th percentile, in
    # dispatch-two-builds (2026-11-22); two misses at most per run.
    timeout-minutes: 30
    outputs:
      # The key of each build's entry, which dispatch-builds-superseded keeps.
      previous: ${{ steps.dispatch-previous.outputs.cache-primary-key }}
      first-rollout: ${{ steps.dispatch-first-rollout.outputs.cache-primary-key }}
    steps:
      # The whole history and the tags: build-dispatch-build.sh resolves the release from them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      - uses: ./.github/actions/setup-bun

      # dispatch-two-builds' step of this name, so the commit in the key is the one it restores.
      - name: Resolve the previous build's commit
        id: previous
        run: |
          commit=$(packages/envoy/scripts/build-dispatch-build.sh --previous-release --resolve)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - id: dispatch-previous
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-previous
            !${{ runner.temp }}/dispatch-previous/src
          key: dispatch-previous-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/scripts/build-dispatch-build.sh') }}-${{ steps.previous.outputs.commit }}
          lookup-only: true

      - name: Build the previous build
        if: steps.dispatch-previous.outputs.cache-hit != 'true'
        env:
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.commit }}
          DISPATCH_PREVIOUS_BUILD: ${{ runner.temp }}/dispatch-previous
        run: packages/envoy/scripts/build-dispatch-build.sh --commit "$PREVIOUS_COMMIT" --out "$DISPATCH_PREVIOUS_BUILD"

      - if: steps.dispatch-previous.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-previous
            !${{ runner.temp }}/dispatch-previous/src
          key: ${{ steps.dispatch-previous.outputs.cache-primary-key }}

      # The pin, read out of dispatch-two-builds' env, where that job's resolve step also checks
      # that the release's tag names it.
      - name: Read the first-rollout build's commit from dispatch-two-builds' pin
        id: first-rollout
        run: |
          commit=$(yq -r '.jobs["dispatch-two-builds"].env.FIRST_ROLLOUT_COMMIT' .github/workflows/ci-job-dispatch-two-builds.yaml)
          if ! [[ $commit =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/workflows/ci-job-dispatch-two-builds.yaml's dispatch-two-builds job sets FIRST_ROLLOUT_COMMIT to '$commit', not a full commit sha"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - id: dispatch-first-rollout
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-first-rollout
            !${{ runner.temp }}/dispatch-first-rollout/src
          key: dispatch-first-rollout-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/scripts/build-dispatch-build.sh') }}-${{ steps.first-rollout.outputs.commit }}
          lookup-only: true

      - name: Build the first-rollout build
        if: steps.dispatch-first-rollout.outputs.cache-hit != 'true'
        env:
          FIRST_ROLLOUT_COMMIT: ${{ steps.first-rollout.outputs.commit }}
          DISPATCH_FIRST_ROLLOUT_BUILD: ${{ runner.temp }}/dispatch-first-rollout
        run: packages/envoy/scripts/build-dispatch-build.sh --commit "$FIRST_ROLLOUT_COMMIT" --out "$DISPATCH_FIRST_ROLLOUT_BUILD"

      - if: steps.dispatch-first-rollout.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-first-rollout
            !${{ runner.temp }}/dispatch-first-rollout/src
          key: ${{ steps.dispatch-first-rollout.outputs.cache-primary-key }}

  # The entries of the two Dispatch builds this repository keeps no more, deleted on main once
  # dispatch-builds has looked its keys up. For each build it keeps main's entry under the key
  # dispatch-builds found or saved, and every main entry created after it, which a run that
  # resolved a newer release beside this one saved (a release's dispatch-builds run can overlap a
  # push's). It deletes the main entries created before it, of an older release or an older script,
  # and every entry of that build, runner and architecture on any other ref, which only that ref's
  # runs could read: the entries dispatch-two-builds saved in its runs' own refs before it stopped
  # saving. That is a retention choice, not a proof that nothing reads them: a pull request whose
  # merge base is older than main's newest release still resolves the older release, misses, and
  # builds it (107 s at the median), as most runs did before. A run that is downloading a deleted
  # entry at that moment gets a cache miss: actions/cache/restore warns and the job builds the
  # release, slower but not failed. Main alone: dispatch-builds saves nothing on another branch.
  # None is deleted unless the kept key is among main's entries and has the shape dispatch-builds
  # gives it (the build, the runner's OS and architecture, the script's 64-hex hash, the 40-hex
  # commit), from which the step takes the prefix it deletes under; the entries come from GitHub
  # newest first and the step reads every one of them, so "created before" is GitHub's own order.
  # The safety of envoy-infra-superseded, for the same reasons: a job of its own, the list kept as
  # JSON, jq selecting numeric ids, each id checked to be a number before `gh cache delete` gets
  # it.
  dispatch-builds-superseded:
    needs: dispatch-builds
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        build: [previous, first-rollout]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      JOB_TIMEOUT_MINUTES: 5 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    permissions:
      actions: write
    steps:
      # For .github/scripts/gh-read.sh alone: this repository is public, so the checkout needs no
      # scope beyond the one the deletes need.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.dispatch-builds.outputs[matrix.build] != ''
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Delete this Dispatch build's entries older than main's, and every other ref's
        if: needs.dispatch-builds.outputs[matrix.build] != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ needs.dispatch-builds.outputs[matrix.build] }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Each call waits out a spent API budget within this job's limit, and fails by name
          # past it.
          source .github/scripts/gh-read.sh
          if ! [[ $KEEP =~ ^dispatch-(previous|first-rollout)-build-[A-Za-z0-9]+-[A-Za-z0-9]+-[0-9a-f]{64}-[0-9a-f]{40}$ ]]; then
            echo "::error::the kept key does not have the shape dispatch-builds gives it, so nothing is deleted"
            exit 1
          fi
          # The build, OS and architecture: the key without its script hash and commit.
          prefix=${KEEP%-*}
          prefix=${prefix%-*}-
          # Every ref's entries, newest first by GitHub's creation order; gh pages past 100 up to
          # the limit, far above what one build holds.
          entries=$(gh_wait_reset gh cache list --key "$prefix" --sort created_at --order desc --limit 1000 --json id,key,ref)
          if ! jq -e --arg keep "$KEEP" --arg ref "$REF" 'any(.[]; .key == $keep and .ref == $ref)' <<<"$entries" >/dev/null; then
            echo "::warning::main holds no entry under $KEEP, so none is deleted"
            exit 0
          fi
          jq -r --arg keep "$KEEP" --arg ref "$REF" --arg prefix "$prefix" \
            '(map(.key == $keep and .ref == $ref) | index(true)) as $kept
             | to_entries[] | .key as $at | .value
             | select((.key | startswith($prefix)) and (.ref != $ref or $at > $kept)) | .id' <<<"$entries" |
            while read -r id; do
              if ! [[ $id =~ ^[0-9]+$ ]]; then
                echo "::error::the cache list gave an id that is not a number, so nothing more is deleted"
                exit 1
              fi
              echo "Deleting entry $id of $prefix, which this repository keeps no more"
              gh_wait_reset gh cache delete "$id"
            done

  # The elan home ci.yaml's airlock-lean job restores, the Lean toolchain that job's `lake build`
  # needs. No setup-go and no Go family: the key is the runner's architecture, since elan and the
  # toolchain are binaries of it, and the content of the lean-toolchain the model names, since
  # that file is what decides which toolchain elan installs, so the entry is refreshed when the
  # model moves to another Lean and at no other time. install-elan puts elan under
  # $RUNNER_TEMP/elan and `lake build` downloads the named toolchain into it on a miss, which is
  # the whole of what is saved. It runs on ubuntu-24.04-arm, the runner airlock-lean runs on.
  elan:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04-arm
    # One toolchain download and one build of the model on a miss; a run that finds the key
    # costs the checkout alone.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: elan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/internal/cipher/proxyrules/lean/lean-toolchain') }}
          lookup-only: true

      - if: steps.elan-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-elan

      # The build is what downloads the toolchain lean-toolchain names, so the entry holds what
      # airlock-lean will find rather than elan alone.
      - name: Build what airlock-lean builds
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: lake build
        working-directory: packages/envoy/internal/cipher/proxyrules/lean

      # Under the key the lookup computed, as every hashed key of this workflow is saved.
      - if: steps.elan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/elan
          key: ${{ steps.elan-cache.outputs.cache-primary-key }}
