name: CI caches

# Fills, on each push to main, the Actions caches ci.yaml's jobs restore. Each `# why:` line names
# the section of .github/ci-notes/ci-caches.md that holds the derivation of what it stands beside.
# why: .github/ci-notes/ci-caches.md#why-a-workflow-of-its-own-fills-the-caches-on-a-push-to-main
# why: .github/ci-notes/ci-caches.md#the-go-families-their-readers-and-their-runners

# A push to main writes the default branch's cache scope; a dispatch fills by hand, or, with
# `only: dispatch-builds`, the Dispatch builds alone after a release. No `paths:`.
# why: .github/ci-notes/ci-caches.md#when-the-workflow-runs-and-why-it-has-no-paths
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: >-
          dispatch-builds runs the two Dispatch build jobs alone, as release_publish asks after a
          release; all runs every job.
        type: choice
        options: [all, dispatch-builds]
        default: all

# One running fill per ref and `only` value, never cut short: a cancelled run saves nothing.
# why: .github/ci-notes/ci-caches.md#one-fill-at-a-time-per-ref-and-no-cancellation
concurrency:
  group: ci-caches-${{ github.ref }}-${{ inputs.only || 'all' }}
  cancel-in-progress: false

# Read-only, but for the three *-superseded jobs, which take `actions: write` to delete entries.
# why: .github/ci-notes/ci-caches.md#why-three-jobs-alone-may-delete-entries
permissions:
  contents: read

# A go command falls through to the source on ANY error from proxy.golang.org, and checks the
# bytes against go.sum (each ci-job-*.yaml file's env block says why).
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # go-daemon: typecheck's build on both legs, daemon-go's on the x86_64 leg.
  # why: .github/ci-notes/ci-caches.md#what-the-go-daemon-fill-builds-on-each-leg
  daemon:
    if: inputs.only != 'dispatch-builds'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Budget (the Budgets note of .github/ci-budgets.md): 5400 s, the 90 minutes this job
    # carried while it filled go-notices too, whose build is the long one; no leg of the daemon
    # build alone has been measured near it. Plus its slowest retried step alone, which is now its
    # one: the daemon download, 5 x 180 + 150 = 1050 s. The notices download's two calls,
    # 2 x (5 x 180 + 150) = 2100 s, went to the notices job below with the build they feed
    # (main's #4308), and each leg of the matrix runs the same one download, so no leg adds a term.
    # 5400 + 1050 = 6450 s -> 108 min, which stands above that step's own 18 minutes.
    timeout-minutes: 108
    outputs:
      # The key each leg saved, under its architecture's name, for refill-superseded: a matrix
      # job's outputs are combined from its legs, and one both legs set holds the last leg's.
      go-daemon-x64: ${{ steps.saved.outputs.go-daemon-x64 }}
      go-daemon-arm64: ${{ steps.saved.outputs.go-daemon-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # The newest entry of the family, which the builds below compile on.
      # why: .github/ci-notes/ci-caches.md#the-go-families-their-readers-and-their-runners
      # why: .github/ci-notes/ci-caches.md#why-each-fill-builds-on-the-newest-entry-of-its-family
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-daemon
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # The modules the builds below compile, downloaded once and retried before them.
      # why: .github/ci-notes/ci-caches.md#the-go-module-downloads-before-each-fills-builds
      - name: Download the Go modules this job builds
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/daemon's Go modules" 180 -- go -C packages/daemon mod download

      # why: .github/ci-notes/ci-caches.md#why-each-fill-keeps-only-what-its-own-build-used
      - name: Mark the restored build cache's entries unused until the builds use them
        run: .github/scripts/go-cache-working-set.sh begin "$RUNNER_TEMP/go-daemon-working-set"

      # Both legs: typecheck is this family's one arm64 reader. Its darwin vet is left out.
      - name: Build what typecheck builds of the daemon module
        run: go vet -tags e2e ./...
        working-directory: packages/daemon

      # The x86_64 leg alone. The race packages are ci_job_reads.py's DAEMON_RACE_PACKAGES, which
      # check-ci-filters.sh holds this line to; the test binaries are compiled, never run.
      - name: Build what daemon-go builds of the daemon module
        if: runner.arch == 'X64'
        run: |
          go test -c -o /dev/null ./...
          go test -c -o /dev/null -race ./internal/daemon/ ./internal/sessionproxy/ ./internal/launcher/ ./internal/intake/ ./internal/shimwire/
        working-directory: packages/daemon

      # why: .github/ci-notes/ci-caches.md#why-the-fills-keep-the-module-zips
      - name: Delete the build cache's entries the builds did not use
        run: .github/scripts/go-cache-working-set.sh end "$RUNNER_TEMP/go-daemon-working-set"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      # The key the save above wrote, as the job's outputs name it: RUNNER_ARCH is X64 or ARM64,
      # lowercased here.
      - name: Name the key this leg saved by its architecture
        id: saved
        env:
          KEY: ${{ steps.go-daemon.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-daemon-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

  # go-notices: lint's notices step, on lint's runner, its key naming the architecture first.
  # why: .github/ci-notes/ci-caches.md#what-the-go-notices-fill-builds
  notices:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04-arm
    # Budget (the Budgets note of .github/ci-budgets.md): 5400 s, the 90 minutes the daemon job
    # carried for this build while it filled this family, and this job carries since main's
    # #4308 gave the family a job of its own — the notices build is the long one: it writes the
    # notices of, and cross-compiles, every release target of three modules on a cold module
    # cache — plus its slowest retried step alone: the notices download's two calls,
    # 2 x (5 x 180 + 150) = 2100 s. That arithmetic is a whole number of minutes, so the step's own
    # budget takes one more and this job takes it too: 5400 + 2160 = 7560 s -> 127 min, the
    # whole minute above a sum that is itself a whole number of minutes.
    timeout-minutes: 127
    outputs:
      # The key this job saved, named by its architecture as the other fills' outputs are.
      go-notices-arm64: ${{ steps.saved.outputs.go-notices-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # The newest entry of the family, which the script below builds on, found as the daemon
      # job's restore finds its own.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-notices
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.arch }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-notices-${{ runner.arch }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-

      # The modules the notices script builds, downloaded once and retried before it.
      # why: .github/ci-notes/ci-caches.md#the-go-module-downloads-before-each-fills-builds
      - name: Download the Go modules the notices script builds
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: two calls, 2 x (5 x 180 + 150) = 2100 s. That is a whole
        # number of minutes, so the budget is the next one strictly above it -> 36 min.
        timeout-minutes: 36
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/daemon's Go modules" 180 -- go -C packages/daemon mod download
          retry_fetch "packages/envoy/infra's Go modules" 180 -- go -C packages/envoy/infra mod download

      # As the daemon job's step of this name: the script's builds mark what they use.
      - name: Mark the restored build cache's entries unused until the builds use them
        run: .github/scripts/go-cache-working-set.sh begin "$RUNNER_TEMP/go-notices-working-set"

      # lint's notices step's own script, not a copy of its loops, so a target lint gains is
      # warmed here too.
      - name: Write every Go release archive's third-party notices and cross-build the commands
        # why: .github/ci-notes/ci-caches.md#the-notices-step-whose-script-the-gate-does-not-read
        # 674 + 1050 = 1724 s -> 29 min.
        timeout-minutes: 29
        run: .github/scripts/go-release-notices.sh "$RUNNER_TEMP/notices"

      - name: Delete the build cache's entries the builds did not use
        run: .github/scripts/go-cache-working-set.sh end "$RUNNER_TEMP/go-notices-working-set"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.arch }}-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      - name: Name the key this job saved by its architecture
        id: saved
        env:
          KEY: ${{ steps.go-notices.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-notices-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

  # go-envoy: the listener and natsd, one leg per runner its readers use.
  # why: .github/ci-notes/ci-caches.md#what-the-go-envoy-fill-builds-and-why-it-runs-no-vet
  envoy:
    if: inputs.only != 'dispatch-builds'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # why: .github/ci-notes/ci-caches.md#the-envoy-and-envoy-test-jobs-budgets
    # 600 + 1050 = 1650 s -> 28 min.
    timeout-minutes: 28
    outputs:
      # The key each leg saved, named by family and architecture as the daemon job's are.
      go-envoy-x64: ${{ steps.go-envoy-saved.outputs.go-envoy-x64 }}
      go-envoy-arm64: ${{ steps.go-envoy-saved.outputs.go-envoy-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # The newest entry of the family, found as the daemon job's restore finds its own.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-envoy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # The module the build below compiles, downloaded once and retried before it.
      # why: .github/ci-notes/ci-caches.md#the-go-module-downloads-before-each-fills-builds
      - name: Download the Go modules this job builds
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download

      # As the daemon job's first step of the script, for go-envoy's build.
      - name: Mark the restored build cache's entries unused until the go-envoy build uses them
        run: .github/scripts/go-cache-working-set.sh begin "$RUNNER_TEMP/go-envoy-working-set"

      # The two binaries envoy-e2e-local and envoy-session-stall build. envoy-go-build's darwin vet
      # has a family of its own, go-envoy-darwin-vet.
      - name: Build the listener and natsd of the envoy module
        run: go build -o "$RUNNER_TEMP/envoy-bin/" ./cmd/listener ./internal/testnats/cmd/natsd
        working-directory: packages/envoy

      # No go vet in this fill, on purpose (PR #5289): it more than doubled the saved entry.
      - name: Delete the build cache's entries the go-envoy build did not use
        run: .github/scripts/go-cache-working-set.sh end "$RUNNER_TEMP/go-envoy-working-set"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      - name: Name the go-envoy key this leg saved by its architecture
        id: go-envoy-saved
        env:
          KEY: ${{ steps.go-envoy.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-envoy-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

  # go-envoy-test, on go-envoy's Go and runners, in a job of its own: its restore comes before
  # every build that writes what it restores.
  # why: .github/ci-notes/ci-caches.md#why-go-envoy-test-is-filled-in-a-job-of-its-own
  envoy-test:
    if: inputs.only != 'dispatch-builds'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # why: .github/ci-notes/ci-caches.md#the-envoy-and-envoy-test-jobs-budgets
    # 1800 + 1050 = 2850 s -> 48 min.
    timeout-minutes: 48
    outputs:
      # The key each leg saved, named by family and architecture as the daemon job's are.
      go-envoy-test-x64: ${{ steps.go-envoy-test-saved.outputs.go-envoy-test-x64 }}
      go-envoy-test-arm64: ${{ steps.go-envoy-test-saved.outputs.go-envoy-test-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # The newest entry of the family, found as the daemon job's restore finds its own.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-envoy-test
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # The module both builds below compile, downloaded once and retried before the first, after
      # the restore, which would otherwise unpack over what the download wrote.
      # why: .github/ci-notes/ci-caches.md#the-go-module-downloads-before-each-fills-builds
      - name: Download the Go modules this job builds
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download

      # As the daemon job's first step of the script, for both builds below: the entry saved holds
      # go-envoy's objects too, built here.
      - name: Mark the restored build cache's entries unused until the go-envoy-test builds use them
        run: .github/scripts/go-cache-working-set.sh begin "$RUNNER_TEMP/go-envoy-test-working-set"

      # The envoy job's build of the same name, so this entry holds those objects too.
      - name: Build the listener and natsd of the envoy module
        run: go build -o "$RUNNER_TEMP/envoy-bin/" ./cmd/listener ./internal/testnats/cmd/natsd
        working-directory: packages/envoy

      # envoy-go's set, its natslive step's five packages among it, each binary built and started
      # as envoy-go's go test does; `-run '^$'` runs no test, so no Postgres or image is needed.
      # why: .github/ci-notes/ci-caches.md#why-the-go-envoy-test-fill-starts-each-test-binary
      - name: Build and start the test binary of every package of the envoy module, running no test
        run: |
          go test -count=1 -run '^$' ./...
          go test -count=1 -run '^$' -tags natslive ./internal/testnats/ ./internal/bus/ ./internal/cipher/natscallout/ ./natsgrant/ ./cmd/listener/
        working-directory: packages/envoy

      - name: Delete the build cache's entries neither envoy build used
        run: .github/scripts/go-cache-working-set.sh end "$RUNNER_TEMP/go-envoy-test-working-set"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      - name: Name the go-envoy-test key this leg saved by its architecture
        id: go-envoy-test-saved
        env:
          KEY: ${{ steps.go-envoy-test.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-envoy-test-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

  # go-envoy-race: the race build of envoy's race lane (ci_job_reads.py's ENVOY_RACE_LANE) and the
  # program pg-connection-ceiling.sh runs, on ubuntu-24.04-arm, the lane's runner.
  # why: .github/ci-notes/ci-caches.md#the-envoy-race-lanes-family
  envoy-race:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04-arm
    # Budget (the Budgets note of .github/ci-budgets.md): 1200 s, the 20 minutes main's #5662
    # wrote for it against a cold run of the race build 143 s, modules 7 s and the sizing program
    # 15 s (probe run 45779631560), plus its one retried step, the Go module download below,
    # 5 x 180 + 150 = 1050 s. 1200 + 1050 = 2250 s -> 38 min.
    timeout-minutes: 38
    outputs:
      go-envoy-race-arm64: ${{ steps.saved.outputs.go-envoy-race-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-envoy-race
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-race-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-envoy-race-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # The modules the builds below compile, downloaded once and retried before them, after the
      # restore, which would otherwise unpack over what the download wrote.
      # why: .github/ci-notes/ci-caches.md#the-go-module-downloads-before-each-fills-builds
      - name: Download the Go modules this job builds
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download

      - name: Mark the restored build cache's entries unused until the builds use them
        run: .github/scripts/go-cache-working-set.sh begin "$RUNNER_TEMP/go-envoy-race-working-set"

      # The lane's packages in ENVOY_RACE_LANE's order (check-ci-filters.sh holds this line to
      # it), each test binary built and started as the lane's go test does, running no test.
      - name: Build what the envoy race lane builds
        run: |
          go test -count=1 -race -run '^$' ./internal/dispatch/delivery/... ./internal/dispatch/store/... ./internal/bus/ ./cmd/listener/ ./internal/store/ ./internal/session/ ./internal/kvwatch/... ./natscred/ ./internal/cipher/natscallout/ ./internal/oidc/ ./internal/dispatch/api/ ./internal/dispatch/docs/
          go run ./internal/dispatch/store/cmd/connections
        working-directory: packages/envoy

      - name: Delete the build cache's entries the builds did not use
        run: .github/scripts/go-cache-working-set.sh end "$RUNNER_TEMP/go-envoy-race-working-set"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-race-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      - name: Name the key this job saved by its architecture
        id: saved
        env:
          KEY: ${{ steps.go-envoy-race.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-envoy-race-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

  # go-envoy-darwin-vet: envoy-go-build's darwin vet, in a build cache directory of its own, on
  # ubuntu-24.04, envoy-go-build's runner.
  # why: .github/ci-notes/ci-caches.md#what-the-go-envoy-darwin-vet-fill-builds
  envoy-darwin-vet:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04
    # Budget (the Budgets note of .github/ci-budgets.md): 1800 s, the 30 minutes main's #5148
    # wrote for it — the vet from nothing is the long case, 803 s on a devbox and 172 s at the
    # median in envoy-go-checks, which held the vet then — plus its one retried step, the Go
    # module download below, 5 x 180 + 150 = 1050 s. 1800 + 1050 = 2850 s -> 48 min.
    timeout-minutes: 48
    outputs:
      # The key this job saved, named by family and architecture as the other fills' are.
      go-envoy-darwin-vet-x64: ${{ steps.saved.outputs.go-envoy-darwin-vet-x64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # The module cache the vet reads, from go-envoy's newest entry, as envoy-go-build has it.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # The newest entry of the family, found as the daemon job's restore finds its own.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-envoy-darwin-vet
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-build-darwin
          key: go-envoy-darwin-vet-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: go-envoy-darwin-vet-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      # The modules the vet reads, downloaded once and retried before it.
      # why: .github/ci-notes/ci-caches.md#the-go-module-downloads-before-each-fills-builds
      - name: Download the Go modules this job builds
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download

      # As the daemon job's first step of the script, over the vet's own build cache.
      - name: Mark the restored darwin build cache's entries unused until the vet uses them
        env:
          GOCACHE: ${{ runner.temp }}/go-build-darwin
        run: .github/scripts/go-cache-working-set.sh begin "$RUNNER_TEMP/go-envoy-darwin-vet-working-set"

      # envoy-go-build's vet, env and script as that step has them, so the entry holds each tag set
      # it vets; check-ci-filters.sh holds that step to ci_job_reads.py's darwin_vet_script.
      - name: Vet the envoy module for darwin, as envoy-go-build does
        env:
          GOCACHE: ${{ runner.temp }}/go-build-darwin
        run: |
          flags=$(python3 ../../.github/scripts/go_build_tags.py . darwin arm64)
          while IFS= read -r flag; do
            echo "Vetting for darwin with $flag"
            GOOS=darwin GOARCH=arm64 go vet "$flag" ./...
          done <<< "$flags"
        working-directory: packages/envoy

      - name: Delete the darwin build cache's entries the vet did not use
        env:
          GOCACHE: ${{ runner.temp }}/go-build-darwin
        run: .github/scripts/go-cache-working-set.sh end "$RUNNER_TEMP/go-envoy-darwin-vet-working-set"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-build-darwin
          key: go-envoy-darwin-vet-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

      - name: Name the key this job saved by its architecture
        id: saved
        env:
          KEY: ${{ steps.go-envoy-darwin-vet.outputs.cache-primary-key }}-${{ github.sha }}
        run: echo "go-envoy-darwin-vet-${RUNNER_ARCH,,}=$KEY" >>"$GITHUB_OUTPUT"

  # The entries of go-daemon, go-notices, go-envoy, go-envoy-test, go-envoy-race and
  # go-envoy-darwin-vet that the fills above replaced, deleted once each fill has saved its new
  # one, three a leg at most, each read and each delete through the one retry at 30 s an attempt.
  # why: .github/ci-notes/ci-caches.md#the-refill-superseded-job
  # Budget (the Budgets note of .github/ci-budgets.md): 300 s, the 5 minutes this job carried,
  # plus its one retried step, 300 + 3 x 300 = 1200 s. 300 + 1200 = 1500 s -> 26 min, the whole
  # minute above a sum that is itself a whole number of minutes.
  refill-superseded:
    needs: [daemon, notices, envoy, envoy-test, envoy-race, envoy-darwin-vet]
    if: ${{ !cancelled() && inputs.only != 'dispatch-builds' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: daemon, family: go-daemon, arch: x64 }
          - { job: daemon, family: go-daemon, arch: arm64 }
          - { job: notices, family: go-notices, arch: arm64 }
          - { job: envoy, family: go-envoy, arch: x64 }
          - { job: envoy, family: go-envoy, arch: arm64 }
          - { job: envoy-test, family: go-envoy-test, arch: x64 }
          - { job: envoy-test, family: go-envoy-test, arch: arm64 }
          - { job: envoy-race, family: go-envoy-race, arch: arm64 }
          - { job: envoy-darwin-vet, family: go-envoy-darwin-vet, arch: x64 }
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 26
    env:
      JOB_TIMEOUT_MINUTES: 26 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    permissions:
      actions: write
    steps:
      # For .github/scripts/cache-superseded.sh and the ci-retry.sh and gh-read.sh it sources: this
      # repository is public, so the checkout needs no scope beyond the one the deletes need.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs[matrix.job].outputs[format('{0}-{1}', matrix.family, matrix.arch)] != ''
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Delete this ref's entries of the family that the new one supersedes
        if: needs[matrix.job].outputs[format('{0}-{1}', matrix.family, matrix.arch)] != ''
        # Its own retry arithmetic, which is cache-superseded.sh's: the list and the three deletes
        # a run makes at most, 300 + 3 x 300 = 1200 s -> 21 min, the whole minute above a sum that
        # is itself a whole number of minutes.
        timeout-minutes: 21
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAMILY: ${{ matrix.family }}
          KEEP: ${{ needs[matrix.job].outputs[format('{0}-{1}', matrix.family, matrix.arch)] }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          STEP_TIMEOUT_MINUTES: 21 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        run: .github/scripts/cache-superseded.sh commit "$FAMILY"

  # architecture-check-<os>-<arch>-go<version>-<hash>: the action restores and saves it itself.
  # why: .github/ci-notes/ci-caches.md#the-architecture-check-and-spec-check-families
  architecture-check:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04
    # The action takes seconds: 13 s with its own Go download and a cache miss, in ci.yaml's
    # envoy-go-checks of run 43553309875, the job envoy-go-build was then a part of, and this job
    # 27 s and 26 s whole (runs 43586962074 and 43592826052). Each was measured before the
    # action's fetch was split out of its build; the split fetch is `go list -deps` of the
    # command, which fetches only the two modules that build fetched itself, so each figure holds
    # the same work. Budget (ci-budgets.md's Budgets note): those 27 s measured, plus the action's
    # one retried call, its Go modules at the module bound, 5 x 180 + 150 = 1050 s, so
    # 27 + 1050 = 1077 s; the step's own budget below is 18 min, and this key strictly exceeds it
    # -> 19 min.
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Its own retry arithmetic, which is the action's: the Go modules at the module bound,
      # 5 x 180 + 150 = 1050 s, beside the 13 s the action measured on a cache miss (the job's
      # comment above says what that figure holds), 13 + 1050 = 1063 s -> 18 min.
      - name: Fill the architecture-check action's cache and check main's notes
        uses: ./.github/actions/architecture-check
        timeout-minutes: 18

  # spec-check-<os>-<arch>-go<version>-<hash>, filled as architecture-check fills its own.
  # why: .github/ci-notes/ci-caches.md#the-architecture-check-and-spec-check-families
  spec-check:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 900 s, the 15 minutes this job was written with
    # (main's #4172; no run has measured it yet), plus the action's one retried call, its Go
    # modules at the module bound, 5 x 180 + 150 = 1050 s. 900 + 1050 = 1950 s -> 33 min.
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Its own retry arithmetic, which is the action's: the Go modules at the module bound,
      # 5 x 180 + 150 = 1050 s, beside the 47 s the fetch and the build took on empty caches in a
      # 2-CPU pod (.github/scripts/build-envoy-command.sh's header), 47 + 1050 = 1097 s -> 19 min.
      - name: Fill the spec-check action's cache and check main's spec files
        uses: ./.github/actions/spec-check
        timeout-minutes: 19
        with:
          allow-empty: 'true'

  # go-envoy-infra, on the infra module's Go, one leg per runner, its key carrying the hash of the
  # module files it builds from.
  # why: .github/ci-notes/ci-caches.md#the-go-envoy-infra-fill-and-the-hash-in-its-key
  envoy-infra:
    if: inputs.only != 'dispatch-builds'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Budget (the Budgets note of .github/ci-budgets.md): 2700 s, the 45 minutes
    # this job carried, plus its slowest retried step alone — packages/envoy/infra's
    # `go mod download`, 5 x 180 + 150 = 1050 s. 2700 + 1050 = 3750 s -> 63 min.
    timeout-minutes: 63
    outputs:
      # The key each leg looked up, and whether it filled it, under its architecture's name, for
      # envoy-infra-superseded.
      key-x64: ${{ steps.leg.outputs.key-x64 }}
      filled-x64: ${{ steps.leg.outputs.filled-x64 }}
      key-arm64: ${{ steps.leg.outputs.key-arm64 }}
      filled-arm64: ${{ steps.leg.outputs.filled-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/infra/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      - id: go-envoy-infra
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum') }}
          lookup-only: true

      # The lookup's key and whether this leg fills it, as the job's outputs name them: RUNNER_ARCH
      # is X64 or ARM64, lowercased here.
      - name: Name this leg's key by its architecture
        id: leg
        env:
          KEY: ${{ steps.go-envoy-infra.outputs.cache-primary-key }}
          FILLED: ${{ steps.go-envoy-infra.outputs.cache-hit != 'true' }}
        run: |
          arch=${RUNNER_ARCH,,}
          echo "key-$arch=$KEY" >>"$GITHUB_OUTPUT"
          echo "filled-$arch=$FILLED" >>"$GITHUB_OUTPUT"

      # The infra module's workspace, downloaded once and retried before the vet and the builds.
      # why: .github/ci-notes/ci-caches.md#the-go-module-downloads-before-each-fills-builds
      - name: Download the Go modules this job builds
        if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy/infra's Go modules" 180 -- go -C packages/envoy/infra mod download

      # The readers' builds, compiled and not run. check-ci-filters.sh holds the arm64 leg to
      # scripts/race-unit.sh compile and to no race build of its own.
      - name: Build what envoy-infra-build and envoy-infra-go build
        if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        run: |
          flags=$(python3 ../../../.github/scripts/go_build_tags.py . darwin arm64)
          go vet -tags pulumilive,natslive ./...
          while IFS= read -r flag; do
            GOOS=darwin GOARCH=arm64 go vet "$flag" ./...
          done <<< "$flags"
          if [ "$RUNNER_ARCH" = ARM64 ]; then
            scripts/race-unit.sh compile
          else
            go test -c -o /dev/null ./...
          fi
          go test -c -o /dev/null -tags natslive ./core/ ./seed/ ./gcp/
        working-directory: packages/envoy/infra

      # Under the key the lookup computed, not a hashFiles() taken again: the build above can add
      # checksums to the module files that key hashes.
      # why: .github/ci-notes/ci-caches.md#why-a-lookups-save-takes-the-lookups-key
      - if: steps.go-envoy-infra.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-envoy-infra.outputs.cache-primary-key }}

  # The go-envoy-infra entries the fill above superseded, deleted once it has saved the new one,
  # three a leg at most, each read and each delete through the one retry at 30 s an attempt.
  # why: .github/ci-notes/ci-caches.md#what-envoy-infra-superseded-deletes
  # Budget (the Budgets note of .github/ci-budgets.md): 300 s, the 5 minutes this job carried,
  # plus its one retried step, 300 + 3 x 300 = 1200 s. 300 + 1200 = 1500 s -> 26 min, the whole
  # minute above a sum that is itself a whole number of minutes.
  envoy-infra-superseded:
    needs: envoy-infra
    if: needs.envoy-infra.outputs.filled-x64 == 'true' || needs.envoy-infra.outputs.filled-arm64 == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 26
    env:
      JOB_TIMEOUT_MINUTES: 26 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    permissions:
      actions: write
      contents: read
    steps:
      # For .github/scripts/cache-superseded.sh and the ci-retry.sh and gh-read.sh it sources: this
      # repository is public, so the checkout needs no scope beyond the one the deletes need, and
      # it leaves no credential behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.envoy-infra.outputs[format('filled-{0}', matrix.arch)] == 'true'
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Delete this ref's go-envoy-infra entries the new one supersedes
        if: needs.envoy-infra.outputs[format('filled-{0}', matrix.arch)] == 'true'
        # Its own retry arithmetic, which is cache-superseded.sh's: the list and the three deletes
        # a run makes at most, 300 + 3 x 300 = 1200 s -> 21 min, the whole minute above a sum that
        # is itself a whole number of minutes.
        timeout-minutes: 21
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ needs.envoy-infra.outputs[format('key-{0}', matrix.arch)] }}
          REF: ${{ github.ref }}
          STEP_TIMEOUT_MINUTES: 21 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        run: .github/scripts/cache-superseded.sh hash go-envoy-infra

  # The two earlier Dispatch builds dispatch-two-builds restores, filled in main's scope.
  # why: .github/ci-notes/ci-caches.md#the-two-dispatch-builds
  dispatch-builds:
    # Main alone: a dispatched run on another branch would save the builds in that branch's scope,
    # which only that branch's runs read.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/ci-caches.md#the-dispatch-builds-jobs-budget
    # 900 + 3416 = 4316 s -> 72 min.
    timeout-minutes: 72
    outputs:
      # The key of each build's entry, which dispatch-builds-superseded keeps.
      previous: ${{ steps.previous-build.outputs.cache-primary-key }}
      first-rollout: ${{ steps.first-rollout-build.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # dispatch-two-builds' step of this name, so the commit in the key is the one it restores.
      - name: Resolve the previous build's commit
        id: previous
        run: |
          commit=$(packages/envoy/scripts/build-dispatch-build.sh --previous-release --resolve)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The pin, read out of dispatch-two-builds' env, where that job's resolve step also checks
      # that the release's tag names it.
      - name: Read the first-rollout build's commit from dispatch-two-builds' pin
        id: first-rollout
        run: |
          commit=$(yq -r '.jobs["dispatch-two-builds"].env.FIRST_ROLLOUT_COMMIT' .github/workflows/ci-job-dispatch-two-builds.yaml)
          if ! [[ $commit =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/workflows/ci-job-dispatch-two-builds.yaml's dispatch-two-builds job sets FIRST_ROLLOUT_COMMIT to '$commit', not a full commit sha"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - id: previous-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-previous
          key: dispatch-previous-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/scripts/build-dispatch-build.sh') }}-${{ steps.previous.outputs.commit }}
          lookup-only: true

      - id: first-rollout-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-first-rollout
          key: dispatch-first-rollout-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/scripts/build-dispatch-build.sh') }}-${{ steps.first-rollout.outputs.commit }}
          lookup-only: true

      - if: steps.previous-build.outputs.cache-hit != 'true' || steps.first-rollout-build.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      - if: steps.previous-build.outputs.cache-hit != 'true' || steps.first-rollout-build.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-bun
        # why: .github/ci-notes/ci-caches.md#the-dispatch-builds-jobs-budget
        # 2 x 1708 = 3416 s -> 57 min.
        timeout-minutes: 57

      - name: Build the previous build
        if: steps.previous-build.outputs.cache-hit != 'true'
        # why: .github/ci-notes/ci-caches.md#the-dispatch-builds-jobs-budget
        # 1050 + 1050 + 116 = 2216 s -> 37 min.
        timeout-minutes: 37
        env:
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.commit }}
          DISPATCH_PREVIOUS_BUILD: ${{ runner.temp }}/dispatch-previous
        run: packages/envoy/scripts/build-dispatch-build.sh --commit "$PREVIOUS_COMMIT" --out "$DISPATCH_PREVIOUS_BUILD"

      # Under the key the lookup computed, as every hashed key of this workflow is saved.
      - if: steps.previous-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-previous
          key: ${{ steps.previous-build.outputs.cache-primary-key }}

      - name: Build the first-rollout build
        if: steps.first-rollout-build.outputs.cache-hit != 'true'
        # why: .github/ci-notes/ci-caches.md#the-dispatch-builds-jobs-budget
        # 1050 + 1050 + 116 = 2216 s -> 37 min.
        timeout-minutes: 37
        env:
          FIRST_ROLLOUT_COMMIT: ${{ steps.first-rollout.outputs.commit }}
          DISPATCH_FIRST_ROLLOUT_BUILD: ${{ runner.temp }}/dispatch-first-rollout
        run: packages/envoy/scripts/build-dispatch-build.sh --commit "$FIRST_ROLLOUT_COMMIT" --out "$DISPATCH_FIRST_ROLLOUT_BUILD"

      # Under the key the lookup computed, as every hashed key of this workflow is saved.
      - if: steps.first-rollout-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dispatch-first-rollout
          key: ${{ steps.first-rollout-build.outputs.cache-primary-key }}

  # The entries of the two Dispatch builds this repository keeps no more, on main and on every
  # other ref, deleted once dispatch-builds has looked its keys up, three a leg at most, each read
  # and each delete through the one retry at 30 s an attempt.
  # why: .github/ci-notes/ci-caches.md#what-dispatch-builds-superseded-deletes
  # Budget (the Budgets note of .github/ci-budgets.md): 300 s, the 5 minutes main's #5182 gave
  # this job, plus its one retried step, 300 + 3 x 300 = 1200 s. 300 + 1200 = 1500 s -> 26 min,
  # the whole minute above a sum that is itself a whole number of minutes.
  dispatch-builds-superseded:
    needs: dispatch-builds
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        build: [previous, first-rollout]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 26
    env:
      JOB_TIMEOUT_MINUTES: 26 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    permissions:
      actions: write
    steps:
      # For .github/scripts/cache-superseded.sh and the ci-retry.sh and gh-read.sh it sources: this
      # repository is public, so the checkout needs no scope beyond the one the deletes need.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.dispatch-builds.outputs[matrix.build] != ''
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Delete this Dispatch build's entries older than main's, and every other ref's
        if: needs.dispatch-builds.outputs[matrix.build] != ''
        # Its own retry arithmetic, which is cache-superseded.sh's: the list and the three deletes
        # a run makes at most, 300 + 3 x 300 = 1200 s -> 21 min, the whole minute above a sum that
        # is itself a whole number of minutes.
        timeout-minutes: 21
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ needs.dispatch-builds.outputs[matrix.build] }}
          REF: ${{ github.ref }}
          STEP_TIMEOUT_MINUTES: 21 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        run: .github/scripts/cache-superseded.sh build

  # The elan home airlock-lean restores, keyed on the content of the lean-toolchain the model names.
  # why: .github/ci-notes/ci-caches.md#the-elan-home
  elan:
    if: inputs.only != 'dispatch-builds'
    runs-on: ubuntu-24.04-arm
    # why: .github/ci-notes/ci-caches.md#the-elan-jobs-budget
    # 1800 + 1708 = 3508 s -> 59 min.
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: elan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/internal/cipher/proxyrules/lean/lean-toolchain') }}
          lookup-only: true

      # install-elan's own retry arithmetic: one `ci_tools_fetch` of the release tarball,
      # 1708 s (the Budgets note of .github/ci-budgets.md) -> 29 min.
      - if: steps.elan-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-elan
        timeout-minutes: 29

      # The toolchain lean-toolchain names, retried as airlock-lean's step of the same name is and
      # at its bound (.github/ci-notes/ci-job-airlock-lean.md#the-lean-toolchain-step-and-its-bound).
      - name: Install the Lean toolchain lean-toolchain names
        if: steps.elan-cache.outputs.cache-hit != 'true'
        # why: .github/ci-notes/ci-caches.md#the-elan-jobs-budget
        # 5 x 120 + 150 = 750 s -> 13 min.
        timeout-minutes: 13
        run: |
          . .github/scripts/ci-retry.sh
          toolchain=$(cat packages/envoy/internal/cipher/proxyrules/lean/lean-toolchain)
          retry_fetch "the Lean toolchain $toolchain" 120 -- elan toolchain install "$toolchain" >&2

      # What airlock-lean builds, after the toolchain step, as airlock-lean builds it: the build
      # reads the toolchain from $RUNNER_TEMP/elan and downloads nothing, so the entry holds the
      # toolchain airlock-lean's build will find there.
      - name: Build what airlock-lean builds
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: lake build
        working-directory: packages/envoy/internal/cipher/proxyrules/lean

      # Under the key the lookup computed, as every hashed key of this workflow is saved.
      - if: steps.elan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/elan
          key: ${{ steps.elan-cache.outputs.cache-primary-key }}

  # The bun family, ~/.bun/bin, which .github/actions/setup-bun restores in every job that calls
  # it, keyed on the runner's OS and architecture, the build variant and the version .bun-version
  # pins. This is the family's one saving job: the action saves only where its caller passes
  # `save: 'true'` and the run is a push to main, and no other caller passes it, as each Go family
  # above has one saving job. THE KEY NAMES THE RUNNER'S ARCHITECTURE, SO EACH ARCHITECTURE NEEDS
  # AN ENTRY AND A SAVING JOB OF ITS OWN: a Bun binary runs on one architecture, and an entry an
  # x64 leg saved is one no arm64 job restores. So one leg per runner the action's callers run on,
  # ubuntu-24.04 (x64) and ubuntu-24.04-arm (arm64). The action's own restore is the lookup: a
  # leg whose key is there restores the entry, finds the pinned Bun in it and saves nothing, so a
  # run that finds both keys costs a checkout and a restore on each leg.
  bun:
    if: inputs.only != 'dispatch-builds'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # why: .github/ci-notes/ci-caches.md#the-bun-jobs-budget
    # 600 + 3416 = 4016 s -> 67 min.
    timeout-minutes: 67
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fill the bun family for this runner's architecture
        uses: ./.github/actions/setup-bun
        # why: .github/ci-notes/ci-caches.md#the-bun-jobs-budget
        # 2 x 1708 = 3416 s -> 57 min.
        timeout-minutes: 57
        with:
          save: 'true'
