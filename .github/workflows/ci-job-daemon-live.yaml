name: CI job daemon-live

# The steps of ci.yaml's `daemon-live` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# What runs here is the ten whole-daemon live tests of internal/daemon that
# .github/scripts/ci_job_reads.py's DAEMON_LIVE_TESTS names, every test of the ten files its
# DAEMON_LIVE_FILES names: each boots the whole daemon through the function `legion start`
# calls, over this job's PostgreSQL and the package's test NATS server, and drives it through
# GitHub and Dispatch envelopes, its own HTTP routes and its worker stream, with no agent. They
# were the drivers of ten scripts under scripts/e2e, which no job of ci.yaml ran; they
# carry no build tag now, and the daemon-go race step, which runs their package, skips them by
# name, so each runs once per run of the router, here, where its reads are this job's inputs:
# handoff_records_live_test.go, and review_range_live_test.go on its rig, run the real
# `dispatch` CLI and scripts/e2e/completion-head.ts under bun, and step_records_live_test.go and
# plan_ratings_live_test.go the CLI, which load the installed workspace, the second also
# scripts/e2e/plan-ratings-read.sh, and with them in daemon-go a change to the lockfile or to the
# CLI's sources would run the daemon's whole Go suite.
#
# The tests' names are written in .github/scripts/ci_job_reads.py (DAEMON_LIVE_TESTS), which
# builds this step's `-run` and the race step's `-skip` from the one list and holds each step's
# whole script to the text it builds, so the two cannot come to name different tests.
#
# Everything here is what those tests need:
#   * the pgvector Postgres service and LEGION_TEST_PG_DSN - the store every daemon the tests
#     boot migrates and runs on, and the server the Dispatch that handoff_records_live_test.go
#     and step_records_live_test.go start makes a database of its own on, whose migrations
#     create the pgvector extension;
#   * the NATS image the package's test broker starts (internal/testnats's Image), pulled first
#     for the reason the action gives, and TESTCONTAINERS_RYUK_DISABLED, as daemon-go sets it;
#   * git and jj 0.38 or later, which the daemon resolves at boot and refuses to start without:
#     git is the runner image's own, and install-jj gives the jj the worker image ships;
#   * Bun and a frozen install, for the CLI and the completion-head driver;
#   * setup-go and the go-daemon cache restore: the step compiles internal/daemon's test binary,
#     the same package the plugin-pack job's step builds, and builds the Dispatch server.
# No tmux, no Oh My Pi and no uv: every claim of these tests is launched by the package's fake
# runtime, so no agent and no pane runs.
#
# A failed test leaves its logs: each test writes the daemon's own log at debug, and Dispatch's
# where it starts one, to a directory named for it under LEGION_TEST_DAEMON_LOG_DIR
# (internal/daemon/live_proof_test.go's liveLogDir), and the step after the tests uploads that
# directory when the job fails.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  daemon-live:
    runs-on: ubuntu-24.04
    # The step's own -timeout is 20 minutes, the limit each test had under the script that drove
    # it, so a hung test prints the goroutine dump that names it before the runner cancels the
    # job. Around it are the Bun install, the jj install, the image pull and the Go build of
    # internal/daemon's test binary and of the Dispatch server, which the cache restore makes
    # incremental; 40 minutes leaves that setup the other 20 on a slow runner.
    timeout-minutes: 40
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml):
        # the image and the shape the daemon-go job declares.
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image (testcontainers/ryuk, on Docker Hub) would be one more registry
      # pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # handoff_records_live_test.go, review_range_live_test.go on its rig,
      # step_records_live_test.go and plan_ratings_live_test.go run
      # `bun packages/envoy-client/bin/dispatch.ts`, and the first also
      # `bun scripts/e2e/completion-head.ts`, which import the workspace's packages; each fails on
      # GitHub Actions without bun.
      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      # go-daemon, shared with typecheck, daemon-go, plugin-pack and pi-legion: this step compiles
      # the same package's test binary the plugin-pack job's step does.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-daemon-{0}-{1}-', runner.os, runner.arch) }}

      # Every daemon the tests boot resolves git and jj at boot and refuses to start without
      # either: git is the runner image's own, and this is the jj the worker image ships.
      - uses: ./.github/actions/install-jj

      # The package's test broker starts testnats.Image (the hub's 2.15.1), pulled first for the
      # reason the action gives. No test here starts the other two images daemon-go pulls.
      - name: Pull the NATS test container image
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/daemon/internal/testnats/nats.go Image

      # The ten tests, by name. .github/scripts/ci_job_reads.py builds this text and the
      # daemon-go race step's `-skip` from DAEMON_LIVE_TESTS and holds both steps to what it
      # builds.
      - name: Run the whole-daemon live tests
        env:
          LEGION_TEST_DAEMON_LOG_DIR: ${{ runner.temp }}/daemon-live-logs
        run: go test -v -count=1 -timeout 20m -run '^(TestABehindCompletionIsDecidedByItsHeadAndTheMoveThatRaisedTheEntryLive|TestAConflictKeepsThePhaseAndTakesNoTurnOverLive|TestAPhaseEntryConvergesOnARunningDaemonLive|TestAQueuedRootUnderALiveTreeJoinsItLive|TestEveryChildThatStartsRunsUnderItsOwnArchitectLive|TestHandoffRecordsLive|TestPlanRatingsLive|TestReviewRangeLive|TestStepRecordsLive|TestTheMergeWaitSaysWhatAReviewRoundWaitsOnFromGitHubLive)$' ./internal/daemon/
        working-directory: packages/daemon

      # A failed test's logs, one directory per test: the daemon's own daemon.log at debug, and
      # Dispatch's dispatch.log where the test starts one.
      - name: Upload the live tests' logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-live-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daemon-live-logs

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: daemon-live
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
