name: CI job envoy-go-checks

# The steps of `.github/workflows/ci.yaml#envoy-go-checks` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# envoy's script tests, each a bash harness over fakes. The job runs in the merge queue only:
# ci.yaml's envoy_go_checks output carries the event term
# (.github/ci-notes/ci.md#which-lane-a-job-runs-in-the-pull-request-or-the-merge-queue), and its
# build, vet, format, generated-code and migration checks are envoy-go-build's, which a pull
# request runs.
#
# The harnesses run through .github/scripts/harness-pool.sh: each harness step queues its harness
# and returns, the harnesses run beside each other, and the step "Wait for the script harnesses
# and judge them" before the record upload and the ci-ok report is their verdict, with each
# harness's log, exit status and wall and CPU seconds in its log and the job summary, and the
# time of each of its lines in the artifact the upload keeps
# (.github/ci-notes/ci.md#the-harness-pool).
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go-checks:
    # ubuntu-24.04, the runner these script tests ran on when they shared a job with the pack step,
    # which needed it; that step is envoy-go-build's now.
    runs-on: ubuntu-24.04
    # The setup below (Bun, the workspace install, Go and the go-envoy restore) is the one these
    # tests ran under in that job, kept whole so that no test loses a tool it reads. Their steps took
    # 15.8 min at the median and 21.4 at most over 695 pull-request runs of 2026-11-22.
    timeout-minutes: 30
    env:
      JOB_TIMEOUT_MINUTES: 30 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}

      # The cluster suite's render of nats.yaml runs this helm, the version render-nats.sh pins,
      # instead of building helm with `go run`, which downloads and compiles it first: the render
      # took 40.6 s that way in job 137308591036, 60.0 s in job 137294623668 and 52.1 s in job
      # 137388344183. It is a step before the pool's first start, since a harness started in the
      # background takes the PATH the steps before it left.
      - uses: ./.github/actions/install-helm
      # The script harnesses of the module, each a bash script of fakes that mostly waits on its
      # fakes' answers, polls and deadlines rather than computing. As one step after another they
      # were 944 s of this job's 1,292 s median (n=724 green pull-request jobs, 2026-11-22, when the
      # job held the build and vet steps envoy-go-build holds now) while the runner's other cores
      # idled. Each step below hands one entry to .github/scripts/harness-pool.sh, which queues it
      # and returns. Entries run beside each other in queue order, no more at once than the runner
      # has cores. "Wait for the script harnesses and judge them" is their verdict and prints
      # each one's log.
      # The operator-token-minters check's harness is queued first: it is the longest, 706 s in its
      # last whole run on a developer box (2026-11-25), so the shorter ones fill the other cores.
      - name: Verdict test for infra/scripts/operator-token-minters.sh (fakes kubectl, gcloud and agent-secrets; no cluster or cloud)
        run: ../../.github/scripts/harness-pool.sh start infra/scripts/operator-token-minters.test.sh bash infra/scripts/operator-token-minters.test.sh
        working-directory: packages/envoy
      # Each cluster part runs in its own process with its own fakes (`cluster.test.sh --parts`
      # lists them), so the pool can run parts beside each other and beside the other harnesses.
      # The parts queue longest first by the medians below, so the shorter entries fill the
      # cores around them.
      # These timing records were read on 2026-11-28. As one pool entry,
      # the whole harness took 576.4 s of wall time and 163.4 CPU-seconds in base run 46119586305
      # (job 140901259898, main 562c898d2e2e). It took 279.0 to 571.6 s of wall time in four
      # green merge-group runs on 2026-11-27 (46076851429, 46077299610, 46078481774, 46083105841).
      # The sums of each part's cases in those four runs (median / most, in seconds) were:
      # all-full 82.3 / 95.9, all-seeded 67.5 / 90.6, all-quick 50.4 / 64.8, typing 43.9 / 62.5,
      # stops 23.0 / 25.5, waits 15.7 / 17.7, path 33.5 / 43.1, identity 32.9 / 62.3,
      # checker-quota 27.2 / 29.0, daemons 25.1 / 33.1, units 16.4 / 36.3, and
      # refusals 13.3 / 18.1 (dispatch://INFRA-6321/artifact/cluster-test-cases-md).
      # The `stops` and `waits` parts together keep the original `stops` position in the queue.
      # Run 46132865270 measured `stops` at 83.1 s before the split, over the 60 s target.
      # Each part keeps the 15 min bound to end a hang. The pool's records show whether each
      # entry meets the 60 s target of dispatch://INFRA-6321. That target is not a timeout.
      # The pool sets HARNESS_POOL_DEADLINE_MS to the part's start plus the bound less 30 s.
      # The command passes it as LEGION_PROOF_DEADLINE_MS so proof_guard_from_env in proof-wait.sh
      # lets a wait name what it waited for before the pool stops the part, as case (gg) checks.
      # The parts are queued before the shorter harnesses so they can start early enough for
      # their 15 min bound to fall inside the job's 30 min; the job timeout still caps the wait.
      - name: Test loadtest/cluster/cluster.sh, part all-full (fakes kubectl, gh and curl; no cluster)
        run: ../../.github/scripts/harness-pool.sh start --minutes 15 'loadtest/cluster/cluster.test.sh all-full' bash -c 'LEGION_PROOF_DEADLINE_MS=$HARNESS_POOL_DEADLINE_MS exec bash loadtest/cluster/cluster.test.sh all-full'
        working-directory: packages/envoy
      - name: Test loadtest/cluster/cluster.sh, part all-seeded (fakes kubectl, gh and curl; no cluster)
        run: ../../.github/scripts/harness-pool.sh start --minutes 15 'loadtest/cluster/cluster.test.sh all-seeded' bash -c 'LEGION_PROOF_DEADLINE_MS=$HARNESS_POOL_DEADLINE_MS exec bash loadtest/cluster/cluster.test.sh all-seeded'
        working-directory: packages/envoy
      - name: Test loadtest/cluster/cluster.sh, part all-quick (fakes kubectl, gh and curl; no cluster)
        run: ../../.github/scripts/harness-pool.sh start --minutes 15 'loadtest/cluster/cluster.test.sh all-quick' bash -c 'LEGION_PROOF_DEADLINE_MS=$HARNESS_POOL_DEADLINE_MS exec bash loadtest/cluster/cluster.test.sh all-quick'
        working-directory: packages/envoy
      - name: Test loadtest/cluster/cluster.sh, part typing (fakes kubectl, gh and curl; no cluster)
        run: ../../.github/scripts/harness-pool.sh start --minutes 15 'loadtest/cluster/cluster.test.sh typing' bash -c 'LEGION_PROOF_DEADLINE_MS=$HARNESS_POOL_DEADLINE_MS exec bash loadtest/cluster/cluster.test.sh typing'
        working-directory: packages/envoy
      - name: Test loadtest/cluster/cluster.sh, part stops (fakes kubectl, gh and curl; no cluster)
        run: ../../.github/scripts/harness-pool.sh start --minutes 15 'loadtest/cluster/cluster.test.sh stops' bash -c 'LEGION_PROOF_DEADLINE_MS=$HARNESS_POOL_DEADLINE_MS exec bash loadtest/cluster/cluster.test.sh stops'
        working-directory: packages/envoy
      - name: Test loadtest/cluster/cluster.sh, part waits (fakes kubectl, gh and curl; no cluster)
        run: ../../.github/scripts/harness-pool.sh start --minutes 15 'loadtest/cluster/cluster.test.sh waits' bash -c 'LEGION_PROOF_DEADLINE_MS=$HARNESS_POOL_DEADLINE_MS exec bash loadtest/cluster/cluster.test.sh waits'
        working-directory: packages/envoy
      - name: Test loadtest/cluster/cluster.sh, part path (fakes kubectl, gh and curl; no cluster)
        run: ../../.github/scripts/harness-pool.sh start --minutes 15 'loadtest/cluster/cluster.test.sh path' bash -c 'LEGION_PROOF_DEADLINE_MS=$HARNESS_POOL_DEADLINE_MS exec bash loadtest/cluster/cluster.test.sh path'
        working-directory: packages/envoy
      - name: Test loadtest/cluster/cluster.sh, part identity (fakes kubectl, gh and curl; no cluster)
        run: ../../.github/scripts/harness-pool.sh start --minutes 15 'loadtest/cluster/cluster.test.sh identity' bash -c 'LEGION_PROOF_DEADLINE_MS=$HARNESS_POOL_DEADLINE_MS exec bash loadtest/cluster/cluster.test.sh identity'
        working-directory: packages/envoy
      - name: Test loadtest/cluster/cluster.sh, part checker-quota (fakes kubectl, gh and curl; no cluster)
        run: ../../.github/scripts/harness-pool.sh start --minutes 15 'loadtest/cluster/cluster.test.sh checker-quota' bash -c 'LEGION_PROOF_DEADLINE_MS=$HARNESS_POOL_DEADLINE_MS exec bash loadtest/cluster/cluster.test.sh checker-quota'
        working-directory: packages/envoy
      - name: Test loadtest/cluster/cluster.sh, part daemons (fakes kubectl, gh and curl; no cluster)
        run: ../../.github/scripts/harness-pool.sh start --minutes 15 'loadtest/cluster/cluster.test.sh daemons' bash -c 'LEGION_PROOF_DEADLINE_MS=$HARNESS_POOL_DEADLINE_MS exec bash loadtest/cluster/cluster.test.sh daemons'
        working-directory: packages/envoy
      # The units step keeps the name the CI gate cites for the fresh render of nats.yaml.
      - name: Test loadtest/cluster/cluster.sh (fakes kubectl, gh and curl; no cluster) and compare nats.yaml with a fresh render
        run: ../../.github/scripts/harness-pool.sh start --minutes 15 'loadtest/cluster/cluster.test.sh units' bash -c 'LEGION_PROOF_DEADLINE_MS=$HARNESS_POOL_DEADLINE_MS exec bash loadtest/cluster/cluster.test.sh units'
        working-directory: packages/envoy
      - name: Test loadtest/cluster/cluster.sh, part refusals (fakes kubectl, gh and curl; no cluster)
        run: ../../.github/scripts/harness-pool.sh start --minutes 15 'loadtest/cluster/cluster.test.sh refusals' bash -c 'LEGION_PROOF_DEADLINE_MS=$HARNESS_POOL_DEADLINE_MS exec bash loadtest/cluster/cluster.test.sh refusals'
        working-directory: packages/envoy
      # The vm harness runs as fourteen parts, `vm.test.sh <part>`, each a pool entry of its own with
      # a temporary directory of its own, so they run beside the other harnesses and beside each
      # other. As one serial entry it took 337.2 s and 129.6 CPU-seconds in merge-group job
      # 140927396087 (268.0 to 586.7 s over 11 green merge-group runs of 2026-11-27 and 2026-11-28);
      # as parts, in pull-request job 140965312130 (2026-11-28), each took 14.3 to 59.0 s, and all
      # fourteen 128.4 CPU-seconds; the parts are queued longest first by those walls. The pool counts
      # each entry as one slot however many cores it uses, so the block is queued right after the
      # minters (about 2.2 cores) and the cluster parts, its parts taking each slot a cluster part frees,
      # and the CPU-heavy daemon-release-gate (about 1.1 cores) and legacy-subjects-gate start after
      # it. Queued longest first, all of these before the block, the job asked for more cores than the
      # runner has: two parts took 97.0 and 64.7 s and the job 756 s (job 140971945901, 2026-11-28).
      - name: Test loadtest/vm/vm.sh, part discard-seed-collect (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: ../../.github/scripts/harness-pool.sh start 'loadtest/vm/vm.test.sh discard-seed-collect' bash loadtest/vm/vm.test.sh discard-seed-collect
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, part tunnel (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: ../../.github/scripts/harness-pool.sh start 'loadtest/vm/vm.test.sh tunnel' bash loadtest/vm/vm.test.sh tunnel
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, part series (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: ../../.github/scripts/harness-pool.sh start 'loadtest/vm/vm.test.sh series' bash loadtest/vm/vm.test.sh series
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, part step (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: ../../.github/scripts/harness-pool.sh start 'loadtest/vm/vm.test.sh step' bash loadtest/vm/vm.test.sh step
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, part placement (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: ../../.github/scripts/harness-pool.sh start 'loadtest/vm/vm.test.sh placement' bash loadtest/vm/vm.test.sh placement
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, part oslogin (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: ../../.github/scripts/harness-pool.sh start 'loadtest/vm/vm.test.sh oslogin' bash loadtest/vm/vm.test.sh oslogin
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, part pg-interrupt (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: ../../.github/scripts/harness-pool.sh start 'loadtest/vm/vm.test.sh pg-interrupt' bash loadtest/vm/vm.test.sh pg-interrupt
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, part defects-credentials (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: ../../.github/scripts/harness-pool.sh start 'loadtest/vm/vm.test.sh defects-credentials' bash loadtest/vm/vm.test.sh defects-credentials
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, part mounts (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: ../../.github/scripts/harness-pool.sh start 'loadtest/vm/vm.test.sh mounts' bash loadtest/vm/vm.test.sh mounts
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, part example (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: ../../.github/scripts/harness-pool.sh start 'loadtest/vm/vm.test.sh example' bash loadtest/vm/vm.test.sh example
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, part sessions (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: ../../.github/scripts/harness-pool.sh start 'loadtest/vm/vm.test.sh sessions' bash loadtest/vm/vm.test.sh sessions
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, part check-reset (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: ../../.github/scripts/harness-pool.sh start 'loadtest/vm/vm.test.sh check-reset' bash loadtest/vm/vm.test.sh check-reset
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, part modes-store (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: ../../.github/scripts/harness-pool.sh start 'loadtest/vm/vm.test.sh modes-store' bash loadtest/vm/vm.test.sh modes-store
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, part up (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: ../../.github/scripts/harness-pool.sh start 'loadtest/vm/vm.test.sh up' bash loadtest/vm/vm.test.sh up
        working-directory: packages/envoy
      - name: Verdict test for daemon-release-gate.sh (fakes gh and docker; no registry or GitHub)
        run: ../../.github/scripts/harness-pool.sh start scripts/daemon-release-gate.test.sh bash scripts/daemon-release-gate.test.sh
        working-directory: packages/envoy
      # The deploy tests' URL cases run under en_US.UTF-8, where bash's [[ =~ ]] ranges reach past
      # ASCII, to hold the deployer's URL grammar to ASCII; their groups refuse to run without that
      # locale. This step runs the same test as url_locale_control in
      # deploy/scripts/autodeploy_test.sh, which must stay the same as it, and generates the locale
      # only where that test fails, so one condition decides both, and on ubuntu-24.04 it did not
      # fail: probe run 46134562966 found `en_US.utf8` in `locale -a` before any locale-gen, where
      # at d519fc9a the harness's pooled command ran `sudo locale-gen` first in every run, 3.3 to
      # 5.9 s inside its pool entry. A plain step, not pooled, after the four longest harnesses are
      # queued, so no slot waits on it.
      - name: Generate en_US.UTF-8 where the runner lacks it, for the deploy tests' URL cases
        run: LC_ALL=en_US.UTF-8 bash -c '[[ "ä" =~ ^[a-z]$ ]]' 2>/dev/null || sudo locale-gen en_US.UTF-8
      # The last group of the env cases pulled this image inside its own pool entry at d519fc9a
      # (2.6 to 3.9 s); pulled once here, after the four longest harnesses hold every slot, no
      # harness waits on it. No continue-on-error: a failed pull is this repository's fault and
      # must be seen.
      - name: Pull the Compose 2.12.2 image the deploy tests take
        run: . deploy/scripts/compose-2.12.2_test.sh && pull_compose_2_12
        working-directory: packages/envoy
      # dev-stack.test.sh and autodeploy_test.sh each run in parts, each part a pool entry of its
      # own named for its harness and its part. dev-stack.test.sh has two, each starting the stacks
      # it reads: `stops`, its cases (a) to (v), and `options`, (h) to (p), named
      # `scripts/dev-stack.test.sh <part>`. Its whole entry took 73.4 s of wall time in run
      # 46140194070 (job 140964381366): its cases (a) to (v) 35.7 s, and (h) to its end 37.7 s.
      # autodeploy_test.sh runs one group of its cases per run, each from a fresh fixture, named
      # `deploy/scripts/autodeploy_test.sh <group>`. The whole harness took 153 to 266 s of wall
      # time as one entry in runs 46133189498 and 46133189517, and each group's cases summed 14.7
      # to 34.2 s in run 46133189517. The steps stand longest first by their walls in run
      # 46143522022 (job 140975187870), dev-stack's two parts (45.7 and 43.8 s) and then the groups
      # (29.5 to 4.0 s), so the shorter ones fill the slots around them.
      - name: Isolation test for dev-stack.sh, part stops (fakes go/psql/curl/python3/docker; no real Postgres or network)
        run: ../../.github/scripts/harness-pool.sh start 'scripts/dev-stack.test.sh stops' bash scripts/dev-stack.test.sh stops
        working-directory: packages/envoy
      - name: Isolation test for dev-stack.sh, part options (fakes go/psql/curl/python3/docker; no real Postgres or network)
        run: ../../.github/scripts/harness-pool.sh start 'scripts/dev-stack.test.sh options' bash scripts/dev-stack.test.sh options
        working-directory: packages/envoy
      - name: Rollback and credential test for deploy/scripts/autodeploy.sh, group env-spellings-1 (fakes docker/jj/curl and a libpq client; the runner's Compose plugin resolves the compose file; no Postgres)
        run: ../../.github/scripts/harness-pool.sh start 'deploy/scripts/autodeploy_test.sh env-spellings-1' bash deploy/scripts/autodeploy_test.sh env-spellings-1
        working-directory: packages/envoy
      - name: Rollback and credential test for deploy/scripts/autodeploy.sh, group url-refused-2 (fakes docker/jj/curl and a libpq client; the runner's Compose plugin resolves the compose file; no Postgres)
        run: ../../.github/scripts/harness-pool.sh start 'deploy/scripts/autodeploy_test.sh url-refused-2' bash deploy/scripts/autodeploy_test.sh url-refused-2
        working-directory: packages/envoy
      - name: Rollback and credential test for deploy/scripts/autodeploy.sh, group url-refused-1 (fakes docker/jj/curl and a libpq client; the runner's Compose plugin resolves the compose file; no Postgres)
        run: ../../.github/scripts/harness-pool.sh start 'deploy/scripts/autodeploy_test.sh url-refused-1' bash deploy/scripts/autodeploy_test.sh url-refused-1
        working-directory: packages/envoy
      - name: Rollback and credential test for deploy/scripts/autodeploy.sh, group env-writer-2 (fakes docker/jj/curl and a libpq client; the runner's Compose plugin resolves the compose file; no Postgres)
        run: ../../.github/scripts/harness-pool.sh start 'deploy/scripts/autodeploy_test.sh env-writer-2' bash deploy/scripts/autodeploy_test.sh env-writer-2
        working-directory: packages/envoy
      - name: Rollback and credential test for deploy/scripts/autodeploy.sh, group env-spellings-2 (fakes docker/jj/curl and a libpq client; the runner's Compose plugin resolves the compose file; no Postgres)
        run: ../../.github/scripts/harness-pool.sh start 'deploy/scripts/autodeploy_test.sh env-spellings-2' bash deploy/scripts/autodeploy_test.sh env-spellings-2
        working-directory: packages/envoy
      - name: Rollback and credential test for deploy/scripts/autodeploy.sh, group env-reads (fakes docker/jj/curl and a libpq client; the runner's Compose plugin resolves the compose file; no Postgres)
        run: ../../.github/scripts/harness-pool.sh start 'deploy/scripts/autodeploy_test.sh env-reads' bash deploy/scripts/autodeploy_test.sh env-reads
        working-directory: packages/envoy
      - name: Rollback and credential test for deploy/scripts/autodeploy.sh, group rollback-1 (fakes docker/jj/curl and a libpq client; the runner's Compose plugin resolves the compose file; no Postgres)
        run: ../../.github/scripts/harness-pool.sh start 'deploy/scripts/autodeploy_test.sh rollback-1' bash deploy/scripts/autodeploy_test.sh rollback-1
        working-directory: packages/envoy
      - name: Rollback and credential test for deploy/scripts/autodeploy.sh, group env-writer-1 (fakes docker/jj/curl and a libpq client; the runner's Compose plugin resolves the compose file; no Postgres)
        run: ../../.github/scripts/harness-pool.sh start 'deploy/scripts/autodeploy_test.sh env-writer-1' bash deploy/scripts/autodeploy_test.sh env-writer-1
        working-directory: packages/envoy
      - name: Rollback and credential test for deploy/scripts/autodeploy.sh, group schema-key (fakes docker/jj/curl and a libpq client; the runner's Compose plugin resolves the compose file; no Postgres)
        run: ../../.github/scripts/harness-pool.sh start 'deploy/scripts/autodeploy_test.sh schema-key' bash deploy/scripts/autodeploy_test.sh schema-key
        working-directory: packages/envoy
      - name: Rollback and credential test for deploy/scripts/autodeploy.sh, group rollback-2 (fakes docker/jj/curl and a libpq client; the runner's Compose plugin resolves the compose file; no Postgres)
        run: ../../.github/scripts/harness-pool.sh start 'deploy/scripts/autodeploy_test.sh rollback-2' bash deploy/scripts/autodeploy_test.sh rollback-2
        working-directory: packages/envoy
      - name: Rollback and credential test for deploy/scripts/autodeploy.sh, group url-accepted (fakes docker/jj/curl and a libpq client; the runner's Compose plugin resolves the compose file; no Postgres)
        run: ../../.github/scripts/harness-pool.sh start 'deploy/scripts/autodeploy_test.sh url-accepted' bash deploy/scripts/autodeploy_test.sh url-accepted
        working-directory: packages/envoy
      - name: Verdict test for listener-deploy-probe.sh (two fake listener tasks on 127.0.0.1 and 127.0.0.2)
