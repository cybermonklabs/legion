name: CI job envoy-go-checks

# The steps of ci.yaml's `envoy-go-checks` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true
      migration-base:
        description: >-
          On a workflow_dispatch run, the commit main pointed at before the push the run tests
          (ci.yaml's input of the same name, which main-bypass-check.yaml passes): the base the
          edited-migrations check compares the run's tree with. A dispatch on main must name it;
          a dispatch on another branch that names none compares with the branch's merge base
          with main.
        type: string
        required: false
        default: ''

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go-checks:
    # ubuntu-24.04, the runner release-envoy-listener.yaml builds the release's listener archives
    # on. The pack step below builds those archives as the release does, with no CGO_ENABLED, and
    # Go turns cgo on for a native build where gcc is present and off for a cross build: on this
    # runner that gives the release's own pair, an amd64 listener linked against glibc and a
    # static arm64 one. On ubuntu-24.04-arm the same step built the reverse pair (measured on run
    # 44082892660's artifact), so a failure of the release's build mode would pass the pull
    # request and fail the release after the merge. The job therefore stays on the x86_64 pool,
    # which changes nothing a release ships.
    runs-on: ubuntu-24.04
    # The builds below download the envoy module's dependencies and compile ./cmd/listener for
    # each release architecture, so the job restores go-envoy, the family whose entry holds that
    # same listener build (.github/workflows/ci-caches.yaml fills it on a push to main). Without
    # it the pack step would recompile the set per architecture from nothing on every push, which
    # is the runner time this change exists to cut.
    #
    # R6 sizes the job's bound and each go test call's -timeout from the final measurement pair,
    # runs 44657322918 and 44657415021 at 8cfd2682, by the rule envoy-go's comment gives
    # (dispatch://INFRA-1075, check 6224bb0e), and the dispatch run at each later head, which may
    # raise a limit and never lower one (the architect's rule of 2026-11-20, the issue's
    # open-items.md). The job's bound is its slowest time, 1,208 s in run 44717243297 at 66058706
    # (job 136223826114), against 830 s and 853 s in the pair (run 44657322918, job 136026780288,
    # and run 44657415021, job 136039517954), 988 s in run 44687712471 at 56f4dabc (job
    # 136126010901), 1,042 s in run 44790111577 at 85f6b018 (job 136476756211) and 1,000 s in run
    # 44846096964 at 28ce7c74 (job 136669775694), 20.13 minutes, plus the largest -timeout of its
    # go test calls, the alone step's 2m, plus 6: 20.13 + 2 + 6 = 28.13, so 29. Its other go
    # commands are builds, the darwin vet and two `go run`s, which run no test binary and carry no
    # -timeout. The step that tests the API's wall-clock measurements alone is in this pair too,
    # and its comment gives its reading. The steps that grew, against run 44657415021: the
    # daemon-release-gate.sh verdict test 162 s against 11 s (main's #4449 added its cases; 137 s
    # at 56f4dabc); the autodeploy.sh
    # test 62 s against 13 s, loadtest/vm 190 s against 153 s and loadtest/cluster 184 s against
    # 168 s (main's #4387 changed deploy/scripts and both load-test drivers; 13 s, 155 s and 169 s
    # at 56f4dabc); and the darwin vet 194 s against 143 s and the API's wall-clock step 178 s
    # against 140 s, unattributed.
    timeout-minutes: 29
    # The Postgres the API's alone step runs against, as envoy-go-race-api's: the same image, the
    # same settings on the server's own command line and the same health check. envoy-go's own
    # service says what each setting buys and why this container can do without durability
    # (dispatch://INFRA-1075).
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The composite action other repositories call, run over this repository's own
      # .dispatch/architecture (its default path), so every part of it is exercised here before
      # another repository relies on it: its setup-go, its removal of setup-go's `go` problem
      # matcher, its path resolved against the workspace, its cache restore, and its count output,
      # which the next step reads. In a pull request and a merge group it restores its cache and
      # saves nothing (.github/ci-notes/ci.md#the-router-every-check-a-pull-request-or-the-merge-queue-runs,
      # "Caches"). It runs right after the checkout, before this
      # job's own setup-go, which adds setup-go's `go` problem matcher back for every later step
      # of the job: the placement "before the Go setup of the job" of the action's README.md, "The
      # Go toolchain". The checkout removes the problem matcher it adds before it ends, so no
      # matcher of an earlier step reads the check's lines (README.md, "What the runner reads from
      # the check's lines"). A refused note set fails the job before its other checks run.
      - id: architecture-notes
        name: Check this repository's architecture notes with the composite action
        uses: ./.github/actions/architecture-check
      # A caller reads the count through env, never inside run:, and so does this step. It runs
      # only when the action succeeded, which without allow-empty means a valid set of one note or
      # more, so a count that is missing or not a positive whole number is the action's fault.
      - name: Read the note count the action hands to the job
        env:
          COUNT: ${{ steps.architecture-notes.outputs.count }}
        run: |
          if ! [[ $COUNT =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the architecture-check action's count output is '$COUNT', not a positive whole number"
            exit 1
          fi
          echo "The architecture-check action judged $COUNT notes."
      # The spec-file action, run over this repository's own .dispatch/spec (its default path) for
      # the reasons and in the place the architecture-note action above runs: every part of it is
      # exercised here, and it runs before this job's own setup-go. Its own setup-go adds the `go`
      # matcher again and it removes it again. Main holds no spec file yet, so the directory does
      # not exist and allow-empty reads it as the empty tree; a pull request that adds a spec file
      # is judged by every rule. A refused tree fails the job before its other checks run.
      - id: spec-files
        name: Check this repository's spec files with the composite action
        uses: ./.github/actions/spec-check
        with:
          allow-empty: 'true'
      # It runs only when the action succeeded: a valid tree, or with allow-empty the empty one, so
      # 0 is a count, and a count that is missing or not a whole number is the action's fault.
      - name: Read the statement count the spec-file action hands to the job
        env:
          COUNT: ${{ steps.spec-files.outputs.count }}
        run: |
          if ! [[ $COUNT =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the spec-check action's count output is '$COUNT', not a whole number"
            exit 1
          fi
          echo "The spec-check action read $COUNT statements."
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
      # The settings the service's command: asks for, read back from the server itself; envoy-go's
      # own read-back step says why a command is worth reading back.
      - name: Read the disposable service's settings back
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres.id }}" postgres
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # The Dispatch API's tests whose assertion is a wall-clock time measured in the test's own
      # process: its xid window tests, which judge each gap of a transaction's xid window against
      # storetest.XidMaxGap (5 ms). Main runs them in a step of their own with nothing else on the
      # runner; run beside envoy-go's other calls, one of them failed in each run of the pair at
      # c3e93e7e (runs 44476496859 and 44476544762). So they run alone, as this job's first test
      # step, while its Postgres service is quiet, and plain, since the detector stretches the gaps
      # past any bound. They are here rather than in envoy-go-race-api for this job's filter: the
      # API's plain test binary compiles its `//go:build !race` guard files whatever -run selects,
      # and what those read is every non-test file of packages/envoy, which this job's filter covers
      # already and envoy-go-race-api's, the closure of the API's race build, does not. So this
      # job's filter gains only two fixture paths the API's tests read, its live-feed fixtures and
      # the ask reply's copies (ci.yaml's envoy_go_checks), and the tests are off envoy-go's
      # critical path; they run on every push this job runs on, where envoy-go runs in the merge
      # queue and with `full-ci`. The -run list is
      # derived in .github/scripts/ci_job_reads.py (ALONE_PREFIX and ALONE_STEPS) from the race
      # lane's packages and their source, so an xid window test added there that this step lacks
      # fails the ci-filters job naming it. The database is on the step rather than in the job's
      # env:, so it reaches this step alone. With the xid window tests in one call, the API took
      # 134.082 s on a two-vCPU pod (INFRA-636), more than the 2m below. -timeout 2m, by R6 from
      # the pair at 8cfd2682 (envoy-go's comment gives the rule): this call's one package on the
      # slower run is internal/dispatch/api, 49.6 s (run 44657415021, job 136039517954), and
      # 49.6 / 30 = 1.65, so 2m. The `go test -json` stream goes to a file the upload step below
      # publishes and is replayed to the log, as the architecture-note step's is.
      - name: Test the wall-clock measurements alone
        env:
          DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        run: |
          mkdir -p "$RUNNER_TEMP/go-test-json"
          s=0
          go test -json -count=1 -p 1 -timeout 2m -run '^(TestXidWindowApprovalAnswerOverTwoDocuments|TestXidWindowAskAnswerBlock|TestXidWindowAskBlockEditThenIssueClose|TestXidWindowAskResolveBlock|TestXidWindowDeliveries|TestXidWindowDocumentRebuild|TestXidWindowIssueAskRepairRestoration|TestXidWindowIssueAskRepairWithdrawal|TestXidWindowRouteTable|TestXidWindowUploadRestoringTheApprovedText|TestXidWindowsOnTheLargeSpec)$' ./internal/dispatch/api > "$RUNNER_TEMP/go-test-json/alone-api.json" || s=$?
          if [ "$s" -eq 0 ]; then
            jq -rj 'select(.Action == "build-output" or (.Action == "output" and .Test == null)) | .Output' "$RUNNER_TEMP/go-test-json/alone-api.json"
          else
            jq -rj 'select(.Action == "build-output" or .Action == "output") | .Output' "$RUNNER_TEMP/go-test-json/alone-api.json"
          fi
          exit $s
        working-directory: packages/envoy
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not gofmt-formatted; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: packages/envoy
      # These five packages need no database, so they run here on every push. This is their one
      # run: envoy-go's unit step leaves them out, its `grep -Ev` and this step's package list
      # built from NOTE_AND_SPEC_PACKAGES in .github/scripts/ci_job_reads.py.
      #
      # -timeout 1m, by R6 from the pair at 8cfd2682 (envoy-go's comment gives the rule): this
      # call's slowest package on the slower run is cmd/spec-check, 20.0 s (run 44657322918, job
      # 136026780288), and 20.0 / 30 = 0.67, so 1m, the smallest whole minute there is.
      # The `go test -json` stream goes to a file the upload step below publishes and is replayed
      # to the log, as the display-tree fixture check's is.
      - name: Test the architecture-note and spec-file rules and their commands
        run: |
          mkdir -p "$RUNNER_TEMP/go-test-json"
          s=0
          go test -json -count=1 -timeout 1m ./internal/dispatch/architecture/notes/ ./internal/runnerlog/ ./internal/dispatch/specgraph/ ./cmd/architecture-check/ ./cmd/spec-check/ > "$RUNNER_TEMP/go-test-json/architecture-notes.json" || s=$?
          if [ "$s" -eq 0 ]; then
            jq -rj 'select(.Action == "build-output" or (.Action == "output" and .Test == null)) | .Output' "$RUNNER_TEMP/go-test-json/architecture-notes.json"
          else
            jq -rj 'select(.Action == "build-output" or .Action == "output") | .Output' "$RUNNER_TEMP/go-test-json/architecture-notes.json"
          fi
          exit $s
        working-directory: packages/envoy
      # listenerwire's tests and wirecheck's need no database, and listenerwire's clients test
      # type-checks the daemon's listener clients, so they run here, their one run, and a change to
      # only those daemon packages starts this job rather than envoy-go's: envoy-go's unit step
      # leaves both packages out, its `grep -Ev` and this step's package list built from
      # LISTENERWIRE_PACKAGES in .github/scripts/ci_job_reads.py. -timeout 1m, by R6 from the pair
      # at 8cfd2682 (envoy-go's comment gives the rule): this call's slowest package on the slower
      # run is internal/wirecheck, 2.3 s (run 44657322918, job 136026780288), and 2.3 / 30 = 0.08,
      # so 1m, the smallest whole minute there is. The `go test -json` stream goes to a file the
      # upload step below publishes and is replayed to the log, as the architecture-note step's is.
      - name: Test the listener's wire package, its clients and wirecheck
        run: |
          mkdir -p "$RUNNER_TEMP/go-test-json"
          s=0
          go test -json -count=1 -timeout 1m ./listenerwire/ ./internal/wirecheck/ > "$RUNNER_TEMP/go-test-json/listenerwire.json" || s=$?
          if [ "$s" -eq 0 ]; then
            jq -rj 'select(.Action == "build-output" or (.Action == "output" and .Test == null)) | .Output' "$RUNNER_TEMP/go-test-json/listenerwire.json"
          else
            jq -rj 'select(.Action == "build-output" or .Action == "output") | .Output' "$RUNNER_TEMP/go-test-json/listenerwire.json"
          fi
          exit $s
        working-directory: packages/envoy
      - name: Check Go contracts are generated from the shared schema
        run: bun run check:go
        working-directory: packages/contracts
      - name: Check the OpenAPI document is generated from the route table
        run: go run ./cmd/dispatch openapi --check
        working-directory: packages/envoy
      # No CI job compares the spec files with the approved spec: R2 of The Spec gives that
      # comparison at each push to Dispatch. The guard reads every file under .github/workflows,
      # .github/actions, .github/scripts and scripts as text, names each place where the command's
      # name and then the word compare follow each other, a comment or a quoted text too, and fails
      # on it. It does not find a command that an expansion, an escape or an alias builds, or one
      # with another word between the two. It fails when it read no workflow.
      - name: Check that no CI file of this repository compares the spec files
        run: go run ./cmd/spec-check guard --root ../..
        working-directory: packages/envoy
      - name: Check pmdoc fixtures are up to date
        run: bun run check
        working-directory: packages/envoy/internal/dispatch/pmdoc/gen
      # The fixture the web app's view tests draw (pmdoc/web_fixtures_test.go): a corpus text
      # whose display reading changed and a fixture nobody regenerated fails here rather than
      # leaving a view's test asserting against a stale tree. This is the one run of that test,
      # TestWebDisplayFixture, and of TestTheWebFixtureFindsItsFilesFromAnyDirectory, which stats
      # the same file: without `--check` the first writes the fixture instead of checking it, so
      # envoy-go's unit step skips both by the same names, both texts built from
      # WEB_FIXTURE_TESTS in .github/scripts/ci_job_reads.py.
      #
      # -timeout 1m, by R6 from the pair at 8cfd2682 (envoy-go's comment gives the rule): this
      # call's one package, internal/dispatch/pmdoc, read 0.026 s and 0.026 s (runs 44657322918
      # and 44657415021, jobs 136026780288 and 136039517954), and 0.026 / 30 = 0.001, so 1m, the
      # smallest whole minute there is. The `go test -json` stream goes to a file the
      # upload step below publishes and is replayed to the log, as the race lane's steps do, for
      # the reason envoy-go's unit step gives: the log keeps the package line of a green run and
      # the whole stream of a red one.
      - name: Check the web app's display-tree fixture is up to date
        run: |
          mkdir -p "$RUNNER_TEMP/go-test-json"
          s=0
          go test -json -count=1 -timeout 1m -run '^(TestTheWebFixtureFindsItsFilesFromAnyDirectory|TestWebDisplayFixture)$' ./internal/dispatch/pmdoc/ -args --check > "$RUNNER_TEMP/go-test-json/web-fixture.json" || s=$?
          if [ "$s" -eq 0 ]; then
            jq -rj 'select(.Action == "build-output" or (.Action == "output" and .Test == null)) | .Output' "$RUNNER_TEMP/go-test-json/web-fixture.json"
          else
            jq -rj 'select(.Action == "build-output" or .Action == "output") | .Output' "$RUNNER_TEMP/go-test-json/web-fixture.json"
          fi
          exit $s
        working-directory: packages/envoy
      - name: Isolation test for dev-broker.sh (fakes docker/go/curl; no real Postgres or network)
        run: bash scripts/dev-broker.test.sh
        working-directory: packages/envoy
      - name: Isolation test for dev-airlock.sh (fakes psql/go/curl; no real Postgres, network or Go build)
        run: bash scripts/dev-airlock.test.sh
        working-directory: packages/envoy
      - name: Required-input test for airlock-check.sh k7 (no stack or network)
        run: bash scripts/airlock-check.test.sh
        working-directory: packages/envoy
      - name: Isolation test for dev-stack.sh (fakes go/psql/curl/python3/docker; no real Postgres or network)
        run: bash scripts/dev-stack.test.sh
        working-directory: packages/envoy
      - name: Isolation test for project-secrets-check.sh (fakes the stack, curl, agent-secrets, bun and psql)
        run: bash scripts/project-secrets-check.test.sh
        working-directory: packages/envoy
      - name: Verdict test for callout-check.sh (fakes natsprobe and curl; no stack)
        run: bash scripts/callout-check.test.sh
        working-directory: packages/envoy
      - name: Reuse test for dev-postgres.sh (a fake docker; refuses a dispatch-pg off the pinned image)
        run: bash scripts/dev-postgres.test.sh
        working-directory: packages/envoy
      - name: Verdict test for listener-deploy-probe.sh (two fake listener tasks on 127.0.0.1 and 127.0.0.2)
        run: bash scripts/listener-deploy-probe.test.sh
        working-directory: packages/envoy
      - name: Verdict test for daemon-release-gate.sh (fakes gh and docker; no registry or GitHub)
        run: bash scripts/daemon-release-gate.test.sh
        working-directory: packages/envoy
      - name: One-run-at-a-time test for loadtest/run-step.sh and run-series.sh (fakes go and uv; no stack)
        run: bash loadtest/run-step.test.sh
        working-directory: packages/envoy
      - name: Lock test for loadtest/common.sh (inherited lock, refusals, holders in another PID namespace; no stack)
        run: bash loadtest/common.test.sh
        working-directory: packages/envoy
      - name: Test loadtest/cluster/cluster.sh (fakes kubectl, gh and curl; no cluster) and compare nats.yaml with a fresh render
        run: bash loadtest/cluster/cluster.test.sh
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, the load-test deployment's driver (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: bash loadtest/vm/vm.test.sh
        working-directory: packages/envoy
      - name: Test loadtest/vm/sample.sh, the VM sampler's reader (a prepared cgroup tree and /proc; no VMs)
        run: bash loadtest/vm/sample.test.sh
        working-directory: packages/envoy
      # The test runs its URL cases under en_US.UTF-8, where bash's [[ =~ ]] ranges reach past ASCII,
      # to hold the deployer's URL grammar to ASCII; it refuses to run without that locale.
      - name: Rollback and credential test for deploy/scripts/autodeploy.sh (fakes docker/jj/curl and a libpq client; the runner's docker compose resolves the compose file; no Postgres)
        run: |
          sudo locale-gen en_US.UTF-8
          bash deploy/scripts/autodeploy_test.sh
        working-directory: packages/envoy
      - name: Identity check test for deploy/scripts/up-dispatch.sh (fakes docker but for the runner's docker compose, which resolves the compose file)
        run: bash deploy/scripts/up-dispatch_test.sh
        working-directory: packages/envoy
      - name: Build envoy services
        run: go build ./cmd/dispatch ./cmd/listener
        working-directory: packages/envoy
      # A migration a database may already have run must keep its identity, or accept what such a
      # database records of it, its first identity and the base's text, in `-- replaces:` lines:
      # each runner refuses a database whose version table records what its file does not accept
      # (internal/pgmigrate, Reconcile), so an edit of an applied file, a comment included, is
      # caught here, before any database boots it. The base is what this run's tree lands onto,
      # and .github/scripts/edited-migrations-base.sh picks it, fetches it into this checkout, which
      # is one commit deep, and prints it. On a pull request and in the merge queue it is the first
      # parent of the commit the run checked out: of the pull request's merge commit, and of a
      # merge-group entry's commit (main, or the entry before it, whose own run checks its change).
      # On the bypass check's dispatch at main's tip after a push the queue never tested, which can
      # carry several commits, it is the commit main pointed at before that push (migration-base),
      # and a dispatch on main that names none fails here rather than compare the tip with its
      # parent alone. On a dispatch of any other branch that names none, a full run started by
      # hand, it is the branch's merge base with main. A push whose `before` is the all-zero
      # commit, or a commit GitHub no longer serves, fails the base's fetch, so the check fails
      # closed: an operator then dispatches the run again by hand with a base GitHub serves, the
      # newest commit of main the queue tested before the push, as
      # `gh workflow run ci.yaml --ref main -f migration-base=<that commit>`. The assignment of the
      # base is a line of its own, so under bash -e the script's exit, 2 included, is the step's.
      # The command is built and then run, not run through `go run`, which turns its exit 2, a
      # check that could not be taken, into an exit 1.
      - name: Check that no migration a database may have run is edited without its replaces line
        env:
          MIGRATION_BASE: ${{ inputs.migration-base }}
        run: |
          base=$(../../.github/scripts/edited-migrations-base.sh)
          go build -o "$RUNNER_TEMP/edited-migrations" ./internal/pgmigrate/cmd/edited-migrations
          "$RUNNER_TEMP/edited-migrations" --base "$base"
        working-directory: packages/envoy
      # Every package of the module, its tests included, as macOS compiles it: the agent-secrets
      # command ships for darwin (.github/agent-secrets-client-targets.json), and a file with no
      # build constraint that uses a symbol only a `//go:build linux` file defines compiles on this
      # runner and nowhere else. The vet runs once per tag set .github/scripts/go_build_tags.py
      # reads off the module's own build constraints, so a file under a tag that lands later, or
      # under a negated one, is vetted too rather than passed over in silence. One
      # darwin architecture is enough: no file of the module tells amd64 from arm64 on darwin.
      - name: Vet envoy for darwin, its tagged tests included
        run: |
          flags=$(python3 ../../.github/scripts/go_build_tags.py . darwin arm64)
          while IFS= read -r flag; do
            echo "Vetting for darwin with $flag"
            GOOS=darwin GOARCH=arm64 go vet "$flag" ./...
          done <<< "$flags"
        working-directory: packages/envoy
      # The release's archives (release-envoy-listener.yaml), THIRD_PARTY_NOTICES included. One
      # architecture's build and notices run beside the other's and nothing of either is the
      # other's input, so the step is as long as the slower of the two rather than their sum
      # (5.0 s and 5.5 s of a 10 s step, run 42307926510, dispatch://INFRA-1075). The archives
      # are written after both, in the target list's order, so the listing below reads as it
      # did. Under the runner's `bash -e` a failed `wait` ends the step, so an architecture that
      # did not build still fails it.
      - name: Pack envoy binaries
        run: |
          pids=()
          for arch in $(jq -r '.envoy[]' ../../.github/go-release-targets.json); do
            out="../../out/pr-artifacts/envoy-$arch"
            mkdir -p "$out"
            (
              GOOS=linux GOARCH=$arch go build -buildvcs=false -o "$out/envoy-listener" ./cmd/listener
              GOOS=linux GOARCH=$arch ../../scripts/go-third-party-notices.sh "$out/THIRD_PARTY_NOTICES" ./cmd/listener
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          for arch in $(jq -r '.envoy[]' ../../.github/go-release-targets.json); do
            out="../../out/pr-artifacts/envoy-$arch"
            tar czf "../../out/pr-artifacts/legion-envoy-$arch.tar.gz" -C "$out" envoy-listener THIRD_PARTY_NOTICES
            tar tzvf "../../out/pr-artifacts/legion-envoy-$arch.tar.gz"
          done
        working-directory: packages/envoy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legion-envoy-binaries-pr
          path: |
            out/pr-artifacts/legion-envoy-amd64.tar.gz
            out/pr-artifacts/legion-envoy-arm64.tar.gz
      # Always, and one artifact per run attempt, for the reasons envoy-go's own upload step gives.
      - name: Upload the go test -json stream
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envoy-go-checks-test-json-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-json/
          if-no-files-found: warn
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go-checks
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
