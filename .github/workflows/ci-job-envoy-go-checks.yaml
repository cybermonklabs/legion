name: CI job envoy-go-checks

# The steps of ci.yaml's `envoy-go-checks` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go-checks:
    runs-on: ubuntu-24.04
    # The builds below download the envoy module's dependencies and compile ./cmd/listener for
    # each release architecture, so the job restores go-envoy, the family whose entry holds that
    # same listener build (.github/workflows/ci-caches.yaml fills it on a push to main). Without
    # it the pack step would recompile the set per architecture from nothing on every push, which
    # is the runner time this change exists to cut.
    #
    # The limit is at least the job's sum over its 20 newest green merge-group runs up to
    # 2026-11-15: its other steps at their longest, 832 s (the cluster.sh test's 381 s and the
    # vm.sh test's 185 s among them), 6 s of its clock over them, and its two go test steps'
    # longest plus their -timeout, 9 s + 600 s and 8 s + 600 s: 2055 s, or 35 minutes.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The composite action other repositories call, run over this repository's own
      # .dispatch/architecture (its default path), so every part of it is exercised here before
      # another repository relies on it: its setup-go, its removal of setup-go's `go` problem
      # matcher, its path resolved against the workspace, its cache restore, and its count output,
      # which the next step reads. In a pull request and a merge group it restores its cache and
      # saves nothing (ci.yaml's header, "Caches"). It runs right after the checkout, before this
      # job's own setup-go, which adds setup-go's `go` problem matcher back for every later step
      # of the job: the placement "before the Go setup of the job" of the action's README.md, "The
      # Go toolchain". The checkout removes the problem matcher it adds before it ends, so no
      # matcher of an earlier step reads the check's lines (README.md, "What the runner reads from
      # the check's lines"). A refused note set fails the job before its other checks run.
      - id: architecture-notes
        name: Check this repository's architecture notes with the composite action
        uses: ./.github/actions/architecture-check
      # A caller reads the count through env, never inside run:, and so does this step. It runs
      # only when the action succeeded, which without allow-empty means a valid set of one note or
      # more, so a count that is missing or not a positive whole number is the action's fault.
      - name: Read the note count the action hands to the job
        env:
          COUNT: ${{ steps.architecture-notes.outputs.count }}
        run: |
          if ! [[ $COUNT =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the architecture-check action's count output is '$COUNT', not a positive whole number"
            exit 1
          fi
          echo "The architecture-check action judged $COUNT notes."
      # The spec-file action, run over this repository's own .dispatch/spec (its default path) for
      # the reasons and in the place the architecture-note action above runs: every part of it is
      # exercised here, and it runs before this job's own setup-go. Its own setup-go adds the `go`
      # matcher again and it removes it again. Main holds no spec file yet, so the directory does
      # not exist and allow-empty reads it as the empty tree; a pull request that adds a spec file
      # is judged by every rule. A refused tree fails the job before its other checks run.
      - id: spec-files
        name: Check this repository's spec files with the composite action
        uses: ./.github/actions/spec-check
        with:
          allow-empty: 'true'
      # It runs only when the action succeeded: a valid tree, or with allow-empty the empty one, so
      # 0 is a count, and a count that is missing or not a whole number is the action's fault.
      - name: Read the statement count the spec-file action hands to the job
        env:
          COUNT: ${{ steps.spec-files.outputs.count }}
        run: |
          if ! [[ $COUNT =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the spec-check action's count output is '$COUNT', not a whole number"
            exit 1
          fi
          echo "The spec-check action read $COUNT statements."
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-{0}-', runner.os) }}
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not gofmt-formatted; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: packages/envoy
      # These five packages need no database, so they run here on every push. This is their one
      # run: envoy-go's unit step leaves them out, its `grep -Ev` and this step's package list
      # built from NOTE_AND_SPEC_PACKAGES in .github/scripts/ci_job_reads.py. -timeout 10m
      # against a slowest package of 16.0 s, cmd/architecture-check, in two runs under 8 busy
      # loops on 2 CPUs at 4055c4a523 (builds Job legion-load-run-h2ndx, 2026-11-17).
      - name: Test the architecture-note and spec-file rules and their commands
        run: go test -count=1 -timeout 10m ./internal/dispatch/architecture/notes/ ./internal/runnerlog/ ./internal/dispatch/specgraph/ ./cmd/architecture-check/ ./cmd/spec-check/
        working-directory: packages/envoy
      - name: Check Go contracts are generated from the shared schema
        run: bun run check:go
        working-directory: packages/contracts
      - name: Check the OpenAPI document is generated from the route table
        run: go run ./cmd/dispatch openapi --check
        working-directory: packages/envoy
      # No CI job compares the spec files with the approved spec: R2 of The Spec gives that
      # comparison at each push to Dispatch. The guard reads every file under .github/workflows,
      # .github/actions, .github/scripts and scripts as text, names each place where the command's
      # name and then the word compare follow each other, a comment or a quoted text too, and fails
      # on it. It does not find a command that an expansion, an escape or an alias builds, or one
      # with another word between the two. It fails when it read no workflow.
      - name: Check that no CI file of this repository compares the spec files
        run: go run ./cmd/spec-check guard --root ../..
        working-directory: packages/envoy
      - name: Check pmdoc fixtures are up to date
        run: bun run check
        working-directory: packages/envoy/internal/dispatch/pmdoc/gen
      # The fixture the web app's view tests draw (pmdoc/web_fixtures_test.go): a corpus text
      # whose display reading changed and a fixture nobody regenerated fails here rather than
      # leaving a view's test asserting against a stale tree. This is the one run of that test,
      # TestWebDisplayFixture, and of TestTheWebFixtureFindsItsFilesFromAnyDirectory, which stats
      # the same file: without `--check` the first writes the fixture instead of checking it, so
      # envoy-go's unit step skips both by the same names, both texts built from
      # WEB_FIXTURE_TESTS in .github/scripts/ci_job_reads.py. -timeout 10m against a slowest run
      # of 0.021 s over this job's 20 newest green merge-group runs up to 2026-11-15, when the step
      # ran TestWebDisplayFixture alone.
      - name: Check the web app's display-tree fixture is up to date
        run: go test -count=1 -timeout 10m -run '^(TestTheWebFixtureFindsItsFilesFromAnyDirectory|TestWebDisplayFixture)$' ./internal/dispatch/pmdoc/ -args --check
        working-directory: packages/envoy
      - name: Isolation test for dev-broker.sh (fakes docker/go/curl; no real Postgres or network)
        run: bash scripts/dev-broker.test.sh
        working-directory: packages/envoy
      - name: Isolation test for dev-airlock.sh (fakes psql/go/curl; no real Postgres, network or Go build)
        run: bash scripts/dev-airlock.test.sh
        working-directory: packages/envoy
      - name: Isolation test for dev-stack.sh (fakes go/psql/curl/python3; no real Postgres or network)
        run: bash scripts/dev-stack.test.sh
        working-directory: packages/envoy
      - name: Reuse test for dev-postgres.sh (a fake docker; refuses a dispatch-pg off the pinned image)
        run: bash scripts/dev-postgres.test.sh
        working-directory: packages/envoy
      - name: Verdict test for listener-deploy-probe.sh (two fake listener tasks on 127.0.0.1 and 127.0.0.2)
        run: bash scripts/listener-deploy-probe.test.sh
        working-directory: packages/envoy
      - name: Verdict test for daemon-release-gate.sh (fakes gh and docker; no registry or GitHub)
        run: bash scripts/daemon-release-gate.test.sh
        working-directory: packages/envoy
      - name: One-run-at-a-time test for loadtest/run-step.sh and run-series.sh (fakes go and uv; no stack)
        run: bash loadtest/run-step.test.sh
        working-directory: packages/envoy
      - name: Lock test for loadtest/common.sh (inherited lock, refusals, holders in another PID namespace; no stack)
        run: bash loadtest/common.test.sh
        working-directory: packages/envoy
      - name: Test loadtest/cluster/cluster.sh (fakes kubectl, gh and curl; no cluster) and compare nats.yaml with a fresh render
        run: bash loadtest/cluster/cluster.test.sh
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, the load-test deployment's driver (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: bash loadtest/vm/vm.test.sh
        working-directory: packages/envoy
      - name: Test loadtest/vm/sample.sh, the VM sampler's reader (a prepared cgroup tree and /proc; no VMs)
        run: bash loadtest/vm/sample.test.sh
        working-directory: packages/envoy
      # The test runs its URL cases under en_US.UTF-8, where bash's [[ =~ ]] ranges reach past ASCII,
      # to hold the deployer's URL grammar to ASCII; it refuses to run without that locale.
      - name: Rollback and credential test for deploy/scripts/autodeploy.sh (fakes docker/jj/curl and a libpq client; no real Compose or Postgres)
        run: |
          sudo locale-gen en_US.UTF-8
          bash deploy/scripts/autodeploy_test.sh
        working-directory: packages/envoy
      - name: Build envoy services
        run: go build ./cmd/dispatch ./cmd/listener
        working-directory: packages/envoy
      # Every package of the module, its tests included, as macOS compiles it: the agent-secrets
      # command ships for darwin (.github/agent-secrets-client-targets.json), and a file with no
      # build constraint that uses a symbol only a `//go:build linux` file defines compiles on this
      # runner and nowhere else. The vet runs once per tag set .github/scripts/go_build_tags.py
      # reads off the module's own build constraints, so a file under a tag that lands later, or
      # under a negated one, is vetted too rather than passed over in silence. One
      # darwin architecture is enough: no file of the module tells amd64 from arm64 on darwin.
      - name: Vet envoy for darwin, its tagged tests included
        run: |
          flags=$(python3 ../../.github/scripts/go_build_tags.py . darwin arm64)
          while IFS= read -r flag; do
            echo "Vetting for darwin with $flag"
            GOOS=darwin GOARCH=arm64 go vet "$flag" ./...
          done <<< "$flags"
        working-directory: packages/envoy
      # The release's archives (release-envoy-listener.yaml), THIRD_PARTY_NOTICES included.
      - name: Pack envoy binaries
        run: |
          for arch in $(jq -r '.envoy[]' ../../.github/go-release-targets.json); do
            out="../../out/pr-artifacts/envoy-$arch"
            mkdir -p "$out"
            GOOS=linux GOARCH=$arch go build -buildvcs=false -o "$out/envoy-listener" ./cmd/listener
            GOOS=linux GOARCH=$arch ../../scripts/go-third-party-notices.sh "$out/THIRD_PARTY_NOTICES" ./cmd/listener
            tar czf "../../out/pr-artifacts/legion-envoy-$arch.tar.gz" -C "$out" envoy-listener THIRD_PARTY_NOTICES
            tar tzvf "../../out/pr-artifacts/legion-envoy-$arch.tar.gz"
          done
        working-directory: packages/envoy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legion-envoy-binaries-pr
          path: |
            out/pr-artifacts/legion-envoy-amd64.tar.gz
            out/pr-artifacts/legion-envoy-arm64.tar.gz
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go-checks
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
