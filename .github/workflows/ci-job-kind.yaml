        run: go test -v -count=1 -timeout 25m -run '^(TestStage4bStreamMoveOnTheKindRigLive)$' ./internal/daemon/
        working-directory: packages/daemon

      # A failed test's state, as tree-claude uploads its own.
      - name: Upload the rig's state at the failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-tree-stage4b-move-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kind-logs

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: kind
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
