name: CI job envoy-infra-go

# The steps of ci.yaml's `envoy-infra-go` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-infra-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/infra/go.mod
          cache: false
      # go-envoy-infra.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-infra-{0}-', runner.os) }}
      - name: Pull the NATS and Postgres test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
            packages/envoy/internal/testpg/testpg.go Image
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not gofmt-formatted; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: packages/envoy/infra
      - name: Vet envoy-infra, its live-test tags included
        run: go vet -tags pulumilive,natslive ./...
        working-directory: packages/envoy/infra
      # Every package of the module except internal/textcheck, whose tests are the text-check
      # job's: a change to only what they read must not start this job, and they must not run
      # twice. `go test ./...` cannot say "but one package", so the step lists the packages and
      # drops that one before go test sees them, as the envoy and daemon lanes do;
      # `set -o pipefail` is what makes a failed go list, or a pattern that matches every
      # package, fail the step rather than pass it with nothing tested. The pattern is built in
      # .github/scripts/ci_job_reads.py from the package name the text-check job's own steps are
      # built from. The vet step above still compiles the text checks, which keeps them
      # compiling as the module changes.
      - name: Unit test envoy-infra
        run: |
          set -o pipefail
          go list ./... | grep -Ev '/internal/textcheck$' | xargs go test -count=1
        working-directory: packages/envoy/infra
      - name: Live tests of envoy-infra against nats-server (natslive)
        # gcp's live tests build helm, nats-server, the config reloader and the exporter with go
        # install first, minutes on a cold cache, so the package gets more than go test's 10 m.
        # One call per package, never one union -run over the three: a name an untagged test of
        # one package shares with a natslive test of another would then run a second time with
        # nothing to say so. Each assignment is a line of its own, so under bash -e an empty or
        # refused list fails the step instead of running -run "", which matches every test.
        run: |
          for pkg in ./core ./seed ./gcp; do
            pattern=$(../../../.github/scripts/go-tagged-tests.sh natslive "$pkg")
            go test -count=1 -timeout 30m -tags natslive -run "$pattern" "$pkg"
          done
        working-directory: packages/envoy/infra
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-infra-go
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
