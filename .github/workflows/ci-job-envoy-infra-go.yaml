name: CI job envoy-infra-go

# The steps of ci.yaml's `envoy-infra-go` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-infra-go:
    runs-on: ubuntu-24.04-arm
    # Budget (ci-budgets.md's Budgets note): 1920 s, the 32 minutes main's #4518 gave this job for
    # its slowest measured runs below, plus its slowest retried step alone — the four `go install`s
    # of the live tests' tools, each 5 x 180 + 150 = 1050 s, so 4200 s, above both
    # packages/envoy/infra's own `go mod download` at 1050 s and the ci-ok report's 2160 s. That
    # step's own arithmetic is a whole number of minutes, so it takes one more (71), and this job
    # takes it with it: 1920 + 4260 = 6180 s -> 104 min, the whole minute above a sum that is itself
    # a whole number of minutes. It was 1200 + 4260 = 5460 s, 92 minutes, until main's #4518 put
    # the unit step under the race detector and raised the measured term from 20 minutes to 32.
    # The measured term (main's #4518) is the worst job measured plus half again. With a
    # go-envoy-infra entry filled for the run's module files (ci-caches.yaml's envoy-infra job,
    # whose arm64 leg compiles this job's race unit step), both vets take a second, the unit step
    # under -race 50 s, and the job 519 s (run 44565671151, from the entry a dispatched fill saved
    # on its branch); the live tests take most of it. With no entry at all, as after an eviction or
    # for a pull request whose module files main has not filled, everything compiles: the job took
    # 996 s, the two vets 175 and 162 s, the race unit step 234 s and the live tests 390 s (run
    # 44563221379, its restore forced to miss). The plain unit step took 28 to 34 s in nine runs of
    # 2026-11-19, so -race costs a run with no entry 200 s or more. The worst runs on record were
    # older: 959 and 1059 s for runs 44013632169 and 43996496498 on ubuntu-24.04, whose entry was
    # eleven days old and held no darwin objects. 1059 s and the 206 s the race compile adds at
    # most (234 s less 28 s) come to 1265 s, about 21 minutes, and half again is 1898 s, the 32
    # minutes of the measured term.
    timeout-minutes: 104
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/infra/go.mod
          cache: false
      # go-envoy-infra, under the key .github/workflows/ci-caches.yaml's envoy-infra job fills: the
      # runner's architecture, the Go version and the hash of the files that choose the module
      # versions, so a run whose module files main has already filled restores an entry built from
      # the same versions.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum') }}
          restore-keys: ${{ format('go-envoy-infra-{0}-{1}-', runner.os, runner.arch) }}
      # The infra module's own workspace, downloaded once and retried before the vet and the
      # tests below (ci-budgets.md's Retries note; the retried unit is the download, never the
      # build and never the test). 180 s per attempt: a cold `go mod download` of
      # packages/envoy/infra measured 113 s on an empty module cache on 2026-11-07, the slowest
      # of the three modules measured there, so the bound is 1.6 times it; an attempt it kills
      # leaves what it fetched in the module cache for the next one to resume from, which a
      # tarball fetch cannot do.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy/infra's Go modules" 180 -- go -C packages/envoy/infra mod download
      - name: Pull the NATS and Postgres test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
            packages/envoy/internal/testpg/testpg.go Image
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not gofmt-formatted; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: packages/envoy/infra
      - name: Vet envoy-infra, its live-test tags included
        run: go vet -tags pulumilive,natslive ./...
        working-directory: packages/envoy/infra
      # The same vet as macOS compiles the module: its commands ship for darwin
      # (.github/envoy-infra-targets.json), and a file with no build constraint that uses a symbol
      # only a `//go:build linux` file defines compiles on this runner and nowhere else. The vet
      # runs once per tag set .github/scripts/go_build_tags.py reads off the module's own build
      # constraints, so a file under a tag that lands later, or under a negated one, is vetted too.
      # One darwin architecture is enough: no file of the module tells amd64 from arm64 on darwin.
      - name: Vet envoy-infra for darwin, its live-test tags included
        run: |
          flags=$(python3 ../../../.github/scripts/go_build_tags.py . darwin arm64)
          while IFS= read -r flag; do
            echo "Vetting for darwin with $flag"
            GOOS=darwin GOARCH=arm64 go vet "$flag" ./...
          done <<< "$flags"
        working-directory: packages/envoy/infra
      # Every package of the module except internal/textcheck, whose tests are the text-check
      # job's: a change to only what they read must not start this job, and they must not run
      # twice. scripts/race-unit.sh lists the packages, drops that one and runs go test -count=1
      # -race over the rest; ci-caches.yaml's envoy-infra fill runs the same script's compile mode,
      # so the race objects the cache holds are the ones this step links, and neither caller can
      # name another package or flag than the other. .github/scripts/ci_job_reads.py pins this
      # step's run: and the script's pattern, which it builds from the package name the text-check
      # job's own steps are built from. The vet step above still compiles the text checks, which
      # keeps them compiling as the module changes.
      # Under the race detector: the gate's tests drive an httptest server from a child process,
      # whose handler shares state with the test, and two of them raced that way unseen while this
      # step ran without it. With the fill's entry the step took 50 s (run 44565671151); with none,
      # 234 s (run 44563221379), against 28 to 34 s for the plain step.
      - name: Unit test envoy-infra
        run: scripts/race-unit.sh run
        working-directory: packages/envoy/infra
      # gcp's live tests install helm, nats-server, the config reloader and the exporter with
      # `go install module@version`, which builds from each module's own go.mod and reads no
      # go.work, so the workspace download above covers none of it: four download sites inside a
      # `go test`. They come down here instead, through the one helper, and the test takes them
      # from LEGION_LIVE_TOOL_DIR rather than installing its own (dispatch://INFRA-1545).
      # One call per tool and no loop, because a loop's passes are what this repository's
      # download check cannot count, and a figure nobody can read is a budget nobody can check.
      - name: Download the tools envoy-infra's live tests run
        # Its own retry arithmetic: four installs, each 5 x 180 + 150 = 1050 s, so 4200 s, and
        # the budget stands strictly above it rather than level with it -> 71 min.
        timeout-minutes: 71
        run: |
          . .github/scripts/ci-retry.sh
          mkdir -p "$RUNNER_TEMP/live-tools"
          cd packages/envoy/infra
          export GOBIN="$RUNNER_TEMP/live-tools" GOWORK=off
          retry_fetch "helm v3.20.2" 180 -- go install helm.sh/helm/v3/cmd/helm@v3.20.2
          retry_fetch "nats-server v2.15.1" 180 -- go install github.com/nats-io/nats-server/v2@v2.15.1
          retry_fetch "the config reloader v0.24.0" 180 -- \
            go install github.com/nats-io/nack/cmd/nats-server-config-reloader@v0.24.0
          retry_fetch "the nats exporter v0.20.2" 180 -- \
            go install github.com/nats-io/prometheus-nats-exporter@v0.20.2
      - name: Live tests of envoy-infra against nats-server (natslive)
        env:
          LEGION_LIVE_TOOL_DIR: ${{ runner.temp }}/live-tools
        # The tools come down in the step above, so this step holds no retried call of its own.
        # One call per package, never one union -run over the three: a name an untagged test of
        # one package shares with a natslive test of another would then run a second time with
        # nothing to say so. Each assignment is a line of its own, so under bash -e an empty or
        # refused list fails the step instead of running -run "", which matches every test.
        run: |
          for pkg in ./core ./seed ./gcp; do
            pattern=$(../../../.github/scripts/go-tagged-tests.sh natslive "$pkg")
            go test -count=1 -timeout 30m -tags natslive -run "$pattern" "$pkg"
          done
        working-directory: packages/envoy/infra
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 2280 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 38
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-infra-go
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
