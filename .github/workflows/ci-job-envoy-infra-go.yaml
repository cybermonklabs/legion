name: CI job envoy-infra-go

# The steps of ci.yaml's `envoy-infra-go` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# Every go command of this workflow runs with the module proxy off (GOPROXY=off) and go.mod read
# only (GOFLAGS=-mod=readonly), so a module the cache its job restored lacks fails the step at once
# and names the module, where it would otherwise be downloaded while a test runs and fail the test
# whenever the module proxy or the checksum database fails, on a change that touched nothing it
# tests. A job's fetch step (.github/scripts/go-fetch.sh file, after its restore and before its
# first go step) is the one step that goes online, through GO_FETCH_PROXY, tried again on failure;
# a step that must go online and is no fetch step sets its own GOPROXY to GO_FETCH_PROXY, with a
# `go-offline:` line saying why. .github/scripts/go_offline_jobs.py holds every job to this.
# GO_FETCH_PROXY: a `|` between proxy entries makes a go command fall through to the next source
# after ANY error, where a `,` falls through only after a 404 or a 410 (Go's module reference,
# "GOPROXY protocol"). proxy.golang.org reset a download mid-stream and turned a Go lane red on a
# module whose hash go.sum already holds (sjawhar/legion#2512); with `|direct` the fetch takes the
# same bytes straight from the source and checks them against go.sum, so this is a second path,
# not a weaker check.
env:
  GO_FETCH_PROXY: https://proxy.golang.org|direct
  GOPROXY: "off"
  GOFLAGS: -mod=readonly

jobs:
  envoy-infra-go:
    runs-on: ubuntu-24.04-arm
    # The limit is the worst job measured plus half again. With a go-envoy-infra entry filled for
    # the run's module files (ci-caches.yaml's envoy-infra job, whose arm64 leg compiles this job's
    # race unit step), both vets take a second, the unit step under -race 50 s, and the job 519 s
    # (run 44565671151, from the entry a dispatched fill saved on its branch); the live tests take
    # most of it. With no entry at all, as after an eviction or for a pull request whose
    # module files main has not filled, everything compiles: the job took 996 s, the two vets
    # 175 and 162 s, the race unit step 234 s and the live tests 390 s (run 44563221379, its
    # restore forced to miss). The plain unit step took 28 to 34 s in nine runs of 2026-11-19, so
    # -race costs a run with no entry 200 s or more. The worst runs on record were older: 959 and
    # 1059 s for runs 44013632169 and 43996496498 on ubuntu-24.04, whose entry was eleven days old
    # and held no darwin objects. 1059 s and the 206 s the race compile adds at most (234 s less
    # 28 s) come to 1265 s, about 21 minutes, and half again is 1898 s, the 32 minutes here.
    timeout-minutes: 32
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/infra/go.mod
          cache: false
      # go-envoy-infra, under the key .github/workflows/ci-caches.yaml's envoy-infra job fills: the
      # runner's architecture, the Go version and the hash of the files that choose the module
      # versions - the infra workspace's module files, the root workspace's (the envoy commands
      # the tests build read them), the live tests' tool pins - of every fetch file its readers run
      # and of go-fetch.sh, so a run whose files main has already filled restores an entry that
      # holds what the fetch step below fetches.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'go.work', 'go.work.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/envoy-infra-go.txt', '.github/go-fetch/envoy-smoke.txt', 'packages/envoy/infra/gcp/testdata/live-tools.txt', 'scripts/go-third-party-notices-tools.txt', '.github/scripts/go-fetch.sh') }}
          restore-keys: ${{ format('go-envoy-infra-{0}-{1}-', runner.os, runner.arch) }}
      # No test of this job fetches anything while it runs: a fetch from the module proxy or the
      # checksum database inside a test fails that test whenever the service does, on a change
      # that touched nothing it tests (run 44317642380 failed so, on a `go install` of helm inside
      # gcp's TestClusteredNatsHubChart that could not read sum.golang.org). Every go step below
      # reads the module cache alone (GOPROXY=off, this file's env), so this step fetches what
      # they load first, from the module cache this job restored and tried again on failure: the
      # modules of both vets (linux with both live-test tags; darwin/arm64 with each tag set
      # .github/scripts/go_build_tags.py prints, a line of the fetch file each), of the unit and
      # natslive tests, the tools gcp's natslive tests run, which they take from
      # $(go env GOPATH)/legion-live-tools and never install (gcp/testdata/live-tools.txt), and the
      # modules of the envoy commands that heldportwrapper's unit test and core's and gcp's
      # natslive tests build under the repository's root go.work (cmdtest.BuildCommand).
      - name: Fetch the modules this job's go steps load
        run: .github/scripts/go-fetch.sh file .github/go-fetch/envoy-infra-go.txt
      - name: Pull the NATS and Postgres test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
            packages/envoy/internal/testpg/testpg.go Image
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not gofmt-formatted; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: packages/envoy/infra
      - name: Vet envoy-infra, its live-test tags included
        run: go vet -tags pulumilive,natslive ./...
        working-directory: packages/envoy/infra
      # The same vet as macOS compiles the module: its commands ship for darwin
      # (.github/envoy-infra-targets.json), and a file with no build constraint that uses a symbol
      # only a `//go:build linux` file defines compiles on this runner and nowhere else. The vet
      # runs once per tag set .github/scripts/go_build_tags.py reads off the module's own build
      # constraints, so a file under a tag that lands later, or under a negated one, is vetted too.
      # One darwin architecture is enough: no file of the module tells amd64 from arm64 on darwin.
      # go-offline: the one tag set go_build_tags.py prints (natslive,pulumilive) is fetched by go-fetch/envoy-infra-go.txt's GOOS=darwin GOARCH=arm64 deps line.
      - name: Vet envoy-infra for darwin, its live-test tags included
        run: |
          flags=$(python3 ../../../.github/scripts/go_build_tags.py . darwin arm64)
          while IFS= read -r flag; do
            echo "Vetting for darwin with $flag"
            GOOS=darwin GOARCH=arm64 go vet "$flag" ./...
          done <<< "$flags"
        working-directory: packages/envoy/infra
      # Every package of the module except internal/textcheck, whose tests are the text-check
      # job's: a change to only what they read must not start this job, and they must not run
      # twice. scripts/race-unit.sh lists the packages, drops that one and runs go test -count=1
      # -race over the rest; ci-caches.yaml's envoy-infra fill runs the same script's compile mode,
      # so the race objects the cache holds are the ones this step links, and neither caller can
      # name another package or flag than the other. .github/scripts/ci_job_reads.py pins this
      # step's run: and the script's pattern, which it builds from the package name the text-check
      # job's own steps are built from. The vet step above still compiles the text checks, which
      # keeps them compiling as the module changes.
      # Under the race detector: the gate's tests drive an httptest server from a child process,
      # whose handler shares state with the test, and two of them raced that way unseen while this
      # step ran without it. With the fill's entry the step took 50 s (run 44565671151); with none,
      # 234 s (run 44563221379), against 28 to 34 s for the plain step.
      - name: Unit test envoy-infra
        run: scripts/race-unit.sh run
        working-directory: packages/envoy/infra
      # go-offline: go-fetch/envoy-infra-go.txt's `deps packages/envoy/infra -test -tags natslive ./core ./seed ./gcp` fetches each package of the loop's list.
      - name: Live tests of envoy-infra against nats-server (natslive)
        # The 30 m -timeout dates from when gcp's live tests built helm, nats-server, the config
        # reloader and the exporter with go install first, minutes on a cold cache; the fetch step
        # installs them now, and the limit stays as headroom over go test's 10 m default.
        # One call per package, never one union -run over the three: a name an untagged test of
        # one package shares with a natslive test of another would then run a second time with
        # nothing to say so. Each assignment is a line of its own, so under bash -e an empty or
        # refused list fails the step instead of running -run "", which matches every test.
        run: |
          for pkg in ./core ./seed ./gcp; do
            pattern=$(../../../.github/scripts/go-tagged-tests.sh natslive "$pkg")
            go test -count=1 -timeout 30m -tags natslive -run "$pattern" "$pkg"
          done
        working-directory: packages/envoy/infra
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-infra-go
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
