name: CI job envoy-infra-go

# The steps of `.github/workflows/ci.yaml#envoy-infra-go` and `.github/workflows/ci.yaml#envoy-infra-build` jobs, in a file of their own.
# ci.yaml's job of each id calls this file and passes its own id as `job`, and the job of this
# file named for it runs while the other is skipped. Each caller keeps `needs: changes` and the
# whole `if:` that decides whether its job runs, so the `if:` here only picks which of the two
# that is. The two share a file because ci.yaml already calls as many reusable workflows as
# .github/scripts/check-workflow-files.sh allows it
# (.github/ci-notes/ci.md#two-jobs-that-call-one-file).
#
# The split is for the filters. Each job's filter names this file beside ci.yaml, so a change to
# these steps selects these two jobs alone, where a change to ci.yaml selects every job.
#
# The two are the halves of what was one job, and each runs every one of its steps wherever it
# runs. envoy-infra-build checks the module's format, vets it as linux and as darwin compile it
# and runs its unit tests under the race detector, which a pull request runs. envoy-infra-go runs
# the live tests against nats-server and Postgres, a slow suite: its `envoy_infra_go` output is
# held back on a pull request without the label full-ci or lane:envoy_infra_go, so it runs in
# the merge queue (.github/ci-notes/ci.md#which-lane-a-job-runs-in-the-pull-request-or-the-merge-queue).
#
# Each job's last step reports ci-ok for its caller: on a merge-group run the job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      job:
        description: >-
          The id of ci.yaml's job that calls this file, `envoy-infra-go` or `envoy-infra-build`:
          the job of this file of that id runs, and the other is skipped.
        type: string
        required: true
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-infra-go:
    if: inputs.job == 'envoy-infra-go'
    runs-on: ubuntu-24.04-arm
    # The limit the job ran under while it also held envoy-infra-build's steps: the worst job
    # measured plus half again. With no go-envoy-infra entry, as after an eviction or for a pull
    # request whose module files main has not filled, everything compiles: that job took 996 s,
    # of which the live tests took 390 s (run 44563221379, its restore forced to miss), and the
    # worst runs on record were 959 and 1059 s for runs 44013632169 and 43996496498 on
    # ubuntu-24.04, whose entry was eleven days old and held no darwin objects. 1059 s and the
    # 206 s the race compile added at most come to 1265 s, about 21 minutes, and half again is
    # 1898 s, the 32 minutes here. No run has measured this half alone yet, so the limit stays
    # the one it ran under.
    timeout-minutes: 32
    env:
      JOB_TIMEOUT_MINUTES: 32 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/infra/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy-infra, under the key .github/workflows/ci-caches.yaml's envoy-infra job fills: the
      # runner's architecture, the Go version and the hash of the files that choose the module
      # versions, so a run whose module files main has already filled restores an entry built from
      # the same versions. That fill builds the natslive binaries of the three packages below.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum') }}
          restore-keys: ${{ format('go-envoy-infra-{0}-{1}-', runner.os, runner.arch) }}
      - name: Pull the NATS and Postgres test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
            packages/envoy/internal/testpg/testpg.go Image
      - name: Live tests of envoy-infra against nats-server (natslive)
        # why: .github/ci-notes/ci.md#the-envoy-infra-module-its-own-workspace-and-its-live-tests
        run: scripts/natslive.sh ./core ./seed ./gcp
        working-directory: packages/envoy/infra
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-infra-go
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  envoy-infra-build:
    if: inputs.job == 'envoy-infra-build'
    runs-on: ubuntu-24.04-arm
    # The limit the two halves ran under as one job, whose derivation envoy-infra-go's comment
    # above gives. With a go-envoy-infra entry filled for the run's module files both vets take a
    # second and the unit step under -race 50 s (run 44565671151); with none, the two vets took
    # 175 and 162 s and the race unit step 234 s (run 44563221379). No run has measured this half
    # alone yet, so the limit stays the one it ran under.
    timeout-minutes: 32
    env:
      JOB_TIMEOUT_MINUTES: 32 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/infra/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy-infra, the entry envoy-infra-go restores, under the same key: ci-caches.yaml's
      # envoy-infra job fills it with both vets and this job's race unit step.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('packages/envoy/infra/go.work', 'packages/envoy/infra/go.work.sum', 'packages/envoy/infra/go.mod', 'packages/envoy/infra/go.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum') }}
          restore-keys: ${{ format('go-envoy-infra-{0}-{1}-', runner.os, runner.arch) }}
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not gofmt-formatted; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: packages/envoy/infra
      - name: Vet envoy-infra, its live-test tags included
        run: go vet -tags pulumilive,natslive ./...
        working-directory: packages/envoy/infra
      # The same vet as macOS compiles the module: its commands ship for darwin
      # (.github/envoy-infra-targets.json), and a file with no build constraint that uses a symbol
      # only a `//go:build linux` file defines compiles on this runner and nowhere else. The vet
      # runs once per tag set .github/scripts/go_build_tags.py reads off the module's own build
      # constraints, so a file under a tag that lands later, or under a negated one, is vetted too.
      # One darwin architecture is enough: no file of the module tells amd64 from arm64 on darwin.
      - name: Vet envoy-infra for darwin, its live-test tags included
        run: |
          flags=$(python3 ../../../.github/scripts/go_build_tags.py . darwin arm64)
          while IFS= read -r flag; do
            echo "Vetting for darwin with $flag"
            GOOS=darwin GOARCH=arm64 go vet "$flag" ./...
          done <<< "$flags"
        working-directory: packages/envoy/infra
      # Every package of the module except internal/textcheck, whose tests are the text-check
      # job's: a change to only what they read must not start this job, and they must not run
      # twice. scripts/race-unit.sh lists the packages, drops that one and runs go test -count=1
      # -race over the rest; ci-caches.yaml's envoy-infra fill runs the same script's compile mode,
      # so the race objects the cache holds are the ones this step links, and neither caller can
      # name another package or flag than the other. .github/scripts/ci_job_reads.py pins this
      # step's run: and the script's pattern, which it builds from the package name the text-check
      # job's own steps are built from. The vet step above still compiles the text checks, which
      # keeps them compiling as the module changes.
      # Under the race detector: the gate's tests drive an httptest server from a child process,
      # whose handler shares state with the test, and two of them raced that way unseen while this
      # step ran without it. With the fill's entry the step took 50 s (run 44565671151); with none,
      # 234 s (run 44563221379), against 28 to 34 s for the plain step.
      # These are the untagged tests of core, seed and gcp that envoy-infra-go's live step leaves
      # out by its -run, so ci_job_reads.py's TAG_RUNS holds this job's filter to every file that
      # step reads.
      - name: Unit test envoy-infra
        run: scripts/race-unit.sh run
        working-directory: packages/envoy/infra
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-infra-build
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
