# TEMPORARY, the INFRA-1075 concurrent-memory measurement: it answers one question and is then
# deleted with the branch it runs on. dispatch://INFRA-985's architect allows the race-impossible
# step of ci.yaml's envoy-go job to join the calls its unit step now runs at the same time only if
# the three documents memory bounds still hold in that concurrent shape: measured beside pmdoc's
# CPU-budget tests under busy-loop load, 20 runs of each bound in CI, no failure and no run within
# 15 per cent of its bound. Those three tests read runtime.MemStats.HeapAlloc after two forced
# collections and take the smallest of three readings
# (packages/envoy/internal/dispatch/docs/upload_memory_test.go:303-310), so each measures its own
# process; what this measures is whether a slow mark under contention lets the heap overshoot
# before the reading is taken.
#
# It runs on a push to the branch and on workflow_dispatch. GitHub offers a manual dispatch only
# for a workflow the default branch holds, and this one never reaches main, so the push trigger is
# what actually starts it; the dispatch entry is here for a run from a branch that has been merged
# nowhere, which is what the API's workflow dispatch by ref needs.
#
# No job of ci.yaml changes with this file, and nothing here is part of the merge gate: the four
# shards are the measurement, read from their logs and their artifact.
name: INFRA-1075 concurrent memory

on:
  push:
    branches: [legion/INFRA-1075]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Four shards of five runs: 20 runs of each of the three bounds. One job of 20 runs would not
  # fit an hour - a run of the three bounds measured 92 to 127 s on a two-core pod with nothing
  # beside it, and this one runs them under busy loops at twice the runner's cores with pmdoc's
  # CPU-budget tests beside them, so a run of two to five minutes is the expectation and ten the
  # pessimism: 20 of those is 50 to 200 minutes, five of them 12 to 50. fail-fast: false, because
  # a shard whose bound is exceeded is an answer and the other three are three quarters of the
  # sample; one cancelling the rest would throw them away.
  memory:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    # Five runs at ten minutes of pessimism each, the module download and the two test binaries
    # before them, and the pmdoc round still running when the last memory run ends.
    timeout-minutes: 60
    services:
      # ci.yaml's envoy-go postgres service, copied whole: the measurement must see the server
      # those tests see in the job this decides, down to the settings that make a clone cheap.
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The three bounds, and the pmdoc CPU-budget tests that run beside them. Spelled here rather
      # than in the step, so the two -run patterns are read at a glance.
      MEMORY_TESTS: ^(TestUploadsToARoomInUseKeepMemoryWithinTheBound|TestUploadsOverOpenAnchorsKeepMemoryWithinTheBound|TestARoomFedOnlyByAgentWritesKeepsMemoryWithinTheBound)$
      PMDOC_TESTS: ^(TestHeavyBodiesAtTheBlockCapAreStoredOrRefusedInTime|TestHeavyBodiesAtTheBlockCapParseInTimeProportionalToTheirLength|TestHeavyBodiesAtTheBodyCapParseAndEncodeInTimeProportionalToTheirLength)$
      RUNS_PER_SHARD: "5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # ci.yaml's envoy-go read-back step, copied: a command the runner does not pass through
      # leaves the server up on the image's defaults, and a measurement taken against a server
      # whose checkpoints are not the cheap ones answers for no job.
      - name: Read the disposable service's settings back
        run: |
          id="${{ job.services.postgres.id }}"
          failed=
          read_back=
          for want in fsync=off full_page_writes=off synchronous_commit=off max_connections=500 max_prepared_transactions=20; do
            setting=${want%%=*}
            value=$(docker exec "$id" psql -U postgres -Atc "show $setting")
            read_back="$read_back $setting=$value"
            [ "$value" = "${want#*=}" ] || { echo "::error::the Postgres service reports $setting=$value, not ${want#*=}"; failed=1; }
          done
          echo "$id:$read_back"
          [ -z "$failed" ] || exit 1
      # Both test binaries before the load starts, so no run is measured while the runner is
      # compiling for the other package.
      - name: Build the two test binaries
        run: |
          go test -c -o /dev/null ./internal/dispatch/docs/
          go test -c -o /dev/null ./internal/dispatch/pmdoc/
        working-directory: packages/envoy
      - name: Measure the three bounds in the concurrent shape
        run: |
          mkdir -p "$RUNNER_TEMP/measure"
          measured="$RUNNER_TEMP/measure/measured.txt"
          pmdoc_log="$RUNNER_TEMP/measure/pmdoc.log"
          : > "$measured"
          : > "$pmdoc_log"
          # Busy loops at twice the runner's cores, and pmdoc's CPU-budget tests round after
          # round beside them: the load the unit step would put beside these bounds if the
          # race-impossible step joined its concurrent calls. The loops are killed by the pids
          # this script captured, never by name, and the pmdoc loop stops at the sentinel file
          # the runs' end writes.
          loops=()
          cleanup() {
            touch "$RUNNER_TEMP/measure/stop"
            [ "${#loops[@]}" -eq 0 ] || kill "${loops[@]}" 2>/dev/null || true
          }
          trap cleanup EXIT
          cores=$(nproc)
          for _ in $(seq $((cores * 2))); do
            bash -c 'while :; do :; done' &
            loops+=("$!")
          done
          echo "shard ${{ matrix.shard }}: $cores cores, ${#loops[@]} busy loops (pids ${loops[*]})"
          (
            round=0
            until [ -e "$RUNNER_TEMP/measure/stop" ]; do
              round=$((round + 1))
              echo "=== pmdoc round $round ===" >> "$pmdoc_log"
              if go test -count=1 -timeout 30m -v -run "$PMDOC_TESTS" ./internal/dispatch/pmdoc/ >> "$pmdoc_log" 2>&1; then
                echo "=== pmdoc round $round: PASS ===" >> "$pmdoc_log"
              else
                echo "=== pmdoc round $round: FAIL ===" >> "$pmdoc_log"
              fi
            done
          ) &
          pmdoc=$!
          # One go test per run, the three bounds in one process as the race-impossible step runs
          # them. -v, because what each bound reports is a t.Logf: `BOUND retained=<the heap the
          # room kept> stored=<what its writes added to the store> bound=<stored + the room
          # allowance>` (requireWithinRoomBound, upload_memory_test.go). Each of those lines is
          # printed again below as a MEASURED line with the share of its bound the run used, and
          # a run that logs fewer than three fails the step: a bound whose test skipped - no
          # DISPATCH_TEST_DATABASE_URL, say - is no measurement at all.
          first=0
          for run in $(seq 1 "$RUNS_PER_SHARD"); do
            log="$RUNNER_TEMP/measure/memory-${{ matrix.shard }}-$run.log"
            s=0
            go test -count=1 -timeout 20m -v -run "$MEMORY_TESTS" ./internal/dispatch/docs/ > "$log" 2>&1 || s=$?
            awk -v shard="${{ matrix.shard }}" -v run="$run" '
              /^=== RUN / { test = $3 }
              / BOUND retained=/ {
                retained = ""; bound = ""
                for (i = 1; i <= NF; i++) {
                  n = index($i, "=")
                  if (substr($i, 1, n) == "retained=") { retained = substr($i, n + 1) }
                  if (substr($i, 1, n) == "bound=") { bound = substr($i, n + 1) }
                }
                if (bound + 0 > 0) {
                  used = 100 * retained / bound
                  printf "MEASURED shard=%s run=%s test=%s retained=%s bound=%s used=%.1f%% within15=%s\n",
                    shard, run, test, retained, bound, used, (used >= 85 ? "yes" : "no")
                }
              }' "$log" | tee -a "$measured"
            bounds=$(grep -c "^MEASURED shard=${{ matrix.shard }} run=$run " "$measured" || true)
            echo "shard ${{ matrix.shard }} run $run: exit $s, $bounds of 3 bounds measured"
            grep -E '^(--- (PASS|FAIL|SKIP)|ok |FAIL|PASS)' "$log" || true
            if [ "$s" -ne 0 ]; then
              echo "::error::shard ${{ matrix.shard }} run $run failed (exit $s); its whole log follows"
              cat "$log"
            elif [ "$bounds" -ne 3 ]; then
              echo "::error::shard ${{ matrix.shard }} run $run logged $bounds of the 3 bounds, so a test skipped or did not reach its measurement; its whole log follows"
              cat "$log"
              s=1
            fi
            [ "$first" -ne 0 ] || first=$s
          done
          touch "$RUNNER_TEMP/measure/stop"
          wait "$pmdoc" || true
          rounds=$(grep -c '^=== pmdoc round [0-9]* ===$' "$pmdoc_log" || true)
          pmdoc_failed=$(grep -c ': FAIL ===$' "$pmdoc_log" || true)
          echo "pmdoc CPU-budget rounds beside these runs: $rounds, of which failed: $pmdoc_failed"
          [ "$pmdoc_failed" -eq 0 ] || echo "::warning::$pmdoc_failed of $rounds pmdoc CPU-budget rounds failed under this load; the pmdoc log is in this shard's artifact"
          # Per bound: the runs of this shard, the largest share of its bound any of them used,
          # and how many came within 15 per cent of it. The decision wants no failure and none
          # at 85 per cent or above, over the 20 runs the four shards make together.
          summary=$(awk '
            {
              test = ""; used = ""; near = ""
              for (i = 1; i <= NF; i++) {
                n = index($i, "=")
                if (substr($i, 1, n) == "test=") { test = substr($i, n + 1) }
                if (substr($i, 1, n) == "used=") { used = substr($i, n + 1) + 0 }
                if (substr($i, 1, n) == "within15=") { near = substr($i, n + 1) }
              }
              runs[test]++
              if (runs[test] == 1 || used > peak[test]) { peak[test] = used }
              if (near == "yes") { close_calls[test]++ }
            }
            END {
              for (test in runs) {
                printf "SUMMARY test=%s runs=%d worst_used=%.1f%% within15=%d\n", test, runs[test], peak[test], close_calls[test] + 0
              }
            }' "$measured" | sort)
          echo "$summary"
          {
            echo "### shard ${{ matrix.shard }}: $RUNS_PER_SHARD runs of each bound, $rounds pmdoc rounds beside them ($pmdoc_failed failed)"
            echo
            echo '```'
            echo "$summary"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit "$first"
        working-directory: packages/envoy
      - name: Upload this shard's logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infra-1075-concurrent-memory-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/measure/
          if-no-files-found: warn
