name: CI job ci-filters

# The steps of `.github/workflows/ci.yaml#ci-filters` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  ci-filters:
    runs-on: ubuntu-24.04-arm
    # Budget (.github/ci-budgets.md#the-budgets-note): 600 s, the 10 minutes this job carried,
    # above its 63 s measured maximum, plus its slowest retried step alone — the ci-ok report:
    # its `gh api` reads of the jobs and of the queue's tip and the POST of the check run,
    # 3 x (5 x 30 + 150) = 900 s, and two calls of runner-shutdown.sh's check-run read and
    # annotations loop, 2 x (300 + 480) = 1560 s, 2460 s together (ci-budgets.md's Budgets note,
    # "The ci-ok report"), above the workspace's `go mod download` at 5 x 180 + 150 = 1050 s.
    # That is 600 + 2460 = 3060 s. The steps before the report took 74 s at most in three
    # merge-group runs on 2026-11-27 (the slowest, job 140285945501, at main's e40deb10), which
    # had no module download step, so that step counts at its 1050 s: 1124 s, and with the
    # report's rounded limit of 43 minutes, 2580 s, the second sum is the larger.
    # 1124 + 2580 = 3704 s -> 62 min.
    timeout-minutes: 62
    env:
      JOB_TIMEOUT_MINUTES: 62 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      - name: Check every CI filter matches every file its job reads
        run: .github/scripts/check-ci-filters.sh

      # The workspace's Go modules, which the testcontainers check below lists with their
      # third-party packages, downloaded once and retried before it (ci-budgets.md's Retries
      # note). Here rather than before the filter check above, whose go list runs with
      # GOPROXY=off over an empty module cache of its own and reads none of them. go.work binds
      # packages/daemon and packages/envoy, so `go mod download` at the root resolves both
      # modules' build list, as e2e.yaml's step of this name measures. 180 s per attempt, as that
      # note derives.
      - name: Download the Go modules this job builds
        if: ${{ !cancelled() }}
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's Go modules" 180 -- go mod download

      # testcontainers-go's package init reads every process on the machine at each start of a
      # binary that links it, so no command and no test binary that starts itself may link it
      # (the script's header says which binaries those are and why). Here because this job runs
      # on every change to Go code or a module file and already lists both modules. Unlike the
      # filter check above it lists with the module cache go fills as it needs, since a chain
      # through a third-party package is part of what it reads.
      - name: Check no command or self-starting test binary links testcontainers-go
        if: ${{ !cancelled() }}
        run: .github/scripts/testcontainers_links.py

      - name: Check every workflow file GitHub can read and its size
        if: ${{ !cancelled() }}
        run: .github/scripts/check-workflow-files.sh

      # actionlint 1.7.12, the copy .github/ci-images.yaml's actionlint row names, with
      # .github/actionlint.yaml; its shellcheck reads each inline run: body at warning severity.
      - name: Check every workflow file with actionlint
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm -e SHELLCHECK_OPTS=--severity=warning -v "$PWD:/repo" -w /repo
          ghcr.io/cybermonklabs/legion/ci@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -verbose -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Filepath}}:{{$err.Line}}:{{$err.Column}}: {{$err.Message}} [{{$err.Kind}}]\n{{end}}'

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 2580 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 43
        env:
          STEP_TIMEOUT_MINUTES: 43 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        uses: ./.github/actions/ci-ok-report
        with:
          job: ci-filters
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
