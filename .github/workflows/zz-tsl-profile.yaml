name: zz changes-job install A/B (throwaway, not for merge)
on:
  push:
    branches: [scratch/changes-tsl-profile]
permissions:
  contents: read
jobs:
  leg:
    strategy:
      fail-fast: false
      matrix:
        ref: [20ee90deba1e8af69a278a12c875dc4e86a6a548, 06d43bb841a158f04f9c5d9cbf54e9ec0d1f0847]
        rep: [1, 2, 3]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Install dependencies (timed)
        run: |
          s=$(date +%s.%N); bun install --frozen-lockfile --verbose > "$RUNNER_TEMP/install.log" 2>&1; rc=$?
          echo "TIME install $(echo "$(date +%s.%N) - $s" | bc) s exit $rc"
          grep -iE "native-preview|download|extract|packages installed" "$RUNNER_TEMP/install.log" | grep -iv "^\s*$" | tail -15 | cut -c1-200
          du -sm node_modules/@typescript 2>/dev/null
