name: zz changes-job levers A/B (throwaway, not for merge)
on:
  push:
    branches: [scratch/changes-tsl-profile]
permissions:
  contents: read
jobs:
  leg:
    strategy:
      fail-fast: false
      matrix:
        leg: [base, install, directives, both]
        rep: [1, 2, 3]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/go-install-archive.sh packages/daemon/go.mod
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Install dependencies
        if: matrix.leg == 'base' || matrix.leg == 'directives'
        run: bun install --frozen-lockfile
      - name: Compute every filter from what each job reads
        env:
          CI_TS_INSTALL: ${{ (matrix.leg == 'install' || matrix.leg == 'both') && '1' || '' }}
          CI_FAST_DIRECTIVES: ${{ (matrix.leg == 'directives' || matrix.leg == 'both') && '1' || '' }}
          PROF_LOG: ${{ runner.temp }}/prof.json
        run: |
          s=$(date +%s.%N)
          .github/scripts/ci-filters-generate.sh "$RUNNER_TEMP/ci-filters.yaml"
          echo "TIME generate $(echo "$(date +%s.%N) - $s" | bc) s"
          sha256sum "$RUNNER_TEMP/ci-filters.yaml" "$RUNNER_TEMP/ci-filters.computed.yaml" "$RUNNER_TEMP/ci-filters.computed.yaml.inputs"
          python3 - "$RUNNER_TEMP/prof.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          recs = sorted(d["recs"], key=lambda r: r["t0"])
          print(f"engine total {d['total']} s")
          for r in recs:
              if r["wall"] >= 0.4:
                  print(f"   {r['t0']:6.2f} +{r['wall']:5.2f} cpu {r['cpu']:5.2f}  {' '.join(r['args'])[:100]}")
          PY
