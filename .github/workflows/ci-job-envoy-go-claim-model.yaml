name: CI job envoy-go-claim-model

# The steps of `.github/workflows/ci.yaml#envoy-go-claim-model` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go-claim-model:
    runs-on: ubuntu-24.04
    # The step's -timeout must fire before the runner cancels the job, so a hung search prints the
    # dump that names it: the job's limit is the step's and ten minutes of checkout, setup, cache
    # restore and the package's test build. The step's -timeout is twice the 19 min 18 s the step
    # took on this runner (CLAIM_MODEL_TIMEOUT in .github/scripts/ci_job_reads.py).
    timeout-minutes: 50
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        # Its settings, its /dev/shm and its health check: .github/scripts/postgres-service-settings.sh's header.
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=1000 -c max_prepared_transactions=10
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-start-period 60s
          --health-start-interval 1s
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Load-bearing, not boilerplate: TestTheClaimModelsRulesAreTheSQLsRules opens the store
    # (storetest.Open), which skips the test when DISPATCH_TEST_DATABASE_URL is unset
    # (internal/dispatch/store/storetest/storetest.go), and a skip is a pass, so without the
    # service the model's rules would go unchecked against their SQL on a green run.
    env:
      JOB_TIMEOUT_MINUTES: 50 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy-test, restored only: this job builds the test binary of internal/dispatch/api,
      # which the entry .github/workflows/ci-caches.yaml fills with the test binary of every
      # package of the envoy module holds. It saves none.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-test-{0}-{1}-', runner.os, runner.arch) }}
      # The settings the service's command: line asks for, read back from the server; why each one
      # is .github/scripts/postgres-service-settings.sh's header.
      - name: Read the service's settings back
        timeout-minutes: 2
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres.id }}" postgres
      # The mention sender's claim model (TestTheMentionSenderClaimModel): every order, within
      # three claim-refresh periods, of the real sender's locked sections, statements and timers
      # with two comments' attempt rows, the delivery sweep and the outbox, the sender as built
      # and its blind control; and the test that holds the four claim rules the model restates
      # to the SQL they restate (TestTheClaimModelsRulesAreTheSQLsRules). Both carry
      # `//go:build !race`, since the detector slows the search about sevenfold, so the race job
      # of this package does not build them, and .github/scripts/ci_job_reads.py's
      # CLAIM_MODEL_TESTS builds this -run and leaves exactly these two out of envoy-go's plain
      # step. -v prints the model's table of states and checks to the log.
      - name: Search every order of the mention sender's claims
        run: go test -count=1 -timeout 40m -v -run '^(TestTheClaimModelsRulesAreTheSQLsRules|TestTheMentionSenderClaimModel)$' ./internal/dispatch/api
        working-directory: packages/envoy

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go-claim-model
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
