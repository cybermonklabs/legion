name: CI job airlock-lean

# The steps of `.github/workflows/ci.yaml#airlock-lean` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  airlock-lean:
    runs-on: ubuntu-24.04-arm
    # why: .github/ci-notes/ci-job-airlock-lean.md#the-jobs-budget
    # 1200 + 2460 = 3660 s -> 62 min.
    timeout-minutes: 62
    env:
      JOB_TIMEOUT_MINUTES: 62 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
      # The built model the two runs below compare the Go code against. Naming no file makes
      # FuzzAirlock, TestModelAgreesOnHostShapes and TestTheModelRefusesAHostlessEntry skip
      # (modelPath in internal/cipher/proxyrules/airlock_fuzz_test.go), and a skip is a pass, so the
      # build step checks the binary is there before those runs read this.
      AIRLOCK_MODEL: ${{ github.workspace }}/packages/envoy/internal/cipher/proxyrules/lean/.lake/build/bin/airlock-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # No Go cache family: the proxyrules package imports the standard library and internal/fold,
      # which imports nothing, so this job downloads no module and compiles no third-party code,
      # as envoy-go-race-api does.
      #
      # elan and the Lean toolchain it installs, under the ELAN_HOME
      # .github/actions/install-elan sets ($RUNNER_TEMP/elan, under the runner's work directory),
      # keyed on the runner's architecture, since elan and the toolchain are binaries of it, and on
      # the content of the lean-toolchain the model is built with. No restore-keys: an
      # entry of another toolchain is exactly what this key keeps out, and the toolchain step
      # below would download the named one anyway. .github/workflows/ci-caches.yaml fills it on a
      # push to main, as it fills every family this file restores.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: elan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/internal/cipher/proxyrules/lean/lean-toolchain') }}
      # install-elan's own retry arithmetic: one `ci_tools_fetch` of the release tarball, 1708 s
      # (ci-budgets.md's Budgets note) -> 29 min.
      - uses: ./.github/actions/install-elan
        timeout-minutes: 29
      # The toolchain lean-toolchain names, in a retried step of its own before `lake build`, so
      # the build downloads nothing: on a hit of the restore above it is already installed and
      # elan says so and fetches nothing, and on a miss this step downloads it.
      - name: Install the Lean toolchain lean-toolchain names
        # why: .github/ci-notes/ci-job-airlock-lean.md#the-lean-toolchain-step-and-its-bound
        # 5 x 120 + 150 = 750 s -> 13 min.
        timeout-minutes: 13
        run: |
          . .github/scripts/ci-retry.sh
          toolchain=$(cat packages/envoy/internal/cipher/proxyrules/lean/lean-toolchain)
          retry_fetch "the Lean toolchain $toolchain" 120 -- elan toolchain install "$toolchain" >&2
      - name: Build the Lean model
        run: |
          lake build
          test -x .lake/build/bin/airlock-model
        working-directory: packages/envoy/internal/cipher/proxyrules/lean
      # What the three axioms are, and why fewer theorems printed than the model has is a
      # failure, is in the script. Check k15 of packages/envoy/scripts/airlock-check.sh runs the
      # same one, so the rule and the count it holds are written once.
      - name: Print the theorems' axioms
        run: bash packages/envoy/scripts/airlock-lean-axioms.sh packages/envoy/internal/cipher/proxyrules/lean
      # The committed seed corpus (testdata/fuzz/FuzzAirlock): every seed through both sides; the
      # host shapes a rules file may hold, which no seed decodes to, through both validations; and
      # a host-less entry, which both validations refuse and a proxy request for which both
      # refuse as a secret not behind the airlock.
      - name: Compare the Go airlock with the model over the seed corpus
        run: go test -v -run '^(FuzzAirlock|TestModelAgreesOnHostShapes|TestTheModelRefusesAHostlessEntry)$' ./internal/cipher/proxyrules/
        working-directory: packages/envoy
      - name: Fuzz the Go airlock against the model
        run: go test -fuzz FuzzAirlock -fuzztime=120s -run FuzzAirlock ./internal/cipher/proxyrules/
        working-directory: packages/envoy

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 2580 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 43
        env:
          STEP_TIMEOUT_MINUTES: 43 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        uses: ./.github/actions/ci-ok-report
        with:
          job: airlock-lean
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
