name: CI job airlock-lean

# The steps of ci.yaml's `airlock-lean` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# Every go command of this workflow runs with the module proxy off (GOPROXY=off) and go.mod read
# only (GOFLAGS=-mod=readonly), so a module the cache its job restored lacks fails the step at once
# and names the module, where it would otherwise be downloaded while a test runs and fail the test
# whenever the module proxy or the checksum database fails, on a change that touched nothing it
# tests. A job's fetch step (.github/scripts/go-fetch.sh file, after its restore and before its
# first go step) is the one step that goes online, through GO_FETCH_PROXY, tried again on failure;
# a step that must go online and is no fetch step sets its own GOPROXY to GO_FETCH_PROXY, with a
# `go-offline:` line saying why. .github/scripts/go_offline_jobs.py holds every job to this.
# GO_FETCH_PROXY: a `|` between proxy entries makes a go command fall through to the next source
# after ANY error, where a `,` falls through only after a 404 or a 410 (Go's module reference,
# "GOPROXY protocol"). proxy.golang.org reset a download mid-stream and turned a Go lane red on a
# module whose hash go.sum already holds (sjawhar/legion#2512); with `|direct` the fetch takes the
# same bytes straight from the source and checks them against go.sum, so this is a second path,
# not a weaker check.
env:
  GO_FETCH_PROXY: https://proxy.golang.org|direct
  GOPROXY: "off"
  GOFLAGS: -mod=readonly

jobs:
  airlock-lean:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      # The built model the two runs below compare the Go code against. Naming no file makes
      # FuzzAirlock, TestModelAgreesOnHostShapes and TestTheModelReadsAHostlessEntryWithGuidance skip
      # (internal/broker/airlock/airlock_fuzz_test.go:32-46), and a skip is a pass, so the build
      # step checks the binary is there before those runs read this.
      AIRLOCK_MODEL: ${{ github.workspace }}/packages/envoy/internal/broker/airlock/lean/.lake/build/bin/airlock-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # go-envoy, the module and build cache .github/workflows/ci-caches.yaml fills for the envoy
      # lanes on this runner, keyed on the root workspace's module files, on every fetch file its
      # readers run and on go-fetch.sh, so an entry holds what the fetch step below fetches. The
      # airlock package imports the standard library and internal/fold, which imports nothing, so
      # the two go steps below build no third-party code; their go test still loads the
      # workspace's module graph, which reads the go.mod of each module it requires, and with the
      # module proxy off a go.mod the cache lacks fails them. A pull request that changes one of the
      # hashed files restores the newest entry by prefix, which the fetch step tops up.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.work', 'go.work.sum', 'packages/envoy/go.mod', 'packages/envoy/go.sum', 'packages/daemon/go.mod', 'packages/daemon/go.sum', '.github/go-fetch/airlock-lean.txt', '.github/go-fetch/broker-multiprocess.txt', '.github/go-fetch/dispatch-browser-embedder.txt', '.github/go-fetch/dispatch-memory.txt', '.github/go-fetch/dispatch-multiprocess.txt', '.github/go-fetch/envoy-e2e-local.txt', '.github/go-fetch/envoy-go-checks.txt', '.github/go-fetch/envoy-go-docs-finalizers.txt', '.github/go-fetch/envoy-go-race-api.txt', '.github/go-fetch/envoy-go-race-docs.txt', '.github/go-fetch/envoy-go-race.txt', '.github/go-fetch/envoy-session-stall.txt', '.github/go-fetch/listener-server-change.txt', 'packages/envoy/loadtest/cluster/tools.txt', '.github/scripts/go-fetch.sh') }}
          restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
      # Every go step below reads the module cache alone (GOPROXY=off, this file's env): this step
      # fetches what they load first, tried again on failure.
      - name: Fetch the modules this job's go steps load
        run: .github/scripts/go-fetch.sh file .github/go-fetch/airlock-lean.txt
      # elan and the Lean toolchain it installs, under the ELAN_HOME
      # .github/actions/install-elan sets ($RUNNER_TEMP/elan, under the runner's work directory),
      # keyed on the runner's architecture, since elan and the toolchain are binaries of it, and on
      # the content of the lean-toolchain the model is built with. No restore-keys: an
      # entry of another toolchain is exactly what this key keeps out, and `lake` would download
      # the named one anyway. .github/workflows/ci-caches.yaml fills it on a push to main, as it
      # fills every family this file restores.
      - id: elan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/envoy/internal/broker/airlock/lean/lean-toolchain') }}
      - uses: ./.github/actions/install-elan
      - name: Build the Lean model
        run: |
          lake build
          test -x .lake/build/bin/airlock-model
        working-directory: packages/envoy/internal/broker/airlock/lean
      # What the three axioms are, and why fewer theorems printed than the model has is a
      # failure, is in the script. Check k15 of packages/envoy/scripts/airlock-check.sh runs the
      # same one, so the rule and the count it holds are written once.
      - name: Print the theorems' axioms
        run: bash packages/envoy/scripts/airlock-lean-axioms.sh packages/envoy/internal/broker/airlock/lean
      # The committed seed corpus (testdata/fuzz/FuzzAirlock): every seed through both sides; the
      # host shapes a rules file may hold, which no seed decodes to, through both validations; and
      # a host-less entry carrying guidance, a field the generator never writes.
      - name: Compare the Go airlock with the model over the seed corpus
        run: go test -v -run '^(FuzzAirlock|TestModelAgreesOnHostShapes|TestTheModelReadsAHostlessEntryWithGuidance)$' ./internal/broker/airlock/
        working-directory: packages/envoy
      - name: Fuzz the Go airlock against the model
        run: go test -fuzz FuzzAirlock -fuzztime=120s -run FuzzAirlock ./internal/broker/airlock/
        working-directory: packages/envoy

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: airlock-lean
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
