name: probe-cancel
on:
  push:
    branches: ['probe/infra1066-cancel']
permissions: {}
jobs:
  long:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Sleep
        run: sleep 240
      - name: Always marker
        if: always()
        run: echo "PROBE_ALWAYS_STEP_RAN"
  cutoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Sleep past the limit
        run: sleep 300
  follower:
    needs: [cutoff]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "PROBE_FOLLOWER_SEES result=${{ needs.cutoff.result }} attempt=${{ github.run_attempt }}"
  rerun-guard:
    if: ${{ github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "PROBE_RERUN_GUARD ran at attempt ${{ github.run_attempt }}"
