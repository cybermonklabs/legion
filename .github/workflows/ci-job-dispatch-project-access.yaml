name: CI job dispatch-project-access

# The steps of ci.yaml's `dispatch-project-access` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The private-projects acceptance drivers, from packages/dispatch. project-access.sh --all-public
# (verification's c-a-private-reads) seeds PUB and PRIV, every project public, and holds bob,
# carol and carol's PRIV token to finding each object of PRIV and nothing of PUB, no agent outside
# PRIV and no direct message that is not their own. project-access.sh --private-by-sql makes PRIV
# private by the store write the switch makes, where the switch, its preconditions met, answers
# 409 PRIVATE_PROJECTS_UNAVAILABLE until the private-hub admission proof it needs runs, and runs
# every section that needs a private project: each caller PRIV is hidden from reads every route
# of the route table, the sockets, search and the GitHub proxy, and writes every write route, and is
# answered as for an id nobody holds. project-access-blob.sh (c-blob-unchanged) builds the merge
# base beside this tree through scripts/e2e/lib/two-builds.sh, seeds each alike on a database of
# its own with every project public, and fails on any answer a caller reads differently at the
# two, and on any list it reads that holds no row.
# The merge base is the commit this run tests the change against: the merge group's base, else
# the first parent of the commit checked out, which on a pull request is the merge commit's base
# and on a dispatched run the commit before main's tip. two-builds.sh takes its tree with
# `git archive`, so the checkout holds the whole history (fetch-depth 0). The driver runs on its
# own rather than under e2e/acceptance/with-harness.sh, whose stack it does not read: it starts
# both servers and a fake Envoy itself, and reads the service only to make and drop its two
# databases, so the step makes the database it names, with the vector extension the driver's
# shared prerequisites ask of it.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  dispatch-project-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/dispatch_project_access?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      - uses: ./.github/actions/setup-bun
      # The fake Envoy both servers read runs under Bun and imports the contracts.
      - run: bun install --frozen-lockfile
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      - name: Make the driver's database
        run: |
          psql "postgres://postgres:ci@localhost:5432/postgres" -c 'create database dispatch_project_access'
          psql "$DATABASE_URL" -c 'create extension vector'
      - name: Read PRIV's objects as its listed callers, every project public
        run: bash e2e/acceptance/project-access.sh --all-public
        working-directory: packages/dispatch
      - name: Read and write every route as the callers PRIV is hidden from, PRIV made private by the store write
        run: bash e2e/acceptance/project-access.sh --private-by-sql
        working-directory: packages/dispatch
      - name: Compare what every caller reads at the merge base and at this tree
        run: |
          base=$(jq -r '.merge_group.base_sha // empty' "$GITHUB_EVENT_PATH")
          base=${base:-$(git rev-parse HEAD^1)}
          bash e2e/acceptance/project-access-blob.sh --base-commit "$base"
        working-directory: packages/dispatch

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: dispatch-project-access
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
