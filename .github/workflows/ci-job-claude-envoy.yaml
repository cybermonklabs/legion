name: CI job claude-envoy

# The steps of ci.yaml's `claude-envoy` job, in a file of its own, and the private-name check of
# the plugin it packs in a job after it (private-names, below).
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# Each job's last step reports ci-ok for the caller: on a merge-group run its own result decides,
# it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of ci.yaml ends.
# `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true
    secrets:
      PRIVATE_NAME_TERMS:
        description: >-
          The deployment's own private names, one a line, which the private-names job below
          checks the packed plugin for (.github/scripts/check-private-names.sh's fifth rule).
        required: false

jobs:
  claude-envoy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # tests/answers-claude.test.ts runs the pinned Claude Code against a stand-in Messages
      # endpoint and Dispatch, and refuses on GitHub Actions without one. The pin is read from
      # .claude-code-pin, the repository's one copy of it (.github/actions/install-claude-code).
      - uses: ./.github/actions/install-claude-code
      # tests/codex-real.test.ts runs the plugin's Codex build on the pinned Codex CLI against a
      # stand-in Responses API, and refuses on GitHub Actions without one. The pin is read from
      # .codex-pin, the repository's one copy of it (.github/actions/install-codex).
      - uses: ./.github/actions/install-codex
      - run: bun install --frozen-lockfile
      - name: Lint Claude Envoy plugin
        run: bun run lint
        working-directory: packages/claude-envoy
      - name: Typecheck Claude Envoy plugin
        run: bun run typecheck
        working-directory: packages/claude-envoy
      # Nothing commits dist/ or legion/: release.yaml's claude_envoy_build builds them and packs
      # them into the tarball it publishes to npm. So this builds and checks them from the head's
      # source as that job does: packages/claude-envoy/scripts/verify-build.sh.
      - name: Build, check and pack the plugin as the release does
        run: bun run verify-build "$RUNNER_TEMP/claude-envoy-built.tar"
        working-directory: packages/claude-envoy
      # The pack step packs the package's own dist/ and legion/ (release-push.sh extract-built).
      - name: Put the checked build into CI's checkout for the pack
        run: .github/scripts/release-push.sh extract-built "$RUNNER_TEMP/claude-envoy-built.tar"
      # tests/send-arguments.test.ts runs envoy-send's printed resend command under bash and under
      # zsh, whose EQUALS option reads a bare `=word` as a path, and fails the zsh row on CI where
      # zsh is missing; the runner image has no zsh.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: Test Claude Envoy plugin
        run: bun run test
        working-directory: packages/claude-envoy
      - name: Pack Claude Envoy plugin
        run: bun pm pack --destination ../../out/pr-artifacts
        working-directory: packages/claude-envoy
      # The Codex plugin's package, built from the checked dist/ and packed and checked as
      # release.yaml's claude_envoy_build does, into the same artifact.
      - name: Build, pack and check the Codex plugin as the release does
        run: |
          bun scripts/build.ts --codex-out "$RUNNER_TEMP/codex-envoy" --dist dist
          (cd "$RUNNER_TEMP/codex-envoy" && bun pm pack --destination "$GITHUB_WORKSPACE/out/pr-artifacts")
          scripts/check-packed-skills.sh "$GITHUB_WORKSPACE"/out/pr-artifacts/sjawhar-codex-envoy-*.tgz
        working-directory: packages/claude-envoy
      # `overwrite` lets a re-run of this job replace its first attempt's copy, which the
      # private-names job below reads (the Claude Code plugin's tarball; the action says why the
      # Codex one beside it is passed over).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-envoy-pr
          path: out/pr-artifacts/*.tgz
          overwrite: true

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: claude-envoy
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  # The packed plugin's dist/ and legion/ name nothing private: the private-name check that
  # packages/claude-envoy/scripts/verify-build.sh leaves out, over the very bytes it tarred, which
  # the job above put into the package (release-push.sh extract-built) and packed. A job of its
  # own, because the check reads the deployment's term list (PRIVATE_NAME_TERMS) and no job that
  # runs dependency code holds it: this one checks out the .github cone and runs
  # .github/actions/private-names-packed-plugin, which downloads the tarball, lays its two
  # directories out and runs the check, and nothing else. release.yaml's claude_envoy_names runs
  # the same action over the tarball the release publishes.
  private-names:
    needs: claude-envoy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: ./.github/actions/private-names-packed-plugin
        with:
          artifact: claude-envoy-pr
          private-name-terms: ${{ secrets.PRIVATE_NAME_TERMS }}
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: claude-envoy
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
