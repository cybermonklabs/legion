name: CI caches (changes job)

# Fills, on every push to main, the two cache entries ci.yaml's changes job restores: changes-git,
# main's objects one commit deep, which its checkout fetches only this run's additions to, and
# ci-filters, the filters the pushed commit's own generation computes, which its generation reads
# in place of generating the base tree again when it is measured against that commit. A file of its
# own beside ci-caches.yaml, which is near check-workflow-files.sh's byte limit.
# why: .github/ci-notes/ci-caches.md#the-two-entries-the-changes-job-restores
on:
  push:
    branches: [main]
  workflow_dispatch:

# One fill at a time per ref, and no cancellation, as ci-caches.yaml's: a superseded fill's
# delete then never meets a newer fill's save, and a waiting fill is replaced by a newer push's.
concurrency:
  group: ci-caches-changes-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ubuntu-24.04-arm, the changes job's runner: go list answers for the machine's own platform, so
  # the filters of an x86_64 runner could differ, and the cache keys carry the architecture.
  fill:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      changes-git: ${{ steps.saved.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A ref of a name actions/checkout never removes, so the reader's fetch offers this commit
      # as one it has and is sent only what its own commit adds: the checkout removes a remote
      # branch that conflicts with the ref it checks out, and its fetch offers refs alone, never a
      # detached HEAD (ci-caches.md says what a run without such a ref fetched).
      - name: Keep this commit under a ref of its own
        run: git update-ref refs/ci-cache/main HEAD
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git
          key: changes-git-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
      - name: Name the changes-git key this job saved
        id: saved
        env:
          KEY: changes-git-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        run: echo "key=$KEY" >>"$GITHUB_OUTPUT"

      # The commit whose filters the entry holds, named as the changes job's restore names its base.
      - name: Name this commit as the base the entry is for
        id: base
        run: echo "sha=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
      - id: ci-filters
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-filters-base
          key: ci-filters-${{ runner.os }}-${{ runner.arch }}-${{ steps.base.outputs.sha }}
          lookup-only: true
      - name: Install the Go packages/daemon/go.mod names
        if: steps.ci-filters.outputs.cache-hit != 'true'
        run: .github/scripts/go-install-archive.sh packages/daemon/go.mod
      - name: Setup Bun
        if: steps.ci-filters.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-bun
      - name: Install dependencies
        if: steps.ci-filters.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      # The command the changes job runs on a base tree (ci-filters-generate.sh), into the directory
      # it reads, with the commit it was computed for: the job reads the file only for that commit.
      - name: Compute this commit's filters
        if: steps.ci-filters.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ci-filters-base"
          .github/scripts/check-ci-filters.sh generate "$RUNNER_TEMP/ci-filters-base/ci-filters.yaml"
          rm "$RUNNER_TEMP/ci-filters-base/ci-filters.yaml.inputs"
          git rev-parse --verify "HEAD^{commit}" >"$RUNNER_TEMP/ci-filters-base/commit"
      - if: steps.ci-filters.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-filters-base
          key: ${{ steps.ci-filters.outputs.cache-primary-key }}

  # The changes-git entries of this ref the new one supersedes, older than it, deleted, as
  # ci-caches.yaml's refill-superseded job deletes its families': one entry of 96 MB stays.
  # why: .github/ci-notes/ci-caches.md#what-the-refill-superseded-job-deletes-and-why-it-is-a-job-of-its-own
  superseded:
    needs: fill
    if: needs.fill.outputs.changes-git != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      JOB_TIMEOUT_MINUTES: 5 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    permissions:
      actions: write
    steps:
      # For .github/scripts/gh-read.sh alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Delete this ref's changes-git entries older than the new one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ needs.fill.outputs.changes-git }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          source .github/scripts/gh-read.sh
          base=${KEEP%"-$SHA"}
          if [ "$base-$SHA" != "$KEEP" ]; then
            echo "::error::the changes-git key the fill saved does not end in this run's commit, so nothing is deleted"
            exit 1
          fi
          entries=$(gh_wait_reset gh cache list --ref "$REF" --key "$base-" --sort created_at --order desc --limit 100 --json id,key,ref,createdAt)
          kept=$(jq -r --arg keep "$KEEP" --arg ref "$REF" 'first(.[] | select(.key == $keep and .ref == $ref) | .createdAt) // ""' <<<"$entries")
          if [ -z "$kept" ]; then
            echo "::warning::the new changes-git entry is not among this ref's entries, so none is deleted"
            exit 0
          fi
          jq -r --arg kept "$kept" --arg base "$base-" --arg ref "$REF" \
            '.[] | select(.ref == $ref and (.key | startswith($base)) and .createdAt < $kept) | .id' <<<"$entries" |
            while read -r id; do
              if ! [[ $id =~ ^[0-9]+$ ]]; then
                echo "::error::the cache list gave an id that is not a number, so nothing more is deleted"
                exit 1
              fi
              echo "Deleting changes-git entry $id, which the new entry supersedes"
              gh_wait_reset gh cache delete "$id"
            done
