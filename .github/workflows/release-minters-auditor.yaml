name: Release Minter Auditor

# The minter auditor's image, published as the worker image is (worker-image.yaml): a main push
# builds and pushes its sha- tag, and a job of its own attests the pushed digest with GitHub's
# artifact attestation, whose Sigstore certificate names this workflow on refs/heads/main. A
# consumer pins the digest and checks it with
#   gh attestation verify oci://ghcr.io/cybermonklabs/legion/minters-auditor@sha256:<digest> \
#     --repo cybermonklabs/legion --source-ref refs/heads/main \
#     --cert-identity https://github.com/cybermonklabs/legion/.github/workflows/release-minters-auditor.yaml@refs/heads/main
# (docs/kubernetes.md, "Pin by digest, never by tag", says the same for the worker image). Pods
# pull it by digest with no pull secret, as they pull the worker image, so the package must be
# public: a new GHCR package can come out private, and setting it public is a package-settings
# action on GitHub with no API.
on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/repo-paths.sh"
      - ".github/workflows/release-minters-auditor.yaml"
      - "packages/envoy/infra/scripts/operator-token-minters.sh"
      - "packages/envoy/infra/scripts/operator-token-minters/**"

# Every job declares its own permissions; nothing runs under this default.
permissions: {}

jobs:
  # Runs the repository's script and the image build, so it holds no credential but the package
  # push, and ends in the tripwire.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.record.outputs.image }}
      digest: ${{ steps.record.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: image
        run: |
          image=$(.github/scripts/repo-paths.sh minters_auditor_image)
          echo "image=$image" >> "$GITHUB_OUTPUT"
      # As worker-image.yaml's: provenance-add-gha=false keeps the event payload out of any
      # provenance predicate, and image= is the driver's own BuildKit image, the copy of
      # moby/buildkit:buildx-stable-1 (.github/ci-images.yaml).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            provenance-add-gha=false
            image=ghcr.io/cybermonklabs/legion/ci@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # As worker-image.yaml's: drop buildx's provenance key from the logged metadata, and the
          # build summary, so the job's event context reaches neither.
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: packages/envoy/infra/scripts/operator-token-minters/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.image.outputs.image }}:sha-${{ github.sha }}
          # org.opencontainers.image.source is the Dockerfile's LABEL (the in-repo convention).
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - id: record
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          {
            echo "image=$IMAGE"
            echo "digest=$DIGEST"
          } >> "$GITHUB_OUTPUT"
          echo "Published \`$IMAGE@$DIGEST\` from \`$GITHUB_SHA\`; pin the Job to this digest." >> "$GITHUB_STEP_SUMMARY"
      - name: Check this job holds no credential (tripwire)
        run: .github/scripts/release-push.sh no-credential

  # GitHub's artifact attestation of the digest the build pushed, as worker-image.yaml's attest
  # job: it holds id-token and attestations: write, so it runs one pinned action and no script,
  # and reads the image from the build job's output.
  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # id-token: write is the OIDC token Sigstore issues the signing certificate for; attestations:
    # write stores the attestation with GitHub. The attestation stays with GitHub, not the
    # registry, so this job needs no packages scope.
    permissions:
      id-token: write
      attestations: write
    # No cache is restored in a job that holds a credential.
    cache-mode: none
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
