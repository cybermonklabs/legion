name: CI job envoy-go

# The steps of ci.yaml's `envoy-go` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go:
    runs-on: ubuntu-24.04
    # Each go test step's -timeout must fire before the runner cancels the job, so a hung test
    # prints the dump that names it. The limit is at least the job's sum over its 20 newest green
    # merge-group runs up to 2026-11-15: its other steps at their longest, 137 s, 10 s of its clock
    # over them, and each go test step's longest plus the -timeout of every command in it - the
    # race-impossible step 166 s + 20 minutes (its two calls; the API's call, which that reading
    # includes, is the text-check job's now), the unit step 1086 s + 20, natslive 13 s + 15 and
    # the integration step 9 s + 5 - which is 5021 s; then the three steps main added after that
    # reading, which no merge-group run has measured yet, each at its own limit: the store-form
    # count's 5 minutes (two packages, which go test starts at once with -p at least 2, so its
    # -timeout bounds the step), the database skip count's step limit of 25 minutes (its comment
    # below says why 25), and 2 minutes for the moto vet, which compiles one package - 6941 s, or
    # 116 minutes.
    timeout-minutes: 120
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image would be one more registry pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # (The smoke test and the image it runs are ci.yaml's envoy-smoke job,
      # .github/workflows/ci-job-envoy-smoke.yaml.)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # go-envoy-test: this job builds and runs the test binary of every package of the envoy
      # module, a set no other job builds, so it keeps a family of its own.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-test-{0}-', runner.os) }}
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # The server's version and the pgvector version it offers, read from the service itself, so
      # the run shows which Postgres the tests below ran on.
      - name: Postgres service version
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc "select current_setting('server_version_num'), coalesce((select default_version from pg_available_extensions where name = 'vector'), 'no vector')"
      # Every image the tests here start: testnats.HubImage, which the natslive step below runs
      # Envoy on, testnats.Image (nats:2.10), which only the tests of that server itself and of the
      # listener's refusal of it start, and tests3.Image, pulled first for the reason the action
      # gives.
      - name: Pull test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
            packages/envoy/internal/tests3/seaweedfs.go Image
      # The tests the race detector makes impossible, which the race job of each of these packages
      # therefore cannot make, so envoy-go keeps a plain run of exactly them: internal/bus counts
      # HoldsSeed's allocations, which the race runtime's own allocations would be counted into,
      # and the documents package measures the heap a room keeps, which the detector's shadow
      # memory and instrumentation move. Those are out of the race build altogether
      # (//go:build !race), and the two render-reuse storms run fewer seeds and fewer edits under
      # it (raceEnabled), so this is their full-size run. The API's seven source guards, and
      # one_expression_guard_test.go beside them, carry that tag too and are deliberately not
      # here: they read the module's source, the text-check job runs their fifteen tests by name,
      # and ci_job_reads.py's TEXT_CHECK_TESTS leaves exactly those out of this step rather than
      # have each of them run twice. It comes before the unit step for the reason the API
      # package's own run did: run beside the other package binaries,
      # its Postgres-backed tests and the room-memory measurements queue their per-test database
      # cleanup on the service's one checkpointer, and the API's live-feed and delivery-hub tests
      # wait for the event log's safe horizon, which any open transaction on this job's Postgres
      # delays. The two -run lists are derived in .github/scripts/ci_job_reads.py from the race
      # lane's own packages and those files' //go:build !race and raceEnabled, so a test added to
      # either and missing here fails the ci-filters job naming this step. Over this job's 20
      # newest green merge-group runs up to 2026-11-15 the bus took at most 0.038 s and the
      # documents package 49.044 s (run 43687633216), so 10 minutes each is twelve times the
      # slowest.
      - name: Test what the race build cannot run at all or at full size
        run: |
          go test -count=1 -timeout 10m -run '^(TestHoldsSeedAllocatesAtMostOneCopyPerDecoding)$' ./internal/bus
          go test -count=1 -timeout 10m -run '^(TestARoomFedOnlyByAgentWritesKeepsMemoryWithinTheBound|TestRenderReuseARandomisedEditStorm|TestRenderReuseAReplicaReplaysTheRoomsFormattingExactly|TestUploadsOverOpenAnchorsKeepMemoryWithinTheBound|TestUploadsToARoomInUseKeepMemoryWithinTheBound)$' ./internal/dispatch/docs
        working-directory: packages/envoy
      # Everything the three race jobs run is left out here, since they run it under the detector,
      # and so is internal/integration, which the integration step below tests, and
      # internal/textcheck, whose tests are the text-check job's: that job runs them in a job
      # with no database and no Bun, and a change to only what they read must not start this
      # one. So are internal/dispatch/architecture/notes, internal/runnerlog,
      # internal/dispatch/specgraph, cmd/architecture-check and cmd/spec-check, which
      # envoy-go-checks tests on every push (NOTE_AND_SPEC_PACKAGES). The pattern is built
      # in .github/scripts/ci_job_reads.py from the same list those
      # jobs' own steps are built from, so what this step leaves out and what the other jobs run
      # cannot drift apart. The broker's packages, internal/broker and everything under it, are
      # left out too: the database-skips step below runs them with -json and fails on a failed
      # test as on a skipped one, so this step ran each of them a second time (DATABASE_SKIPS_TREE
      # in ci_job_reads.py). What is left is the rest of the module, the two longest packages of
      # it (the API's and the documents service's) now among the ones the lane runs. Its 20
      # minutes are 2.5 times its slowest package over this job's 20 newest green merge-group runs
      # up to 2026-11-15: cmd/broker, 477.995 s (run 43687633216). The two tests of the web app's
      # display-tree fixture are skipped:
      # without `--check` TestWebDisplayFixture writes the committed fixture rather than checking
      # it, so a run here would ask nothing of it, and
      # TestTheWebFixtureFindsItsFilesFromAnyDirectory stats that same file, which would make it
      # a read of this job; envoy-go-checks runs both, the first with the check, and both texts
      # are built from the same list.
      - name: Unit test envoy Go package
        run: |
          go list ./... | grep -Ev '/integration|/internal/textcheck$|/internal/dispatch/architecture/notes$|/internal/runnerlog$|/internal/dispatch/specgraph$|/cmd/architecture-check$|/cmd/spec-check$|/internal/broker($|/)|/internal/dispatch/delivery($|/)|/internal/dispatch/store($|/)|/internal/bus$|/cmd/listener$|/internal/store$|/internal/session$|/internal/kvwatch($|/)|/internal/dispatch/api$|/internal/dispatch/docs$' | xargs go test -count=1 -timeout 20m -skip '^(TestTheWebFixtureFindsItsFilesFromAnyDirectory|TestWebDisplayFixture)$'
        working-directory: packages/envoy
      # Each named test runs once on each store backend as its `aws` and `gcp` subtests, and each
      # backend's rows run that backend's own code: the store forms against the GCP fake and the
      # in-process AWS store (onEachStore) and the use chain against a broker whose settings name
      # each store, each row that runs the command reading the injection line that names its
      # store's kind (source.withSettings), all in ./cmd/agent-secrets/; and GET /v1/settings
      # answering each store's own key field beside the Google exchange audience, in
      # ./internal/broker/api/. This step runs only those tests in only those two packages (-run,
      # under backend-count.sh's own 5-minute -timeout, which the budget above counts) and counts
      # the passes of each, so a test whose AWS half was skipped or removed, or that lives in
      # neither package, reads aws=0 and fails, as the verification's check c8 requires.
      - name: Count the store-form rows on each backend
        run: packages/envoy/scripts/backend-count.sh ./cmd/agent-secrets/ ./internal/broker/api/ -- TestEverySecretFormNamesTheSourceItUses TestNoSecretFormAsksTheBrokerForACredential TestUseCommandOutsideASessionReachesTheMachineSource TestTheChainSkipsAbsenceAndStopsOnABrokenSource TestSettingsNameTheGoogleExchangeAudienceOnEitherStore
      # c8 also asks that the database broker suites run with BROKER_TEST_DATABASE_URL set and that
      # none skips. go test reports a skip as a pass, so this step is where the broker's packages
      # run: it runs ./internal/broker/... with -json, which the unit step above leaves out, fails
      # on a failed test, and fails on any skipped test there, FuzzAirlock and
      # TestModelAgreesOnHostShapes apart (each needs a built Lean model of the airlock, and the
      # airlock-lean job runs both). A report it cannot read prints database_skips=UNKNOWN and fails
      # too. database-skips.sh's -timeout of 15 minutes bounds each package's test binary, and the
      # packages run several at a time, so one that starts late ends up to 15 minutes after its own
      # start: the step's own limit of 25 minutes leaves a package that starts within the first 10
      # its whole -timeout, and so its dump. Measured on a loaded dev box on 2026-11-16: 331 s for
      # the whole step, the slowest package, internal/broker/helper, 329 s.
      - name: Count the database broker suites' skips
        timeout-minutes: 25
        run: packages/envoy/scripts/database-skips.sh
      # agentloop's live proof makes a real model call, so it sits behind a build tag and CI
      # never runs it. Vetting it keeps it compiling as the package changes.
      - name: Vet agentloop's live proof (no model call)
        run: go vet -tags modellive ./agentloop/
        working-directory: packages/envoy
      # The run of the built agent-secrets against moto needs moto, so it sits behind a build tag
      # and packages/envoy/scripts/aws-moto-check.sh runs it. Vetting it keeps it compiling.
      - name: Vet agent-secrets' moto run (no moto)
        run: go vet -tags moto ./cmd/agent-secrets/
        working-directory: packages/envoy
      # internal/testnats runs its server in the test process, so the untagged step above starts
      # no container. The real-server tests, a rendered authorization on the image the hub runs
      # among them, are the one thing an in-process server cannot reproduce: they sit behind the
      # natslive tag, and this step is where they run (INFRA-250). internal/bus has tests of its own
      # there. One is the consumer cap: the module links nats-server v2.15.1 in process, which caps
      # a stream that sets no cap at a default of its own and takes a change of MaxConsumers on a
      # stream that already exists, so the raise of an uncapped ENVOY_NOTIFICATIONS to the consumer
      # cap this binary compiles and the keeper's restore of a cap an operator lowered or unset are
      # proved in process. What is left for a real image is the pair of 2.10 cases - the stream with
      # no cap the binary must leave alone, and the refusal of the raise of a lower cap, naming the
      # field, the cap and the first server taking the change - and the hub's own reconcile on the
      # nats:2.15.1-alpine image the deployment runs (INFRA-1384). The others are a session
      # consumer's own messages behind other sessions' traffic on the hub's image, the listener's
      # refusal of nats:2.10 (natsversion), and that refusal's control: on 2.10, stepped past, the
      # consumer loses its old-form message. Each
      # package runs only the tests its tag adds: `-tags natslive ./pkg` would re-run the
      # package's untagged tests, which already run elsewhere - internal/testnats in the unit step
      # above, and internal/bus in envoy-go-race, which the unit step's grep -Ev leaves out - so
      # the -run comes from .github/scripts/go-tagged-tests.sh, which reads the names off the
      # source at run time, and no test name is spelled here. Each assignment is a line of its
      # own: under bash -e it carries the script's exit status, so an empty or refused list fails
      # the step instead of running -run "", which matches every test. Over this job's 20 newest
      # green merge-group runs up to 2026-11-15 internal/testnats took at most 3.538 s here and
      # internal/bus 5.029 s (run 43582507175), against 10 and 5 minutes.
      - name: Test the container-backed NATS matrix (natslive)
        run: |
          rig=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/testnats)
          go test -count=1 -timeout 10m -tags natslive -run "$rig" ./internal/testnats/
          cap=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/bus)
          go test -count=1 -timeout 5m -tags natslive -run "$cap" -v ./internal/bus/
        working-directory: packages/envoy

      # 300 s against at most 7.683 s over this job's 20 newest green merge-group runs up to
      # 2026-11-15 (run 43582507175).
      - name: Integration test envoy (a real NATS server, in the test process)
        run: go test ./internal/integration/ -timeout 300s -count=1
        working-directory: packages/envoy
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
