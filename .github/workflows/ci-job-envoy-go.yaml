name: CI job envoy-go

# The steps of ci.yaml's `envoy-go` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go:
    runs-on: ubuntu-24.04-arm
    # Every go test call of this job, of envoy-go-checks and of the race lane, and each of those
    # jobs' own timeout-minutes, is sized by R6 from the final measurement pair, two
    # workflow_dispatch runs of ci.yaml at one head, runs 44657322918 and 44657415021 at 8cfd2682
    # (dispatch://INFRA-1075, check 6224bb0e), and from the dispatch run at each later head,
    # which is swept the same way and may raise a limit but never lower one (the architect's rule
    # of 2026-11-20, the issue's open-items.md). Run 44687712471 at 56f4dabc raised five:
    # envoy-go-race-api's --timeout and timeout-minutes, envoy-go-docs-finalizers' -timeout and
    # timeout-minutes, and envoy-go-checks' timeout-minutes. Run 44717243297 at 66058706 raised
    # five: envoy-go-race's -timeout and timeout-minutes, and again envoy-go-docs-finalizers'
    # -timeout and timeout-minutes and envoy-go-checks' timeout-minutes. Run 44790111577 at
    # 85f6b018 raised two: this job's package list's -timeout and, with it, this job's
    # timeout-minutes; every other limit holds against it. Run 44846096964 at 28ce7c74 raised
    # three: envoy-go-race-docs' -timeout and timeout-minutes and envoy-go-race's timeout-minutes;
    # every other limit holds against it. The comment on each limit, and the
    # table below for this job's calls, give the reading that set it; every limit no dispatch run
    # raised is the pair's. The pair ran envoy-go-checks on x64 (ubuntu-24.04) and the other five
    # jobs on arm64 (ubuntu-24.04-arm), where main's #4308 moved them, as the pairs from d58c9ed8
    # on did; the pairs through 4f1f4436 ran every lane job on x64.
    #
    # A call's -timeout is the smallest whole minute at which its slowest package, on the slower
    # run of the pair, takes at most half of it: that package's time divided by 30, rounded up.
    # A hung test then prints the dump that names it well before the runner cancels the job, and
    # a test that merely runs long does not. A job's timeout-minutes is its larger time in the
    # pair, plus the largest -timeout of its go test calls, plus 6, rounded up; a step's own
    # timeout-minutes is not a -timeout.
    # envoy-go-docs-finalizers keeps a rule of its own, which its comment states. Each limit is
    # written in one shape - the reading, its run and job, the arithmetic, the limit - in the
    # table below for this job's calls, in the comment on each call, and in the comment on each
    # other job, so a new pair changes those lines and no others.
    #
    #   call                slowest package   reading    run          job           t / 30  limit
    #   the package list    cmd/cipher        555.3 s    44790111577  136476756402   18.51    19m
    #   race-impossible     docs              216.1 s    44657322918  136026779841    7.20     8m
    #   pgmigrate           pgmigrate         278.2 s    44657322918  136026779841    9.27    10m
    #   shutdown            cmd/dispatch       50.2 s    44657322918  136026779841    1.67     2m
    #   routes              routes             58.7 s    44657322918  136026779841    1.96     2m
    #   events              events             38.6 s    44657322918  136026779841    1.29     2m
    #   natslive (rig)      testnats            4.7 s    44657322918  136026779841    0.16     1m
    #   natslive (cap)      bus                20.5 s    44657415021  136039517737    0.68     1m
    #   natslive (callout)  natscallout         5.1 s    44657415021  136039517737    0.17     1m
    #   integration         integration         7.7 s    44657415021  136039517737    0.26     1m
    #   skip count          cmd/cipherd       263.2 s    44657322918  136026779841    8.77     9m
    #
    # The package list's reading is that of cmd/cipher, then cmd/agent-secrets, 555.3 s: run
    # 44790111577 read the package under its old path, and run 44846096964 (job 136669775711)
    # read cmd/cipher at 524.3 s. The skip count is the step "Count the
    # database broker suites' skips", whose go test writes its stream to broker.json through the
    # script's --keep: its reading is the package time there of cmd/cipherd, then cmd/broker,
    # 263.2 s and 260.8 s in the pair (jobs 136026779841 and 136039517737). Its
    # step limit of 19 minutes is its 9m -timeout plus 10, main's own rule for it, which the
    # comment on the step gives. The skip counter's test keeps main's step limit of 15 minutes, and
    # the callout check step main's 6.
    #
    # Three calls run tests that read a margin off the test binary's own deadline, and each must
    # leave at least that margin above its slowest package's time, or those tests refuse the run
    # rather than waiting in it. Each limit clears it: 19m leaves 652.5 s over
    # internal/dispatch/pmdoc's 487.5 s in the package list (run 44790111577, its slowest
    # reading), against the 60 s of pmdoc's perCallReportMargin
    # (internal/dispatch/pmdoc/linear_test.go:1169); 8m leaves 263.9 s over
    # the documents package's 216.1 s in the race-impossible call, against the 30 s of its
    # roomWaitMargin (internal/dispatch/docs/settlement_credit_test.go:546); and 2m leaves 69.8 s
    # over cmd/dispatch's 50.2 s in the shutdown call, against the 30 s of horizontest.Drain
    # (internal/dispatch/horizontest/horizontest.go, Drain), which the shutdown test's wait for its
    # event feed (waitEventsStart) leaves of the deadline so that its failure prints rather than
    # being cut off by the package timeout. At 4 minutes the race-impossible call failed that
    # floor and said so itself, in both arms of run 42577832967: "the test binary's deadline
    # leaves 20.769s, not more than roomWaitMargin (30s): this looks like a misconfigured run;
    # raise -timeout". Run 44790111577 read the documents package in the race-impossible call at
    # 236.1 s and cmd/dispatch in the shutdown call at 58.4 s; 8m and 2m leave 243.9 s and 61.6 s
    # above those.
    #
    # The job's own bound is its slowest time, 1,373 s (run 44790111577 at 85f6b018, job
    # 136476756402), against 1,328 s and 1,278 s in the pair (jobs 136026779841 and
    # 136039517737), 22.88 minutes, plus the largest -timeout of its go test calls, the package
    # list's 19m, plus 6: 22.88 + 19 + 6 = 47.88, so 48; the pair's 1,328 s gives
    # 22.13 + 19 + 6 = 47.13, 48 as well; run 44846096964 (job 136669775711) took 1,309 s, under
    # it. The skip count's step limit of 19 minutes is not a -timeout, though it equals the
    # package list's 19m, and it fires before the job's: that step took 346 s of run
    # 44790111577's 1,373 s job, so the job less that step plus 19 minutes is 1,027 + 1,140 = 2,167 s,
    # 36.12 minutes, under the job's 48.
    # The other steps after the unit step have limits of their own under that: the store-form
    # count runs under backend-count.sh's -timeout of 5 minutes, the skip counter's test under its
    # step limit of 15 minutes and the callout check under its own 6. Both attempts of the pair
    # missed the Go build cache, on arm64: in each the restore found no go-envoy-test entry for
    # ARM64. The bound takes their times all the same. An attempt on x64 that missed it took
    # 1,502 s (run 44097184245, job 134098415747) against warm x64 ones of 737 s and 765 s (runs
    # 44078406008 and 44175873364), and the bound covers it at 52 %. The nine calls of the unit
    # step run at the same time, so the step's own worst case is the longest of them rather than
    # their sum.
    # The API's claim model is not among them, running in envoy-go-claim-model.
    timeout-minutes: 48
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        # why: .github/ci-notes/ci-job-envoy-go.md#the-five-settings-on-the-postgres-services-command-line
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        # --shm-size: a service container gets 64 MB of /dev/shm by default, and Postgres puts a
        # parallel worker's shared memory there. With the module's packages running at once the
        # seed's HNSW build failed on it ("could not resize shared memory segment … No space left
        # on device", job 127148899326), which is the container's limit rather than the server's
        # (dispatch://INFRA-1075).
        #
        # --health-interval is a second rather than ten, and --health-retries 50 rather than 5,
        # which is the same 50 s a slow start was given before: docker runs the first health
        # check an interval after the container starts, so at ten this server was reported
        # healthy at 14 s where it had been ready at about 1, and the job's first step waited
        # that out (run 42307926510, "Initialize containers", 22 s of which 15 s was the wait).
        # A `pg_isready` a second for the job's length is one short exec of the service
        # container, which no step of this job is measured against (dispatch://INFRA-1075).
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
      # internal/dispatch/routes gets an instance of its own, and the routes call of the unit
      # step below is the only thing pointed at it. Its tests wait for the event log's safe
      # horizon, which is instance-wide by design: it rests on pg_snapshot_xmin, so ANY
      # transaction running anywhere on the instance holds it back until it ends, this job's
      # other package binaries' `create database … strategy file_copy` among them
      # (internal/dispatch/events/horizon.go, "Safe horizon"). That is not a cost a setting can
      # take away - the settings below are this server's too - so the only way to keep those
      # waits off the other packages' transactions is a second instance. Measured on a pod: one
      # transaction holding a transaction id on another database of the same instance, with no
      # load at all, takes TestAnEventsSubscriptionFromTheWhoamiHeadReplaysWhatCommittedSince
      # to the exact failure CI saw twice in three runs ("read the events_start: … i/o
      # timeout", runs 42378432951 and 42424201523), with the server's own warning naming the
      # holder: "event horizon held back by an open transaction; live event readers wait for
      # it … query=select pg_current_xact_id(), pg_sleep(30)". The subscription is open
      # throughout - the socket's read deadline is what ends it, not the socket - so the wait
      # is the horizon's (dispatch://INFRA-1075).
      postgres_routes:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        # 5433 on the runner: the service above holds 5432, and two services cannot publish one
        # host port. The container's own port is 5432 either way.
        ports: ["5433:5432"]
        # The five settings of the service above, for the reasons given there: this server is
        # as disposable as that one, and one package's binary opens as many connections per
        # store. No routes test prepares a transaction: max_prepared_transactions is here because
        # the read-back step below holds this server to every one of the five too.
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
      # A third instance, for the one untagged test of cmd/dispatch that reads a live event feed
      # (TestSIGTERMWithOpenStreamsExitsPromptlyAndSettlesTheOwedDocument, shutdown_test.go). It
      # waits on events_start exactly as the routes package does, and in run 42581214577 it timed
      # out on it with the server naming the holder: "event horizon held back by an open
      # transaction … database=dispatch_test_2be55348167c1ee8", a database of another package of
      # this job, pending_for 5.14 s. It cannot share the routes service either, in either
      # direction: routes' own tests hold instance-wide transaction ids on purpose
      # (whoami_test.go's pg_current_xact_id hold, its cluster-database holder and its
      # out-of-order insert), and routes' horizon loop has already been blown once by a sibling's
      # `create database … strategy file_copy` (run 41868325451), which is what this test's own
      # harness does. So it gets a server no other test touches, on 5434
      # (dispatch://INFRA-1075).
      postgres_shutdown:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5434:5432"]
        # The five settings of the services above, for the reasons given there.
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
      # A fourth instance, for internal/pgmigrate, whose redaction oracle holds scanl.go's
      # transcription of PostgreSQL's scan.l to a real PostgreSQL: it asks a server about 158,364
      # (text, setting) pairs, and what a pair costs is a round trip, not arithmetic. Measured on
      # run 42774209109: 2.16 ms a round trip in this lane against 0.16 ms against an idle
      # server, the package 166.1 s contended there for 53.7 s of wall alone on four idle cores and
      # 63.8 s of CPU. Two things follow, and the service answers both: the package waits on a queue the
      # rest of this job fills, and those 158,364 round trips are themselves load on the server
      # every other package of the job shares - a cost its own time does not show. So it gets an
      # instance of its own, on 5435, named on the pgmigrate call of the unit step and nowhere
      # else (dispatch://INFRA-1075).
      postgres_pgmigrate:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5435:5432"]
        # The five settings of the services above, for the reasons given there.
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
      # A fifth instance, for internal/dispatch/events, whose horizon tests wait for the event
      # log's safe horizon as the routes package and the shutdown feed test do: it rests on
      # pg_snapshot_xmin, so any transaction open anywhere on the instance holds it back
      # (internal/dispatch/events/horizon.go, "Safe horizon"). In the package list, on the first
      # service, which every other package of this job shares,
      # TestHorizonAwaitCoversEveryIDCommittedBeforeTheCall took 27.07 s and 53.94 s on the two
      # passing runs of an earlier pair (runs 43514262740 and 43519308059), and on run
      # 43596122521 (job 132450917326) it failed at its one-minute give-up after 60.48 s ("await
      # event horizon: context deadline exceeded"), while cmd/dispatch-seed's batched seeds and
      # pmdoc ran beside it. The routes package and the shutdown feed test have servers of their
      # own for the same reason, and it cannot share either of theirs: its own tests hold
      # transaction ids on purpose (TestHorizonStaysBelowAnOpenLowerWrite's open write, and
      # TestWriterFloorIgnoresATransactionInAnotherDatabase's transaction in another database of
      # the instance), which would hold back the horizon those two wait on. Nor pgmigrate's: that
      # server is there to keep its package's 158,364 round trips off every other package's
      # queue. So it gets a server no other package touches, on 5436, named on the events call of
      # the unit step and nowhere else (dispatch://INFRA-1075).
      postgres_events:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5436:5432"]
        # The five settings of the services above, for the reasons given there.
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image would be one more registry pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # (The smoke test and the image it runs are ci.yaml's envoy-smoke job,
      # .github/workflows/ci-job-envoy-smoke.yaml.)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bun, because a test runs it: internal/dispatch/pmdoc's update tests drive the proof
      # editor's own TypeScript through `bun run` and refuse to pass without it
      # (update_test.go:304-312, `bun is required in CI`). No step of this job runs bun, which is
      # why dropping these two steps looked free and cost run 42473681063 its unit step
      # (dispatch://INFRA-1075).
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # go-envoy-test: this job builds and runs the plain test binaries of the envoy module's
      # packages - the race lane's left to that lane but the two its race-impossible call runs -
      # a set no other job builds, so it keeps a family of its own. The entry holds no
      # module zip: .github/workflows/ci-caches.yaml leaves them out when it fills the family,
      # since go reads an extracted module from its own tree and the zip only to extract it, and
      # they are the largest part of this restore that the archive cannot compress
      # (dispatch://INFRA-1075). The path repeats the fill's, exclusion and all, because
      # .github/scripts/check-ci-filters.sh holds a family's restore to the paths its save
      # names: an entry that held other directories than the job reads would have the job
      # rebuild what the fill already built.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            !~/go/pkg/mod/cache/download/**/*.zip
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-test-{0}-{1}-', runner.os, runner.arch) }}
      # The script raises max_connections with `alter system` and restarts the server only where
      # the server does not already allow what the lane needs. A setting on a server's command
      # line holds over `alter system`, and this service, as every Postgres service of this file,
      # starts at max_connections=500, which is over testlimits.ServerConnections and the
      # superuser reserve, so the script reads that, prints what the service allows, and alters
      # and restarts nothing. What the step is here for is that check
      # (dispatch://INFRA-1075: the lane's A8 says no step of these jobs runs `alter system`,
      # and a restart would cost the job the time and the connections of a fresh server).
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # The server's version and the pgvector version it offers, read from the service itself, so
      # the run shows which Postgres the tests below ran on.
      - name: Postgres service version
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc "select current_setting('server_version_num'), coalesce((select default_version from pg_available_extensions where name = 'vector'), 'no vector')"
      # The settings each service's command: asks for, read back from the server itself, because a
      # command the runner does not pass through leaves the server up on the image's defaults
      # rather than failing: the job would then refuse connections under load and pay for the
      # forced checkpoints it meant to make cheap. No test of this job needs the fifth setting,
      # max_prepared_transactions: envoy-go-race-api's floor test does, and fails in CI on a
      # server without it. A setting the server itself refuses never reaches these steps -
      # postgres exits and the service's health check fails the job before its first step.
      # .github/scripts/postgres-service-settings.sh
      # holds the five settings and reads them, for these steps and every step like them in this
      # file; its head says why it is a script. There is a step for each of this job's five
      # services, because each is a server of its own started from a command: line of its own,
      # and a runner that dropped one of those lines would leave that one server on the image's
      # defaults with nothing else saying so.
      - name: Read the disposable service's settings back
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres.id }}" postgres
      - name: Read the routes service's settings back
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres_routes.id }}" postgres_routes
      - name: Read the shutdown service's settings back
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres_shutdown.id }}" postgres_shutdown
      - name: Read the pgmigrate service's settings back
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres_pgmigrate.id }}" postgres_pgmigrate
      - name: Read the events service's settings back
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres_events.id }}" postgres_events
      # Every image the tests here start: testnats.HubImage, which the natslive call of the unit
      # step below runs Envoy on, testnats.Image (nats:2.10), which only the tests of that server
      # itself and of the listener's refusal of it start, and tests3.Image, pulled first for the
      # reason the action gives.
      - name: Pull test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
            packages/envoy/internal/tests3/seaweedfs.go Image
      # why: .github/ci-notes/ci-job-envoy-go.md#what-the-unit-step-runs-and-why-its-nine-calls-run-at-once
      - name: Unit test envoy Go package
        run: |
          mkdir -p "$RUNNER_TEMP/go-test-json" "$RUNNER_TEMP/go-test-logs"
          # The three long calls first, longest first; the short calls after them, in any order.
          # The nine calls share this runner's four cores, so the step is over
          # when its longest call is, and a call that starts late ends as late as it started.
          # Measured on run 42716398877, job 129499072292, every stream on one clock whose zero
          # is the first event of any of them: natslive 0.0 s to 61.0 s, integration 20.8 s to
          # 24.1 s, the race-impossible call 35.9 s to 397.2 s, the package list 76.4 s to
          # 524.5 s, routes 94.9 s to 130.6 s, the shutdown call 110.7 s to 166.4 s. The step
          # was 543 s and the package list was its critical path at 448 s: it started 76.4 s in,
          # after three other calls had begun building and were competing for the cores, and
          # internal/dispatch/pmdoc, its own longest package, started with it. So the list is
          # started first and the race-impossible call, 361 s and the next longest, second
          # (dispatch://INFRA-1075). The `go list` that builds the list's arguments runs ahead of
          # every call for the same reason: what the longest call needs waits on nothing.
          # The pgmigrate call is third because it is the third longest. The run above had its
          # package inside the package list; on a server of its own it took 298.8 s and 223.3 s
          # in the pair at fae4eab5 (runs 43654965125 and 43657875798), against the
          # race-impossible call's 381.3 s and 292.5 s, each from the first event of its stream
          # to the last. The short calls follow it: the longest of them, natslive, took 73.0 s
          # and 65.6 s in that pair.
          #
          # -timeout 19m, by R6 from the pair at 8cfd2682 and the dispatch runs since (the table on
          # this job): this call's slowest package's slowest reading is cmd/cipher, then
          # cmd/agent-secrets, 555.3 s (run 44790111577 at 85f6b018, job 136476756402), against
          # 522.8 s and 506.9 s in the pair, and 555.3 / 30 = 18.51, so 19m. The limit leaves
          # 652.5 s above internal/dispatch/pmdoc's 487.5 s in that run, its slowest reading, over
          # the 60 s of pmdoc's perCallReportMargin, which is the floor a package that reads the
          # test binary's deadline sets for itself.
          lead="github.com/sjawhar/envoy/internal/dispatch/pmdoc
          github.com/sjawhar/envoy/cmd/dispatch-seed
          github.com/sjawhar/envoy/internal/dispatch/outbox
          github.com/sjawhar/envoy/cmd/dispatch
          github.com/sjawhar/envoy/cmd/cipher"
          rest=$(go list ./... | grep -Ev '/integration|/internal/textcheck$|/internal/dispatch/architecture/notes$|/internal/runnerlog$|/internal/dispatch/specgraph$|/cmd/architecture-check$|/cmd/spec-check$|/listenerwire$|/internal/wirecheck$|/internal/cipher($|/)|/cmd/cipherd$|/internal/dispatch/delivery($|/)|/internal/dispatch/store($|/)|/internal/bus$|/cmd/listener$|/internal/store$|/internal/session$|/internal/kvwatch($|/)|/natscred$|/internal/cipher/natscallout$|/internal/oidc$|/internal/dispatch/api$|/internal/dispatch/docs$|/internal/dispatch/routes$|/internal/pgmigrate$|/internal/dispatch/events$' | grep -vxF "$lead")
          printf '%s\n%s\n' "$lead" "$rest" | xargs go test -json -count=1 -p 8 -parallel 12 -skip '^(TestEverySecretFormNamesTheSourceItUses|TestNoSecretFormAsksTheBrokerForACredential|TestSIGTERMWithOpenStreamsExitsPromptlyAndSettlesTheOwedDocument|TestTheChainSkipsAbsenceAndStopsOnABrokenSource|TestTheWebFixtureFindsItsFilesFromAnyDirectory|TestUseCommandOutsideASessionReachesTheMachineSource|TestWebDisplayFixture)$' -timeout 19m > "$RUNNER_TEMP/go-test-json/unit.json" &
          unit=$!
          # The tests the race detector makes impossible, which the race job of each of these
          # packages therefore cannot make, so envoy-go keeps a plain run of them:
          # internal/bus counts HoldsSeed's allocations, which the race runtime's own
          # allocations would be counted into, and the documents package measures the heap a
          # room keeps, which the detector's shadow memory and instrumentation move. Those are
          # out of the race build altogether (//go:build !race), and the two render-reuse storms
          # run fewer seeds and fewer edits under it (raceEnabled), so this is their full-size
          # run. The API's mention sender claim model is out of the race build too, and runs in
          # a job of its own, envoy-go-claim-model; the API's eight source guards, and
          # one_expression_guard_test.go beside them, carry that tag as well and are
          # deliberately not here: they read the module's source, the text-check job runs their
          # seventeen tests by name, and ci_job_reads.py's CLAIM_MODEL_TESTS and
          # TEXT_CHECK_TESTS leave exactly those tests out of this call rather than have each of
          # them run twice. Nor are the tests whose assertion is a wall-clock time measured in
          # their own process: the API's and delivery's xid window tests, which judge a
          # window's gaps against storetest.XidMaxGap, and the NATS auth service's restart
          # storm, which judges its slowest decision against decideBudget. Beside this step's
          # other calls the load moved those times, and each run of the pair at c3e93e7e failed
          # an xid window test here (runs 44476496859 and 44476544762). So they run as main
          # runs them, alone on a runner: delivery's and the storm in envoy-go-race and the
          # API's in envoy-go-checks, each job's first test step (ci_job_reads.py's
          # ALONE_PREFIX, ALONE_TESTS and ALONE_STEPS).
          # It was a step of its own before this one until dispatch://INFRA-985's condition for
          # running it here was measured: the three documents memory bounds read this process's
          # own heap after two forced collections, and the question was whether a slow mark
          # under contention lets the heap overshoot before the reading is taken. Run
          # 42526940781 ran all three sixty times in this shape - beside pmdoc's CPU-budget
          # tests, under busy loops at twice the runner's cores, against a Postgres service
          # exactly like this job's - and every run passed, the worst of them using 36.1 per
          # cent of its bound, where the condition was no failure and no run within 15 per cent.
          # The other half of that step's old reason went with the API package, whose live-feed
          # and delivery-hub tests wait for the event log's safe horizon and run in
          # envoy-go-race-api now. The one -run list is derived in
          # .github/scripts/ci_job_reads.py from the race lane's own packages and those files'
          # //go:build !race and raceEnabled, less the tests that run alone, so a test added to
          # either and missing here fails the ci-filters job naming this step.
          # -timeout 8m, by R6 from the pair at 8cfd2682
          # (the table on this job): this call's slowest package on the slower run is
          # internal/dispatch/docs, 216.1 s (run 44657322918, job 136026779841), and
          # 216.1 / 30 = 7.20, so 8m. The limit leaves 263.9 s above that time, over the 30 s
          # of the documents package's roomWaitMargin. A run that missed the Go build cache on
          # x64 has read 537.3 s there (run 44097184245), more than the 8m.
          #
          # One go test over its packages rather than one per package: go builds the test
          # binaries together and runs each package's tests as soon as its own binary is
          # linked, so one package's tests run beside another's build instead of after it.
          # Three commands in a row, while the API package's source guards were still among
          # them, cost 96 s for 44 s of tests - 40 s of them the API package's build, with
          # nothing running beside it (run 42307926510, dispatch://INFRA-1075). The bus and
          # documents packages each measure their own process's heap or allocations, so running
          # them at the same time changes no number either of them asserts on.
          go test -json -count=1 -timeout 8m -run '^(TestARoomFedOnlyByAgentWritesKeepsMemoryWithinTheBound|TestHoldsSeedAllocatesAtMostOneCopyPerDecoding|TestRenderReuseARandomisedEditStorm|TestRenderReuseAReplicaReplaysTheRoomsFormattingExactly|TestUploadsOverOpenAnchorsKeepMemoryWithinTheBound|TestUploadsToARoomInUseKeepMemoryWithinTheBound)$' ./internal/bus ./internal/dispatch/docs > "$RUNNER_TEMP/go-test-json/race-impossible.json" 2> "$RUNNER_TEMP/go-test-logs/race-impossible.log" &
          impossible=$!
          # internal/pgmigrate, on a Postgres service of its own: its redaction oracle holds
          # scanl.go's transcription of PostgreSQL's scan.l to a real PostgreSQL, which is
          # 158,364 (text, setting) pairs asked over two connections, and what a pair costs is a
          # round trip rather than arithmetic. Measured on run 42774209109: 2.16 ms a round trip
          # in this lane against 0.16 ms against an idle server, the package 166.1 s contended there for
          # 53.7 s of wall alone on four idle cores and 63.8 s of CPU. The instance pays for
          # both halves of that - the queue this package waits in, and the 158,364 round trips
          # it puts into the queue every other package of the job waits in - so
          # DISPATCH_TEST_DATABASE_URL names 5435 on this call and nowhere else, as the three
          # calls below name 5433, 5436 and 5434. The package list above leaves the package out.
          #
          # -timeout 10m, from the call's own measured times rather than from its CPU. The
          # first arithmetic took the half rule on 120 s - 63.8 s of CPU at about half a core -
          # and 4m was too small: the call measured 159.7 s and 183.2 s on two runs and then
          # ran past 240 s on a slower one, where go killed it mid-test ("panic: test timed out
          # after 4m0s, running tests: TestRedactionAgainstServerOutcomes (3m20s)", run
          # 42856652273). By R6 from the pair at 8cfd2682 (the table on this job): this call's
          # one package on the slower run is internal/pgmigrate, 278.2 s (run 44657322918, job
          # 136026779841), and 278.2 / 30 = 9.27, so 10m. No floor stands above that rule
          # here: no test of internal/pgmigrate reads the test binary's deadline, so it declares
          # no margin of its own the way the documents package's roomWaitMargin (30 s) and
          # pmdoc's perCallReportMargin (60 s) are theirs.
          DISPATCH_TEST_DATABASE_URL='postgres://postgres:ci@localhost:5435/postgres?sslmode=disable' go test -json -count=1 -timeout 10m ./internal/pgmigrate/ > "$RUNNER_TEMP/go-test-json/pgmigrate.json" 2> "$RUNNER_TEMP/go-test-logs/pgmigrate.log" &
          pgmigrate=$!
          # The routes package, on the second Postgres service: DISPATCH_TEST_DATABASE_URL names
          # 5433 on this call and nowhere else, so the only transactions its horizon waits on are
          # its own tests'. It is on the call rather than in the step's env:, which would reach
          # every call; the calls that name no server of their own run against 5432. -timeout
          # 2m, by R6 from the pair at 8cfd2682 (the table on this job): this call's one package
          # on the slower run is internal/dispatch/routes, 58.7 s (run 44657322918, job
          # 136026779841), and 58.7 / 30 = 1.96, so 2m.
          DISPATCH_TEST_DATABASE_URL='postgres://postgres:ci@localhost:5433/postgres?sslmode=disable' go test -json -count=1 -timeout 2m ./internal/dispatch/routes/ > "$RUNNER_TEMP/go-test-json/routes.json" 2> "$RUNNER_TEMP/go-test-logs/routes.log" &
          routes=$!
          # internal/dispatch/events, on the fifth Postgres service, for the reason the routes
          # call gives: its horizon tests wait for the event log's safe horizon, which any
          # transaction open anywhere on the instance holds back, and in the package list one
          # of them failed at its one-minute give-up (run 43596122521, job 132450917326). Its
          # own tests hold transaction ids on purpose, so it shares no other call's service:
          # 5436 is named on this call and nowhere else, and the package list above leaves the
          # package out (dispatch://INFRA-1075). -timeout 2m, by R6 from the pair at 8cfd2682
          # (the table on this job): this call's one package on the slower run is
          # internal/dispatch/events, 38.6 s (run 44657322918, job 136026779841), and
          # 38.6 / 30 = 1.29, so 2m.
          DISPATCH_TEST_DATABASE_URL='postgres://postgres:ci@localhost:5436/postgres?sslmode=disable' go test -json -count=1 -timeout 2m ./internal/dispatch/events/ > "$RUNNER_TEMP/go-test-json/events.json" 2> "$RUNNER_TEMP/go-test-logs/events.log" &
          events=$!
          # The one untagged test of cmd/dispatch that reads a live event feed, on the third
          # Postgres service: the horizon it waits on is instance-wide, so in run 42581214577 it
          # timed out on events_start while another package's database held a transaction open,
          # the server naming that holder. It cannot share the routes service in either
          # direction - routes' own tests hold transaction ids on purpose, and its horizon loop
          # has been blown by a sibling's clone before - so 5434 is named on this call and
          # nowhere else. The package list above skips this test by name, which is unique in the
          # module (dispatch://INFRA-1075). -timeout 2m, by R6 from the pair at 8cfd2682 (the
          # table on this job): this call's one package on the slower run is cmd/dispatch,
          # 50.2 s (run 44657322918, job 136026779841), and 50.2 / 30 = 1.67, so 2m. The limit
          # leaves 69.8 s above that time, over the 30 s of horizontest.Drain that the test's
          # wait for its event feed leaves of the deadline.
          DISPATCH_TEST_DATABASE_URL='postgres://postgres:ci@localhost:5434/postgres?sslmode=disable' go test -json -count=1 -timeout 2m -run '^(TestSIGTERMWithOpenStreamsExitsPromptlyAndSettlesTheOwedDocument)$' ./cmd/dispatch/ > "$RUNNER_TEMP/go-test-json/shutdown.json" 2> "$RUNNER_TEMP/go-test-logs/shutdown.log" &
          shutdown=$!
          # internal/testnats runs its server in the test process, so the package list above
          # starts no container. The real-server tests, a rendered authorization on the image the
          # hub runs among them, are the one thing an in-process server cannot reproduce: they sit
          # behind the natslive tag, and this call is where they run (INFRA-250). internal/bus has
          # tests of its own there. One is the consumer cap: the module links nats-server v2.15.1
          # in process, which caps a stream that sets no cap at a default of its own and takes a
          # change of MaxConsumers on a stream that already exists, so the raise of an uncapped
          # ENVOY_NOTIFICATIONS to the consumer cap this binary compiles and the keeper's restore of
          # a cap an operator lowered or unset are proved in process. What is left for a real image
          # is the pair of 2.10 cases - the stream with no cap the binary must leave alone, and the
          # refusal of the raise of a lower cap, naming the field, the cap and the first server
          # taking the change - and the hub's own reconcile on the nats:2.15.1-alpine image the
          # deployment runs (INFRA-1384). The others are a session consumer's own messages behind
          # other sessions' traffic on the hub's image, the listener's refusal of nats:2.10
          # (natsversion), and that refusal's control: on 2.10, stepped past, the consumer loses
          # its old-form message. internal/cipher/natscallout has one too: that the image the hub
          # runs lets a user with an empty publish allow list publish anywhere, the fail-open its
          # guard refuses, so the guard is shown able to fail on the server production runs. Each
          # package runs only the tests its tag adds: `-tags natslive ./pkg` would re-run the
          # package's untagged tests, which already run elsewhere - internal/testnats in the
          # package list above, and internal/bus and internal/cipher/natscallout in
          # envoy-go-race, which that list's grep -Ev leaves out - so
          # the -run comes from .github/scripts/go-tagged-tests.sh, which reads the names off the
          # source at run time, and no test name is spelled here. Each assignment is a line of
          # its own and runs before the command it feeds: under bash -e it carries the script's
          # exit status, so an empty or refused list fails the step instead of running -run "",
          # which matches every test. -timeout 1m on each command, by R6 from the pair at
          # 8cfd2682 (the table on this job): on the slower run of each, internal/testnats took
          # 4.7 s (run 44657322918, job 136026779841) and internal/bus 20.5 s and
          # internal/cipher/natscallout, then internal/broker/natscallout, 5.1 s (run 44657415021,
          # job 136039517737), and 4.7 / 30 = 0.16, 20.5 / 30 = 0.68 and 5.1 / 30 = 0.17, so 1m
          # each, the smallest whole minute there is.
          rig=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/testnats)
          cap=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/bus)
          callout=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/cipher/natscallout)
          { go test -json -count=1 -timeout 1m -tags natslive -run "$rig" ./internal/testnats/ &&
            go test -json -count=1 -timeout 1m -tags natslive -run "$cap" -v ./internal/bus/ &&
            go test -json -count=1 -timeout 1m -tags natslive -run "$callout" ./internal/cipher/natscallout/; } > "$RUNNER_TEMP/go-test-json/natslive.json" 2> "$RUNNER_TEMP/go-test-logs/natslive.log" &
          natslive=$!
          # The integration suite, which runs a real NATS server in the test process.
          # -timeout 1m, by R6 from the pair at 8cfd2682 (the table on this job): this call's
          # one package on the slower run is internal/integration, 7.7 s (run 44657415021, job
          # 136039517737), and 7.7 / 30 = 0.26, so 1m, the smallest whole minute there is.
          go test -json -count=1 -timeout 1m ./internal/integration/ > "$RUNNER_TEMP/go-test-json/integration.json" 2> "$RUNNER_TEMP/go-test-logs/integration.log" &
          integration=$!
          # agentloop's live proof makes a real model call, so it sits behind a build tag and CI
          # never runs it. Vetting it keeps it compiling as the package changes. It writes no
          # stream: its log is everything it prints.
          go vet -tags modellive ./agentloop/ > "$RUNNER_TEMP/go-test-logs/agentloop-vet.log" 2>&1 &
          vet=$!
          s=0
          wait "$unit" || s=$?
          p=0
          wait "$impossible" || p=$?
          m=0
          wait "$pgmigrate" || m=$?
          r=0
          wait "$routes" || r=$?
          e=0
          wait "$events" || e=$?
          d=0
          wait "$shutdown" || d=$?
          n=0
          wait "$natslive" || n=$?
          i=0
          wait "$integration" || i=$?
          v=0
          wait "$vet" || v=$?
          # One group per call, in the order the calls were started: the package list first,
          # then the rest. Each is its own log, then its stream - the package result lines
          # when it passed, the whole stream when it failed - and an ::error:: naming it when it
          # failed. The step's status is the first non-zero of the nine, and the package list,
          # which prints as it goes, writes no log of its own.
          status=0
          replay() {
            echo "::group::$1 (exit $2)"
            [ ! -s "$RUNNER_TEMP/go-test-logs/$3.log" ] || cat "$RUNNER_TEMP/go-test-logs/$3.log"
            if [ "$2" -eq 0 ]; then
              jq -rj 'select(.Action == "build-output" or (.Action == "output" and .Test == null)) | .Output' "$RUNNER_TEMP/go-test-json/$3.json"
            else
              jq -rj 'select(.Action == "build-output" or .Action == "output") | .Output' "$RUNNER_TEMP/go-test-json/$3.json"
            fi
            echo "::endgroup::"
            [ "$2" -eq 0 ] || echo "::error::$1 failed (exit $2)"
            [ "$status" -ne 0 ] || status=$2
          }
          replay "the package list" "$s" unit
          replay "the race-impossible run" "$p" race-impossible
          replay "the pgmigrate package" "$m" pgmigrate
          replay "the routes package" "$r" routes
          replay "the events package" "$e" events
          replay "the shutdown feed test" "$d" shutdown
          replay "the natslive matrix" "$n" natslive
          replay "the integration suite" "$i" integration
          echo "::group::the agentloop vet (exit $v)"
          cat "$RUNNER_TEMP/go-test-logs/agentloop-vet.log"
          echo "::endgroup::"
          [ "$v" -eq 0 ] || echo "::error::the agentloop vet failed (exit $v)"
          [ "$status" -ne 0 ] || status=$v
          exit "$status"
        working-directory: packages/envoy
      # Each named test runs once on each store backend as its `aws` and `gcp` subtests, and each
      # backend's rows run that backend's own code: the store forms against the GCP fake and the
      # in-process AWS store (onEachStore) and the use chain against a broker whose settings name
      # each store, each row that runs the command reading the injection line that names its
      # store's kind (source.withSettings), all in ./cmd/cipher/; and GET /v1/settings
      # answering each store's own key field beside the Google exchange audience, in
      # ./internal/cipher/api/. This step runs only those tests in only those two packages (-run,
      # under backend-count.sh's own 5-minute -timeout, which the job's measured time holds) and counts
      # the passes of each, so a test whose AWS half was skipped or removed, or that lives in
      # neither package, reads aws=0 and fails, as the verification's check c8 requires. It is
      # their one run: the unit step and the database-skips step skip them by name.
      - name: Count the store-form rows on each backend
        run: packages/envoy/scripts/backend-count.sh ./cmd/cipher/ ./internal/cipher/api/ -- TestEverySecretFormNamesTheSourceItUses TestNoSecretFormAsksTheBrokerForACredential TestUseCommandOutsideASessionReachesTheMachineSource TestTheChainSkipsAbsenceAndStopsOnABrokenSource TestSettingsNameTheGoogleExchangeAudienceOnEitherStore
      # The step below is the one skip counter of the module's database-backed packages, which
      # envoy-go-race-api runs the Dispatch API through too, so its own test runs first:
      # packages/envoy/scripts/database-skips.test.sh plants a skipped test in
      # ./internal/cipher/api/, ./cmd/cipherd/ and ./internal/dispatch/api/ through a Go overlay and
      # holds the counter to count it; holds it to database_skips=UNKNOWN with a variable unset
      # and on a report that shows no run (no test of its packages ran, or one package's did not);
      # holds it to failing on a failed test; holds its --timeout to ending a test binary; and
      # holds a copy of it with one line of its expected-skip table deleted, in a temporary
      # checkout of this commit, to counting that test's skip. Each control stands beside a run
      # the counter passes, and each run is narrowed with -run to the tests it is about.
      - name: Test the database skip counter
        timeout-minutes: 15
        run: packages/envoy/scripts/database-skips.test.sh
      # c8 also asks that the database broker suites run with BROKER_TEST_DATABASE_URL set and that
      # none skips. go test reports a skip as a pass, so this step is where the broker's packages
      # and its command run: it runs ./internal/cipher/... and ./cmd/cipherd/ with -json (less the
      # race lane's packages under the tree, the auth service's natscallout, which envoy-go-race
      # runs: the script's DEFAULT_EXCEPT), which the unit step above leaves out, fails on a failed
      # test, and fails on any skipped test there
      # but the airlock's model comparisons, which the script's EXPECTED_SKIPS names (each needs a
      # built Lean model of the airlock, and the airlock-lean job runs them). A report that shows
      # no run prints database_skips=UNKNOWN and fails too. Its --timeout 9m is by R6 from the
      # pair at 8cfd2682 (the table on this job): the step's slowest package on the slower run is
      # cmd/cipherd, then cmd/broker, 263.2 s (run 44657322918, job 136026779841; 260.8 s in run
      # 44657415021, job 136039517737), which its stream holds, and 263.2 / 30 = 8.77, so 9m.
      # cmd/cipherd, then cmd/broker, took 580 s in main's unit step in CI on 2026-11-18 (job
      # 135007706189, on arm64), more than the 9m, and the broker's packages had 15 minutes here.
      # That -timeout bounds each package's test binary, and the packages run several at a time,
      # so one that starts late ends up to 9 minutes after its own start: the step's own limit of
      # 19 minutes, main's rule of that -timeout plus 10, leaves a package that starts within the
      # first 10 its whole -timeout, and so its dump. Measured in that same job, before
      # cmd/cipherd joined this step: 355 s for the step. Its --keep copies that run's `go test
      # -json` stream to broker.json under $RUNNER_TEMP/go-test-json, which the upload step below
      # uploads with the unit step's streams: this step's go test is one of the job's, so its
      # stream is a job artifact as the others are, and each broker test's name and result can be
      # read there (dispatch://INFRA-1075). Its --skip leaves out the backend count's test of
      # ./internal/cipher/api/, which the count step above runs.
      - name: Count the database broker suites' skips
        timeout-minutes: 19
        run: packages/envoy/scripts/database-skips.sh --timeout 9m --skip '^(TestSettingsNameTheGoogleExchangeAudienceOnEitherStore)$' --keep "$RUNNER_TEMP/go-test-json/broker.json"
      # The run of the built agent-secrets against moto needs moto, so it sits behind a build tag
      # and packages/envoy/scripts/aws-moto-check.sh runs it. Vetting it keeps it compiling.
      - name: Vet agent-secrets' moto run (no moto)
        run: go vet -tags moto ./cmd/cipher/
        working-directory: packages/envoy
      # check c-callout-live of the NATS auth service's verification: the real broker (twice, one
      # queue group), listener, Dispatch and nats-server behind the auth callout, built and started
      # by dev-stack.sh --callout on this job's Postgres, and driven by natsprobe. It prints one
      # PASS line per property and exits 1 on any FAIL or UNKNOWN.
      - name: Prove the hub behind the NATS auth service on the local stack (callout-check.sh)
        timeout-minutes: 6
        run: bash scripts/callout-check.sh
        env:
          LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        working-directory: packages/envoy
      # Always, because a red attempt's times are the ones a reader needs, and one artifact per
      # attempt because a run's artifacts are listed per run, not per attempt, and a download by
      # name picks one of several of that name without saying so
      # (docs/solutions/github/run-download-by-name-picks-one-of-several-same-named-artifacts.md).
      - name: Upload the go test -json streams
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envoy-go-test-json-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-json/
          if-no-files-found: warn
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
