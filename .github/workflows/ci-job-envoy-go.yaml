name: CI job envoy-go

# The steps of `.github/workflows/ci.yaml#envoy-go` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so no `if:` here selects the suite: the one
# this file carries lets the job envoy-go report a failed leg (`!cancelled()`).
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The unit step runs in legs, all at the same time: envoy-go-legs runs it once per leg, each over
# the packages .github/go-legs.yaml lists for that leg under envoy-go, by area (the broker, Dispatch,
# the rest), with the step's one text, and .github/scripts/go_legs.py fails the step when that
# file does not run each package of the module exactly once. The job's other steps run no leg's
# packages and run beside the legs, each kind on a runner of its own: envoy-go-alone the rows that
# measure time, on a runner nothing else loads; envoy-go-race-impossible the rest of the plain run
# the race build cannot make; envoy-go-skips the skip counter's test, the store-form count and the
# two vets; and envoy-go-natslive the container-backed NATS matrix, the integration suite and the
# callout check. The job envoy-go waits for all of them and passes only when every one passed: it
# carries the check-run name `envoy-go / envoy-go` that the one job had before the legs.
# why: .github/ci-notes/ci.md#why-envoys-go-tests-run-in-legs
#
# Each job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends, so a failing leg does not wait for the others to end. `ci-ok-changes` carries
# `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # The unit step's legs, each over its share of .github/go-legs.yaml's envoy-go packages.
  # why: .github/ci-notes/ci.md#why-envoys-go-tests-run-in-legs
  envoy-go-legs:
    name: envoy-go (leg ${{ matrix.leg }})
    runs-on: ubuntu-24.04-arm
    # Each go test step's -timeout must fire before the runner cancels the job, so a hung test
    # prints the dump that names it. A timed-out step fails the job, so the bound is the steps
    # before it at their measured times plus its own limit: about 1 minute of setup, then the
    # plain race-impossible step's five 10-minute runs, which is 51; after that step's measured
    # 5 minutes (about 2 before the API's and delivery's xid window tests joined it, which took
    # 134 s and 4 s on a two-vCPU pod; the auth service's restart storm adds 17 s, and the API's
    # claim model is not among them, running in envoy-go-claim-model) the unit step's
    # own 20 is 26; after the unit step, which runs strictly fewer packages than the 35 minutes it
    # measured before the race lane's left it and so cannot exceed that, the leaver hold step's own
    # 15 is 56 (one package, so its -timeout bounds the step); after that step's measured 4
    # minutes at most (its four tests in parallel took 260 s on a dev box with GOMAXPROCS=4, and
    # this runner takes about 0.75 of that box's time: cmd/dispatch took 642.9 s here in job
    # 136853209152 and 853 s there), the store-form count's
    # own 5 is 50 (two packages, which go test starts at once with -p at least 2, so its -timeout
    # bounds the step); after that step's seconds, the skip counter's test's own timeout-minutes
    # of 15 is 60; after that step's 15 at most, the database skip count's own timeout-minutes of
    # 30 is 90 (its -timeout bounds each package, not the step, so the step has a limit of its
    # own, and its comment below says why 30); after that step's 30 at most, natslive's default
    # 10, the bus matrix's own 5, the auth service's own 5, the edge grant's own 5 and the edge
    # listener's own 10 (its relay socket's rows wait out a 30 s token twice and a consumer's 60 s
    # ack wait) are 125, the integration step's 5 is less, and the callout check's own 6, after the
    # seconds those two steps measure, is less too. The job's 130 leaves the edge listener's
    # -timeout 5 minutes to fire and print its dump before the runner cancels the job.
    timeout-minutes: 130
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        # Its settings, its /dev/shm and its health check: .github/scripts/postgres-service-settings.sh's header.
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=1000 -c max_prepared_transactions=10
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-start-period 60s
          --health-start-interval 1s
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOB_TIMEOUT_MINUTES: 130 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image would be one more registry pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy-test: the envoy module's test binaries, which the jobs of this file build between
      # them, each its share, and no other job builds, so they keep a family of their own.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-test-{0}-{1}-', runner.os, runner.arch) }}
      # The settings the service's command: line asks for, read back from the server; why each one
      # is .github/scripts/postgres-service-settings.sh's header.
      - name: Read the service's settings back
        timeout-minutes: 2
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres.id }}" postgres
      - name: Check the service allows this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # The server's version and the pgvector version it offers, read from the service itself, so
      # the run shows which Postgres the tests below ran on.
      - name: Postgres service version
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc "select current_setting('server_version_num'), coalesce((select default_version from pg_available_extensions where name = 'vector'), 'no vector')"
      # The images the module's tests start, pulled first for the reason the action gives:
      # testnats.HubImage, the image the hub runs Envoy on, testnats.Image (nats:2.10), and
      # tests3.Image.
      - name: Pull test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
            packages/envoy/internal/tests3/seaweedfs.go Image
      # Each leg runs the packages .github/go-legs.yaml lists for its number under envoy-go, through
      # database-skips.sh: every package of the module but those of the race lane's three jobs,
      # which run them under the detector, and internal/integration, which envoy-go-natslive's
      # integration step tests, and internal/textcheck, whose tests are the text-check job's: that
      # job runs them in a job with no database and no Bun, and a change to only what they read must
      # not start this one. So are internal/dispatch/architecture/notes, internal/runnerlog,
      # internal/dispatch/specgraph, cmd/architecture-check and cmd/spec-check, which
      # envoy-go-build tests on every push (NOTE_AND_SPEC_PACKAGES), and listenerwire and
      # internal/wirecheck, which envoy-go-build tests in their place (LISTENERWIRE_PACKAGES):
      # listenerwire's clients test type-checks daemon packages, so a change to only those daemon
      # packages starts no job with a database. go_legs.py prints the leg's packages only once
      # `go list ./...` and the file agree, no package in two places; a package the file does not
      # name (a pull request that adds one and no line in .github/go-legs.yaml, which this job,
      # held back on a pull request, does not run) runs in leg 5, the last, which `unlisted` names,
      # with a warning in every leg, so a merge group neither fails on it nor runs it nowhere; and
      # `set -o pipefail` is what fails the step when go_legs.py refuses the file, rather than test
      # what xargs got; .github/scripts/ci_job_reads.py's
      # hold_envoy_legs holds the file's `elsewhere` to the jobs those packages' steps are built
      # for, so what the legs leave out and what the other jobs run cannot drift apart.
      # Each leg's packages run in one `go test -json` through database-skips.sh --count-table,
      # which also answers c8's ask that the database broker suites run with
      # BROKER_TEST_DATABASE_URL set and that none skips: go test reports a skip as a pass, so the
      # script counts the skips of the broker's packages among the leg's, ./internal/cipher/...,
      # its command, ./cmd/cipherd/, and the writer hold's client, ./internal/holdrecord/, and fails
      # on any there but the airlock's model comparisons, which the script's EXPECTED_SKIPS names
      # (each needs a built Lean model of the airlock, and the airlock-lean job runs them). The auth
      # service's natscallout runs in a leg here too, beside its race run in envoy-go-race, since
      # its hold rows open the broker's Postgres and skip without it: this run counts their skips
      # (`.github/go-legs.yaml#twice`). A report that shows no run of one of those packages prints
      # database_skips=UNKNOWN and fails too, a leg that holds none of them prints
      # database_skips=NONE, and a failed test of any package of the leg fails it. The skips of the
      # rest of the module are not counted; hold_envoy_legs holds every package of the broker's
      # table to a leg here, so each is counted in one. The -timeout 20m bounds each package's
      # test binary, and a leg's packages run several at a time, so one that starts late ends up to
      # 20 minutes after its own start: the step's own limit of 30 leaves a package that starts
      # within the first 10 minutes its whole -timeout, and so its dump, and no leg's packages sum
      # to 40 minutes of package time (.github/go-legs.yaml's times), so each starts before then. The
      # two tests of the web app's display-tree fixture are skipped: without `--check`
      # TestWebDisplayFixture writes the committed fixture rather than checking it, so a run here
      # would ask nothing of it, and TestTheWebFixtureFindsItsFilesFromAnyDirectory stats that same
      # file, which would make it a read of this job; envoy-go-build runs both, the first with the
      # check, and both texts are built from the same list. So are the backend count's tests of
      # cmd/cipher and internal/cipher/api, which envoy-go-skips' count step runs in the same build
      # and env (BACKEND_COUNT_TESTS), and the rows whose bound is on time, which envoy-go-alone
      # runs on a runner nothing else loads (UNIT_ALONE_TESTS).
      - name: Unit test envoy Go package
        timeout-minutes: 30
        run: |
          set -o pipefail
          python3 ../../.github/scripts/go_legs.py packages/envoy envoy-go ${{ matrix.leg }} ${{ strategy.job-total }} | xargs -r scripts/database-skips.sh --timeout 20m --skip '^(TestABatchCutOffInFlightKeepsItsOrder|TestABucketWaitWhoseLookupsAreHeldFailsByNameInTime|TestAClaimLeftByAnotherProcessIsTakenWhenItLapses|TestADeletedBucketFailsAWriteWithinTheBudget|TestAHolderWhoseRecordFindsTheHoldAnothersStopsItsRenewal|TestAProcessReportsASilentNATSCutWithinSeconds|TestARollingUpdatesSuccessorHandsEachMentionTheOldProcessLeftOnce|TestAStalledListingFailsWithinTheReadTimeout|TestAStandbyDoesNotTryTheHoldForEveryEventTheHolderWrites|TestAStandbyTakesAFreeHoldWithNoNotification|TestAStoppedOutboxHandsThePublisherToTheOtherAtOnce|TestAWriteIsEmbeddedOnItsNotification|TestAnEventNATSNeverAcknowledgesIsBackedOffAndRecorded|TestAnOutboxThatLosesNATSReleasesThePublisher|TestAnOutboxWhoseNATSGoesSilentGivesThePublisherToTheOther|TestClosingThePoolGivesUpOnALateConnectionOnceTheDatabaseStopsAnswering|TestEnrollThroughTheHelperPastTheBoundSaysTheOutcomeIsUnknown|TestEverySecretFormNamesTheSourceItUses|TestExecLearnsOfAGrantAfterAFullHold|TestExecLearnsOfTheGrantWithinASecond|TestGCPSecretMetadataSourceIsPresentWhenItYieldsAToken|TestHealthzAnswersWhilePostgresAndTheBucketBothStopAnswering|TestHealthzAnswersWhilePostgresStopsAnswering|TestHoldExpiryMatchesTheDatabaseClock|TestHoldReportsLossBeforeTheDatabaseExpiryWhenRenewalsFail|TestIdentity|TestNoSecretFormAsksTheBrokerForACredential|TestOneFillHoldsTheLeaseAndAnotherTakesOverWithinSixtySeconds|TestOnlyOneOutboxPublishesAtATime|TestReserveTokensSharesItsBudgetAcrossConnections|TestSIGTERMWhileARequestHoldsHTTPShutdownStillSettlesTheOwedDocument|TestSIGTERMWithOpenStreamsExitsPromptlyAndSettlesTheOwedDocument|TestSIGTERMWithTheDatabaseUnansweringExitsWithinTheShutdownBudget|TestSamplerHeapReadDelaysNoSample|TestScanPassReturnsWhenThePendingRowsFallDue|TestSettingsNameTheGoogleExchangeAudienceOnEitherStore|TestSyncDeadlineIsRecordedOnTheRow|TestTheChainSkipsAbsenceAndStopsOnABrokenSource|TestTheIdentityStepsRunOnceTheQueueFirstEmbeds|TestTheListenerReplacesAHalfOpenConnection|TestTheLostLineIsWrittenBeforeTheReleaseAndDatesTheStop|TestTheOutboxDoesNotScanWhileIdle|TestTheWebFixtureFindsItsFilesFromAnyDirectory|TestUseCommandOutsideASessionReachesTheMachineSource|TestWebDisplayFixture)$' --count-table
        working-directory: packages/envoy
        # The refs package's xid window test runs here, so this step judges gaps too.
        env:
          DISPATCH_XID_REQUIRE_GAP_JUDGMENT: "1"
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  # The rows that measure time, on a runner nothing else loads, beside the legs.
  # why: .github/ci-notes/ci.md#why-envoys-go-tests-run-in-legs
  envoy-go-alone:
    name: envoy-go (alone)
    runs-on: ubuntu-24.04-arm
    # Each go test's -timeout must fire before the runner cancels the job, so a hung test prints
    # the dump that names it. The lines run one after another, each under its own 10-minute
    # -timeout: twelve of the rows whose bound is on time and five of the race-impossible rows,
    # 170 minutes at most after about 2 of setup, so 175.
    timeout-minutes: 175
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        # Its settings, its /dev/shm and its health check: .github/scripts/postgres-service-settings.sh's header.
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=1000 -c max_prepared_transactions=10
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-start-period 60s
          --health-start-interval 1s
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOB_TIMEOUT_MINUTES: 175 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image would be one more registry pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy-test: the envoy module's test binaries, which the jobs of this file build between
      # them, each its share, and no other job builds, so they keep a family of their own.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-test-{0}-{1}-', runner.os, runner.arch) }}
      # The settings the service's command: line asks for, read back from the server; why each one
      # is .github/scripts/postgres-service-settings.sh's header.
      - name: Read the service's settings back
        timeout-minutes: 2
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres.id }}" postgres
      - name: Check the service allows this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # The server's version and the pgvector version it offers, read from the service itself, so
      # the run shows which Postgres the tests below ran on.
      - name: Postgres service version
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc "select current_setting('server_version_num'), coalesce((select default_version from pg_available_extensions where name = 'vector'), 'no vector')"
      # The images the module's tests start, pulled first for the reason the action gives:
      # testnats.HubImage, the image the hub runs Envoy on, testnats.Image (nats:2.10), and
      # tests3.Image.
      - name: Pull test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
            packages/envoy/internal/tests3/seaweedfs.go Image
      # The unit packages' rows whose assertion is a bound on how long something takes, measured
      # from the test's own clock, under twice its slowest reading (ci_job_reads.py's
      # UNIT_ALONE_TESTS says which and why): beside a leg's other packages they measure the load,
      # so they run here, on a runner nothing else loads, one package and one test at a time
      # (-parallel 1), and the unit legs skip each by its name. Each line is its package's own -run,
      # built from that list, so a row added there and missing here fails the ci-filters job naming
      # this step.
      - name: Test the rows whose bound is on time, alone
        run: |
          go test -count=1 -parallel 1 -timeout 10m -run '^(TestEnrollThroughTheHelperPastTheBoundSaysTheOutcomeIsUnknown|TestExecLearnsOfAGrantAfterAFullHold|TestExecLearnsOfTheGrantWithinASecond|TestGCPSecretMetadataSourceIsPresentWhenItYieldsAToken|TestIdentity)$' ./cmd/cipher/
          go test -count=1 -parallel 1 -timeout 10m -run '^(TestAProcessReportsASilentNATSCutWithinSeconds|TestARollingUpdatesSuccessorHandsEachMentionTheOldProcessLeftOnce|TestClosingThePoolGivesUpOnALateConnectionOnceTheDatabaseStopsAnswering|TestHealthzAnswersWhilePostgresAndTheBucketBothStopAnswering|TestHealthzAnswersWhilePostgresStopsAnswering|TestSIGTERMWhileARequestHoldsHTTPShutdownStillSettlesTheOwedDocument|TestSIGTERMWithOpenStreamsExitsPromptlyAndSettlesTheOwedDocument|TestSIGTERMWithTheDatabaseUnansweringExitsWithinTheShutdownBudget)$' ./cmd/dispatch/
          go test -count=1 -parallel 1 -timeout 10m -run '^(TestADeletedBucketFailsAWriteWithinTheBudget)$' ./internal/cistore/
          go test -count=1 -parallel 1 -timeout 10m -run '^(TestSyncDeadlineIsRecordedOnTheRow)$' ./internal/dispatch/architecture/
          go test -count=1 -parallel 1 -timeout 10m -run '^(TestHoldExpiryMatchesTheDatabaseClock|TestHoldReportsLossBeforeTheDatabaseExpiryWhenRenewalsFail)$' ./internal/dispatch/duty/
          go test -count=1 -parallel 1 -timeout 10m -run '^(TestAClaimLeftByAnotherProcessIsTakenWhenItLapses|TestAWriteIsEmbeddedOnItsNotification|TestReserveTokensSharesItsBudgetAcrossConnections|TestScanPassReturnsWhenThePendingRowsFallDue|TestTheIdentityStepsRunOnceTheQueueFirstEmbeds)$' ./internal/dispatch/embedqueue/
          go test -count=1 -parallel 1 -timeout 10m -run '^(TestABatchCutOffInFlightKeepsItsOrder|TestAHolderWhoseRecordFindsTheHoldAnothersStopsItsRenewal|TestAStandbyDoesNotTryTheHoldForEveryEventTheHolderWrites|TestAStoppedOutboxHandsThePublisherToTheOtherAtOnce|TestAnEventNATSNeverAcknowledgesIsBackedOffAndRecorded|TestAnOutboxThatLosesNATSReleasesThePublisher|TestAnOutboxWhoseNATSGoesSilentGivesThePublisherToTheOther|TestOnlyOneOutboxPublishesAtATime|TestTheLostLineIsWrittenBeforeTheReleaseAndDatesTheStop|TestTheOutboxDoesNotScanWhileIdle)$' ./internal/dispatch/outbox/
          go test -count=1 -parallel 1 -timeout 10m -run '^(TestAStandbyTakesAFreeHoldWithNoNotification|TestOneFillHoldsTheLeaseAndAnotherTakesOverWithinSixtySeconds)$' ./internal/dispatch/textversions/
          go test -count=1 -parallel 1 -timeout 10m -run '^(TestAStalledListingFailsWithinTheReadTimeout)$' ./internal/legionagents/
          go test -count=1 -parallel 1 -timeout 10m -run '^(TestTheListenerReplacesAHalfOpenConnection)$' ./internal/pglisten/
          go test -count=1 -parallel 1 -timeout 10m -run '^(TestABucketWaitWhoseLookupsAreHeldFailsByNameInTime)$' ./internal/testnats/
          go test -count=1 -parallel 1 -timeout 10m -run '^(TestSamplerHeapReadDelaysNoSample)$' ./loadtest/
        working-directory: packages/envoy
      # The rows of the plain run the race build cannot make that measure time, alone for the same
      # reason (ci_job_reads.py's RACE_IMPOSSIBLE_ALONE_*): every xid window test, which judges the
      # statement-free gaps of a window against a bound; the xid rig's own tests, which read the
      # thread clocks those gaps come from; the API's 200 ms bound on the issue list; and the auth
      # service's restart storm, whose five hundred connections must all be admitted within the
      # callout's deadline. The documents package's line runs under Go's cleanup detector and with
      # -v, as its line in envoy-go-race-impossible does. Each line's -run is derived from the race
      # lane's packages and their files' //go:build !race and raceEnabled, as that step's are.
      - name: Test the xid window rows, the API's issue-list bound and the auth service's storm, alone
        run: |
          go test -count=1 -timeout 10m -run '^(TestXidWindowAttributionMoveRecorded|TestXidWindowDeployedEventRecorded)$' ./internal/dispatch/delivery
          go test -count=1 -timeout 10m -run '^(TestABeginThatFindsNoTracerMemoryIsUnknown|TestACommitThatEndsAfterTheCaptureIsInsideTheTrace|TestAGapsDeviceSoftirqsHoldOnlyTheirMeasuredTime|TestAMeasureUnderGoTestTraceSaysSo|TestAQuotasReadingSeesASleepAsASleep|TestAQuotasThrottlingReadsAsAWaitForACPU|TestARigProblemHidesNoViolation|TestASleepAfterARuntimeHandoffIsNotErasedByIt|TestASoftirqCountIsReadAtItsCPUsColumn|TestASoftirqCountThatWrappedInAGapReadsItsRuns|TestAStallInTheTracesCalibrationShiftsNoMoment|TestAStalledCalibrationLeavesAGapOfTheCodesCPUMade|TestAStatementTheRigCouldNotReadIsUnknown|TestAStoppedMeasureLeavesTheNextItsOwnTrace|TestAWaitOnAPHandedToALockedThreadDecidesNothing|TestAWindowThatKeepsD6OnlyOnARuntimeWaitIsUnknown|TestRuleTwoReadsTheStatementsTheCodeMade|TestTheKernelsInterruptAccountingIsReadOffProcStat|TestTheRigCountsTheSoftirqsItsPinnedCPURuns|TestTheTracersEventsInAWindowTouchNoFreshPage|TestWithoutNamesTheTracersMemoryIsWhatWasMappedSinceTheTraceStarted|TestXidGapJudgmentNeedsReadableThreadClocks)$' ./internal/dispatch/store/storetest
