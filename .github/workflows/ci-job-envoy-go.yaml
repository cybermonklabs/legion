          go test -count=1 -timeout 10m -run '^(TestACalloutStormAfterAServerRestartAdmitsEveryConnection)$' ./internal/cipher/natscallout
          go test -count=1 -timeout 10m -run '^(TestACommitThatEndsAfterTheCaptureIsInsideTheTrace|TestAGapsDeviceSoftirqsHoldOnlyTheirMeasuredTime|TestAMeasureUnderGoTestTraceSaysSo|TestAQuotasReadingSeesASleepAsASleep|TestAQuotasThrottlingReadsAsAWaitForACPU|TestARigProblemHidesNoViolation|TestASleepAfterARuntimeHandoffIsNotErasedByIt|TestASoftirqCountIsReadAtItsCPUsColumn|TestASoftirqCountThatWrappedInAGapReadsItsRuns|TestAStallInTheTracesCalibrationShiftsNoMoment|TestAStalledCalibrationLeavesAGapOfTheCodesCPUMade|TestAStatementTheRigCouldNotReadIsUnknown|TestAStoppedMeasureLeavesTheNextItsOwnTrace|TestAWaitOnAPHandedToALockedThreadDecidesNothing|TestAWindowThatKeepsD6OnlyOnARuntimeWaitIsUnknown|TestRuleTwoReadsTheStatementsTheCodeMade|TestTheKernelsInterruptAccountingIsReadOffProcStat|TestTheRigCountsTheSoftirqsItsPinnedCPURuns|TestTheTracersEventsInAWindowTouchNoFreshPage|TestXidGapJudgmentNeedsReadableThreadClocks)$' ./internal/dispatch/store/storetest
          go test -count=1 -timeout 10m -run '^(TestXidWindowApprovalAnswerOverTwoDocuments|TestXidWindowAskAnswerBlock|TestXidWindowAskBlockEditThenIssueClose|TestXidWindowAskResolveBlock|TestXidWindowDeliveries|TestXidWindowDocumentRebuild|TestXidWindowIssueAskRepairRestoration|TestXidWindowIssueAskRepairWithdrawal|TestXidWindowRouteTable|TestXidWindowUploadRestoringTheApprovedText|TestXidWindowsOnTheLargeSpec)$' ./internal/dispatch/api
          go test -count=1 -timeout 10m -run '^(TestARoomFedOnlyByAgentWritesKeepsMemoryWithinTheBound|TestRenderReuseARandomisedEditStorm|TestRenderReuseAReplicaReplaysTheRoomsFormattingExactly|TestUploadsOverOpenAnchorsKeepMemoryWithinTheBound|TestUploadsToARoomInUseKeepMemoryWithinTheBound|TestXidWindowCannotJudgeAWaitWhileTheOperationsOwnGoroutinesHoldEveryP|TestXidWindowKeepsD6WhenTheLoadHoldsThePs|TestXidWindowRigHoldsAGapsSoftirqsToTheirCap|TestXidWindowRigNeverExcusesASleepForSoftirqs)$' ./internal/dispatch/docs
        working-directory: packages/envoy
        # This step judges the xid window tests' statement-free gaps (storetest.XidJudgesGaps).
        # With this set, a runner whose kernel stops showing a thread's scheduler clocks, or
        # refuses to hold a thread out of NUMA balancing, fails those tests naming why, rather than
        # passing them on the window's shape alone (storetest.XidRequireGapsEnv).
        env:
          DISPATCH_XID_REQUIRE_GAP_JUDGMENT: "1"
      # Everything the race lane's jobs run is left out here, since they run it under the detector,
      # and so is internal/integration, which the integration step below tests, and
      # internal/textcheck, whose tests are the text-check job's: that job runs them in a job
      # with no database and no Bun, and a change to only what they read must not start this
      # one. So are internal/dispatch/architecture/notes, internal/runnerlog,
      # internal/dispatch/specgraph, cmd/architecture-check and cmd/spec-check, which
      # envoy-go-checks tests on every push (NOTE_AND_SPEC_PACKAGES), and listenerwire and
      # internal/wirecheck, which envoy-go-checks tests in their place (LISTENERWIRE_PACKAGES):
      # listenerwire's clients test type-checks daemon packages, so a change to only those daemon
      # packages starts no job with a database. The pattern is built in
      # .github/scripts/ci_job_reads.py from the same list those jobs' own steps are built from, so
      # what this step leaves out and what the other jobs run cannot drift apart. The broker's
      # packages, internal/cipher and everything under it, and its command, cmd/cipherd, are left
      # out too: the database-skips step below runs them with -json and fails on a failed test as
      # on a skipped one, so this step ran each of them a second time (DATABASE_SKIPS_PKGS in
      # ci_job_reads.py); that step in turn leaves out the race lane's packages under the tree, the
      # auth service's natscallout today (DATABASE_SKIPS_PATTERN). What is left is the rest of the
      # module, the two longest packages of it (the API's and the documents service's) now among
      # the ones the lane runs, so its 20
      # minutes are ample. The two tests of the web app's display-tree fixture are skipped:
      # without `--check` TestWebDisplayFixture writes the committed fixture rather than checking
      # it, so a run here would ask nothing of it, and
      # TestTheWebFixtureFindsItsFilesFromAnyDirectory stats that same file, which would make it
      # a read of this job; envoy-go-checks runs both, the first with the check, and both texts
      # are built from the same list. So are the backend count's four tests of cmd/cipher,
      # which the count step below runs in this same job and env (BACKEND_COUNT_TESTS), and the
      # leaver hold's four real-time tests of cmd/dispatch, which the next step runs
      # (LEAVER_BOUND_TESTS).
      - name: Unit test envoy Go package
        run: |
          go list ./... | grep -Ev '/integration|/internal/textcheck$|/internal/dispatch/architecture/notes$|/internal/runnerlog$|/internal/dispatch/specgraph$|/cmd/architecture-check$|/cmd/spec-check$|/listenerwire$|/internal/wirecheck$|/internal/cipher($|/)|/cmd/cipherd$|/internal/dispatch/delivery($|/)|/internal/bus$|/cmd/listener$|/internal/store$|/internal/session$|/internal/kvwatch($|/)|/natscred$|/internal/cipher/natscallout$|/internal/oidc$|/internal/dispatch/store($|/)|/internal/dispatch/api$|/internal/dispatch/docs$' | xargs go test -count=1 -timeout 20m -skip '^(TestEverySecretFormNamesTheSourceItUses|TestIAPLeaverHoldThroughTheRealBroker|TestLeaverHoldBound|TestLeaverHoldBoundByThePass|TestLeaverHoldRelease|TestNoSecretFormAsksTheBrokerForACredential|TestTheChainSkipsAbsenceAndStopsOnABrokenSource|TestTheWebFixtureFindsItsFilesFromAnyDirectory|TestUseCommandOutsideASessionReachesTheMachineSource|TestWebDisplayFixture)$'
        working-directory: packages/envoy
        # The refs package's xid window test runs here, so this step judges gaps too.
        env:
          DISPATCH_XID_REQUIRE_GAP_JUDGMENT: "1"
      # The leaver hold's four real-time tests of cmd/dispatch (LEAVER_BOUND_TESTS in
      # .github/scripts/ci_job_reads.py, which builds this run: and the unit step's -skip): a
      # refresh Google answers slowly, the membership pass's schedule, the broker's cache and the
      # release a day later, each waited out on the wall clock. In the unit step they took
      # cmd/dispatch past its 20-minute -timeout (job 136860339963 timed out at 1200 s, where the
      # package took 642.9 s without them, job 136853209152). Here they run alone, in parallel with
      # one another, each on a rig of its own, through packages/envoy/scripts/named-tests.sh, which
      # fails unless each named test ran and passed: a -run that matches nothing is a pass to go
      # test, so a renamed or deleted test would otherwise leave this step green while it ran fewer
      # tests than it names. Its --timeout 15m bounds the one package's test binary, and so the step.
      # Measured: 260 s on a dev box with GOMAXPROCS=4, build included, where cmd/dispatch's unit
      # run without them took 786 s. It runs unless the job was cancelled, whatever the unit step
      # answered: it is a test step of its own, and a failure in the unit step must not hide its
      # result.
      - name: Test the leaver hold's real-time bounds
        if: ${{ !cancelled() }}
        run: packages/envoy/scripts/named-tests.sh --timeout 15m ./cmd/dispatch/ -- TestIAPLeaverHoldThroughTheRealBroker TestLeaverHoldBound TestLeaverHoldBoundByThePass TestLeaverHoldRelease
      # Each named test runs once on each store backend as its `aws` and `gcp` subtests, and each
      # backend's rows run that backend's own code: the store forms against the GCP fake and the
      # in-process AWS store (onEachStore) and the use chain against a broker whose settings name
      # each store, each row that runs the command reading the injection line that names its
      # store's kind (source.withSettings), all in ./cmd/cipher/; and GET /v1/settings
      # answering each store's own key field beside the Google exchange audience, in
      # ./internal/cipher/api/. This step runs only those tests in only those two packages (-run,
      # under backend-count.sh's own 5-minute -timeout, which the budget above counts) and counts
      # the passes of each, so a test whose AWS half was skipped or removed, or that lives in
      # neither package, reads aws=0 and fails, as the verification's check c8 requires. It is
      # their one run: the unit step and the database-skips step skip them by name.
      - name: Count the store-form rows on each backend
        run: packages/envoy/scripts/backend-count.sh ./cmd/cipher/ ./internal/cipher/api/ -- TestEverySecretFormNamesTheSourceItUses TestNoSecretFormAsksTheBrokerForACredential TestUseCommandOutsideASessionReachesTheMachineSource TestTheChainSkipsAbsenceAndStopsOnABrokenSource TestSettingsNameTheGoogleExchangeAudienceOnEitherStore
      # The step below is the one skip counter of the module's database-backed packages, which
      # envoy-go-race-api runs the Dispatch API through too, so its own test runs first:
      # packages/envoy/scripts/database-skips.test.sh plants a skipped test in
      # ./internal/cipher/api/, ./cmd/cipherd/ and ./internal/dispatch/api/ through a Go overlay and
      # holds the counter to count it; holds it to database_skips=UNKNOWN with a variable unset
      # and on a report that shows no run (no test of its packages ran, or one package's did not);
      # holds it to failing on a failed test; holds its --timeout to ending a test binary; and
      # holds a copy of it with one line of its expected-skip table deleted, in a temporary
      # checkout of this commit, to counting that test's skip. Each control stands beside a run
      # the counter passes, and each run is narrowed with -run to the tests it is about.
      - name: Test the database skip counter
        timeout-minutes: 15
        run: packages/envoy/scripts/database-skips.test.sh
      # c8 also asks that the database broker suites run with BROKER_TEST_DATABASE_URL set and that
      # none skips. go test reports a skip as a pass, so this step is where the broker's packages
      # and its command run: it runs ./internal/cipher/... and ./cmd/cipherd/ with -json (less the
      # race lane's packages under the tree, the auth service's natscallout, which envoy-go-race
      # runs: the script's DEFAULT_EXCEPT), which the unit step above leaves out, fails on a failed
      # test, and fails on any skipped test there
      # but the airlock's model comparisons, which the script's EXPECTED_SKIPS names (each needs a
      # built Lean model of the airlock, and the airlock-lean job runs them). A report that shows
      # no run prints database_skips=UNKNOWN and fails too. Its --timeout 20m is
      # the -timeout the unit step gave cmd/cipherd before the package moved here, so no package's
      # limit falls: cmd/cipherd took 580 s in the unit step in CI on 2026-11-18 (job
      # 135007706189), and the broker's packages had 15 minutes here. That -timeout bounds each
      # package's test binary, and the packages run several at a time, so one that starts late
      # ends up to 20 minutes after its own start: the step's own limit of 30 minutes leaves a
      # package that starts within the first 10 its whole -timeout, and so its dump. Measured in
      # that same job, before cmd/cipherd joined this step: 355 s for the step. Its --skip leaves
      # out the backend count's test of ./internal/cipher/api/, which the count step above runs.
      - name: Count the database broker suites' skips
        timeout-minutes: 30
        run: packages/envoy/scripts/database-skips.sh --timeout 20m --skip '^(TestSettingsNameTheGoogleExchangeAudienceOnEitherStore)$'
      # agentloop's live proof makes a real model call, so it sits behind a build tag and CI
      # never runs it. Vetting it keeps it compiling as the package changes.
      - name: Vet agentloop's live proof (no model call)
        run: go vet -tags modellive ./agentloop/
        working-directory: packages/envoy
      # The run of the built agent-secrets against moto needs moto, so it sits behind a build tag
      # and packages/envoy/scripts/aws-moto-check.sh runs it. Vetting it keeps it compiling.
      - name: Vet agent-secrets' moto run (no moto)
        run: go vet -tags moto ./cmd/cipher/
        working-directory: packages/envoy
      # internal/testnats runs its server in the test process, so the untagged step above starts
      # no container. The real-server tests, a rendered authorization on the image the hub runs
      # among them, are the one thing an in-process server cannot reproduce: they sit behind the
      # natslive tag, and this step is where they run (INFRA-250). internal/bus has tests of its own
      # there. One is the consumer cap: the module links nats-server v2.15.1 in process, which caps
      # a stream that sets no cap at a default of its own and takes a change of MaxConsumers on a
      # stream that already exists, so the raise of an uncapped ENVOY_NOTIFICATIONS to the consumer
      # cap this binary compiles and the keeper's restore of a cap an operator lowered or unset are
      # proved in process. What is left for a real image is the pair of 2.10 cases - the stream with
      # no cap the binary must leave alone, and the refusal of the raise of a lower cap, naming the
      # field, the cap and the first server taking the change - and the hub's own reconcile on the
      # nats:2.15.1-alpine image the deployment runs (INFRA-1384). The others are a session
      # consumer's own messages behind other sessions' traffic on the hub's image, the listener's
      # refusal of nats:2.10 (natsversion), and that refusal's control: on 2.10, stepped past, the
      # consumer loses its old-form message. internal/cipher/natscallout has one too: that the
      # image the hub runs lets a user with an empty publish allow list publish anywhere, the
      # fail-open its guard refuses, so the guard is shown able to fail on the server production
      # runs. natsgrant and cmd/listener have the edge listener's: the server refuses the edge's
      # user a Dispatch event, and the edge listener starts, relays a send and is reached by a
      # role message through a shared listener under its rendered grant, with no violation, and
      # ends its start, naming its inbox prefix, under a grant without it; a role message of the
      # edge reaches no holder of another project's role; and the relay socket's rows, most of the
      # step's time, run two edge listeners and the real broker with 30 s tokens, and carry frames
      # and receipts, refuse other sessions' subjects, and close the socket at a token's expiry,
      # a revoke, a Reset, a person's removal, a changed answer, a person's hold, a not-held
      # answer past its deadline and an unreachable broker. Each
      # package runs only the tests its tag adds: `-tags natslive ./pkg` would re-run
      # the package's untagged tests, which already run elsewhere - internal/testnats and natsgrant
      # in a unit leg, internal/bus and cmd/listener in envoy-go-race, and
      # internal/cipher/natscallout in both - so the -run comes from .github/scripts/go-tagged-tests.sh,
      # which reads the names off the source at run time, and no test name is spelled here. Each
      # assignment is a line of its own: under bash -e it carries the script's exit status, so an
      # empty or refused list fails the step instead of running -run "", which matches every test.
      - name: Test the container-backed NATS matrix (natslive)
        run: |
          rig=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/testnats)
          go test -count=1 -tags natslive -run "$rig" ./internal/testnats/
          cap=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/bus)
          go test -count=1 -timeout 5m -tags natslive -run "$cap" -v ./internal/bus/
          callout=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/cipher/natscallout)
          go test -count=1 -timeout 5m -tags natslive -run "$callout" -v ./internal/cipher/natscallout/
          grant=$(../../.github/scripts/go-tagged-tests.sh natslive ./natsgrant)
          go test -count=1 -timeout 5m -tags natslive -run "$grant" -v ./natsgrant/
          edge=$(../../.github/scripts/go-tagged-tests.sh natslive ./cmd/listener)
          go test -count=1 -timeout 10m -tags natslive -run "$edge" -v ./cmd/listener/
        working-directory: packages/envoy

      - name: Integration test envoy (a real NATS server, in the test process)
        run: go test ./internal/integration/ -timeout 300s -count=1
        working-directory: packages/envoy
      # check c-callout-live of the NATS auth service's verification: the real broker (twice, one
      # queue group), listener, Dispatch and nats-server behind the auth callout, built and started
      # by dev-stack.sh --callout on this job's Postgres, and driven by natsprobe. It prints one
      # PASS line per property and exits 1 on any FAIL or UNKNOWN.
      - name: Prove the hub behind the NATS auth service on the local stack (callout-check.sh)
        timeout-minutes: 6
        run: bash scripts/callout-check.sh
        env:
          LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        working-directory: packages/envoy
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  # The check run `envoy-go / envoy-go`, which the one job carried before its unit step ran in legs:
  # it waits for every leg and every job beside them and passes only when all passed, so ci-ok, the
  # merge queue and every reader of that name read what they read before. A leg's own failure has
  # already posted its early ci-ok from the leg.
  # why: .github/ci-notes/ci.md#why-envoys-go-tests-run-in-legs
  envoy-go:
    needs: [envoy-go-legs, envoy-go-alone, envoy-go-race-impossible, envoy-go-skips, envoy-go-natslive]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      JOB_TIMEOUT_MINUTES: 5 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    steps:
      # The ci-ok report below is an action of this repository's .github.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      # The jobs this one waits for are the ones `needs:` names, and only there: the test reads
      # every result through `needs.*.result`, so a job added to `needs:` is tested with the rest.
      # A job that failed, was cancelled or was skipped fails this one; the error prints their
      # results, and each job's own check run says why. (`toJSON(needs)` would name each job beside
      # its result, but it carries every output of every job, which
      # .github/scripts/check-ci-filters.sh refuses in a run: (rule 23).) The results are written
      # into the run: rather than set in an env:, which check-ci-filters.sh reads as able to move
      # what the legs' go commands compile. The error says this job restates its legs' result, in
      # the words `.github/scripts/runner-shutdown.sh#RUNNER_SHUTDOWN_RESTATED` holds, so a leg the
      # platform killed still reads as a runner shutdown: this job's failure only follows the
      # leg's, and read as its own it would hide the leg's.
      - name: Pass only when every leg passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = true ]; then
            echo "::error::envoy-go's legs and the jobs beside them ended ${{ join(needs.*.result, ', ') }}, and this job restates its legs' result: each leg's own check run says why it did not pass"
            exit 1
          fi
          echo "envoy-go's legs and the jobs beside them ended ${{ join(needs.*.result, ', ') }}"

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
