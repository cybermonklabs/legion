  # The rest of the plain run the race build cannot make, beside the legs.
  envoy-go-race-impossible:
    name: envoy-go (race-impossible)
    runs-on: ubuntu-24.04-arm
    # The step's two lines run one after another, each under its own 10-minute -timeout, after
    # about 2 minutes of setup, so 25.
    timeout-minutes: 25
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        # Its settings, its /dev/shm and its health check: .github/scripts/postgres-service-settings.sh's header.
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=1000 -c max_prepared_transactions=10
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-start-period 60s
          --health-start-interval 1s
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOB_TIMEOUT_MINUTES: 25 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy-test: the envoy module's test binaries, which the jobs of this file build between
      # them, each its share, and no other job builds, so they keep a family of their own.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-test-{0}-{1}-', runner.os, runner.arch) }}
      # The settings the service's command: line asks for, read back from the server; why each one
      # is .github/scripts/postgres-service-settings.sh's header.
      - name: Read the service's settings back
        timeout-minutes: 2
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres.id }}" postgres
      - name: Check the service allows this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # The server's version and the pgvector version it offers, read from the service itself, so
      # the run shows which Postgres the tests below ran on.
      - name: Postgres service version
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc "select current_setting('server_version_num'), coalesce((select default_version from pg_available_extensions where name = 'vector'), 'no vector')"
      # The tests the race detector makes impossible that measure no time, which the race job of
      # each of these packages therefore cannot make, so envoy-go keeps a plain run of exactly
      # them: internal/bus counts HoldsSeed's allocations, which the race runtime's own
      # allocations would be counted into; and the documents package measures the heap a room
      # keeps, which the detector's shadow memory and instrumentation move. Those are out of the
      # race build altogether (//go:build !race), and the two render-reuse storms run fewer seeds
      # and fewer edits under it (raceEnabled), so this is their full-size run. The documents
      # package's line runs under Go's cleanup detector (GODEBUG=checkfinalizers=1), as
      # envoy-go-race-docs' run of the rest of it does, since it is the one package that registers
      # a cleanup (ci_job_reads.py's CLEANUP_DETECTOR), and with -v, so its TestMain's count of
      # services left alive prints. The rows of that run that measure time (the xid window tests,
      # the xid rig, the API's issue-list bound and the auth service's restart storm) run alone in
      # envoy-go-alone. The API's mention sender claim model is out of the race build too, and
      # runs in a job of its own, envoy-go-claim-model; the API's nine source guards, and
      # one_expression_guard_test.go beside them, carry that tag as well and are deliberately not
      # here: they read the module's source, the text-check job runs their twenty-two tests by
      # name, and ci_job_reads.py's CLAIM_MODEL_TESTS and TEXT_CHECK_TESTS leave exactly those
      # tests out of this step rather than have each of them run twice. The -run lists are derived
      # in .github/scripts/ci_job_reads.py from the race lane's own packages and those files'
      # //go:build !race and raceEnabled, so a test added to either and missing here fails the
      # ci-filters job naming this step. 10 minutes each is ample.
      - name: Test what the race build cannot run at all or at full size
        run: |
          go test -count=1 -timeout 10m -run '^(TestHoldsSeedAllocatesAtMostOneCopyPerDecoding)$' ./internal/bus
          GODEBUG=checkfinalizers=1 go test -v -count=1 -timeout 10m -run '^(TestARoomFedOnlyByAgentWritesKeepsMemoryWithinTheBound|TestRenderReuseARandomisedEditStorm|TestRenderReuseAReplicaReplaysTheRoomsFormattingExactly|TestUploadsOverOpenAnchorsKeepMemoryWithinTheBound|TestUploadsToARoomInUseKeepMemoryWithinTheBound)$' ./internal/dispatch/docs
        working-directory: packages/envoy
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

