name: CI job envoy-go

# The steps of `.github/workflows/ci.yaml#envoy-go` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go:
    runs-on: ubuntu-24.04-arm
    # Each go test step's -timeout must fire before the runner cancels the job, so a hung test
    # prints the dump that names it. A timed-out step fails the job, so the bound is the steps
    # before it at their measured times plus its own limit: about 1 minute of setup, then the
    # plain race-impossible step's five 10-minute runs, which is 51; after that step's measured
    # 5 minutes (about 2 before the API's and delivery's xid window tests joined it, which took
    # 134 s and 4 s on a two-vCPU pod; the auth service's restart storm adds 17 s, and the API's
    # claim model is not among them, running in envoy-go-claim-model) the store-form count's own
    # 5 is 11 (two packages, which go test starts at once with -p at least 2, so its -timeout
    # bounds the step); after that step's seconds, the skip counter's test's own timeout-minutes
    # of 15 is 21; after that step's 15 at most, the unit step's own timeout-minutes of 49 is 70
    # (its -timeout bounds each package, not the step, so the step has a limit of its own, and its
    # comment below says why 49); after that step's 49 at most, natslive's default 10, the bus
    # matrix's own 5, the auth service's own 5, the edge grant's own 5 and the edge listener's own
    # 10 (its relay socket's rows wait out a 30 s token twice and a consumer's 60 s ack wait) are
    # 105, the integration step's 5 is less, and the callout check's own 6, after the seconds
    # those two steps measure, is less too, as is the route adopter's own 5 after install-jj's
    # seconds and the callout check's.
    timeout-minutes: 109
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOB_TIMEOUT_MINUTES: 109 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image would be one more registry pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # (The smoke test and the image it runs are ci.yaml's envoy-smoke job,
      # .github/workflows/ci-job-envoy-smoke.yaml.)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy-test: this job builds and runs the test binary of every package of the envoy
      # module, a set no other job builds, so it keeps a family of its own.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-test-{0}-{1}-', runner.os, runner.arch) }}
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # No commit, checkpoint or database copy here waits for the runner's disk: why every
      # Postgres service runs so is .github/scripts/pg-crash-safety-off.sh's header.
      - name: Turn crash safety off on the service
        timeout-minutes: 2
        run: .github/scripts/pg-crash-safety-off.sh "${{ job.services.postgres.id }}"
      # The server's version and the pgvector version it offers, read from the service itself, so
      # the run shows which Postgres the tests below ran on.
      - name: Postgres service version
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc "select current_setting('server_version_num'), coalesce((select default_version from pg_available_extensions where name = 'vector'), 'no vector')"
      # Every image the tests here start: testnats.HubImage, which the natslive step below runs
      # Envoy on, testnats.Image (nats:2.10), which only the tests of that server itself and of the
      # listener's refusal of it start, and tests3.Image, pulled first for the reason the action
      # gives.
      - name: Pull test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
            packages/envoy/internal/tests3/seaweedfs.go Image
      # The tests the race detector makes impossible, which the race job of each of these packages
      # therefore cannot make, so envoy-go keeps a plain run of exactly them: internal/bus counts
      # HoldsSeed's allocations, which the race runtime's own allocations would be counted into;
      # the API's, delivery's and the documents package's xid window tests judge a window's gaps,
      # which the detector stretches past any bound, so a race run would check only their shape,
      # which this run checks as well (storetest.XidJudgesGaps, INFRA-636); and the documents
      # package measures the heap a room keeps, which the detector's shadow memory and
      # instrumentation move. Those are out of the race build altogether (//go:build !race), and
      # the two render-reuse storms run fewer seeds and fewer edits under it (raceEnabled), so this
      # is their full-size run. The documents package's line runs under Go's cleanup detector
      # (GODEBUG=checkfinalizers=1), as envoy-go-race-docs' run of the rest of it does, since it is
      # the one package that registers a cleanup (ci_job_reads.py's CLEANUP_DETECTOR), and with -v,
      # so its TestMain's count of services left alive and the xid rig's logs print. So is the
      # NATS auth service's restart storm's: five hundred connections, two hundred under the
      # detector (raceEnabled), whose instrumentation makes each in-process connect several times
      # the cost (natscallout's race_disabled_test.go says why). The API's mention sender claim
      # model is out of the race build too, and runs in a job of its own, envoy-go-claim-model;
      # the API's nine source guards, and one_expression_guard_test.go beside them, carry that
      # tag as well and are deliberately not here: they read the module's source, the text-check
      # job runs their twenty-two tests by name, and ci_job_reads.py's CLAIM_MODEL_TESTS and
      # TEXT_CHECK_TESTS leave exactly those tests out of this step rather than have each of them
      # run twice. It comes before the unit step for the
      # reason the API package's own run did: run beside the other package binaries,
      # its Postgres-backed tests and the room-memory measurements queue their per-test database
      # cleanup on the service's one checkpointer, and the API's live-feed and delivery-hub tests
      # wait for the event log's safe horizon, which before cybermonklabs/legion#4913 any open
      # transaction on this job's Postgres delayed and since then only an event write of each
      # test's own database does. The six -run lists are derived in
      # .github/scripts/ci_job_reads.py from the race lane's own packages and those files'
      # //go:build !race and raceEnabled, so a test added to either and missing here fails the
      # ci-filters job naming this step. The restart storm took
      # 17 s on a dev box. Measured over three
      # runs on a two-vCPU pod: the bus under a tenth of a second and the documents package 92 to
      # 127 s; with the xid window tests in, one run on a two-vCPU pod took the API 134.082 s and
      # delivery 4.106 s (INFRA-636), and the documents package's line, with fifteen of its tests,
      # took 55.972 s (job 137362821700). The API line also runs the issue list's 200 ms bound,
      # TestAPriorityListAnswersWithinItsBoundOnEveryPlan, which seeds 13,298 issues and makes
      # about 840 timed reads: 37 s on an eight-CPU build pod (INFRA-5609), and the whole API line
      # took 106.397 s in this job (job 139092511342). 10 minutes each is ample.
      - name: Test what the race build cannot run at all or at full size
        run: |
          go test -count=1 -timeout 10m -run '^(TestXidWindowAttributionMoveRecorded|TestXidWindowDeployedEventRecorded)$' ./internal/dispatch/delivery
          go test -count=1 -timeout 10m -run '^(TestABeginThatFindsNoTracerMemoryIsUnknown|TestACommitThatEndsAfterTheCaptureIsInsideTheTrace|TestAGapsDeviceSoftirqsHoldOnlyTheirMeasuredTime|TestAMeasureUnderGoTestTraceSaysSo|TestAQuotasReadingSeesASleepAsASleep|TestAQuotasThrottlingReadsAsAWaitForACPU|TestARigProblemHidesNoViolation|TestASleepAfterARuntimeHandoffIsNotErasedByIt|TestASoftirqCountIsReadAtItsCPUsColumn|TestASoftirqCountThatWrappedInAGapReadsItsRuns|TestAStallInTheTracesCalibrationShiftsNoMoment|TestAStalledCalibrationLeavesAGapOfTheCodesCPUMade|TestAStatementTheRigCouldNotReadIsUnknown|TestAStoppedMeasureLeavesTheNextItsOwnTrace|TestAWaitOnAPHandedToALockedThreadDecidesNothing|TestAWindowThatKeepsD6OnlyOnARuntimeWaitIsUnknown|TestRuleTwoReadsTheStatementsTheCodeMade|TestTheKernelsInterruptAccountingIsReadOffProcStat|TestTheRigCountsTheSoftirqsItsPinnedCPURuns|TestTheTracersEventsInAWindowTouchNoFreshPage|TestWithoutNamesTheTracersMemoryIsWhatWasMappedSinceTheTraceStarted|TestXidGapJudgmentNeedsReadableThreadClocks)$' ./internal/dispatch/store/storetest
          go test -count=1 -timeout 10m -run '^(TestHoldsSeedAllocatesAtMostOneCopyPerDecoding)$' ./internal/bus
          go test -count=1 -timeout 10m -run '^(TestACalloutStormAfterAServerRestartAdmitsEveryConnection)$' ./internal/cipher/natscallout
          go test -count=1 -timeout 10m -run '^(TestAPriorityListAnswersWithinItsBoundOnEveryPlan|TestXidWindowApprovalAnswerOverTwoDocuments|TestXidWindowAskAnswerBlock|TestXidWindowAskBlockEditThenIssueClose|TestXidWindowAskResolveBlock|TestXidWindowDeliveries|TestXidWindowDocumentRebuild|TestXidWindowIssueAskRepairRestoration|TestXidWindowIssueAskRepairWithdrawal|TestXidWindowRouteTable|TestXidWindowUploadRestoringTheApprovedText|TestXidWindowsOnTheLargeSpec|TestXidWindowsUnderTheParentStatusRule)$' ./internal/dispatch/api
          GODEBUG=checkfinalizers=1 go test -v -count=1 -timeout 10m -run '^(TestARoomFedOnlyByAgentWritesKeepsMemoryWithinTheBound|TestRenderReuseARandomisedEditStorm|TestRenderReuseAReplicaReplaysTheRoomsFormattingExactly|TestUploadsOverOpenAnchorsKeepMemoryWithinTheBound|TestUploadsToARoomInUseKeepMemoryWithinTheBound|TestXidWindowAnchorBlockBackfill|TestXidWindowBlockIndexWindowArm|TestXidWindowCannotJudgeAWaitWhileTheOperationsOwnGoroutinesHoldEveryP|TestXidWindowCatchesADocumentCallInsideTheWindow|TestXidWindowClosedIssueSettlementVersionWrite|TestXidWindowEditNoticeSweep|TestXidWindowKeepsD6WhenTheLoadHoldsThePs|TestXidWindowReconcileTaskProgress|TestXidWindowRigCatchesAGapAfterTheFirstWrite|TestXidWindowRigHoldsAGapsSoftirqsToTheirCap|TestXidWindowRigJudgesAWriteThePollerNeverSaw|TestXidWindowRigKeepsItsOwnWorkOutOfTheGaps|TestXidWindowRigNeverExcusesASleepForSoftirqs|TestXidWindowRigPassesBackToBackStatementsAfterTheFirstWrite|TestXidWindowRigReadsASleepAfterAHandoffAsTheCodes|TestXidWindowRigReadsTheMachinesLoadAsTheMachines|TestXidWindowRigReadsTheRuntimesWaitAsTheRuntimes|TestXidWindowSettlementVersionWrite)$' ./internal/dispatch/docs
        working-directory: packages/envoy
        # This step judges the xid window tests' statement-free gaps (storetest.XidJudgesGaps).
        # With this set, a runner whose kernel stops showing a thread's scheduler clocks, or
        # refuses to hold a thread out of NUMA balancing, fails those tests naming why, rather than
        # passing them on the window's shape alone (storetest.XidRequireGapsEnv).
        env:
          DISPATCH_XID_REQUIRE_GAP_JUDGMENT: "1"
      # Each named test runs once on each store backend as its `aws` and `gcp` subtests, and each
      # backend's rows run that backend's own code: the store forms against the GCP fake and the
      # in-process AWS store (onEachStore) and the use chain against a broker whose settings name
      # each store, each row that runs the command reading the injection line that names its
      # store's kind (source.withSettings), all in ./cmd/cipher/; and GET /v1/settings
      # answering each store's own key field beside the Google exchange audience, in
      # ./internal/cipher/api/. This step runs only those tests in only those two packages (-run,
      # under backend-count.sh's own 5-minute -timeout, which the budget above counts) and counts
      # the passes of each, so a test whose AWS half was skipped or removed, or that lives in
      # neither package, reads aws=0 and fails, as the verification's check c8 requires. It is
      # their one run: the unit step skips them by name.
      - name: Count the store-form rows on each backend
        run: packages/envoy/scripts/backend-count.sh ./cmd/cipher/ ./internal/cipher/api/ -- TestEverySecretFormNamesTheSourceItUses TestNoSecretFormAsksTheBrokerForACredential TestUseCommandOutsideASessionReachesTheMachineSource TestTheChainSkipsAbsenceAndStopsOnABrokenSource TestSettingsNameTheGoogleExchangeAudienceOnEitherStore
      # The unit step below runs the module through the one skip counter of its database-backed
      # packages, which envoy-go-race-api runs the Dispatch API through too, so the counter's own
      # test runs first: packages/envoy/scripts/database-skips.test.sh plants a skipped test in
      # ./internal/cipher/api/, ./cmd/cipherd/, ./internal/holdrecord/ and ./internal/dispatch/api/
      # through a Go overlay and
      # holds the counter to count it; holds it to database_skips=UNKNOWN with a variable unset
      # and on a report that shows no run (no test of its packages ran, or one package's did not);
      # holds it to failing on a failed test; holds its --timeout to ending a test binary; holds a
      # copy of it with one line of its expected-skip table deleted, in a temporary checkout of
      # this commit, to counting that test's skip; and holds its --module-except to counting no
      # skip of the packages it adds and failing on their failures. Each control stands beside a
      # run the counter passes, and each run is narrowed with -run to the tests it is about.
      - name: Test the database skip counter
        timeout-minutes: 15
        run: packages/envoy/scripts/database-skips.test.sh
      # Everything the three race jobs run is left out here, since they run it under the detector,
      # but the race lane's packages under the broker's tree whose skips this step counts, and so
      # is internal/integration, which the integration step below tests, and
      # internal/textcheck, whose tests are the text-check job's: that job runs them in a job
      # with no database and no Bun, and a change to only what they read must not start this
      # one. So are internal/dispatch/architecture/notes, internal/runnerlog,
      # internal/dispatch/specgraph, cmd/architecture-check and cmd/spec-check, which
      # envoy-go-build tests on every push (NOTE_AND_SPEC_PACKAGES), listenerwire and
      # internal/wirecheck, which envoy-go-build tests in their place (LISTENERWIRE_PACKAGES):
      # listenerwire's clients test type-checks daemon packages, so a change to only those daemon
      # packages starts no job with a database; and cmd/dispatch-route-adopt, which the adopter
      # step below runs with jj installed (ADOPTER_PACKAGES). The --module-except pattern is built in
      # .github/scripts/ci_job_reads.py from the same list those jobs' own steps are built from, so
      # what this step leaves out and what the other jobs run cannot drift apart.
      # The rest of the module runs in one `go test -json` through database-skips.sh, which also
      # answers c8's ask that the database broker suites run with BROKER_TEST_DATABASE_URL set and
      # that none skips: go test reports a skip as a pass, so the script counts the skips of the
      # broker's packages, ./internal/cipher/..., its command, ./cmd/cipherd/, and the writer
      # hold's client, ./internal/holdrecord/, and fails on any there but the airlock's model
      # comparisons, which the script's EXPECTED_SKIPS names (each needs a built Lean model of the
      # airlock, and the airlock-lean job runs them). The auth service's natscallout runs here too,
      # beside its race run in envoy-go-race, since its hold rows open the broker's Postgres and
      # skip without it: this run counts their skips. A report that shows no run of those packages
      # prints database_skips=UNKNOWN and fails too, and so does a failed test of any package of
      # the run. The skips of the rest of the module are not counted. The broker's packages ran in
      # a step of their own after this one until INFRA-1075, and each step waited on its longest
      # package: in merge-group run 45048924209 (job 137290624677) this step took 14.8 minutes
      # behind cmd/cipher's 690 s, and the broker's step 15.3 behind cmd/cipherd's 714 s, its four
      # -p slots running 1,817 s of package time, half what they had; one go test fills the slots
      # of both. The -timeout 20m bounds each package's test binary, and the packages run several
      # at a time, so one that starts late ends up to 20 minutes after its own start: the step's
      # own limit leaves a package that starts within the first 29 minutes its whole -timeout, and
      # so its dump. natscallout and internal/holdrecord joined the count after that measurement:
      # on a dev box at a load average of 700 to 970, with -p 4, they took 147 s and 50 s of
      # package time (and natscallout 109 s alone), so they move a late package's start by at most
      # 197 s, about 3.3 minutes, even run one after the other: 45 minutes then, 49 now. The two
      # tests of the web app's display-tree fixture are skipped: without `--check`
      # TestWebDisplayFixture writes the committed fixture rather than checking it, so a run here
      # would ask nothing of it, and TestTheWebFixtureFindsItsFilesFromAnyDirectory stats that same
      # file, which would make it a read of this job; envoy-go-build runs both, the first with the
      # check, and both texts are built from the same list. So are the backend count's tests of
      # cmd/cipher and internal/cipher/api, which the count step above runs in this same job and
      # env (BACKEND_COUNT_TESTS).
      - name: Unit test envoy Go package
        timeout-minutes: 49
        run: packages/envoy/scripts/database-skips.sh --timeout 20m --skip '^(TestEverySecretFormNamesTheSourceItUses|TestNoSecretFormAsksTheBrokerForACredential|TestSettingsNameTheGoogleExchangeAudienceOnEitherStore|TestTheChainSkipsAbsenceAndStopsOnABrokenSource|TestTheWebFixtureFindsItsFilesFromAnyDirectory|TestUseCommandOutsideASessionReachesTheMachineSource|TestWebDisplayFixture)$' --module-except '/integration|/internal/textcheck$|/internal/dispatch/architecture/notes$|/internal/runnerlog$|/internal/dispatch/specgraph$|/cmd/architecture-check$|/cmd/spec-check$|/listenerwire$|/internal/wirecheck$|/cmd/dispatch-route-adopt$|/internal/dispatch/delivery($|/)|/internal/dispatch/store($|/)|/internal/bus$|/cmd/listener$|/internal/store$|/internal/session$|/internal/kvwatch($|/)|/natscred$|/internal/oidc$|/internal/dispatch/api$|/internal/dispatch/docs$'
        # The refs package's xid window test runs here, so this step judges gaps too.
        env:
          DISPATCH_XID_REQUIRE_GAP_JUDGMENT: "1"
      # agentloop's live proof makes a real model call, so it sits behind a build tag and CI
      # never runs it. Vetting it keeps it compiling as the package changes.
      - name: Vet agentloop's live proof (no model call)
        run: go vet -tags modellive ./agentloop/
        working-directory: packages/envoy
      # The run of the built agent-secrets against moto needs moto, so it sits behind a build tag
      # and packages/envoy/scripts/aws-moto-check.sh runs it. Vetting it keeps it compiling.
      - name: Vet agent-secrets' moto run (no moto)
        run: go vet -tags moto ./cmd/cipher/
        working-directory: packages/envoy
      # internal/testnats runs its server in the test process, so the untagged step above starts
      # no container. The real-server tests, a rendered authorization on the image the hub runs
      # among them, are the one thing an in-process server cannot reproduce: they sit behind the
      # natslive tag, and this step is where they run (INFRA-250). internal/bus has tests of its own
      # there. One is the consumer cap: the module links nats-server v2.15.1 in process, which caps
      # a stream that sets no cap at a default of its own and takes a change of MaxConsumers on a
      # stream that already exists, so the raise of an uncapped ENVOY_NOTIFICATIONS to the consumer
      # cap this binary compiles and the keeper's restore of a cap an operator lowered or unset are
      # proved in process. What is left for a real image is the pair of 2.10 cases - the stream with
      # no cap the binary must leave alone, and the refusal of the raise of a lower cap, naming the
      # field, the cap and the first server taking the change - and the hub's own reconcile on the
      # nats:2.15.1-alpine image the deployment runs (INFRA-1384). The others are a session
      # consumer's own messages behind other sessions' traffic on the hub's image, the listener's
      # refusal of nats:2.10 (natsversion), and that refusal's control: on 2.10, stepped past, the
      # consumer loses its old-form message. internal/cipher/natscallout has one too: that the
      # image the hub runs lets a user with an empty publish allow list publish anywhere, the
      # fail-open its guard refuses, so the guard is shown able to fail on the server production
      # runs. natsgrant and cmd/listener have the edge listener's: the server refuses the edge's
      # user a Dispatch event, and the edge listener starts, relays a send and is reached by a
      # role message through a shared listener under its rendered grant, with no violation, and
      # ends its start, naming its inbox prefix, under a grant without it; a role message of the
      # edge reaches no holder of another project's role; and the relay socket's rows, most of the
      # step's time, run two edge listeners and the real broker with 30 s tokens, and carry frames
      # and receipts, refuse other sessions' subjects, and close the socket at a token's expiry,
      # a revoke, a Reset, a person's removal, a changed answer and an unreachable broker. Each
      # package runs only the tests its tag adds: `-tags natslive ./pkg` would re-run
      # the package's untagged tests, which already run elsewhere - internal/testnats in the unit
      # step above, and internal/bus and internal/cipher/natscallout in envoy-go-race, which the
      # unit step's --module-except leaves out - so the -run comes from .github/scripts/go-tagged-tests.sh,
      # which reads the names off the source at run time, and no test name is spelled here. Each
      # assignment is a line of its own: under bash -e it carries the script's exit status, so an
      # empty or refused list fails the step instead of running -run "", which matches every test.
      - name: Test the container-backed NATS matrix (natslive)
        run: |
          rig=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/testnats)
          go test -count=1 -tags natslive -run "$rig" ./internal/testnats/
          cap=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/bus)
          go test -count=1 -timeout 5m -tags natslive -run "$cap" -v ./internal/bus/
          callout=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/cipher/natscallout)
          go test -count=1 -timeout 5m -tags natslive -run "$callout" -v ./internal/cipher/natscallout/
          grant=$(../../.github/scripts/go-tagged-tests.sh natslive ./natsgrant)
          go test -count=1 -timeout 5m -tags natslive -run "$grant" -v ./natsgrant/
          edge=$(../../.github/scripts/go-tagged-tests.sh natslive ./cmd/listener)
          go test -count=1 -timeout 10m -tags natslive -run "$edge" -v ./cmd/listener/
        working-directory: packages/envoy

      - name: Integration test envoy (a real NATS server, in the test process)
        run: go test ./internal/integration/ -timeout 300s -count=1
        working-directory: packages/envoy
      # check c-callout-live of the NATS auth service's verification: the real broker (twice, one
      # queue group), listener, Dispatch and nats-server behind the auth callout, built and started
      # by dev-stack.sh --callout on this job's Postgres, and driven by natsprobe. It prints one
      # PASS line per property and exits 1 on any FAIL or UNKNOWN.
      - name: Prove the hub behind the NATS auth service on the local stack (callout-check.sh)
        timeout-minutes: 6
        run: bash scripts/callout-check.sh
        env:
          LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        working-directory: packages/envoy
      # The route adopter's rows run under git and under jj, and those that need jj fail rather
      # than skip on GitHub Actions without it, so jj is installed first. -v names each row in the
      # log, which the unit step's go test -json report does not; that step's --module-except leaves
      # the package out (ADOPTER_PACKAGES in .github/scripts/ci_job_reads.py), so this is its one
      # run. The package took 4.5 s in job 139022226359; the -timeout fires before the step's limit.
      - uses: ./.github/actions/install-jj
      - name: Test the route adopter under git and jj
        timeout-minutes: 5
        run: go test -count=1 -v -timeout 4m ./cmd/dispatch-route-adopt/
        working-directory: packages/envoy
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
