name: CI job envoy-e2e-local

# The steps of two jobs, `.github/workflows/ci.yaml#envoy-e2e-local` and
# `.github/workflows/ci.yaml#envoy-refill`, in a file of their own.
# ci.yaml's job of each id calls this file and passes its own id as `job`, and the job of this
# file named for it runs while the other is skipped. Each caller keeps `needs: changes` and the
# whole `if:` that decides whether its job runs, so the `if:` here only picks which of the two
# that is. The two share a file because ci.yaml already calls as many reusable workflows as
# .github/scripts/check-workflow-files.sh allows it
# (.github/ci-notes/ci.md#two-jobs-that-call-one-file), and both build the same listener and
# natsd from the go-envoy cache.
#
# The split is for the filters. Each job's filter names this file beside ci.yaml, so a change to
# these steps selects these two jobs alone, where a change to ci.yaml selects every job.
#
# Each job's last step reports ci-ok for its caller: on a merge-group run the job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      job:
        description: >-
          The id of ci.yaml's job that calls this file, `envoy-e2e-local` or `envoy-refill`: the
          job of this file of that id runs, and the other is skipped.
        type: string
        required: true
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-e2e-local:
    if: inputs.job == 'envoy-e2e-local'
    runs-on: ubuntu-24.04-arm
    # Budget (ci-budgets.md's Budgets note): 600 s, the 10 minutes this job carried, above its 92 s
    # measured maximum, plus its slowest retried step alone — the setup-bun step's two
    # `ci_tools_fetch` calls, 3416 s, above packages/envoy's `go mod download` and the
    # workspace install at 5 x 180 + 150 = 1050 s each and the ci-ok report's 2460 s.
    # 600 + 3416 = 4016 s -> 67 min.
    timeout-minutes: 67
    env:
      JOB_TIMEOUT_MINUTES: 67 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its own retry arithmetic, which is the action's: two `ci_tools_fetch` calls,
      # 2 x 1708 = 3416 s (ci-budgets.md's Budgets note) -> 57 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 57
      # Retried at 180 s per attempt like every Bun install here (ci-budgets.md's Retries note).
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile >&2
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy: the listener and natsd e2e-local.sh builds.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
      # The module e2e-local.sh builds the listener and natsd from, downloaded once and retried
      # before it (ci-budgets.md's Retries note; the retried unit is the download, never the build).
      # 180 s per attempt, 1.6 times the 113 s of the slowest cold run measured
      # (packages/envoy/infra; packages/envoy 77 s, on an empty module cache on 2026-11-07), and
      # an attempt the bound kills leaves what it fetched for the next one; the restore above
      # makes the common run cost nothing.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      # scripts/e2e-local.test.sh drives the driver's refusals, which the acceptance run below
      # never reaches: an unknown option, --help, and an E2E_NATS_PORT, E2E_PORT or E2E_SESSION_PORT
      # another process already holds, which the driver uses as given and fails on rather than
      # replacing it or running against a server it did not start. It needs the bun and go this job
      # already has, and it runs first because it is seconds (INFRA-250).
      - name: Refusal test for e2e-local.sh
        run: bash scripts/e2e-local.test.sh
        working-directory: packages/envoy
      - name: Local end-to-end acceptance
        run: bash scripts/e2e-local.sh
        working-directory: packages/envoy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: envoy-e2e-local-evidence-${{ github.run_attempt }}
          path: packages/envoy/out/e2e
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 2580 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 43
        env:
          STEP_TIMEOUT_MINUTES: 43 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-e2e-local
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  # The refill live proof (.github/ci-notes/ci.md#what-the-refill-live-proof-shows).
  envoy-refill:
    if: inputs.job == 'envoy-refill'
    runs-on: ubuntu-24.04-arm
    # The budget: in an agent pod with 2 shared CPUs, the reread scenario took 5 min 26 s and
    # refuse 3 min 5 s, each with its builds on a warm Go cache. interrupt and recreate-live were
    # not timed there. They wait mostly on the listener's 30 s self-health tick, and by the
    # script's own waits each of their four runs takes about 2 to 4 minutes. 40 minutes is about
    # twice the sum, which leaves room for a cold Go cache. recreate-live runs a shape again when
    # its verdict is INVALID, up to 3 attempts in all. Timed later in such a pod, one attempt took
    # 74 to 76 s, so the 4 attempts this can add (2 shapes, 2 more attempts each) take up to about
    # 5 minutes. The budget adds 6 minutes for them, 46 in all, 2760 s.
    # Its key is the larger sum of .github/ci-budgets.md#the-budgets-note, and its slowest retried
    # step is the ci-ok report, 2460 s (ci-budgets.md's Budgets note, "The ci-ok report"), above
    # packages/envoy's `go mod download` at 5 x 180 + 150 = 1050 s. The first sum is
    # 2760 + 2460 = 5220 s. The steps before the report are the 2760 s above, timed with no module
    # download step, so that step counts at its 1050 s: 3810 s, and with the report's rounded
    # limit of 43 minutes, 2580 s, the second sum is the larger. 3810 + 2580 = 6390 s -> 107 min.
    timeout-minutes: 107
    env:
      JOB_TIMEOUT_MINUTES: 107 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy: the listener and natsd e2e-refill.sh builds, as envoy-e2e-local's e2e-local.sh
      # does.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
      # The module e2e-refill.sh builds refillrig, the listener and natsd from, downloaded once and
      # retried before it (ci-budgets.md's Retries note; the retried unit is the download, never
      # the build), at the 180 s per attempt envoy-e2e-local's same download carries; the restore
      # above makes the common run cost nothing.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      # Every scenario of the proof (INFRA-261): reread, interrupt (stop and restart),
      # recreate-live (both shapes) and refuse. The script needs curl, flock, go, jq and setsid,
      # which the runner image carries and setup-go adds. Its evidence directory is the runner's
      # temporary directory, so the upload below finds it.
      - name: Refill live proof
        run: bash packages/envoy/scripts/e2e-refill.sh --out "$RUNNER_TEMP/envoy-e2e-refill"
      # Each scenario's listener and NATS logs, polls and judge commands. The binaries the script
      # built are left out.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: envoy-refill-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/envoy-e2e-refill
            !${{ runner.temp }}/envoy-e2e-refill/bin
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 2580 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 43
        env:
          STEP_TIMEOUT_MINUTES: 43 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-refill
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
