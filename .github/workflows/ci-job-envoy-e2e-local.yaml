name: CI job envoy-e2e-local

# The steps of two jobs, `.github/workflows/ci.yaml#envoy-e2e-local` and
# `.github/workflows/ci.yaml#envoy-refill`, in a file of their own.
# ci.yaml's job of each id calls this file and passes its own id as `job`, and the jobs of this
# file for it run while the other's are skipped: envoy-e2e-local for the one, envoy-refill-legs
# and envoy-refill, which restates the legs' result, for the other. Each caller keeps
# `needs: changes` and the whole `if:` that decides whether its job runs, so the `if:` here only
# picks which of the two that is. The two share a file because ci.yaml already calls as many
# reusable workflows as .github/scripts/check-workflow-files.sh allows it
# (.github/ci-notes/ci.md#two-jobs-that-call-one-file), and both build the same listener and
# natsd from the go-envoy cache.
#
# The split is for the filters. Each job's filter names this file beside ci.yaml, so a change to
# these steps selects these two jobs alone, where a change to ci.yaml selects every job.
#
# Each job's last step reports ci-ok for its caller: on a merge-group run the job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends, so a failing leg of envoy-refill does not wait for the others to end.
# `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      job:
        description: >-
          The id of ci.yaml's job that calls this file, `envoy-e2e-local` or `envoy-refill`: the
          jobs of this file for that id run, and the other's are skipped.
        type: string
        required: true
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-e2e-local:
    if: inputs.job == 'envoy-e2e-local'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      JOB_TIMEOUT_MINUTES: 10 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy: the listener and natsd e2e-local.sh builds.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
      # scripts/e2e-local.test.sh drives the driver's refusals, which the acceptance run below
      # never reaches: an unknown option, --help, and an E2E_NATS_PORT, E2E_PORT or E2E_SESSION_PORT
      # another process already holds, which the driver uses as given and fails on rather than
      # replacing it or running against a server it did not start. It needs the bun and go this job
      # already has, and it runs first because it is seconds (INFRA-250).
      - name: Refusal test for e2e-local.sh
        run: bash scripts/e2e-local.test.sh
        working-directory: packages/envoy
      - name: Local end-to-end acceptance
        run: bash scripts/e2e-local.sh
        working-directory: packages/envoy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: envoy-e2e-local-evidence-${{ github.run_attempt }}
          path: packages/envoy/out/e2e
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-e2e-local
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  # The refill live proof (.github/ci-notes/ci.md#what-the-refill-live-proof-shows), one leg per
  # scenario of packages/envoy/scripts/e2e-refill.sh, all at the same time, each on a runner of its
  # own with the same rig (Go and the go-envoy cache) and its own build of refillrig, the listener
  # and natsd. The matrix is the committed list of the script's scenarios, the four its `all`
  # runs, so each scenario runs in exactly one leg and in the mode the one job ran it in:
  # interrupt by stop and by restart, recreate-live in both shapes. The job envoy-refill waits for
  # the legs and passes only when every leg passed.
  # why: .github/ci-notes/ci.md#what-the-refill-live-proof-shows
  envoy-refill-legs:
    name: envoy-refill (${{ matrix.scenario }})
    if: inputs.job == 'envoy-refill'
    runs-on: ubuntu-24.04-arm
    strategy:
      # One leg's failure leaves the others running, so each reports its own scenario.
      fail-fast: false
      matrix:
        scenario: [reread, interrupt, recreate-live, refuse]
    # The budget of a leg: in an agent pod with 2 shared CPUs, the reread scenario took 5 min 26 s
    # and refuse 3 min 5 s, each with its builds on a warm Go cache. interrupt and recreate-live
    # wait mostly on the listener's 30 s self-health tick, and by the script's own waits each of
    # their two runs takes about 2 to 4 minutes, up to 8 for the leg. recreate-live runs a shape
    # again when its verdict is INVALID, up to 3 attempts in all; one attempt took 74 to 76 s in
    # such a pod, so the 4 attempts this can add take up to about 5 minutes more, about 13 for
    # that leg. On the runner the longest scenario, interrupt, took 2 min 47 s (job
    # 140854851306). 20 minutes is half again the longest leg in a pod, which leaves room for a
    # cold Go cache.
    timeout-minutes: 20
    env:
      JOB_TIMEOUT_MINUTES: 20 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy: the listener and natsd e2e-refill.sh builds, as envoy-e2e-local's e2e-local.sh
      # does.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
      # The leg's scenario of the proof (INFRA-261): reread, interrupt (stop and restart),
      # recreate-live (both shapes) or refuse. The script needs curl, flock, go, jq and setsid,
      # which the runner image carries and setup-go adds. Its evidence directory is the runner's
      # temporary directory, so the upload below finds it.
      - name: Refill live proof
        run: bash packages/envoy/scripts/e2e-refill.sh --scenario "${{ matrix.scenario }}" --out "$RUNNER_TEMP/envoy-e2e-refill"
      # The scenario's listener and NATS logs, polls and judge commands, under an artifact name of
      # the leg's own. The binaries the script built are left out.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: envoy-refill-evidence-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/envoy-e2e-refill
            !${{ runner.temp }}/envoy-e2e-refill/bin
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-refill
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  # The job of the caller's name, which restates the legs' result under the check-run name
  # `envoy-refill / envoy-refill`, so ci-ok's job map, the merge queue and every reader of that
  # name read what they read before the legs. A leg's own failure has already posted its early
  # ci-ok from the leg. `!cancelled()` runs it after a leg that failed, where GitHub would skip a
  # job whose needs did not all succeed, and the input keeps it skipped, as the legs are, under
  # envoy-e2e-local (.github/ci-notes/ci.md#two-jobs-that-call-one-file).
  # why: .github/ci-notes/ci.md#what-the-refill-live-proof-shows
  envoy-refill:
    needs: [envoy-refill-legs]
    if: ${{ !cancelled() && inputs.job == 'envoy-refill' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      JOB_TIMEOUT_MINUTES: 5 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    steps:
      # The ci-ok report below is an action of this repository's .github.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      # The result is written into the run: rather than set in an env:, which check-ci-filters.sh
      # reads as able to move what the legs' go commands compile. The error says this job restates
      # its legs' result, in the words `.github/scripts/runner-shutdown.sh#RUNNER_SHUTDOWN_RESTATED`
      # holds, so a leg the platform killed still reads as a runner shutdown.
      - name: Pass only when every leg passed
        run: |
          if [ "${{ needs.envoy-refill-legs.result }}" != success ]; then
            echo "::error::envoy-refill's legs ended ${{ needs.envoy-refill-legs.result }}, and this job restates its legs' result: each leg's own check run says why it did not pass"
            exit 1
          fi
          echo "envoy-refill's legs ended success"

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-refill
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
