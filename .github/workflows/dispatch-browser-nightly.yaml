name: Dispatch browser nightly

# Two jobs on a schedule: the full browser lane, and the re-record of the stubbed layer's
# recordings. ci.yaml calls the same workflow twice: its dispatch-browser-pr job runs the
# pull-request lane on a pull request, the rows a pull request is held to, and its
# dispatch-browser job runs the full lane - all eight parallel projects, the three `-alone` ones,
# the two stub ones and the two-process job - in the merge queue, so the merge group runs it on
# the tree a change lands as. This run covers a day with no such event, and is what runs the full
# lane on main's tip (.github/workflows/dispatch-browser.yaml, which holds every step). The
# re-record job's own head, below, says what it guards and why it is here rather than in a file
# of its own.
#
# What a red run does, and what it does not. The run fails, and its merged report, every leg's
# blob and the failed legs' traces are artifacts of that run; GitHub's "Events that trigger
# workflows" page says: "Notifications for scheduled workflows are sent to the user who last
# modified the cron syntax in the workflow file." Nothing else is told: this call passes no
# `ci-ok-changes`, so the merge job's report step does not run and the run posts no check, files
# no issue and sends no message. dispatch://INFRA-1066's R22 owns a reader for nightly results,
# and this workflow deliberately builds no second one: a reader written here is the thing R22
# would then have to replace.
#
# GitHub starts a scheduled run from the default branch alone, so the nightly is main's copy of
# this file and of the workflow it calls, never a pull request's (e2e.yaml's head comment states
# the same of its own nightly). A change to either is proven before main by ci.yaml's two
# callers of it: the pull-request lane on the pull request that makes it, and the full lane in the
# merge group that lands it. It runs here only once it is on main.

on:
  schedule:
    # Nightly, hours from e2e.yaml's 04:41, the repository's other schedule: a full lane takes
    # four shard machines, three alone machines and a two-process machine at once, and two
    # nightlies starting together would queue behind each other for the account's runners.
    - cron: "17 2 * * *"
    # The re-record job below, at an hour of its own and away from the full lane's: the two
    # share this workflow's concurrency group, so a second cron at 02:17 would queue behind a
    # full lane that can take half an hour, and the recordings would be read against a server
    # the night had already moved on from. 13:41 is the far side of the day from both schedules
    # of this repository (02:17 here and e2e.yaml's 04:41), and it needs one runner rather than
    # eight, so it never competes with a nightly for the account's capacity.
    - cron: "41 13 * * *"
  workflow_dispatch:

# One nightly at a time. A run that overran into the next night would otherwise run beside the
# new one on the same runners; `cancel-in-progress: false` queues the new run instead of killing
# the old one, so neither night's report is lost.
concurrency:
  group: dispatch-browser-nightly
  cancel-in-progress: false

# The default for a job of this workflow that declares none. The one job below declares its own,
# which is what reaches the workflow it calls.
permissions:
  contents: read
  actions: read

jobs:
  # A calling job that declares no `permissions:` hands the called workflow the default
  # GITHUB_TOKEN permissions, not this file's block (GitHub's reusable-workflow reference,
  # "Supported keywords for jobs that call a reusable workflow"), so what dispatch-browser.yaml's
  # jobs need is declared here. `contents: read` is the `actions/checkout` step every one of its
  # five jobs starts with, and the pinned tools its setup steps download; `actions: read` is the
  # merge job's "Reading one, the rows" step, which reads this run's own attempt's jobs by running
  # `.github/scripts/dispatch-browser-run-reads.sh jobs` (and its "Reading three" step reads that
  # same file). No `checks: write`, which the ci-ok report would need: this call passes no
  # `ci-ok-changes`, so that step does not run and this workflow posts no check.
  #
  # The job carries the id of ci.yaml's full-lane caller and passes it as `job`, so its jobs are
  # named `dispatch-browser / <job>` and its artifacts carry the names that caller's do:
  # packages/dispatch/e2e/tools/shard-weights.ts reads the merged report of both, by the artifact
  # name `dispatch-browser-report-1`.
  dispatch-browser:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/dispatch-browser.yaml
    with:
      lane: full
      job: dispatch-browser
  # The guard on the stubbed layer's recordings (dispatch://INFRA-1407's R3). A recording is a
  # snapshot of a server that keeps moving: this re-records every stubbed row against the real
  # harness and fails when a route no longer answers as its recording holds.
  #
  # It compares the status of each route and nothing else - never a body's values and never its
  # shape - which is the third of four guards, each watching what the others cannot: the
  # generated contract holds client and server to one shape at compile time
  # (dispatch://INFRA-1406), the contract test holds every committed recording's body to that
  # shape on every pull request (packages/dispatch/e2e/__tests__/stub-recordings.test.ts), this
  # watches the status of each route, and the rows that stayed on the real stack hold the
  # server's behaviour. `packages/dispatch/e2e/stub/recording.ts#statusDrift` is the whole of
  # the judgement and says why a comparison of values would be red every night on nothing.
  #
  # It is a job of this file rather than a workflow of its own because GitHub starts a schedule
  # from the default branch alone and offers a `workflow_dispatch` only for a file the default
  # branch holds, so a workflow that exists only on a branch can be dispatched by nobody and
  # proved before its merge by nothing
  # (dispatch://INFRA-1621/comment/36392fee-60e8-4dbd-9068-bd8524088d08 records that refusal).
  # This file already stands on main with both triggers, so `gh workflow run
  # dispatch-browser-nightly.yaml --ref <branch>` runs the branch's own copy of this job.
  #
  # Both crons start both jobs, since a schedule starts a workflow and not a job, so the 13:41
  # run also runs the full lane. That is a second full lane a day on a repository whose nightly
  # is one, which is the price of keeping this job dispatchable before its own merge; it is the
  # same eight runners for the same ten minutes, and `concurrency` keeps it from overlapping the
  # 02:17 run.
  #
  # The budget, by the rule .github/ci-notes/dispatch-browser.md states for every job: a step's
  # measured maximum plus 15 per cent, rounded up to the next whole minute, floor two minutes,
  # and a job's is the sum of its steps' budgets plus the measured maximum of every step with
  # none. The recording step runs every stubbed row once against one harness stack, measured at
  # 7 m 18 s for 132 rows in this issue's pod, so 438 x 1.15 = 504 s -> 9 min, doubled to 18
  # for a runner slower than that pod and for the rows this layer will hold. The layout layer's
  # 42 rows (e2e/layout-*.stub.e2e.ts) fit in it: in dispatch://INFRA-5200's pod the step took
  # 3.3 min without them and 7.3 min with them (43 rows then; one control row of under a second
  # was folded into another since), 240 s, and a layout reading costs 1.8 times on a shard what
  # it costs in that pod (2.9 s, run 45301444362, against 1.6 s), so 432 s on the runner. With the
  # other rows' 251 s there (nightly runs 45303170467 and 45159394267), the step's maximum is
  # 683 s. The three fix pull requests of dispatch://INFRA-5200 add states to their routes'
  # layout rows, read in that pod: the issue page's 90 readings and two header rows took 193 s
  # (its recording run of 2026-11-24); the Inbox's 10 readings 17 s (24.2 and 25.6 s against
  # 7.8 s without them); the other pages' 20 readings 32 s at 1.6 s a reading. That is 242 s in
  # the pod and 436 s on the runner, so the step's maximum is 683 + 436 = 1119 s, and
  # 1119 x 1.15 = 1287 s -> 22 min. This edit carries all three, so none of the others edits
  # this line. The Chromium install keeps the 4 minutes the multiprocess job's own gives it.
  # 22 + 4 = 26, and 200 s of unbudgeted steps round it to 30.
  #
  # That 30 is the measured half. The budget is it plus the arithmetic of this job's slowest
  # retried step, WHICH IS NOW THE SETUP-BUN STEP at 2 x 1708 = 3416 s, above the Chromium
  # install's one `retry_fetch` call of 5 x 300 + 150 = 1650 s and the module download's and
  # the workspace install's 1050 s each. The Chromium install led that list while a
  # `ci_tools_fetch` was 741 s, and this comment kept naming it after the bound moved:
  # 1800 + 3416 = 5216 s -> 87 min. A job whose ceiling sat under that step's own 57 minutes
  # would cut it before it could name the download that failed.
  re-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 87
    # This job stays on the runner rather than in the browser image the shard and alone jobs
    # moved into, for the reason the multiprocess job stays: nothing can make it launch an
    # engine other than Chromium, so it keeps that one download, and it runs `go` through the
    # harness, which a `container:` job may not
    # (.github/ci-notes/dispatch-browser.md#the-shard-jobs-shell-rule-its-measured-steps-and-its-budget says why).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # Restored only: the harness builds the Dispatch server, which this job needs and no job
      # of this family saves a cache for.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('go-envoy-{0}-{1}-', runner.os, runner.arch) || '' }}
      # The browser suite's jobs of these names, at the bounds their own comments derive
      # (.github/ci-budgets.md's Retries note): two `ci_tools_fetch` calls for the Bun install,
      # 2 x 1708 = 3416 s -> 57 min, and one `retry_fetch` call at the 180 s bound every Bun
      # install of this repository's CI carries, 5 x 180 + 150 = 1050 s -> 18 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 57
      - name: bun install --frozen-lockfile
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile >&2
      # The step of this name in .github/workflows/dispatch-browser.yaml's shard job, for the reason
      # .github/ci-notes/dispatch-browser.md#why-every-job-that-runs-the-suite-builds-contracts-first
      # gives: Playwright's Node runner reads `@legion/contracts` out of a build this
      # checkout has to make before the config loads, of the entries Dispatch imports alone.
      - name: Build contracts for dispatch e2e
        run: bun run build:dispatch
        working-directory: packages/contracts
      # The browser suite's step of this name, at the same bound: the build below, and
      # run-server.sh's own build inside the harness, fetch this module's dependencies
      # themselves on a cache miss, where a go command reaches proxy.golang.org with no retry.
      # Rule 11 of .github/scripts/check-download-retry.sh requires this step of any job that
      # compiles Go, and refused this one by name while it was missing.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      # Built here rather than left to run-server.sh, which would build it inside the harness's
      # own boot wait, as the multiprocess job does for the same reason.
      - name: Build the Dispatch server
        run: go build -o ./dispatch-e2e ./cmd/dispatch
        working-directory: packages/envoy
      - name: Build dispatch dashboard
        run: bun run build:web
        working-directory: packages/dispatch
      # Chromium alone: both stub projects launch it (`stub-phone` is an iPhone 13 on Chromium).
      - name: Install Playwright Chromium
        # Its own retry arithmetic: one `retry_fetch` call at the 300 s bound the browser
        # suite's own installs carry, 5 x 300 + 150 = 1650 s -> 28 min, where the 4 minutes
        # this step measured are what the job's ceiling counts for it.
        timeout-minutes: 28
        run: |
          . "$GITHUB_WORKSPACE/.github/scripts/ci-retry.sh"
          retry_fetch "Playwright's Chromium" 300 -- bunx playwright install chromium >&2
        working-directory: packages/dispatch
      - name: Re-record every stubbed row against the real harness
        timeout-minutes: 22
        # Into a directory of its own, never over the committed set: a recording compared with
        # itself can never differ, so the committed recording that no row writes any more -
        # a row deleted, or one that stopped reading what it read - would be found by nobody.
        # DISPATCH_E2E_STUB_RECORDINGS is what moves it (packages/dispatch/e2e/stub/
        # recordings.ts), and the comparison step below refuses the committed directory.
        run: |
          # The stack's Postgres, the copy in ghcr.io/cybermonklabs/legion/ci the shard job uses.
          export DISPATCH_E2E_PG_IMAGE=ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
          export DISPATCH_E2E_STUB_RECORDINGS="$RUNNER_TEMP/fresh"
          DISPATCH_E2E_STUB_RECORD=1 bunx playwright test \
            --config e2e/playwright.config.ts --project=stub --project=stub-phone
        working-directory: packages/dispatch
      # Uploaded whether or not it matches, so whoever reads a red run applies the new set by
      # replacing the committed directory with it rather than standing a harness up themselves.
      - name: Upload the re-recorded set
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dispatch-browser-recordings-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fresh
          if-no-files-found: error
      # Run even where the step above failed, which is the usual way drift arrives: a route
      # that answers 404 where its recording holds 200 fails the row that reads it, so the
      # recording run is red, and without this the job would name the failed row and never the
      # route. `!cancelled()` and not `always()`, so a cancelled run stops here.
      - name: Fail where a route no longer answers as its recording holds
        if: ${{ !cancelled() }}
        run: bun e2e/tools/compare-recordings.ts "$RUNNER_TEMP/fresh"
        working-directory: packages/dispatch
