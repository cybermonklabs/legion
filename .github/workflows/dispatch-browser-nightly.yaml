name: Dispatch browser nightly

# Two jobs on a schedule: the full browser lane, and the re-record of the stubbed layer's
# recordings. ci.yaml calls the same workflow from three jobs. Its dispatch-browser-pr job runs
# the pull-request lane on a pull request, the rows a pull request is held to. Its
# dispatch-browser job runs the full lane - every project the shard job's browser step names for
# it (.github/scripts/dispatch-browser-shard-suite.sh), the three `-alone` ones and the
# two-process job - wherever ci.yaml's dispatch_browser output selects it: in the merge queue,
# on a pull request labelled full-ci or lane:dispatch_browser, and on a workflow_dispatch of
# ci.yaml, which selects every job on main or with its `every-job` input, and on any other
# branch only the jobs that branch's diff from its merge base with main reaches. So the merge
# group runs the full lane on the tree a change lands as. Its dispatch-references job runs the
# references lane, Chromium over the reference rows' spec files, on a pull request its own
# dispatch_references output selects. That lane is a preview: it gates nothing, and it replaces
# neither the pull-request lane's run nor the full lane's. The full lane's jobs are
# dispatch-browser.yaml's, whose notes name them and the machines they take
# (.github/ci-notes/dispatch-browser.md#the-suite-its-two-lanes-and-the-budget-rule-every-job-follows);
# they are seven jobs on eight machines (full-lane run 44286153772, at c31857b8), where the
# default branch's full lanes in the merge queue ran the same seven jobs on twelve machines on
# 2026-11-24, and
# .github/ci-notes/dispatch-browser.md#what-the-job-set-costs-and-the-machine-time-ceiling-the-run-holds-it-to
# measures what the pull-request and full lanes cost.
# This run covers a day with no merge group, and is what runs the full lane on main's tip
# (.github/workflows/dispatch-browser.yaml, which
# holds every step). The re-record job's own head, below, says what it guards and why it is here
# rather than in a file of its own.
#
# What a red run does, and what it does not. The run fails, and its merged report, every leg's
# blob and the failed legs' traces are artifacts of that run. GitHub notifies one person that a
# scheduled run failed, as that person's notification settings allow: the user who created the
# workflow, or a different user who changed its `schedule` cron since, or the user who
# re-enabled it after it was disabled (GitHub Docs, "Notifications for workflow runs"). Nothing
# else is told: this call passes no `ci-ok-changes`, so the merge job's report step does not run
# and the run posts no check, files no issue and sends no message. dispatch://INFRA-1066's R22
# owns a reader for nightly results, and this workflow deliberately builds no second one: a
# reader written here is the thing R22 would then have to replace.
#
# GitHub starts a scheduled run from the default branch alone, so the nightly is main's copy of
# this file and of the workflow it calls, never a pull request's (e2e.yaml's head comment states
# the same of its own nightly). A change to the workflow it calls is proven before main by two
# of ci.yaml's three callers of it: the pull-request lane on the pull request that makes it, and
# the full lane in the merge group that lands it. The third, dispatch-references, runs the
# references lane on that pull request too, since its filter names that workflow, but it gates
# nothing and replaces neither run. No ci.yaml job calls this file, so a change to it
# is proven by `gh workflow run dispatch-browser-nightly.yaml --ref <branch>` (below). It runs on
# its schedule only once it is on main.

on:
  schedule:
    # Nightly, hours from e2e.yaml's and codeql.yaml's own `schedule` crons (daily 04:41 and Tuesday
    # 04:17 when read at 29b902d1 on 2026-11-18): a full lane takes a machine for every leg and job
    # of dispatch-browser.yaml at once, behind the machine that builds what they all run, and two
    # nightlies starting together would queue behind each other for the account's runners.
    - cron: "17 2 * * *"
    # The re-record job below, at an hour of its own and away from the full lane's: the two share
    # this workflow's concurrency group, so a re-record at the full lane's hour would queue behind
    # the whole lane, and the recordings would be read against a server the night had already moved
    # on from. The cron below is the far side of the day from the full lane's above and from
    # e2e.yaml's and codeql.yaml's, which the comment above names, and four hours after
    # dispatch-unit-repeat.yaml's weekly run (Saturdays at 09:23 when read at bacd5d7e on
    # 2026-11-19). A schedule
    # starts a workflow and not a job, so each job's `if:` below names the one cron it does not run
    # on: the cron above starts the full lane alone and the one below the re-record alone, and a
    # `workflow_dispatch`, which carries no cron, starts both.
    - cron: "41 13 * * *"
  workflow_dispatch:

# One nightly at a time. A run that overran into the next night would otherwise run beside the
# new one on the same runners; `cancel-in-progress: false` queues the new run instead of killing
# the old one, so neither night's report is lost.
concurrency:
  group: dispatch-browser-nightly
  cancel-in-progress: false

# The default for a job of this workflow that declares none. The one job below declares its own,
# which is what reaches the workflow it calls.
permissions:
  contents: read
  actions: read

jobs:
  # A calling job that declares no `permissions:` hands the called workflow the default GITHUB_TOKEN
  # permissions, not this file's block (GitHub's reusable-workflow reference, "Supported keywords
  # for jobs that call a reusable workflow"), so what dispatch-browser.yaml's jobs need is declared
  # here. `contents: read` is the `actions/checkout` step every one of its jobs starts with, and the
  # pinned tools its setup steps download; `actions: read` is the merge job's "Reading one, the
  # rows" step, which reads this run's own attempt's jobs by running
  # `.github/scripts/dispatch-browser-run-reads.sh jobs` (and its "Reading three" and "Reading
  # five" steps read that same file). No `checks: write`, which the ci-ok report would need:
  # this call passes no `ci-ok-changes`, so that step does not run and this workflow posts no
  # check.
  #
  # The job carries the id of ci.yaml's full-lane caller and passes it as `job`, so its jobs are
  # named `dispatch-browser / <job>` and its artifacts carry the names that caller's do:
  # packages/dispatch/e2e/tools/shard-weights.ts reads the merged report of both, by the artifact
  # name `dispatch-browser-report-1`.
  #
  # Every run but the re-record's schedule, whose cron the `if:` below names:
  # `github.event.schedule` is the cron that started a scheduled run and is empty on a
  # `workflow_dispatch`, so a dispatch runs this job too.
  dispatch-browser:
    if: github.event.schedule != '41 13 * * *'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/dispatch-browser.yaml
    with:
      lane: full
      job: dispatch-browser
  # The guard on the stubbed layer's recordings (dispatch://INFRA-1407's R3). A recording is a
  # snapshot of a server that keeps moving: this re-records every stubbed row against the real
  # harness and fails when a route no longer answers as its recording holds.
  #
  # It compares the status of each route and nothing else - never a body's values and never its
  # shape - which is the third of four guards, each watching what the others cannot: the
  # generated contract holds client and server to one shape at compile time
  # (dispatch://INFRA-1406), the contract test holds every committed recording's body to that
  # shape on every pull request (packages/dispatch/e2e/__tests__/stub-recordings.test.ts), this
  # watches the status of each route, and the rows that stayed on the real stack hold the
  # server's behaviour. `packages/dispatch/e2e/stub/recording.ts#statusDrift` is the whole of
  # the judgement and says why a comparison of values would be red every night on nothing.
  #
  # It is a job of this file rather than a workflow of its own because GitHub starts a schedule
  # from the default branch alone and offers a `workflow_dispatch` only for a file the default
  # branch holds, so a workflow that exists only on a branch can be dispatched by nobody and
  # proved before its merge by nothing
  # (dispatch://INFRA-1621/comment/36392fee-60e8-4dbd-9068-bd8524088d08 records that refusal).
  # This file already stands on main with both triggers, so `gh workflow run
  # dispatch-browser-nightly.yaml --ref <branch>` runs the branch's own copy of this job.
  #
  # A schedule starts a workflow and not a job, so this job's `if:` keeps it off the full lane's
  # cron, as the full lane's keeps that lane off this job's; a dispatch carries no cron and runs
  # both. Until dispatch://INFRA-1109 neither job had one, and this job's cron carried a second full
  # lane a day, eight machines for 16 to 19 minutes of wall time by pull request #3513's full-lane
  # runs of 2026-11-15, to keep this job dispatchable, which the conditions keep at no such cost.
  #
  # The budget, by the rule .github/ci-notes/dispatch-browser.md states for every job: a step's
  # measured maximum plus 15 per cent, rounded up to the next whole minute, floor two minutes,
  # and a job's is the sum of its steps' budgets plus the measured maximum of every step with
  # none. The recording step runs every stubbed row once against one harness stack, measured at
  # 7 m 18 s for 132 rows in this issue's pod, so 438 x 1.15 = 504 s -> 9 min, doubled to 18
  # for a runner slower than that pod and for the rows this layer will hold. The layout layer's
  # 42 rows (e2e/layout-*.stub.e2e.ts) fit in it: in dispatch://INFRA-5200's pod the step took
  # 3.3 min without them and 7.3 min with them (43 rows then; one control row of under a second
  # was folded into another since), 240 s, and a layout reading costs 1.8 times on a shard what
  # it costs in that pod (2.9 s, run 45301444362, against 1.6 s), so 432 s on the runner. With the
  # other rows' 251 s there (nightly runs 45303170467 and 45159394267), the step's maximum is
  # 683 s, and 683 x 1.15 = 785 s -> 14 min, under the 18. The Chromium install keeps the 4
  # minutes the multiprocess job's own gives it. 18 + 4 = 22, and 200 s of unbudgeted steps
  # round it to 26.
  re-record:
    if: github.event.schedule != '17 2 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    # This job stays on the runner rather than in the browser image the shard and alone jobs
    # moved into, for the reason the multiprocess job stays: nothing can make it launch an
    # engine other than Chromium, so it keeps that one download, and it runs `go` through the
    # harness, which a `container:` job may not
    # (.github/ci-notes/dispatch-browser.md#the-shard-jobs-shell-rule-its-measured-steps-and-its-budget says why).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy-test, restored only: this job builds the Dispatch server, and the harness builds
      # the real broker's commands, the dev OIDC issuer and the request seeder, all on the
      # runner's default CGO_ENABLED=1, and that family's entry, which ci-caches.yaml fills with
      # cgo on too, is the one that holds them. dispatch-browser.yaml's binaries job builds the
      # same commands with CGO_ENABLED=0, almost none of whose objects that entry holds, so it
      # restores a family of its own, go-dispatch-browser
      # (.github/ci-notes/dispatch-browser.md#why-the-binaries-job-restores-go-dispatch-browser).
      # go-envoy holds the listener's and natsd's builds alone (ci-caches.yaml), and an
      # alone job of dispatch-browser.yaml measured what restoring it costs such a build while it
      # still built the server itself: 115 `go: downloading` lines on a key that hit (job
      # 129055096326), against 4 with go-envoy-test (job 129071749416).
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('go-envoy-test-{0}-{1}-', runner.os, runner.arch) || '' }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # The step of this name in .github/workflows/dispatch-browser.yaml's shard job, for the reason
      # .github/ci-notes/dispatch-browser.md#why-every-job-that-runs-the-suite-builds-contracts-first
      # gives: Playwright's Node runner reads `@legion/contracts` out of a build this
      # checkout has to make before the config loads, of the entries Dispatch imports alone.
      - name: Build contracts for dispatch e2e
        run: bun run build:dispatch
        working-directory: packages/contracts
      # Built here rather than left to run-server.sh, which would build it inside the harness's
      # own boot wait, as dispatch-browser.yaml's binaries job builds it for the whole run.
      - name: Build the Dispatch server
        run: go build -o ./dispatch-e2e ./cmd/dispatch
        working-directory: packages/envoy
      - name: Build dispatch dashboard
        run: bun run build:web
        working-directory: packages/dispatch
      # Chromium alone: both stub projects launch it (`stub-phone` is an iPhone 13 on Chromium).
      - name: Install Playwright Chromium
        timeout-minutes: 4
        run: bunx playwright install chromium
        working-directory: packages/dispatch
      - name: Re-record every stubbed row against the real harness
        timeout-minutes: 18
        # Into a directory of its own, never over the committed set: a recording compared with
        # itself can never differ, so the committed recording that no row writes any more -
        # a row deleted, or one that stopped reading what it read - would be found by nobody.
        # DISPATCH_E2E_STUB_RECORDINGS is what moves it (packages/dispatch/e2e/stub/
        # recordings.ts), and the comparison step below refuses the committed directory.
        run: |
          # The stack's Postgres, the pgvector copy in ghcr.io/cybermonklabs/legion/ci that the
          # multiprocess, embedder and visual jobs of dispatch-browser.yaml also use. This job
          # runs on the runner, whose own PostgreSQL has no `vector`, so it cannot take the
          # shard and alone jobs' DISPATCH_E2E_PG_BIN, which names the PostgreSQL inside their
          # image.
          export DISPATCH_E2E_PG_IMAGE=ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
          export DISPATCH_E2E_STUB_RECORDINGS="$RUNNER_TEMP/fresh"
          DISPATCH_E2E_STUB_RECORD=1 bunx playwright test \
            --config e2e/playwright.config.ts --project=stub --project=stub-phone
        working-directory: packages/dispatch
      # Uploaded whether or not it matches, so whoever reads a red run applies the new set by
      # replacing the committed directory with it rather than standing a harness up themselves.
      - name: Upload the re-recorded set
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dispatch-browser-recordings-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fresh
          if-no-files-found: error
      # Run even where the step above failed, which is the usual way drift arrives: a route
      # that answers 404 where its recording holds 200 fails the row that reads it, so the
      # recording run is red, and without this the job would name the failed row and never the
      # route. `!cancelled()` and not `always()`, so a cancelled run stops here.
      - name: Fail where a route no longer answers as its recording holds
        if: ${{ !cancelled() }}
        run: bun e2e/tools/compare-recordings.ts "$RUNNER_TEMP/fresh"
        working-directory: packages/dispatch
