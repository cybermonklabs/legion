name: CI job dispatch

# The steps of ci.yaml's `dispatch` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. Every filter of the `changes` job names ci.yaml today, so a
# change to that one file runs every job; once this job's filter names this file instead, a
# change to these steps selects this job alone.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    # The browser suite runs one lane per Playwright worker, each with a Postgres, a harness and
    # a file-store bucket of its own (packages/dispatch/e2e/run.ts), so this job has no
    # `postgres:` service and no job-level DATABASE_URL: a run of more than one lane refuses a
    # caller-set DATABASE_URL, since one database cannot serve lanes that truncate it per row.
    # The lanes' image and worker count are set on the browser step's own command line, not in an
    # `env:`: a name outside ci_filter_coverage.py's ENV_ALLOWED in this job's or any of its
    # steps' `env:` drops run-server.sh's `go build` out of check-ci-filters.sh's reduction, which
    # then counts it as reading every Go file of the repository.
    #
    # The job budget below and the browser step's are measured: GitHub's jobs API over the
    # 397 of the newest 400 ci.yaml runs that could be read, created between 2026-11-05T04:52:45Z
    # and 2026-11-05T21:06:27Z (268 pull_request, 120 merge_group, 12 push), over the 217 jobs of
    # this name that concluded success. Three runs could not be read, 41995538189, 42034266338 and
    # 42087689355, whose jobs endpoint answered HTTP 502 on four attempts. The whole window is
    # after the commit that moved this job to four lanes, 9689e2c54 of 2026-11-05T04:09:18Z, so no
    # run is left out for being older than it. Those 217 jobs ran a smaller package list than the
    # install step's below, so the install step is out of the table below, and its budget is its
    # own retry arithmetic rather than a reading of that window.
    #
    #   step                               median    95th     max
    #   Browser-test dispatch dashboard    1475 s  1582 s  1671 s
    #   every other step summed             199 s   221 s   232 s
    #   the whole job                      1715 s  1875 s  2348 s
    #
    # The install step has one reading at its present package set, not a distribution: 30 s, in
    # job 128209099649 of cybermonklabs/legion#2888 at 5ff42456. A distribution at that set can
    # be read from main's jobs of this name. The apt archive cache's two steps came after that
    # window too, so the "every other step summed" row holds none of them. In that job the restore
    # missed, and the key and restore steps took under a second each. A restore that hits reads
    # about 114 MB from the Actions cache, which has no reading yet.
    #
    # The rule: a step budget is that step's measured maximum plus 15 per cent, rounded up to the
    # next whole minute, with a floor of two minutes; an install step's budget comes from its own
    # retry arithmetic instead. So 1671 s x 1.15 = 1922 s -> 33 min for the browser step, and
    # 22 min for the install step, for the reason its own comment gives. The job budget is the
    # sum of its step budgets plus the measured maximum of every step without one, rounded up:
    # 1320 + 1980 + 232 s = 3532 s -> 59 min. The spread is the fleet's rather than the suite's,
    # which is why each budget is that measured maximum plus a margin rather than a figure near
    # the median.
    #
    # Budgets on the steps and not on the job alone, because a step the runner cancels at its own
    # budget fails that step and names it (`The action '<step name>' has timed out after <N>
    # minutes.`), where a job budget cancels the job. So the `if: always()` and `if: failure()`
    # upload steps below still run and the Playwright report, the memory samples and the CPU
    # samples still reach the run, which a cancelled job loses. The job budget is the backstop
    # above the sum of the step budgets, so it never fires first.
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # go-envoy, restored only: each lane's run-server.sh builds the Dispatch server, not the
      # listener and natsd ci-caches.yaml's envoy job builds to fill the family, and no job here
      # saves it. Without it that build is a cold `go build` in every lane.
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-{0}-', runner.os) }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Build contracts for dispatch e2e
        # e2e/agent-view.e2e.ts imports AGENT_STREAM_LIMITS and capAgentStreamText as values
        # (LEGION-548), which Playwright's own Node resolution reads from contracts' built
        # dist/, unlike a type-only import or the dashboard's own Vite build (which bundles the
        # TS source directly through the workspace's "bun" export condition).
        run: bun run build
        working-directory: packages/contracts
      # The SPA every lane's server serves: run-server.sh serves web/dist (:103) and builds
      # nothing itself, and the dashboard's own build step, with the notices listing it asserts
      # on, is dispatch-ui's now. One build for all the lanes, which read the same dist.
      - name: Build the dashboard the lanes serve
        run: bun run build:web
        working-directory: packages/dispatch
      # The file store the step below starts, pulled first for the reason the action gives. The
      # image comes from ghcr.io/cybermonklabs/legion/ci, a registry this repository publishes, so a
      # failed pull is a fault of this repository. The action must show it, not retry it.
      - name: Pull the file store image
        uses: ./.github/actions/pull-test-images
        with:
          consts: packages/envoy/internal/tests3/seaweedfs.go Image
      - name: Start an S3-compatible server for uploaded files
        # The browser suite runs the server with DISPATCH_FILE_STORE_BUCKET set (e2e/run-server.sh
        # reads DISPATCH_E2E_FILE_STORE_ENDPOINT), so every upload and download the dashboard makes
        # goes through the file store, as production's does. Same image as the Go tests
        # (internal/tests3), read from its declaration again to name it for the docker run below.
        # Started before the Playwright install, and waited for after it, so the container's own
        # start overlaps that install instead of following it.
        run: |
          image=$(sed -n 's/^const Image = "\(.*\)"$/\1/p' ../envoy/internal/tests3/seaweedfs.go)
          [ -n "$image" ] || { echo "::error::no const Image in packages/envoy/internal/tests3/seaweedfs.go"; exit 1; }
          docker run -d --name dispatch-e2e-files -p 127.0.0.1:18333:8333 "$image" server -s3 -dir=/data -ip=0.0.0.0 -s3.port=8333
        working-directory: packages/dispatch
      # The browsers the install step below downloads, under the Playwright version bun.lock
      # pins, which is what decides their revisions. No job of this workflow saves an Actions
      # cache entry: the entry this reads is the one ci-caches.yaml's browsers job fills on a
      # push to main, and a miss costs this job the download alone.
      - id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ format('playwright-{0}-', runner.os) }}
      # The key the apt archive cache below is read under, computed by
      # .github/scripts/apt-archive-cache-key.sh because a step expression cannot read the
      # runner's own image environment, and by a script because ci-caches.yaml's apt-debs job,
      # which saves the entry, computes the same key the same way.
      - id: apt-debs-key
        name: Compute the apt archive cache key
        run: |
          key=$(.github/scripts/apt-archive-cache-key.sh)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      # No restore-keys: a partial match would hand the install the .deb files of another
      # Playwright version or another image, which apt would fetch again anyway.
      - id: apt-debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-debs-key.outputs.key }}
      # This step installs the system packages itself instead of through `playwright install
      # --with-deps`, which runs its apt calls with no bound, no retry and no second origin. The
      # pinned list is .github/playwright-apt-packages.txt, read below with its blank lines and
      # `#` comments dropped: ci-caches.yaml's apt-debs job downloads that same file to fill the
      # archive cache this step seeds itself from. The file holds Playwright's list alone, and
      # this step and that job each add gstreamer1.0-tools to it themselves - here as
      # `step_tools` below - so the set the fill fetches is the set this installs as long as both
      # read the file and both name that package. That file's own header says what the list is -
      # Playwright's ubuntu24.04-x64 list exactly, the union of the `tools`, `chromium`,
      # `firefox` and `webkit` entries of that table in playwright-core's lib/coreBundle.js.
      # Measured in job 128209099649, of cybermonklabs/legion#2888 at 5ff42456: Playwright's 79
      # names and gstreamer1.0-tools resolve, with their dependencies, to 182 packages and
      # 114 MB of archives (`0 upgraded, 182 newly installed, 0 to remove and 27 not upgraded.`
      # and `Need to get 114 MB of archives.`), and the `apt-get update` before them fetched
      # 13.0 MB of indexes (`Fetched 13.0 MB in 1s (10.1 MB/s)`). Nothing is left out of the
      # list, so there is no reduced set beside it and no split to measure.
      #
      # `step_tools` below is the one package this step installs that Playwright's list does not
      # name: gstreamer1.0-tools, for the `gst-inspect-1.0` the decoder guard runs. It is a
      # variable of its own because `packages` is what the check at the end of the step holds
      # against Playwright's own list, name for name.
      #
      # WebKit plays video and audio through GStreamer, so without gstreamer1.0-plugins-good,
      # gstreamer1.0-plugins-bad, gstreamer1.0-libav and libavcodec60 it loads a page and plays
      # nothing: the first three hold the plugins that demux Matroska and decode VP8 and h.264,
      # and libavcodec60 is the codec library gstreamer1.0-libav's plugin links for h.264.
      # Playwright's own source says of gstreamer1.0-libav that its one library libgstlibav.so is
      # the library required for playing h.264. The decoder guard after the install asks the
      # GStreamer registry for one element out of each of those three plugin packages and out of
      # the already-pinned gstreamer1.0-plugins-base; avdec_h264 loads only where libavcodec60 is
      # installed, so it answers for that library too. It runs before the browsers are
      # downloaded, and it is the one check that catches a package that installs without its
      # element reaching the GStreamer registry. That the browsers launch at all is what the
      # suite's six WebKit and Firefox projects prove - webkit, webkit-iphone, webkit-alone,
      # firefox, firefox-download-navigation and firefox-alone (e2e/playwright.config.ts) -
      # which the "Browser-test dispatch dashboard" step below runs.
      #
      # On a Playwright upgrade, re-derive the list as that union again, with nothing taken out
      # of it. Deriving it at run time by subtracting one apt closure from another does not work
      # and must not be written: the closure of the four that carry playback and the closure of
      # the rest share 35 packages Playwright's own list names or needs, and the subtraction
      # leaves WebKit unable to launch. This paragraph is a standing refusal, not a record of a
      # design that was taken out: nobody is to re-derive a reduced list.
      #
      # The 22-minute budget is the step's own retry arithmetic, not its measured maximum, which
      # the bounds make unreachable: two bounded attempts of `apt-get update` at 90 s, two of the
      # download at 300 s, then, where both of those time out, one 90 s read of the fallback
      # origin's indexes and a third 300 s download attempt, then the unpack, the decoder guard,
      # the browser download and the one apt simulation of the list check, none of which touch the
      # Ubuntu mirror. So the arithmetic is 2 x 90 + 2 x 300 + 90 + 300 = 1170 s of bounded apt,
      # 13.6 s of unpack, 0.4 s of decoder guard, about 90 s for the browsers and 1.6 s for the
      # list check: 1170 + 13.6 + 0.4 + 90 + 1.6 = 1275.6 s, rounded up to 22 min. The budget has
      # to carry the fallback's own update, because the path that needs every one of those bounds is
      # the path on which the step still succeeds.
      #
      # The four readings after the bounded apt are job 128209099649's, of cybermonklabs/legion#2888
      # at 5ff42456, at its 182 packages. The unpack is the 13.6 s from `Download complete and in
      # download only mode` at 23:14:13.884 to the last line of the unbounded install at
      # 23:14:27.475. The decoder guard is the 0.4 s to `the decoders WebKit plays through are in
      # the registry: ...` at 23:14:28.984. The browsers and the list check together are the 1.6 s
      # to `The pinned list is current: ...` at 23:14:30.540 - but that job restored its browsers
      # from the Actions cache (`Cache hit for: playwright-Linux-7f68fc...`, 482 MB, at 23:13:54),
      # so that 1.6 s is no reading of the cold browser download and the budget has to carry the
      # cold case. That is what the 90 s term is: the step's estimate for the cold browsers, not a
      # reading, which the package set does not reach. The list check is measured inside that
      # 1.6 s, so 1.6 s is the term the reading supports for it. The whole step took 30 s in that
      # job, 23:14:00 to 23:14:30: one reading at this package set, not a distribution. Each is one
      # reading, so each moves a little from run to run; the margin the sum leaves under 22 min is
      # what carries that.
      #
      # Each bound is derived from its own phase: each job's two apt rates, as apt logged them,
      # scaled onto the step's fetch of 13.0 MB of indexes and the list's 114 MB of packages. The
      # population is the 205 green dispatch jobs of the tester's window (2026-11-05T08:51:42Z
      # to 23:07:42Z, a different window from the table above, which is why its count differs),
      # read in full for the 26 whose install step ran over 73 s.
      #
      # Two jobs bind the two bounds. Job 127238648049 binds the download: apt logged
      # `Fetched 114 MB in 10min 13s (186 kB/s)` for its packages, so the list's 114 MB need
      # 613 s there, which the two 300 s attempts on the primary do not reach. Job 127357441704
      # binds the update: apt logged `Fetched 10.5 MB in 45s (233 kB/s)` for its `apt-get
      # update`, so the step's 13.0 MB of indexes need 55.8 s there, and 90 s leaves 61 per cent
      # over that need. Neither the index figure nor its 90 s bound moves with the package set.
      #
      # So at 186 kB/s, the slowest mirror a green job of that window met, the list's 114 MB
      # need more than the 600 s of the two attempts on the primary, and the origin switch
      # fires. That is the trade Playwright's whole list costs: a download phase that reaches the
      # fallback origin on that mirror.
      #
      # One blended rate per job is the wrong model, as job 127238648049's own log shows:
      # `Fetched 10.5 MB in 1s (9797 kB/s)` for its update and the 186 kB/s above for its
      # packages. One rate over both phases mixes a fast update into a slow download and
      # understates the download. The model assumes a retry meets the same mirror rate, and
      # azure.archive.ubuntu.com is a pool, so a retry may meet a faster mirror or a slower one.
      # Both bounds come from the slowest mirror a green job of that window met, and are read
      # again when a green job meets a slower one. Under 13.0 MB / 90 s = 144 kB/s the indexes
      # do not arrive inside one bound, and under 114 MB / 300 s = 380 kB/s the packages do not:
      # job 127274913129 met 62.5 kB/s for its packages, and its job budget cancelled it. The
      # list's 114 MB need 1824 s at that rate, which neither 600 s nor 900 s of download
      # reaches, so the step fails by its own name there.
      #
      # What the attempts complete is the threshold the step carries, and it is three bands
      # rather than one number, because the third attempt is on another origin and the partial
      # may not be reused across that switch. With B the 114 MB the list fetches:
      #   above B / 600 s = 190 kB/s the two attempts on the primary complete the download;
      #   between B / 900 s = 127 kB/s and 190 kB/s the origin switch fires on every run and
      #     completion rests on the fallback resuming the partial; where it does not, that one
      #     attempt carries all 114 MB and needs B / 300 s = 380 kB/s, which nothing in this
      #     band meets, so that class fails by its own name;
      #   below 127 kB/s the step fails by its own name whatever the fallback does - in about
      #     900 s where both `apt-get update` phases were fast, and in at most 1170 s where each
      #     was retried to its bound.
      #
      # The attempts accumulate, which is measured and not assumed: `apt-get ... -d` resumes. An
      # attempt the bound kills leaves its bytes in apt's partial directory, and the attempt
      # after it asks only for the rest. Job 128209099649 measured that at 5ff42456: after the
      # download phase had fetched all 114 MB, the install call after it asked for
      # `Need to get 0 B/114 MB of archives.`, so what the download put on disk the install does
      # not fetch again. Measured separately, the partial is resumed across the origin switch
      # too, since the two mirrors serve the same file and the server answers a byte-range
      # request. Where the fallback's snapshot holds a different version the filename differs,
      # the partial is not reused and that attempt carries the full 114 MB, which that job
      # fetched in 8 s at 14.7 MB/s.
      #
      # Why the third attempt changes origin rather than the bound being raised: a longer bound
      # buys a longer hang and hides the mirror. One step's log holds both of the rates the one
      # host it met served, 9977 kB/s for the indexes and 31 kB/s for the pool files, so the
      # slowness was in the pool path rather than in the host, and another origin is the lever
      # that answers that. A single bad pool member is the case no attempt count on one origin
      # reaches.
      #
      # The slowest reading this repository holds is that 31 kB/s: the list's 114 MB need 3677 s
      # at it, which no attempt count worth having completes, so the step fails by its own name
      # there, which is the intended outcome.
      #
      # The worst case the step carries: if both `apt-get update` attempts fail, the step
      # stops after about 180 s, so the longest the bounded apt phases can run is one update
      # attempt stopped at 90 s, a second ending just inside 90 s, two download attempts stopped
      # at 300 s, the fallback origin's update stopped at 90 s and a third download attempt
      # stopped at 300 s. The step fails by its own name in at most 1170 s, against the
      # 40-minute job cancel it replaces.
      #
      # The .deb files of that list are cached between runs. The restore step above reads them
      # into ~/apt-archives, and the step below copies them into apt's archive directory before
      # its first call. apt takes a file there whose name and size match the index without
      # fetching it and without hashing it (the pkgAcqArchive constructor in
      # apt-pkg/acquire-item.cc, lines 3499-3507 of apt 2.7.14, compares the size alone), so a
      # restored file is trusted as the run that wrote the entry left it. The key names the
      # Playwright version bun.lock pins, because that version decides Playwright's list, and
      # the runner image, because the image decides which versions apt resolves, so an image roll
      # misses the entry rather than restoring files the new image's indexes no longer name. It
      # names neither `step_tools` nor the versions apt resolves from updates published after the
      # image was built, and an entry is written once and never replaced, so a package that changes
      # under one key is fetched on every run until the key moves. No job of this workflow writes
      # the entry, for the reason the browsers' restore above gives: filling a cache on a push to
      # main is ci-caches.yaml's work, and its apt-debs job is what fills this family there. So a
      # run whose key is in the cache restores the archives and the download below finds them on
      # disk, and the whole set is fetched only on a miss - an image roll, a Playwright bump or an
      # eviction - which is the cold case every bound and budget above is read at.
      - name: Install Playwright Chromium, WebKit and Firefox
        # The runner image preconfigures Google's chrome-stable apt source, whose index
        # intermittently fails `apt-get update` with a hash-sum mismatch and takes the install
        # down with it. Chrome is already installed there; the source only serves upgrades, so
        # drop it before installing our deps.
        timeout-minutes: 22
        run: |
          grep -rl dl.google.com /etc/apt/sources.list.d | xargs -r sudo rm -f
          # The pinned list, out of .github/playwright-apt-packages.txt with that file's `#`
          # header and its blank lines dropped, which is the expression ci-caches.yaml's apt-debs
          # job reads it with too. The step's working-directory is packages/dispatch, so the file
          # is reached through $GITHUB_WORKSPACE, the checkout root GitHub sets, as the list check
          # at the end of this step reaches its script.
          packages=$(grep -vE '^[[:space:]]*(#|$)' \
            "$GITHUB_WORKSPACE/.github/playwright-apt-packages.txt")
          # gstreamer1.0-tools holds the gst-inspect-1.0 the decoder guard below runs, and is no
          # name of Playwright's list. It is out of `packages` because `packages` is the list the
          # check at the end of the step holds against Playwright's own.
          step_tools="gstreamer1.0-tools"
          # What apt is given in every phase: the pinned list and the step's own tool.
          apt_list="$packages $step_tools"
          # A bounded attempt, retried: the attempt count, then what the log calls the phase,
          # then the command. Each failed attempt prints the phase, that attempt's exit status
          # and how many attempts are left; `timeout` exits 124 when it killed the command, so
          # the status separates a mirror that stalled from one that refused. What an exhausted
          # phase means is the caller's: the update below ends the step, and the download moves
          # to another origin and takes its last attempt there.
          attempts() {
            local left=$1 what=$2 status
            shift 2
            while :; do
              "$@" && return 0
              status=$?
              left=$((left - 1))
              echo "::warning::$what failed with exit $status (124 is the timeout); attempts left: $left"
              [ "$left" -gt 0 ] || return 1
            done
          }
          # What the restore above found, handed to apt before it reads any index. A file whose
          # version the index no longer names has another file name, and one whose size differs is
          # deleted (acquire-item.cc:3508-3511), so apt fetches both again. nullglob makes an empty
          # or absent directory an empty list instead of a failed copy.
          shopt -s nullglob
          seeded=("$HOME"/apt-archives/*.deb)
          shopt -u nullglob
          [ "${#seeded[@]}" -eq 0 ] || sudo cp "${seeded[@]}" /var/cache/apt/archives/
          # `sudo timeout`, not `timeout sudo`: the signal has to reach apt-get itself, not a
          # sudo holding it.
          attempts 2 "apt-get update" sudo timeout 90 apt-get update || {
            echo "::error::apt-get update failed twice, so no package list was read;" \
              "the apt mirror is the suspect"
            exit 1
          }
          # Download only (`-d`): a killed apt releases its fcntl locks either way, but with
          # nothing unpacked in this phase no dpkg run is ever stopped part way, so the attempts
          # after it and the unbounded install below start from a clean package state. It prints
          # what it fetched, which is this step's own byte record. $apt_list is left unquoted on
          # purpose, to split into words.
          if ! attempts 2 "the package download" sudo timeout 300 \
            apt-get install -y --no-install-recommends -d $apt_list; then
            # The last attempt fetches from another origin, which is the one thing more attempts
            # on the configured pool cannot do. That pool is a mirrorlist, which `apt-get update`
            # reads as `Get:1 file:/etc/apt/apt-mirrors.txt Mirrorlist`, so the switch is an edit
            # of that file. The copy beside it is what was there; nothing puts it back, and
            # nothing has to, the runner being ephemeral and going with the job.
            mirrorlist=/etc/apt/apt-mirrors.txt
            # Where the image stops shipping it, the copy below ends on `cp: cannot stat` and the
            # log names no cause, so the file is tested here and the error is the step's own.
            [ -f "$mirrorlist" ] || {
              echo "::error::there is no $mirrorlist, so the fallback origin cannot be set;" \
                "the package download ends here"
              exit 1
            }
            sudo cp "$mirrorlist" "$mirrorlist.orig"
            sudo sed -i 's,^\(https\?://\)[^/]*,\1archive.ubuntu.com,' "$mirrorlist"
            cat "$mirrorlist"
            # The new origin's indexes are not the old one's, so they are read before the
            # attempt that uses them. Where that read fails the attempt still runs: the lists on
            # disk may still name files this origin serves, and an attempt is worth more here
            # than a tidy exit.
            attempts 1 "apt-get update for the fallback origin" sudo timeout 90 apt-get update ||
              echo "::warning::the fallback origin's lists were not read; the attempt below uses what is on disk"
            attempts 1 "the package download from the fallback origin" sudo timeout 300 \
              apt-get install -y --no-install-recommends -d $apt_list || {
              echo "::error::the package download failed three times, the last of them on another origin;" \
                "the step ends here rather than leaving the job's budget to cancel the browser step after it"
              exit 1
            }
          fi
          # Unbounded and unretried: the archive is on disk now, so this takes no network.
          sudo apt-get install -y --no-install-recommends $apt_list
          # The .deb files apt fetched are not kept: nothing in this workflow saves a cache
          # entry, and the fill is ci-caches.yaml's apt-debs job, which downloads the same list
          # on a push to main rather than reading a pull request's runner, so a copy of them
          # under $HOME here would be read by nobody. This is where main's #2868 put one, under
          # the push-gated save this pull request's rule 10 removed with the push.
          echo "apt archives: seeded ${#seeded[@]} .deb files"
          # Is each decoder WebKit plays through in the GStreamer registry? One call per element:
          # `gst-inspect-1.0 --exists` reads one element argument and discards the rest, so a
          # single call with five names would report on the first alone. Each element is written
          # with the package that carries it, and this is what fails the step by its own name
          # where one of those packages has gone missing from the list above.
          probed=()
          for probe in matroskademux:gstreamer1.0-plugins-good vp8dec:gstreamer1.0-plugins-good \
            h264parse:gstreamer1.0-plugins-bad avdec_h264:gstreamer1.0-libav \
            vorbisdec:gstreamer1.0-plugins-base; do
            element=${probe%%:*}
            gst-inspect-1.0 --exists "$element" || {
              echo "::error::GStreamer has no $element, which WebKit plays media through;" \
                "${probe#*:} carries it: packages= above must hold it, and if it does, the plugin" \
                "did not load: gst-inspect-1.0 -b lists the files GStreamer could not load"
              exit 1
            }
            probed+=("$element")
          done
          echo "the decoders WebKit plays through are in the registry: ${probed[*]}"
          # The browsers alone. Named, because with no argument Playwright resolves its own
          # default set rather than this job's three.
          bunx playwright install chromium webkit firefox
          # Has the pinned list fallen behind Playwright? The check is the repository's
          # .github/scripts/playwright-deps-current.sh, and it runs here, against the list it is
          # given on this line: $packages, unquoted so it splits into words, as apt takes it
          # above. It holds the two lists against each other both ways: every name Playwright
          # asks for is one the pinned list holds, and every pinned name is one Playwright asks
          # for. It runs after the install, so it expects nothing left missing. The step's
          # working-directory is packages/dispatch, so the script is reached through
          # $GITHUB_WORKSPACE, the checkout root GitHub sets, and the bunx it runs resolves
          # this suite's Playwright.
          "$GITHUB_WORKSPACE/.github/scripts/playwright-deps-current.sh" $packages
        working-directory: packages/dispatch
      - name: Wait for the S3-compatible server
        # The readiness wait of the step that started the container, after the install the
        # container came up during. An anonymous PUT makes the bucket; each lane makes its own
        # (dispatch-e2e-files-lane-N) with the same request (e2e/run.ts), so this one proves the
        # store answers a PUT and serves the one-lane run its own bucket.
        run: |
          for attempt in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:18333/ && break
            [ "$attempt" -lt 60 ] || { docker logs dispatch-e2e-files; exit 1; }
            sleep 1
          done
          curl -sf -X PUT -o /dev/null http://127.0.0.1:18333/dispatch-e2e-files
        working-directory: packages/dispatch
      - name: Browser-test dispatch dashboard
        # `bun run e2e` builds the SPA itself, which would build it a second time in this job.
        # Calling the wrapper directly reuses the "Build the dashboard the lanes serve" step's
        # dist above, holds this job to one Vite build, and keeps that build's own CPU out of the
        # reading this step takes below. Safe because that build and this one are now the same
        # binary: `packages/dispatch` no longer has an E2E-only build flag (removed with its sole,
        # unconsumed consumer, the `window.__dispatchDocument` inspection probe). e2e/run.ts starts
        # the harness on ports the OS chooses and runs Playwright with them; the config starts no
        # server.
        #
        # DISPATCH_E2E_WORKERS is how many lanes e2e/run.ts starts, one per Playwright worker,
        # each a harness, a bucket and a Postgres of its own, that last one a `docker run` of
        # DISPATCH_E2E_PG_IMAGE (e2e/harness-postgres.ts). They are set on the command line, not
        # in this step's `env:`, for the reason the job's head gives.
        #
        # MemAvailable every 5 s for the length of this step, kept for the upload below and its
        # lowest value printed at the end: the lanes' Postgres containers run outside this job's
        # cgroup, so /proc/meminfo is the one reading that counts them. The JSON report goes
        # beside the list reporter's output, so a green run reports what it ran too. Both sample
        # files and that report are written under $RUNNER_TEMP, beside the lanes' own run
        # directory: a file this step wrote into the checkout would leave it dirty afterwards.
        #
        # Beside it, the same 5 s tick records where the CPU goes, which is the bound a run of
        # four lanes on four vCPU hits (INFRA-317): one line per process of a named group, with
        # the CPU that process has used, read from /proc/<pid>/stat. `pidstat` is not on this
        # image and `ps -o pcpu` is a process's average over its whole life, not what it spent
        # since the last tick, so neither answers this; /proc costs one `ps` and one `awk` per
        # tick. A group's total is the sum of its processes' ticks apart, and the whole reading
        # of a process this tick first saw, which is what catches a renderer that was started
        # after the last tick. Nothing is ever counted twice, so the named groups are a floor:
        # what is lost is a process that lived and died inside one tick, and the last seconds of
        # one that died between ticks. `everything else` is the machine's own busy time
        # (/proc/stat) less the named groups, so a reader sees the whole step without
        # downloading the samples: it holds that loss, the runner's own work, the file-store
        # container and the sampler itself.
        timeout-minutes: 33
        run: |
          # $RUNNER_TEMP holds everything this step writes, the run directory of e2e/run.ts
          # (mkdtempSync in os.tmpdir(), :183) among it, which is what the upload steps below
          # read. TMPDIR is exported on the command line, not in this step's `env:`, for the
          # reason the job's head gives.
          export TMPDIR="$RUNNER_TEMP"
          : > "$RUNNER_TEMP/memory-samples.txt"
          : > "$RUNNER_TEMP/cpu-samples.txt"
          while :; do
            awk '/^MemAvailable:/ { print $2 }' /proc/meminfo >> "$RUNNER_TEMP/memory-samples.txt"
            ps -eo pid=,args= | awk '
              function group(args) {
                if (args ~ /ms-playwright/)     return "browser"
                if (args ~ /(^|\/)bun( |$)/)    return "bun"
                if (args ~ /playwright/)        return "runner"
                if (args ~ /dispatch-e2e( |$)/) return "dispatch"
                if (args ~ /postgres|psql/)     return "postgres"
                return ""
              }
              BEGIN { while ((getline l < "/proc/stat") > 0) if (l ~ /^cpu /) { split(l, c); print "machine", c[2]+c[3]+c[4]+c[7]+c[8]+c[9]; break } }
              { g = group($0); if (g == "") next
                if ((getline l < ("/proc/" $1 "/stat")) <= 0) next
                close("/proc/" $1 "/stat"); sub(/^[^ ]+ \(.*\) /, "", l); split(l, s)
                print $1, s[12] + s[13], g }' >> "$RUNNER_TEMP/cpu-samples.txt"
            sleep 5
          done &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          # pgvector, the copy in ghcr.io/cybermonklabs/legion/ci (.github/ci-images.yaml) this
          # job's service used before the lanes.
          export DISPATCH_E2E_PG_IMAGE=ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
          export DISPATCH_E2E_WORKERS=4
          export PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/report.json"
          status=0
          bun e2e/run.ts -- bunx playwright test --config e2e/playwright.config.ts --reporter=list,json || status=$?
          kill "$sampler" 2>/dev/null || true
          awk '$1 ~ /^[0-9]+$/ { if (++n == 1 || $1 + 0 < low) low = $1 + 0 } END { if (n) printf "::notice title=dispatch MemAvailable::the lowest MemAvailable during the browser step was %d kB, over %d samples\n", low, n; else print "::warning::the browser step took no MemAvailable sample" }' "$RUNNER_TEMP/memory-samples.txt"
          awk '
            $1 == "machine" { if (samples++) busy += $2 - was; was = $2; next }
            ($1, $3) in seen { if ($2 >= seen[$1, $3]) group[$3] += $2 - seen[$1, $3]; seen[$1, $3] = $2; next }
            { if (samples > 1) group[$3] += $2; seen[$1, $3] = $2 }
            END {
              if (!samples) { print "::warning::the browser step took no CPU sample"; exit }
              split("browser runner dispatch postgres bun", names, " ")
              for (i = 1; i <= 5; i++) {
                named += group[names[i]]
                split_up = split_up sprintf("%s %.0f (%.0f%%), ", names[i], group[names[i]] / 100, busy ? 100 * group[names[i]] / busy : 0)
              }
              printf "::notice title=dispatch CPU::the browser step used %.0f CPU-seconds over %d samples: %severything else %.0f (%.0f%%)\n", busy / 100, samples, split_up, (busy - named) / 100, busy ? 100 * (busy - named) / busy : 0
            }' "$RUNNER_TEMP/cpu-samples.txt"
          exit "$status"
        working-directory: packages/dispatch
        # The file store the step above started. Set here, not written to $GITHUB_ENV, which every
        # later step would inherit, and which check-ci-filters.sh treats as reaching the job's go
        # commands unseen.
        env:
          DISPATCH_E2E_FILE_STORE_ENDPOINT: http://127.0.0.1:18333
          DISPATCH_E2E_FILE_STORE_BUCKET: dispatch-e2e-files
      # Always, not on failure alone: the memory and CPU readings are of the run that passed as
      # much as of the one that did not, and the report says what a green run ran.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dispatch-e2e-report-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/memory-samples.txt
            ${{ runner.temp }}/cpu-samples.txt
      # A failed row's trace says what the browser saw; these say what its lane's own servers did,
      # which is where a lane-only failure (a port, a migration, a server that never came up) is
      # legible. The glob is the run directory e2e/run.ts made under $TMPDIR, which the step
      # above pointed at $RUNNER_TEMP; mkdtempSync gives the directory a random suffix, so the
      # glob matches it however many lanes ran.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: dispatch-e2e-test-results-${{ github.run_attempt }}
          path: |
            packages/dispatch/e2e/test-results
            ${{ runner.temp }}/dispatch-e2e-run-*/lane-*/log/*.log

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: dispatch
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
