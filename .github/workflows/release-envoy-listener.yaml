name: Release Envoy Listener

on:
  push:
    branches: [main]
    # Every file the image and the binaries build from; check-image-trigger-paths.sh fails the build
    # when this list misses a file the image build reads.
    # why: .github/ci-notes/release-envoy-listener.md#what-the-push-paths-list-and-why
    paths:
      - "packages/envoy/**"
      - "!packages/envoy/infra/**"
      - "packages/contracts/**"
      - "packages/dispatch/**"
      - "packages/proof-editor/**"
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - "packages/envoy-client/package.json"
      - "packages/cipher-client/package.json"
      - "packages/pi-envoy/package.json"
      - "packages/pi-legion/package.json"
      - "packages/pi-shared/package.json"
      - "packages/claude-envoy/package.json"
      - "packages/test-fixtures/package.json"
      - "docs/site/package.json"
      - ".dockerignore"
      - ".bun-version"
      - ".github/workflows/release-envoy-listener.yaml"
      # The image's and the binaries' third-party notices, and the archives' target list.
      - "scripts/third-party-notices.ts"
      - "scripts/go-third-party-notices.sh"
      - "scripts/assemble-third-party-notices.sh"
      - ".github/go-release-targets.json"
      - ".github/agent-secrets-client-targets.json"
  workflow_dispatch:
    inputs:
      # "Confirm the version" in release_publish sets it when its run lost its version to another
      # run and starts this one (release-push.sh restart); a run started by hand leaves it at 0.
      lost_races:
        description: "How many runs before this one lost their version to another run, each starting the next (set by release_publish; leave 0)"
        type: number
        default: 0

# One build at a time per ref; a newer push replaces the waiting run, never the running one. Each
# workflow_dispatch is a group of its own and is never replaced.
# why: .github/ci-notes/release-envoy-listener.md#why-only-the-newest-waiting-push-builds-and-why-a-dispatch-is-never-replaced
concurrency:
  group: release-envoy-listener-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

# Every job declares its own permissions. The build jobs hold no secret but docker's package-push
# token, and end in a tripwire; attest and release_publish hold the credentials.
# why: .github/ci-notes/release-envoy-listener.md#why-the-workflow-level-permissions-are-empty-and-the-three-kinds-of-job
permissions: {}

env:
  # The one version computation's arguments, shared by release_build and release_publish.
  # why: .github/ci-notes/release-envoy-listener.md#the-arguments-of-the-one-version-computation
  LEGION_ENVOY_VERSION_ARGS: >-
    --patch-path scripts/third-party-notices.ts --patch-path scripts/go-third-party-notices.sh
    --patch-path scripts/assemble-third-party-notices.sh --patch-path .github/go-release-targets.json
    --patch-path .github/agent-secrets-client-targets.json
    -- :(exclude)packages/envoy/infra packages/envoy/ packages/contracts/ scripts/third-party-notices.ts
    scripts/go-third-party-notices.sh scripts/assemble-third-party-notices.sh
    .github/go-release-targets.json .github/agent-secrets-client-targets.json


  # why: .github/ci-notes/release.md#why-goproxy-falls-through-to-direct
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # Says whether the run is on main, for release_build's and release_publish's `if:`.
  # why: .github/ci-notes/release.md#why-the-ref-job-and-not-githubref-decides-main
  ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      main: ${{ steps.ref.outputs.main }}
    steps:
      - id: ref
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then main=true; else main=false; fi
          echo "main=$main" >> "$GITHUB_OUTPUT"

  # The archives' architectures, and the image docker, image_index, attest and release_publish use,
  # derived here because the jobs holding credentials may run no script to derive it.
  # why: .github/ci-notes/release-envoy-listener.md#what-the-targets-job-reads-and-derives-and-why-it-is-a-build-job
  targets:
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/release-envoy-listener.md#the-jobs-budgets
    # 600 + 2700 = 3300 s -> 56 min.
    timeout-minutes: 56
    permissions:
      contents: read
    outputs:
      envoy: ${{ steps.read.outputs.envoy }}
      envoy_image: ${{ steps.read.outputs.envoy_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: |
          # Each value is assigned first, never written as `echo "key=$(…)"`: a command
          # substitution inside echo's arguments cannot fail the step, since echo exits 0
          # whatever the substitution did, so a refusal would publish an empty job output that
          # docker, image_index, attest and release_publish would all read.
          envoy=$(jq -c .envoy .github/go-release-targets.json)
          image=$(.github/scripts/repo-paths.sh envoy_image)
          {
            echo "envoy=$envoy"
            echo "envoy_image=$image"
          } >> "$GITHUB_OUTPUT"
      - name: Check this job holds no credential (tripwire)
        timeout-minutes: 46
        env:
          STEP_TIMEOUT_MINUTES: 46
        run: .github/scripts/release-push.sh no-credential

  build:
    needs: targets
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/release-envoy-listener.md#the-jobs-budgets
    # 600 + 3416 = 4016 s -> 67 min.
    timeout-minutes: 67
    # Checks out and uploads; nothing here writes to the repository or a registry.
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        arch: ${{ fromJSON(needs.targets.outputs.envoy) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 2 x 1708 = 3416 s, setup-bun's two `ci_tools_fetch` calls -> 57 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 57
      # why: .github/ci-notes/release-envoy-listener.md#the-retried-install-and-module-downloads
      - name: Install dependencies
        # 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile >&2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
      # why: .github/ci-notes/release-envoy-listener.md#the-retried-install-and-module-downloads
      - name: Download the Go modules the build compiles
        # 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      - name: Generate Go contracts
        run: bun run gen:go
        working-directory: packages/contracts
      # The archive holds envoy-listener and its THIRD_PARTY_NOTICES. The binary carries this run's
      # commit, and the step reads it back.
      # why: .github/ci-notes/release-envoy-listener.md#what-the-envoy-archive-holds-and-why-the-binary-is-stamped
      - name: Build envoy binary
        # why: .github/ci-notes/release-envoy-listener.md#the-build-steps-whose-notices-script-the-gate-does-not-read
        # 54 + 1050 = 1104 s -> 19 min.
        timeout-minutes: 19
        env:
          SHA: ${{ github.sha }}
        run: |
          mkdir -p out
          GOOS=linux GOARCH=${{ matrix.arch }} go build -buildvcs=false \
            -ldflags "-X github.com/sjawhar/envoy/internal/buildversion.commit=$SHA" \
            -o out/envoy-listener ./cmd/listener
          go version -m out/envoy-listener | grep -F -- "buildversion.commit=$SHA" >/dev/null \
            || { echo "::error::out/envoy-listener was not built with buildversion.commit=$SHA"; exit 1; }
          GOOS=linux GOARCH=${{ matrix.arch }} ../../scripts/go-third-party-notices.sh out/THIRD_PARTY_NOTICES ./cmd/listener
          tar czf legion-envoy-${{ matrix.arch }}.tar.gz -C out envoy-listener THIRD_PARTY_NOTICES
        working-directory: packages/envoy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legion-envoy-${{ matrix.arch }}
          path: packages/envoy/legion-envoy-${{ matrix.arch }}.tar.gz
      - name: Check this job holds no credential (tripwire)
        timeout-minutes: 46
        env:
          STEP_TIMEOUT_MINUTES: 46
        run: .github/scripts/release-push.sh no-credential

  # One leg per platform, on a runner of its architecture; each pushes by digest and hands it over.
  # why: .github/ci-notes/release-envoy-listener.md#why-the-image-is-built-one-leg-per-platform
  docker:
    name: docker (${{ matrix.arch }})
    # targets as well as build: `needs` carries direct dependencies only, so a job reading
    # needs.targets.outputs.envoy_image must name targets itself, however far back it already
    # reaches through build.
    needs: [build, targets]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # why: .github/ci-notes/release-envoy-listener.md#the-jobs-budgets
    # 4800 + 3416 = 8216 s -> 137 min.
    timeout-minutes: 137
    # Builds and pushes images to ghcr.io; nothing here writes to the repository.
    permissions:
      contents: read
      packages: write
    env:
      # The listener image the smoke test runs against, built by the step below.
      ENVOY_SMOKE_IMAGE: legion-envoy-smoke:${{ github.sha }}
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image (testcontainers/ryuk, on Docker Hub) would be one more registry
      # pull the smoke test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # provenance-add-gha=false keeps the GitHub event out of every build's provenance; image=
          # is the driver's default BuildKit image, as copied into ghcr (.github/ci-images.yaml).
          # why: .github/ci-notes/release-envoy-listener.md#why-the-builder-sets-provenance-add-gha-to-false-and-its-image
          driver-opts: |
            provenance-add-gha=false
            image=ghcr.io/cybermonklabs/legion/ci@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          # The amd64 leg keeps its module cache; an arm64 entry (setup-go-Linux-arm64) would add
          # about 0.5–1 GB against INFRA-490's target of an Actions cache under 9 GB.
          cache: ${{ matrix.arch == 'amd64' }}
      # 2 x 1708 = 3416 s, setup-bun's two `ci_tools_fetch` calls -> 57 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 57
      # why: .github/ci-notes/release-envoy-listener.md#the-retried-install-and-module-downloads
      - name: Install dependencies
        # 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile >&2
      - name: Generate Go contracts
        run: bun run gen:go
        working-directory: packages/contracts
      # why: .github/ci-notes/release-envoy-listener.md#the-retried-install-and-module-downloads
      - name: Download the Go modules the smoke test compiles
        # 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      # A step of its own, so a slow build fails nothing TestSmoke asserts; the publish step reuses
      # its layers.
      # why: .github/ci-notes/release-envoy-listener.md#why-the-smoke-image-is-built-in-a-step-of-its-own
      - name: Build the listener image the smoke test runs against
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # This build never pushes, so it publishes no attestation; the metadata-file's copy of the
          # predicate is suppressed anyway, as in the publish step, should a change push from here.
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: packages/envoy/docker/Dockerfile
          load: true
          provenance: false
          build-args: |
            LEGION_COMMIT=${{ github.sha }}
          tags: ${{ env.ENVOY_SMOKE_IMAGE }}
      # 5m bounds the containers' start, the asserts and an unretried NATS pull; it is no build
      # budget.
      # why: .github/ci-notes/release-envoy-listener.md#what-the-smoke-tests-5-minute-bound-covers
      - name: Container smoke test (testcontainers)
        run: go test -tags smoke -v -timeout 5m ./internal/smoke/
        working-directory: packages/envoy
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # mode=min attaches the SLSA provenance the deployment reads to map a digest to its
          # commit.
          # why: .github/ci-notes/release-envoy-listener.md#what-modemin-provenance-attaches-and-what-the-two-env-settings-drop
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
        # No BuildKit layer cache across runs: each commit rebuilds the build stage, and a registry
        # cache could feed main's attested build (GHSA-f2v9-hprr-32q3).
        # why: .github/ci-notes/release-envoy-listener.md#why-the-image-build-keeps-no-layer-cache
        with:
          context: .
          file: packages/envoy/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: mode=min
          # Pushed by digest with no tag, which image_index adds once both legs pushed. `outputs`
          # replaces `push` and `tags`; a `push` beside it would request a second exporter.
          outputs: type=image,name=${{ needs.targets.outputs.envoy_image }},push-by-digest=true,name-canonical=true,push=true
          # envoy-dispatch's /healthz reports this as the commit it was built from; the
          # Dockerfile refuses anything but a full sha.
          build-args: |
            LEGION_COMMIT=${{ github.sha }}
      # The digest goes to image_index as the name of an empty file, which image_index validates.
      - name: Record the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      # Not named legion-envoy-*, which release_publish downloads into the release's assets.
      # why: .github/ci-notes/release-envoy-listener.md#why-the-digest-artifact-is-not-named-legion-envoy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envoy-image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
      - name: Check this job holds no credential (tripwire)
        timeout-minutes: 46
        env:
          STEP_TIMEOUT_MINUTES: 46
        run: .github/scripts/release-push.sh no-credential

  # Joins the legs' images into the envoy:<sha> index. Its inputs come from the docker legs, which
  # ran dependency code, so it checks each digest it reads or writes.
  # why: .github/ci-notes/release-envoy-listener.md#what-image_index-does-and-why-it-checks-each-digest
  image_index:
    # targets as well as docker: this job holds packages: write, so it runs no script of its own to
    # derive the image, and `needs` is not transitive.
    needs: [docker, targets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Pushes the index and its tag to ghcr.io; nothing here writes to the repository.
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: envoy-image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The index digest comes from imagetools' metadata file, never from the tag, which another run
      # may move. The inspect logs the index's platforms and attestation manifests.
      - name: Create the image index
        id: index
        env:
          # Derived by targets from $GITHUB_REPOSITORY, not written here: the index this job tags
          # must name the same repository the legs pushed their platforms to.
          IMAGE: ${{ needs.targets.outputs.envoy_image }}
          SHA: ${{ github.sha }}
        run: |
          files=("$RUNNER_TEMP"/digests/*)
          [ -e "${files[0]}" ] || files=()
          if [ "${#files[@]}" -ne 2 ]; then
            echo "::error::expected 2 digests from the docker legs, found ${#files[@]}"
            exit 1
          fi
          sources=()
          for file in "${files[@]}"; do
            hex=${file##*/}
            if [[ ! $hex =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::a docker leg handed over $(printf '%q' "$hex"), which is not a sha256 digest"
              exit 1
            fi
            sources+=("$IMAGE@sha256:$hex")
          done
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/index-metadata.json" \
            --tag "$IMAGE:$SHA" "${sources[@]}"
          digest=$(jq -r '."containerimage.descriptor".digest' "$RUNNER_TEMP/index-metadata.json")
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::imagetools create reported $(printf '%q' "$digest"), which is not a sha256 digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest"

  # GitHub's attestation of the index. A consumer accepts only a certificate naming this file on
  # main, so the job stays here: in a called workflow, every consumer's check would refuse it.
  # why: .github/ci-notes/release-envoy-listener.md#what-the-image-attestation-proves-and-why-attest-stays-in-this-file
  attest:
    # targets as well as image_index: this job holds id-token and attestations: write, so it runs no
    # script to derive the image, and `needs` carries targets' output only to a direct need.
    needs: [image_index, targets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # id-token: write is the OIDC token Sigstore issues the signing certificate for; attestations:
    # write stores the attestation with GitHub. The attestation stays with GitHub, not the
    # registry, so this job needs no packages scope.
    permissions:
      id-token: write
      attestations: write
    # No cache is restored in a job that holds a credential.
    cache-mode: none
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.targets.outputs.envoy_image }}
          subject-digest: ${{ needs.image_index.outputs.digest }}

  # The agent-secrets archives and the release's version, stamped into them; main alone, and with no
  # write scope or secret.
  # why: .github/ci-notes/release-envoy-listener.md#what-release_build-builds-and-why-it-decides-the-version
  release_build:
    needs: ref
    if: needs.ref.outputs.main == 'true'
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/release-envoy-listener.md#the-jobs-budgets
    # 600 + 2700 = 3300 s -> 56 min.
    timeout-minutes: 56
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # First, before setup-go: no dependency code has run when the tags are read.
      # why: .github/ci-notes/release-envoy-listener.md#why-the-version-is-read-first-before-setup-go
      - name: Determine next version
        timeout-minutes: 46
        env:
          STEP_TIMEOUT_MINUTES: 46
        id: version
        run: |
          # shellcheck disable=SC2086 # $LEGION_ENVOY_VERSION_ARGS is the argument list, split on purpose
          .github/scripts/release-push.sh version legion-envoy-v $LEGION_ENVOY_VERSION_ARGS >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/install-changie
        if: steps.version.outputs.skip != 'true'
        # 1708 s, install-changie's one `ci_tools_fetch` -> 29 min.
        timeout-minutes: 29
      # This release's own changelog entries, for the GitHub release's body.
      # why: .github/ci-notes/release-envoy-listener.md#which-changelog-entries-the-release-renders
      - name: Render this release's changelog entries
        timeout-minutes: 46
        id: notes
        if: steps.version.outputs.skip != 'true'
        env:
          STEP_TIMEOUT_MINUTES: 46
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          .github/scripts/release-push.sh fold-notes "$VERSION" \
            "$RUNNER_TEMP/release-notes.md" packages/envoy legion-envoy-v >> "$GITHUB_OUTPUT"
      # The entries as rendered, for release_publish; a release with none uploads nothing. Not named
      # legion-envoy-*, for the reason the docker legs' digest artifact is not.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.skip != 'true' && steps.notes.outputs.notes == 'true'
        with:
          name: envoy-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.skip != 'true'
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
      # why: .github/ci-notes/release-envoy-listener.md#the-retried-install-and-module-downloads
      - name: Download the Go modules this job builds
        if: steps.version.outputs.skip != 'true'
        # 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      # CGO_ENABLED=0 for a static binary; each archive is wrapped in one agent-secrets directory,
      # which mise strips.
      # why: .github/ci-notes/release-envoy-listener.md#why-the-agent-secrets-archives-are-static-and-wrapped-in-one-directory
      - name: Build agent-secrets binaries
        if: steps.version.outputs.skip != 'true'
        # why: .github/ci-notes/release-envoy-listener.md#the-build-steps-whose-notices-script-the-gate-does-not-read
        # 172 + 1050 = 1222 s -> 21 min.
        timeout-minutes: 21
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          test -n "$TAG"
          mkdir -p ../../agent-secrets-assets
          for arch in $(jq -r '.envoy[]' ../../.github/go-release-targets.json); do
            mkdir -p "out/$arch/agent-secrets/bin"
            for entry in agent-secrets=cipher agent-secrets-helper=cipher-helper; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -buildvcs=false \
                -ldflags "-X github.com/sjawhar/envoy/internal/buildversion.tag=$TAG" \
                -o "out/$arch/agent-secrets/bin/${entry%%=*}" "./cmd/${entry#*=}"
            done
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" ../../scripts/go-third-party-notices.sh \
              "out/$arch/agent-secrets/THIRD_PARTY_NOTICES" ./cmd/cipher ./cmd/cipher-helper
            tar czf "../../agent-secrets-assets/agent-secrets-$arch.tar.gz" -C "out/$arch" agent-secrets
          done
          for target in $(jq -r '.["agent-secrets-client"][]' ../../.github/agent-secrets-client-targets.json); do
            os=${target%/*}
            arch=${target#*/}
            dir="out/$os-$arch"
            mkdir -p "$dir/agent-secrets/bin"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -buildvcs=false \
              -ldflags "-X github.com/sjawhar/envoy/internal/buildversion.tag=$TAG" \
              -o "$dir/agent-secrets/bin/agent-secrets" ./cmd/cipher
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" ../../scripts/go-third-party-notices.sh \
              "$dir/agent-secrets/THIRD_PARTY_NOTICES" ./cmd/cipher
            tar czf "../../agent-secrets-assets/agent-secrets-$os-$arch.tar.gz" -C "$dir" agent-secrets
          done
        working-directory: packages/envoy
      # Only the linux/amd64 binary runs on this runner; `go version -m` reads the -ldflags recorded
      # in all six, so every archive is checked to carry the tag release_publish will push.
      - name: Check the stamped tag
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          test "$(out/amd64/agent-secrets/bin/agent-secrets --version)" = "agent-secrets $TAG"
          for bin in out/*/agent-secrets/bin/*; do
            go version -m "$bin" | grep -F -- "buildversion.tag=$TAG" >/dev/null \
              || { echo "::error::$bin was not built with buildversion.tag=$TAG"; exit 1; }
          done
        working-directory: packages/envoy
      # The archives, exactly as built, for release_publish.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.skip != 'true'
        with:
          name: agent-secrets-assets
          path: agent-secrets-assets/
          if-no-files-found: error
      - name: Check this job holds no credential (tripwire)
        timeout-minutes: 46
        env:
          STEP_TIMEOUT_MINUTES: 46
        run: .github/scripts/release-push.sh no-credential

  # The private-name check of the changelog entries release_publish writes into the release body.
  # why: .github/ci-notes/release-envoy-listener.md#what-release_names-checks
  release_names:
    needs: release_build
    if: always() && needs.release_build.result == 'success' && needs.release_build.outputs.skip != 'true'
    # contents: read is for the called workflow's checkout.
    permissions:
      contents: read
    uses: ./.github/workflows/release-notes-names.yaml
    with:
      artifact: envoy-release-notes
      notes: ${{ needs.release_build.outputs.notes }}
    secrets:
      PRIVATE_NAME_TERMS: ${{ secrets.PRIVATE_NAME_TERMS }}

  # Moves `latest` and publishes the release. It runs no Go, no bun and no built binary.
  # why: .github/ci-notes/release-envoy-listener.md#what-release_publish-does-and-what-it-runs
  release_publish:
    # Only main moves `latest` or releases. targets too: this job runs no script to derive the
    # image, so it reads targets' output.
    # why: .github/ci-notes/release-envoy-listener.md#what-release_publish-needs-and-when-it-runs
    needs: [build, image_index, ref, release_build, release_names, targets]
    # On `always()`, so a skipped release_build does not skip this job; every job whose outputs
    # the `if:` or the steps below read has its result tested, targets' and ref's among them.
    if: >-
      always() && needs.ref.result == 'success' && needs.ref.outputs.main == 'true' &&
      needs.build.result == 'success' && needs.image_index.result == 'success' &&
      needs.targets.result == 'success'
    concurrency:
      # One run at a time, and every run's turn comes (`queue: max`).
      # why: .github/ci-notes/release-envoy-listener.md#why-release_publish-queues-every-run
      group: release-envoy-listener
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/release-envoy-listener.md#the-jobs-budgets
    # 600 + 5400 = 6000 s -> 101 min.
    timeout-minutes: 101
    # Each scope serves named steps; the tag push uses the deploy key, which only Tag release holds.
    # why: .github/ci-notes/release-envoy-listener.md#what-each-scope-of-release_publish-is-for
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: write
    # No cache is restored in a job that holds a credential.
    cache-mode: none
    env:
      JOB_TIMEOUT_MINUTES: 101 # this job's timeout-minutes, which gh-read.sh's wait for a spent API budget stays within
    steps:
      # For release-push.sh and the tag, with every tag. No credential is left in the checkout: the
      # deploy key reaches the "Tag release" step alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine latest
        id: latest
        env:
          # targets' image: this job holds contents: write and the deploy key, so it runs no script
          # to derive it (.github/scripts/check-release-credentials.sh).
          IMAGE: ${{ needs.targets.outputs.envoy_image }}
          OWN_DIGEST: ${{ needs.image_index.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --tags

          image_digest() {
            local sha=$1
            local error_file
            error_file=$(mktemp)
            if IMAGE_DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$sha" 2>"$error_file"); then
              rm -f "$error_file"
              return 0
            fi
            # No image only on buildx's own line for a tag the registry does not hold, as the last
            # line, for this reference: `ERROR: <image>:<tag>: not found`. A refusal of another
            # request that ends in "404 Not Found" (a token endpoint's) is no answer about the tag.
            if [ "$(tail -n 1 "$error_file")" = "ERROR: $IMAGE:$sha: not found" ]; then
              rm -f "$error_file"
              return 1
            fi
            cat "$error_file" >&2
            rm -f "$error_file"
            exit 1
          }

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "should_tag_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Latest promotion skipped::The event SHA is no longer on main."
          else
            latest_exists=false
            if image_digest latest; then
              latest_exists=true
              latest_digest="$IMAGE_DIGEST"
              if ! latest_manifest=$(docker buildx imagetools inspect --raw "$IMAGE:latest"); then
                echo "::error title=Cannot establish latest provenance::Unable to read latest's manifest."
                exit 1
              fi
              latest_has_revision=$(printf '%s\n' "$latest_manifest" | jq -r '(.annotations // {}) | has("org.opencontainers.image.revision")')
              latest_sha=$(printf '%s\n' "$latest_manifest" | jq -r '(.annotations // {})["org.opencontainers.image.revision"] // empty')

              # Resolve the one legacy unannotated latest tag through its GHCR package-version
              # metadata. The package is the image without its registry and owner
              # (ghcr.io/<owner>/ -> <name>/envoy), whose remaining slash is percent-encoded
              # because the package name is one segment of the API's path; taken from $IMAGE so
              # that this lookup moves with the repository as the tag above does.
              if [ "$latest_has_revision" = false ]; then
                package=${IMAGE#"ghcr.io/$GITHUB_REPOSITORY_OWNER/"}
                package=${package//\//%2F}
                if ! legacy_source=$(gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/$package/versions?per_page=100" --paginate --jq '.[] | select(.metadata.container.tags | index("latest")) | [.name, (.metadata.container.tags[] | select(test("^[0-9a-f]{40}$")))] | @tsv'); then
                  echo "::error title=Cannot establish latest provenance::Unable to resolve legacy latest through GHCR."
                  exit 1
                fi
                case "$legacy_source" in
                  *$'\n'*)
                    echo "::error title=Cannot establish latest provenance::GHCR returned multiple latest sources."
                    exit 1
                    ;;
                esac
                IFS=$'\t' read -r legacy_digest latest_sha <<< "$legacy_source"
                if [ -z "$legacy_digest" ] || [ -z "$latest_sha" ] || [ "$legacy_digest" != "$latest_digest" ] ||
                  ! git cat-file -e "${latest_sha}^{commit}" 2>/dev/null ||
                  ! git merge-base --is-ancestor "$latest_sha" origin/main; then
                  echo "::error title=Cannot establish latest provenance::Legacy latest has no matching main SHA image."
                  exit 1
                fi
                echo "Resolved legacy latest to $latest_sha"
              elif [ -z "$latest_sha" ] || ! git cat-file -e "${latest_sha}^{commit}" 2>/dev/null ||
                ! git merge-base --is-ancestor "$latest_sha" origin/main; then
                echo "::error title=Cannot establish latest provenance::latest has an unknown or non-main revision annotation."
                exit 1
              fi
            fi

            # Prefer the newest already-published descendant, even if its release_publish job was
            # cancelled.
            promote_sha="$GITHUB_SHA"
            promote_digest="$OWN_DIGEST"
            if ! candidate_shas=$(git rev-list --first-parent "$GITHUB_SHA..origin/main"); then
              echo "::error title=Cannot establish latest provenance::Unable to enumerate newer main commits."
              exit 1
            fi
            if [ -n "$candidate_shas" ]; then
              while IFS= read -r candidate; do
                if image_digest "$candidate"; then
                  promote_sha="$candidate"
                  promote_digest="$IMAGE_DIGEST"
                  break
                fi
              done <<< "$candidate_shas"
            fi
            test -n "$promote_digest"

            if [ "$latest_exists" = false ] ||
              git merge-base --is-ancestor "$latest_sha" "$promote_sha"; then
              if [ "$latest_exists" = true ] && [ "$latest_sha" = "$promote_sha" ]; then
                echo "should_tag_latest=false" >> "$GITHUB_OUTPUT"
                echo "latest already names $promote_sha"
              else
                {
                  echo "should_tag_latest=true"
                  echo "latest_sha=$promote_sha"
                  echo "latest_digest=$promote_digest"
                } >> "$GITHUB_OUTPUT"
                echo "Advancing latest to $promote_sha"
              fi
            else
              echo "should_tag_latest=false" >> "$GITHUB_OUTPUT"
              echo "latest already names descendant $latest_sha"
            fi
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.latest.outputs.should_tag_latest == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runner's own docker buildx runs imagetools here, in Determine latest and in image_index;
      # a BuildKit builder serves only a build, which the docker legs run, so this job sets none up.
      - name: Advance latest image
        if: steps.latest.outputs.should_tag_latest == 'true'
        env:
          # targets' derivation again, for the same reason as "Determine latest" above: the
          # `latest` tag must move on the image this run's index was pushed to.
          IMAGE: ${{ needs.targets.outputs.envoy_image }}
          SHA: ${{ steps.latest.outputs.latest_sha }}
          DIGEST: ${{ steps.latest.outputs.latest_digest }}
        run: |
          test -n "$DIGEST"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=$SHA" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$DIGEST"

      # The version computed again inside the group. If another run took it, nothing is published,
      # and on exit 4 release-push.sh restart sees to it that a run releases this commit.
      # why: .github/ci-notes/release-envoy-listener.md#how-confirm-the-version-decides-and-what-a-lost-race-does
      - name: Confirm the version
        timeout-minutes: 91
        id: confirm
        if: needs.release_build.result == 'success' && needs.release_build.outputs.skip != 'true' && needs.release_names.result == 'success'
        env:
          STEP_TIMEOUT_MINUTES: 91
          VERSION: ${{ needs.release_build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          LOST_RACES: ${{ inputs.lost_races || 0 }}
        run: |
          status=0
          # shellcheck disable=SC2086 # $LEGION_ENVOY_VERSION_ARGS is the argument list, split on purpose
          "$GITHUB_WORKSPACE/.github/scripts/release-push.sh" version legion-envoy-v --expect "$VERSION" $LEGION_ENVOY_VERSION_ARGS >/dev/null || status=$?
          case $status in
            0) echo "release=true" >> "$GITHUB_OUTPUT" ;;
            3) ;;
            4) "$GITHUB_WORKSPACE/.github/scripts/release-push.sh" restart release-envoy-listener.yaml "$LOST_RACES" ;;
            *) exit "$status" ;;
          esac

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.confirm.outputs.release == 'true'
        with:
          # legion-envoy-* alone: the *.dockerbuild build record hung in Azure blob downloads and
          # failed releases #607 and #608, and DOCKER_BUILD_SUMMARY=false no longer uploads it. The
          # agent-secrets binaries come from release_build, below.
          pattern: legion-envoy-*
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.confirm.outputs.release == 'true'
        with:
          name: agent-secrets-assets
          path: assets
      # Names the archives from the version and the target lists, checks the hand-over, and writes
      # SHA256SUMS.
      # why: .github/ci-notes/release-envoy-listener.md#what-the-hand-over-check-names-and-writes
      - name: Check the hand-over and write SHA256SUMS
        timeout-minutes: 46
        id: assets
        if: steps.confirm.outputs.release == 'true'
        env:
          STEP_TIMEOUT_MINUTES: 46
          VERSION: ${{ needs.release_build.outputs.version }}
        run: |
          archives=()
          subjects=()
          envoy=$(jq -r '.envoy[]' .github/go-release-targets.json)
          [ -n "$envoy" ] || { echo "::error::.github/go-release-targets.json lists no envoy target"; exit 1; }
          for arch in $envoy; do
            archives+=("legion-envoy-$arch.tar.gz")
            subjects+=("agent-secrets-$arch.tar.gz")
          done
          clients=$(jq -r '.["agent-secrets-client"][]' .github/agent-secrets-client-targets.json)
          [ -n "$clients" ] || { echo "::error::.github/agent-secrets-client-targets.json lists no agent-secrets-client target"; exit 1; }
          for target in $clients; do
            os=${target%/*}
            arch=${target#*/}
            subjects+=("agent-secrets-$os-$arch.tar.gz")
          done
          archives+=("${subjects[@]}")
          tag=$("$GITHUB_WORKSPACE/.github/scripts/release-push.sh" handed legion-envoy-v "$VERSION" assets "${archives[@]}")
          (cd assets && sha256sum -- "${archives[@]}" > SHA256SUMS)
          {
            echo "tag=$tag"
            echo "subjects<<SUBJECTS"
            printf 'assets/%s\n' "${subjects[@]}"
            echo "SUBJECTS"
            echo "files<<FILES"
            printf 'assets/%s\n' "${archives[@]}" SHA256SUMS
            echo "FILES"
          } >> "$GITHUB_OUTPUT"
      # The only step that holds the deploy key. release-push.sh push-tag writes it to a directory
      # of its own, pushes the tag over SSH to GitHub's pinned host keys, and removes the key again.
      # A lightweight tag has no tagger, so no git user is configured.
      - name: Tag release
        timeout-minutes: 91
        if: steps.confirm.outputs.release == 'true'
        env:
          STEP_TIMEOUT_MINUTES: 91
          VERSION: ${{ needs.release_build.outputs.version }}
          TAG: ${{ steps.assets.outputs.tag }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/release-push.sh" tag "$VERSION" "$TAG"
          "$GITHUB_WORKSPACE/.github/scripts/release-push.sh" push-tag "$TAG"
      # Asks ci-caches.yaml on main to fill the Dispatch builds with this release; a refusal only
      # warns.
      # why: .github/ci-notes/release-envoy-listener.md#why-release_publish-dispatches-the-dispatch-builds-of-ci-cachesyaml
      - name: Fill the cache of the earlier Dispatch builds with this release
        if: steps.confirm.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh workflow run ci-caches.yaml --ref main -f only=dispatch-builds; then
            echo "::warning::ci-caches.yaml was not dispatched, so dispatch-two-builds builds this release until the next push to main fills it"
          fi
      # Provenance for the host binaries, after Tag release, so a refused tag leaves no attestation.
      # why: .github/ci-notes/release-envoy-listener.md#what-the-host-binaries-attestation-proves-and-how-to-verify-it
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.confirm.outputs.release == 'true'
        with:
          subject-path: ${{ steps.assets.outputs.subjects }}
      - name: Create or update GitHub release
        timeout-minutes: 46
        id: release
        if: steps.confirm.outputs.release == 'true'
        env:
          STEP_TIMEOUT_MINUTES: 46
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          FILES: ${{ steps.assets.outputs.files }}
        # `.github/scripts/release-push.sh#release)`, as in release.yaml. --upload-to-published: a re-run puts this
        # run's assets over a published release's own, which release.yaml's jobs leave as they are.
        run: |
          assets=()
          while IFS= read -r file; do
            [ -z "$file" ] || assets+=("$file")
          done <<< "$FILES"
          "$GITHUB_WORKSPACE/.github/scripts/release-push.sh" release --upload-to-published \
            --notes "Envoy listener release — Go binary + Docker image, plus agent-secrets and agent-secrets-helper host binaries." \
            "$TAG" "$TAG" "${assets[@]}"
      # The entries release_build rendered from this release's fragments, under the runner's
      # temporary directory, outside the checkout.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: notes
        if: steps.release.outcome == 'success' && needs.release_build.outputs.notes == 'true'
        with:
          name: envoy-release-notes
          path: ${{ runner.temp }}/release-notes
      # release_build's entries become the release body's one "## Changelog" section.
      # why: .github/ci-notes/release-envoy-listener.md#how-the-changelog-is-written-into-the-release-body
      - name: Write the changelog into the release body
        timeout-minutes: 46
        if: steps.notes.outcome == 'success'
        env:
          STEP_TIMEOUT_MINUTES: 46
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/release-push.sh" release-section "$TAG" '## Changelog' \
            "$RUNNER_TEMP/release-notes/release-notes.md"
