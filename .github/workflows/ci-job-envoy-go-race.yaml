name: CI job envoy-go-race

# The steps of ci.yaml's `envoy-go-race` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go-race:
    runs-on: ubuntu-24.04-arm
    # The step's -timeout 30m must fire before the runner cancels the job, so a hung test prints
    # the dump that names it: about 1 minute of setup, up to 5 minutes to compile the race
    # binaries, then the step's own 30 minutes, which is 36. natscred and the NATS auth service
    # (internal/cipher/natscallout) add two test binaries to that compile and two packages,
    # natscallout and natsgrant, since the rest of their race build (`go list -deps -test -race`)
    # is the other packages' already, and they measured 28 s and 46 s under -race on a dev box,
    # where cmd/listener took 785 s here (run 43875539224), so the sum stands. The sign-in code
    # flow (internal/oidc) adds one test binary and one package, whose run under -race took 11 s
    # on a dev box, all of it in-process against oidctest's issuer.
    #
    # Budget (ci-budgets.md's Budgets note): 2700 s, the 45 minutes this job carried, above both
    # the 36 the sentence above derives and its 726 s measured maximum, plus its slowest
    # retried step alone — the ci-ok report, 2160 s (ci-budgets.md's Budgets note, "The ci-ok report"), above
    # packages/envoy's `go mod download` at 5 x 180 + 150 = 1050 s. 2700 + 2160 = 4860 s, a whole number of
    # minutes, so the budget is the next one strictly above it -> 82 min.
    timeout-minutes: 82
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # The module the race step builds, downloaded once and retried before it (ci-budgets.md's
      # Retries note; the retried unit is the download, never the build and never the test).
      # 180 s per attempt, as that note derives. This job restores no module cache, so this is
      # where every one of its modules arrives.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      - name: Race-test delivery, the store, the bus, the listener, the registry store, the session cache, kvwatch, the NATS credentials, the NATS auth service and the sign-in code flow
        run: go test -count=1 -race -timeout 30m ./internal/dispatch/delivery/... ./internal/dispatch/store/... ./internal/bus/ ./cmd/listener/ ./internal/store/ ./internal/session/ ./internal/kvwatch/... ./natscred/ ./internal/cipher/natscallout/ ./internal/oidc/
        working-directory: packages/envoy

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 2280 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 38
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go-race
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
