name: CI job envoy-go-race

# The steps of `.github/workflows/ci.yaml#envoy-go-race` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go-race:
    runs-on: ubuntu-24.04-arm
    # The step's -timeout 30m must fire before the runner cancels the job, so a hung test prints
    # the dump that names it: about 1 minute of setup, up to 5 minutes to compile the race
    # binaries, then the step's own 30 minutes, which is 36. natscred and the NATS auth service
    # (internal/cipher/natscallout) add two test binaries to that compile and two packages,
    # natscallout and natsgrant, since the rest of their race build (`go list -deps -test -race`)
    # is the other packages' already, and they measured 28 s and 46 s under -race on a dev box,
    # where cmd/listener took 785 s here (run 43875539224), so the sum stands. The sign-in code
    # flow (internal/oidc) adds one test binary and one package, whose run under -race took 11 s
    # on a dev box, all of it in-process against oidctest's issuer. Each forced-order step then
    # compiles a hooked nats-server and the packages above it under the detector again, up to 5
    # minutes, and runs under forced-order.sh's -timeout of 10 minutes, 15 each, so 66. The first
    # of them also compiles cmd/listener, the heaviest package of the race step, against that
    # hooked server, which took 58 s of the step's 70 s on a dev box: 5 minutes more for the
    # runner, so 71. The script's own test compiles one more hooked build, of a fixture with one
    # test that skips, up to 5 minutes, and runs it at once, so 76 in all.
    #
    # Budget (ci-budgets.md's Budgets note): 5100 s, the 85 minutes main's #5540 gives this job,
    # above the 76 the paragraph above derives, plus its slowest retried step alone — the ci-ok
    # report, 2460 s (ci-budgets.md's Budgets note, "The ci-ok report"), above the nats-server
    # pre-fetch's two calls at 2100 s and packages/envoy's `go mod download` at
    # 5 x 180 + 150 = 1050 s.
    # 5100 + 2460 = 7560 s, a whole number of minutes, so the budget is the next one strictly
    # above it -> 127 min.
    timeout-minutes: 127
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        # Its settings, its /dev/shm and its health check: .github/scripts/postgres-service-settings.sh's header.
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=1000 -c max_prepared_transactions=10
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-start-period 60s
          --health-start-interval 1s
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # BROKER_TEST_DATABASE_URL names the same service for the NATS auth service's hold rows
    # (internal/cipher/natscallout), which read the broker's hold row from Postgres and skip
    # without it; envoy-go's unit step runs the package again to count those skips.
    env:
      JOB_TIMEOUT_MINUTES: 127 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy-race, restored only: the race objects of this lane's packages and the modules
      # they need, which ci-caches.yaml's envoy-race job builds on every push to main.
      # why: .github/ci-notes/ci-caches.md#the-envoy-race-lanes-family
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-race-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-race-{0}-{1}-', runner.os, runner.arch) }}
      # The module the race step builds, downloaded once and retried before it (ci-budgets.md's
      # Retries note; the retried unit is the download, never the build and never the test).
      # 180 s per attempt, as that note derives. It runs after the restore above, so it fetches
      # only the modules that entry lacks.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      # The settings the service's command: line asks for, read back from the server; why each one
      # is .github/scripts/postgres-service-settings.sh's header.
      - name: Read the service's settings back
        timeout-minutes: 2
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres.id }}" postgres
      # why: .github/ci-notes/ci.md#why-a-lanes-sizing-step-comes-after-its-retried-module-download
      - name: Check the service allows this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # The store package's tests run eight at once (storeTestParallelism, store_test.go), each with
      # a database and pools of its own, beside the step's other packages, so this samples the
      # service's client connections every 2 s while the next step runs and the step after it prints
      # the peak against max_connections: a change that makes the tests open more at once shows here
      # before it shows as a 53300 refusal. Postgres's own background processes are not counted. The
      # loop runs in the background past its own step, until the runner ends the job.
      - name: Sample the service's connections while the race tests run
        run: |
          # shellcheck disable=SC2016 # $1 and $2 are the inner bash's arguments, expanded there
          nohup bash -c 'while :; do docker exec "$1" psql -U postgres -Atc "select count(*) from pg_stat_activity where backend_type = '"'"'client backend'"'"'" >> "$2" 2>/dev/null; sleep 2; done' _ "${{ job.services.postgres.id }}" "$RUNNER_TEMP/pg-connections.txt" >/dev/null 2>&1 &
      - name: Race-test delivery, the store, the bus, the listener, the registry store, the session cache, kvwatch, the NATS credentials, the NATS auth service and the sign-in code flow
        run: go test -count=1 -race -timeout 30m ./internal/dispatch/delivery/... ./internal/dispatch/store/... ./internal/bus/ ./cmd/listener/ ./internal/store/ ./internal/session/ ./internal/kvwatch/... ./natscred/ ./internal/cipher/natscallout/ ./internal/oidc/
        working-directory: packages/envoy
      - name: Report the service's peak connections
        if: always()
        run: |
          allowed=$(docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc "show max_connections")
          if [ -s "$RUNNER_TEMP/pg-connections.txt" ]; then
            echo "pg connections: the peak of $(sort -n "$RUNNER_TEMP/pg-connections.txt" | tail -n 1) over $(wc -l < "$RUNNER_TEMP/pg-connections.txt") samples, max_connections ${allowed}"
          else
            echo "pg connections: UNKNOWN, no sample was taken (max_connections ${allowed})"
          fi

      # The forced-order tests (packages/envoy/scripts/forced-order.sh): every TestForcedOrder
      # test of the packages named, built with -tags odatrace and -race against a nats-server whose
      # own code carries the hold points internal/testnats/hooks.go drives. The script's own test
      # runs first: scripts/forced-order.test.sh holds it to refusing a package whose every
      # forced-order test skips, a -drop name that is no hook point, an empty -server, an empty -C
      # and a module whose go.mod replaces nats-server. The first forced-order step names no
      # version, so it hooks the nats-server the workspace links, which the hub runs; when go.mod
      # moves to a version internal/testnats/testdata/hooked has no hooks for, the script refuses
      # it and the step fails until the hooks are ported. The second step hooks v2.10.29. The
      # script also fails a package that declares no such test. cmd/listener's row is the first
      # step's alone: it holds the linked server where a stream update has re-armed its purge of
      # remembered duplicate ids and not stored the new window yet, a point v2.10.29 has not
      # (internal/testnats/hooks.go's missing), where the row would skip and leave the second step
      # with a package whose every forced-order test skipped. No
      # step sets an environment variable: check-ci-filters.sh reduces no go command of a job one
      # of whose steps sets a GO* name.
      # forced-order.sh reads the nats-server it hooks from the module cache with `go list -m
      # -json`, and downloads it with `go mod download -json` only where no cache holds that
      # version's tree: v2.10.29 is in no module's graph here, so the step above never fetches it.
      # The download runs from a directory with no go.mod, so go also asks sum.golang.org for the
      # module. So this step runs that read first, under the one retry (ci-budgets.md's Retries
      # note): the script's own -download, with the test steps' arguments, which makes every check
      # before the read, and the read, and builds and tests nothing. The module cache then holds
      # each zip and its checksum lookup, and the test steps read no host. Measured in an issue pod
      # with GOPROXY=off and an unreachable checksum database: without this step every forced-order
      # download of this job and daemon-go's fails, and after it the script's go list of the
      # test's packages loads every module from the cache (dispatch://INFRA-1545, round 57).
      - name: Download the nats-server versions forced-order.sh hooks
        # Its own retry arithmetic: two calls of 5 x 180 + 150 = 1050 s, 2100 s -> 36 min.
        timeout-minutes: 36
        run: |
          . ../../.github/scripts/ci-retry.sh
          retry_fetch "the nats-server the module links, for forced-order.sh" 180 -- \
            scripts/forced-order.sh -download ./internal/testnats/hooktest/ >&2
          retry_fetch "nats-server 2.10.29, for forced-order.sh" 180 -- \
            scripts/forced-order.sh -download -server 2.10.29 ./internal/testnats/hooktest/ >&2
        working-directory: packages/envoy
      - name: Test forced-order.sh's refusals
        run: scripts/forced-order.test.sh
        working-directory: packages/envoy
      - name: Forced-order tests on the hooked nats-server the module links
        run: scripts/forced-order.sh ./internal/testnats/hooktest/ ./cmd/listener/
        working-directory: packages/envoy
      - name: Forced-order tests on the hooked nats-server v2.10.29
        run: scripts/forced-order.sh -server 2.10.29 ./internal/testnats/hooktest/
        working-directory: packages/envoy

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 2580 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 43
        env:
          STEP_TIMEOUT_MINUTES: 43 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go-race
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
