name: CI job envoy-go-race-docs

# The steps of `.github/workflows/ci.yaml#envoy-go-race-docs` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go-race-docs:
    runs-on: ubuntu-24.04-arm
    # The step's -timeout 60m must fire before the runner cancels the job, so a hung test prints
    # the dump that names it: about 1 minute of setup, up to 5 minutes to compile the race binary,
    # then the step's own 60 minutes, which is 66 under this limit of 70.
    timeout-minutes: 70
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Load-bearing, not boilerplate: this package's TestMain is storetest.Main
    # (`packages/envoy/internal/dispatch/docs/persistence_test.go#TestMain`), and storetest.Open skips every test that
    # opens the store when DISPATCH_TEST_DATABASE_URL is unset
    # (`packages/envoy/internal/dispatch/store/storetest/storetest.go#t.Skip(DatabaseURLEnv`). A skip is a pass, so without the
    # service this job would be green having run almost nothing.
    env:
      JOB_TIMEOUT_MINUTES: 70 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy: its modules are the envoy module's, though this job builds the document
      # service's race test binary rather than the listener and natsd ci-caches.yaml builds.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-{0}-{1}-', runner.os, runner.arch) }}
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # No commit, checkpoint or database copy here waits for the runner's disk: why every
      # Postgres service runs so is .github/scripts/pg-crash-safety-off.sh's header.
      - name: Turn crash safety off on the service
        timeout-minutes: 2
        run: .github/scripts/pg-crash-safety-off.sh "${{ job.services.postgres.id }}"
      # Under the sampler, not bare: the race detector maps about four bytes of shadow memory per
      # byte of heap, and this package's race binary asked for more than the runner's 16 GiB,
      # which has no swap. The kernel killed this step three times with no output at all, which
      # names no test (dispatch://INFRA-1085). .github/scripts/race_memory.py samples the largest
      # process beside the run, writing a line every 5 s that names that process and the tests
      # running at that moment, so a step the kernel does take still says what it reached. After
      # the run it writes the peak, and fails this step when the peak passed RACE_MEM_LIMIT_KB,
      # 8388608 kB, half the runner, naming the tests that were running at the highest sample.
      # -json is the stream the sampler reads to know them; it writes every Output field back
      # out, so the log still carries the --- FAIL lines and the package's own line. -count=1
      # because the job restores the Go build cache above, and a cached pass must not stand in
      # for a run.
      # Under Go's cleanup detector too, GODEBUG=checkfinalizers=1: at each collection the runtime
      # reports a cleanup or a finalizer whose closure or argument reaches the object it is
      # attached to, a cycle that keeps that object alive for the life of the process, which is the
      # defect that held this package's memory (dispatch://INFRA-1085). This is the only package of
      # the repository that registers a cleanup. The detector is the runtime's own bookkeeping and
      # runs beside the race detector in this one run, so no job runs the package again plain for
      # the detector alone. What this run cannot judge, or judges only at a smaller size, envoy-go's
      # step "Test what the race build cannot run at all or at full size" runs plain, under the
      # cleanup detector as well: the two render-reuse storms run in both, at two sizes.
      - name: Race-test the document service
        run: GODEBUG=checkfinalizers=1 RACE_MEM_LIMIT_KB=8388608 ../../.github/scripts/race_memory.py go test -json -race -count=1 -timeout 60m ./internal/dispatch/docs/
        working-directory: packages/envoy

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go-race-docs
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
