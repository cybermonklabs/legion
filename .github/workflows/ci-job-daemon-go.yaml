name: CI job daemon-go

# The steps of `.github/workflows/ci.yaml#daemon-go` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so no `if:` here selects the suite: the ones
# this file carries run the steps no leg splits in plain leg 2 alone (`matrix.leg == 2`), and let
# the jobs daemon-go and daemon-go-race report a failed leg (`!cancelled()`).
#
# What runs here is the Go daemon's own tests — the plain step over every package of
# packages/daemon but the five concurrent ones and the text checks, less the two pure table
# pins of internal/supervise, which the text-check job runs by name and this step skips by name,
# the shape gate of internal/api a second time, stamped with HEAD's merge order, the race step
# over those five packages, the forced-order step over the daemon's TestForcedOrder
# tests on a hooked nats-server, and the Stage 1 live proof, which builds ./cmd/legion
# and boots it against this job's Postgres. They left `.github/workflows/ci.yaml#test` job, which runs
# the shell-script harnesses and a handful of Bun suites behind one filter: that filter
# had to cover everything the daemon's Go closure reads, so a change to a shell script or to
# packages/claude-envoy ran
# 1,083 s (median) of Go tests that could not see it, and 28 of the 66 commits that touched
# .github/scripts since 2026-10-01 changed no Go file at all (dispatch://INFRA-1413). With the
# two suites in jobs of their own each runs on its own inputs: this job's filter is the daemon's
# Go closure (`daemon_go_tests`, which already stood for exactly this set and gated nothing),
# and the `test` job's is what its remaining steps read.
#
# Each step runs in legs, all at the same time: daemon-go-legs runs the plain step, the race-
# impossible step, the forced-order tests and Stage 1, and daemon-go-race-legs the race step. Each
# leg runs its step over the packages .github/go-legs.yaml lists for it, with the step's one text,
# so every leg of a kind runs in the same mode, and .github/scripts/go_legs.py fails the step when
# that file does not run each package of the module exactly once. The two steps share no package,
# so nothing orders the legs. The jobs daemon-go and daemon-go-race wait for their kind's legs and
# pass only when every leg passed: they carry the check-run names, `daemon-go / daemon-go` and
# `daemon-go / daemon-go-race`, that the two steps' jobs had before the legs.
# why: .github/ci-notes/ci-job-daemon-go.md#why-the-daemons-tests-run-in-legs
#
# Everything here is what those steps need and nothing else, each kind of leg taking its own part,
# and every leg of a kind all of its kind's:
#   * the Postgres service in both, for LEGION_TEST_PG_DSN, the daemon's unit tests' store, and for
#     BROKER_TEST_DATABASE_URL, the broker rig of internal/cipher's and internal/dispatch's contract
#     tests in daemon-go-legs and of internal/daemon's broker tests in daemon-go-race-legs; and, in
#     daemon-go-legs, LEGION_E2E_PG_DSN, Stage 1's;
#   * TESTCONTAINERS_RYUK_DISABLED in both, read by the testcontainers-backed NATS tests;
#     LEGION_RUN_FUZZ_ITERS in daemon-go-legs, read by classify's fuzz tests; and
#     LEGION_KEPT_PROPERTY_RUNS in daemon-go-race-legs, read by internal/daemon's keptPropertyEnv;
#   * tmux, jj and Oh My Pi in both, and uv in daemon-go-legs, each refused-without by a test the
#     job runs (the comment on each step says which), and the NATS images those tests start;
#   * the user-namespace sysctl internal/launcher's role-namespace tests need, in
#     daemon-go-race-legs, which runs them;
#   * setup-go and the go-daemon cache restore in both, this module's build cache. The `test`
#     job keeps a setup-go of its own — its held-port, CI-filter and build-tag-lister steps still
#     run go — but no restore: the entry holds what compiling packages/daemon leaves behind, and
#     those steps compile a scratch module and the envoy listener instead.
# No Bun and no install: the tests of this module that needed the workspace built, or the
# repository's skills, are internal/daemon's three that load a plugin on the real Oh My Pi — the
# `bun pm pack` of the two plugins and the two prompt probes, one of which stages each plugin's
# partition of skills/ with scripts/pi-plugin-prepack.sh — which are
# .github/workflows/ci-job-plugin-pack.yaml's now, and the race step below skips all three by
# name. What is left here that names bun runs no pack: handoff_records_live_test.go's is behind
# `//go:build e2e`, which no step here compiles. So this job's filter names no lockfile, no
# workspace manifest and no skill, and a change to bun.lock or to one skill runs the plugin-pack
# tests and no test of this job (dispatch://INFRA-1413, A4).
#
# Each job's last step reports ci-ok for the caller: when that job's own result decides a
# merge-group run at the front of the queue, it posts the failing ci-ok at once
# (.github/actions/ci-ok-report, which says when it posts nothing), as every job of ci.yaml ends,
# so a failure of one leg does not wait for the others to end.
# `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # The plain step's legs, each over its share of .github/go-legs.yaml's daemon-go packages; the
  # last also runs the steps no leg splits.
  # why: .github/ci-notes/ci-job-daemon-go.md#why-the-daemons-tests-run-in-legs
  daemon-go-legs:
    name: daemon-go (leg ${{ matrix.leg }})
    runs-on: ubuntu-24.04
    strategy:
      # One leg's failure leaves the others running, so each reports its own packages.
      fail-fast: false
      matrix:
        leg: [1, 2]
    # Each go test step's -timeout must fire before the runner cancels the job, so a hung test
    # prints the goroutine dump that names it. A step's worst case is therefore its largest
    # measured green duration plus its own -timeout. Over the 158 green daemon-go jobs that
    # ci-job-daemon-go.md#why-the-race-step-is-a-job-of-its-own counts: the setup's 1.7 min at
    # most, the plain step's 15.0 and its 15 minutes, the race-impossible step's 0.5 and its 10,
    # then Stage 1's 0.2 and the report. The stamped shape gate, new since, adds its fetch and its
    # link, under 1 minute (a whole blobless clone of this repository from GitHub took about 30 s
    # on 2026-11-24), and its 1-minute -timeout. That is under 45 minutes. The forced-order step
    # adds its compile of a hooked nats-server under the detector, up to 5 minutes, and
    # forced-order.sh's 10-minute -timeout, so 60. A leg runs a share of the plain step, so no leg
    # needs more.
    #
    # Budget (ci-budgets.md's Budgets note): those 60 minutes, 3600 s, plus its slowest retried
    # step alone — install-jj, whose two `ci_tools_fetch` calls and whose `mise install` of the
    # jj release are 3416 + 450 = 3866 s, above the ci-ok report's 2460 s, install-uv's one call
    # of 1708 s, the tmux step's 625 + 775 = 1400 s, the Go module download's and the
    # nats-server pre-fetch's 1050 s each and install-omp's fetch of the release archive at
    # 450 s. 3600 + 3866 = 7466 s -> 125 min.
    timeout-minutes: 125
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOB_TIMEOUT_MINUTES: 125 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
      # One service for all three: the Go daemon's unit tests' Postgres, the broker rig its
      # cipher contract tests drive (ciphertest.NewRig skips without
      # BROKER_TEST_DATABASE_URL; internal/cipher runs in the plain step), and the Stage 1
      # script's. Setting LEGION_E2E_PG_DSN is what tells
      # the script not to start a container of its own — that path is the devbox's.
      LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      LEGION_E2E_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image (testcontainers/ryuk, on Docker Hub) would be one more registry
      # pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # The fuzz count follows the lane. A pull-request run takes the reduced count below; every
      # other lane — a merge group, a dispatched run — takes the empty string, which every reader
      # treats as unset (classify's run_fuzz_test.go and sender_fuzz_test.go), so the full count
      # lives in the Go source alone and the queue still runs it. sender_fuzz_test.go's own count
      # is 2,000 histories of each order already, so the pull-request value leaves it as it is.
      # The number of seeds falls rather than each seed's depth: a seed that stops early stops
      # reaching the states the property is about. internal/daemon's property count, which
      # follows the lane the same way, is daemon-go-race's.
      LEGION_RUN_FUZZ_ITERS: ${{ github.event_name == 'pull_request' && '2000' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # go-daemon, shared with typecheck and pi-legion.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-daemon-{0}-{1}-', runner.os, runner.arch) }}

      # The modules this job's Go steps build, downloaded once and retried before the first of
      # them (ci-budgets.md's Retries note; the retried unit is the download, never the build and
      # never the test). One call: the root go.work binds packages/daemon and packages/envoy,
      # and a download in either reads both modules' requirements.
      #
      # 180 s per attempt, as ci-budgets.md's Retries note derives. The restore above makes the
      # common run cost nothing.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the Go workspace's modules" 180 -- go -C packages/daemon mod download

      # The tmux runtime's tests drive a real tmux server and skip without one, and the daemon
      # supervises under tmux and refuses to start without it, which is also what the Stage 1
      # proof's boot needs (`scripts/e2e/stage1-skeleton.sh#tmux is required`).
      # Both apt phases retry through .github/scripts/ci-retry.sh, in e2e.yaml's spelling; their
      # bounds, and why the index read carries `-o APT::Update::Error-Mode=any`: ci-budgets.md's
      # Retries note.
      - name: Install tmux
        # Its own retry arithmetic, so an exhausted phase fails this step by name rather than
        # being cut part way by the job: the index read's 5 x 95 + 150 = 625 s and the package
        # download's 5 x 125 + 150 = 775 s, 1400 s -> 24 min.
        timeout-minutes: 24
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "apt's package lists" 95 -- \
            sudo timeout 90 apt-get update -o APT::Update::Error-Mode=any >&2
          retry_fetch "tmux" 125 -- \
            sudo timeout 120 apt-get install -y --no-install-recommends -d tmux >&2
          sudo apt-get install -y --no-install-recommends tmux

      # The workspace and boundary tests drive a real jj, the one the worker image ships (its
      # working-copy filters are among what they plant), and the daemon resolves jj at boot and
      # refuses to start without it.
      # install-jj's own retry arithmetic: two `ci_tools_fetch` calls and its `mise install`
      # of the jj release, 3416 + 450 = 3866 s (ci-budgets.md's Budgets note) -> 65 min.
      - uses: ./.github/actions/install-jj
        timeout-minutes: 65

      # internal/podsafety's baseline test and the pod agent's argv test run the Oh My Pi the worker
      # image ships, and refuse on GitHub Actions without one. The pin is read from
      # .omp-pin, the repository's one copy of it (.github/actions/install-omp).
      # install-omp's own retry arithmetic: its fetch of the release archive,
      # 5 x 60 + 150 = 450 s -> 8 min.
      - uses: ./.github/actions/install-omp
        timeout-minutes: 8

      # internal/runtime/sandbox's uv link-mode test installs a wheel with the uv the worker image
      # ships, and refuses on GitHub Actions without one (.github/actions/install-uv). The action
      # takes that uv from the `uv` row of .github/ci-tools.yaml, which check-ci-tools.sh holds to
      # the image's own ARG UV_VERSION; main's #3280 moved the address and the checksum there.
      # install-uv's own retry arithmetic: one `ci_tools_fetch` of the release tarball, 1708 s
      # (ci-budgets.md's Budgets note) -> 29 min.
      - uses: ./.github/actions/install-uv
        timeout-minutes: 29

      # The NATS tests of the plain step's packages (internal/admit, internal/natsauth,
      # internal/workflow and the testnats package itself) start testnats.Image, the hub's 2.15.1,
      # and internal/ompsessions' TestEveryPoolPinsItsSearchPath starts PoolImage, PgBouncer
      # 1.25.2, with docker; each is pulled first for the reason the action gives. The two other
      # NATS images the module's tests start are the race packages' (daemon-go-race-legs below).
      - name: Pull the NATS and PgBouncer test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/daemon/internal/testnats/nats.go Image
            packages/daemon/internal/ompsessions/searchpath_test.go PoolImage

      # No commit, checkpoint or database copy here waits for the runner's disk: why every
      # Postgres service runs so is .github/scripts/pg-crash-safety-off.sh's header.
      - name: Turn crash safety off on the service
        timeout-minutes: 2
        run: .github/scripts/pg-crash-safety-off.sh "${{ job.services.postgres.id }}"

      # Each leg runs the packages .github/go-legs.yaml lists for its number under daemon-go: every
      # package of the module but the five the race legs test and internal/textcheck, whose tests
      # are the text-check job's, so each of the five runs once per run of the router, under the
      # detector, and the text checks run once too, in a job with no database. go_legs.py prints
      # the leg's packages only once `go list ./...` and the file agree, every package in one
      # place, so a package the file does not name fails every leg rather than run in none, and
      # `set -o pipefail` is what fails the step then rather than test what xargs got.
      #
      # The -skip is the text-check job's two tests of internal/supervise, the pure table pins
      # ci_job_reads.py's SUPERVISE_TABLE_TESTS names: they read that package's own source and
      # no database, so they run in .github/workflows/ci-job-text-checks.yaml beside the other
      # tests whose subject is text, where they wait behind no fixture, and a test run twice is
      # a test whose second run tells nobody anything. The three other tests of
      # internal/supervise/table_test.go drive a machine and run here. The names are written in
      # .github/scripts/ci_job_reads.py (SUPERVISE_TABLE_TESTS), which builds this step's text
      # and the other job's from the one list and holds each step to it, so the skip and the run
      # cannot come to name different tests.
      - name: Test the Go daemon
        run: |
          set -o pipefail
          python3 ../../.github/scripts/go_legs.py packages/daemon daemon-go ${{ matrix.leg }} ${{ strategy.job-total }} | xargs go test -count=1 -timeout 15m -skip '^(TestNoTwoEventTypesShareAKind|TestTheTableHasARowOrANamedIgnoreForEveryEventInEveryState)$'
        working-directory: packages/daemon

      # The shape gate of internal/api again, stamped with HEAD's contract entries in main's merge
      # order (scripts/daemon-contract-order.sh), as every build of main that production runs is
      # stamped: the plain step of the leg that runs internal/api (go-legs.yaml's leg 2) runs it
      # unstamped, which numbers the entries by id, so these two steps run in that leg alone. On a
      # pull request the stamp is main's order with the branch's entries after it, the order main
      # takes if the branch merges next; in a merge group it is the order main takes. So the
      # order a production build numbers its entries in is tested before it reaches main. The
      # checkout is one commit deep, and the order needs HEAD's history back to main's
      # first-parent line and main's own, so the first step fetches both, with no blob (the script
      # reads commits and trees alone), and hands the stamp to the second as its output. The second
      # is one go test line, which go-test-step-expansion.py's step reader reads: that reader
      # refuses a step whose $(…) call is not of go-tagged-tests.sh, and its test, which the
      # merge queue's test job runs, reads every go test step. The plain step compiled this test
      # binary already, so the gate's run is the link and the two tests, which took 2 s past the
      # fetch on 2026-11-24; the 1-minute -timeout is its share of the job's timeout-minutes, and
      # the step's own duration in the job's log is how long the gate took.
      - name: Stamp HEAD's contract entries in main's merge order
        if: matrix.leg == 2
        id: contract-order
        run: |
          head=$(git rev-parse HEAD)
          git fetch --filter=blob:none --unshallow origin "$head" refs/heads/main:refs/remotes/origin/main
          stamp=$(bash ../../scripts/daemon-contract-order.sh --stamp HEAD)
          echo "$stamp"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
        working-directory: packages/daemon

      - name: Test the shape gate in main's merge order
        if: matrix.leg == 2
        run: go test -count=1 -timeout 1m ./internal/api/ "-ldflags=-X=github.com/sjawhar/legion/daemon/internal/api.contractOrder=${{ steps.contract-order.outputs.stamp }}" -run '^(TestEveryAnswerAtEveryContractIsTheShapeItsRecordDescribes|TestTheRecordSetIsOneRecordPerAnswerPerContract)$'
        working-directory: packages/daemon

      # What the race step's packages hold that the race build cannot run, run plain by name, one
      # go test per package (ci_job_reads.py's DAEMON_RACE_IMPOSSIBLE_*, built from the race step's
      # package list and the source, so the two cannot drift). The first is internal/launcher's
      # call-graph walk, under `//go:build !race`: it loads the launcher's whole program from source
      # and builds its call graph twice, which without the detector took about a minute at a 2.3 GB
      # peak, and the detector multiplies both. It, the forced-order tests and the Stage 1 proof run
      # in the last leg alone, which go-legs.yaml gives the plain packages that end soonest.
      - name: Test what the race build cannot run
        if: matrix.leg == 2
        run: |
          go test -count=1 -timeout 10m -run '^(TestEveryChildTheLaunchersProcessWaitsForStartsWhereNoReapTakesIt)$' ./internal/launcher
        working-directory: packages/daemon

      # forced-order.sh downloads the nats-server it hooks with `go mod download -json`, from a
      # directory with no go.mod, so go asks sum.golang.org for the module even when the module
      # download above cached its zip. So this step runs that read first, under the one retry
      # (ci-budgets.md's Retries note): the script's own -download, with the test step's
      # arguments, which makes every check before the download, and the download, and builds and
      # tests nothing. envoy-go-race's step of this name says how it was measured
      # (dispatch://INFRA-1545, round 57).
      - name: Download the nats-server version forced-order.sh hooks
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the nats-server the daemon links, for forced-order.sh" 180 -- \
            packages/envoy/scripts/forced-order.sh -download -C packages/daemon ./internal/testnats/ >&2

      # The daemon's forced-order tests (packages/envoy/scripts/forced-order.sh -C packages/daemon):
      # every TestForcedOrder test of the packages named, built with -tags odatrace and -race
      # against the nats-server the workspace links, with the hold points
      # packages/envoy/internal/testnats/hooks.go drives, on the server testnats.StartInProcess
      # runs in the test process. The step names no version, so when go.mod moves to a version
      # packages/envoy/internal/testnats/testdata/hooked has no hooks for, the script refuses it
      # and the step fails until the hooks are ported; it also fails a package that declares no
      # such test. The daemon refuses nats:2.10's server (envoy's natsversion.Refusal), so it has
      # no v2.10.29 run here. The step sets no environment variable: check-ci-filters.sh reduces no
      # go command of a job one of whose steps sets a GO* name. It runs in a plain leg, not a race
      # one: the plain legs end well before the race legs, so the step adds nothing to the wall
      # time there.
      - name: Forced-order tests of the daemon on the hooked nats-server the module links
        if: matrix.leg == 2
        run: packages/envoy/scripts/forced-order.sh -C packages/daemon ./internal/testnats/

      # The proof builds the daemon's ./cmd/legion and boots it against the Postgres above, so it
      # belongs with the Go steps rather than with the script harnesses: it is the daemon's own
      # code under test, and leaving it behind would keep the service and the Go build in the job
      # this split exists to shrink.
      - name: Stage 1 live proof
        if: matrix.leg == 2
        run: bash scripts/e2e/stage1-skeleton.sh

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 2580 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 43
        env:
          STEP_TIMEOUT_MINUTES: 43 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        uses: ./.github/actions/ci-ok-report
        with:
          job: daemon-go
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  # The check run `daemon-go / daemon-go`, which the plain step's job carried before it ran in legs:
  # it waits for every leg and passes only when all passed, so ci-ok, the merge queue and every
  # reader of that name read what they read before. A leg's own failure has already posted its
  # early ci-ok from the leg.
  # why: .github/ci-notes/ci-job-daemon-go.md#why-the-daemons-tests-run-in-legs
  daemon-go:
    needs: daemon-go-legs
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): the 5 minutes main's #5519 gives this job, 300 s, plus
    # its slowest retried step alone, the ci-ok report's 2460 s. 300 + 2460 = 2760 s -> 47 min.
    timeout-minutes: 47
    env:
      JOB_TIMEOUT_MINUTES: 47 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    steps:
      # The ci-ok report below is an action of this repository's .github.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      # The result is written into the run: rather than set in an env:, which check-ci-filters.sh
      # reads as able to move what the legs' go commands compile. The error says this job restates
      # its legs' result, in the words `.github/scripts/runner-shutdown.sh#RUNNER_SHUTDOWN_RESTATED`
      # holds, so a leg the platform killed still reads as a runner shutdown: this job's failure
      # only follows the leg's, and read as its own it would hide the leg's.
      - name: Pass only when every leg passed
        run: |
          if [ "${{ needs.daemon-go-legs.result }}" != success ]; then
            echo "::error::daemon-go's legs ended ${{ needs.daemon-go-legs.result }}, and this job restates its legs' result: each leg's own check run says why it did not pass"
            exit 1
          fi
          echo "daemon-go's legs ended success"

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 2580 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 43
        env:
          STEP_TIMEOUT_MINUTES: 43 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        uses: ./.github/actions/ci-ok-report
        with:
          job: daemon-go
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  # The race step's legs, each over its share of .github/go-legs.yaml's daemon-go-race packages,
  # beside the plain legs. Three of them run a group of internal/daemon's tests each, from
  # .github/go-legs/packages/daemon/internal/daemon.yaml, which go_legs.py prints as the leg's
  # own -run before the package: that package alone took 616 s on this runner where the four
  # other packages took 290 s together, and its tests wait rather than compute (the step's CPU
  # was 60.4% busy of four cores), so its legs are more test slots and not more cores.
  # why: .github/ci-notes/ci-job-daemon-go.md#why-internaldaemons-tests-run-in-three-legs
  # Its setup is the plain legs', less what only the plain step and Stage 1 read: no uv
  # (internal/runtime/sandbox's), no LEGION_E2E_PG_DSN (Stage 1's) and no LEGION_RUN_FUZZ_ITERS
  # (internal/classify's). The comment
  # on each step of daemon-go-legs' says why it is there; the ones below say what of the five
  # packages reads it.
  daemon-go-race-legs:
    name: daemon-go-race (leg ${{ matrix.leg }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4]
    # A step's worst case is its largest measured green duration plus its own -timeout, as
    # daemon-go's says: over the same 158 green daemon-go jobs, the setup's 1.7 min
    # at most, then the Postgres sizing step's 19 s (its cold build of the connections command
    # and the service's restart, as envoy-go-race's job 137890840698 took them), then the race
    # step's 36.3 and its 30 minutes, then the report. That is under 69 minutes, and 70 is the
    # limit.
    #
    # Budget (ci-budgets.md's Budgets note): those 70 minutes, 4200 s, plus its slowest retried
    # step alone — install-jj, 3416 + 450 = 3866 s, above the ci-ok report's 2460 s, the tmux
    # step's 625 + 775 = 1400 s, the Go module download's 1050 s and install-omp's 450 s.
    # 4200 + 3866 = 8066 s -> 135 min.
    timeout-minutes: 135
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOB_TIMEOUT_MINUTES: 135 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
      # internal/daemon's, internal/launcher's and internal/intake's store (testpg).
      LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # internal/daemon's broker tests (release_broker_test.go, dispatchcredential_test.go) drive
      # ciphertest's broker rig on this same service, and fail rather than skip on GitHub Actions
      # without it.
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # internal/daemon's kept-decision property count follows the lane, as daemon-go's fuzz count
      # does and for the same reason: a pull-request run takes 8 seeds, every other lane the
      # empty string, which keptPropertyEnv treats as unset, so the full count lives in the Go
      # source alone and the queue still runs it.
      LEGION_KEPT_PROPERTY_RUNS: ${{ github.event_name == 'pull_request' && '8' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # go-daemon, which holds the race build of these five packages too (ci-caches.yaml).
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-daemon-{0}-{1}-', runner.os, runner.arch) }}

      # The modules the race step builds, downloaded once and retried before it, as daemon-go's
      # step of this name says (ci-budgets.md's Retries note; the retried unit is the download,
      # never the build and never the test).
      - name: Download the Go modules this job builds
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the Go workspace's modules" 180 -- go -C packages/daemon mod download

      # internal/daemon's scratch-Dispatch tests (startScratchDispatchOn) start the real Dispatch
      # server on a database of this service, and one Dispatch process opens up to
      # store.ConnectionsPerProcess connections (118): more than PostgreSQL's default
      # max_connections of 100 allows, before the five packages' own pools. A run holding several
      # at once had a scratch Dispatch refused with 53300 "sorry, too many clients already" and
      # exit before it was ready (job 137919658889). So the service is raised to what a Dispatch
      # test lane needs, as every lane that starts a Dispatch process raises its own. The go run of
      # the script builds envoy's internal/dispatch/store/cmd/connections, after the cache restore
      # so that it reads the restored module cache.
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"

      # No commit, checkpoint or database copy here waits for the runner's disk: why every
      # Postgres service runs so is .github/scripts/pg-crash-safety-off.sh's header.
      - name: Turn crash safety off on the service
        timeout-minutes: 2
        run: .github/scripts/pg-crash-safety-off.sh "${{ job.services.postgres.id }}"

      # internal/daemon's tests boot the daemon on the tmux runtime, which resolves tmux.
      # Both apt phases retry through .github/scripts/ci-retry.sh, as daemon-go's do; their
      # bounds, and why the index read carries `-o APT::Update::Error-Mode=any`: ci-budgets.md's
      # Retries note.
      - name: Install tmux
        # Its own retry arithmetic, so an exhausted phase fails this step by name rather than
        # being cut part way by the job: the index read's 5 x 95 + 150 = 625 s and the package
        # download's 5 x 125 + 150 = 775 s, 1400 s -> 24 min.
        timeout-minutes: 24
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "apt's package lists" 95 -- \
            sudo timeout 90 apt-get update -o APT::Update::Error-Mode=any >&2
          retry_fetch "tmux" 125 -- \
            sudo timeout 120 apt-get install -y --no-install-recommends -d tmux >&2
          sudo apt-get install -y --no-install-recommends tmux

      # internal/launcher's workspace-bundle and git-lock tests drive the real jj and its
      # working-copy filters (testbin.RequireJJFilters).
      # install-jj's own retry arithmetic: two `ci_tools_fetch` calls and its `mise install`
      # of the jj release, 3416 + 450 = 3866 s (ci-budgets.md's Budgets note) -> 65 min.
      - uses: ./.github/actions/install-jj
        timeout-minutes: 65

      # internal/daemon's TestThePromptReferenceProbeOnTheRealOhMyPi runs the pinned Oh My Pi
      # (testbin.OMP), and refuses on GitHub Actions without one.
      # install-omp's own retry arithmetic: its fetch of the release archive,
      # 5 x 60 + 150 = 450 s -> 8 min.
      - uses: ./.github/actions/install-omp
        timeout-minutes: 8

      # internal/daemon's and internal/intake's NATS tests start testnats.Image, internal/intake's
      # refusal test SkippingImage (nats:2.10), and internal/daemon's grant test Envoy's HubImage
      # (packages/envoy/testnatsimages), pulled first for the reason the action gives.
      - name: Pull the NATS test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/daemon/internal/testnats/nats.go Image
            packages/daemon/internal/testnats/nats.go SkippingImage
            packages/envoy/internal/testnats/nats.go HubImage

      # internal/launcher's role-namespace tests start each role generation in unprivileged user,
      # mount, PID and IPC namespaces, as an issue pod's launcher does, and t.Fatal rather than
      # skip under GITHUB_ACTIONS. Ubuntu 24.04 restricts unprivileged user namespaces with an
      # AppArmor sysctl, so the job turns it off on its throwaway runner (`|| true`: a runner
      # image without the key restricts nothing), and the unshare after it is the verdict that
      # the restriction is gone.
      - name: Allow unprivileged user namespaces (the launcher's role-namespace tests)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --map-root-user true

      # internal/daemon's tests run in parallel, its scratch-Dispatch tests each with a Dispatch
      # process and a database of their own, beside the step's other packages, so this samples the
      # service's client connections every 2 s while the next step runs and the step after it prints
      # the peak against max_connections: a change that makes the tests open more at once shows here
      # before it shows as a 53300 refusal. Postgres's own background processes are not counted. The
      # loop runs in the background past its own step, until the runner ends the job.
      - name: Sample the service's connections while the race tests run
        run: |
          # shellcheck disable=SC2016 # $1 and $2 are the inner bash's arguments, expanded there
          nohup bash -c 'while :; do docker exec "$1" psql -U postgres -Atc "select count(*) from pg_stat_activity where backend_type = '"'"'client backend'"'"'" >> "$2" 2>/dev/null; sleep 2; done' _ "${{ job.services.postgres.id }}" "$RUNNER_TEMP/pg-connections.txt" >/dev/null 2>&1 &

      # The outbox's lane registry, lease renewal and held clock are the daemon's first goroutines
      # that share state with the intake's commit hooks and the API, so the packages the lanes
      # live in run under the race detector once per run, daemon-go's plain step leaving them out;
      # so do the session proxy and the launcher that wires it, whose accept loop, copy pairs,
      # pair tracking and bounded drain share state across goroutines; and so does the intake,
      # whose consumers run on goroutines of their own (Run's, one per durable consumer, and
      # Lag's, one per consumer read) and take Consumers.mu. Those consumers share one handle on
      # the notification stream, and nats.go's Info writes a handle's cached info under no lock
      # while Lag's read of the oldest waiting message reads it, so each read of the stream's
      # info, DispatchTarget's and createConsumer's, goes through a handle of its own; here,
      # TestEachReadOfTheStreamsInfoBesideALagReadGoesThroughAHandleOfItsOwn fails when either
      # read is put back on the shared handle, which a run without the detector passes. The shim's
      # wire, internal/shimwire, runs here too: the shim's two pumps (internal/shim reads the
      # daemon's stream and the wrapped process's stdout on goroutines of their own) share its
      # dedupe's delivery record under Dedupe.mu, and its Writer writes each frame whole under
      # Writer.mu; here, TestTheDedupeIsSafeForTheShimsTwoPumps fails when the dedupe's lock is
      # taken out, which a run without the detector passes.
      # internal/record is not here: the lanes' store is the package's subject, but its product
      # code starts no goroutine and uses no sync, so the detector had only the package's own test
      # goroutines to watch, and that cover is what leaving it out gives up. It runs in the plain
      # step instead. The detector needs cgo, which the runners have gcc for. The lane tests hold
      # a fake clock, so they are deterministic under it.
      #
      # The step carries a package deadline of its own, as the envoy race lanes do: under go
      # test's ten-minute default, internal/daemon, by far the slowest of the five packages, took
      # up to 570 s on the green runs of 2026-11-02 and 2026-11-03 and ran the ten minutes out on
      # main at job 125691048644 (run 41562777668). No single test dominates it: a local run timed
      # 648 tests one after another, the slowest at 44 s. The 30 minutes leave it three times its
      # slowest run.
      #
      # The -skip is the plugin-pack job's three tests, the ones of internal/daemon that
      # ci_job_reads.py's PLUGIN_PACK_TESTS names, a fourth test of that package loading a plugin
      # on the real Oh My Pi and staying in this step (TestThePromptReferenceProbeOnTheRealOhMyPi):
      # they run in .github/workflows/ci-job-plugin-pack.yaml, so that their reads — bun.lock and
      # skills/ among them — are that job's inputs and not this suite's, and a test run twice is a
      # test whose second run tells nobody anything. The names are written in
      # .github/scripts/ci_job_reads.py (PLUGIN_PACK_TESTS), which builds this step's text and the
      # other job's from the one list and holds each step to it, so the skip and the run cannot
      # come to name different tests.
      - name: Test the concurrent packages under the race detector
        run: |
          set -o pipefail
          python3 ../../.github/scripts/go_legs.py packages/daemon daemon-go-race ${{ matrix.leg }} ${{ strategy.job-total }} -race | xargs go test -count=1 -race -timeout 30m -skip '^(TestTheAgentModelCheckOnTheRealOhMyPi|TestTheImageProbeResolvesTheAgentsTheDaemonsPromptsName|TestTheRealPluginsOnTheRealOhMyPi)$'
        working-directory: packages/daemon

      - name: Report the service's peak connections
        if: always()
        run: |
          allowed=$(docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc "show max_connections")
          if [ -s "$RUNNER_TEMP/pg-connections.txt" ]; then
            echo "pg connections: the peak of $(sort -n "$RUNNER_TEMP/pg-connections.txt" | tail -n 1) over $(wc -l < "$RUNNER_TEMP/pg-connections.txt") samples, max_connections ${allowed}"
          else
            echo "pg connections: UNKNOWN, no sample was taken (max_connections ${allowed})"
          fi

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 2580 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 43
        env:
          STEP_TIMEOUT_MINUTES: 43 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        uses: ./.github/actions/ci-ok-report
        with:
          job: daemon-go
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  # The check run `daemon-go / daemon-go-race`, which the race step's job carried before it ran in legs:
  # it waits for every leg and passes only when all passed, so ci-ok, the merge queue and every
  # reader of that name read what they read before. A leg's own failure has already posted its
  # early ci-ok from the leg.
  # why: .github/ci-notes/ci-job-daemon-go.md#why-the-daemons-tests-run-in-legs
  daemon-go-race:
    needs: daemon-go-race-legs
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): the 5 minutes main's #5519 gives this job, 300 s, plus
    # its slowest retried step alone, the ci-ok report's 2460 s. 300 + 2460 = 2760 s -> 47 min.
    timeout-minutes: 47
    env:
      JOB_TIMEOUT_MINUTES: 47 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    steps:
      # The ci-ok report below is an action of this repository's .github.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      # The result is written into the run: rather than set in an env:, which check-ci-filters.sh
      # reads as able to move what the legs' go commands compile. The error says this job restates
      # its legs' result, in the words `.github/scripts/runner-shutdown.sh#RUNNER_SHUTDOWN_RESTATED`
      # holds, so a leg the platform killed still reads as a runner shutdown: this job's failure
      # only follows the leg's, and read as its own it would hide the leg's.
      - name: Pass only when every leg passed
        run: |
          if [ "${{ needs.daemon-go-race-legs.result }}" != success ]; then
            echo "::error::daemon-go-race's legs ended ${{ needs.daemon-go-race-legs.result }}, and this job restates its legs' result: each leg's own check run says why it did not pass"
            exit 1
          fi
          echo "daemon-go-race's legs ended success"

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 2580 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 43
        env:
          STEP_TIMEOUT_MINUTES: 43 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        uses: ./.github/actions/ci-ok-report
        with:
          job: daemon-go
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
