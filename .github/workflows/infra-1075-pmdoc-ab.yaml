# TEMPORARY, the INFRA-1075 paired pmdoc measurement: it answers one question and is then deleted
# with the branch it runs on. The question is whether splitting internal/dispatch/pmdoc's measured
# chain into two `go test` processes takes the tail off ci.yaml's envoy-go unit step. In the last
# red attempt that step ran 314 s, the last non-pmdoc package finished at 285.4 s and pmdoc at
# 314.1 s, a tail of 28.7 s; pmdoc's CPU-budget tests run one after another inside one process,
# because cputest.Process reads RUSAGE_SELF and none of them may call t.Parallel.
#
# One run cannot decide it. The same code measured 408 to 496 s across a day on the same shape, and
# an earlier three-way split measured the step 355 s against 402 s - one run against another run,
# which decides nothing at that spread. So the two shapes run in the same workflow run, on the same
# runner type, three rounds each: six jobs, read in pairs by round and together as two samples of
# three.
#
# The two jobs differ in exactly one thing: the `run:` of their test step. `whole` holds ci.yaml's
# envoy-go unit step byte for byte; `split` holds that same script with pmdoc's measured chain
# divided into two processes, a third process for the rest of the package, and pmdoc out of the
# foreground package list. Everything else - the two Postgres services, their read-back steps, the
# image pull, setup-go, the go-envoy-test cache restore, the runner, the timeout, the reporting
# step - is the same text in both, so a difference between them is the split and nothing else.
#
# It runs on a push to the branch and on workflow_dispatch. GitHub offers a manual dispatch only
# for a workflow the default branch holds, and this one never reaches main, so the push trigger is
# what actually starts it; the dispatch entry is here for a run from a branch that has been merged
# nowhere, which is what the API's workflow dispatch by ref needs.
#
# No job of ci.yaml changes with this file and nothing here is part of the merge gate: the six jobs
# are the measurement, read from their logs and their artifacts.
name: INFRA-1075 paired pmdoc A/B

on:
  push:
    branches: [legion/INFRA-1075]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ci.yaml's envoy-go job, with its unit step's script copied byte for byte: the baseline arm.
  whole:
    strategy:
      # Three rounds, read beside the split job's three. fail-fast: false, because a round that
      # goes red is still a reading of its own time and cancelling the rest would throw the
      # sample away.
      fail-fast: false
      matrix:
        round: [1, 2, 3]
    runs-on: ubuntu-24.04
    # envoy-go's own bound, unchanged: its measured time on the slower attempt of run 42517304628
    # (496 s) plus the largest -timeout of its calls (10 minutes) plus 6, rounded up.
    timeout-minutes: 25
    services:
      # ci.yaml's envoy-go postgres service, copied whole: the measurement must see the server the
      # step sees in the job it decides, down to the settings that make a clone cheap. That job's
      # own comments say why each setting is there.
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
      # The second instance, on 5433, that the routes call of the step runs against and nothing
      # else does: the event log's safe horizon is instance-wide, so a clone's open transaction
      # anywhere on the instance holds it back (ci.yaml's postgres_routes says it at length).
      postgres_routes:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5433:5432"]
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bun, because a test runs it: pmdoc's update tests drive the proof editor's own TypeScript
      # through `bun run` and refuse to pass without it (update_test.go:312-323).
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # envoy-go's own go-envoy-test restore, key, paths and all: a job that compiled the module's
      # test binaries from nothing would measure the compile, not the step.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            !~/go/pkg/mod/cache/download/**/*.zip
          key: go-envoy-test-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-test-{0}-', runner.os) }}
      - name: Postgres service version
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc "select current_setting('server_version_num'), coalesce((select default_version from pg_available_extensions where name = 'vector'), 'no vector')"
      # ci.yaml's two read-back steps, copied: a command the runner does not pass through leaves
      # the server up on the image's defaults, and a time taken against a server whose checkpoints
      # are not the cheap ones answers for no job.
      - name: Read the disposable service's settings back
        run: |
          id="${{ job.services.postgres.id }}"
          failed=
          read_back=
          for want in fsync=off full_page_writes=off synchronous_commit=off max_connections=500 max_prepared_transactions=20; do
            setting=${want%%=*}
            value=$(docker exec "$id" psql -U postgres -Atc "show $setting")
            read_back="$read_back $setting=$value"
            [ "$value" = "${want#*=}" ] || { echo "::error::the Postgres service reports $setting=$value, not ${want#*=}"; failed=1; }
          done
          echo "$id:$read_back"
          [ -z "$failed" ] || exit 1
      - name: Read the routes service's settings back
        run: |
          id="${{ job.services.postgres_routes.id }}"
          failed=
          read_back=
          for want in fsync=off full_page_writes=off synchronous_commit=off max_connections=500 max_prepared_transactions=20; do
            setting=${want%%=*}
            value=$(docker exec "$id" psql -U postgres -Atc "show $setting")
            read_back="$read_back $setting=$value"
            [ "$value" = "${want#*=}" ] || { echo "::error::the routes Postgres service reports $setting=$value, not ${want#*=}"; failed=1; }
          done
          echo "$id:$read_back"
          [ -z "$failed" ] || exit 1
      - name: Pull test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
            packages/envoy/internal/tests3/seaweedfs.go Image
      # The epoch the step below starts at, written here rather than in the step, because the step
      # is ci.yaml's own text and nothing may be added to it. What the pair is read on is the
      # difference between the two jobs' wall times, and the runner's turnaround between two steps
      # is under a second in both.
      - name: Note when the test step starts
        run: echo "UNIT_STEP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # ci.yaml's envoy-go unit step, its `run:` copied byte for byte, so this arm is the step
      # rather than a model of it. Everything it does and why is commented there; what matters
      # here is that the only text below that the split job changes is this script.
      - name: Unit test envoy Go package
        run: |
          mkdir -p "$RUNNER_TEMP/go-test-json" "$RUNNER_TEMP/go-test-logs"
          # The tests the race detector makes impossible, which the race job of each of these
          # packages therefore cannot make, so envoy-go keeps a plain run of exactly them:
          # internal/bus counts HoldsSeed's allocations, which the race runtime's own
          # allocations would be counted into; the API's two guards read the module's source, to
          # which the detector adds nothing; and the documents package measures the heap a room
          # keeps, which the detector's shadow memory and instrumentation move. Those are out of
          # the race build altogether (//go:build !race), and the two render-reuse storms run
          # fewer seeds and fewer edits under it (raceEnabled), so this is their full-size run.
          # It was a step of its own before this one until dispatch://INFRA-985's condition for
          # running it here was measured: the three documents memory bounds read this process's
          # own heap after two forced collections, and the question was whether a slow mark
          # under contention lets the heap overshoot before the reading is taken. Run
          # 42526940781 ran all three sixty times in this shape - beside pmdoc's CPU-budget
          # tests, under busy loops at twice the runner's cores, against a Postgres service
          # exactly like this job's - and every run passed, the worst of them using 36.1 per
          # cent of its bound, where the condition was no failure and no run within 15 per cent.
          # The other half of that step's old reason went with the API package, whose live-feed
          # and delivery-hub tests wait for the event log's safe horizon and run in
          # envoy-go-race-api now. The one -run list is derived in
          # .github/scripts/ci_job_reads.py from the race lane's own packages and those files'
          # //go:build !race and raceEnabled, so a test added to either and missing here fails
          # the ci-filters job naming this step. Measured over three runs on a two-vCPU pod: the
          # bus under a tenth of a second, the API 8 to 10 s, the documents package 92 to 127 s,
          # so 10 minutes each is ample.
          #
          # One go test over the three packages rather than one per package: go builds the three
          # test binaries together and runs each package's tests as soon as its own binary is
          # linked, so the documents package's tests run beside the API package's build instead
          # of after it. Three commands in a row cost 96 s for 44 s of tests - 40 s of them the
          # API package's build, with nothing running beside it (run 42307926510,
          # dispatch://INFRA-1075). Each package measures its own process's heap or allocations,
          # so running them at the same time changes no number any of them asserts on.
          go test -json -count=1 -timeout 4m -run '^(TestARoomFedOnlyByAgentWritesKeepsMemoryWithinTheBound|TestCopyLockComesBeforeEveryPendingRowAndEvent|TestCopyLockOrderGuardFollowsTheLockTakers|TestEveryKeyedWriteCommitsInsideATransactionTheMarkHooks|TestHoldsSeedAllocatesAtMostOneCopyPerDecoding|TestRenderReuseARandomisedEditStorm|TestRenderReuseAReplicaReplaysTheRoomsFormattingExactly|TestTheKeyedWriteGuardSeesWhatItGuards|TestUploadsOverOpenAnchorsKeepMemoryWithinTheBound|TestUploadsToARoomInUseKeepMemoryWithinTheBound)$' ./internal/bus ./internal/dispatch/api ./internal/dispatch/docs > "$RUNNER_TEMP/go-test-json/race-impossible.json" 2> "$RUNNER_TEMP/go-test-logs/race-impossible.log" &
          impossible=$!
          # The routes package, on the second Postgres service: DISPATCH_TEST_DATABASE_URL names
          # 5433 on this call and nowhere else, so the only transactions its horizon waits on are
          # its own tests'. It is on the call rather than on the step because every other call
          # here runs against 5432. The package measured 56 s with an instance to itself on a
          # loaded two-core pod, so 10 minutes is ample.
          DISPATCH_TEST_DATABASE_URL=postgres://postgres:ci@localhost:5433/postgres?sslmode=disable go test -json -count=1 -timeout 1m ./internal/dispatch/routes/ > "$RUNNER_TEMP/go-test-json/routes.json" 2> "$RUNNER_TEMP/go-test-logs/routes.log" &
          routes=$!
          # internal/testnats runs its server in the test process, so the package list below
          # starts no container. The two-image matrix, which proves a rendered authorization on
          # nats:2.10 and on the image the hub runs, is the one thing an in-process server cannot
          # reproduce: it sits behind the natslive tag, and this call is where it runs
          # (INFRA-250). internal/bus has one test of its own on that matrix: the module links
          # nats-server v2.15.1 in process, which caps a stream that sets no cap at a default of
          # its own and takes a change of MaxConsumers on a stream that already exists, so the
          # raise of an uncapped ENVOY_NOTIFICATIONS to the consumer cap this binary compiles and
          # the keeper's restore of a cap an operator lowered or unset are proved in process.
          # What is left for a real image is the pair of 2.10 cases - the stream with no cap the
          # binary must leave alone, and the refusal of the raise of a lower cap, naming the
          # field, the cap and the first server taking the change - and the hub's own reconcile
          # on the nats:2.15.1-alpine image the deployment runs (INFRA-1384). Each package runs
          # only the tests its tag adds: `-tags natslive ./pkg` would re-run the package's
          # untagged tests, which already run elsewhere - internal/testnats in the package list
          # below, and internal/bus in envoy-go-race, which that list's grep -Ev leaves out - so
          # the -run comes from .github/scripts/go-tagged-tests.sh, which reads the names off the
          # source at run time, and no test name is spelled here. Each assignment is a line of
          # its own and runs before the call it feeds: under bash -e it carries the script's exit
          # status, so an empty or refused list fails the step instead of running -run "", which
          # matches every test.
          rig=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/testnats)
          cap=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/bus)
          { go test -json -count=1 -tags natslive -run "$rig" ./internal/testnats/ &&
            go test -json -count=1 -timeout 1m -tags natslive -run "$cap" -v ./internal/bus/; } > "$RUNNER_TEMP/go-test-json/natslive.json" 2> "$RUNNER_TEMP/go-test-logs/natslive.log" &
          natslive=$!
          # The integration suite, which runs a real NATS server in the test process.
          go test -json -count=1 -timeout 1m ./internal/integration/ > "$RUNNER_TEMP/go-test-json/integration.json" 2> "$RUNNER_TEMP/go-test-logs/integration.log" &
          integration=$!
          # agentloop's live proof makes a real model call, so it sits behind a build tag and CI
          # never runs it. Vetting it keeps it compiling as the package changes. It writes no
          # stream: its log is everything it prints.
          go vet -tags modellive ./agentloop/ > "$RUNNER_TEMP/go-test-logs/agentloop-vet.log" 2>&1 &
          vet=$!
          lead="github.com/sjawhar/envoy/internal/dispatch/pmdoc
          github.com/sjawhar/envoy/cmd/dispatch-seed
          github.com/sjawhar/envoy/internal/dispatch/outbox
          github.com/sjawhar/envoy/internal/pgmigrate
          github.com/sjawhar/envoy/cmd/dispatch
          github.com/sjawhar/envoy/cmd/broker"
          s=0
          rest=$(go list ./... | grep -Ev '/integration|/internal/dispatch/delivery($|/)|/internal/dispatch/store($|/)|/internal/bus$|/cmd/listener$|/internal/store$|/internal/session$|/internal/kvwatch($|/)|/internal/dispatch/api$|/internal/dispatch/docs$|/internal/dispatch/routes$' | grep -vxF "$lead")
          printf '%s\n%s\n' "$lead" "$rest" | xargs go test -json -count=1 -p 8 -parallel 12 -timeout 10m > "$RUNNER_TEMP/go-test-json/unit.json" || s=$?
          p=0
          wait "$impossible" || p=$?
          r=0
          wait "$routes" || r=$?
          n=0
          wait "$natslive" || n=$?
          i=0
          wait "$integration" || i=$?
          v=0
          wait "$vet" || v=$?
          # One group per call: the package list first, then the background calls in the order
          # they were started. Each is its own log, then its stream - the package result lines
          # when it passed, the whole stream when it failed - and an ::error:: naming it when it
          # failed. The step's status is the first non-zero of the six, and the package list,
          # which prints as it goes, writes no log of its own.
          status=0
          replay() {
            echo "::group::$1 (exit $2)"
            [ ! -s "$RUNNER_TEMP/go-test-logs/$3.log" ] || cat "$RUNNER_TEMP/go-test-logs/$3.log"
            if [ "$2" -eq 0 ]; then
              jq -rj 'select(.Action == "build-output" or (.Action == "output" and .Test == null)) | .Output' "$RUNNER_TEMP/go-test-json/$3.json"
            else
              jq -rj 'select(.Action == "build-output" or .Action == "output") | .Output' "$RUNNER_TEMP/go-test-json/$3.json"
            fi
            echo "::endgroup::"
            [ "$2" -eq 0 ] || echo "::error::$1 failed (exit $2)"
            [ "$status" -ne 0 ] || status=$2
          }
          replay "the package list" "$s" unit
          replay "the race-impossible run" "$p" race-impossible
          replay "the routes package" "$r" routes
          replay "the natslive matrix" "$n" natslive
          replay "the integration suite" "$i" integration
          echo "::group::the agentloop vet (exit $v)"
          cat "$RUNNER_TEMP/go-test-logs/agentloop-vet.log"
          echo "::endgroup::"
          [ "$v" -eq 0 ] || echo "::error::the agentloop vet failed (exit $v)"
          [ "$status" -ne 0 ] || status=$v
          exit "$status"
        working-directory: packages/envoy
      # What the pair is read from, printed by the job itself so a reader needs no artifact: the
      # test step's wall time, and from the step's own `go test -json` streams every package's
      # elapsed seconds and the three packages that finished last. A package's finish is its own
      # pass or fail event, whose Time the stream carries; its elapsed is that event's Elapsed. In
      # the split job pmdoc appears three times, once per call, which is the tail this measures.
      # if: always(), because a red attempt's times are the ones a reader needs.
      - name: The step's wall time, its packages' times and the last three to finish
        if: always()
        run: |
          wall=$(( $(date +%s) - UNIT_STEP_STARTED ))
          echo "the test step: $wall s of wall"
          tab=$'\t'
          rows="$RUNNER_TEMP/package-times.tsv"
          : > "$rows"
          for stream in "$RUNNER_TEMP"/go-test-json/*.json; do
            [ -e "$stream" ] || continue
            jq -r --arg call "$(basename "$stream" .json)" 'select(.Test == null and (.Action == "pass" or .Action == "fail")) | [.Time, (.Elapsed // 0), .Package, .Action, $call] | @tsv' "$stream" >> "$rows"
          done
          echo "::group::every package's elapsed seconds, slowest first"
          sort -t"$tab" -k2,2gr "$rows" | awk -F'\t' '{ printf "%8.2f s  %s  %s (%s)\n", $2, $3, $4, $5 }'
          echo "::endgroup::"
          last=$(sort -t"$tab" -k1,1 "$rows" | awk -F'\t' '{ printf "%s  %8.2f s  %s  %s (%s)\n", $1, $2, $3, $4, $5 }' | tail -3)
          echo "the last three packages to finish:"
          echo "$last"
          {
            echo "### ${{ github.job }}, round ${{ matrix.round }}: the test step took $wall s"
            echo
            echo '```'
            echo "$last"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
        working-directory: packages/envoy
      - name: Upload the go test -json streams
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pmdoc-ab-${{ github.job }}-round-${{ matrix.round }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-json/
          if-no-files-found: warn

  # The same job, with pmdoc's measured chain divided into two processes: the arm under test.
  split:
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
      postgres_routes:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5433:5432"]
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            !~/go/pkg/mod/cache/download/**/*.zip
          key: go-envoy-test-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-test-{0}-', runner.os) }}
      - name: Postgres service version
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc "select current_setting('server_version_num'), coalesce((select default_version from pg_available_extensions where name = 'vector'), 'no vector')"
      - name: Read the disposable service's settings back
        run: |
          id="${{ job.services.postgres.id }}"
          failed=
          read_back=
          for want in fsync=off full_page_writes=off synchronous_commit=off max_connections=500 max_prepared_transactions=20; do
            setting=${want%%=*}
            value=$(docker exec "$id" psql -U postgres -Atc "show $setting")
            read_back="$read_back $setting=$value"
            [ "$value" = "${want#*=}" ] || { echo "::error::the Postgres service reports $setting=$value, not ${want#*=}"; failed=1; }
          done
          echo "$id:$read_back"
          [ -z "$failed" ] || exit 1
      - name: Read the routes service's settings back
        run: |
          id="${{ job.services.postgres_routes.id }}"
          failed=
          read_back=
          for want in fsync=off full_page_writes=off synchronous_commit=off max_connections=500 max_prepared_transactions=20; do
            setting=${want%%=*}
            value=$(docker exec "$id" psql -U postgres -Atc "show $setting")
            read_back="$read_back $setting=$value"
            [ "$value" = "${want#*=}" ] || { echo "::error::the routes Postgres service reports $setting=$value, not ${want#*=}"; failed=1; }
          done
          echo "$id:$read_back"
          [ -z "$failed" ] || exit 1
      - name: Pull test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
            packages/envoy/internal/tests3/seaweedfs.go Image
      - name: Note when the test step starts
        run: echo "UNIT_STEP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # The whole job's step with one change, which is the whole of this measurement: pmdoc runs
      # as three `go test` processes of its own and is out of the foreground package list. Its
      # twelve measured tests - the ones that time a call by this process's own CPU time, through
      # internal/cputest - run one after another in whatever process holds them, because
      # cputest.Process reads RUSAGE_SELF and a test computing beside a measured call is counted
      # into it, so none of them calls t.Parallel and Go starts a package's parallel tests only
      # once every serial one has finished. Two processes keep that rule and halve the chain: the
      # heaviest measured test (about 135 s) in one, the other eleven (about 156 s together) in
      # the other, and the package's unmeasured rest, its parallel tail among them, in a third.
      # Every other line of the script, the -timeout of every call included, is the whole job's.
      - name: Unit test envoy Go package
        run: |
          mkdir -p "$RUNNER_TEMP/go-test-json" "$RUNNER_TEMP/go-test-logs"
          # The tests the race detector makes impossible, which the race job of each of these
          # packages therefore cannot make, so envoy-go keeps a plain run of exactly them:
          # internal/bus counts HoldsSeed's allocations, which the race runtime's own
          # allocations would be counted into; the API's two guards read the module's source, to
          # which the detector adds nothing; and the documents package measures the heap a room
          # keeps, which the detector's shadow memory and instrumentation move. Those are out of
          # the race build altogether (//go:build !race), and the two render-reuse storms run
          # fewer seeds and fewer edits under it (raceEnabled), so this is their full-size run.
          # It was a step of its own before this one until dispatch://INFRA-985's condition for
          # running it here was measured: the three documents memory bounds read this process's
          # own heap after two forced collections, and the question was whether a slow mark
          # under contention lets the heap overshoot before the reading is taken. Run
          # 42526940781 ran all three sixty times in this shape - beside pmdoc's CPU-budget
          # tests, under busy loops at twice the runner's cores, against a Postgres service
          # exactly like this job's - and every run passed, the worst of them using 36.1 per
          # cent of its bound, where the condition was no failure and no run within 15 per cent.
          # The other half of that step's old reason went with the API package, whose live-feed
          # and delivery-hub tests wait for the event log's safe horizon and run in
          # envoy-go-race-api now. The one -run list is derived in
          # .github/scripts/ci_job_reads.py from the race lane's own packages and those files'
          # //go:build !race and raceEnabled, so a test added to either and missing here fails
          # the ci-filters job naming this step. Measured over three runs on a two-vCPU pod: the
          # bus under a tenth of a second, the API 8 to 10 s, the documents package 92 to 127 s,
          # so 10 minutes each is ample.
          #
          # One go test over the three packages rather than one per package: go builds the three
          # test binaries together and runs each package's tests as soon as its own binary is
          # linked, so the documents package's tests run beside the API package's build instead
          # of after it. Three commands in a row cost 96 s for 44 s of tests - 40 s of them the
          # API package's build, with nothing running beside it (run 42307926510,
          # dispatch://INFRA-1075). Each package measures its own process's heap or allocations,
          # so running them at the same time changes no number any of them asserts on.
          go test -json -count=1 -timeout 4m -run '^(TestARoomFedOnlyByAgentWritesKeepsMemoryWithinTheBound|TestCopyLockComesBeforeEveryPendingRowAndEvent|TestCopyLockOrderGuardFollowsTheLockTakers|TestEveryKeyedWriteCommitsInsideATransactionTheMarkHooks|TestHoldsSeedAllocatesAtMostOneCopyPerDecoding|TestRenderReuseARandomisedEditStorm|TestRenderReuseAReplicaReplaysTheRoomsFormattingExactly|TestTheKeyedWriteGuardSeesWhatItGuards|TestUploadsOverOpenAnchorsKeepMemoryWithinTheBound|TestUploadsToARoomInUseKeepMemoryWithinTheBound)$' ./internal/bus ./internal/dispatch/api ./internal/dispatch/docs > "$RUNNER_TEMP/go-test-json/race-impossible.json" 2> "$RUNNER_TEMP/go-test-logs/race-impossible.log" &
          impossible=$!
          # The routes package, on the second Postgres service: DISPATCH_TEST_DATABASE_URL names
          # 5433 on this call and nowhere else, so the only transactions its horizon waits on are
          # its own tests'. It is on the call rather than on the step because every other call
          # here runs against 5432. The package measured 56 s with an instance to itself on a
          # loaded two-core pod, so 10 minutes is ample.
          DISPATCH_TEST_DATABASE_URL=postgres://postgres:ci@localhost:5433/postgres?sslmode=disable go test -json -count=1 -timeout 1m ./internal/dispatch/routes/ > "$RUNNER_TEMP/go-test-json/routes.json" 2> "$RUNNER_TEMP/go-test-logs/routes.log" &
          routes=$!
          # internal/testnats runs its server in the test process, so the package list below
          # starts no container. The two-image matrix, which proves a rendered authorization on
          # nats:2.10 and on the image the hub runs, is the one thing an in-process server cannot
          # reproduce: it sits behind the natslive tag, and this call is where it runs
          # (INFRA-250). internal/bus has one test of its own on that matrix: the module links
          # nats-server v2.15.1 in process, which caps a stream that sets no cap at a default of
          # its own and takes a change of MaxConsumers on a stream that already exists, so the
          # raise of an uncapped ENVOY_NOTIFICATIONS to the consumer cap this binary compiles and
          # the keeper's restore of a cap an operator lowered or unset are proved in process.
          # What is left for a real image is the pair of 2.10 cases - the stream with no cap the
          # binary must leave alone, and the refusal of the raise of a lower cap, naming the
          # field, the cap and the first server taking the change - and the hub's own reconcile
          # on the nats:2.15.1-alpine image the deployment runs (INFRA-1384). Each package runs
          # only the tests its tag adds: `-tags natslive ./pkg` would re-run the package's
          # untagged tests, which already run elsewhere - internal/testnats in the package list
          # below, and internal/bus in envoy-go-race, which that list's grep -Ev leaves out - so
          # the -run comes from .github/scripts/go-tagged-tests.sh, which reads the names off the
          # source at run time, and no test name is spelled here. Each assignment is a line of
          # its own and runs before the call it feeds: under bash -e it carries the script's exit
          # status, so an empty or refused list fails the step instead of running -run "", which
          # matches every test.
          rig=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/testnats)
          cap=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/bus)
          { go test -json -count=1 -tags natslive -run "$rig" ./internal/testnats/ &&
            go test -json -count=1 -timeout 1m -tags natslive -run "$cap" -v ./internal/bus/; } > "$RUNNER_TEMP/go-test-json/natslive.json" 2> "$RUNNER_TEMP/go-test-logs/natslive.log" &
          natslive=$!
          # The integration suite, which runs a real NATS server in the test process.
          go test -json -count=1 -timeout 1m ./internal/integration/ > "$RUNNER_TEMP/go-test-json/integration.json" 2> "$RUNNER_TEMP/go-test-logs/integration.log" &
          integration=$!
          # agentloop's live proof makes a real model call, so it sits behind a build tag and CI
          # never runs it. Vetting it keeps it compiling as the package changes. It writes no
          # stream: its log is everything it prints.
          go vet -tags modellive ./agentloop/ > "$RUNNER_TEMP/go-test-logs/agentloop-vet.log" 2>&1 &
          vet=$!
          # THE ONE DIFFERENCE from the whole job: pmdoc as three calls of its own, started here,
          # where the whole job leaves the package at the head of the foreground list below.
          # Each pattern is an anchored alternation of whole names, since go test matches a name
          # element against the whole pattern: anchored, it can neither miss one of these tests
          # nor reach a second whose name merely begins with one of them. The names are the
          # twelve the reverted commit 458d68a2 held as PMDOC_MEASURED, read off the package's
          # source there: every test that times a call by this process's own CPU time, through
          # internal/cputest, directly or through linear_test.go's cpuTimeOf and processCPUTime.
          #
          # The partition is proved before the calls run, because the mistake that would make
          # this measurement a lie is a test of the package in none of the three and so in no run
          # at all: the check lists the package (`go test -list '.*'`) and each of the three
          # patterns, and fails the step naming the difference unless the two -run sets are
          # disjoint, are together exactly the set the third call's -skip names, and, with the
          # rest of the package, are exactly its list. That rest is computed in the shell because
          # `go test -list` applies -run but not -skip, so the third call's own set cannot be
          # listed directly. The list is held to the package's `Test` functions alone: `go test
          # -list` prints its benchmarks too, which no run here starts, and its fuzz targets,
          # whose seed corpora the third call runs, since a pattern of `Test` names matches no
          # `Fuzz` one. Measured from packages/envoy on this branch: 1 + 11 + 362 = 374 listed.
          #
          # The check's own `go test -list` builds the package's test binary, so the three calls
          # below start on a warm build - the cost the real step would pay too, which is why it
          # is inside the step being timed rather than beside it. -timeout 10m on each is the
          # limit pmdoc runs under in the whole job, where it is a package of the foreground
          # list: the two jobs differ in the number of processes and in nothing else.
          pmdoc=./internal/dispatch/pmdoc/
          heaviest='^(TestBareURLShapesParseAndRenderLinearly)$'
          others='^(TestALateCallFinishingAfterItsTestDoesNotPanicHelper|TestAMissedDeadlineLeavesTheCollectorAsItWas|TestHeavyBodiesAtTheBlockCapAreStoredOrRefusedInTime|TestHeavyBodiesAtTheBlockCapParseInTimeProportionalToTheirLength|TestHeavyBodiesAtTheBodyCapParseAndEncodeInTimeProportionalToTheirLength|TestParseAndRenderAreLinearOnDelimiterAndOpenerHeavyText|TestParseForWriteRefusesDeeplyNestedBareDirectivesQuickly|TestParseIsLinearInATableOfEscapedPipes|TestRenderIsLinearOnRunsFootnoteLabelsAndLineFeeds|TestUnclosedRawHTMLShapesParseAndRenderLinearly|TestUpdateIsLinearInTheBlockCount)$'
          measured='^(TestALateCallFinishingAfterItsTestDoesNotPanicHelper|TestAMissedDeadlineLeavesTheCollectorAsItWas|TestBareURLShapesParseAndRenderLinearly|TestHeavyBodiesAtTheBlockCapAreStoredOrRefusedInTime|TestHeavyBodiesAtTheBlockCapParseInTimeProportionalToTheirLength|TestHeavyBodiesAtTheBodyCapParseAndEncodeInTimeProportionalToTheirLength|TestParseAndRenderAreLinearOnDelimiterAndOpenerHeavyText|TestParseForWriteRefusesDeeplyNestedBareDirectivesQuickly|TestParseIsLinearInATableOfEscapedPipes|TestRenderIsLinearOnRunsFootnoteLabelsAndLineFeeds|TestUnclosedRawHTMLShapesParseAndRenderLinearly|TestUpdateIsLinearInTheBlockCount)$'
          listed() { go test -count=1 -list "$1" "$pmdoc" | grep '^Test' | sort; }
          all=$(listed '.*')
          in_heaviest=$(listed "$heaviest")
          in_others=$(listed "$others")
          in_measured=$(listed "$measured")
          in_run=$(printf '%s\n%s\n' "$in_heaviest" "$in_others" | grep '^Test' | sort)
          unmeasured=$(comm -23 <(printf '%s\n' "$all") <(printf '%s\n' "$in_measured"))
          overlap=$(comm -12 <(printf '%s\n' "$in_heaviest") <(printf '%s\n' "$in_others"))
          union=$(printf '%s\n%s\n' "$in_measured" "$unmeasured" | grep '^Test' | sort -u)
          if [ -z "$in_heaviest" ] || [ -z "$in_others" ] || [ -z "$unmeasured" ] || [ -n "$overlap" ] || [ "$in_run" != "$in_measured" ] || [ "$union" != "$all" ]; then
            printf 'the three pmdoc calls do not partition the package: %s heaviest + %s other measured + %s unmeasured, %s listed\n' "$(grep -c . <<<"$in_heaviest")" "$(grep -c . <<<"$in_others")" "$(grep -c . <<<"$unmeasured")" "$(grep -c . <<<"$all")"
            printf 'in both -run calls: %s\n' "${overlap:-none}"
            printf 'in a -run call and not skipped by the third: %s\n' "$(comm -23 <(printf '%s\n' "$in_run") <(printf '%s\n' "$in_measured"))"
            printf 'skipped by the third call and in no -run call: %s\n' "$(comm -13 <(printf '%s\n' "$in_run") <(printf '%s\n' "$in_measured"))"
            printf 'listed and in no call: %s\n' "$(comm -23 <(printf '%s\n' "$all") <(printf '%s\n' "$union"))"
            printf 'in a call and not listed: %s\n' "$(comm -13 <(printf '%s\n' "$all") <(printf '%s\n' "$union"))"
            exit 1
          fi
          printf 'pmdoc partition: %s heaviest + %s other measured + %s unmeasured = %s listed\n' "$(grep -c . <<<"$in_heaviest")" "$(grep -c . <<<"$in_others")" "$(grep -c . <<<"$unmeasured")" "$(grep -c . <<<"$all")"
          go test -json -count=1 -timeout 10m -run "$heaviest" "$pmdoc" > "$RUNNER_TEMP/go-test-json/pmdoc-heaviest.json" 2> "$RUNNER_TEMP/go-test-logs/pmdoc-heaviest.log" &
          pmdoc_heaviest=$!
          go test -json -count=1 -timeout 10m -run "$others" "$pmdoc" > "$RUNNER_TEMP/go-test-json/pmdoc-others.json" 2> "$RUNNER_TEMP/go-test-logs/pmdoc-others.log" &
          pmdoc_others=$!
          go test -json -count=1 -parallel 12 -timeout 10m -skip "$measured" "$pmdoc" > "$RUNNER_TEMP/go-test-json/pmdoc-rest.json" 2> "$RUNNER_TEMP/go-test-logs/pmdoc-rest.log" &
          pmdoc_rest=$!
          lead="github.com/sjawhar/envoy/cmd/dispatch-seed
          github.com/sjawhar/envoy/internal/dispatch/outbox
          github.com/sjawhar/envoy/internal/pgmigrate
          github.com/sjawhar/envoy/cmd/dispatch
          github.com/sjawhar/envoy/cmd/broker"
          s=0
          rest=$(go list ./... | grep -Ev '/integration|/internal/dispatch/delivery($|/)|/internal/dispatch/store($|/)|/internal/bus$|/cmd/listener$|/internal/store$|/internal/session$|/internal/kvwatch($|/)|/internal/dispatch/api$|/internal/dispatch/docs$|/internal/dispatch/routes$|/internal/dispatch/pmdoc$' | grep -vxF "$lead")
          printf '%s\n%s\n' "$lead" "$rest" | xargs go test -json -count=1 -p 8 -parallel 12 -timeout 10m > "$RUNNER_TEMP/go-test-json/unit.json" || s=$?
          p=0
          wait "$impossible" || p=$?
          r=0
          wait "$routes" || r=$?
          n=0
          wait "$natslive" || n=$?
          i=0
          wait "$integration" || i=$?
          v=0
          wait "$vet" || v=$?
          ph=0
          wait "$pmdoc_heaviest" || ph=$?
          po=0
          wait "$pmdoc_others" || po=$?
          pr=0
          wait "$pmdoc_rest" || pr=$?
          # One group per call: the package list first, then the background calls in the order
          # they were started. Each is its own log, then its stream - the package result lines
          # when it passed, the whole stream when it failed - and an ::error:: naming it when it
          # failed. The step's status is the first non-zero of the nine, and the package list,
          # which prints as it goes, writes no log of its own.
          status=0
          replay() {
            echo "::group::$1 (exit $2)"
            [ ! -s "$RUNNER_TEMP/go-test-logs/$3.log" ] || cat "$RUNNER_TEMP/go-test-logs/$3.log"
            if [ "$2" -eq 0 ]; then
              jq -rj 'select(.Action == "build-output" or (.Action == "output" and .Test == null)) | .Output' "$RUNNER_TEMP/go-test-json/$3.json"
            else
              jq -rj 'select(.Action == "build-output" or .Action == "output") | .Output' "$RUNNER_TEMP/go-test-json/$3.json"
            fi
            echo "::endgroup::"
            [ "$2" -eq 0 ] || echo "::error::$1 failed (exit $2)"
            [ "$status" -ne 0 ] || status=$2
          }
          replay "the package list" "$s" unit
          replay "the race-impossible run" "$p" race-impossible
          replay "the routes package" "$r" routes
          replay "the natslive matrix" "$n" natslive
          replay "the integration suite" "$i" integration
          replay "pmdoc's heaviest measured test" "$ph" pmdoc-heaviest
          replay "pmdoc's eleven other measured tests" "$po" pmdoc-others
          replay "pmdoc's unmeasured rest" "$pr" pmdoc-rest
          echo "::group::the agentloop vet (exit $v)"
          cat "$RUNNER_TEMP/go-test-logs/agentloop-vet.log"
          echo "::endgroup::"
          [ "$v" -eq 0 ] || echo "::error::the agentloop vet failed (exit $v)"
          [ "$status" -ne 0 ] || status=$v
          exit "$status"
        working-directory: packages/envoy
      - name: The step's wall time, its packages' times and the last three to finish
        if: always()
        run: |
          wall=$(( $(date +%s) - UNIT_STEP_STARTED ))
          echo "the test step: $wall s of wall"
          tab=$'\t'
          rows="$RUNNER_TEMP/package-times.tsv"
          : > "$rows"
          for stream in "$RUNNER_TEMP"/go-test-json/*.json; do
            [ -e "$stream" ] || continue
            jq -r --arg call "$(basename "$stream" .json)" 'select(.Test == null and (.Action == "pass" or .Action == "fail")) | [.Time, (.Elapsed // 0), .Package, .Action, $call] | @tsv' "$stream" >> "$rows"
          done
          echo "::group::every package's elapsed seconds, slowest first"
          sort -t"$tab" -k2,2gr "$rows" | awk -F'\t' '{ printf "%8.2f s  %s  %s (%s)\n", $2, $3, $4, $5 }'
          echo "::endgroup::"
          last=$(sort -t"$tab" -k1,1 "$rows" | awk -F'\t' '{ printf "%s  %8.2f s  %s  %s (%s)\n", $1, $2, $3, $4, $5 }' | tail -3)
          echo "the last three packages to finish:"
          echo "$last"
          {
            echo "### ${{ github.job }}, round ${{ matrix.round }}: the test step took $wall s"
            echo
            echo '```'
            echo "$last"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
        working-directory: packages/envoy
      - name: Upload the go test -json streams
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pmdoc-ab-${{ github.job }}-round-${{ matrix.round }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-json/
          if-no-files-found: warn
