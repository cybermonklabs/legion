name: CI job dispatch-ui

# The steps of `.github/workflows/ci.yaml#dispatch-ui` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

jobs:
  dispatch-ui:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      JOB_TIMEOUT_MINUTES: 15 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # The suites below read some of contracts' values through plain Node resolution rather than
      # through the workspace's "bun" export condition: e2e/__tests__/row-configurations.test.ts
      # spawns Playwright, whose own resolution reads contracts' built dist/. Without this step
      # that spawn fails the moment contracts' source gains an export its dist lacks, measured on
      # run 42303677853 at 5636a301, where both of its cases failed with "The requested module
      # '@legion/contracts/dispatch-tools' does not provide an export named
      # 'DISPATCH_BLOCK_UNITS'" and passed again once contracts was built
      # (every job of dispatch-browser.yaml that runs the suite needs contracts built for the
      # same reason and carries a `Build contracts for dispatch e2e` step of its own, which that
      # file's shard job explains).
      # `build:dispatch` bundles only the contracts entries Dispatch imports, five of them: the
      # package itself, ./dispatch-snippet, ./dispatch-tools and ./http-status
      # (`packages/dispatch/web/vite.config.ts#"@legion/contracts/dispatch-snippet"`,
      # `packages/dispatch/web/vite.config.ts#"@legion/contracts/dispatch-tools"`,
      # `packages/dispatch/web/vite.config.ts#"@legion/contracts/http-status"` and
      # `packages/dispatch/web/vite.config.ts#"@legion/contracts"` alias the same four), and
      # ./legion-api. The SPA's sources import ./legion-api as types only
      # (`packages/dispatch/web/src/features/dashboard/phase-track.ts#LegionPhase` and
      # `packages/dispatch/web/src/features/dashboard/role-words.ts#LegionClaimState`), so the
      # SPA build removes the import and vite needs no alias for it. The e2e seed imports
      # `packages/dispatch/e2e/dashboard-seed.ts#LEGION_CLAIM_STATES` as a value, which
      # Playwright's Node run reads from dist/legion-api.js, and that is why the script builds
      # this fifth entry; packages/dispatch/e2e/__tests__/contracts-build-entries.test.ts holds
      # the script to every contracts subpath the dashboard and the proof editor import. The
      # dashboard's tsc program compiles ./legion-api through those imports, so the build
      # compiles no module outside the set the dashboard's tsc programs compile, which is what
      # this job's filter lists. package.json allows no comment, so this is where the list is
      # explained: a new import of a contracts subpath by packages/dispatch adds its entry to that
      # script, or Playwright's Node resolution fails on the missing dist/ file. The dashboard's
      # test step below runs build:contracts again, as the package's test script does.
      - name: Build contracts for the suites that spawn Playwright
        run: bun run build:dispatch
        working-directory: packages/contracts
      - name: Typecheck proof editor
        run: bun run typecheck
        working-directory: packages/proof-editor
      - name: Test proof editor
        run: ../../.github/scripts/bun_test_run.py test bun run test
        working-directory: packages/proof-editor
      - name: Typecheck dispatch dashboard
        run: bun run typecheck
        working-directory: packages/dispatch
      # e2e/__tests__/outside-path-reach-input.test.ts runs the path-reach driver under zsh, and
      # outside-edge-refusals-input.test.ts the edge-refusal check, each of which must refuse to run
      # and name bash; each skips that row where zsh is missing, and the runner image has no zsh
      # (dash, the other shell they run under, is Ubuntu's /bin/sh).
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      # The database cases of e2e/__tests__/psql-session.test.ts and harness-stacks.test.ts skip
      # themselves where LEGION_TEST_PG_DSN names no server, so in this job they do not run: it
      # has no `postgres:` service. A container of the pinned image for
      # this step alone was tried and taken out again, in the job these tests ran in before this
      # one: it cost an image pull and a readiness wait, about 90 s, and the wait timed out on one
      # runner in three. The case "psql reads its own stack's database" of harness-stacks.test.ts
      # proves that a worker's psql reads its own stack's database and not the plain name. The
      # database cases of psql-session.test.ts test psql's session protocol against a real server.
      # Both are proven on any machine with psql on its PATH and LEGION_TEST_PG_DSN set, where
      # psql-session makes a database of its own. A developer runs them with `bun run test` in
      # packages/dispatch. The rows of replace-blocks-guard.test.ts that need a server skip here
      # for the same reason, and that file's head says what they test. In an issue pod, where
      # README.md's Development section sends the whole-package run out of the pod, a role whose
      # change touches what these three files cover runs the three files by name in
      # packages/dispatch, with this command:
      # `bun test e2e/__tests__/psql-session.test.ts e2e/__tests__/harness-stacks.test.ts e2e/__tests__/replace-blocks-guard.test.ts`
      # The stack contract that harness-stacks.test.ts guards is also covered end to end by every
      # multi-worker run of the browser suite itself.
      #
      # This step runs both lanes in random order, which packages/dispatch/bunfig.toml sets. Each
      # lane prints its own ` --seed=<n>` in its summary. A red row that failed from the order is
      # reproduced with its file alone and that seed, as docs/testing.md ("A Dispatch unit test runs
      # in random order") says; it also says what a row that failed from the lane's load needs.
      #
      # The three commands are the `test` script of packages/dispatch/package.json, run one at a
      # time so each lane writes its own JUnit report: `bun run test` hands extra arguments to the
      # last command of a script alone, and the two lanes would overwrite one report file. Each
      # command is written once, as the array the step runs it from, and the step first holds the
      # script to the three as those arrays spell them, so a change to the script, or to a lane
      # here, fails rather than leaving a lane one of the two no longer runs.
      - name: Test dispatch dashboard
        run: |
          build=(build:contracts)
          web=(test:web web/src)
          harness=(test:harness e2e/__tests__)
          want="bun run ${build[*]} && bun run ${web[*]} && bun run ${harness[*]}"
          got=$(jq -r .scripts.test package.json)
          if [ "$got" != "$want" ]; then
            echo "::error::packages/dispatch/package.json's test script is '$got', and this step runs '$want': write the step's arrays from the script again" >&2
            exit 1
          fi
          bun run "${build[@]}"
          ../../.github/scripts/bun_test_run.py web bun run "${web[@]}"
          ../../.github/scripts/bun_test_run.py harness bun run "${harness[@]}"
        working-directory: packages/dispatch
      # The build writes dist/THIRD_PARTY_NOTICES.txt, failing on a bundled package whose license
      # cannot be determined; the listing shows the build shipped it.
      - name: Build dispatch dashboard
        run: |
          bun run build:web
          ls -l web/dist/THIRD_PARTY_NOTICES.txt
        working-directory: packages/dispatch
      - name: Check dispatch dashboard CSS classes
        run: bun run check:classes
        working-directory: packages/dispatch
      # The server refuses to boot on a build holding an asset over 8 MiB (it publishes every
      # asset to its database at boot), which would stall a roll; refuse the build here instead.
      - name: Check dispatch dashboard asset sizes
        run: bun run check:asset-sizes
        working-directory: packages/dispatch
      - name: Keep the bun test reports
        if: always()
        uses: ./.github/actions/bun-test-reports-upload
        with:
          check-run-id: ${{ job.check_run_id }}

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: dispatch-ui
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
