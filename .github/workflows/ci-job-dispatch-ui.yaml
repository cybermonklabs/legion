name: CI job dispatch-ui

# The steps of `.github/workflows/ci.yaml#dispatch-ui` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

jobs:
  dispatch-ui:
    runs-on: ubuntu-24.04-arm
    # Budget (ci-budgets.md's Budgets note): 900 s, the 15 minutes this job was written with, plus
    # its slowest retried step alone — the setup-bun step's two `ci_tools_fetch` calls,
    # 3416 s, above the workspace install's 5 x 180 + 150 = 1050 s, the zsh install's two apt
    # phases at 625 + 775 = 1400 s and the ci-ok report's 2460 s. 900 + 3416 = 4316 s -> 72 min.
    timeout-minutes: 72
    env:
      JOB_TIMEOUT_MINUTES: 72 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its own retry arithmetic, which is the action's: two `ci_tools_fetch` calls,
      # 2 x 1708 = 3416 s (ci-budgets.md's Budgets note) -> 57 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 57
      # Retried at 180 s per attempt like every Bun install here (ci-budgets.md's Retries note).
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile >&2
      # The suites below read some of contracts' values through plain Node resolution rather than
      # through the workspace's "bun" export condition: e2e/__tests__/row-configurations.test.ts
      # spawns Playwright, whose own resolution reads contracts' built dist/. Without this step
      # that spawn fails the moment contracts' source gains an export its dist lacks, measured on
      # run 42303677853 at 5636a301, where both of its cases failed with "The requested module
      # '@legion/contracts/dispatch-tools' does not provide an export named
      # 'DISPATCH_BLOCK_UNITS'" and passed again once contracts was built
      # (every job of dispatch-browser.yaml that runs the suite needs contracts built for the
      # same reason and carries a `Build contracts for dispatch e2e` step of its own, which that
      # file's shard job explains).
      # `build:dispatch` bundles only the contracts entries Dispatch imports - the package itself,
      # ./dispatch-snippet and ./dispatch-tools (`packages/dispatch/web/vite.config.ts#"@legion/contracts/dispatch-tools"` aliases the same
      # three) - so the build compiles no module outside the set the dashboard's tsc
      # programs compile, which is what this job's filter lists, and not ./legion-api, which
      # Dispatch never imports. package.json allows no comment, so this is where the list is
      # explained: a new import of a contracts subpath by packages/dispatch adds its entry to
      # that script, or Playwright's Node resolution fails on the missing dist/ file. The
      # package's own `bun run test` below runs the same script again (build:contracts).
      - name: Build contracts for the suites that spawn Playwright
        run: bun run build:dispatch
        working-directory: packages/contracts
      - name: Typecheck proof editor
        run: bun run typecheck
        working-directory: packages/proof-editor
      - name: Test proof editor
        run: bun run test
        working-directory: packages/proof-editor
      - name: Typecheck dispatch dashboard
        run: bun run typecheck
        working-directory: packages/dispatch
      # e2e/__tests__/outside-path-reach-input.test.ts runs the path-reach driver under zsh, and
      # outside-edge-refusals-input.test.ts the edge-refusal check, each of which must refuse to run
      # and name bash; each skips that row where zsh is missing, and the runner image has no zsh
      # (dash, the other shell they run under, is Ubuntu's /bin/sh).
      # Both apt phases retry through .github/scripts/ci-retry.sh, in e2e.yaml's spelling; their
      # bounds, and why the index read carries `-o APT::Update::Error-Mode=any`: ci-budgets.md's
      # Retries note.
      - name: Install zsh
        # Its own retry arithmetic, so an exhausted phase fails this step by name rather than
        # being cut part way by the job: the index read's 5 x 95 + 150 = 625 s and the package
        # download's 5 x 125 + 150 = 775 s, 1400 s -> 24 min.
        timeout-minutes: 24
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "apt's package lists" 95 -- \
            sudo timeout 90 apt-get update -o APT::Update::Error-Mode=any >&2
          retry_fetch "zsh" 125 -- \
            sudo timeout 120 apt-get install -y --no-install-recommends -d zsh >&2
          sudo apt-get install -y --no-install-recommends zsh
      # The database cases of e2e/__tests__/psql-session.test.ts and harness-stacks.test.ts skip
      # themselves where LEGION_TEST_PG_DSN names no server, so in this job they do not run: it
      # has no `postgres:` service, as this job's head says. A container of the pinned image for
      # this step alone was tried and taken out again, in the job these tests ran in before this
      # one: it cost an image pull and a readiness wait, about 90 s, and the wait timed out on one
      # runner in three. What those cases prove - that a worker's psql reads its own stack's
      # database and not the plain name - is proven on any machine with LEGION_TEST_PG_DSN set,
      # which is how a developer and an issue pod run them (`bun run test` in packages/dispatch;
      # psql-session makes a database of its own there), and the stack contract they guard is also
      # covered end to end by every multi-worker run of the browser suite itself.
      #
      # This step runs both lanes in random order, which packages/dispatch/bunfig.toml sets. Each
      # lane prints its own ` --seed=<n>` in its summary. A red row that failed from the order is
      # reproduced with its file alone and that seed, as docs/testing.md ("A Dispatch unit test runs
      # in random order") says; it also says what a row that failed from the lane's load needs.
      - name: Test dispatch dashboard
        run: bun run test
        working-directory: packages/dispatch
      # The build writes dist/THIRD_PARTY_NOTICES.txt, failing on a bundled package whose license
      # cannot be determined; the listing shows the build shipped it.
      - name: Build dispatch dashboard
        run: |
          bun run build:web
          ls -l web/dist/THIRD_PARTY_NOTICES.txt
        working-directory: packages/dispatch
      - name: Check dispatch dashboard CSS classes
        run: bun run check:classes
        working-directory: packages/dispatch
      # The server refuses to boot on a build holding an asset over 8 MiB (it publishes every
      # asset to its database at boot), which would stall a roll; refuse the build here instead.
      - name: Check dispatch dashboard asset sizes
        run: bun run check:asset-sizes
        working-directory: packages/dispatch
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 2580 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 43
        env:
          STEP_TIMEOUT_MINUTES: 43 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        uses: ./.github/actions/ci-ok-report
        with:
          job: dispatch-ui
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
