name: CI job dispatch-ui

# The steps of ci.yaml's `dispatch-ui` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

jobs:
  dispatch-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # The suites below read some of contracts' values through plain Node resolution rather than
      # through the workspace's "bun" export condition: e2e/__tests__/row-configurations.test.ts
      # spawns Playwright, whose own resolution reads contracts' built dist/. Without this step
      # that spawn fails the moment contracts' source gains an export its dist lacks, measured on
      # run 42303677853 at 5636a301, where both of its cases failed with "The requested module
      # '@legion/contracts/dispatch-tools' does not provide an export named
      # 'DISPATCH_BLOCK_UNITS'" and passed again once contracts was built
      # (dispatch-browser.yaml's shard, alone and multiprocess jobs need contracts built for the
      # same reason and carry no step for it: packages/dispatch/e2e/run.ts's buildContracts
      # builds them at the start of every run of the suite).
      - name: Build contracts for the suites that spawn Playwright
        run: bun run build
        working-directory: packages/contracts
      - name: Typecheck proof editor
        run: bun run typecheck
        working-directory: packages/proof-editor
      - name: Test proof editor
        run: bun run test
        working-directory: packages/proof-editor
      - name: Typecheck dispatch dashboard
        run: bun run typecheck
        working-directory: packages/dispatch
      # The database cases of e2e/__tests__/psql-session.test.ts and harness-lanes.test.ts skip
      # themselves where LEGION_TEST_PG_DSN names no server, so in this job they do not run: it
      # has no `postgres:` service, as this job's head says. A container of the pinned image for
      # this step alone was tried and taken out again, in the job these tests ran in before this
      # one: it cost an image pull and a readiness wait, about 90 s, and the wait timed out on one
      # runner in three. What those cases prove - that a lane's psql reads its own lane's database
      # and not the plain name - is proven on any machine with LEGION_TEST_PG_DSN set, which is how
      # a developer and an issue pod run them (`bun run test` in packages/dispatch; psql-session
      # makes a database of its own there), and the lane contract they guard is also covered end to
      # end by every multi-lane run of the browser suite itself.
      - name: Test dispatch dashboard
        run: bun run test
        working-directory: packages/dispatch
      # The build writes dist/THIRD_PARTY_NOTICES.txt, failing on a bundled package whose license
      # cannot be determined; the listing shows the build shipped it.
      - name: Build dispatch dashboard
        run: |
          bun run build:web
          ls -l web/dist/THIRD_PARTY_NOTICES.txt
        working-directory: packages/dispatch
      - name: Check dispatch dashboard CSS classes
        run: bun run check:classes
        working-directory: packages/dispatch
      # The server refuses to boot on a build holding an asset over 8 MiB (it publishes every
      # asset to its database at boot), which would stall a roll; refuse the build here instead.
      - name: Check dispatch dashboard asset sizes
        run: bun run check:asset-sizes
        working-directory: packages/dispatch
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: dispatch-ui
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
