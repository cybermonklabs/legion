name: Dispatch browser suite

# why: .github/ci-notes/dispatch-browser.md#the-suite-its-two-lanes-and-the-budget-rule-every-job-follows
# why: .github/ci-notes/dispatch-browser.md#the-third-lane-references
on:
  workflow_call:
    inputs:
      lane:
        description: >-
          Which projects run, and over which rows: `pull-request` for `chromium`, `iphone`
          and the two stubbed projects, held to the rows tagged `@pr`; `full` for every
          project, the `-alone` ones and the two-process job among them, over every row; or
          `references` for `chromium` alone, over every row of the twenty-one spec files the
          `references)` arm of .github/scripts/dispatch-browser-shard-suite.sh names, with the
          binaries, shard and merge jobs alone. Each caller passes it as a literal: ci.yaml's
          dispatch-browser-pr job `pull-request`, its dispatch-browser job and the nightly's
          `full`, and its dispatch-references job `references`. The shard job reads it for the
          projects it runs; no job reads it for a browser to install any more, since the image
          the shard and alone jobs run in carries all three engines. Any other value fails the
          shard job's browser step by name, before it starts a row.
        type: string
        required: true
      job:
        description: >-
          The id of the job that calls this file: dispatch-browser, dispatch-browser-pr or
          dispatch-references of ci.yaml, or dispatch-browser of the nightly. GitHub names each
          job of this file `<that id> / <job>`, so the merge job reads only the jobs under it;
          every artifact name starts with it, so ci.yaml's callers that share a run - a pull
          request labelled full-ci runs dispatch-browser beside dispatch-browser-pr, and one that
          changes what the reference rows test runs dispatch-references beside it - upload and
          download none of each other's; and the merge job's ci-ok report, where its caller asks
          for one, names it.
        type: string
        required: true
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the merge job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends, for the job that calls
          this file. Empty for the nightly workflow and for ci.yaml's dispatch-references job,
          neither of which reports a check.
        type: string
        default: ""

env:
  # why: .github/ci-notes/dispatch-browser.md#why-goproxy-falls-through-to-direct
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # why: .github/ci-notes/dispatch-browser.md#why-the-binaries-job-builds-what-the-suite-runs
  binaries:
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/dispatch-browser.md#the-binaries-jobs-budget
    timeout-minutes: 10
    outputs:
      connections: ${{ steps.connections.outputs.connections }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # why: .github/ci-notes/dispatch-browser.md#why-the-binaries-job-restores-go-envoy-test
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-test-{0}-{1}-', runner.os, runner.arch) }}
      # why: .github/ci-notes/dispatch-browser.md#what-the-binaries-build-writes-and-why-it-is-static
      - name: Build the binaries the browser suite runs
        run: |
          mkdir -p "$RUNNER_TEMP/dispatch-e2e-bin"
          CGO_ENABLED=0 go build -ldflags='-s -w' -o "$RUNNER_TEMP/dispatch-e2e-bin/" ./cmd/dispatch ./cmd/dev-oidc-issuer ./internal/cipher/ciphertest/requestseed
          CGO_ENABLED=0 go build -ldflags='-s -w' -o "$RUNNER_TEMP/dispatch-e2e-bin/broker" ./cmd/cipherd
        working-directory: packages/envoy
      # The shard and alone jobs' containers have no Go, so e2e/harness-postgres.ts reads the
      # stacks' connection limit from this output (DISPATCH_E2E_PG_CONNECTIONS) instead.
      - name: Read the connections each stack's Postgres must allow
        id: connections
        run: |
          connections=$(go run ./internal/dispatch/store/cmd/connections)
          [[ "$connections" =~ ^[1-9][0-9]*$ ]] || { echo "::error::go run ./internal/dispatch/store/cmd/connections printed '$connections', not a positive whole number"; exit 1; }
          echo "connections=$connections" >> "$GITHUB_OUTPUT"
        working-directory: packages/envoy
      # why: .github/ci-notes/dispatch-browser.md#why-the-binaries-artifacts-name-holds-no-run-attempt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.job }}-binaries
          path: ${{ runner.temp }}/dispatch-e2e-bin
          if-no-files-found: error

  shard:
    needs: binaries
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/dispatch-browser.md#the-shard-job-its-stacks-and-its-container
    container:
      image: ghcr.io/cybermonklabs/legion/ci@sha256:e07980de09bccdbac284c19b9aa94032e90b9f9deb3edac565e3fb0945f2b230
      options: --user 1001 --ipc=host --init
    # why: .github/ci-notes/dispatch-browser.md#the-shard-jobs-shell-rule-its-measured-steps-and-its-budget
    # 1,080 + 120 + 120 + 565 = 1,885 s, 31 min 25 s, rounded up to the 32 minutes below.
    timeout-minutes: 32
    strategy:
      fail-fast: false
      # why: .github/ci-notes/dispatch-browser.md#why-the-leg-count-stands-in-two-places
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # why: .github/ci-notes/dispatch-browser.md#what-the-shard-job-downloads-in-place-of-a-go-build
      - id: binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: ${{ inputs.job }}-binaries
          path: packages/envoy/out/dispatch-e2e-binaries-1
      # why: .github/ci-notes/dispatch-browser.md#why-the-second-read-of-the-binaries-is-a-script
      - name: Download the binaries again, after a first attempt that did not complete
        if: steps.binaries.outcome != 'success'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/dispatch-browser-fetch-binaries.sh packages/envoy/out/dispatch-e2e-binaries-2 "${{ inputs.job }}"
      # why: .github/ci-notes/dispatch-browser.md#what-the-shard-job-places-and-what-its-budget-leaves-for-it
      - name: Place the binaries of the attempt that completed
        env:
          FIRST: ${{ steps.binaries.outcome }}
        run: |
          attempt=1
          [ "$FIRST" = success ] || attempt=2
          mkdir -p packages/envoy/out/dispatch-e2e-broker
          cp -R "packages/envoy/out/dispatch-e2e-binaries-$attempt/." packages/envoy/out/dispatch-e2e-broker/
      # why: .github/ci-notes/dispatch-browser.md#why-the-shard-job-makes-the-downloaded-binaries-executable
      - name: Make the downloaded binaries executable
        run: chmod +x packages/envoy/out/dispatch-e2e-broker/*
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # why: .github/ci-notes/dispatch-browser.md#why-every-job-that-runs-the-suite-builds-contracts-first
      - name: Build contracts for dispatch e2e
        run: bun run build:dispatch
        working-directory: packages/contracts
      # The build writes dist/THIRD_PARTY_NOTICES.txt, failing on a bundled package whose license
      # cannot be determined; the listing shows the build shipped it.
      - name: Build dispatch dashboard
        run: |
          bun run build:web
          ls -l web/dist/THIRD_PARTY_NOTICES.txt
        working-directory: packages/dispatch
      # why: .github/ci-notes/dispatch-browser.md#what-the-shard-jobs-postgresql-reading-records-and-why-it-is-a-script
      - name: Read the lanes' PostgreSQL and time its provider
        run: .github/scripts/dispatch-browser-postgres.sh 4
      # why: .github/ci-notes/dispatch-browser.md#the-file-store-the-shard-job-starts-and-the-flags-it-needs
      - name: Start an S3-compatible server for uploaded files
        run: |
          mkdir -p "$RUNNER_TEMP/weed"
          nohup weed server -s3 -dir="$RUNNER_TEMP/weed" -ip=127.0.0.1 -s3.port=18333 \
            -volume.max=0 -master.volumePreallocate -master.volumeSizeLimitMB=1024 \
            -master.raftHashicorp -master.raftBootstrap \
            > "$RUNNER_TEMP/weed.log" 2>&1 &
      - name: Wait for the S3-compatible server
        # why: .github/ci-notes/dispatch-browser.md#why-the-stores-readiness-wait-writes-reads-and-deletes-an-object
        run: .github/scripts/dispatch-browser-wait-for-store.sh
      - name: Browser-test dispatch dashboard (shard ${{ matrix.shard }} of 4)
        # why: .github/ci-notes/dispatch-browser.md#why-the-shard-job-calls-playwright-directly-and-what-its-browser-steps-budget-is
        # A hang guard, not a verdict: 534 s x 1.75 x 1.11 = 1,037 s -> 18 min. 534 s is the p90
        # of 347 legs of 2026-11-21/22 each rescaled to the balanced leg the time split gives
        # (1,698 s of row time; step = 24.0 s + 0.2549 x row time over 68 legs of main); 1.75 is
        # the slowest runner seen (run 44985914477 ran its rows 1.75 times slower, per-row median,
        # than a runner of the same minute); 1.11 is the worst share of the mean the heaviest leg
        # took under a row-time table up to 7 days old. A p90 leg on that runner under such a table
        # ends under it, so no row's verdict rests on it; it cuts a leg that has stopped running rows.
        timeout-minutes: 18
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/dispatch-browser-shard-suite.sh" "${{ matrix.shard }}" "${{ inputs.lane }}" \
            "${{ needs.binaries.outputs.connections }}"
        working-directory: packages/dispatch
        # why: .github/ci-notes/dispatch-browser.md#why-the-file-stores-address-is-set-on-the-step-and-not-in-the-environment
        env:
          DISPATCH_E2E_FILE_STORE_ENDPOINT: http://127.0.0.1:18333
          DISPATCH_E2E_FILE_STORE_BUCKET: dispatch-e2e-files
      # why: .github/ci-notes/dispatch-browser.md#why-the-shard-jobs-blob-upload-is-always-and-takes-one-directory
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.job }}-blob-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/leg-report
      # why: .github/ci-notes/dispatch-browser.md#what-the-shard-job-collects-after-a-run
      - name: What the run left behind
        if: always()
        run: .github/scripts/dispatch-browser-shard-record.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.job }}-record-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dispatch-e2e-record
      # why: .github/ci-notes/dispatch-browser.md#why-the-shard-job-uploads-the-failed-rows-traces-always
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.job }}-test-results-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: packages/dispatch/e2e/test-results
          if-no-files-found: ignore

  alone:
    needs: binaries
    if: inputs.lane == 'full'
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/dispatch-browser.md#the-alone-job-and-what-it-keeps-the-same-as-the-shard-job
    container:
      image: ghcr.io/cybermonklabs/legion/ci@sha256:e07980de09bccdbac284c19b9aa94032e90b9f9deb3edac565e3fb0945f2b230
      options: --user 1001 --ipc=host --init
    # why: .github/ci-notes/dispatch-browser.md#the-alone-jobs-measured-steps-and-its-budget
    # 180 + 120 + 120 + 442 = 862 s, 14 min 22 s, rounded up to the 15 minutes below.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-alone, firefox-alone, webkit-alone]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # why: .github/ci-notes/dispatch-browser.md#what-the-alone-job-downloads-in-place-of-a-go-build
      - id: binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: ${{ inputs.job }}-binaries
          path: packages/envoy/out/dispatch-e2e-binaries-1
      # why: .github/ci-notes/dispatch-browser.md#why-the-second-read-of-the-binaries-is-a-script
      - name: Download the binaries again, after a first attempt that did not complete
        if: steps.binaries.outcome != 'success'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/dispatch-browser-fetch-binaries.sh packages/envoy/out/dispatch-e2e-binaries-2 "${{ inputs.job }}"
      - name: Place the binaries of the attempt that completed
        env:
          FIRST: ${{ steps.binaries.outcome }}
        run: |
          attempt=1
          [ "$FIRST" = success ] || attempt=2
          mkdir -p packages/envoy/out/dispatch-e2e-broker
          cp -R "packages/envoy/out/dispatch-e2e-binaries-$attempt/." packages/envoy/out/dispatch-e2e-broker/
      # why: .github/ci-notes/dispatch-browser.md#why-the-alone-job-makes-the-downloaded-binaries-executable
      - name: Make the downloaded binaries executable
        run: chmod +x packages/envoy/out/dispatch-e2e-broker/*
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # why: .github/ci-notes/dispatch-browser.md#why-the-alone-job-builds-contracts
      - name: Build contracts for dispatch e2e
        run: bun run build:dispatch
        working-directory: packages/contracts
      # The build writes dist/THIRD_PARTY_NOTICES.txt, failing on a bundled package whose license
      # cannot be determined; the listing shows the build shipped it.
      - name: Build dispatch dashboard
        run: |
          bun run build:web
          ls -l web/dist/THIRD_PARTY_NOTICES.txt
        working-directory: packages/dispatch
      # why: .github/ci-notes/dispatch-browser.md#what-the-alone-jobs-postgresql-reading-records
      - name: Read the lanes' PostgreSQL and time its provider
        run: .github/scripts/dispatch-browser-postgres.sh 1
      - name: Browser-test dispatch dashboard (${{ matrix.project }})
        # why: .github/ci-notes/dispatch-browser.md#why-the-alone-job-runs-one-stack-and-no-file-store-and-what-its-browser-steps-budget-is
        # 141 x 1.15 = 162 s -> 3 min.
        timeout-minutes: 3
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/dispatch-browser-alone-suite.sh" "${{ matrix.project }}" \
            "${{ needs.binaries.outputs.connections }}"
        working-directory: packages/dispatch
      # why: .github/ci-notes/dispatch-browser.md#why-the-alone-jobs-blob-upload-is-always
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.job }}-blob-alone-${{ matrix.project }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/leg-report
      # why: .github/ci-notes/dispatch-browser.md#what-the-alone-job-collects-after-a-run
      - name: What the run left behind
        if: always()
        run: .github/scripts/dispatch-browser-alone-record.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.job }}-record-alone-${{ matrix.project }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dispatch-e2e-record
      # why: .github/ci-notes/dispatch-browser.md#why-the-alone-job-uploads-the-failed-rows-traces
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.job }}-test-results-alone-${{ matrix.project }}-${{ github.run_attempt }}
          path: packages/dispatch/e2e/test-results
          if-no-files-found: ignore

  # why: .github/ci-notes/dispatch-browser.md#what-the-two-process-job-runs
  multiprocess:
    if: inputs.lane == 'full'
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/dispatch-browser.md#the-two-process-jobs-measured-steps-and-its-budgets
    # 4 + 4 + 2 + 2 min plus 135 s and 120 s = 16 min 15 s -> 17 min.
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # why: .github/ci-notes/dispatch-browser.md#why-the-two-process-job-restores-go-envoy-test
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('go-envoy-test-{0}-{1}-', runner.os, runner.arch) || '' }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # why: .github/ci-notes/dispatch-browser.md#why-the-two-process-job-builds-contracts
      - name: Build contracts for dispatch e2e
        run: bun run build:dispatch
        working-directory: packages/contracts
      - name: Build the Dispatch server
        # why: .github/ci-notes/dispatch-browser.md#why-the-two-process-job-builds-the-dispatch-server-itself
        run: go build -o ./dispatch-e2e ./cmd/dispatch
        working-directory: packages/envoy
      - name: Install Playwright Chromium
        # why: .github/ci-notes/dispatch-browser.md#why-the-chromium-install-takes-no-apt-and-no-cache-and-what-its-budget-is
        timeout-minutes: 4
        run: bunx playwright install chromium
        working-directory: packages/dispatch
      - name: Pull the multiprocess stack's Postgres image
        # why: .github/ci-notes/dispatch-browser.md#why-the-two-process-job-pulls-its-stacks-postgres-image
        run: docker pull ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
      - name: Read the connections the multiprocess stack's Postgres must allow
        # why: .github/ci-notes/dispatch-browser.md#why-the-two-process-job-reads-its-stacks-connection-limit-in-a-step-of-its-own
        id: connections
        timeout-minutes: 2
        run: |
          connections=$(go run ./internal/dispatch/store/cmd/connections)
          [[ "$connections" =~ ^[1-9][0-9]*$ ]] || { echo "::error::go run ./internal/dispatch/store/cmd/connections printed '$connections', not a positive whole number"; exit 1; }
          echo "connections=$connections" >> "$GITHUB_OUTPUT"
        working-directory: packages/envoy
      - name: Browser-test dispatch dashboard against two server processes
        # why: .github/ci-notes/dispatch-browser.md#what-the-two-process-dashboard-step-runs-against
        # 202 s x 1.15 = 232 s -> 4 min.
        timeout-minutes: 4
        run: |
          export DISPATCH_E2E_PG_IMAGE=ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
          export DISPATCH_E2E_PG_CONNECTIONS=${{ steps.connections.outputs.connections }}
          export DISPATCH_E2E_PG_STALL_DIR="$RUNNER_TEMP/pg-stall"
          bun run e2e:multiprocess
        working-directory: packages/dispatch
      - name: Browser-test a sign-in across two server processes
        # why: .github/ci-notes/dispatch-browser.md#what-the-sign-in-row-across-two-processes-reads
        # 13 s x 1.15 = 15 s -> the two-minute floor.
        timeout-minutes: 2
        run: |
          export DISPATCH_E2E_PG_IMAGE=ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
          export DISPATCH_E2E_PG_CONNECTIONS=${{ steps.connections.outputs.connections }}
          DISPATCH_E2E_PROCESSES=2 DISPATCH_E2E_SIGNIN=oidc bunx playwright test --config e2e/playwright.config.ts
        working-directory: packages/dispatch
      # why: .github/ci-notes/dispatch-browser.md#why-the-two-process-jobs-upload-runs-on-failure-alone
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ${{ inputs.job }}-multiprocess-test-results-${{ github.run_attempt }}
          path: packages/dispatch/e2e/test-results

  # why: .github/ci-notes/dispatch-browser.md#the-embedder-job-the-lanes-it-runs-on-and-its-budgets
  # 4 + 4 + 12 + 2 min plus 135 s and 120 s = 26 min 15 s -> 27 min.
  embedder:
    if: inputs.lane == 'pull-request' || inputs.lane == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy, restored only, as the multiprocess job restores it and for the same reason:
      # run-server.sh builds the Dispatch server, which the family's saving jobs do not.
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('go-envoy-{0}-{1}-', runner.os, runner.arch) || '' }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Build contracts for dispatch e2e
        # why: .github/ci-notes/dispatch-browser.md#why-the-embedder-job-builds-contracts
        run: bun run build:dispatch
        working-directory: packages/contracts
      - name: Build the Dispatch server for the embedder lane
        # why: .github/ci-notes/dispatch-browser.md#why-the-embedder-jobs-server-build-carries-the-lane-in-its-name
        run: go build -o ./dispatch-e2e ./cmd/dispatch
        working-directory: packages/envoy
      - name: Install Playwright Chromium
        # Browsers only, no apt: .github/ci-notes/dispatch-browser.md#why-the-chromium-install-takes-no-apt-and-no-cache-and-what-its-budget-is
        # says why that list is not needed and what the 4 minutes are.
        timeout-minutes: 4
        run: bunx playwright install chromium
        working-directory: packages/dispatch
      - name: Pull the embedder stack's Postgres image
        # why: .github/ci-notes/dispatch-browser.md#why-the-two-process-job-pulls-its-stacks-postgres-image
        run: docker pull ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
      - name: Read the connections the embedder stack's Postgres must allow
        # why: .github/ci-notes/dispatch-browser.md#why-the-two-process-job-reads-its-stacks-connection-limit-in-a-step-of-its-own
        id: connections
        timeout-minutes: 2
        run: |
          connections=$(go run ./internal/dispatch/store/cmd/connections)
          [[ "$connections" =~ ^[1-9][0-9]*$ ]] || { echo "::error::go run ./internal/dispatch/store/cmd/connections printed '$connections', not a positive whole number"; exit 1; }
          echo "connections=$connections" >> "$GITHUB_OUTPUT"
        working-directory: packages/envoy
      - name: Browser-test the bar's two tiers against a counting embedder
        timeout-minutes: 4
        run: |
          export DISPATCH_E2E_PG_IMAGE=ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
          export DISPATCH_E2E_PG_CONNECTIONS=${{ steps.connections.outputs.connections }}
          bun run e2e:embedder
        working-directory: packages/dispatch
      - name: Browser-test the bar's answers against fake models
        # why: .github/ci-notes/dispatch-browser.md#what-the-embedder-jobs-models-step-runs-and-why-it-calls-playwright-directly
        # 9.9 min x 1.15 = 11.4 min -> 12 min.
        timeout-minutes: 12
        run: |
          export DISPATCH_E2E_PG_IMAGE=ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
          export DISPATCH_E2E_PG_CONNECTIONS=${{ steps.connections.outputs.connections }}
          DISPATCH_E2E_MODELS=fake bunx playwright test --config e2e/playwright.config.ts --project=chromium going-answer going-blocks
        working-directory: packages/dispatch
      # why: .github/ci-notes/dispatch-browser.md#why-the-embedder-jobs-upload-runs-on-failure-alone-and-serves-both-browser-steps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ${{ inputs.job }}-embedder-test-results-${{ github.run_attempt }}
          path: packages/dispatch/e2e/test-results

  # why: .github/ci-notes/dispatch-browser.md#the-visual-review-its-docker-run-and-its-budgets
  # 240 + 333 + 120 = 693 s -> 12 min.
  visual:
    if: inputs.lane == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # why: .github/ci-notes/dispatch-browser.md#why-the-visual-job-restores-go-envoy-test
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('go-envoy-test-{0}-{1}-', runner.os, runner.arch) || '' }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Build contracts for dispatch e2e
        # why: .github/ci-notes/dispatch-browser.md#why-the-visual-job-builds-contracts
        run: bun run build:dispatch
        working-directory: packages/contracts
      - name: Build dispatch dashboard
        run: |
          bun run build:web
          ls -l web/dist/THIRD_PARTY_NOTICES.txt
        working-directory: packages/dispatch
      # why: .github/ci-notes/dispatch-browser.md#why-the-visual-job-installs-no-browser
      - name: Pull the pinned Playwright copy
        # why: .github/ci-notes/dispatch-browser.md#why-the-visual-job-pulls-the-pinned-playwright-copy-first
        run: docker pull ghcr.io/cybermonklabs/legion/ci@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      - name: Pull the stack's Postgres image
        # why: .github/ci-notes/dispatch-browser.md#the-stacks-postgres-image-pulled-here-for-the-same-reason
        run: docker pull ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
      # The stack's connection limit, read outside the browser step's budget, where
      # e2e/harness-postgres.ts would otherwise compile it (DISPATCH_E2E_PG_CONNECTIONS).
      - name: Read the connections the visual stack's Postgres must allow
        id: connections
        run: |
          connections=$(go run ./internal/dispatch/store/cmd/connections)
          [[ "$connections" =~ ^[1-9][0-9]*$ ]] || { echo "::error::go run ./internal/dispatch/store/cmd/connections printed '$connections', not a positive whole number"; exit 1; }
          echo "connections=$connections" >> "$GITHUB_OUTPUT"
        working-directory: packages/envoy
      - name: Browser-test dispatch dashboard against its baselines
        # 188 x 1.15 = 216 s -> 4 min: the largest measured step, the command bar's rows inside it.
        timeout-minutes: 4
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/dispatch-browser-visual-suite.sh" "${{ steps.connections.outputs.connections }}"
        working-directory: packages/dispatch
      # why: .github/ci-notes/dispatch-browser.md#why-the-visual-jobs-upload-is-always
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.job }}-visual-${{ github.run_attempt }}
          # why: .github/ci-notes/dispatch-browser.md#why-the-visual-upload-keeps-a-pattern-that-matches-no-file
          path: |
            packages/dispatch/e2e/test-results
            packages/dispatch/e2e/__screenshots__
            ${{ runner.temp }}/dispatch-e2e-run-*/worker-*/log/*.log
          if-no-files-found: ignore

  # why: .github/ci-notes/dispatch-browser.md#what-the-merge-job-reports-and-why-it-is-never-skipped
  merge:
    # why: .github/ci-notes/dispatch-browser.md#why-the-merge-job-needs-the-binaries-job
    needs: [binaries, shard, alone, multiprocess, embedder, visual]
    if: ${{ !cancelled() }}
    # why: .github/ci-notes/dispatch-browser.md#why-the-merge-job-runs-on-arm64
    runs-on: ubuntu-24.04-arm
    # why: .github/ci-notes/dispatch-browser.md#the-merge-jobs-measured-steps-and-its-budget
    # 180 + 37 = 217 s, which is 3 min 37 s, so 4 min.
    timeout-minutes: 4
    env:
      JOB_TIMEOUT_MINUTES: 4 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # why: .github/ci-notes/dispatch-browser.md#why-every-legs-blob-report-is-downloaded-without-merge-multiple-and-the-two-layouts-it-lands-in
      - name: Download every leg's blob report
        id: download-blobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.job }}-blob-*
          path: ${{ runner.temp }}/blobs
      # why: .github/ci-notes/dispatch-browser.md#why-a-refused-blob-download-is-reported-as-a-refused-read
      - name: Report a refused blob download as a refused read
        if: failure() && steps.download-blobs.conclusion == 'failure'
        run: .github/scripts/dispatch-browser-run-reads.sh blobs-refused
      # why: .github/ci-notes/dispatch-browser.md#why-only-the-newest-attempt-of-each-leg-is-merged
      - name: Take the newest attempt of each leg's blob report
        id: select-blobs
        run: .github/scripts/dispatch-browser-latest-blobs.sh "$RUNNER_TEMP/blobs" "$RUNNER_TEMP/selected-blobs" "${{ inputs.job }}"
      - name: Merge the legs' blob reports into one report
        # why: .github/ci-notes/dispatch-browser.md#what-the-merged-reports-three-outputs-are-for
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/dispatch-browser-merge-reports.sh"
        working-directory: packages/dispatch
      - name: Upload the merged report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.job }}-report-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/report-html
            ${{ runner.temp }}/report.json
          if-no-files-found: ignore
      # why: .github/ci-notes/dispatch-browser.md#why-each-reading-goes-to-the-step-summary-and-to-the-log
      - name: Reading one, the rows
        if: always()
        # 120 + 4 x 1.15 = 124.6 s -> 3 min.
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_TIMEOUT_MINUTES: 3 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        run: .github/scripts/dispatch-browser-reading-rows.sh "${{ steps.download-blobs.conclusion }}" "${{ steps.select-blobs.conclusion }}" "${{ inputs.job }}"
      # Reading two. Read from the merged JSON report with jq, and nowhere else: a flake is a row
      # that failed and passed on its retry, which only the report of the whole run holds.
      - name: Reading two, the flake rate
        if: always()
        run: .github/scripts/dispatch-browser-reading-flake-rate.sh
      # why: .github/ci-notes/dispatch-browser.md#why-a-leg-that-exits-red-with-no-failed-row-is-named-apart
      - name: Reading three, the leg exits with no failed row
        if: always()
        run: .github/scripts/dispatch-browser-reading-leg-exits.sh
      # why: .github/ci-notes/dispatch-browser.md#what-reading-four-measures-and-which-rows-it-reads
      - name: Reading four, the row durations
        if: always()
        run: .github/scripts/dispatch-browser-reading-row-durations.sh
      # why: .github/ci-notes/dispatch-browser.md#what-the-verdict-step-fails-on
      - name: Fail when a leg failed or the merged report holds a failed row
        if: always()
        run: >-
          .github/scripts/dispatch-browser-verdict.sh "${{ needs.binaries.result }}"
          "${{ needs.shard.result }}" "${{ needs.alone.result }}"
          "${{ needs.multiprocess.result }}" "${{ needs.visual.result }}"
      # why: .github/ci-notes/dispatch-browser.md#when-the-merge-job-posts-ci-ok
      - name: Report ci-ok when this job decides a merge-group run
        if: always() && inputs.ci-ok-changes != ''
        uses: ./.github/actions/ci-ok-report
        with:
          job: ${{ inputs.job }}
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
