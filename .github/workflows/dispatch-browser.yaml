name: Dispatch browser suite

# why: .github/ci-notes/dispatch-browser.md#the-suite-its-two-lanes-and-the-budget-rule-every-job-follows
on:
  workflow_call:
    inputs:
      lane:
        description: >-
          Which projects run, and over which rows: `pull-request` for `chromium`, `iphone`
          and the two stubbed projects, held to the rows tagged `@pr`, or `full` for every
          project, the `-alone` ones and the two-process job among them, over every row. The shard job reads it for the projects it runs; no job reads it for a
          browser to install any more, since the image the shard and alone jobs run in carries
          all three engines. Any other value fails the shard job's browser step by name, before
          it starts a row.
        type: string
        required: true
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the merge job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends, for its dispatch-browser
          job. Empty for the nightly workflow, which reports no check.
        type: string
        default: ""

env:
  # why: .github/ci-notes/dispatch-browser.md#why-goproxy-falls-through-to-direct
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # why: .github/ci-notes/dispatch-browser.md#why-the-binaries-job-builds-what-the-suite-runs
  binaries:
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/dispatch-browser.md#the-binaries-jobs-budget
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # why: .github/ci-notes/dispatch-browser.md#why-the-binaries-job-restores-go-envoy-test
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-test-{0}-', runner.os) }}
      # why: .github/ci-notes/dispatch-browser.md#what-the-binaries-build-writes-and-why-it-is-static
      - name: Build the binaries the browser suite runs
        run: |
          mkdir -p "$RUNNER_TEMP/dispatch-e2e-bin"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/dispatch-e2e-bin/" ./cmd/dispatch ./cmd/broker ./cmd/dev-oidc-issuer ./internal/broker/brokertest/requestseed
        working-directory: packages/envoy
      # why: .github/ci-notes/dispatch-browser.md#why-the-binaries-artifacts-name-holds-no-run-attempt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dispatch-e2e-binaries
          path: ${{ runner.temp }}/dispatch-e2e-bin
          if-no-files-found: error

  shard:
    needs: binaries
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/dispatch-browser.md#the-shard-job-its-stacks-and-its-container
    container:
      image: ghcr.io/cybermonklabs/legion/ci@sha256:69c3a3164d28695253c43615af3f9bbc4f7e1994f4522ae68a41a0224b1ffdb5
      options: --user 1001 --ipc=host --init
    # why: .github/ci-notes/dispatch-browser.md#the-shard-jobs-shell-rule-its-measured-steps-and-its-budget
    # 540 + 219 = 759 s, 12 min 39 s, rounded up to the 13 minutes below. That is a backstop
    timeout-minutes: 13
    strategy:
      fail-fast: false
      # why: .github/ci-notes/dispatch-browser.md#why-the-leg-count-stands-in-two-places
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # why: .github/ci-notes/dispatch-browser.md#what-the-shard-job-downloads-in-place-of-a-go-build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dispatch-e2e-binaries
          path: packages/envoy/out/dispatch-e2e-broker
      # why: .github/ci-notes/dispatch-browser.md#why-the-shard-job-makes-the-downloaded-binaries-executable
      - name: Make the downloaded binaries executable
        run: chmod +x packages/envoy/out/dispatch-e2e-broker/*
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # why: .github/ci-notes/dispatch-browser.md#why-every-job-that-runs-the-suite-builds-contracts-first
      - name: Build contracts for dispatch e2e
        run: bun run build
        working-directory: packages/contracts
      # The build writes dist/THIRD_PARTY_NOTICES.txt, failing on a bundled package whose license
      # cannot be determined; the listing shows the build shipped it.
      - name: Build dispatch dashboard
        run: |
          bun run build:web
          ls -l web/dist/THIRD_PARTY_NOTICES.txt
        working-directory: packages/dispatch
      # why: .github/ci-notes/dispatch-browser.md#what-the-shard-jobs-postgresql-reading-records-and-why-it-is-a-script
      - name: Read the lanes' PostgreSQL and time its provider
        run: .github/scripts/dispatch-browser-postgres.sh 4
      # why: .github/ci-notes/dispatch-browser.md#the-file-store-the-shard-job-starts-and-the-flags-it-needs
      - name: Start an S3-compatible server for uploaded files
        run: |
          mkdir -p "$RUNNER_TEMP/weed"
          nohup weed server -s3 -dir="$RUNNER_TEMP/weed" -ip=127.0.0.1 -s3.port=18333 \
            -volume.max=0 -master.volumePreallocate -master.volumeSizeLimitMB=1024 \
            > "$RUNNER_TEMP/weed.log" 2>&1 &
      - name: Wait for the S3-compatible server
        # why: .github/ci-notes/dispatch-browser.md#why-the-stores-readiness-wait-writes-reads-and-deletes-an-object
        run: .github/scripts/dispatch-browser-wait-for-store.sh
      - name: Browser-test dispatch dashboard (shard ${{ matrix.shard }} of 4)
        # why: .github/ci-notes/dispatch-browser.md#why-the-shard-job-calls-playwright-directly-and-what-its-browser-steps-budget-is
        timeout-minutes: 9
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/dispatch-browser-shard-suite.sh" "${{ matrix.shard }}" "${{ inputs.lane }}"
        working-directory: packages/dispatch
        # why: .github/ci-notes/dispatch-browser.md#why-the-file-stores-address-is-set-on-the-step-and-not-in-the-environment
        env:
          DISPATCH_E2E_FILE_STORE_ENDPOINT: http://127.0.0.1:18333
          DISPATCH_E2E_FILE_STORE_BUCKET: dispatch-e2e-files
      # why: .github/ci-notes/dispatch-browser.md#why-the-shard-jobs-blob-upload-is-always-and-takes-one-directory
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dispatch-browser-blob-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/leg-report
      # why: .github/ci-notes/dispatch-browser.md#what-the-shard-job-collects-after-a-run
      - name: What the run left behind
        if: always()
        run: .github/scripts/dispatch-browser-shard-record.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dispatch-browser-record-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dispatch-e2e-record
      # why: .github/ci-notes/dispatch-browser.md#why-the-shard-job-uploads-the-failed-rows-traces-always
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dispatch-browser-test-results-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: packages/dispatch/e2e/test-results
          if-no-files-found: ignore

  alone:
    needs: binaries
    if: inputs.lane == 'full'
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/dispatch-browser.md#the-alone-job-and-what-it-keeps-the-same-as-the-shard-job
    container:
      image: ghcr.io/cybermonklabs/legion/ci@sha256:69c3a3164d28695253c43615af3f9bbc4f7e1994f4522ae68a41a0224b1ffdb5
      options: --user 1001 --ipc=host --init
    # why: .github/ci-notes/dispatch-browser.md#the-alone-jobs-measured-steps-and-its-budget
    # 180 + 137 = 317 s, 5 min 17 s, rounded up to the 6 minutes below. It is a backstop above
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-alone, firefox-alone, webkit-alone]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # why: .github/ci-notes/dispatch-browser.md#what-the-alone-job-downloads-in-place-of-a-go-build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dispatch-e2e-binaries
          path: packages/envoy/out/dispatch-e2e-broker
      # why: .github/ci-notes/dispatch-browser.md#why-the-alone-job-makes-the-downloaded-binaries-executable
      - name: Make the downloaded binaries executable
        run: chmod +x packages/envoy/out/dispatch-e2e-broker/*
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # why: .github/ci-notes/dispatch-browser.md#why-the-alone-job-builds-contracts
      - name: Build contracts for dispatch e2e
        run: bun run build
        working-directory: packages/contracts
      # The build writes dist/THIRD_PARTY_NOTICES.txt, failing on a bundled package whose license
      # cannot be determined; the listing shows the build shipped it.
      - name: Build dispatch dashboard
        run: |
          bun run build:web
          ls -l web/dist/THIRD_PARTY_NOTICES.txt
        working-directory: packages/dispatch
      # why: .github/ci-notes/dispatch-browser.md#what-the-alone-jobs-postgresql-reading-records
      - name: Read the lanes' PostgreSQL and time its provider
        run: .github/scripts/dispatch-browser-postgres.sh 1
      - name: Browser-test dispatch dashboard (${{ matrix.project }})
        # why: .github/ci-notes/dispatch-browser.md#why-the-alone-job-runs-one-stack-and-no-file-store-and-what-its-browser-steps-budget-is
        timeout-minutes: 3
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/dispatch-browser-alone-suite.sh" "${{ matrix.project }}"
        working-directory: packages/dispatch
      # why: .github/ci-notes/dispatch-browser.md#why-the-alone-jobs-blob-upload-is-always
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dispatch-browser-blob-alone-${{ matrix.project }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/leg-report
      # why: .github/ci-notes/dispatch-browser.md#what-the-alone-job-collects-after-a-run
      - name: What the run left behind
        if: always()
        run: .github/scripts/dispatch-browser-alone-record.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dispatch-browser-record-alone-${{ matrix.project }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dispatch-e2e-record
      # why: .github/ci-notes/dispatch-browser.md#why-the-alone-job-uploads-the-failed-rows-traces
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dispatch-browser-test-results-alone-${{ matrix.project }}-${{ github.run_attempt }}
          path: packages/dispatch/e2e/test-results
          if-no-files-found: ignore

  # why: .github/ci-notes/dispatch-browser.md#what-the-two-process-job-runs
  multiprocess:
    if: inputs.lane == 'full'
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/dispatch-browser.md#the-two-process-jobs-measured-steps-and-its-budgets
    # without one, rounded up: 4 + 4 + 2 min plus 135 s = 13 min. With budgets on the steps, the
    timeout-minutes: 13
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # why: .github/ci-notes/dispatch-browser.md#why-the-two-process-job-restores-go-envoy-test
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('go-envoy-test-{0}-', runner.os) || '' }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # why: .github/ci-notes/dispatch-browser.md#why-the-two-process-job-builds-contracts
      - name: Build contracts for dispatch e2e
        run: bun run build
        working-directory: packages/contracts
      - name: Build the Dispatch server
        # why: .github/ci-notes/dispatch-browser.md#why-the-two-process-job-builds-the-dispatch-server-itself
        run: go build -o ./dispatch-e2e ./cmd/dispatch
        working-directory: packages/envoy
      - name: Install Playwright Chromium
        # why: .github/ci-notes/dispatch-browser.md#why-the-chromium-install-takes-no-apt-and-no-cache-and-what-its-budget-is
        timeout-minutes: 4
        run: bunx playwright install chromium
        working-directory: packages/dispatch
      - name: Browser-test dispatch dashboard against two server processes
        # Builds the dashboard twice (A's and B's, with distinct build ids) and runs the
        # multiprocess specs through the round-robin proxy.
        timeout-minutes: 4
        run: bun run e2e:multiprocess
        working-directory: packages/dispatch
      - name: Browser-test a sign-in across two server processes
        # why: .github/ci-notes/dispatch-browser.md#what-the-sign-in-row-across-two-processes-reads
        timeout-minutes: 2
        run: DISPATCH_E2E_PROCESSES=2 DISPATCH_E2E_SIGNIN=oidc bunx playwright test --config e2e/playwright.config.ts
        working-directory: packages/dispatch
      # why: .github/ci-notes/dispatch-browser.md#why-the-two-process-jobs-upload-runs-on-failure-alone
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: dispatch-browser-multiprocess-test-results-${{ github.run_attempt }}
          path: packages/dispatch/e2e/test-results

  # why: .github/ci-notes/dispatch-browser.md#the-embedder-job-the-lanes-it-runs-on-and-its-budgets
  # rounded up: 4 + 4 min plus 135 s = 11 min. The first runs replace these with readings of
  embedder:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # go-envoy, restored only, as the multiprocess job restores it and for the same reason:
      # run-server.sh builds the Dispatch server, which the family's saving jobs do not.
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('go-envoy-{0}-', runner.os) || '' }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Build contracts for dispatch e2e
        # The e2e helpers the specs import read some of contracts' values from its built dist/,
        # through Playwright's own Node resolution (the shard job's step of the same name).
        run: bun run build
        working-directory: packages/contracts
      - name: Build the Dispatch server for the embedder lane
        # why: .github/ci-notes/dispatch-browser.md#why-the-embedder-jobs-server-build-carries-the-lane-in-its-name
        run: go build -o ./dispatch-e2e ./cmd/dispatch
        working-directory: packages/envoy
      - name: Install Playwright Chromium
        # Browsers only, no apt: the multiprocess job's step of this name says why that list is
        # not needed and what the 4 minutes are.
        timeout-minutes: 4
        run: bunx playwright install chromium
        working-directory: packages/dispatch
      - name: Browser-test the bar's two tiers against a counting embedder
        timeout-minutes: 4
        run: bun run e2e:embedder
        working-directory: packages/dispatch
      # `if: failure()`, as the multiprocess job's upload is: the chromium project retries a
      # failed row, but a row that fails after its retries fails this job and this upload runs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: dispatch-browser-embedder-test-results-${{ github.run_attempt }}
          path: packages/dispatch/e2e/test-results

  # why: .github/ci-notes/dispatch-browser.md#the-visual-review-its-docker-run-and-its-budgets
  # without one, which is 314 s of the five columns together: 494 s -> 9 min.
  visual:
    if: inputs.lane == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # why: .github/ci-notes/dispatch-browser.md#why-the-visual-job-restores-go-envoy-test
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('go-envoy-test-{0}-', runner.os) || '' }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Build contracts for dispatch e2e
        # why: .github/ci-notes/dispatch-browser.md#why-the-visual-job-builds-contracts
        run: bun run build
        working-directory: packages/contracts
      - name: Build dispatch dashboard
        run: |
          bun run build:web
          ls -l web/dist/THIRD_PARTY_NOTICES.txt
        working-directory: packages/dispatch
      # why: .github/ci-notes/dispatch-browser.md#why-the-visual-job-installs-no-browser
      - name: Pull the pinned Playwright copy
        # why: .github/ci-notes/dispatch-browser.md#why-the-visual-job-pulls-the-pinned-playwright-copy-first
        run: docker pull ghcr.io/cybermonklabs/legion/ci@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      - name: Browser-test dispatch dashboard against its baselines
        timeout-minutes: 3
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/dispatch-browser-visual-suite.sh"
        working-directory: packages/dispatch
      # why: .github/ci-notes/dispatch-browser.md#why-the-visual-jobs-upload-is-always
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dispatch-browser-visual-${{ github.run_attempt }}
          # why: .github/ci-notes/dispatch-browser.md#why-the-visual-upload-keeps-a-pattern-that-matches-no-file
          path: |
            packages/dispatch/e2e/test-results
            packages/dispatch/e2e/__screenshots__
            ${{ runner.temp }}/dispatch-e2e-run-*/worker-*/log/*.log
          if-no-files-found: ignore

  # why: .github/ci-notes/dispatch-browser.md#what-the-merge-job-reports-and-why-it-is-never-skipped
  merge:
    # why: .github/ci-notes/dispatch-browser.md#why-the-merge-job-needs-the-binaries-job
    needs: [binaries, shard, alone, multiprocess, embedder, visual]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # why: .github/ci-notes/dispatch-browser.md#the-merge-jobs-measured-steps-and-its-budget
    # one-command steps measure. 180 + 37 = 217 s, which is 3 min 37 s, so 4 min. The job's
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # why: .github/ci-notes/dispatch-browser.md#why-every-legs-blob-report-is-downloaded-into-a-directory-of-its-own
      - name: Download every leg's blob report
        id: download-blobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dispatch-browser-blob-*
          path: ${{ runner.temp }}/blobs
      # why: .github/ci-notes/dispatch-browser.md#why-a-refused-blob-download-is-reported-as-a-refused-read
      - name: Report a refused blob download as a refused read
        if: failure() && steps.download-blobs.conclusion == 'failure'
        run: .github/scripts/dispatch-browser-run-reads.sh blobs-refused
      # why: .github/ci-notes/dispatch-browser.md#why-only-the-newest-attempt-of-each-leg-is-merged
      - name: Take the newest attempt of each leg's blob report
        run: .github/scripts/dispatch-browser-latest-blobs.sh "$RUNNER_TEMP/blobs" "$RUNNER_TEMP/selected-blobs"
      - name: Merge the legs' blob reports into one report
        # why: .github/ci-notes/dispatch-browser.md#what-the-merged-reports-three-outputs-are-for
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/dispatch-browser-merge-reports.sh"
        working-directory: packages/dispatch
      - name: Upload the merged report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dispatch-browser-report-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/report-html
            ${{ runner.temp }}/report.json
          if-no-files-found: ignore
      # why: .github/ci-notes/dispatch-browser.md#why-each-reading-goes-to-the-step-summary-and-to-the-log
      - name: Reading one, the rows
        if: always()
        timeout-minutes: 3
        run: .github/scripts/dispatch-browser-reading-rows.sh "${{ steps.download-blobs.conclusion }}" "${{ github.token }}"
      # Reading two. Read from the merged JSON report with jq, and nowhere else: a flake is a row
      # that failed and passed on its retry, which only the report of the whole run holds.
      - name: Reading two, the flake rate
        if: always()
        run: .github/scripts/dispatch-browser-reading-flake-rate.sh
      # why: .github/ci-notes/dispatch-browser.md#why-a-leg-that-exits-red-with-no-failed-row-is-named-apart
      - name: Reading three, the leg exits with no failed row
        if: always()
        run: .github/scripts/dispatch-browser-reading-leg-exits.sh
      # why: .github/ci-notes/dispatch-browser.md#what-reading-four-measures-and-which-rows-it-reads
      - name: Reading four, the row durations
        if: always()
        run: .github/scripts/dispatch-browser-reading-row-durations.sh
      # why: .github/ci-notes/dispatch-browser.md#what-the-verdict-step-fails-on
      - name: Fail when a leg failed or the merged report holds a failed row
        if: always()
        run: >-
          .github/scripts/dispatch-browser-verdict.sh "${{ needs.binaries.result }}"
          "${{ needs.shard.result }}" "${{ needs.alone.result }}"
          "${{ needs.multiprocess.result }}" "${{ needs.visual.result }}"
      # why: .github/ci-notes/dispatch-browser.md#when-the-merge-job-posts-ci-ok
      - name: Report ci-ok when this job decides a merge-group run
        if: always() && inputs.ci-ok-changes != ''
        uses: ./.github/actions/ci-ok-report
        with:
          job: dispatch-browser
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
