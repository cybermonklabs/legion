name: CodeQL

# CodeQL code scanning, as GitHub's starter workflow for advanced setup writes it
# (actions/starter-workflows, code-scanning/codeql.yml): a pull request to main, a push to main
# and one scheduled run a week. The repository is public, so GitHub charges nothing for it.
#
# GitHub's default setup for code scanning is off for this repository since 2026-11-05, so this
# workflow is the repository's code scanning: every analysis below uploads its results, and the
# alerts of `main` are what the push run writes. While default setup was still on, each analysis
# ran and then failed to upload, because GitHub refuses results from an advanced configuration
# while default setup owns a repository's code scanning. That is history: a red check here now is
# an ordinary failure, read in its own log.
#
# What is analysed, and why those languages (counted over the tracked tree):
#   * go - 2,658 .go files in the two modules go.work binds, packages/daemon and packages/envoy;
#   * javascript-typescript - 1,068 .ts, 304 .tsx and 4 .js files under packages/, docs/site and
#     scripts/; CodeQL analyses both languages under this one name;
#   * python - 8 .py files: the CI checks' engine (.github/scripts/ci_filter_coverage.py,
#     ci_job_reads.py, ci_images.py, workflow_paths.py), two e2e helpers under scripts/e2e/lib and
#     two media scripts under docs/site/media. Few, but each one runs in CI or in a release path;
#   * actions - every workflow under .github/workflows and the 11 composite `action.yml` files,
#     which run with this repository's tokens.
# The repository's shell scripts (179 .sh) and SQL migrations (403 .sql) have no CodeQL language,
# so no analysis here covers them. The four are analysed in two jobs, go in one and the other three
# in the other (the jobs' comment says why, and how each language's results still land in a
# configuration of their own).
#
# Every pull request starts an analysis, documentation-only ones included, and that is why this
# trigger carries no `paths-ignore`. The code-scanning rule on the ruleset of `main` holds a pull
# request until CodeQL has reported on it, so a pull request the workflow skipped was held for an
# analysis that never came: measured on 2026-11-09, a scratch pull request changing one Markdown
# file was blocked with no CodeQL check run at all, while the same rule let through a pull
# request that changed a file carrying an open alert. The cost is one run for each
# documentation-only change, 4 to 9 minutes as measured on 2026-11-08. The `push` and `schedule`
# triggers below carry no such list either, so `main`'s own alerts are unaffected.
#
# No `merge_group` trigger, though GitHub's documentation adds one. A pull request that adds a
# high-severity finding is held by GitHub's own code-scanning rule on the ruleset of `main`
# (Settings, then Rules, then Rulesets), which reads the alerts of the pull request's own
# analysis; that rule is no status check of this workflow, so nothing here has to report on a
# queued group, and a scan of the group would analyse the same code a second time. The trigger is
# reserved in any case: .github/scripts/ci_workflow_rules.py's check_one_merge_group_workflow
# allows it on ci.yaml alone, because a POSTed ci-ok joins the first check suite at that commit
# and a second merge-group workflow can take that suite.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, off the hour: a cron on the hour queues behind everyone else's.
    - cron: '17 4 * * 2'

# A newer push to a pull request cancels its older analysis, waiting or running, as ci.yaml's
# group does and for the same reason: the older head's alerts answer for code the pull request no
# longer has. On push and on the schedule the key is the ref, refs/heads/main, with the default
# queue and no cancellation: the running analysis finishes, one run waits, and a newer push
# replaces the waiting one, so main's alerts end at its newest commit.
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job declares every scope it needs in a block of its own; nothing runs under this default.
permissions: {}

jobs:
  # Two jobs, side by side: go in one, and the three languages that build nothing in the other.
  # Every CodeQL job pays the action's own REST requests to this repository's GITHUB_TOKEN budget
  # whatever it analyses (feature flags, the run and its workflow, repository properties, the
  # Actions caches, the pull request's diff, and a status report from each step), so the languages
  # share as few jobs as give the shortest wall. Two jobs give it, for two reasons:
  #   * go is the longest analysis by far, and a job of its own starts it with the run;
  #   * a job that holds go, javascript-typescript or python with no `actions` uses CodeQL's
  #     overlay analysis, and a job that holds `actions` does not. The action disables overlay
  #     for a job when any of its languages lacks it (codeql-action src/config-utils.ts,
  #     checkOverlayAnalysisFeatureEnabled), and `actions` has none. So go's job builds an
  #     overlay-base database on main and caches it, and a pull request's go analysis restores
  #     it and extracts only the files the pull request changes. The other job is analysed as
  #     the one job was: a full database, a TRAP cache for actions and javascript.
  # Each language's results go up as an analysis of their own: analyze writes one SARIF file per
  # language and uploads none, and an upload-sarif step per language sends that file with the
  # category and the matrix value the language's own job sent before the languages shared a job,
  # so main's alerts stay in the four configurations they are in.
  analyze-go:
    name: Analyze (go)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    # The starter workflow's least permissions: security-events: write uploads the results,
    # packages: read fetches CodeQL packs, actions: read and contents: read let the action read
    # this run, the Actions caches and the checkout.
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before init, as the starter workflow's comment says setup steps go: go.work asks for a Go
      # the runner image does not carry, and the autobuild step builds both modules of the
      # workspace with whatever `go` is on the PATH. cache: false, as in every other Go job here.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # No build-mode, as before go had a job of its own: the autobuild step builds go, and the
      # action allows overlay analysis for go with any build mode.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go
      - name: Build the Go modules for CodeQL
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        # It writes go.sarif to its default output, ../results, and sends nothing.
        with:
          upload: never
      # wait-for-processing: false, because the wait is a poll of the SARIF's status on this
      # repository's token, and the code-scanning rule of main's ruleset already waits for the
      # processed results before a pull request can merge.
      - name: Upload the go results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ../results/go.sarif
          category: /language:go
          matrix: ${{ toJSON(fromJSON('{"language":"go","build-mode":"autobuild"}')) }}
          wait-for-processing: false

  analyze:
    name: Analyze (actions, javascript-typescript, python)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    # As analyze-go's.
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build-mode: the three are extracted from source at analyze time, as `none` extracts
      # them.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions, javascript-typescript, python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        # It writes one SARIF file a language to its default output, ../results, and sends none.
        with:
          upload: never
      # One upload a language, as analyze-go's, with the category and matrix value of that
      # language. The file names are CodeQL's language names. A failed upload stops the uploads
      # after it in this job, and leaves go's job unaffected.
      - name: Upload the actions results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ../results/actions.sarif
          category: /language:actions
          matrix: ${{ toJSON(fromJSON('{"language":"actions","build-mode":"none"}')) }}
          wait-for-processing: false
      - name: Upload the javascript-typescript results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ../results/javascript.sarif
          category: /language:javascript-typescript
          matrix: ${{ toJSON(fromJSON('{"language":"javascript-typescript","build-mode":"none"}')) }}
          wait-for-processing: false
      - name: Upload the python results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ../results/python.sarif
          category: /language:python
          matrix: ${{ toJSON(fromJSON('{"language":"python","build-mode":"none"}')) }}
          wait-for-processing: false

  # On main (a push, or the weekly run), analyze-go saves a new overlay-base database to the
  # Actions cache under a key that names its commit and run, and the action deletes none: a pull
  # request restores the newest one only. This job deletes every older one but the newest two, so
  # go's databases hold two cache entries, not one for each analysis of main; the second is kept
  # for a pull request that started restoring it before the newest was saved.
  prune-overlay-bases:
    name: Prune go's older overlay-base databases
    if: github.event_name != 'pull_request'
    needs: analyze-go
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    # actions: write deletes Actions cache entries; nothing is checked out.
    permissions:
      actions: write
    steps:
      - name: Delete all but the newest two overlay-base databases of each key prefix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # The key is <prefix><commit>-<run id>-<run attempt>; the prefix names the job and the
          # CodeQL version, so each version keeps its own newest two.
          gh api "repos/${REPO}/actions/caches?key=codeql-overlay-base-database-&ref=${REF}&sort=created_at&direction=desc&per_page=100" \
            --jq '[.actions_caches[] | {id, key, created_at, prefix: (.key | sub("[0-9a-f]{40}-[0-9]+-[0-9]+$"; ""))}]
                  | group_by(.prefix)[] | sort_by(.created_at) | reverse | .[2:][] | "\(.id) \(.key)"' |
            while read -r id key; do
              echo "Deleting ${key}"
              gh api -X DELETE "repos/${REPO}/actions/caches/${id}" --silent
            done
