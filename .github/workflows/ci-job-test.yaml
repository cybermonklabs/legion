name: CI job test

# The steps of ci.yaml's `test` and `tooling-checks` jobs, in a file of their own.
# ci.yaml's job of each id calls this file and passes its own id as `job`, and the job of this
# file named for it runs while the other is skipped. Each caller keeps `needs: changes` and the
# whole `if:` that decides whether its job runs, so the `if:` here only picks which of the two
# that is. The two share a file because ci.yaml already calls as many reusable workflows as
# .github/scripts/check-workflow-files.sh allows it
# (.github/ci-notes/ci.md#two-jobs-that-call-one-file).
#
# The split is for the filters. Each job's filter names this file beside ci.yaml, so a change to
# these steps selects these two jobs alone, where a change to ci.yaml selects every job.
#
# The two are the halves of what was one job, and each runs every one of its steps wherever it
# runs: no step of either reads the event or a label. tooling-checks builds and checks this
# repository's own tooling: the Claude Code plugin build and its build-input list, the changelog
# fold, the guides' layout, and the lint and typecheck of the script directories that are no
# workspace. Those are build, lint and typecheck checks, which run on a pull request whatever
# their time. test runs the tests: the `*.test.sh` harness of each script under .github/scripts
# (and of scripts/priorities-seed-check.sh), the Bun suites of scripts/ and the live proofs'
# libraries. Its `test` output is held back on a pull request without the label full-ci or
# lane:test, so it runs in the merge queue
# (.github/ci-notes/ci.md#which-lane-a-job-runs-in-the-pull-request-or-the-merge-queue).
#
# The daemon's Go tests, which the test job used to carry, are
# .github/workflows/ci-job-daemon-go.yaml's; the session message-wait suite, the one step here
# that needed a database, is .github/workflows/ci-job-sessions-script.yaml's, and no step of
# either job needs one now; and check-private-names-port.test.sh, the one harness here that built
# a binary of this head - so the only one whose reads were a whole Go closure on the test filter -
# is .github/workflows/ci-job-private-names-port.yaml's.
#
# Each harness step of the test job runs behind an input of its own, which ci.yaml's test job
# fills from the `changes` output of the same name, whose filter is that harness and the script
# it tests: so a change to one script runs one harness instead of all of them. A step of a called
# workflow cannot read `needs.changes.outputs.<name>` - inside a reusable workflow the only
# context carrying a caller's value is `inputs` - which is why each of these is an input here and
# `.github/scripts/check-ci-filters.sh` resolves it through the caller's `with:`. tooling-checks'
# guides step reads guide_layout the same way. Only the job that reads an input is passed it, so
# none of them is required.
#
# ci.yaml keeps both jobs running when `changes` did not succeed, "so this buys signal", and an
# input it fills from that job is empty then. So each gated step reads `changes-result` too and
# runs whenever `changes` failed, which is what the job did before the gates were written; lint
# spells the same term for its own two steps. A gated step added here takes both halves.
#
# Each job's last step reports ci-ok for its caller: on a merge-group run the job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      job:
        description: >-
          The id of ci.yaml's job that calls this file, `test` or `tooling-checks`: the job of
          this file of that id runs, and the other is skipped.
        type: string
        required: true
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true
      changes-result:
        description: >-
          ci.yaml's `needs.changes.result`: every gated step below runs when `changes` did not
          succeed, as they did before the job's `if:` gated them one by one, and as lint's two
          notices steps do.
        type: string
        required: true
      guide_layout:
        description: >-
          ci.yaml's `needs.changes.outputs.guide_layout`, which tooling-checks passes: its
          guides' layout step runs when that filter matched.
        type: string
        required: false
      release_push_test:
        description: "ci.yaml's needs.changes.outputs.release_push_test: release-push.test.sh and what it tests."
        type: string
        required: false
      release_bump_test:
        description: "ci.yaml's needs.changes.outputs.release_bump_test: release-bump.test.sh and what it tests."
        type: string
        required: false
      check_bun_version_test:
        description: "ci.yaml's needs.changes.outputs.check_bun_version_test: check-bun-version.test.sh and what it tests."
        type: string
        required: false
      check_playwright_version_test:
        description: >-
          ci.yaml's needs.changes.outputs.check_playwright_version_test:
          check-playwright-version.test.sh and what it tests.
        type: string
        required: false
      check_bun_workspace_manifests_test:
