        type: string
        required: true
      check_gitleaks_version_test:
        description: >-
          ci.yaml's needs.changes.outputs.check_gitleaks_version_test:
          check-gitleaks-version.test.sh and what it tests.
        type: string
        required: true
      workflow_paths_test:
