name: CI job test

# The steps of `.github/workflows/ci.yaml#test` and `.github/workflows/ci.yaml#tooling-checks` jobs, in a file of their own.
# ci.yaml's job of each id calls this file and passes its own id as `job`, and the job of this
# file named for it runs while the other is skipped. Each caller keeps `needs: changes` and the
# whole `if:` that decides whether its job runs, so the `if:` here only picks which of the two
# that is. The two share a file because ci.yaml already calls as many reusable workflows as
# .github/scripts/check-workflow-files.sh allows it
# (.github/ci-notes/ci.md#two-jobs-that-call-one-file).
#
# The split is for the filters. Each job's filter names this file beside ci.yaml, so a change to
# these steps selects these two jobs alone, where a change to ci.yaml selects every job.
#
# The two are the halves of what was one job, and no step of either reads the event or a label:
# each step runs wherever its job runs, but those gated on their own filter below.
# tooling-checks builds and checks this repository's own tooling: the Claude Code plugin build and
# its build-input list, the changelog fold, the guides' layout, and the lint and typecheck of the
# script directories that are no workspace. Those are build, lint and typecheck checks, which run
# on a pull request whatever their time. test runs the tests: the `*.test.sh` harness of each
# script under .github/scripts (and of scripts/daemon-contract-order.sh), the Bun suites of
# scripts/ and the live proofs' libraries. Its `test` output is held back on a pull request without
# the label full-ci or lane:test, so it runs in the merge queue
# (.github/ci-notes/ci.md#which-lane-a-job-runs-in-the-pull-request-or-the-merge-queue).
#
# The daemon's Go tests, which the test job used to carry, are
# .github/workflows/ci-job-daemon-go.yaml's; the session message-wait suite, the one step here
# that needed a database, is .github/workflows/ci-job-sessions-script.yaml's, and no step of
# either job needs one now; and check-private-names-port.test.sh, the one harness here that built
# a binary of this head - so the only one whose reads were a whole Go closure on the test filter -
# is .github/workflows/ci-job-private-names-port.yaml's.
#
# Each harness step of the test job, and tooling-checks' guides step, runs behind a filter of its
# own, which names that harness and the script it tests: so a change to one script runs one
# harness instead of all of them. A step of a called workflow cannot read
# `needs.changes.outputs.<name>` - inside a reusable workflow the only context carrying a caller's
# value is `inputs` - so each calling job of ci.yaml hands this file one input,
# `matched-filters`: the paths filter's own list of the filters that matched, or `all` on a run
# that selects every job (a dispatch of main, or one given every-job) and on one whose filters fell
# open. Each gated step reads its own filter out of it,
# `inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"<filter>"')`, the quotes
# matching one whole name of the list, and `.github/scripts/check-ci-filters.sh` resolves that
# through the caller's `with:` and holds the step to that shape (its rule 23). A gate added here
# costs ci.yaml nothing (.github/ci-notes/ci.md#one-list-for-the-test-jobs-step-gates).
#
# ci.yaml keeps both jobs running when `changes` did not succeed, "so this buys signal", and the
# list is empty then. So each gated step reads `changes-result` too and runs whenever `changes`
# failed, which is what the job did before the gates were written; lint spells the same term for
# its own two steps. A gated step added here takes all three terms.
#
# Each job's last step reports ci-ok for its caller: on a merge-group run the job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      job:
        description: >-
          The id of ci.yaml's job that calls this file, `test` or `tooling-checks`: the job of
          this file of that id runs, and the other is skipped.
        type: string
        required: true
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true
      changes-result:
        description: >-
          `.github/workflows/ci.yaml#needs.changes.result`: every gated step below runs when `changes` did not
          succeed, as they did before the job's `if:` gated them one by one, and as lint's two
          notices steps do.
        type: string
        required: true
      matched-filters:
        description: >-
          `.github/workflows/ci.yaml#needs.changes.outputs.matched_filters`: the paths filter's list of the filters
          that matched, as JSON (`["test","release_push_test"]`), or `all` on a run that selects
          every job (a dispatch of main, or one given every-job) and on one whose filters fell open.
          Each gated step below runs when its own filter is in it.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  test:
    if: inputs.job == 'test'
    runs-on: ubuntu-24.04-arm
    # No step here carries a -timeout of its own any more: the two go test steps that did, and
    # the Stage 1 proof beside them, are .github/workflows/ci-job-daemon-go.yaml's now. What is
    # left is the Bun install, the shell-script harnesses and a handful of Bun suites, the Claude
    # Code plugin build and the lint and typecheck steps having gone to tooling-checks below -
    # less than the 325 s of setup dispatch://INFRA-1052 measured before the plain Go step
    # started, less the tool installs that went with those steps. Thirty minutes is about six
    # times that, which leaves a slow runner room and still fails a hung harness inside the hour.
    timeout-minutes: 30
    env:
      JOB_TIMEOUT_MINUTES: 30 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # release-push.test.sh renders its fold-notes cases with the real changie; where changie is
      # absent, as on a developer's machine, those cases print a SKIP line and count nothing.
      - uses: ./.github/actions/install-changie

      # The three harnesses that stay steps of their own, run before the pool below queues any.
      # gh-read.test.sh's last case reads this job's own Runner.Worker among its parents, which a
      # pooled harness, whose parent is the pool's recorder, does not have; it and
      # dispatch-browser-run-reads.test.sh judge waits of a few seconds against the real clock
      # (gh-read.test.sh's 10 s window and 5 s after a reset, the run reads' 15-21 s sleep for a
      # reset 20 s ahead), which pooled harnesses on every core beside them could push past; and
      # harness-pool.test.sh tests the pool itself, so its verdict does not go through the pool,
      # and the pool is tested before the job relies on it.
      # gh-read.sh's wait for a spent API budget, with the real gh against a local stand-in
      # GitHub; its last case reads this job's own Runner.Worker, which only a runner has.
      - name: Test the wait for a spent API budget and the retry ladder (a stand-in GitHub)
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"gh_read_test"')
        run: .github/scripts/gh-read.test.sh

      # The merge job's two reads of its own run, driven under a stand-in gh: the attempt route
      # the jobs read takes, the retry ladder's attempts and the waits between them, and the two
      # refusal messages are checked here rather than on a runner against GitHub. Its negative
      # control traces the drive with strace, which this job's ubuntu-24.04-arm image carries; the
      # harness refuses by name on an image without it.
      - name: Test the browser lane's run reads
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"dispatch_browser_run_reads_test"')
        run: .github/scripts/dispatch-browser-run-reads.test.sh

      - name: Test the harness pool
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"harness_pool_test"')
        run: .github/scripts/harness-pool.test.sh

      # The script harnesses from here on, each a bash script of fakes that mostly waits on its
      # fakes' answers, polls and deadlines rather than computing: as one step after another they
      # were 366 s of this job's 638 s median (n=416 green pull-request jobs, 2026-11-22, when the
      # job held the plugin build, lints and typechecks tooling-checks holds now) while the
      # runner's other cores idled. Each step keeps its name and its gate and hands its harness
      # to .github/scripts/harness-pool.sh, which queues it and returns; the harnesses run beside
      # each other, no more at once than the runner has cores, and beside the Bun steps after
      # them, and "Wait for the script harnesses and judge them",
      # the job's last step but the ci-ok report, is their verdict and prints each one's log. A
      # harness that needs an earlier step is queued after it: release-push.test.sh after
      # install-changie, disk_watch.test.sh after the user-namespace sysctl, check-ci-filters.test.sh,
      # go-cache-working-set.test.sh and go-legs.test.sh after setup-go.
      - name: Test release scripts
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"release_push_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/release-push.test.sh .github/scripts/release-push.test.sh

      - name: Test the release version bump
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"release_bump_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/release-bump.test.sh .github/scripts/release-bump.test.sh

      - name: Test third-party notices
        run: bun test scripts/third-party-notices.test.ts

      - name: Test the semantic line-break checker
        run: bun test scripts/semantic-line-breaks.test.ts

      - name: Test the Bun pin check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_bun_version_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-bun-version.test.sh .github/scripts/check-bun-version.test.sh

      - name: Test the Playwright version check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_playwright_version_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-playwright-version.test.sh .github/scripts/check-playwright-version.test.sh

      - name: Test the frozen Bun workspace manifest check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_bun_workspace_manifests_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-bun-workspace-manifests.test.sh .github/scripts/check-bun-workspace-manifests.test.sh

      - name: Test the zod version check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_zod_version_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-zod-version.test.sh .github/scripts/check-zod-version.test.sh

      - name: Test the gh version check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_gh_version_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-gh-version.test.sh .github/scripts/check-gh-version.test.sh

      - name: Test the gitleaks version check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_gitleaks_version_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-gitleaks-version.test.sh .github/scripts/check-gitleaks-version.test.sh

      - name: Test the workflow path model the path checks import
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"workflow_paths_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/workflow_paths.test.sh .github/scripts/workflow_paths.test.sh

      - name: Test the image trigger path check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_image_trigger_paths_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-image-trigger-paths.test.sh .github/scripts/check-image-trigger-paths.test.sh

      - name: Test the CI image check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_ci_images_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-ci-images.test.sh .github/scripts/check-ci-images.test.sh

      - name: Test the CI image mirror
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"mirror_ci_images_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/mirror-ci-images.test.sh .github/scripts/mirror-ci-images.test.sh

      # The tool scripts, in the order they depend on each other: the fetch helper every
      # install goes through, the filler that puts the bytes in the copy that helper reads, the
      # gate that holds every row to its pin, and the rig that drives that helper against a
      # fault in the tool-fallback job.
      - name: Test the tool fetch helper
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"ci_tools_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/ci-tools.test.sh .github/scripts/ci-tools.test.sh

      - name: Test the tool copy filler
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"mirror_ci_tools_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/mirror-ci-tools.test.sh .github/scripts/mirror-ci-tools.test.sh

      - name: Test the tool manifest check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_ci_tools_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-ci-tools.test.sh .github/scripts/check-ci-tools.test.sh

      - name: Test the tool fallback rig
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"ci_tools_proof_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/ci-tools-proof.test.sh .github/scripts/ci-tools-proof.test.sh

      - name: Test the action pin check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_action_pins_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-action-pins.test.sh .github/scripts/check-action-pins.test.sh

      - name: Test the workflow file check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_workflow_files_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-workflow-files.test.sh .github/scripts/check-workflow-files.test.sh

      - name: Test the Postgres service settings and their read-back
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"postgres_service_settings_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/postgres-service-settings.test.sh .github/scripts/postgres-service-settings.test.sh

      - name: Test the private-name check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_private_names_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-private-names.test.sh .github/scripts/check-private-names.test.sh

      - name: Test the private-name check's term list
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_private_names_terms_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-private-names-terms.test.sh .github/scripts/check-private-names-terms.test.sh

      - name: Test the private-name check's issue-key rule
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_private_names_keys_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-private-names-keys.test.sh .github/scripts/check-private-names-keys.test.sh

      - name: Test the plugin-name check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_plugin_names_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-plugin-names.test.sh .github/scripts/check-plugin-names.test.sh

      - name: Test the kept-for-one-release list check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_kept_for_one_release_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-kept-for-one-release.test.sh .github/scripts/check-kept-for-one-release.test.sh

      - name: Test the fireEvent reason check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_fireevent_reasons_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-fireevent-reasons.test.sh .github/scripts/check-fireevent-reasons.test.sh

      - name: Test the whole-tree Biome check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_biome_tree_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-biome-tree.test.sh .github/scripts/check-biome-tree.test.sh

      - name: Test the daemon API contract number check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_daemon_api_contract_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-daemon-api-contract.test.sh .github/scripts/check-daemon-api-contract.test.sh

      - name: Test the release credential check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_release_credentials_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-release-credentials.test.sh .github/scripts/check-release-credentials.test.sh

      - name: Test the repository path derivation
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"repo_paths_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/repo-paths.test.sh .github/scripts/repo-paths.test.sh

      # The proof selector e2e.yaml's select job runs, over fixture trees and over this
      # repository's own .github/e2e-scripts.json and scripts/e2e/.
      - name: Test the e2e proof selector
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"select_e2e_proofs_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/select-e2e-proofs.test.sh .github/scripts/select-e2e-proofs.test.sh

      # The lister the build-tag steps take their `-run` from, over fixture packages and over
      # this repository's own tagged test files.
      - name: Test the build-tag test lister
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"go_tagged_tests_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/go-tagged-tests.test.sh .github/scripts/go-tagged-tests.test.sh

      - name: Test ci-ok's verdict
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"ci_ok_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/ci-ok.test.sh .github/scripts/ci-ok.test.sh

      - name: Test ci-ok's report and the check-run post (a stand-in gh)
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"ci_ok_report_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/ci-ok-report.test.sh .github/scripts/ci-ok-report.test.sh

      - name: Test the reconciliation of this head's other ci-ok check runs (a stand-in gh)
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"ci_ok_reconcile_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/ci-ok-reconcile.test.sh .github/scripts/ci-ok-reconcile.test.sh

      - name: Test the pull request payload both pr-title checks read (a stand-in gh)
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"find_pr_payload_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/find-pr-payload.test.sh .github/scripts/find-pr-payload.test.sh

      - name: Test the priority pull request conflict check (a fixture git origin; a stand-in gh)
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"priority_conflicts_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/priority-conflicts.test.sh .github/scripts/priority-conflicts.test.sh

      - name: Test the merge-group cancel decision
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"merge_group_cancels_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/merge-group-cancels.test.sh .github/scripts/merge-group-cancels.test.sh

      - name: Test the main bypass check's decision
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"main_bypass_check_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/main-bypass-check.test.sh .github/scripts/main-bypass-check.test.sh

      # The base envoy-go-build's edited-migrations check compares a run's tree with, per event,
      # over fixture remotes cloned one commit deep as actions/checkout leaves a run's tree.
      - name: Test the edited-migrations check's choice of base (fixture git remotes; no GitHub)
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"edited_migrations_base_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/edited-migrations-base.test.sh .github/scripts/edited-migrations-base.test.sh

      # The attempt selection dispatch-browser.yaml's merge job runs over the legs' blob
      # artifacts. A run holds every attempt's artifacts, so the newest of each leg has to be
      # chosen or a re-run is judged on the attempt it replaced; these are the assertions that
      # hold that, and they belong here beside ci-ok's, which choose an attempt the same way.
      - name: Test the browser lane's blob attempt selection
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"dispatch_browser_latest_blobs_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/dispatch-browser-latest-blobs.test.sh .github/scripts/dispatch-browser-latest-blobs.test.sh

      # The second read of the binaries artifact the shard and alone jobs make when
      # actions/download-artifact's first did not complete, against a stand-in GitHub whose blob
      # stalls partway, serves bytes off the artifact's digest, or is not there.
      - name: Test the browser lane's second read of its binaries (a stand-in GitHub)
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"dispatch_browser_fetch_binaries_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/dispatch-browser-fetch-binaries.test.sh .github/scripts/dispatch-browser-fetch-binaries.test.sh

      # Reading one of dispatch-browser.yaml's merge job, run through that job's own call over
      # fixture blob directories and a stand-in for its jobs read: what it says of the legs for
      # each way its download and selection steps can end, a download that never ran among them,
      # which it once reported as legs that sent no blob (run 44754426131, attempt 1).
      - name: Test the browser lane's reading of its rows
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"dispatch_browser_reading_rows_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/dispatch-browser-reading-rows.test.sh .github/scripts/dispatch-browser-reading-rows.test.sh

      # The memory and CPU sampler dispatch-browser.yaml's two browser steps run, over fixture
      # sample files: its two readings are pure functions of those files, so the numbers and the
      # notice titles are held here, where no browser and no runner are needed.
      - name: Test the browser lane's memory and CPU sampler
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"dispatch_browser_samples_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/dispatch-browser-samples.test.sh .github/scripts/dispatch-browser-samples.test.sh

      - name: Test the race memory sampler
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"race_memory_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/race_memory.test.sh .github/scripts/race_memory.test.sh

      # The machine watch's test runs as the first process of its own unprivileged user, mount and
      # PID namespaces, so no sampler it starts outlives it, and its falling-least case watches a
      # tmpfs it mounts in a further namespace, so that no other writer moves the free space it
      # reads; both fail rather than skip under GITHUB_ACTIONS. Ubuntu 24.04 restricts unprivileged
      # user namespaces with an AppArmor sysctl, so the job turns it off on its throwaway runner,
      # as daemon-go does (`|| true`: a runner image without the key restricts nothing), and the
      # unshare after it is the verdict that the restriction is gone.
      - name: Allow unprivileged user namespaces (the machine watch's test)
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"disk_watch_test"')
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --map-root-user --mount --pid --fork --mount-proc true

      - name: Test the machine watch
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"disk_watch_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/disk_watch.test.sh .github/scripts/disk_watch.test.sh

      - name: Test the daemon contract order script (a scratch repository)
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"daemon_contract_order_test"')
        run: .github/scripts/harness-pool.sh start scripts/daemon-contract-order.test.sh bash scripts/daemon-contract-order.test.sh

      - name: Test the worker image's contract order step (a scratch repository)
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"image_order_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/worker-image-contract-order.test.sh bash .github/scripts/worker-image-contract-order.test.sh

      # main's #4929 added it as a step of its own after the pool was written; it reads nothing
      # outside its own mktemp directory and the go stand-ins it puts on PATH there, so it is
      # queued like the other harnesses.
      - name: Test the architecture-check action's go-path mode
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"architecture_check_test"')
        run: .github/scripts/harness-pool.sh start .github/actions/architecture-check/check.test.sh .github/actions/architecture-check/check.test.sh

      - name: Test the Dispatch census script
        run: bun test scripts/dispatch

      - name: Test the approval-eval statistics
        run: bun test scripts/approval-eval

      # scripts/search-measure's psql helper: the password a DSN carries reaches psql in PGPASSWORD
      # alone, in no argument. A stand-in psql answers, so it needs no Postgres; the runner's own
      # python3 runs it.
      - name: Test the search-measure psql helper
        run: python3 -m unittest -v pg_test
        working-directory: scripts/search-measure

      # Go, but no Actions cache: the go-daemon entry holds what compiling packages/daemon
      # leaves behind, and it went to .github/workflows/ci-job-daemon-go.yaml with the steps
      # that compiled it. What runs go here is the held-port build of the envoy listener below,
      # the CI-filter check's go list over a scratch module, the build-cache prune's builds of a
      # scratch module and the build-tag lister, none of which that entry is filled for. The
      # daemon's go.mod is still the one Go pin of this repository's three modules that a job
      # without one of its own reads.
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # The filters this run's changes job computed, which no file of the repository holds: one
      # case of the check below holds them to what this repository's Bun jobs compile and read, and
      # the router outputs' harness reads the filter names from them, both reading the run's own
      # file rather than computing them a second time. Before those two harnesses are queued: each
      # takes the file's path in its step's env, and reads the file when the pool starts it.
      - name: Fetch the filters the changes job selected this run's jobs by
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_ci_filters_test"') || contains(inputs.matched-filters, '"ci_router_outputs_test"')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-filters
          path: ${{ runner.temp }}/ci-filters

      # After setup-go: its fixtures run go list over a scratch module.
      - name: Test the CI filter check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_ci_filters_test"')
        env:
          CI_FILTERS_FILE: ${{ runner.temp }}/ci-filters/ci-filters.computed.yaml
        run: .github/scripts/harness-pool.sh start .github/scripts/check-ci-filters.test.sh .github/scripts/check-ci-filters.test.sh

      # After setup-go: its first cases build a scratch module with the real go, the one that
      # marks the cache entries a build uses, which the script under test reads. A pooled harness
      # takes the PATH of the step that queued it, and the cases set a GOCACHE, GOPATH and module
      # of their own under their mktemp directory, so the harnesses beside it share none of them.
      - name: Test the build cache prune of the cache fills
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"go_cache_working_set_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/go-cache-working-set.test.sh .github/scripts/go-cache-working-set.test.sh

      # After setup-go: its fixtures run the real go list over a scratch module with no
      # requirement, which reads no module cache and no network.
      - name: Test the Go legs' package lists
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"go_legs_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/go-legs.test.sh .github/scripts/go-legs.test.sh

      # Beside the check above, and needing no Go and no Bun of its own: its fixtures list each
      # program with a stand-in bunx.
      - name: Test the TypeScript filter check
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"check_ts_filters_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/check-ts-filters.test.sh .github/scripts/check-ts-filters.test.sh

      # Beside the two checks above, and needing no Go either: every case is text, read by the
      # line and step readers of .github/scripts/go-test-step-expansion.py (the step reader over
      # every go test step of ci.yaml and the workflows its jobs call, so a step it would refuse
      # fails here), or the hash of a script that file's AUDITED_SCRIPTS pins. The script's own
      # run compiles the three Go modules it covers and is run by hand rather than by any job.
      - name: Test the go test step expansion
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"go_test_step_expansion_test"')
        run: .github/scripts/harness-pool.sh start .github/scripts/go-test-step-expansion.test.sh .github/scripts/go-test-step-expansion.test.sh

      # The label terms of ci.yaml's changes outputs, evaluated from ci.yaml itself: full-ci, the
      # lane labels and a label that names nothing. After the fetch above: the filter names are the
      # computed filters'.
      - name: Test the router outputs' label terms
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"ci_router_outputs_test"')
        env:
          CI_FILTERS_FILE: ${{ runner.temp }}/ci-filters/ci-filters.computed.yaml
        run: .github/scripts/harness-pool.sh start .github/scripts/ci-router-outputs.test.sh .github/scripts/ci-router-outputs.test.sh

      # After setup-go, since held-port.test.ts builds the real envoy-listener and hands it a held
      # socket; and after the four harnesses above are queued, so they run beside it rather than
      # after it (check-ci-filters.test.sh alone took 100 s in run 45107561644's test job).
      # nats-image.test.ts is left out: lint's "Check every NATS server a script starts or installs
      # is one the floor takes" runs that file on every run, and lint runs whenever this job does.
      # The root package.json's test:e2e-lib holds the run, so CI and every local or pod runner use
      # one command (bun run hands it the --path-ignore-patterns after the script's own words):
      # --timeout bounds each row, and each beforeEach or afterEach hook, at 200 s, in place of Bun's
      # default of 5 s (Bun 1.4.4 reads no [test] timeout from bunfig.toml). It is a hang guard only:
      # each row's verdict is its own assertions. Measured with 8 busy loops on the two CPUs the whole
      # directory ran on (2026-11-20, main d36289cb84), the slowest row that passed took 98.5 s and 58
      # rows took more than 5 s; 200 s is about twice the slowest. The rows whose shells wait set
      # their own bound in their file and give up 20 s inside it, so a wait that gives up still names
      # what it waited for. --parallel=8 runs the files in eight worker processes
      # rather than one after another. Most rows wait on a child process, a socket or a bound rather
      # than compute, so eight workers on this runner's four CPUs finish sooner than four: the step
      # took 50.4 s with one worker per CPU (job 137329421934) and 34.2 s with eight (job
      # 137338546977), against a median 178 s run alone over 412 pull-request runs of 2026-11-22,
      # before the harnesses above ran beside it. app-logins.test.ts's rows, 32.5 s in that run, are
      # one file in one worker, the floor of the step at any worker count.
      - name: Test the live proofs' libraries (the GitHub ingress bridge, the proof human's check, the model gateway key command, the design-gate verdict, the held-port helper)
        run: bun run test:e2e-lib --path-ignore-patterns=scripts/e2e/lib/nats-image.test.ts

      # The verdict on the script harnesses the steps above queued: it waits for the last of them,
      # prints each one's log in a group of its own with its wall and CPU seconds, and fails naming
      # each harness that failed (.github/scripts/harness-pool.sh). Every harness step has a gate
      # of its own, so a change that reaches none of them queues none, and --allow-none passes
      # that run; a run that queued any is judged on all of them. It runs after a failed step too,
      # so a harness queued before the failure is still judged and its log shown. `!cancelled()`
      # rather than `always()`: the runner signals a running step on a cancel only when its
      # condition no longer holds, and the wait answers that signal by naming each harness still
      # running with its log so far; `exec`, so the signal reaches the wait itself.
      - id: harness-wait
        name: Wait for the script harnesses and judge them
        if: ${{ !cancelled() }}
        run: exec .github/scripts/harness-pool.sh wait --allow-none

      # A job cancelled, or past its timeout, before the step above began: name each harness it
      # queued as it is, with its log so far, rather than lose them with the job.
      - name: Name the script harnesses a cancelled job left
        if: cancelled() && steps.harness-wait.outcome == 'skipped'
        run: .github/scripts/harness-pool.sh wait --allow-none --now

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: test
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  tooling-checks:
    if: inputs.job == 'tooling-checks'
    runs-on: ubuntu-24.04-arm
    # The steps the test job ran before the split, less its tests: the same Bun install, and the
    # builds, lints and typechecks that ran beside the harnesses. No run has measured them apart
    # yet, so the limit stays the one they ran under there.
    timeout-minutes: 30
    env:
      JOB_TIMEOUT_MINUTES: 30 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The very command release.yaml's claude_envoy_build runs, so a pull request whose source
      # that job would refuse fails this job, and with it the required ci-ok, instead of merging
      # and then failing every release. What it builds and checks:
      # packages/claude-envoy/scripts/verify-build.sh.
      - name: Build, check and pack the Claude Code plugin as the release does
        run: bun run verify-build "$RUNNER_TEMP/claude-envoy-built.tar"
        working-directory: packages/claude-envoy

      # release.yaml's $CLAUDE_ENVOY_VERSION_ARGS covers scripts/build-inputs.txt, so a build input
      # missing from it is one no release bumps a version for.
      - name: Check the Claude Code plugin's build input list covers what the build reads
        run: bun test tests/build-inputs.test.ts
        working-directory: packages/claude-envoy

      # The step below renders this checkout's own fragments with changie.
      - uses: ./.github/actions/install-changie

      # Nothing renders a changelog fragment between the merge and the release that first ships
      # it, so a fragment changie refuses would fail that release's build job, and every run
      # after it, until a fix merges. This renders every fragment of every listed package here
      # instead, inside a required check. It runs in this job rather than beside fold-orphans in
      # lint because this job installs changie.
      - name: Check every changelog fragment renders
        run: |
          # shellcheck disable=SC2046 # the file is the package list, split on purpose
          .github/scripts/release-push.sh fold-check $(<.github/changelog-packages)

      # The guides' own layout, in this job because it installs Bun's dependencies, which the
      # test's Markdown parser needs (`scripts/semantic-line-breaks.guides.test.ts#mdast-util-from-markdown`). The
      # step has a filter of its own, guide_layout, naming the six guides the test reads and
      # the checker it spawns: no other step of this job reads one of them, so a run that
      # changed none of them skips this step.
      - name: Check the guides' semantic line breaks
        if: inputs.changes-result != 'success' || inputs.matched-filters == 'all' || contains(inputs.matched-filters, '"guide_layout"')
        run: bun test scripts/semantic-line-breaks.guides.test.ts

      # why: .github/ci-notes/ci.md#why-every-biome-step-prints-every-warning-and-error
      - name: Lint the Dispatch census script
        run: bunx biome check --error-on-warnings --diagnostic-level=warn --max-diagnostics=none scripts/dispatch

      # scripts/dispatch is no workspace; the root package pins its TypeScript and Bun types.
      - name: Typecheck the Dispatch census script
        run: bunx tsc --noEmit -p scripts/dispatch

      # why: .github/ci-notes/ci.md#why-every-biome-step-prints-every-warning-and-error
      - name: Lint the GitHub App registration script
        run: bunx biome check --error-on-warnings --diagnostic-level=warn --max-diagnostics=none scripts/github-apps

      # scripts/github-apps is no workspace either; the root package pins its TypeScript and Bun types.
      - name: Typecheck the GitHub App registration script
        run: bunx tsc --noEmit -p scripts/github-apps

      # why: .github/ci-notes/ci.md#why-every-biome-step-prints-every-warning-and-error
      - name: Lint the session message-wait script
        run: bunx biome check --error-on-warnings --diagnostic-level=warn --max-diagnostics=none scripts/sessions

      # scripts/sessions is no workspace either; the root package pins its TypeScript and Bun types.
      # The suite itself is .github/workflows/ci-job-sessions-script.yaml's: it creates a
      # session-store database of its own and refuses without one.
      - name: Typecheck the session message-wait script
        run: bunx tsc --noEmit -p scripts/sessions

      # why: .github/ci-notes/ci.md#why-every-biome-step-prints-every-warning-and-error
      - name: Lint the approval-eval statistics
        run: bunx biome check --error-on-warnings --diagnostic-level=warn --max-diagnostics=none scripts/approval-eval

      # scripts/approval-eval is no workspace either; the root package pins its TypeScript and Bun types.
      - name: Typecheck the approval-eval statistics
        run: bunx tsc --noEmit -p scripts/approval-eval

      # scripts/e2e/lib is no workspace either: its tsconfig.json holds the plan ratings read's
      # test, whose answer is typed to the contract, and the root package pins its TypeScript and
      # Bun types. The test itself runs in the test job's bun test of scripts/e2e/lib.
      - name: Typecheck the plan ratings read test
        run: bunx tsc --noEmit -p scripts/e2e/lib

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: tooling-checks
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
