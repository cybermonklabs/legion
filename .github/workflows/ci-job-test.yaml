name: CI job test

# The steps of ci.yaml's `test` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. Every filter of the `changes` job names ci.yaml today, so a
# change to that one file runs every job; once this job's filter names this file instead, a
# change to these steps selects this job alone.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true
      guide_layout:
        description: >-
          ci.yaml's `needs.changes.outputs.guide_layout`: the guides' layout step below runs
          when that filter matched.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  test:
    runs-on: ubuntu-24.04
    # Each go test step's -timeout must fire before the runner cancels the job, so a hung test
    # prints the goroutine dump that names it. A step's worst case is therefore its largest
    # measured green duration plus its own -timeout, not its compile plus its -timeout: 325 s of
    # setup before the plain step starts, then that step's 839 s (measured while it still ran
    # internal/daemon, so an upper bound for it now) and its 15 minutes, then the race step's
    # 694 s and its 30, then 13 s for the steps after it, which is 4571 s, or about 76 minutes
    # (dispatch://INFRA-1052 measured them over the 30 newest counted test jobs of main push runs).
    timeout-minutes: 80
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # One service for all three: the Go daemon's unit tests' Postgres, the broker rig its
      # agentsecrets contract tests drive (brokertest.NewRig skips without
      # BROKER_TEST_DATABASE_URL), and the Stage 1 script's. Setting LEGION_E2E_PG_DSN is what tells
      # the script not to start a container of its own — that path is the devbox's.
      LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      LEGION_E2E_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image (testcontainers/ryuk, on Docker Hub) would be one more registry
      # pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # The fuzz and property counts follow the lane. A pull-request run takes the reduced counts
      # below; every other lane — a merge group, a dispatched run — takes the empty string, which
      # every reader treats as unset (classify's run_fuzz_test.go and sender_fuzz_test.go, the
      # daemon's keptPropertyEnv), so the full counts live in the Go source alone and the queue
      # still runs them. sender_fuzz_test.go's own count is 2,000 histories of each order already,
      # so the pull-request value leaves it as it is. The number of seeds falls rather than each
      # seed's depth: a seed that stops early stops reaching the states the property is about.
      LEGION_RUN_FUZZ_ITERS: ${{ github.event_name == 'pull_request' && '2000' || '' }}
      LEGION_KEPT_PROPERTY_RUNS: ${{ github.event_name == 'pull_request' && '8' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The very command release.yaml's claude_envoy_build runs, so a pull request whose source
      # that job would refuse fails this job, and with it the required ci-ok, instead of merging
      # and then failing every release. What it builds and checks:
      # packages/claude-envoy/scripts/verify-build.sh.
      - name: Build, check and pack the Claude Code plugin as the release does
        run: bun run verify-build "$RUNNER_TEMP/claude-envoy-built.tar"
        working-directory: packages/claude-envoy

      # release.yaml's $CLAUDE_ENVOY_VERSION_ARGS covers scripts/build-inputs.txt, so a build input
      # missing from it is one no release bumps a version for.
      - name: Check the Claude Code plugin's build input list covers what the build reads
        run: bun test tests/build-inputs.test.ts
        working-directory: packages/claude-envoy

      # release-push.test.sh renders its fold-notes cases with the real changie, and the step
      # below renders this checkout's own fragments with it; where changie is absent, as on a
      # developer's machine, those cases print a SKIP line and count nothing.
      - uses: ./.github/actions/install-changie

      # Nothing renders a changelog fragment between the merge and the release that first ships
      # it, so a fragment changie refuses would fail that release's build job, and every run
      # after it, until a fix merges. This renders every fragment of every listed package here
      # instead, inside a required check. It runs in this job rather than beside fold-orphans in
      # lint because this is the job that installs changie.
      - name: Check every changelog fragment renders
        run: |
          # shellcheck disable=SC2046 # the file is the package list, split on purpose
          .github/scripts/release-push.sh fold-check $(<.github/changelog-packages)

      - name: Test release scripts
        run: .github/scripts/release-push.test.sh

      - name: Test the release version bump
        run: .github/scripts/release-bump.test.sh

      - name: Test third-party notices
        run: bun test scripts/third-party-notices.test.ts

      - name: Test the semantic line-break checker
        run: bun test scripts/semantic-line-breaks.test.ts

      # The guides' own layout, in this job because it installs Bun's dependencies, which the
      # test's Markdown parser needs (scripts/semantic-line-breaks.guides.test.ts:5-7). The
      # step has a filter of its own, guide_layout, naming the five guides the test reads and
      # the checker it spawns: no other step of this job reads one of them, so a run that
      # changed none of them skips this step.
      - name: Check the guides' semantic line breaks
        if: inputs.guide_layout == 'true'
        run: bun test scripts/semantic-line-breaks.guides.test.ts

      - name: Test the Bun pin check
        run: .github/scripts/check-bun-version.test.sh

      - name: Test the frozen Bun workspace manifest check
        run: .github/scripts/check-bun-workspace-manifests.test.sh

      - name: Test the zod version check
        run: .github/scripts/check-zod-version.test.sh

      - name: Test the gh version check
        run: .github/scripts/check-gh-version.test.sh

      - name: Test the workflow path model the path checks import
        run: .github/scripts/workflow_paths.test.sh

      - name: Test the image trigger path check
        run: .github/scripts/check-image-trigger-paths.test.sh

      - name: Test the CI image check
        run: .github/scripts/check-ci-images.test.sh

      - name: Test the CI image mirror
        run: .github/scripts/mirror-ci-images.test.sh

      - name: Test the action pin check
        run: .github/scripts/check-action-pins.test.sh

      - name: Test the private-name check
        run: .github/scripts/check-private-names.test.sh

      - name: Test the plugin-name check
        run: .github/scripts/check-plugin-names.test.sh

      - name: Test the release credential check
        run: .github/scripts/check-release-credentials.test.sh

      - name: Test the repository path derivation
        run: .github/scripts/repo-paths.test.sh

      - name: Test the Playwright dependency list check
        run: .github/scripts/playwright-deps-current.test.sh

      # The proof selector e2e.yaml's select job runs, over fixture trees and over this
      # repository's own .github/e2e-scripts.json and scripts/e2e/.
      - name: Test the e2e proof selector
        run: .github/scripts/select-e2e-proofs.test.sh

      # The lister the build-tag steps take their `-run` from, over fixture packages and over
      # this repository's own tagged test files.
      - name: Test the build-tag test lister
        run: .github/scripts/go-tagged-tests.test.sh

      - name: Test ci-ok's verdict
        run: .github/scripts/ci-ok.test.sh

      - name: Test ci-ok's report and the check-run post (a stand-in gh)
        run: .github/scripts/ci-ok-report.test.sh

      - name: Test the reconciliation of this head's other ci-ok check runs (a stand-in gh)
        run: .github/scripts/ci-ok-reconcile.test.sh

      - name: Test the pull request payload both pr-title checks read (a stand-in gh)
        run: .github/scripts/find-pr-payload.test.sh

      - name: Test the merge-group cancel decision
        run: .github/scripts/merge-group-cancels.test.sh

      - name: Test the main bypass check's decision
        run: .github/scripts/main-bypass-check.test.sh

      - name: Test the race memory sampler
        run: .github/scripts/race_memory.test.sh

      - name: Test the disk watch
        run: .github/scripts/disk_watch.test.sh

      - name: Test the session import pods script (a stand-in kubectl)
        run: bash scripts/sessions-import-pods.test.sh

      - name: Lint the Dispatch census script
        run: bunx biome check --error-on-warnings scripts/dispatch

      # scripts/dispatch is no workspace; the root package pins its TypeScript and Bun types.
      - name: Typecheck the Dispatch census script
        run: bunx tsc --noEmit -p scripts/dispatch

      - name: Test the Dispatch census script
        run: bun test scripts/dispatch

      - name: Lint the GitHub App registration script
        run: bunx biome check --error-on-warnings scripts/github-apps

      # scripts/github-apps is no workspace either; the root package pins its TypeScript and Bun types.
      - name: Typecheck the GitHub App registration script
        run: bunx tsc --noEmit -p scripts/github-apps

      - name: Lint the session message-wait script
        run: bunx biome check --error-on-warnings scripts/sessions

      # scripts/sessions is no workspace either; the root package pins its TypeScript and Bun types.
      - name: Typecheck the session message-wait script
        run: bunx tsc --noEmit -p scripts/sessions

      - name: Test the session message-wait script
        run: bun test scripts/sessions

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      # go-daemon, shared with typecheck and pi-legion.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-daemon-{0}-', runner.os) }}

      # After setup-go: held-port.test.ts builds the real envoy-listener and hands it a held socket.
      - name: Test the live proofs' libraries (the GitHub ingress bridge, the proof human's check, the model gateway key command, the design-gate verdict, the held-port helper)
        run: bun test scripts/e2e/lib

      # After setup-go: its fixtures run go list over a scratch module.
      - name: Test the CI filter check
        run: .github/scripts/check-ci-filters.test.sh

      # Beside the check above, and needing no Go and no Bun of its own: its fixtures list each
      # program with a stand-in bunx.
      - name: Test the TypeScript filter check
        run: .github/scripts/check-ts-filters.test.sh

      # The tmux runtime's tests drive a real tmux server and skip without one, and the daemon
      # supervises under tmux and refuses to start without it.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux

      # The workspace and boundary tests drive a real jj, the one the worker image ships (its
      # working-copy filters are among what they plant), and the daemon resolves jj at boot and
      # refuses to start without it.
      - uses: ./.github/actions/install-jj

      # internal/podsafety's baseline test and the pod agent's argv test run the Oh My Pi the worker
      # image ships, and refuse on GitHub Actions without one. The pin is read from
      # .omp-pin, the repository's one copy of it, installed through the mise above
      # (.github/actions/install-omp).
      - uses: ./.github/actions/install-omp

      # internal/runtime/sandbox's uv link-mode test installs a wheel with the uv the worker image
      # ships (ARG UV_VERSION, checked against ARG UV_SHA256), and refuses on GitHub Actions
      # without one (.github/actions/install-uv).
      - uses: ./.github/actions/install-uv

      # The daemon's NATS tests start testnats.Image and, for its grant test, Envoy's HubImage
      # (packages/envoy/testnatsimages), pulled first for the reason the action gives.
      - name: Pull the NATS test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/daemon/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage

      # internal/launcher's role-namespace tests start each role generation in unprivileged user,
      # mount, PID and IPC namespaces, as an issue pod's launcher does, and t.Fatal rather than
      # skip under GITHUB_ACTIONS. Ubuntu 24.04 restricts unprivileged user namespaces with an
      # AppArmor sysctl, so the job turns it off on its throwaway runner (`|| true`: a runner
      # image without the key restricts nothing), and the unshare after it is the verdict that
      # the restriction is gone.
      - name: Allow unprivileged user namespaces (the launcher's role-namespace tests)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --map-root-user true

      # The step runs every package of the module except the three the race step below tests and
      # internal/textcheck, whose tests are the text-check job's: so each of the three runs once
      # per job, under the detector, and the text checks run once per run of the router, in a
      # job with no database. `set -o pipefail` is what makes a failed go list, or a pattern
      # that matches every package, fail the step rather than pass it with nothing tested. The
      # pattern is built in .github/scripts/ci_job_reads.py from the race step's own package
      # list and that one package name, so the two steps cannot name different sets.
      - name: Test the Go daemon
        run: |
          set -o pipefail
          go list ./... | grep -Ev '/(internal/daemon|internal/sessionproxy|internal/launcher|internal/textcheck)$' | xargs go test -count=1 -timeout 15m
        working-directory: packages/daemon

      # The outbox's lane registry, lease renewal and held clock are the daemon's first goroutines
      # that share state with the intake's commit hooks and the API, so the packages the lanes
      # live in run under the race detector once per job, the plain step above leaving them out;
      # so do the session proxy and the launcher that wires it, whose accept loop, copy pairs,
      # pair tracking and bounded drain share state across goroutines. internal/record is not
      # here: the lanes' store is the package's subject, but its product code starts no goroutine
      # and uses no sync, so the detector had only the package's own test goroutines to watch,
      # and that cover is what leaving it out gives up. It runs in the plain step instead. The
      # detector needs cgo, which the runners have gcc for. The lane tests hold a fake clock, so
      # they are deterministic under it.
      #
      # The step carries a package deadline of its own, as the envoy race lanes do: under go
      # test's ten-minute default, internal/daemon, by far the slowest of the three packages, took
      # up to 570 s on the green runs of 2026-11-02 and 2026-11-03 and ran the ten minutes out on
      # main at job 125691048644 (run 41562777668). No single test dominates it: a local run timed
      # 648 tests one after another, the slowest at 44 s. The 30 minutes leave it three times its
      # slowest run.
      - name: Test the concurrent packages under the race detector
        run: go test -count=1 -race -timeout 30m ./internal/daemon/ ./internal/sessionproxy/ ./internal/launcher/
        working-directory: packages/daemon

      - name: Stage 1 live proof
        run: bash scripts/e2e/stage1-skeleton.sh

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: test
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
