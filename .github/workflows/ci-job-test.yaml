# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  test:
    if: inputs.job == 'test'
    runs-on: ubuntu-24.04-arm
    # No step here carries a -timeout of its own any more: the two go test steps that did, and
    # the Stage 1 proof beside them, are .github/workflows/ci-job-daemon-go.yaml's now. What is
    # left is the Bun install, the shell-script harnesses and a handful of Bun suites, the Claude
    # Code plugin build and the lint and typecheck steps having gone to tooling-checks below -
    # less than the 325 s of setup dispatch://INFRA-1052 measured before the plain Go step
    # started, less the tool installs that went with those steps. Thirty minutes is about six
    # times that, which leaves a slow runner room and still fails a hung harness inside the hour.
    timeout-minutes: 30
    env:
      JOB_TIMEOUT_MINUTES: 30 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # release-push.test.sh renders its fold-notes cases with the real changie; where changie is
      # absent, as on a developer's machine, those cases print a SKIP line and count nothing.
      - uses: ./.github/actions/install-changie

      - name: Test release scripts
        if: inputs.changes-result != 'success' || inputs.release_push_test == 'true'
        run: .github/scripts/release-push.test.sh

      - name: Test the release version bump
        if: inputs.changes-result != 'success' || inputs.release_bump_test == 'true'
        run: .github/scripts/release-bump.test.sh

      - name: Test third-party notices
        run: bun test scripts/third-party-notices.test.ts

      - name: Test the semantic line-break checker
        run: bun test scripts/semantic-line-breaks.test.ts

      # The seed that writes the first priorities from the table kept by hand, driven against a
      # fake Dispatch of the test's own: it reaches no network and no deployment.
      - name: Test the priorities seed
        run: bun test scripts/priorities-seed.test.ts

      - name: Test the Bun pin check
        if: inputs.changes-result != 'success' || inputs.check_bun_version_test == 'true'
        run: .github/scripts/check-bun-version.test.sh

      - name: Test the Playwright version check
        if: inputs.changes-result != 'success' || inputs.check_playwright_version_test == 'true'
        run: .github/scripts/check-playwright-version.test.sh

      - name: Test the frozen Bun workspace manifest check
        if: inputs.changes-result != 'success' || inputs.check_bun_workspace_manifests_test == 'true'
        run: .github/scripts/check-bun-workspace-manifests.test.sh

      - name: Test the zod version check
        if: inputs.changes-result != 'success' || inputs.check_zod_version_test == 'true'
        run: .github/scripts/check-zod-version.test.sh

      - name: Test the gh version check
        if: inputs.changes-result != 'success' || inputs.check_gh_version_test == 'true'
        run: .github/scripts/check-gh-version.test.sh

      - name: Test the gitleaks version check
        if: inputs.changes-result != 'success' || inputs.check_gitleaks_version_test == 'true'
        run: .github/scripts/check-gitleaks-version.test.sh

      - name: Test the workflow path model the path checks import
        if: inputs.changes-result != 'success' || inputs.workflow_paths_test == 'true'
        run: .github/scripts/workflow_paths.test.sh

      - name: Test the image trigger path check
        if: inputs.changes-result != 'success' || inputs.check_image_trigger_paths_test == 'true'
        run: .github/scripts/check-image-trigger-paths.test.sh

      - name: Test the CI image check
        if: inputs.changes-result != 'success' || inputs.check_ci_images_test == 'true'
        run: .github/scripts/check-ci-images.test.sh

      - name: Test the CI image mirror
        if: inputs.changes-result != 'success' || inputs.mirror_ci_images_test == 'true'
        run: .github/scripts/mirror-ci-images.test.sh

      # The tool scripts, in the order they depend on each other: the fetch helper every
      # install goes through, the filler that puts the bytes in the copy that helper reads, the
      # gate that holds every row to its pin, and the rig that drives that helper against a
      # fault in the tool-fallback job.
      - name: Test the tool fetch helper
        if: inputs.changes-result != 'success' || inputs.ci_tools_test == 'true'
        run: .github/scripts/ci-tools.test.sh

      - name: Test the tool copy filler
        if: inputs.changes-result != 'success' || inputs.mirror_ci_tools_test == 'true'
        run: .github/scripts/mirror-ci-tools.test.sh

      - name: Test the tool manifest check
        if: inputs.changes-result != 'success' || inputs.check_ci_tools_test == 'true'
        run: .github/scripts/check-ci-tools.test.sh

      - name: Test the tool fallback rig
        if: inputs.changes-result != 'success' || inputs.ci_tools_proof_test == 'true'
        run: .github/scripts/ci-tools-proof.test.sh

      - name: Test the action pin check
        if: inputs.changes-result != 'success' || inputs.check_action_pins_test == 'true'
        run: .github/scripts/check-action-pins.test.sh

      - name: Test the workflow file check
        if: inputs.changes-result != 'success' || inputs.check_workflow_files_test == 'true'
        run: .github/scripts/check-workflow-files.test.sh

      - name: Test the private-name check
        if: inputs.changes-result != 'success' || inputs.check_private_names_test == 'true'
        run: .github/scripts/check-private-names.test.sh

      - name: Test the private-name check's term list
        if: inputs.changes-result != 'success' || inputs.check_private_names_terms_test == 'true'
        run: .github/scripts/check-private-names-terms.test.sh

      - name: Test the private-name check's issue-key rule
        if: inputs.changes-result != 'success' || inputs.check_private_names_keys_test == 'true'
        run: .github/scripts/check-private-names-keys.test.sh

      - name: Test the plugin-name check
        if: inputs.changes-result != 'success' || inputs.check_plugin_names_test == 'true'
        run: .github/scripts/check-plugin-names.test.sh

      - name: Test the fireEvent reason check
        if: inputs.changes-result != 'success' || inputs.check_fireevent_reasons_test == 'true'
        run: .github/scripts/check-fireevent-reasons.test.sh

      - name: Test the daemon API contract number check
        if: inputs.changes-result != 'success' || inputs.check_daemon_api_contract_test == 'true'
        run: .github/scripts/check-daemon-api-contract.test.sh

      - name: Test the release credential check
        if: inputs.changes-result != 'success' || inputs.check_release_credentials_test == 'true'
        run: .github/scripts/check-release-credentials.test.sh

      - name: Test the repository path derivation
        if: inputs.changes-result != 'success' || inputs.repo_paths_test == 'true'
        run: .github/scripts/repo-paths.test.sh

      # The proof selector e2e.yaml's select job runs, over fixture trees and over this
      # repository's own .github/e2e-scripts.json and scripts/e2e/.
      - name: Test the e2e proof selector
        if: inputs.changes-result != 'success' || inputs.select_e2e_proofs_test == 'true'
        run: .github/scripts/select-e2e-proofs.test.sh

      # The lister the build-tag steps take their `-run` from, over fixture packages and over
      # this repository's own tagged test files.
      - name: Test the build-tag test lister
        if: inputs.changes-result != 'success' || inputs.go_tagged_tests_test == 'true'
        run: .github/scripts/go-tagged-tests.test.sh

      - name: Test ci-ok's verdict
        if: inputs.changes-result != 'success' || inputs.ci_ok_test == 'true'
        run: .github/scripts/ci-ok.test.sh

      - name: Test ci-ok's report and the check-run post (a stand-in gh)
        if: inputs.changes-result != 'success' || inputs.ci_ok_report_test == 'true'
        run: .github/scripts/ci-ok-report.test.sh

      - name: Test the reconciliation of this head's other ci-ok check runs (a stand-in gh)
        if: inputs.changes-result != 'success' || inputs.ci_ok_reconcile_test == 'true'
        run: .github/scripts/ci-ok-reconcile.test.sh

      - name: Test the pull request payload both pr-title checks read (a stand-in gh)
        if: inputs.changes-result != 'success' || inputs.find_pr_payload_test == 'true'
        run: .github/scripts/find-pr-payload.test.sh

      - name: Test the merge-group cancel decision
        if: inputs.changes-result != 'success' || inputs.merge_group_cancels_test == 'true'
        run: .github/scripts/merge-group-cancels.test.sh

      - name: Test the main bypass check's decision
        if: inputs.changes-result != 'success' || inputs.main_bypass_check_test == 'true'
        run: .github/scripts/main-bypass-check.test.sh

      # The base envoy-go-build's edited-migrations check compares a run's tree with, per event,
      # over fixture remotes cloned one commit deep as actions/checkout leaves a run's tree.
      - name: Test the edited-migrations check's choice of base (fixture git remotes; no GitHub)
        if: inputs.changes-result != 'success' || inputs.edited_migrations_base_test == 'true'
        run: .github/scripts/edited-migrations-base.test.sh

      # The attempt selection dispatch-browser.yaml's merge job runs over the legs' blob
      # artifacts. A run holds every attempt's artifacts, so the newest of each leg has to be
      # chosen or a re-run is judged on the attempt it replaced; these are the assertions that
      # hold that, and they belong here beside ci-ok's, which choose an attempt the same way.
      - name: Test the browser lane's blob attempt selection
        if: inputs.changes-result != 'success' || inputs.dispatch_browser_latest_blobs_test == 'true'
        run: .github/scripts/dispatch-browser-latest-blobs.test.sh

      # Reading one of dispatch-browser.yaml's merge job, run through that job's own call over
      # fixture blob directories and a stand-in for its jobs read: what it says of the legs for
      # each way its download and selection steps can end, a download that never ran among them,
      # which it once reported as legs that sent no blob (run 44754426131, attempt 1).
      - name: Test the browser lane's reading of its rows
        if: inputs.changes-result != 'success' || inputs.dispatch_browser_reading_rows_test == 'true'
        run: .github/scripts/dispatch-browser-reading-rows.test.sh

      # The merge job's two reads of its own run, driven under a stand-in gh: the attempt route
      # the jobs read takes, the retry ladder's attempts and the waits between them, and the two
      # refusal messages are checked here rather than on a runner against GitHub. Its negative
      # control traces the drive with strace, which this job's ubuntu-24.04-arm image carries; the
      # harness refuses by name on an image without it.
      - name: Test the browser lane's run reads
        if: inputs.changes-result != 'success' || inputs.dispatch_browser_run_reads_test == 'true'
        run: .github/scripts/dispatch-browser-run-reads.test.sh

      # gh-read.sh's wait for a spent API budget, with the real gh against a local stand-in
      # GitHub; its last case reads this job's own Runner.Worker, which only a runner has.
      - name: Test the wait for a spent API budget and the retry ladder (a stand-in GitHub)
        if: inputs.changes-result != 'success' || inputs.gh_read_test == 'true'
        run: .github/scripts/gh-read.test.sh

      # The memory and CPU sampler dispatch-browser.yaml's two browser steps run, over fixture
      # sample files: its two readings are pure functions of those files, so the numbers and the
      # notice titles are held here, where no browser and no runner are needed.
      - name: Test the browser lane's memory and CPU sampler
        if: inputs.changes-result != 'success' || inputs.dispatch_browser_samples_test == 'true'
        run: .github/scripts/dispatch-browser-samples.test.sh

      - name: Test the race memory sampler
        if: inputs.changes-result != 'success' || inputs.race_memory_test == 'true'
        run: .github/scripts/race_memory.test.sh

      # The machine watch's test runs as the first process of its own unprivileged user, mount and
      # PID namespaces, so no sampler it starts outlives it, and its falling-least case watches a
      # tmpfs it mounts in a further namespace, so that no other writer moves the free space it
      # reads; both fail rather than skip under GITHUB_ACTIONS. Ubuntu 24.04 restricts unprivileged
      # user namespaces with an AppArmor sysctl, so the job turns it off on its throwaway runner,
      # as daemon-go does (`|| true`: a runner image without the key restricts nothing), and the
      # unshare after it is the verdict that the restriction is gone.
      - name: Allow unprivileged user namespaces (the machine watch's test)
        if: inputs.changes-result != 'success' || inputs.disk_watch_test == 'true'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --map-root-user --mount --pid --fork --mount-proc true

      - name: Test the machine watch
        if: inputs.changes-result != 'success' || inputs.disk_watch_test == 'true'
        run: .github/scripts/disk_watch.test.sh

      - name: Test the priorities seed check (a stand-in Dispatch)
        if: inputs.changes-result != 'success' || inputs.priorities_seed_check_test == 'true'
        run: bash scripts/priorities-seed-check.test.sh

      - name: Test the architecture-check action's go-path mode
        if: inputs.changes-result != 'success' || inputs.architecture_check_test == 'true'
        run: .github/actions/architecture-check/check.test.sh

      - name: Test the Dispatch census script
        run: bun test scripts/dispatch

      - name: Test the approval-eval statistics
        run: bun test scripts/approval-eval

      # scripts/search-measure's psql helper: the password a DSN carries reaches psql in PGPASSWORD
      # alone, in no argument. A stand-in psql answers, so it needs no Postgres; the runner's own
      # python3 runs it.
      - name: Test the search-measure psql helper
        run: python3 -m unittest -v pg_test
        working-directory: scripts/search-measure

      # Go, but no Actions cache: the go-daemon entry holds what compiling packages/daemon
      # leaves behind, and it went to .github/workflows/ci-job-daemon-go.yaml with the steps
      # that compiled it. What runs go here is the held-port build of the envoy listener below,
      # the CI-filter check's go list over a scratch module, the build-cache prune's builds of a
      # scratch module and the build-tag lister, none of which that entry is filled for. The
      # daemon's go.mod is still the one Go pin of this repository's three modules that a job
      # without one of its own reads.
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false

      # After setup-go: held-port.test.ts builds the real envoy-listener and hands it a held socket.
      - name: Test the live proofs' libraries (the GitHub ingress bridge, the proof human's check, the model gateway key command, the design-gate verdict, the held-port helper)
        run: bun test scripts/e2e/lib

      # The filters this run's changes job computed, which no file of the repository holds: one
      # case of the check below holds them to what this repository's Bun jobs compile and read, and
      # the router outputs' harness reads the filter names from them, both reading the run's own
      # file rather than computing them a second time.
      - name: Fetch the filters the changes job selected this run's jobs by
        if: inputs.changes-result != 'success' || inputs.check_ci_filters_test == 'true' || inputs.ci_router_outputs_test == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-filters
          path: ${{ runner.temp }}/ci-filters

      # After setup-go: its fixtures run go list over a scratch module.
      - name: Test the CI filter check
        if: inputs.changes-result != 'success' || inputs.check_ci_filters_test == 'true'
        env:
          CI_FILTERS_FILE: ${{ runner.temp }}/ci-filters/ci-filters.computed.yaml
        run: .github/scripts/check-ci-filters.test.sh

      # After setup-go: its first cases build a scratch module with the real go, the one that
      # marks the cache entries a build uses, which the script under test reads.
      - name: Test the build cache prune of the cache fills
        if: inputs.changes-result != 'success' || inputs.go_cache_working_set_test == 'true'
        run: .github/scripts/go-cache-working-set.test.sh

      # Beside the check above, and needing no Go and no Bun of its own: its fixtures list each
      # program with a stand-in bunx.
      - name: Test the TypeScript filter check
        if: inputs.changes-result != 'success' || inputs.check_ts_filters_test == 'true'
        run: .github/scripts/check-ts-filters.test.sh

      # Beside the two checks above, and needing no Go either: every case is text, read by the
      # line and step readers of .github/scripts/go-test-step-expansion.py (the step reader over
      # every go test step of ci.yaml and the workflows its jobs call, so a step it would refuse
      # fails here), or the hash of a script that file's AUDITED_SCRIPTS pins. The script's own
      # run compiles the three Go modules it covers and is run by hand rather than by any job.
      - name: Test the go test step expansion
        if: inputs.changes-result != 'success' || inputs.go_test_step_expansion_test == 'true'
        run: .github/scripts/go-test-step-expansion.test.sh

      # The label terms of ci.yaml's changes outputs, evaluated from ci.yaml itself: full-ci, the
      # lane labels and a label that names nothing. After the fetch above: the filter names are the
      # computed filters'.
      - name: Test the router outputs' label terms
        if: inputs.changes-result != 'success' || inputs.ci_router_outputs_test == 'true'
        env:
          CI_FILTERS_FILE: ${{ runner.temp }}/ci-filters/ci-filters.computed.yaml
        run: .github/scripts/ci-router-outputs.test.sh

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: test
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}

  tooling-checks:
    if: inputs.job == 'tooling-checks'
    runs-on: ubuntu-24.04-arm
    # The steps the test job ran before the split, less its tests: the same Bun install, and the
    # builds, lints and typechecks that ran beside the harnesses. No run has measured them apart
    # yet, so the limit stays the one they ran under there.
    timeout-minutes: 30
    env:
      JOB_TIMEOUT_MINUTES: 30 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The very command release.yaml's claude_envoy_build runs, so a pull request whose source
      # that job would refuse fails this job, and with it the required ci-ok, instead of merging
      # and then failing every release. What it builds and checks:
      # packages/claude-envoy/scripts/verify-build.sh.
      - name: Build, check and pack the Claude Code plugin as the release does
        run: bun run verify-build "$RUNNER_TEMP/claude-envoy-built.tar"
        working-directory: packages/claude-envoy

      # release.yaml's $CLAUDE_ENVOY_VERSION_ARGS covers scripts/build-inputs.txt, so a build input
      # missing from it is one no release bumps a version for.
      - name: Check the Claude Code plugin's build input list covers what the build reads
        run: bun test tests/build-inputs.test.ts
        working-directory: packages/claude-envoy

      # The step below renders this checkout's own fragments with changie.
      - uses: ./.github/actions/install-changie

      # Nothing renders a changelog fragment between the merge and the release that first ships
      # it, so a fragment changie refuses would fail that release's build job, and every run
      # after it, until a fix merges. This renders every fragment of every listed package here
      # instead, inside a required check. It runs in this job rather than beside fold-orphans in
      # lint because this job installs changie.
      - name: Check every changelog fragment renders
        run: |
          # shellcheck disable=SC2046 # the file is the package list, split on purpose
          .github/scripts/release-push.sh fold-check $(<.github/changelog-packages)

      # The guides' own layout, in this job because it installs Bun's dependencies, which the
      # test's Markdown parser needs (scripts/semantic-line-breaks.guides.test.ts:6-8). The
      # step has a filter of its own, guide_layout, naming the five guides the test reads and
      # the checker it spawns: no other step of this job reads one of them, so a run that
      # changed none of them skips this step.
      - name: Check the guides' semantic line breaks
        if: inputs.changes-result != 'success' || inputs.guide_layout == 'true'
        run: bun test scripts/semantic-line-breaks.guides.test.ts

      - name: Lint the Dispatch census script
        run: bunx biome check --error-on-warnings scripts/dispatch

      # scripts/dispatch is no workspace; the root package pins its TypeScript and Bun types.
      - name: Typecheck the Dispatch census script
        run: bunx tsc --noEmit -p scripts/dispatch

      - name: Lint the GitHub App registration script
        run: bunx biome check --error-on-warnings scripts/github-apps

      # scripts/github-apps is no workspace either; the root package pins its TypeScript and Bun types.
      - name: Typecheck the GitHub App registration script
        run: bunx tsc --noEmit -p scripts/github-apps

      - name: Lint the session message-wait script
        run: bunx biome check --error-on-warnings scripts/sessions

      # scripts/sessions is no workspace either; the root package pins its TypeScript and Bun types.
      # The suite itself is .github/workflows/ci-job-sessions-script.yaml's: it creates a
      # session-store database of its own and refuses without one.
      - name: Typecheck the session message-wait script
        run: bunx tsc --noEmit -p scripts/sessions

      - name: Lint the approval-eval statistics
        run: bunx biome check --error-on-warnings scripts/approval-eval

      # scripts/approval-eval is no workspace either; the root package pins its TypeScript and Bun types.
      - name: Typecheck the approval-eval statistics
        run: bunx tsc --noEmit -p scripts/approval-eval

      # scripts/e2e/lib is no workspace either: its tsconfig.json holds the plan ratings read's
      # test, whose answer is typed to the contract, and the root package pins its TypeScript and
      # Bun types. The test itself runs in the test job's bun test of scripts/e2e/lib.
      - name: Typecheck the plan ratings read test
        run: bunx tsc --noEmit -p scripts/e2e/lib

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: tooling-checks
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
