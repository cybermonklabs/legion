name: CI job contracts

# The steps of ci.yaml's `contracts` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

jobs:
  contracts:
    runs-on: ubuntu-24.04-arm
    # At least the job's sum over its 20 newest green merge-group runs up to 2026-11-15: its other
    # steps at their longest, 43 s, 5 s of its clock over them, and its test step's longest, 6 s,
    # plus the package script's two guards, 20 s (raised from 15 s by its reading at 24b2e96b28,
    # builds Job g4b-co-first, which package.json's `//` note gives) and the 2 s of its second
    # command, which runs main's src/build-entries.test.ts (#4538) alone: 76 s in all. With that
    # second command in it, the test step took 4 s at acf34b3558 (job 136612737476 of run
    # 44829908297). Between that tree and 1c711353dc, bun.lock, packages/test-fixtures/package.json
    # and packages/test-fixtures/src/timer-record.ts changed, and this job reads all three (its
    # install reads the lockfile and every workspace manifest, and the test-fixtures sources are
    # its reads); no contracts row loads the timer record, so the reading stands.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Typecheck contracts
        run: bun run typecheck
        working-directory: packages/contracts
      - name: Test contracts
        run: bun run test
        working-directory: packages/contracts
      - name: Check the Dispatch API types are generated from the OpenAPI document
        run: bun run check:api
        working-directory: packages/contracts
      - name: Build contracts
        run: bun run build
        working-directory: packages/contracts

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: contracts
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
