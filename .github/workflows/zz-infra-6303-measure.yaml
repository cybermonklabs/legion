name: zz INFRA-6303 changes-job generation timing and harnesses (throwaway, not for merge)

# A throwaway measurement for INFRA-6303's pull request, pushed once on legion/INFRA-6303 before the
# pull request opens and deleted by the next commit, so no pull request head and no squash of it
# holds this file. Each leg replays the changes job's steps up to the filter generation on its own
# ubuntu-24.04-arm runner, at main's a36aa52d (the merge base) or at the commit this one sits on
# (the change), all legs in the same window. Two legs then run the three harnesses the change edits,
# and one leg takes node_modules/.bin/tsgo away to show what the listing does without it.
on:
  push:
    branches: [legion/INFRA-6303]

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.tree }} ${{ matrix.i }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tree: [base, head]
        i: [1, 2, 3, 4, 5]
        include:
          - tree: head-no-tsgo
            i: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check out the tree this leg measures
        env:
          TREE: ${{ matrix.tree }}
        run: |
          if [ "$TREE" = base ]; then
            git fetch -q --no-tags --depth=1 origin a36aa52dc8d84d32b171f09cfeb85dcd11bbd859
            git checkout -q --detach a36aa52dc8d84d32b171f09cfeb85dcd11bbd859
          else
            git checkout -q --detach HEAD~1
          fi
          echo "MEASURE tree=$TREE commit=$(git rev-parse HEAD)"
      - name: Install the Go packages/daemon/go.mod names
        run: .github/scripts/go-install-archive.sh packages/daemon/go.mod
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Take node_modules/.bin/tsgo away
        if: matrix.tree == 'head-no-tsgo'
        run: |
          rm -f node_modules/.bin/tsgo
          if command -v tsgo; then echo "a tsgo is on PATH" >&2; exit 1; fi
          echo "node_modules/.bin/tsgo removed, and no tsgo is on PATH"
      - name: Compute every filter from what each job reads
        env:
          TREE: ${{ matrix.tree }}
          LEG: ${{ matrix.i }}
        run: |
          # The leg without tsgo points Bun's registry at a closed port, so a fetch would fail with a
          # connection error the log shows, rather than reach npm.
          if [ "$TREE" = head-no-tsgo ]; then export BUN_CONFIG_REGISTRY=http://127.0.0.1:9/; fi
          s=$(date +%s%N)
          .github/scripts/ci-filters-generate.sh "$RUNNER_TEMP/ci-filters.yaml"
          e=$(date +%s%N)
          echo "MEASURE tree=$TREE leg=$LEG commit=$(git rev-parse HEAD) step_ms=$(( (e - s) / 1000000 ))"
          echo "MEASURE first line: $(head -1 "$RUNNER_TEMP/ci-filters.yaml")"
      - name: Run the three harnesses the change edits
        if: matrix.i == 1 && matrix.tree != 'head-no-tsgo'
        env:
          CI_FILTERS_FILE: ${{ runner.temp }}/ci-filters.computed.yaml
        run: |
          status=0
          for h in check-ci-filters check-ts-filters ci-router-outputs; do
            s=$(date +%s)
            code=0
            .github/scripts/$h.test.sh > "$RUNNER_TEMP/$h.log" 2>&1 || code=$?
            [ "$code" -eq 0 ] || status=1
            echo "HARNESS $h exit=$code secs=$(( $(date +%s) - s )) $(grep -a -E '^Results:' "$RUNNER_TEMP/$h.log" | tail -1)"
          done
          tok=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          echo "::stop-commands::$tok"
          for h in check-ci-filters check-ts-filters ci-router-outputs; do
            echo "==== $h"
            cat "$RUNNER_TEMP/$h.log"
          done
          echo "::$tok::"
          exit "$status"
