name: PR Title

# Checks that a pull request's title, body, branch name, commits, comments and reviews name
# nothing private and that its title is a conventional commit subject (check-pr-text.sh). It lives
# apart from the lint, typecheck and test jobs of ci.yaml (LEGION-90) so that an edit, which a
# Legion round makes several times, does not re-run them at an unchanged head. An edit (title or
# body) of the pull request runs it, draft or not; that is the one event it runs on. Each run
# reports `pr-title` on the pull request's head, which main's ruleset requires, as the job's own
# check run: the job is named for the check, and this workflow holds no `checks: write`.
#
# What it leaves to ci.yaml, and why. Both workflows report `pr-title` as a job's own check run,
# which GitHub puts in that job's run's own check suite whatever else runs at the commit, so
# which suite is the older at a head decides nothing here; .github/scripts/post-check-run.sh's
# header says what a check run POSTed with `POST /repos/.../check-runs` does instead, and why
# neither required check is posted any more. What keeps the triggers below out of this file is
# therefore what each would cost, not the suite a pull request's head carries anyway:
#   * no merge_group. `.github/workflows/ci.yaml#pr-title` job runs on the group, checks the queued pull request's
#     text there (it finds the pull request the group's branch names with find-pr-payload.sh) and
#     carries `pr-title` on the group's commit as its own check run. The queue needs that report:
#     a required check that does not
#     report on the merge group fails the group ("The merge will fail as the required status check
#     will not be reported",
#     https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/managing-a-merge-queue#triggering-merge-group-checks-with-github-actions).
#     A run here would report the same verdict a second time, and ci.yaml is the only workflow a
#     merge group starts.
#   * no `opened` and no `reopened`. ci.yaml runs on both, and its `pr-title` job checks the same
#     text and carries `pr-title` on the same head, so a run here is a second run of the same
#     check at the same head: it buys work, not suites. It is the trigger that is left out and
#     not the job, because a job-level `if:` would not do it: GitHub creates the run, and its
#     check suite, before it reads one. At the draft heads f5fc75a0 and e26c2054, where every job
#     of ci.yaml is skipped, that run still holds a suite of 30 skipped check runs
#     (114131780811 and 113923512090) — a skipped job is a suite all the same.
# That costs a fork's pull request nothing: `.github/workflows/ci.yaml#pr-title` job runs on a fork's pull request
# as on any other, and a job's check run needs no token scope, so the check lands on a fork's head
# too. A fork's change reaches the merge queue only once a maintainer takes the branch into this
# repository, where every event is same-repo again.
#
# `edited` is this workflow's for every head: ci.yaml does not run on it, so nothing else checks
# the text an edit brings before the next push.
#
# A push starts no run here: `.github/workflows/ci.yaml#pr-title` job, which runs at every push to a pull request
# that is not a draft and when a draft is marked ready, runs the same check and carries `pr-title`
# on the new head as its own check run, so a run of this workflow at every push would be a second
# run of a check CI has made already. A draft's new head has no
# `pr-title` until it is marked ready or edited, and a draft cannot merge.
#
# A review, a comment and a review comment start no run either (dispatch://INFRA-1825). Every run
# reads every issue comment, review and review comment, as `.github/workflows/ci.yaml#pr-title` job does, so the
# text a review brings is checked by the next push's run, the next edit's run and the merge
# queue's group, and the group's run is the one the merge waits for. A run a review started
# bought only an earlier verdict, and it delayed the merge: GitHub keys a head's checks by name,
# workflow and event (docs/solutions/github/a-head-is-green-by-the-newest-run-of-each-check-name-workflow-and-event-INFRA-256.md),
# so the review run, waiting for a runner, held the required `pr-title` pending, and the merge
# queue took the pull request only once it passed. Of the 40 pull requests merged from
# 2026-11-17T11:00Z to 2026-11-18T11:00Z, 17 had a green ci-ok before their approval and were
# enqueued within 5 minutes of the approval's review run passing, a median of 29.9 minutes after
# the approval. Legion's leak guard refuses a private name before a review is posted (the package
# doc of packages/daemon/internal/leakguard).
#
# A newer run that replaces an older one still waiting loses nothing, since it repeats every check
# on the title and body as they now are, and no run in progress is cancelled (the concurrency
# comment below). Anyone signed in can comment on a public pull request, so check-pr-text.sh, not
# an `if:`, decides whose text counts: a skipped job posts a `pr-title` that GitHub and the daemon
# (classify.RunResult) count as a pass, so a skipped run would turn a real failure green. The job
# carries no `if:` at all.
on:
  pull_request:
    types: [edited]

# `cancel-in-progress: false`: no run of this workflow cancels a run of it that is in progress,
# because this job's own check run is named `pr-title`, the name main's ruleset requires, and a
# cancelled check run of a required name is no pass: a cancelled run would leave that shape on
# the head until the next event replaced it. Measured on this pull request at 9a2a3f87, where
# four edits and review replies arriving while runs were in flight left four cancelled
# `pr-title` check runs beside the two that succeeded. A run here is seconds long and reads the
# title, body, comments and reviews as they are when it runs, so letting two of them finish
# costs a runner for those seconds and leaves two passing check runs rather than one passing and
# one cancelled. A run that has not started is GitHub's to drop: of the runs waiting on the
# group's running one it keeps the newest pending and cancels the one before it, which costs
# nothing here, since the newer run checks the title and body as they now are. A run here checks
# with the pull request's own copy of check-pr-text.sh, as ci.yaml's required `pr-title` job does
# (that file says when the job runs: at every push to a pull request that is not a draft, when a
# draft is marked ready, and on the merge queue's group). The one event here carries the pull
# request, so its number is the whole key.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# The job clones the repository for check-pr-text.sh, which reads through GitHub's GraphQL API the
# pull request's commits (`contents: read`), its reviews and review comments
# (`pull-requests: read`), and its issue comments (`issues: read`); it writes nothing.
permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      JOB_TIMEOUT_MINUTES: 10 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # The run checks out the pull request's merge ref, its GITHUB_REF, as ci.yaml's required
      # `pr-title` job does, so a pull request that changes the script is checked by its own
      # version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The title, body, commit messages, comments and reviews are as public as the tree
      # (check-pr-text.sh says where each lands), and the title must be a conventional commit
      # subject. `.github/workflows/ci.yaml#pr-title` job checks them too (that file says when it runs); this step
      # checks them at every edit: an edit's run reports `pr-title` on the head too, and one that
      # skipped the title would post a passing `pr-title` over a failed one. check-pr-text.sh reads
      # the run's own payload, GITHUB_EVENT_PATH as Actions writes it, since the event here carries
      # the pull request; find-pr-payload.sh, which `.github/workflows/ci.yaml#pr-title` job hands it instead, is
      # for the one event that does not, a merge group. It reads that file rather than the step's
      # environment, which the runner prints in the job log. PRIVATE_NAME_TERMS, a secret the
      # runner masks there, is the deployment's own list, which check-private-names.sh's fifth rule
      # reads; a fork's pull request runs without it, and the script warns that it did.
      # check-pr-text.sh runs by the checkout's own path, the form every job that holds the list
      # runs the check by, and runs check-private-names.sh from its own directory.
      - name: Check the title, body, branch name, commits, comments and reviews
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_NAME_TERMS: ${{ secrets.PRIVATE_NAME_TERMS }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/check-pr-text.sh"
