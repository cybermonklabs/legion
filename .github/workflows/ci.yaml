name: CI

# why: .github/ci-notes/ci.md#the-router-every-check-a-pull-request-or-the-merge-queue-runs

# why: .github/ci-notes/ci.md#why-the-router-runs-on-these-events-and-no-others
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      # why: .github/ci-notes/ci.md#the-migration-base-input
      migration-base:
        description: >-
          The commit main pointed at before the push this run tests. A run on main must name it;
          a run on another branch that names none compares with the branch's merge base with main.
        type: string
        required: false
      # why: .github/ci-notes/ci.md#the-kind-and-agent-harness-input
      kind-and-agent-harness:
        description: Run kind and agent-harness too, which a dispatched run leaves out otherwise.
        type: boolean
        required: false
        default: false

# why: .github/ci-notes/ci.md#the-routers-concurrency
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# why: .github/ci-notes/ci.md#why-the-routers-permissions-block-holds-those-two-scopes
permissions:
  contents: read
  actions: read
  checks: write

env:
  # why: .github/ci-notes/ci.md#the-go-jobs-module-proxy
  GOPROXY: https://proxy.golang.org|direct
  # why: .github/ci-notes/ci.md#what-ci_ok_selected_by-holds-and-which-programs-read-it
  CI_OK_SELECTED_BY: '{"tool-fallback-arm":"tool-fallback","daemon-go":"go-daemon","daemon-go-race":"go-daemon","claude-envoy-names":"pi","kind-image":"kind","envoy-go":"go-envoy-held","envoy-go-race":"go-envoy-held","envoy-go-race-api":"go-envoy-held","envoy-go-race-docs":"go-envoy-held","envoy-go-docs-finalizers":"go-envoy-held","dispatch-memory":"go-envoy-held"}'
  CI_OK_PULL_REQUEST_ONLY: '["worker-image", "dispatch-browser-pr"]'
  # why: .github/ci-notes/ci.md#the-jobs-that-run-on-every-change
  CI_OK_ALWAYS_RUN: '["changes", "lint"]'
  # why: .github/ci-notes/ci.md#the-jobs-outside-ci-oks-accounting
  CI_OK_EXEMPT: '["cancel-started", "ci-ok", "pr-title"]'

jobs:
  # why: .github/ci-notes/ci.md#what-the-changes-job-selects-and-the-two-terms-every-job-carries
  changes:
    name: ${{ github.event_name && 'changes' }}
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    # why: .github/ci-notes/ci.md#why-changes-pr-title-cancel-started-and-ci-ok-run-on-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env: {JOB_TIMEOUT_MINUTES: 10}
    # why: .github/ci-notes/ci.md#a-lane-label-turns-on-one-held-job-on-a-pull-request
    outputs:
      worker-image: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.worker-image == 'true' || steps.unnamed.outputs.found == 'true' }}
      kind: ${{ github.event_name == 'merge_group' && 'true' || github.event_name == 'workflow_dispatch' && inputs.kind-and-agent-harness && 'true' || github.event_name != 'pull_request' && steps.filter.outputs.kind || 'false' }}
      go-daemon: ${{ github.event_name != 'pull_request' && 'true' || (contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:daemon_go_tests')) && (steps.filter.outputs.go-daemon == 'true' || steps.unnamed.outputs.found == 'true') || 'false' }}
      plugin-pack: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.plugin-pack == 'true' || steps.unnamed.outputs.found == 'true' }}
      daemon-live: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.daemon-live == 'true' || steps.unnamed.outputs.found == 'true' }}
      agent-harness: ${{ github.event_name == 'merge_group' && 'true' || github.event_name == 'workflow_dispatch' && inputs.kind-and-agent-harness && 'true' || github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:agent_harness')) && (steps.filter.outputs.agent-harness == 'true' || steps.unnamed.outputs.found == 'true') || 'false' }}
      airlock-arm: ${{ github.event_name != 'pull_request' && 'true' || (contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:airlock_arm')) && (steps.filter.outputs.airlock-arm == 'true' || steps.unnamed.outputs.found == 'true') || 'false' }}
      go-envoy-held: ${{ github.event_name != 'pull_request' && 'true' || (contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_go') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_go_race') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_go_race_api') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_go_race_docs') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_go_claim_model') || contains(github.event.pull_request.labels.*.name, 'lane:dispatch_memory') || contains(github.event.pull_request.labels.*.name, 'lane:dispatch_multiprocess') || contains(github.event.pull_request.labels.*.name, 'lane:dispatch_two_builds') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_smoke')) && (steps.filter.outputs.go-envoy-held == 'true' || steps.unnamed.outputs.found == 'true') || 'false' }}
      envoy-held: ${{ github.event_name != 'pull_request' && 'true' || (contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_go_checks') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_infra_go')) && (steps.filter.outputs.envoy-held == 'true' || steps.unnamed.outputs.found == 'true') || 'false' }}
      ts: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.ts == 'true' || steps.unnamed.outputs.found == 'true' }}
      web-cold: ${{ github.event_name != 'pull_request' && 'true' || (contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:web_cold')) && (steps.filter.outputs.web-cold == 'true' || steps.unnamed.outputs.found == 'true') || 'false' }}
      pi: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.pi == 'true' || steps.unnamed.outputs.found == 'true' }}
      pi-held: ${{ github.event_name != 'pull_request' && 'true' || (contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:pi_legion')) && (steps.filter.outputs.pi-held == 'true' || steps.unnamed.outputs.found == 'true') || 'false' }}
      dispatch-browser: ${{ github.event_name != 'pull_request' && 'true' || (contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:dispatch_browser')) && (steps.filter.outputs.dispatch-browser == 'true' || steps.unnamed.outputs.found == 'true') || 'false' }}
      dispatch-browser-pr: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.dispatch-browser-pr == 'true' || steps.unnamed.outputs.found == 'true' }}
      docs: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.docs == 'true' || steps.unnamed.outputs.found == 'true' }}
      browser-image: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.browser-image == 'true' || steps.unnamed.outputs.found == 'true' }}
      ci-images: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.ci-images == 'true' || steps.unnamed.outputs.found == 'true' }}
      tool-fallback: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.tool-fallback == 'true' || steps.unnamed.outputs.found == 'true' }}
      notices: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.notices == 'true' || steps.unnamed.outputs.found == 'true' }}
      scripts: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.scripts == 'true' || steps.unnamed.outputs.found == 'true' }}
      scripts-held: ${{ github.event_name != 'pull_request' && 'true' || (contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:test')) && (steps.filter.outputs.scripts-held == 'true' || steps.unnamed.outputs.found == 'true') || 'false' }}
      go-envoy: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.go-envoy == 'true' || steps.unnamed.outputs.found == 'true' }}
      text-checks: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.text-checks == 'true' || steps.unnamed.outputs.found == 'true' }}
      # why: .github/ci-notes/ci.md#the-paths-filters-own-verdict-for-every-filter
      filter_verdicts: ${{ github.event_name == 'workflow_dispatch' && '{}' || toJSON(steps.filter.outputs) }}
      unnamed_files: ${{ steps.unnamed.outputs.found }}
      # why: .github/ci-notes/ci.md#a-dispatched-runs-check-names
      ref_is_main: ${{ steps.ref.outputs.is_main }}
    steps:
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/ci-areas.yaml
            .github/scripts/unnamed-files.sh
            .github/scripts/gh-read.sh
            .github/scripts/workflow_paths.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # why: .github/ci-notes/ci.md#the-filter-step
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: some-with-excludes
          filters: .github/ci-areas.yaml
      - name: Select every job when a changed file matches no filter
        id: unnamed
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: .github/scripts/unnamed-files.sh .github/ci-areas.yaml
      - name: Read whether this run's ref is exactly refs/heads/main
        id: ref
        run: if [ "$GITHUB_REF" = refs/heads/main ]; then echo is_main=true; else echo is_main=false; fi >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env: {JOB_TIMEOUT_MINUTES: '${{ matrix.timeout }}'}
    # why: .github/ci-notes/ci.md#the-lint-jobs-scopes
    permissions: {contents: read, actions: read, checks: write, pull-requests: read}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: lint, name: lint / lint, runner: ubuntu-24.04-arm, timeout: 30}
          - {leg: private-names, name: lint / private-names, runner: ubuntu-24.04, timeout: 10}
          - {leg: typecheck, name: typecheck / typecheck, runner: ubuntu-24.04-arm, timeout: 10}
    steps:
      # why: .github/ci-notes/ci.md#the-steps-and-services-every-job-repeats-are-yaml-anchors
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - {if: matrix.leg == 'lint', uses: ./.github/actions/lint/lint}
      - name: private-names
        if: matrix.leg == 'private-names'
        env: {PRIVATE_NAME_TERMS: '${{ secrets.PRIVATE_NAME_TERMS }}'}
        run: '"$GITHUB_WORKSPACE/.github/scripts/check-private-names.sh"'
      - {if: matrix.leg == 'typecheck', uses: ./.github/actions/lint/typecheck}
      - &report {if: always(), uses: ./.github/actions/ci-ok-report, with: {changes: '${{ toJSON(needs.changes) }}', job-status: '${{ job.status }}'}}

  # why: .github/ci-notes/ci.md#the-fail-open-jobs
  scripts:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.scripts == 'true') }}
    name: ${{ format('{0} / {0}', matrix.leg) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ matrix.timeout }}
    env: {JOB_TIMEOUT_MINUTES: '${{ matrix.timeout }}'}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: tooling-checks, timeout: 30}
          - {leg: private-names-port, timeout: 20}
          - {leg: conflicts-script, timeout: 360}
          - {leg: sessions-script, timeout: 10, pg: true}
    services:
      postgres:
        image: ${{ matrix.pg && 'ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11' || '' }}
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - *checkout
      - {uses: ./.github/actions/scripts, with: {leg: '${{ matrix.leg }}'}}
      - *report

  # why: .github/ci-notes/ci.md#what-the-test-job-runs-and-how-each-harness-step-is-gated
  scripts-held:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.scripts-held == 'true') }}
    name: ${{ github.event_name && 'test / test' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env: {JOB_TIMEOUT_MINUTES: 30}
    steps:
      - *checkout
      - uses: ./.github/actions/scripts/test
      - *report

  ci-images:
    needs: changes
    if: needs.changes.outputs.ci-images == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ github.event_name && 'ci-images / ci-images' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env: {JOB_TIMEOUT_MINUTES: 25}
    # why: .github/ci-notes/ci.md#why-the-ci-images-job-holds-packages-write
    permissions: {contents: read, packages: write, actions: read, checks: write}
    steps:
      - *checkout
      - name: ci-images
        uses: ./.github/actions/ci-images
      - *report

  tool-fallback:
    needs: [changes, ci-images]
    if: ${{ !cancelled() && needs.changes.outputs.tool-fallback == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    name: ${{ github.event_name && 'tool-fallback / tool-fallback' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: {JOB_TIMEOUT_MINUTES: 25}
    steps:
      - *checkout
      - {id: origin, uses: ./.github/actions/tool-fallback/start}
      - {id: jj-primary, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-jj, env: {CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: jj-primary, steps: '${{ toJSON(steps) }}'}}
      - {id: mark-base-crane, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: base-crane, continue-on-error: true, timeout-minutes: 11, uses: ./base/.github/actions/install-crane, env: {CI_TOOLS_GHCR_BASE: 'http://127.0.0.1:1', CI_TOOLS_NPM_BASE: 'http://127.0.0.1:1'}}
      - {id: mark-base-changie, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: base-changie, continue-on-error: true, timeout-minutes: 11, uses: ./base/.github/actions/install-changie, env: {CI_TOOLS_GHCR_BASE: 'http://127.0.0.1:1', CI_TOOLS_NPM_BASE: 'http://127.0.0.1:1'}}
      - {id: mark-base-jj, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: base-jj, continue-on-error: true, timeout-minutes: 11, uses: ./base/.github/actions/install-jj, env: {CI_TOOLS_GHCR_BASE: 'http://127.0.0.1:1', CI_TOOLS_NPM_BASE: 'http://127.0.0.1:1'}}
      - {id: mark-base-bun, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: base-bun, continue-on-error: true, timeout-minutes: 11, uses: ./base/.github/actions/setup-bun, env: {CI_TOOLS_GHCR_BASE: 'http://127.0.0.1:1', CI_TOOLS_NPM_BASE: 'http://127.0.0.1:1'}}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: base-bun, steps: '${{ toJSON(steps) }}'}}
      - {id: mark-base-elan, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: base-elan, continue-on-error: true, timeout-minutes: 11, uses: ./base/.github/actions/install-elan, env: {CI_TOOLS_GHCR_BASE: 'http://127.0.0.1:1', CI_TOOLS_NPM_BASE: 'http://127.0.0.1:1'}}
      - {id: mark-base-uv, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: base-uv, continue-on-error: true, timeout-minutes: 11, uses: ./base/.github/actions/install-uv, env: {CI_TOOLS_URL_BASE: 'http://127.0.0.1:1'}}
      - {id: mark-nowhere-pulumi-docker, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: nowhere-pulumi-docker, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-docker-plugin, env: {CI_TOOLS_URL_BASE: 'http://127.0.0.1:1'}}
      - {id: mark-base-pulumi, run: 'echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"'}
      - {id: base-pulumi, continue-on-error: true, timeout-minutes: 11, uses: ./base/.github/actions/install-pulumi, env: {http_proxy: 'http://127.0.0.1:1', https_proxy: 'http://127.0.0.1:1'}}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: nowhere, steps: '${{ toJSON(steps) }}'}}
      - {timeout-minutes: 11, uses: ./.github/actions/install-crane, env: {CI_TOOLS_PROOF_FULL_LADDER: crane-head}}
      - {timeout-minutes: 11, uses: ./.github/actions/install-changie}
      - {timeout-minutes: 11, uses: ./.github/actions/install-jj}
      - {timeout-minutes: 11, uses: ./.github/actions/setup-bun}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: head-bun, steps: '${{ toJSON(steps) }}'}}
      - {timeout-minutes: 11, uses: ./.github/actions/install-elan}
      - {timeout-minutes: 11, uses: ./.github/actions/install-uv}
      - {id: docker-plugin, timeout-minutes: 11, uses: ./.github/actions/install-docker-plugin}
      - {timeout-minutes: 11, uses: ./.github/actions/install-pulumi, env: {CI_TOOLS_URL_BASE: 'http://127.0.0.1:1', CI_TOOLS_GITHUB_BASE: '${{ steps.origin.outputs.github }}'}}
      - {timeout-minutes: 11, uses: ./.github/actions/install-helm}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: head, steps: '${{ toJSON(steps) }}'}}
      - {id: crane-primary, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-crane, env: {CI_TOOLS_GITHUB_BASE: '${{ steps.origin.outputs.github }}', CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: crane-primary, steps: '${{ toJSON(steps) }}'}}
      - {id: crane-second-source, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-crane, env: {CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: crane-second-source, steps: '${{ toJSON(steps) }}'}}
      - {id: changie-primary, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-changie, env: {CI_TOOLS_GITHUB_BASE: '${{ steps.origin.outputs.github }}', CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: changie-primary, steps: '${{ toJSON(steps) }}'}}
      - {id: changie-second-source, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-changie, env: {CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: changie-second-source, steps: '${{ toJSON(steps) }}'}}
      - {id: jj-second-source, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-jj, env: {CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: jj-second-source, steps: '${{ toJSON(steps) }}'}}
      - {id: bun-primary, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/setup-bun}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: bun-primary, steps: '${{ toJSON(steps) }}'}}
      - {id: bun-second-source, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/setup-bun, env: {CI_TOOLS_NPM_BASE: '${{ steps.origin.outputs.npm }}'}}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: bun-second-source, steps: '${{ toJSON(steps) }}'}}
      - {id: elan-primary, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-elan, env: {CI_TOOLS_GITHUB_BASE: '${{ steps.origin.outputs.github }}', CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: elan-primary, steps: '${{ toJSON(steps) }}'}}
      - {id: elan-second-source, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-elan, env: {CI_TOOLS_GHCR_BASE: '${{ steps.origin.outputs.ghcr }}'}}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: elan-second-source, steps: '${{ toJSON(steps) }}'}}
      - {id: uv-primary, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-uv, env: {CI_TOOLS_GITHUB_BASE: '${{ steps.origin.outputs.github }}', CI_TOOLS_URL_BASE: '${{ steps.origin.outputs.url }}'}}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: uv-primary, steps: '${{ toJSON(steps) }}'}}
      - {id: uv-second-source, continue-on-error: true, timeout-minutes: 11, uses: ./.github/actions/install-uv, env: {CI_TOOLS_URL_BASE: '${{ steps.origin.outputs.url }}'}}
      - {uses: ./.github/actions/tool-fallback/x64, with: {after: uv-second-source, steps: '${{ toJSON(steps) }}'}}
