      # extensions/card-delivery-omp.test.ts and extensions/tmux-place-omp.test.ts run the pinned
      # Oh My Pi against stand-ins (packages/pi-shared/test/omp-harness.ts) and refuse on GitHub
      # Actions without one. The pin is read from .omp-pin, the repository's one copy of it
      # (.github/actions/install-omp).
      # install-omp's own retry arithmetic: its `mise install`, 5 x 60 + 150 = 450 s -> 8 min.
      - uses: ./.github/actions/install-omp
        timeout-minutes: 8
      # extensions/tmux-place-omp.test.ts runs that binary in a pane of a tmux server of its own,
      # the only way the place a session registers can be read from the session itself, and refuses
      # on GitHub Actions without a tmux.
      # Both apt phases retry through .github/scripts/ci-retry.sh, in the spelling the test job's
      # own tmux install carries, for the same runner image and the same indexes; that step's
      # comment holds the whole reasoning — the inner `sudo timeout` is what bounds an attempt,
      # the unpack after the download takes no network and stays bare, and
      # `-o APT::Update::Error-Mode=any` is what leaves retry_fetch something to retry.
      - name: Install tmux
        # Its own retry arithmetic, so an exhausted phase fails this step by name rather than
        # being cut part way by the job: the index read's 5 x 95 + 150 = 625 s and the package
        # download's 5 x 125 + 150 = 775 s, 1400 s -> 24 min.
        timeout-minutes: 24
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "apt's package lists" 95 -- \
            sudo timeout 90 apt-get update -o APT::Update::Error-Mode=any
          retry_fetch "tmux" 125 -- \
            sudo timeout 120 apt-get install -y --no-install-recommends -d tmux
          sudo apt-get install -y --no-install-recommends tmux
      # Retried like every install in this workflow (the header's Retries note); 180 s per
      # attempt, the bound every Bun install of this repository's CI carries: 20.70 s cold on a
      # pod, against at most 11 s over 180 observations in CI.
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
