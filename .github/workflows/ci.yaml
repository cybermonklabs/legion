              # counts the workflow file holding a build step among the image's inputs, so a
              # change to it must start the build.
              - '.github/workflows/ci-job-envoy-smoke.yaml'
              # The image: the Dockerfile, its context's .dockerignore, the web stage's frozen
              # install (every workspace manifest and the tarball packages/proof-editor/package.json
              # installs proof-sdk-upstream from) and the Bun pin that stage holds its own Bun to,
              # the packages it builds the SPA from, and the notices scripts.
              - '.dockerignore'
              - '.bun-version'
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - 'packages/proof-editor/proof-sdk-*.tgz'
              - 'packages/envoy-client/package.json'
              - 'packages/broker-client/package.json'
              - 'packages/pi-envoy/package.json'
              - 'packages/pi-legion/package.json'
              - 'packages/pi-shared/package.json'
              - 'packages/claude-envoy/package.json'
              - 'packages/test-fixtures/package.json'
              - 'docs/site/package.json'
              - 'packages/contracts/**'
              - 'packages/dispatch/**'
              - 'packages/proof-editor/**'
              - 'scripts/third-party-notices.ts'
              - 'scripts/go-third-party-notices.sh'
              - 'scripts/assemble-third-party-notices.sh'
              # The Envoy module, which the image's Go stage copies whole, and the envoy-infra
              # module under it, which the held-port image's build copies whole with it
              # (packages/envoy/infra/host/heldportwrapper/Dockerfile and its .dockerignore) and
              # envoy-infra's host live tests and plugin build compile in packages/envoy/infra's own
              # workspace. The two `!` patterns below leave out deploy and the changelog fragments,
              # which neither .dockerignore lets in; the generated block leaves out the test files
              # (internal/integration holds nothing else).
              - 'packages/envoy/**'
              # TestSmoke compiles in the root workspace.
              - 'go.work'
              - 'go.work.sum'
              - 'packages/daemon/go.mod'
              - 'packages/daemon/go.sum'
              - '!packages/envoy/deploy/**'
              - '!packages/envoy/.changes/**'
              # The Pulumi CLI the live tests run, the docker provider plugin the step before them
              # downloads, and the image pull before the build and tests. Both of those installs
              # read their row of the tool manifest through the fetch helper.
              - '.github/actions/install-pulumi/**'
              - '.github/actions/install-docker-plugin/**'
              - '.github/ci-tools.yaml'
              - '.github/scripts/ci-tools.sh'
              - '.github/actions/pull-test-images/**'
              # The download URL the schema step stamps into the plugin and asserts on.
              - '.github/scripts/repo-paths.sh'
              # The disk the live tests leave: the two steps around them run this sampler.
              - '.github/scripts/disk_watch.py'
              # BEGIN generated by `.github/scripts/check-ci-filters.sh write`: a change to a Go test file the job this filter gates does not read
              # must not select it. An edit by hand is refused (rule 17 of that check), which writes these.
              - '!packages/envoy/agentloop/**/*_test.go'
              - '!packages/envoy/brokeraddr/**/*_test.go'
              - '!packages/envoy/clitest/**/*_test.go'
              - '!packages/envoy/cmd/**/*_test.go'
              - '!packages/envoy/dispatchbody/**/*_test.go'
              - '!packages/envoy/going/**/*_test.go'
              - '!packages/envoy/infra/aws/**/*_test.go'
              - '!packages/envoy/infra/cmd/**/*_test.go'
              - '!packages/envoy/infra/core/**/*_test.go'
              - '!packages/envoy/infra/gcp/**/*_test.go'
              - '!packages/envoy/infra/host/heldportwrapper/**/*_test.go'
              - '!packages/envoy/infra/internal/**/*_test.go'
              - '!packages/envoy/infra/provider/**/*_test.go'
              - '!packages/envoy/infra/render/**/*_test.go'
              - '!packages/envoy/infra/seed/**/*_test.go'
              - '!packages/envoy/internal/broker/**/*_test.go'
              - '!packages/envoy/internal/brokerclient/**/*_test.go'
              - '!packages/envoy/internal/brokertoken/**/*_test.go'
              - '!packages/envoy/internal/bus/**/*_test.go'
              - '!packages/envoy/internal/cistore/**/*_test.go'
              - '!packages/envoy/internal/cmdtest/**/*_test.go'
              - '!packages/envoy/internal/config/**/*_test.go'
              - '!packages/envoy/internal/contracts/**/*_test.go'
              - '!packages/envoy/internal/ctxlock/**/*_test.go'
              - '!packages/envoy/internal/dedupe/**/*_test.go'
              - '!packages/envoy/internal/dispatch/**/*_test.go'
              - '!packages/envoy/internal/envconf/**/*_test.go'
              - '!packages/envoy/internal/fileowner/**/*_test.go'
              - '!packages/envoy/internal/fold/**/*_test.go'
              - '!packages/envoy/internal/ghrename/**/*_test.go'
              - '!packages/envoy/internal/googleidentity/**/*_test.go'
              - '!packages/envoy/internal/goroutinetest/**/*_test.go'
              - '!packages/envoy/internal/integration/**/*_test.go'
              - '!packages/envoy/internal/kvwatch/**/*_test.go'
              - '!packages/envoy/internal/legionagents/**/*_test.go'
              - '!packages/envoy/internal/logging/**/*_test.go'
              - '!packages/envoy/internal/mcpbridge/**/*_test.go'
              - '!packages/envoy/internal/metrics/**/*_test.go'
              - '!packages/envoy/internal/oidc/**/*_test.go'
              - '!packages/envoy/internal/pglisten/**/*_test.go'
              - '!packages/envoy/internal/pgmigrate/**/*_test.go'
              - '!packages/envoy/internal/ratelimit/**/*_test.go'
              - '!packages/envoy/internal/redact/**/*_test.go'
              - '!packages/envoy/internal/roles/**/*_test.go'
              - '!packages/envoy/internal/routing/**/*_test.go'
              - '!packages/envoy/internal/runnerlog/**/*_test.go'
              - '!packages/envoy/internal/serverwait/**/*_test.go'
              - '!packages/envoy/internal/session/**/*_test.go'
              - '!packages/envoy/internal/stacktest/**/*_test.go'
              - '!packages/envoy/internal/store/**/*_test.go'
              - '!packages/envoy/internal/testnats/**/*_test.go'
              - '!packages/envoy/internal/testport/**/*_test.go'
              - '!packages/envoy/internal/testtmp/**/*_test.go'
              - '!packages/envoy/internal/textcheck/**/*_test.go'
              - '!packages/envoy/internal/verify/**/*_test.go'
              - '!packages/envoy/internal/webhook/**/*_test.go'
              - '!packages/envoy/internal/weborigin/**/*_test.go'
              - '!packages/envoy/internal/wirecheck/**/*_test.go'
              - '!packages/envoy/listenerwire/**/*_test.go'
              - '!packages/envoy/listenfd/**/*_test.go'
              - '!packages/envoy/loadtest/**/*_test.go'
              - '!packages/envoy/migrationid/**/*_test.go'
              - '!packages/envoy/natscred/**/*_test.go'
              - '!packages/envoy/natsgrant/**/*_test.go'
              - '!packages/envoy/natsversion/**/*_test.go'
              - '!packages/envoy/roleholder/**/*_test.go'
              - '!packages/envoy/steprecord/**/*_test.go'
              # END generated
            # Every file packages/daemon/docker/worker.Dockerfile builds from, for the worker-image
            # job (.github/workflows/worker-image.yaml, which the build reads too): the root
            # manifest, lockfile, patches and every workspace manifest the plugin stage's frozen
            # install copies; the packages it copies whole (the daemon with the Dockerfile, the two
            # plugins and the workspace packages they inline, the Claude Code plugin, whose source
            # the plugin stage builds into the image's dist/ and legion/ with the .bun-version that
            # build is pinned to, the skills and the prepack that stages them); the Go workspace; packages/envoy, copied whole for its agent-secrets
            # binary but for packages/envoy/infra, which the .dockerignore drops, so each of its
            # top-level directories but infra is named; the scripts that write the image's
            # third-party notices; the Oh My Pi pin; and the context's .dockerignore. Then a `!`
            # pattern for each .dockerignore line that drops part of those packages, of
            # packages/envoy or of skills/, which the step's some-with-excludes reads as an
            # exclusion, so a pull request touching only files the build does not read builds no
            # image.
            # .github/scripts/check-image-trigger-paths.sh fails the build when this list misses a
            # file the image build reads, including a new top-level directory of packages/envoy, or
            # matches a file it does not read other than the two workflow files; it reads this
            # filter only as a flat list, so the one anchor it names is ci_router, which stands
            # for a single glob and leaves the list flat.
            worker_image:
              - *ci_router
              - '.github/workflows/worker-image.yaml'
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - 'packages/claude-envoy/**'
              - 'packages/proof-editor/package.json'
              - 'packages/proof-editor/proof-sdk-*.tgz'
              - 'packages/dispatch/package.json'
              - 'packages/test-fixtures/package.json'
              - 'docs/site/package.json'
              - 'packages/daemon/**'
              - 'packages/pi-envoy/**'
              - 'packages/pi-legion/**'
              - 'packages/pi-shared/**'
              - 'packages/envoy-client/**'
              - 'packages/broker-client/**'
              - 'packages/contracts/**'
              - 'skills/**'
              - 'go.work'
              - 'go.work.sum'
              - 'packages/envoy/*'
              - 'packages/envoy/agentloop/**'
              - 'packages/envoy/brokeraddr/**'
              - 'packages/envoy/brokerclient/**'
              - 'packages/envoy/brokertest/**'
              - 'packages/envoy/clitest/**'
              - 'packages/envoy/cmd/**'
              - 'packages/envoy/deploy/**'
              - 'packages/envoy/dispatchbody/**'
              - 'packages/envoy/docker/**'
              - 'packages/envoy/docs/**'
              - 'packages/envoy/going/**'
              - 'packages/envoy/internal/**'
              - 'packages/envoy/listenerwire/**'
              - 'packages/envoy/listenfd/**'
              - 'packages/envoy/loadtest/**'
              - 'packages/envoy/migrationid/**'
              - 'packages/envoy/natscred/**'
              - 'packages/envoy/natsgrant/**'
              - 'packages/envoy/roleholder/**'
              - 'packages/envoy/scripts/**'
              - 'packages/envoy/sessiontiming/**'
              - 'packages/envoy/subjectforms/**'
              - 'packages/envoy/natsversion/**'
              - 'packages/envoy/steprecord/**'
              - 'packages/envoy/testnatsimages/**'
              - '.omp-pin'
              - '.bun-version'
              - '.dockerignore'
              - 'scripts/pi-plugin-prepack.sh'
              - 'scripts/third-party-notices.ts'
              - 'scripts/go-third-party-notices.sh'
              - 'scripts/assemble-third-party-notices.sh'
              - '!**/node_modules/**'
              - '!**/dist/**'
              - '!**/build/**'
              - '!**/coverage/**'
              - '!**/docker-data/**'
              - '!skills/AGENTS.md'
              - '!packages/envoy/**/*_test.go'
              - '!packages/envoy/internal/integration/**'
              - '!packages/envoy/internal/smoke/**'
              - '!packages/envoy/deploy/**'
              - '!packages/envoy/infra/**'
              # Changelog fragments, which the packages above match and no build reads: .dockerignore
              # leaves them out of the context, so a pull request that only writes a changelog entry
              # builds no worker image, and a fragment stays where it was written, so no pattern
              # here matches nothing.
              - '!packages/*/.changes/**'
            # check-ci-filters.sh, which holds every filter of the three steps to what its job
            # reads: every file whose change can move a Go closure (Go code anywhere, the modules'
            # embedded files and testdata, every module and workspace file, the target lists the go
            # commands expand over), every workflow file, and the check's own script, engine, data,
            # rules and path model.
            ci_filters:
              # The directory rather than the workflows the check names one by one in
              # ci_job_reads.py's reads for this gate: its rules read every
              # workflow of it - ci_workflow_rules.check_one_merge_group_workflow refuses any but
              # this one that runs on merge_group, check_cache_round_trip holds every workflow's
              # restore of a family ci-caches.yaml fills to the fill's key, and ci_only_documents
              # reads them all to find the files only this one calls - and a rule that reads a
              # workflow has to run on the change that adds or edits one, which a list of the
              # names already there cannot select.
              - '.github/workflows/**'
              - '.github/scripts/check-ci-filters.sh'
              - '.github/scripts/ci_filter_coverage.py'
              - '.github/scripts/ci_job_reads.py'
              - '.github/scripts/ci_workflow_rules.py'
              - '.github/scripts/workflow_paths.py'
              # ci_job_reads.py runs it for each darwin vet's tag sets, and rule 20 imports it.
              - '.github/scripts/go_build_tags.py'
              - '.github/go-release-targets.json'
              - '.github/agent-secrets-client-targets.json'
              - '.github/envoy-infra-targets.json'
              # ci_job_reads.py reads the workspace list from the root manifest.
              - 'package.json'
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - '**/go.work'
              - '**/go.work.sum'
              - 'packages/daemon/**'
              - 'packages/envoy/**'
            # ci.yaml's tool-fallback and tool-fallback-arm jobs, the live proof of the second
            # source every tool install reads when the first source does not serve the bytes:
            # the manifest that names both sources of each row, the fetch helper every install
            # goes through, the filler and the gate beside it, the rig and the fault proxy it
            # drives, the eight actions it installs through, and the two files a row's version is
            # pinned in that the job itself reads (.bun-version for the bun rows and the
            # worker image's Dockerfile for mise, jj and uv).
            # packages/envoy/infra/internal/pulumitest/pulumitest.go, whose
            # `const DockerPluginVersion` the gate holds the pulumi-docker row's version to,
            # is not here and no step of either job reads it: a raise of that constant must
            # move the row, and .github/ci-tools.yaml is in this list.
            # One filter for the two jobs, as `envoy_go_race_docs` is for its two: the arm64
            # job drives the same action over the same manifest through the same helper, so a
            # change that selects one of them must select both, and one list cannot drift from
            # another that does not exist. Each job carries a gate of its own in
            # .github/scripts/ci_job_reads.py for what it reads.
            # Each job holds its steps in a called file of its own, which this list names beside
            # ci.yaml, where both jobs keep their gate.
            tool_fallback:
              - '.github/ci-tools.yaml'
              - '.github/scripts/ci-tools.sh'
              - '.github/scripts/mirror-ci-tools.sh'
              - '.github/scripts/check-ci-tools.sh'
              - '.github/scripts/ci-tools-proof.sh'
              - '.github/scripts/ci-fault-proxy.py'
              # The two jobs read the machine they run on with it.
              - '.github/scripts/disk_watch.py'
              - '.github/actions/install-crane/**'
              - '.github/actions/install-changie/**'
              - '.github/actions/install-jj/**'
              - '.github/actions/setup-bun/**'
              - '.github/actions/install-elan/**'
              - '.github/actions/install-uv/**'
              - '.github/actions/install-pulumi/**'
              - '.github/actions/install-docker-plugin/**'
              - '.bun-version'
              - 'packages/daemon/docker/worker.Dockerfile'
              - *ci_router
              - '.github/workflows/ci-job-tool-fallback.yaml'
              - '.github/workflows/ci-job-tool-fallback-arm.yaml'
            # ci.yaml's ci-images job: the image copy (.github/scripts/mirror-ci-images.sh,
            # through the crane .github/actions/install-crane installs), the package mode of
            # .github/scripts/check-ci-images.sh, which reads ghcr.io, and the tool copy
            # (.github/scripts/mirror-ci-tools.sh), which fills the second source of every tool
            # install. These files are what decides what those three steps do, the built row's
            # whole build recipe among them: the package mode hashes the recipe - the browser
            # Dockerfile's own path, every file of .github/docker and
            # .github/workflows/browser-image.yaml, folded by the recipe_sha256 of
            # .github/scripts/ci_images.py - and holds the built row's published image to that
            # hash. The gate's other half reads the whole tree and is a step of lint, which
            # runs on every change.
            # It names what this job reads and nothing else, the tool_fallback filter above
            # included: rule 9's second direction refuses a pattern of a gate's filter that
            # matches no file its job reads, so this list cannot name that filter whole to be a
            # superset of it by construction. The tool-fallback job below therefore carries
            # `!cancelled()` rather than leaning on that: its `needs: ci-images` is for order,
            # since a run that selects both must fill the copy before the proof reads it, and
            # the one file that can bring a new row in, .github/ci-tools.yaml, is in both
            # filters, so every change that adds a row runs the fill first.
            ci_images:
              - '.github/ci-images.yaml'
              - '.github/scripts/mirror-ci-images.sh'
              - '.github/scripts/check-ci-images.sh'
              - '.github/scripts/ci_images.py'
              # The browser image's build recipe, which the package mode hashes to hold the
              # built row's published image to it.
              - '.github/docker/**'
              - '.github/workflows/browser-image.yaml'
              # The tool half of the copy: the rows the step fills from, the filler that runs,
              # and the fetch helper whose seams that filler reads.
              - '.github/ci-tools.yaml'
              - '.github/scripts/mirror-ci-tools.sh'
              - '.github/scripts/ci-tools.sh'
              - '.github/actions/install-crane/**'
              - *ci_router
              - '.github/workflows/ci-job-ci-images.yaml'
              # The job reads no Markdown file: its steps read the image rows, the two scripts
              # that copy and check them, the tool rows and the filler beside them, and the
              # crane the action installs, so a guide written under one of those directories
              # would start it for nothing.
              - '!**/*.md'

      # filter_verdicts above is one object over the three steps, the shape .github/scripts/ci-ok.jq
      # reads. A GitHub expression can build no object from three, so jq merges them here. A
      # name more than one step holds is a group written out again, which
      # .github/scripts/check-ci-filters.sh holds to the same patterns in each, so its verdict
      # is the same in each; rule 19 of that check refuses a filter an output of this job names
      # in two steps.
      - id: verdicts
        if: github.event_name != 'workflow_dispatch'
        env:
          FIRST: ${{ toJSON(steps.filter.outputs) }}
          SECOND: ${{ toJSON(steps.filter2.outputs) }}
          THIRD: ${{ toJSON(steps.filter3.outputs) }}
        run: printf 'verdicts=%s\n' "$(jq -cn --argjson first "$FIRST" --argjson second "$SECOND" --argjson third "$THIRD" '$first * $second * $third')" >> "$GITHUB_OUTPUT"

  # Reads the whole tree, so it runs on every non-draft run, also when `changes` failed.
  lint:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    # why: .github/ci-notes/ci.md#why-the-lint-job-holds-each-of-its-scopes
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: read
    uses: ./.github/workflows/ci-job-lint.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}
      changes-result: ${{ needs.changes.result }}
      go_notices: ${{ needs.changes.outputs.go_notices }}
    secrets:
      PRIVATE_NAME_TERMS: ${{ secrets.PRIVATE_NAME_TERMS }}

  # why: .github/ci-notes/ci.md#what-the-ci-images-job-copies-and-why-the-order-is-the-point
  ci-images:
    needs: changes
    if: needs.changes.outputs.ci_images == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    # why: .github/ci-notes/ci.md#why-the-ci-images-job-holds-packages-write
    permissions:
      contents: read
      packages: write
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-ci-images.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#the-tool-fallback-proof-what-it-drives-what-it-only-reasons-about-and-how-to-read-it-when-it-is-red
  tool-fallback:
    needs: [changes, ci-images]
    if: ${{ !cancelled() && needs.changes.outputs.tool_fallback == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    # why: .github/ci-notes/ci.md#why-the-tool-fallback-job-needs-no-packages-scope
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-tool-fallback.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#the-arm64-half-of-the-tool-fallback-proof
  tool-fallback-arm:
    needs: [changes, ci-images]
    if: ${{ !cancelled() && needs.changes.outputs.tool_fallback == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    # why: .github/ci-notes/ci.md#why-the-tool-fallback-arm-job-needs-no-other-scope
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-tool-fallback-arm.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#the-fail-open-jobs-and-what-they-buy-while-changes-is-broken
  typecheck:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.typecheck == 'true') }}
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-typecheck.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}


  # why: .github/ci-notes/ci.md#what-the-test-job-runs-and-how-each-harness-step-is-gated
  test:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.test == 'true') }}
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-test.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}
      changes-result: ${{ needs.changes.result }}
      guide_layout: ${{ needs.changes.outputs.guide_layout }}
      release_push_test: ${{ needs.changes.outputs.release_push_test }}
      release_bump_test: ${{ needs.changes.outputs.release_bump_test }}
      check_bun_version_test: ${{ needs.changes.outputs.check_bun_version_test }}
      check_playwright_version_test: ${{ needs.changes.outputs.check_playwright_version_test }}
      check_bun_workspace_manifests_test: ${{ needs.changes.outputs.check_bun_workspace_manifests_test }}
      check_zod_version_test: ${{ needs.changes.outputs.check_zod_version_test }}
      check_gh_version_test: ${{ needs.changes.outputs.check_gh_version_test }}
      check_gitleaks_version_test: ${{ needs.changes.outputs.check_gitleaks_version_test }}
      workflow_paths_test: ${{ needs.changes.outputs.workflow_paths_test }}
      check_image_trigger_paths_test: ${{ needs.changes.outputs.check_image_trigger_paths_test }}
      check_ci_images_test: ${{ needs.changes.outputs.check_ci_images_test }}
      mirror_ci_images_test: ${{ needs.changes.outputs.mirror_ci_images_test }}
      ci_tools_test: ${{ needs.changes.outputs.ci_tools_test }}
      mirror_ci_tools_test: ${{ needs.changes.outputs.mirror_ci_tools_test }}
      check_ci_tools_test: ${{ needs.changes.outputs.check_ci_tools_test }}
      ci_tools_proof_test: ${{ needs.changes.outputs.ci_tools_proof_test }}
      check_action_pins_test: ${{ needs.changes.outputs.check_action_pins_test }}
      check_workflow_files_test: ${{ needs.changes.outputs.check_workflow_files_test }}
      check_private_names_test: ${{ needs.changes.outputs.check_private_names_test }}
      check_private_names_terms_test: ${{ needs.changes.outputs.check_private_names_terms_test }}
      check_private_names_keys_test: ${{ needs.changes.outputs.check_private_names_keys_test }}
      check_plugin_names_test: ${{ needs.changes.outputs.check_plugin_names_test }}
      check_fireevent_reasons_test: ${{ needs.changes.outputs.check_fireevent_reasons_test }}
