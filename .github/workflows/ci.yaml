name: CI

# The router: every check a pull request or the merge queue runs, in one workflow. How it selects
# jobs and how a job joins it: .github/ci-budgets.md, "The router"; what it caches: "Caches".

# Retries and budgets: how every download of this workflow retries, and how every step budget
# and job ceiling below was derived, are the Retries note and the Budgets note of
# .github/ci-budgets.md.

# No `paths:`: every change starts this workflow, and `changes` selects what runs. No `branches:`
# on pull_request: a pull request on any base is tested. No `edited`: a title or body edit starts
# no run (pr-title.yaml checks those). `ready_for_review` starts the run a draft skipped. No
# `closed`: tests-closed.yaml cancels a closed pull request's run (the concurrency comment below).
# merge_group runs the router on the merge queue's commit of each queued group: `changes` selects
# by what the queued change touches against the queue base (the group's base_sha..head_sha), and
# ci-ok reports there, so the required checks pass on the merged tree before anything lands. No
# `push`: the queue tests every change on the tree it lands as, so a run on main would only test
# that tree again, and .github/workflows/ci-caches.yaml fills the Go caches on that push instead.
# workflow_dispatch is the bypass check's (.github/workflows/main-bypass-check.yaml): it starts a
# run at main's tip when a commit reached main without a passing merge-group ci-ok, and `changes`
# selects every job there.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# A newer push to a pull request cancels its older run, waiting or running. On pull_request the key
# is the pull request's number: tests-closed.yaml joins this same group when the pull request
# closes, cancelling what still waits or runs, and a merged pull request's closed event carries
# github.ref = the base branch, so the number is the only key that names the pull request on every
# event. A reopen within about a minute of the close can race tests-closed.yaml's run:
# tests-closed.yaml says what happens and what to do. A merge group is a group of its own per
# commit (its head) and is never cancelled: the queue waits for its ci-ok. A dispatched run keys on
# the commit it runs at and is never cancelled either.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only but for the two scopes the ci-ok steps use: `actions: read` reads the run's jobs,
# which the ci-ok-report step names in the check it posts, and `checks: write` posts ci-ok (the
# ci-ok job's reconcile step reads and PATCHes check runs with it too). The token also clones,
# downloads pinned tools, and, in `changes`, reads the pull
# request's file list, which this public repository serves without `pull-requests: read`. The
# jobs whose scopes differ declare them in blocks of their own: pr-title (what check-pr-text.sh
# and find-pr-payload.sh read, and neither of the two above, since it posts nothing), ci-images
# (the ghcr.io push its copy makes) and worker-image (the image
# push and its attestation's scopes). docs-pages.yaml publishes the site to GitHub Pages.
permissions:
  contents: read
  actions: read
  checks: write

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned envoy-infra-go red on a module whose
# hash go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same
# bytes straight from the source and checks them against go.sum, so this is a second path, not a
# weaker check.
env:
  GOPROXY: https://proxy.golang.org|direct
  # ci-ok's map of every job but those CI_OK_ALWAYS_RUN names to the `changes` output its `if:`
  # tests, and
  # the list of those jobs whose `if:` also admits only pull_request (ci-ok.sh and ci-ok.jq say how
  # they decide a job's selection). The ci-ok job's step takes both from this env; ci-ok-report.sh,
  # which runs from a composite action this file hands its job's own inputs alone, reads both out
  # of this file at the commit the run checked out. check-ci-filters.sh holds both to the jobs'
  # `if:`s.
  CI_OK_SELECTED_BY: |
    {
      "typecheck": "typecheck",
      "test": "test",
      "docs": "docs",
      "contracts": "contracts",
      "test-fixtures": "test_fixtures",
      "conflicts-script": "conflicts_script",
      "broker-client": "broker_client",
      "envoy-client": "envoy_client",
      "pi-shared": "pi_shared",
      "pi-envoy": "pi_envoy",
      "pi-legion": "pi_legion",
      "dispatch-ui": "dispatch_ui",
      "dispatch-browser": "dispatch_browser",
      "claude-envoy": "claude_envoy",
      "envoy-go": "envoy_go",
      "envoy-go-checks": "envoy_go_checks",
      "envoy-infra-go": "envoy_infra_go",
      "envoy-go-race": "envoy_go_race",
      "envoy-go-race-api": "envoy_go_race_api",
      "envoy-go-race-docs": "envoy_go_race_docs",
      "envoy-go-docs-finalizers": "envoy_go_race_docs",
      "dispatch-memory": "dispatch_memory",
      "dispatch-multiprocess": "dispatch_multiprocess",
      "listener-server-change": "listener_server_change",
      "broker-multiprocess": "broker_multiprocess",
      "airlock-lean": "airlock_lean",
      "envoy-smoke": "envoy_smoke",
      "envoy-e2e-local": "envoy_e2e_local",
      "envoy-session-stall": "envoy_session_stall",
      "ci-filters": "ci_filters",
      "ci-images": "ci_images",
      "download-retry": "download_retry",
      "download-retry-images": "download_retry_images",
      "tool-fallback": "tool_fallback",
      "tool-fallback-arm": "tool_fallback",
      "proof-sdk-offline": "proof_sdk_offline",
      "worker-image": "worker_image",
      "browser-image": "browser_image"
    }
  CI_OK_PULL_REQUEST_ONLY: '["worker-image"]'
  # The jobs that run on every change: no `changes` output gates one, so CI_OK_SELECTED_BY maps
  # none of them, and ci-ok passes only when each of them succeeded — a skipped, cancelled or
  # absent one fails the verdict, since nothing else says the job ran. `changes` is here because
  # it selects every other job, `lint` because every change is linted. ci-ok.sh reads this list
  # rather than knowing those two names, and check-ci-filters.sh holds every job of this file to
  # exactly one of ci-ok's three classes: mapped by CI_OK_SELECTED_BY, named here, or named by
  # CI_OK_EXEMPT below. The list is written as CI_OK_SELECTED_BY above is, a JSON array over
  # lines rather than one long one.
  CI_OK_ALWAYS_RUN: |
    [
      "changes",
      "lint"
    ]
  # The jobs outside ci-ok's accounting, each for a reason of its own. `cancel-started` exists
  # only to stop a merge-group run the queue has already thrown away, so it runs only on
  # `merge_group`, holds `actions: write`, runs no dependency code, reports no result to ci-ok
  # and is no job any verdict waits for. `ci-ok` is the verdict: it reports nothing to itself,
  # and the jobs it judges are its `needs:`, which check-ci-filters.sh holds to every job of this
  # file but these three. `pr-title` is the other check main's ruleset requires, carried by that
  # job's own check run: its result is nothing the verdict waits for, it carries no report step,
  # and the queue reads it as a check of its own, so a verdict that needed it would only make one
  # required check wait for the other.
  # That check asks none of the ci-ok rules of a job named here, and refuses
  # one that carries the ci-ok-report step: ci-ok.sh fails a result for a job CI_OK_SELECTED_BY
  # cannot map. The list is written as CI_OK_SELECTED_BY above is, a JSON array over lines rather
  # than one long one.
  CI_OK_EXEMPT: |
    [
      "cancel-started",
      "ci-ok",
      "pr-title"
    ]

jobs:
  # Selects the jobs that read what this change touched. Skipped on a draft pull request, so no
  # test job runs; marking it ready for review starts a run that selects by the same diff.
  #
  # Also skipped on a re-run attempt of a merge-group run, by a term every job of this file but
  # the two named for a required check — `ci-ok` and `pr-title`, each of which refuses such an
  # attempt in a step instead — carries:
  # `(github.event_name != 'merge_group' || github.run_attempt == '1')` in
  # a job that runs on more than one event, and `github.run_attempt == '1'` in
  # `cancel-started`, which runs on merge_group alone. No job may lean on this one's skip
  # instead: `gh run rerun --failed` leaves out a `changes` that succeeded and hands the attempt
  # that job's outputs again, so an `if:` testing only `needs.changes.outputs.<x> == 'true'`
  # would run the job again in full, and its own report step would post a failing ci-ok on the
  # dead group's head the moment it failed. .github/scripts/check-ci-filters.sh holds every such
  # job to its term. A group is tested once: the queue tests a pull request it removed again
  # when it is added again, and a merge-group run `cancel-started` or
  # .github/workflows/dequeued.yaml force-cancelled tests a group the queue has thrown away, so
  # a passing re-run of it would put a ci-ok on a head no queue entry waits for. A re-run must
  # therefore test nothing and post nothing; the jobs of it that do run are `ci-ok` and
  # `pr-title`, neither of which can be skipped without leaving a passing required check behind,
  # and each concludes the failure such an attempt must get in a step instead (the comment above
  # each one's `if:` says why).
  changes:
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      typecheck: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.typecheck }}
      test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.test }}
      # Selected like any other job now that no run of this workflow is a push to main.
      # docs-pages.yaml still builds and deploys main's site, on a push trigger of its own.
      docs: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.docs }}
      worker_image: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.worker_image }}
      # The browser image's build. No `full-ci` term, and none is wanted: the image is what the
      # jobs below pin, so gating its build behind a label would leave a pull request that edits
      # the Dockerfile writing a row whose digest the package does not hold, which the
      # ci-images job then refuses.
      browser_image: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.browser_image }}
      contracts: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.contracts }}
      test_fixtures: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.test_fixtures }}
      conflicts_script: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.conflicts_script }}
      broker_client: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.broker_client }}
      envoy_client: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.envoy_client }}
      pi_shared: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.pi_shared }}
      pi_envoy: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.pi_envoy }}
      pi_legion: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.pi_legion }}
      # The dashboard's and the proof editor's fast checks: no `full-ci` term, only the
      # dispatched one above, so they come back on every push.
      dispatch_ui: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.dispatch_ui }}
      # The browser suite, ungated: a pull request that changes what it reads runs it, because
      # the dispatch-browser job below then runs the cheap `pull-request` lane, the two projects
      # a pull request is held to. The `full-ci` label no longer decides whether this suite runs,
      # only which lane it runs: that job's `lane:` input reads the label, and the comment there
      # says what each event gets.
      dispatch_browser: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.dispatch_browser }}
      claude_envoy: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.claude_envoy }}
      # The eight slow suites, whose runner time dwarfs every other job's. The merge queue runs
      # them on the tree the change lands as, and that is where their result normally comes from;
      # a pull request runs them only when it carries the label `full-ci`. Each is false on a
      # pull-request run without that label, so the skip is one `changes` chose: ci-ok reads it as
      # it reads any other output, and no job's `if:` knows about the label. The label is read
      # from the pull request the run's own event carries, so it takes effect at the next push,
      # reopen or ready-for-review, not when it is added: this workflow takes no `labeled`
      # trigger, which would start a run that joins the concurrency group above and cancels the
      # pull request's run in progress.
      envoy_go: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.envoy_go || 'false' }}
      # envoy-go's fast half (the format and generated-code checks, the shell-script tests and
      # the build of the envoy commands), split out so it comes back on every push: no `full-ci`
      # term, only the dispatched one above.
      envoy_go_checks: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.envoy_go_checks }}
      envoy_infra_go: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.envoy_infra_go }}
      # Six slow suites, gated as the comment above `envoy_go` says.
      envoy_go_race: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.envoy_go_race || 'false' }}
      envoy_go_race_api: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.envoy_go_race_api || 'false' }}
      envoy_go_race_docs: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.envoy_go_race_docs || 'false' }}
      dispatch_memory: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.dispatch_memory || 'false' }}
      dispatch_multiprocess: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.dispatch_multiprocess || 'false' }}
      listener_server_change: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.listener_server_change }}
      broker_multiprocess: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.broker_multiprocess }}
      # The Lean model's own job, which is minutes rather than tens of them: no `full-ci` term,
      # so it comes back on every push that selects it, as the two suites above do.
      airlock_lean: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.airlock_lean }}
      # A slow suite, gated as the comment above `envoy_go` says.
      envoy_smoke: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.envoy_smoke || 'false' }}
      envoy_e2e_local: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.envoy_e2e_local }}
      envoy_session_stall: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.envoy_session_stall }}
      go_notices: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.go_notices }}
      ci_filters: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ci_filters }}
      ci_images: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ci_images }}
      # The two jobs that prove the retry machinery against an injected fault, and the only two
      # outputs here that read the event before the filter: both are 'false' in a merge group, so
      # neither job runs there. download-retry took 116.5 minutes at this branch's head, and a
      # queue that waited for it would hold every group behind it for about two hours. The pull
      # request's own run is where the machinery is proven, and it proves it on the same files the
      # group merges.
      #
      # The event test is here rather than in either job's `if:` because an `if:` that declines a
      # merge group leaves the job selected and skipped, and .github/scripts/ci-ok.sh:122 fails a
      # selected job whose result is not success — :99 reads that skip as a disagreement between
      # the filter and the `if:` the author must fix. Only :124 admits a skip, and only for a job
      # `changes` did not select, which is what 'false' here makes these two.
      download_retry: ${{ github.event_name == 'merge_group' && 'false' || github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.download_retry }}
      download_retry_images: ${{ github.event_name == 'merge_group' && 'false' || github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.download_retry_images }}
      # The second source of every tool install, proved by driving it: no `full-ci` term, so the
      # proof comes back on every change that selects it. It selects the arm64 half of that
      # proof too, which drives the same action over the same manifest through the same helper
      # and so reads the same files.
      tool_fallback: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.tool_fallback }}
      proof_sdk_offline: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.proof_sdk_offline }}
    steps:
      # On pull_request dorny/paths-filter reads the file list from the API and never reads the
      # tree; merge_group diffs with git and needs the clone (a merge group diffs its
      # base_sha..head_sha, fetching what the clone lacks). A dispatched run clones too, and
      # filters nothing.
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A dispatched run selects every job through the outputs above, so there is nothing to
      # filter, and paths-filter has no diff base on workflow_dispatch: a step that failed here
      # would fail `changes`, whose result every job's `if:` reads.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # Each filter names every file its job reads: the package and what its tests, typecheck
          # and build read outside it; the composite actions the job installs its tools through;
          # for Go, the closure of the packages the job compiles (`go list -deps -test`), the
          # targets of the go commands its tests start, and the module files of the workspace the
          # build runs in, whose go.mod files move the versions it compiles; and this file, since a
          # job reads its own definition. The ci-filters job (.github/scripts/check-ci-filters.sh)
          # recomputes those sets and fails naming each file a filter misses.
          #
          # dorny/paths-filter v4.0.3's `some-with-excludes` quantifier matches a change to a filter
          # when one of its patterns without `!` matches and none of its `!` patterns does. Only
          # worker_image has `!` patterns: they drop what the .dockerignore keeps out of the worker
          # image's build context. Every other filter must stay without one, so it means what it
          # would under the default, `some` (any pattern matches), where a `!` pattern would match
          # every file outside it. .github/scripts/check-image-trigger-paths.sh reads the filters
          # that gate an image build (worker_image, envoy_smoke) under this quantifier, and only as
          # flat lists of globs, so those two name no anchor.
          predicate-quantifier: some-with-excludes
          # The first keys are no job's gate: each is a group many filters share, written once and
          # named by every filter that needs it through its anchor, which dorny/paths-filter
          # flattens into the list that names it.
          filters: |
            # A frozen Bun install and the Bun it runs: `bun install --frozen-lockfile` reads the
            # root manifest, the lockfile, the patches package.json:50-59 applies, the manifest of
            # every workspace package.json:19-31 lists, and the tarball
            # packages/proof-editor/package.json installs proof-sdk-upstream from;
            # .github/actions/setup-bun installs the Bun .bun-version pins.
            bun_install: &bun_install
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - 'packages/broker-client/package.json'
              - 'packages/contracts/package.json'
              - 'packages/envoy-client/package.json'
              - 'packages/pi-envoy/package.json'
              - 'packages/pi-legion/package.json'
              - 'packages/pi-shared/package.json'
              - 'packages/claude-envoy/package.json'
              - 'packages/proof-editor/package.json'
              - 'packages/proof-editor/proof-sdk-*.tgz'
              - 'packages/dispatch/package.json'
              - 'packages/test-fixtures/package.json'
              - 'packages/envoy/internal/dispatch/pmdoc/gen/package.json'
              - 'docs/site/package.json'
              - '.bun-version'
              - '.github/actions/setup-bun/**'
              # setup-bun's bun-second-source step reads this runner's bun row through that helper and
              # fetches the npm copy when the release asset served no Bun of the pinned version,
              # and its last step holds the bun on PATH to that row's digest.
              - '.github/ci-tools.yaml'
              - '.github/scripts/ci-tools.sh'
            # `bunx biome check|lint` reads the root biome.json, which has it read the root
            # .gitignore too (biome.json:3-6, vcs.useIgnoreFile).
            biome: &biome
              - 'biome.json'
              - '.gitignore'
            # The one retry every download of this workflow goes through: a job that installs
            # dependencies, downloads a browser or downloads its Go modules sources this file and
            # calls the retry_fetch it defines (ci-budgets.md's Retries note), so a
            # change to it must re-run those jobs.
            ci_retry: &ci_retry
              - '.github/scripts/ci-retry.sh'
            # The root Go workspace: a go command under go.work reads it, go.work.sum, and the
            # go.mod and go.sum of every module it binds, whose requirements move the versions the
            # build compiles.
            go_workspace: &go_workspace
              - 'go.work'
              - 'go.work.sum'
              - 'packages/daemon/go.mod'
              - 'packages/daemon/go.sum'
              - 'packages/envoy/go.mod'
              - 'packages/envoy/go.sum'
            # The envoy packages the daemon module compiles (`go list -deps -test` of
            # packages/daemon's ./..., with and without -tags e2e).
            daemon_envoy_deps: &daemon_envoy_deps
              - 'packages/envoy/brokerclient/*'
              - 'packages/envoy/brokertest/*'
              - 'packages/envoy/daemonpermissions/*'
              # dispatchbody is the one public door onto the Dispatch server's own block
              # splitter, which the daemon refuses a close reason or a READY packet the server
              # would refuse with (packages/daemon/internal/api): internal/dispatch/itemblocks
              # below, and the document parser under it, are in the daemon's build through it.
              - 'packages/envoy/dispatchbody/*'
              # The airlock's rules, its decision and its header swap, and the fuzz seeds the
              # daemon's test run reads as the testdata of a package it compiles. Not the whole
              # tree: lean/ holds the model, which airlock-lean alone reads.
              - 'packages/envoy/internal/broker/airlock/*'
              - 'packages/envoy/internal/broker/airlock/testdata/**'
              - 'packages/envoy/internal/broker/api/*'
              # The approval page's own files, its embedded templates and stylesheet included.
              - 'packages/envoy/internal/broker/approval/**'
              - 'packages/envoy/internal/broker/brokertest/*'
              - 'packages/envoy/internal/broker/config/*'
              - 'packages/envoy/internal/broker/enroll/*'
              - 'packages/envoy/internal/broker/exchange/*'
              - 'packages/envoy/internal/broker/machine/*'
              - 'packages/envoy/internal/broker/oauth/*'
              - 'packages/envoy/internal/broker/oauthstore/*'
              - 'packages/envoy/internal/broker/oauthwire/*'
              - 'packages/envoy/internal/broker/policy/**'
              - 'packages/envoy/internal/broker/proof/*'
              - 'packages/envoy/internal/broker/record/*'
              - 'packages/envoy/internal/broker/requests/*'
              - 'packages/envoy/internal/broker/secrets/*'
              - 'packages/envoy/internal/broker/store/**'
              # The response shapes the broker's own handlers marshal, which Dispatch's OpenAPI
              # emitter names for the routes that relay them.
              - 'packages/envoy/internal/broker/wire/*'
              # The token client whose public re-export the daemon imports, and the wire corpus
              # its own tests replay.
              - 'packages/envoy/internal/brokerclient/**'
              - 'packages/envoy/internal/bus/*'
              - 'packages/envoy/internal/bus/testdata/*'
              - 'packages/envoy/internal/contracts/*'
