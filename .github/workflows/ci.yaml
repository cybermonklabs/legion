              - '.github/workflows/**'
              - '.github/scripts/check-ci-filters.sh'
              - '.github/scripts/ci_filter_coverage.py'
              - '.github/scripts/ci_job_reads.py'
              - '.github/scripts/ci_workflow_rules.py'
              - '.github/scripts/workflow_paths.py'
              - '.github/go-release-targets.json'
              - '.github/agent-secrets-client-targets.json'
              - '.github/envoy-infra-targets.json'
