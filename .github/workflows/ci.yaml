      pull-requests: read
    steps:
      # why: .github/ci-notes/ci.md#why-pr-title-refuses-a-re-run-attempt-in-a-step-of-its-own
      - name: Refuse a re-run attempt of a merge-group run
        if: ${{ github.event_name == 'merge_group' && github.run_attempt != '1' }}
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
