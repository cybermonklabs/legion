            # reads, and check-ci-filters.sh holds this filter to that gate - it refuses a filter
            # that misses a read, never one that is too wide, so a path is in this list because a
            # browser row reads it and for no other reason.
            dispatch_browser:
              - '.github/workflows/ci.yaml'
              # The browser jobs' install and Go download steps source it, so a change to it
              # must re-run them.
              - *ci_retry
              - *bun_install
              - 'packages/dispatch/**'
              - 'packages/proof-editor/**'
              - 'packages/contracts/src/**'
              # The Dispatch server this suite runs: dispatch-browser.yaml's binaries job
              # builds it, with the real broker's three commands, for the shard and alone jobs,
              # and the two-process job builds it in a step of its own and again in
              # e2e/run-server.sh (run-server.sh:340), on the socket
              # scripts/e2e/lib/held-port.py holds
              # (run-server.sh:80).
              - *go_workspace
              - *dispatch_server
              - 'scripts/e2e/lib/held-port.py'
              # The SPA build writes dist/THIRD_PARTY_NOTICES.txt (web/vite.config.ts:11).
              - 'scripts/third-party-notices.ts'
              # The workflow that holds every browser step, which this job reads as its own
              # definition, and the nightly, the other caller of that file. An unlabelled pull
              # request runs the pull-request lane, the two projects a change is held to; a pull
              # request carrying `full-ci`, the merge group and a dispatch run the full lane,
              # every project and the two-process job, which is the lane the nightly calls. So a
              # worker can put the whole suite on a pull request with the label, the group is
              # where a change to either file meets it before main anyway, and the nightly,
              # started from the default branch alone, answers for no pull request.
              - '.github/workflows/dispatch-browser.yaml'
              - '.github/workflows/dispatch-browser-nightly.yaml'
              # The memory and CPU sampler the shard and alone jobs' browser steps start and read
              # back, the reading of the lanes' PostgreSQL those two jobs run before the suite,
              # the script the merge job runs to take each leg's newest attempt, and the script
              # that makes the merge job's two reads of its own run, which reads this run's own
              # attempt's jobs and says a refused blob download was a refused read. The
              # Playwright install both jobs ran stood here too, with the pinned apt list it
              # installed, the key their apt archive cache was read under and the check that the
              # list had not fallen behind Playwright: those two jobs run in the image this
              # repository builds now, which carries the browsers and their host packages, so
              # all four files are gone (dispatch://INFRA-1443).
              - '.github/scripts/dispatch-browser-samples.sh'
              - '.github/scripts/dispatch-browser-postgres.sh'
              - '.github/scripts/dispatch-browser-latest-blobs.sh'
              - '.github/scripts/dispatch-browser-run-reads.sh'
              # The container image the shard and alone jobs run in and everything that decides
              # which bytes it is: the row that pins its digest, the Dockerfile it is built from
              # and the workflow that builds it. A change to any of them changes what those jobs
              # run inside, so they run (dispatch://INFRA-1443). The row is named as the whole
              # file because a paths filter matches files and not rows, so any row change
              # re-runs the browser jobs; that is correct and cheap. The two-process and merge
              # jobs are on this same filter and run in no container, so an image change runs
              # them too, which costs a five-minute Chromium job and keeps one list rather than
              # two.
              - '.github/ci-images.yaml'
              - '.github/docker/browser.Dockerfile'
              - '.github/workflows/browser-image.yaml'
