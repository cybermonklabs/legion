        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_NAME_TERMS: ${{ secrets.PRIVATE_NAME_TERMS }}
        run: |
          payload=$("$GITHUB_WORKSPACE/.github/scripts/find-pr-payload.sh")
          GITHUB_EVENT_PATH="$payload" "$GITHUB_WORKSPACE/.github/scripts/check-pr-text.sh"

