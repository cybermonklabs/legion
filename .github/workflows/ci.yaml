              # Dispatch server's, which e2e/run-broker.sh builds in one `go build`.
              # agentloop: the model loop cmd/broker's judge runs a model and its tools through.
              - 'packages/envoy/agentloop/*'
              - 'packages/envoy/cmd/broker/*'
              - 'packages/envoy/cmd/dev-oidc-issuer/*'
              - 'packages/envoy/internal/broker/airlock/*'
              - 'packages/envoy/internal/broker/airlockproxy/*'
              - 'packages/envoy/internal/broker/api/*'
              # The approval page's own files, its embedded templates and stylesheet included.
              - 'packages/envoy/internal/broker/approval/**'
