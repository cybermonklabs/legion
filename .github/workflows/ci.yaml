name: CI

# The router: every check a pull request or the merge queue runs, in one workflow.
# Its first job, `changes`, reads the paths the change touched and selects, through one
# dorny/paths-filter filter per job, the jobs that read those paths; each job runs only when its
# filter matches (lint runs on every change, and typecheck, test, daemon-go, plugin-pack,
# sessions-script and text-checks also run when `changes` itself failed). ci-ok condenses every
# job's result into one check: it fails when a job `changes` selected did not succeed.
# Main's ruleset requires ci-ok and pr-title. ci-ok is the `ci-ok` job
# at the end of this file, which needs every job of it but itself and those CI_OK_EXEMPT names,
# and fails when .github/scripts/ci-ok.sh's verdict over their results is failure, so the
# verdict rides on that job's own check run — a job's check run is in its run's own check suite,
# where a check run posted with POST /repos/.../check-runs joins the Actions App's first suite
# at that commit, which is another workflow's as often as not (.github/scripts/post-check-run.sh's
# header holds the measurement). Every job but `changes` and those CI_OK_EXEMPT names still
# ends with the ci-ok-report step (.github/actions/ci-ok-report), which posts a failing ci-ok
# at once when that job's own result decides a merge-group run, so the queue drops a doomed
# group at the first failure rather than at the end of the run; the ci-ok job's last step then
# sets every ci-ok check run on the head that is not its own to its own conclusion, so one
# verdict stands at the end of every attempt. pr-title, the other check that ruleset requires, is
# the `pr-title` job at the end of this file, in the same shape and for the same reason: it runs
# check-pr-text.sh on a pull request that is not a draft and on the merge queue's group, the two
# events this workflow runs that carry a pull request's text, and its own check run is the report,
# so it posts nothing. pr-title.yaml carries that same check when the pull request is edited and
# when a review is submitted or edited, the two events this workflow does not run on, as its own
# job's check run too; its header says why it runs on nothing else.
# The docs site's build on a push to main, and its GitHub Pages
# deploy, are docs-pages.yaml's, a workflow of its own whose header says why. Its paths are held
# to the docs filter below.
#
# A new job joins the router in eight places: a filter in `changes` that names every file the job
# reads, an output of `changes` for that filter, the job's `needs: changes` and an `if:` on that
# output carrying the term that skips it on a re-run attempt of a merge-group run (the comment
# above `changes` says why every job needs its own), the job's steps in a reusable workflow of
# its own, .github/workflows/ci-job-<id>.yaml, which the job here calls with `uses:` and hands
# `ci-ok-changes: ${{ toJSON(needs.changes) }}` in its `with:`, under a `permissions:` block of
# its own (a calling job that declares none hands the called workflow the default GITHUB_TOKEN
# permissions rather than this file's block, and the report step's ci-ok needs `checks: write`),
# an entry in CI_OK_SELECTED_BY (this file's env) mapping the job to that output (and in
# CI_OK_PULL_REQUEST_ONLY when its `if:` admits only pull_request), the ci-ok-report step as the
# job's last step (a job that calls a workflow passes `ci-ok-changes` to it, and that workflow's
# job ends with the step, as docs-site.yaml's and worker-image.yaml's do), the job's id in the
# ci-ok job's `needs:`, without which the verdict is reached before that job ends and says
# nothing about it, and a gate in
# .github/scripts/ci_job_reads.py. An output an event must force is written in `changes`' outputs
# rather than left to its filter, as every output's workflow_dispatch case is, and so is one an
# event must hold back, as the eight slow suites' pull-request case is (the comment on them
# below). The ci-filters job's .github/scripts/check-ci-filters.sh holds the filter to that gate,
# CI_OK_SELECTED_BY to the `if:`s, the report step to every job, the ci-ok job's `needs:` to
# every job of the file but the exempt ones, and the re-run term to every job but `ci-ok` and
# `pr-title`: each of those two is named for a check main's ruleset requires, where a skip is a
# passing required check, so each refuses such an attempt in a step of its own instead.
# docs/solutions/github/join-a-job-to-the-ci-router.md walks through it.
#
# Caches: no job of this workflow saves an Actions cache entry. setup-go caches nothing here
# (`cache: false` on every step). The jobs that cache Go restore one of six families with
# actions/cache/restore: go-daemon (typecheck, daemon-go, plugin-pack — which compiles the same
# internal/daemon test binary daemon-go's race step does — and pi-legion; the test job restored
# it while it ran the daemon's Go suite and does not now), go-docs (docs, and the build job
# of docs-pages.yaml, which saves it), go-envoy (envoy-e2e-local and envoy-session-stall, which
# build the same listener and natsd, listener-server-change and envoy-go-checks, which build the
# listener, and envoy-go-race-docs, envoy-go-docs-finalizers and the shard, alone and
# multiprocess jobs of dispatch-browser.yaml), go-envoy-test (envoy-go alone: it builds the test
# binary of every package of the envoy module, a set no other job builds), go-envoy-infra
# (envoy-infra-go) and go-notices (lint's notices step). Every family but go-docs is filled by
# .github/workflows/ci-caches.yaml, which builds those sets on a push to main and saves them;
# go-docs stays with docs-pages.yaml, which saves it on that same push. Each family keeps one
# entry, keyed on the Go version its job's setup-go installed, so it is
# refreshed only when Go is bumped. A go.sum change downloads only the changed modules, and Go's
# build cache is content-addressed, so a stale entry costs a run only what changed; a key on the
# go.sum files left a whole entry, up to a gigabyte, per change for seven days. The fallback by
# prefix, when the exact key misses, now applies on every run, a dispatched one on main
# included: it was held off main so that the entry a run saved after a Go bump held nothing the
# older Go built, and no run here saves any more. Beside the Go families, dispatch-browser.yaml's
# shard and alone jobs restore the Playwright browsers of the version bun.lock pins, which
# ci-caches.yaml's browsers job fills on that same push. setup-bun reads and writes its cache
# only on main (.github/actions/setup-bun), which of this workflow's events is the dispatched
# run alone.

# No `paths:`: every change starts this workflow, and `changes` selects what runs. No `branches:`
# on pull_request: a pull request on any base is tested. No `edited`: a title or body edit starts
# no run (pr-title.yaml checks those). `ready_for_review` starts the run a draft skipped. No
# `closed`: tests-closed.yaml cancels a closed pull request's run (the concurrency comment below).
# merge_group runs the router on the merge queue's commit of each queued group: `changes` selects
# by what the queued change touches against the queue base (the group's base_sha..head_sha), and
# ci-ok reports there, so the required checks pass on the merged tree before anything lands. No
# `push`: the queue tests every change on the tree it lands as, so a run on main would only test
# that tree again, and .github/workflows/ci-caches.yaml fills the Go caches on that push instead.
# workflow_dispatch is the bypass check's (.github/workflows/main-bypass-check.yaml): it starts a
# run at main's tip when a commit reached main without a passing merge-group ci-ok, and `changes`
# selects every job there.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# A newer push to a pull request cancels its older run, waiting or running. On pull_request the key
# is the pull request's number: tests-closed.yaml joins this same group when the pull request
# closes, cancelling what still waits or runs, and a merged pull request's closed event carries
# github.ref = the base branch, so the number is the only key that names the pull request on every
# event. A reopen within about a minute of the close can race tests-closed.yaml's run:
# tests-closed.yaml says what happens and what to do. A merge group is a group of its own per
# commit (its head) and is never cancelled: the queue waits for its ci-ok. A dispatched run keys on
# the commit it runs at and is never cancelled either.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only but for the two scopes the ci-ok steps use: `actions: read` reads the run's jobs,
# which the ci-ok-report step names in the check it posts, and `checks: write` posts ci-ok (the
# ci-ok job's reconcile step reads and PATCHes check runs with it too). The token also clones,
# downloads pinned tools, and, in `changes`, reads the pull
# request's file list, which this public repository serves without `pull-requests: read`. The
# jobs whose scopes differ declare them in blocks of their own: pr-title (what check-pr-text.sh
# and find-pr-payload.sh read, and neither of the two above, since it posts nothing), ci-images
# (the ghcr.io push its copy makes) and worker-image (the image
# push and its attestation's scopes). docs-pages.yaml publishes the site to GitHub Pages.
permissions:
  contents: read
  actions: read
  checks: write

env:
  # ci-ok's map of every job but those CI_OK_ALWAYS_RUN names to the `changes` output its `if:`
  # tests, and
  # the list of those jobs whose `if:` also admits only pull_request (ci-ok.sh and ci-ok.jq say how
  # they decide a job's selection). The ci-ok job's step takes both from this env; ci-ok-report.sh,
  # which runs from a composite action this file hands its job's own inputs alone, reads both out
  # of this file at the commit the run checked out. check-ci-filters.sh holds both to the jobs'
  # `if:`s.
  CI_OK_SELECTED_BY: |
    {
      "typecheck": "typecheck",
      "test": "test",
      "daemon-go": "daemon_go_tests",
      "plugin-pack": "plugin_pack",
      "docs": "docs",
      "contracts": "contracts",
      "test-fixtures": "test_fixtures",
      "conflicts-script": "conflicts_script",
      "sessions-script": "sessions_script",
      "broker-client": "broker_client",
      "envoy-client": "envoy_client",
      "pi-shared": "pi_shared",
      "pi-envoy": "pi_envoy",
      "pi-legion": "pi_legion",
      "dispatch-ui": "dispatch_ui",
      "dispatch-browser": "dispatch_browser",
      "claude-envoy": "claude_envoy",
      "envoy-go": "envoy_go",
      "envoy-go-checks": "envoy_go_checks",
      "envoy-infra-go": "envoy_infra_go",
      "text-checks": "text_checks",
      "envoy-go-race": "envoy_go_race",
      "envoy-go-race-api": "envoy_go_race_api",
      "envoy-go-race-docs": "envoy_go_race_docs",
      "envoy-go-docs-finalizers": "envoy_go_race_docs",
      "dispatch-memory": "dispatch_memory",
      "dispatch-multiprocess": "dispatch_multiprocess",
      "listener-server-change": "listener_server_change",
      "broker-multiprocess": "broker_multiprocess",
      "airlock-lean": "airlock_lean",
      "envoy-smoke": "envoy_smoke",
      "envoy-e2e-local": "envoy_e2e_local",
      "envoy-session-stall": "envoy_session_stall",
      "ci-filters": "ci_filters",
      "ci-images": "ci_images",
      "proof-sdk-offline": "proof_sdk_offline",
      "worker-image": "worker_image"
    }
  CI_OK_PULL_REQUEST_ONLY: '["worker-image"]'
  # The jobs that run on every change: no `changes` output gates one, so CI_OK_SELECTED_BY maps
  # none of them, and ci-ok passes only when each of them succeeded — a skipped, cancelled or
  # absent one fails the verdict, since nothing else says the job ran. `changes` is here because
  # it selects every other job, `lint` because every change is linted. ci-ok.sh reads this list
  # rather than knowing those two names, and check-ci-filters.sh holds every job of this file to
  # exactly one of ci-ok's three classes: mapped by CI_OK_SELECTED_BY, named here, or named by
  # CI_OK_EXEMPT below. The list is written as CI_OK_SELECTED_BY above is, a JSON array over
  # lines rather than one long one.
  CI_OK_ALWAYS_RUN: |
    [
      "changes",
      "lint"
    ]
  # The jobs outside ci-ok's accounting, each for a reason of its own. `cancel-started` exists
  # only to stop a merge-group run the queue has already thrown away, so it runs only on
  # `merge_group`, holds `actions: write`, runs no dependency code, reports no result to ci-ok
  # and is no job any verdict waits for. `ci-ok` is the verdict: it reports nothing to itself,
  # and the jobs it judges are its `needs:`, which check-ci-filters.sh holds to every job of this
  # file but these three. `pr-title` is the other check main's ruleset requires, carried by that
  # job's own check run: its result is nothing the verdict waits for, it carries no report step,
  # and the queue reads it as a check of its own, so a verdict that needed it would only make one
  # required check wait for the other.
  # That check asks none of the ci-ok rules of a job named here, and refuses
  # one that carries the ci-ok-report step: ci-ok.sh fails a result for a job CI_OK_SELECTED_BY
  # cannot map. The list is written as CI_OK_SELECTED_BY above is, a JSON array over lines rather
  # than one long one.
  CI_OK_EXEMPT: |
    [
      "cancel-started",
      "ci-ok",
      "pr-title"
    ]

jobs:
  # Selects the jobs that read what this change touched. Skipped on a draft pull request, so no
  # test job runs; marking it ready for review starts a run that selects by the same diff.
  #
  # Also skipped on a re-run attempt of a merge-group run, by a term every job of this file but
  # the two named for a required check — `ci-ok` and `pr-title`, each of which refuses such an
  # attempt in a step instead — carries:
  # `(github.event_name != 'merge_group' || github.run_attempt == '1')` in
  # a job that runs on more than one event, and `github.run_attempt == '1'` in
  # `cancel-started`, which runs on merge_group alone. No job may lean on this one's skip
  # instead: `gh run rerun --failed` leaves out a `changes` that succeeded and hands the attempt
  # that job's outputs again, so an `if:` testing only `needs.changes.outputs.<x> == 'true'`
  # would run the job again in full, and its own report step would post a failing ci-ok on the
  # dead group's head the moment it failed. .github/scripts/check-ci-filters.sh holds every such
  # job to its term. A group is tested once: the queue tests a pull request it removed again
  # when it is added again, and a merge-group run `cancel-started` or
  # .github/workflows/dequeued.yaml force-cancelled tests a group the queue has thrown away, so
  # a passing re-run of it would put a ci-ok on a head no queue entry waits for. A re-run must
  # therefore test nothing and post nothing; the jobs of it that do run are `ci-ok` and
  # `pr-title`, neither of which can be skipped without leaving a passing required check behind,
  # and each concludes the failure such an attempt must get in a step instead (the comment above
  # each one's `if:` says why).
  changes:
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      # Each output names the step its filter is declared in. There are two of them because
      # Actions hands a step's input to the action as one environment variable and Linux caps
      # one of those at 131,072 bytes (the comment above the second step says what that cost
      # here); rule 19 of .github/scripts/check-ci-filters.sh refuses an output naming a step
      # that does not declare its filter, so the two cannot drift.
      typecheck: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.typecheck }}
      test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.test }}
      # The daemon's Go suite, a job of its own since dispatch://INFRA-1413: the test job used
      # to carry it behind the output above, so a change to a shell script ran it too.
      daemon_go_tests: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.daemon_go_tests }}
      # The one test of that suite that packs the two plugin releases, in a job of its own: its
      # pack reads bun.lock, so with it in daemon-go a lockfile change ran the daemon's whole Go
      # suite (dispatch://INFRA-1413, A4).
      plugin_pack: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.plugin_pack }}
      # The session message-wait suite, in a job of its own: it is the one test of the test job
      # that needs a database, and a Postgres service there would start one for every change
      # that selects any of that job's thirty-two harness steps.
      sessions_script: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.sessions_script }}
      # The guides' layout step of the test job, which has a filter of its own: the job's other
      # steps read none of the guides, so a run that changed none of them skips that step.
      guide_layout: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.guide_layout }}
      # One output per `*.test.sh` step of the test job: each names that harness and the script
      # it tests, so the step runs when either changes and skips when neither does. The job's
      # own filter names every one of these lists, since a step gate decides nothing in a job
      # that was not selected.
      release_push_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.release_push_test }}
      release_bump_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.release_bump_test }}
      check_bun_version_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_bun_version_test }}
      check_bun_workspace_manifests_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_bun_workspace_manifests_test }}
      check_zod_version_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_zod_version_test }}
      check_gh_version_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_gh_version_test }}
      workflow_paths_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.workflow_paths_test }}
      check_image_trigger_paths_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_image_trigger_paths_test }}
      check_ci_images_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_ci_images_test }}
      mirror_ci_images_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.mirror_ci_images_test }}
      check_action_pins_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_action_pins_test }}
      check_private_names_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_private_names_test }}
      check_plugin_names_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_plugin_names_test }}
      check_fireevent_reasons_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_fireevent_reasons_test }}
      check_daemon_api_contract_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_daemon_api_contract_test }}
      check_release_credentials_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_release_credentials_test }}
      repo_paths_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.repo_paths_test }}
      playwright_deps_current_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.playwright_deps_current_test }}
      select_e2e_proofs_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.select_e2e_proofs_test }}
      go_tagged_tests_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.go_tagged_tests_test }}
      ci_ok_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ci_ok_test }}
      ci_ok_report_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ci_ok_report_test }}
      ci_ok_reconcile_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ci_ok_reconcile_test }}
      find_pr_payload_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.find_pr_payload_test }}
      merge_group_cancels_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.merge_group_cancels_test }}
      main_bypass_check_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.main_bypass_check_test }}
      dispatch_browser_latest_blobs_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.dispatch_browser_latest_blobs_test }}
      dispatch_browser_samples_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.dispatch_browser_samples_test }}
      apt_archive_cache_key_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.apt_archive_cache_key_test }}
      race_memory_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.race_memory_test }}
      disk_watch_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.disk_watch_test }}
      sessions_import_pods_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.sessions_import_pods_test }}
      check_ci_filters_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_ci_filters_test }}
      check_ts_filters_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_ts_filters_test }}
      go_test_step_expansion_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.go_test_step_expansion_test }}
      # Selected like any other job now that no run of this workflow is a push to main.
      # docs-pages.yaml still builds and deploys main's site, on a push trigger of its own.
      docs: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.docs }}
      worker_image: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.worker_image }}
      contracts: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.contracts }}
      test_fixtures: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.test_fixtures }}
      conflicts_script: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.conflicts_script }}
      broker_client: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.broker_client }}
      envoy_client: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.envoy_client }}
      pi_shared: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.pi_shared }}
      pi_envoy: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.pi_envoy }}
      pi_legion: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.pi_legion }}
      # The dashboard's and the proof editor's fast checks: no `full-ci` term, only the
      # dispatched one above, so they come back on every push.
      dispatch_ui: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.dispatch_ui }}
      # The browser suite, ungated: a pull request that changes what it reads runs it, because
      # the dispatch-browser job below then runs the cheap `pull-request` lane, the two projects
      # a pull request is held to. The `full-ci` label no longer decides whether this suite runs,
      # only which lane it runs: that job's `lane:` input reads the label, and the comment there
      # says what each event gets.
      dispatch_browser: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.dispatch_browser }}
      claude_envoy: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.claude_envoy }}
      # The eight slow suites, whose runner time dwarfs every other job's. The merge queue runs
      # them on the tree the change lands as, and that is where their result normally comes from;
      # a pull request runs them only when it carries the label `full-ci`. Each is false on a
      # pull-request run without that label, so the skip is one `changes` chose: ci-ok reads it as
      # it reads any other output, and no job's `if:` knows about the label. The label is read
      # from the pull request the run's own event carries, so it takes effect at the next push,
      # reopen or ready-for-review, not when it is added: this workflow takes no `labeled`
      # trigger, which would start a run that joins the concurrency group above and cancels the
      # pull request's run in progress.
      envoy_go: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter2.outputs.envoy_go || 'false' }}
      # envoy-go's fast half (the format and generated-code checks, the shell-script tests and
      # the build of the envoy commands), split out so it comes back on every push: no `full-ci`
      # term, only the dispatched one above.
      envoy_go_checks: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.envoy_go_checks }}
      envoy_infra_go: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.envoy_infra_go }}
      # The checks whose subject is text, in a job with no database: no `full-ci` term, only
      # the dispatched one above, since it is one of the cheapest jobs of the file.
      text_checks: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.text_checks }}
      # Six slow suites, gated as the comment above `envoy_go` says.
      envoy_go_race: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter2.outputs.envoy_go_race || 'false' }}
      envoy_go_race_api: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter2.outputs.envoy_go_race_api || 'false' }}
      envoy_go_race_docs: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter2.outputs.envoy_go_race_docs || 'false' }}
      dispatch_memory: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter2.outputs.dispatch_memory || 'false' }}
      dispatch_multiprocess: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter2.outputs.dispatch_multiprocess || 'false' }}
      listener_server_change: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.listener_server_change }}
      broker_multiprocess: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.broker_multiprocess }}
      # The Lean model's own job, which is minutes rather than tens of them: no `full-ci` term,
      # so it comes back on every push that selects it, as the two suites above do.
      airlock_lean: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.airlock_lean }}
      # A slow suite, gated as the comment above `envoy_go` says.
      envoy_smoke: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter2.outputs.envoy_smoke || 'false' }}
      envoy_e2e_local: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.envoy_e2e_local }}
      envoy_session_stall: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.envoy_session_stall }}
      go_notices: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.go_notices }}
      ci_filters: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.ci_filters }}
      ci_images: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.ci_images }}
      proof_sdk_offline: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter2.outputs.proof_sdk_offline }}
      # The paths filter's own verdict for every filter, before the `full-ci` term above rewrites
      # the seven outputs the eight slow suites run behind. On a pull request without that
      # label each of those seven is `false` whether its paths matched or not, so a reader of the
      # outputs alone cannot tell "the filter said no" from "the label is absent"; with this
      # beside them ci-ok's report tells the two apart and says which
      # (.github/scripts/ci-ok.jq's `selection`). It gates no job and needs no plumbing of its
      # own: `toJSON(needs.changes)` carries every output of this job, so the ci-ok job and
      # ci-ok-report.sh both already have it. The verdicts of both filter steps are in it, as
      # one object: the merge is the `verdicts` step below, since a GitHub expression can build
      # no object out of two. On a dispatched run that step is skipped with the two it reads and
      # this is `{}`, which is right - the label holds nothing back there, and the outputs above
      # are all 'true'.
      filter_verdicts: ${{ github.event_name == 'workflow_dispatch' && '{}' || steps.verdicts.outputs.verdicts }}
    steps:
      # Probe for dispatch://INFRA-1413's review round 2, never merged: this step makes the
      # changes job fail before any filter step runs, so every output it hands on is empty
      # and the fail-open jobs are driven on the real surface.
      - name: Fail the changes job on purpose
        run: exit 1
      # On pull_request dorny/paths-filter reads the file list from the API and never reads the
      # tree; merge_group diffs with git and needs the clone (a merge group diffs its
      # base_sha..head_sha, fetching what the clone lacks). A dispatched run clones too, and
      # filters nothing.
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A dispatched run selects every job through the outputs above, so there is nothing to
      # filter, and paths-filter has no diff base on workflow_dispatch: a step that failed here
      # would fail `changes`, whose result every job's `if:` reads.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # Each filter names every file its job reads: the package and what its tests, typecheck
          # and build read outside it; the composite actions the job installs its tools through;
          # for Go, the closure of the packages the job compiles (`go list -deps -test`), the
          # targets of the go commands its tests start, and the module files of the workspace the
          # build runs in, whose go.mod files move the versions it compiles; and this file, since a
          # job reads its own definition. The ci-filters job (.github/scripts/check-ci-filters.sh)
          # recomputes those sets and fails naming each file a filter misses.
          #
          # The filters are declared in two steps of this job, this one and the one below. Actions
          # hands each `filters` input to the action as one environment variable, and Linux caps
          # one of those at 131,072 bytes, which the whole block in one step passed: the comment
          # above the second step says what that cost and how the two sets were chosen. A group
          # both steps' filters name is written out in both, since a YAML anchor reaches no
          # further than the string it is in.
          #
          # dorny/paths-filter v4.0.3's `some-with-excludes` quantifier matches a change to a filter
          # when one of its patterns without `!` matches and none of its `!` patterns does.
          # worker_image's drop what the .dockerignore keeps out of the
          # worker image's build context. envoy_e2e_local and ci_images each end in '!**/*.md': no
          # step of either job reads a Markdown file, so a guide written under a directory pattern
          # of theirs (patches/**, packages/broker-client/**, .github/actions/install-crane/**)
          # starts neither. No Markdown file of the repository matches either filter today, so the
          # pattern holds no run back now; it keeps the next guide from riding in, which is what a
          # week of Markdown-only pull requests cost 1,504 runner-minutes (dispatch://INFRA-1413).
          # Every other filter of this file was tried with that pattern
          # and refused by rule 1 of .github/scripts/check-ci-filters.sh, which fails a filter that
          # stops matching a file its gate reads: those jobs read an embedded prompt, a README
          # packed into a plugin or an image, or a guide a test compares with code - go_notices
          # among them, whose own Markdown pattern below therefore names packages/envoy/internal
          # alone, the tree whose Markdown no release target's package directory holds.
          #
          # The '*_test.go' patterns of the filters below are written by a command rather than by
          # hand: rule 17 of .github/scripts/check-ci-filters.sh computes, per gate filter, the
          # `!` patterns that keep it off every Go test file the job it gates does not compile,
          # and `.github/scripts/check-ci-filters.sh write` puts them in that filter's own block
          # between a BEGIN and an END comment. The ordinary run of that check refuses a block
          # that is not what it computes, naming the first pattern that differs, so an edit by
          # hand is lost. The check prints how many it wrote on every run, so no count is kept
          # here. That is
          # dispatch://INFRA-1413's R18, the selection half of the rule whose coverage half is
          # rule 1: a job must not run for a change to a test file of a package whose tests it
          # never runs, and the pattern that selects such a file (packages/envoy/** and its kin)
          # matches the job's own sources too, so nothing but an exclusion can say it. Which
          # test files a job reads is `go list`'s answer for the packages its steps name in test
          # mode, under the tags and the -race each run carries, so a test it never compiles -
          # another module's, another package's, a tagged live one, a `//go:build race` one - is
          # excluded, and a filter whose job compiles every test file its patterns reach carries
          # no block at all (envoy_go, text_checks, and every filter naming no Go file). A block
          # belongs to the filter whose list holds it and never to a group an anchor shares,
          # since two filters that share an anchor need not run the same tests. worker_image is
          # the one filter keeping such a pattern by hand, because this check computes no read
          # set for it: its judge is the image check below, and the worker image's context holds
          # packages/daemon's test files while the .dockerignore drops packages/envoy's. A filter
          # without a `!` pattern means what it would under the default, `some` (any pattern
          # matches), where a `!` pattern would match every file outside it.
          # .github/scripts/check-image-trigger-paths.sh reads the filters
          # that gate an image build (worker_image, envoy_smoke) under this quantifier, and only as
          # flat lists of globs, so those two name no anchor standing for a list. The one anchor
          # they do name, ci_router, is on the glob itself, which leaves their lists flat.
          predicate-quantifier: some-with-excludes
          # The first keys of this step are no job's gate: each is a group many filters share,
          # written once and named by every filter that needs it through its anchor, which
          # dorny/paths-filter flattens into the list that names it.
          filters: |
            # ci.yaml, which every gate filter below names through this anchor: every job's `if:`
            # is in this file, so every job reads it - which is why ci_job_reads.py declares
            # CI_SELF on every gate. Each gate filter also names the ci-job-<job id>.yaml file
            # holding its own job's steps, so a change to one of those files selects that job
            # alone. This entry stays beside them because a change to ci.yaml does reach every
            # job: dropping it would make each job's `if:` test a second output of changes, which
            # .github/scripts/ci_filter_coverage.py refuses (a job's `if:` tests exactly one), and
            # an output written as a disjunction instead would select exactly what this pattern
            # selects. The anchor is on the glob rather than on the list, since envoy_smoke and
            # worker_image name it too and the image check above reads those two as flat lists.
            ci_router:
              - &ci_router '.github/workflows/ci.yaml'
            # A frozen Bun install and the Bun it runs: `bun install --frozen-lockfile` reads the
            # root manifest, the lockfile, the patches package.json:50-59 applies, the manifest of
            # every workspace package.json:19-31 lists, and the tarball
            # packages/proof-editor/package.json installs proof-sdk-upstream from;
            # .github/actions/setup-bun installs the Bun .bun-version pins.
            bun_install: &bun_install
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - 'packages/broker-client/package.json'
              - 'packages/contracts/package.json'
              - 'packages/envoy-client/package.json'
              - 'packages/pi-envoy/package.json'
              - 'packages/pi-legion/package.json'
              - 'packages/pi-shared/package.json'
              - 'packages/claude-envoy/package.json'
              - 'packages/proof-editor/package.json'
              - 'packages/proof-editor/proof-sdk-*.tgz'
              - 'packages/dispatch/package.json'
              - 'packages/test-fixtures/package.json'
              - 'packages/envoy/internal/dispatch/pmdoc/gen/package.json'
              - 'docs/site/package.json'
              - '.bun-version'
              - '.github/actions/setup-bun/**'
            # `bunx biome check|lint` reads the root biome.json, which has it read the root
            # .gitignore too (biome.json:3-6, vcs.useIgnoreFile).
            biome: &biome
              - 'biome.json'
              - '.gitignore'
            # The root Go workspace: a go command under go.work reads it, go.work.sum, and the
            # go.mod and go.sum of every module it binds, whose requirements move the versions the
            # build compiles.
            go_workspace: &go_workspace
              - 'go.work'
              - 'go.work.sum'
              - 'packages/daemon/go.mod'
              - 'packages/daemon/go.sum'
              - 'packages/envoy/go.mod'
              - 'packages/envoy/go.sum'
            # The envoy packages the daemon module compiles (`go list -deps -test` of
            # packages/daemon's ./..., with and without -tags e2e).
            daemon_envoy_deps: &daemon_envoy_deps
              - 'packages/envoy/brokerclient/*'
              - 'packages/envoy/brokertest/*'
              - 'packages/envoy/daemonpermissions/*'
              # dispatchbody is the one public door onto the Dispatch server's own block
              # splitter, which the daemon refuses a close reason or a READY packet the server
              # would refuse with (packages/daemon/internal/api): internal/dispatch/itemblocks
              # below, and the document parser under it, are in the daemon's build through it.
              - 'packages/envoy/dispatchbody/*'
              # The airlock's rules, its decision and its header swap. Not the whole tree: lean/
              # holds the model, which airlock-lean alone reads, and testdata/ the fuzz seeds and
              # the mutant patches, which the airlock package's own tests read - the daemon
              # compiles that package without running them.
              - 'packages/envoy/internal/broker/airlock/*'
              - 'packages/envoy/internal/broker/api/*'
              # The approval page's own files, its embedded templates and stylesheet included.
              - 'packages/envoy/internal/broker/approval/**'
              - 'packages/envoy/internal/broker/brokertest/*'
              - 'packages/envoy/internal/broker/enroll/*'
              - 'packages/envoy/internal/broker/exchange/*'
              - 'packages/envoy/internal/broker/machine/*'
              - 'packages/envoy/internal/broker/oauth/*'
              - 'packages/envoy/internal/broker/oauthstore/*'
              - 'packages/envoy/internal/broker/oauthwire/*'
              - 'packages/envoy/internal/broker/policy/**'
              - 'packages/envoy/internal/broker/proof/*'
              - 'packages/envoy/internal/broker/record/*'
              - 'packages/envoy/internal/broker/requests/*'
              - 'packages/envoy/internal/broker/secrets/*'
              - 'packages/envoy/internal/broker/store/**'
              # The token client whose public re-export the daemon imports, and the wire corpus
              # its own tests replay.
              - 'packages/envoy/internal/brokerclient/**'
              - 'packages/envoy/internal/bus/*'
              - 'packages/envoy/internal/contracts/*'
              - 'packages/envoy/internal/dispatch/itemblocks/*'
              - 'packages/envoy/internal/dispatch/model/*'
              - 'packages/envoy/internal/dispatch/pmdoc/**'
              # text's testdata too: the daemon's race-tested packages compile it, and a compiled
              # package's testdata is read by the job that compiles it.
              - 'packages/envoy/internal/dispatch/text/**'
              - 'packages/envoy/internal/githubappjwt/*'
              - 'packages/envoy/internal/googleidentity/*'
              - 'packages/envoy/internal/id/*'
              - 'packages/envoy/internal/logtest/*'
              - 'packages/envoy/internal/oidc/**'
              - 'packages/envoy/internal/pgmigrate/*'
              - 'packages/envoy/internal/ratelimit/*'
              - 'packages/envoy/internal/testnats/*'
              # storetest's DatabaseURL makes a test's own database with internal/testpg.
              - 'packages/envoy/internal/testpg/*'
              - 'packages/envoy/listenfd/*'
              - 'packages/envoy/migrationid/*'
              # The reasons the listener refuses a publish to a role no session holds, which the
              # daemon's notify path reads as notify.ErrNoHolder.
              - 'packages/envoy/roleholder/*'
              # The daemon reads the Envoy session timings (heartbeat, live window, claim
              # staleness and the listener call's attempts) through this one public package: it
              # is a module of its own, so Go's internal rule bars it from internal/contracts,
              # where the generated values are.
              - 'packages/envoy/sessiontiming/*'
              - 'packages/envoy/testnatsimages/*'
            # The Dispatch server, `go list -deps ./cmd/dispatch` in packages/envoy (its embedded
            # migrations and pmdoc schema included): what the daemon's outbox test builds
            # (internal/testbuild/testbuild.go:112, called from
            # internal/daemon/outbox_scratch_dispatch_test.go:353), the browser tests' and the
            # docs screenshots' run-server.sh builds (packages/dispatch/e2e/run-server.sh:135), and
            # envoy-infra's permissions live test builds (infra/core/permissions_live_test.go:298).
            # packages/envoy/listenfd serves on the socket a test or harness holds (#2229).
            # internal/dispatch/dashboard and internal/dispatch/processes: cmd/dispatch imports them
            # (INFRA-559, INFRA-555).
            # internal/roles and, through it, internal/store, internal/session and internal/kvwatch:
            # the outbox's role forward resolves a role's holder with roles.ResolveHolder (#2395).
            dispatch_server: &dispatch_server
              - 'packages/envoy/cmd/dispatch/*'
              - 'packages/envoy/going/*'
              - 'packages/envoy/internal/broker/oauthwire/*'
              - 'packages/envoy/internal/brokertoken/*'
              - 'packages/envoy/internal/bus/*'
              - 'packages/envoy/internal/cistore/*'
              - 'packages/envoy/internal/contracts/*'
              - 'packages/envoy/internal/dispatch/accesslog/*'
              - 'packages/envoy/internal/dispatch/agentsecrets/*'
              - 'packages/envoy/internal/dispatch/agentstream/*'
              - 'packages/envoy/internal/dispatch/api/*'
              - 'packages/envoy/internal/dispatch/architecture/*'
              - 'packages/envoy/internal/dispatch/asks/*'
              - 'packages/envoy/internal/dispatch/auth/*'
              - 'packages/envoy/internal/dispatch/cireconcile/*'
              - 'packages/envoy/internal/dispatch/config/*'
              - 'packages/envoy/internal/dispatch/dashboard/*'
              - 'packages/envoy/internal/dispatch/delivery/**'
              - 'packages/envoy/internal/dispatch/docs/*'
              - 'packages/envoy/internal/dispatch/docs/crafted/*'
              - 'packages/envoy/internal/dispatch/duty/*'
              - 'packages/envoy/internal/dispatch/embed/*'
              - 'packages/envoy/internal/dispatch/embedqueue/*'
              - 'packages/envoy/internal/dispatch/envoy/*'
              - 'packages/envoy/internal/dispatch/events/*'
              - 'packages/envoy/internal/dispatch/files/*'
              - 'packages/envoy/internal/dispatch/githubapi/*'
              - 'packages/envoy/internal/dispatch/githubapp/*'
              - 'packages/envoy/internal/dispatch/githubapp/ratelimit/*'
              - 'packages/envoy/internal/dispatch/identity/*'
              - 'packages/envoy/internal/dispatch/itemblocks/*'
              - 'packages/envoy/internal/dispatch/model/*'
              - 'packages/envoy/internal/dispatch/outbox/*'
              - 'packages/envoy/internal/dispatch/pmdoc/**'
              - 'packages/envoy/internal/dispatch/processes/*'
              - 'packages/envoy/internal/dispatch/rank/*'
              - 'packages/envoy/internal/dispatch/redeliver/*'
              - 'packages/envoy/internal/dispatch/refs/*'
              - 'packages/envoy/internal/dispatch/retry/*'
              - 'packages/envoy/internal/dispatch/routes/*'
              - 'packages/envoy/internal/dispatch/sessionanswers/*'
              - 'packages/envoy/internal/dispatch/startup/*'
              - 'packages/envoy/internal/dispatch/store/*'
              - 'packages/envoy/internal/dispatch/store/migrations/**'
              - 'packages/envoy/internal/dispatch/text/*'
              - 'packages/envoy/internal/envconf/*'
              - 'packages/envoy/internal/githubappjwt/*'
              - 'packages/envoy/internal/googleidentity/*'
              - 'packages/envoy/internal/id/*'
              # internal/dispatch/redeliver sweeps its redelivery records through
              # kvwatch.ScanExistingKeys (redeliver/sweep.go:50,488).
              - 'packages/envoy/internal/kvwatch/*'
              - 'packages/envoy/internal/logging/*'
              - 'packages/envoy/internal/metrics/*'
              - 'packages/envoy/internal/oidc/*'
              - 'packages/envoy/internal/pglisten/*'
              - 'packages/envoy/internal/pgmigrate/*'
              - 'packages/envoy/internal/ratelimit/*'
              - 'packages/envoy/internal/redact/*'
              - 'packages/envoy/internal/redirects/*'
              - 'packages/envoy/internal/roles/*'
              - 'packages/envoy/internal/routing/*'
              - 'packages/envoy/internal/session/*'
              - 'packages/envoy/internal/store/*'
              - 'packages/envoy/listenfd/*'
              - 'packages/envoy/migrationid/*'
              - 'packages/envoy/roleholder/*'
            # The daemon's `legion` command, `go list -deps ./cmd/legion` in packages/daemon (its
            # embedded probes, turnscope.yml and role prompts included, and the envoy package it
            # serves its held listener through): what docs/site/scripts/build-binaries.sh:17 builds
            # and lint's notices step loads for each target .github/go-release-targets.json lists.
            legion_command: &legion_command
              - 'packages/daemon/cmd/legion/*'
              - 'packages/daemon/internal/admit/*'
              - 'packages/daemon/internal/agentsecrets/*'
              - 'packages/daemon/internal/api/*'
              - 'packages/daemon/internal/appauth/*'
              - 'packages/daemon/internal/backoff/*'
              - 'packages/daemon/internal/blockers/*'
              - 'packages/daemon/internal/bootprobe/*'
              - 'packages/daemon/internal/capabilities/*'
              - 'packages/daemon/internal/claim/*'
              - 'packages/daemon/internal/classify/*'
              - 'packages/daemon/internal/claudebridge/*'
              - 'packages/daemon/internal/claudelaunch/*'
              - 'packages/daemon/internal/config/*'
              - 'packages/daemon/internal/controller/*'
              - 'packages/daemon/internal/credential/*'
              - 'packages/daemon/internal/daemon/**'
              - 'packages/daemon/internal/dispatch/*'
              - 'packages/daemon/internal/ghautomerge/*'
              - 'packages/daemon/internal/ghbranch/*'
              - 'packages/daemon/internal/ghconfig/*'
              - 'packages/daemon/internal/ghrepo/*'
              - 'packages/daemon/internal/githubrest/*'
              - 'packages/daemon/internal/intake/*'
              - 'packages/daemon/internal/launcher/*'
              - 'packages/daemon/internal/lookpath/*'
              - 'packages/daemon/internal/memorygroup/*'
              - 'packages/daemon/internal/modeltoken/*'
              - 'packages/daemon/internal/natsauth/*'
              - 'packages/daemon/internal/notify/*'
              - 'packages/daemon/internal/ompdirs/*'
              - 'packages/daemon/internal/omplaunch/*'
              - 'packages/daemon/internal/ompsessions/*'
              - 'packages/daemon/internal/phase/*'
              - 'packages/daemon/internal/pods/**'
              - 'packages/daemon/internal/podsafety/**'
              - 'packages/daemon/internal/procgroup/*'
              - 'packages/daemon/internal/projection/*'
              - 'packages/daemon/internal/promptrefs/*'
              - 'packages/daemon/internal/prompts/**'
              - 'packages/daemon/internal/record/*'
              - 'packages/daemon/internal/registry/*'
              - 'packages/daemon/internal/repocache/*'
              - 'packages/daemon/internal/requiredchecks/*'
              - 'packages/daemon/internal/rescue/*'
              - 'packages/daemon/internal/runtime/*'
              - 'packages/daemon/internal/runtime/sandbox/*'
              - 'packages/daemon/internal/runtime/shellprefix/*'
              - 'packages/daemon/internal/runtime/tmux/*'
              - 'packages/daemon/internal/runtime/workerbin/*'
              - 'packages/daemon/internal/sessionproxy/*'
              - 'packages/daemon/internal/shim/*'
              - 'packages/daemon/internal/shimwire/*'
              - 'packages/daemon/internal/store/**'
              - 'packages/daemon/internal/stream/*'
              - 'packages/daemon/internal/supervise/*'
              - 'packages/daemon/internal/treelifecycle/*'
              - 'packages/daemon/internal/wait/*'
              - 'packages/daemon/internal/wakepace/*'
              - 'packages/daemon/internal/workflow/*'
              - 'packages/daemon/internal/workspace/*'
              - 'packages/envoy/brokerclient/*'
              # packages/envoy/dispatchbody answers whether Dispatch would refuse a body with the
              # server's own splitter, which the close route and the merger's READY completion
              # hold their text to (packages/daemon/internal/api): the splitter, the document
              # parser under it and the contracts both read come with it.
              - 'packages/envoy/dispatchbody/*'
              - 'packages/envoy/internal/brokerclient/*'
              - 'packages/envoy/internal/contracts/*'
              - 'packages/envoy/internal/dispatch/itemblocks/*'
              - 'packages/envoy/internal/dispatch/model/*'
              - 'packages/envoy/internal/dispatch/pmdoc/**'
              - 'packages/envoy/internal/dispatch/text/*'
              - 'packages/envoy/internal/googleidentity/*'
              - 'packages/envoy/listenfd/*'
              # packages/envoy/migrationid is the identifier rule the daemon's embedded
              # migrations are held to, in the envoy module so both sets keep one rule.
              - 'packages/envoy/migrationid/*'
              # packages/envoy/roleholder names the reasons the listener refuses a role publish
              # with, which internal/notify reads as notify.ErrNoHolder.
              - 'packages/envoy/roleholder/*'
              # The one public door onto the generated Envoy session timings the daemon's
              # liveness and notice rules read: it sits in the envoy module because the
              # daemon, a module of its own, cannot reach internal/contracts, where they are.
              - 'packages/envoy/sessiontiming/*'
            # The listener's packages, `go list -deps ./cmd/listener` in packages/envoy.
            listener_command: &listener_command
