          - {leg: envoy-go-race-docs-1, suite: envoy-go-race-docs, part: 1, name: envoy-go-race-docs (1/2), runner: ubuntu-24.04-arm, timeout: 60, go: 33m}
          - {leg: envoy-go-race-docs-2, suite: envoy-go-race-docs, part: 2, name: envoy-go-race-docs (2/2), runner: ubuntu-24.04-arm, timeout: 64, go: 37m}
          - {leg: finalizers-1, part: 1, name: envoy-go-docs-finalizers (1/3), runner: ubuntu-24.04-arm, timeout: 43}
          - {leg: finalizers-2, part: 2, name: envoy-go-docs-finalizers (2/3), runner: ubuntu-24.04-arm, timeout: 43}
          - {leg: finalizers-3, part: 3, name: envoy-go-docs-finalizers (3/3), runner: ubuntu-24.04-arm, timeout: 43}
          - {leg: dispatch-memory-1, suite: dispatch-memory, part: 1, name: dispatch-memory (1/2), runner: ubuntu-24.04-arm, timeout: 32, go: 28m}
          - {leg: dispatch-memory-2, suite: dispatch-memory, part: 2, name: dispatch-memory (2/2), runner: ubuntu-24.04-arm, timeout: 38, go: 34m}
          - {leg: dispatch-multiprocess, name: dispatch-multiprocess / dispatch-multiprocess, runner: ubuntu-24.04-arm, timeout: 35}
          - {leg: dispatch-two-builds, name: dispatch-two-builds / dispatch-two-builds}
          - {leg: envoy-smoke, name: envoy-smoke / envoy-smoke, timeout: 20}
    services:
      postgres:
        image: ${{ matrix.leg != 'envoy-smoke' && 'ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11' || '' }}
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      JOB_TIMEOUT_MINUTES: ${{ matrix.timeout || 45 }}
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - if: ${{ !startsWith(matrix.leg, 'dispatch-two-builds') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # why: .github/ci-notes/ci.md#the-two-build-legs-checkouts
      - id: checkout
        if: startsWith(matrix.leg, 'dispatch-two-builds')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true
        with: {persist-credentials: false}
      - name: End the git processes and the workspace a first attempt cut at its budget leaves
        if: startsWith(matrix.leg, 'dispatch-two-builds') && steps.checkout.outcome != 'success'
        timeout-minutes: 2
        run: |
          pgrep -a git || true
          pkill -KILL -x git || true
          pkill -KILL -f git-remote-http || true
          while pgrep -x git > /dev/null || pgrep -f git-remote-http > /dev/null; do sleep 1; done
          pgrep -a git || echo "no git process is left"
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - name: Check out again, after a first attempt that did not complete
        if: startsWith(matrix.leg, 'dispatch-two-builds') && steps.checkout.outcome != 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with: {persist-credentials: false}
      - name: Fetch main's history and the release tags, without their files
        if: startsWith(matrix.leg, 'dispatch-two-builds')
        timeout-minutes: 2
        run: .github/scripts/fetch-release-history.sh
      - {name: envoy-go, if: matrix.suite == 'envoy-go', uses: ./.github/actions/go-envoy-held/envoy-go, with: {part: '${{ matrix.part }}', legs: 3, rest: '${{ matrix.rest }}', postgres: '${{ job.services.postgres.id }}'}}
      # why: .github/ci-notes/ci.md#the-envoy-go-unit-step-one-go-test-that-counts-the-brokers-skips
      - name: Unit test envoy Go package
        if: matrix.suite == 'envoy-go'
        timeout-minutes: 30
        working-directory: packages/envoy
        env: {LEG: '${{ matrix.part }}', DISPATCH_XID_REQUIRE_GAP_JUDGMENT: '1'}
        run: scripts/database-skips.sh --timeout 15m --skip '^(TestEverySecretFormNamesTheSourceItUses|TestFindMarksMatchesFindMarkOnAnchorCorpus|TestIncrementalRenderCorpus|TestNoSecretFormAsksTheBrokerForACredential|TestReanchorReuseMatchesPerCallOnAnchorCorpus|TestSettingsNameTheGoogleExchangeAudienceOnEitherStore|TestStatementTimings|TestTheChainSkipsAbsenceAndStopsOnABrokenSource|TestTheWebFixtureFindsItsFilesFromAnyDirectory|TestUseCommandOutsideASessionReachesTheMachineSource|TestValidDocumentRenderWithLayoutIsTheValidatingRender|TestWalkMatchesTheReferenceWalkOnACorpus|TestWebDisplayFixture|TestYTextRangesMatchesFrozenOnAnchorCorpus)$' --module-except '/integration|/internal/textcheck$|/internal/dispatch/architecture/notes$|/internal/runnerlog$|/internal/dispatch/specgraph$|/cmd/architecture-check$|/cmd/spec-check$|/listenerwire$|/internal/wirecheck$|/internal/dispatch/delivery($|/)|/internal/dispatch/store($|/)|/internal/bus$|/cmd/listener$|/internal/store$|/internal/session$|/internal/kvwatch($|/)|/natscred$|/internal/cipher/natscallout$|/internal/oidc$|/internal/dispatch/api$|/internal/dispatch/docs$' --run "$(../../.github/scripts/go-test-split.sh "$LEG" 3 $UNIT_PACKAGES)" --jsonfile "go-envoy-held-envoy-go-$LEG-unit.json"
      - {if: always() && matrix.suite == 'envoy-go', uses: ./.github/actions/go-test-upload, with: {name: 'go-envoy-held-envoy-go-${{ matrix.part }}-unit'}}
      - name: Check the statements on the seeded measurement database
        if: matrix.rest
        timeout-minutes: 15
        working-directory: packages/envoy
        env: {DISPATCH_BENCH_DATABASE_URL: 'postgres://postgres:ci@localhost:5432/dispatch_bench?sslmode=disable'}
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres dispatch_bench
          go run ./cmd/dispatch-seed --database-url "$DISPATCH_BENCH_DATABASE_URL" --scale 0.01
          ../../.github/scripts/go-test.sh --jsonfile go-envoy-held-envoy-go-timings-docs.json --packages ./internal/dispatch/docs/ -- -count=1 -timeout 5m -exec 'env GODEBUG=checkfinalizers=1' -run '^(TestStatementTimings)$'
          ../../.github/scripts/go-test.sh --jsonfile go-envoy-held-envoy-go-timings-refs.json --packages ./internal/dispatch/refs/ -- -count=1 -timeout 5m -run '^(TestStatementTimings)$'
      - {if: always() && matrix.rest, uses: ./.github/actions/go-test-upload, with: {name: go-envoy-held-envoy-go-timings}}
      - {name: envoy-go-race, if: "startsWith(matrix.leg, 'race-')", uses: ./.github/actions/go-envoy-held/envoy-go-race, with: {part: '${{ matrix.part }}', legs: 2, postgres: '${{ job.services.postgres.id }}'}}
      - {name: envoy-go-race-api, if: matrix.suite == 'envoy-go-race-api', uses: ./.github/actions/go-envoy-held/envoy-go-race-api, with: {part: '${{ matrix.part }}', legs: 2, postgres: '${{ job.services.postgres.id }}'}}
      - {name: envoy-go-claim-model, if: matrix.leg == 'envoy-go-claim-model', uses: ./.github/actions/go-envoy-held/envoy-go-claim-model}
      - {name: envoy-go-race-docs, if: matrix.suite == 'envoy-go-race-docs', uses: ./.github/actions/go-envoy-held/envoy-go-race-docs, with: {part: '${{ matrix.part }}', legs: 2, go-timeout: '${{ matrix.go }}', postgres: '${{ job.services.postgres.id }}'}}
      - {name: envoy-go-docs-finalizers, if: "startsWith(matrix.leg, 'finalizers-')", uses: ./.github/actions/go-envoy-held/envoy-go-docs-finalizers, with: {part: '${{ matrix.part }}', legs: 3, postgres: '${{ job.services.postgres.id }}'}}
      - {name: dispatch-memory, if: matrix.suite == 'dispatch-memory', uses: ./.github/actions/go-envoy-held/dispatch-memory, with: {part: '${{ matrix.part }}', legs: 2, go-timeout: '${{ matrix.go }}', postgres: '${{ job.services.postgres.id }}'}}
      - {name: dispatch-multiprocess, if: matrix.leg == 'dispatch-multiprocess', uses: ./.github/actions/go-envoy-held/dispatch-multiprocess, with: {postgres: '${{ job.services.postgres.id }}'}}
      - {name: dispatch-two-builds, if: matrix.leg == 'dispatch-two-builds', uses: ./.github/actions/go-envoy-held/dispatch-two-builds, with: {postgres: '${{ job.services.postgres.id }}'}}
      - {name: dispatch-two-builds-same, if: matrix.leg == 'dispatch-two-builds-same', uses: ./.github/actions/go-envoy-held/dispatch-two-builds-same, with: {postgres: '${{ job.services.postgres.id }}'}}
      - {name: envoy-smoke, if: matrix.leg == 'envoy-smoke', uses: ./.github/actions/go-envoy-held/envoy-smoke}
      - *report

  envoy-go:
    name: ${{ github.event_name && 'envoy-go / envoy-go' }}
    needs: [changes, go-envoy-held]
    if: &held-carrier ${{ !cancelled() && needs.changes.outputs.go-envoy-held == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env: {JOB_TIMEOUT_MINUTES: 10}
    steps:
      - *checkout-github
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'envoy-go (1/3)' 'envoy-go (2/3)' 'envoy-go (3/3)'
      - *report

  envoy-go-race:
    name: ${{ github.event_name && 'envoy-go-race / envoy-go-race' }}
    needs: [changes, go-envoy-held]
    if: *held-carrier
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env: {JOB_TIMEOUT_MINUTES: 10}
    steps:
      - *checkout-github
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'envoy-go-race (1/2)' 'envoy-go-race (2/2)'
      - *report

  envoy-go-race-api:
    name: ${{ github.event_name && 'envoy-go-race-api / envoy-go-race-api' }}
    needs: [changes, go-envoy-held]
    if: *held-carrier
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env: {JOB_TIMEOUT_MINUTES: 10}
    steps:
      - *checkout-github
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'envoy-go-race-api (1/2)' 'envoy-go-race-api (2/2)'
      - *report

  envoy-go-race-docs:
    name: ${{ github.event_name && 'envoy-go-race-docs / envoy-go-race-docs' }}
    needs: [changes, go-envoy-held]
    if: *held-carrier
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env: {JOB_TIMEOUT_MINUTES: 10}
    steps:
      - *checkout-github
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'envoy-go-race-docs (1/2)' 'envoy-go-race-docs (2/2)'
      - *report

  envoy-go-docs-finalizers:
    name: ${{ github.event_name && 'envoy-go-docs-finalizers / envoy-go-docs-finalizers' }}
    needs: [changes, go-envoy-held]
    if: *held-carrier
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env: {JOB_TIMEOUT_MINUTES: 10}
    steps:
      - *checkout-github
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'envoy-go-docs-finalizers (1/3)' 'envoy-go-docs-finalizers (2/3)' 'envoy-go-docs-finalizers (3/3)'
      - *report

  dispatch-memory:
    name: ${{ github.event_name && 'dispatch-memory / dispatch-memory' }}
    needs: [changes, go-envoy-held]
    if: *held-carrier
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env: {JOB_TIMEOUT_MINUTES: 10}
    steps:
      - *checkout-github
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: .github/scripts/leg-verdict.sh 'dispatch-memory (1/2)' 'dispatch-memory (2/2)'
      - *report

  airlock-arm:
    needs: changes
    if: needs.changes.outputs.airlock-arm == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ format('airlock-arm / {0}', matrix.leg) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env: {JOB_TIMEOUT_MINUTES: 45}
    strategy: {fail-fast: false, matrix: {leg: [k9, lease]}}
    services:
      postgres: *postgres
    steps:
      - *checkout
      - {uses: ./.github/actions/airlock-arm, with: {leg: '${{ matrix.leg }}'}}
      - *report

  text-checks:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.text-checks == 'true') }}
    name: ${{ github.event_name && 'text-checks / text-checks' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env: {JOB_TIMEOUT_MINUTES: 15}
    steps:
      - *checkout
      - name: text-checks
        uses: ./.github/actions/text-checks
      - *report

  notices:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.notices == 'true') }}
    name: ${{ github.event_name && 'notices / notices' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env: {JOB_TIMEOUT_MINUTES: 30}
    steps:
      - *checkout
      - name: notices
        uses: ./.github/actions/notices
      - *report

  worker-image:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.worker-image == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ github.event_name && 'worker-image' }}
    uses: ./.github/workflows/worker-image.yaml
    # why: .github/ci-notes/ci.md#the-worker-image-jobs-scopes
    permissions:
      contents: read
      packages: write
      actions: read
      checks: write
      id-token: write
      attestations: write
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  browser-image:
    needs: changes
    if: needs.changes.outputs.browser-image == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    name: ${{ github.event_name && 'browser-image' }}
    uses: ./.github/workflows/browser-image.yaml
    # why: .github/ci-notes/ci.md#the-browser-image-job
    permissions:
      contents: read
      packages: write
      actions: read
      checks: write
      id-token: write
      attestations: write
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#the-pr-title-job
  pr-title:
    name: ${{ github.event_name == 'workflow_dispatch' && 'pr-title (dispatch)' || 'pr-title' }}
    if: ${{ !github.event.pull_request.draft && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env: {JOB_TIMEOUT_MINUTES: 10}
    # why: .github/ci-notes/ci.md#what-the-pr-title-jobs-scopes-are-for
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - *checkout-github

      # why: .github/ci-notes/ci.md#why-pr-title-refuses-a-re-run-attempt-in-a-step-of-its-own
      - name: Refuse a re-run attempt of a merge-group run
        if: ${{ github.event_name == 'merge_group' && github.run_attempt != '1' }}
        run: .github/scripts/refuse-run.sh pr-title-attempt

      # why: .github/ci-notes/ci.md#the-pr-title-check-step
      - name: Check the pull request's title, body, branch name, commits, comments and reviews
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_NAME_TERMS: ${{ secrets.PRIVATE_NAME_TERMS }}
        run: |
          payload=$("$GITHUB_WORKSPACE/.github/scripts/find-pr-payload.sh")
          GITHUB_EVENT_PATH="$payload" "$GITHUB_WORKSPACE/.github/scripts/check-pr-text.sh"

  # why: .github/ci-notes/ci.md#the-merge-queues-cancel-act
  cancel-started:
    name: ${{ github.event_name && 'cancel-started' }}
    if: ${{ github.event_name == 'merge_group' && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env: {JOB_TIMEOUT_MINUTES: 10}
    permissions:
      actions: write
    steps:
      - *checkout-github
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/cancel-started-act.sh

  # why: .github/ci-notes/ci.md#the-ci-ok-job
  ci-ok:
    # why: .github/ci-notes/ci.md#a-dispatched-runs-check-names
    name: ${{ github.event_name == 'workflow_dispatch' && needs.changes.outputs.ref_is_main != 'true' && 'ci-ok (dispatch)' || 'ci-ok' }}
    needs: [changes,lint,scripts,scripts-held,ci-images,tool-fallback,tool-fallback-arm,go-daemon,daemon-go,daemon-go-race,plugin-pack,daemon-live,agent-harness,kind-image,kind,docs,ts,web-cold,pi,pi-held,claude-envoy-names,dispatch-browser,dispatch-browser-pr,go-envoy,envoy-held,go-envoy-held,envoy-go,envoy-go-race,envoy-go-race-api,envoy-go-race-docs,envoy-go-docs-finalizers,dispatch-memory,airlock-arm,text-checks,notices,worker-image,browser-image]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    # why: .github/ci-notes/ci.md#why-every-job-sets-job_timeout_minutes
    timeout-minutes: 188 # verdict 10 + hold 175 + 3 for the checkout and two refusals
    env: {JOB_TIMEOUT_MINUTES: 188}
    permissions:
      actions: read
      checks: write
    steps:
      # why: .github/ci-notes/ci.md#what-ci-ok-checks-out
      - *checkout-github

      # why: .github/ci-notes/ci.md#why-a-draft-pull-request-is-refused-in-a-step
      - name: Refuse a draft pull request
        if: ${{ github.event.pull_request.draft }}
        run: .github/scripts/refuse-run.sh ci-ok-draft

      # why: .github/ci-notes/ci.md#why-a-re-run-attempt-of-a-merge-group-run-is-refused-in-a-step
      - name: Refuse a re-run attempt of a merge-group run
        if: ${{ github.event_name == 'merge_group' && github.run_attempt != '1' }}
        run: .github/scripts/refuse-run.sh ci-ok-attempt

      - {if: always(), uses: ./.github/actions/ci-ok-retries}

      # why: .github/ci-notes/ci.md#what-needs-holds
      - name: Judge every job of this run
        id: verdict
        timeout-minutes: 10
        env:
          STEP_TIMEOUT_MINUTES: 10
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          SELECTED_BY: ${{ env.CI_OK_SELECTED_BY }}
          PULL_REQUEST_ONLY: ${{ env.CI_OK_PULL_REQUEST_ONLY }}
          ALWAYS_RUN: ${{ env.CI_OK_ALWAYS_RUN }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/ci-ok.sh

      # why: .github/ci-notes/ci.md#why-a-failing-verdict-of-a-group-behind-the-front-waits-for-the-front
      - name: Hold a failing verdict until this group is the front of the queue
        if: ${{ !cancelled() && steps.verdict.outcome == 'failure' && github.event_name == 'merge_group' && github.run_attempt == '1' }}
        timeout-minutes: 175 # the age's 170 + the last pause and read's ladder, 2
        env:
          STEP_TIMEOUT_MINUTES: 175
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          CI_OK_HOLD_AGE_SECONDS: 10200 # 170 minutes, inside the queue's 180
          CI_OK_HOLD_RUN_SECONDS: 3330 # 55.5 minutes
        run: .github/scripts/ci-ok-hold.sh

      # why: .github/ci-notes/ci.md#the-reconcile-step
      - name: Set every other ci-ok on this head to this job's conclusion
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || needs.changes.outputs.ref_is_main == 'true') && !(steps.verdict.outcome == 'failure' && github.event_name == 'merge_group' && github.run_attempt == '1') }}
        timeout-minutes: 10
        env:
          STEP_TIMEOUT_MINUTES: 10
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
          CONCLUSION: ${{ job.status }}
        run: .github/scripts/ci-ok-reconcile.sh
