  # why: .github/ci-notes/ci.md#the-download-retry-job-the-retries-against-the-two-faults-they-answer
  download-retry:
    needs: changes
    if: needs.changes.outputs.download_retry == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    permissions:
      contents: read
