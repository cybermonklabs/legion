      checks: write
    uses: ./.github/workflows/ci-job-download-retry.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}
      download_retry_sites: ${{ needs.changes.outputs.download_retry_sites }}
      download_retry_images: ${{ needs.changes.outputs.download_retry_images }}

  # why: .github/ci-notes/ci.md#what-the-proof-editors-offline-proof-shows
  proof-sdk-offline:
    needs: changes
    if: needs.changes.outputs.proof_sdk_offline == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    permissions:
