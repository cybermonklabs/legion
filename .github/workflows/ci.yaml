            # It names every harness group above and the guide-layout step's files, because a
            # job's `if:` tests one changes output and nothing runs in a job that is not
            # selected: the groups decide which steps run, this filter decides whether the job
            # they are in runs at all.
            test:
              - *ci_router
              - '.github/workflows/ci-job-test.yaml'
              - *bun_install
              - *biome
              # The workspace of the one go command left here - the listener build
              # scripts/e2e/lib/held-port.test.ts starts - and of the setup-go that installs the
              # Go for it (packages/daemon/go.mod). The `legion` build of the private-name port
              # harness, which put that binary's whole closure on this filter, is the
              # private-names-port job's now, with the filter below.
              - *go_workspace
              # Two of its steps read this list: verify-build builds and checks the Claude Code
              # plugin as the release does, and the build-input-list step runs
              # packages/claude-envoy/tests/build-inputs.test.ts.
              - *claude_envoy_build
              # scripts/e2e/lib/held-port.test.ts:45 builds the real envoy-listener.
              - *listener_command
              # scripts/e2e/lib/nats-image.test.ts builds natsfloor, the command it asks the NATS
              # floor through; its natsversion package is in the listener's list above.
              - 'packages/envoy/natsversion/cmd/natsfloor/*'
              # Each harness step's own gate, named here so the job runs for the change that
              # makes one of those gates true. Each of those lists names this file and
              # ci-job-test.yaml, as every gate filter does, so the flattened list repeats the
              # two patterns already above; a repeated pattern selects what it selected.
              - *release_push_test
              - *release_bump_test
              - *check_bun_version_test
              - *check_playwright_version_test
              - *check_bun_workspace_manifests_test
              - *check_zod_version_test
              - *check_gh_version_test
              - *check_gitleaks_version_test
              - *workflow_paths_test
              - *check_image_trigger_paths_test
              - *check_ci_images_test
              - *mirror_ci_images_test
              - *ci_tools_test
              - *mirror_ci_tools_test
              - *check_ci_tools_test
              - *ci_tools_proof_test
              - *check_action_pins_test
              - *check_private_names_test
              - *check_private_names_terms_test
              - *check_private_names_keys_test
              - *check_plugin_names_test
              - *check_fireevent_reasons_test
              - *check_daemon_api_contract_test
              - *check_release_credentials_test
              - *repo_paths_test
              - *select_e2e_proofs_test
              - *go_tagged_tests_test
              - *ci_ok_test
              - *ci_ok_report_test
              - *ci_ok_reconcile_test
              - *find_pr_payload_test
              - *merge_group_cancels_test
              - *main_bypass_check_test
              - *edited_migrations_base_test
              - *dispatch_browser_latest_blobs_test
              - *dispatch_browser_run_reads_test
              - *dispatch_browser_samples_test
              - *race_memory_test
              - *disk_watch_test
              - *priorities_seed_check_test
              - *check_ci_filters_test
              - *check_ts_filters_test
              - *go_test_step_expansion_test
              # The guide-layout step's own files, for that same reason: its gate is
              # guide_layout below, and a guide-only change has to select this job for it.
              - *guide_layout_files
              - 'scripts/third-party-notices.test.ts'
              # scripts/third-party-notices.test.ts:102-105 lists the Dispatch web app's typeface:
              # it resolves the font file's path, lists that directory and reads the package.json
              # and LICENSE.txt in it.
              - 'packages/dispatch/web/src/fonts/inter/**'
              - 'scripts/third-party-notices.ts'
              - 'scripts/semantic-line-breaks.ts'
              - 'scripts/semantic-line-breaks.test.ts'
              # The priorities seed's Bun test, which runs on every run of this job.
              - 'scripts/priorities-seed.ts'
              - 'scripts/priorities-seed.test.ts'
              # `bun test scripts/e2e/lib` scans scripts/e2e/*.sh (lib/script-functions.test.ts:101-104),
              # and its tests read the daemon sources and fixtures named below. The e2e
              # libraries and the census script import contracts and envoy-client, which
              # claude_envoy_build names.
              - 'scripts/e2e/**'
              - 'packages/contracts/fixtures/daemon-api/**'
              - 'packages/daemon/internal/daemon/controller.go'
              - 'packages/daemon/internal/controller/liveness.go'
              - 'packages/daemon/internal/supervise/machine.go'
