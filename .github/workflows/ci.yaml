  # The Lean model of the airlock and the Go code it covers: the model is built, the axioms the
  # theorems Axioms.lean names rest on are printed and held to the three Lean's own kernel admits, and
  # FuzzAirlock drives Validate, Decide and Rewrite against the model's program, so a change made
  # on one side and not on the other fails here rather than in production.
  #
  # The fuzz run is two minutes, because this is a required check and a required check stays
  # short. The ten-minute run the issue's verification asks for is the implementer's recorded
  # result on the head that merges, not this job.
  airlock-lean:
    needs: changes
    if: needs.changes.outputs.airlock_lean == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 1200 s, the 20 minutes this job carried, above the
    # 185 s maximum of the four runs made of it on this branch — it was selected by no main push
    # in the window that note names — plus its slowest retried step alone: install-elan's one
    # `ci_tools_fetch` of the elan tarball, 1281 s, above the ci-ok report's 600 s.
    # 1200 + 1281 = 2481 s -> 42 min.
    timeout-minutes: 42
    env:
      # The built model the two runs below compare the Go code against. Naming no file makes
      # FuzzAirlock skip (internal/broker/airlock/airlock_fuzz_test.go:32-46), and a skip is a
      # pass, so the build step checks the binary is there before those runs read this.
      AIRLOCK_MODEL: ${{ github.workspace }}/packages/envoy/internal/broker/airlock/lean/.lake/build/bin/airlock-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # No Go cache family: the airlock package imports the standard library alone, so this job
      # downloads no module and compiles no third-party code, as envoy-go-race-api does.
      #
      # elan and the Lean toolchain it installs, under the ELAN_HOME
      # .github/actions/install-elan sets ($RUNNER_TEMP/elan, under the runner's work directory),
      # keyed on the content of the lean-toolchain the model is built with. No restore-keys: an
      # entry of another toolchain is exactly what this key keeps out, and `lake` would download
      # the named one anyway. .github/workflows/ci-caches.yaml fills it on a push to main, as it
      # fills every family this file restores.
      - id: elan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/elan
          key: elan-${{ runner.os }}-${{ hashFiles('packages/envoy/internal/broker/airlock/lean/lean-toolchain') }}
      # install-elan's own retry arithmetic: one `ci_tools_fetch` of the release tarball, 1281 s
      # (ci-budgets.md's Budgets note) -> 22 min.
      - uses: ./.github/actions/install-elan
        timeout-minutes: 22
      - name: Build the Lean model
        run: |
          lake build
          test -x .lake/build/bin/airlock-model
        working-directory: packages/envoy/internal/broker/airlock/lean
      # What the three axioms are, and why fewer theorems printed than the model has is a
      # failure, is in the script. Check k15 of packages/envoy/scripts/airlock-check.sh runs the
      # same one, so the rule and the count it holds are written once.
      - name: Print the theorems' axioms
        run: bash packages/envoy/scripts/airlock-lean-axioms.sh packages/envoy/internal/broker/airlock/lean
      # The committed seed corpus (testdata/fuzz/FuzzAirlock): every seed through both sides.
      - name: Compare the Go airlock with the model over the seed corpus
        run: go test -run FuzzAirlock ./internal/broker/airlock/
        working-directory: packages/envoy
      - name: Fuzz the Go airlock against the model
        run: go test -fuzz FuzzAirlock -fuzztime=120s -run FuzzAirlock ./internal/broker/airlock/
        working-directory: packages/envoy


      - name: Report ci-ok when this is the run's last job
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The container smoke test, the envoy-infra plugin's live tests, and the image both run. Its own
  # job, gated on envoy_smoke: the image is built from the Dispatch SPA and the Bun workspace as
  # well as the Go sources, so a Dispatch-only change changes the image and must smoke it, without
  # running envoy-go's whole Go suite. When the smoke lived in envoy-go, PR #1562 (packages/dispatch
  # only) skipped envoy-go and never smoked the image it changed (run 36494702052).
  # .github/scripts/check-image-trigger-paths.sh fails the build when envoy_smoke misses a file the
  # build reads.
  envoy-smoke:
    needs: changes
    if: needs.changes.outputs.envoy_smoke == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 1200 s, the 20 minutes this job carried, above its
    # 691 s measured maximum, plus its slowest retried step alone — the Go module download,
    # whose two calls for packages/envoy and packages/envoy/infra are 2 x (5 x 180 + 150) =
    # 2100 s, above install-pulumi's 1281 s, the docker provider plugin's 1281 s and the ci-ok
    # report's 600 s. That arithmetic is a whole number of minutes, so the step's own budget
    # takes one more and this job takes it too: 1200 + 2160 = 3360 s -> 57 min, the whole minute above a sum that is itself a whole number of minutes.
    timeout-minutes: 57
    env:
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image would be one more registry pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # The listener image the smoke test runs, built by its own step below.
      ENVOY_SMOKE_IMAGE: legion-envoy-smoke:${{ github.sha }}
      # The image envoy-infra's live tests run, built on top of ENVOY_SMOKE_IMAGE by its own step
      # below.
      ENVOY_SMOKE_HELD_PORT_IMAGE: legion-envoy-smoke-heldport:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # Both modules this job compiles on the host: packages/envoy for the smoke test, and
      # packages/envoy/infra, a workspace of its own, for the live tests and the plugin build.
      # Downloaded once and retried before any of them (ci-budgets.md's Retries note; the retried
      # unit is the download, never the build and never the test). 180 s per attempt: cold
      # `go mod download` runs measured 77 s for packages/envoy and 113 s for
      # packages/envoy/infra on an empty module cache on 2026-11-07, so the bound is 1.6 times
      # the slower of the two, and an attempt it kills leaves what it fetched in the module
      # cache for the next one to resume from. This job restores no module cache, so this is
      # where its modules arrive. The image builds below download inside the image.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic: two calls, 2 x (5 x 180 + 150) = 2100 s, a whole number of
        # minutes, so the budget is the next one strictly above it -> 36 min.
        timeout-minutes: 36
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
          retry_fetch "packages/envoy/infra's Go modules" 180 -- go -C packages/envoy/infra mod download
      # Every image the build or the test starts (testnats.Image and the smoke image's base
      # images) is pulled first, for the reason .github/actions/pull-test-images gives. Every
      # FROM of docker/Dockerfile names a digest and no ARG, so the substitution below expands
      # nothing today; it stays because a FROM written as an ARG would otherwise be pulled as
      # the literal `${NAME}`.
      - name: Read the smoke image's base images
        id: base-images
        run: |
          {
            echo "images<<IMAGES"
            awk '
              $1 == "ARG" { eq = index($2, "="); if (eq > 0) args[substr($2, 1, eq - 1)] = substr($2, eq + 1) }
              $1 == "FROM" { image = $2; for (name in args) gsub("[$][{]" name "[}]", args[name], image); print image }
            ' docker/Dockerfile
            echo "IMAGES"
          } >> "$GITHUB_OUTPUT"
        working-directory: packages/envoy
      - name: Pull test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: packages/envoy/internal/testnats/nats.go Image
          images: ${{ steps.base-images.outputs.images }}
      # The image build is a step of its own: what TestSmoke asserts is the container's
      # behaviour, so a slow build must fail nothing. Inside the test it spent 256.60–289.47 s
      # of `go test -timeout 5m` across ten Release Envoy Listener runs while the five
      # assertions measured 0.00 s each (LEGION-361;
      # docs/solutions/testing/a-container-build-inside-go-test-spends-the-tests-deadline.md).
      # The test refuses to run without ENVOY_SMOKE_IMAGE rather than building one, so dropping
      # or renaming this step turns the lane red instead of restoring that budget silently.
      # `load: true` is Docker's documented test-before-push shape, and the only build form
      # .github/scripts/check-image-trigger-paths.sh can read. No LEGION_COMMIT: this job
      # publishes no image to match. The pull step above put the base images in the daemon's
      # store, which the default `docker` driver reads.
      - name: Build the listener image the smoke test runs against
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # This build never pushes, and its Metadata log is confirmed empty of both an
          # attestation and this job's pull_request payload today (no docker/setup-buildx-action
          # here means no docker-container builder, so buildx never captures the CI event into the
          # provenance predicate in the first place). Hardened anyway, so a future change that adds
          # one (for cache, say) can't reopen either leak; worker-image.yaml's identical block is
          # the confirmed-necessary case.
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: packages/envoy/docker/Dockerfile
          load: true
          provenance: false
          tags: ${{ env.ENVOY_SMOKE_IMAGE }}
      # The image envoy-infra's live tests run (pulumitest.HeldPortImage): the smoke image above with
      # packages/envoy/infra/host/heldportwrapper as its envoy-listener, which takes the listening
      # socket the test holds for the container's port over an abstract unix socket and executes the
      # real listener on it, so the port stays held from the test's bind until the listener serves.
      # Its Dockerfile builds the wrapper from the tree, on the Go image the smoke image's build
      # pulled, so this build reads only files the envoy_smoke filter names. The smoke test keeps
      # running the smoke image itself.
      - name: Build the held-port listener image the envoy-infra live tests run
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # As the smoke image's build above.
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: packages/envoy/infra/host/heldportwrapper/Dockerfile
          build-args: BASE=${{ env.ENVOY_SMOKE_IMAGE }}
          load: true
          provenance: false
          tags: ${{ env.ENVOY_SMOKE_HELD_PORT_IMAGE }}
      # The image's notices (packages/envoy/docker/Dockerfile): the build fails when a license cannot
      # be determined, and the listing shows the image ships both files.
      - name: List the image's third-party notices
        run: >-
          docker run --rm --entrypoint ls "$ENVOY_SMOKE_IMAGE" -l
          /usr/share/doc/legion/THIRD_PARTY_NOTICES /srv/dispatch-web/THIRD_PARTY_NOTICES.txt
      # 5m bounds only what the test does: pull NATS, start both containers behind the test's
      # own 60 s health wait, and assert. This job has measured 1.82 s, 3.16 s and 1.88 s (the
      # last in run 36508580490), and 2.2–20.7 s across four runs on a devbox at load average
      # 80, so the bound is deliberate headroom, not a build budget.
      - name: Container smoke test (testcontainers)
        run: go test -tags smoke -v -timeout 5m ./internal/smoke/
        working-directory: packages/envoy
      # The envoy-infra plugin's live tests (packages/envoy/infra/host/live_test.go) apply Pulumi
      # YAML programs with the pinned Pulumi CLI (.github/actions/install-pulumi) against this
      # runner's Docker, on the held-port image built above and on the docker provider the plugin's
      # first consumer pins. Each download is checked against its SHA-256 before it is unpacked or
      # installed.
      - name: Install the Pulumi CLI
        # install-pulumi's own retry arithmetic: one `ci_tools_fetch`, 1281 s (ci-budgets.md's
        # Budgets note) -> 22 min.
        timeout-minutes: 22
        uses: ./.github/actions/install-pulumi
      # The `pulumi-docker` row of .github/ci-tools.yaml pins the version and the sha256 of that
      # tarball, and .github/scripts/check-ci-tools.sh holds the row's version to
      # `const DockerPluginVersion` of internal/pulumitest/pulumitest.go, the constant the live
      # programs pin the plugin at. The step hands the tarball's path to the live tests as its
      # `tarball` output, set in their step's env as ENVOY_INFRA_DOCKER_PLUGIN (not written to
      # $GITHUB_ENV, which every later step would inherit and check-ci-filters.sh treats as
      # reaching the job's go commands). The live tests install the verified tarball into a
      # PULUMI_HOME of their own, so the CLI downloads none.
      - name: Download the docker provider plugin the live tests install
        id: docker-plugin
        # Its own retry arithmetic, which is the action's: one `ci_tools_fetch`, 1281 s
        # (ci-budgets.md's Budgets note) -> 22 min.
        timeout-minutes: 22
        uses: ./.github/actions/install-docker-plugin
      # The live tests build container images on this runner's disk, and a job that runs out of
      # space says only that it did. The pair around the step measures it, and measures the two
      # readings beside it: `start` prints what each file system the job writes to has free and
      # leaves a sampler watching the one that holds /tmp, the memory the kernel reports
      # available and the one-minute load, one line per second; `report` stops the sampler and
      # prints the worst each of them reached, with the free space the step began with, the
      # least it ever had and the difference, and `margin short` when the step used more than
      # half of what it started with (dispatch://INFRA-1085, dispatch://INFRA-2605). The report
      # prints and never fails the job: this is the measurement, not a new gate. The two steps
      # share their state through a file under $RUNNER_TEMP rather than $GITHUB_ENV, which every
      # later step of the job would inherit and check-ci-filters.sh treats as reaching the job's
      # go commands.
      - name: Start the machine watch over the live tests
        run: .github/scripts/disk_watch.py start --path /tmp --state "$RUNNER_TEMP/disk-watch.json"
      - name: Live tests of envoy-infra's host:Listener
        run: go test -tags pulumilive -v -timeout 15m ./host/
        working-directory: packages/envoy/infra
        env:
          ENVOY_INFRA_DOCKER_PLUGIN: ${{ steps.docker-plugin.outputs.tarball }}
      - name: Report what the live tests ran on
        if: always()
        run: .github/scripts/disk_watch.py report --state "$RUNNER_TEMP/disk-watch.json"
      # The schema carries both of the things the release build stamps into the plugin: the
      # version, and the download URL .github/scripts/repo-paths.sh derives from the repository
      # the run is in (release-envoy-infra.yaml's "Derive the plugin's download URL" and its
      # build step). That workflow runs on main alone, so this build is what proves the stamp
      # before a merge, and it proves it under the name the transfer gives the repository rather
      # than today's: a provider.go that pinned the address instead of taking the -X would still
      # serve cybermonklabs/legion here and fail. ${VERSION} is Pulumi's own placeholder, filled in at
      # install, so the URL is compared literally. The step runs in the module, so the script is
      # reached by its path from the repository root, and the binary goes under $RUNNER_TEMP as
      # the docker provider's tarball above does.
      - name: The envoy-infra plugin's schema carries the version and the download URL it was built with
        run: |
          url=$(GITHUB_REPOSITORY=cybermonklabs/legion ../../../.github/scripts/repo-paths.sh plugin_download_url)
          go build -ldflags "-X main.version=1.2.3 -X 'github.com/sjawhar/envoy/infra/provider.downloadURL=$url'" -o "$RUNNER_TEMP/pr" ./cmd/pulumi-resource-envoy-infra
          # shellcheck disable=SC2016 # ${VERSION} is Pulumi's placeholder, not a shell expansion
          pulumi package get-schema "$RUNNER_TEMP/pr" | jq -e '.version == "1.2.3" and .pluginDownloadURL == "https://github.com/cybermonklabs/legion/releases/download/envoy-infra-v${VERSION}"'
        working-directory: packages/envoy/infra

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # packages/envoy/scripts/e2e-local.sh: signed GitHub fixtures and a direct message through a real
  # listener and NATS, every frame rendered by both inbound renderers (renderInbound and Go's
  # Deliverer.Text) and checked against the acceptance contract.
  envoy-e2e-local:
    needs: changes
    if: needs.changes.outputs.envoy_e2e_local == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 600 s, the 10 minutes this job carried, above its 92 s
    # measured maximum, plus its slowest retried step alone — the setup-bun step's two
    # `ci_tools_fetch` calls, 2562 s, above packages/envoy's `go mod download` and the
    # workspace install at 5 x 180 + 150 = 1050 s each and the ci-ok report's 600 s.
    # 600 + 2562 = 3162 s -> 53 min.
    timeout-minutes: 53
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its own retry arithmetic, which is the action's: two `ci_tools_fetch` calls,
      # 2 x 1281 = 2562 s (ci-budgets.md's Budgets note) -> 43 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 43
      # Retried at 180 s per attempt like every Bun install here (ci-budgets.md's Retries note).
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # go-envoy: the listener and natsd e2e-local.sh builds.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-{0}-', runner.os) }}
      # The module e2e-local.sh builds the listener and natsd from, downloaded once and retried
      # before it (ci-budgets.md's Retries note; the retried unit is the download, never the build).
      # 180 s per attempt, 1.6 times the 113 s of the slowest cold run measured
      # (packages/envoy/infra; packages/envoy 77 s, on an empty module cache on 2026-11-07), and
      # an attempt the bound kills leaves what it fetched for the next one; the restore above
      # makes the common run cost nothing.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      # scripts/e2e-local.test.sh drives the driver's refusals, which the acceptance run below
      # never reaches: an unknown option, --help, and an E2E_NATS_PORT, E2E_PORT or E2E_SESSION_PORT
      # another process already holds, which the driver uses as given and fails on rather than
      # replacing it or running against a server it did not start. It needs the bun and go this job
      # already has, and it runs first because it is seconds (INFRA-250).
      - name: Refusal test for e2e-local.sh
        run: bash scripts/e2e-local.test.sh
        working-directory: packages/envoy
      - name: Local end-to-end acceptance
        run: bash scripts/e2e-local.sh
        working-directory: packages/envoy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: envoy-e2e-local-evidence-${{ github.run_attempt }}
          path: packages/envoy/out/e2e
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The session stall suites (INFRA-548): each freezes a session's NATS path behind
  # envoy-client's stall proxy (test/stall-proxy.ts) on a real natsd and listener, which
  # test/envoy-stack.ts builds with go build from packages/envoy, and holds the client to a
  # reconnect within 60 s: envoy-client's shared connection options on their own, then the real
  # pi-envoy extension and the real claude-envoy channel server on consumer delivery, each
  # subscribing its relay subject again on the new connection, registering a new epoch, and showing
  # the message sent while it was cut off once. They run only with LEGION_E2E_ENVOY_STACK=1,
  # which only this job sets, so the envoy-client, pi-envoy and claude-envoy jobs, which set up no
  # Go, skip them.
  #
  # The session state rig (dispatch://INFRA-392) runs on the same stack and needs no agent: it
  # SIGSTOPs a child process carrying envoy-client's own registration and heartbeat and holds the
  # listener to `unresponsive` — the role claim kept, the send stored — until the gone horizon.
  # Its longest property waits out that horizon and one reaper pass: the role claim reaper runs
  # at ENVOY_ROLE_CLAIM_REAP_INTERVAL, which the rig sets to two seconds, so the suite costs the
  # horizon rather than the five minutes that reaper's own default would cost it.
  # The live Dispatch-stack suite rides this job too (dispatch://INFRA-1727). It builds
  # packages/envoy's ./cmd/dispatch, makes a database of its own on DISPATCH_TEST_DATABASE_URL and
  # runs the real `dispatch` CLI against that server (packages/envoy-client/test/dispatch-stack.ts),
  # so it needs a PostgreSQL and a Go, which this job is the only envoy-client lane to have: the
  # envoy-client job sets up neither, so a suite gated on LEGION_E2E_DISPATCH_STACK would skip
  # there for ever. The filter envoy_session_stall already selects packages/envoy/** and
  # packages/envoy-client/**, so the suite brings no new path into this job's closure.
  envoy-session-stall:
    needs: changes
    if: needs.changes.outputs.envoy_session_stall == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 1200 s, the 20 minutes this job carries since
    # main's #3579 gave it a PostgreSQL service and the live Dispatch-stack suite, plus its
    # slowest retried step alone — the setup-bun step's two `ci_tools_fetch` calls, 2562 s,
    # above packages/envoy's `go mod download` and the workspace install at 5 x 180 + 150 =
    # 1050 s each and the ci-ok report's 600 s.
    # 1200 + 2562 = 3762 s -> 63 min.
    timeout-minutes: 63
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEGION_E2E_ENVOY_STACK: "1"
      LEGION_E2E_DISPATCH_STACK: "1"
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its own retry arithmetic, which is the action's: two `ci_tools_fetch` calls,
      # 2 x 1281 = 2562 s (ci-budgets.md's Budgets note) -> 43 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 43
      # Retried at 180 s per attempt like every Bun install here (ci-budgets.md's Retries note).
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # go-envoy: the listener and natsd test/envoy-stack.ts builds, as envoy-e2e-local's
      # e2e-local.sh does.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-{0}-', runner.os) }}
      # The module test/envoy-stack.ts builds the listener and natsd from, downloaded once and
      # retried before the suites start it (ci-budgets.md's Retries note; the retried unit is the
      # download, never the build). 180 s per attempt, 1.6 times the 113 s of the slowest cold
      # run measured (packages/envoy/infra; packages/envoy 77 s, on an empty module cache on
      # 2026-11-07), and an attempt the bound kills leaves what it fetched for the next one; the
      # restore above makes the common run cost nothing.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      - name: Build contracts for the stall suites
        run: bun run build
        working-directory: packages/contracts
      - name: Stall test of envoy-client's NATS connection options
        run: bun test src/__tests__/nats-stall.test.ts
        working-directory: packages/envoy-client
      # A path, not a filter: bun test discovers only names holding ".test" or ".spec", and takes
      # this one as a file because of the leading "./".
      - name: Session state rig of a stalled session
        run: bun test ./test/session-stall.ts
        working-directory: packages/envoy-client
      - name: Stall test of pi-envoy
        run: bun test extensions/envoy.test.ts -t "NATS path freezes"
        working-directory: packages/pi-envoy
      - name: Stall test of claude-envoy
        run: bun test tests/envoy-channel-stall.test.ts
        working-directory: packages/claude-envoy
      # The role takeover smoke (INFRA-404, A5): one line per row of its spec's R8 table, driven
      # with real client processes against a listener and natsd this job already sets Go up for.
      # It needs no model provider and no deployment, so unlike the other smokes in
      # packages/pi-envoy/scripts it runs here.
      - name: Role takeover smoke
        run: bash packages/pi-envoy/scripts/smoke-role-takeover.sh
      # The design-gate advice over the real CLI and a real Dispatch server (dispatch://INFRA-1727):
      # the server this suite starts is built from this tree, so what it asserts is the sentence a
      # person reads in a terminal rather than one rendered from a stub.
      - name: Design-gate advice of the real CLI against a real Dispatch
        run: bun test src/__tests__/design-gate-advice.live.test.ts
        working-directory: packages/envoy-client
      # The moved-approval-request advice over the same real CLI and real Dispatch
      # (dispatch://INFRA-3096): it proves the field the server fills on a write that takes an
      # open approval request back from the person is the field the CLI reads and prints.
      - name: Moved-approval advice of the real CLI against a real Dispatch
        run: bun test src/__tests__/moved-approval-advice.live.test.ts
        working-directory: packages/envoy-client
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # Holds every filter in `changes` to every file its job reads, recomputing each Go job's closure
  # with go list (.github/scripts/check-ci-filters.sh). go list runs with GOPROXY=off over an empty
  # module cache, so the job needs Go but downloads no module and restores no cache.
  ci-filters:
    needs: changes
    if: needs.changes.outputs.ci_filters == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 600 s, the 10 minutes this job carried, above its 63 s
    # measured maximum, plus its slowest retried step alone — the ci-ok report, which is this
    # job's only download: its `gh api` read and the POST of the check run, 2 x (5 x 30 + 150) =
    # 600 s, carried at the 720 s budget that step's own comment derives.
    # 600 + 720 = 1320 s -> 23 min, the whole minute above a sum that is itself a whole number of minutes.
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false
      - name: Check every CI filter matches every file its job reads
        run: .github/scripts/check-ci-filters.sh

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # Proves the retries against the two faults they answer, a host that refuses and then serves and
  # one that stalls; the rig is .github/ci-budgets.md, "The download-retry job's rig".
  #
  # timeout-minutes (ci-budgets.md's Budgets note): this job's unretried duration is what it costs
  # when its own injected faults are the only thing wrong — the sum of the budgets the report
  # steps enforce, plus its rig. The recover half's 260 + 320 + 500 + 500 + 820 + 920 + 320 =
  # 3640 s, the stall half's 710 + 530 + 1130 + 1130 + 1130 + 1730 + 380 = 6740 s, the carried
  # dependency's 620 s, and about 330 s for the checkout, the bypass clearing, the three tool
  # installs, the cache emptying, the unfaulted install the stalled Playwright site needs and
  # the 31 rig steps. That is 11330 s. Every faulted site runs its retries out inside its own
  # report budget above, so the term the rule adds is this job's slowest download that is not a
  # faulted site: install-jj, whose two `ci_tools_fetch` calls are 2562 s and whose
  # `mise install` of the jj release is 5 x 60 + 150 = 450 s, 3012 s together (ci-budgets.md's
  # Budgets note) — above setup-bun's 2562 s, the unfaulted workspace install's 1050 s and the
  # ci-ok report's 600 s. So 11330 + 3012 = 14342 s -> 240 min, the whole minute above the
  # 239.03 that sum gives. THIS KEY READ 221 UNTIL ROUND 28 OF dispatch://INFRA-1545, where that
  # 221 came from 11310 + 1932 = 13242 s - the measured term before the stall arm's budget grew
  # by 20 s, and install-jj's two ladders before each `ci_tools_fetch` went from 741 s to
  # 1281 s. The lane is the one job whose cancellation this whole issue exists to prevent, and
  # its derivation is written above this job's id rather than above its key, which is one of
  # the shapes rule 8's job clause passes over; the `-> 240 min` above is what its pricing rule
  # reads, and that rule refuses any job holding a retried step whose comments price none.
  #
  # Each site's budget above carries 20 s more than it did before the probe: `report` measures a
  # site from the moment its proxy started, and the probe's two requests are made between the
  # two, each bounded at 10 s by the rig's PROBE_BOUND. Only a stalling fault spends a whole
  # bound — a 504 and the proxy's own 502 are both immediate — but the term is the bound either
  # way, since what a budget may not do is depend on the fault answering quickly.
  download-retry:
    needs: changes
    if: needs.changes.outputs.download_retry == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      # The bypass, emptied for every step of this job, which the job's comment derives: a
      # `no_proxy` or `NO_PROXY` of `*` sends every host past the proxy, and a fault nothing
      # meets passes in about no time while proving nothing. Both spellings, because a client
      # reads either, and through the environment file because an `env:` map may carry only one
      # of them. The probe in each site's own start step is what proves this worked.
      - name: Clear the proxy bypass this runner image may carry
        run: |
          printf 'the runner carried no_proxy=%s and NO_PROXY=%s; both are emptied for every step below\n' \
            "${no_proxy:-<unset>}" "${NO_PROXY:-<unset>}"
          printf '%s\n' 'no_proxy=' 'NO_PROXY=' >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its own retry arithmetic, which is the action's: two `ci_tools_fetch` calls,
      # 2 x 1281 = 2562 s (ci-budgets.md's Budgets note) -> 43 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 43
      # Only for the mise it leaves at ~/.local/bin/mise, which install-omp installs the pin
      # through: nothing here drives jj. Unfaulted, because it is this job's prerequisite rather
      # than one of its sites.
      # install-jj's own retry arithmetic: two `ci_tools_fetch` calls and its `mise install`
      # of the jj release, 2562 + 450 = 3012 s (ci-budgets.md's Budgets note) -> 51 min.
      - uses: ./.github/actions/install-jj
        timeout-minutes: 51
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # No module cache is restored anywhere in this job, and that is the point: a go command
      # reads its own module cache before it reaches any proxy, so a faulted `go mod download`
      # over a warm cache would download nothing and prove nothing.

      # --- the recovering fault: 504 for 60 s, then the request passes (check #0946ed09) -------

      # A recover site's budget is not its measured recovery: an attempt already in flight when
      # the window closes runs to its own bound, and the attempt after it is the first that can
      # succeed, so each budget carries two full bounds, the sleeps between the first three
      # attempts, and the site's own cost. The workspace install is where that was measured
      # rather than reasoned — run 42383790553's job 128436795602: attempt 1 failed at 56 s,
      # attempt 2 reached its 180 s bound, attempt 3 installed in 40 s, 306 s in all against the
      # 300 s this budget held then.

      # curl of a release asset. curl makes the attempts itself, in the spelling
      # .github/actions/install-changie explains: 8, the last starting 127 s after the first,
      # each bounded at 60 s, so one of them starts after the window and gets the tarball. The
      # fault answers for the release host and for the host its redirect lands on.
      - name: Start the recovering fault for install-changie
        id: recover-changie-proxy
        run: |
          .github/scripts/download-retry-proof.sh start recover-changie \
            --mode recover --recover-after 60 --hosts github.com,githubusercontent.com
          .github/scripts/download-retry-proof.sh probe recover-changie
      - id: recover-changie
        continue-on-error: true
        # install-changie's own retry arithmetic, which rule 8 reads from the declaration for
        # .github/scripts/ci-tools.sh: one `ci_tools_fetch`, three ladders, 1281 s (ci-budgets.md's
        # Budgets note) -> 22 min. What this fault costs is far less, and the report below reads
        # it: this proxy answers 504 at once and then serves, so the release asset's own ladder
        # makes its attempts for nothing but their waits and one of them lands inside the
        # recovery window - the second source is never reached, and the step succeeds.
        timeout-minutes: 22
        uses: ./.github/actions/install-changie
        env:
          http_proxy: ${{ steps.recover-changie-proxy.outputs.proxy }}
          https_proxy: ${{ steps.recover-changie-proxy.outputs.proxy }}
      - name: What install-changie's curl did under the recovering fault
        run: >-
          .github/scripts/download-retry-proof.sh report recover-changie
          --what "changie's release asset (curl, 8 attempts of 60 s)"
          --outcome ${{ steps.recover-changie.outcome }} --attempts 8 --floor 0 --budget 260

      # mise install. The pin is a github: tool spec, so mise reads the GitHub API and the
      # release asset host; jdx.dev is mise's own registry.
      - name: Start the recovering fault for install-omp
        id: recover-omp-proxy
        run: |
          .github/scripts/download-retry-proof.sh start recover-omp \
            --mode recover --recover-after 60 --hosts github.com,githubusercontent.com,jdx.dev
          .github/scripts/download-retry-proof.sh probe recover-omp
      - id: recover-omp
        continue-on-error: true
        # install-omp's own retry arithmetic: 5 x 60 + 150 = 450 s -> 8 min.
        timeout-minutes: 8
        uses: ./.github/actions/install-omp
        env:
          http_proxy: ${{ steps.recover-omp-proxy.outputs.proxy }}
          https_proxy: ${{ steps.recover-omp-proxy.outputs.proxy }}
      - name: What install-omp's mise install did under the recovering fault
        run: >-
          .github/scripts/download-retry-proof.sh report recover-omp
          --what "the pinned Oh My Pi (mise install, 5 attempts of 60 s)"
          --outcome ${{ steps.recover-omp.outcome }} --attempts 5 --floor 0 --budget 320

      # bun add, of the npm registry.
      - name: Start the recovering fault for install-claude-code
        id: recover-claude-proxy
        run: |
          .github/scripts/download-retry-proof.sh start recover-claude \
            --mode recover --recover-after 60 --hosts npmjs.org
          .github/scripts/download-retry-proof.sh probe recover-claude
      - id: recover-claude
        continue-on-error: true
        # install-claude-code's own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        uses: ./.github/actions/install-claude-code
        env:
          http_proxy: ${{ steps.recover-claude-proxy.outputs.proxy }}
          https_proxy: ${{ steps.recover-claude-proxy.outputs.proxy }}
      - name: What install-claude-code's bun add did under the recovering fault
        run: >-
          .github/scripts/download-retry-proof.sh report recover-claude
          --what "the pinned Claude Code (bun add, 5 attempts of 180 s)"
          --outcome ${{ steps.recover-claude.outcome }} --attempts 5 --floor 0 --budget 500

      # bun install --frozen-lockfile, the install every job of this workflow makes, in the very
      # spelling they make it in.
      - name: Start the recovering fault for the workspace install
        id: recover-install-proxy
        run: |
          .github/scripts/download-retry-proof.sh start recover-install \
            --mode recover --recover-after 60 --hosts npmjs.org
          .github/scripts/download-retry-proof.sh probe recover-install
      - name: bun install --frozen-lockfile under the recovering fault
        id: recover-install
        continue-on-error: true
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        env:
          http_proxy: ${{ steps.recover-install-proxy.outputs.proxy }}
          https_proxy: ${{ steps.recover-install-proxy.outputs.proxy }}
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - name: What the workspace install did under the recovering fault
        run: >-
          .github/scripts/download-retry-proof.sh report recover-install
          --what "the workspace's dependencies (bun install --frozen-lockfile, 5 attempts of 180 s)"
          --outcome ${{ steps.recover-install.outcome }} --attempts 5 --floor 0 --budget 500

      # go mod download. This proxy faults every host, which is what a Go fault has to do: with
      # `|direct` in GOPROXY a go command falls through to the module's own source after any
      # error, so a fault that answered only for proxy.golang.org and sum.golang.org would be
      # answered by the fall-through rather than by the retry. Nothing but go runs in this step,
      # so nothing else is cut off by it. It is also why the probe of this proxy reads the
      # faulted side alone: a proxy that faults every host has no unfaulted host left to answer,
      # and the probe says so rather than reading a control that cannot exist.
      - name: Start the recovering fault for the Go modules
        id: recover-go-proxy
        run: |
          .github/scripts/download-retry-proof.sh start recover-go --mode recover --recover-after 60
          .github/scripts/download-retry-proof.sh probe recover-go
      - name: Download packages/envoy's Go modules under the recovering fault
        id: recover-go
        continue-on-error: true
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        env:
          http_proxy: ${{ steps.recover-go-proxy.outputs.proxy }}
          https_proxy: ${{ steps.recover-go-proxy.outputs.proxy }}
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      - name: What the Go module download did under the recovering fault
        run: >-
          .github/scripts/download-retry-proof.sh report recover-go
          --what "packages/envoy's Go modules (go mod download, 5 attempts of 180 s)"
          --outcome ${{ steps.recover-go.outcome }} --attempts 5 --floor 0 --budget 820

      # bunx playwright install chromium, which fetches from Playwright's own CDN. Only that host
      # is faulted, so the download after the window is the real one.
      - name: Start the recovering fault for Playwright's Chromium
        id: recover-playwright-proxy
        run: |
          .github/scripts/download-retry-proof.sh start recover-playwright \
            --mode recover --recover-after 60 --hosts playwright.dev
          .github/scripts/download-retry-proof.sh probe recover-playwright
      - name: Install Playwright's Chromium under the recovering fault
        id: recover-playwright
        continue-on-error: true
        # Its own retry arithmetic: 5 x 300 + 150 = 1650 s -> 28 min.
        timeout-minutes: 28
        working-directory: packages/dispatch
        env:
          http_proxy: ${{ steps.recover-playwright-proxy.outputs.proxy }}
          https_proxy: ${{ steps.recover-playwright-proxy.outputs.proxy }}
        run: |
          . "$GITHUB_WORKSPACE/.github/scripts/ci-retry.sh"
          retry_fetch "Playwright's Chromium" 300 -- bunx playwright install chromium
      - name: What the Playwright download did under the recovering fault
        run: >-
          .github/scripts/download-retry-proof.sh report recover-playwright
          --what "Playwright's Chromium (bunx playwright install, 5 attempts of 300 s)"
          --outcome ${{ steps.recover-playwright.outcome }} --attempts 5 --floor 0 --budget 920

      # A gh api read, in the spelling .github/scripts/ci-ok-report.sh reads this same route
      # with. That script is not run here because it posts ci-ok; the read is what retries, and
      # this is the read.
      - name: Start the recovering fault for the gh api read
        id: recover-gh-proxy
        run: |
          .github/scripts/download-retry-proof.sh start recover-gh \
            --mode recover --recover-after 60 --hosts api.github.com
          .github/scripts/download-retry-proof.sh probe recover-gh
      - name: Read the run's artifact list under the recovering fault
        id: recover-gh
        continue-on-error: true
        # Its own retry arithmetic: 5 x 30 + 150 = 300 s, a whole number of minutes, so the
        # budget is the next one strictly above it -> 6 min.
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          http_proxy: ${{ steps.recover-gh-proxy.outputs.proxy }}
          https_proxy: ${{ steps.recover-gh-proxy.outputs.proxy }}
        run: |
          . .github/scripts/ci-retry.sh
          # The redirection is this shell's own and is applied once: the helper buffers each
          # attempt's output and prints the successful attempt's alone, so no refused attempt's
          # body reaches the file.
          retry_fetch "the run's artifact list" 30 -- \
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=1" \
            > "$RUNNER_TEMP/artifacts.json"
      - name: What the gh api read did under the recovering fault
        run: >-
          .github/scripts/download-retry-proof.sh report recover-gh
          --what "the run's artifact list (gh api, 5 attempts of 30 s)"
          --outcome ${{ steps.recover-gh.outcome }} --attempts 5 --floor 0 --budget 320

      # --- the stalling fault: the connection is accepted and nothing is sent (check #55bc6685) -

      # Everything the recover half left behind, so the stall half's downloads reach the network
      # again: `go mod download` over a warm module cache, `bun install` over a warm
      # ~/.bun/install/cache and a full node_modules, `playwright install` over an installed
      # browser and `mise install` over an installed tool each fetch nothing at all. The reports
      # below hold this step to account, since a site that fetched nothing ends in seconds.
      - name: Empty every cache the recovering half filled
        run: |
          go clean -modcache
          rm -rf node_modules packages/*/node_modules docs/site/node_modules \
            "$HOME/.bun/install/cache" "$HOME/.cache/ms-playwright" \
            "$HOME/.local/share/mise/installs" "$HOME/.cache/mise"

      # Each site below ends at its own bound instead of hanging: five attempts of the helper's
      # loop, or curl's eight, and then the step fails. The floor is what the sleeps between the
      # attempts cost on their own (10 + 20 + 40 + 80 for the helper, curl's 127 for its eight),
      # so a step that ended under it did not make its attempts; the budget is the attempts at
      # their bounds plus those sleeps plus the probe's two bounded requests plus a minute, so a
      # step that ended over it did not hold its bounds. The probe is in the budget because
      # `report` measures a site from the moment its proxy started, and the probe is made
      # between the two; under this fault its faulted request spends its whole 10 s bound, which
      # is the reading — a host that answers at once is the proxy bypassed.
      - name: Start the stalling fault for install-changie
        id: stall-changie-proxy
        run: |
          .github/scripts/download-retry-proof.sh start stall-changie \
            --mode stall --hosts github.com,githubusercontent.com
          .github/scripts/download-retry-proof.sh probe stall-changie
      - id: stall-changie
        continue-on-error: true
        # install-changie's own retry arithmetic: one `ci_tools_fetch`, 1281 s
        # (ci-budgets.md's Budgets note) -> 22 min.
        timeout-minutes: 22
        uses: ./.github/actions/install-changie
        env:
          http_proxy: ${{ steps.stall-changie-proxy.outputs.proxy }}
          https_proxy: ${{ steps.stall-changie-proxy.outputs.proxy }}
      # Ten stalls, and they are TWO LADDERS OF FIVE rather than one ladder of ten:
      # install-changie fetches through `ci_tools_fetch`, which reads the release asset first
      # and the copy in the package second, and this fault meets both halves (the asset on
      # github.com, the blob behind ghcr.io's redirect to pkg-containers.githubusercontent.com,
      # faulted by suffix in .github/scripts/ci-fault-proxy.py). Against a host that spends
      # every attempt's whole bound each ladder is five attempts, at 0, 62, 124, 188 and 256 s,
      # the set .github/scripts/ci-tools.sh's own block derives; against the RECOVERING fault
      # an attempt ends the instant the proxy answers, so all eight are made, which is what the
      # recovering arm above reads.
      #
      # THE ASSERTIONS BELOW ARE READ FROM THIS BRANCH'S OWN RUN, not the 120 s bound's: ten
      # reaches from +15 s to +586 s and 646 s of step (run 43202546798, job 131129681795). The
      # floor is 10 + 2 x (5 x 60 + 15) = 640 s and the budget its own rule's 710 s.
      # THE FOUR AND THE 252 THIS ARM USED TO ASSERT WERE A TAUTOLOGY ONCE THE BOUND MOVED: a
      # revert to 120 makes four stalls in about 258 s and passes them. Both shapes were driven
      # against `report` before this round pushed, the revert refused twice and this head passed
      # — .github/ci-budgets.md, "The ten stalls of install-changie", holds that drive, the two
      # clocks the figures are read on, and the 120 s bound's own readings.
      - name: What install-changie's curl did under the stalling fault
        run: >-
          .github/scripts/download-retry-proof.sh report stall-changie
          --what "changie's release asset and the copy behind it (two ci_tools_curl ladders, each bounded at 300 s)"
          --outcome ${{ steps.stall-changie.outcome }} --attempts 10 --floor 640 --budget 710

      - name: Start the stalling fault for install-omp
        id: stall-omp-proxy
        run: |
          .github/scripts/download-retry-proof.sh start stall-omp \
            --mode stall --hosts github.com,githubusercontent.com,jdx.dev
          .github/scripts/download-retry-proof.sh probe stall-omp
      - id: stall-omp
        continue-on-error: true
        # install-omp's own retry arithmetic: 5 x 60 + 150 = 450 s -> 8 min.
        timeout-minutes: 8
        uses: ./.github/actions/install-omp
        env:
          http_proxy: ${{ steps.stall-omp-proxy.outputs.proxy }}
          https_proxy: ${{ steps.stall-omp-proxy.outputs.proxy }}
      - name: What install-omp's mise install did under the stalling fault
        run: >-
          .github/scripts/download-retry-proof.sh report stall-omp
          --what "the pinned Oh My Pi (mise install, 5 attempts of 60 s)"
          --outcome ${{ steps.stall-omp.outcome }} --attempts 5 --floor 150 --budget 530

      - name: Start the stalling fault for install-claude-code
        id: stall-claude-proxy
        run: |
          .github/scripts/download-retry-proof.sh start stall-claude \
            --mode stall --hosts npmjs.org
          .github/scripts/download-retry-proof.sh probe stall-claude
      - id: stall-claude
        continue-on-error: true
        # install-claude-code's own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        uses: ./.github/actions/install-claude-code
        env:
          http_proxy: ${{ steps.stall-claude-proxy.outputs.proxy }}
          https_proxy: ${{ steps.stall-claude-proxy.outputs.proxy }}
      - name: What install-claude-code's bun add did under the stalling fault
        run: >-
          .github/scripts/download-retry-proof.sh report stall-claude
          --what "the pinned Claude Code (bun add, 5 attempts of 180 s)"
          --outcome ${{ steps.stall-claude.outcome }} --attempts 5 --floor 150 --budget 1130

      - name: Start the stalling fault for the workspace install
        id: stall-install-proxy
        run: |
          .github/scripts/download-retry-proof.sh start stall-install \
            --mode stall --hosts npmjs.org
          .github/scripts/download-retry-proof.sh probe stall-install
      - name: bun install --frozen-lockfile under the stalling fault
        id: stall-install
        continue-on-error: true
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        env:
          http_proxy: ${{ steps.stall-install-proxy.outputs.proxy }}
          https_proxy: ${{ steps.stall-install-proxy.outputs.proxy }}
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - name: What the workspace install did under the stalling fault
        run: >-
          .github/scripts/download-retry-proof.sh report stall-install
          --what "the workspace's dependencies (bun install --frozen-lockfile, 5 attempts of 180 s)"
          --outcome ${{ steps.stall-install.outcome }} --attempts 5 --floor 150 --budget 1130

      - name: Start the stalling fault for the Go modules
        id: stall-go-proxy
        run: |
          .github/scripts/download-retry-proof.sh start stall-go --mode stall
          .github/scripts/download-retry-proof.sh probe stall-go
      - name: Download packages/envoy's Go modules under the stalling fault
        id: stall-go
        continue-on-error: true
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        env:
          http_proxy: ${{ steps.stall-go-proxy.outputs.proxy }}
          https_proxy: ${{ steps.stall-go-proxy.outputs.proxy }}
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      - name: What the Go module download did under the stalling fault
        run: >-
          .github/scripts/download-retry-proof.sh report stall-go
          --what "packages/envoy's Go modules (go mod download, 5 attempts of 180 s)"
          --outcome ${{ steps.stall-go.outcome }} --attempts 5 --floor 150 --budget 1130

      # The stalled install above left no node_modules, and `bunx playwright install` is the
      # playwright this workspace locks. So the install is made once, unfaulted, for it: this is
      # the step .github/scripts/ci_job_reads.py's bun_job cites this job's install by.
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - name: Start the stalling fault for Playwright's Chromium
        id: stall-playwright-proxy
        run: |
          .github/scripts/download-retry-proof.sh start stall-playwright \
            --mode stall --hosts playwright.dev
          .github/scripts/download-retry-proof.sh probe stall-playwright
      - name: Install Playwright's Chromium under the stalling fault
        id: stall-playwright
        continue-on-error: true
        # Its own retry arithmetic: 5 x 300 + 150 = 1650 s -> 28 min.
        timeout-minutes: 28
        working-directory: packages/dispatch
        env:
          http_proxy: ${{ steps.stall-playwright-proxy.outputs.proxy }}
          https_proxy: ${{ steps.stall-playwright-proxy.outputs.proxy }}
        run: |
          . "$GITHUB_WORKSPACE/.github/scripts/ci-retry.sh"
          retry_fetch "Playwright's Chromium" 300 -- bunx playwright install chromium
      - name: What the Playwright download did under the stalling fault
        run: >-
          .github/scripts/download-retry-proof.sh report stall-playwright
          --what "Playwright's Chromium (bunx playwright install, 5 attempts of 300 s)"
          --outcome ${{ steps.stall-playwright.outcome }} --attempts 5 --floor 150 --budget 1730

      - name: Start the stalling fault for the gh api read
        id: stall-gh-proxy
        run: |
          .github/scripts/download-retry-proof.sh start stall-gh \
            --mode stall --hosts api.github.com
          .github/scripts/download-retry-proof.sh probe stall-gh
      - name: Read the run's artifact list under the stalling fault
        id: stall-gh
        continue-on-error: true
        # Its own retry arithmetic: 5 x 30 + 150 = 300 s, a whole number of minutes, so the
        # budget is the next one strictly above it -> 6 min.
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          http_proxy: ${{ steps.stall-gh-proxy.outputs.proxy }}
          https_proxy: ${{ steps.stall-gh-proxy.outputs.proxy }}
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the run's artifact list" 30 -- \
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=1" \
            > "$RUNNER_TEMP/artifacts.json"
      - name: What the gh api read did under the stalling fault
        run: >-
          .github/scripts/download-retry-proof.sh report stall-gh
          --what "the run's artifact list (gh api, 5 attempts of 30 s)"
          --outcome ${{ steps.stall-gh.outcome }} --attempts 5 --floor 150 --budget 380

      # --- the dependency the tree carries, which no fault can reach (check #662bc39b) --------

      # The other half of this change: proof-sdk used to come from api.github.com on every
      # install, and over the 884 merge-group runs from 2026-11-03 to 2026-11-06 that fetch was
      # 79 of the 222 failures. It is a tarball beside packages/proof-editor/package.json now,
      # so the four GitHub hosts an install used to read it from answer 504 for the whole of
      # this step and the install does not notice. The caches are emptied first, because an
      # install that reads a warm one proves nothing about what it would fetch.
      - name: Empty Bun's install cache and every node_modules
        run: |
          rm -rf ~/.bun/install/cache
          find . -maxdepth 4 -type d -name node_modules -prune -exec rm -rf {} +
      - name: Start the permanent fault for the dependency's old hosts
        id: carried-proxy
        run: |
          .github/scripts/download-retry-proof.sh start carried --mode fail \
            --hosts api.github.com,github.com,codeload.github.com,objects.githubusercontent.com
          .github/scripts/download-retry-proof.sh probe carried
      - name: Install the workspace with the dependency's old hosts answering 504
        id: carried
        continue-on-error: true
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        env:
          http_proxy: ${{ steps.carried-proxy.outputs.proxy }}
          https_proxy: ${{ steps.carried-proxy.outputs.proxy }}
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - name: What the workspace install did with those hosts down
        run: >-
          .github/scripts/download-retry-proof.sh report carried
          --what "the workspace install with proof-sdk's old hosts answering 504"
          --outcome ${{ steps.carried.outcome }} --attempts 1 --floor 0 --budget 620

      # No proxy was ever written to $GITHUB_ENV, so none reaches the report below or the
      # actions/upload-artifact inside it. This is where that is checked rather than assumed,
      # and where a proxy a report could not stop is stopped. The emptied no_proxy and NO_PROXY
      # the job's first step wrote are the one thing in that file, and an emptied variable is no
      # proxy: this step accounts for them by name rather than refusing them, and refuses any of
      # the four that carries a value.
      - name: Leave no proxy behind the ci-ok report
        if: always()
        run: .github/scripts/download-retry-proof.sh clear

      - name: Report ci-ok when this is the run's last job
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The same recovering fault, inside the three Dockerfiles whose network RUN lines carry the
  # inline retry. The rig: .github/ci-budgets.md, "The download-retry-images job's rig".
  #
  # timeout-minutes (ci-budgets.md's Budgets note): this job's unretried duration is what it costs
  # when nothing outside its own injected faults goes wrong — 300 s for the base image pulls,
  # 900 s for the unfaulted smoke build, the three faulted builds at the budgets their report
  # steps enforce, 2720 + 920 + 500 s, and about 200 s of checkout, bypass clearing and rig
  # steps, which is 5540 s — and the rule adds its single slowest retried step. That step is the
  # ci-ok report, the one download of this job that is not a faulted build: its `gh api` read
  # and the POST of the check run, 2 x (5 x 30 + 150) = 600 s, carried at the 720 s budget that
  # step's own comment derives. So 5540 + 720 = 6260 s -> 105 min. Each build's budget
  # carries 20 s more than it did before the probe, for the two 10 s bounded requests the probe
  # makes between the proxy's start and the build, which `report` measures from the former.
  download-retry-images:
    needs: changes
    if: needs.changes.outputs.download_retry_images == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      SMOKE_IMAGE: legion-envoy-smoke:download-retry
    steps:
      # As the download-retry job's first step, and for the reason its comment gives: a
      # `no_proxy` or `NO_PROXY` of `*` reads every host past the proxy, and the probes below
      # are made from this job's own steps.
      - name: Clear the proxy bypass this runner image may carry
        run: |
          printf 'the runner carried no_proxy=%s and NO_PROXY=%s; both are emptied for every step below\n' \
            "${no_proxy:-<unset>}" "${NO_PROXY:-<unset>}"
          printf '%s\n' 'no_proxy=' 'NO_PROXY=' >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every FROM of the three files that names an image rather than a build argument or a
      # stage of the file it is in. Pulled before any proxy exists, for the reason the job's
      # comment gives. A FROM naming an earlier stage (`FROM runtime-base AS debian-packages`)
      # is no registry reference, and `docker pull` of one is refused as a repository that does
      # not exist, which is how this step first failed: run 42372090039's job 128402159563 ended
      # at `pull access denied for runtime-base`.
      - name: Pull every base image the three builds read
        run: |
          for file in packages/daemon/docker/worker.Dockerfile \
                      packages/envoy/docker/Dockerfile \
                      packages/envoy/infra/host/heldportwrapper/Dockerfile; do
            awk '
              $1 == "FROM" && $2 !~ /^[$]/ && !($2 in stage) { print $2 }
              $1 == "FROM" && toupper($3) == "AS" { stage[$4] = 1 }
            ' "$file"
          done | sort -u > "$RUNNER_TEMP/base-images"
          [ -s "$RUNNER_TEMP/base-images" ] || { echo "::error::no base image to pull"; exit 1; }
          cat "$RUNNER_TEMP/base-images"
          while read -r image; do docker pull "$image"; done < "$RUNNER_TEMP/base-images"
      - name: Build the smoke image the held-port wrapper takes as its base, with no proxy
        run: >-
          .github/scripts/download-retry-proof.sh build none
          --tag ${{ env.SMOKE_IMAGE }}
          --file packages/envoy/docker/Dockerfile

      # The worker image: apt, the npm registry, the Go module proxy and the release hosts of
      # mise, uv, Node, the AWS CLI, Go, kubectl, yq and Chromium, each behind one of the
      # Dockerfile's inline retries.
      - name: Start the recovering fault for the worker image build
        id: worker-proxy
        run: |
          .github/scripts/download-retry-proof.sh start worker --mode recover --recover-after 60 \
            --bind docker-bridge \
            --hosts debian.org,npmjs.org,github.com,githubusercontent.com,jdx.dev,nodejs.org,awscli.amazonaws.com,go.dev,dl.k8s.io,googleapis.com,golang.org,googlesource.com,postgresql.org
          .github/scripts/download-retry-proof.sh probe worker
      - name: Build the worker image under the recovering fault
        id: worker-build
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          .github/scripts/download-retry-proof.sh build worker
          --build-arg LEGION_REVISION=${{ github.sha }}
          --secret id=github_token,env=GITHUB_TOKEN
          --tag legion-worker:download-retry
          --file packages/daemon/docker/worker.Dockerfile
      - name: What the worker image build did under the recovering fault
        run: >-
          .github/scripts/download-retry-proof.sh report worker
          --what "the worker image (packages/daemon/docker/worker.Dockerfile)"
          --outcome ${{ steps.worker-build.outcome }} --attempts 5 --floor 0 --budget 2720

      # The Envoy image: apt, the npm registry and the Go module proxy.
      - name: Start the recovering fault for the Envoy image build
        id: envoy-proxy
        run: |
          .github/scripts/download-retry-proof.sh start envoy --mode recover --recover-after 60 \
            --bind docker-bridge \
            --hosts debian.org,npmjs.org,golang.org,googlesource.com,github.com,githubusercontent.com
          .github/scripts/download-retry-proof.sh probe envoy
      - name: Build the Envoy image under the recovering fault
        id: envoy-build
        continue-on-error: true
        run: >-
          .github/scripts/download-retry-proof.sh build envoy
          --tag legion-envoy:download-retry
          --file packages/envoy/docker/Dockerfile
      - name: What the Envoy image build did under the recovering fault
        run: >-
          .github/scripts/download-retry-proof.sh report envoy
          --what "the Envoy image (packages/envoy/docker/Dockerfile)"
          --outcome ${{ steps.envoy-build.outcome }} --attempts 5 --floor 0 --budget 920

      # The held-port image: one `go mod download` in its wrapper stage, on the smoke image
      # built above as its BASE.
      - name: Start the recovering fault for the held-port image build
        id: heldport-proxy
        run: |
          .github/scripts/download-retry-proof.sh start heldport --mode recover --recover-after 60 \
            --bind docker-bridge \
            --hosts golang.org,googlesource.com,github.com,githubusercontent.com
          .github/scripts/download-retry-proof.sh probe heldport
      - name: Build the held-port image under the recovering fault
        id: heldport-build
        continue-on-error: true
        run: >-
          .github/scripts/download-retry-proof.sh build heldport
          --build-arg BASE=${{ env.SMOKE_IMAGE }}
          --tag legion-envoy-heldport:download-retry
          --file packages/envoy/infra/host/heldportwrapper/Dockerfile
      - name: What the held-port image build did under the recovering fault
        run: >-
          .github/scripts/download-retry-proof.sh report heldport
          --what "the held-port image (packages/envoy/infra/host/heldportwrapper/Dockerfile)"
          --outcome ${{ steps.heldport-build.outcome }} --attempts 5 --floor 0 --budget 500

      # As the download-retry job: the proxy was never this job's environment, and this is where
      # that is checked rather than assumed.
      - name: Leave no proxy behind the ci-ok report
        if: always()
        run: .github/scripts/download-retry-proof.sh clear

      - name: Report ci-ok when this is the run's last job
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The proof that no install of this repository fetches the proof editor's upstream sources over
  # the network. What it faults: .github/ci-budgets.md, "The proof-sdk-offline job".
  proof-sdk-offline:
    needs: changes
    if: needs.changes.outputs.proof_sdk_offline == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 900 s, the 15 minutes this job came in with — it is
    # new here, so no run on main has measured it — plus its slowest retried step alone — the
    # setup-bun step's two `ci_tools_fetch` calls, 2562 s, above either frozen install's
    # 5 x 180 + 150 = 1050 s and the ci-ok report's 600 s. 900 + 2562 = 3462 s -> 58 min.
    timeout-minutes: 58
    # The hosts of the old route, named once: the proxy is started with them, and the verdict
    # below quotes them. The proxy faults each of them and every subdomain of one, and refuses
    # nothing else, so the verdict counts its refusals rather than matching this list again.
    env:
      FAULT_HOSTS: api.github.com,codeload.github.com,objects.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its own retry arithmetic, which is the action's: two `ci_tools_fetch` calls,
      # 2 x 1281 = 2562 s (ci-budgets.md's Budgets note) -> 43 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 43

      # .github/scripts/ci-fault-proxy.py is Python 3 from the runner image and installs nothing.
      # `--port 0` takes a free port from the kernel and `--port-file` is written, whole and by
      # rename, once it is listening, so this step waits for that file rather than for a fixed
      # time and fails when it never appears. The port reaches the later steps through
      # $GITHUB_OUTPUT; http_proxy and https_proxy stay in the `env:` of the steps that
      # must be behind the proxy, so neither the report step below nor the Actions service is
      # proxied. The proxy's stderr is the log every count in this job is read from, opened for
      # appending so that the probe step can empty it after printing its own two lines and the
      # proxy's next write still lands at the start of the emptied file.
      - name: Start the fault proxy over the old proof-sdk route
        id: proxy
        run: |
          log="$RUNNER_TEMP/ci-fault-proxy.log"
          port_file="$RUNNER_TEMP/proxy.port"
          rm -f "$log" "$port_file"
          .github/scripts/ci-fault-proxy.py --mode fail \
            --hosts "$FAULT_HOSTS" \
            --bind 127.0.0.1 --port 0 --port-file "$port_file" </dev/null >/dev/null 2>>"$log" &
          pid=$!
          for _ in $(seq 1 100); do
            if [ -s "$port_file" ]; then
              break
            fi
            sleep 0.1
          done
          if [ ! -s "$port_file" ]; then
            echo "::error::the fault proxy wrote no port file in 10 s, so it never listened; its log follows"
            cat "$log"
            exit 1
          fi
          {
            echo "pid=$pid"
            echo "port=$(cat "$port_file")"
          } >> "$GITHUB_OUTPUT"
          cat "$log"

      # The pair that proves the proxy is in the path and that what it passes is what the install
      # needs: api.github.com, a host of the old route, must be refused, and registry.npmjs.org,
      # the host a frozen install of this repository still fetches every package from, must be
      # answered. A proxy that refused everything would make the installs' silence about GitHub
      # mean nothing. Both probes run through the same proxy variables the installs use, and each
      # prints the proxy's own log line for it. The log is emptied at the end, so the counts the
      # report step reads are the installs' alone.
      #
      # Neither request is a download: each reads whether the proxy is in the path, and brings
      # no tool, no toolchain and no dependency into the job. So neither retries, and each is
      # written the way .github/scripts/download-retry-proof.sh's through_proxy writes a probe —
      # its error silenced and its status consumed into the reading — which is the shape
      # check-download-retry.sh reads as a probe rather than as a fetch. A retry here would
      # prove less, not more: the first request must be refused, so five attempts would spend
      # 150 s of sleeps re-reading the refusal the first one already gave, and the second is a
      # control the two installs below put to the registry again a moment later, where the
      # answer is a download and is retried as one.
      - name: Probe the proxy before the installs
        id: probe
        # GitHub Actions folds an env key's case, so `http_proxy` and `HTTP_PROXY` in one block
        # are the same key written twice and it refuses the whole workflow file, with no job run
        # and no annotation on the pull request. The lowercase pair is the one both readers here
        # honour: curl reads `http_proxy` only in lowercase, and Bun reads either spelling.
        env:
          http_proxy: http://127.0.0.1:${{ steps.proxy.outputs.port }}
          https_proxy: http://127.0.0.1:${{ steps.proxy.outputs.port }}
        run: |
          log="$RUNNER_TEMP/ci-fault-proxy.log"
          # `%{http_code}` is 000 when nothing answered at all, which is what a refused tunnel
          # reads as. Measured on curl 8.14.1 against this proxy in --mode fail: the faulted
          # host read 000 (exit 56, `%{http_connect}` 504) and the passed host 200.
          faulted=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://api.github.com/meta 2>/dev/null || true)
          if [ "${faulted:-000}" != 000 ]; then
            echo "::error::the proxy answered https://api.github.com/meta with HTTP $faulted, so the installs below are not behind it and this job would prove nothing"
            exit 1
          fi
          grep -F 'ci-fault-proxy: 504 CONNECT api.github.com:443' "$log"
          passed=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 https://registry.npmjs.org/ 2>/dev/null || true)
          if [ "${passed:-000}" = 000 ]; then
            echo "::error::the proxy refused https://registry.npmjs.org/, the registry the frozen install reads, so it faults more than the hosts of the old route"
            exit 1
          fi
          grep -F 'ci-fault-proxy: pass CONNECT registry.npmjs.org:443' "$log"
          : > "$log"

      # A runner is cold by nature: it has no Bun install cache and no node_modules, and
      # setup-bun restores the Bun binary alone (and off main not even that), so this install is
      # the cold one without any cache being deleted to make it so. It carries the bare command
      # as its name, the handle .github/scripts/ci_job_reads.py's bun_job cites a frozen install
      # by (ci-budgets.md's Retries note). It retries like every other install of this workflow:
      # the hosts this job faults are the old route's, and registry.npmjs.org, which every
      # package still comes from, is passed through and can fault on its own. 180 s per attempt,
      # the bound every Bun install of this repository's CI carries: 20.70 s cold on a pod,
      # against at most 11 s over 180 observations in CI. Its attempts cannot hide a request for
      # a faulted host: each one asks the proxy again, and the verdict below counts the proxy's
      # refusals rather than the installs.
      - name: bun install --frozen-lockfile
        id: cold_install
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        env:
          http_proxy: http://127.0.0.1:${{ steps.proxy.outputs.port }}
          https_proxy: http://127.0.0.1:${{ steps.proxy.outputs.port }}
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile

      # The same install again, over the cache and the node_modules the step above left: the
      # requirement is that no install reaches those hosts, warm or cold. Retried at the same
      # bound, for the same reason.
      - name: bun install --frozen-lockfile, warm
        id: warm_install
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        env:
          http_proxy: http://127.0.0.1:${{ steps.proxy.outputs.port }}
          https_proxy: http://127.0.0.1:${{ steps.proxy.outputs.port }}
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile

      # The verdict, read off the proxy's log: every refusal it wrote while the two installs
      # ran. In `--mode fail` the proxy refuses a faulted host and every subdomain of one and
      # passes everything else, so each `504` line is a request for the old route whatever host
      # it names, and the count is of the lines rather than of a match against FAULT_HOSTS,
      # which would pass over a subdomain the proxy refused. Zero of them is the proof. It
      # prints the refused lines themselves when there are any, and a tally of every host it
      # passed through whatever the verdict, so the log says what the installs talked to rather
      # than only what they did not. It runs when an install above failed, which is what a
      # reintroduced remote dependency does, because that is the run whose tally a reader needs.
      # It is gated on the probe rather than on the proxy, because the probe's own refusal of
      # api.github.com is still in the log when the probe fails on its second request: a bad
      # minute of registry.npmjs.org would otherwise have this step blame a dependency for the
      # probe's request, with no install run at all. `!cancelled()` rather than `always()`, so a
      # cancelled or timed-out job prints no success line either. The step is behind no proxy
      # itself - it reaches nothing - and it stops the proxy, whose liveness the kill also
      # confirms: a proxy that had died would have failed the installs first.
      - name: Count what the installs asked the proxy for
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        # The two installs' outcomes, because the step runs after a failed one: a tally over a
        # log an install stopped writing part way through says nothing about the rest of the
        # install, so the line below that says every byte came out of the checkout is printed
        # only when both ran whole. The warm install is skipped when the cold one failed, so its
        # outcome alone would say which, and both are passed to name which stopped.
        env:
          PROXY_PID: ${{ steps.proxy.outputs.pid }}
          COLD_INSTALL: ${{ steps.cold_install.outcome }}
          WARM_INSTALL: ${{ steps.warm_install.outcome }}
        run: |
          log="$RUNNER_TEMP/ci-fault-proxy.log"
          # One `<verdict> <host>` line per request the proxy logged, from both line shapes it
          # writes: `504|pass CONNECT host:port` for a tunnel, and `504|pass METHOD url` for a
          # plain-HTTP request.
          seen=$(awk '$2 == "504" || $2 == "pass" {
            target = $4
            if ($3 != "CONNECT") { sub(/^[A-Za-z][A-Za-z0-9+.-]*:\/\//, "", target); sub(/\/.*$/, "", target) }
            sub(/:[0-9]*$/, "", target)
            print $2, target
          }' "$log")
          refused=$(printf '%s\n' "$seen" | grep -c '^504 ' || true)
          passed=$(printf '%s\n' "$seen" | grep -c '^pass ' || true)
          echo "requests the proxy refused: $refused, by host:"
          printf '%s\n' "$seen" | sed -n 's/^504 //p' | sort | uniq -c | sed 's/^/  /'
          echo "requests the proxy passed through: $passed, by host:"
          printf '%s\n' "$seen" | sed -n 's/^pass //p' | sort | uniq -c | sed 's/^/  /'
          # The `|| echo` is what keeps a failed kill from ending the step under GitHub's
          # `bash -e`: a proxy that is already gone must not abort it before its verdict is out,
          # and a proxy that died early would have failed the installs.
          kill "$PROXY_PID" || echo "the proxy was no longer running when this step stopped it"
          if [ "$refused" != 0 ]; then
            echo "::error::the frozen install reached the old proof-sdk route through the proxy $refused time(s); a dependency of this repository is fetched from GitHub again, which the tarball committed in packages/proof-editor exists to prevent"
            grep -E '^ci-fault-proxy: 504 ' "$log" | sed 's/^/  /'
            exit 1
          fi
          if [ "$COLD_INSTALL" != success ] || [ "$WARM_INSTALL" != success ]; then
            echo "the cold install $COLD_INSTALL and the warm install $WARM_INSTALL, so this tally is partial: it reached none of $FAULT_HOSTS up to the point the install stopped, and says nothing about what the rest of it would have asked for. The job is red on the install itself."
            exit 0
          fi
          if [ "$passed" = 0 ]; then
            echo "::error::the proxy passed no request through while the two installs ran; the cold install fetches every package from registry.npmjs.org, so a zero here means the installs did not reach the proxy at all and their silence about the three hosts proves nothing"
            exit 1
          fi
          echo "no request for $FAULT_HOSTS or any subdomain of one: every byte of the proof editor's upstream sources came out of the checkout"

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The worker image's pull-request build: worker-image.yaml builds the head and publishes its
  # sha- tag only. Main's image builds are release.yaml's call of the same workflow.
  worker-image:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.worker_image == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    uses: ./.github/workflows/worker-image.yaml
    # GitHub refuses a run whose calling job grants less than the called workflow's jobs declare,
    # whatever their `if:` (release.yaml's worker_image job says the same): its workflow-level block
    # (the build's packages: write, and the actions: read and checks: write of its ci-ok-report
    # step) and its `attest` job's id-token and attestations: write. A pull request run still skips
    # `attest` (its `if:` requires `github.event_name != 'pull_request'`), and, passing no
    # `attest_digest`, leaves it empty, so the build job runs.
    permissions:
      contents: read
      packages: write
      actions: read
      checks: write
      id-token: write
      attestations: write
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # The browser image's build: browser-image.yaml builds .github/docker/browser.Dockerfile and
  # pushes it when the package does not already hold an image built from it. Unlike worker-image
  # above, this job has no `pull_request` term: it runs on a merge group too, so the image a
  # merged head's `container:` jobs pin — the shard and alone jobs of
  # .github/workflows/dispatch-browser.yaml — is built from that head.
  browser-image:
    needs: changes
    if: needs.changes.outputs.browser_image == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    uses: ./.github/workflows/browser-image.yaml
    # GitHub refuses a run whose calling job grants less than the called workflow's jobs declare,
    # whatever their `if:`: its workflow-level block (the build's packages: write, and the
    # actions: read and checks: write of its ci-ok-report step) and its `attest` job's id-token
    # and attestations: write. That `attest` job runs whenever the build pushed, whatever the
    # event, a pull request's run included, because the two-push order AGENTS.md describes has
    # a pull request's run push the image the rows then pin (browser-image.yaml's `attest` job
    # says why).
    permissions:
      contents: read
      packages: write
      actions: read
      checks: write
      id-token: write
      attestations: write
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # pr-title, the other check main's ruleset requires of this router, and with `ci-ok` one of the
  # two jobs of this file named for a required check. A pull request's title, body and commit
  # messages reach main's squash commit, the generated release notes and GitHub's pages, and its
  # comments and reviews are public on its page, so this job checks them, and that the title is a
  # conventional commit subject, at every push to a pull request that is not a draft, when a
  # draft is marked ready, and on the merge queue's group.
  #
  # It posts nothing: pr-title is this job's own check run, which GitHub puts in this run's own
  # check suite, where a check run created with POST /repos/.../check-runs under GITHUB_TOKEN
  # joins the Actions App's first suite at that commit instead, which has left a required check
  # green in another workflow's suite and the merge queue refusing to enqueue
  # (.github/scripts/post-check-run.sh's header holds those measurements). So no step here calls
  # that script, and the job holds no `checks: write`.
  #
  # A merge group carries no pull request, only the queue branch it runs on, so
  # find-pr-payload.sh reads the pull request that branch names and writes it in the shape
  # check-pr-text.sh wants. pr-title.yaml runs on an edit and a review alone, whose payloads
  # carry the pull request, so a pull request that is opened, reopened or pushed to gets its
  # pr-title from this job, and a fork's head gets one too: a job's check run costs no token
  # scope, where a POST needs `checks: write`, which a fork's run's read-only GITHUB_TOKEN does
  # not carry. A dispatched run carries
  # neither a pull request nor a group and has no text to check, which is why the `if:` names the
  # two events this job runs on rather than excluding the draft alone.
  pr-title:
    if: ${{ !github.event.pull_request.draft && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 600 s, the 10 minutes this job carried, plus its
    # slowest retried step alone — the text check's six `gh api` ladders, 6 x (5 x 30 + 150) =
    # 1800 s, a whole number of minutes, so that step's own budget takes one more and this job
    # takes it too. 600 + 1860 = 2460 s -> 42 min, the whole minute above a sum that is itself a whole number of minutes.
    timeout-minutes: 42
    # What the two scripts below read through gh, and nothing else: the pull request's commits
    # from the compare route (`contents: read`), the pull request itself, its reviews and its
    # review comments (`pull-requests: read`, which find-pr-payload.sh's read of the pull request
    # a queue branch names needs too), and its issue comments (`issues: read`). No
    # `checks: write`, since this job posts no check run, and no `actions: read`, since it carries
    # no ci-ok-report step: CI_OK_EXEMPT holds it outside ci-ok's accounting (this file's env says
    # why).
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # A merge group is tested once: the queue builds a new group rather than re-running one, so
      # an attempt above the first checks a tree the queue is no longer waiting on. This job
      # therefore carries no `github.run_attempt == '1'` term, unlike every job of this file but
      # the verdict, and refuses such an attempt in a step instead. `ci-ok` carries that same step
      # for the same reason, and the two share the rule because they are the two jobs named for a
      # check main's ruleset requires: an `if:` can only take the job away, a skipped job's check
      # run is a passing required check, and a dead group must get a real failure rather than the
      # check concluded by nothing. It comes before the checkout because no step after it runs
      # once it has failed.
      - name: Refuse a re-run attempt of a merge-group run
        if: ${{ github.event_name == 'merge_group' && github.run_attempt != '1' }}
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "::error::pr-title is failure on attempt $RUN_ATTEMPT of this merge-group run, whatever the pull request's text says: a merge group is tested once, the queue builds a new group rather than re-running one, and this attempt checks a tree the queue is no longer waiting on."
          exit 1

      # The job reads nothing of the tree but find-pr-payload.sh, check-pr-text.sh and the
      # check-private-names.sh that one runs, so the .github cone is the whole checkout it needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Check the pull request's title, body, branch name, commits, comments and reviews
        # Its own retry arithmetic, so an exhausted read fails this step by name rather than
        # being cut part way by the job: find-pr-payload.sh's one `gh api` read, 5 x 30 + 150 =
        # 300 s, and check-pr-text.sh's five, 5 x (5 x 30 + 150) = 1500 s — the pull request,
        # the compare, and the page read of read_list, which the `for ((i = 0; i <
        # ${#lists[@]}; i += 2))` under it runs once for each of the three lists. 1800 s is a
        # whole number of minutes, so the budget is the next one strictly above it -> 31 min.
        timeout-minutes: 31
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(.github/scripts/find-pr-payload.sh)
          GITHUB_EVENT_PATH="$payload" .github/scripts/check-pr-text.sh

  # The merge queue's cancel act: it cancels the groups of the same pull request the queue has
  # replaced. What it may do and why: .github/ci-budgets.md, "The merge queue's cancel act".
  cancel-started:
    if: ${{ github.event_name == 'merge_group' && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 600 s, the 10 minutes this job was written with, plus
    # its slowest retried step alone — the one `run:` step below, whose run list and force-cancel
    # are 5 x 30 + 150 = 300 s each, 600 s together, and whose own budget is 720 s for the
    # reason written beside it. 600 + 720 = 1320 s -> 23 min, the whole minute above a sum that is itself a whole number of minutes.
    timeout-minutes: 23
    permissions:
      actions: write
    steps:
      # The job reads nothing of the tree but .github/scripts/merge-group-cancels.sh, so the
      # .github cone is the whole checkout it needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Force-cancel the runs of the groups the queue removed
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        # Its own retry arithmetic, so an exhausted read fails this step by name rather than
        # being cut part way by the job: the run list's 5 x 30 + 150 = 300 s and the
        # force-cancel's 300 s, 600 s together. 720 s and not rule 8's minimum of 660 s: no
        # pull-request run exercises this budget, so its first exercise is a merge-queue run,
        # where a cut ejects the pull request rather than reporting a failure. What that extra
        # minute holds is the step's own measured work beside the two ladders — about 3 s a `gh`
        # call (ci-budgets.md's Retries note) over the run list and one force-cancel per removed
        # group, at most 21 calls at the 20 groups the queue builds at once, about 63 s, which
        # 660 s does not cover and 720 s does. One term per call and not one per run cancelled:
        # the loop below calls the force-cancel once per removed group, and a run of them all
        # exhausting their retries is the outage ci-budgets.md's Budgets note leaves to the job's
        # own ceiling.
        timeout-minutes: 12
        run: |
          . .github/scripts/ci-retry.sh
          # The `--limit` is 100 because the queue builds up to 20 groups at once and this pull
          # request's own groups are among them: gh's default of 20 runs could leave an older
          # group of it out of the list, and so out of the act. It retries at the same 30 s an
          # attempt as the force-cancel below: a refused list names no group at all, and every
          # removed group's run then keeps its runners.
          RUNS=$(retry_fetch "the merge-group runs of this repository" 30 -- \
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yaml --event merge_group \
            --limit 100 --json databaseId,headBranch,status,createdAt)
          export RUNS
          acts=$(.github/scripts/merge-group-cancels.sh)
          # 30 s an attempt, the bound every `gh api` read of this repository's CI carries, which
          # is ten times the about 3 s one takes (ci-budgets.md's Retries note). The loop is over
          # the groups to cancel, not over the attempts: the attempts are the helper's.
          while read -r act id; do
            [ "$act" = cancel ] || continue
            retry_fetch "the force-cancel of run $id" 30 -- \
              gh api --silent --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/force-cancel" ||
              echo "::warning::force-cancel of run $id failed; it may have completed already"
          done <<<"$acts"

  # The verdict, and one of the two checks main's ruleset requires of this router. Its shape, its
  # `always()` and its scope: .github/ci-budgets.md, "The ci-ok job's shape".
  ci-ok:
    needs:
      - changes
      - lint
      - ci-images
      - tool-fallback
      - tool-fallback-arm
      - typecheck
      - test
      - docs
      - contracts
      - test-fixtures
      - conflicts-script
      - broker-client
      - envoy-client
      - pi-shared
      - pi-envoy
      - pi-legion
      - dispatch-ui
      - dispatch-browser
      - claude-envoy
      - envoy-go-checks
      - envoy-go
      - envoy-infra-go
      - envoy-go-race
      - envoy-go-race-api
      - envoy-go-race-docs
      - envoy-go-docs-finalizers
      - dispatch-memory
      - dispatch-multiprocess
      - listener-server-change
      - broker-multiprocess
      - airlock-lean
      - envoy-smoke
      - envoy-e2e-local
      - envoy-session-stall
      - ci-filters
      - download-retry
      - download-retry-images
      - proof-sdk-offline
      - worker-image
      - browser-image
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 600 s, the 10 minutes this job carried, plus its
    # slowest retried step alone — the reconcile's check-run read and the three PATCHes its
    # budget is written for, 300 + 3 x 300 = 1200 s, a whole number of minutes, so that step's
    # own budget takes one more and this job takes it too. 600 + 1260 = 1860 s -> 32 min, the whole minute above a sum that is itself a whole number of minutes.
    timeout-minutes: 32
    permissions:
      checks: write
    steps:
      # The job reads nothing of the tree but ci-ok.sh, ci-ok.jq, ci-ok-reconcile.sh and the
      # ci-retry.sh it sources, so the .github cone is the whole checkout it needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      # A draft pull request has asked for no test: every other job of this file is skipped
      # there, by the draft term `changes` carries or one of its own, so what this job would
      # judge is a run of nothing but skips. The refusal is a step and not a term of this job's
      # `if:`, as the comment above this job says: the `if:` would skip the job, and a skipped
      # job's check run is a passing required check, so the draft would carry a green ci-ok
      # nothing judged.
      #
      # It comes before the merge-group refusal, the order a change meets the two cases in, and
      # the order decides nothing anyway: no run meets both. A merge_group event carries no
      # `github.event.pull_request`, so this term is false on the queue's runs, and a draft
      # cannot be queued.
      - name: Refuse a draft pull request
        if: ${{ github.event.pull_request.draft }}
        run: |
          echo "::error::ci-ok is failure because this pull request is a draft: every other job of this run skipped, so nothing in it has been tested. Mark the pull request ready for review: that starts a run which selects by the same diff and concludes a real verdict over it."
          exit 1

      # A merge group is tested once: the queue builds a new group rather than re-running one, so
      # an attempt above the first judges a tree the queue is no longer waiting on, and the
      # verdict over it is failure whatever the jobs of the run did. Every other job of the file
      # is held back on such an attempt by a term of its own `if:`, so what this job would read
      # there is a run of skips; this step refuses it before the verdict step reads them.
      #
      # The refusal is a step and not a term of this job's `if:` because a job an `if:` holds
      # back is skipped, and a skipped job's check run is a passing required check: the group
      # would read a ci-ok nothing judged and merge on it. An `if:` can only take the job away,
      # and what a dead group must get is a verdict, so the job runs and a step of it fails.
      # It comes after the checkout because the reconciliation step below runs under `always()`
      # and reads ci-ok-reconcile.sh out of the tree.
      - name: Refuse a re-run attempt of a merge-group run
        if: ${{ github.event_name == 'merge_group' && github.run_attempt != '1' }}
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "::error::ci-ok is failure on attempt $RUN_ATTEMPT of this merge-group run, whatever the jobs of it did: a merge group is tested once, the queue builds a new group rather than re-running one, and this attempt judges a tree the queue is no longer waiting on."
          exit 1

      # NEEDS is `toJSON(needs)`: `changes`' result and outputs with every other job's result,
      # which is the shape ci-ok.sh takes. A failure here fails the job, and the job's check run
      # is the verdict.
      - name: Judge every job of this run
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          SELECTED_BY: ${{ env.CI_OK_SELECTED_BY }}
          PULL_REQUEST_ONLY: ${{ env.CI_OK_PULL_REQUEST_ONLY }}
          ALWAYS_RUN: ${{ env.CI_OK_ALWAYS_RUN }}
        run: .github/scripts/ci-ok.sh

      # A ci-ok the ci-ok-report step posted stays on the head as it was: no re-run updates a
      # check run a job created with POST, and it can sit in another workflow's check suite, so a
      # run that failed and was re-run green would stay blocked by it. This step sets every ci-ok
      # check run on the head but this job's own to what this job concluded, so one verdict stands
      # at the end of every attempt (ci-ok-reconcile.sh says what it passes over and why a refusal
      # only warns). `job.status` is this job's conclusion, and `always()` is what runs the step
      # after the verdict above failed.
      - name: Set every other ci-ok on this head to this job's conclusion
        if: always()
        # Its own retry arithmetic: ci-ok-reconcile.sh's check-run read, 5 x 30 + 150 = 300 s,
        # and its PATCH, which the loop there runs once for every other ci-ok on the head that
        # needs setting. The budget is written for three of them, 3 x 300 = 900 s, because a
        # merge-group run posts one ci-ok per job whose own result decides the group, so a run
        # that fails in three jobs leaves three posts on this head
        # (.github/scripts/check-download-retry.sh's DECLARED_LOOPS carries that 900 s and
        # the sum it comes from). 300 + 900 = 1200 s, a whole number of minutes, so the
        # budget is the next one strictly above it -> 21 min.
        #
        # This budget matters more than most. ci-ok-reconcile.sh's own header says a refused
        # PATCH only warns, because failing this step would turn a passing verdict red; a step
        # the runner cuts does exactly that, since a cut step fails this job and ci-ok is the
        # check main's ruleset requires. So the figure is written for the head this step can
        # meet rather than for the one it usually meets.
        timeout-minutes: 21
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
          CONCLUSION: ${{ job.status }}
        run: .github/scripts/ci-ok-reconcile.sh
