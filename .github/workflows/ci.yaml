    # its steps (5). That is 742 s, 12 m 22 s, the floor a ceiling here has to clear.
    # The test step is added up from its rows at their slowest over the four most recent runs of
    # the whole suite rather than from one total: legion-stall-watchdog 232 s, controller-start
    # 123 s, legion-model-fallback 106 s, legion-phase-stall 99 s, legion-session-activity 28 s,
    # daemon-pane 21 s and legion-role-tools 11 s are 620 of the 646, and the 25 rows left the
    # other 26.
