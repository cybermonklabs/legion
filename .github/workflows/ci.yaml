name: CI

# why: .github/ci-notes/ci.md#the-router-every-check-a-pull-request-or-the-merge-queue-runs

# why: .github/ci-notes/ci.md#why-the-router-runs-on-these-events-and-no-others
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      # why: .github/ci-notes/ci.md#the-commit-main-pointed-at-before-the-push-the-bypass-check-read
      migration-base:
        description: >-
          The commit main pointed at before the push this run tests. A run on main must name it;
          a run on another branch that names none compares with the branch's merge base with main.
        type: string
        required: false

# why: .github/ci-notes/ci.md#what-a-newer-push-cancels-and-what-is-never-cancelled
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# why: .github/ci-notes/ci.md#why-the-routers-permissions-block-holds-those-two-scopes
permissions:
  contents: read
  actions: read
  checks: write

env:
  # why: .github/ci-notes/ci.md#what-ci_ok_selected_by-holds-and-which-programs-read-it
  CI_OK_SELECTED_BY: |
    {
      "typecheck": "typecheck",
      "test": "test",
      "daemon-go": "daemon_go_tests",
      "plugin-pack": "plugin_pack",
      "private-names-port": "private_names_port",
      "docs": "docs",
      "contracts": "contracts",
      "test-fixtures": "test_fixtures",
      "conflicts-script": "conflicts_script",
      "sessions-script": "sessions_script",
      "broker-client": "broker_client",
      "envoy-client": "envoy_client",
      "pi-shared": "pi_shared",
      "pi-envoy": "pi_envoy",
      "pi-legion": "pi_legion",
      "dispatch-ui": "dispatch_ui",
      "dispatch-browser": "dispatch_browser",
      "claude-envoy": "claude_envoy",
      "envoy-go": "envoy_go",
      "envoy-go-checks": "envoy_go_checks",
      "envoy-infra-go": "envoy_infra_go",
      "text-checks": "text_checks",
      "envoy-go-claim-model": "envoy_go_claim_model",
      "envoy-go-race": "envoy_go_race",
      "envoy-go-race-api": "envoy_go_race_api",
      "envoy-go-race-docs": "envoy_go_race_docs",
      "envoy-go-docs-finalizers": "envoy_go_race_docs",
      "dispatch-memory": "dispatch_memory",
      "dispatch-multiprocess": "dispatch_multiprocess",
      "dispatch-two-builds": "dispatch_two_builds",
      "listener-server-change": "listener_server_change",
      "broker-multiprocess": "broker_multiprocess",
      "airlock-lean": "airlock_lean",
      "envoy-smoke": "envoy_smoke",
      "envoy-e2e-local": "envoy_e2e_local",
      "envoy-session-stall": "envoy_session_stall",
      "ci-filters": "ci_filters",
      "ci-images": "ci_images",
      "tool-fallback": "tool_fallback",
      "tool-fallback-arm": "tool_fallback",
      "proof-sdk-offline": "proof_sdk_offline",
      "worker-image": "worker_image",
      "browser-image": "browser_image"
    }
  CI_OK_PULL_REQUEST_ONLY: '["worker-image"]'
  # why: .github/ci-notes/ci.md#the-jobs-that-run-on-every-change
  CI_OK_ALWAYS_RUN: |
    [
      "changes",
      "lint"
    ]
  # why: .github/ci-notes/ci.md#the-jobs-outside-ci-oks-accounting
  CI_OK_EXEMPT: |
    [
      "cancel-started",
      "ci-ok",
      "pr-title"
    ]

jobs:
  # why: .github/ci-notes/ci.md#what-the-changes-job-selects-and-the-two-terms-every-job-carries
  changes:
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    # why: .github/ci-notes/ci.md#why-changes-pr-title-cancel-started-and-ci-ok-run-on-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      # Each output reads the one dorny/paths-filter step below. Rule 19 of
      # .github/scripts/check-ci-filters.sh refuses an output naming a filter .github/ci-filters.yaml does not hold.
      typecheck: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.typecheck }}
      test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.test }}
      # why: .github/ci-notes/ci.md#why-the-daemons-go-suite-has-an-output-of-its-own
      daemon_go_tests: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.daemon_go_tests }}
      # why: .github/ci-notes/ci.md#why-the-plugin-pack-has-an-output-of-its-own
      plugin_pack: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.plugin_pack }}
      # why: .github/ci-notes/ci.md#why-the-private-name-port-harness-has-an-output-of-its-own
      private_names_port: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.private_names_port }}
      # why: .github/ci-notes/ci.md#why-the-session-message-wait-suite-has-an-output-of-its-own
      sessions_script: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.sessions_script }}
      # The guides' layout step of the test job, which has a filter of its own: the job's other
      # steps read none of the guides, so a run that changed none of them skips that step.
      guide_layout: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.guide_layout }}
      # why: .github/ci-notes/ci.md#one-output-per-testsh-step-of-the-test-job
      release_push_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.release_push_test }}
      release_bump_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.release_bump_test }}
      check_bun_version_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_bun_version_test }}
      check_playwright_version_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_playwright_version_test }}
      check_bun_workspace_manifests_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_bun_workspace_manifests_test }}
      check_zod_version_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_zod_version_test }}
      check_gh_version_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_gh_version_test }}
      check_gitleaks_version_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_gitleaks_version_test }}
      workflow_paths_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.workflow_paths_test }}
      check_image_trigger_paths_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_image_trigger_paths_test }}
      check_ci_images_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_ci_images_test }}
      mirror_ci_images_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.mirror_ci_images_test }}
      ci_tools_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ci_tools_test }}
      mirror_ci_tools_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.mirror_ci_tools_test }}
      check_ci_tools_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_ci_tools_test }}
      ci_tools_proof_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ci_tools_proof_test }}
      check_action_pins_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_action_pins_test }}
      check_workflow_files_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_workflow_files_test }}
      check_private_names_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_private_names_test }}
      check_private_names_terms_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_private_names_terms_test }}
      check_private_names_keys_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_private_names_keys_test }}
      check_plugin_names_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_plugin_names_test }}
      check_fireevent_reasons_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_fireevent_reasons_test }}
      check_daemon_api_contract_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_daemon_api_contract_test }}
      check_release_credentials_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_release_credentials_test }}
      repo_paths_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.repo_paths_test }}
      select_e2e_proofs_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.select_e2e_proofs_test }}
      go_tagged_tests_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.go_tagged_tests_test }}
      ci_ok_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ci_ok_test }}
      ci_ok_report_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ci_ok_report_test }}
      ci_ok_reconcile_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ci_ok_reconcile_test }}
      find_pr_payload_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.find_pr_payload_test }}
      merge_group_cancels_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.merge_group_cancels_test }}
      main_bypass_check_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.main_bypass_check_test }}
      edited_migrations_base_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.edited_migrations_base_test }}
      dispatch_browser_latest_blobs_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.dispatch_browser_latest_blobs_test }}
      dispatch_browser_run_reads_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.dispatch_browser_run_reads_test }}
      dispatch_browser_samples_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.dispatch_browser_samples_test }}
      race_memory_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.race_memory_test }}
      disk_watch_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.disk_watch_test }}
      priorities_seed_check_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.priorities_seed_check_test }}
      check_ci_filters_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_ci_filters_test }}
      check_ts_filters_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.check_ts_filters_test }}
      go_test_step_expansion_test: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.go_test_step_expansion_test }}
      # Selected like any other job now that no run of this workflow is a push to main.
      # docs-pages.yaml still builds and deploys main's site, on a push trigger of its own.
      docs: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.docs }}
      worker_image: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.worker_image }}
      # why: .github/ci-notes/ci.md#why-the-browser-images-build-carries-no-full-ci-term
      browser_image: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.browser_image }}
      contracts: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.contracts }}
      test_fixtures: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.test_fixtures }}
      conflicts_script: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.conflicts_script }}
      broker_client: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.broker_client }}
      envoy_client: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.envoy_client }}
      pi_shared: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.pi_shared }}
      pi_envoy: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.pi_envoy }}
      pi_legion: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.pi_legion }}
      # The dashboard's and the proof editor's fast checks: no `full-ci` term, only the
      # dispatched one above, so they come back on every push.
      dispatch_ui: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.dispatch_ui }}
      # why: .github/ci-notes/ci.md#why-the-browser-suite-is-ungated-and-what-the-label-decides
      dispatch_browser: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.dispatch_browser }}
      claude_envoy: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.claude_envoy }}
      # why: .github/ci-notes/ci.md#the-ten-slow-suites-whose-runner-time-dwarfs-every-other-jobs-the
      envoy_go: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.envoy_go || 'false' }}
      # why: .github/ci-notes/ci.md#why-envoy-gos-fast-half-comes-back-on-every-push
      envoy_go_checks: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.envoy_go_checks }}
      envoy_infra_go: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.envoy_infra_go }}
      # The checks whose subject is text, in a job with no database: no `full-ci` term, only
      # the dispatched one above, since it is one of the cheapest jobs of the file.
      text_checks: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.text_checks }}
      # Eight slow suites, gated as .github/ci-notes/ci.md#the-ten-slow-suites-whose-runner-time-dwarfs-every-other-jobs-the says.
      envoy_go_race: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.envoy_go_race || 'false' }}
      envoy_go_race_api: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.envoy_go_race_api || 'false' }}
      envoy_go_claim_model: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.envoy_go_claim_model || 'false' }}
      envoy_go_race_docs: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.envoy_go_race_docs || 'false' }}
      dispatch_memory: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.dispatch_memory || 'false' }}
      dispatch_multiprocess: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.dispatch_multiprocess || 'false' }}
      # why: .github/ci-notes/ci.md#the-two-build-job-builds-the-previous-release-and-runs-both-halves-against
      dispatch_two_builds: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.dispatch_two_builds || 'false' }}
      # why: .github/ci-notes/ci.md#the-two-build-jobs-go-step-alone-behind-a-gate-of-its-own
      dispatch_two_builds_go: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.dispatch_two_builds_go }}
      listener_server_change: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.listener_server_change }}
      broker_multiprocess: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.broker_multiprocess }}
      # The Lean model's own job, which is minutes rather than tens of them: no `full-ci` term,
      # so it comes back on every push that selects it, as the two suites above do.
      airlock_lean: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.airlock_lean }}
      # A slow suite, gated as .github/ci-notes/ci.md#the-ten-slow-suites-whose-runner-time-dwarfs-every-other-jobs-the says.
      envoy_smoke: ${{ github.event_name == 'workflow_dispatch' && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.filter.outputs.envoy_smoke || 'false' }}
      envoy_e2e_local: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.envoy_e2e_local }}
      envoy_session_stall: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.envoy_session_stall }}
      go_notices: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.go_notices }}
      ci_filters: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ci_filters }}
      ci_images: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ci_images }}
      # why: .github/ci-notes/ci.md#why-the-tool-fallback-proof-carries-no-full-ci-term
      tool_fallback: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.tool_fallback }}
      proof_sdk_offline: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.proof_sdk_offline }}
      # why: .github/ci-notes/ci.md#the-paths-filters-own-verdict-for-every-filter-before-the-full-ci-term
      filter_verdicts: ${{ github.event_name == 'workflow_dispatch' && '{}' || toJSON(steps.filter.outputs) }}
    steps:
      # why: .github/ci-notes/ci.md#on-pull_request-dornypaths-filter-reads-the-file-list-from-the-api-and-reads
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A dispatched run selects every job through the outputs above, so there is nothing to
      # filter, and paths-filter has no diff base on workflow_dispatch: a step that failed here
      # would fail `changes`, whose result every job's `if:` reads.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # Each filter names every file its job reads: the package and what its tests, typecheck
          # and build read outside it; the composite actions the job installs its tools through;
          # for Go, the closure of the packages the job compiles (`go list -deps -test`), the
          # targets of the go commands its tests start, and the module files of the workspace the
          # build runs in, whose go.mod files move the versions it compiles; and this file, since a
          # job reads its own definition. The ci-filters job (.github/scripts/check-ci-filters.sh)
          # recomputes those sets and fails naming each file a filter misses.
          #
          # The filters are declared in three steps of this job, this one and the two below.
          # Actions hands each `filters` input to the action as one environment variable, and
          # Linux caps one of those at 131,072 bytes, which the whole block in one step passed:
          # the comments above the second and third steps say what that cost and how the sets
          # were chosen. A group filters of two steps name is written out in both, since a YAML
          # anchor reaches no further than the string it is in.
          #
          # dorny/paths-filter v4.0.3's `some-with-excludes` quantifier matches a change to a filter
          # when one of its patterns without `!` matches and none of its `!` patterns does.
          # worker_image's drop what the .dockerignore keeps out of the
          # worker image's build context. envoy_e2e_local and ci_images each end in '!**/*.md': no
          # step of either job reads a Markdown file, so a guide written under a directory pattern
          # of theirs (patches/**, packages/broker-client/**, .github/actions/install-crane/**)
          # starts neither. No Markdown file of the repository matches either filter today, so the
          # pattern holds no run back now; it keeps the next guide from riding in, which is what a
          # week of Markdown-only pull requests cost 1,504 runner-minutes (dispatch://INFRA-1413).
          # Every other filter of this file was tried with that pattern
          # and refused by rule 1 of .github/scripts/check-ci-filters.sh, which fails a filter that
          # stops matching a file its gate reads: those jobs read an embedded prompt, a README
          # packed into a plugin or an image, or a guide a test compares with code - go_notices
          # among them, whose own Markdown pattern below therefore names packages/envoy/internal
          # alone, the tree whose Markdown no release target's package directory holds.
          #
          # The '*_test.go' patterns of the filters below are written by a command rather than by
          # hand: rule 17 of .github/scripts/check-ci-filters.sh computes, per gate filter, the
          # `!` patterns that keep it off every Go test file the job it gates does not compile,
          # and `.github/scripts/check-ci-filters.sh write` puts them in that filter's own block
          # between a BEGIN and an END comment. The ordinary run of that check refuses a block
          # that is not what it computes, naming the first pattern that differs, so an edit by
          # hand is lost. The check prints how many it wrote on every run, so no count is kept
          # here. That is dispatch://INFRA-1413's R18, the selection half of the rule whose
          # coverage half is rule 1: a job must not run for a change to a test file of a package
          # whose tests it never runs, and the pattern that selects such a file (packages/envoy/**
          # and its kin) matches the job's own sources too, so nothing but an exclusion can say it.
          # Which test files a job reads is `go list`'s answer for the packages its steps name in
          # test mode, under the tags and the -race each run carries, so a test it never compiles -
          # another module's, another package's, a tagged live one, a `//go:build race` one - is
          # excluded, and a filter whose job compiles every test file its patterns reach carries no
          # block at all (text_checks, and every filter naming no Go file). A block
          # belongs to the filter whose list holds it and never to a group an anchor shares, since
          # two filters that share an anchor need not run the same tests. worker_image is the one
          # filter keeping such a pattern by hand, because this check computes no read set for it:
          # its judge is the image check below, and the worker image's context holds
          # packages/daemon's test files while the .dockerignore drops packages/envoy's. A filter
          # without a `!` pattern means what it would under the default, `some` (any pattern
          # matches), where a `!` pattern would match every file outside it.
          # .github/scripts/check-image-trigger-paths.sh reads the filters
          # that gate an image build (worker_image, envoy_smoke) under this quantifier, and only as
          # flat lists of globs, so those two name no anchor standing for a list. The one anchor
          # they do name, ci_router, is on the glob itself, which leaves their lists flat.
          predicate-quantifier: some-with-excludes
          # The first keys of this step are no job's gate: each is a group many filters share,
          # written once and named by every filter that needs it through its anchor, which
          # dorny/paths-filter flattens into the list that names it.
          filters: |
            # ci.yaml, which every gate filter below names through this anchor: every job's `if:`
            # is in this file, so every job reads it - which is why ci_job_reads.py declares
            # CI_SELF on every gate. Each gate filter also names the ci-job-<job id>.yaml file
            # holding its own job's steps, so a change to one of those files selects that job
            # alone. This entry stays beside them because a change to ci.yaml does reach every
