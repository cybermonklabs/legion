          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - name: Build contracts for pi-envoy
        run: bun run build
        working-directory: packages/contracts
      - name: Lint pi-envoy
        run: bun run lint
        working-directory: packages/pi-envoy
      - name: Typecheck pi-envoy
        run: bun run typecheck
        working-directory: packages/pi-envoy
      - name: Test pi-envoy
        run: bun run test
        working-directory: packages/pi-envoy
        env:
          LEGION_TEST_NATS_URL: nats://127.0.0.1:4222
      # The release's pack (release.yaml's pi_envoy_build job), which is also this job's build: the
      # manifest pointed at the one bundle, then scripts/pi-plugin-prepack.sh, which bundles
      # envoy.ts, writes dist/THIRD_PARTY_NOTICES (failing the pack on a bundled package whose
      # license cannot be determined) and stages this plugin's eight skills. The listing shows the
      # tarball ships those and nothing of the Legion plugin's: no legion.js, no agents/, none of
      # its skills.
