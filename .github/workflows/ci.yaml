  # why: .github/ci-notes/ci.md#why-the-browser-images-build-runs-on-a-merge-group-too
  browser-image:
    needs: changes
    if: needs.changes.outputs.browser_image == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    uses: ./.github/workflows/browser-image.yaml
    # why: .github/ci-notes/ci.md#why-the-browser-image-job-grants-every-scope-the-called-workflow-declares
    permissions:
      contents: read
      packages: write
      actions: read
      checks: write
      id-token: write
      attestations: write
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  # why: .github/ci-notes/ci.md#the-pr-title-job-what-it-checks-and-why-it-posts-nothing
  pr-title:
    # why: .github/ci-notes/ci.md#why-a-dispatched-run-off-main-reports-under-names-of-its-own
    name: ${{ github.event_name == 'workflow_dispatch' && 'pr-title (dispatch)' || 'pr-title' }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04-arm
    # why: .github/ci-notes/ci.md#the-pr-title-jobs-budget
    # 600 + 9660 = 10260 s -> 172 min.
    timeout-minutes: 172
    env:
      JOB_TIMEOUT_MINUTES: 172 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    # why: .github/ci-notes/ci.md#what-the-pr-title-jobs-scopes-are-for
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # why: .github/ci-notes/ci.md#why-pr-title-refuses-a-re-run-attempt-in-a-step-of-its-own
      - name: Refuse a re-run attempt of a merge-group run
        if: ${{ github.event_name == 'merge_group' && github.run_attempt != '1' }}
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "::error::pr-title is failure on attempt $RUN_ATTEMPT of this merge-group run, whatever the pull request's text says: a merge group is tested once, the queue builds a new group rather than re-running one, and this attempt checks a tree the queue is no longer waiting on."
          exit 1

      - if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Check the pull request's title, body, branch name, commits, comments and reviews
        # why: .github/ci-notes/ci.md#what-the-pr-title-check-step-maps-and-how-it-runs-its-scripts
        # 300 + 900 + 300 + 300 + 600 + 7200 = 9600 s -> 161 min.
        timeout-minutes: 161
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_NAME_TERMS: ${{ secrets.PRIVATE_NAME_TERMS }}
          STEP_TIMEOUT_MINUTES: 161 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        run: |
          payload=$("$GITHUB_WORKSPACE/.github/scripts/find-pr-payload.sh")
          GITHUB_EVENT_PATH="$payload" "$GITHUB_WORKSPACE/.github/scripts/check-pr-text.sh"

  # why: .github/ci-notes/ci.md#the-merge-queues-cancel-act-mains-queue-builds-each-group-on-top
  cancel-started:
    if: ${{ github.event_name == 'merge_group' && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04-arm
    # why: .github/ci-notes/ci.md#the-cancel-started-jobs-budget
    # 600 + 720 = 1320 s -> 23 min.
    timeout-minutes: 23
    env:
      JOB_TIMEOUT_MINUTES: 23 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Force-cancel the runs of the groups the queue removed
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          STEP_TIMEOUT_MINUTES: 12 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        # why: .github/ci-notes/ci.md#the-cancel-started-jobs-budget
        # 300 + 300 = 600 s of ladders, 720 s with the step's own calls -> 12 min.
        timeout-minutes: 12
        run: .github/scripts/cancel-started-act.sh

  # why: .github/ci-notes/ci.md#the-verdict-and-one-of-the-two-checks-mains-ruleset-requires-of
  ci-ok:
    # why: .github/ci-notes/ci.md#why-a-dispatched-run-off-main-reports-under-names-of-its-own
    name: ${{ github.event_name == 'workflow_dispatch' && needs.changes.outputs.ref_is_main != 'true' && 'ci-ok (dispatch)' || 'ci-ok' }}
    needs:
      - changes
      - lint
      - priority-conflicts
      - ci-images
      - tool-fallback
      - tool-fallback-arm
      - typecheck
      - test
      - tooling-checks
      - daemon-go
      - plugin-pack
      - private-names-port
      - docs
      - contracts
      - test-fixtures
      - conflicts-script
      - sessions-script
      - broker-client
      - envoy-client
      - pi-shared
      - pi-envoy
      - pi-legion
      - pi-legion-build
      - dispatch-ui
      - dispatch-browser
      - dispatch-browser-pr
      - claude-envoy
      - envoy-go-build
      - envoy-go-checks
      - envoy-go
      - envoy-infra-go
      - envoy-infra-build
      - text-checks
      - envoy-go-race
      - envoy-go-race-api
      - envoy-go-claim-model
      - envoy-go-race-docs
      - dispatch-memory
      - dispatch-multiprocess
      - dispatch-two-builds
      - listener-server-change
      - broker-multiprocess
      - airlock-lean
      - envoy-smoke
      - envoy-e2e-local
      - envoy-session-stall
      - ci-filters
      - download-retry
      - proof-sdk-offline
      - worker-image
      - browser-image
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    # why: .github/ci-notes/ci.md#the-ci-ok-jobs-budget
    # 600 + 10530 = 11130 s -> 186 min.
    timeout-minutes: 186
    env:
      JOB_TIMEOUT_MINUTES: 186 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    permissions:
      actions: read
      checks: write
    steps:
      # why: .github/ci-notes/ci.md#the-job-reads-nothing-of-the-tree-but-ci-oksh-ci-okjq-ci-ok-reconcilesh-and
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      # why: .github/ci-notes/ci.md#why-a-draft-pull-request-is-refused-in-a-step
      - name: Refuse a draft pull request
        if: ${{ github.event.pull_request.draft }}
        run: |
          echo "::error::ci-ok is failure because this pull request is a draft: every other job of this run skipped, so nothing in it has been tested. Mark the pull request ready for review: that starts a run which selects by the same diff and concludes a real verdict over it."
          exit 1

      # why: .github/ci-notes/ci.md#why-a-re-run-attempt-of-a-merge-group-run-is-refused-in-a-step
      - name: Refuse a re-run attempt of a merge-group run
        if: ${{ github.event_name == 'merge_group' && github.run_attempt != '1' }}
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "::error::ci-ok is failure on attempt $RUN_ATTEMPT of this merge-group run, whatever the jobs of it did: a merge group is tested once, the queue builds a new group rather than re-running one, and this attempt judges a tree the queue is no longer waiting on."
          exit 1

      - name: Judge every job of this run
        id: verdict
        # why: .github/ci-notes/ci.md#needs-is-tojsonneeds-changes-result-and-outputs-with-every-other-jobs-result
        # 300 + 480 = 780 s -> 14 min.
        timeout-minutes: 14
        env:
          STEP_TIMEOUT_MINUTES: 14 # this step's timeout-minutes, for gh-read.sh's wait
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          SELECTED_BY: ${{ env.CI_OK_SELECTED_BY }}
          PULL_REQUEST_ONLY: ${{ env.CI_OK_PULL_REQUEST_ONLY }}
          ALWAYS_RUN: ${{ env.CI_OK_ALWAYS_RUN }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/ci-ok.sh

      - name: Hold a failing verdict until this group is the front of the queue
        if: ${{ !cancelled() && steps.verdict.outcome == 'failure' && github.event_name == 'merge_group' && github.run_attempt == '1' }}
        # why: .github/ci-notes/ci.md#why-a-failing-verdict-of-a-group-behind-the-front-waits-for-the-front
        # 10200 + 30 + 300 = 10530 s -> 176 min.
        timeout-minutes: 176
        env:
          STEP_TIMEOUT_MINUTES: 176 # this step's timeout-minutes, for gh-read.sh's wait
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          CI_OK_HOLD_AGE_SECONDS: 10200
          CI_OK_HOLD_RUN_SECONDS: 3330
        run: .github/scripts/ci-ok-hold.sh

      - name: Set every other ci-ok on this head to this job's conclusion
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || needs.changes.outputs.ref_is_main == 'true') && !(steps.verdict.outcome == 'failure' && github.event_name == 'merge_group' && github.run_attempt == '1') }}
        # why: .github/ci-notes/ci.md#why-every-other-ci-ok-on-this-head-is-set-to-this-jobs-conclusion
        # 300 + 3 x 300 = 1200 s -> 21 min.
        timeout-minutes: 21
        env:
          STEP_TIMEOUT_MINUTES: 21 # this step's timeout-minutes, for gh-read.sh's wait
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
          CONCLUSION: ${{ job.status }}
        run: .github/scripts/ci-ok-reconcile.sh
