name: CI

# why: .github/ci-notes/ci.md#the-router-every-check-a-pull-request-or-the-merge-queue-runs

# why: .github/ci-notes/ci.md#why-the-router-runs-on-these-events-and-no-others
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      # why: .github/ci-notes/ci.md#the-commit-main-pointed-at-before-the-push-the-bypass-check-read
      migration-base:
        description: >-
          The commit main pointed at before the push this run tests. A run on main must name it;
          a run on another branch that names none compares with the branch's merge base with main.
        type: string
        required: false
      every-job:
        description: Run every job on a branch too, as a run on main does.
        type: boolean
        default: false

# why: .github/ci-notes/ci.md#what-a-newer-push-cancels-and-what-is-never-cancelled
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

# why: .github/ci-notes/ci.md#why-the-routers-permissions-block-holds-those-two-scopes
permissions:
  contents: read
  actions: read
  checks: write

env:
  # why: .github/ci-notes/ci.md#what-ci_ok_selected_by-holds-and-which-programs-read-it
  CI_OK_SELECTED_BY: |
    {
      "typecheck": "typecheck",
      "test": "test",
      "tooling-checks": "tooling_checks",
      "daemon-go": "daemon_go_tests",
      "plugin-pack": "plugin_pack",
      "private-names-port": "private_names_port",
      "docs": "docs",
      "contracts": "contracts",
      "test-fixtures": "test_fixtures",
      "conflicts-script": "conflicts_script",
      "sessions-script": "sessions_script",
      "broker-client": "broker_client",
      "envoy-client": "envoy_client",
      "pi-shared": "pi_shared",
      "pi-envoy": "pi_envoy",
      "pi-legion": "pi_legion",
      "pi-legion-build": "pi_legion_build",
      "dispatch-ui": "dispatch_ui",
      "dispatch-browser": "dispatch_browser",
      "dispatch-browser-pr": "dispatch_browser_pr",
      "claude-envoy": "claude_envoy",
      "envoy-go": "envoy_go",
      "envoy-go-build": "envoy_go_build",
      "envoy-go-checks": "envoy_go_checks",
      "envoy-infra-go": "envoy_infra_go",
      "envoy-infra-build": "envoy_infra_build",
      "text-checks": "text_checks",
      "envoy-go-claim-model": "envoy_go_claim_model",
      "envoy-go-race": "envoy_go_race",
      "envoy-go-race-api": "envoy_go_race_api",
      "envoy-go-race-docs": "envoy_go_race_docs",
      "dispatch-memory": "dispatch_memory",
      "dispatch-multiprocess": "dispatch_multiprocess",
      "dispatch-two-builds": "dispatch_two_builds",
      "listener-server-change": "listener_server_change",
      "broker-multiprocess": "broker_multiprocess",
      "airlock-lean": "airlock_lean",
      "envoy-smoke": "envoy_smoke",
      "envoy-e2e-local": "envoy_e2e_local",
      "envoy-session-stall": "envoy_session_stall",
      "ci-filters": "ci_filters",
      "ci-images": "ci_images",
      "download-retry": "download_retry",
      "tool-fallback": "tool_fallback",
      "tool-fallback-arm": "tool_fallback",
      "proof-sdk-offline": "proof_sdk_offline",
      "worker-image": "worker_image",
      "browser-image": "browser_image"
    }
  CI_OK_PULL_REQUEST_ONLY: '["dispatch-browser-pr", "worker-image"]'
  # why: .github/ci-notes/ci.md#the-jobs-that-run-on-every-change
  CI_OK_ALWAYS_RUN: |
    [
      "changes",
      "lint",
      "priority-conflicts"
    ]
  # why: .github/ci-notes/ci.md#the-jobs-outside-ci-oks-accounting
  CI_OK_EXEMPT: |
    [
      "cancel-started",
      "ci-ok",
      "dispatch-references",
      "pr-title"
    ]

jobs:
  # why: .github/ci-notes/ci.md#what-the-changes-job-selects-and-the-two-terms-every-job-carries
  changes:
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    # why: .github/ci-notes/ci.md#why-changes-pr-title-cancel-started-and-ci-ok-run-on-arm64
    runs-on: ubuntu-24.04-arm
    # why: .github/ci-notes/ci.md#the-changes-jobs-budget
    # 2040 + 3416 = 5456 s -> 91 min.
    timeout-minutes: 91
    outputs:
      # why, for each output below with a `lane:` term: .github/ci-notes/ci.md#how-a-slow-suite-is-held-back-on-a-pull-request
      # and .github/ci-notes/ci.md#a-lane-label-turns-on-one-slow-suite-on-a-pull-request
      typecheck: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.typecheck }}
      test: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:test')) && steps.filter.outputs.test || 'false' }}
      # why: .github/ci-notes/ci.md#the-fast-half-of-a-split-job-comes-back-on-every-push
      tooling_checks: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.tooling_checks }}
      # why: .github/ci-notes/ci.md#why-the-daemons-go-suite-has-an-output-of-its-own
      daemon_go_tests: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:daemon_go_tests')) && steps.filter.outputs.daemon_go_tests || 'false' }}
      # why: .github/ci-notes/ci.md#why-the-plugin-pack-has-an-output-of-its-own
      plugin_pack: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.plugin_pack }}
      # why: .github/ci-notes/ci.md#why-the-private-name-port-harness-has-an-output-of-its-own
      private_names_port: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.private_names_port }}
      # why: .github/ci-notes/ci.md#why-the-session-message-wait-suite-has-an-output-of-its-own
      sessions_script: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.sessions_script }}
      # The step gates of the test and tooling-checks jobs, all in one: the paths filter's own list
      # of the filters that matched, out of which each harness step and the guides' layout step
      # read their own; `all` on a run that selects every job and when the filters fell open.
      # why: .github/ci-notes/ci.md#one-list-for-the-test-jobs-step-gates
      matched_filters: ${{ steps.scope.outputs.every_job && 'all' || steps.generate.outputs.every_filter == 'true' && 'all' || steps.filter.outputs.changes }}
      # Selected like any other job now that no run of this workflow is a push to main.
      # docs-pages.yaml still builds and deploys main's site, on a push trigger of its own.
      docs: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.docs }}
      worker_image: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.worker_image }}
      # why: .github/ci-notes/ci.md#why-the-browser-images-build-carries-no-full-ci-term
      browser_image: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.browser_image }}
      contracts: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.contracts }}
      test_fixtures: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.test_fixtures }}
      conflicts_script: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.conflicts_script }}
      broker_client: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.broker_client }}
      envoy_client: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.envoy_client }}
      pi_shared: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.pi_shared }}
      pi_envoy: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.pi_envoy }}
      pi_legion: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:pi_legion')) && steps.filter.outputs.pi_legion || 'false' }}
      # why: .github/ci-notes/ci.md#the-fast-half-of-a-split-job-comes-back-on-every-push
      pi_legion_build: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.pi_legion_build }}
      dispatch_ui: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.dispatch_ui }}
      # why: .github/ci-notes/ci.md#the-browser-suites-two-outputs-one-per-lane
      dispatch_browser: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:dispatch_browser')) && steps.filter.outputs.dispatch_browser || 'false' }}
      # why: .github/ci-notes/ci.md#the-browser-suites-two-outputs-one-per-lane
      dispatch_browser_pr: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.dispatch_browser_pr }}
      # why: .github/ci-notes/ci.md#the-reference-rows-preview-job
      dispatch_references: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.dispatch_references }}
      claude_envoy: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.claude_envoy }}
      envoy_go: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_go')) && steps.filter.outputs.envoy_go || 'false' }}
      # why: .github/ci-notes/ci.md#why-envoy-gos-build-and-checks-come-back-on-every-push
      envoy_go_build: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.envoy_go_build }}
      envoy_go_checks: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_go_checks')) && steps.filter.outputs.envoy_go_checks || 'false' }}
      envoy_infra_go: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_infra_go')) && steps.filter.outputs.envoy_infra_go || 'false' }}
      # why: .github/ci-notes/ci.md#the-fast-half-of-a-split-job-comes-back-on-every-push
      envoy_infra_build: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.envoy_infra_build }}
      text_checks: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.text_checks }}
      envoy_go_race: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_go_race')) && steps.filter.outputs.envoy_go_race || 'false' }}
      envoy_go_race_api: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_go_race_api')) && steps.filter.outputs.envoy_go_race_api || 'false' }}
      envoy_go_claim_model: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_go_claim_model')) && steps.filter.outputs.envoy_go_claim_model || 'false' }}
      envoy_go_race_docs: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_go_race_docs')) && steps.filter.outputs.envoy_go_race_docs || 'false' }}
      dispatch_memory: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:dispatch_memory')) && steps.filter.outputs.dispatch_memory || 'false' }}
      dispatch_multiprocess: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:dispatch_multiprocess')) && steps.filter.outputs.dispatch_multiprocess || 'false' }}
      # why: .github/ci-notes/ci.md#the-two-build-job-builds-the-previous-release-and-runs-both-halves-against
      dispatch_two_builds: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:dispatch_two_builds')) && steps.filter.outputs.dispatch_two_builds || 'false' }}
      # why: .github/ci-notes/ci.md#the-two-build-jobs-go-step-alone-behind-a-gate-of-its-own
      dispatch_two_builds_go: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.dispatch_two_builds_go }}
      listener_server_change: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.listener_server_change }}
      broker_multiprocess: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.broker_multiprocess }}
      airlock_lean: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.airlock_lean }}
      envoy_smoke: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:envoy_smoke')) && steps.filter.outputs.envoy_smoke || 'false' }}
      envoy_e2e_local: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.envoy_e2e_local }}
      envoy_session_stall: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.envoy_session_stall }}
      go_notices: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.go_notices }}
      ci_filters: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.ci_filters }}
      ci_images: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.ci_images }}
      # why: .github/ci-notes/ci.md#the-three-jobs-that-prove-the-retries-and-why-none-runs-in-a-merge-group
      download_retry: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && 'false' || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'lane:download_retry')) && steps.filter.outputs.download_retry || 'false' }}
      download_retry_sites: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && 'false' || steps.filter.outputs.download_retry_sites }}
      download_retry_images: ${{ steps.scope.outputs.every_job && 'true' || (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && 'false' || steps.filter.outputs.download_retry_images }}
      # why: .github/ci-notes/ci.md#why-the-tool-fallback-proof-carries-no-full-ci-term
      tool_fallback: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.tool_fallback }}
      proof_sdk_offline: ${{ steps.scope.outputs.every_job && 'true' || steps.filter.outputs.proof_sdk_offline }}
      # why: .github/ci-notes/ci.md#the-paths-filters-own-verdict-for-every-filter-before-the-full-ci-term
      filter_verdicts: ${{ steps.scope.outputs.every_job && '{}' || toJSON(steps.filter.outputs) }}
      # why: .github/ci-notes/ci.md#why-a-dispatched-run-off-main-reports-under-names-of-its-own
      ref_is_main: ${{ steps.ref.outputs.is_main }}
    steps:
      # why: .github/ci-notes/ci.md#why-a-dispatched-run-off-main-reports-under-names-of-its-own
      - name: Read whether this run's ref is exactly refs/heads/main
        id: ref
        timeout-minutes: 1
        run: if [ "$GITHUB_REF" = refs/heads/main ]; then echo is_main=true; else echo is_main=false; fi >> "$GITHUB_OUTPUT"
      # why: .github/ci-notes/ci.md#what-a-dispatched-run-of-a-branch-selects-and-when-to-ask-for-every-job
      - name: Read whether this run selects every job
        id: scope
        timeout-minutes: 1
        env:
          IS_MAIN: ${{ steps.ref.outputs.is_main }}
          EVERY_JOB: ${{ inputs.every-job }}
        run: |
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && { [ "$IS_MAIN" = true ] || [ "$EVERY_JOB" = true ] || [[ $GITHUB_REF != refs/heads/* ]]; } && v=true || v=
          echo "every_job=$v" >> "$GITHUB_OUTPUT"
      # why: .github/ci-notes/ci.md#the-changes-job-computes-its-filters-when-it-runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      # why: .github/ci-notes/ci.md#the-changes-job-computes-its-filters-when-it-runs (no Go cache)
      - continue-on-error: true
        timeout-minutes: 3
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # Its own retry arithmetic, which is the action's: two `ci_tools_fetch` calls,
      # 2 x 1708 = 3416 s (ci-budgets.md's Budgets note) -> 57 min.
      - name: Setup Bun
        continue-on-error: true
        timeout-minutes: 57
        uses: ./.github/actions/setup-bun
      # Retried at 180 s per attempt like every Bun install here (ci-budgets.md's Retries note).
      - name: bun install --frozen-lockfile
        continue-on-error: true
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile >&2
      # why: .github/ci-notes/ci.md#what-a-dispatched-run-of-a-branch-selects-and-when-to-ask-for-every-job
      - name: Find the merge base with main a dispatch of a branch is measured against
        id: base
        if: ${{ github.event_name == 'workflow_dispatch' && !steps.scope.outputs.every_job }}
        timeout-minutes: 3
        run: |
          sha=$(.github/scripts/edited-migrations-base.sh)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # why: .github/ci-notes/ci.md#the-changes-jobs-budget
      # 315 + 65 + 1050 = 1430 s -> 24 min.
      - name: Compute every filter from what each job reads
        id: generate
        timeout-minutes: 24
        env:
          CI_FILTERS_BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || steps.base.outputs.sha }}
        run: .github/scripts/ci-filters-generate.sh "$RUNNER_TEMP/ci-filters.yaml"
      - name: Keep the filters this run computed
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-filters
          path: ${{ runner.temp }}/ci-filters.computed.yaml
          retention-days: 7
      # why: .github/ci-notes/ci.md#what-the-filter-step-diffs-on-a-dispatched-run
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        timeout-minutes: 3
        if: ${{ !steps.scope.outputs.every_job }}
        with:
          predicate-quantifier: some-with-excludes
          filters: ${{ runner.temp }}/ci-filters.yaml
          base: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}

  lint:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    # why: .github/ci-notes/ci.md#why-the-lint-job-holds-each-of-its-scopes
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/ci-job-lint.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}
      changes-result: ${{ needs.changes.result }}
      go_notices: ${{ needs.changes.outputs.go_notices }}
    secrets:
      PRIVATE_NAME_TERMS: ${{ secrets.PRIVATE_NAME_TERMS }}

  # Runs on every non-draft run, also when `changes` failed, as lint does.
  # why: .github/ci-notes/ci.md#why-a-change-that-conflicts-with-a-priority-pull-request-fails
  priority-conflicts:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    # arm64, as .github/ci-notes/ci.md#why-changes-pr-title-cancel-started-and-ci-ok-run-on-arm64 says.
    runs-on: ubuntu-24.04-arm
    # Budget (ci-budgets.md's Budgets note): its measured run, 154 s, plus its slowest retried
    # step alone, the ci-ok report at 2460 s (ci-budgets.md's Budgets note, "The ci-ok report"),
    # above the check step's four ladders, 1400 s. The measured run is the 13 s of the slowest of
    # its 18 successful runs on 2026-11-26 (job 139937626624; none of them fetched, as no priority
    # pull request was approved or queued), with that run's 8 s check step replaced by the 149 s
    # the check step's comment measures. The job holds the report step at its rounded 43-minute
    # (2580 s) limit AND the 152 s measured before it, that run's 3 s before its check step and
    # the 149 s, so its key is the two together, 152 + 2580 = 2732 s -> 46 min. From the 2460 s
    # alone, 154 + 2460 = 2614 s would take 44 minutes and leave the report step 2488 s of its
    # 2580.
    timeout-minutes: 46
    env:
      JOB_TIMEOUT_MINUTES: 46 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    # why: .github/ci-notes/ci.md#what-the-priority-conflicts-jobs-scopes-are-for
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    steps:
      # The job reads nothing of the tree but priority-conflicts.sh, the ci-retry.sh and gh-read.sh
      # it sources, the ci-log-guard.sh those two source, and the ci-ok-report action, so the
      # .github cone is the whole checkout it needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Check this change against every approved or queued priority pull request
        # The script's whole arithmetic, since this `run:` is one call of it: its four ladders,
        # the label read's two pages (7 open pull requests carried the label on 2026-11-26, and
