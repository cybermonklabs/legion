            # ci.yaml's ci-images job: the image copy (.github/scripts/mirror-ci-images.sh,
            # through the crane .github/actions/install-crane installs), the package mode of
            # .github/scripts/check-ci-images.sh, which reads ghcr.io, and the tool copy
            # (.github/scripts/mirror-ci-tools.sh), which fills the second source of every tool
            # install. These files are what decides what those three steps do. The gate's other
            # half reads the whole tree and is a step of lint, which runs on every change.
            # It names the tool_fallback filter above through that filter's own anchor, which
            # dorny/paths-filter flattens into this list, so this filter is a superset of that
            # one by construction and not by a copy kept in step by hand. The tool-fallback job
            # needs this job, because the copy for this change must be filled before the proof
            # reads it, and a job whose `needs:` is skipped is skipped — which ci-ok then reads
            # as a selected job that did not run. A filter that selects fewer changes than the
            # job it gates depends on is exactly that defect.
            ci_images:
              - '.github/ci-images.yaml'
              - '.github/scripts/mirror-ci-images.sh'
              # mirror-ci-images.sh reads the registry through this helper, which it sources.
              - '.github/scripts/ci-retry.sh'
              - '.github/scripts/check-ci-images.sh'
              - '.github/scripts/ci_images.py'
              - *tool_fallback
            # ci.yaml's download-retry job: the retry loop, the fault it is proved against, the
            # rig that puts the two together, and the composite actions whose own downloads this
            # job runs. It names nothing those downloads read — no manifest, no lockfile, no pin,
            # no module file — because what the job proves is that a download survives a faulting
            # host, and the bytes coming down the wire do not change whether it does. So this
            # filter holds no bun_install and no go_workspace anchor, no pin and no worker
            # Dockerfile: each of those is what an ordinary change touches, and a filter holding
            # them would select a job of about two hours on every dependency bump. The job that
            # proves a version is the one that builds with it.
            download_retry:
              # The job's own steps are written here: its sites, its bounds, the hosts each fault
              # answers for and the budget each report holds its site to.
              - '.github/workflows/ci.yaml'
              # The loop every faulted site retries through, the fault, and the rig that starts a
              # proxy for one site, probes it and reads its log back.
              - '.github/scripts/ci-retry.sh'
              - '.github/scripts/ci-fault-proxy.py'
              - '.github/scripts/download-retry-proof.sh'
              # The composite actions whose own downloads this job proves. Three are sites a
              # fault is put in front of: install-changie's curl, install-omp's `mise install`
              # and install-claude-code's `bun add`. The other two run unfaulted, and each is
              # what a faulted site then runs on — setup-bun installs the Bun both Bun sites
              # use, and install-jj leaves behind the mise install-omp installs its pin through.
              # Named one by one rather than as .github/actions/**, which brought in
              # install-crane, install-elan, install-pulumi, install-uv and pull-test-images,
              # none of which this job runs. The ci-ok-report action its last step runs stays
              # out, as it is out of every other filter of this file: it reports the verdict,
              # and the `gh api` read this job proves is its own step's, written in that
              # script's spelling.
              - '.github/actions/setup-bun/**'
              - '.github/actions/install-jj/**'
              - '.github/actions/install-changie/**'
              - '.github/actions/install-claude-code/**'
              - '.github/actions/install-omp/**'
            # ci.yaml's download-retry-images job: the three Dockerfiles whose network RUN lines
            # carry the inline retry, the loop those copies mirror, the fault and the rig. Not
            # what the builds compile: worker-image and envoy-smoke prove the builds, and this
            # job proves only that each build survives a faulting host inside its own RUN lines.
            download_retry_images:
              - 'packages/daemon/docker/worker.Dockerfile'
              - 'packages/envoy/docker/Dockerfile'
              - 'packages/envoy/infra/host/heldportwrapper/Dockerfile'
              - '.github/scripts/ci-retry.sh'
              - '.github/scripts/ci-fault-proxy.py'
              - '.github/scripts/download-retry-proof.sh'
              - '.github/workflows/ci.yaml'
            # ci.yaml's proof-sdk-offline job: a frozen install behind a proxy that answers 504
            # for every host the proof editor's old `github:sjawhar/proof-sdk#<sha>` route used.
            # What can send that install to one of those hosts again is every file the install
            # reads, which is the shared group above, so the filter names it whole rather than
            # the four sites of it this job is really about: bun.lock, which a reintroduced
            # remote dependency necessarily moves, package.json, the root manifest the frozen
            # install reads, packages/proof-editor/package.json, the manifest that names the
            # tarball, and packages/proof-editor/proof-sdk-*.tgz, the file itself. Beside it:
            # .github/scripts/ci-retry.sh, which both of its installs source for their retry,
            # .github/scripts/ci-fault-proxy.py, the program that drives the install, and this
            # file, which holds the job.
            proof_sdk_offline:
              - *bun_install
              - *ci_retry
              - '.github/scripts/ci-fault-proxy.py'
              - '.github/workflows/ci.yaml'

  # Reads the whole tree, so it runs on every non-draft run, also when `changes` failed.
  lint:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') }}
    runs-on: ubuntu-24.04
    # Budget (the header's Budgets note): 1800 s, the 30 minutes this job carried, above its
    # 1050 s measured maximum, plus its slowest retried step alone — the Go module download,
    # whose three calls are 3 x (5 x 180 + 150) = 3150 s, above the workspace install's and the
    # lockfile install's 1050 s each and the ci-ok report's 600 s. 1800 + 3150 = 4950 s ->
    # 83 min. The pull request's text is checked in the `pr-title` job now, so that job carries
    # check-pr-text.sh's and post-check-run.sh's arithmetic.
    timeout-minutes: 83
    # The ci-ok-report step is the whole of this job's GitHub writing: it posts a failing ci-ok
    # with `checks: write` and names the run's jobs in it with `actions: read`. `contents: read`
    # is the checkout's. `pull-requests: read` is the daemon API contract check's: when it is
    # about to refuse a change it reads every open pull request of the repository, with the paths
    # each changes, to name a number no other one has taken. The pull request's text is the
    # `pr-title` job's, which declares the scopes its own routes read.
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This job runs on every change, so the pin check runs on every change rather than only on
      # one that touches a package.
      - name: Check every Bun install reads .bun-version
        run: .github/scripts/check-bun-version.sh

      - name: Check frozen Bun installs copy every workspace manifest
        run: .github/scripts/check-bun-workspace-manifests.sh

      - name: Check every manifest names the one exact zod
        run: .github/scripts/check-zod-version.sh

      # Only on a pull request and a merge group, the two events that have a base to compare
      # with: this job also runs on the bypass check's dispatched run at main's tip, where the
      # change has already merged. The condition tests `github.event_name` and no output of the
      # `changes` job, which rules 2 and 3 of .github/scripts/check-ci-filters.sh require of a
      # step in this job.
      - name: Check a change that touches the daemon API contract declares a number above the base's
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-daemon-api-contract.sh

      - name: Check the saved gh help is the worker image's gh
        run: .github/scripts/check-gh-version.sh

      - name: Check image triggers cover every image input
        run: .github/scripts/check-image-trigger-paths.sh

      - name: Check every image a CI job fetches is a row of .github/ci-images.yaml
        run: .github/scripts/check-ci-images.sh tree

      - name: Check every tool asset of .github/ci-tools.yaml agrees with its pin
        run: .github/scripts/check-ci-tools.sh

      - name: Check every remote action is pinned to a commit SHA
        run: .github/scripts/check-action-pins.sh

      - name: Check every download retries at the floor, through the one rule that holds it
        run: .github/scripts/check-download-retry.sh

      - name: Check no file names the private deployment repository, company, internal host, or tailnet host
        run: .github/scripts/check-private-names.sh

      - name: Check no current file names the pre-split Oh My Pi plugin
        run: .github/scripts/check-plugin-names.sh

      # Biome's own rule refuses the `fireEvent` import under packages/dispatch/web/src, and a file
      # that needs it keeps one `biome-ignore` naming that file's reasons. The rule reads imports,
      # so it says nothing about a call added to a file whose exemption is already in place, which
      # is what a forward merge of main brings: no conflict, no lint error, no type error. This
      # check asks each call for its own reason instead.
      - name: Check every fireEvent call of the Dispatch suite carries its own reason
        run: .github/scripts/check-fireevent-reasons.sh

      - name: Check the release workflows keep credentials out of jobs that run dependency code
        run: .github/scripts/check-release-credentials.sh

      # Every package whose fragments a release renders is a line of .github/changelog-packages,
      # which this check reads: a fragment of any other package is rendered nowhere and nothing
      # would report it, so it is refused here, on every pull request.
      - name: Check every changelog fragment belongs to a listed package
        run: |
          # shellcheck disable=SC2046 # the file is the package list, split on purpose
          .github/scripts/release-push.sh fold-orphans $(<.github/changelog-packages)

      # No setup-go cache: gofmt needs none, and the notices step below keeps its own (go-notices),
      # keyed on the Go version this step installs.
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      # The skill-scenario rig's daemon-pane.go belongs to no module (it runs with `go run -overlay`
      # inside packages/daemon), so it is formatted here with the daemon.
      - name: Check the Go daemon's formatting
        run: |
          unformatted=$(gofmt -l packages/daemon packages/pi-legion/scripts/skill-scenarios/daemon-pane.go)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not gofmt-formatted; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi

      - uses: ./.github/actions/setup-bun

      # Retried like every install in this workflow (the header's Retries note); 180 s per
      # attempt, the bound every Bun install of this repository's CI carries
      # (dispatch://INFRA-1545): this install measured 20.70 s cold on a pod, against at most
      # 11 s over 180 observations in the 20 most recent successful ci.yaml push runs on main.
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile

      # The frozen install above does not refuse a workspace `version` the lockfile does not hold.
      # --lockfile-only writes the lockfile the manifests imply and installs nothing, so a
      # difference here is what a reader's own `bun install` would write.
      - name: Check bun.lock agrees with the workspace manifests
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          # Retried as the frozen install above is, and bounded by the same measurement: this
          # resolve-only run reads the same manifests and installs nothing, so it cannot cost
          # more than that install's 20.70 s cold reading.
          retry_fetch "the lockfile the manifests imply" 180 -- bun install --lockfile-only
          if ! git diff --exit-code bun.lock; then
            echo "::error file=bun.lock::bun.lock disagrees with the workspace manifests; run bun install and commit bun.lock, and after a forward merge of main take one side's bun.lock whole before installing"
            exit 1
          fi

      # A package's `bun run lint` checks only the paths its recipe names. This is the command
      # AGENTS.md documents, over the whole tree, so a fixture, config or test file that Biome
      # would rewrite fails here instead of on the next person who runs it.
      - name: Check the whole tree with Biome
        run: bunx biome check .

      # After the install, which is what gives it node_modules: it lists each Bun gate's tsc
      # program with `bunx tsc --listFilesOnly` and holds every file of it to that gate's filter,
      # so the TypeScript half of what those filters must select is derived rather than
      # hand-kept. In this job because the ci-filters job has neither Bun nor node_modules, and
      # because this one is gated by no `changes` output, so a change anywhere can start it.
      - name: Check every Bun gate's filter selects the files its typecheck compiles
        run: .github/scripts/check-ts-filters.sh

      # The notices step below builds go-licenses and loads every release binary's modules. It
      # keeps them in a cache family of its own, go-notices: one entry, read on every run, so never
      # evicted, and refreshed only when Go is bumped. Keyed on the go.sum files it would leave a
      # 2.2 GB entry per key change; keyed on the Go version, a go.sum change only downloads the
      # changed modules and rebuilds the changed packages, since Go's build cache is
      # content-addressed. Restored only when the notices step runs; ci-caches.yaml fills it.
      - if: needs.changes.result != 'success' || needs.changes.outputs.go_notices == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/legion
          key: go-notices-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-notices-{0}-', runner.os) }}

      # The modules the notices step loads for every release target, downloaded once and retried
      # before it (the header's Retries note; the retried unit is the download, never the build).
      # It runs on the step's own condition, so a run that skips the notices step downloads
      # nothing. Three calls, because the step builds in three module directories and
      # packages/envoy/infra is a workspace of its own, which the root go.work does not bind.
      #
      # 180 s per attempt: the slowest cold `go mod download` measured is 113 s, for
      # packages/envoy/infra, against 81 s for packages/daemon and 77 s for packages/envoy, each
      # on an empty module cache on 2026-11-07, so the bound is 1.6 times the slowest of the
      # three. It can be that tight where a tarball fetch's could not: an attempt the bound kills
      # leaves what it fetched in the module cache, and the next attempt resumes from there. The
      # cache restored above makes the common run cost nothing.
      - name: Download the Go modules this job builds
        if: needs.changes.result != 'success' || needs.changes.outputs.go_notices == 'true'
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: three calls, 3 x (5 x 180 + 150) = 3150 s -> 53 min.
        timeout-minutes: 53
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/daemon's Go modules" 180 -- go -C packages/daemon mod download
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
          retry_fetch "packages/envoy/infra's Go modules" 180 -- go -C packages/envoy/infra mod download

      # Every Go archive a release ships carries THIRD_PARTY_NOTICES, written at build time with
      # the build's own GOOS, GOARCH and CGO_ENABLED (release.yaml's legion_build job and
      # release-envoy-listener.yaml, whose targets .github/go-release-targets.json lists for all of
      # them, and release-envoy-infra.yaml, whose targets .github/envoy-infra-targets.json lists).
      # Writing them here for each of those builds fails the pull request that brings in a module
      # whose license cannot be determined, before a release does. Writing notices loads packages
      # without type-checking them, so the darwin agent-secrets client and every command of the
      # envoy-infra module, which no other pull-request job builds for each of its targets, are also
      # compiled here, with their release builds' CGO_ENABLED and -buildvcs: a compile error on one
      # platform only fails the pull request rather than the release after the merge. It runs when
      # the go_notices filter matches (a Go package it loads, a module file, a target list or the
      # notices script changed), and whenever `changes` did not succeed.
      #
      # The loops are in .github/scripts/go-release-notices.sh, which
      # .github/workflows/ci-caches.yaml's daemon job runs too, to fill the go-notices entry this
      # step restores: one script, so the fill cannot warm anything but what this step builds.
      - name: Check every Go release archive's third-party notices can be written and the cross-built commands compile
        if: needs.changes.result != 'success' || needs.changes.outputs.go_notices == 'true'
        run: .github/scripts/go-release-notices.sh "$RUNNER_TEMP/notices"

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its own retry arithmetic: ci-ok-report.sh's `gh api` read and post-check-run.sh's POST
        # of the check run, 2 x (5 x 30 + 150) = 600 s. 720 s and not rule 8's minimum of 660 s:
        # this step posts the required ci-ok check, and a budget that cuts it between those two
        # ladders loses the check run rather than reporting a failure (the header's Budgets note).
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # Copies every row .github/ci-images.yaml names into ghcr.io/cybermonklabs/legion/ci, then reads the
  # package to check that it holds every row. The order is the point: the read fails a row the
  # package does not hold, so the copy for this change runs first. The ci_images filter selects
  # this job, and names the files that decide what its steps do: the rows, the scripts, the
  # module both image scripts read a reference with, the actions and this file. The gate's
  # other half reads the whole tree, and is a step of lint, which runs on every change: a file
  # that names a third-party registry again can be any file, and this filter names few of them.
  # This job is the one copy path: it runs on a pull request and on a merge group, which is every
  # event that can bring a new row in, and a failed copy is re-run with `gh run rerun`.
  # The copy of every tool asset is filled here too, in the step after the image half
  # (.github/scripts/mirror-ci-tools.sh): it is the same package, under the same login, and the
  # tool-fallback job below reads what this step filled, so that copy must land before it.
  ci-images:
    needs: changes
    if: needs.changes.outputs.ci_images == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Budget (the header's Budgets note): 1500 s, the 25 minutes this job carried once the tool
    # copy joined the image copy, above its 25 s measured maximum of the image half alone, plus
    # its slowest retried step alone — the image copy step, whose mirror-ci-images.sh makes two
    # `crane config` ladders at 5 x 60 + 150 = 450 s each, a `crane copy` at 5 x 300 + 150 =
    # 1650 s and a `crane digest` at 450 s, 3000 s together, above install-crane's 607 s and
    # above the ci-ok report's 600 s. 3000 s is a whole
    # number of minutes, so that step's own budget takes one more and this job takes it too.
    # 1500 + 3060 = 4560 s -> 76 min.
    #
    # The tool copy step is the one term left out of that sum, and it is named here rather
    # than left for a reader to miss. Every request .github/scripts/mirror-ci-tools.sh makes
    # rides the one ladder .github/scripts/ci-tools.sh holds (dispatch://INFRA-1545, R2), and
    # that ladder is eight attempts with 127 s of waits between them: 8 x 30 + 127 = 367 s for
    # the requests that carry no asset bytes, and 8 x 60 + 127 = 607 s at the `max_time` of 60
    # every row of .github/ci-tools.yaml carries. A ghcr-mirror row this run fills costs nine
    # of them — the two HEADs that read its state, the asset, the layer's POST and PUT, the
    # config's POST and PUT, the manifest and the read-back — which is 3783 s, and the four
    # ghcr-mirror rows of that manifest with the one token request come to
    # 607 + 4 x 3783 = 15739 s. Carrying that term would put this job's ceiling near five
    # hours for every change the ci_images filter selects, to cover the one run in which the
    # package answers no request of four rows until every ladder is exhausted — an outage of
    # the package this job has to fail in rather than wait out, since the copy it fills is
    # this repository's own. So the ceiling stays at the image copy's, and a run that does
    # exhaust those ladders ends on this job's limit rather than on a step's.
    # .github/scripts/check-download-retry.sh writes no figure for them either: the ladder's
    # per-attempt bound is the row's `max_time`, and its rule 8 prices a bound written as a
    # variable at nothing.
    timeout-minutes: 76
    # packages: write is the ghcr.io push, which is `crane copy` for an image row and the
    # registry API call .github/scripts/mirror-ci-tools.sh makes for a tool row; actions: read
    # and checks: write are the ci-ok-report step's.
    permissions:
      contents: read
      packages: write
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install-crane's own retry arithmetic: its curl of the release tarball,
      # 8 x 60 + 127 = 607 s -> 11 min.
      - uses: ./.github/actions/install-crane
        timeout-minutes: 11

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy every image the package does not hold
        # Its own retry arithmetic: mirror-ci-images.sh's `crane config` at 5 x 60 + 150 =
        # 450 s, written once in image_go() and reached by the two check_go() calls the row
        # loop holds, 900 s; its `crane copy` at 5 x 300 + 150 = 1650 s; and its `crane digest`
        # at 450 s. 3000 s, a whole number of minutes, so the budget is the next one strictly
        # above it -> 51 min.
        timeout-minutes: 51
        run: .github/scripts/mirror-ci-images.sh

      - name: Check the package holds every row of .github/ci-images.yaml
        run: .github/scripts/check-ci-images.sh package

      - name: Fill the copy of every tool asset the package does not hold
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/mirror-ci-tools.sh

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its own retry arithmetic: ci-ok-report.sh's `gh api` read and post-check-run.sh's POST
        # of the check run, 2 x (5 x 30 + 150) = 600 s. 720 s and not rule 8's minimum of 660 s:
        # this step posts the required ci-ok check, and a budget that cuts it between those two
        # ladders loses the check run rather than reporting a failure (the header's Budgets note).
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The live proof of the second source every tool install of this repository now has: it faults
  # the host the first source is on, installs all four tools through the source
  # .github/ci-tools.yaml names for each, and then serves eight corrupted payloads and reads the
  # refusal of every one of them.
  # It is permanent rather than a scaffold. A second source nothing exercises rots — a copy
  # nothing fills, a seam a refactor dropped, a digest nobody reads — and the hour of 504s this
  # work answers is the hour nobody wants to learn that in (dispatch://INFRA-1873). This
  # repository's own principle is that testing means booting and running it, so what says the
  # fallback works on the day the assets are down is a job that takes them down and installs
  # anyway.
  #
  # Once the fault is up, no step of this job needs a GitHub release host to answer.
  # Every install that must succeed reads the second source its row names, the ghcr copy or npm,
  # and the fault holds neither; the bytes the corrupted cases serve were staged before the
  # fault; and the one case about a binary a third party installed seeds mise's install
  # directory from that staged payload rather than downloading one inside the fault.
  # That is what keeps ci-ok green during the very outage this job proves survivable: this job
  # is in ci-ok's `needs:`, and its filter selects ci.yaml, .bun-version, the worker image's
  # Dockerfile and the four actions, so a step of it that waited on a release host would turn
  # every pull request touching one of those files red on exactly the day the fallback is doing
  # its work.
  # .github/scripts/ci-tools-proof.sh is the rig, and this job and tool-fallback-arm are its
  # only callers.
  # It needs ci-images, which fills the copy this proof reads; the comment on the ci_images
  # filter says why that filter is a superset of this job's.
  #
  # WHAT THIS JOB DRIVES, AND WHAT IT ONLY REASONS ABOUT.
  # Everything a case is read on is driven here: the fault, the origin that stands in for all
  # three sources, the corrupted payloads, and the removals each case makes before it.
  # One thing is not. oven-sh/setup-bun, which .github/actions/setup-bun's setup-bun step pins,
  # restores a cached Bun into ~/.bun/bin/bun inside a step of its own, and the Actions cache it
  # restores from is on hosts this job's fault does not hold.
  # .bun-version holds an exact version, so that action builds its key and its URL without
  # asking any host which version to take, and nothing the fault refuses stands in its way.
  # Taking a bun away before that step is therefore no answer to the cache, since the step would
  # put a restored one back.
  # What keeps every case here a reading of an install is the wrapper's own `no-cache`, true for
  # every job whose id starts with `tool-fallback` — `github.job` in a composite action is the
  # id of the job that called it — so no call of that action in this job can be served by the
  # Actions cache, on any event and any ref.
  # That is read from the wrapper's expression rather than from a run of this job: a run that
  # told the action not to read the cache cannot measure what the cache would have served.
  # The removals the cases do make are about this job's own state: a case that must read the
  # second source takes ~/.bun/bin/bun and the bunx beside it away before its install, so what
  # it reads is not the bun an earlier case left.
  tool-fallback:
    needs: [changes, ci-images]
    if: needs.changes.outputs.tool_fallback == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # contents: read is the two checkouts'; actions: read and checks: write are the
    # ci-ok-report step's. Every read of the package here is the anonymous one an install makes,
    # so this job needs no packages scope at all.
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The merge base, for the negative control below: a second tree of this same repository,
      # whose four installs that control drives with nowhere left to go. The comment on those
      # steps says what keeps this checkout here.
      - name: Check out the merge base the negative control installs from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: base
          persist-credentials: false

      # The package holds the blob of every mirrored row, asked for with no credential at all
      # and at the address .github/scripts/ci-tools.sh builds, which is how an install asks for
      # it: this step reads the blob an install reads, through the same CI_TOOLS_GHCR_BASE
      # seam, and writes no address of its own.
      # This rule is the opposite of the filler's, on purpose. .github/scripts/mirror-ci-tools.sh
      # leaves a cold row green, because an asset that does not answer is the outage the copy
      # exists to survive and a red ci-ok during that outage helps nobody. Here a cold row is a
      # refusal, because this job records a pass for a fallback it drove, and a pass recorded for
      # a row whose second source does not exist yet is a pass for nothing.
      - name: Check the package holds the blob of every mirrored row
        run: |
          set -euo pipefail
          # shellcheck source=.github/scripts/ci-tools.sh
          . .github/scripts/ci-tools.sh
          registry=$(ci_tools_registry)
          token=$(ci_tools_ghcr_token)
          rows=$(ci_tools_rows ghcr-mirror)
          cold=""
          for row in $rows; do
            url=$(ci_tools_blob_url "$row")
            # One ladder per row, through the helper an install reads the copy with, so this
            # read retries where an install's read of the same blob retries and this step holds
            # no attempts of its own (dispatch://INFRA-1545, R2). It reads the status itself,
            # which is the question here: a 404 is this step's answer about a cold row, not a
            # fetch that failed. 30 s per attempt, the bound
            # .github/scripts/mirror-ci-tools.sh gives this same HEAD, which carries no bytes
            # in either direction.
            status=$(ci_tools_curl_status 30 "$url" -I -H "Authorization: Bearer $token")
            echo "$row: $registry answers $status for $url"
            [ "$status" = 200 ] || cold="$cold $row"
          done
          if [ -n "$cold" ]; then
            echo "::error::the package holds no blob for$cold, so this job would record a pass for a second source that is not there; the ci-images job this one needs fills it with .github/scripts/mirror-ci-tools.sh, where a cold row stays green on purpose" >&2
            exit 1
          fi

      # Each row beside the two call sites that read its digest: the line of the manifest that
      # holds the literal, and what reads that row in an action or in the rig.
      # One literal is what both paths are held to, and this is the evidence of it — there is no
      # second digest in an action to read it out of, which is the point.
      # Its own retry arithmetic is 0 s, and that is read off the step rather than assumed: it
      # downloads nothing. `ci_tools_rows`, `ci_tools_digest` and `ci_tools_field` read
      # .github/ci-tools.yaml off this checkout, and the two greps read this tree, so the step
      # holds no attempt of any ladder and the budget is the next whole minute above zero.
      # The one reading that made it look otherwise was the grep of the rig's path written
      # inside the row loop, which .github/scripts/check-download-retry.sh read as a run of
      # that script once per pass of a loop whose passes it cannot count; the grep is taken out
      # of the loop above, which is also one walk of those trees instead of one per row.
      - name: Print every row beside the two call sites that read its digest
        timeout-minutes: 1
        run: |
          set -euo pipefail
          # shellcheck source=.github/scripts/ci-tools.sh
          . .github/scripts/ci-tools.sh
          rows=$(ci_tools_rows)
          unread=""
          # Every line of an action or of the rig that reads a row, read once for the whole
          # step rather than once per row: the walk of those two trees finds the same lines
          # whichever row is being printed, and each row's own lines are selected out of this
          # text below.
          # The lines that read the row rather than every line that says its name: a
          # ci_tools_* call that names it, and the `row=` an action assigns it to where the
          # call site names the row through a variable (.github/actions/setup-bun does).
          reader_lines=$(grep -rn -E 'ci_tools_|row=' \
            .github/actions .github/scripts/ci-tools-proof.sh || true)
          for row in $rows; do
            digest=$(ci_tools_digest "$row")
            echo "$row: sha256 $digest, of $(ci_tools_field "$row" digest_of)"
            pinned=$(grep -n "digest: $digest" .github/ci-tools.yaml || true)
            readers=$(printf '%s\n' "$reader_lines" | grep -F -- "$row" || true)
            echo "  the manifest's own line:"
            printf '%s\n' "$pinned" | sed 's|^|    .github/ci-tools.yaml:|'
            echo "  what reads that row, in the action or the rig:"
            printf '%s\n' "$readers" | sed 's|^|    |'
            { [ -n "$pinned" ] && [ -n "$readers" ]; } || unread="$unread $row"
          done
          if [ -n "$unread" ]; then
            echo "::error::nothing reads$unread, so that row's digest is pinned and read by no install" >&2
            exit 1
          fi

      - name: Stage the correct bytes of every row a case serves, before the fault
        run: .github/scripts/ci-tools-proof.sh stage

      - id: origin
        name: Start the origin that stands in for all three sources
        run: .github/scripts/ci-tools-proof.sh origin-start

      # Case 5 of 8 of the corrupted payloads, and the one that runs here rather than with the
      # other seven: the jj binary in mise's install directory is one byte changed.
      # That directory is where .github/actions/install-jj reads an installed jj from, so a
      # changed binary there is the primary path's own mismatch: `mise install` finds the tool
      # installed, the action holds the binary mise points at to the jj row, and refuses it.
      # It runs before the fault because `mise install` resolves the tool's version list over
      # api.github.com even when the install directory already holds it, and the fault below
      # holds every host under github.com. Under the fault that resolve fails, the action takes
      # its second source instead, and this case would read the fallback rather than the
      # primary — which is what happened at 1725f7ce before this step moved.
      # Here it needs no release asset either: the rig seeds mise's directory from the payload
      # it staged, so a release-asset outage, which is what this whole job is about, leaves this
      # case exactly as it is. api.github.com is not a release-asset host and does not go down
      # with one.
      - name: Corrupt nothing at the origin for the jj-primary case
        run: .github/scripts/ci-tools-proof.sh corrupt

      - name: Seed mise's install of jj with the staged binary, one byte changed
        run: |
          set -euo pipefail
          proof=.github/scripts/ci-tools-proof.sh
          corrupted="$RUNNER_TEMP/jj-one-byte-changed"
          cp -- "$("$proof" payload-path jj)" "$corrupted"
          "$proof" flip-last-byte "$corrupted"
          "$proof" seed-mise-jj "$corrupted"
          rm -f "$corrupted"

      # install-jj's own retry arithmetic: .github/scripts/ci-tools.sh's curl of the mise
      # archive, 8 x 60 + 127 = 607 s at the `max_time` of 60 the manifest's `mise` row carries,
      # and its `mise install` of the jj release through .github/scripts/ci-retry.sh,
      # 5 x 60 + 150 = 450 s, 1057 s -> 18 min.
      - id: jj-primary
        continue-on-error: true
        timeout-minutes: 18
        uses: ./.github/actions/install-jj
        env:
          CI_TOOLS_GHCR_BASE: ${{ steps.origin.outputs.ghcr }}

      - name: Read the jj-primary case
        run: .github/scripts/ci-tools-proof.sh report jj-primary --outcome ${{ steps.jj-primary.outcome }} --row jj --expect-source github-release

      # What that case seeded goes, so nothing of it reaches the installs below: the head's own
      # install-jj meets an empty mise directory, as a fresh runner would.
      # It is not what decides that install. Measured in CI at run 42507815176, `mise install`
      # resolves the tool's version list over api.github.com even when its install directory
      # already holds the tool, so under the fault below that install fails whether this
      # directory is here or not, and the action reads the copy either way. What a directory
      # left here would leave behind is the one-byte-changed jj this case seeded, on a runner
      # whose later steps run what this job installed.
      - name: Take mise's install away again, so the faulted install must read the copy
        run: rm -rf "$HOME/.local/share/mise"

      # The fault, and the routing of every later step through it, in one step: the rig starts
      # .github/scripts/ci-fault-proxy.py over the release hosts its own FAULT_HOSTS names, and
      # writes the four spellings of the two proxy variables and the two emptied bypass lists
      # to $GITHUB_ENV itself. Those hosts and those variables are written there and in no step
      # of this file, so a release host that moves again is one edit in one place.
      # The runner resolves and downloads an action with its own environment rather than a
      # step's, so every action this job uses is already on disk when the fault starts, and the
      # fault is met only by what an action fetches.
      - name: Start the fault in front of GitHub's release assets
        run: .github/scripts/ci-tools-proof.sh start-fault

      - name: Read the fault before any install meets it
        run: .github/scripts/ci-tools-proof.sh probe github.com

      # The negative control, under the same fault: the merge base's four installs, each given a
      # ghcr base and an npm base on a dead port, so every one of them must fail here.
      # What it asserts is a property of this change and not a fact about history: an install
      # whose primary meets the fault and whose second source cannot be reached fails. That is
      # what makes the passes below a reading of the second source rather than of a cache, of a
      # tool the runner image already carries, or of a proxy that let the asset through.
      # A merge base from before this change reads neither CI_TOOLS_GHCR_BASE nor
      # CI_TOOLS_NPM_BASE, so the release asset this fault holds is its one source, and that is
      # what fails these four on a pull request and a merge group today.
      # A base that reads both — this tree on a workflow_dispatch, and every base once this
      # change is on main — fails for the two dead ports instead, which leave its second source
      # nothing to reach.
      # A control that leaned on the merge base having one source each would expire the day this
      # change lands on main: the base would then be this tree, each primary would meet the
      # fault, each second source would reach the real ghcr — whose blobs redirect to
      # pkg-containers.githubusercontent.com, which this fault leaves alone on purpose — or the
      # real npm, all four would succeed, and this step would fail every pull request and merge
      # group that selects this job. On a workflow_dispatch the ref below falls through to
      # github.sha, the head itself, so that control is wrong already.
      # A dead port rather than a manifest with its `second_source` rows deleted: a row with no
      # second source makes ci_tools__second_source refuse the empty field, so the install would
      # fail for the wrong reason — it would prove the helper rejects an empty field, not that
      # the install had nowhere to go, and a negative control must fail for the reason the check
      # names. A base that does not have the helper ignores both variables and fails as it
      # always did.
      # The merge-base checkout stays. It is this repository's only caller of the rule
      # .github/scripts/check-image-trigger-paths.sh keeps about a local `uses:` under a second
      # checkout of this same repository, and that check's own comment names this job for it.
      # After this change is on main the checkout is redundant to the two variables below, which
      # drive the control by themselves, so a later reader who deletes these four steps is
      # deleting that caller too and should move the rule's exercise rather than lose it.
      - id: base-crane
        continue-on-error: true
        uses: ./base/.github/actions/install-crane
        env:
          CI_TOOLS_GHCR_BASE: http://127.0.0.1:1
          CI_TOOLS_NPM_BASE: http://127.0.0.1:1

      - id: base-changie
        continue-on-error: true
        uses: ./base/.github/actions/install-changie
        env:
          CI_TOOLS_GHCR_BASE: http://127.0.0.1:1
          CI_TOOLS_NPM_BASE: http://127.0.0.1:1

      - id: base-jj
        continue-on-error: true
        uses: ./base/.github/actions/install-jj
        env:
          CI_TOOLS_GHCR_BASE: http://127.0.0.1:1
          CI_TOOLS_NPM_BASE: http://127.0.0.1:1

      - id: base-bun
        continue-on-error: true
        uses: ./base/.github/actions/setup-bun
        env:
          CI_TOOLS_GHCR_BASE: http://127.0.0.1:1
          CI_TOOLS_NPM_BASE: http://127.0.0.1:1

      - name: Check all four installs with nowhere to go failed
        env:
          CRANE: ${{ steps.base-crane.outcome }}
          CHANGIE: ${{ steps.base-changie.outcome }}
          JJ: ${{ steps.base-jj.outcome }}
          BUN: ${{ steps.base-bun.outcome }}
        run: |
          set -euo pipefail
          echo "a merge base from before this change reads neither CI_TOOLS_GHCR_BASE nor CI_TOOLS_NPM_BASE, so the release asset behind this fault is the one source each of its four installs has, and on a pull request and a merge group that is what fails them here"
          echo "a base that reads both — this tree on a workflow_dispatch, and every base once this change is on main — is sent by them to a port nothing listens on, and that is what fails them instead"
          wrong=""
          for pair in "crane:$CRANE" "changie:$CHANGIE" "jj:$JJ" "bun:$BUN"; do
            echo "  the merge base's ${pair%%:*} install ended in ${pair#*:}"
            [ "${pair#*:}" = failure ] || wrong="$wrong ${pair%%:*}"
          done
          if [ -n "$wrong" ]; then
            echo "::error::the merge base's install of$wrong served bytes with its primary behind the fault and its second source pointed at a dead port, so it read something this job did not serve — a cache, a tool the runner image carries, or a request that went around the proxy — and the passes below would then say nothing about the second source" >&2
            exit 1
          fi

      # The head's own four installs, under the same fault and with no continue-on-error: each
      # must succeed, through the second source its row names.
      # install-jj meets an empty mise data directory here, since nothing warmed one before the
      # fault: its `mise install` must reach the release asset mise fetches jj from, which the
      # fault holds, so that install fails and the action reads the copy. This step is therefore
      # the proof of jj's second source itself, rather than a warm directory answering for it.
      - uses: ./.github/actions/install-crane

      - uses: ./.github/actions/install-changie

      # install-jj's own retry arithmetic: .github/scripts/ci-tools.sh's curl of the mise
      # archive, 8 x 60 + 127 = 607 s at the `max_time` of 60 the manifest's `mise` row carries,
      # and its `mise install` of the jj release through .github/scripts/ci-retry.sh,
      # 5 x 60 + 150 = 450 s, 1057 s -> 18 min.
      - uses: ./.github/actions/install-jj
        timeout-minutes: 18

      - uses: ./.github/actions/setup-bun

      - name: Check every tool is the version its row pins
        run: |
          set -euo pipefail
          proof=.github/scripts/ci-tools-proof.sh
          wrong=""
          "$proof" version-answers crane "$(crane version)" || wrong="$wrong crane"
          "$proof" version-answers changie "$(changie --version)" || wrong="$wrong changie"
          "$proof" version-answers jj "$(jj --version)" || wrong="$wrong jj"
          "$proof" version-answers bun-linux-x64 "$(bun --version)" || wrong="$wrong bun-linux-x64"
          # The name that Bun install must have left beside the bun those four lines end with.
          # It is a reading of its own and not a fifth version-answers line because what can be
          # missing here is the name rather than the version: npm serves the binary alone, so a
          # faulted install that left no bunx behind answers every reading above and fails at
          # the first bunx a later job runs. The verb prints which of the three things it reads
          # — the name, the version, the bytes — was wrong, so this keeps its own word and does
          # not join the list below, whose sentence is about versions.
          bunx=read
          "$proof" installed-bunx || bunx=refused
          if [ -n "$wrong" ]; then
            echo "::error::$wrong answered a version its row does not pin, so the source that served it served something else" >&2
          fi
          if [ -n "$wrong" ] || [ "$bunx" = refused ]; then
            exit 1
          fi

      # The eight corrupted payloads, one case at a time: the rig says which rows the origin
      # serves with their last byte changed, the install meets them through the seams the case's
      # own env: names, and the report after it is what passes or fails this job.
      #
      # Case 1 of 8: crane's primary serves one byte changed, and the second source must stay
      # untried — a digest mismatch is a supply-chain signal, never a reason to read elsewhere.
      - name: Corrupt crane for its primary case
        run: .github/scripts/ci-tools-proof.sh corrupt crane

      - id: crane-primary
        continue-on-error: true
        uses: ./.github/actions/install-crane
        env:
          CI_TOOLS_GITHUB_BASE: ${{ steps.origin.outputs.github }}
          CI_TOOLS_GHCR_BASE: ${{ steps.origin.outputs.ghcr }}

      - name: Read the crane-primary case
        run: .github/scripts/ci-tools-proof.sh report crane-primary --outcome ${{ steps.crane-primary.outcome }} --row crane --expect-source github-release --expect-untried ghcr-mirror

      # Case 2 of 8: crane's second source serves one byte changed, after the primary — the real
      # host, which the fault holds — did not serve them at all.
      - name: Corrupt crane for its second-source case
        run: .github/scripts/ci-tools-proof.sh corrupt crane

      - id: crane-second-source
        continue-on-error: true
        uses: ./.github/actions/install-crane
        env:
          CI_TOOLS_GHCR_BASE: ${{ steps.origin.outputs.ghcr }}

      - name: Read the crane-second-source case
        run: .github/scripts/ci-tools-proof.sh report crane-second-source --outcome ${{ steps.crane-second-source.outcome }} --row crane --expect-source ghcr-mirror

      # Case 3 of 8: changie's primary serves one byte changed.
      - name: Corrupt changie for its primary case
        run: .github/scripts/ci-tools-proof.sh corrupt changie

      - id: changie-primary
        continue-on-error: true
        uses: ./.github/actions/install-changie
        env:
          CI_TOOLS_GITHUB_BASE: ${{ steps.origin.outputs.github }}
          CI_TOOLS_GHCR_BASE: ${{ steps.origin.outputs.ghcr }}

      - name: Read the changie-primary case
        run: .github/scripts/ci-tools-proof.sh report changie-primary --outcome ${{ steps.changie-primary.outcome }} --row changie --expect-source github-release --expect-untried ghcr-mirror

      # Case 4 of 8: changie's second source serves one byte changed.
      - name: Corrupt changie for its second-source case
        run: .github/scripts/ci-tools-proof.sh corrupt changie

      - id: changie-second-source
        continue-on-error: true
        uses: ./.github/actions/install-changie
        env:
          CI_TOOLS_GHCR_BASE: ${{ steps.origin.outputs.ghcr }}

      - name: Read the changie-second-source case
        run: .github/scripts/ci-tools-proof.sh report changie-second-source --outcome ${{ steps.changie-second-source.outcome }} --row changie --expect-source ghcr-mirror

      # Case 6 of 8: the copy of the jj binary serves one byte changed, with mise unable to
      # install the tool at all.
      # Its data directory goes, so `mise install` must reach the faulted host and fails, which
      # is what sends the action to the second source. Only jj is corrupted, so the action's own
      # mise fetch still serves from the origin.
      # Case 5, which ran before the fault, left ~/.local/bin/jj as it found it: install-jj
      # verifies the binary where mise put it and copies only after that passes, so a refused
      # jj never reaches that path.
      - name: Corrupt the jj copy for its second-source case
        run: .github/scripts/ci-tools-proof.sh corrupt jj

      - name: Remove mise's data directory, so its install must reach the faulted host
        run: |
          set -euo pipefail
          rm -rf "$HOME/.local/share/mise"
          echo "$HOME/.local/share/mise is gone, so mise must install jj rather than find it installed"

      # install-jj's own retry arithmetic: .github/scripts/ci-tools.sh's curl of the mise
      # archive, 8 x 60 + 127 = 607 s at the `max_time` of 60 the manifest's `mise` row carries,
      # and its `mise install` of the jj release through .github/scripts/ci-retry.sh,
      # 5 x 60 + 150 = 450 s, 1057 s -> 18 min.
      - id: jj-second-source
        continue-on-error: true
        timeout-minutes: 18
        uses: ./.github/actions/install-jj
        env:
          CI_TOOLS_GHCR_BASE: ${{ steps.origin.outputs.ghcr }}

      - name: Read the jj-second-source case
        run: .github/scripts/ci-tools-proof.sh report jj-second-source --outcome ${{ steps.jj-second-source.outcome }} --row jj --expect-source ghcr-mirror

      # Case 7 of 8: the installed Bun is one byte changed and still answers the pinned revision,
      # so setup-bun's bun-second-source step takes the branch that installs nothing — a Bun of
      # the pinned version is already at ~/.bun/bin/bun, and the bun-already-here step found it
      # there with no cache hit to subtract, so the word this one writes for it is
      # `existing-install` — and the last step refuses those bytes.
      # Measured on 2026-11-08: the 107308936-byte binary of the bun-linux-x64 row answers
      # `--revision 1.4.4+38afee6c8` with its final byte changed, as it does whole, so the
      # branch this case needs is the branch it takes. The step below reads that answer again
      # and refuses the case rather than proving another one, should a later Bun read its own
      # last byte.
      - name: Corrupt nothing at the origin for the bun-primary case
        run: .github/scripts/ci-tools-proof.sh corrupt

      - name: Change the last byte of the installed Bun
        run: |
          set -euo pipefail
          .github/scripts/ci-tools-proof.sh flip-last-byte "$HOME/.bun/bin/bun"
          revision=$("$HOME/.bun/bin/bun" --revision)
          pinned=$(tr -d '[:space:]' < .bun-version)
          echo "the changed binary answers --revision $revision, and .bun-version pins $pinned"
          if [ "${revision%%+*}" != "$pinned" ]; then
            echo "::error::the changed Bun no longer answers the pinned version, so setup-bun would take its npm branch and this case would read something else" >&2
            exit 1
          fi

      - id: bun-primary
        continue-on-error: true
        uses: ./.github/actions/setup-bun

      - name: Read the bun-primary case
        run: .github/scripts/ci-tools-proof.sh report bun-primary --outcome ${{ steps.bun-primary.outcome }} --row bun-linux-x64 --expect-source github-release

      # Case 8 of 8: with no Bun of the pinned version on this runner, setup-bun's
      # bun-second-source step must read the second source, and the npm package serves one byte
      # changed.
      # This case takes the pair away itself rather than leaning on the case before it. That
      # case's refusal does remove the bun and the bunx it refused from ~/.bun/bin — setup-bun's
      # last step says so — but a case that must read the second source is held to its own
      # state and not to the one the case before it happened to leave.
      - name: Take any Bun away, so the second source must serve this case
        run: rm -f "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"

      - name: Corrupt the Bun package for its second-source case
        run: .github/scripts/ci-tools-proof.sh corrupt bun-linux-x64

      - id: bun-second-source
        continue-on-error: true
        uses: ./.github/actions/setup-bun
        env:
          CI_TOOLS_NPM_BASE: ${{ steps.origin.outputs.npm }}

      - name: Read the bun-second-source case
        run: .github/scripts/ci-tools-proof.sh report bun-second-source --outcome ${{ steps.bun-second-source.outcome }} --row bun-linux-x64 --expect-source npm

      # What this runner holds after the eight refusals, said plainly: no corrupted byte was
      # installed, and what the installs themselves left is what this step reads.
      # .github/scripts/ci-tools.sh verifies the bytes before it puts them at their destination,
      # so every refused fetch above left nothing behind, and the two installs that meet a
      # binary a third party put there refuse it without leaving it either. install-jj verifies
      # the binary where mise left it and copies to ~/.local/bin/jj only after that passes, so
      # the jj here is the pinned one the head's own install under the fault wrote and neither
      # jj case moved it. setup-bun removes the bun and the bunx it refused from ~/.bun/bin,
      # which is on this job's PATH, so the bun-primary case took away the Bun it refused; the
      # case after it took that pair away again before its own install and then refused the npm
      # bytes before anything was written in their place: this runner ends with no bun at all.
      # crane and changie are held to the version they answer, because their rows pin the release
      # tarball rather than the binary inside it; jj is held to its row's own digest, which is of
      # the installed binary.
      - name: Print what every tool answers now
        run: |
          set -euo pipefail
          # shellcheck source=.github/scripts/ci-tools.sh
          . .github/scripts/ci-tools.sh
          proof=.github/scripts/ci-tools-proof.sh
          wrong=""
          "$proof" version-answers crane "$(crane version)" || wrong="$wrong crane"
          "$proof" version-answers changie "$(changie --version)" || wrong="$wrong changie"
          "$proof" version-answers jj "$(jj --version)" || wrong="$wrong jj"
          ci_tools_verify jj "$HOME/.local/bin/jj" "the tool this job leaves on the runner" || wrong="$wrong jj"
          for taken in "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"; do
            if [ -e "$taken" ]; then
              echo "::error::$taken is still here, and no case of this job may leave one: the bun-primary case's refusal takes the binary it refused away, and the bun-second-source case's refusal writes none in its place, so a bun here is a refused binary on the PATH of every later step" >&2
              wrong="$wrong $taken"
            else
              echo "$taken is gone: the bun-primary case's refusal took it away, the case after it took the pair away again before its own install, and that case refused the corrupted package before it wrote anything there"
            fi
          done
          if [ -n "$wrong" ]; then
            echo "::error::$wrong is not what this job must leave on this runner, so one of the eight refusals did not hold; the lines above say which reading was wrong" >&2
            exit 1
          fi
          echo "every tool on this runner is its row's pinned bytes and the refused bun is gone: not one of the eight corrupted payloads was installed"

      # The proxy stops with this job, and the steps after this one must not be routed through
      # it: the ci-ok-report step below runs actions/upload-artifact, which would otherwise
      # upload through a proxy that is about to go. The rig writes the emptied variables, as it
      # wrote the proxy ones.
      - name: Stop routing this job through the fault
        if: always()
        run: .github/scripts/ci-tools-proof.sh stop-fault

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its own retry arithmetic: ci-ok-report.sh's `gh api` read and post-check-run.sh's POST
        # of the check run, 2 x (5 x 30 + 150) = 600 s. 720 s and not rule 8's minimum of 660 s:
        # this step posts the required ci-ok check, and a budget that cuts it between those two
        # ladders loses the check run rather than reporting a failure (the header's Budgets note).
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The same two halves of the Bun install, proved again on an arm64 runner.
  # .github/actions/setup-bun's bun-second-source step selects a row from `uname -m` —
  # `bun-linux-aarch64`
  # here — and reads .github/ci-tools.yaml through .github/scripts/ci-tools.sh, which needs
  # python3 with PyYAML. No other step of this repository that runs on ubuntu-24.04-arm imports
  # yaml, so nothing says that runner image carries it until the arm64 leg of
  # .github/workflows/release-envoy-listener.yaml runs, which happens on a push to main and so
  # only after a merge. This job says it on the pull request instead, and a release that would
  # have failed on the first push fails here.
  # It proves both halves: the healthy path, where the release asset serves Bun and the action's
  # fourth step holds it to the aarch64 row, and the npm path, under the fault the tool-fallback
  # job uses, where the release hosts answer nothing and the second source serves the same
  # binary. Each half ends in a reading of what this runner holds, printed for a person reading
  # the run: the machine, the version, the path, the row's own pins, and what ci_tools_verify
  # reads that binary as against the row.
  # The npm half says which source served it as well, because neither the version nor the
  # digest can: the release asset and the npm package are one binary by design, so a run where
  # the release host answered after all would read exactly as a run where npm served. What says
  # it is the fault proxy's own 504 for github.com after the probe, the refusal that sent the
  # install to its second source. The `ci-tools:` line the install wrote would say it too, and
  # no step can read it: a composite action writes that line to the job's log, which no later
  # step reads.
  # The tool-fallback job's comment about the Actions cache holds here too: the wrapper passes
  # no-cache for every job whose id starts with `tool-fallback`, so no call of it in this job
  # can be served by the cache either, on any event and any ref.
  # The npm half takes ~/.bun/bin away before its install all the same, so no Bun the healthy
  # half left behind satisfies it.
  # The `tool_fallback` filter selects this job, as it selects that one: both drive the same
  # action over the same manifest through the same helper, so one filter decides both and
  # neither can drift from the other. CI_OK_SELECTED_BY maps this job to that filter, and
  # .github/scripts/ci_job_reads.py holds a gate of its own on it for what this job reads.
  # It needs the `changes` job alone: nothing it runs reads the ghcr copy the ci-images job
  # fills, so it has no reason to wait for that job as tool-fallback does.
  tool-fallback-arm:
    needs: changes
    if: needs.changes.outputs.tool_fallback == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04-arm
    # The budget, added up from the slowest run this job can have rather than copied from
    # another job: the checkout and the runner's download of the actions (1), the healthy
    # install of the 34 MB release zip (2), the fault and its probe, whose two requests are
    # bounded at 15 s each (1), the faulted install — oven-sh/setup-bun's own download against a
    # proxy that refuses it at once, then one ladder of .github/scripts/ci-tools.sh, which
    # `--retry-max-time 120` bounds at two minutes of new attempts plus one last attempt of the
    # row's `max_time` 60 s, so three minutes at worst (5) — the 107 MB npm tarball, its gunzip
    # and the write (3), the two readings, each a sha256 of that binary (2), and the report step
    # (1). That is 15, and a job its own limit cuts off reports `cancelled`, which ci-ok fails,
    # so the limit is the next minute up.
    timeout-minutes: 16
    # contents: read is the checkout's; actions: read and checks: write are the ci-ok-report
    # step's. Both sources serve this job's bytes without a credential, so it needs no other
    # scope.
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The healthy path, with nothing faulted: the release asset serves Bun, and the action's
      # fourth step holds what it installed to the row its third step read out of `uname -m`.
      - uses: ./.github/actions/setup-bun

      - name: Read the Bun the release asset served
        run: .github/scripts/ci-tools-proof.sh installed-bun bun-linux-aarch64

      # The fault and the routing of every later step through it, as in the tool-fallback job:
      # the rig starts the proxy over the release hosts its own FAULT_HOSTS names and writes the
      # four spellings of the two proxy variables and the two emptied bypass lists to
      # $GITHUB_ENV, so neither the hosts nor the variables are written in this file.
      - name: Start the fault in front of GitHub's release assets
        run: .github/scripts/ci-tools-proof.sh start-fault

      - name: Read the fault before any install meets it
        run: .github/scripts/ci-tools-proof.sh probe github.com

      # Both names, because the action's refusal takes both: what must be read again is an
      # install, and not the bun the healthy half left behind.
      - name: Take the installed Bun away, so the second source must serve it
        run: rm -f "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"

      # The npm path on arm64: the release asset answers nothing behind the fault, so the
      # action's third step reads the @oven/bun-linux-aarch64 package the row names.
      - uses: ./.github/actions/setup-bun

      # --expect-refused is this half's own reading of the source: the proxy's 504 for
      # github.com after the probe is the refusal that sent this install to npm, and the
      # version and the digest cannot say it, since both sources serve one binary.
      - name: Read the Bun npm served
        run: .github/scripts/ci-tools-proof.sh installed-bun bun-linux-aarch64 --expect-refused github.com

      # The proxy stops with this job, and the steps after this one must not be routed through
      # it: the ci-ok-report step below runs actions/upload-artifact, which would otherwise
      # upload through a proxy that is about to go. The rig writes the emptied variables, as it
      # wrote the proxy ones.
      - name: Stop routing this job through the fault
        if: always()
        run: .github/scripts/ci-tools-proof.sh stop-fault

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its own retry arithmetic: ci-ok-report.sh's `gh api` read and post-check-run.sh's POST
        # of the check run, 2 x (5 x 30 + 150) = 600 s. 720 s and not rule 8's minimum of 660 s:
        # this step posts the required ci-ok check, and a budget that cuts it between those two
        # ladders loses the check run rather than reporting a failure (the header's Budgets note).
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # lint, typecheck and test are jobs ci-ok condenses; main's ruleset requires none of their
  # names. Each covers the shipped daemon (packages/daemon, the Go `legion`). Fail-open: when
  # `changes` did not succeed, typecheck and test run rather than skip. ci-ok fails then anyway
  # (ci-ok.sh), so this buys signal: their results while `changes` is broken. A re-run of only the
  # failed jobs can leave the jobs `changes` then selects skipped, and ci-ok fails a selected job
  # that skipped rather than passing with nothing tested: re-run every job instead.
  typecheck:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.typecheck == 'true') }}
    runs-on: ubuntu-24.04
    # Budget (the header's Budgets note): 600 s, the 10 minutes this job carried, above its 83 s
    # measured maximum, plus its slowest retried step alone — packages/daemon's
    # `go mod download`, 5 x 180 + 150 = 1050 s, above the ci-ok report's 600 s.
    # 600 + 1050 = 1650 s -> 28 min.
    timeout-minutes: 28

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      # go-daemon, shared with test and pi-legion.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-daemon-{0}-', runner.os) }}

      # The module the vet below compiles, downloaded once and retried before it (the header's
      # Retries note; the retried unit is the download, never the vet). 180 s per attempt: the
      # slowest cold `go mod download` measured is 113 s, for packages/envoy/infra, against 81 s
      # for packages/daemon, each on an empty module cache on 2026-11-07, so the bound is
      # 1.6 times the slowest of them; an attempt it kills leaves what it fetched in the module
      # cache for the next one to resume from, which a tarball fetch cannot do. The restore
      # above makes the common run cost nothing.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/daemon's Go modules" 180 -- go -C packages/daemon mod download

      # With the e2e tag, vet also compiles the live proofs behind it (the Stage 4a harness,
      # sandbox/live*_test.go), which run on the devbox against a real cluster.
      - name: Vet the Go daemon, its e2e-tagged live proofs included
        run: go vet -tags e2e ./...
        working-directory: packages/daemon

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its own retry arithmetic: ci-ok-report.sh's `gh api` read and post-check-run.sh's POST
        # of the check run, 2 x (5 x 30 + 150) = 600 s. 720 s and not rule 8's minimum of 660 s:
        # this step posts the required ci-ok check, and a budget that cuts it between those two
        # ladders loses the check run rather than reporting a failure (the header's Budgets note).
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}


  test:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name != 'merge_group' || github.run_attempt == '1') && (needs.changes.result != 'success' || needs.changes.outputs.test == 'true') }}
    runs-on: ubuntu-24.04
    # Each go test step's -timeout must fire before the runner cancels the job, so a hung test
    # prints the goroutine dump that names it. A step's worst case is therefore its largest
    # measured green duration plus its own -timeout, not its compile plus its -timeout: 325 s of
    # setup before the plain step starts, then that step's 839 s (measured while it still ran
    # internal/daemon, so an upper bound for it now) and its 15 minutes, then the race step's
    # 694 s and its 30, then 13 s for the steps after it, which was 4571 s (dispatch://INFRA-1052
    # measured them over the 30 newest counted test jobs of main push runs; the cache save's 7 s
    # left that list when this workflow stopped saving an entry).
    # dispatch://INFRA-1545 added two steps to the end of the list
    # whose cost is not in that 13 s, because each waits out a time bound rather than computing:
    # the retry helper's test, 362 s measured, which spends 310 s of that waiting out the two
    # things it proves — the 120 s floor, and five failed attempts whose output the helper
    # withholds — and the fault proxy's test, 10 s measured. That is 4943 s, above both the
    # 4800 s of the 80 minutes this job carried before this branch and the job's 1924 s measured
    # maximum, so 4943 s is the unretried term of the budget below.
    #
    # The retried step this job's budget adds is its slowest alone (the header's Budgets note):
    # the tmux step's two calls, 625 + 775 = 1400 s. The Go workspace's `go mod download` led
    # that list until its bound came down to 180 s; at 5 x 180 + 150 = 1050 s it no longer does,
    # so the tmux step is this job's slowest retried step now. install-jj's two calls come to
    # 1057 s, the workspace install to 1050 s, each of install-changie's and install-uv's curls
    # to 607 s, install-omp's `mise install` to 450 s and the ci-ok report to 600 s, and none of
    # those is larger. So 4943 + 1400 = 6343 s -> 106 min.
    timeout-minutes: 106
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # One service for all three: the Go daemon's unit tests' Postgres, the broker rig its
      # agentsecrets contract tests drive (brokertest.NewRig skips without
      # BROKER_TEST_DATABASE_URL), and the Stage 1 script's. Setting LEGION_E2E_PG_DSN is what tells
      # the script not to start a container of its own — that path is the devbox's.
      LEGION_TEST_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      LEGION_E2E_PG_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image (testcontainers/ryuk, on Docker Hub) would be one more registry
      # pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # The fuzz and property counts follow the lane. A pull-request run takes the reduced counts
      # below; every other lane — a merge group, a dispatched run — takes the empty string, which
      # every reader treats as unset (classify's run_fuzz_test.go and sender_fuzz_test.go, the
      # daemon's keptPropertyEnv), so the full counts live in the Go source alone and the queue
      # still runs them. sender_fuzz_test.go's own count is 2,000 histories of each order already,
      # so the pull-request value leaves it as it is. The number of seeds falls rather than each
      # seed's depth: a seed that stops early stops reaching the states the property is about.
      LEGION_RUN_FUZZ_ITERS: ${{ github.event_name == 'pull_request' && '2000' || '' }}
      LEGION_KEPT_PROPERTY_RUNS: ${{ github.event_name == 'pull_request' && '8' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Retried like every install in this workflow (the header's Retries note); 180 s per
      # attempt, the bound every Bun install of this repository's CI carries
      # (dispatch://INFRA-1545): this install measured 20.70 s cold on a pod, against at most
      # 11 s over 180 observations in CI.
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile

      # The very command release.yaml's claude_envoy_build runs, so a pull request whose source
      # that job would refuse fails this job, and with it the required ci-ok, instead of merging
      # and then failing every release. What it builds and checks:
      # packages/claude-envoy/scripts/verify-build.sh.
      - name: Build, check and pack the Claude Code plugin as the release does
        run: bun run verify-build "$RUNNER_TEMP/claude-envoy-built.tar"
        working-directory: packages/claude-envoy

      # release.yaml's $CLAUDE_ENVOY_VERSION_ARGS covers scripts/build-inputs.txt, so a build input
      # missing from it is one no release bumps a version for.
      - name: Check the Claude Code plugin's build input list covers what the build reads
        run: bun test tests/build-inputs.test.ts
        working-directory: packages/claude-envoy

      # release-push.test.sh renders its fold-notes cases with the real changie, and the step
      # below renders this checkout's own fragments with it; where changie is absent, as on a
      # developer's machine, those cases print a SKIP line and count nothing.
      # install-changie's own retry arithmetic: its curl of the release tarball,
      # 8 x 60 + 127 = 607 s -> 11 min.
      - uses: ./.github/actions/install-changie
        timeout-minutes: 11

      # Nothing renders a changelog fragment between the merge and the release that first ships
      # it, so a fragment changie refuses would fail that release's build job, and every run
      # after it, until a fix merges. This renders every fragment of every listed package here
      # instead, inside a required check. It runs in this job rather than beside fold-orphans in
      # lint because this is the job that installs changie.
      - name: Check every changelog fragment renders
        run: |
          # shellcheck disable=SC2046 # the file is the package list, split on purpose
          .github/scripts/release-push.sh fold-check $(<.github/changelog-packages)

      - name: Test release scripts
        run: .github/scripts/release-push.test.sh

      - name: Test the release version bump
        run: .github/scripts/release-bump.test.sh

      - name: Test third-party notices
        run: bun test scripts/third-party-notices.test.ts

      # The checker's own unit tests only. scripts/semantic-line-breaks.guides.test.ts checks the
      # guides' layout and runs on demand, deliberately not here: no CI gate over the guides.
      - name: Test the semantic line-break checker
        run: bun test scripts/semantic-line-breaks.test.ts

      - name: Test the Bun pin check
        run: .github/scripts/check-bun-version.test.sh

      - name: Test the frozen Bun workspace manifest check
        run: .github/scripts/check-bun-workspace-manifests.test.sh

      - name: Test the zod version check
        run: .github/scripts/check-zod-version.test.sh

      - name: Test the daemon API contract number check
        run: .github/scripts/check-daemon-api-contract.test.sh

      - name: Test the gh version check
        run: .github/scripts/check-gh-version.test.sh

      - name: Test the workflow path model the path checks import
        run: .github/scripts/workflow_paths.test.sh

      - name: Test the image trigger path check
        run: .github/scripts/check-image-trigger-paths.test.sh

      - name: Test the CI image check
        run: .github/scripts/check-ci-images.test.sh

      - name: Test the CI image mirror
        run: .github/scripts/mirror-ci-images.test.sh

      # The three tool scripts, in the order they depend on each other: the fetch helper every
      # install goes through, the filler that puts the bytes in the copy that helper reads, and
      # the gate that holds every row to its pin.
      - name: Test the tool fetch helper
        run: .github/scripts/ci-tools.test.sh

      - name: Test the tool copy filler
        run: .github/scripts/mirror-ci-tools.test.sh

      - name: Test the tool manifest check
        run: .github/scripts/check-ci-tools.test.sh

      - name: Test the action pin check
        run: .github/scripts/check-action-pins.test.sh

      - name: Test the download retry check
        run: .github/scripts/check-download-retry.test.sh

      - name: Test the private-name check
        run: .github/scripts/check-private-names.test.sh

      - name: Test the plugin-name check
        run: .github/scripts/check-plugin-names.test.sh

      - name: Test the fireEvent reason check
        run: .github/scripts/check-fireevent-reasons.test.sh

      - name: Test the release credential check
        run: .github/scripts/check-release-credentials.test.sh

      - name: Test the repository path derivation
        run: .github/scripts/repo-paths.test.sh

      - name: Test the Playwright dependency list check
        run: .github/scripts/playwright-deps-current.test.sh

      # The proof selector e2e.yaml's select job runs, over fixture trees and over this
      # repository's own .github/e2e-scripts.json and scripts/e2e/.
      - name: Test the e2e proof selector
        run: .github/scripts/select-e2e-proofs.test.sh

      # The lister the build-tag steps take their `-run` from, over fixture packages and over
      # this repository's own tagged test files.
      - name: Test the build-tag test lister
        run: .github/scripts/go-tagged-tests.test.sh

      - name: Test ci-ok's verdict
        run: .github/scripts/ci-ok.test.sh

      - name: Test ci-ok's report and the check-run post (a stand-in gh)
        run: .github/scripts/ci-ok-report.test.sh

      - name: Test the reconciliation of this head's other ci-ok check runs (a stand-in gh)
        run: .github/scripts/ci-ok-reconcile.test.sh

      - name: Test the pull request payload both pr-title checks read (a stand-in gh)
        run: .github/scripts/find-pr-payload.test.sh

      - name: Test the merge-group cancel decision
        run: .github/scripts/merge-group-cancels.test.sh

      - name: Test the main bypass check's decision
        run: .github/scripts/main-bypass-check.test.sh

      # The attempt selection dispatch-browser.yaml's merge job runs over the legs' blob
      # artifacts. A run holds every attempt's artifacts, so the newest of each leg has to be
      # chosen or a re-run is judged on the attempt it replaced; these are the assertions that
      # hold that, and they belong here beside ci-ok's, which choose an attempt the same way.
      - name: Test the browser lane's blob attempt selection
        run: .github/scripts/dispatch-browser-latest-blobs.test.sh

      # The merge job's two reads of its own run, driven under a stand-in gh: the attempt route
      # the jobs read takes, the retry ladder's attempts and the waits between them, and the two
      # refusal messages are checked here rather than on a runner against GitHub.
      - name: Test the browser lane's run reads
        run: .github/scripts/dispatch-browser-run-reads.test.sh

      # The memory and CPU sampler dispatch-browser.yaml's two browser steps run, over fixture
      # sample files: its two readings are pure functions of those files, so the numbers and the
      # notice titles are held here, where no browser and no runner are needed.
      - name: Test the browser lane's memory and CPU sampler
        run: .github/scripts/dispatch-browser-samples.test.sh

      # The apt archive cache key dispatch-browser.yaml's two browser jobs restore under and
      # ci-caches.yaml's apt-debs job fills under, over fixture checkouts: a key that changes
      # misses every entry saved under the old one, so the whole string and the refusals that
      # keep it from naming nothing are held here.
      - name: Test the apt archive cache key
        run: .github/scripts/apt-archive-cache-key.test.sh

      - name: Test the race memory sampler
        run: .github/scripts/race_memory.test.sh

      - name: Test the disk watch
        run: .github/scripts/disk_watch.test.sh

      # The retry every download in CI is routed through, and the proxy that injects the
      # download fault it answers. The retry test measures the floor the rule sets rather
      # than reading it off the source — five attempts against a host that sends nothing, the
      # fifth starting at least 120 s after the first — and five more against a command that
      # writes an error body and fails, which is how it sees that none of those bytes reach
      # the caller. It costs about 360 s of this job's budget, almost all of it in those two
      # cases.
      - name: Test the download retry helper
        run: .github/scripts/ci-retry.test.sh

      - name: Test the CI fault proxy
        run: .github/scripts/ci-fault-proxy.test.sh

      - name: Test the session import pods script (a stand-in kubectl)
        run: bash scripts/sessions-import-pods.test.sh

      - name: Lint the Dispatch census script
        run: bunx biome check --error-on-warnings scripts/dispatch

      # scripts/dispatch is no workspace; the root package pins its TypeScript and Bun types.
      - name: Typecheck the Dispatch census script
        run: bunx tsc --noEmit -p scripts/dispatch

      - name: Test the Dispatch census script
        run: bun test scripts/dispatch

      - name: Lint the GitHub App registration script
        run: bunx biome check --error-on-warnings scripts/github-apps

      # scripts/github-apps is no workspace either; the root package pins its TypeScript and Bun types.
      - name: Typecheck the GitHub App registration script
        run: bunx tsc --noEmit -p scripts/github-apps

      - name: Lint the session message-wait script
        run: bunx biome check --error-on-warnings scripts/sessions

      # scripts/sessions is no workspace either; the root package pins its TypeScript and Bun types.
      - name: Typecheck the session message-wait script
        run: bunx tsc --noEmit -p scripts/sessions

      - name: Test the session message-wait script
        run: bun test scripts/sessions

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/daemon/go.mod
          cache: false

      # go-daemon, shared with typecheck and pi-legion.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-daemon-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-daemon-{0}-', runner.os) }}
      # The modules this job's Go steps build, downloaded once and retried before the first of
      # them (the header's Retries note; the retried unit is the download, never the build and
      # never the test). One call: the root go.work binds packages/daemon and packages/envoy,
      # and a download in either reads both modules' requirements, so this call also fetches what
      # scripts/e2e/lib/held-port.test.ts builds packages/envoy's listener from (measured: the
      # second call takes a second).
      #
      # 180 s per attempt: the slowest cold `go mod download` measured is 113 s, for
      # packages/envoy/infra, against 81 s for packages/daemon, each on an empty module cache on
      # 2026-11-07, so the bound is 1.6 times the slowest of them; an attempt it kills leaves
      # what it fetched in the module cache for the next one to resume from, which a tarball
      # fetch cannot do. The restore above makes the common run cost nothing.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic, so an exhausted download fails this step by name rather than
        # being cut part way by the job: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the Go workspace's modules" 180 -- go -C packages/daemon mod download

      # After setup-go: held-port.test.ts builds the real envoy-listener and hands it a held socket.
      - name: Test the live proofs' libraries (the GitHub ingress bridge, the proof human's check, the model gateway key command, the design-gate verdict, the held-port helper)
        run: bun test scripts/e2e/lib

      # After setup-go: its fixtures run go list over a scratch module.
      - name: Test the CI filter check
        run: .github/scripts/check-ci-filters.test.sh

      # Beside the check above, and needing no Go and no Bun of its own: its fixtures list each
      # program with a stand-in bunx.
      - name: Test the TypeScript filter check
        run: .github/scripts/check-ts-filters.test.sh

      # The tmux runtime's tests drive a real tmux server and skip without one, and the daemon
      # supervises under tmux and refuses to start without it.
      # Both apt phases retry through .github/scripts/ci-retry.sh, in e2e.yaml's spelling for the
      # same runner image and the same indexes: five attempts, the last starting 150 s after the
      # first. What bounds an attempt is the inner `sudo timeout`, not `timeout sudo`, so the
      # signal reaches apt-get itself rather than a sudo holding it; retry_fetch's own bound sits
      # five seconds above it and backstops the sudo alone. 90 s for the index read, which is the
      # bound .github/scripts/playwright-install.sh derives for these indexes — that apt phase
      # was a step of this file until cybermonklabs/legion#2891 wrote it as that script — and
      # 120 s for one package of a few megabytes. The unpack after the download takes no network
      # and stays bare, so an attempt the bound kills never stops a dpkg run part way. The index
      # read carries `-o APT::Update::Error-Mode=any`, which makes a failed index read fail the
      # command instead of warning and exiting 0: without it retry_fetch has nothing to retry.
      # .github/scripts/check-download-retry.sh's rule 5 is the whole reason.
      - name: Install tmux
        # Its own retry arithmetic, so an exhausted phase fails this step by name rather than
        # being cut part way by the job: the index read's 5 x 95 + 150 = 625 s and the package
        # download's 5 x 125 + 150 = 775 s, 1400 s -> 24 min.
        timeout-minutes: 24
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "apt's package lists" 95 -- \
            sudo timeout 90 apt-get update -o APT::Update::Error-Mode=any
          retry_fetch "tmux" 125 -- \
            sudo timeout 120 apt-get install -y --no-install-recommends -d tmux
          sudo apt-get install -y --no-install-recommends tmux

      # The workspace and boundary tests drive a real jj, the one the worker image ships (its
      # working-copy filters are among what they plant), and the daemon resolves jj at boot and
      # refuses to start without it.
      # install-jj's own retry arithmetic: the mise archive's curl, 8 x 60 + 127 = 607 s, and
      # its `mise install` of the jj release, 5 x 60 + 150 = 450 s, 1057 s -> 18 min.
      - uses: ./.github/actions/install-jj
        timeout-minutes: 18

      # internal/podsafety's baseline test and the pod agent's argv test run the Oh My Pi the worker
      # image ships, and refuse on GitHub Actions without one. The pin is read from
      # .omp-pin, the repository's one copy of it, installed through the mise above
      # (.github/actions/install-omp).
      # install-omp's own retry arithmetic: its `mise install`, 5 x 60 + 150 = 450 s -> 8 min.
      - uses: ./.github/actions/install-omp
        timeout-minutes: 8

      # internal/runtime/sandbox's uv link-mode test installs a wheel with the uv the worker image
      # ships (ARG UV_VERSION, checked against ARG UV_SHA256), and refuses on GitHub Actions
      # without one (.github/actions/install-uv).
      # install-uv's own retry arithmetic: its curl of the release tarball,
      # 8 x 60 + 127 = 607 s -> 11 min.
      - uses: ./.github/actions/install-uv
        timeout-minutes: 11

      # The daemon's NATS tests start testnats.Image and, for its grant test, Envoy's HubImage
      # (packages/envoy/testnatsimages), pulled first for the reason the action gives.
      - name: Pull the NATS test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/daemon/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage

      # internal/launcher's role-namespace tests start each role generation in unprivileged user,
      # mount, PID and IPC namespaces, as an issue pod's launcher does, and t.Fatal rather than
      # skip under GITHUB_ACTIONS. Ubuntu 24.04 restricts unprivileged user namespaces with an
      # AppArmor sysctl, so the job turns it off on its throwaway runner (`|| true`: a runner
      # image without the key restricts nothing), and the unshare after it is the verdict that
      # the restriction is gone.
      - name: Allow unprivileged user namespaces (the launcher's role-namespace tests)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --map-root-user true

      # The step runs every package of the module except the three the race step below tests, so
      # each of those runs once per job, under the detector. `set -o pipefail` is what makes a
      # failed go list, or a pattern that matches every package, fail the step rather than pass it
      # with nothing tested.
      - name: Test the Go daemon
        run: |
          set -o pipefail
          go list ./... | grep -Ev '/(internal/daemon|internal/sessionproxy|internal/launcher)$' | xargs go test -count=1 -timeout 15m
        working-directory: packages/daemon

      # The outbox's lane registry, lease renewal and held clock are the daemon's first goroutines
      # that share state with the intake's commit hooks and the API, so the packages the lanes
      # live in run under the race detector once per job, the plain step above leaving them out;
      # so do the session proxy and the launcher that wires it, whose accept loop, copy pairs,
      # pair tracking and bounded drain share state across goroutines. internal/record is not
      # here: the lanes' store is the package's subject, but its product code starts no goroutine
      # and uses no sync, so the detector had only the package's own test goroutines to watch,
      # and that cover is what leaving it out gives up. It runs in the plain step instead. The
      # detector needs cgo, which the runners have gcc for. The lane tests hold a fake clock, so
      # they are deterministic under it.
      #
      # The step carries a package deadline of its own, as the envoy race lanes do: under go
      # test's ten-minute default, internal/daemon, by far the slowest of the three packages, took
      # up to 570 s on the green runs of 2026-11-02 and 2026-11-03 and ran the ten minutes out on
      # main at job 125691048644 (run 41562777668). No single test dominates it: a local run timed
      # 648 tests one after another, the slowest at 44 s. The 30 minutes leave it three times its
      # slowest run.
      - name: Test the concurrent packages under the race detector
        run: go test -count=1 -race -timeout 30m ./internal/daemon/ ./internal/sessionproxy/ ./internal/launcher/
        working-directory: packages/daemon

      - name: Stage 1 live proof
        run: bash scripts/e2e/stage1-skeleton.sh

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its own retry arithmetic: ci-ok-report.sh's `gh api` read and post-check-run.sh's POST
        # of the check run, 2 x (5 x 30 + 150) = 600 s. 720 s and not rule 8's minimum of 660 s:
        # this step posts the required ci-ok check, and a budget that cuts it between those two
        # ladders loses the check run rather than reporting a failure (the header's Budgets note).
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # Builds the documentation site (docs/site) on every pull request and merge group that could
  # change it. No run of this workflow is a push to main: docs-pages.yaml builds and publishes
  # main's site to GitHub Pages, at the address .github/scripts/repo-paths.sh derives from the
  # repository it runs in (https://cybermonklabs.github.io/legion/ today), one push at a time in push
  # order. Both callers run the steps of docs-site.yaml, which holds them once. The site's
  # reference pages are generated from packages/ and skills/ at build time,
  # scripts/third-party-notices.ts writes the THIRD_PARTY_NOTICES.txt it publishes, and the built
  # site is checked with the private-name guard; the docs filter names all of them, docs-site.yaml
  # among them.
  #
  # No timeout-minutes: GitHub's keywords for a job that calls a reusable workflow leave it out.
  # docs-site.yaml's own job carries the limit.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    uses: ./.github/workflows/docs-site.yaml
    with:
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Budget (the header's Budgets note): 600 s, the 10 minutes this job carried, above its 37 s
    # measured maximum, plus its slowest retried step alone — the workspace install,
    # 5 x 180 + 150 = 1050 s, above the ci-ok report's 600 s. 600 + 1050 = 1650 s -> 28 min.
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # Retried like every install in this workflow (the header's Retries note); 180 s per
      # attempt, the bound every Bun install of this repository's CI carries: 20.70 s cold on a
      # pod, against at most 11 s over 180 observations in CI.
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - name: Lint contracts
        run: bun run lint
        working-directory: packages/contracts
      - name: Typecheck contracts
        run: bun run typecheck
        working-directory: packages/contracts
      - name: Test contracts
        run: bun run test
        working-directory: packages/contracts
      - name: Check the Dispatch API types are generated from the OpenAPI document
        run: bun run check:api
        working-directory: packages/contracts
      - name: Build contracts
        run: bun run build
        working-directory: packages/contracts

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its own retry arithmetic: ci-ok-report.sh's `gh api` read and post-check-run.sh's POST
        # of the check run, 2 x (5 x 30 + 150) = 600 s. 720 s and not rule 8's minimum of 660 s:
        # this step posts the required ci-ok check, and a budget that cuts it between those two
        # ladders loses the check run rather than reporting a failure (the header's Budgets note).
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The shared test fixtures package has no build: nothing imports it at run time, and its
  # consumers read its sources through the workspace.
  test-fixtures:
    needs: changes
    if: needs.changes.outputs.test_fixtures == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Budget (the header's Budgets note): 600 s, the 10 minutes this job came in with — it is
    # new here, so no run on main has measured it — plus its slowest retried step alone — the
    # workspace install, 5 x 180 + 150 = 1050 s, above the ci-ok report's 600 s.
    # 600 + 1050 = 1650 s -> 28 min.
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # Retried like every install in this workflow (the header's Retries note); 180 s per
      # attempt, the bound every Bun install of this repository's CI carries: 20.70 s cold on a
      # pod, against at most 11 s over 180 observations in CI.
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - name: Lint the shared test fixtures
        run: bun run lint
        working-directory: packages/test-fixtures
      - name: Typecheck the shared test fixtures
        run: bun run typecheck
        working-directory: packages/test-fixtures
      - name: Test the shared test fixtures
        run: bun run test
        working-directory: packages/test-fixtures

      - name: Report ci-ok when this is the run's last job
        if: always()
        # Its own retry arithmetic: ci-ok-report.sh's `gh api` read and post-check-run.sh's POST
        # of the check run, 2 x (5 x 30 + 150) = 600 s. 720 s and not rule 8's minimum of 660 s:
        # this step posts the required ci-ok check, and a budget that cuts it between those two
        # ladders loses the check run rather than reporting a failure (the header's Budgets note).
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  conflicts-script:
    needs: changes
    if: needs.changes.outputs.conflicts_script == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Budget (the header's Budgets note): this job carried none, so its unretried term is its
    # 41 s measured maximum, plus its slowest retried step alone — the workspace install,
    # 5 x 180 + 150 = 1050 s, above the ci-ok report's 600 s. 41 + 1050 = 1091 s -> 19 min.
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # Retried like every install in this workflow (the header's Retries note); 180 s per
      # attempt, the bound every Bun install of this repository's CI carries: 20.70 s cold on a
      # pod, against at most 11 s over 180 observations in CI.
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - name: Lint the conflict measurement script
        run: bunx biome check --error-on-warnings scripts/conflicts
      # scripts/conflicts is no workspace; the root package pins its TypeScript and Bun types.
      - name: Typecheck the conflict measurement script
        run: bunx tsc --noEmit -p scripts/conflicts
      - name: Test the conflict measurement script
        run: bun test scripts/conflicts

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its own retry arithmetic: ci-ok-report.sh's `gh api` read and post-check-run.sh's POST
        # of the check run, 2 x (5 x 30 + 150) = 600 s. 720 s and not rule 8's minimum of 660 s:
        # this step posts the required ci-ok check, and a budget that cuts it between those two
        # ladders loses the check run rather than reporting a failure (the header's Budgets note).
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The secrets broker's TypeScript client, which packages/envoy-client's broker credential
  # imports. It has no build: its consumers read its sources through the workspace.
  broker-client:
    needs: changes
    if: needs.changes.outputs.broker_client == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Budget (the header's Budgets note): 600 s, the 10 minutes this job came in with — it is
    # new here, so no run on main has measured it — plus its slowest retried step alone — the
    # workspace install, 5 x 180 + 150 = 1050 s, above the ci-ok report's 600 s.
    # 600 + 1050 = 1650 s -> 28 min.
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # Retried like every install in this workflow (the header's Retries note); 180 s per
      # attempt, the bound every Bun install of this repository's CI carries: 20.70 s cold on a
      # pod, against at most 11 s over 180 observations in CI.
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - name: Lint the broker client
        run: bun run lint
        working-directory: packages/broker-client
      - name: Typecheck the broker client
        run: bun run typecheck
        working-directory: packages/broker-client
      - name: Test the broker client
        run: bun run test
        working-directory: packages/broker-client

      - name: Report ci-ok when this is the run's last job
        if: always()
        # Its own retry arithmetic: ci-ok-report.sh's `gh api` read and post-check-run.sh's POST
        # of the check run, 2 x (5 x 30 + 150) = 600 s. 720 s and not rule 8's minimum of 660 s:
        # this step posts the required ci-ok check, and a budget that cuts it between those two
        # ladders loses the check run rather than reporting a failure (the header's Budgets note).
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  envoy-client:
    needs: changes
    if: needs.changes.outputs.envoy_client == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Budget (the header's Budgets note): 600 s, the 10 minutes this job carried, above its 83 s
    # measured maximum, plus its slowest retried step alone — the workspace install,
    # 5 x 180 + 150 = 1050 s, above the ci-ok report's 600 s. 600 + 1050 = 1650 s -> 28 min.
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # Retried like every install in this workflow (the header's Retries note); 180 s per
      # attempt, the bound every Bun install of this repository's CI carries: 20.70 s cold on a
      # pod, against at most 11 s over 180 observations in CI.
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - name: Build contracts for Envoy client
        run: bun run build
        working-directory: packages/contracts
      - name: Lint Envoy client
        run: bun run lint
        working-directory: packages/envoy-client
      - name: Typecheck Envoy client
        run: bun run typecheck
        working-directory: packages/envoy-client
      # packages/envoy-client/src/broker-credential.ts:21-22 imports
      # @legion/broker-client/environment and @legion/broker-client/token-client, so this job
      # already stands on that package; its typecheck and its tests run in no other job, and its
      # own lint script runs nowhere else either, though the lint job's whole-tree Biome pass
      # does lint its 13 files under the same root config. They sit before the NATS pull because
      # they need no image and no server: the five test files import only bun:test, jose, node:
      # and the package's own modules.
      - name: Lint broker client
        run: bun run lint
        working-directory: packages/broker-client
      - name: Typecheck broker client
        run: bun run typecheck
        working-directory: packages/broker-client
      - name: Test broker client
        run: bun run test
        working-directory: packages/broker-client
      - name: Pre-pull the NATS image the credential tests run
        # ghcr.io/cybermonklabs/legion/ci, the copy of nats:2.10 (.github/ci-images.yaml). This job
        # pulls the image here, and does not call .github/actions/pull-test-images: that action
        # reads a Go `const` line, and this image is a TypeScript constant
        # (packages/envoy-client/src/__tests__/nats-server.ts:9-10). The registry is this
        # repository's own, so a failed pull is a fault of this repository. Show it, do not retry
        # it.
        run: docker pull ghcr.io/cybermonklabs/legion/ci@sha256:5498ba57b9471840be3d15b033a4eec554d1c02fa6c2cc0ca2d888637f6c6e2f
      # TMPDIR is a directory of this step's own, read by the step below: a test file that leaves
      # its temporary directory behind is how 7,063 of them gathered on a shared development
      # machine, measured on 2026-11-07, which is the count this step keeps at zero. The suites
      # take their directories from @legion/test-fixtures, whose rules are docs/testing.md's "Bun
      # tests". It is exported on the command line rather than set in `env:` so the reading step
      # can name the same path.
      - name: Test Envoy client
        run: |
          mkdir -p "$RUNNER_TEMP/envoy-client-tmp"
          TMPDIR="$RUNNER_TEMP/envoy-client-tmp" bun run test
        working-directory: packages/envoy-client
        env:
          LEGION_E2E: "1"
      - name: Check the Envoy client suite left no temporary directory behind
        run: |
          left=$(ls -A "$RUNNER_TEMP/envoy-client-tmp")
          if [ -n "$left" ]; then
            echo "the suite left these in its temporary directory:" >&2
            printf '%s\n' "$left" >&2
            exit 1
          fi
          echo "the suite left nothing in its temporary directory"
      - name: Build Envoy client
        run: bun run build
        working-directory: packages/envoy-client

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
