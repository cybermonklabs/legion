  dispatch-ui:
    needs: changes
    if: needs.changes.outputs.dispatch_ui == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 900 s, the 15 minutes this job was written with, plus
    # its slowest retried step alone — the setup-bun step's two `ci_tools_fetch` calls,
    # 2562 s, above the workspace install's 5 x 180 + 150 = 1050 s and the ci-ok report's
    # 600 s. 900 + 2562 = 3462 s -> 58 min.
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its own retry arithmetic, which is the action's: two `ci_tools_fetch` calls,
      # 2 x 1281 = 2562 s (ci-budgets.md's Budgets note) -> 43 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 43
      # Retried at 180 s per attempt like every Bun install here (ci-budgets.md's Retries note).
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      # The suites below read some of contracts' values through plain Node resolution rather than
      # through the workspace's "bun" export condition: e2e/__tests__/row-configurations.test.ts
      # spawns Playwright, whose own resolution reads contracts' built dist/. Without this step
      # that spawn fails the moment contracts' source gains an export its dist lacks, measured on
      # run 42303677853 at 5636a301, where both of its cases failed with "The requested module
      # '@legion/contracts/dispatch-tools' does not provide an export named
      # 'DISPATCH_BLOCK_UNITS'" and passed again once contracts was built
      # (every job of dispatch-browser.yaml that runs the suite needs contracts built for the
      # same reason and carries a `Build contracts for dispatch e2e` step of its own, which that
      # file's shard job explains).
      - name: Build contracts for the suites that spawn Playwright
        run: bun run build
        working-directory: packages/contracts
      - name: Lint proof editor
        run: bun run lint
        working-directory: packages/proof-editor
      - name: Typecheck proof editor
        run: bun run typecheck
        working-directory: packages/proof-editor
      - name: Test proof editor
        run: bun run test
        working-directory: packages/proof-editor
      - name: Lint dispatch dashboard
        run: bun run lint
        working-directory: packages/dispatch
      - name: Typecheck dispatch dashboard
        run: bun run typecheck
        working-directory: packages/dispatch
      # The database cases of e2e/__tests__/psql-session.test.ts and harness-stacks.test.ts skip
      # themselves where LEGION_TEST_PG_DSN names no server, so in this job they do not run: it
      # has no `postgres:` service, as this job's head says. A container of the pinned image for
      # this step alone was tried and taken out again, in the job these tests ran in before this
      # one: it cost an image pull and a readiness wait, about 90 s, and the wait timed out on one
      # runner in three. What those cases prove - that a worker's psql reads its own stack's
      # database and not the plain name - is proven on any machine with LEGION_TEST_PG_DSN set,
      # which is how a developer and an issue pod run them (`bun run test` in packages/dispatch;
      # psql-session makes a database of its own there), and the stack contract they guard is also
      # covered end to end by every multi-worker run of the browser suite itself.
      - name: Test dispatch dashboard
        run: bun run test
        working-directory: packages/dispatch
      # The build writes dist/THIRD_PARTY_NOTICES.txt, failing on a bundled package whose license
      # cannot be determined; the listing shows the build shipped it.
      - name: Build dispatch dashboard
        run: |
          bun run build:web
          ls -l web/dist/THIRD_PARTY_NOTICES.txt
        working-directory: packages/dispatch
      - name: Check dispatch dashboard CSS classes
        run: bun run check:classes
        working-directory: packages/dispatch
      # The server refuses to boot on a build holding an asset over 8 MiB (it publishes every
      # asset to its database at boot), which would stall a roll; refuse the build here instead.
      - name: Check dispatch dashboard asset sizes
        run: bun run check:asset-sizes
        working-directory: packages/dispatch
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # Every browser row of the Dispatch suite, which .github/workflows/dispatch-browser.yaml holds.
  # Its two lanes and its matrix: .github/ci-budgets.md, "The dispatch-browser job's two lanes".
  #
  # No timeout-minutes: GitHub's keywords for a job that calls a reusable workflow leave it out.
  # Each job of dispatch-browser.yaml carries its own limit.
  dispatch-browser:
    needs: changes
    if: needs.changes.outputs.dispatch_browser == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    uses: ./.github/workflows/dispatch-browser.yaml
    with:
      # An unlabelled pull request gets the two-project `pull-request` lane; a pull request
      # carrying `full-ci`, and every other event, gets the full lane. That is what lets a worker
      # recheck a slow-suite failure on a pull request: the label picks the lane, while the
      # `dispatch_browser` output above runs the suite either way.
      lane: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'full' || 'pull-request' }}
      ci-ok-changes: ${{ toJSON(needs.changes) }}

  claude-envoy:
    needs: changes
    if: needs.changes.outputs.claude_envoy == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Budget (the Budgets note of .github/ci-budgets.md): 600 s, the 10 minutes this job carried, above its 99 s measured maximum,
    # plus its slowest retried step alone - the leak-guard fetch of the release-push.sh
    # steps, 6 call sites of one 450 s fetch = 2700 s, above every other retried step here.
    # 600 + 2700 = 3300 s -> 56 min, which carries the whole minute that
    # note gives a step whose own arithmetic is a whole number of minutes (46 min here).
    timeout-minutes: 56
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its own retry arithmetic, which is the action's: two `ci_tools_fetch` calls,
      # 2 x 1281 = 2562 s (ci-budgets.md's Budgets note) -> 43 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 43
      # tests/answers-claude.test.ts runs the pinned Claude Code against a stand-in Messages
      # endpoint and Dispatch, and refuses on GitHub Actions without one. The pin is read from
      # .claude-code-pin, the repository's one copy of it (.github/actions/install-claude-code).
      - uses: ./.github/actions/install-claude-code
        # install-claude-code's own retry arithmetic: its `bun add`, 5 x 180 + 150 = 1050 s.
        timeout-minutes: 18
      # Retried at 180 s per attempt like every Bun install here (ci-budgets.md's Retries note).
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - name: Lint Claude Envoy plugin
        run: bun run lint
        working-directory: packages/claude-envoy
      - name: Typecheck Claude Envoy plugin
        run: bun run typecheck
        working-directory: packages/claude-envoy
      # Nothing commits dist/ or legion/: release.yaml's claude_envoy_build builds them and packs
      # them into the tarball it publishes to npm. So this builds and checks them from the head's
      # source as that job does: packages/claude-envoy/scripts/verify-build.sh.
      - name: Build, check and pack the plugin as the release does
        run: bun run verify-build "$RUNNER_TEMP/claude-envoy-built.tar"
        working-directory: packages/claude-envoy
      # The pack step packs the package's own dist/ and legion/ (release-push.sh extract-built).
      - name: Put the checked build into CI's checkout for the pack
        timeout-minutes: 46
        run: .github/scripts/release-push.sh extract-built "$RUNNER_TEMP/claude-envoy-built.tar"
      - name: Test Claude Envoy plugin
        run: bun run test
        working-directory: packages/claude-envoy
      - name: Pack Claude Envoy plugin
        run: bun pm pack --destination ../../out/pr-artifacts
        working-directory: packages/claude-envoy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-envoy-pr
          path: out/pr-artifacts/*.tgz

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # envoy-go's fast half: the Go format check, the two generated-code checks, the seven
  # shell-script tests and the build and pack of the envoy commands. The slow half below (the
  # module's unit tests, the container-backed NATS matrix and the integration suite) is one of
  # the eight slow suites, which run in the merge queue and on a pull request labelled `full-ci`,
  # while these checks must come back on every push. No Postgres service: nothing here opens a
  # database. It restores go-envoy rather than go-envoy-test, which is the slow half's family
  # alone (the test binary of every package of the envoy module).
  envoy-go-checks:
    needs: changes
    if: needs.changes.outputs.envoy_go_checks == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # The builds below download the envoy module's dependencies and compile ./cmd/listener for
    # each release architecture, so the job restores go-envoy, the family whose entry holds that
    # same listener build (.github/workflows/ci-caches.yaml fills it on a push to main). Without
    # it the pack step would recompile the set per architecture from nothing on every push, which
    # is the runner time this change exists to cut.
    #
    # Budget (ci-budgets.md's Budgets note): 1800 s, the 30 minutes the paragraph above derives and
    # the budget this job was written with, plus its slowest retried step alone - the step that
    # runs packages/envoy/loadtest/cluster/cluster.test.sh, which renders the nats chart through
    # render-nats.sh and so holds that script's three retried fetches: the chart index and the
    # chart archive at 5 x 60 + 150 = 450 s each and the helm install at 5 x 180 + 150 = 1050 s,
    # 1950 s together. THAT IS NO LONGER THIS JOB'S SLOWEST STEP: setup-bun's two
    # `ci_tools_fetch` calls are 2562 s at this change's bound, where they were 1482 s when this
    # comment was written, so the step that sizes the job is setup-bun again, above those
    # 1950 s, above the Go module download and the workspace install at 1050 s each and above
    # the ci-ok report's 600 s.
    # 1800 + 2562 = 4362 s -> 73 min. The gate reads no script outside .github/scripts/, so it
    # prices none of render-nats.sh's three sites into that step: that 1950 is a reader's figure
    # and dispatch://INFRA-2899 owns the reach that would make it the check's. The 2562 is the
    # check's own, and rule 8's job-derivation clause refused this key until it carried it.
    timeout-minutes: 73
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its own retry arithmetic, which is the action's: two `ci_tools_fetch` calls,
      # 2 x 1281 = 2562 s (ci-budgets.md's Budgets note) -> 43 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 43
      # Retried at 180 s per attempt like every Bun install here (ci-budgets.md's Retries note).
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-{0}-', runner.os) }}
      # The modules this job's builds compile, downloaded once and retried before the first of
      # them (ci-budgets.md's Retries note; the retried unit is the download, never the build).
      # 180 s per attempt: the slowest cold `go mod download` measured is 113 s, for
      # packages/envoy/infra, against 77 s for packages/envoy, each on an empty module cache on
      # 2026-11-07, so the bound is 1.6 times the slowest of them; an attempt it kills leaves
      # what it fetched in the module cache for the next one to resume from, which a tarball
      # fetch cannot do. The restore above makes the common run cost nothing.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not gofmt-formatted; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: packages/envoy
      - name: Check Go contracts are generated from the shared schema
        run: bun run check:go
        working-directory: packages/contracts
      - name: Check the OpenAPI document is generated from the route table
        run: go run ./cmd/dispatch openapi --check
        working-directory: packages/envoy
      - name: Check pmdoc fixtures are up to date
        run: bun run check
        working-directory: packages/envoy/internal/dispatch/pmdoc/gen
      # The fixture the web app's view tests draw (pmdoc/web_fixtures_test.go): a corpus text
      # whose display reading changed and a fixture nobody regenerated fails here rather than
      # leaving a view's test asserting against a stale tree.
      - name: Check the web app's display-tree fixture is up to date
        run: go test -count=1 -run TestWebDisplayFixture ./internal/dispatch/pmdoc/ -args --check
        working-directory: packages/envoy
      - name: Isolation test for dev-broker.sh (fakes docker/go/curl; no real Postgres or network)
        run: bash scripts/dev-broker.test.sh
        working-directory: packages/envoy
      - name: Isolation test for dev-airlock.sh (fakes psql/go/curl; no real Postgres, network or Go build)
        run: bash scripts/dev-airlock.test.sh
        working-directory: packages/envoy
      - name: Isolation test for dev-stack.sh (fakes go/psql/curl/python3; no real Postgres or network)
        run: bash scripts/dev-stack.test.sh
        working-directory: packages/envoy
      - name: Reuse test for dev-postgres.sh (a fake docker; refuses a dispatch-pg off the pinned image)
        run: bash scripts/dev-postgres.test.sh
        working-directory: packages/envoy
      - name: Verdict test for listener-deploy-probe.sh (two fake listener tasks on 127.0.0.1 and 127.0.0.2)
        run: bash scripts/listener-deploy-probe.test.sh
        working-directory: packages/envoy
      - name: One-run-at-a-time test for loadtest/run-step.sh and run-series.sh (fakes go and uv; no stack)
        run: bash loadtest/run-step.test.sh
        working-directory: packages/envoy
      - name: Lock test for loadtest/common.sh (inherited lock, refusals, holders in another PID namespace; no stack)
        run: bash loadtest/common.test.sh
        working-directory: packages/envoy
      - name: Test loadtest/cluster/cluster.sh (fakes kubectl, gh and curl; no cluster) and compare nats.yaml with a fresh render
        run: bash loadtest/cluster/cluster.test.sh
        working-directory: packages/envoy
      - name: Test loadtest/vm/vm.sh, the load-test deployment's driver (fakes ssh, docker, curl, psql, nc and loadgen; no VMs)
        run: bash loadtest/vm/vm.test.sh
        working-directory: packages/envoy
      - name: Test loadtest/vm/sample.sh, the VM sampler's reader (a prepared cgroup tree and /proc; no VMs)
        run: bash loadtest/vm/sample.test.sh
        working-directory: packages/envoy
      # The test runs its URL cases under en_US.UTF-8, where bash's [[ =~ ]] ranges reach past ASCII,
      # to hold the deployer's URL grammar to ASCII; it refuses to run without that locale.
      - name: Rollback and credential test for deploy/scripts/autodeploy.sh (fakes docker/jj/curl and a libpq client; no real Compose or Postgres)
        run: |
          sudo locale-gen en_US.UTF-8
          bash deploy/scripts/autodeploy_test.sh
        working-directory: packages/envoy
      - name: Build envoy services
        run: go build ./cmd/dispatch ./cmd/listener
        working-directory: packages/envoy
      # The release's archives (release-envoy-listener.yaml), THIRD_PARTY_NOTICES included.
      - name: Pack envoy binaries
        run: |
          for arch in $(jq -r '.envoy[]' ../../.github/go-release-targets.json); do
            out="../../out/pr-artifacts/envoy-$arch"
            mkdir -p "$out"
            GOOS=linux GOARCH=$arch go build -buildvcs=false -o "$out/envoy-listener" ./cmd/listener
            GOOS=linux GOARCH=$arch ../../scripts/go-third-party-notices.sh "$out/THIRD_PARTY_NOTICES" ./cmd/listener
            tar czf "../../out/pr-artifacts/legion-envoy-$arch.tar.gz" -C "$out" envoy-listener THIRD_PARTY_NOTICES
            tar tzvf "../../out/pr-artifacts/legion-envoy-$arch.tar.gz"
          done
        working-directory: packages/envoy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legion-envoy-binaries-pr
          path: |
            out/pr-artifacts/legion-envoy-amd64.tar.gz
            out/pr-artifacts/legion-envoy-arm64.tar.gz
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The slow half: the unit tests of every package of the envoy module, the container-backed NATS
  # matrix and the integration suite, all against this job's Postgres. Its format, generated-code,
  # shell-script, build and pack steps are envoy-go-checks' above.
  envoy-go:
    needs: changes
    if: needs.changes.outputs.envoy_go == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Each go test step's -timeout must fire before the runner cancels the job, so a hung test
    # prints the dump that names it. A timed-out step fails the job, so the bound is the steps
    # before it at their measured times plus its own limit: about 1 minute of setup, then the
    # plain race-impossible step's three 10-minute runs, which is 31; after that step's measured
    # 2 minutes the unit step's own 20 is 23; after the unit step, which runs strictly fewer
    # packages than the 35 minutes it measured before the race lane's left it and so cannot
    # exceed that, natslive's default 10 and the bus matrix's own 5 are 53, and the integration
    # step's 5 is less.
    #
    # Budget (ci-budgets.md's Budgets note): 3600 s, the 60 minutes this job carried, above both
    # the 53 the paragraph above derives and its 1376 s measured maximum, plus its slowest
    # retried step alone — the setup-bun step's two `ci_tools_fetch` calls, 2562 s, above
    # packages/envoy's `go mod download` and the workspace install at 5 x 180 + 150 = 1050 s
    # each and the ci-ok report's 600 s. 3600 + 2562 = 6162 s -> 103 min.
    timeout-minutes: 103
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The runner VM is discarded after the job, so testcontainers' Ryuk reaper has nothing to
      # clean up, and its image would be one more registry pull a test could fail on.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # (The smoke test and the image it runs live in the envoy-smoke job below.)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its own retry arithmetic, which is the action's: two `ci_tools_fetch` calls,
      # 2 x 1281 = 2562 s (ci-budgets.md's Budgets note) -> 43 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 43
      # Retried at 180 s per attempt like every Bun install here (ci-budgets.md's Retries note).
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # go-envoy-test: this job builds and runs the test binary of every package of the envoy
      # module, a set no other job builds, so it keeps a family of its own.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-test-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-test-{0}-', runner.os) }}
      # The module the steps below test and build, downloaded once and retried before the
      # first of them (ci-budgets.md's Retries note; the retried unit is the download, never the
      # build and never the test). 180 s per attempt: the slowest cold `go mod download`
      # measured is 113 s, for packages/envoy/infra, against 77 s for packages/envoy, each on an
      # empty module cache on 2026-11-07, so the bound is 1.6 times the slowest of them; an
      # attempt it kills leaves what it fetched in the module cache for the next one to resume
      # from, which a tarball fetch cannot do.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      # The server's version and the pgvector version it offers, read from the service itself, so
      # the run shows which Postgres the tests below ran on.
      - name: Postgres service version
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc "select current_setting('server_version_num'), coalesce((select default_version from pg_available_extensions where name = 'vector'), 'no vector')"
      # Every image the tests here start: testnats.Image and testnats.HubImage, which the
      # natslive step below runs the two-image matrix on, and tests3.Image, pulled first for the
      # reason the action gives.
      - name: Pull test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
            packages/envoy/internal/tests3/seaweedfs.go Image
      # The tests the race detector makes impossible, which the race job of each of these packages
      # therefore cannot make, so envoy-go keeps a plain run of exactly them: internal/bus counts
      # HoldsSeed's allocations, which the race runtime's own allocations would be counted into;
      # the API's two guards read the module's source, to which the detector adds nothing; and the
      # documents package measures the heap a room keeps, which the detector's shadow memory and
      # instrumentation move. Those are out of the race build altogether (//go:build !race), and
      # the two render-reuse storms run fewer seeds and fewer edits under it (raceEnabled), so this
      # is their full-size run. It comes before the unit step for the reason the API package's own
      # run did: run beside the other package binaries, its Postgres-backed tests and the
      # room-memory measurements queue their per-test database cleanup on the service's one
      # checkpointer, and the API's live-feed and delivery-hub tests wait for the event log's safe
      # horizon, which any open transaction on this job's Postgres delays. The three -run lists are
      # derived in .github/scripts/ci_job_reads.py from the race lane's own packages and those
      # files' //go:build !race and raceEnabled, so a test added to either and missing here fails
      # the ci-filters job naming this step. Measured over three runs on a two-vCPU pod: the bus
      # under a tenth of a second, the API 8 to 10 s, the documents package 92 to 127 s, so 10
      # minutes each is ample.
      - name: Test what the race build cannot run at all or at full size
        run: |
          go test -count=1 -timeout 10m -run '^(TestHoldsSeedAllocatesAtMostOneCopyPerDecoding)$' ./internal/bus
          go test -count=1 -timeout 10m -run '^(TestCopyLockComesBeforeEveryPendingRowAndEvent|TestCopyLockOrderGuardFollowsTheLockTakers|TestEveryKeyedWriteCommitsInsideATransactionTheMarkHooks|TestEveryRouteThatTakesABodyRefusesADecisionBlock|TestTheDecisionBlockGuardSeesWhatItGuards|TestTheGuardReadsABodyStringOffARequestType|TestTheKeyedWriteGuardSeesWhatItGuards)$' ./internal/dispatch/api
          go test -count=1 -timeout 10m -run '^(TestARoomFedOnlyByAgentWritesKeepsMemoryWithinTheBound|TestRenderReuseARandomisedEditStorm|TestRenderReuseAReplicaReplaysTheRoomsFormattingExactly|TestUploadsOverOpenAnchorsKeepMemoryWithinTheBound|TestUploadsToARoomInUseKeepMemoryWithinTheBound)$' ./internal/dispatch/docs
        working-directory: packages/envoy
      # Everything the three race jobs run is left out here, since they run it under the detector,
      # and so is internal/integration, which the integration step below tests. The pattern is
      # built in .github/scripts/ci_job_reads.py from the same list those jobs' own steps are built
      # from, so what this step leaves out and what the lane runs cannot drift apart. What is left
      # is the rest of the module, the two longest packages of it (the API's and the documents
      # service's) now among the ones the lane runs, so its 20 minutes are ample.
      - name: Unit test envoy Go package
        run: |
          go list ./... | grep -Ev '/integration|/internal/dispatch/delivery($|/)|/internal/dispatch/store($|/)|/internal/bus$|/cmd/listener$|/internal/store$|/internal/session$|/internal/kvwatch($|/)|/internal/dispatch/api$|/internal/dispatch/docs$' | xargs go test -count=1 -timeout 20m
        working-directory: packages/envoy
      # agentloop's live proof makes a real model call, so it sits behind a build tag and CI
      # never runs it. Vetting it keeps it compiling as the package changes.
      - name: Vet agentloop's live proof (no model call)
        run: go vet -tags modellive ./agentloop/
        working-directory: packages/envoy
      # internal/testnats runs its server in the test process, so the untagged step above starts
      # no container. The two-image matrix, which proves a rendered authorization on nats:2.10 and
      # on the image the hub runs, is the one thing an in-process server cannot reproduce: it sits
      # behind the natslive tag, and this step is where it runs (INFRA-250). internal/bus has one
      # test of its own on that matrix: the module links nats-server v2.15.1 in process, which
      # caps a stream that sets no cap at a default of its own and takes a change of MaxConsumers
      # on a stream that already exists, so the raise of an uncapped ENVOY_NOTIFICATIONS to the
      # consumer cap this binary compiles and the keeper's restore of a cap an operator lowered or
      # unset are proved in process. What is left for a real image is the pair of 2.10 cases - the
      # stream with no cap the binary must leave alone, and the refusal of the raise of a lower
      # cap, naming the field, the cap and the first server taking the change - and the hub's own
      # reconcile on the nats:2.15.1-alpine image the deployment runs (INFRA-1384). Each
      # package runs only the tests its tag adds: `-tags natslive ./pkg` would re-run the
      # package's untagged tests, which already run elsewhere - internal/testnats in the unit step
      # above, and internal/bus in envoy-go-race, which the unit step's grep -Ev leaves out - so
      # the -run comes from .github/scripts/go-tagged-tests.sh, which reads the names off the
      # source at run time, and no test name is spelled here. Each assignment is a line of its
      # own: under bash -e it carries the script's exit status, so an empty or refused list fails
      # the step instead of running -run "", which matches every test.
      - name: Test the container-backed NATS matrix (natslive)
        run: |
          rig=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/testnats)
          go test -count=1 -tags natslive -run "$rig" ./internal/testnats/
          cap=$(../../.github/scripts/go-tagged-tests.sh natslive ./internal/bus)
          go test -count=1 -timeout 5m -tags natslive -run "$cap" -v ./internal/bus/
        working-directory: packages/envoy

      - name: Integration test envoy (a real NATS server, in the test process)
        run: go test ./internal/integration/ -timeout 300s -count=1
        working-directory: packages/envoy
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The envoy-infra Pulumi plugin's module (packages/envoy/infra). It is not in the root go.work:
  # its own go.work binds it and packages/envoy, so Pulumi's requirements never move the versions
  # the Envoy binaries and the daemon build with, and every go command below runs in that
  # workspace. Vet compiles the files behind the live-test tags (pulumilive, natslive) too. The unit
  # tests start no container; the natslive files run in a step of their own against real
  # nats-server and Postgres, on testnats.Image, testnats.HubImage and testpg.Image, pulled first
  # for the reason .github/actions/pull-test-images gives. That step runs only the tests the tag
  # adds, one call per package: the unit step above already ran every untagged test of core, seed
  # and gcp, so each call takes its -run from .github/scripts/go-tagged-tests.sh, which reads the
  # names off the source at run time. The gcp natslive tests pull no image:
  # they install helm, nats-server, the config reloader and the exporter with go install, at the
  # versions the clustered hub runs, and render the vendored chart in gcp/testdata. The per-target
  # compile runs in the lint job's notices step.
  envoy-infra-go:
    needs: changes
    if: needs.changes.outputs.envoy_infra_go == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 900 s, the 15 minutes this job carried, above its
    # 509 s measured maximum, plus its slowest retried step alone — the four `go install`s of
    # the live tests' tools, each 5 x 180 + 150 = 1050 s, so 4200 s, above both
    # packages/envoy/infra's own `go mod download` at 1050 s and the ci-ok report's 600 s.
    # 900 + 4200 = 5100 s, and that step's own arithmetic is a whole number of minutes, so it
    # takes one more (71) and this job takes it with it: 900 + 4260 = 5160 s -> 87 min, the whole minute above a sum that is itself a whole number of minutes. That is
    # the rule the Budgets note states and the twelve ceilings of this change apply; this one
    # had it on the step alone.
    timeout-minutes: 87
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/infra/go.mod
          cache: false
      # go-envoy-infra.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-infra-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-infra-{0}-', runner.os) }}
      # The infra module's own workspace, downloaded once and retried before the vet and the
      # tests below (ci-budgets.md's Retries note; the retried unit is the download, never the
      # build and never the test). 180 s per attempt: a cold `go mod download` of
      # packages/envoy/infra measured 113 s on an empty module cache on 2026-11-07, the slowest
      # of the three modules measured there, so the bound is 1.6 times it; an attempt it kills
      # leaves what it fetched in the module cache for the next one to resume from, which a
      # tarball fetch cannot do.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy/infra's Go modules" 180 -- go -C packages/envoy/infra mod download
      - name: Pull the NATS and Postgres test container images
        uses: ./.github/actions/pull-test-images
        with:
          consts: |
            packages/envoy/internal/testnats/nats.go Image
            packages/envoy/internal/testnats/nats.go HubImage
            packages/envoy/internal/testpg/testpg.go Image
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists files that are not gofmt-formatted; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: packages/envoy/infra
      - name: Vet envoy-infra, its live-test tags included
        run: go vet -tags pulumilive,natslive ./...
        working-directory: packages/envoy/infra
      - name: Unit test envoy-infra
        run: go test -count=1 ./...
        working-directory: packages/envoy/infra
      # gcp's live tests install helm, nats-server, the config reloader and the exporter with
      # `go install module@version`, which builds from each module's own go.mod and reads no
      # go.work, so the workspace download above covers none of it: four download sites inside a
      # `go test`. They come down here instead, through the one helper, and the test takes them
      # from LEGION_LIVE_TOOL_DIR rather than installing its own (dispatch://INFRA-1545).
      # One call per tool and no loop, because a loop's passes are what this repository's
      # download check cannot count, and a figure nobody can read is a budget nobody can check.
      - name: Download the tools envoy-infra's live tests run
        # Its own retry arithmetic: four installs, each 5 x 180 + 150 = 1050 s, so 4200 s, and
        # the budget stands strictly above it rather than level with it -> 71 min.
        timeout-minutes: 71
        run: |
          . .github/scripts/ci-retry.sh
          mkdir -p "$RUNNER_TEMP/live-tools"
          cd packages/envoy/infra
          export GOBIN="$RUNNER_TEMP/live-tools" GOWORK=off
          retry_fetch "helm v3.20.2" 180 -- go install helm.sh/helm/v3/cmd/helm@v3.20.2
          retry_fetch "nats-server v2.15.1" 180 -- go install github.com/nats-io/nats-server/v2@v2.15.1
          retry_fetch "the config reloader v0.24.0" 180 -- \
            go install github.com/nats-io/nack/cmd/nats-server-config-reloader@v0.24.0
          retry_fetch "the nats exporter v0.20.2" 180 -- \
            go install github.com/nats-io/prometheus-nats-exporter@v0.20.2
      - name: Live tests of envoy-infra against nats-server (natslive)
        env:
          LEGION_LIVE_TOOL_DIR: ${{ runner.temp }}/live-tools
        # The tools come down in the step above, so this step holds no retried call of its own.
        # One call per package, never one union -run over the three: a name an untagged test of
        # one package shares with a natslive test of another would then run a second time with
        # nothing to say so. Each assignment is a line of its own, so under bash -e an empty or
        # refused list fails the step instead of running -run "", which matches every test.
        run: |
          for pkg in ./core ./seed ./gcp; do
            pattern=$(../../../.github/scripts/go-tagged-tests.sh natslive "$pkg")
            go test -count=1 -timeout 30m -tags natslive -run "$pattern" "$pkg"
          done
        working-directory: packages/envoy/infra
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The race lane: which packages run under the race detector here, and why api, the document
  # service and pmdoc sit where they do. .github/ci-budgets.md, "The race lane".
  envoy-go-race:
    needs: changes
    if: needs.changes.outputs.envoy_go_race == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # The step's -timeout 30m must fire before the runner cancels the job, so a hung test prints
    # the dump that names it: about 1 minute of setup, up to 5 minutes to compile the race
    # binaries, then the step's own 30 minutes, which is 36.
    #
    # Budget (ci-budgets.md's Budgets note): 2700 s, the 45 minutes this job carried, above both
    # the 36 the sentence above derives and its 726 s measured maximum, plus its slowest
    # retried step alone — packages/envoy's `go mod download`, 5 x 180 + 150 = 1050 s, above
    # the ci-ok report's 600 s. 2700 + 1050 = 3750 s -> 63 min.
    timeout-minutes: 63
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # The module the race step builds, downloaded once and retried before it (ci-budgets.md's
      # Retries note; the retried unit is the download, never the build and never the test).
      # 180 s per attempt: the slowest cold `go mod download` measured is 113 s, for
      # packages/envoy/infra, against 77 s for packages/envoy, each on an empty module cache on
      # 2026-11-07, so the bound is 1.6 times the slowest of them; an attempt it kills leaves
      # what it fetched in the module cache for the next one to resume from, which a tarball
      # fetch cannot do. This job restores no module cache, so this is where every one of its
      # modules arrives.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      - name: Race-test delivery, the store, the bus, the listener, the registry store, the session cache and kvwatch
        run: go test -count=1 -race -timeout 30m ./internal/dispatch/delivery/... ./internal/dispatch/store/... ./internal/bus/ ./cmd/listener/ ./internal/store/ ./internal/session/ ./internal/kvwatch/...
        working-directory: packages/envoy

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The Dispatch API under the race detector, on a runner of its own (the lane's comment above
  # says why). Its tests drive the store, so the job carries the lane's Postgres service.
  envoy-go-race-api:
    needs: changes
    if: needs.changes.outputs.envoy_go_race_api == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # The step's -timeout 30m must fire before the runner cancels the job, so a hung test prints
    # the dump that names it: about 1 minute of setup, up to 5 minutes to compile the race
    # binaries, then the step's own 30 minutes, which is 36.
    #
    # Budget (ci-budgets.md's Budgets note): 2700 s, the 45 minutes this job carried, above both
    # the 36 the sentence above derives and its 1273 s measured maximum, plus its slowest
    # retried step alone — packages/envoy's `go mod download`, 5 x 180 + 150 = 1050 s, above
    # the ci-ok report's 600 s. 2700 + 1050 = 3750 s -> 63 min.
    timeout-minutes: 63
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The broker's store, which the package's contract tests open (brokerstoretest.Open in
      # internal/dispatch/api/contract_test.go) and skip without; a skip is a pass, so without this
      # variable they never run under the race detector.
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # As envoy-go-race's download step: 180 s per attempt, 1.6 times the 113 s of the slowest
      # cold run measured (packages/envoy/infra; packages/envoy 77 s), and this job restores no
      # module cache either.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      - name: Race-test the Dispatch API
        run: go test -count=1 -race -timeout 30m ./internal/dispatch/api/
        working-directory: packages/envoy

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The document service alone, under the race detector, with a deadline of its own. It is by far
  # the slowest package of the race lane - 1773 s of the 1842 s the first step of envoy-go-race
  # spent on main at 14d907b6 (job 123461966609) - and sharing a 30-minute step with the other
  # five groups left it no headroom: that step died on go test's own deadline at job 123503246603.
  # Its own filter is the closure of this one package, not packages/envoy/**, so a change
  # elsewhere in the module does not start this job. No Bun: no test file here runs it, and no
  # job of this lane installs it. It runs under -race because a read that walks a live document
  # without its lock races the room's peers, which no ordinary run shows
  # (TestReadsOfALiveDocumentRunBesideItsPeers, internal/dispatch/docs/live_read_race_test.go:39,
  # LEGION-499).
  envoy-go-race-docs:
    needs: changes
    if: needs.changes.outputs.envoy_go_race_docs == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # The step's -timeout 60m must fire before the runner cancels the job, so a hung test prints
    # the dump that names it: about 1 minute of setup, up to 5 minutes to compile the race binary,
    # then the step's own 60 minutes, which is 66 under this limit of 70.
    #
    # Budget (ci-budgets.md's Budgets note): 4200 s, the 70 minutes this job carried, above both
    # the 66 the sentence above derives and its 1702 s measured maximum, plus its slowest
    # retried step alone — packages/envoy's `go mod download`, 5 x 180 + 150 = 1050 s, above
    # the ci-ok report's 600 s. 4200 + 1050 = 5250 s -> 88 min.
    timeout-minutes: 88
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Load-bearing, not boilerplate: this package's TestMain is storetest.Main
    # (internal/dispatch/docs/persistence_test.go:19), and storetest.Open skips every test that
    # opens the store when DISPATCH_TEST_DATABASE_URL is unset
    # (internal/dispatch/store/storetest/storetest.go:67-71). A skip is a pass, so without the
    # service this job would be green having run almost nothing.
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # go-envoy: its modules are the envoy module's, though this job builds the document
      # service's race test binary rather than the listener and natsd ci-caches.yaml builds.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-{0}-', runner.os) }}
      # The module the race step builds, downloaded once and retried before it (ci-budgets.md's
      # Retries note). 180 s per attempt, 1.6 times the 113 s of the slowest cold run measured
      # (packages/envoy/infra; packages/envoy 77 s, on an empty module cache on 2026-11-07), and
      # an attempt the bound kills leaves what it fetched for the next one; the restore above
      # makes the common run cost nothing.
      - name: Download the Go modules this job builds
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "packages/envoy's Go modules" 180 -- go -C packages/envoy mod download
      # Under the sampler, not bare: the race detector maps about four bytes of shadow memory per
      # byte of heap, and this package's race binary asked for more than the runner's 16 GiB,
      # which has no swap. The kernel killed this step three times with no output at all, which
      # names no test (dispatch://INFRA-1085). .github/scripts/race_memory.py samples the largest
      # process beside the run, writing a line every 5 s that names that process and the tests
      # running at that moment, so a step the kernel does take still says what it reached. After
      # the run it writes the peak, and fails this step when the peak passed RACE_MEM_LIMIT_KB,
      # 8388608 kB, half the runner, naming the tests that were running at the highest sample.
      # -json is the stream the sampler reads to know them; it writes every Output field back
      # out, so the log still carries the --- FAIL lines and the package's own line. -count=1
      # because the job restores the Go build cache above, and a cached pass must not stand in
      # for a run.
      - name: Race-test the document service
        run: RACE_MEM_LIMIT_KB=8388608 ../../.github/scripts/race_memory.py go test -json -race -count=1 -timeout 60m ./internal/dispatch/docs/
        working-directory: packages/envoy

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # The same package under Go's cleanup detector, which names what the memory above went to:
  # GODEBUG=checkfinalizers=1 makes the runtime report a cleanup or a finalizer whose closure or
  # argument reaches the object it is attached to, a cycle that keeps that object alive for the
  # life of the process, and that is the defect that held this package's memory
  # (dispatch://INFRA-1085). This is the only package of the repository that registers a cleanup,
  # so no other job needs it. It runs without -race: the detector is the runtime's own
  # bookkeeping, and a plain binary leaves the runner room the race binary does not. It reads the
  # same closure as envoy-go-race-docs, so it reuses that filter and that `changes` output rather
  # than taking one of its own.
  envoy-go-docs-finalizers:
    needs: changes
    if: needs.changes.outputs.envoy_go_race_docs == 'true' && (github.event_name != 'merge_group' || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    # The step's -timeout 34m must fire before the runner cancels the job, so a hung test prints
    # the dump that names it. Both numbers come from this job's own green runs, the slowest of
    # them 128761197501: 1136.829 s in the package, against 1016.966 s in 128809181011,
    # 1012.796 s in 128790317116 and 864.037 s in 128751128912, and about 71 s of checkout,
    # setup and compile before any of them. The package has grown three times under this pull
    # request, first when main took in #2414's tests (953 services built to 1068), again on the
    # merge of #2870, which moved work into this lane, and now with #2960's wedged-commit row,
    # measured at 56 s in series in an issue pod (the row's own 47.69 s, and 8.29 s more in the
    # residency case, which gives each of its trials a connection of its own). The step's
    # deadline is the smallest whole minute at which the slowest package time, that growth
    # included, is at most 60 % of it, and this limit is six minutes above that. Measure again
    # before changing either, and from the slowest run rather than the newest: a package that
    # has grown past 60 % of its deadline is a deadline to raise, not a flake to re-run.
    #
    # Budget (ci-budgets.md's Budgets note): 2400 s, the 40 minutes the paragraph above derives —
    # six minutes above the step's 34-minute deadline, and above the 1136.829 s in the package
    # and the 71 s before it that the slowest green run measured — plus its slowest retried
    # step alone: packages/envoy's `go mod download`, 5 x 180 + 150 = 1050 s, above the ci-ok
    # report's 600 s. 2400 + 1050 = 3450 s -> 58 min.
    timeout-minutes: 58
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Load-bearing, not boilerplate: this package's TestMain is storetest.Main
    # (internal/dispatch/docs/persistence_test.go:19), and storetest.Open skips every test that
    # opens the store when DISPATCH_TEST_DATABASE_URL is unset
    # (internal/dispatch/store/storetest/storetest.go:67-71). A skip is a pass, so without the
    # service this job would be green having run almost nothing.
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
