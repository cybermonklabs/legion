              # sources, through packages/envoy-client/src/broker-credential.ts:21-22
              # (ci_job_reads.py's envoy_client_dep).
              - 'packages/envoy-client/src/**'
              - 'packages/envoy-client/bin/dispatch.ts'
              - 'packages/broker-client/**'
              # The one markdown fixture table: the browser row each of the seven parity families
