    # 2026-11-08T18:46:47Z, and the 10 minutes that stood here came from #2512 (a limit above
    # each job's slowest green run, 2026-10-30), which is before them.
    # A job its own limit cuts off reports `cancelled`, which ci-ok fails, and 10 did that to
    # the merge groups of 2026-11-08T23:22Z and 2026-11-09T00:53Z with every step of the job
    # concluded `success`. A ceiling a little above today's sum is back inside the test step's
    # own spread at the next file that lands: five stall-watchdog files and two model-fallback
    # files took that step from 297 s at 17:49Z on 2026-11-08 to 638 s by 22:16Z.
    # 43 rather than the next minute above today's sum: #2918 (dispatch://INFRA-1545) makes
    # install-jj retry on a 3012 s ladder and gates a job's ceiling above its slowest retried
    # step, so that ladder and not this suite is what decides this line.
    # The 2 s above is a cold-Bun figure, measured before this branch: it is the release asset
    # setup-bun downloaded when its own cache was the only one and no-cache held it off every
    # ref but main. This branch restores ~/.bun/bin from a key of its own on every ref, so a
    # pull request's run and a merge group's both start from a hit where main saved one, which
    # moves that term down rather than up.
    # dispatch://INFRA-2125 shortens the suite and is the fix; this line is the stopgap.
    # Its two terms, in the shape ci-budgets.md's Budgets note asks for: 600 s, the 10 minutes
    # this job carried, above both its 374 s measured maximum and the 742 s sum above, plus
    # its slowest retried step alone - install-jj's two `ci_tools_fetch` calls and its
    # `mise install` of the jj release, 2562 + 450 = 3012 s, above setup-bun's 2562 s and the
    # workspace install's 1050 s. 600 + 3012 = 3612 s -> 61 min.
    timeout-minutes: 61
