    runs-on: ubuntu-24.04
    # Budget (ci-budgets.md's Budgets note): 600 s, the 10 minutes this job carried, above its
    # 227 s measured maximum, plus its slowest retried step alone — install-jj's two
    # `ci_tools_fetch` calls and its `mise install` of the jj release, 2562 + 450 = 3012 s,
    # above setup-bun's 2562 s, the tmux install's 625 + 775 = 1400 s, the workspace install's
    # 1050 s, install-omp's 450 s and the ci-ok report's 600 s. 600 + 3012 = 3612 s -> 61 min.
    timeout-minutes: 61
    # The NATS server extensions/card-delivery-omp.test.ts delivers Envoy cards and a person's Send
    # through (LEGION_TEST_NATS_URL on the test step): the 2.10 image the envoy-client job pulls,
    # pinned by digest as this file's other service images are.
    services:
      nats:
        # ghcr.io/cybermonklabs/legion/ci, the copy of nats:2.10 (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:5498ba57b9471840be3d15b033a4eec554d1c02fa6c2cc0ca2d888637f6c6e2f
        ports: ["4222:4222"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its own retry arithmetic, which is the action's: two `ci_tools_fetch` calls,
      # 2 x 1281 = 2562 s (ci-budgets.md's Budgets note) -> 43 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 43
      # Only for the mise it leaves at ~/.local/bin/mise, which install-omp installs the pin through:
      # nothing in this package drives jj.
      # install-jj's own retry arithmetic: two `ci_tools_fetch` calls and its `mise install`
      # of the jj release, 2562 + 450 = 3012 s (ci-budgets.md's Budgets note) -> 51 min.
      - uses: ./.github/actions/install-jj
        timeout-minutes: 51
      # extensions/dispatch-first-omp.test.ts, extensions/askgate/askgate-omp.test.ts,
      # extensions/card-delivery-omp.test.ts and extensions/tmux-place-omp.test.ts run the pinned
      # Oh My Pi against stand-ins (packages/pi-shared/test/omp-harness.ts) and refuse on GitHub
      # Actions without one. The pin is read from .omp-pin, the repository's one copy of it
      # (.github/actions/install-omp).
      # install-omp's own retry arithmetic: its `mise install`, 5 x 60 + 150 = 450 s -> 8 min.
      - uses: ./.github/actions/install-omp
        timeout-minutes: 8
      # extensions/tmux-place-omp.test.ts runs that binary in a pane of a tmux server of its own,
      # the only way the place a session registers can be read from the session itself, and refuses
      # on GitHub Actions without a tmux.
      # Both apt phases retry through .github/scripts/ci-retry.sh, in the spelling the test job's
      # own tmux install carries, for the same runner image and the same indexes; that step's
      # comment holds the whole reasoning — the inner `sudo timeout` is what bounds an attempt,
      # the unpack after the download takes no network and stays bare, and
      # `-o APT::Update::Error-Mode=any` is what leaves retry_fetch something to retry.
      - name: Install tmux
        # Its own retry arithmetic, so an exhausted phase fails this step by name rather than
        # being cut part way by the job: the index read's 5 x 95 + 150 = 625 s and the package
        # download's 5 x 125 + 150 = 775 s, 1400 s -> 24 min.
        timeout-minutes: 24
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "apt's package lists" 95 -- \
            sudo timeout 90 apt-get update -o APT::Update::Error-Mode=any
          retry_fetch "tmux" 125 -- \
            sudo timeout 120 apt-get install -y --no-install-recommends -d tmux
          sudo apt-get install -y --no-install-recommends tmux
      # Retried at 180 s per attempt like every Bun install here (ci-budgets.md's Retries note).
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile
      - name: Build contracts for pi-envoy
        run: bun run build
        working-directory: packages/contracts
      - name: Lint pi-envoy
        run: bun run lint
        working-directory: packages/pi-envoy
      - name: Typecheck pi-envoy
        run: bun run typecheck
        working-directory: packages/pi-envoy
      - name: Test pi-envoy
        run: bun run test
        working-directory: packages/pi-envoy
        env:
          LEGION_TEST_NATS_URL: nats://127.0.0.1:4222
      # The release's pack (release.yaml's pi_envoy_build job), which is also this job's build: the
      # manifest pointed at the one bundle, then scripts/pi-plugin-prepack.sh, which bundles
      # envoy.ts, writes dist/THIRD_PARTY_NOTICES (failing the pack on a bundled package whose
      # license cannot be determined) and stages this plugin's eleven skills. The listing shows the
      # tarball ships those and nothing of the Legion plugin's: no legion.js, no agents/, none of
      # its skills.
      - name: Pack pi-envoy
        run: |
          jq '.omp.extensions = ["dist/envoy.js"]' package.json > "$RUNNER_TEMP/package.json"
          mv "$RUNNER_TEMP/package.json" package.json
          bun pm pack --destination ../../out/pr-artifacts
          listing=$RUNNER_TEMP/pi-envoy-listing
          tar tzf ../../out/pr-artifacts/*.tgz > "$listing"
          for shipped in package/dist/envoy.js package/dist/THIRD_PARTY_NOTICES package/dist/skills/dispatch/SKILL.md; do
            grep -qxF "$shipped" "$listing" || { echo "::error::the pi-envoy tarball does not ship $shipped"; exit 1; }
          done
          for legion in package/dist/legion.js package/agents/ package/dist/skills/legion-worker/; do
            if grep -qF "$legion" "$listing"; then
              echo "::error::the pi-envoy tarball ships $legion, which is the Legion plugin's"
              exit 1
            fi
          done
        working-directory: packages/pi-envoy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-envoy-pr
          path: out/pr-artifacts/*.tgz

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 720 s: ci-budgets.md's Budgets note, "The ci-ok report".
