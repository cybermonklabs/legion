      - name: Check dispatch dashboard asset sizes
        run: bun run check:asset-sizes
        working-directory: packages/dispatch
      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its own retry arithmetic: ci-ok-report.sh's `gh api` read and post-check-run.sh's POST
        # of the check run, 2 x (5 x 30 + 150) = 600 s. 720 s and not rule 8's minimum of 660 s:
        # this step posts the required ci-ok check, and a budget that cuts it between those two
        # ladders loses the check run rather than reporting a failure (the header's Budgets note).
        timeout-minutes: 12
        uses: ./.github/actions/ci-ok-report
        with:
          changes: ${{ toJSON(needs.changes) }}
          job-status: ${{ job.status }}

  # Every browser row of the Dispatch suite, which .github/workflows/dispatch-browser.yaml
  # holds: the shard legs, the three `-alone` projects a machine each, the two-process job and
  # the merge job that joins their reports into one and posts this job's ci-ok report.
  #
  # Two lanes, and which run pays for which. A pull request without the label `full-ci` runs
  # `pull-request`, the two projects a change is held to (chromium and iphone), so such a run
  # proves those two rows and no more - it is not the run that proves the suite before main.
