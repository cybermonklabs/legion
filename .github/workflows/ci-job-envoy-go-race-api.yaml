name: CI job envoy-go-race-api

# The steps of ci.yaml's `envoy-go-race-api` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go-race-api:
    runs-on: ubuntu-24.04-arm
    # R6 sizes both numbers from the final measurement pair, runs 44657322918 and 44657415021 at
    # 8cfd2682 (dispatch://INFRA-1075, check 6224bb0e), and the dispatch run at each later head,
    # which may raise a limit and never lower one (the architect's rule of 2026-11-20, the issue's
    # open-items.md). The step's --timeout is the smallest whole minute at which its slowest
    # package's slowest reading takes at most half of it: internal/dispatch/api, this job's one
    # package, 1,154.1 s in run 44687712471 at 56f4dabc (job 136126011060), against 1,123.8 s and
    # 1,118.6 s in the pair (run 44657322918, job 136026779922, and run 44657415021, job
    # 136039518473); 1,154.1 / 30 = 38.47, so 39m; database-skips.sh (main's #4456) passes it to
    # go test as -timeout. The job's bound is its slowest time, 1,306 s (run 44687712471, job
    # 136126011060), against 1,270 s and 1,265 s in the pair (jobs 136026779922 and
    # 136039518473), 21.77 minutes, plus that -timeout plus 6: 21.77 + 39 + 6 = 66.77, so 67.
    # Run 44790111577 at 85f6b018 (job 136476756266) read the package at 1,105.3 s and the job at
    # 1,243 s, and run 44846096964 at 28ce7c74 (job 136669775497) at 1,120.9 s and 1,254 s, under
    # those, so neither raised either limit. The limit must fire before the runner cancels the
    # job, so a hung test prints the dump that names it.
    timeout-minutes: 67
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        # The settings these tests need, as the server's own command line, so it starts with them
        # and no step has to restart it; envoy-go's own service says what each of them buys and
        # why this container can do without durability (dispatch://INFRA-1075).
        #
        # max_prepared_transactions is this package's in particular: its
        # TestNoPreparedTransactionHoldsAnEventIDAndTheFloorTrailsOneAnyway prepares a transaction
        # holding the lock an insert into events takes, which is the one writer pg_locks shows
        # with no backend pid. The image's default is 0, and the test refuses to skip in CI.
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=500 -c max_prepared_transactions=20
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 50
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The broker's store, which the package's contract tests open (brokerstoretest.Open in
      # internal/dispatch/api/contract_test.go) and skip without; a skip is a pass, so without this
      # variable they never run under the race detector.
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      # The settings the service's command: asks for, read back from the server itself; envoy-go's
      # own read-back step says why a command is worth reading back.
      - name: Read the disposable service's settings back
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres.id }}" postgres
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # go test counts a skipped test as a pass and, without -v, prints nothing for it, so the
      # package runs through packages/envoy/scripts/database-skips.sh, which runs it with -json
      # and counts that run's skips: it fails on any skip but those its EXPECTED_SKIPS names for
      # this package (measurements and replays that need a database, a corpus or a variable no CI
      # run sets, and a subprocess helper), prints database_skips=UNKNOWN and runs nothing when either
      # database variable above is unset, and on a failed run prints the failed tests' output, a
      # timed-out binary's goroutine dump among it. Its --keep copies that same run's `go test
      # -json` stream to race-api.json under $RUNNER_TEMP/go-test-json, making the directory,
      # which the upload step below publishes: the stream and its -count=1 are envoy-go-race's, for
      # the reason its own step gives, and the log is what the script prints rather than a replay.
      - name: Race-test the Dispatch API
        run: scripts/database-skips.sh --var DISPATCH_TEST_DATABASE_URL --var BROKER_TEST_DATABASE_URL --race --timeout 39m --keep "$RUNNER_TEMP/go-test-json/race-api.json" ./internal/dispatch/api/
        working-directory: packages/envoy
      # Always, and one artifact per run attempt, for the reasons envoy-go's own upload step gives.
      - name: Upload the go test -json stream
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envoy-go-race-api-test-json-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-json/
          if-no-files-found: warn

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go-race-api
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
