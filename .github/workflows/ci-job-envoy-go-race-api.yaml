name: CI job envoy-go-race-api

# The steps of `.github/workflows/ci.yaml#envoy-go-race-api` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go-race-api:
    runs-on: ubuntu-24.04-arm
    # The step's --timeout 70m must fire before the runner cancels the job, so a hung test prints
    # the dump that names it: about 1 minute of setup, up to 5 minutes to compile the race
    # binaries, then the step's own 70 minutes, which is 76, under the job's 90. 70 minutes is
    # twice the longest measured run: the package took 32.6 minutes under the race detector on a
    # dev box, and this job took 32 minutes 48 seconds, past the 30 minutes it had.
    timeout-minutes: 90
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        # Its settings, its /dev/shm and its health check: .github/scripts/postgres-service-settings.sh's header.
        command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c max_connections=1000 -c max_prepared_transactions=10
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-start-period 60s
          --health-start-interval 1s
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOB_TIMEOUT_MINUTES: 90 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The broker's store, which the package's contract tests open (brokerstoretest.Open in
      # internal/dispatch/api/contract_test.go) and skip without; a skip is a pass, so without this
      # variable they never run under the race detector.
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          go-download-base-url: https://go.dev/dl
          token: ''
          cache: false
      # go-envoy-race, restored only, as envoy-go-race restores it.
      # why: .github/ci-notes/ci-caches.md#the-envoy-race-lanes-family
      # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envoy-race-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}
          restore-keys: ${{ format('go-envoy-race-{0}-{1}-', runner.os, runner.arch) }}
      # TestAReadingIsAChildNodeOfTheDecisionItReads runs this tree's dispatch command under bun
      # (runDispatchCLI, internal/dispatch/api/decision_entries_test.go), and fails without it.
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # The settings the service's command: line asks for, read back from the server; why each one
      # is .github/scripts/postgres-service-settings.sh's header.
      - name: Read the service's settings back
        timeout-minutes: 2
        run: .github/scripts/postgres-service-settings.sh "${{ job.services.postgres.id }}" postgres
      - name: Check the service allows this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # The package's tests run 8 at once (apiTestParallelism, server_test.go), each with a
      # database and pools of its own, so this samples the service's connections every 2 s while
      # the next step runs and the step after it prints the peak against max_connections: a change
      # that makes the tests open more at once shows here before it shows as a 53300 refusal. The
      # loop runs in the background past its own step, until the runner ends the job.
      - name: Sample the service's connections while the API's tests run
        run: |
          # shellcheck disable=SC2016 # $1 and $2 are the inner bash's arguments, expanded there
          nohup bash -c 'while :; do docker exec "$1" psql -U postgres -Atc "select count(*) from pg_stat_activity" >> "$2" 2>/dev/null; sleep 2; done' _ "${{ job.services.postgres.id }}" "$RUNNER_TEMP/pg-connections.txt" >/dev/null 2>&1 &
      # go test counts a skipped test as a pass and, without -v, prints nothing for it, so the
      # package runs through packages/envoy/scripts/database-skips.sh, which runs it with -json
      # and counts that run's skips: it fails on any skip but those its EXPECTED_SKIPS names for
      # this package (measurements and replays that need a database, a corpus or a variable no CI
      # run sets, and a subprocess helper), prints database_skips=UNKNOWN and runs nothing when either
      # database variable above is unset, and on a failed run prints the failed tests' output, a
      # timed-out binary's goroutine dump among it.
      - name: Race-test the Dispatch API
        run: scripts/database-skips.sh --var DISPATCH_TEST_DATABASE_URL --var BROKER_TEST_DATABASE_URL --race --timeout 70m ./internal/dispatch/api/
        working-directory: packages/envoy
      - name: Report the service's peak connections
        if: always()
        run: |
          allowed=$(docker exec "${{ job.services.postgres.id }}" psql -U postgres -Atc "show max_connections")
          if [ -s "$RUNNER_TEMP/pg-connections.txt" ]; then
            echo "pg connections: the peak of $(sort -n "$RUNNER_TEMP/pg-connections.txt" | tail -n 1) over $(wc -l < "$RUNNER_TEMP/pg-connections.txt") samples, max_connections ${allowed}"
          else
            echo "pg connections: UNKNOWN, no sample was taken (max_connections ${allowed})"
          fi

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go-race-api
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
