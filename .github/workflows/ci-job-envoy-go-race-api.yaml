name: CI job envoy-go-race-api

# The steps of ci.yaml's `envoy-go-race-api` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries ci.yaml's `toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          ci.yaml's `toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

# A `|` between proxy entries makes a go command fall through to the next source after ANY error,
# where a `,` falls through only after a 404 or a 410 (Go's module reference, "GOPROXY protocol").
# proxy.golang.org reset a download mid-stream and turned a Go lane red on a module whose hash
# go.sum already holds (sjawhar/legion#2512); with `|direct` the command fetches the same bytes
# straight from the source and checks them against go.sum, so this is a second path, not a weaker
# check.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  envoy-go-race-api:
    runs-on: ubuntu-24.04-arm
    # The step's -timeout 30m must fire before the runner cancels the job, so a hung test prints
    # the dump that names it: about 1 minute of setup, up to 5 minutes to compile the race
    # binaries, then the step's own 30 minutes, which is 36.
    timeout-minutes: 45
    # One leg per shard of the package's tests. Run whole, the package
    # took 913 s to 1,527 s of its 1,800-second -timeout on the runners of 2026-11-16 (jobs
    # 133268762448 and 133298210013), over the race lane's bar of 1,080 s, which is 60 % of that
    # timeout: whether the job passed depended on the runner it got. Each
    # leg now runs the shard .github/scripts/go-test-shards.py gives it, a test's shard being
    # crc32(name) mod the leg count, so a test added later lands in exactly one leg and none is
    # kept by hand. The script reads the leg count and this leg's index from the matrix itself
    # (strategy.job-total, strategy.job-index), so this list is the one place the count is
    # written: a leg added here re-splits every shard. Every leg pays the race compile again,
    # about 2.3 minutes, and runs one shard of the package. Measured in run 43903619730 at
    # d61e8261f5: legs 1 to 3 ran 708, 736 and 730 of the 2,174 tests, and their go test took
    # 515.9 s, 476.6 s and 384.8 s, each under the 1,080 s bar.
    # fail-fast is off so one leg's failure leaves the others to name theirs, as one job did.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        # ghcr.io/cybermonklabs/legion/ci, the copy of pgvector/pgvector (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DISPATCH_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      # The broker's store, which the package's contract tests open (brokerstoretest.Open in
      # internal/dispatch/api/contract_test.go) and skip without; a skip is a pass, so without this
      # variable they never run under the race detector.
      BROKER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/envoy/go.mod
          cache: false
      - name: Size the service for this lane's Dispatch processes
        run: .github/scripts/pg-connection-ceiling.sh "${{ job.services.postgres.id }}"
      # The leg's shard of the package. go-test-shards.py builds the race test binary this
      # step's go test then runs (the go test takes every package from the build cache and links
      # once more), lists the binary's tests, proves the legs' -run patterns together select
      # each of them exactly once - failing the step, by test name, on one in no shard or in two
      # - and prints this leg's pattern. The assignment is a line of its own: under bash -e it
      # carries the script's exit status, so a refusal fails the step instead of running
      # -run "", which matches every test.
      - name: Race-test the Dispatch API
        run: |
          pattern=$(../../.github/scripts/go-test-shards.py pattern ${{ strategy.job-index }} ${{ strategy.job-total }} -race ./internal/dispatch/api/)
          go test -count=1 -race -timeout 30m -run "$pattern" ./internal/dispatch/api/
        working-directory: packages/envoy

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        uses: ./.github/actions/ci-ok-report
        with:
          job: envoy-go-race-api
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
