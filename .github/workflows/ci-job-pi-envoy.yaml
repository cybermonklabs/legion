name: CI job pi-envoy

# The steps of `.github/workflows/ci.yaml#pi-envoy` job, in a file of its own.
# ci.yaml's job of the same id calls this file, and that caller keeps `needs: changes` and the
# whole `if:` that decides whether these steps run, so this file carries no `if:` of its own.
#
# The split is for the filters. This job's filter names this file beside ci.yaml, so a change to
# these steps selects this job alone, where a change to ci.yaml selects every job.
#
# The job's last step reports ci-ok for the caller: on a merge-group run this job's own result
# decides, it posts the failing ci-ok at once (.github/actions/ci-ok-report), as every job of
# ci.yaml ends. `ci-ok-changes` carries `.github/workflows/ci.yaml#toJSON(needs.changes)` for it.
on:
  workflow_call:
    inputs:
      ci-ok-changes:
        description: >-
          `.github/workflows/ci.yaml#toJSON(needs.changes)`: end the job with ci-ok's report
          (.github/actions/ci-ok-report), as every job of ci.yaml ends.
        type: string
        required: true

jobs:
  pi-envoy:
    runs-on: ubuntu-24.04
    # At least the job's sum, so that a hook or row that hangs fails by name at the test script's
    # --timeout (package.json) rather than as a job this limit cancels: over the job's 42 green
    # merge-group runs from 2026-11-20T01:35Z to 2026-11-21T08:58Z, its other steps at their
    # longest, 94 s, 5 s of its clock over its steps, and its test step's longest, 406 s
    # (run 44807153227), plus that one guard, 250 s: 755 s, or 13 minutes. 15 leaves the test step
    # room to grow as it did from 285 s on 2026-11-18 to 406 s.
    # Budget (ci-budgets.md's Budgets note): those 15 minutes, 900 s, are the first term, plus the
    # job's slowest retried step alone - the setup-bun step's two `ci_tools_fetch` calls, 3416 s,
    # above the ci-ok report's 2460 s, the tmux install's 625 + 775 = 1400 s, the workspace
    # install's 1050 s and install-omp's 450 s. 900 + 3416 = 4316 s -> 72 min. It carried 80,
    # from install-jj's 3866 s, until main's #4877 took install-jj out of this job.
    timeout-minutes: 72
    env:
      JOB_TIMEOUT_MINUTES: 72 # this job's timeout-minutes, for gh-read.sh's wait (check-workflow-files.sh holds the two equal)
    # The NATS server extensions/card-delivery-omp.test.ts delivers Envoy cards and a person's Send
    # through (LEGION_TEST_NATS_URL on the test step): the 2.10 image the envoy-client job pulls,
    # pinned by digest as this file's other service images are.
    services:
      nats:
        # ghcr.io/cybermonklabs/legion/ci, the copy of nats:2.10 (.github/ci-images.yaml)
        image: ghcr.io/cybermonklabs/legion/ci@sha256:5498ba57b9471840be3d15b033a4eec554d1c02fa6c2cc0ca2d888637f6c6e2f
        ports: ["4222:4222"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its own retry arithmetic, which is the action's: two `ci_tools_fetch` calls,
      # 2 x 1708 = 3416 s (ci-budgets.md's Budgets note) -> 57 min.
      - uses: ./.github/actions/setup-bun
        timeout-minutes: 57
      # extensions/dispatch-first-omp.test.ts, extensions/askgate/askgate-omp.test.ts,
      # extensions/card-delivery-omp.test.ts and extensions/tmux-place-omp.test.ts run the pinned
      # Oh My Pi against stand-ins (packages/pi-shared/test/omp-harness.ts) and refuse on GitHub
      # Actions without one. The pin is read from .omp-pin, the repository's one copy of it
      # (.github/actions/install-omp, which needs no mise and no token).
      # install-omp's own retry arithmetic: its fetch of the release archive,
      # 5 x 60 + 150 = 450 s -> 8 min.
      - uses: ./.github/actions/install-omp
        timeout-minutes: 8
      # extensions/tmux-place-omp.test.ts runs that binary in a pane of a tmux server of its own,
      # the only way the place a session registers can be read from the session itself, and refuses
      # on GitHub Actions without a tmux.
      # Both apt phases retry through .github/scripts/ci-retry.sh, in the spelling the test job's
      # own tmux install carries, for the same runner image and the same indexes; ci-budgets.md's
      # Retries note holds the whole reasoning — the inner `sudo timeout` is what bounds an attempt,
      # the unpack after the download takes no network and stays bare, and
      # `-o APT::Update::Error-Mode=any` is what leaves retry_fetch something to retry.
      - name: Install tmux
        # Its own retry arithmetic, so an exhausted phase fails this step by name rather than
        # being cut part way by the job: the index read's 5 x 95 + 150 = 625 s and the package
        # download's 5 x 125 + 150 = 775 s, 1400 s -> 24 min.
        timeout-minutes: 24
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "apt's package lists" 95 -- \
            sudo timeout 90 apt-get update -o APT::Update::Error-Mode=any >&2
          retry_fetch "tmux" 125 -- \
            sudo timeout 120 apt-get install -y --no-install-recommends -d tmux >&2
          sudo apt-get install -y --no-install-recommends tmux
      # Retried at 180 s per attempt like every Bun install here (ci-budgets.md's Retries note).
      - name: bun install --frozen-lockfile
        # Its own retry arithmetic: 5 x 180 + 150 = 1050 s -> 18 min.
        timeout-minutes: 18
        run: |
          . .github/scripts/ci-retry.sh
          retry_fetch "the workspace's dependencies" 180 -- bun install --frozen-lockfile >&2
      - name: Build contracts for pi-envoy
        run: bun run build
        working-directory: packages/contracts
      - name: Typecheck pi-envoy
        run: bun run typecheck
        working-directory: packages/pi-envoy
      - name: Test pi-envoy
        run: bun run test
        working-directory: packages/pi-envoy
        # LEGION_E2E runs the docker-backed reply-grant row of extensions/envoy.test.ts, which starts
        # a NATS server with an authorization of its own from the image the nats service above
        # pulled (packages/envoy-client/test/nats-server.ts, NATS_IMAGE).
        env:
          LEGION_TEST_NATS_URL: nats://127.0.0.1:4222
          LEGION_E2E: "1"
      # The release's pack (release.yaml's pi_envoy_build job), which is also this job's build: the
      # manifest pointed at the one bundle, then scripts/pi-plugin-prepack.sh, which bundles
      # envoy.ts, writes dist/THIRD_PARTY_NOTICES (failing the pack on a bundled package whose
      # license cannot be determined) and stages this plugin's eleven skills. The listing shows the
      # tarball ships those and nothing of the Legion plugin's: no legion.js, no agents/, none of
      # its skills.
      - name: Pack pi-envoy
        run: |
          jq '.omp.extensions = ["dist/envoy.js"]' package.json > "$RUNNER_TEMP/package.json"
          mv "$RUNNER_TEMP/package.json" package.json
          bun pm pack --destination ../../out/pr-artifacts
          listing=$RUNNER_TEMP/pi-envoy-listing
          tar tzf ../../out/pr-artifacts/*.tgz > "$listing"
          for shipped in package/dist/envoy.js package/dist/THIRD_PARTY_NOTICES package/dist/skills/dispatch/SKILL.md; do
            grep -qxF "$shipped" "$listing" || { echo "::error::the pi-envoy tarball does not ship $shipped"; exit 1; }
          done
          for legion in package/dist/legion.js package/agents/ package/dist/skills/legion-worker/; do
            if grep -qF "$legion" "$listing"; then
              echo "::error::the pi-envoy tarball ships $legion, which is the Legion plugin's"
              exit 1
            fi
          done
        working-directory: packages/pi-envoy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-envoy-pr
          path: out/pr-artifacts/*.tgz

      - name: Report ci-ok when this job decides a merge-group run
        if: always()
        # Its 2580 s: ci-budgets.md's Budgets note, "The ci-ok report".
        timeout-minutes: 43
        env:
          STEP_TIMEOUT_MINUTES: 43 # this step's timeout-minutes, which gh-read.sh's wait stays within as it does the job's
        uses: ./.github/actions/ci-ok-report
        with:
          job: pi-envoy
          changes: ${{ inputs.ci-ok-changes }}
          job-status: ${{ job.status }}
