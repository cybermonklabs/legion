name: Check Dispatch spec files
description: >-
  Checks a repository's Dispatch spec files by the rules of package specgraph: which entries of the
  directory are spec files, how large one may be, and whether the tree of statements, checks,
  components and terms they hold is valid. It builds packages/envoy's spec-check command from this
  repository, with the Go that packages/envoy/go.mod names, and runs `spec-check tree` over a
  directory of the caller's checkout.

  Other repositories call it, pinned by a full commit SHA, in a job without `container:`. Its
  README.md says why, and gives the inputs, the output, the exit statuses and a job to copy.

inputs:
  path:
    description: >-
      The spec directory. A relative path is resolved against the caller's checkout,
      $GITHUB_WORKSPACE, and an absolute path is kept as it is.
    default: .dispatch/spec
  allow-empty:
    description: >-
      `true` accepts an empty directory and a directory that does not exist as the empty tree, since
      git keeps no empty directory, so a mistyped path also passes with a count of 0. Set it only
      while the repository has no spec file.
    default: 'false'

outputs:
  count:
    description: >-
      The number of statements the command read. It is set whenever the command printed its count
      line: on exit 0 (a valid or an empty tree) and on exit 1 (a refused tree).
    value: ${{ steps.run.outputs.count }}

runs:
  using: composite
  steps:
    # The runner fetches this whole repository for the action, and github.action_path is
    # .github/actions/spec-check inside it, so the version comes from this repository's
    # packages/envoy/go.mod and never from the caller's tree.
    - id: setup-go
      name: Install the Go that packages/envoy/go.mod names
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/../../../packages/envoy/go.mod
        go-download-base-url: https://go.dev/dl
        token: ''
        cache: false

    # setup-go adds its `go` problem matcher for the rest of the job, and the runner reads every
    # later line of the job through it, so a line of the check holding `.go: ` would become an
    # error annotation with the author's text. The action builds only this repository's command
    # and needs no Go matcher, so it removes it. The runner keeps one matcher per owner, so this
    # also deletes a `go` matcher an earlier setup-go of the caller's job added (README.md, "The Go
    # toolchain").
    - name: Remove the Go problem matcher setup-go added
      shell: bash
      run: echo "::remove-matcher owner=go::"

    # The cache key carries the SHA-256 of this repository's packages/envoy/go.sum at the pinned
    # commit. The step hashes the file itself: hashFiles() matches only files under
    # $GITHUB_WORKSPACE, and a remote caller's action path is outside it. The hash goes into a
    # variable before it is written, so a go.sum that is missing or cannot be read fails the step.
    # A macOS runner has shasum and can lack sha256sum. Both read the file from standard input, so
    # no file name changes the line they print.
    - id: gosum
      name: Hash packages/envoy/go.sum for the cache key
      shell: bash
      run: |
        f="$GITHUB_ACTION_PATH/../../../packages/envoy/go.sum"
        if command -v sha256sum > /dev/null; then
          sum=$(sha256sum < "$f")
        else
          sum=$(shasum -a 256 < "$f")
        fi
        echo "hash=${sum%% *}" >> "$GITHUB_OUTPUT"

    # The command's own module and build caches, which check.sh points the build at, so an entry
    # holds this build alone and never the caller's caches. On a miss of the exact key, the
    # restore falls back to the newest entry of the same Go version (restore-keys), so the build
    # fetches only the modules that changed. cache-hit is true only for an exact match, so the save
    # step below runs after such a fallback too.
    # why: .github/ci-notes/ci.md#a-cache-restore-comes-before-every-step-that-can-write-a-path-it-names
    - id: cache
      name: Restore the command's module and build caches
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/spec-check/mod
          ${{ runner.temp }}/spec-check/build
        key: spec-check-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ steps.gosum.outputs.hash }}
        restore-keys: spec-check-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

    - name: Build the spec-check command
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/check.sh" build

    # Saves on a miss of the exact key only, and only in a push, schedule or workflow_dispatch run.
    # Any other run, pull_request, pull_request_target, merge_group, issue_comment and workflow_run
    # among them, may hold another person's code, so it restores and never saves. A step runs only
    # after every step above it succeeded, so this one also follows a successful build, and it runs
    # before the check, so a refused tree does not cost the entry.
    - name: Save the command's module and build caches
      if: steps.cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/spec-check/mod
          ${{ runner.temp }}/spec-check/build
        key: ${{ steps.cache.outputs.cache-primary-key }}

    # The inputs reach the script as environment variables and never as text of `run:`, so no
    # input can become shell code. Their names leave out the INPUT prefix, which this
    # repository's Bun pin check reserves for an action's own inputs.
    - id: run
      name: Check the spec files
      shell: bash
      env:
        SPEC_CHECK_PATH: ${{ inputs.path }}
        SPEC_CHECK_ALLOW_EMPTY: ${{ inputs.allow-empty }}
      run: bash "$GITHUB_ACTION_PATH/check.sh" run
