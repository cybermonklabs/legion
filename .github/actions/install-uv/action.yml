name: Install uv
description: >-
  Installs the uv the worker image ships, off PATH, and exports its path as LEGION_TEST_UV for the
  tests that run it; they refuse on GitHub Actions without one.

  The `uv` row of .github/ci-tools.yaml pins the version and the sha256 of the uv binary itself,
  and .github/scripts/check-ci-tools.sh holds that row's version and primary digest to the image's
  own `ARG UV_VERSION` and `ARG UV_SHA256` in packages/daemon/docker/worker.Dockerfile, which is
  what keeps this install and the image on one uv. The row's second source is the uv wheel PyPI
  serves, which holds that same binary, so an outage of GitHub's release assets does not stop the
  job.
runs:
  using: composite
  steps:
    - name: Install the worker image's uv
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck source=.github/scripts/ci-tools.sh
        . "$GITHUB_ACTION_PATH/../../scripts/ci-tools.sh"
        dir="$RUNNER_TEMP/uv"
        mkdir -p "$dir"
        # The row names a `primary_member`, so what reaches this path is the uv binary itself,
        # with the mode mktemp gave it and not the archive's.
        ci_tools_fetch uv "$dir/uv"
        chmod 0755 "$dir/uv"
        "$dir/uv" --version
        echo "LEGION_TEST_UV=$dir/uv" >> "$GITHUB_ENV"
