name: Measure what the runner reports for a step it ends at its bound
description: >-
  Sleeps for longer than the bound of the step that calls it, so the job record and the step after
  it say what a caller step reports when the runner ends it: its wall time, its `outcome` and its
  conclusion.

  This action is temporary. It is the measurement dispatch://INFRA-2605 asks for, and it is
  deleted in that same pull request once the reading is recorded. Nothing else calls it.
runs:
  using: composite
  steps:
    - name: Sleep past the bound the caller declares
      shell: bash
      run: |
        set -euo pipefail
        echo "step-bound-probe: sleeping 180 s against the caller's timeout-minutes: 1"
        sleep 180
        echo "step-bound-probe: slept the whole 180 s, so no bound of the caller ended this step"
