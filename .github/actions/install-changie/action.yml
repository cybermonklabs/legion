name: Install changie
description: >-
  Installs changie, the changelog-fragment tool the packages' .changie.yaml files are written for,
  and puts it on PATH for the job's later steps.

  The `changie` row of .github/ci-tools.yaml, or its `changie-aarch64` row on an arm64 runner,
  names the version, the one sha256 of the whole release tarball that both sources are checked
  against, and the second source this install reads when GitHub's release assets do not serve the
  bytes: the copy of that tarball in ghcr.io/cybermonklabs/legion/ci.
runs:
  using: composite
  steps:
    - name: Install changie
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck source=.github/scripts/ci-tools.sh
        . "$GITHUB_ACTION_PATH/../../scripts/ci-tools.sh"
        machine=$(uname -m)
        case "$machine" in
          x86_64) row=changie ;;
          aarch64 | arm64) row=changie-aarch64 ;;
          *)
            echo "::error::install-changie: .github/ci-tools.yaml holds no changie row for a $machine runner" >&2
            exit 1
            ;;
        esac
        tarball="$RUNNER_TEMP/$(basename "$(ci_tools_field "$row" primary)")"
        ci_tools_fetch "$row" "$tarball"
        mkdir -p "$RUNNER_TEMP/changie"
        tar -xzf "$tarball" -C "$RUNNER_TEMP/changie"
        echo "$RUNNER_TEMP/changie" >> "$GITHUB_PATH"
