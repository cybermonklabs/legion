name: Setup Bun
description: >-
  Install the Bun version .bun-version locks. Every job installs Bun through this action, and
  .github/scripts/check-bun-version.sh fails any workflow that reaches for oven-sh/setup-bun
  directly, so a new input — a literal bun-version, a bun-download-url — cannot quietly win over
  the file.

  Bun is a toolchain, so CI runs the version this repository locks rather than whatever is
  latest: an unpinned runner moved to 1.4.2 and segfaulted `bun test` intermittently (8 crashes
  in 60 runs against 2 in 60 on the pinned version, same tree, four cores). Raising Bun is two
  commits: the new version's row in .github/ci-images.yaml first, then .bun-version, the
  `ARG BUN_VERSION` default of packages/daemon/docker/worker.Dockerfile and every `FROM`, with
  the three bun-* rows of .github/ci-tools.yaml moving in that second commit beside .bun-version.

  The bun-cache step restores on every ref: it reads the `bun` cache family, one entry holding
  ~/.bun/bin keyed on the runner's operating system, its architecture, the build variant the
  bun-pin step read and the pinned version. no-cache: true runs on every ref too, so
  oven-sh/setup-bun writes no entry of its own and reads none — an entry a pull request writes
  is readable by no other pull request, and the family above is the one copy worth keeping. On a
  hit setup-bun finds ~/.bun/bin/bun, reads its `bun --revision`, takes it as an existing
  installation of the version this file names, and downloads nothing: the release asset it
  fetches on a miss is 51,794,595 bytes. That branch of setup-bun runs before any cache logic of
  its own, which is why no-cache: true does not cost the restore.

  The bun-cache-save step is what writes that family, on a push to main alone, since only an
  event that writes the default branch's cache scope leaves an entry every later run can read.
  ci.yaml runs on no push, so no job of the router writes it; the entry comes from the workflows
  that do run on that push — ci-caches.yaml, whose browsers job calls this action on every one
  of them, docs-pages.yaml (through docs-site.yaml), release.yaml and
  release-envoy-listener.yaml.

  ci.yaml's tool-fallback and tool-fallback-arm jobs restore nothing: both prove what an install
  reads when the release asset serves nothing, and a Bun the Actions cache restored would be
  bytes no case of theirs installed. `github.job` is the id of the job that called this action,
  so those two are held out of the cache by their own ids and no other job loses an entry.

  Bun has a second source, because oven-sh/setup-bun reads one: the npm package upstream
  publishes the same binary in, which needs no copy of ours and which every job already reaches
  for `bun install`.
  The bun-second-source step reads it when neither the cache nor the release asset left a Bun of
  the pinned version behind, and the last step checks the installed binary's sha256 against the
  row .github/ci-tools.yaml holds for this runner's Bun, whichever source served the bytes —
  oven-sh/setup-bun verifies no checksum of its own.
  Both of a row's source words come from that row, through `ci_tools_source_name`, so this
  action writes none of its own and a row that moves to another second source moves every line
  that names it.
  Two words are this action's own and no row's, because neither is a store an install can fetch
  a tool from: `cache`, where the bun-cache step restored Bun from this repository's Actions
  cache, and `existing-install`, where a Bun of the pinned version was already at
  ~/.bun/bin/bun when this action started and oven-sh/setup-bun kept it.
  setup-bun keeps both of those and reports a cache hit for either, so neither word is read from
  it: `cache` is the restore step's own hit, and `existing-install` is what the bun-already-here
  step finds at that path once the restore has had its turn — a Bun of the pinned version that
  this action's restore did not serve.
  A second call of this action in one job, and an image that ships Bun, are `existing-install`,
  so a refusal of those bytes names what served them.
  .github/scripts/ci-tools.sh's header holds the list of the words a line may say and the ones a
  manifest row may hold.

  A refusal leaves no tool behind, and that holds for each of the two steps that can refuse.
  The last step removes the binary it refused at the path `command -v bun` gave it, the bunx
  beside it, and the pair in ~/.bun/bin where the refused one came from elsewhere, and it names
  the paths it removed and any it could not, so what it says is true of the filesystem.
  The bun-second-source step removes the unpinned bun in ~/.bun/bin and the bunx beside it
  before it fetches, because a second source that refuses ends that step and the last step never
  runs at all.
  Where the fetch serves the bytes, that step links bunx to the bun it installed again: the
  fetch writes the bun alone, the link is the one oven-sh/setup-bun makes before it downloads
  anything, and every `bunx` of a later step resolves through it.
  ~/.bun/bin is on this job's PATH from the setup-bun step, so either way no later step of the
  job runs a bun no digest answers for, under either name.

runs:
  using: composite
  steps:
    # The pin, as part of the cache key. Read with tr rather than `cat`, so a trailing carriage
    # return or a stray space in the file cannot reach the key: a key is matched byte for byte,
    # and the mismatch would show only as a restore that never hits.
    #
    # The build variant is the other part, and it is read the way setup-bun reads it: for one
    # Bun version on linux x64 it downloads bun-linux-x64-baseline.zip where /proc/cpuinfo holds
    # no avx2 and bun-linux-x64.zip where it does, so two different binaries answer to one
    # version. Its own adoption test does not tell them apart — isVersionMatch splits
    # `bun --revision` at `+` and compares the version alone — so an entry saved from one kind of
    # runner is adopted on the other without a word: a baseline binary runs on an avx2 machine
    # and merely costs it the faster build, while an avx2 binary on a machine without it dies on
    # an illegal instruction. A file this step cannot read is taken as no avx2, which is
    # setup-bun's own fallback, so the two agree on which asset the key names even then.
    - id: bun-pin
      shell: bash
      run: |
        echo "version=$(tr -d '[:space:]' < .bun-version)" >> "$GITHUB_OUTPUT"
        variant=''
        if [ "$RUNNER_OS" = Linux ] && [ "$RUNNER_ARCH" = X64 ] && ! grep -q avx2 /proc/cpuinfo 2>/dev/null; then
          variant='-baseline'
        fi
        echo "variant=$variant" >> "$GITHUB_OUTPUT"

    # One entry per runner architecture, build variant and Bun version, and no restore-keys: a
    # near-miss Go module cache is still most of a module cache, while a Bun binary of another
    # version is one setup-bun rejects after paying for the restore.
    #
    # runner.arch is in the key because one job of this repository's CI runs on arm64 —
    # release-envoy-listener.yaml's docker job builds its arm64 leg on ubuntu-24.04-arm — and an
    # entry is written once and never replaced. Without it the two architectures share one key,
    # and which way the restore is wrong is then decided by whichever ran first: an x64 binary
    # restored on the arm leg leaves `bun --revision` failing, so that leg downloads the release
    # asset on every run and the restore buys it nothing; and an arm64 binary saved first on a
    # push to main leaves every x64 job restoring a binary it cannot run and downloading too,
    # with no way to replace the entry. With it, each architecture keeps an entry of its own.
    #
    # Every job but the two that prove the second source. ci.yaml's tool-fallback and
    # tool-fallback-arm fault every source they can reach and then read what each case
    # installed, and a Bun this step restored is one no case of theirs installed — the Actions
    # cache is served by hosts no fault proxy of this repository holds, so nothing of theirs
    # stands in its way. The expression holds this step back rather than passing `no-cache`
    # below, which is what it took when setup-bun's own cache was the only one: that input is
    # true on every ref here, so this restore is the one cache a job of theirs could be served
    # from. `github.job` is the id of the job that called this action, so the two are named by
    # their own ids and no other job loses an entry.
    - id: bun-cache
      if: ${{ !startsWith(github.job, 'tool-fallback') }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/bin
        key: bun-${{ runner.os }}-${{ runner.arch }}${{ steps.bun-pin.outputs.variant }}-${{ steps.bun-pin.outputs.version }}

    # oven-sh/setup-bun reports a cache hit for two different things: a Bun this action's
    # restore above put at ~/.bun/bin/bun, and a Bun of the pinned version that was already
    # there, both of which it keeps and logs as `Using existing Bun installation`. Only a step
    # that runs before it can tell those apart, which is what this one is for: the word the
    # bun-second-source step writes, and the word a refusal of the last step names, are read
    # from what it finds. Without it a second call of this action in one job says `cache` over
    # bytes no cache served — job 128864748583 of run 42524376194 refused the npm install of an
    # earlier call under that word.
    # The restore runs before this step, so a Bun it served would answer the test below as an
    # install that was already here, which is a false word in a refusal: the hit the restore
    # reports is subtracted, and what is left is a bun this action did not put there. The hit of
    # a step that was skipped is empty, so a tool-fallback job, whose restore does not run,
    # reads its own leftovers as the existing install they are.
    # The test is narrower than that action's (an executable file whose `--revision` is the
    # pinned version), so this step says `true` only for installs that action keeps.
    # `true` or `false` is the whole output: nothing a bun printed reaches $GITHUB_OUTPUT, where
    # a second line would be a second output of this step.
    - id: bun-already-here
      name: Read whether a Bun of the pinned version is already installed
      shell: bash
      run: |
        set -euo pipefail
        pinned=$(tr -d '[:space:]' < .bun-version)
        existing=false
        if [ "${{ steps.bun-cache.outputs.cache-hit }}" != 'true' ] && [ -x "$HOME/.bun/bin/bun" ]; then
          revision=$("$HOME/.bun/bin/bun" --revision) || revision=
          [ "${revision%%+*}" != "$pinned" ] || existing=true
        fi
        printf 'existing=%s\n' "$existing" >> "$GITHUB_OUTPUT"

    # A failed download here is an outage of GitHub's release assets, not a reason to fail the
    # job: the step after this one installs the same binary from the second source. The action
    # puts ~/.bun/bin on $GITHUB_PATH before it downloads anything, and a runner applies a step's
    # $GITHUB_PATH whether that step succeeded or failed, so every later step finds a bun there
    # either way.
    # no-cache is unconditional, on main and off it: the cache this action reads is the
    # bun-cache step's above, and setup-bun's own is off, so the two can hold no disagreeing
    # copies of Bun and the only key in play is one this repository writes. What this step
    # adopts as an existing installation is therefore what that restore served or what the
    # runner already had, and never bytes a cache of its own kept.
    - id: setup-bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      continue-on-error: true
      with:
        bun-version-file: .bun-version
        no-cache: true

    - id: bun-second-source
      name: Install Bun from npm when the release asset did not serve it
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck source=.github/scripts/ci-tools.sh
        . "$GITHUB_ACTION_PATH/../../scripts/ci-tools.sh"
        # The row is chosen the way oven-sh/setup-bun chooses its asset, so both sources serve
        # the same build: an x86_64 CPU without avx2 takes the baseline one, and a /proc/cpuinfo
        # this step cannot read counts as having no avx2, which is that action's own fallback.
        machine=$(uname -m)
        case "$machine" in
          x86_64)
            if grep -q avx2 /proc/cpuinfo 2> /dev/null; then
              row=bun-linux-x64
            else
              row=bun-linux-x64-baseline
            fi
            ;;
          aarch64 | arm64) row=bun-linux-aarch64 ;;
          *)
            echo "::error::setup-bun: .github/ci-tools.yaml holds no Bun row for a $machine runner" >&2
            exit 1
            ;;
        esac
        # What decides this is the filesystem, not whether the step above was green: a cached
        # Bun of the pinned version is as good as a downloaded one, and a step that exited 0
        # having installed something else is not.
        pinned=$(tr -d '[:space:]' < .bun-version)
        revision=
        if [ -x "$HOME/.bun/bin/bun" ]; then
          revision=$("$HOME/.bun/bin/bun" --revision) || revision=
        fi
        if [ -n "$revision" ] && [ "${revision%%+*}" = "$pinned" ]; then
          # Which of the three served those bytes. oven-sh/setup-bun keeps a Bun of the pinned
          # version that is already at that path, whether this action's restore put it there or
          # it was on the runner first, and reports a cache hit for either, so the two steps
          # that ran before it are what separate them: `cache` where the bun-cache step hit,
          # and its key holds the pinned version and the build variant, `existing-install`
          # where that step served no entry and bun-already-here found a Bun of that version
          # there all the same. Neither word is a row's, because neither is a store an install
          # can fetch a tool from, and .github/scripts/ci-tools.sh's header is where both are
          # written down; the release asset is every row's primary, so that word is read from
          # the row.
          if [ "${{ steps.bun-cache.outputs.cache-hit }}" = 'true' ]; then
            source=cache
          elif [ "${{ steps.bun-already-here.outputs.existing }}" = 'true' ]; then
            source=existing-install
          else
            source=$(ci_tools_source_name "$row" primary)
          fi
          echo "setup-bun: $source served Bun $pinned, so this step installs nothing"
        else
          source=$(ci_tools_source_name "$row" second)
          echo "setup-bun: no Bun $pinned at $HOME/.bun/bin/bun, so the second source serves it"
          # Whatever is at that path is not the pinned version — that is what this branch was
          # chosen on — and no step has held it to the row's digest. Both names go, and they go
          # before the fetch and not after: a second source that refuses ends this step under
          # errexit, and the last step, the one that takes a refused bun away, never runs. The
          # bun and the bunx would then stay in ~/.bun/bin, which the setup-bun step put on this
          # job's PATH, where a later step whose `if:` is `always()` would find them.
          rm -f "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"
          mkdir -p "$HOME/.bun/bin"
          # The fetch's own destination, so the 107 MB binary is written once and not three
          # times. The trust boundary is where it was: .github/scripts/ci-tools.sh verifies the
          # digest before it moves the bytes to this path, and removes its own temporary on
          # every path that refuses, so nothing unverified is ever at this name.
          ci_tools_fetch_fallback "$row" "$HOME/.bun/bin/bun"
          chmod 0755 "$HOME/.bun/bin/bun"
          # The bunx link again, which the fetch does not make: it writes the bun alone, and
          # the link the removal above took away is the one oven-sh/setup-bun makes before it
          # downloads anything, so without this line `command -v bunx` finds nothing after an
          # install from the second source and every `bunx` of a later step fails.
          # It is made after the bytes passed the row's digest, and the removal takes the pair
          # rather than the bun alone because what sits at the bunx name need not be a link to
          # the bun beside it: a copy of another binary, or a link to one elsewhere, would
          # outlive a second source that refuses and stay runnable on this job's PATH. Either
          # way this name ends as a link to the bun this step installed.
          ln -sfn "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"
        fi
        printf 'row=%s\nsource=%s\n' "$row" "$source" >> "$GITHUB_OUTPUT"

    # What the two steps above left in ~/.bun/bin, kept for every later run: on a push to main
    # for the scope reason the description gives, and only where the restore missed, since an
    # entry already under this key is never replaced and re-uploading 51,794,595 bytes would buy
    # nothing. A job whose restore was skipped reports no hit at all, which reads as a miss
    # here; the two jobs that skip it run in ci.yaml, which runs on no push, so neither reaches
    # this step.
    # It runs before the digest check rather than after it because the check is this action's
    # last step and has to stay that way: a step after it runs with the bun it allowed on PATH,
    # which is what rule 9 of .github/scripts/check-bun-version.sh refuses. So an entry can be
    # written from bytes that the next step then refuses — and that entry is refused again, by
    # that same step, on every later run that restores it, since the check reads whatever is on
    # PATH and names `cache` as the source. The run that wrote it fails; no run that reads it
    # passes.
    - id: bun-cache-save
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/bin
        key: bun-${{ runner.os }}-${{ runner.arch }}${{ steps.bun-pin.outputs.variant }}-${{ steps.bun-pin.outputs.version }}

    - name: Check the installed Bun is the pinned binary
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck source=.github/scripts/ci-tools.sh
        . "$GITHUB_ACTION_PATH/../../scripts/ci-tools.sh"
        bun=$(command -v bun) || bun=
        if [ -z "$bun" ]; then
          echo "::error::setup-bun: no bun is on this job's PATH, so neither source installed one" >&2
          exit 1
        fi
        echo "setup-bun: checking $bun"
        # The one check this action cannot run before the install: the bytes it must hold are
        # the ones the restore or oven-sh/setup-bun already put at ~/.bun/bin, and that action
        # puts ~/.bun/bin on the job's PATH itself, before it downloads them. A refused binary
        # left there is one a later step of the same job runs —
        # .github/workflows/dispatch-browser.yaml runs `bunx playwright merge-reports` in a step
        # whose `if:` is `always()` — so the refusal takes the binary away. ci_tools_verify
        # leaves the file where it is, by design, and this is the call site that owns it.
        if ! ci_tools_verify "${{ steps.bun-second-source.outputs.row }}" "$bun" "${{ steps.bun-second-source.outputs.source }}"; then
          # Every bun this refusal takes away: the one it refused, at the path it was found at,
          # the bunx beside it, and the pair in ~/.bun/bin where the refused one came from
          # somewhere else, since nothing held that pair to the row either and the setup-bun
          # step put that directory on this job's PATH. Removing the refused file is the choice
          # taken over refusing a bun outside ~/.bun/bin and leaving it where it is: a refusal
          # that leaves the binary a later step runs is the state this action exists to prevent.
          # A bunx is a symbolic link to the bun beside it, and a link whose target this loop
          # has already removed answers -e with false, so each path is read as a link too.
          removed=
          left=
          for path in "$bun" "$(dirname -- "$bun")/bunx" "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"; do
            [ -e "$path" ] || [ -L "$path" ] || continue
            rm -f -- "$path" || true
            if [ -e "$path" ] || [ -L "$path" ]; then
              left="$left $path"
            else
              removed="$removed $path"
            fi
          done
          # What this shell ran as bun is in its own hash table, so the table is dropped before
          # the path is read again: this sentence is about the filesystem, not about a name
          # this step looked up before it removed the file.
          hash -r
          still=$(command -v bun) || still=
          message="setup-bun: the bun at $bun is not the binary the ${{ steps.bun-second-source.outputs.row }} row pins, so this step refused it."
          # `removed` is empty only where every rm failed, which the sentence below says: the
          # bun this refusal was given came from `command -v bun`, so a file was at that path.
          if [ -n "$removed" ]; then
            message="$message It removed${removed}, so no later step of this job runs them."
          fi
          if [ -n "$left" ]; then
            message="$message It could not remove${left}, which stay on this job's PATH."
          fi
          if [ -n "$still" ]; then
            message="$message A bun this action did not install is still on this job's PATH at $still."
          fi
          echo "::error::$message" >&2
          exit 1
        fi
