name: Setup Bun
description: >-
  Install the Bun version .bun-version locks. Every job installs Bun through this action, and
  .github/scripts/check-bun-version.sh fails any workflow that reaches for oven-sh/setup-bun
  directly, so a new input — a literal bun-version, a bun-download-url — cannot quietly win over
  the file.

  Bun is a toolchain, so CI runs the version this repository locks rather than whatever is
  latest: an unpinned runner moved to 1.4.2 and segfaulted `bun test` intermittently (8 crashes
  in 60 runs against 2 in 60 on the pinned version, same tree, four cores). Raising Bun is two
  commits: the new version's row in .github/ci-images.yaml first, then .bun-version, the
  `ARG BUN_VERSION` default of packages/daemon/docker/worker.Dockerfile and every `FROM`, with
  the three bun-* rows of .github/ci-tools.yaml moving in that second commit beside .bun-version.

  Bun has a second source, because oven-sh/setup-bun reads one: the npm package upstream
  publishes the same binary in, which needs no copy of ours and which every job already reaches
  for `bun install`.
  The third step reads it when the release asset left no Bun of the pinned version behind, and
  the fourth step checks the installed binary's sha256 against the row .github/ci-tools.yaml
  holds for this runner's Bun, whichever source served the bytes — oven-sh/setup-bun verifies no
  checksum of its own.
  Both of a row's source words come from that row, through `ci_tools_source_name`, so this
  action writes none of its own and a row that moves to another second source moves every line
  that names it.
  Two words are this action's own and no row's, because neither is a store an install can fetch
  a tool from: `cache`, where oven-sh/setup-bun restored Bun from this repository's Actions
  cache, and `existing-install`, where a Bun of the pinned version was already at
  ~/.bun/bin/bun when this action started and oven-sh/setup-bun kept it.
  That action reports a cache hit for both of those, so the first step reads what is at that
  path before anything installs and the third step tells the two apart.
  A second call of this action in one job, and an image that ships Bun, are `existing-install`,
  so a refusal of those bytes names what served them.
  .github/scripts/ci-tools.sh's header holds the list of the words a line may say and the ones a
  manifest row may hold.

  A refusal leaves no tool behind, and that holds for each of the two steps that can refuse.
  The fourth step removes the binary it refused at the path `command -v bun` gave it, the bunx
  beside it, and the pair in ~/.bun/bin where the refused one came from elsewhere, and it names
  the paths it removed and any it could not, so what it says is true of the filesystem.
  The third step removes the unpinned bun in ~/.bun/bin and the bunx beside it before it
  fetches, because a second source that refuses ends that step and the fourth step never runs
  at all.
  Where the fetch serves the bytes, that step links bunx to the bun it installed again: the
  fetch writes the bun alone, the link is the one oven-sh/setup-bun makes before it downloads
  anything, and every `bunx` of a later step resolves through it.
  ~/.bun/bin is on this job's PATH from the second step, so either way no later step of the job
  runs a bun no digest answers for, under either name.

  A run off main passes no-cache, so only a run on main saves: an entry a pull request writes is
  readable by no other pull request. ci.yaml runs on no push, so the entry comes from the
  workflows that do run on main — claude-envoy-rebuild.yaml, docs-pages.yaml (through
  docs-site.yaml), e2e.yaml (its nightly schedule, which GitHub starts from the default branch
  alone), release.yaml and release-envoy-listener.yaml — and from a dispatch of ci.yaml on main.
  no-cache is setup-bun's only cache input and also skips the restore, so a run off main
  downloads Bun (about 34 MB) instead of restoring it.

runs:
  using: composite
  steps:
    # oven-sh/setup-bun reports a cache hit for two different things: a restore from this
    # repository's Actions cache, and a Bun of the pinned version already at ~/.bun/bin/bun,
    # which it keeps and logs as `Using existing Bun installation`. Only a step that runs before
    # it can tell those apart, which is what this one is for: the word the third step writes,
    # and the word a refusal of the fourth step names, are read from what it finds. Without it a
    # second call of this action in one job says `cache` over bytes no cache served — job
    # 128864748583 of run 42524376194 refused the npm install of an earlier call under that
    # word.
    # The test is the one that action makes — a file at that path whose `--revision` is the
    # pinned version — so this step says `true` for exactly the installs it keeps.
    # `true` or `false` is the whole output: nothing a bun printed reaches $GITHUB_OUTPUT, where
    # a second line would be a second output of this step.
    - id: bun-already-here
      name: Read whether a Bun of the pinned version is already installed
      shell: bash
      run: |
        set -euo pipefail
        pinned=$(tr -d '[:space:]' < .bun-version)
        existing=false
        if [ -x "$HOME/.bun/bin/bun" ]; then
          revision=$("$HOME/.bun/bin/bun" --revision) || revision=
          [ "${revision%%+*}" != "$pinned" ] || existing=true
        fi
        printf 'existing=%s\n' "$existing" >> "$GITHUB_OUTPUT"

    # A failed download here is an outage of GitHub's release assets, not a reason to fail the
    # job: the step after this one installs the same binary from the second source. The action
    # puts ~/.bun/bin on $GITHUB_PATH before it downloads anything, and a runner applies a step's
    # $GITHUB_PATH whether that step succeeded or failed, so every later step finds a bun there
    # either way.
    - id: setup-bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      continue-on-error: true
      with:
        bun-version-file: .bun-version
        no-cache: ${{ github.ref != 'refs/heads/main' }}

    - id: bun-second-source
      name: Install Bun from npm when the release asset did not serve it
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck source=.github/scripts/ci-tools.sh
        . "$GITHUB_ACTION_PATH/../../scripts/ci-tools.sh"
        # The row is chosen the way oven-sh/setup-bun chooses its asset, so both sources serve
        # the same build: an x86_64 CPU without avx2 takes the baseline one, and a /proc/cpuinfo
        # this step cannot read counts as having no avx2, which is that action's own fallback.
        machine=$(uname -m)
        case "$machine" in
          x86_64)
            if grep -q avx2 /proc/cpuinfo 2> /dev/null; then
              row=bun-linux-x64
            else
              row=bun-linux-x64-baseline
            fi
            ;;
          aarch64 | arm64) row=bun-linux-aarch64 ;;
          *)
            echo "::error::setup-bun: .github/ci-tools.yaml holds no Bun row for a $machine runner" >&2
            exit 1
            ;;
        esac
        # What decides this is the filesystem, not whether the step above was green: a cached
        # Bun of the pinned version is as good as a downloaded one, and a step that exited 0
        # having installed something else is not.
        pinned=$(tr -d '[:space:]' < .bun-version)
        revision=
        if [ -x "$HOME/.bun/bin/bun" ]; then
          revision=$("$HOME/.bun/bin/bun" --revision) || revision=
        fi
        if [ -n "$revision" ] && [ "${revision%%+*}" = "$pinned" ]; then
          # Which of the three served those bytes. oven-sh/setup-bun keeps a Bun of the pinned
          # version that was already at that path and reports a cache hit for it, exactly as it
          # does for a restore from this repository's Actions cache, so the step before it is
          # what separates the two: `existing-install` where that Bun was there first, `cache`
          # where no bun was and that action restored one. Neither word is a row's, because
          # neither is a store an install can fetch a tool from, and
          # .github/scripts/ci-tools.sh's header is where both are written down; the release
          # asset is every row's primary, so that word is read from the row.
          if [ "${{ steps.bun-already-here.outputs.existing }}" = 'true' ]; then
            source=existing-install
          elif [ "${{ steps.setup-bun.outputs.cache-hit }}" = 'true' ]; then
            source=cache
          else
            source=$(ci_tools_source_name "$row" primary)
          fi
          echo "setup-bun: $source served Bun $pinned, so this step installs nothing"
        else
          source=$(ci_tools_source_name "$row" second)
          echo "setup-bun: no Bun $pinned at $HOME/.bun/bin/bun, so the second source serves it"
          # Whatever is at that path is not the pinned version — that is what this branch was
          # chosen on — and no step has held it to the row's digest. Both names go, and they go
          # before the fetch and not after: a second source that refuses ends this step under
          # errexit, and the fourth step, the one that takes a refused bun away, never runs. The
          # bun and the bunx would then stay in ~/.bun/bin, which the second step put on this
          # job's PATH, where a later step whose `if:` is `always()` would find them.
          rm -f "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"
          mkdir -p "$HOME/.bun/bin"
          # The fetch's own destination, so the 107 MB binary is written once and not three
          # times. The trust boundary is where it was: .github/scripts/ci-tools.sh verifies the
          # digest before it moves the bytes to this path, and removes its own temporary on
          # every path that refuses, so nothing unverified is ever at this name.
          ci_tools_fetch_fallback "$row" "$HOME/.bun/bin/bun"
          chmod 0755 "$HOME/.bun/bin/bun"
          # The bunx link again, which the fetch does not make: it writes the bun alone, and
          # the link the removal above took away is the one oven-sh/setup-bun makes before it
          # downloads anything, so without this line `command -v bunx` finds nothing after an
          # install from the second source and every `bunx` of a later step fails.
          # It is made after the bytes passed the row's digest, and the removal takes the pair
          # rather than the bun alone because what sits at the bunx name need not be a link to
          # the bun beside it: a copy of another binary, or a link to one elsewhere, would
          # outlive a second source that refuses and stay runnable on this job's PATH. Either
          # way this name ends as a link to the bun this step installed.
          ln -sfn "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"
        fi
        printf 'row=%s\nsource=%s\n' "$row" "$source" >> "$GITHUB_OUTPUT"

    - name: Check the installed Bun is the pinned binary
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck source=.github/scripts/ci-tools.sh
        . "$GITHUB_ACTION_PATH/../../scripts/ci-tools.sh"
        bun=$(command -v bun) || bun=
        if [ -z "$bun" ]; then
          echo "::error::setup-bun: no bun is on this job's PATH, so neither source installed one" >&2
          exit 1
        fi
        echo "setup-bun: checking $bun"
        # The one check this action cannot run before the install: the bytes it must hold are
        # the ones oven-sh/setup-bun already put at ~/.bun/bin, and that action puts ~/.bun/bin
        # on the job's PATH itself, before it downloads them. A refused binary left there is one
        # a later step of the same job runs — .github/workflows/dispatch-browser.yaml runs
        # `bunx playwright merge-reports` in a step whose `if:` is `always()` — so the refusal
        # takes the binary away. ci_tools_verify leaves the file where it is, by design, and
        # this is the call site that owns it.
        if ! ci_tools_verify "${{ steps.bun-second-source.outputs.row }}" "$bun" "${{ steps.bun-second-source.outputs.source }}"; then
          # Every bun this refusal takes away: the one it refused, at the path it was found at,
          # the bunx beside it, and the pair in ~/.bun/bin where the refused one came from
          # somewhere else, since nothing held that pair to the row either and the second step
          # put that directory on this job's PATH. Removing the refused file is the choice taken
          # over refusing a bun outside ~/.bun/bin and leaving it where it is: a refusal that
          # leaves the binary a later step runs is the state this action exists to prevent.
          # A bunx is a symbolic link to the bun beside it, and a link whose target this loop
          # has already removed answers -e with false, so each path is read as a link too.
          removed=
          left=
          for path in "$bun" "$(dirname -- "$bun")/bunx" "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"; do
            [ -e "$path" ] || [ -L "$path" ] || continue
            rm -f -- "$path" || true
            if [ -e "$path" ] || [ -L "$path" ]; then
              left="$left $path"
            else
              removed="$removed $path"
            fi
          done
          # What this shell ran as bun is in its own hash table, so the table is dropped before
          # the path is read again: this sentence is about the filesystem, not about a name
          # this step looked up before it removed the file.
          hash -r
          still=$(command -v bun) || still=
          message="setup-bun: the bun at $bun is not the binary the ${{ steps.bun-second-source.outputs.row }} row pins, so this step refused it."
          # `removed` is empty only where every rm failed, which the sentence below says: the
          # bun this refusal was given came from `command -v bun`, so a file was at that path.
          if [ -n "$removed" ]; then
            message="$message It removed${removed}, so no later step of this job runs them."
          fi
          if [ -n "$left" ]; then
            message="$message It could not remove${left}, which stay on this job's PATH."
          fi
          if [ -n "$still" ]; then
            message="$message A bun this action did not install is still on this job's PATH at $still."
          fi
          echo "::error::$message" >&2
          exit 1
        fi
