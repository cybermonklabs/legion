name: Upload a job's gotestsum reports
description: >-
  Uploads every jsonfile and rerun report the `.github/scripts/go-test.sh` calls of one job, or of
  one leg of a job, left under $RUNNER_TEMP/go-test-reports, as the artifact go-test-<name>, which
  ci.yaml's ci-ok job downloads with every other go-test-* artifact to name each test that passed
  only on its retry (.github/actions/ci-ok-retries). <name> is the job's id, with its leg where it
  runs in legs, so no two jobs or legs of a run upload under one name. The name carries no run
  attempt and the upload overwrites, so a re-run of one leg replaces what its earlier attempt
  uploaded. Use it as the step right before the job's last, the ci-ok report, with `if: always()`,
  so a failed step's reports reach ci-ok too.
inputs:
  name:
    description: The job's id, with `-<leg>` where the job runs in legs.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: go-test-${{ inputs.name }}
        path: |
          ${{ runner.temp }}/go-test-reports/*.json
          ${{ runner.temp }}/go-test-reports/*.rerun-fails.txt
        if-no-files-found: warn
        overwrite: true
