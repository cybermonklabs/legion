name: Install jj
description: >-
  Installs the jj the worker image ships, the fork pinned by `ARG JJ_TOOL` in
  packages/daemon/docker/worker.Dockerfile: the binary itself at ~/.local/bin/jj, on PATH for later
  steps. Provisioning's tests give jj a fresh XDG_CONFIG_HOME, as a pod's init container has, so
  the binary is installed itself and never through a tool manager's shim. Needs the repository
  checked out, and an x86_64 or an aarch64 runner: those are the builds .github/ci-tools.yaml holds
  rows for, `mise` and `jj` for the one and `mise-aarch64` and `jj-aarch64` for the other.

  Both tools come through .github/scripts/ci-tools.sh, so this action names no URL and no digest
  of its own, reads no token and makes no GitHub API call. jj is the release tarball the `jj` row's
  `primary` names, held to that row's `primary_digest` (the `ARG JJ_SHA256` the worker image's
  tools stage checks) before the binary is taken out of it and held to the row's `digest`. Until
  2026-11-21 this action installed jj with `mise install`, whose github backend reads the release
  through the API with the run's GITHUB_TOKEN; that token's hourly budget is shared by every job of
  this repository's CI.

  The row's second source, the copy of the binary in the package .github/ci-tools.yaml names, is
  read only after a transport failure of the primary, which the helper's log line names, and the
  copy is held to the same `digest`. A digest that does not match on either side fails the step
  naming the source that served the bytes, and nothing falls through to another source.

  mise itself is installed too, from the `mise` row, which .github/scripts/check-ci-tools.sh holds
  to the `ARG MISE_SHA256` the Dockerfile pins, so this action and the worker image's own `tools`
  stage install the one mise. It stays at ~/.local/bin/mise, on PATH for later steps.

  A refusal leaves no tool behind: the helper checks the bytes before it writes the destination,
  and ~/.local/bin/jj, which is on PATH for every later step of the job, is written only after
  that check passed.
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        set -euo pipefail
        machine=$(uname -m)
        case "$machine" in
          x86_64) mise_row=mise ;;
          aarch64 | arm64) mise_row=mise-aarch64 ;;
          *)
            echo "this action installs the x86_64 and aarch64 builds alone, and .github/ci-tools.yaml holds no row for a $machine runner" >&2
            exit 1
            ;;
        esac
        # shellcheck source=.github/scripts/ci-tools.sh
        . "$GITHUB_ACTION_PATH/../../scripts/ci-tools.sh"
        dir="$RUNNER_TEMP/mise-install"
        mkdir -p "$dir"
        archive="$dir/$(basename "$(ci_tools_field "$mise_row" primary)")"
        ci_tools_fetch "$mise_row" "$archive"
        tar -xzf "$archive" -C "$dir"
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$dir/mise/bin/mise" "$HOME/.local/bin/mise"
        rm -rf "$dir"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/mise" --version

    - name: Install the worker image's jj
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck source=.github/scripts/ci-tools.sh
        . "$GITHUB_ACTION_PATH/../../scripts/ci-tools.sh"
        dockerfile=packages/daemon/docker/worker.Dockerfile
        jj_tool=$(sed -n 's/^ARG JJ_TOOL=//p' "$dockerfile")
        if [ -z "$jj_tool" ]; then
          echo "$dockerfile names no ARG JJ_TOOL" >&2
          exit 1
        fi
        # The step above refused any other machine, so these two are the whole of the choice.
        case "$(uname -m)" in
          x86_64) jj_row=jj ;;
          *) jj_row=jj-aarch64 ;;
        esac
        # The row names a `primary_member`, so what reaches this path is the jj binary itself,
        # held to the row's digest by the helper, with the mode mktemp gave it.
        dir="$RUNNER_TEMP/jj-install"
        mkdir -p "$dir"
        ci_tools_fetch "$jj_row" "$dir/jj"
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$dir/jj" "$HOME/.local/bin/jj"
        rm -rf "$dir"
        echo "$jj_tool: $HOME/.local/bin/jj"
        "$HOME/.local/bin/jj" --version
