name: Install crane
description: >-
  Installs crane, the registry client .github/scripts/mirror-ci-images.sh copies images with, and
  puts it on PATH for the job's later steps.

  The `crane` row of .github/ci-tools.yaml names the version, the one sha256 of the whole release
  tarball that both sources are checked against, and the second source this install reads when
  GitHub's release assets do not serve the bytes: the copy of that tarball in
  ghcr.io/cybermonklabs/legion/ci.
runs:
  using: composite
  steps:
    - name: Install crane
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck source=.github/scripts/ci-tools.sh
        . "$GITHUB_ACTION_PATH/../../scripts/ci-tools.sh"
        tarball="$RUNNER_TEMP/$(basename "$(ci_tools_field crane primary)")"
        ci_tools_fetch crane "$tarball"
        mkdir -p "$RUNNER_TEMP/crane"
        tar -xzf "$tarball" -C "$RUNNER_TEMP/crane" crane
        echo "$RUNNER_TEMP/crane" >> "$GITHUB_PATH"
