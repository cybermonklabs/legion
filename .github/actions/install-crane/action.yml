name: Install crane
description: >-
  Installs crane, the registry client .github/scripts/mirror-ci-images.sh copies images with, and
  puts it on PATH for the job's later steps.

  The `crane` row of .github/ci-tools.yaml, or its `crane-aarch64` row on an arm64 runner, names
  the version, the one sha256 of the whole release tarball that both sources are checked against,
  and the second source this install reads when GitHub's release assets do not serve the bytes:
  the copy of that tarball in ghcr.io/cybermonklabs/legion/ci.
runs:
  using: composite
  steps:
    - name: Install crane
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck source=.github/scripts/ci-tools.sh
        . "$GITHUB_ACTION_PATH/../../scripts/ci-tools.sh"
        machine=$(uname -m)
        case "$machine" in
          x86_64) row=crane ;;
          aarch64 | arm64) row=crane-aarch64 ;;
          *)
            echo "::error::install-crane: .github/ci-tools.yaml holds no crane row for a $machine runner" >&2
            exit 1
            ;;
        esac
        tarball="$RUNNER_TEMP/$(basename "$(ci_tools_field "$row" primary)")"
        ci_tools_fetch "$row" "$tarball"
        mkdir -p "$RUNNER_TEMP/crane"
        tar -xzf "$tarball" -C "$RUNNER_TEMP/crane" crane
        echo "$RUNNER_TEMP/crane" >> "$GITHUB_PATH"
