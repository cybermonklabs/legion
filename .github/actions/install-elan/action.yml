name: Install elan
description: >-
  Installs elan, the Lean toolchain manager the airlock-lean job builds
  packages/envoy/internal/broker/airlock/lean with, and puts ELAN_HOME and its bin on the job's
  environment for the later steps. ELAN_HOME is $RUNNER_TEMP/elan, which ci.yaml's airlock-lean job
  caches on the content of that project's lean-toolchain: with the cache restored this step finds
  elan and the Lean toolchain already there and downloads nothing, and with it missed `lake`
  installs the toolchain lean-toolchain names on its first build.

  The `elan` row of .github/ci-tools.yaml names the version, the one sha256 of the whole release
  tarball that both sources are checked against, and the second source this install reads when
  GitHub's release assets do not serve the bytes: the copy of that tarball in
  ghcr.io/cybermonklabs/legion/ci.
runs:
  using: composite
  steps:
    - name: Install elan
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck source=.github/scripts/ci-tools.sh
        . "$GITHUB_ACTION_PATH/../../scripts/ci-tools.sh"
        elan_home="$RUNNER_TEMP/elan"
        echo "ELAN_HOME=$elan_home" >> "$GITHUB_ENV"
        echo "$elan_home/bin" >> "$GITHUB_PATH"
        if [ -x "$elan_home/bin/elan" ]; then
          exit 0
        fi
        tarball="$RUNNER_TEMP/$(basename "$(ci_tools_field elan primary)")"
        ci_tools_fetch elan "$tarball"
        mkdir -p "$RUNNER_TEMP/elan-init"
        tar -xzf "$tarball" -C "$RUNNER_TEMP/elan-init" elan-init
        ELAN_HOME="$elan_home" "$RUNNER_TEMP/elan-init/elan-init" -y --no-modify-path --default-toolchain none
        "$elan_home/bin/elan" --version
