\"2026-02-25T00:00:00.000Z\",\"key\":\"the-second-axis-of-scale\",\"AGNTCY_component\":null,\"documentId\":\"him9x8et6zs2utmc2jnr0vkl\",\"IoC_blog\":true,\"articleSummary\":\"- **Scaling AI: Beyond vertical growth** - The history of computing shows that scale-up and scale-out together unlock greater innovation; AI must move from just vertical scaling to also scaling out distributed intelligence for fault tolerance, efficiency, and operability.\\n- **Inversion of control and semantic collaboration** - Shifting control to platform layers enables agents to supply intent while infrastructure manages the rest. Current AI agents connect syntactically, but true progress requires a semantic layer for shared intent, cumulative knowledge, and collective reasoning.\\n- **Internet of Cognition**: The path forward - Distributed superintelligence emerges from agents and humans reasoning together via shared protocols, knowledge fabrics, and cognition engines-ushering in the [Internet of Cognition](https://outshift.cisco.com/internet-of-cognition/whitepaper).\",\"isExternal\":null,\"externalUrl\":null,\"blog_authors\":[{\"id\":1725,\"Name\":\"Vijoy Pandey\",\"createdAt\":\"2023-11-10T08:21:08.659Z\",\"updatedAt\":\"2026-09-03T15:56:07.040Z\",\"publishedAt\":\"2026-09-03T15:56:07.130Z\",\"locale\":\"en\",\"jobTitle\":\"SVP/GM of Outshift by Cisco\",\"description\":null,\"documentId\":\"v22ndrko094o2w62mc5f137v\",\"key\":\"vijoy-pandey\",\"Avatar\":{\"id\":997197,\"name\":\"Vijoy Headshot.jpg\",\"alternativeText\":null,\"caption\":null,\"width\":9113,\"height\":6075,\"formats\":{\"thumbnail\":{\"ext\":\".jpg\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbnail_Vijoy_Headshot_e019f65041.jpg\",\"etag\":\"823000d4fad3f0ee564b597455377abb\",\"hash\":\"thumbnail_Vijoy_Headshot_e019f65041\",\"mime\":\"image/jpeg\",\"name\":\"thumbnail_Vijoy Headshot.jpg\",\"path\":null,\"size\":7.11,\"width\":234,\"height\":156,\"sizeInBytes\":7109}},\"hash\":\"Vijoy_Headshot_e 64b03cce2fb.js\",\"57770\",\"static/chunks/57770-239dbde04e2e397c.js\",\"88793\",\"static/chunks/88793-856c71cf5f7d9489.js\",\"14998\",\"static/chunks/14998-e7bd6b7d7590edd0.js\",\"54775\",\"static/chunks/54775-a01f710a1360ad6f.js\",\"62525\",\"static/chunks/62525-1d8b8fae60608469.js\",\"65460\",\"static/chunks/65460-93f14b474c1c9239.js\",\"95871\",\"static/chunks/95871-98a22476a30e838f.js\",\"26791\",\"static/chunks/26791-127ca01cb7ed9879.js\",\"34131\",\"static/chunks/34131-fa551a20b1dc778a.js\",\"18921\",\"static/chunks/18921-8995897a80bc7b7b.js\",\"32959\",\"static/chunks/32959-3a9ee3b65e8b648e.js\",\"41537\",\"static/chunks/41537-643f8aab4e148b10.js\",\"42306\",\"static/chunks/42306-1378c127e2fe9ab1.js\",\"91816\",\"static/chunks/app/(public)/layout-0d6da0b69c31c9d8.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L47\",null,{\"logo\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/outshift-logo-text-white.svg\",\"NavDropdowns\":[{\"id\":101,\"title\":\"Initiatives\",\"featuredTitle\":\"Recent blog posts\",\"horizontalLayout\":true,\"bannerTitle\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Get \",\"type\":\"text\"},{\"bold\":true,\"text\":\"more\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"insights\",\"type\":\"text\"},{\"text\":\" on our blog\",\"type\":\"text\"}]}],\"bannerDescription\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"\",\"type\":\"text\"}]}],\"menu1Title\":\"Our Work\",\"menu2Title\":\"Our Collaborators\",\"menu3Title\":null,\"menu1External\":false,\"menu2External\":true,\"menu3External\":null,\"featuredCard\":[],\"featuredBlogs\":[{\"id\":5534,\"title\":\"Continuous Agent Semantic Authorization (CASA) for Multi-Agent Systems \",\"createdAt\":\"2026-06-24T15:34:08.882Z\",\"updatedAt\":\"2026-11-11T13:44:18.946Z\",\"publishedAt\":\"2026-11-11T13:44:20.637Z\",\"locale\":\"en\",\"publishDate\":\"2026-06-25T18:00:00.000Z\",\"key\":\"continuous-agentic-semantic-authorization-for-mas\",\"AGNTCY_component\":null,\"documentId\":\"pty4948njeabnr63lx032rxn\",\"IoC_blog\":true,\"articleSummary\":\"- Continuous Agent Semantic Authorization (CASA) enables agent collaboration by providing intent-scoped authorization and continuous enforcement for multi-agent systems. \\n- Traditional authorization verifies identity and permissions but loses visibility into why an action is performed, creating an intent gap that authenticated, authorized actions can still violate. \\n- CASA closes that gap with five core capabilities: semantic intent parsing, task-based authorization, ephemeral authorization, delegation lineage tracking, and continuous semantic enforcement. \\n- Enforcement runs through lightweight sidecars and an eBPF-based network layer managed by the CASA runtime, with policies defined as Kubernetes CRDs, so you can deploy CASA without modifying application code or adding SDKs. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}},{\"id\":5535,\"title\":\"Mycelium: Coordination Layer for Multi-Agent Systems\",\"createdAt\":\"2026-06-24T19:35:13.974Z\",\"updatedAt\":\"2026-11-11T13:46:03.092Z\",\"publishedAt\":\"2026-11-11T13:46:05.956Z\",\"locale\":\"en\",\"publishDate\":\"2026-06-25T17:00:00.000Z\",\"key\":\"mycelium-coordination-layer-for-multi-agent-systems\",\"AGNTCY_component\":null,\"documentId\":\"rxgwvsg7bf6p54co7ohral6k\",\"IoC_blog\":true,\"articleSummary\":\"- Multi-agent systems often produce \\\"AI theater,\\\" where agents generate output but never converge on a decision; Mycelium adds shared memory and a structured negotiation layer so agents can think together. \\n- A \\\"room\\\" gives agents persistent, searchable memory (Markdown files dual-indexed into pgvector and AgensGraph), so what one agent learns, every agent inherits across sessions. \\n- A Cognition Engine mediates structured negotiation, agents propose, counter, and converge through a protocol rather than free-chatting, and consensus compiles into a shared, executable plan. \\n- In a 14 decision scenarios test, mediated negotiations reached a decision 93% of the time versus 36% for unstructured chat, and on the five hardest scenarios, unstructured chat reached zero decisions. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}}],\"CTA\":{\"id\":100,\"title\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Subscribe to \",\"type\":\"text\"},{\"bold\":true,\"text\":\"The\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"Shift\",\"type\":\"text\"},{\"text\":\"!\",\"type\":\"text\"}]}],\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Get emerging insights on emerging technology straight to your inbox.\",\"type\":\"text\"}]}],\"url\":\"/outshift-newsletter\"},\"menu3Items\":[],\"menu2Items\":[{\"id\":1260,\"text\":\"DevNet\",\"url\":\"https://developer.cisco.com\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":{\"location\":\"navigation\",\"link_label\":\"DevNe le\":\"en\",\"featuredOrder\":9,\"documentId\":\"qdlkr6f1hvs79mx8wip4djbx\"}]}]},{\"id\":103,\"title\":\"About us\",\"featuredTitle\":\"Editor’s pick from the blog\",\"horizontalLayout\":true,\"bannerTitle\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Get \",\"type\":\"text\"},{\"bold\":true,\"text\":\"more\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"insights\",\"type\":\"text\"},{\"text\":\" on our blog\",\"type\":\"text\"}]}],\"bannerDescription\":null,\"menu1Title\":\"Company\",\"menu2Title\":\"Apply\",\"menu3Title\":\"Connect\",\"menu1External\":false,\"menu2External\":false,\"menu3External\":true,\"featuredCard\":[],\"featuredBlogs\":[{\"id\":5543,\"title\":\"The state of Cisco Quantum Labs: The quantum networking advancements achieved in one year \",\"createdAt\":\"2026-05-28T14:39:43.478Z\",\"updatedAt\":\"2026-11-11T14:08:13.600Z\",\"publishedAt\":\"2026-11-11T14:08:13.685Z\",\"locale\":\"en\",\"publishDate\":\"2026-05-28T15:00:00.000Z\",\"key\":\"state-quantum-labs-innovations\",\"AGNTCY_component\":null,\"documentId\":\"n97adiz5zi65dyh3e4evy6o4\",\"IoC_blog\":false,\"articleSummary\":\"- Within one year, Cisco Quantum Labs, Cisco Research, and the Outshift teams launched foundational advancements in quantum networking, including a room-temperature entanglement chip, a network-aware distributed compiler, and the Cisco Universal Quantum Switch. \\n- Cisco Quantum Labs and Outshift are driving a vendor-agnostic strategy that connects isolated quantum machines into an early architecture of a quantum networking ecosystem. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":44,\"title\":\"Quantum\",\"createdAt\":\"2025-02-03T03:04:15.388Z\",\"updatedAt\":\"2025-12-23T06:47:01.134Z\",\"publishedAt\":\"2025-12-23T06:47:02.476Z\",\"locale\":\"en\",\"description\":\"Uncover how quantum computing is paving the way for immense benefits with unprecedented computational power and real-world impact.\",\"hidden\":false,\"key\":\"quantum\",\"documentId\":\"pe4dpog46v1h2p5195iqpnys\"}},{\"id\":5544,\"title\":\"Exploring the Internet of Cognition \",\"createdAt\":\"2026-05-26T20:57:15.223Z\",\"updatedAt\":\"2026-11-11T14:09:41.547Z\",\"publishedAt\":\"2026-11-11T14:09:41.621Z\",\"locale\":\"en\",\"publishDate\":\"2026-05-27T18:00:00.000Z\",\"key\":\"exploring-the-internet-of-cognition\",\"AGNTCY_component\":null,\"documentId\":\"ioebl0fn6phab0jn2vvykuku\",\"IoC_blog\":true,\"articleSummary\":\"- Multi-agentsystems often fail during cross-organizational collaboration due to a lack of shared cognitive frameworks and isolation. \\n- The [Internet of Cognition](https://outshift.cisco.com/internet-of-cognition) (IoC) architecture solves this by equipping distributed agents with shared intent, shared context, and shared reasoning. \\n- An interactive Explore experience provides tangible, real-world scenarios—such as software crisis management and healthcare coordination—to demonstrate how IoC resolves complex agent deadlocks. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}}],\"CTA\":{\"id\":101,\"title\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Subscribe to \",\"type\":\"text\"},{\"bold\":true,\"text\":\"The\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"Shift\",\"type\":\"text\"},{\"text\":\"!\",\"type\":\"text\"}]}],\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Get emerging insights on emerging technology straight to your inbox.\",\"type\":\"text\"}]}],\"url\":\"/outshift-newsletter\"},\"menu3Items\":[{\"id\":1277,\"text\":\"Events\",\"url\":\"/events\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1278,\"text\":\"Contact Us\",\"url\":\"/contact-us\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1279,\"text\":\"YouTube\",\"url\":\"https://www.youtube.com/channel/UCyf0N9nryCKAecEuCkcECxg\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1280,\"text\":\"LinkedIn\",\"url\":\"https://www.linkedin.com/showcase/outshiftbycisco/\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1281,\"text\":\"GitHub\",\"url\":\"https://github.com/agntcy\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1282,\"text\":\"X\",\"url\":\"https://twitter.com/outshiftbycisco\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1283,\"text\":\"BlueSky\",\"url\":\"https://bsky.app/profile/outshift.cisco.com\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":null,\"submenu\":null,\"type\":null}],\"menu2Items\":[{\"id\":1264,\"text\":\"Job Openings\",\"url\":\"/careers\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null}],\"menu1Items\":[{\"id\":1253,\"text\":\"About Us\",\"url\":\"/about-us\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1254,\"text\":\"Our Team\",\"url\":\"/our-team\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1255,\"text\":\"The Shift\",\"url\":\"/outshift-newsletter\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":{\"location\":\"Navigation bar - header\",\"link_label\":\"The Shift\",\"location_detail\":\"About us - company\",\"resource_interaction\":\"view newsletter subscription form\"},\"submenu\":null,\"type\":null}],\"bannerBtn\":{\"id\":2876,\"url\":\"/blog\",\"cta\":null,\"variant\":\"icon\",\"external\":null,\"iconName\":null,\"icon\":null},\"bannerImg\":null,\"blog_category\":null,\"filteredBlog\":[{\"id\":5527,\"title\":\"Why your organization needs an agent directory as part of its AI governance plan\",\"createdAt\":\"2026-08-19T15:49:09.570Z\",\"updatedAt\":\"2026-11-11T13:34:45.038Z\",\"publishedAt\":\"2026-11-11T13:34:45.075Z\",\"locale\":\"en\",\"publishDate\":\"2026-09-01T11:00:00.000Z\",\"key\":\"ai-governance-agent-directory\",\"AGNTCY_component\":null,\"documentId\":\"wekl24oxy7r1rtil4cb28a2w\",\"IoC_blog\":false,\"articleSummary\":\"- Most enterprises lack an inventory of the AI agents running inside their own networks—a gap that creates compounding governance, security, and compliance risks as deployments scale. \\n- Agent Directory and Identity Service, projects part of AGNTCY, a Linux Foundation, address this directly with an open source platform for publishing, discovering, and managing agents using cryptographically signed AI Cards and verifiable digital identities that integrate with enterprise providers like Duo, Okta, and Ory. \\n- Governance through discovery and identity verification is not a bottleneck to innovation; it is the operational foundation that makes secure, scalable multi-agent collaboration possible. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\",\"icon\":{\"id\":863525,\"name\":\"Black.svg\",\"alternativeText\":null,\"caption\":null,\"width\":19,\"height\":19,\"formats\":null,\"hash\":\"Black\",\"ext\":\".svg\",\"mime\":\"image/svg+xml\",\"size\":0.96,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/Black.svg\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2025-01-30T20:12:36.154Z\",\"updatedAt\":\"2025-01-30T20:12:36.154Z\",\"documentId\":\"nztec76i90n36sew1t2doso4\",\"publishedAt\":\"2025-11-11T15:19:30.164Z\"}},\"thumbnail\":{\"id\":997184,\"name\":\"IoA SEO blog.png\",\"alternativeText\":null,\"caption\":null,\"width\":1920,\"height\":1080,\"formats\":{\"thumbnail\":{\"ext\":\".png\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbnail_Io_A_SEO_blog_af34065657.png\",\"etag\":\"7c81a8f6cef3cdcaa5f77da3772b52b7\",\"hash\":\"thumbnail_Io_A_SEO_blog_af34065657\",\"mime\":\"image/png\",\"name\":\"thumbnail_IoA SEO blog.png\",\"path\":null,\"size\":71.32,\"width\":245,\"height\":138,\"sizeInBytes\":71319}},\"hash\":\"Io_A_SEO_blog_af34065657\",\"ext\":\".png\",\"mime\":\"image/png\",\"size\":1098.22,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/Io_A_SEO_blog_af34065657.png\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2026-08-19T15:49:09.507Z\",\"updatedAt\":\"2026-08-19T15:49:09.507Z\",\"documentId\":\"afijh98v57im8obrdsdzn7hy\",\"publishedAt\":\"2026-08-19T15:49:09.507Z\"}},{\"id\":5528,\"title\":\"AI security for autonomous agents starts with task-based access control \",\"createdAt\":\"2026-08-20T17:15:32.357Z\",\"updatedAt\":\"2026-11-11T13:36:22.122Z\",\"publishedAt\":\"2026-11-11T13:36:22.190Z\",\"locale\":\"en\",\"publishDate\":\"2026-08-31T11:00:00.000Z\",\"key\":\"ai-security-for-autonomous-agents\",\"AGNTCY_component\":null,\"documentId\":\"jcpz3935sa9wonhoqnyhw34l\",\"IoC_blog\":false,\"articleSummary\":\"- Autonomous Artificial Intelligence (AI) agents can pursue legitimate goals through unauthorized paths—a systemic security gap that identity-based access control is built to close. \\n- AGNTCY, a Linux Foundation project (AGNTCY)'s Task-Based Access Control (T-BAC) model enforces tool-level policy at the moment of each call, not at token issuance, enabling continuous authorization that adapts as agent behavior evolves. \\n- Agent2Agent (A2A) 1.0 defines when to request authorization; AGNTCY fills the gap by defining what that authorization means—and the working group is open for developers, security architects, and researchers to help shape it. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\",\"icon\":{\"id\":863525,\"name\":\"Black.svg\",\"alternativeText\":null,\"caption\":null,\"width\":19,\"height\":19,\"formats\":null,\"hash\":\"Black\",\"ext\":\".svg\",\"mime\":\"image/svg+xml\",\"size\":0.96,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/Black.svg\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2025-01-30T20:12:36.154Z\",\"updatedAt\":\"2025-01-30T20:12:36.154Z\",\"documentId\":\"nztec76i90n36sew1t2doso4\",\"publishedAt\":\"2025-11-11T15:19:30.164Z\"}},\"thumbnail\":{\"id\":997187,\"name\":\"ML.png\",\"alternativeText\":null,\"caption\":null,\"width\":1920,\"height\":1080,\"formats\":{\"thumbnail\":{\"ext\":\".png\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbnail_ML_ef2a52c6c8.png\",\"etag\":\"ee18489b1db1c4e6c9570effcc7cbc94\",\"hash\":\"thumbnail_ML_ef2a52c6c8\",\"mime\":\"image/png\",\"name\":\"thumbnail_ML.png\",\"path\":null,\"size\":54.28,\"width\":245,\"height\":138,\"sizeInBytes\":54283}},\"hash\":\"ML_ef2a52c6c8\",\"ext\":\".png\",\"mime\":\"image/png\",\"size\":587.27,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/ML_ef2a52c6c8.png\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2026-08-21T20:31:38.314Z\",\"updatedAt\":\"2026-08-21T20:31:38.314Z\",\"documentId\":\"y8xy8ykc0wijjyhkt8sfu3tb\",\"publishedAt\":\"2026-08-21T20:31:38.314Z\"}}]},{\"id\":102,\"title\":\"Blog\",\"featuredTitle\":\"Editor’s pick from the blog\",\"horizontalLayout\":true,\"bannerTitle\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Get \",\"type\":\"text\"},{\"bold\":true,\"text\":\"more\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"insights\",\"type\":\"text\"},{\"text\":\" on our blog\",\"type\":\"text\"}]}],\"bannerDescription\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"\",\"type\":\"text\"}]}],\"menu1Title\":\"Categories\",\"menu2Title\":null,\"menu3Title\":null,\"menu1External\":false,\"menu2External\":null,\"menu3External\":null,\"featuredCard\":[{\"id\":192,\"title\":null,\"description\":null,\"url\":null,\"img\":null}],\"featuredBlogs\":[{\"id\":5542,\"title\":\"Quantum internet 101: What it is, and why it matters\",\"createdAt\":\"2026-06-01T10:30:00.416Z\",\"updatedAt\":\"2026-11-11T14:04:29.393Z\",\"publishedAt\":\"2026-11-11T14:04:29.476Z\",\"locale\":\"en\",\"publishDate\":\"2026-06-01T13:00:00.000Z\",\"key\":\"quantum-internet-101-what-and-why\",\"AGNTCY_component\":null,\"documentId\":\"nsb8n4noanx3fwfpwpj9jwe2\",\"IoC_blog\":false,\"articleSummary\":\"- The quantum internet works alongside today's classical internet—not in place of it—enabling ultra-secure communication and distributed quantum computing that classical networks cannot deliver. \\n- Quantum networking matters because it unlocks physics-based security and the ability to solve problems that sit beyond the reach of classical systems. \\n- Progress is real but early, with qubit stability, entanglement distribution, and infrastructure scale remaining key barriers to widespread deployment. \\n- Leaders who take the initiative to understand and harness this emerging technology will be best positioned to shape and benefit from what will redefine secure communications and competitive advantage for decades to come. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":44,\"title\":\"Quantum\",\"createdAt\":\"2025-02-03T03:04:15.388Z\",\"updatedAt\":\"2025-12-23T06:47:01.134Z\",\"publishedAt\":\"2025-12-23T06:47:02.476Z\",\"locale\":\"en\",\"description\":\"Uncover how quantum computing is paving the way for immense benefits with unprecedented computational power and real-world impact.\",\"hidden\":false,\"key\":\"quantum\",\"documentId\":\"pe4dpog46v1h2p5195iqpnys\"}},{\"id\":5557,\"title\":\"AI vs. ASI:  Understanding the future of artificial superintelligence\",\"createdAt\":\"2026-03-17T10:39:35.693Z\",\"updatedAt\":\"2026-11-11T14:24:46.775Z\",\"publishedAt\":\"2026-11-11T14:24:46.848Z\",\"locale\":\"en\",\"publishDate\":\"2026-03-17T15:00:00.000Z\",\"key\":\"ai-asi-future-of-artificial-superintelligence\",\"AGNTCY_component\":null,\"documentId\":\"stise4i5wyehq4efnt69o0ed\",\"IoC_blog\":false,\"articleSummary\":\"- AI agents are highly capable within specific tasks, they suffer from \\\"semantic isolation,\\\" meaning they cannot easily share knowledge or coordinate on complex, multi-step goals \\n- Artificial superintelligence (ASI) is achieved when systems of autonomous agents reach \\\"economic viability\\\"—performing 100% of human tasks without intervention—and \\\"technical viability,\\\" where reasoning engines can invent novel solutions beyond their original training data. \\n- To achieve true ASI, Outshift proposes an architecture called the Internet of Cognition. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}}],\"CTA\":{\"id\":102,\"title\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Subscribe to \",\"type\":\"text\"},{\"bold\":true,\"text\":\"The\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"Shift\",\"type\":\"text\"},{\"text\":\"!\",\"type\":\"text\"}]}],\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Get emerging insights on emerging technology straight to your inbox.\",\"type\":\"text\"}]}],\"url\":\"/outshift-newsletter\"},\"menu3Items\":[],\"menu2Items\":[],\"menu1Items\":[{\"id\":1265,\"text\":\"AI/ML\",\"url\":\"/blog/ai-ml\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1266,\"text\":\"Quantum\",\"url\":\"/blog/quantum\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1267,\"text\":\"In-depth Tech\",\"url\":\"/blog/in-depth-tech\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1268,\"text\":\"Strategy \u0026 Insights\",\"url\":\"/blog/insights\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1269,\"text\":\"Research\",\"url\":\"/blog/research\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1270,\"text\":\"Inside Outshift\",\"url\":\"/blog/inside-outshift\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null}],\"bannerBtn\":{\"id\":2878,\"url\":\"/blog\",\"cta\":null,\"variant\":\"icon\",\"external\":false,\"iconName\":null,\"icon\":null},\"bannerImg\":null,\"blog_category\":null,\"filteredBlog\":[{\"id\":5529,\"title\":\"Quantum computing’s hardest problem isn’t physics, it’s connectivity \",\"createdAt\":\"2026-08-24T19:16:00.146Z\",\"updatedAt\":\"2026-11-11T13:37:22.661Z\",\"publishedAt\":\"2026-11-11T13:37:22.728Z\",\"locale\":\"en\",\"publishDate\":\"2026-08-25T15:00:00.000Z\",\"key\":\"quantum-networking-infrastructure\",\"AGNTCY_component\":null,\"documentId\":\"chol76xl2siu4duuwz4pa6y1\",\"IoC_blog\":false,\"articleSummary\":\"- Quantum mechanics defines the hard limits of what's possible. Infrastructure - manufacturing, standards, connectivity - determine when those capabilities reach people at scale. \\n- IBM, Cleveland Clinic, and RIKEN have linked quantum processors across continents, demonstrating a measurable expansion in quantum modeling capabilities. The results are promising, but the achievement is narrow in scope, isolated demonstrations, not repeatable, networked workflows ready for practical deployment. \\n- Cisco Quantum Labs is working to bridge that gap. Its universal quantum switch and entanglement chip are designed to enable quantum devices from different manufacturers to communicate over existing fiber infrastructure, transforming isolated experiments into an interconnected, scalable network. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":44,\"title\":\"Quantum\",\"createdAt\":\"2025-02-03T03:04:15.388Z\",\"updatedAt\":\"2025-12-23T06:47:01.134Z\",\"publishedAt\":\"2025-12-23T06:47:02.476Z\",\"locale\":\"en\",\"description\":\"Uncover how quantum computing is paving the way for immense benefits with unprecedented computational power and real-world impact.\",\"hidden\":false,\"key\":\"quantum\",\"documentId\":\"pe4dpog46v1h2p5195iqpnys\",\"icon\":{\"id\":646742,\"name\":\"quantum.svg\",\"alternativeText\":null,\"caption\":null,\"width\":19,\"height\":19,\"formats\":null,\"hash\":\"quantum\",\"ext\":\".svg\",\"mime\":\"image/svg+xml\",\"size\":1.62,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/quantum.svg\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2025-02-03T03:04:08.447Z\",\"updatedAt\":\"2025-02-03T03:04:08.447Z\",\"documentId\":\"k548dcetao8f2y3zjnxx8d3n\",\"publishedAt\":\"2025-11-11T15:19:30.164Z\"}},\"thumbnail\":{\"id\":997189,\"name\":\"Quantum.png\",\"alternativeText\":null,\"caption\":null,\"width\":1920,\"height\":1080,\"formats\":{\"thumbnail\":{\"ext\":\".png\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbnail_Quantum_e1a99778c5.png\",\"etag\":\"f0648f435e68a2850a8cb7bab86f3185\",\"hash\":\"thumbnail_Quantum_e1a99778c5\",\"mime\":\"image/png\",\"name\":\"thumbnail_Quantum.png\",\"path\":null,\"size\":75.92,\"width\":245,\"height\":138,\"sizeInBytes\":75923}},\"hash\":\"Quantum_e1a99778c5\",\"ext\":\".png\",\"mime\":\"image/png\",\"size\":1360.5,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/Quantum_e1a99778c5.png\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2026-08-24T22:26:31.704Z\",\"updatedAt\":\"2026-08-24T22:26:31.704Z\",\"documentId\":\"nob44tkj0ibg2lsibgd4sb3w\",\"publishedAt\":\"2026-08-24T22:26:31.705Z\"}},{\"id\":5524,\"title\":\"Insight Module for Agentic Systems: Observing the invisible in agentic AI\",\"createdAt\":\"2026-09-17T18:28:43.905Z\",\"updatedAt\":\"2026-11-11T13:29:22.912Z\",\"publishedAt\":\"2026-11-11T13:29:22.959Z\",\"locale\":\"en\",\"publishDate\":\"2026-09-18T13:00:00.000Z\",\"key\":\"insight-module-for-agentic-systems\",\"AGNTCY_component\":null,\"documentId\":\"c7xppuv3ij6kdby9wlrncds1\",\"IoC_blog\":false,\"articleSummary\":\"- Insight Module for Agentic Systems introduces a new control-plane observability layer for OpenClaw-based multi-agent systems, exposing how agents assemble context, delegate, and reason—addressing the blind spots where “traditional observability tells us what happened… but it cannot explain why a system behaved the way it did.” \\n- A rich suite of control-plane metrics—context composition, disclosure, memory fragmentation, repetition/novelty, parallelization—turns agent reasoning into measurable, actionable signals, powering debugging, optimization, and eventually self-learning agentic systems that adapt based on their own execution traces. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\",\"icon\":{\"id\":863525,\"name\":\"Black.svg\",\"alternativeText\":null,\"caption\":null,\"width\":19,\"height\":19,\"formats\":null,\"hash\":\"Black\",\"ext\":\".svg\",\"mime\":\"image/svg+xml\",\"size\":0.96,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/Black.svg\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2025-01-30T20:12:36.154Z\",\"updatedAt\":\"2025-01-30T20:12:36.154Z\",\"documentId\":\"nztec76i90n36sew1t2doso4\",\"publishedAt\":\"2025-11-11T15:19:30.164Z\"}},\"thumbnail\":{\"id\":997228,\"name\":\"Blog - Insight Claw.png\",\"alternativeText\":null,\"caption\":null,\"width\":2048,\"height\":1152,\"formats\":{\"thumbnail\":{\"ext\":\".png\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbnail_Blog_Insight_Claw_d211dd7a0a.png\",\"etag\":\"7ec3a2acd8727881c04e49fbb13e75a5\",\"hash\":\"thumbnail_Blog_Insi dBlogs\":[{\"id\":5561,\"title\":\"Webex integrates AGNTCY Directory and Identity to power trusted onboarding, discovery, and verification of agentic apps   \",\"createdAt\":\"2026-03-09T19:26:59.274Z\",\"updatedAt\":\"2026-11-11T14:27:57.429Z\",\"publishedAt\":\"2026-11-11T14:27:57.504Z\",\"locale\":\"en\",\"publishDate\":\"2026-03-10T00:00:00.000Z\",\"key\":\"webex-integrates-agntcy-directory-and-identity\",\"AGNTCY_component\":null,\"documentId\":\"e9bqm9v1ym7pw9qqy1ffo3e1\",\"IoC_blog\":false,\"articleSummary\":\"- Webex has integrated AGNTCY Directory and Identity into its Agent Central Service (ACS), enabling trusted onboarding, secure discovery, and verified communication for AI and agentic applications across the Webex ecosystem. \\n- This integration establishes a unified governance and security layer for multi-agent systems, supporting interoperable AI agents built on open standards like MCP, A2A, and AGNTCY protocols, and strengthening enterprise-grade trust and compliance. \\n- Developers can now register, verify, and publish agentic servers through the Webex Developer Portal and App Hub, with enterprise provisioning, policy enforcement, and lifecycle controls managed centrally through Webex Control Hub. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}},{\"id\":5466,\"title\":\"Swisscom and Outshift team up to build agentic AI-enabled networks\",\"createdAt\":\"2025-04-10T20:02:45.856Z\",\"updatedAt\":\"2026-10-15T16:07:08.913Z\",\"publishedAt\":\"2026-10-15T16:07:09.037Z\",\"locale\":\"en\",\"publishDate\":\"2025-04-24T16:00:00.000Z\",\"key\":\"outshift-swisscom-agentic-ai-networks\",\"AGNTCY_component\":null,\"documentId\":\"n40b2ibd1ba9ut9xd234xwtf\",\"IoC_blog\":null,\"articleSummary\":null,\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":40,\"title\":\"Inside Outshift\",\"createdAt\":\"2023-12-21T14:26:04.911Z\",\"updatedAt\":\"2025-12-23T06:47:00.795Z\",\"publishedAt\":\"2025-12-23T06:47:02.077Z\",\"locale\":\"en\",\"description\":\"Learn what makes our tech tick — our team! Dive into behind the scenes happenings at Outshift and Cisco.\",\"hidden\":false,\"key\":\"inside-outshift\",\"documentId\":\"bhm2x3u3x8jsxrfu5zadbr17\"}}],\"CTA\":{\"id\":104,\"title\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Subscribe to \",\"type\":\"text\"},{\"bold\":true,\"text\":\"The\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"Shift\",\"type\":\"text\"},{\"text\":\"!\",\"type\":\"text\"}]}],\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Get emerging insights on emerging technology straight to your inbox.\",\"type\":\"text\"}]}],\"url\":\"/outshift-newsletter\"},\"menu3Items\":[],\"menu2Items\":[],\"menu1Items\":[{\"id\":1256,\"text\":\"View all\",\"url\":\"/case-studies\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":\"Navigation\"},{\"id\":1257,\"text\":\"Servicesnow Integration\",\"url\":\"/case-studies/servicenow-outshift-federate-ai-discovery\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":\"Navigation\"},{\"id\":1258,\"text\":\"WebEx Integration\",\"url\":\"/case-studies/webex-agntcy-directory-identity\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":\"Navigation\"},{\"id\":1259,\"text\":\"Swisscom Integration\",\"url\":\"/case-studies/swisscom-agentic-ai-network-reliability\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":\"Navigation\"}],\"bannerBtn\":{\"id\":2877,\"url\":\"/blog\",\"cta\":null,\"variant\":\"icon\",\"external\":null,\"iconName\":null,\"icon\":null},\"bannerImg\":null,\"blog_category\":null}],\"eyeBrowLink\":{\"id\":1247,\"text\":\"Resources\",\"url\":\"/resources\",\"eyebrow\":\"NEW\",\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null}}]\n"])</script><script>self.__next_f.push([1,"10:[\"$\",\"$L47\",null,{\"logo\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/outshift-logo-text-white.svg\",\"NavDropdowns\":[{\"id\":101,\"title\":\"Initiatives\",\"featuredTitle\":\"Recent blog posts\",\"horizontalLayout\":true,\"bannerTitle\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Get \",\"type\":\"text\"},{\"bold\":true,\"text\":\"more\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"insights\",\"type\":\"text\"},{\"text\":\" on our blog\",\"type\":\"text\"}]}],\"bannerDescription\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"\",\"type\":\"text\"}]}],\"menu1Title\":\"Our Work\",\"menu2Title\":\"Our Collaborators\",\"menu3Title\":null,\"menu1External\":false,\"menu2External\":true,\"menu3External\":null,\"featuredCard\":[],\"featuredBlogs\":[{\"id\":5534,\"title\":\"Continuous Agent Semantic Authorization (CASA) for Multi-Agent Systems \",\"createdAt\":\"2026-06-24T15:34:08.882Z\",\"updatedAt\":\"2026-11-11T13:44:18.946Z\",\"publishedAt\":\"2026-11-11T13:44:20.637Z\",\"locale\":\"en\",\"publishDate\":\"2026-06-25T18:00:00.000Z\",\"key\":\"continuous-agentic-semantic-authorization-for-mas\",\"AGNTCY_component\":null,\"documentId\":\"pty4948njeabnr63lx032rxn\",\"IoC_blog\":true,\"articleSummary\":\"- Continuous Agent Semantic Authorization (CASA) enables agent collaboration by providing intent-scoped authorization and continuous enforcement for multi-agent systems. \\n- Traditional authorization verifies identity and permissions but loses visibility into why an action is performed, creating an intent gap that authenticated, authorized actions can still violate. \\n- CASA closes that gap with five core capabilities: semantic intent parsing, task-based authorization, ephemeral authorization, delegation lineage tracking, and continuous semantic enforcement. \\n- Enforcement runs through lightweight sidecars and an eBPF-based network layer managed by the CASA runtime, with policies defined as Kubernetes CRDs, so you can deploy CASA without modifying application code or adding SDKs. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}},{\"id\":5535,\"title\":\"Mycelium: Coordination Layer for Multi-Agent Systems\",\"createdAt\":\"2026-06-24T19:35:13.974Z\",\"updatedAt\":\"2026-11-11T13:46:03.092Z\",\"publishedAt\":\"2026-11-11T13:46:05.956Z\",\"locale\":\"en\",\"publishDate\":\"2026-06-25T17:00:00.000Z\",\"key\":\"mycelium-coordination-layer-for-multi-agent-systems\",\"AGNTCY_component\":null,\"documentId\":\"rxgwvsg7bf6p54co7ohral6k\",\"IoC_blog\":true,\"articleSummary\":\"- Multi-agent systems often produce \\\"AI theater,\\\" where agents generate output but never converge on a decision; Mycelium adds shared memory and a structured negotiation layer so agents can think together. \\n- A \\\"room\\\" gives agents persistent, searchable memory (Markdown files dual-indexed into pgvector and AgensGraph), so what one agent learns, every agent inherits across sessions. \\n- A Cognition Engine mediates structured negotiation, agents propose, counter, and converge through a protocol rather than free-chatting, and consensus compiles into a shared, executable plan. \\n- In a 14 decision scenarios test, mediated negotiations reached a decision 93% of the time versus 36% for unstructured chat, and on the five hardest scenarios, unstructured chat reached zero decisions. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}}],\"CTA\":{\"id\":100,\"title\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Subscribe to \",\"type\":\"text\"},{\"bold\":true,\"text\":\"The\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"Shift\",\"type\":\"text\"},{\"text\":\"!\",\"type\":\"text\"}]}],\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Get emerging insights on emerging technology straight to your inbox.\",\"type\":\"text\"}]}],\"url\":\"/outshift-newsletter\"},\"menu3Items\":[],\"menu2Items\":[{\"id\":1260,\"text\":\"DevNet\",\"url\":\"https://developer.cisco.com\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":{\"location\":\"navigation\",\"link_label\":\"DevNet\",\"location_detail\":\"right\",\"resource_interaction\":\"visit to DevNet initiative page\"},\"submenu\":null,\"type\":null},{\"id\":1261,\"text\":\"Research\",\"url\":\"https://research.cisco.com\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":{\"location\":\"navigation\",\"link_label\":\"Research\",\"location_detail\":\"right\",\"resource_interaction\":\"visit to Research initiative page\"},\"submenu\":null,\" pe\":\"text\"},{\"text\":\" on our blog\",\"type\":\"text\"}]}],\"bannerDescription\":null,\"menu1Title\":\"Company\",\"menu2Title\":\"Apply\",\"menu3Title\":\"Connect\",\"menu1External\":false,\"menu2External\":false,\"menu3External\":true,\"featuredCard\":[],\"featuredBlogs\":[{\"id\":5543,\"title\":\"The state of Cisco Quantum Labs: The quantum networking advancements achieved in one year \",\"createdAt\":\"2026-05-28T14:39:43.478Z\",\"updatedAt\":\"2026-11-11T14:08:13.600Z\",\"publishedAt\":\"2026-11-11T14:08:13.685Z\",\"locale\":\"en\",\"publishDate\":\"2026-05-28T15:00:00.000Z\",\"key\":\"state-quantum-labs-innovations\",\"AGNTCY_component\":null,\"documentId\":\"n97adiz5zi65dyh3e4evy6o4\",\"IoC_blog\":false,\"articleSummary\":\"- Within one year, Cisco Quantum Labs, Cisco Research, and the Outshift teams launched foundational advancements in quantum networking, including a room-temperature entanglement chip, a network-aware distributed compiler, and the Cisco Universal Quantum Switch. \\n- Cisco Quantum Labs and Outshift are driving a vendor-agnostic strategy that connects isolated quantum machines into an early architecture of a quantum networking ecosystem. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":44,\"title\":\"Quantum\",\"createdAt\":\"2025-02-03T03:04:15.388Z\",\"updatedAt\":\"2025-12-23T06:47:01.134Z\",\"publishedAt\":\"2025-12-23T06:47:02.476Z\",\"locale\":\"en\",\"description\":\"Uncover how quantum computing is paving the way for immense benefits with unprecedented computational power and real-world impact.\",\"hidden\":false,\"key\":\"quantum\",\"documentId\":\"pe4dpog46v1h2p5195iqpnys\"}},{\"id\":5544,\"title\":\"Exploring the Internet of Cognition \",\"createdAt\":\"2026-05-26T20:57:15.223Z\",\"updatedAt\":\"2026-11-11T14:09:41.547Z\",\"publishedAt\":\"2026-11-11T14:09:41.621Z\",\"locale\":\"en\",\"publishDate\":\"2026-05-27T18:00:00.000Z\",\"key\":\"exploring-the-internet-of-cognition\",\"AGNTCY_component\":null,\"documentId\":\"ioebl0fn6phab0jn2vvykuku\",\"IoC_blog\":true,\"articleSummary\":\"- Multi-agentsystems often fail during cross-organizational collaboration due to a lack of shared cognitive frameworks and isolation. \\n- The [Internet of Cognition](https://outshift.cisco.com/internet-of-cognition) (IoC) architecture solves this by equipping distributed agents with shared intent, shared context, and shared reasoning. \\n- An interactive Explore experience provides tangible, real-world scenarios—such as software crisis management and healthcare coordination—to demonstrate how IoC resolves complex agent deadlocks. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}}],\"CTA\":{\"id\":101,\"title\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Subscribe to \",\"type\":\"text\"},{\"bold\":true,\"text\":\"The\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"Shift\",\"type\":\"text\"},{\"text\":\"!\",\"type\":\"text\"}]}],\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Get emerging insights on emerging technology straight to your inbox.\",\"type\":\"text\"}]}],\"url\":\"/outshift-newsletter\"},\"menu3Items\":[{\"id\":1277,\"text\":\"Events\",\"url\":\"/events\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1278,\"text\":\"Contact Us\",\"url\":\"/contact-us\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1279,\"text\":\"YouTube\",\"url\":\"https://www.youtube.com/channel/UCyf0N9nryCKAecEuCkcECxg\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1280,\"text\":\"LinkedIn\",\"url\":\"https://www.linkedin.com/showcase/outshiftbycisco/\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1281,\"text\":\"GitHub\",\"url\":\"https://github.com/agntcy\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1282,\"text\":\"X\",\"url\":\"https://twitter.com/outshiftbycisco\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1283,\"text\":\"BlueSky\",\"url\":\"https://bsky.app/profile/outshift.cisco.com\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":null,\"submenu\":null,\"type\":null}],\"menu2Items\":[{\"id\":1264,\"text\":\"Job Openings\",\"url\":\"/careers\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null}],\"menu1Items\":[{\"id\":1253,\"text\":\"About Us\",\"url\":\"/about-us\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1254,\"text\":\"Our Team\",\"url\":\"/our-team\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1255,\"text\":\"The Shift\",\"url\":\"/outshift-newsletter\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":{\"location\":\"Navigation bar - header\",\"link_label\":\"The Shift\",\"location_detail\":\"About us - company\",\"resource_interaction\":\"view newsletter subscription form\"},\"submenu\":null,\"type\":null}],\"bannerBtn\":{\"id\":2876,\"url\":\"/blog\",\"cta\":null,\"variant\":\"icon\",\"external\":null,\"iconName\":null,\"icon\":null},\"bannerImg\":null,\"blog_category\":null,\"filteredBlog\":[{\"id\":5527,\"title\":\"Why your organization needs an agent directory as part of its AI governance plan\",\"createdAt\":\"2026-08-19T15:49:09.570Z\",\"updatedAt\":\"2026-11-11T13:34:45.038Z\",\"publishedAt\":\"2026-11-11T13:34:45.075Z\",\"locale\":\"en\",\"publishDate\":\"2026-09-01T11:00:00.000Z\",\"key\":\"ai-governance-agent-directory\",\"AGNTCY_component\":null,\"documentId\":\"wekl24oxy7r1rtil4cb28a2w\",\"IoC_blog\":false,\"articleSummary\":\"- Most enterprises lack an inventory of the AI agents running inside their own networks—a gap that creates compounding governance, security, and compliance risks as deployments scale. \\n- Agent Directory and Identity Service, projects part of AGNTCY, a Linux Foundation, address this directly with an open source platform for publishing, discovering, and managing agents using cryptographically signed AI Cards and verifiable digital identities that integrate with enterprise providers like Duo, Okta, and Ory. \\n- Governance through discovery and identity verification is not a bottleneck to innovation; it is the operational foundation that makes secure, scalable multi-agent collaboration possible. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\",\"icon\":{\"id\":863525,\"name\":\"Black.svg\",\"alternativeText\":null,\"caption\":null,\"width\":19,\"height\":19,\"formats\":null,\"hash\":\"Black\",\"ext\":\".svg\",\"mime\":\"image/svg+xml\",\"size\":0.96,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/Black.svg\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2025-01-30T20:12:36.154Z\",\"updatedAt\":\"2025-01-30T20:12:36.154Z\",\"documentId\":\"nztec76i90n36sew1t2doso4\",\"publishedAt\":\"2025-11-11T15:19:30.164Z\"}},\"thumbnail\":{\"id\":997184,\"name\":\"IoA SEO blog.png\",\"alternativeText\":null,\"caption\":null,\"width\":1920,\"height\":1080,\"formats\":{\"thumbnail\":{\"ext\":\".png\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbnail_Io_A_SEO_blog_af34065657.png\",\"etag\":\"7c81a8f6cef3cdcaa5f77da3772b52b7\",\"hash\":\"thumbnail_Io_A_SEO_blog_af34065657\",\"mime\":\"image/png\",\"name\":\"thumbnail_IoA SEO blog.png\",\"path\":null,\"size\":71.32,\"width\":245,\"height\":138,\"sizeInBytes\":71319}},\"hash\":\"Io_A_SEO_blog_af34065657\",\"ext\":\".png\",\"mime\":\"image/png\",\"size\":1098.22,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/Io_A_SEO_blog_af34065657.png\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2026-08-19T15:49:09.507Z\",\"updatedAt\":\"2026-08-19T15:49:09.507Z\",\"documentId\":\"afijh98v57im8obrdsdzn7hy\",\"publishedAt\":\"2026-08-19T15:49:09.507Z\"}},{\"id\":5528,\"title\":\"AI security for autonomous agents starts with task-based access control \",\"createdAt\":\"2026-08-20T17:15:32.357Z\",\"updatedAt\":\"2026-11-11T13:36:22.122Z\",\"publishedAt\":\"2026-11-11T13:36:22.190Z\",\"locale\":\"en\",\"publishDate\":\"2026-08-31T11:00:00.000Z\",\"key\":\"ai-security-for-autonomous-agents\",\"AGNTCY_component\":null,\"documentId\":\"jcpz3935sa9wonhoqnyhw34l\",\"IoC_blog\":false,\"articleSummary\":\"- Autonomous Artificial Intelligence (AI) agents can pursue legitimate goals through unauthorized paths—a systemic security gap that identity-based access control is built to close. \\n- AGNTCY, a Linux Foundation project (AGNTCY)'s Task-Based Access Control (T-BAC) model enforces tool-level policy at the moment of each call, not at token issuance, enabling continuous authorization that adapts as agent behavior evolves. \\n- Agent2Agent (A2A) 1.0 defines when to request authorization; AGNTCY fills the gap by defining what that authorization means—and the working group is open for developers, security architects, and researchers to help shape it. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\",\"icon\":{\"id\":863525,\"name\":\"Black.svg\",\"alternativeText\":null,\"caption\":null,\"width\":19,\"height\":19,\"formats\":null,\"hash\":\"Black\",\"ext\":\".svg\",\"mime\":\"image/svg+xml\",\"size\":0.96,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/Black.svg\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2025-01-30T20:12:36.154Z\",\"updatedAt\":\"2025-01-30T20:12:36.154Z\",\"documentId\":\"nztec76i90n36sew1t2doso4\",\"publishedAt\":\"2025-11-11T15:19:30.164Z\"}},\"thumbnail\":{\"id\":997187,\"name\":\"ML.png\",\"alternativeText\":null,\"caption\":null,\"width\":1920,\"height\":1080,\"formats\":{\"thumbnail\":{\"ext\":\".png\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbnail_ML_ef2a52c6c8.png\",\"etag\":\"ee18489b1db1c4e6c9570effcc7cbc94\",\"hash\":\"thumbnail_ML_ef2a52c6c8\",\"mime\":\"image/png\",\"name\":\"thumbnail_ML.png\",\"path\":null,\"size\":54.28,\"width\":245,\"height\":138,\"sizeInBytes\":54283}},\"hash\":\"ML_ef2a52c6c8\",\"ext\":\".png\",\"mime\":\"image/png\",\"size\":587.27,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/ML_ef2a52c6c8.png\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2026-08-21T20:31:38.314Z\",\"updatedAt\":\"2026-08-21T20:31:38.314Z\",\"documentId\":\"y8xy8ykc0wijjyhkt8sfu3tb\",\"publishedAt\":\"2026-08-21T20:31:38.314Z\"}}]},{\"id\":102,\"title\":\"Blog\",\"featuredTitle\":\"Editor’s pick from the blog\",\"horizontalLayout\":true,\"bannerTitle\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Get \",\"type\":\"text\"},{\"bold\":true,\"text\":\"more\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"insights\",\"type\":\"text\"},{\"text\":\" on our blog\",\"type\":\"text\"}]}],\"bannerDescription\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"\",\"type\":\"text\"}]}],\"menu1Title\":\"Categories\",\"menu2Title\":null,\"menu3Title\":null,\"menu1External\":false,\"menu2External\":null,\"menu3External\":null,\"featuredCard\":[{\"id\":192,\"title\":null,\"description\":null,\"url\":null,\"img\":null}],\"featuredBlogs\":[{\"id\":5542,\"title\":\"Quantum internet 101: What it is, and why it matters\",\"createdAt\":\"2026-06-01T10:30:00.416Z\",\"updatedAt\":\"2026-11-11T14:04:29.393Z\",\"publishedAt\":\"2026-11-11T14:04:29.476Z\",\"locale\":\"en\",\"publishDate\":\"2026-06-01T13:00:00.000Z\",\"key\":\"quantum-internet-101-what-and-why\",\"AGNTCY_component\":null,\"documentId\":\"nsb8n4noanx3fwfpwpj9jwe2\",\"IoC_blog\":false,\"articleSummary\":\"- The quantum internet works alongside today's classical internet—not in place of it—enabling ultra-secure communication and distributed quantum computing that classical networks cannot deliver. \\n- Quantum networking matters because it unlocks physics-based security and the ability to solve problems that sit beyond the reach of classical systems. \\n- Progress is real but early, with qubit stability, entanglement distribution, and infrastructure scale remaining key barriers to widespread deployment. \\n- Leaders who take the initiative to understand and harness this emerging technology will be best positioned to shape and benefit from what will redefine secure communications and competitive advantage for decades to come. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":44,\"title\":\"Quantum\",\"createdAt\":\"2025-02-03T03:04:15.388Z\",\"updatedAt\":\"2025-12-23T06:47:01.134Z\",\"publishedAt\":\"2025-12-23T06:47:02.476Z\",\"locale\":\"en\",\"description\":\"Uncover how quantum computing is paving the way for immense benefits with unprecedented computational power and real-world impact.\",\"hidden\":false,\"key\":\"quantum\",\"documentId\":\"pe4dpog46v1h2p5195iqpnys\"}},{\"id\":5557,\"title\":\"AI vs. ASI:  Understanding the future of artificial superintelligence\",\"createdAt\":\"2026-03-17T10:39:35.693Z\",\"updatedAt\":\"2026-11-11T14:24:46.775Z\",\"publishedAt\":\"2026-11-11T14:24:46.848Z\",\"locale\":\"en\",\"publishDate\":\"2026-03-17T15:00:00.000Z\",\"key\":\"ai-asi-future-of-artificial-superintelligence\",\"AGNTCY_component\":null,\"documentId\":\"stise4i5wyehq4efnt69o0ed\",\"IoC_blog\":false,\"articleSummary\":\"- AI agents are highly capable within specific tasks, they suffer from \\\"semantic isolation,\\\" meaning they cannot easily share knowledge or coordinate on complex, multi-step goals \\n- Artificial superintelligence (ASI) is achieved when systems of autonomous agents reach \\\"economic viability\\\"—performing 100% of human tasks without intervention—and \\\"technical viability,\\\" where reasoning engines can invent novel solutions beyond their original training data. \\n- To achieve true ASI, Outshift proposes an architecture called the Internet of Cognition. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}}],\"CTA\":{\"id\":102,\"title\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Subscribe to \",\"type\":\"text\"},{\"bold\":true,\"text\":\"The\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"Shift\",\"type\":\"text\"},{\"text\":\"!\",\"type\":\"text\"}]}],\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Get emerging insights on emerging technology straight to your inbox.\",\"type\":\"text\"}]}],\"url\":\"/outshift-newsletter\"},\"menu3Items\":[],\"menu2Items\":[],\"menu1Items\":[{\"id\":1265,\"text\":\"AI/ML\",\"url\":\"/blog/ai-ml\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1266,\"text\":\"Quantum\",\"url\":\"/blog/quantum\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1267,\"text\":\"In-depth Tech\",\"url\":\"/blog/in-depth-tech\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1268,\"text\":\"Strategy \u0026 Insights\",\"url\":\"/blog/insights\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1269,\"text\":\"Research\",\"url\":\"/blog/research\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1270,\"text\":\"Inside Outshift\",\"url\":\"/blog/inside-outshift\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null}],\"bannerBtn\":{\"id\":2878,\"url\":\"/blog\",\"cta\":null,\"variant\":\"icon\",\"external\":false,\"iconName\":null,\"icon\":null},\"bannerImg\":null,\"blog_category\":null,\"filteredBlog\":[{\"id\":5529,\"title\":\"Quantum computing’s hardest problem isn’t physics, it’s connectivity \",\"createdAt\":\"2026-08-24T19:16:00.146Z\",\"updatedAt\":\"2026-11-11T13:37:22.661Z\",\"publishedAt\":\"2026-11-11T13:37:22.728Z\",\"locale\":\"en\",\"publishDate\":\"2026-08-25T15:00:00.000Z\",\"key\":\"quantum-networking-infrastructure\",\"AGNTCY_component\":null,\"documentId\":\"chol76xl2siu4duuwz4pa6y1\",\"IoC_blog\":false,\"articleSummary\":\"- Quantum mechanics defines the hard limits of what's possible. Infrastructure - manufacturing, standards, connectivity - determine when those capabilities reach people at scale. \\n- IBM, Cleveland Clinic, and RIKEN have linked quantum processors across continents, demonstrating a measurable expansion in quantum modeling capabilities. The results are promising, but the achievement is narrow in scope, isolated demonstrations, not repeatable, networked workflows ready for practical deployment. \\n- Cisco Quantum Labs is working to bridge that gap. Its universal quantum switch and entanglement chip are designed to enable quantum devices from different manufacturers to communicate over existing fiber infrastructure, transforming isolated experiments into an interconnected, scalable network. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":44,\"title\":\"Quantum\",\"createdAt\":\"2025-02-03T03:04:15.388Z\",\"updatedAt\":\"2025-12-23T06:47:01.134Z\",\"publishedAt\":\"2025-12-23T06:47:02.476Z\",\"locale\":\"en\",\"description\":\"Uncover how quantum computing is paving the way for immense benefits with unprecedented computational power and real-world impact.\",\"hidden\":false,\"key\":\"quantum\",\"documentId\":\"pe4dpog46v1h2p5195iqpnys\",\"icon\":{\"id\":646742,\"name\":\"quantum.svg\",\"alternativeText\":null,\"caption\":null,\"width\":19,\"height\":19,\"formats\":null,\"hash\":\"quantum\",\"ext\":\".svg\",\"mime\":\"image/svg+xml\",\"size\":1.62,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/quantum.svg\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2025-02-03T03:04:08.447Z\",\"updatedAt\":\"2025-02-03T03:04:08.447Z\",\"documentId\":\"k548dcetao8f2y3zjnxx8d3n\",\"publishedAt\":\"2025-11-11T15:19:30.164Z\"}},\"thumbnail\":{\"id\":997189,\"name\":\"Quantum.png\",\"alternativeText\":null,\"caption\":null,\"width\":1920,\"height\":1080,\"formats\":{\"thumbnail\":{\"ext\":\".png\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbnail_Quantum_e1a99778c5.png\",\"etag\":\"f0648f435e68a2850a8cb7bab86f3185\",\"hash\":\"thumbnail_Quantum_e1a99778c5\",\"mime\":\"image/png\",\"name\":\"thumbnail_Quantum.png\",\"path\":null,\"size\":75.92,\"width\":245,\"height\":138,\"sizeInBytes\":75923}},\"hash\":\"Quantum_e1a99778c5\",\"ext\":\".png\",\"mime\":\"image/png\",\"size\":1360.5,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/Quantum_e1a99778c5.png\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2026-08-24T22:26:31.704Z\",\"updatedAt\":\"2026-08-24T22:26:31.704Z\",\"documentId\":\"nob44tkj0ibg2lsibgd4sb3w\",\"publishedAt\":\"2026-08-24T22:26:31.705Z\"}},{\"id\":5524,\"title\":\"Insight Module for Agentic Systems: Observing the invisible in agentic AI\",\"createdAt\":\"2026-09-17T18:28:43.905Z\",\"updatedAt\":\"2026-11-11T13:29:22.912Z\",\"publishedAt\":\"2026-11-11T13:29:22.959Z\",\"locale\":\"en\",\"publishDate\":\"2026-09-18T13:00:00.000Z\",\"key\":\"insight-module-for-agentic-systems\",\"AGNTCY_component\":null,\"documentId\":\"c7xppuv3ij6kdby9wlrncds1\",\"IoC_blog\":false,\"articleSummary\":\"- Insight Module for Agentic Systems introduces a new control-plane observability layer for OpenClaw-based multi-agent systems, exposing how agents assemble context, delegate, and reason—addressing the blind spots where “traditional observability tells us what happened… but it cannot explain why a system behaved the way it did.” \\n- A rich suite of control-plane metrics—context composition, disclosure, memory fragmentation, repetition/novelty, parallelization—turns agent reasoning into measurable, actionable signals, powering debuggi 861f923de2bea46.js\"],\"BlogProgressBar\"]\n"])</script><script>self.__next_f.push([1,"4e:I[67436,[\"69066\",\"static/chunks/dc112a36-3757baf8107f4f1b.js\",\"85105\",\"static/chunks/0e5ce63c-26ceb6b53f9bf84d.js\",\"39229\",\"static/chunks/39229-206839c21caca748.js\",\"52619\",\"static/chunks/52619-2458d7d9f35e528c.js\",\"81356\",\"static/chunks/81356-8c78364b03cce2fb.js\",\"57770\",\"static/chunks/57770-239dbde04e2e397c.js\",\"88793\",\"static/chunks/88793-856c71cf5f7d9489.js\",\"45595\",\"static/chunks/45595-5054d002e635ca38.js\",\"14998\",\"static/chunks/14998-e7bd6b7d7590edd0.js\",\"54775\",\"static/chunks/54775-a01f710a1360ad6f.js\",\"58474\",\"static/chunks/58474-8aeb369df8b1168e.js\",\"62525\",\"static/chunks/62525-1d8b8fae60608469.js\",\"65460\",\"static/chunks/65460-93f14b474c1c9239.js\",\"6411\",\"static/chunks/6411-cc7df4de234b2b12.js\",\"30743\",\"static/chunks/30743-499268673cba22fb.js\",\"85940\",\"static/chunks/85940-2a922ac111b3cc05.js\",\"46392\",\"static/chunks/46392-06a1b7be8b511ec9.js\",\"32959\",\"static/chunks/32959-3a9ee3b65e8b648e.js\",\"87712\",\"static/chunks/87712-ab699c660a9df5c9.js\",\"34482\",\"static/chunks/34482-75b0bcf53c575848.js\",\"84346\",\"static/chunks/84346-9a0acbda39496191.js\",\"88405\",\"static/chunks/app/(public)/blog/%5Bcategory_slug%5D/%5Bslug%5D/page-8861f923de2bea46.js\"],\"BlogTrackers\"]\n"])</script><script>self.__next_f.push([1,"4f:T23ee,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003ci\u003eOutshift by Cisco is open-sourcing SCOPE, ACCORD, CONCORD, and MAS-Lab to address the silent cognitive failures of multi-agent AI.\u003c/i\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn 880 five-agent debates, Outshift researchers found that when agents skipped checking their conclusions, 75% of those debates ended with all five agreeing on the wrong answer, while every message, tool call, and status all looked healthy. Green dashboards, wrong outcomes.\u0026nbsp;\u003c/p\u003e\u003cp\u003eWe call these “\u003ca href=\"https://outshift.cisco.com/blog/ai-ml/cognitive-challenges-in-multi-agent-systems\"\u003e\u003ci\u003e\u003cu\u003es\u003c/u\u003e\u003c/i\u003e\u003cu\u003eilent cognitive failures with loud consequences\u003c/u\u003e\u003c/a\u003e,” because the system runs as designed while the reasoning breaks. How many of your multi-agent systems are failing this way right now, and how would you even know?\u0026nbsp;\u003c/p\u003e\u003ch2\u003eFour open source tools to catch silent cognitive failures\u0026nbsp;\u003c/h2\u003e\u003cp\u003eToday, Outshift is releasing four open source tools, each built for a different part of the problem to help observe failures, align intent, coordinate decisions, and verify the outcomes. The code is available at \u003ca href=\"https://github.com/ioc-project\"\u003e\u003cu\u003egithub.com/ioc-project\u003c/u\u003e\u003c/a\u003e.\u0026nbsp;\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eSCOPE\u003c/strong\u003e \u0026nbsp;(System for Cognitive Observability, Provenance \u0026amp; Explainability) detects whether (or not) your agents are reasoning together. \u0026nbsp;\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eACCORD\u003c/strong\u003e establishes shared intent before agents begin work, producing an auditable Intent Contract that\u0026nbsp;every agent works from.\u0026nbsp;\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eCONCORD\u003c/strong\u003e coordinates decisions during the work when agents have different but legitimate\u0026nbsp;objectives and certifies whether every participating agent can accept the result.\u0026nbsp;\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eMAS-Lab\u003c/strong\u003e reproduces failures under controlled conditions and evaluates whether agents completed the intended task.\u0026nbsp;\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003ch2\u003eAgents today can connect, but they can't think together.\u0026nbsp;\u003c/h2\u003e\u003cp\u003eThe \u003ca href=\"https://outshift.cisco.com/the-internet-of-agents\"\u003e\u003cu\u003eInternet of Agents\u003c/u\u003e\u003c/a\u003e (IoA) already has open source infrastructure. \u003ca href=\"https://agntcy.org/\"\u003e\u003cu\u003eAGNTCY\u003c/u\u003e\u003c/a\u003e, an open source collective now part of the Linux Foundation, is building tools for agents to discover one another, establish identity, and communicate across frameworks. Open protocols such as MCP and A2A also help agents connect. But a message still needs to be interpreted. Each receiving agent brings its own objectives, context, and incentives. A handoff can succeed mechanically and still fail as an outcome—and adding agents can multiply the mistake.\u0026nbsp;\u003c/p\u003e\u003cp\u003eBuilding on the Layer 8 and Layer 9 framing proposed in \u003ca href=\"https://arxiv.org/abs/2511.19699\"\u003e\u003cu\u003eA Layered Protocol Architecture for the Internet of Agents\u003c/u\u003e\u003c/a\u003e, the \u003ca href=\"https://outshift.cisco.com/internet-of-cognition\"\u003e\u003cu\u003eInternet of Cognition\u003c/u\u003e\u003c/a\u003e (IoC) provides the foundation for scaling intelligence beyond individual agents to collective intelligence. It introduces the infrastructure for agents and humans to establish shared intent, accumulate shared context and knowledge, and reason together to solve problems beyond the capabilities of individual agents.\u0026nbsp;\u003c/p\u003e\u003cp\u003eLayer 9, the Agent Semantic Layer, is a foundational part of this architecture, enabling agents to establish common meaning, coordinate goals, negotiate differences, and reach collective decisions. ACCORD and CONCORD address specific aspects of this semantic coordination: shared intent and decision-making under conflict, respectively. SCOPE and MAS-Lab provide the visibility and experimental infrastructure to observe, measure, and test failures in multi-agent collaboration. \u0026nbsp;\u003c/p\u003e\u003cp\u003eAnd since IoC is designed to extend existing systems, not replace them, you can apply these tools to your multi-agent systems (MAS) builds to strengthen the outcomes in ways current monitoring can’t detect. \u0026nbsp;\u003c/p\u003e\u003ch2\u003eSCOPE sees what your dashboards miss\u0026nbsp;\u003c/h2\u003e\u003cp\u003eSCOPE analyzes the OpenTelemetry traces you already collect, building on Outshift’s contributions to the project’s semantic conventions for multi-agent systems. It examines agent trajectories for intent misalignment, semantic inconsistency, coordination failures, and conclusions that lack meaningful verification. That lets developers inspect existing MAS without moving to a new monitoring stack.\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn one Outshift demo, standard OpenTelemetry monitoring reported a trip-planning application at 66% operational health, rated “performing well.” When SCOPE read the same traces for meaning, the app’s task completion score was 0% and semantic consistency was 22%. SCOPE also found four cognitive failures. Those numbers come from one session, and SCOPE did not need a single new span to find them.\u0026nbsp;\u003c/p\u003e\u003ch2\u003eACCORD aligns intent before work begins\u0026nbsp;\u003c/h2\u003e\u003cp\u003ePicture an agentic enterprise deal desk, where a customer agent asks for an application that supports 100,000 users. Sales commits to the requirement, Engineering plans for 100,000 registered accounts, and the customer means 100,000 concurrent users.\u0026nbsp;\u003c/p\u003e\u003cp\u003eEvery agent signed off on the \"same\" number but they are building toward a different outcome.\u0026nbsp;\u003c/p\u003e\u003cp\u003eACCORD addresses that gap before work begins. It brings agents together to establish who is involved, what the task means, what each agent knows, and how success will be verified.\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe result is a shared Intent Contract. Where agents interpret things differently, ACCORD exposes those disagreements upfront rather than allowing bad assumptions to cascade through the workflow.\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn a benchmark where agents held different pieces of information needed to solve a problem, ACCORD increased task success from 13% to 67%, a gain of more than 53 percentage points.\u0026nbsp;\u003c/p\u003e\u003cp\u003eACCORD won't improve every task. But when agents don't share the same understanding, doing more work faster is hardly the solution.\u0026nbsp;\u003c/p\u003e\u003ch2\u003eCONCORD coordinates decisions when the specialists disagree\u0026nbsp;\u003c/h2\u003e\u003cp\u003eNow every agent agrees on the customer's requirements, but Sales wants delivery this quarter, Engineering needs more time, Finance is protecting margin, and Legal has contractual constraints.\u0026nbsp;\u003c/p\u003e\u003cp\u003eEach agent has a legitimate position, and the team still needs one decision.\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhat happens next? Majority vote? Let the orchestrator decide? Ask the agents to debate until they agree?\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eCONCORD\u003c/strong\u003e gives agents a structured way to reconcile their competing objectives. It evaluates proposals against each agent's priorities and looks for an outcome that everyone can accept. When existing options fall short, the agents can construct a better alternative.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAnd unlike an orchestrator silently choosing a winner, CONCORD produces an auditable certificate showing whether every participating agent meets an agreed satisfaction threshold.\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn a measured four-agent incident-response scenario, CONCORD raised the least-satisfied agent's score from 23% to 75%.\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe winning proposal was nobody's first choice, which is what coordination looks like when it works.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003eFor the protocol mechanisms, guarantees, and detailed evaluations behind ACCORD and CONCORD, see our companion technical blog, \u003ci\u003eAgreeing on Purpose, Deciding Under Conflict\u003c/i\u003e.\u0026nbsp;\u003c/p\u003e\u003ch2\u003eMAS-Lab checks whether the work got done\u0026nbsp;\u003c/h2\u003e\u003cp\u003eYour agents have aligned on intent, coordinated their decisions, and completed the workflow. Did they\u003cstrong\u003e \u003c/strong\u003eactually solve the problem?\u0026nbsp;\u003c/p\u003e\u003cp\u003eAn agent reporting \"Done\" isn't evidence that the task succeeded, and five agents confidently agreeing on a remediation doesn't mean it fixed anything.\u0026nbsp;\u003c/p\u003e\u003cp\u003eMAS-Lab is a framework for building, running, and evaluating multi-agent systems under controlled conditions.\u0026nbsp;\u003c/p\u003e\u003cp\u003eMAS-Lab lets developers reproduce cognitive failures, experiment with different agent configurations and coordination mechanisms, and evaluate results against known answers or explicit success criteria.\u0026nbsp;\u003c/p\u003e\u003cp\u003eIt distinguishes workflow completion from task success.\u0026nbsp;\u003c/p\u003e\u003cp\u003eWith it, you can test whether adding ACCORD or CONCORD improves outcomes or just produces longer conversations or more elaborate agreements.\u0026nbsp;\u003c/p\u003e\u003cp\u003eMAS-Lab is also the experimental foundation behind our cognitive failures research and protocol evaluations.\u0026nbsp;\u003c/p\u003e\u003ch2\u003eBuild with us\u0026nbsp;\u003c/h2\u003e\u003cp\u003eConnection isn’t cognition.\u0026nbsp;\u003c/p\u003e\u003cp\u003eWe are releasing SCOPE, ACCORD, CONCORD, and MAS-Lab as open source tools because no single company should define how intelligent systems think together. These are early implementations, and we are publishing their limitations \u003ca href=\"https://ioc-project.github.io/publications/whitepapers/cognition-protocols-concord-accord.pdf\"\u003e\u003cu\u003ealongside the research\u003c/u\u003e\u003c/a\u003e so you can run them and challenge them.\u0026nbsp;\u003c/p\u003e\u003cp\u003ePick one multi-agent workflow you trust, run its traces through SCOPE, test ACCORD and CONCORD against the failures you uncover, and verify the outcomes in MAS-Lab. Then build in the open with us at \u003ca href=\"https://github.com/ioc-project\"\u003e\u003cu\u003egithub.com/ioc-project\u003c/u\u003e\u003c/a\u003e.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"14:[[\"$\",\"$L4c\",null,{}],\"$L4d\",[\"$\",\"$L4e\",null,{\"blogData\":{\"id\":5505,\"title\":\"The Internet of Cognition is here: Observe, align, and validate your multi-agent systems \",\"createdAt\":\"2026-10-26T21:16:42.798Z\",\"updatedAt\":\"2026-11-05T11:06:55.756Z\",\"publishedAt\":\"2026-11-05T11:06:55.804Z\",\"locale\":\"en\",\"publishDate\":\"2026-10-27T04:00:00.000Z\",\"key\":\"the-internet-of-cognition-is-here\",\"AGNTCY_component\":null,\"documentId\":\"zcm87wggxcr71zann4qwgu90\",\"IoC_blog\":true,\"articleSummary\":\"- Outshift by Cisco is open sourcing four tools, SCOPE, ACCORD, CONCORD, and MAS-Lab, as early building blocks of the Internet of Cognition. Together they detect silent cognitive failures in multi-agent AI, align agent intent, coordinate decisions, and verify outcomes. \\n- Across 880 five-agent debates, Outshift researchers found that when agents skipped checking their conclusions, 75% of those debates ended with all five agreeing on the wrong answer, while every message, tool call, and status check looked healthy. \\n- SCOPE analyzes existing OpenTelemetry traces to detect whether agents are reasoning together. ACCORD aligns agent intent before work begins, and CONCORD certifies whether every agent can accept a decision when their objectives conflict. \\n- MAS-Lab lets developers reproduce failures under controlled conditions and test whether a multi-agent system completed its task, separating task success from workflow completion. \",\"isExternal\":false,\"externalUrl\":null,\"thumbnail\":{\"id\":997352,\"name\":\"October_IoC_Market_Mome
