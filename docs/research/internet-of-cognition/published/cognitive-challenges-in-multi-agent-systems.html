03ch3\u003e5.7 What this means for choosing a pattern\u003c/h3\u003e\u003cp\u003eNeither a moderator nor a shared channel made cognitive failures disappear. Each changed where and how they surfaced, and the rules the agents worked under moved outcomes more than the shape of the team. Stronger models did not change that: with Claude Opus 4.6 and Gemini 2.5 Pro at the table, 43% of the 880 debates still carried at least one cognitive failure and one in ten ended in a confident, unanimous wrong answer. Nor did success rates reveal it: in the Agent Scaling corpus, cognitive failures were as frequent in successful runs as in failed ones, 71% and 72%. Two systems with the same success rate carried different risks, which makes choosing a pattern a risk decision as well as a performance one, and, as the next section shows, not a decision made once.\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1914/1378;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1791835177696_ac9el4q0pk7_cognitive_health_beyond_outcome_d93fb89d7a.png\" width=\"1914\" height=\"1378\"\u003e\u003cfigcaption\u003e\u003ci\u003eFigure 20: Share of successful and failed runs with at least one cognitive failure, and the most frequent failures.\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003ch2\u003e6. Lessons learned: fragile failures in production\u003c/h2\u003e\u003cp\u003eRunning these experiments taught us something the results only hint at: whether a cognitive failure appears is fragile. Turning a requirement into \"you should probably verify the evidence\" made the verifier skip evidence in 28% of runs. Rewording an incident report, facts unchanged, took a failure from 6.8% to 24.4% of runs. The moderator's instructions were rewritten so it could delegate in parallel, and the new version, run in a round-capped moderator loop, no longer made consulting the verifier a fixed step; correct runs barely moved, from 36% to 32%, while the verifier was skipped in 32% of clean runs instead of 8%. At a temperature of 0.1, with nothing changed, the debate pattern acted before approval in 8% of runs, and the five incidents the application handled best were fully solved in only 32% to 80% of reruns depending on the pattern. An earlier run of the same application, in August, with the same model, the same parallel-moderator instructions and the same 25 incidents, gave a different picture again: the centralized moderator was fully correct in 12% of runs, against 32% in the runs of Section 4.6; the staged debate was correct in 64% against 32%; and a pipeline passing the incident from specialist to specialist with no moderator never got it right. The same runs were flagged 0.8% or 15.6% of the time depending on the model doing the judging. Even our own instrument proved fragile: the signal we first used to count approvals was a text match that also fired when an agent merely quoted the rule \"only after verification: approved\", so it could not tell an approval from a mention, and we stopped using it.\u003c/p\u003e\u003ch3\u003e6.1 What this says about cognitive failures\u003c/h3\u003e\u003cp\u003eThey behaved like latent defects waiting for a trigger. The weakness sat in the design, where nothing required the moderator to reconcile divergent findings or the evidence to reach the verifier, and it stayed invisible until something set it off: a phrasing that stressed a trade-off, a modal verb read as optional, a different delegation order in one run. Engineers will recognize the shape from race conditions. A fixed test set samples the triggers; it cannot enumerate them.\u003c/p\u003e\u003cp\u003eThey also wore different symptoms depending on who was in charge, so a symptom did not identify its cause. They combined, and not additively: in the debate, one failure category cost almost nothing, with accuracy at 0.98, while three cost almost everything, at 0.16. They damaged the process before the outcome, as when the fix was right while the team never agreed on it in 84% of runs, or when stripping evidence made runs faster and cheaper. A few were systematic, like ChatDev's three-second test gate, which produced the same verification failure in 88% of its sessions and can be fixed once. Most appeared at a rate, and design changes moved the rate without bringing it to zero.\u003c/p\u003e\u003ch3\u003e6.2 What it means for production workloads\u003c/h3\u003e\u003cp\u003eIn these labs, one thing changed at a time. A production system meets all of them at once, and continuously: every user phrases a request differently, providers update and retire models, and the harness evolves through prompt edits, context limits, summarization of long histories, memory and new tools. If a single word or a single prompt version switched a failure on in a lab, a design review of the shipped system cannot be expected to find every such switch, and a system that passes each change on its own can still fail when several arrive together.\u003c/p\u003e\u003cp\u003eThe prompt rewrite above is the kind of change teams ship every week. It was made for efficiency, the success rate stayed flat, and the moderator quietly started skipping its verifier. An outcome-based regression test would have passed it; only checking whether the verification step actually ran showed it. Because runs differ even at low temperature, and even a baseline measured in August did not match the same baseline measured later, a failure seen once in production may not recur when the input is replayed, and a fix that worked once may simply have been a lucky run. Diagnosis needs the recorded trajectory, and regression tests need injected faults alongside accuracy.\u003c/p\u003e\u003cp\u003eGood design moved failures from random to systematic in our runs, which is worth doing because systematic failures can be fixed. It did not remove them. The rest of the risk has to be handled while the system runs.\u003c/p\u003e\u003ch3\u003e6.3 Reacting while the system runs\u003c/h3\u003e\u003cp\u003eThe first line is inside each agent: refusing to act on a claim that carries no evidence, and saying that the evidence is missing rather than committing to a guess, which is precisely what half of the debate's findings failed to do.\u003c/p\u003e\u003cp\u003eThe second line is across the agents of one system. Claims travel with their evidence to the check, any agent holding contrary data can stop a finding, execution is explicit and waits for approval and agreement, and a failed check sends the work back for repair instead of ending the run. The protocol that lifted success from 50% to 63% also cost successes on short, simple tasks, so these rules work best when they engage on a warning sign rather than on every step.\u003c/p\u003e\u003cp\u003eThe third line sits above the system, in a platform that sees many agents. Some signals are invisible to every agent in a session: that the evidence never reached the verifier, that execution came before approval, that a round ended without agreement. Some exist only across many sessions, like the 8% of clean debate runs that acted early. Some exist only across versions, like a prompt update that made the moderator skip its verifier while success stayed flat. And some need the system to record its decisions as events rather than prose: an approval should carry who gave it and on what evidence, because a phrase in a transcript cannot be told apart from a quoted rule. A platform that gathers what agents exchange can cover these blind spots, compare each version against a recorded baseline, calibrate and scale detection, and trigger the response inside the system when a signal fires.\u003c/p\u003e\u003ch3\u003e6.4 What comes next\u003c/h3\u003e\u003cp\u003eThe domain is large and we have only scratched its surface, but what we have seen is enough to treat cognitive failures the way production teams already treat reliability and security: systematically. The most important step is to detect the signals we saw, at runtime and on live traces, each detector calibrated against labelled runs: evidence that never reaches the gate, execution before approval, rounds that end without agreement, approval without supporting evidence. Next is to measure reactive protocols as interventions, starting with restoring the mandatory verification step in the parallel moderator, then protocols that engage only when a detector fires. Then comes tracking drift, by rerunning a frozen set of these scenarios at every model or prompt update and across model families, and varying the harness itself, since context limits, summarization and memory all change what each agent sees. After that we need wider evidence, with more incidents, more reruns, a second application, and confirmation that each injected flaw actually appeared. Finally, the patterns point at what they lacked: a moderator that commits only after peers have challenged one another, evidence checks that work when the evidence itself cannot be shared, and shared state that carries its version so that a stale claim does not linger in every agent's memory.\u003c/p\u003e\u003ch2\u003e7. Where this leaves us\u003c/h2\u003e\u003cp\u003e\u003cstrong\u003eCognitive failures are the baseline condition, not the edge case.\u003c/strong\u003e Across three architecturally different systems — a hybrid coding pipeline, a decentralized debate, and a controlled SRE-triage in two topologies — cognitive failures arose without exceptional conditions. In the two systems we observed in the wild, with nothing injected,\u003ci\u003e every\u003c/i\u003e ChatDev session carried at least one and 43% of debate sessions did. They are structural properties of how LLM agents represent shared state, communicate, and verify their own work. The useful questions are no longer \u003ci\u003ewhether\u003c/i\u003e, but \u003ci\u003ewhich ones\u003c/i\u003e, \u003ci\u003eat\u003c/i\u003e \u003ci\u003ewhat rate\u003c/i\u003e, and\u003ci\u003e with what consequence\u003c/i\u003e.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eThey are silent, and that is the point.\u003c/strong\u003e We measured the conventional signals rather than assuming them: of the challenges we injected, all but two left session duration, tool-call errors and token usage within 25% of baseline — and the exceptions deviated \u003ci\u003edownwards\u003c/i\u003e, looking like efficiency gains. This is the empirical core of the argument: the failures that most degrade a multi-agent system are, by construction, the ones the existing observability stack cannot see. Cognitive health monitoring is not a nice-to-have layered on top of APM. It is a missing primitive, as foundational as latency monitoring — and it cannot be synthesized from latency, cost, or error rate, because those signals are green, or better than green, while it happens.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAnd they compound.\u003c/strong\u003e The debate data is the clearest warning here: accuracy survives one cognitive failure category almost untouched (0.98) and collapses at three (0.16). Redundancy buys real tolerance to a single failure, which is why these systems look robust in testing — and it runs out abruptly, which is why they fail badly in production rather than gradually.\u003c/p\u003e\u003cp\u003eThe way agents collaborate is a risk decision, not only a performance one. Cognitive failures appeared in every pattern we looked at, each with its own profile: verification failures in a coding pipeline, overconfidence and herding in a debate, wrong plans under a moderator that kept consulting its verifier, early execution and no agreement among peers. Success rates looked alike across patterns, and failures were as common in successful runs as in failed ones, so performance alone did not reveal the exposure.\u003c/p\u003e\u003cp\u003eNeither a moderator nor a shared channel was a magic recipe. A moderator gave the system a decision point and cleaner clean runs, while its verifier kept being consulted as correctness collapsed. Exchange lifted the weaker agents and drove agreement, and quadrupled confident, unanimous wrong answers. What moved outcomes most were the rules: whether claims carried their evidence, whether execution waited for an explicit approval, and whether the check actually saw the evidence. Frontier models at the table did not prevent the failures.\u003c/p\u003e\u003cp\u003eAnd these failures are fragile. One word, one phrasing, one prompt version or one rerun switched them on or off, and a prompt rewritten for efficiency made the moderator skip its verifier in a third of clean runs while the success rate stayed flat. A production system meets all of these at once. That is the case for reacting while the system runs: inside each agent, across the agents, and in a platform that sees what no single agent can.\u003c/p\u003e\u003cp\u003eWhich brings us to the actionable split. \u003cstrong\u003eCognitive challenges come in two kinds, and they need two different answers.\u003c/strong\u003e\u003c/p\u003e\u003ch3\u003ei. Structural challenges — fix them at design time\u003c/h3\u003e\u003cp\u003eSome challenges are traceable to a specific, identifiable design decision. A three-second crash-only test gate guarantees CE-1. A hard-coded GUI default guarantees CR-1 on every CLI task. Agents with locally coherent but globally incompatible objectives guarantee CR-1 in production too. A control role that is real but never made explicit to the agents who must respect it guarantees DC-4.\u003c/p\u003e\u003cp\u003eThese are engineering defects, and they are fixable — but only if you can name them, reproduce them, and measure the effect of changing them. That is exactly the loop MAS-Lab plus this methodology provides: a shared taxonomy so a failure has a stable name; reproducible overlays so a challenge can be induced on demand with ground truth; observability metrics and cognitive observability so you can tell whether a design change actually removed the failure or just moved it. Iterate the MAS design against that loop and this whole class of failure gets designed out before shipping.\u003c/p\u003e\u003cp\u003eNotably, our data suggests the strongest predictor of \u003ci\u003ewhich\u003c/i\u003e challenges appear is not “centralized vs. decentralized” but \u003cstrong\u003ewhat the design constrains about verification and shared representation\u003c/strong\u003e. Coordination pattern shapes the profile — decentralized consensus architectures do produce consensus failures — but harness design choices dominate. Cognitive health is, in significant part, a design-time property.\u003c/p\u003e\u003ch3\u003eii. Irreducible challenges — you can only catch them at runtime\u003c/h3\u003e\u003cp\u003eThe rest will happen anyway. They arise from the task the MAS was given, from context the designer never saw, from intrinsic model behavior and environmental conditions that cannot be enumerated at design time. A genuinely ambiguous incident ticket. A specialist that is confidently wrong about a system it has correct information about. A question hard enough that IE-1 is the \u003ci\u003eexpected\u003c/i\u003e output of an agent doing its job. A debate that herds because the first speaker sounded certain. No amount of design iteration removes these, because they are not design defects.\u003c/p\u003e\u003cp\u003eFor this class, being able to name and reproduce a failure is not enough — you need to act while the system is running. Three things follow, and they are the substance of the \u003ca href=\"https://outshift.cisco.com/internet-of-cognition\"\u003e\u003cstrong\u003eInternet of Cognition\u003c/strong\u003e\u003c/a\u003e agenda:\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eCognition protocols. \u003c/strong\u003eAs argued in \u003ca href=\"https://outshift.cisco.com/internet-of-cognition/whitepaper\"\u003eScaling out Superintelligence\u003c/a\u003e, the missing layer above transport is cognitive coordination: protocols that align meaning, commitments, and verification obligations between autonomous agents at runtime. Our results say which protocol targets matter most — high-frequency, high-impact challenges first (CE-1's collapse of verification, CR-1's incompatible task models, DC-3's unreconciled disagreement), rather than the long tail.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eDetection mechanisms. \u003c/strong\u003eCognition protocols can only intervene if something notices in time. Our traces already carry usable early signals — an EOFError co-occurring with a positive verdict, zero feature-interaction spans behind a “tested” claim, divergent conclusions from identical evidence, unit mismatches in numeric fields crossing an interface, repeated identical assertions on an unchanged artifact. The job is to turn these intuitions into detectors that name the challenge, locate the earliest causal event, assign a confidence, and emit a structured signal before the commitment is made, not in post-mortem.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eA cognitive observability substrate. \u003c/strong\u003eBoth of the above need a perception layer underneath: something that produces, normalizes, and analyzes cognitive signals from MAS traces continuously, so detection has something to run on and cognition protocols has something to trigger from. That is what SCOPE is building and this study is the empirical groundwork it stands on.\u003c/li\u003e\u003c/ul\u003e\u003cfigure class=\"table\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003e\u003cstrong\u003eThe short version.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eMulti-agent systems already fail cognitively, constantly, and quietly — in carefully constructed systems built by people, with no adversary and no disruption. We can name these failures now, reproduce them on demand, and measure what they cost. Half of them we should design away. The other half we will have to catch in flight. Explore more with\u0026nbsp;\u003ca href=\"https://github.com/outshift-open/mas-lab\"\u003e\u003cu\u003eMAS-LAB\u003c/u\u003e\u003c/a\u003e, specification-driven foundation for building multi-agent systems that are testable, reproducible, observable, and governable from design to production.\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\u003ch2\u003eReferences\u003c/h2\u003e\u003cp\u003e1. Cemri, M., Pan, M. Z., Yang, S., Agrawal, L. A., Chopra, B., Tiwari, R., Keutzer, K., Parameswaran, A., Klein, D., Ramchandran, K., Zaharia, M., Gonzalez, J. E., Stoica, I. \u003cstrong\u003eWhy Do Multi-Agent LLM Systems Fail?\u003c/strong\u003e arXiv:2503.13657, 2025.\u0026nbsp;\u003ca href=\"https://arxiv.org/abs/2503.13657\"\u003e\u003cu\u003ehttps://arxiv.org/abs/2503.13657\u003c/u\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e2. Qian, C. et al. \u003cstrong\u003eChatDev: Communicative Agents for Software Development.\u003c/strong\u003e ACL 2024. arXiv:2307.07924.\u0026nbsp;\u003ca href=\"https://arxiv.org/abs/2307.07924\"\u003e\u003cu\u003ehttps://arxiv.org/abs/2307.07924\u003c/u\u003e\u003c/a\u003e · Public traces:\u0026nbsp;\u003ca href=\"https://github.com/OpenBMB/ChatDev\"\u003e\u003cu\u003ehttps://github.com/OpenBMB/ChatDev\u003c/u\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e3. Wang, Y. et al. \u003cstrong\u003eMMLU-Pro: A More Robust and Challenging Multi-Task Language Understanding Benchmark.\u003c/strong\u003e NeurIPS 2024. arXiv:2406.01574.\u0026nbsp;\u003ca href=\"https://arxiv.org/abs/2406.01574\"\u003e\u003cu\u003ehttps://arxiv.org/abs/2406.01574\u003c/u\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e4. Pandey, V. \u003cstrong\u003eInternet of Cognition\u003c/strong\u003e (vision paper). Outshift by Cisco, 2026.\u0026nbsp;\u003ca href=\"https://outshift.cisco.com/internet-of-cognition/whitepaper\"\u003e\u003cu\u003ehttps://outshift.cisco.com/internet-of-cognition/whitepaper\u003c/u\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e5. Kim, Y., Gu, K., Park, C., Park, C., Schmidgall, S., Heydari, A. A., Yan, Y., Zhang, Z., Zhuang, Y., Liu, Y., Malhotra, M., Liang, P. P., Park, H. W., Yang, Y., Xu, X., Du, Y., Patel, S., Althoff, T., McDuff, D., Liu, X. \u003cstrong\u003eTowards a Science of Scaling Agent Systems.\u003c/strong\u003e arXiv:2512.08296, 2025. \u003ca href=\"https://arxiv.org/abs/2512.08296\"\u003ehttps://arxiv.org/abs/2512.08296\u003c/a\u003e \u0026nbsp;· Code: \u003ca href=\"https://github.com/ybkim95/agent-scaling\"\u003ehttps://github.com/ybkim95/agent-scaling\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e6. Du, Y., Li, S., Torralba, A., Tenenbaum, J. B., Mordatch, I. \u003cstrong\u003eImproving Factuality and Reasoning in Language Models through Multiagent Debate\u003c/strong\u003e. arXiv:2305.14325, 2023. \u003ca href=\"https://arxiv.org/abs/2305.14325\"\u003ehttps://arxiv.org/abs/2305.14325\u003c/a\u003e\u0026nbsp;\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003ci\u003eCognitive failures were detected with an LLM-as-a-judge given the taxonomy, then manually verified. Figure values are reproduced from the underlying study; SRE-triage rates are over 25 runs per overlay against a matched baseline.\u003c/i\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"$L4a\",null,{}],\"$L4b\",[\"$\",\"$L4c\",null,{\"blogData\":{\"id\":5525,\"title\":\"Silent Failures, Loud Consequences: Cognitive Challenges in Multi-Agent Systems\",\"createdAt\":\"2026-09-14T18:50:56.781Z\",\"updatedAt\":\"2026-11-11T13:32:41.346Z\",\"publishedAt\":\"2026-11-11T13:32:41.384Z\",\"locale\":\"en\",\"publishDate\":\"2026-09-15T12:30:00.000Z\",\"key\":\"cognitive-challenges-in-multi-agent-systems\",\"AGNTCY_component\":null,\"documentId\":\"rkqe1wdivcegoswt8usybqlq\",\"IoC_blog\":true,\"articleSummary\":\"- Multi-agent systems fail silently through \\\"cognitive failures\\\"—misreadings, unverified claims, and false consensus—that conventional monitoring cannot detect.\\n- Testing ChatDev and a decentralized debate system found cognitive failures in 100% of the experiments with debate accuracy collapsing from 0.99 to 0.16 and even lower as failures compound.\\n- A new taxonomy names these failure modes, and Outshift by Cisco’s MAS-Lab tool can reproduce them on demand to measure their cost across different coordination patterns.\\n- Some cognitive failures can be designed out at the architecture level, but others can only be caught at runtime, which is the case Outshift has made for the Internet of Cognition.\\n\",\"isExternal\":false,\"externalUrl\":null,\"thumbnail\":{\"id\":997224,\"name\":\"image.png\",\"alternativeText\":null,\"caption\":null,\"width\":3840,\"height\":2160,\"formats\":{\"thumbnail\":{\"ext\":\".png\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbnail_image_c0a4566d25.png\",\"etag\":\"4d8ca54dd148773e090f291e82de9c27\",\"hash\":\"thumbnail_image_c0a4566d25\",\"mime\":\"image/png\",\"name\":\"thumbnail_image.png\",\"path\":null,\"size\":73.69,\"width\":245,\"height\":138,\"sizeInBytes\":73692}},\"hash\":\"image_c0a4566d25\",\"ext\":\".png\",\"mime\":\"image/png\",\"size\":6974.4,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/image_c0a4566d25.png\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2026-09-14T21:46:07.534Z\",\"updatedAt\":\"2026-09-14T21:46:07.534Z\",\"documentId\":\"qoj5offsqxljkax7d7rnpcr9\",\"publishedAt\":\"2026-09-14T21:46:07.535Z\"},\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhanci atic/chunks/34131-fa551a20b1dc778a.js\",\"18921\",\"static/chunks/18921-8995897a80bc7b7b.js\",\"32959\",\"static/chunks/32959-3a9ee3b65e8b648e.js\",\"41537\",\"static/chunks/41537-643f8aab4e148b10.js\",\"42306\",\"static/chunks/42306-1378c127e2fe9ab1.js\",\"91816\",\"static/chunks/app/(public)/layout-0d6da0b69c31c9d8.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L68\",null,{\"logo\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/outshift-logo-text-white.svg\",\"NavDropdowns\":[{\"id\":101,\"title\":\"Initiatives\",\"featuredTitle\":\"Recent blog posts\",\"horizontalLayout\":true,\"bannerTitle\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Get \",\"type\":\"text\"},{\"bold\":true,\"text\":\"more\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"insights\",\"type\":\"text\"},{\"text\":\" on our blog\",\"type\":\"text\"}]}],\"bannerDescription\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"\",\"type\":\"text\"}]}],\"menu1Title\":\"Our Work\",\"menu2Title\":\"Our Collaborators\",\"menu3Title\":null,\"menu1External\":false,\"menu2External\":true,\"menu3External\":null,\"featuredCard\":[],\"featuredBlogs\":[{\"id\":5534,\"title\":\"Continuous Agent Semantic Authorization (CASA) for Multi-Agent Systems \",\"createdAt\":\"2026-06-24T15:34:08.882Z\",\"updatedAt\":\"2026-11-11T13:44:18.946Z\",\"publishedAt\":\"2026-11-11T13:44:20.637Z\",\"locale\":\"en\",\"publishDate\":\"2026-06-25T18:00:00.000Z\",\"key\":\"continuous-agentic-semantic-authorization-for-mas\",\"AGNTCY_component\":null,\"documentId\":\"pty4948njeabnr63lx032rxn\",\"IoC_blog\":true,\"articleSummary\":\"- Continuous Agent Semantic Authorization (CASA) enables agent collaboration by providing intent-scoped authorization and continuous enforcement for multi-agent systems. \\n- Traditional authorization verifies identity and permissions but loses visibility into why an action is performed, creating an intent gap that authenticated, authorized actions can still violate. \\n- CASA closes that gap with five core capabilities: semantic intent parsing, task-based authorization, ephemeral authorization, delegation lineage tracking, and continuous semantic enforcement. \\n- Enforcement runs through lightweight sidecars and an eBPF-based network layer managed by the CASA runtime, with policies defined as Kubernetes CRDs, so you can deploy CASA without modifying application code or adding SDKs. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}},{\"id\":5535,\"title\":\"Mycelium: Coordination Layer for Multi-Agent Systems\",\"createdAt\":\"2026-06-24T19:35:13.974Z\",\"updatedAt\":\"2026-11-11T13:46:03.092Z\",\"publishedAt\":\"2026-11-11T13:46:05.956Z\",\"locale\":\"en\",\"publishDate\":\"2026-06-25T17:00:00.000Z\",\"key\":\"mycelium-coordination-layer-for-multi-agent-systems\",\"AGNTCY_component\":null,\"documentId\":\"rxgwvsg7bf6p54co7ohral6k\",\"IoC_blog\":true,\"articleSummary\":\"- Multi-agent systems often produce \\\"AI theater,\\\" where agents generate output but never converge on a decision; Mycelium adds shared memory and a structured negotiation layer so agents can think together. \\n- A \\\"room\\\" gives agents persistent, searchable memory (Markdown files dual-indexed into pgvector and AgensGraph), so what one agent learns, every agent inherits across sessions. \\n- A Cognition Engine mediates structured negotiation, agents propose, counter, and converge through a protocol rather than free-chatting, and consensus compiles into a shared, executable plan. \\n- In a 14 decision scenarios test, mediated negotiations reached a decision 93% of the time versus 36% for unstructured chat, and on the five hardest scenarios, unstructured chat reached zero decisions. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}}],\"CTA\":{\"id\":100,\"title\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Subscribe to \",\"type\":\"text\"},{\"bold\":true,\"text\":\"The\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"Shift\",\"type\":\"text\"},{\"text\":\"!\",\"type\":\"text\"}]}],\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Get emerging insights on emerging technology straight to your inbox.\",\"type\":\"text\"}]}],\"url\":\"/outshift-newsletter\"},\"menu3Items\":[],\"menu2Items\":[{\"id\":1260,\"text\":\"DevNet\",\"url\":\"https://developer.cisco.com\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":{\"location\":\"navigation\",\"link_label\":\"DevNet\",\"location_detail\":\"right\",\"resource_interaction\":\"visit to DevNet initiative page\"},\"submenu\":null,\"type\":null},{\"id\":1261,\"text\":\"Research\",\"url\":\"https://research.cisco.com\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":{\"location\":\"navigation\",\"link_label\":\"Research\",\"location_detail\":\"right\",\"resource_interaction\":\"visit to Research initiative page\"},\"submenu\":null,\"type\":null},{\"id\":1262,\"text\":\"Qua ",\"type\":\"text\"}]}],\"bannerDescription\":null,\"menu1Title\":\"Company\",\"menu2Title\":\"Apply\",\"menu3Title\":\"Connect\",\"menu1External\":false,\"menu2External\":false,\"menu3External\":true,\"featuredCard\":[],\"featuredBlogs\":[{\"id\":5543,\"title\":\"The state of Cisco Quantum Labs: The quantum networking advancements achieved in one year \",\"createdAt\":\"2026-05-28T14:39:43.478Z\",\"updatedAt\":\"2026-11-11T14:08:13.600Z\",\"publishedAt\":\"2026-11-11T14:08:13.685Z\",\"locale\":\"en\",\"publishDate\":\"2026-05-28T15:00:00.000Z\",\"key\":\"state-quantum-labs-innovations\",\"AGNTCY_component\":null,\"documentId\":\"n97adiz5zi65dyh3e4evy6o4\",\"IoC_blog\":false,\"articleSummary\":\"- Within one year, Cisco Quantum Labs, Cisco Research, and the Outshift teams launched foundational advancements in quantum networking, including a room-temperature entanglement chip, a network-aware distributed compiler, and the Cisco Universal Quantum Switch. \\n- Cisco Quantum Labs and Outshift are driving a vendor-agnostic strategy that connects isolated quantum machines into an early architecture of a quantum networking ecosystem. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":44,\"title\":\"Quantum\",\"createdAt\":\"2025-02-03T03:04:15.388Z\",\"updatedAt\":\"2025-12-23T06:47:01.134Z\",\"publishedAt\":\"2025-12-23T06:47:02.476Z\",\"locale\":\"en\",\"description\":\"Uncover how quantum computing is paving the way for immense benefits with unprecedented computational power and real-world impact.\",\"hidden\":false,\"key\":\"quantum\",\"documentId\":\"pe4dpog46v1h2p5195iqpnys\"}},{\"id\":5544,\"title\":\"Exploring the Internet of Cognition \",\"createdAt\":\"2026-05-26T20:57:15.223Z\",\"updatedAt\":\"2026-11-11T14:09:41.547Z\",\"publishedAt\":\"2026-11-11T14:09:41.621Z\",\"locale\":\"en\",\"publishDate\":\"2026-05-27T18:00:00.000Z\",\"key\":\"exploring-the-internet-of-cognition\",\"AGNTCY_component\":null,\"documentId\":\"ioebl0fn6phab0jn2vvykuku\",\"IoC_blog\":true,\"articleSummary\":\"- Multi-agentsystems often fail during cross-organizational collaboration due to a lack of shared cognitive frameworks and isolation. \\n- The [Internet of Cognition](https://outshift.cisco.com/internet-of-cognition) (IoC) architecture solves this by equipping distributed agents with shared intent, shared context, and shared reasoning. \\n- An interactive Explore experience provides tangible, real-world scenarios—such as software crisis management and healthcare coordination—to demonstrate how IoC resolves complex agent deadlocks. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}}],\"CTA\":{\"id\":101,\"title\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Subscribe to \",\"type\":\"text\"},{\"bold\":true,\"text\":\"The\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"Shift\",\"type\":\"text\"},{\"text\":\"!\",\"type\":\"text\"}]}],\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Get emerging insights on emerging technology straight to your inbox.\",\"type\":\"text\"}]}],\"url\":\"/outshift-newsletter\"},\"menu3Items\":[{\"id\":1277,\"text\":\"Events\",\"url\":\"/events\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1278,\"text\":\"Contact Us\",\"url\":\"/contact-us\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1279,\"text\":\"YouTube\",\"url\":\"https://www.youtube.com/channel/UCyf0N9nryCKAecEuCkcECxg\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1280,\"text\":\"LinkedIn\",\"url\":\"https://www.linkedin.com/showcase/outshiftbycisco/\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1281,\"text\":\"GitHub\",\"url\":\"https://github.com/agntcy\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1282,\"text\":\"X\",\"url\":\"https://twitter.com/outshiftbycisco\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1283,\"text\":\"BlueSky\",\"url\":\"https://bsky.app/profile/outshift.cisco.com\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":null,\"submenu\":null,\"type\":null}],\"menu2Items\":[{\"id\":1264,\"text\":\"Job Openings\",\"url\":\"/careers\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null}],\"menu1Items\":[{\"id\":1253,\"text\":\"About Us\",\"url\":\"/about-us\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1254,\"text\":\"Our Team\",\"url\":\"/our-team\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1255,\"text\":\"The Shift\",\"url\":\"/outshift-newsletter\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":{\"location\":\"Navigation bar - header\",\"link_label\":\"The Shift\",\"location_detail\":\"About us - company\",\"resource_interaction\":\"view newsletter subscription form\"},\"submenu\":null,\"type\":null}],\"bannerBtn\":{\"id\":2876,\"url\":\"/blog\",\"cta\":null,\"variant\":\"icon\",\"external\":null,\"iconName\":null,\"icon\":null},\"bannerImg\":null,\"blog_category\":null,\"filteredBlog\":[{\"id\":5527,\"title\":\"Why your organization needs an agent directory as part of its AI governance plan\",\"createdAt\":\"2026-08-19T15:49:09.570Z\",\"updatedAt\":\"2026-11-11T13:34:45.038Z\",\"publishedAt\":\"2026-11-11T13:34:45.075Z\",\"locale\":\"en\",\"publishDate\":\"2026-09-01T11:00:00.000Z\",\"key\":\"ai-governance-agent-directory\",\"AGNTCY_component\":null,\"documentId\":\"wekl24oxy7r1rtil4cb28a2w\",\"IoC_blog\":false,\"articleSummary\":\"- Most enterprises lack an inventory of the AI agents running inside their own networks—a gap that creates compounding governance, security, and compliance risks as deployments scale. \\n- Agent Directory and Identity Service, projects part of AGNTCY, a Linux Foundation, address this directly with an open source platform for publishing, discovering, and managing agents using cryptographically signed AI Cards and verifiable digital identities that integrate with enterprise providers like Duo, Okta, and Ory. \\n- Governance through discovery and identity verification is not a bottleneck to innovation; it is the operational foundation that makes secure, scalable multi-agent collaboration possible. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\",\"icon\":{\"id\":863525,\"name\":\"Black.svg\",\"alternativeText\":null,\"caption\":null,\"width\":19,\"height\":19,\"formats\":null,\"hash\":\"Black\",\"ext\":\".svg\",\"mime\":\"image/svg+xml\",\"size\":0.96,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/Black.svg\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2025-01-30T20:12:36.154Z\",\"updatedAt\":\"2025-01-30T20:12:36.154Z\",\"documentId\":\"nztec76i90n36sew1t2doso4\",\"publishedAt\":\"2025-11-11T15:19:30.164Z\"}},\"thumbnail\":{\"id\":997184,\"name\":\"IoA SEO blog.png\",\"alternativeText\":null,\"caption\":null,\"width\":1920,\"height\":1080,\"formats\":{\"thumbnail\":{\"ext\":\".png\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbnail_Io_A_SEO_blog_af34065657.png\",\"etag\":\"7c81a8f6cef3cdcaa5f77da3772b52b7\",\"hash\":\"thumbnail_Io_A_SEO_blog_af34065657\",\"mime\":\"image/png\",\"name\":\"thumbnail_IoA SEO blog.png\",\"path\":null,\"size\":71.32,\"width\":245,\"height\":138,\"sizeInBytes\":71319}},\"hash\":\"Io_A_SEO_blog_af34065657\",\"ext\":\".png\",\"mime\":\"image/png\",\"size\":1098.22,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/Io_A_SEO_blog_af34065657.png\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2026-08-19T15:49:09.507Z\",\"updatedAt\":\"2026-08-19T15:49:09.507Z\",\"documentId\":\"afijh98v57im8obrdsdzn7hy\",\"publishedAt\":\"2026-08-19T15:49:09.507Z\"}},{\"id\":5528,\"title\":\"AI security for autonomous agents starts with task-based access control \",\"createdAt\":\"2026-08-20T17:15:32.357Z\",\"updatedAt\":\"2026-11-11T13:36:22.122Z\",\"publishedAt\":\"2026-11-11T13:36:22.190Z\",\"locale\":\"en\",\"publishDate\":\"2026-08-31T11:00:00.000Z\",\"key\":\"ai-security-for-autonomous-agents\",\"AGNTCY_component\":null,\"documentId\":\"jcpz3935sa9wonhoqnyhw34l\",\"IoC_blog\":false,\"articleSummary\":\"- Autonomous Artificial Intelligence (AI) agents can pursue legitimate goals through unauthorized paths—a systemic security gap that identity-based access control is built to close. \\n- AGNTCY, a Linux Foundation project (AGNTCY)'s Task-Based Access Control (T-BAC) model enforces tool-level policy at the moment of each call, not at token issuance, enabling continuous authorization that adapts as agent behavior evolves. \\n- Agent2Agent (A2A) 1.0 defines when to request authorization; AGNTCY fills the gap by defining what that authorization means—and the working group is open for developers, security architects, and researchers to help shape it. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\",\"icon\":{\"id\":863525,\"name\":\"Black.svg\",\"alternativeText\":null,\"caption\":null,\"width\":19,\"height\":19,\"formats\":null,\"hash\":\"Black\",\"ext\":\".svg\",\"mime\":\"image/svg+xml\",\"size\":0.96,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/Black.svg\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2025-01-30T20:12:36.154Z\",\"updatedAt\":\"2025-01-30T20:12:36.154Z\",\"documentId\":\"nztec76i90n36sew1t2doso4\",\"publishedAt\":\"2025-11-11T15:19:30.164Z\"}},\"thumbnail\":{\"id\":997187,\"name\":\"ML.png\",\"alternativeText\":null,\"caption\":null,\"width\":1920,\"height\":1080,\"formats\":{\"thumbnail\":{\"ext\":\".png\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbnail_ML_ef2a52c6c8.png\",\"etag\":\"ee18489b1db1c4e6c9570effcc7cbc94\",\"hash\":\"thumbnail_ML_ef2a52c6c8\",\"mime\":\"image/png\",\"name\":\"thumbnail_ML.png\",\"path\":null,\"size\":54.28,\"width\":245,\"height\":138,\"sizeInBytes\":54283}},\"hash\":\"ML_ef2a52c6c8\",\"ext\":\".png\",\"mime\":\"image/png\",\"size\":587.27,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/ML_ef2a52c6c8.png\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2026-08-21T20:31:38.314Z\",\"updatedAt\":\"2026-08-21T20:31:38.314Z\",\"documentId\":\"y8xy8ykc0wijjyhkt8sfu3tb\",\"publishedAt\":\"2026-08-21T20:31:38.314Z\"}}]},{\"id\":102,\"title\":\"Blog\",\"featuredTitle\":\"Editor’s pick from the blog\",\"horizontalLayout\":true,\"bannerTitle\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Get \",\"type\":\"text\"},{\"bold\":true,\"text\":\"more\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"insights\",\"type\":\"text\"},{\"text\":\" on our blog\",\"type\":\"text\"}]}],\"bannerDescription\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"\",\"type\":\"text\"}]}],\"menu1Title\":\"Categories\",\"menu2Title\":null,\"menu3Title\":null,\"menu1External\":false,\"menu2External\":null,\"menu3External\":null,\"featuredCard\":[{\"id\":192,\"title\":null,\"description\":null,\"url\":null,\"img\":null}],\"featuredBlogs\":[{\"id\":5542,\"title\":\"Quantum internet 101: What it is, and why it matters\",\"createdAt\":\"2026-06-01T10:30:00.416Z\",\"updatedAt\":\"2026-11-11T14:04:29.393Z\",\"publishedAt\":\"2026-11-11T14:04:29.476Z\",\"locale\":\"en\",\"publishDate\":\"2026-06-01T13:00:00.000Z\",\"key\":\"quantum-internet-101-what-and-why\",\"AGNTCY_component\":null,\"documentId\":\"nsb8n4noanx3fwfpwpj9jwe2\",\"IoC_blog\":false,\"articleSummary\":\"- The quantum internet works alongside today's classical internet—not in place of it—enabling ultra-secure communication and distributed quantum computing that classical networks cannot deliver. \\n- Quantum networking matters because it unlocks physics-based security and the ability to solve problems that sit beyond the reach of classical systems. \\n- Progress is real but early, with qubit stability, entanglement distribution, and infrastructure scale remaining key barriers to widespread deployment. \\n- Leaders who take the initiative to understand and harness this emerging technology will be best positioned to shape and benefit from what will redefine secure communications and competitive advantage for decades to come. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":44,\"title\":\"Quantum\",\"createdAt\":\"2025-02-03T03:04:15.388Z\",\"updatedAt\":\"2025-12-23T06:47:01.134Z\",\"publishedAt\":\"2025-12-23T06:47:02.476Z\",\"locale\":\"en\",\"description\":\"Uncover how quantum computing is paving the way for immense benefits with unprecedented computational power and real-world impact.\",\"hidden\":false,\"key\":\"quantum\",\"documentId\":\"pe4dpog46v1h2p5195iqpnys\"}},{\"id\":5557,\"title\":\"AI vs. ASI:  Understanding the future of artificial superintelligence\",\"createdAt\":\"2026-03-17T10:39:35.693Z\",\"updatedAt\":\"2026-11-11T14:24:46.775Z\",\"publishedAt\":\"2026-11-11T14:24:46.848Z\",\"locale\":\"en\",\"publishDate\":\"2026-03-17T15:00:00.000Z\",\"key\":\"ai-asi-future-of-artificial-superintelligence\",\"AGNTCY_component\":null,\"documentId\":\"stise4i5wyehq4efnt69o0ed\",\"IoC_blog\":false,\"articleSummary\":\"- AI agents are highly capable within specific tasks, they suffer from \\\"semantic isolation,\\\" meaning they cannot easily share knowledge or coordinate on complex, multi-step goals \\n- Artificial superintelligence (ASI) is achieved when systems of autonomous agents reach \\\"economic viability\\\"—performing 100% of human tasks without intervention—and \\\"technical viability,\\\" where reasoning engines can invent novel solutions beyond their original training data. \\n- To achieve true ASI, Outshift proposes an architecture called the Internet of Cognition. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}}],\"CTA\":{\"id\":102,\"title\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Subscribe to \",\"type\":\"text\"},{\"bold\":true,\"text\":\"The\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"Shift\",\"type\":\"text\"},{\"text\":\"!\",\"type\":\"text\"}]}],\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Get emerging insights on emerging technology straight to your inbox.\",\"type\":\"text\"}]}],\"url\":\"/outshift-newsletter\"},\"menu3Items\":[],\"menu2Items\":[],\"menu1Items\":[{\"id\":1265,\"text\":\"AI/ML\",\"url\":\"/blog/ai-ml\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1266,\"text\":\"Quantum\",\"url\":\"/blog/quantum\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1267,\"text\":\"In-depth Tech\",\"url\":\"/blog/in-depth-tech\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1268,\"text\":\"Strategy \u0026 Insights\",\"url\":\"/blog/insights\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1269,\"text\":\"Research\",\"url\":\"/blog/research\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null},{\"id\":1270,\"text\":\"Inside Outshift\",\"url\":\"/blog/inside-outshift\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null}],\"bannerBtn\":{\"id\":2878,\"url\":\"/blog\",\"cta\":null,\"variant\":\"icon\",\"external\":false,\"iconName\":null,\"icon\":null},\"bannerImg\":null,\"blog_category\":null,\"filteredBlog\":[{\"id\":5529,\"title\":\"Quantum computing’s hardest problem isn’t physics, it’s connectivity \",\"createdAt\":\"2026-08-24T19:16:00.146Z\",\"updatedAt\":\"2026-11-11T13:37:22.661Z\",\"publishedAt\":\"2026-11-11T13:37:22.728Z\",\"locale\":\"en\",\"publishDate\":\"2026-08-25T15:00:00.000Z\",\"key\":\"quantum-networking-infrastructure\",\"AGNTCY_component\":null,\"documentId\":\"chol76xl2siu4duuwz4pa6y1\",\"IoC_blog\":false,\"articleSummary\":\"- Quantum mechanics defines the hard limits of what's possible. Infrastructure - manufacturing, standards, connectivity - determine when those capabilities reach people at scale. \\n- IBM, Cleveland Clinic, and RIKEN have linked quantum processors across continents, demonstrating a measurable expansion in quantum modeling capabilities. The results are promising, but the achievement is narrow in scope, isolated demonstrations, not repeatable, networked workflows ready for practical deployment. \\n- Cisco Quantum Labs is working to bridge that gap. Its universal quantum switch and entanglement chip are designed to enable quantum devices from different manufacturers to communicate over existing fiber infrastructure, transforming isolated experiments into an interconnected, scalable network. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":44,\"title\":\"Quantum\",\"createdAt\":\"2025-02-03T03:04:15.388Z\",\"updatedAt\":\"2025-12-23T06:47:01.134Z\",\"publishedAt\":\"2025-12-23T06:47:02.476Z\",\"locale\":\"en\",\"description\":\"Uncover how quantum computing is paving the way for immense benefits with unprecedented computational power and real-world impact.\",\"hidden\":false,\"key\":\"quantum\",\"documentId\":\"pe4dpog46v1h2p5195iqpnys\",\"icon\":{\"id\":646742,\"name\":\"quantum.svg\",\"alternativeText\":null,\"caption\":null,\"width\":19,\"height\":19,\"formats\":null,\"hash\":\"quantum\",\"ext\":\".svg\",\"mime\":\"image/svg+xml\",\"size\":1.62,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/quantum.svg\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2025-02-03T03:04:08.447Z\",\"updatedAt\":\"2025-02-03T03:04:08.447Z\",\"documentId\":\"k548dcetao8f2y3zjnxx8d3n\",\"publishedAt\":\"2025-11-11T15:19:30.164Z\"}},\"thumbnail\":{\"id\":997189,\"name\":\"Quantum.png\",\"alternativeText\":null,\"caption\":null,\"width\":1920,\"height\":1080,\"formats\":{\"thumbnail\":{\"ext\":\".png\",\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/thumbnail_Quantum_e1a99778c5.png\",\"etag\":\"f0648f435e68a2850a8cb7bab86f3185\",\"hash\":\"thumbnail_Quantum_e1a99778c5\",\"mime\":\"image/png\",\"name\":\"thumbnail_Quantum.png\",\"path\":null,\"size\":75.92,\"width\":245,\"height\":138,\"sizeInBytes\":75923}},\"hash\":\"Quantum_e1a99778c5\",\"ext\":\".png\",\"mime\":\"image/png\",\"size\":1360.5,\"url\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/Quantum_e1a99778c5.png\",\"previewUrl\":null,\"provider\":\"aws-s3\",\"provider_metadata\":null,\"createdAt\":\"2026-08-24T22:26:31.704Z\",\"updatedAt\":\"2026-08-24T22:26:31.704Z\",\"documentId\":\"nob44tkj0ibg2lsibgd4sb3w\",\"publishedAt\":\"2026-08-24T22:26:31.705Z\"}},{\"id\":5524,\"title\":\"Insight Module for Agentic Systems: Observing the invisible in agentic AI\",\"createdAt\":\"2026-09-17T18:28:43.905Z\",\"updatedAt\":\"2026-11-11T13:29:22.912Z\",\"publishedAt\":\"2026-11-11T13:29:22.959Z\",\"locale\":\"en\",\"publishDate\":\"2026-09-18T13:00:00.000Z\",\"key\":\"insight-module-for-agentic-systems\",\"AGNTCY_component\":null,\"documentId\":\"c7xppuv3ij6kdby9wlrncds1\",\"IoC_blog\":false,\"articleSummary\":\"- Insight Module for Agentic Systems introduces a new control-plane observability layer for OpenClaw-based multi-agent systems, exposing how agents assemble context, delegate, and reason—addressing the blind spots where “traditional observability tells us what happened… but it cannot explain why a system behaved the way it did.” \\n- A rich suite of control-plane metrics—context composition, disclosure, memory fragmentation, repetition/novelty, parallelization—turns agent reasoning into measurable, actionable signals, powering debugging, optimization, and eventually self-le 1ym7pw9qqy1ffo3e1\",\"IoC_blog\":false,\"articleSummary\":\"- Webex has integrated AGNTCY Directory and Identity into its Agent Central Service (ACS), enabling trusted onboarding, secure discovery, and verified communication for AI and agentic applications across the Webex ecosystem. \\n- This integration establishes a unified governance and security layer for multi-agent systems, supporting interoperable AI agents built on open standards like MCP, A2A, and AGNTCY protocols, and strengthening enterprise-grade trust and compliance. \\n- Developers can now register, verify, and publish agentic servers through the Webex Developer Portal and App Hub, with enterprise provisioning, policy enforcement, and lifecycle controls managed centrally through Webex Control Hub. \",\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}},{\"id\":5466,\"title\":\"Swisscom and Outshift team up to build agentic AI-enabled networks\",\"createdAt\":\"2025-04-10T20:02:45.856Z\",\"updatedAt\":\"2026-10-15T16:07:08.913Z\",\"publishedAt\":\"2026-10-15T16:07:09.037Z\",\"locale\":\"en\",\"publishDate\":\"2025-04-24T16:00:00.000Z\",\"key\":\"outshift-swisscom-agentic-ai-networks\",\"AGNTCY_component\":null,\"documentId\":\"n40b2ibd1ba9ut9xd234xwtf\",\"IoC_blog\":null,\"articleSummary\":null,\"isExternal\":null,\"externalUrl\":null,\"blog_category\":{\"id\":40,\"title\":\"Inside Outshift\",\"createdAt\":\"2023-12-21T14:26:04.911Z\",\"updatedAt\":\"2025-12-23T06:47:00.795Z\",\"publishedAt\":\"2025-12-23T06:47:02.077Z\",\"locale\":\"en\",\"description\":\"Learn what makes our tech tick — our team! Dive into behind the scenes happenings at Outshift and Cisco.\",\"hidden\":false,\"key\":\"inside-outshift\",\"documentId\":\"bhm2x3u3x8jsxrfu5zadbr17\"}}],\"CTA\":{\"id\":104,\"title\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Subscribe to \",\"type\":\"text\"},{\"bold\":true,\"text\":\"The\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"Shift\",\"type\":\"text\"},{\"text\":\"!\",\"type\":\"text\"}]}],\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Get emerging insights on emerging technology straight to your inbox.\",\"type\":\"text\"}]}],\"url\":\"/outshift-newsletter\"},\"menu3Items\":[],\"menu2Items\":[],\"menu1Items\":[{\"id\":1256,\"text\":\"View all\",\"url\":\"/case-studies\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":\"Navigation\"},{\"id\":1257,\"text\":\"Servicesnow Integration\",\"url\":\"/case-studies/servicenow-outshift-federate-ai-discovery\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":\"Navigation\"},{\"id\":1258,\"text\":\"WebEx Integration\",\"url\":\"/case-studies/webex-agntcy-directory-identity\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":\"Navigation\"},{\"id\":1259,\"text\":\"Swisscom Integration\",\"url\":\"/case-studies/swisscom-agentic-ai-network-reliability\",\"eyebrow\":null,\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":\"Navigation\"}],\"bannerBtn\":{\"id\":2877,\"url\":\"/blog\",\"cta\":null,\"variant\":\"icon\",\"external\":null,\"iconName\":null,\"icon\":null},\"bannerImg\":null,\"blog_category\":null}],\"eyeBrowLink\":{\"id\":1247,\"text\":\"Resources\",\"url\":\"/resources\",\"eyebrow\":\"NEW\",\"internal\":true,\"segmentOpt\":null,\"submenu\":null,\"type\":null}}]\n"])</script><script>self.__next_f.push([1,"10:[\"$\",\"$L68\",null,{\"logo\":\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/outshift-logo-text-white.svg\",\"NavDropdowns\":[{\"id\":101,\"title\":\"Initiatives\",\"featuredTitle\":\"Recent blog posts\",\"horizontalLayout\":true,\"bannerTitle\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Get \",\"type\":\"text\"},{\"bold\":true,\"text\":\"more\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"insights\",\"type\":\"text\"},{\"text\":\" on our blog\",\"type\":\"text\"}]}],\"bannerDescription\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"\",\"type\":\"text\"}]}],\"menu1Title\":\"Our Work\",\"menu2Title\":\"Our Collaborators\",\"menu3Title\":null,\"menu1External\":false,\"menu2External\":true,\"menu3External\":null,\"featuredCard\":[],\"featuredBlogs\":[{\"id\":5534,\"title\":\"Continuous Agent Semantic Authorization (CASA) for Multi-Agent Systems \",\"createdAt\":\"2026-06-24T15:34:08.882Z\",\"updatedAt\":\"2026-11-11T13:44:18.946Z\",\"publishedAt\":\"2026-11-11T13:44:20.637Z\",\"locale\":\"en\",\"publishDate\":\"2026-06-25T18:00:00.000Z\",\"key\":\"continuous-agentic-semantic-authorization-for-mas\",\"AGNTCY_component\":null,\"documentId\":\"pty4948njeabnr63lx032rxn\",\"IoC_blog\":true,\"articleSummary\":\"- Continuous Agent Semantic Authorization (CASA) enables agent collaboration by providing intent-scoped authorization and continuous enforcement for multi-agent systems. \\n- Traditional authorization verifies identity and permissions but loses visibility into why an action is performed, creating an intent gap that authenticated, authorized actions can still violate. \\n- CASA closes that gap with five core capabilities: semantic intent parsing, task-based authorization, ephemeral authorization, delegation lineage tracking, and continuous semantic enforcement. \\n- Enforcement runs through lightweight sidecars and an eBPF-based network layer managed by the CASA runtime, with policies defined as Kubernetes CRDs, so you can deploy CASA without modifying application code or adding SDKs. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}},{\"id\":5535,\"title\":\"Mycelium: Coordination Layer for Multi-Agent Systems\",\"createdAt\":\"2026-06-24T19:35:13.974Z\",\"updatedAt\":\"2026-11-11T13:46:03.092Z\",\"publishedAt\":\"2026-11-11T13:46:05.956Z\",\"locale\":\"en\",\"publishDate\":\"2026-06-25T17:00:00.000Z\",\"key\":\"mycelium-coordination-layer-for-multi-agent-systems\",\"AGNTCY_component\":null,\"documentId\":\"rxgwvsg7bf6p54co7ohral6k\",\"IoC_blog\":true,\"articleSummary\":\"- Multi-agent systems often produce \\\"AI theater,\\\" where agents generate output but never converge on a decision; Mycelium adds shared memory and a structured negotiation layer so agents can think together. \\n- A \\\"room\\\" gives agents persistent, searchable memory (Markdown files dual-indexed into pgvector and AgensGraph), so what one agent learns, every agent inherits across sessions. \\n- A Cognition Engine mediates structured negotiation, agents propose, counter, and converge through a protocol rather than free-chatting, and consensus compiles into a shared, executable plan. \\n- In a 14 decision scenarios test, mediated negotiations reached a decision 93% of the time versus 36% for unstructured chat, and on the five hardest scenarios, unstructured chat reached zero decisions. \",\"isExternal\":false,\"externalUrl\":null,\"blog_category\":{\"id\":47,\"title\":\"AI/ML\",\"createdAt\":\"2025-01-30T20:12:48.488Z\",\"updatedAt\":\"2026-03-13T15:17:48.416Z\",\"publishedAt\":\"2026-03-13T15:17:50.744Z\",\"locale\":\"en\",\"description\":\"Get ready for the transformative world of Artificial Intelligence and Machine Learning. Explore the latest innovations, applications, and breakthroughs that are shaping industries and enhancing everyday life.\",\"hidden\":false,\"key\":\"ai-ml\",\"documentId\":\"whr2ay41jatk18xq6grb7hdq\"}}],\"CTA\":{\"id\":100,\"title\":[{\"type\":\"heading\",\"level\":5,\"children\":[{\"text\":\"Subscribe to \",\"type\":\"text\"},{\"bold\":true,\"text\":\"The\",\"type\":\"text\"},{\"text\":\" \",\"type\":\"text\"},{\"bold\":true,\"text\":\"Shift\",\"type\":\"text\"},{\"text\":\"!\",\"type\":\"text\"}]}],\"description\":[{\"type\":\"paragraph\",\"children\":[{\"text\":\"Get emerging insights on emerging technology straight to your inbox.\",\"type\":\"text\"}]}],\"url\":\"/outshift-newsletter\"},\"menu3Items\":[],\"menu2Items\":[{\"id\":1260,\"text\":\"DevNet\",\"url\":\"https://developer.cisco.com\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":{\"location\":\"navigation\",\"link_label\":\"DevNet\",\"location_detail\":\"right\",\"resource_interaction\":\"visit to DevNet initiative page\"},\"submenu\":null,\"type\":null},{\"id\":1261,\"text\":\"Research\",\"url\":\"https://research.cisco.com\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":{\"location\":\"navigation\",\"link_label\":\"Research\",\"location_detail\":\"right\",\"resource_interaction\":\"visit to Research initiative page\"},\"submenu\":null,\"type\":null},{\"id\":1262,\"text\":\"Quantum Labs\",\"url\":\"https://research.cisco.com/research-projects/quantum\",\"eyebrow\":null,\"internal\":false,\"segmentOpt\":{\"location\":\"navigation\",\"link_label\":\"Quantum Labs\",\"location_detail\":\"right\",\"resource_interaction\":\"visit to Quantum Labs initiative page\"},\"submenu\":null,\"type\":null},{\"id\":1263,\"text\":\"AGNTCY\",\"url\":\"https://agntcy.org\",\"eyebrow\":null,\"internal\":false,\"se
