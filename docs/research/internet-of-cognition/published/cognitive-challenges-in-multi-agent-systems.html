39dbde04e2e397c.js\",\"88793\",\"static/chunks/88793-856c71cf5f7d9489.js\",\"45595\",\"static/chunks/45595-5054d002e635ca38.js\",\"14998\",\"static/chunks/14998-e7bd6b7d7590edd0.js\",\"54775\",\"static/chunks/54775-a01f710a1360ad6f.js\",\"58474\",\"static/chunks/58474-8aeb369df8b1168e.js\",\"62525\",\"static/chunks/62525-1d8b8fae60608469.js\",\"65460\",\"static/chunks/65460-93f14b474c1c9239.js\",\"6411\",\"static/chunks/6411-cc7df4de234b2b12.js\",\"30743\",\"static/chunks/30743-499268673cba22fb.js\",\"85940\",\"static/chunks/85940-2a922ac111b3cc05.js\",\"46392\",\"static/chunks/46392-06a1b7be8b511ec9.js\",\"32959\",\"static/chunks/32959-3a9ee3b65e8b648e.js\",\"87712\",\"static/chunks/87712-ab699c660a9df5c9.js\",\"34482\",\"static/chunks/34482-75b0bcf53c575848.js\",\"84346\",\"static/chunks/84346-9a0acbda39496191.js\",\"88405\",\"static/chunks/app/(public)/blog/%5Bcategory_slug%5D/%5Bslug%5D/page-8861f923de2bea46.js\"],\"BlogTrackers\"]\n"])</script><script>self.__next_f.push([1,"4d:T1520f,"])</script><script>self.__next_f.push([1,"\u003cp\u003eMulti-agent systems (MAS) are being granted more autonomy — to reason, to collaborate, to decide, increasingly without a human in the loop. We went looking for what consistently breaks and found a new class of failure: not a crash, not an exception, but agents that quietly misread each other, verify nothing, and agree for the wrong reasons.\u003c/p\u003e\u003cp\u003eWe call these \u003cstrong\u003ecognitive failures.\u003c/strong\u003e Running a popular open coding MAS (ChatDev) and a decentralized multi-agent debate, we find them without provoking anything: \u003cstrong\u003e100% of ChatDev\u003c/strong\u003e sessions and 43% of debate sessions carry at least one. Where a ground truth exists, the cost is stark — debate accuracy runs at \u003cstrong\u003e0.99\u003c/strong\u003e with no cognitive failure present, slips to\u003cstrong\u003e 0.81\u003c/strong\u003e with two categories in the trace, and collapses to 0.16 at three. A single failure mode is enough on its own: verification collapse alone costs \u003cstrong\u003e87 accuracy points\u003c/strong\u003e and leaves the five agents in unanimous agreement on a wrong answer \u003cstrong\u003e75%\u003c/strong\u003e of the time.\u003c/p\u003e\u003cp\u003eIn a controlled Site Reliability Engineer (SRE) triage testbed built with Outshift’s \u003ca href=\"https://github.com/outshift-open/mas-lab\"\u003eMAS-Lab\u003c/a\u003e, a specification-driven foundation for building multi-agent systems, we show they are not merely common but consequential: some push task-failure rates to \u003cstrong\u003e100%\u003c/strong\u003e while every conventional signal — latency, cost, duration, exit code — stays green. We then introduce the idea of an extensible, MITRE-style taxonomy that gives each failure a stable name across architectures, and a reproducible method to measure frequency and impact under different coordination patterns.\u003c/p\u003e\u003cp\u003eThe conclusion matters for agentic design patterns and how we build: some of these failures are structural and can be designed away by iterating on the MAS itself. The rest arise from the task, the context, and the environment, and cannot be designed away at all. Those need runtime machinery — which is precisely the case for the \u003ca href=\"https://outshift.cisco.com/internet-of-cognition\"\u003e\u003cstrong\u003eInternet of Cognition (IoC)\u003c/strong\u003e\u003c/a\u003e: cognition protocols, cognitive failure detection, and a cognitive observability substrate underneath both.\u003c/p\u003e\u003cp\u003eWe then asked the question every team asks next: which way of organizing the agents should we use, and will a moderator or a shared channel fix this? We ran the same application, under four collaboration patterns, rephrased its requests, and replayed our debate round by round. Cognitive failures appeared in every pattern, but the pattern changed which ones appeared, how they surfaced and what they cost. A moderator's verifier kept being consulted while correct answers fell to 4% or less, and one version of the moderator skipped its verifier in a third of clean runs without the success rate noticing. Debate raised agreement from 54% to 94% of questions, left accuracy flat, and quadrupled confident, unanimous wrong answers. And whether failure appeared at all proved fragile: one word of a prompt, one phrasing of a request, one prompt version or one rerun was enough to switch it on or off. That fragility is what makes these failures a production problem, and why we close with what has to happen while a system runs.\u003c/p\u003e\u003ch2\u003e1. Cognitive failures: Agentic autonomy needs a new failure lens\u003c/h2\u003e\u003cp\u003eThe interesting thing about the current wave of multi-agent systems is not that agents call tools. It is that we have started to let them \u003ci\u003edecide\u003c/i\u003e: which peer to ask, whether the evidence is good enough, when the work is done, whether to act now or wait for approval. Autonomy has moved from execution into judgment — and judgment is a different kind of thing to operate.\u003c/p\u003e\u003cp\u003eThe monitoring stack has not leveled up with this evolution. Latency, throughput, error rate, token cost, and resource utilization detect infrastructure faults and first-order application errors. They do not detect what happens when an agent presents a fabricated fact with full confidence, when two agents resolve to conflicting models of the same task and never reconcile, or when a verification step approves an outcome it never actually examined. None of those events produce a spike, an exception, or a non-zero exit code.\u003c/p\u003e\u003cp\u003eThe research community has begun to map this territory. \u003ca href=\"https://sky.cs.berkeley.edu/project/mast/\"\u003eMAST\u003c/a\u003e — the Multi-Agent System Failure Taxonomy from UC Berkeley (Cemri et al., 2025) — analyzed 150 traces with expert annotators and produced 14 failure modes in three categories: specification issues, inter-agent misalignment, and task verification. It is a genuinely useful contribution, and the most common modes it reports (step repetition, reasoning–action mismatch, failing to ask for clarification) are things you can \u003ci\u003esee an agent do.\u003c/i\u003e\u003c/p\u003e\u003cp\u003eThat is exactly where the gap opens. MAST and its successors catalogue agentic failures: observable behaviors, wrong or missing actions, broken handoffs. What no taxonomy has extended into is the layer underneath — the failures in what agents \u003ci\u003erepresent, know, verify, \u003c/i\u003eand \u003ci\u003ecommit to\u003c/i\u003e. These do not show up as a wrong action. They show up as an action that looks completely normal.\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1111/523;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1789416458546_thg1qntsejq_Screenshot_2026_09_14_at_9_06_48_PM_0af470a630.png\" width=\"1111\" height=\"523\"\u003e\u003c/figure\u003e\u003cp\u003eCognitive failures also matter even when the final answer happens to be right. A system that skips verification and gets lucky is not a healthy system; it is a system whose next run is a coin flip. Presence, frequency, and character of cognitive failures are signals of a MAS's \u003cstrong\u003ecognitive health\u003c/strong\u003e — a dimension of quality that conventional observability structurally cannot measure.\u003c/p\u003e\u003cp\u003eSo: are these failures real, frequent, and consequential? We went looking in three systems.\u003c/p\u003e\u003ch2\u003e2. Cognitive failures in the wild\u003c/h2\u003e\u003cp\u003eWe took two approaches. First, we analyzed public execution traces from a well-known MAS we had no hand in building, so there was zero interference in how those traces were generated. Second, we built a deliberately simple decentralized setting that forces agents to reach consensus, and watched what happened.\u003c/p\u003e\u003ch3\u003e2.1 ChatDev: The verifier that never checked\u003c/h3\u003e\u003cp\u003eChatDev (Qian et al., ACL 2024) is one of the most popular open multi-agent coding systems: specialized agents move a task through design, coding, and testing via structured chat. Usefully for us, its repository ships public example traces. We did not have to provoke anything — we just read what the system had already done, repeatedly, in its own published runs.\u003c/p\u003e\u003cp\u003eTake session RecipeBox7. The task is unambiguous: build a recipe application that can add recipes, tag them by cuisine, scale servings, and search by ingredient.\u003c/p\u003e\u003cpre\u003e\u003ccode class=\"language-plaintext\"\u003e[Tester]\u0026nbsp;      launches the generated app\n               input(\"Enter your choice: \")\n               [fail] EOFError: EOF when reading a line\n[Programmer]\u0026nbsp;  \"standard input is not properly configured\"\u0026nbsp; \u0026lt;-- diagnosed correctly\n[Programmer]\u0026nbsp;  wraps the call, catches EOFError, exits quietly\n               (the test is bypassed, not fixed)\n[Tester]\u0026nbsp;      re-runs … no crash occurs\n[System]\u0026nbsp;      [pass] Test Pass!\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eThe interesting failure is not the bug. With no stdin connected, the app raises EOFError. The Programmer agent diagnoses the cause correctly, then resolves it by catching the exception and exiting quietly — walking around the test rather than through it. The Tester re-runs, nothing crashes, and the system declares \u003cstrong\u003eTest Pass!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eThe delivered code is not even necessarily broken. The failure is in the certification: verification asked exactly one question — \u003ci\u003edid it crash?\u003c/i\u003e — received “no,” and concluded the software was correct. \u003cstrong\u003eZero recipe features were ever exercised.\u003c/strong\u003e No recipe was added, tagged, scaled, or searched. In taxonomy terms (Section 3) this is CE-1, a verification and epistemic control failure.\u003c/p\u003e\u003cp\u003eAnd note what a conventional observability stack would have seen: no exception escaping to the caller, no latency anomaly, no error code, files written as expected. The only signal available is `Test Pass!` — produced by the broken harness itself. The failure is silent; the risk is real. Any consumer of that pipeline now has an unvalidated artifact with a green badge on it.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOne trace is an anecdote, so we looked at all of them. \u003c/strong\u003eAcross the full set of public ChatDev sessions we found \u003cstrong\u003e137 cognitive-failure findings in 68 sessions\u003c/strong\u003e, detected with a LLM-as-a-judge that was given the taxonomy, then manually verified. \u003cstrong\u003e100% of sessions carried at least one finding.\u003c/strong\u003e Not one produced a conventional alert.\u003c/p\u003e\u003cp\u003eDoes it actually cost anything? We scored each session with an independent judge on requirement fulfillment, code quality, and verification rigor (1–5, averaged). Quality falls monotonically with the number of distinct cognitive failure categories present: 3.07 with one category, 2.54 with two, 2.00 with three. No session had zero. The same relationship shows up in the debate system, and there it is much sharper — we come back to it with both systems side by side in Section 2.2.\u003c/p\u003e\u003cp\u003eTwo of ChatDev's dominant failure modes turn out to be traceable to specific design decisions rather than to bad luck:\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe only automated quality gate checks whether the code runs for three seconds without crashing. It cannot detect unimplemented features, placeholder stubs, or non-exception failures — so \u003cstrong\u003eCE-1 appears in 88% of sessions\u003c/strong\u003e, regardless of task domain.\u003c/li\u003e\u003cli\u003eA hard-coded configuration default injects a GUI requirement into every run, including runs whose task explicitly specifies a CLI. Agents silently resolve the contradiction and build the wrong thing — a \u003cstrong\u003eCR-1 shared task model failure in every session where the task specifies a CLI\u003c/strong\u003e, regardless of question difficulty.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThat is an important early signal: many cognitive failures are not random LLM noise. They are \u003ci\u003edesign artifacts,\u003c/i\u003e reproducible properties of the harness. It is worth naming the split now, because everything that follows turns on it: a cognitive failure is either \u003cstrong\u003estructural\u003c/strong\u003e — caused by the coordination pattern or a harness implementation choice, and therefore reproducible — or \u003cstrong\u003eincidental\u003c/strong\u003e, arising from the stochastic behavior of the underlying models. Both are real; only one can be designed away. Hold that thought — it comes back in Section 7.\u003c/p\u003e\u003ch3\u003e2.2 Multi-agent debate: agreeing for the wrong reasons\u003c/h3\u003e\u003cp\u003eThe ChatDev failure can be pinned on one agent's judgment. But, much like in human conversation, failures can also come from the communication between agents, or from the shape of the collective process itself. So, we built the simplest system we could that forces agents to negotiate: a decentralized multi-agent debate (MAD).\u003c/p\u003e\u003cp\u003eFive agents receive a multiple-choice question. In round 0 each answers independently. In the following rounds each agent sees everyone else's previous answers and either revises its position and gives feedback, or — in the last round — commits to a final answer. No orchestrator, no tie-breaker, no privileged voice.\u003c/p\u003e\u003cp\u003eWe ran this against a sample of 880 MMLU-Pro questions (Wang et al., NeurIPS 2024), a benchmark deliberately built so that even strong models struggle. Across the \u003cstrong\u003e880 completed sessions\u003c/strong\u003e we found \u003cstrong\u003e726 findings\u003c/strong\u003e, with \u003cstrong\u003e43% of sessions (380 of 880) carrying at least one.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eThat rate is lower than ChatDev's 100%, and the difference is useful rather than reassuring. It means what we saw in ChatDev is not the pathology of one unusually weak harness — and it gives us something ChatDev could not: clean and affected sessions from the \u003ci\u003esame\u003c/i\u003e system, on the \u003ci\u003esame\u003c/i\u003e questions, with a ground-truth answer for every one of them.\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1280/1312;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1789416560999_74jtttpmy02_mad_flow_ef062222e7.png\" width=\"1280\" height=\"1312\"\u003e\u003cfigcaption\u003e\u003ci\u003e\u003cstrong\u003eFigure 1.\u0026nbsp;\u003c/strong\u003eThe multi-agent debate (MAD) setup: five agents answer a multiple-choice question over four rounds — one independent first guess, then three rounds of debate before committing to a final answer.\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003eThe distribution, though, is almost the inverse of ChatDev's. Laid side by side over the same taxonomy, the two systems barely overlap:\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1760/1160;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1789416636648_bfnbvf0bdka_frequency_comparison_2b1bd56f42.png\" width=\"1760\" height=\"1160\"\u003e\u003cfigcaption\u003e\u003ci\u003e\u003cstrong\u003eFigure 2.\u0026nbsp;\u003c/strong\u003eDistribution of cognitive failure findings across all 19 taxonomy categories, in two structurally different MAS. Each side is a share of that system's own findings (137 for ChatDev, 726 for the debate), so the two profiles are directly comparable. A dot marks a category observed zero times.\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003eChatDev's findings concentrate in verification and shared-task-model failures (CE-1 43.8%, CR-1 21.9%); the debate's concentrate in epistemic and systemic ones. Two modes dominate there, and both are produced \u003ci\u003eby the debate format working as designed:\u003c/i\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eIE-1, individual metacognitive blindness — 50.0% of all findings.\u003c/strong\u003e Debate requires each agent to state an assertable position. When the question is genuinely hard, an agent that lacks the knowledge still has to take a stand — so a confident false claim is not an aberration, it is the expected output of the mechanism.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eCS-1, collective reasoning degradation — 19.7%.\u003c/strong\u003e Agents read and respond to each other's positions, which is the whole point; the side effect is herding. An early confident voice pulls the group toward it, and dissent gets suppressed rather than resolved. The group converges — on agreement, not on truth.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eAnd with ground truth available, the cost is unambiguous.\u003c/strong\u003e MMLU-Pro ships correct answers, so we can ask directly what a debate's cognitive failures do to the answer it produces:\u003c/p\u003e\u003cp\u003eWith no findings, the debate answers correctly \u003cstrong\u003e99%\u003c/strong\u003e of the time. One category costs essentially nothing (0.98) — a single cognitive failure is usually survivable, because four other agents can absorb it. Two already costs real accuracy (0.81, an 18-point drop). \u003cstrong\u003eAt three, it falls off a cliff: 0.16\u003c/strong\u003e — barely above the 0.10 you would expect from guessing, since MMLU-Pro gives ten options per question. At four it is 0.13. The failure modes compound: metacognitive blindness supplies a confident wrong claim, herding propagates it, and no verification step exists to stop it. Each one alone is tolerable; together they take the system apart.\u003c/p\u003e\u003cp\u003eThis matters for prioritization. If impact were linear in the number of failures, you could triage the worst category and move on. It is not linear. The system is resilient to one and defenseless against three, which means what matters operationally is not the \u003ci\u003epresence\u003c/i\u003e of a cognitive failure, but the \u003ci\u003eaccumulation\u003c/i\u003e of them — and accumulation is precisely what nothing in the current stack is counting.\u003c/p\u003e\u003cp\u003eWhich individual failures do the damage? With 880 debates we can compare accuracy with and without each of the three most frequent challenges — and then ask something more interesting than accuracy: \u003ci\u003ehow the debate ended.\u003c/i\u003e\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1800/712;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1789416688779_0eptbxgmmk8h_impact_vs_challenges_4bdd195be2.png\" width=\"1800\" height=\"712\"\u003e\u003cfigcaption\u003e\u003ci\u003e\u003cstrong\u003eFigure 3.\u0026nbsp;\u003c/strong\u003eDownstream impact against the number of distinct cognitive failure categories present in a trace, in both systems. ChatDev is scored by an LLM judge on requirement fulfillment, code quality, and verification rigor; the debate is scored on whether the group's majority answer was correct. Both decline; the debate collapses.\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1760/1639;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1789416716395_4l2937egbsi_mad_challenge_impact_with_and_without_challenges_aae0362663.png\" width=\"1760\" height=\"1639\"\u003e\u003cfigcaption\u003e\u003ci\u003e\u003cstrong\u003eFigure 4.\u0026nbsp;\u003c/strong\u003ePer-challenge impact in the multi-agent debate. (a) Majority-vote accuracy at the final round, with and without each challenge. (b) The distribution of debate outcomes when the challenge is absent vs when it is present, ordered from best to worst: unanimous agreement on the correct answer, through to unanimous agreement on a wrong one.\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003ePanel (a) is the headline: metacognitive blindness costs \u003cstrong\u003e27.6 points\u003c/strong\u003e of accuracy, collective reasoning degradation \u003cstrong\u003e77.5\u003c/strong\u003e, and verification collapse \u003cstrong\u003e87.2\u003c/strong\u003e — from a baseline where the debate is essentially always right (98.6–99.9%). A single named cognitive failure is enough to take a system from near-perfect to worse than a coin flip.\u003c/p\u003e\u003cp\u003ePanel (b) is the part that should worry anyone deploying a consensus architecture. The failures do not produce indecision or visible deadlock — the “no decision” slice is under 2% everywhere. They produce \u003cstrong\u003eagreement\u003c/strong\u003e. When collective reasoning degradation is present, the five agents reach unanimous consensus on a \u003ci\u003ewrong\u003c/i\u003e answer in \u003cstrong\u003e62%\u003c/strong\u003e of debates; under verification collapse, \u003cstrong\u003e75%\u003c/strong\u003e. Compare that with metacognitive blindness, where a single overconfident agent is usually outvoted and correct consensus still wins 63% of the time.\u003c/p\u003e\u003cp\u003eThat contrast is the whole argument for treating these as distinct, named failure modes. One overconfident agent is a \u003ci\u003econtainable\u003c/i\u003e error: redundancy works, the group corrects it. But when the mechanism that is supposed to do the correcting is itself compromised — herding suppresses dissent, or verification stops verifying — redundancy inverts. Five agents do not catch the error; they ratify it. And the system's output arrives with the strongest possible success signal a debate can produce: everyone agreed.\u003c/p\u003e\u003cp\u003eThis is the second important early signal. The failure profile of a MAS is not a property of “LLM agents” in general. It is a property of \u003ci\u003ethis\u003c/i\u003e architecture, \u003ci\u003ethis\u003c/i\u003e coordination pattern, and \u003ci\u003ethis\u003c/i\u003e harness — which means it can be identified, attributed, and in some cases engineered against. Different designs are exposed to different cognitive vulnerabilities, and their occurrence rate is a design-quality signal.\u003c/p\u003e\u003ch2\u003e3. A taxonomy for cognitive failures\u003c/h2\u003e\u003cp\u003eNaming things consistently is a prerequisite for detecting them. Prior work has described miscommunication, role confusion, inconsistent verification, and premature action — but usually in terms specific to one system, which makes it impossible to tell whether a failure seen in a coding pipeline and one seen in a debate are the same underlying phenomenon.\u003c/p\u003e\u003cp\u003eBased on separate research (to be published), we organize cognitive challenges along two axes.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eCognitive function\u003c/strong\u003e — the faculty whose breakdown produces the failure:\u003c/p\u003e\u003cfigure class=\"table\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eFunction\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e\u003cstrong\u003eQuestion it answers\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eRepresentational\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eIs information correctly encoded, maintained, and shared?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eCoordinative\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eAre actions, commitments, and joint plans soundly structured?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eEpistemic\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eAre knowledge and confidence correctly calibrated and verified?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eSystemic\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eFailures irreducible to any single agent or function.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\u003cp\u003e\u003cstrong\u003eLocus\u003c/strong\u003e — where the failure first becomes observable: \u003cstrong\u003eI\u003c/strong\u003endividual (inside one agent's reasoning), \u003cstrong\u003eD\u003c/strong\u003eyadic (in a specific interaction, including broadcasts), or \u003cstrong\u003eC\u003c/strong\u003eollective (only visible when considering the MAS as a whole).\u003c/p\u003e\u003cp\u003eThe two axes compose into a matrix where each cell names a distinct failure mode — and the challenge code itself encodes the coordinates (CE-1 = Collective locus, Epistemic function). This is deliberately MITRE-like: a shared, extensible reference that many teams can contribute to, not a closed list. The 19 entries below are a foundation, not a finished map.\u003c/p\u003e\u003cfigure class=\"table\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eLocus \\ Function\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e\u003cstrong\u003eRepresentational\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e\u003cstrong\u003eCoordinative\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e\u003cstrong\u003eEpistemic\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e\u003cstrong\u003eSystemic\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIndividual\u003c/td\u003e\u003ctd\u003eIR-1\u003c/td\u003e\u003ctd\u003eIC-1, IC-2\u003c/td\u003e\u003ctd\u003eIE-1 •\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDyadic\u003c/td\u003e\u003ctd\u003eDR-1 •, DR-2\u003c/td\u003e\u003ctd\u003eDC-1, DC-2 •, DC-3 •, DC-4 •\u003c/td\u003e\u003ctd\u003eDE-1 •\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCollective\u003c/td\u003e\u003ctd\u003eCR-1 •, CR-2\u003c/td\u003e\u003ctd\u003eCC-1 •, CC-2, CC-3 •, CC-4\u003c/td\u003e\u003ctd\u003eCE-1 •\u003c/td\u003e\u003ctd\u003eCS-1 •\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\u003cp\u003e• = studied empirically in this post (11 of 19). The remaining 8 are named but not yet evidenced — the honest state of the map.\u003c/p\u003e\u003cfigure class=\"table\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eCode\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e\u003cstrong\u003eChallenge\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e\u003cstrong\u003eWhat goes wrong\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e\u003cstrong\u003eWhen to fix\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eIR-1\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eInstruction retention failure\u003c/td\u003e\u003ctd\u003eAgent loses earlier instructions as its context fills.\u003c/td\u003e\u003ctd\u003eruntime\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eDR-1\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eSemantic \u0026amp; ontological misalignment\u003c/td\u003e\u003ctd\u003eTwo agents use the same word to mean different things.\u003c/td\u003e\u003ctd\u003ebootstrap\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eDR-2\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eRepresentational fidelity loss at interface\u003c/td\u003e\u003ctd\u003eInformation is truncated or lost in transit; the receiver never gets what was sent.\u003c/td\u003e\u003ctd\u003eruntime\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eCR-1\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eShared task model failure\u003c/td\u003e\u003ctd\u003eAgents start with incompatible understandings of the task.\u003c/td\u003e\u003ctd\u003edesign\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eCR-2\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eShared state degradation\u003c/td\u003e\u003ctd\u003eShared memory becomes inconsistent under uncoordinated writes.\u003c/td\u003e\u003ctd\u003eruntime\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eIC-1\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eIntention stability failure\u003c/td\u003e\u003ctd\u003eAgent drops a correct commitment under interference.\u003c/td\u003e\u003ctd\u003eruntime\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eIC-2\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003ePlan revision failure\u003c/td\u003e\u003ctd\u003eAgent fails to revise a plan when context changes.\u003c/td\u003e\u003ctd\u003eruntime\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eDC-1\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eCommunication policy inefficiency\u003c/td\u003e\u003ctd\u003eAgents communicate too much, too little, or at the wrong density.\u003c/td\u003e\u003ctd\u003edesign\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eDC-2\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eMessage force misidentification\u003c/td\u003e\u003ctd\u003eAgent reads a directive as a suggestion.\u003c/td\u003e\u003ctd\u003eruntime\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eDC-3\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eNegotiation \u0026amp; consensus failure\u003c/td\u003e\u003ctd\u003eAgents exchange positions but issue no binding proposals.\u003c/td\u003e\u003ctd\u003eruntime, verify\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eDC-4\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eTask delegation failure\u003c/td\u003e\u003ctd\u003eAgent delegates to the wrong peer via an inaccurate capability model.\u003c/td\u003e\u003ctd\u003eruntime\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eCC-1\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eTask decomposition \u0026amp; role allocation failure\u003c/td\u003e\u003ctd\u003eAllocation has structural gaps or conflicts.\u003c/td\u003e\u003ctd\u003edesign\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eCC-2\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eCollective goal coordination failure\u003c/td\u003e\u003ctd\u003eNo mechanism to hold and pursue a common goal.\u003c/td\u003e\u003ctd\u003edesign, runtime\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eCC-3\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eIncomplete synthesis\u003c/td\u003e\u003ctd\u003eOrchestrator commits output without reconciling conflicting results.\u003c/td\u003e\u003ctd\u003everify\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eCC-4\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eSituational state synchronization failure\u003c/td\u003e\u003ctd\u003eSituational updates are not broadcast; state silently diverges.\u003c/td\u003e\u003ctd\u003eruntime, verify\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eIE-1\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eIndividual metacognitive blindness\u003c/td\u003e\u003ctd\u003eAgent proceeds with false confidence, unaware of its gaps.\u003c/td\u003e\u003ctd\u003eruntime, verify\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eDE-1\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003ePeer knowledge modeling failure\u003c/td\u003e\u003ctd\u003eAgent routes a query to a peer that does not hold the knowledge.\u003c/td\u003e\u003ctd\u003edesign, bootstrap, runtime\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eCE-1\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eVerification \u0026amp; epistemic control failure\u003c/td\u003e\u003ctd\u003eSystem commits a confident output with no real checking step.\u003c/td\u003e\u003ctd\u003everify\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eCS-1\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eCollective reasoning degradation\u003c/td\u003e\u003ctd\u003eAgents herd toward an early confident output, suppressing dissent.\u003c/td\u003e\u003ctd\u003eruntime\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\u003cp\u003eThe bracketed \u003ci\u003ewhen-to-fix\u003c/i\u003e label is doing quiet work here. Some challenges are structural (design, bootstrap) and belong to the architecture. Others only materialize while the system runs (runtime, verify) and cannot be removed from a diagram. Cognitive failures are the baseline condition, not the edge case (more in section 7).\u003c/p\u003e\u003ch2\u003e4. Measuring impact with MAS-Lab\u003c/h2\u003e\u003cp\u003eTwo case studies establish that these failures exist and are frequent. They cannot tell us what each \u003ci\u003especific\u003c/i\u003e failure costs, because in the wild you never get a clean comparison: challenge distributions are dominated by whatever the harness happens to encourage, sessions differ in task and difficulty, and no session comes with a ground truth label saying which failure was present.\u003c/p\u003e\u003cp\u003eSo, we built the missing instrument: \u003ca href=\"https://github.com/outshift-open/mas-lab\"\u003e\u003cstrong\u003eMAS-Lab\u003c/strong\u003e\u003c/a\u003e, an open source tool, that takes a working MAS application and applies an \u003cstrong\u003eoverlay\u003c/strong\u003e: a targeted modification of agent roles and instructions that recreates the conditions under which one specific challenge emerges. Everything else — the task, the input, the model, the tools — is held fixed, so the overlay is the only thing that changes.\u003c/p\u003e\u003ch3\u003e4.1 The instrument: challenge overlays\u003c/h3\u003e\u003cp\u003eAn overlay is generated by an LLM from a single taxonomy entry, and it acts in one specific space: the MAS \u003cstrong\u003edesign\u003c/strong\u003e — agent roles and instructions. Other injection spaces exist (the initial task given to the MAS, infrastructure faults) and are left as extensions, which is worth stating plainly because it bounds what these results cover: \u003cstrong\u003ethis is what happens when a challenge is written into the design, not when it arrives from the environment.\u003c/strong\u003e The overlay then has to satisfy one constraint that does most of the work: \u003cstrong\u003eit must be realistic.\u003c/strong\u003e It should look like the kind of misspecification or miscoordination that plausibly ships in a real system — a requirement phrased as a suggestion, a control role that was never made explicit, a capability model that is slightly wrong — and not like sabotage. An overlay that simply instructs an agent to “skip verification” would prove nothing; production systems do not contain that instruction. What they contain is a verifier whose evidence requirement was never stated.\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1760/344;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1789416828493_mwswz7lvhel_maslab_method_650724a10c.png\" width=\"1760\" height=\"344\"\u003e\u003cfigcaption\u003e\u003ci\u003e\u003cstrong\u003eFigure 5.\u0026nbsp;\u003c/strong\u003eThe MAS-Lab overlay loop. An overlay is derived from one taxonomy entry, applied to a working MAS, and only accepted once traces confirm the intended challenge actually appeared — which makes the challenge label a property of the construction rather than of a post-hoc judgment.\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003eBecause the overlay derives from the taxonomy entry rather than from a desired outcome, and because sample traces are manually inspected to confirm the intended challenge actually shows up, two things become available that observational studies cannot offer:\u003c/p\u003e\u003col\u003e\u003cli\u003eWe can produce traces exhibiting a chosen challenge on demand, and\u0026nbsp;\u003c/li\u003e\u003cli\u003eWe know by construction which challenge was injected into each trace. That is what makes per-challenge impact measurable at all.\u003c/li\u003e\u003c/ol\u003e\u003cp\u003eNote the honest limit of that guarantee: inspection validates the overlay on a sample, not every run, and “injected” is not the same as “manifested” — which is the second limitation below.\u003c/p\u003e\u003cp\u003eThe same challenge is not the same edit in every architecture, which is the part worth dwelling on. The overlay has to reproduce the mechanism named by the taxonomy, and the mechanism attaches to whatever machinery a given topology has:\u003c/p\u003e\u003cfigure class=\"table\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eChallenge\u003c/strong\u003e\u0026nbsp;\u003c/td\u003e\u003ctd\u003e\u003cstrong\u003eCentralized instantiation\u003c/strong\u003e\u0026nbsp;\u003c/td\u003e\u003ctd\u003e\u003cstrong\u003eDebate instantiation\u003c/strong\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eCE-1 verification \u0026amp; epistemic control\u003c/strong\u003e\u0026nbsp;\u003c/td\u003e\u003ctd\u003eSpecialists state “regression likely” or “rollback recommended” with no metrics, logs, or traces attached; the verifier performs a shallow format check only\u0026nbsp;\u003c/td\u003e\u003ctd\u003eBackend's output is stripped to a claim-plus-remediation line (“root cause: bad deploy; action: rollback”) and the evidence-producing skill is removed outright\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eCR-1 shared task model\u003c/strong\u003e\u0026nbsp;\u003c/td\u003e\u003ctd\u003eTelemetry prioritizes certainty and asks for more data, backend prioritizes immediate rollback, DB prioritizes integrity-preserving mitigations, verifier rejects any plan lacking full agreement\u0026nbsp;\u003c/td\u003e\u003ctd\u003eBackend optimizes availability recovery, DB optimizes integrity, telemetry demands high-confidence evidence, verifier requires unanimous certainty\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eDC-2 message force\u003c/strong\u003e\u0026nbsp;\u003c/td\u003e\u003ctd\u003eSRE tells agents they “should probably check other services” / “should probably verify the evidence”\u0026nbsp;\u003c/td\u003e\u003ctd\u003eThe softening narrows onto the gate: “we should probably wait before taking action” is read by backend as advice, not a block\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eDC-4 delegation \u0026amp; execution authority\u003c/strong\u003e\u0026nbsp;\u003c/td\u003e\u003ctd\u003eSRE delegates “identify the root cause and apply the fix” without stating that action waits on VERIFICATION: APPROVED\u0026nbsp;\u003c/td\u003e\u003ctd\u003eThe verifier is the gatekeeper, but that control role is never made explicit to specialists, so backend proceeds as if authority were implicit\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eDR-1 semantic misalignment\u003c/strong\u003e\u0026nbsp;\u003c/td\u003e\u003ctd\u003eSRE reads error rate as a fraction and rollback as a deploy rollback; telemetry reports percent; DB reads rollback as a schema rollback\u0026nbsp;\u003c/td\u003e\u003ctd\u003eBackend reads “rollback” as reverting config or feature flags; another agent reads it as a broader intervention; “error rate” units differ\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eCC-1 decomposition \u0026amp; roles\u003c/strong\u003e\u0026nbsp;\u003c/td\u003e\u003ctd\u003eThe same subtasks are deliberately double-assigned — “analyze metrics” and “inspect logs” sent to telemetry and backend in parallel\u0026nbsp;\u003c/td\u003e\u003ctd\u003eNo counterpart. Requires a central agent that controls task assignment\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eDE-1 peer knowledge modeling\u003c/strong\u003e\u0026nbsp;\u003c/td\u003e\u003ctd\u003eExpertise is misrouted: SRE asks backend to inspect DB-layer evidence (lock contention, slow queries) instead of asking DB\u0026nbsp;\u003c/td\u003e\u003ctd\u003eNo counterpart. Requires an explicit routing decision the debate role structure has no lever for\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eCC-3 / DC-3 unreconciled output\u003c/strong\u003e\u0026nbsp;\u003c/td\u003e\u003ctd\u003eCC-3: SRE is forced to aggregate incompatible recommendations with no reconciliation rule — include all of them, adjudicate none\u0026nbsp;\u003c/td\u003e\u003ctd\u003eDC-3: disagreement is preserved rather than converged — isolated findings, one-at-a-time verification, telemetry encouraged to stay conservative\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colspan=\"3\" rowspan=\"1\"\u003e\u003ci\u003e\u003cstrong\u003eFigure 6. \u003c/strong\u003eSRE-Triage MAS Challenges over centralized and decentralized patterns.\u003c/i\u003e\u0026nbsp;\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\u003cp\u003eTwo of the eight are centralized-only, and not by omission: CC-1 needs a central assigner and DE-1 needs an explicit routing decision, and a flat debate has neither. The topology does not just change how a challenge manifests — it changes which challenges are \u003ci\u003ereachable at all\u003c/i\u003e. And CC-3 and DC-3 are close cousins that we keep separate deliberately: both end with conflicting recommendations reaching the output unreconciled, but one arrives there through forced inclusion at an aggregation step and the other through the absence of any convergence pressure. If the remediation differs, the entry should differ.\u003c/p\u003e\u003cp\u003eFor every trajectory we then record three things: which metrics failed, the trace evidence supporting each failure, and when that evidence first appears. Together these form what we call a \u003cstrong\u003ediagnostic signature\u003c/strong\u003e — and note that the third element is not decoration. A detector that names a failure after the fact is a post-mortem tool; one that can locate the earliest point in the trace where the evidence was already present is the beginning of an intervention.\u003c/p\u003e\u003ch3\u003e4.2 The same application, two coordination patterns\u003c/h3\u003e\u003cp\u003eLet’s dive into the two use case examples mentioned earlier. The base application is an SRE incident-triage MAS, implemented twice.\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1650/700;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1789416947695_jrw56wsn7i_sre_mas_architectures_94bd390abd.png\" width=\"1650\" height=\"700\"\u003e\u003cfigcaption\u003e\u003ci\u003e\u003cstrong\u003eFigure 7.\u0026nbsp;\u003c/strong\u003eThe same SRE-triage application under two coordination patterns. Centralized: one entry point, one executor, one gate before action. Decentralized: the orchestrator is removed, all five agents broadcast each round, and execution authority moves to the backend agent — with nothing forcing convergence.\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003e\u003cstrong\u003eCentralized SRE-triage\u003c/strong\u003e is a six-agent strict orchestration pipeline led by an SRE agent. SRE is the entry point and delegates to specialists to gather evidence: telemetry establishes quantified observability evidence (latency percentiles, error rate, resource signals), backend investigates application and deployment causes and proposes concrete actions, DB investigates data-layer causes and mitigations. Comms turns technical findings into a stakeholder update; the verifier acts as the safety gate, checking cross-agent consistency, causal adequacy, and action risk. Then SRE executes the remediation.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eDebate SRE-triage\u003c/strong\u003e removes the SRE agent entirely. The same five remaining agents all receive the same input, produce their findings, and broadcast to one another over a shared channel at the end of each round, integrating everyone else's latest position into their own — capped at a hard stop of five rounds. Removing SRE also removes the sole executor, so the ability to trigger a rollback moves to the backend agent.\u003c/p\u003e\u003cp\u003eWe implemented 8 challenge overlays for the centralized variant and 5 for the debate variant, ran each against the same input ticket, 25 runs per overlay plus baselines: \u003cstrong\u003e325 overlay traces and 50 baseline traces.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eEverything else is shared: the same incident ticket, the same five specialist roles, the same model, the same tools. What differs is who may act, and what forces convergence.\u003c/p\u003e\u003ch3\u003e4.3 What the challenges cost\u003c/h3\u003e\u003cp\u003eWe evaluate the final outcome, not the chatter. An LLM judge scores each completed run against two questions in the centralized variant: did the system apply the correct fix (a rollback of the affected service), and did the verifier actually analyze the evidence behind it? The second matters independently of the first — a MAS that reaches the right answer without verifying it is a vulnerability, not a success. The debate variant adds two questions only a decentralized design can ask: did the backend act \u003ci\u003ebefore\u003c/i\u003e the verifier approved, and did the specialists ever actually agree on a shared solution?\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:2098/1130;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1789416990409_u52d77ocqbg_failure_centralized_8411aac49d.png\" width=\"2098\" height=\"1130\"\u003e\u003cfigcaption\u003e\u003ci\u003e\u003cstrong\u003eFigure 8.\u0026nbsp;\u003c/strong\u003ePer-challenge failure rate on final-outcome quality, centralized SRE-triage (25 runs per overlay, against a matched baseline). The baseline shows no failures on either dimension.\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003eThe baseline produces \u003cstrong\u003ezero failures on both dimensions\u003c/strong\u003e — the pipeline is correct when nothing is injected. Then:\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eCE-1\u003c/strong\u003e (claims no longer need to carry evidence) → the verifier fails to analyze evidence in \u003cstrong\u003e100% of runs\u003c/strong\u003e. Strip the evidence requirement and the safety gate cannot distinguish a supported claim from an unsupported one. It keeps approving.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eDC-4 \u003c/strong\u003e(execution authority never made explicit) → \u003cstrong\u003e100% failure\u003c/strong\u003e on “did the SRE apply the correct fix?”. Read that carefully: the rollback often \u003ci\u003edoes\u003c/i\u003e happen. It happens because backend decides the diagnosis is sound and acts on its own, without waiting. The agent the architecture designates as the executor never executes, so the question evaluates to \u003ci\u003eno\u003c/i\u003e — the fix arrived through a channel nobody authorized.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eCR-1\u003c/strong\u003e (agents given locally coherent but globally incompatible goals) → failures across several dimensions at once: 64% wrong-or-missing fix, 28% unverified.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eDC-2 \u003c/strong\u003e(a real requirement softened into “you should probably verify the evidence”) → 28% verification failure, from nothing more than a change of modal verb.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eOne thing to read carefully: \u003cstrong\u003ea zero row is not a clean bill of health.\u003c/strong\u003e Not every overlay is \u003ci\u003edesigned\u003c/i\u003e to move these two particular outcomes — correct fix and verified evidence are one subset of the downstream effects a cognitive failure can have. CC-1, DE-1 and DR-1 sit at zero here, which says their harm does not surface in \u003ci\u003ethese\u003c/i\u003e two questions, not that they were harmless. Section 4.4 shows several of them moving observability metrics substantially while leaving this chart untouched.\u003c/p\u003e\u003cp\u003eNow the same experiment without the orchestrator:\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:2398/1166;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1789418341893_tl39nejsbh_failure_debate_5cc8aa5b20.png\" width=\"2398\" height=\"1166\"\u003e\u003cfigcaption\u003e\u003ci\u003e\u003cstrong\u003eFigure 9.\u0026nbsp;\u003c/strong\u003ePer-challenge failure rate on final-outcome quality, debate SRE-triage (25 runs per overlay). Two extra outcome questions apply here: premature execution, and whether specialists agreed on a shared solution.\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003eNote first what the debate baseline does \u003ci\u003ewithout any overlay\u003c/i\u003e: in 8% of clean runs the fix is executed before approval, and in 8% the specialists never converge. The centralized baseline is clean on both of its dimensions; the decentralized one is not. Removing the orchestrator did not remove the coordination work — it moved that work into a mechanism that sometimes fails on its own.\u003c/p\u003e\u003cp\u003eCE-1, CR-1, and DC-4 remain the most damaging in both topologies — CE-1 again reaching 100% verification failure — which suggests these failure mechanisms are architecture-independent. DC-4 makes that point in an unexpectedly sharp way, and it is worth slowing down for.\u003c/p\u003e\u003cfigure class=\"table\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003e\u003cstrong\u003eThe same failure, two different scoreboards.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIn the centralized variant, DC-4 registers as “the fix was never applied correctly” (100%). In the debate variant, the fix-related questions come out clean and the failure surfaces elsewhere: executed before approval (72%), specialists never agreed (76%). Two different failure profiles — from an identical underlying mechanism. In both cases the gatekeeper (SRE, then the verifier) never communicated that execution must wait for approval, and in both cases backend acted on its own judgement. What changed is only who the architecture considers to be in charge: when backend is not the designated executor, its acting alone reads as a delegation failure; when it is, the same behavior reads as premature execution. The cognitive failure is invariant; the symptom is a function of the topology.\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\u003cp\u003eThat is the argument for naming failures at the level of mechanism rather than symptom — precisely what the taxonomy in Section 3 is for. A team measuring only “did we apply the right fix?” would conclude their decentralized system had fixed a problem that their centralized one had; in fact the identical flaw is still there, reporting itself through a different column.\u003c/p\u003e\u003cp\u003eThe debate variant also produces the single most instructive result in the study:\u003c/p\u003e\u003cfigure class=\"table\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cp\u003e\u003cstrong\u003eDC-3: the fix was right, and the team never agreed on it.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eUnder the DC-3 overlay the final action remains correct in most runs — yet the specialists fail to converge on a shared solution in 84% of runs. Because nothing in the architecture forces convergence and the verifier evaluates each proposal in isolation, the backend can execute as soon as its own proposal is approved, regardless of what the others concluded. The right outcome was not reached by consensus; it was reached by one agent being both right and fast. The same architecture, on a different day, approves the wrong action in isolation just as easily.\u003c/p\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\u003cp\u003eThat is what silent harm looks like structurally: the primary outcome metric is green, and the mechanism that was supposed to produce it never ran.\u003c/p\u003e\u003cp\u003eAggregated across all challenge-injected traces: \u003cstrong\u003e17% failed to find the correct fix, and 51% failed to comply with all requirements of a correct resolution.\u003c/strong\u003e In the extreme cases — CE-1 in both patterns, DC-4 — the failure rate for meeting all requirements hits \u003cstrong\u003e100%.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAnd what did the conventional signals do?\u003c/strong\u003e We did not have to speculate — we measured them: session duration, tool-call errors, token usage. Across the eight centralized overlays, exactly two moved more than 25% from baseline (CE-1 and DE-1), and in the debate variant only one did (CE-1, on token usage alone). Everything else degraded the outcome while leaving the operational signals flat.\u003c/p\u003e\u003cp\u003eAnd the two exceptions are worse than no signal at all, because \u003cstrong\u003ethe deviation points the wrong way:\u003c/strong\u003e CE-1 shows a \u0026gt;25% \u003ci\u003ereduction\u003c/i\u003e in duration and tokens. That follows mechanically — strip the evidence requirement and the system stops doing the expensive part, so it reaches its (often wrong) answer faster and cheaper. On a cost or latency dashboard, the single most damaging cognitive failure in this study reads as an efficiency win. It is the one case where conventional monitoring does move, and it moves in the direction that gets a system promoted rather than paged.\u003c/p\u003e\u003ch3\u003e4.4 Can the metrics see it?\u003c/h3\u003e\u003cp\u003eEverything above is measured from outcomes — which requires knowing what the right outcome was. A running system does not have that. So the last question is the one that decides whether any of this is actionable: \u003cstrong\u003eis a cognitive failure visible in the trace while it is happening?\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWe computed 13 observability metrics per trace, grouped by diagnostic goal:\u003c/p\u003e\u003cfigure class=\"table\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eDiagnostic goal\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e\u003cstrong\u003eMetrics\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eCoordination structure — is the division of labor sound?\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003epolicy safety, delegation accuracy, goal alignment\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eInteraction quality — is the exchange itself healthy?\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003einstruction following, handoff quality, semantic consistency, context preservation, confidence calibration, verification quality, communication efficiency\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eOutcome quality — does the product hold up?\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003egroundedness, task completion, constraint satisfaction\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\u003cp\u003eThese groups name each metric's main question rather than a pipeline stage — a coordination failure may be recovered or may propagate into an outcome failure. The first two groups characterize the failure \u003ci\u003eprocess\u003c/i\u003e; the third characterizes its \u003ci\u003eeffect\u003c/i\u003e on the delivered result. That distinction is what makes a mismatch between them diagnostic rather than contradictory.\u003c/p\u003e\u003cp\u003eFor each overlay we compare against the matched baseline and report every metric that dropped by at least 25%. Read as a matrix, the result is the most useful — and most uncomfortable — figure in the study.\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:4134/3708;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1789418442847_kj0aoedkm4_metric_signatures_4981a64205.png\" width=\"4134\" height=\"3708\"\u003e\u003cfigcaption\u003e\u003ci\u003e\u003cstrong\u003eFigure 10.\u0026nbsp;\u003c/strong\u003eMetric signatures per challenge: every observability metric that dropped at least 25% against the matched baseline, in both topologies. Columns are the shared metric axis, so a row can be compared across the two panels. A dot means the metric stayed within 25% of baseline.\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003e\u003cstrong\u003eThe good news: cognitive failures are measurable from traces.\u003c/strong\u003e Injected challenges do move these metrics, often hard — CC-1 drops groundedness by 95%, CR-1 drops constraint satisfaction by 92%, DR-1 in the debate variant drops semantic consistency by 83%. And the pattern is specific: each challenge lights up its own subset rather than uniformly depressing everything. DR-1 — agents using the same word for different things — is the cleanest case, hitting context preservation in both topologies (36% and 38%) and adding semantic consistency in the debate variant. That is what the beginning of a signature looks like.\u003c/p\u003e\u003cp\u003eThe bad news is in the same figure, and it comes in three parts.\u003c/p\u003e\u003cp\u003e\u003ci\u003eThe mapping is many-to-many.\u003c/i\u003e Policy safety alone is triggered by CC-3, CE-1, DC-4 and DE-1 in the centralized variant and by CR-1 and DC-3 in the debate one. A metric moving tells you something is wrong; it does not tell you what. Detection needs the joint pattern, not a threshold on one gauge. And the ambiguity is compounded by the limitation noted earlier: because the metrics do not isolate individual challenges within a trace, a row here reflects everything cognitively wrong in those runs — including challenges the overlay spawned downstream — rather than the injected one in isolation.\u003c/p\u003e\u003cp\u003e\u003ci\u003eThe signature is not stable across topology.\u003c/i\u003e Compare CR-1 across the two panels: centralized, it lights five metrics with drops up to 92%; in debate, one — policy safety at 56%. Part of that gap is by construction, and the overlay table in Section 4.1 says why: the two variants instantiate CR-1 through different machinery, so the challenge that manifests is not strictly the same object in both systems. But that is the finding, not an excuse for it. If “the same challenge” is only ever available through an architecture-specific instantiation, then a signature must either be defined per instantiation — one per challenge per coordination pattern — or pitched at whatever level generalizes above them. Neither exists yet, and a detector trained on one topology cannot be assumed to transfer to another.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAnd some of the worst failures produce no signal at all.\u003c/i\u003e In the debate variant, CE-1 and DC-4 moved \u003cstrong\u003enot one of the 13 metrics\u003c/strong\u003e past the 25% floor. These are not minor entries: in that same variant CE-1 caused a verification failure in \u003cstrong\u003e100% of runs\u003c/strong\u003e, and DC-4 executed the fix before approval in \u003cstrong\u003e72%\u003c/strong\u003e. The most damaging challenge in the study is, in a decentralized topology, invisible to this suite — which is the honest way to put it. The suite is a starting point, not a finished instrument, and these rows are exactly where it needs extending. Note also which metrics never crossed the floor anywhere: delegation accuracy, instruction following, handoff quality, communication efficiency, task completion. Five of thirteen carried no signal in either topology.\u003c/p\u003e\u003cp\u003eThere is a further mismatch worth stating plainly, because it cuts against a tidy story: \u003cstrong\u003ethe relationship between metric movement and application-level harm is weaker than we expected.\u003c/strong\u003e Some of that is by design — several overlays were never aimed at the two outcome questions, and the outcome measures only capture final-outcome effects rather than every degradation along the way. Some of it is the suite's incompleteness. Either way, a large metric drop does not yet reliably predict a bad outcome, and a clean outcome does not yet certify a healthy session. Those two facts are what a detection layer has to close.\u003c/p\u003e\u003cp\u003ePut together: the current metrics are a promising \u003ci\u003estarting point\u003c/i\u003e, not a detector. What is missing is a per-challenge signature in the full sense introduced earlier — not just \u003ci\u003ewhich\u003c/i\u003e metrics moved, but the trace evidence behind each one and the point at which that evidence first became visible, validated to hold across coordination patterns and sensitive enough to catch what a 25% single-metric floor lets through. That is a research problem, and it is the one standing between this evidence and a system that can act on it.\u003c/p\u003e\u003ch3\u003e4.5 Realistic requests trigger the same failures\u003c/h3\u003e\u003cp\u003eOverlays plant a challenge by editing the design, which invites a fair objection: perhaps the unmodified application never shows it under a real request. So we left the application alone and changed only what the user asks. Prompt Sweep takes an incident report and generates rewrites an SRE could plausibly send: the same facts, with a different emphasis on trade-offs such as reversibility, blast radius or long-term stability. A filter discards any rewrite that names a challenge or tells agents to disagree. The selected request is frozen, ten fresh runs are generated from it, and three different models judge those runs independently. We built 25 incidents for the centralized SRE triage application, in a version where a risk-assesment agent takes the verifier's place, one for each pairing of five services with five remediations (rollback, restart, scale-up, cache invalidation, debug logging), and ran each ten times.\u0026nbsp;\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1154/988;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1791828874254_4pr193hv0z3_image_44916016cf.png\" width=\"1154\" height=\"988\"\u003e\u003cfigcaption\u003e\u003ci\u003eFigure 11. Prompt Sweep explores and refines candidate requests, rejects unrealistic or steering ones, freezes the selection and judges fresh runs.\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003eThe untouched application was not clean. With nothing modified, every judge flagged the moderator failing to reconcile divergent findings (CC-3) and position that never became a binding proposal (DC-3), in up to 15.6% and 18.5% or runs. Rewording the request was enough to raise both. Under the Gemini 2.5 Flash judge, CC-3 went from 6.8% to 24.4% and DC-3 from 8.8% to 20.8%; under GPT-5.4, DC-3 went from 18.5% to 29.6%; under Gemma4, CC-3 went from 0.8% to 10.8%. Five of the six judge-and-challenge pairs rose, by 4.8 to 17.6 points. The effect was uneven: the number of incidents where at least half the runs showed CC-3 went from one to seven, some incidents never showed it, and a few showed it less after the rewrite.\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1150/1168;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1791829424471_ellxiftn0zo_image_c62ff701ae.png\" width=\"1150\" height=\"1168\"\u003e\u003cfigcaption\u003e\u003ci\u003eFigure 12. Challenge rate before and after Prompt Sweep, per challenge and judge. Each judge is compared only with itself.\u0026nbsp;\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1142/792;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1791829509687_uzmh1wqtifn_image_e8ee9d6ff1.png\" width=\"1142\" height=\"792\"\u003e\u003cfigcaption\u003e\u003ci\u003eFigure 13. Original requests, the sentence Prompt Sweep added, and how many of ten fresh runs showed the challenge.\u0026nbsp;\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003eThree things follow. First, the outcome checks of Section 4.3 found the centralized application clean on its single incident ticket, while here its process was not: a correct result can hide an unsound process. Second, a fixed test set is a small sample of what users will actually write, and a single sentence about blast radius was enough to turn a latent weakness into a failure. Searching the space of requests before release finds those sentences before users do; in production nobody controls them, so the weakness has to be caught when it fires. Third, the judges disagreed by an order of magnitude on the same runs (CC-3 at 0.8% for one judge and 15.6% for the other). Any detector built on a model needs calibrating against labelled cases before its alarm rate says anything about the system rather than the detector.\u0026nbsp;\u003c/p\u003e\u003ch3\u003e4.6 The same faults under four ways of organizing the agents\u003c/h3\u003e\u003cp\u003eThe overlay study compared two topologies. To see how far the pattern itself matters, we ran one SRE-triage application under four collaboration patterns, described in Section 5, and injected eight faults as a short paragraph appended to the agents' instructions: a false ownership signal, conflicting priorities, hidden evidence, a wrong objective, a requirement easy to under-read, withheld context, a knowledge gap, and a mismatch of meaning. Each configuration ran once on each of 25 incidents with a known right answer (the service, the action and, for a rollback, the version), and again five times on each of the five incidents the unmodified application handled best, giving two sets of 25 runs per configuration. All agents ran Gemini 2.5 Flash at a temperature of 0.1.\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1800/840;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1791834569744_f3pl8rewro7_fault_injection_heatmap_bafe6e52c0.png\" width=\"1800\" height=\"840\"\u003e\u003cfigcaption\u003e\u003ci\u003eFigure 14: Change against the baseline for each fault and pattern, in percentage points. Left: fully correct runs. Right: runs in which the verifier was consulted.\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003eTwo faults did most of the damage. Incompatible goals (CR-1) cut fully correct runs to 4% under the centralized moderator and to none under the hybrid moderator, from 32% and 20%. A requirement softened into advice (DC-2) cut them to 4% and 8%.\u003c/p\u003e\u003cp\u003eHow the damage surfaced was more revealing than how large it was. Under the centralized and hybrid moderators the verifier kept being consulted, as often as without faults or more: in 80% and 90% of runs on average under faults, against 68% and 84% without. Under incompatible goals the centralized moderator consulted it in 80% of runs and was right in 4%; the hybrid consulted it in 92% and was right in none. The check ran; it did not catch. The application's original moderator, which consults each specialist once in a fixed order and hands the verifier every specialist's full evidence, failed differently: under incompatible goals it consulted the verifier in only 12% of runs, against 92% normally. The same fault produced a check that ran without effect under one moderator and a check that was skipped under another.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eThis experiment and the overlay study agree that incompatible goals are among the most damaging challenges, and they disagree on others. Written as a hand-crafted overlay that removes the evidence requirement, the evidence challenge broke verification in every run; written as a short paragraph about missing evidence, it took 12 points off correctness. How a flaw is written changed what it cost.\u003c/p\u003e\u003cp\u003eFor anyone running such a system, the practical reading is direct. A verifier that is consulted is not a verifier that works: consultation stayed high, and even rose, while correctness fell. Whether a check can catch anything depends on what reaches it and on whether its verdict binds the action, and both have to be visible in the record. And monitoring has to follow the pattern: a moderator that skips its check fails differently from one that runs it without effect.\u003c/p\u003e\u003ch2\u003e5. Collaboration patterns: no magic recipe\u003c/h2\u003e\u003cp\u003eA common expectation is that the way agents are organized takes care of reliability: a moderator keeps the work coherent, a shared channel lets agents correct one another, a stronger model sorts the rest out. We held those expectations against what happened in our runs.\u003c/p\u003e\u003ch4\u003e5.1 Four ways to organize the same team\u003c/h4\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1870/663;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1791834739107_rd8czad49rb_collab_patterns_939b2fff81.png\" width=\"1870\" height=\"663\"\u003e\u003cfigcaption\u003eFigure 15: The four patterns. Teal marks what distinguishes them: a moderator that decides, or specialists that exchange answers. In every pattern the backend and database specialists also hold the action tool; in the staged debate, with no moderator, they are the ones who act.\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003eThe four patterns follow the designs compared by Kim et al. (2025), with everything else held fixed: the incident, the specialists (telemetry, backend, database, comms, verifier), the model and the tools. In the application as first built, a sequential moderator consults each specialist once in a fixed order and hands all their evidence to the verifier before acting. A centralized moderator delegates freely and in parallel, decides when it has heard enough, and acts after approval; specialists see only what it passes on. A staged debate has no moderator: specialists answer independently, then each reads every other answer and revises, as in Du et al. (2023); the backend and database specialists can apply a fix themselves, and the most common reply is returned. A hybrid moderator is the centralized one, with every specialist's raw output fed back to it after each round.\u003c/p\u003e\u003ch3\u003e5.2 What a moderator did, and did not, do\u003c/h3\u003e\u003cp\u003eWith nothing injected, fully correct runs were 32% with the centralized moderator, 32% in debate, 36% with the sequential moderator and 20% with the hybrid. In Prompt Sweep, where every request passes through a moderator, the moderator's own failures to reconcile and to commit appeared in up to 18.5% of untouched runs. We also built a separate corpus with the Agent Scaling framework of Kim et al.: 180 runs on six public benchmarks (web research, financial analysis, planning, software repair, shell tasks and business-tool workflows), three successful and three failed runs per benchmark for each of five ways of organizing the agents, from a single agent to fully decentralized peers, each run labelled for cognitive failures from its messages and tool calls. In that corpus, the earliest failure in 28 of 36 centralized runs was a poor split of the work, a step the moderator owns. What the moderator did buy was cleaner clean runs: in the overlay study, on its single incident ticket, the centralized baseline had no failures on the two outcome questions, while the debate baseline acted before approval in 8% of runs and never converged in another 8%. A moderator gave the system a place where a decision is made. It did not keep the failures out, and the steps it owns, dividing the work and reconciling the results, were where several of them began.\u003c/p\u003e\u003ch3\u003e5.3 A central view is not a working check\u003c/h3\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1632/612;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1791834862916_prb4hxg1e9_gate_vs_correctness_8d1e291a24.png\" width=\"1632\" height=\"612\"\u003e\u003cfigcaption\u003e\u003ci\u003eFigure 16: How often the verifier was consulted, against how often the run was actually correct, at baseline and under faults, on all 25 incidents and on the five best-handled ones.\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003eUnder the centralized and hybrid moderators, the verifier was consulted in 68% and 84% of clean runs and in 80% and 90% of runs under faults: faults made the moderators check more, not better. With incompatible goals, the centralized moderator consulted the verifier in 80% of runs and was right in 4%; the hybrid consulted it in 92% and was right in none. The moderator had the whole picture and a verifier to ask, and neither turned into a working check. A central view helps only when the rules make the right information reach the check and make its verdict bind what happens next.\u003c/p\u003e\u003ch3\u003e5.4 The same challenge wears a different symptom\u003c/h3\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1368/748;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1791834941403_phr39xuy1zr_symptom_by_pattern_7b1c2f9007.png\" width=\"1368\" height=\"748\"\u003e\u003cfigcaption\u003e\u003ci\u003eFigure 17: Outcome failures per challenge in the centralized and debate SRE triage, 25 runs each. The debate variant includes two overlays added since publication, for missing ownership (CC-1) and the softened requirement (DC-2).\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003eSince publication we added two overlays to the debate variant of the overlay study: missing ownership, where every agent may apply the fix and none owns it, and the softened requirement, where the verifier's \"we should probably wait before taking action\" reaches the backend as advice. With them, the same challenge can be compared directly across the two topologies, and it left a different trace depending on who was in charge. A requirement softened into advice made the centralized verifier skip evidence in 28% of runs, while in debate it made the backend apply the fix before approval in 92%. Missing ownership changed nothing on these questions when a moderator assigned the work; in debate, nobody applied the fix in any run. A mismatch of meaning left the centralized outcome clean and stopped agreement in 40% of debate runs. Only stripped evidence looked the same everywhere, with verification failing in every run. The two systems we studied in the wild had different profiles too: ChatDev's findings were dominated by verification and shared-task failures, the debate's by confident claims without knowledge and by herding. A symptom did not point to its cause, and an alarm tuned to one pattern's symptom would have missed the same defect in another.\u003c/p\u003e\u003ch3\u003e5.5 A shared channel buys agreement, not correctness\u003c/h3\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:1481/730;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1791835008378_fylr1uaxja_debate_dynamics_cef26b637e.png\" width=\"1481\" height=\"730\"\u003e\u003cfigcaption\u003e\u003ci\u003eFigure 18: The 880 debates of Section 2.2, round by round. Left: accuracy of each agent and of the group's majority. Right: how the debates stood after each round.\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003eThe debate of Section 2.2 seated five different models at the table, GPT-4o, Gemini 2.5 Flash and Pro, Claude Sonnet 4.6 and Opus 4.6, and recorded every round. Exchange helped the weakest agent most, taking GPT-4o from 58% to 85% correct, and left the strongest flat, with Claude Opus 4.6 at 88% throughout. Agreement rose from 54% of debates after the independent round to 82%, 91% and finally 94%. The group's majority answer was as accurate at the end as at the start, 88% then 87%, and the share of debates ending in unanimous agreement on a wrong answer grew from 2.5% to 10.2%. In the SRE debate pattern, the exchange kept more runs correct under faults than any moderated pattern, 39.5% against 21% to 23%. In the Agent Scaling corpus, peers sharing a channel acted on stale observations, repeated a change, or lost a complementary finding while agreeing. The channel turned disagreement into agreement rather than into correctness, and it carried a wrong or outdated claim to every agent as efficiently as a right one.\u003c/p\u003e\u003ch3\u003e5.6 The rules mattered more than the shape\u003c/h3\u003e\u003cp\u003eWhen claims no longer had to carry evidence, verification failed in every run, in both topologies. When the rule that execution waits for approval was never stated, the moderated system never applied the fix correctly and the debate acted before approval in 72% of runs. In SRE triage no agent is scored on the final answer: each specialist holds its own telemetry, logs or database state, and it is the protocol that lets a specialist with contrary data stop a false finding. Agents that are simply asked to solve the problem do the opposite. In the debate, half of all findings were confident claims made without the knowledge to back them.\u003c/p\u003e\u003cp\u003eWe also tried adding rules. In the Agent Scaling corpus, we reran the 108 runs of the centralized, hybrid and decentralized teams, each matched to its original task, with a small protocol added: for a lead agent, a ledger of requirements, owners and completion checks accepted only against evidence; for peers, a temporary owner for each change and an independent check of its result. Success rose from 50% to 63%, with 18 failures rescued and four successes lost. The lead-agent version went from 18 to 24 successes out of 36 without a single regression. On short shell tasks the extra check only delayed valid actions and cost two successes, so a protocol has a price where there is little evidence to reconcile.\u003c/p\u003e\u003cfigure class=\"image\"\u003e\u003cimg style=\"aspect-ratio:2468/878;\" src=\"https://outshift-headless-cms-s3.s3.us-east-2.amazonaws.com/blog/cognitive-challenges-in-multi-agent-systems/1791835085834_lxpcyo361dj_coordination_layer_outcomes_5dc35de79e.png\" width=\"2468\" height=\"878\"\u003e\u003cfigcaption\u003e\u003ci\u003eFigure 19: Success before and after the added protocol, per pattern and per domain.\u003c/i\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u0
